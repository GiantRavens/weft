# Illustrations for each work: public-domain images from Wikimedia Commons, resized.
# The build embeds them so each page stays a single file. Captions are Weft's. License and source
# come from each file's Commons record; credit and date were normalized by hand from it.
homer-odyssey:
  image: art/works/homer-odyssey.jpg
  thumb: art/works/thumb/homer-odyssey.jpg
  caption: Odysseus bound to the mast while the Sirens sing. Attic red-figure stamnos by the Siren Painter, about 480–470 BC, from Vulci; British Museum E440.
  alt: Red-figure vase painting of Odysseus tied to a ship's mast, with bird-bodied Sirens around the ship
  credit: Siren Painter
  date: about 480–470 BC
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Odysseus_Sirens_BM_E440_n2.jpg
  commons_file: File:Odysseus Sirens BM E440 n2.jpg
tanakh-genesis:
  image: art/works/tanakh-genesis.jpg
  thumb: art/works/thumb/tanakh-genesis.jpg
  caption: A carpet page of the Leningrad Codex (1008), the oldest complete manuscript of the Hebrew Bible and the source of this edition's text.
  alt: Decorated manuscript page with a gold six-pointed star pattern framed by Hebrew micrography
  credit: Unknown scribe; scan by USC Dornsife
  date: '1008'
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Leningrad_Codex_Carpet_Page_closeup.jpg
  commons_file: File:Leningrad Codex Carpet Page closeup.jpg
ovid-metamorphoses:
  image: art/works/ovid-metamorphoses.jpg
  thumb: art/works/thumb/ovid-metamorphoses.jpg
  caption: 'The untangling of Chaos: book 1, plate 1 of an engraved Metamorphoses published in 1589 after Hendrick Goltzius, showing the passage in this edition.'
  alt: Engraving of a god separating the elements of Chaos among clouds
  credit: After Hendrick Goltzius
  date: '1589'
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:The_Untangling_of_Chaos,_or_the_Creation_of_the_Four_Elements_LACMA_54.70.1a.jpg
  commons_file: File:The Untangling of Chaos, or the Creation of the Four Elements LACMA 54.70.1a.jpg
nt-john:
  image: art/works/nt-john.jpg
  thumb: art/works/thumb/nt-john.jpg
  caption: A page of Papyrus 66, a copy of John's Gospel made around 200, one of the oldest substantial New Testament manuscripts; Bodmer Papyri.
  alt: Papyrus page densely written in Greek capital letters
  credit: Unknown scribe
  date: about 200
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Papyrus66.jpg
  commons_file: File:Papyrus66.jpg
runes:
  image: art/works/runes.jpg
  thumb: art/works/thumb/runes.jpg
  caption: The Kylver stone, Gotland, about 400, carved with the complete futhark; Swedish History Museum.
  alt: Grey limestone slab with a line of runes carved along its upper edge
  credit: Photograph, unknown
  date: before 1934
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Kylverstenen_2.jpg
  commons_file: File:Kylverstenen 2.jpg
libai-jingyesi:
  image: art/works/libai-jingyesi.jpg
  thumb: art/works/thumb/libai-jingyesi.jpg
  caption: Li Bai Strolling, ink on paper by Liang Kai, 13th century; Tokyo National Museum.
  alt: Ink painting of a robed figure walking, drawn in a few loose strokes
  credit: Liang Kai
  date: 13th century
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Liang_Kai_-_Li_Bai_Strolling.jpg
  commons_file: File:Liang Kai - Li Bai Strolling.jpg
beowulf:
  image: art/works/beowulf.jpg
  thumb: art/works/thumb/beowulf.jpg
  caption: The first page of Beowulf, beginning HWÆT, in the only surviving manuscript, copied around 975–1025; British Library, Cotton MS Vitellius A XV, folio 132r.
  alt: Manuscript page in Old English script beginning with large letters HWÆT
  credit: Unknown scribes
  date: about 975–1025
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Beowulf_Cotton_MS_Vitellius_A_XV_f._132r_(cropped).jpg
  commons_file: File:Beowulf Cotton MS Vitellius A XV f. 132r (cropped).jpg
edda-havamal:
  image: art/works/edda-havamal.jpg
  thumb: art/works/thumb/edda-havamal.jpg
  caption: Odin as a wanderer, the god to whom Hávamál's sayings are attributed. Painting by Georg von Rosen, 1886.
  alt: Painting of a bearded old man in a broad hat holding a staff
  credit: Georg von Rosen
  date: '1886'
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Georg_von_Rosen_-_Oden_som_vandringsman,_1886_(Odin,_the_Wanderer).jpg
  commons_file: File:Georg von Rosen - Oden som vandringsman, 1886 (Odin, the Wanderer).jpg
magna-carta:
  image: art/works/magna-carta.jpg
  thumb: art/works/thumb/magna-carta.jpg
  caption: One of four surviving exemplars of the 1215 charter, written in Latin on parchment; British Library, Cotton MS Augustus II.106.
  alt: Parchment sheet covered in dense medieval Latin script
  credit: Unknown scribe
  date: '1215'
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Magna_Carta_(British_Library_Cotton_MS_Augustus_II.106).jpg
  commons_file: File:Magna Carta (British Library Cotton MS Augustus II.106).jpg
saga-grettir:
  image: art/works/saga-grettir.jpg
  thumb: art/works/thumb/saga-grettir.jpg
  caption: Grettir, armed and ready to fight, in a 17th-century Icelandic manuscript (AM 426 fol.); Árni Magnússon Institute.
  alt: Coloured drawing of a stout warrior in a red coat holding a sword and shield
  credit: Unknown Icelandic artist
  date: 17th century
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:AM426_Grettir.jpg
  commons_file: File:AM426 Grettir.jpg
science-latin:
  image: art/works/science-latin.jpg
  thumb: art/works/thumb/science-latin.jpg
  caption: Title page of the first edition of Newton's Principia, London, 1687, with the imprimatur of Samuel Pepys as President of the Royal Society.
  alt: Printed title page reading Philosophiae Naturalis Principia Mathematica
  credit: Printed by Joseph Streater, London
  date: '1687'
  license: Public domain
  source: https://commons.wikimedia.org/wiki/File:Newton_-_Principia_(1687),_title,_p._5,_cropped.jpg
  commons_file: File:Newton - Principia (1687), title, p. 5, cropped.jpg
basho-furuike:
  image: art/works/basho-furuike.jpg
  thumb: art/works/thumb/basho-furuike.jpg
  caption: Portrait of Bashō by Yosa Buson, painted in the 18th century, decades after the poet's death in 1694.
  alt: Painting of a seated elderly man in a cap and robe, with calligraphy above
  credit: Yosa Buson
  date: 18th century
  license: Public domain
