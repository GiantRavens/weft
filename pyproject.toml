[project]
name = "weft"
version = "0.1.0"
description = "Living interlinear editions of classical texts"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
license = "MIT"

[project.scripts]
weft = "weft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/weft"]
