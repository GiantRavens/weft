[project]
name = "weft"
version = "0.1.0"
description = "Living interlinear editions of classical texts"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "latex2mathml>=3.77"]   # latex2mathml: display equations in a weft-edition (Einstein)
license = "MIT"

[project.optional-dependencies]
previews = ["playwright>=1.45"]
images = ["pillow>=10"]

[project.scripts]
weft = "weft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/weft"]
