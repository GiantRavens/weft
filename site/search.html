<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Search · Weft</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e6;--ink:#221d16;--soft:#5d5446;--rule:#ddd3c0;--accent:#9a3b1f;--mark:#f0d9a8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--ink:#ece4d2;--soft:#b9ad96;--rule:#342f26;--accent:#e08a5f;--mark:#5a4320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15130f;--ink:#ece4d2;--soft:#b9ad96;--rule:#342f26;--accent:#e08a5f;--mark:#5a4320;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:1.05rem/1.55 "Gentium Book Plus",Palatino,serif}
main{max-width:820px;margin:0 auto;padding:40px 16px 80px}
.lockup{display:block;width:150px;color:var(--ink);margin:0 0 14px}.lockup svg{width:100%;height:auto}
.docnav{font:600 .78rem/1.4 Inter,system-ui,sans-serif;letter-spacing:.04em;color:var(--soft);margin:0 0 22px}
.docnav a{color:var(--accent);text-decoration:none}.docnav a:hover{text-decoration:underline}.docnav span{color:var(--ink)}
h1{font-size:2rem;margin:.2rem 0 .8rem}
#q{width:100%;box-sizing:border-box;font:1.15rem/1.4 "Gentium Book Plus",Palatino,serif;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:transparent;color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
#count{font:.8rem/1.4 Inter,system-ui,sans-serif;color:var(--soft);margin:.6rem 0 0}
h2{font:600 .75rem/1 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:2.2rem 0 .7rem;padding-top:.9rem;border-top:1px solid var(--rule);display:flex;gap:12px;align-items:baseline}
h2 .n,h3 .n,.word .n{letter-spacing:.02em;text-transform:none;font:400 .78rem/1.3 Inter,system-ui,sans-serif;color:var(--soft)}
ul{list-style:none;padding:0;margin:0}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.works li{padding:10px 0;border-bottom:1px solid var(--rule)}.works .wt{font-size:1.2rem;font-weight:700;margin-right:10px}
.works .meta,.works .subj{display:block;font:.8rem/1.45 Inter,system-ui,sans-serif;color:var(--soft)}.works .subj{color:var(--accent)}
.works .sum{margin:.3rem 0 0;font-size:.95rem;color:var(--soft)}
.word li{display:grid;grid-template-columns:9rem minmax(6rem,auto) 1fr auto;gap:4px 14px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--rule)}
.word .lang{font:600 .7rem/1.3 Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.word .lemma{font-size:1.15rem}.word .gl{font-style:italic;color:var(--soft)}
.hitwork{margin:0 0 1.2rem}.hitwork h3{font-size:1.1rem;margin:0 0 .3rem;display:flex;gap:10px;align-items:baseline}
.hitwork li{padding:4px 0 4px 12px;border-left:2px solid var(--rule);margin:0 0 6px}
.hitwork .at{display:block;font:600 .7rem/1.3 Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.snip{font-size:.97rem}.none{color:var(--soft)}
@media (max-width:560px){.word li{grid-template-columns:1fr auto}.word .lang{grid-column:1/-1}.word .gl{grid-column:1/-1}}
@media print{.docnav,#form{display:none}}
</style></head><body><main><a class="lockup" href="index.html" aria-label="Weft library">{{LOCKUP}}</a>{{NAV}}
<h1>Search the library</h1>
<form id="form" role="search"><input id="q" type="search" name="q" autocomplete="off" spellcheck="false" autofocus
  placeholder="god, θεός, saga, fable, pope, Zanzibar" aria-label="Search the library"></form>
<p id="count" aria-live="polite"></p>
<div id="results"></div>
</main>
<script src="search-index.js"></script>
<script>/*{{SEARCHJS}}*/</script>
</body></html>
