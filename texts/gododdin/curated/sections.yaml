    god.1.3.2: {lemma: "mwth", morph: "ADJ", gloss: "swift"}   # mwth
    god.1.3.3: {lemma: "myngfras", morph: "ADJ", gloss: "thick-maned"}   # mẏngvras
    # god.1.4: a dan is the compound preposition 'under' (GPC tan, y dan, a dan). megyr is obscure: Evans 'illustrious'; later editors write megyrwas as one compound, 'fine (or slender) youth'
    god.1.4.1: {lemma: "a", morph: "ADP", gloss: "beneath"}   # A
    god.1.4.2: {lemma: "tan", morph: "ADP", gloss: "under"}   # dan
    god.1.4.3: {lemma: "morddwyd", morph: "NOUN|Gender=Fem|Number=Sing", gloss: "the-thigh"}   # vordwẏt
    god.1.4.4: {lemma: "megyr", morph: "ADJ", gloss: "of-a-fine"}   # megẏr
    god.1.4.5: {lemma: "gwas", morph: "NOUN|Gender=Masc|Number=Sing", gloss: "youth"}   # was
    god.1.5.1: {lemma: "ysgwyd", morph: "NOUN|Gender=Fem|Number=Sing", gloss: "a-shield"}   # Ysgwẏt
