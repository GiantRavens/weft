# Human overlay, written in the compact spec and expanded by weft overlay.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-31"
  why: "all four stanzas (I, VIII, X and the Arthur stanza). Hand lemma, morphology and gloss; no treebank exists for Middle Welsh verse. Lemmas are the headwords of Geiriadur Prifysgol Cymru (GPC) in modern spelling, verbs under the verbal noun, mutated forms under the radical. The glosses follow Evans's 1868 translation where it reads the Welsh plausibly and the modern editors (Ifor Williams, Canu Aneirin; Jarman; Koch) where it does not. The poem's vocabulary is old and many readings are disputed; the lines with a note carry a reading a reviewer should check first. The readings attributed in the notes to Williams, Jarman or Koch were given from the annotator's knowledge of those editions, not checked against them; each attribution is to be verified"
  status: "draft"
  set:
    # god.1.1: oed read as the noun 'age' (a man's mettle, a youth's years), with Williams, Jarman and Koch; Evans took it as the verb 'was' ('of manly disposition was the youth'), and the edition's n 'oedd' follows Evans
    god.1.1.1: {lemma: "greddf", morph: "NOUN|Gender=Fem|Number=Sing", gloss: "mettle"}   # Gredyf
    god.1.1.2: {lemma: "gŵr", morph: "NOUN|Gender=Masc|Number=Sing", gloss: "of-a-man"}   # gwr
    god.1.1.3: {lemma: "oed", morph: "NOUN|Gender=Masc|Number=Sing", gloss: "age"}   # oed
    god.1.1.4: {lemma: "gwas", morph: "NOUN|Gender=Masc|Number=Sing", gloss: "of-a-youth"}   # gwas
    god.1.2.1: {lemma: "gwrhyd", morph: "NOUN|Gender=Masc|Number=Sing", gloss: "valour"}   # Gwrhẏt
    god.1.2.2: {lemma: "am", morph: "ADP", gloss: "in"}   # am
    god.1.2.3: {lemma: "dias", morph: "NOUN|Number=Sing", gloss: "the-tumult"}   # dias
