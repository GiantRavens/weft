# Weft edition of four stanzas of Y Gododdin, in the text of W. F. Skene, The Four Ancient Books of
# Wales (Edinburgh, 1868), vol. 2, pp. 62-65 and 106, transcribed from the Book of Aneirin (Cardiff
# MS 2.81, now in the National Library of Wales). Each line is checked against the Internet Archive OCR of the University of
# Toronto copy (pinned in the manifest).
#
# The OCR cannot read Skene's dotted ẏ, which he prints for the manuscript's dotted y; the check folds
# ẏ to y (verify_fold). Where the OCR misreads a letter, verify_corrections gives the printed reading,
# each settled on the page image (archive.org leaf n81, n84, n85, n86 and n127). Skene's decorated and
# capital initials (GREDYF, GWYR) are written in ordinary capitals and small letters.
#
# Stanzas I, VIII and X are from the main text, in the later of the manuscript's two spellings; the
# Arthur stanza is from the second series, in the older spelling (gu for gw, i for y, u for w).
#
#   t        the word as Skene prints it, punctuation attached
#   n        Weft's normalized spelling in modern Welsh letters, from which the sound is read
#            (pipeline/weft/welsh.py): dd, f, ff, w, the mutations written out; the medieval form of
#            the word is kept (frein, brein, not brain; neithiawr), and the nasal mutation after yng is
#            written out (yng ngwryawr) though the print does not show it. Draft, Weft's own.
work: gododdin
joiner: ' '
verify_in: sources/skene1868-v2.txt
verify_fold: {ẏ: y}
verify_corrections:
- {ocr: '^►^EEDYF', print: Gredyf}
- {ocr: Gwrliyt, print: Gwrhyt}
- {ocr: At bedrein, print: Ar bedrein}
- {ocr: '^ogyt', print: Nogyt}
- {ocr: kyneillt ewein, print: kyueillt ewein}
- {ocr: vreiii, print: vrein}
- {ocr: '^S> WYE a aeth gatraeth oed', print: Gwyr a aeth gatraeth oed}
- {ocr: '^SfWYE a aeth gatraeth gan wawr', print: Gwyr a aeth gatraeth gan wawr}
- {ocr: en bed eu hovnawr, print: en hed eu hovnawr}
- {ocr: tbrycbant, print: thrychant}
- {ocr: Eac gosgord, print: Rac gosgord}
- {ocr: Eug ciuin, print: Rug ciuin}
- {ocr: guemor, print: guernor}
