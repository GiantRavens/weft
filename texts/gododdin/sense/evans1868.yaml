# D. Silvan Evans's translation, in W. F. Skene, The Four Ancient Books of Wales (1868), vol. 1, 'The
# Gododin Poems': stanzas I, VIII and X on pp. 374-377, and stanza XXXIII of the second series on p. 426.
# Transcribed from the page images (archive.org fourancientbooks01skenuoft, leaf n395, n397, n398, n447),
# of which the pinned OCR is the witness; the OCR's misreadings (the drop initial of 'Of', 'youtli') are
# corrected, the spaces the print sets before ; : ! are closed, and a line the print wraps is one line.
# Evans translates line for line, so each span is one line. He reads Skene's 'cein' in the Arthur stanza
# as 'beautiful'; see the note on god.b33.6.
translation: evans1868
aligned_by: hand, phase 0; one span per line, as Evans divides it
spans:
