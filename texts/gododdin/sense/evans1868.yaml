- lines:
  - god.1.17
  - god.1.17
  text: Thou beloved friend of Owain!
- lines:
  - god.1.18
  - god.1.18
  text: Wrong it is that he should be under ravens.
- lines:
  - god.1.19
  - god.1.19
  text: It is evident in what region
- lines:
  - god.1.20
  - god.1.20
  text: The only son of Marro was killed.
- lines:
  - god.8.1
  - god.8.1
  text: The men went to Catraeth, loquacious was their host;
- lines:
  - god.8.2
  - god.8.2
  text: Fresh mead was their feast, and also their poison.
- lines:
  - god.8.3
  - god.8.3
  text: Three hundred were contending with weapons;
- lines:
  - god.8.4
  - god.8.4
  text: And after sportive mirth, stillness ensued!
- lines:
  - god.8.5
  - god.8.5
  text: Though they went to churches to do penance,
- lines:
  - god.8.6
  - god.8.6
  text: The inevitable strife of death was to pierce them.
- lines:
  - god.10.1
  - god.10.1
  text: The men went to Catraeth with the dawn;
- lines:
  - god.10.2
  - god.10.2
  text: They dealt peaceably with those who feared them.
- lines:
  - god.10.3
  - god.10.3
  text: A hundred thousand and three hundred engaged in mutual overthrow.
- lines:
  - god.10.4
  - god.10.4
  text: Drenched in gore they served as butts for lances;
- lines:
