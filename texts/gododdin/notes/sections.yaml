# Notes for Y Gododdin, stanzas I, VIII, X and the Arthur stanza.
- id: n.god.poem
  attach: god.8.1
  kind: editorial
  status: draft
  text: "Y Gododdin is a series of elegies for the warriors of the Gododdin, the Britons of what is now south-east Scotland and Northumberland, the Votadini of Roman times. By the conventional reading, their lord Mynyddog Mwynfawr feasted a picked war-band for a year at Din Eidyn (Edinburgh) and sent it against the Angles of Deira and Bernicia at Catraeth, usually identified with Catterick in North Yorkshire, around 600. Nearly all were killed. The poem names about 80 of them. It is not a narrative: each stanza praises the host or one man."
- id: n.god.manuscript
  attach: god.1.1
  kind: editorial
  status: draft
  text: "The poem survives only in the Book of Aneirin, written in Wales about 1265 and now in the National Library of Wales (Cardiff MS 2.81). Two scribes copied it, and part of the second scribe's text keeps an older spelling, usually dated to the 9th or 10th century, which shows that the 13th-century copy descends from an Old Welsh exemplar. The date of composition is disputed: soon after the battle on one view (before 638, when the fall of Din Eidyn is recorded), centuries later on another."
- id: n.god.st1
  attach: god.1.20
  kind: editorial
  status: draft
  text: "Stanza I, the best known, mourns a single youth, the 'beloved friend of Owain' and the only son of Marro, sooner to the bier than to his wedding. It names neither the Gododdin nor Catraeth, and most scholars take it as a later addition, because one of its rhymes would not have been possible in the earliest Welsh. A. O. H. Jarman (1988) emends the manuscript's dan vrein 'under ravens' in line 18 to dan vein 'under stones', a cairn."
- id: n.god.mead
  attach: god.8.2
  kind: editorial
  status: draft
  text: "Glasved eu hancwyn a gwenwyn vu: 'fresh mead was their feast, and it was poison'. The mead is the payment the war-band took from Mynyddog, and the poem returns to it often: the warriors repaid their year of feasting with their lives. In Skene's numbering, stanzas VIII to XII begin with the same words, Gwyr a aeth Gatraeth, 'men went to Catraeth', each continuing differently, and XIII and XIV with the singular, Gwr a aeth Gatraeth, 'a man went to Catraeth'."
- id: n.god.arthur
  attach: god.b33.6
  kind: editorial
  status: draft
  text: "The stanza praises Gwawrddur, who fed black ravens on the rampart of a fortress, ceni bei ef Arthur: 'though he was not Arthur'. If it belongs to the original poem, it is among the earliest references to Arthur, named as the standard of a warrior's bravery. Jarman lists the stanza as a possible interpolation; John Koch (1997) argues that it is archaic, before 638, and the rhyme shows that the name Arthur belongs to the line. Skene's text prints cein where modern editors read ceni, so Evans in 1868 translated 'the beautiful Caer. He was an Arthur'. Skene's guernor guaur in the last line is read by modern editors as the hero's name, Gwawrddur."
- id: n.god.spelling
  attach: god.b33.1
  kind: editorial
  status: draft
  text: "This stanza is in the older spelling of the manuscript's second series: gu for gw (guant, guiu), i for y, u for f and w, d for dd. Stanzas I, VIII and X are in the later 13th-century spelling, with its dotted ẏ. The row of normalized spelling writes both in modern Welsh letters, so the same word is spelled the same way."
