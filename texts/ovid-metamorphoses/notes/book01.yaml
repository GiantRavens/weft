# Notes for Metamorphoses book 1. See texts/homer-odyssey/notes for the format.
- id: n.met.1.1.innova
  attach: met.1.1.1
  kind: editorial
  status: draft
  text: "Read alone, the first line says 'my mind carries me into new things'. The next word, corpora, 'bodies', shows that the sentence is about forms changed into new bodies. Commentators note that the opening line itself changes meaning as it is read."
- id: n.met.1.2.illas
  attach: met.1.2.8
  kind: editorial
  status: draft
  text: "Editions divide here. This text prints illas, 'those' forms. Several modern editions print illa, 'those things', taking it to mean Ovid's own undertakings: the gods changed his poetry too."
- id: n.met.1.3.que
  attach: met.1.3.3
  kind: editorial
  status: draft
  text: "-que, 'and', is written onto the end of the word it adds. The stress moves to the syllable just before it: PREE-maa alone, pree-MAA-kwe with -que."
- id: n.met.1.4.deducite
  attach: met.1.4.4
  kind: editorial
  status: draft
  text: "Deducere is the spinner's verb: to draw a thread down from the distaff. Ovid asks the gods to spin his song as one unbroken thread, from the world's first origin down to his own day. Roman poets used carmen deductum, a finely spun song, for carefully made verse; Virgil uses the phrase in Eclogue 6."
- id: n.met.1.7.chaos
  attach: met.1.7.3
  kind: editorial
  status: draft
  text: "A Greek word, χάος, 'yawning gap', related to χαίνω, 'gape'. In Hesiod's Theogony, Chaos is the first thing that came to be. Ovid keeps the Greek ending -os."
- id: n.met.1.1.golding
  attach: met.1.1
  kind: editorial
  status: draft
  text: "Arthur Golding's 1567 translation was the Ovid Shakespeare read. Prospero's farewell to his magic in The Tempest follows Golding's version of Medea's incantation in book 7 closely."
