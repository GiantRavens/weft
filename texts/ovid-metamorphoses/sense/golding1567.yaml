# Arthur Golding (1567), verbatim from sources/perseus-eng4.xml, book 1 lines 1-9.
# Golding's fourteeners track Ovid almost line for line.
translation: golding1567
aligned_by: hand, phase 0
spans:
  - lines: [met.1.1, met.1.2]
    text: |-
      Of shapes transformde to bodies straunge, I purpose to entreate,
      Ye gods vouchsafe (for you are they ywrought this wondrous feate)
  - lines: [met.1.3, met.1.4]
    text: |-
      To further this mine enterprise. And from the world begunne,
      Graunt that my verse may to my time, his course directly runne.
  - lines: [met.1.5, met.1.5]
    text: "Before the Sea and Lande were made, and Heaven that all doth hide,"
  - lines: [met.1.6, met.1.6]
    text: "In all the worlde one onely face of nature did abide,"
  - lines: [met.1.7, met.1.7]
    text: "Which Chaos hight, a huge rude heape, and nothing else but even"
  - lines: [met.1.8, met.1.8]
    text: "A heavie lump and clottred clod of seedes togither driven,"
  - lines: [met.1.9, met.1.9]
    text: "Of things at strife among themselves, for want of order due."
