# Human overlay for Deuteronomy 6:4-9, the first paragraph of the Shema. Lemma and morphology come from the
# OSHB; this file adds glosses. Grammar rides in the English: and-you-shall-love (the converted perfect,
# וְ + perfect, read as a future command), our-God (pronoun suffix), to-your-sons (lamed + suffix).
# The divine name is glossed LORD, as the Jewish and English Bibles render the word read in its place.
- by: Claude (Weft phase 0), for review by Skip and a scholar
  date: 2026-10-10
  why: hand gloss; Strong's gives a sense per lemma, not per verse
  status: draft
  set:
    deut.6.4.1: {gloss: "hear"}   # שְׁמַע
    deut.6.4.2: {gloss: "Israel"}   # יִשְׂרָאֵל
    deut.6.4.3: {gloss: "LORD"}   # יְהוָה
    deut.6.4.4: {gloss: "our-God"}   # אֱלֹהֵינוּ
    deut.6.4.5: {gloss: "LORD"}   # יְהוָה
    deut.6.4.6: {gloss: "one"}   # אֶחָד
    deut.6.5.1: {gloss: "and-you-shall-love"}   # וְאָהַבְתָּ
