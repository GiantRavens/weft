# Notes on Deuteronomy 6:4-9, the first paragraph of the Shema.
- id: n.deut.6.4.shema
  attach: deut.6.4
  kind: editorial
  status: draft
  leans_on: Mishnah Berakhot 1-2 (the recitation morning and evening); the Masoretic text
  text: "Šəmaʿ, 'hear', the first word, gives the passage its name. The Mishnah, compiled about AD 200, already treats its recitation at evening and morning as a duty and argues over the hours. In the liturgy this paragraph is followed by Deuteronomy 11:13-21 and Numbers 15:37-41; together they are the Shema. This work gives the first paragraph."
- id: n.deut.6.4.large
  attach: deut.6.4.1
  kind: editorial
  status: draft
  leans_on: the Leningrad Codex as encoded in the OSHB (seg type x-large); Torah scribal practice
  text: "The last letter of šəmaʿ (ע) and of ʾeḥāḏ (ד) are marked as large letters in the Leningrad text as the OSHB encodes it, and are written large in Torah scrolls. Read together the two letters spell ʿēḏ, 'witness'. A common explanation is that the large dalet keeps ʾeḥāḏ, 'one', from being misread as ʾaḥēr, 'other', whose final letter differs from dalet by one small stroke. The page sets them in ordinary type; the large letters are a feature of the manuscript, not of the sound."
- id: n.deut.6.4.name
  attach: deut.6.4.3
  kind: editorial
  status: draft
  leans_on: the Masoretic qere perpetuum; Gesenius' Hebrew Grammar §17c and §102m
  text: "The divine name is written with four consonants, YHWH, and the vowels of another word. The Masoretes did not pronounce the name; they pointed it with the vowels of ʾăḏōnāy, 'my Lord', the word read in its place, without a note in the margin, since the substitution was constant. The sound row gives what was read, ʾăḏōnāy; the surface keeps what is written. English Bibles print the substitution as LORD in small capitals, and the gloss row follows them. How the name itself was pronounced in the period the text was written is not recorded in the text and is not reconstructed here."
- id: n.deut.6.4.echad
  attach: deut.6.4.6
  kind: editorial
  status: draft
  leans_on: the three translations on this page (JPS 1917, King James 1611, Geneva 1599)
  text: "The verse has no verb, and its four words after 'Israel' can be divided more than one way. The translations on this page show three: 'the LORD our God, the LORD is one' (JPS 1917), 'the LORD our God is one LORD' (King James), and 'the Lord our God is Lord onely' (Geneva), which reads ʾeḥāḏ as 'alone'. The first two make a statement about oneness, the third a statement of exclusive loyalty; the Hebrew allows both."
- id: n.deut.6.8.tefillin
  attach: deut.6.8
  kind: editorial
  status: draft
  leans_on: Mishnah Menahot 3.7; the Qumran phylacteries (4Q128-148)
  text: "Rabbinic practice reads verses 8 and 9 literally: the binding on the hand and between the eyes as tefillin, leather boxes holding these passages on parchment, and the writing on the doorposts as the mezuzah. Tefillin with these texts were found among the Dead Sea Scrolls, so the practice is older than the Mishnah. The word ṭōṭāp̄ōṯ, here 'frontlets', is rare and its derivation is uncertain."
- id: n.deut.6.4.creeds
  attach: deut.6.4
  kind: editorial
  status: draft
  leans_on: Mark 12:29-30; the Septuagint of Deuteronomy 6:4; the Nicene Creed, also in this library
  text: "In Mark 12:29-30 Jesus quotes these verses as the first commandment. The Nicene Creed in this library opens 'We believe in one God' with the same word for 'one' in Greek that the Septuagint uses for ʾeḥāḏ here (εἷς)."
