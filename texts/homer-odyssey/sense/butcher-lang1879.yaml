# Alignment of Butcher and Lang (1879) to line IDs. Text verbatim from sources/butcher-lang1879.txt.
translation: butcher-lang1879
aligned_by: hand, phase 0
spans:
  - lines: [od.1.1, od.1.2]
    text: "Tell me, Muse, of that man, so ready at need, who wandered far and wide, after he had sacked the sacred citadel of Troy,"
  - lines: [od.1.3, od.1.3]
    text: "and many were the men whose towns he saw and whose mind he learnt,"
  - lines: [od.1.4, od.1.5]
    text: "yea, and many the woes he suffered in his heart upon the deep, striving to win his own life and the return of his company."
  - lines: [od.1.6, od.1.6]
    text: "Nay, but even so he saved not his company, though he desired it sore."
  - lines: [od.1.7, od.1.9]
    text: "For through the blindness of their own hearts they perished, fools, who devoured the oxen of Helios Hyperion: but the god took from them their day of returning."
  - lines: [od.1.10, od.1.10]
    text: "Of these things, goddess, daughter of Zeus, whencesoever thou hast heard thereof, declare thou even unto us."
