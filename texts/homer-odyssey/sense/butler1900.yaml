# Alignment of Butler (1900) to line IDs. Text copied verbatim from sources/butler1900.txt
# (anchored after the Book I heading, not the preface, which quotes Butcher and Lang).
translation: butler1900
aligned_by: hand, phase 0
spans:
  - lines: [od.1.1, od.1.2]
    text: "Tell me, O Muse, of that ingenious hero who travelled far and wide after he had sacked the famous town of Troy."
  - lines: [od.1.3, od.1.3]
    text: "Many cities did he visit, and many were the nations with whose manners and customs he was acquainted;"
  - lines: [od.1.4, od.1.5]
    text: "moreover he suffered much by sea while trying to save his own life and bring his men safely home;"
  - lines: [od.1.6, od.1.9]
    text: "but do what he might he could not save his men, for they perished through their own sheer folly in eating the cattle of the Sun-god Hyperion; so the god prevented them from ever reaching home."
  - lines: [od.1.10, od.1.10]
    text: "Tell me, too, about all these things, oh daughter of Jove, from whatsoever source you may know them."
