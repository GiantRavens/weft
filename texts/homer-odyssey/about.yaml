  lead: 'The Odyssey (, ODD-iss-ee; Ancient Greek: Ὀδύσσεια, romanized: Odýsseia [odyˈsːeːˌja]) is one
    of two major epics of ancient Greek literature attributed to Homer. It is one of the oldest surviving
    works of literature and remains popular with modern audiences. Like the Iliad, the Odyssey is divided
    into 24 books. It follows the heroic king of Ithaca, Odysseus, also known by the Latin variant Ulysses,
    and his homecoming journey after the ten-year-long Trojan War. His journey from Troy to Ithaca lasts
    an additional ten years, during which time he encounters many perils and all of his crewmates are
    killed. In Odysseus''s long absence, he is presumed dead, leaving his wife Penelope and son Telemachus
    to contend with a group of unruly suitors competing for Penelope''s hand in marriage.'
