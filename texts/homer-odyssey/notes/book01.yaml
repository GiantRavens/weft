# Notes for book 1. `attach` is a token ID or a line ID.
# `kind`: quoted (verbatim from a named source) | editorial (Weft's own words, citing where it leans).
# Editorial notes stay `status: draft` until a human reviews them.
- id: n.od.1.1.andra
  attach: od.1.1.1
  kind: editorial
  status: draft
  text: "The poem's first word is ἄνδρα, 'man', and the man stays nameless until line 21. The Iliad opens the same way on its theme, with μῆνιν, 'wrath'."
- id: n.od.1.1.polytropos
  attach: od.1.1.5
  kind: editorial
  status: draft
  leans_on: LSJ s.v. πολύτροπος
  text: "Literally 'of many turns'. It can mean much-traveled, driven along many routes, or versatile and wily. The word supports both readings, and a translator has to choose: Butler writes 'ingenious', Butcher and Lang 'so ready at need'."
- id: n.od.1.2.plagchthe
  attach: od.1.2.1
  kind: editorial
  status: draft
  leans_on: LSJ s.v. πλάζω
  text: "Aorist passive of πλάζω, 'drive off course'. The passive presents Odysseus as driven rather than as a willing traveler."
- id: n.od.1.8.kata
  attach: od.1.8.3
  kind: editorial
  status: draft
  text: "κατὰ belongs with ἤσθιον in the next line: κατήσθιον, 'they ate down, devoured'. Homer often separates a verb from its prefix. Grammarians call this tmesis, 'cutting'."
- id: n.od.1.10.hamothen
  attach: od.1.10.2
  kind: editorial
  status: draft
  text: "'From somewhere': the poet lets the Muse choose where to begin. The narrative starts late in the story, in the tenth year of the wandering, with Odysseus held on Calypso's island."
- id: n.od.1.1.butler-construe
  attach: od.1.1
  kind: quoted
  source: Samuel Butler, preface to The Odyssey (1900)
  text: "That the reader, however, may see how far I have departed from strict construe, I will print here Messrs. Butcher and Lang’s translation of the sixty lines or so of the “Odyssey.”"
- id: n.od.1.1.polytropos-modern
  attach: od.1.1.5
  kind: editorial
  status: draft
  leans_on: "Daniel Mendelsohn, The Odyssey (2025), note on 1.1; Robert Fagles, The Odyssey (1996)"
  text: "Two recent translations show the choice the word forces. Fagles (1996) writes 'the man of twists and turns', which keeps both the winding route and the twisting mind. Mendelsohn (2025) splits the senses across the line break: 'who had so many roundabout ways / To wander'. In his note he argues that the grammar of the opening lines, where the wanderings follow at once, makes the word refer to the journey as well as to the man's cunning."
# Merry and Riddell's commentary (pin 13): the notes on 1.1-10, verbatim from the 1886 Clarendon Press
# print, pp. 1-2 (public domain). Transcribed with Perseus's text of the commentary (Perseus:text:1999.04.0055)
# as a reading aid and collated word by word against the scan and its OCR (archive.org
# homersodysseyedi01home); the words are the print's, so Perseus's non-commercial terms for its file do
# not attach to them. The note's own lemma opens each text, as in the print.
- id: n.od.1.1.mr-ennepe
  attach: od.1.1.3
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "ἔννεπε is the assimilated form of ἔνσεπε (from stem σεπ), as the Aeolic aorist ἔτεννα stands for ἔτενσα. We may compare the Lat. word insece, which is actually used in the translation of this line by Livius Andronicus, ‘Virum mihi, Camena, insece versutum.’"
- id: n.od.1.1.mr-moi
  attach: od.1.1.2
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "μοι is enclitic, = ‘prithee’; as distinguished from the emphatic dative εἰπὲ καὶ ἡμῖν, l. 10. For the order observed as to the place and succession of Enclitics in Homeric Greek, see Monro, Homeric Grammar, Append. E."
- id: n.od.1.1.mr-mousa
  attach: od.1.1.4
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "Μοῦσα = Μοντια, Μονσα, from root μεν, ‘to think.’ In l. 10 the muse is called θύγατερ Διός, as in Il. 2. 491 Ὀλυμπιάδες Μοῦσαι, Διὸς αἰγιόχοιο θυγατέρες. They are represented as nine in number in Od. 24. 607, but their names are first given in Hesiod."
- id: n.od.1.1.mr-polytropon
  attach: od.1.1.5
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "πολύτροπον, ‘of many devices,’ versutus. This epithet of Odysseus recurs only Od. 10. 330; but it has many equivalents in Il. and Od., e. g. πολύμητις, πολύφρων, πολυμήχανος, ποικιλόμητις, the general sense of which seems to fix its meaning. Cp. the phrase by which Odysseus characterises himself, Od. 9. 19 εἴμ’ Ὀδυσεὺς Λαερτιάδης ὃς πᾶσι δόλοισιν | ἀνθρώποισι μέλω. Nitzsch explains it as equivalent to πολύπλαγκτος, and takes the words ὃς μάλα πολλὰ πλάγχθη as its epexegesis. Cp. inf. 300 πατροφονῆα .. ὅς οἱ πατέρα κλυτὸν ἔκτα, Od. 18. 1 πτωχὸς πανδήμιος ὃς κατὰ ἄστυ πτωχεύεσκε, Il. 5. 63; 9. 124; 11. 475; 12. 295; 13. 452; which suggests that the Homeric usage is, in some cases, to repeat some portion of the word, at least, in the epexegetical clause. See Lehrs, Rhein. Mus. 1864, p. 303, and Nitzsch, De Odysseae Exordio, Hannov. 1824."
- id: n.od.1.2.mr-eperse
  attach: od.1.2.6
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "ἔπερσε. Explained by Od. 22. 230 σῇ δ’ ἥλω βουλῇ Πριάμου πόλις. Cp. Od. 9. 504. Cic. ad Fam. 10. 13 ‘Homerus non Aiacem nec Achillem, sed Ulixem appellavit πτολιπόρθιον.’"
- id: n.od.1.3.mr-noon
  attach: od.1.3.7
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "νόον ἔγνω, i. e. ‘learned what their spirit was like.’ The Schol. well compares Od. 6. 119 ὤ μοι ἐγὼ τέων αὖτε βροτῶν ἐς γαῖαν ἱκάνω; Ἦ ῥ’ οἵ γ’ ὑβρισταί τε καὶ ἄγριοι οὐδὲ δίκαιοι, | ἦε φιλόξεινοι, καί σφιν νόος ἐστὶ θεουδής;"
- id: n.od.1.4.mr-hoge
  attach: od.1.4.3
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "ὅ γε. This combination is frequent in Homer, to resume the original subject of the sentence (Epanalepsis); cp. inf. 26. 31; 2. 132; 3. 90; Il. 10. 514, etc."
- id: n.od.1.5.mr-arnymenos
  attach: od.1.5.1
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 1"
  text: "ἀρνύμενος. From root αρ = gain, as in μίσθ-αρ-νος, not connected with αἴρω. To ἄρ-νυ-μαι belong the common aorists ἠράμην, ἠρόμην. Translate—‘seeking to win.’"
- id: n.od.1.6.mr-houdhos
  attach: od.1.6.3
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), pp. 1–2"
  text: "οὐδ’ ὧς, ‘not for all that.’ For the accentuation cp. Apollon. Lex. Hom. δασυνόμενον δὲ καὶ περισπώμενον τὸ ὧς τὸ ὁμοίως [Villois. ὅμως] δηλοῖ· ἀλλ’ οὐδ’ ὧς ἑτάρους ἐρρύσατο."
- id: n.od.1.6.mr-per
  attach: od.1.6.7
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "περ. See on inf. 316."
- id: n.od.1.8.mr-kata
  attach: od.1.8.3
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "κατὰ . . ἤσθιον. On the distinction between the adverbial use of prepositions with verbs, and the separation, called by grammarians Tmesis, see Curtius, Greek Grammar Explained, p. 201; Hoffmann, Die Tmesis in der Ilias; Monro, H. G. §§ 175, 176."
- id: n.od.1.8.mr-hyperionos
  attach: od.1.8.5
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "Ὑπερίονος. Hesiod, Theog. 374, makes Ἠέλιος the son of Ὑπερίων, and (v. 1011) calls him Ἠ. Ὑπεριονίδης. So Od. 12. 176 we have Ὑπεριονίδαο ἄνακτος. But this does not prove that Ὑπερίων is a shortened form for Ὑπεριονίων, as Eustathius holds; for even the form Ὑπεριονίδης is not necessarily a patronymic, as we find, cp. Eustath., Ἡρακλείδης for Ἡρακλῆς, Σιμιχίδης for Σίμιχος (Lobeck, Aj. 190). Cp. also the form Οἰδιπόδης. Nitzsch regards Ὑπεριονίδης as non Homeric, holding Od. 12. 176 to be spurious: he leans to the view that Ὑπερίων is a quasi-patronymic for ὕπερος = child of the height [of heaven]; like οὐρανίωνες, for which Euripides (Phoeniss. 823) writes οὐρανίδαι, meaning only caelicolae. See by all means Lobeck’s note on ἁλιαδᾶν Ajax 880."
- id: n.od.1.10.mr-ton
  attach: od.1.10.1
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "τῶν. This gen. is governed by εἰπέ as Od. 11. 174 εἰπὲ δέ μοι πατρός."
- id: n.od.1.10.mr-hamothen
  attach: od.1.10.2
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "ἁμόθεν γε. It is left to the muse to decide at what point the minstrel shall take up the story. Cp. Od. 8. 500 ἔνθεν ἑλὼν ὡς, κ. τ. λ. Translate—‘from any point thou wilt.’ With ἁμόθεν cp. οὐδαμοῦ, ἁμῶς, ἁμῇ. Curtius, s. v., compares the Gothic sums = any one."
- id: n.od.1.10.mr-kai-hemin
  attach: od.1.10.8
  kind: quoted
  source: "W. W. Merry and James Riddell, Homer's Odyssey, vol. 1 (Oxford: Clarendon Press, 1886), p. 2"
  text: "καὶ ἡμῖν, sc. that we—the poet and his audience—may know as well as thou; ὑμεῖς γὰρ [Μοῦσαι] θεαί ἐστε, πάρεστέ τε, ἴστε τε πάντα Il. 2. 485, or, that we may be told, as thou hast told others: cp. Ar. Nub. 357 οὐρανομήκη ῥήξατε κἀμοὶ φωνὴν ὦ παμβασίλειαι. Aristarchus considers the καί superfluous, and so the Schol. on Theocr. 4 54 ὁ KAI περισσὸς ὥσπερ καὶ παρὰ Ὁμήρῳ. ‘τῶν ἁμόθεν γε, θεὰ, θύγατερ Διὸς, εἰπὲ καὶ ἡμῖν.’"
