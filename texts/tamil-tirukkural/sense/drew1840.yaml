translation: drew1840
aligned_by: hand, phase 0; one span per kural
spans:
- lines:
  - kural.1.1
  - kural.1.2
  text: As the letter A is the first of all letters, so the eternal God is first in the world.
- lines:
  - kural.2.1
  - kural.2.2
  text: What profit have those derived from learning, who worship not the good feet of him who is possessed of pure knowledge?
- lines:
  - kural.3.1
  - kural.3.2
  text: They who are united to the glorious feet of him who passes swiftly over the flower of the mind, shall flourish long above all worlds.
- lines:
  - kural.4.1
  - kural.4.2
  text: To those who are united to the feet of him who is without desire or aversion, evil shall never come.
- lines:
  - kural.5.1
  - kural.5.2
  text: The two-fold deeds that spring from darkness shall not adhere to those who delight in the true praise of God.
- lines:
  - kural.6.1
  - kural.6.2
  text: Those shall long prosper who abide in the faultless way of him who has destroyed the five desires of the senses.
- lines:
  - kural.7.1
  - kural.7.2
  text: Anxiety of mind cannot be removed, except from those who are united to the feet of him who is without likeness.
- lines:
  - kural.8.1
  - kural.8.2
  text: None can swim the sea of vice, but those who are united to the feet of that gracious being who is a sea of virtue.
- lines:
  - kural.9.1
  - kural.9.2
  text: The head that worships not the feet of him who is possessed of eight attributes, is profitless as a sense without the power of sensation.
- lines:
  - kural.10.1
  - kural.10.2
  text: None can swim the great sea of births, but those who are united to the feet of God.
