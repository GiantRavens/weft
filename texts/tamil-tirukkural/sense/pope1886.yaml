# G. U. Pope, The 'Sacred' Kurral of Tiruvalluva-Nayanar (1886), chapter I, The Praise of God, verbatim.
# Source: archive.org in.ernet.dli.2015.43871 (OCR text), checked against two other scans of the same
# printing (tiruvalluvanayan00tiruuoft; the 1980 reprint sacredkurralofti00revg). OCR corrections:
# '*' and stray '1', 'i', '4' read for opening quotation marks restored as ‘ (kurals 1, 2, 4, 7);
# '4 Whom' to ‘to Whom (kural 7, as the Toronto scan reads); 'who^ve' to who've and 'in nr 11 ‘rom' to
# 'in path from' (kural 6, as the Toronto scan reads); 'tne' to the; '$,11' to all; 'shore 01' to shore of;
# 'tnain' to main. Spaces the 1886 setting puts before ; and inside quotation marks are closed up.
translation: pope1886
aligned_by: hand, phase 0; one span per kural
spans:
- lines:
  - kural.1.1
  - kural.1.2
  text: 'A, as its first of letters, every speech maintains;

    The ‘Primal Deity’ is First through all the world''s domains.'
- lines:
  - kural.2.1
  - kural.2.2
  text: 'No fruit have men of all their studied lore,

    Save they the ‘Purely Wise One''s’ feet adore.'
- lines:
  - kural.3.1
  - kural.3.2
  text: 'His feet, ‘Who o''er the full-blown flower hath past,’ who gain

    In bliss long time shall dwell above this earthly plain.'
- lines:
  - kural.4.1
  - kural.4.2
  text: 'His foot, ‘Whom want affects not, irks not grief,’ who gain

    Shall not, through every time, of any woes complain.'
- lines:
  - kural.5.1
  - kural.5.2
  text: 'The men, who on the ‘King''s’ true praise delight to dwell,

    Affects not them the fruit of deeds done ill or well.'
- lines:
  - kural.6.1
  - kural.6.2
  text: 'Long live they blest, who''ve stood in path from falsehood freed;

    His, ‘Who quenched lusts that from the sense-gates five proceed.’'
- lines:
  - kural.7.1
  - kural.7.2
  text: 'Unless His foot, ‘to Whom none can compare,’ men gain,

    ''Tis hard for mind to find relief from anxious pain.'
- lines:
  - kural.8.1
  - kural.8.2
  text: 'Unless His feet, ‘the Sea of Good, the Fair and Bountiful,’ men gain,

    ''Tis hard the further bank of being''s changeful sea to attain.'
- lines:
  - kural.9.1
  - kural.9.2
  text: 'Before His foot, ‘the Eight-fold Excellence,’ with unbent head

    Who stands, like palsied sense, is to all living functions dead.'
- lines:
  - kural.10.1
  - kural.10.2
  text: 'They swim the sea of births, the ‘Monarch''s’ foot who gain;

    None others reach the shore of being''s mighty main.'
