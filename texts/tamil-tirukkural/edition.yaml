# Weft edition of Tirukkural chapter 1, The Praise of God (kaṭavuḷ vāḻttu), from R. Srinivasan's
# edition of the text alone (mūlam, 1997), page 9, as proofread on Tamil Wikisource. Checked verbatim
# against that page. The edition prints a full stop after each kural; the stop is editorial and is left
# out here (verify_strip removes it, with the verse-number template, before the check).
#
# Each kural is a section of two lines. Words are divided as the edition prints them, and the edition
# divides them by metrical foot (cīr), not always by word: நீடுவாழ் வார் is the one verb நீடுவாழ்வார்
# split before its last foot, and தாள்சேர்ந்தார்க் கல்லால் is தாள்சேர்ந்தார்க்கு அல்லால் joined by sandhi.
#
#   t   the Tamil script, as printed
#   n   the transliteration, ISO 15919, typed by hand. `weft draft` converts t to the same
#       transliteration and reports any difference (translit-mismatch). Sound and metre come from n.
joiner: " "
verify_in: sources/srinivasan1997-p9.txt
verify_strip: '\.?\s*\{\{[Pp]line\|\d+\|r\}\}'
metre: {name: kuṟaḷ veṇpā, feet: [4, 3]}
