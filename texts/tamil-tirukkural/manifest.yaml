predicted_gaps:
  - "the Kural's date is uncertain, so the Old Tamil reading is an approximation of an approximate period"
  - "Old Tamil sounds are reconstructed from the Tolkāppiyam and later scholarship; the values of c, ṟ, ṟṟ, ḻ and the āytam are the least certain"
  - "the full stop the 1997 edition prints after each kural is editorial and is left out; verify_strip removes it from the source for the verbatim check"
  - "no treebank for Old Tamil; lemma, morphology and gloss by hand, draft"
  - "each word is sounded alone: sandhi across words is written in the text but not modeled in the sound"
  - "kural 4 links a -kāy foot to a foot beginning with nirai (veṇṭaḷai rule break under the rules as implemented); reported as venpa-talai and left for review"
  - "Project Madurai's Tirukkural text was not used: its header allows free distribution but names no license and gives no permission to modify"
