  lead: 'The Tirukkuṟaḷ (Tamil: திருக்குறள், lit. ''sacred verses''), or shortened to the Kural (Tamil:
    குறள்), is a classic Tamil language text on commoner''s morality consisting of 1,330 short couplets,
    or kurals, of seven words each. The text is divided into three books with aphoristic teachings on
    virtue (aram), wealth (porul) and love (inbam), respectively. It is widely admired for the universal
    and non-sectarian character of its ethical teachings. Its authorship is traditionally attributed to
    Valluvar, also known in full as Thiruvalluvar. The text has been dated variously from 300 BCE to 5th
    century CE. The traditional accounts describe it as the last work of the third Sangam, but linguistic
    analysis suggests a later date of 450 to 500 CE and that it was composed after the Sangam period.'
