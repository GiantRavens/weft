# Thomas Paine's translation of the Declaration, printed in Rights of Man, Part One (London, 1791), verbatim from the text of Conway's 1894 edition on English Wikisource; one span per article. Paine's spelling (incontestible, favor, intrusted) is kept.
translation: paine1791
aligned_by: 'hand: one span per article'
spans:
- lines:
  - ddh.pre.1
  - ddh.pre.7
  text: 'The Representatives of the people of France, formed into a National Assembly, considering that ignorance, neglect, or contempt of human rights, are the sole causes of public misfortunes and corruptions
    of Government, have resolved to set forth in a solemn declaration, these natural, imprescriptible, and inalienable rights: that this declaration being constantly present to the minds of the members
    of the body social, they may be forever kept attentive to their rights and their duties; that the acts of the legislative and executive powers of Government, being capable of being every moment compared
    with the end of political institutions, may be more respected; and also, that the future claims of the citizens, being directed by simple and incontestible principles, may always tend to the maintenance
    of the Constitution, and the general happiness. For these reasons the National Assembly doth recognise and declare, in the presence of the Supreme Being, and with the hope of his blessing and favor,
    the following sacred rights of men and of citizens:'
- lines:
  - ddh.a1.1
  - ddh.a1.2
  text: Men are born, and always continue, free and equal in respect of their rights. Civil distinctions, therefore, can be founded only on public utility.
- lines:
  - ddh.a2.1
  - ddh.a2.2
  text: The end of all political associations is the preservation of the natural and imprescriptible rights of man; and these rights are liberty, property, security, and resistance of oppression.
- lines:
  - ddh.a3.1
  - ddh.a3.2
  text: The nation is essentially the source of all sovereignty; nor can any individual, or any body of men, be entitled to any authority which is not expressly derived from it.
- lines:
  - ddh.a4.1
  - ddh.a4.3
  text: Political Liberty consists in the power of doing whatever does not injure another. The exercise of the natural rights of every man, has no other limits than those which are necessary to secure to
    every other man the free exercise of the same rights; and these limits are determinable only by the law.
- lines:
  - ddh.a5.1
  - ddh.a5.2
  text: The law ought to prohibit only actions hurtful to society. What is not prohibited by the law should not be hindered; nor should anyone be compelled to that which the law does not require.
- lines:
  - ddh.a6.1
  - ddh.a6.4
  text: The law is an expression of the will of the community. All citizens have a right to concur, either personally or by their representatives, in its formation. It should be the same to all, whether
    it protects or punishes; and all being equal in its sight, are equally eligible to all honors, places, and employments, according to their different abilities, without any other distinction than that
    created by their virtues and talents.
- lines:
  - ddh.a7.1
  - ddh.a7.3
  text: No man should be accused, arrested, or held in confinement, except in cases determined by the law, and according to the forms which it has prescribed. All who promote, solicit, execute, or cause
    to be executed, arbitrary orders, ought to be punished, and every citizen called upon, or apprehended by virtue of the law, ought immediately to obey, and renders himself culpable by resistance.
- lines:
  - ddh.a8.1
  - ddh.a8.2
  text: The law ought to impose no other penalties but such as are absolutely and evidently necessary; and no one ought to be punished, but in virtue of a law promulgated before the offence, and legally
    applied.
- lines:
  - ddh.a9.1
  - ddh.a9.2
  text: Every man being presumed innocent till he has been convicted, whenever his detention becomes indispensable, all rigor to him, more than is necessary to secure his person, ought to be provided against
    by the law.
- lines:
  - ddh.a10.1
  - ddh.a10.1
  text: No man ought to be molested on account of his opinions, not even on account of his religious opinions, provided his avowal of them does not disturb the public order established by the law.
- lines:
  - ddh.a11.1
  - ddh.a11.2
  text: The unrestrained communication of thoughts and opinions being one of the most precious rights of man, every citizen may speak, write and publish freely, provided he is responsible for the abuse
    of this liberty, in cases determined by the law.
- lines:
  - ddh.a12.1
  - ddh.a12.2
  text: A public force being necessary to give security to the rights of men and of citizens, that force is instituted for the benefit of the community and not for the particular benefit of the persons
    to whom it is intrusted.
- lines:
  - ddh.a13.1
  - ddh.a13.2
  text: A common contribution being necessary for the support of the public force, and for defraying the other expenses of government, it ought to be divided equally among the members of the community,
    according to their abilities.
- lines:
  - ddh.a14.1
  - ddh.a14.2
  text: Every citizen has a right, either by himself or his representative, to a free voice in determining the necessity of public contributions, the appropriation of them, and their amount, mode of assessment,
    and duration.
- lines:
  - ddh.a15.1
  - ddh.a15.1
  text: Every community has a right to demand of all its agents an account of their conduct.
- lines:
  - ddh.a16.1
  - ddh.a16.1
  text: Every community in which a separation of powers and a security of rights is not provided for, wants a constitution.
- lines:
  - ddh.a17.1
  - ddh.a17.2
  text: The right to property being inviolable and sacred, no one ought to be deprived of it, except in cases of evident public necessity, legally ascertained, and on condition of a previous just indemnity.
