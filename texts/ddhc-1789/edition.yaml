# Weft edition of the Déclaration des droits de l'homme et du citoyen (26 August 1789): the preamble and the seventeen
# articles, as printed in the Extrait des procès-verbaux de l'Assemblée nationale (Paris, 1789), transcribed and validated on
# French Wikisource (Page:Déclaration des Droits de l'Homme.djvu/1-8); each line is checked verbatim against the pinned page
# revisions, a section naming its pages in order so a line that crosses a page is found. verify_strip sets aside the page's
# templates and tags; the one hyphenation across pages (opi-nions) is declared as a correction.
#
# The print keeps its 1789 spelling: Représentans, Gouvernemens, suivans, talens (the -ans plural), François, reconnoît,
# seroit (the oi that became ai in 1835), solemnelle, protége, assiète. Those tokens carry n, the modern spelling the
# lexicon is keyed by; the page shows the print and sounds the word as 1789 read it (François = Français).
#   t     the word as printed, punctuation attached; an elision (l’, d’, qu’) is its own token, glued to the next
#   n     the modern spelling where the print differs
#   p     punctuation the print sets off by a space (French " :" and " ;")
#   z     a liaison that careful reading makes (Les‿hommes, en‿être, ait‿été); few are marked, as in the de Gouges edition
#   Lines are Weft's division of the text at its stops and semicolons; sections are the preamble and the articles,
#   with the same ids as the de Gouges Declaration of 1791, which answers them one by one.
work: ddhc-1789
joiner: ' '
verify_strip: \{\{tiret\|[^}]*\}\}|\{\{tiret2\||\{\{Alinéa\||\{\{taille\||\{\{espacé\|[0-9.]+em\||\|200\}\}|\{\{pc\||\{\{sc\||\|0\|0\|(?:début|fin)=1\}\}|\[\[[^|\]]*\||\]\]|\{\{[^{}]*\}\}|\}\}|<[^>]+>|''
verify_corrections:
- ocr: opi|nions
  print: opinions
  in: sources/p6.txt
