# Human overlay for the Déclaration des droits de l'homme et du citoyen (1789). No treebank covers the text. Lemma, morphology
# and gloss were taken, word for word, from the reviewed overlay of Olympe de Gouges's Déclaration of 1791, which copies this
# text and changes its subject; the words she does not share, and every word whose sense turns on its context here (ne ... que
# as not ... except, elle as the Law, en as a pronoun), were written by hand and are marked. UD French-GSD conventions.
- by: Claude (Weft phase 0), from the de Gouges overlay with hand entries and corrections; for review by Skip and a scholar
