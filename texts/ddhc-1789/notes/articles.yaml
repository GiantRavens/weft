# Notes on the Déclaration des droits de l'homme et du citoyen (1789).
- id: n.ddh.pre.1.date
  attach: ddh.pre.1.1
  kind: editorial
  status: draft
  leans_on: the Extrait des procès-verbaux itself (pages 1 and 8); Marcel Gauchet, La Révolution des droits de l'homme (1989); Stéphane Rials, La Déclaration des droits de l'homme et du citoyen (1988)
  text: The Assembly voted the seventeen articles between 20 and 26 August 1789, after a week of debate on drafts by Lafayette, Sieyès, Mounier and others, and stopped at seventeen meaning to resume once
    the constitution was written; it never did. This printing is the official extract of the minutes, dated 20 to 26 August and 1 October, the day the Assembly sent its president, Mounier, to ask the king's
    acceptance. Louis XVI accepted on 5 October, the day the Paris crowd marched on Versailles.
- id: n.ddh.pre.1.spelling
  attach: ddh.pre.1.5
  kind: editorial
  status: draft
  leans_on: Féraud, Dictionnaire critique (1787-88), who writes loa for loi but ê for the -ois of François and seroit; the Academy's dictionary of 1835
  text: 'François, reconnoît, seroit: the print writes oi where the sound was already the open e of modern -ais; Voltaire had urged the spelling français, and the Academy adopted it in 1835. Représentans,
    Gouvernemens, suivans, talens keep the plural without t. The page shows the 1789 spelling and sounds the words as Paris read them.'
- id: n.ddh.pre.7.etre-supreme
  attach: ddh.pre.7.17
  kind: editorial
  status: draft
  leans_on: the debates of 20-21 August 1789 in the Archives parlementaires, vol. 8
  text: 'The Supreme Being of the deists, not the God of the Church: the Assembly debated on 20 and 21 August whether to name religion in the declaration at all, and settled on this formula in the preamble.
    Robespierre''s cult of 1794 took the same name.'
- id: n.ddh.a1.1.gouges
  attach: ddh.a1.1.3
  kind: editorial
  status: draft
  leans_on: Olympe de Gouges, Les Droits de la femme (1791), in this library as the Declaration of the Rights of Woman
  text: 'Les hommes naissent et demeurent libres et égaux en droits. Two years later Olympe de Gouges answered article by article: La femme naît libre et demeure égale à l''homme en droits. Her declaration
    is in this library with the same article ids, so the two can be read side by side.'
- id: n.ddh.a1.1.paine
  attach: ddh.a1.1.1
  kind: editorial
  status: draft
  leans_on: Paine, Rights of Man, Part One (1791); Burke, Reflections on the Revolution in France (1790)
  text: 'The English here is Thomas Paine''s, printed in Rights of Man in March 1791 as his answer to Burke, who had called the declaration ''paltry and blurred sheets of paper about the rights of man''.
    Paine follows it with his own observations: the first three articles hold the whole, and the rest unfold them.'
- id: n.ddh.a17.1.property
  attach: ddh.a17.1.6
  kind: editorial
  status: draft
  leans_on: the Declaration of 1793, article 2, and the Constitution of 1795
  text: Property stands with liberty, security and resistance to oppression in article 2 and closes the text as inviolable and sacred; the republican declaration of 1793 kept it among the natural rights
    and added the rights to public assistance and to education. The article's conditions, legally ascertained necessity and prior indemnity, are still the law of expropriation in France.
