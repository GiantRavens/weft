  lead: 'The Declaration of the Rights of Man and of the Citizen (French: Déclaration des droits de l''Homme
    et du citoyen de 1789), set by France''s National Constituent Assembly in 1789, is a human and civil
    rights document from the French Revolution; the French title can be translated in the modern era as
    "Declaration of Human and Civil Rights". Inspired by Enlightenment philosophers, the declaration was
    a core statement of the values of the French Revolution and had a significant impact on the development
    of popular conceptions of individual liberty and democracy in Europe and worldwide.'
