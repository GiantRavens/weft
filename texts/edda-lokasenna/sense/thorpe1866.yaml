# Verbatim from sources/thorpe1866.txt (Oegir's Compotation, or Loki's Altercation); see manifest for the edition.
translation: thorpe1866
aligned_by: hand, phase 0; one span per stanza (prose); Thorpe (Oegir's Compotation, or Loki's Altercation) numbers the 65 stanzas as the standard text does (2026-10-08)
spans:
- lines:
  - lok.1.1
  - lok.1.6
  text: Tell me, Eldir! ere thou thy foot settest one step forward, on what converse the sons of the triumphant gods at their potation?
- lines:
  - lok.2.1
  - lok.2.6
  text: Of their arms converse, and of their martial fame, the sons of the triumphant gods. Of the Æsir and the Alfar that are here within not one has a friendly word for thee.
- lines:
  - lok.3.1
  - lok.3.6
  text: I will go into Oegir's halls, to see the compotation. Strife and hate to the Æsir's sons I bear, and will mix their mead with bale.
- lines:
  - lok.4.1
  - lok.4.6
  text: Knowest thou not that if thou goest into Oegir's halls to see the compotation, but contumely and clamour pourest forth on the kindly powers, they will wipe it all off on thee?
- lines:
  - lok.5.1
  - lok.5.6
  text: Knowest thou not, Eldir, that if we two with bitter words contend, I shall be rich in answers, if thou sayest too much?
- lines:
  - lok.6.1
  - lok.6.6
  text: I Lopt am come thirsty into this hall, from a long journey, to beseech the Æsir one draught to give me of the bright mead.
- lines:
  - lok.7.1
  - lok.7.6
  text: Why gods! are ye so silent, so reserved, that ye cannot speak? A seat and place choose for me at your board, or bid me hie me hence.
- lines:
  - lok.8.1
  - lok.8.6
  text: A seat and place will the Æsir never choose for thee at their board; for well the Æsir know for whom they ought to hold a joyous compotation.
- lines:
  - lok.9.1
  - lok.9.6
  text: Odin! dost thou remember when we in early days blended our blood together? When to taste beer thou didst constantly refuse, unless to both 'twas offered?
- lines:
  - lok.10.1
  - lok.10.6
  text: Rise up, Vidar! and let the wolf's sire sit at our compotation; that Loki may not utter words of contumely in Oegir's hall.
- lines:
  - lok.11.1
  - lok.11.6
  text: Hail, Æsir! Hail, Asyniur! And ye, all-holy gods! all, save that one As, who sits within there, Bragi, on yonder bench.
- lines:
  - lok.12.1
  - lok.12.6
  text: A horse and falchion I from my stores will give thee, and also with a ring reward thee, if thou the Æsir wilt not requite with malice. Provoke not the gods against thee.
- lines:
  - lok.13.1
  - lok.13.7
  text: Of horse and rings wilt thou ever, Bragi! be in want. Of the Æsir and the Alfar, that are here present, in conflict thou art the most backward, and in the play of darts most timid.
- lines:
  - lok.14.1
  - lok.14.6
  text: I know that were I without, as I am now within, the hall of Oegir, I thy head would bear in my hand, and so for lying punish thee.
- lines:
  - lok.15.1
  - lok.15.6
  text: Valiant on thy seat art thou, Bragi! but so thou shouldst not be, Bragi, the bench's pride! Go and fight, if thou art angry; a brave man sits not considering.
- lines:
  - lok.16.1
  - lok.16.6
  text: I pray thee, Bragi! let avail the bond of children, and of all adopted sons, and to Loki speak not in reproachful words, in Oegir's hall.
- lines:
  - lok.17.1
  - lok.17.6
  text: Be silent, Idun! of all women I declare thee most fond of men, since thou thy arms, carefully washed, didst twine round thy brother's murderer.
- lines:
  - lok.18.1
  - lok.18.6
  text: Loki I address not with opprobrious words, in Oegir's hall. Bragi I soothe, by beer excited. I desire not that angry ye fight.
- lines:
  - lok.19.1
  - lok.19.6
  text: Why will ye, Æsir twain, here within, strive with reproachful words? Lopt perceives not that he is deluded, and is urged on by fate.
- lines:
  - lok.20.1
  - lok.20.6
  text: Be silent, Gefion! I will now just mention, how that fair youth thy mind corrupted, who thee a necklace gave, and around whom thou thy limbs didst twine?
- lines:
  - lok.21.1
  - lok.21.6
  text: Thou art raving, Loki! and hast lost thy wits, in calling Gefion's anger on thee; for all men's destinies, I ween, she knows as thoroughly as I do.
- lines:
  - lok.22.1
  - lok.22.6
  text: 'Be silent, Odin! Thou never couldst allot conflicts between men: oft hast thou given to those to whom thou oughtest not--victory to cowards.'
- lines:
  - lok.23.1
  - lok.23.5
  text: Knowest thou that I gave to those I ought not--victory to cowards? Thou wast eight winters on the earth below, a milch cow and a woman, and didst there bear children. Now that, methinks, betokens
    a base nature.
- lines:
  - lok.24.1
  - lok.24.6
  text: But, it is said, thou wentest with tottering steps in Samso, and knocked at houses as a Vala. In likeness of a fortune teller, thou wentest among people. Now that, methinks, betokens a base nature.
- lines:
  - lok.25.1
  - lok.25.6
  text: Your doings ye should never publish among men, what ye, Æsir twain, did in days of yore. Ever forgotten be men's former deeds!
- lines:
  - lok.26.1
  - lok.26.6
  text: Be thou silent, Frigg! Thou art Fiorgyn's daughter, and ever hast been fond of men, since Ve and Vili, it is said, thou, Vidrir's wife, didst both to thy bosom take.
- lines:
  - lok.27.1
  - lok.27.6
  text: 'Know thou that if I had, in Oegir''s halls, a son like Baldr, out thou shouldst not go from the Æsir''s sons: thou should''st have been fiercely assailed.'
- lines:
  - lok.28.1
  - lok.28.6
  text: But wilt thou, Frigg! that of my wickedness I more recount? I am the cause that thou seest not Baldr riding to the halls.
- lines:
  - lok.29.1
  - lok.29.6
  text: Mad art thou, Loki! in recounting thy foul misdeeds. Frigg, I believe, knows all that happens, although she says it not.
- lines:
  - lok.30.1
  - lok.30.6
  text: 'Be thou silent, Freyia! I know thee full well; thou art not free from vices: of the Æsir and the Alfar, that are herein, each has been thy paramour.'
- lines:
  - lok.31.1
  - lok.31.6
  text: False is thy tongue. Henceforth it will, I think, prate no good to thee. Wroth with thee are the Æsir, and the Asyniur. Sad shalt thou home depart.
- lines:
  - lok.32.1
  - lok.32.6
  text: Be silent, Freyia! Thou art a sorceress, and with much evil blended; since against thy brother thou the gentle powers excited. And then, Freyia! what didst thou do?
- lines:
  - lok.33.1
  - lok.33.3
  text: It is no great wonder, if silk-clad dames get themselves husbands, lovers; but 'tis a wonder that a wretched As, that has borne children, should herein enter.
- lines:
  - lok.34.1
  - lok.34.6
  text: Be silent, Niord! Thou wast sent eastward hence, a hostage from the gods. Hymir's daughters had thee for an utensil, and flowed into thy mouth.[41] _Niord_.
- lines:
  - lok.35.1
  - lok.35.6
  text: '''Tis to me a solace, as I a long way hence was sent, a hostage from the gods, that I had a son, whom no one hates, and accounted is a chief among the Æsir.'
- lines:
  - lok.36.1
  - lok.36.6
  text: 'Cease now, Niord! in bounds contain thyself; I will no longer keep it secret: it was with thy sister thou hadst such a son; hardly worse than thyself.'
- lines:
  - lok.37.1
  - lok.37.6
  text: 'Frey is best of all the exalted gods in the Æsir''s courts: no maid he makes to weep, no wife of man, and from bonds looses all.'
- lines:
  - lok.38.1
  - lok.38.6
  text: Be silent, Ty! Thou couldst never settle a strife 'twixt two; of thy right hand also I must mention make, which Fenrir from thee tore.
- lines:
  - lok.39.1
  - lok.39.6
  text: 'I of a hand am wanting, but thou of honest fame; sad is the lack of either. Nor is the wolf at ease: he in bonds must bide, until the gods'' destruction.'
- lines:
  - lok.40.1
  - lok.40.6
  text: Be silent, Ty; to thy wife it happened to have a son by me. Nor rag nor penny ever hadst thou, poor wretch! for this injury.
- lines:
  - lok.41.1
  - lok.41.6
  text: I the wolf see lying at the river's mouth, until the powers are swept away. So shalt thou be bound, if thou art not silent, thou framer of evil.
- lines:
  - lok.42.1
  - lok.42.6
  text: 'With gold thou boughtest Gymir''s daughter, and so gavest away thy sword: but when Muspell''s sons through the dark forest ride, thou, unhappy, wilt not have wherewith to fight.'
- lines:
  - lok.43.1
  - lok.43.6
  text: Know that were I of noble race, like Ingun's Frey, and had so fair a dwelling, than marrow softer I would bray that ill-boding crow, and crush him limb by limb.
- lines:
  - lok.44.1
  - lok.44.6
  text: What little thing is that I see wagging its tail, and snapping eagerly? At the ears of Frey thou shouldst ever be, and clatter under mills.
- lines:
  - lok.45.1
  - lok.45.6
  text: Byggvir I am named, and am thought alert, by all gods and men; therefore am I joyful here, that all the sons of Hropt drink beer together.
- lines:
  - lok.46.1
  - lok.46.6
  text: Be silent, Byggvir! Thou couldst never dole out food to men, when, lying in thy truckle bed, thou wast not to be found, while men were fighting.
- lines:
  - lok.47.1
  - lok.47.6
  text: Loki, thou art drunk, and hast lost thy wits. Why dost thou not leave off, Loki? But drunkenness so rules every man, that he knows not of his garrulity.
- lines:
  - lok.48.1
  - lok.48.6
  text: 'Be silent, Heimdall! For thee in early days was that hateful life decreed: with a wet back thou must ever be, and keep watch as guardian of the gods.'
- lines:
  - lok.49.1
  - lok.49.6
  text: Thou art merry, Loki! Not long wilt thou frisk with an unbound tail; for thee, on a rock's point, with the entrails of thy ice-cold son, the gods will bind.
- lines:
  - lok.50.1
  - lok.50.6
  text: Know, if on a rock's point, with the entrails of my ice-cold son, the gods will bind me, that first and foremost I was at the slaying, when we assailed Thiassi.
- lines:
  - lok.51.1
  - lok.51.6
  text: Know, if first and foremost thou wast at the slaying, when ye assailed Thiassi, that from my dwellings and fields shall to thee ever cold counsels come.
- lines:
  - lok.52.1
  - lok.52.6
  text: Milder wast thou of speech to Laufey's son, when to thy bed thou didst invite me. Such matters must be mentioned, if we accurately must recount our vices.
- lines:
  - lok.53.1
  - lok.53.6
  text: 'Hail to thee, Loki! and this cool cup receive, full of old mead: at least me alone, among the blameless Æsir race, leave stainless.'
- lines:
  - lok.54.1
  - lok.54.7
  text: So alone shouldst thou be, hadst thou strict and prudent been towards thy mate; but one I know, and, I think, know him well, a favoured rival of Hlorridi, and that is the wily Loki.
- lines:
  - lok.55.1
  - lok.55.6
  text: 'The fells all tremble: I think Hlorridi is from home journeying. He will bid be quiet him who here insults all gods and men.'
- lines:
  - lok.56.1
  - lok.56.6
  text: 'Be silent, Beyla! Thou art Byggvir''s wife, and with much evil mingled: never came a greater monster among the Æsir''s sons. Thou art a dirty strumpet.'
- lines:
  - lok.57.1
  - lok.57.6
  text: Silence, thou impure being! My mighty hammer, Miollnir, shall stop thy prating. I will thy head from thy neck strike; then will thy life be ended.
- lines:
  - lok.58.1
  - lok.58.6
  text: Now the son of earth is hither come. Why dost thou chafe so, Thor? Thou wilt not dare do so, when with the wolf thou hast to fight, and he the all-powerful father swallows whole.
- lines:
  - lok.59.1
  - lok.59.6
  text: Silence, thou impure being! My mighty hammer, Miollnir, shall stop thy prating. Up I will hurl thee to the east region, and none shall see thee after.
- lines:
  - lok.60.1
  - lok.60.6
  text: Of thy eastern travels thou shouldest never to people speak, since in a glove-thumb thou, Einheri! wast doubled up, and hardly thoughtest thou wast Thor.
- lines:
  - lok.61.1
  - lok.61.6
  text: 'Silence, thou impure being! My mighty hammer, Miollnir, shall stop thy prating: with this right hand I, Hrungnir''s bane, will smite thee, so that thy every bone be broken.'
- lines:
  - lok.62.1
  - lok.62.7
  text: '''Tis my intention a long life to live, though with thy hammer thou dost threaten me. Skrymir''s thongs seemed to thee hard, when at the food thou couldst not get, when, in full health, of hunger
    dying.'
- lines:
  - lok.63.1
  - lok.63.6
  text: Silence, thou impure being! My mighty hammer, Miollnir, shall stop thy prating. Hrungnir's bane shall cast thee down to Hel, beneath the gratings of the dead.
- lines:
  - lok.64.1
  - lok.64.6
  text: 'I have said before the Æsir, I have said before the Æsir''s sons, that which my mind suggested: but for thee alone will I go out; because I know that thou wilt fight.'
- lines:
  - lok.65.1
  - lok.65.7
  text: Oegir! thou hast brewed beer; but thou never shalt henceforth a compotation hold. All thy possessions, which are herein, flame shall play over, and on thy back shall burn thee.
