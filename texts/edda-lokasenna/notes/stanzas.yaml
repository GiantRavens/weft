# Notes on Lokasenna.
- id: n.lok.1.1.frame
  attach: lok.1.1
  kind: editorial
  status: draft
  text: "Lokasenna, 'Loki's flyting', is a contest of insults at a feast. The Codex Regius sets it in prose, which the source file keeps and the stanzas do not include. In Bellows's rendering: Ægir, also called Gymir, had brewed ale for the gods once he had the great kettle (the subject of Hymiskviða). Odin and Frigg came, Sif, Bragi and Iðunn, the one-handed Týr, Njörðr and Skaði, Freyr and Freyja, Víðarr, and Loki with Freyr's servants Byggvir and Beyla; Thor was away in the east. Ægir's two serving-men were Fimafengr and Eldir; the hall was lit by shining gold, the ale served itself, and the place was a sanctuary. When the guests praised the servants, Loki could not bear it and killed Fimafengr. The gods drove him to the woods and went back to drinking; Loki returned and met Eldir outside, and the poem begins with his question."
- id: n.lok.1.1.speakers
  attach: lok.1.1.1
  kind: editorial
  status: draft
  text: "The edition names the speaker above each stanza, and the page shows the name in the stanza heading. Loki speaks every second stanza; his victims answer in turn: Eldir, Bragi, Iðunn, Gefjun, Odin, Frigg, Freyja, Njörðr, Týr, Freyr, Byggvir, Heimdallr, Skaði, Sif, Beyla, and at last Thor. The first stanza follows the prose directly and carries no heading."
- id: n.lok.9.3.blood
  attach: lok.9.3.1
  kind: editorial
  status: draft
  text: "Blendum blóði saman, 'we blended our blood together': Loki reminds Odin that they are sworn blood-brothers, and that Odin once vowed never to drink unless ale was brought to both. The oath is why the gods, who have just driven Loki out, must now give him a seat; it is attested nowhere else in the Edda."
- id: n.lok.23.4.seid
  attach: lok.24.1.3
  kind: editorial
  status: draft
  text: "Odin's charge that Loki spent eight winters under the earth (stanza 23; the lines that follow in other editions, a milking cow and a woman bearing children, are not in this normalized text, whose stanza 23 has five lines) is answered in kind: Odin practised seiðr, the magic of women, on Sámsey, beating a drum like a völva. Both call the other argr, the word for an unmanly man; in the laws it was among the gravest insults, and the flyting turns on it."
- id: n.lok.38.4.tyr
  attach: lok.39.1.1
  kind: editorial
  status: draft
  text: "Handar em ek vanr, 'a hand I lack': Týr lost his right hand in the mouth of the wolf Fenrir when the gods bound him, the story Snorri tells in Gylfaginning. Týr's reply turns the loss back on Loki, the wolf's father: the wolf lies bound until the doom of the gods, and Loki will follow him (stanza 41)."
- id: n.lok.49.6.binding
  attach: lok.49.6.2
  kind: editorial
  status: draft
  text: "Skaði foretells that the gods will bind Loki with the guts of his own son, hrímkalda magar, 'the rime-cold son'. The closing prose tells it: Loki hid in the Fránangr falls as a salmon, was caught, and bound with the entrails of his son Váli; Skaði hung a serpent over his face, and Sigyn his wife held a basin under the venom. When she emptied it the poison fell on him, and his writhing is what men call earthquakes."
- id: n.lok.54.6.sif
  attach: lok.54.6.1
  kind: editorial
  status: draft
  text: "Hór, 'a lover': Sif offers Loki the cup of peace as the one woman he cannot accuse, and he claims to have been her lover himself. Nothing else in the Edda records it; Snorri tells only that Loki cut off her hair."
- id: n.lok.58.3.thor
  attach: lok.58.3.5
  kind: editorial
  status: draft
  text: "Thor arrives at stanza 57 and ends the flyting by force rather than wit: four times he threatens Loki with Mjöllnir, the 'mighty hammer', and Loki answers each threat with a story against him, the glove of Skrýmir and the knot he could not untie (stanzas 60 and 62, told in Snorri's Útgarða-Loki tale). Only to Thor does Loki yield, 'because I know that you strike' (stanza 64)."
- id: n.lok.65.1.end
  attach: lok.65.1.4
  kind: editorial
  status: draft
  text: "Loki's parting curse on Ægir's hall, that fire play over all his possessions, is the last stanza; the prose epilogue on Loki's binding follows it in the manuscript and is summarized in the note on stanza 49."
