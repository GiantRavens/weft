  lead: 'Gylfaginning (Old Norse: ''The Beguiling of Gylfi'' or ''The Deluding of Gylfi''; 13th century
    Old Norse pronunciation [ˈɟʏlvaˌɟɪnːɪŋɡ]) is the first main part of the 13th-century Prose Edda, after
    the initial Prologue. The Gylfaginning takes the form of a dialogue between a Swedish King Gylfi and
    three men on thrones in Asgard called High, Just-As-High, and Third. Gylfi asks many questions of
    the three men on the history and future of the Æsir. The creation and eventual destruction of the
    world are described, as are many other aspects of Norse mythology. While the Gylfaginning never makes
    it explicit, the three are often presumed to be guises of Odin.'
