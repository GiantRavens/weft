# Verbatim from Anderson, The Younger Edda (1880), sources/anderson1880.txt (Project Gutenberg 18947),
# chapters 5-8 and 50 in his numbering (49 in this edition), whitespace normalized. No corrections.
translation: anderson1880
aligned_by: hand, phase 0; clause spans against Weft's lines; where Weft's selection skips a sentence, the matching words are left out between spans
spans:
- lines: [gyl.5.1, gyl.5.3]
  text: "And when the heated blasts from Muspelheim met the rime, so that it melted into drops, then, by the might of him who sent the heat, the drops quickened into life and took the likeness of a man, who got the name Ymer. But the Frost giants call him Aurgelmer."
- lines: [gyl.5.4, gyl.5.6]
  text: "Made answer Har: By no means do we believe him to be god; evil was he and all his offspring, them we call frost-giants."
- lines: [gyl.5.7, gyl.5.9]
  text: "It is said that when he slept he fell into a sweat, and then there grew under his left arm a man and a woman, and one of his feet begat with the other a son. From these come the races that are called frost-giants."
- lines: [gyl.6.1, gyl.6.1]
  text: "Then said Ganglere: Where did Ymer dwell, and on what did he live?"
- lines: [gyl.6.2, gyl.6.3]
  text: "Answered Har: The next thing was that when the rime melted into drops, there was made thereof a cow, which hight Audhumbla. Four milk-streams ran from her teats, and she fed Ymer."
- lines: [gyl.6.4, gyl.6.6]
  text: "She licked the salt-stones that were covered with rime, and the first day that she licked the stones there came out of them in the evening a man’s hair, the second day a man’s head, and the third day the whole man was there."
- lines: [gyl.6.7, gyl.6.7]
  text: "This man’s name was Bure;"
- lines: [gyl.6.8, gyl.6.10]
  text: "and he begat a son whose name was Bor. This Bor married a woman whose name was Bestla, the daughter of the giant Bolthorn; they had three sons,--the one hight Odin, the other Vile, and the third Ve."
- lines: [gyl.7.1, gyl.7.5]
  text: "The sons of Bor slew the giant Ymer, but when he fell, there flowed so much blood from his wounds that they drowned therein the whole race of frost giants; excepting one, who escaped with his household. Him the giants call Bergelmer."
- lines: [gyl.7.6, gyl.7.6]
  text: "He and his wife went on board his ark and saved themselves in it."
- lines: [gyl.8.1, gyl.8.2]
  text: "They took the body of Ymer, carried it into the midst of Ginungagap and made of him the earth. Of his blood they made the seas and lakes;"
- lines: [gyl.8.3, gyl.8.4]
  text: "of his flesh the earth was made, but of his bones the rocks; of his teeth and jaws, and of the bones that were broken, they made stones and pebbles."
- lines: [gyl.8.5, gyl.8.6]
  text: "Thride added: They took his skull and made thereof the sky, and raised it over the earth with four sides. Under each corner they set a dwarf,"
- lines: [gyl.8.7, gyl.8.7]
  text: "and the four dwarfs were called Austre (east), Vestre (West), Nordre (North), Sudre (South)."
- lines: [gyl.8.8, gyl.8.8]
  text: "For this purpose they used the giant Ymer’s eyebrows, and they called the burg Midgard."
- lines: [gyl.8.9, gyl.8.9]
  text: "They also took his brains and cast them into the air, and made therefrom the clouds,"
- lines: [gyl.49.1, gyl.49.1]
  text: "The beginning of this tale is, that Balder dreamed dreams great and dangerous to his life."
- lines: [gyl.49.2, gyl.49.3]
  text: "When he told these dreams to the asas they took counsel together, and it was decided that they should seek peace for Balder against all kinds of harm."
- lines: [gyl.49.4, gyl.49.5]
  text: "So Frigg exacted an oath from fire, water, iron and all kinds of metal, stones, earth, trees, sicknesses, beasts, birds and creeping things, that they should not hurt Balder."
- lines: [gyl.49.6, gyl.49.8]
  text: "When this was done and made known, it became the pastime of Balder and the asas that he should stand up at their meetings while some of them should shoot at him, others should hew at him, while others should throw stones at him; but no matter what they did, no harm came to him, and this seemed to all a great honor."
- lines: [gyl.49.9, gyl.49.9]
  text: "When Loke, Laufey’s son, saw this, it displeased him very much that Balder was not scathed."
- lines: [gyl.49.10, gyl.49.10]
  text: "So he went to Frigg, in Fensal, having taken on himself the likeness of a woman."
- lines: [gyl.49.11, gyl.49.12]
  text: "Then said Frigg: Neither weapon nor tree can hurt Balder, I have taken an oath from them all."
- lines: [gyl.49.13, gyl.49.13]
  text: "Then asked the woman: Have all things taken an oath to spare Balder?"
- lines: [gyl.49.14, gyl.49.16]
  text: "Frigg answered: West of Valhal there grows a little shrub that is called the mistletoe, that seemed to me too young to exact an oath from."
- lines: [gyl.49.17, gyl.49.17]
  text: "Then the woman suddenly disappeared. Loke went and pulled up the mistletoe and proceeded to the meeting."
- lines: [gyl.49.18, gyl.49.18]
  text: "Hoder stood far to one side in the ring of men, because he was blind."
- lines: [gyl.49.19, gyl.49.19]
  text: "Loke addressed himself to him, and asked: Why do you not shoot at Balder?"
- lines: [gyl.49.20, gyl.49.20]
  text: "He answered: Because I do not see where he is, and furthermore I have no weapons."
- lines: [gyl.49.21, gyl.49.23]
  text: "Then said Loke: Do like the others and show honor to Balder; I will show you where he stands; shoot at him with this wand."
- lines: [gyl.49.24, gyl.49.24]
  text: "Hoder took the mistletoe and shot at Balder under the guidance of Loke."
- lines: [gyl.49.25, gyl.49.25]
  text: "The dart pierced him and he fell dead to the ground."
- lines: [gyl.49.26, gyl.49.26]
  text: "This is the greatest misfortune that has ever happened to gods and men."
