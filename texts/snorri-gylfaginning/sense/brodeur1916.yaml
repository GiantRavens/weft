# Verbatim from Brodeur, The Prose Edda (1916), English Wikisource pages 49-53 and 102-104 (sources/brodeur1916-p*.txt),
# with the wiki markup set aside: running heads, chapter numerals in bold, italics, footnote references.
# The translator's footnote to 'ship' ("Literally, mill-bench or mortar.") is recorded in the notes.
# No corrections.
translation: brodeur1916
aligned_by: hand, phase 0; clause spans against Weft's lines; where Weft's selection skips a sentence, the matching words are left out between spans
spans:
- lines: [gyl.5.1, gyl.5.3]
  text: "and when the breath of heat met the rime, so that it melted and dripped, life was quickened from the yeast-drops, by the power of that which sent the heat, and became a man's form. And that man is named Ymir, but the Rime-Giants call him Aurgelimir;"
- lines: [gyl.5.4, gyl.5.6]
  text: "And Jafnhárr answered: \"By no means do we acknowledge him God; he was evil and all his kindred: we call them Rime-Giants."
- lines: [gyl.5.7, gyl.5.9]
  text: "Now it is said that when he slept, a sweat came upon him, and there grew under his left hand a man and a woman, and one of his feet begat a son with the other; and thus the races are come;"
- lines: [gyl.6.1, gyl.6.1]
  text: "Then said Gangleri: \"Where dwelt Ymir, or wherein did he find sustenance?\""
- lines: [gyl.6.2, gyl.6.3]
  text: "Hárr answered: \"Straightway after the rime dripped, there sprang from it the cow called Audumla; four streams of milk ran from her udders, and she nourished Ymir.\""
- lines: [gyl.6.4, gyl.6.6]
  text: "She licked the ice-blocks, which were salty; and the first day that she licked the blocks, there came forth from the blocks in the evening a man's hair; the second day, a man's head; the third day the whole man was there."
- lines: [gyl.6.7, gyl.6.7]
  text: "He is named Búri:"
- lines: [gyl.6.8, gyl.6.10]
  text: "He begat a son called Borr, who wedded the woman named Bestla, daughter of Bölthorn the giant; and they had three sons: one was Odin, the second Vili, the third Vé."
- lines: [gyl.7.1, gyl.7.5]
  text: "The sons of Borr slew Ymir the giant; lo, where he fell there gushed forth so much blood out of his wounds that with it they drowned all the race of the Rime-Giants, save that one, whom giants call Bergelmir, escaped with his household;"
- lines: [gyl.7.6, gyl.7.6]
  text: "he went upon his ship, and his wife with him, and they were safe there."
- lines: [gyl.8.1, gyl.8.2]
  text: "They took Ymir and bore him into the middle of the Yawning Void, and made of him the earth: of his blood the sea and the waters;"
- lines: [gyl.8.3, gyl.8.4]
  text: "the land was made of his flesh, and the crags of his bones; gravel and stones they fashioned from his teeth and his grinders and from those bones that were broken.\""
- lines: [gyl.8.5, gyl.8.6]
  text: "Then said Thridi: \"They took his skull also, and made of it the heaven, and set it up over the earth with four corners; and under each corner they set a dwarf:"
- lines: [gyl.8.7, gyl.8.7]
  text: "the names of these are East, West, North, and South."
- lines: [gyl.8.8, gyl.8.8]
  text: "and for their citadel they raised up the brows of Ymir the giant, and called that place Midgard."
- lines: [gyl.8.9, gyl.8.9]
  text: "They took also his brain and cast it in the air, and made from it the clouds,"
- lines: [gyl.49.1, gyl.49.1]
  text: "The beginning of the story is this, that Baldr the Good dreamed great and perilous dreams touching his life."
- lines: [gyl.49.2, gyl.49.3]
  text: "When he told these dreams to the Æsir, then they took counsel together: and this was their decision: to ask safety for Baldr from all kinds of dangers."
- lines: [gyl.49.4, gyl.49.5]
  text: "And Frigg took oaths to this purport, that fire and water should spare Baldr, likewise iron and metal of all kinds, stones, earth, trees, sicknesses, beasts, birds, venom, serpents."
- lines: [gyl.49.6, gyl.49.8]
  text: "And when that was done and made known, then it was a diversion of Baldr's and the Æsir, that he should stand up in the Thing, and all the others should some shoot at him, some hew at him, some beat him with stones; but whatsoever was done hurt him not at all, and that seemed to them all a very worshipful thing."
- lines: [gyl.49.9, gyl.49.9]
  text: "But when Loki Laufeyarson saw this, it pleased him ill that Baldr took no hurt."
- lines: [gyl.49.10, gyl.49.10]
  text: "He went to Fensalir to Frigg, and made himself into the likeness of a woman."
- lines: [gyl.49.11, gyl.49.12]
  text: "Then said Frigg: 'Neither weapons nor trees may hurt Baldr: I have taken oaths of them all.'"
- lines: [gyl.49.13, gyl.49.13]
  text: "Then the woman asked: 'Have all things taken oaths to spare Baldr?'"
- lines: [gyl.49.14, gyl.49.16]
  text: "and Frigg answered: 'There grows a tree-sprout alone westward of Valhall: it is called Mistletoe; I thought it too young to ask the oath of.'"
- lines: [gyl.49.17, gyl.49.17]
  text: "Then straightway the woman turned away; but Loki took Mistletoe and pulled it up and went to the Thing."
- lines: [gyl.49.18, gyl.49.18]
  text: "Hödr stood outside the ring of men, because he was blind."
- lines: [gyl.49.19, gyl.49.19]
  text: "Then spake Loki to him: 'Why dost thou not shoot at Baldr?'"
- lines: [gyl.49.20, gyl.49.20]
  text: "He answered: 'Because I see not where Baldr is; and for this also, that I am weaponless.'"
- lines: [gyl.49.21, gyl.49.21]
  text: "Then said Loki: 'Do thou also after the manner of other men, and show Baldr honor as the other men do."
- lines: [gyl.49.22, gyl.49.23]
  text: "I will direct thee where he stands; shoot at him with this wand.'"
- lines: [gyl.49.24, gyl.49.24]
  text: "Hödr took Mistletoe and shot at Baldr, being guided by Loki:"
- lines: [gyl.49.25, gyl.49.26]
  text: "the shaft flew through Baldr, and he fell dead to the earth; and that was the greatest mischance that has ever befallen among gods and men."
