# Human overlay for Gylfaginning, chapters 5-8 and 49. No treebank contains the Prose Edda (IcePaHC,
# used for Grettis saga, has no Snorra Edda text), so lemma, morphology and gloss are by hand, draft.
# Lemmas follow Zoëga, A Concise Dictionary of Old Icelandic (1910), in normalized spelling (ö for ǫ
# as in the edition); morphology uses Universal Dependencies features. The pronoun þeir, þær, þau and
# the demonstrative sá share the lemma sá; the article inn is DET. A joined word (gerðu = ger þú) has
# two lemmas joined by ' + '. Impersonal verbs (dreymði, sakaði, líkaði) take the person in the
# accusative or dative; the gloss marks the impersonal subject (it-dreamed, it-harmed). The gloss keeps
# the Old Norse word order; grammar rides in the English (of-the-heat, to-him, we-call).
