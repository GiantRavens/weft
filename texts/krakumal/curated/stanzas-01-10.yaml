# Human overlay for Krákumál stanzas 1-10. Lemmas follow Zoëga, A Concise Dictionary of Old Icelandic (1910),
# in normalized Old Norse spelling; morphology uses Universal Dependencies features. Staves and meter by hand.
# The measure is close to dróttkvætt without regular hendingar: six-syllable lines paired by alliteration, the
# odd line with two staves, the even line with a head-stave; the refrain line is the odd line of the first pair.
# Vowels alliterate with each other; sk, sp, st only with themselves. Kennings are glossed word by word.
# Words spelled with r for older hr (rafnar, rottar, rægagarr, rækyndill) take the hr- lemma; they alliterate on r.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-22"
  why: "hand lemma, morphology, gloss, staves and meter for stanzas 1-10; no treebank exists for skaldic verse; written in the compact spec and expanded by weft overlay"
  status: "draft"
