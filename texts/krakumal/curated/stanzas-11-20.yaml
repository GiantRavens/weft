# Human overlay for Krákumál stanzas 11-20. Lemmas follow Zoëga, A Concise Dictionary of Old Icelandic (1910),
# normalized Old Norse spelling; morphology uses Universal Dependencies features. Staves and meter by hand: a
# skaldic measure close to dróttkvætt, six-syllable lines paired by alliteration, the odd line with two staves and
# the even line with one head-stave; vowels alliterate with each other, sk only with sk. Kennings are glossed word
# by word and resolved in the notes.
