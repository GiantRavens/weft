# Notes for Krákumál, all 29 stanzas. Editorial notes are drafts until a reviewer lifts them.
- id: n.krak.poem
  attach: krak.1.1
  kind: editorial
  status: draft
  leans_on: "the Wikipedia article Krákumál (revision 1370550196), lead; Ragnars saga loðbrókar, ch. 15, in the same edition"
  text: "Krákumál is a monologue in the voice of Ragnar Lothbrok as he dies in the snake pit of King Ella of Northumbria. He recalls his battles one by one and ends by welcoming death. The poem is dated to the 12th century and placed in the Norse settlements of the Scottish islands, so it is two or three centuries later than the events it claims to tell. Its name links it with Kráka, the name under which Ragnar's wife Áslaug first appears in the saga. The saga gives Ragnar two other stanzas in the snake pit, not these; Krákumál stands on its own beside it."
- id: n.krak.metre
  attach: krak.1.2
  kind: editorial
  status: draft
  leans_on: "the Wikipedia article Krákumál, lead; the alliteration as marked in the overlay"
  text: "The lines have about six syllables and are bound in pairs by alliteration, two staves in the odd line and one at the head of the even line, as in dróttkvætt, the court meter of the skalds. Unlike dróttkvætt the poem does not use the internal rhymes of that meter regularly; the measure is usually described as a kind of háttlausa, 'meter without rhyme'. The refrain Hjoggum vér með hjörvi, 'we hewed with the sword', opens each of the first 28 stanzas and is itself the odd line of the first pair: it alliterates on h with the line after it (Hitt, Heldr, Hátt). The page marks the staves word by word."
- id: n.krak.lodbrok
  attach: krak.1.8
  kind: editorial
  status: draft
  leans_on: "Ragnars saga loðbrókar, ch. 3-4, in the same edition; Zoëga, A Concise Dictionary of Old Icelandic, s.vv. loðbrók, lyngáll"
  text: "The first stanza tells how Ragnar won his first wife, Þóra, by killing the serpent that lay round her bower in Gautland, and how men named him Loðbrók 'at that fight'. The name means 'hairy breeches'. In the saga (ch. 3) Ragnar has shaggy breeches and a cloak made, has them boiled in pitch, and rolls in sand before he goes to the serpent; when he kills it, a jet of its blood strikes him and does him no harm. The saga does not say in so many words that the clothes gave him his name, and the marriage to Þóra follows in ch. 4. The serpent is called here grafvitnir, 'the wolf of the pit', and lyngölunn, 'the eel of the heather', two kennings for a snake."
- id: n.krak.battles
  attach: krak.11.4
  kind: editorial
  status: draft
  leans_on: "the place names as the text gives them"
  text: "Stanzas 2 to about 21 are a list of battles, most of them placed somewhere: Eyrasund (the Øresund), the mouth of the Dína (the Dvina), Borgundarhólmr (Bornholm), the land of the Flemings, Northumbria, the Hebrides (Suðreyjar), Ireland, Anglesey (Öngulsey), and here Englanes, 'England's ness', a headland in England; stanza 24 names Scotland. Stanzas 22 and 23 turn from the list to reflections on fate and courage. Several of the kings and earls the poem says Ragnar killed are not known from other sources. The list reads as a catalogue of the places a viking of the poet's time would name, and the poem does not claim more precision than that; the identification of most sites is uncertain."
- id: n.krak.ella
  attach: krak.24.5
  kind: editorial
  status: draft
  leans_on: "Ragnars saga loðbrókar, ch. 15-17, in the same edition; Þáttr af Ragnars sonum, ch. 3"
  text: "The last stanzas turn from the battles to the snake pit. Ragnar says he never thought Ella would be his death, and he foresees revenge: the sons of Áslaug would wake battle with sharp swords if they knew how the many venom-filled snakes are tearing him (26), and the wand will stand in Ella, that is, he will be wounded to death (27). The saga and the þáttr both tell the revenge: Ragnar's sons come to England and kill Ella. In the saga Ragnar's last words in the pit are the proverb about the young pigs who would grunt if they knew what the old boar suffered."
- id: n.krak.end
  attach: krak.29.8
  kind: editorial
  status: draft
  leans_on: "the Old Norse text; Zoëga, s.vv. dís, hlæja"
  text: "The last stanza drops the refrain. Ragnar says he longs to end; the dísir, female spirits, whom Óðinn has sent from his hall, invite him home, and he will drink ale with the gods in the high seat. The last line is læjandi skalk deyja, 'laughing I shall die'. The normalized text prints læjandi without the h of hlæjandi; the page reads the word as printed."
- id: n.krak.spelling
  attach: krak.6.3
  kind: editorial
  status: draft
  leans_on: "the alliteration as marked in the overlay; Zoëga, A Concise Dictionary of Old Icelandic, for the hr- headwords"
  text: "Several words that older Norse spelled with hr- appear here with r- (rafnar for hrafnar 'ravens', rottar, rægagarr, rækyndill). In two of them, rægagarr (6.3) and rækyndill (7.7), the alliteration falls on r, which supports the spelling; elsewhere the alliteration does not decide it. The lemmas give the hr- headwords found in the dictionary, and the sound layer follows the spelling of the edition. In 21.9 the edition prints roðin with one n; the page reads it as the masculine participle roðinn, 'reddened', agreeing with flugdreki in the next line."
