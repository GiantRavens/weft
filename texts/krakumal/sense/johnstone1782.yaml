translation: johnstone1782
aligned_by: hand, phase 0; one span per stanza (prose); Johnstone numbers 29 stanzas, each opened by the refrain; his 19 and 20 stand in the reverse order of this edition and are aligned by content, his 20 to stanza 19 and his 19 to stanza 20 (2026-10-22)
spans:
- lines:
  - krak.1.1
  - krak.1.10
  text: We hew'd with our Swords! When first we landed on the Gothic shore, vengeance soon o'ertook the wily dragon miner of the ground — 'twas then I won my Thora. Men call'd me Lod-broc, from what time I slew the snaky dweller of the heath. At that assault, my point, inlaid with burnish'd gold, transfix'd the circling monster of the earth.
- lines:
  - krak.2.1
  - krak.2.10
  text: We hew'd with our Swords! Blooming was my youth when east at Eyra's straits opposing bands we gash'd for the insulting wolves, and golden-footed king of birds — there, while our temper'd steel sung on the high-seam'd helm, they found a rich repast. Gore distain'd the deep. The raven waded through the blood of the slain.
- lines:
  - krak.3.1
  - krak.3.10
  text: We hew'd with our Swords! High I bore my lance, & wide I carried my ensanguin'd blade before I number'd twenty years. Eight Earls grac'd my triumphs at the Dwina's mouth — there we the falcon entertain'd with plenteous meals. The crimson sweat of death poured on the sullen sea. Warriors lost their lives.
- lines:
  - krak.4.1
  - krak.4.10
  text: We hew'd with our Swords! Heiden's queen indulg'd our thirst of fame while to the hall of Odin we dispatch'd Helsinga's race. Our galleys enter'd Iva's flood. Keenly bit the feather'd arrow. Streams, gushing from the reeking wounds, soon tinged the red'ning torrent. Swords rung upon the breast-plate. Deathful weapons cleft the targe.
- lines:
  - krak.5.1
  - krak.5.10
  text: We hew'd with our Swords! Methinks none from the battle turn'd till 'midst his winged steeds fierce Herraud died. While posting to the destin'd port, no Earl, of old, borne by the foaming coursers of the main, more fearless plough'd the sea-fowl's haunt. Aye his dareful heart propell'd him headlong through the troubled fight.
- lines:
  - krak.6.1
  - krak.6.10
  text: We hew'd with our Swords! The warriors dropt their bucklers — brands, the riflers of life, flew wrathful from their scabbards against the bosoms of the brave. At Scarpa-skeria cruelly hack'd the trenchant battle-ax. Red were the borders of our moony shields, until King Rafn died. The tepid blood, spurting from the temples of the valiant, was drifted on their harness.
- lines:
  - krak.7.1
  - krak.7.10
  text: We hew'd with our Swords! On Ulla's plain loud roar'd the spear ere to our force King Eistein bow'd. Gleaming in gold the slaught'rous field we travers'd. The taper'd lance, indignant, bor'd the shield, at the helm'd conflict. Rills, of winy hue, warm from the wounded neck flow'd down the hero's shoulder.
- lines:
  - krak.8.1
  - krak.8.10
  text: We hew'd with our Swords! The raven at Indero's isle might for himself have torn a sumptuous banquet. We soon procur'd a glutt'nous meal for Fala's speedful wolves — ill then the corslet fenced the warrior's body. By the orient lamp of light I saw shafts starting from the string. The flexile yew sent forth the barbed reed.
- lines:
  - krak.9.1
  - krak.9.10
  text: We hew'd with our Swords! Stained were our shields with gore when on Borgunda's isle we bent the trusty bow. Clouds of arrows pierc'd the close-ring'd harness. Vulner was mingled in the carnage — no chief was more renown'd. Crowded was the strand with a cadav'rous wreck. The savage beast was gladen'd with his prey.
- lines:
  - krak.10.1
  - krak.10.10
  text: We hew'd with our Swords! High waxed the joys of Hilda when on the Belgian plains King Freyer stoop'd to fate. There the hard blue falchion forc'd its way, till, drenched in blood, it rent the golden cuirass. The virgin wail'd that dawning morn — she saw a copious feast prepar'd for rav'ning wolves.
- lines:
  - krak.11.1
  - krak.11.10
  text: We hew'd with our Swords! At Engla-næs, I vow, by hundreds were the adversaries strow'd among their ships that lurk'd around our isles. For six long days our gallies speeded to the contest — humbled, at last, was the insulting foe. With the uprising sun we chaunted the matins of dire battle. Amidst the stir, Waldeve was doom'd to sink beneath our swords.
- lines:
  - krak.12.1
  - krak.12.10
  text: We hew'd with our Swords! By Bertha's haven down from our points distill'd the dew of death. Wan lay the lifeless trunk before the hawk. Loud hum'd the bow-string — shafts, hurrying thro' the glare of brands unsheath'd, transfix'd the morion 'midst the press of close-woven armour. Meantime our swords, sharp as the viper's poison, ope'd the bleeding gash.
- lines:
  - krak.13.1
  - krak.13.10
  text: We hew'd with our Swords! Near Hadninga's bay high tower'd our crests in fierce encounter. While in the fell dispute we split the shiver'd targe, men might observe our baneful falchions cleave the casques of heroes — the sight was pleasing to my heart as when my blooming bride I seated by me on the chair of state.
- lines:
  - krak.14.1
  - krak.14.10
  text: We hew'd with our Swords! Hard came the tempest of war upon our bucklers, till low lay the foe on the Northumbrian shore. None, on that morning, needed rouze the rueful sport of Hilda. The temper'd edge divided steel-capt sculls — the scene was sweet as when I welcom'd the youthful widow to my throne preeminent.
- lines:
  - krak.15.1
  - krak.15.10
  text: We hew'd with our Swords! O'er my men for Herthiof was decreed a splendid victory in the Sudoreys. Rognvald fail'd before the storm of spears. The mishap of their provider full sore the hawks bewail'd — amidst the gust of swords, ne'er did the string of his unerring bow dismiss its bolts in vain.
- lines:
  - krak.16.1
  - krak.16.10
  text: We hew'd with our Swords! In heaps promiscuous was piled the enemy. Glad was the kindred of the Falcon — from the clam'rous shout they boded an approaching feast. Marstein, Erin's King, whelm'd by the ir'ny sleet, allay'd the hunger of the eagle, and the wolf. The slain at Wedra's gulf became the Raven's booty.
- lines:
  - krak.17.1
  - krak.17.10
  text: We hew'd with our Swords! Numerous were the bands, which, with the early dawn, I spied in the sore onset slaughter'd. Too soon a thorn, issuing from its sheath, stung the heart of my Son Regner — 'twas Egil reft the fearless youth of life. Weapons thunder'd on our steel-proof armour. Our pennons glisten'd in the skies.
- lines:
  - krak.18.1
  - krak.18.10
  text: We hew'd with our Swords! I descried the Sons of Endil, true to their promise, carving liberally for the wolves. Delightful was the strife at Scaia, as when the damsels bring the purple wine. Red were our steeds that bound along the surge. Amidst the din of arms full oft was Scoguls' iron vesture ripp'd by Skiold's hardy race.
- lines:
  - krak.19.1
  - krak.19.10
  text: We hew'd with our Swords! South at Leinster, with the breaking day, commenc'd a stubborn struggle against three kings. Few went joyous from that conflict — few cou'd boast that they escap'd unhurt. Within the wolf's wide gaping jaws full many sunk. The Falcon's offspring pounced the mangled limbs. Erin's blood, streaming from the decks, flow'd on the deep beneath.
- lines:
  - krak.20.1
  - krak.20.10
  text: We hew'd with our Swords! With the rising sun we saw the lover of the maid, and the wooer of the widow, fainting beauteous in his locks. Pleasant was the sight at Ila's straits, as when the ministring virgin hands the fuming goblet. Ere King Aurn fell, I mark'd the warding shield to pieces hacked, and chieftains gasp in death.
- lines:
  - krak.21.1
  - krak.21.10
  text: We hew'd with our Swords! Shields were riven by the uplifted falchion. Blades, rich with ruddy gold, resounded on the mail of Hilda. Future ages shall review the spot on Mona's shore, where, in array, we stalked to beard the adversary. Our spears, swift as the dragon's flight, were deeply dyed along that bank where seas ingulf the mountain torrent.
- lines:
  - krak.22.1
  - krak.22.10
  text: We hew'd with our Swords! What youth is fairer among men than he, who, far advancing thro' the blast of jav'lins, bends under adverse wounds — they 'scape not human woe that shun the hard-fought field. Yet 'tis hard to egg the coward soul to deeds of manhood — the dastard's heart ne'er moves him on to feats of valour.
- lines:
  - krak.23.1
  - krak.23.8
  text: We hew'd with our Swords! That I esteem fair combat when, at the rude interview of swords, youth meets his youth, and thane yields not to thane — this was, in antient times, the pride of chiefs. Bold shou'd the lover of the fair be seen amidst the battle's whirlwind.
- lines:
  - krak.24.1
  - krak.24.10
  text: We hew'd with our Swords! Experience proves that we must follow destiny. Few can evade the potency of fate. Little did I dream that e'er my days by Ella wou'd be bounded — when I strow'd his land with the slain — when I led my ships into his havens — when we gorged the beasts of prey along the Scottish bays.
- lines:
  - krak.25.1
  - krak.25.10
  text: We hew'd with our Swords! But still, there is a never-failing consolation for my spirit — the board of Balder's sire stands open to the brave. Soon from the foe's capacious scull we'll drink the amber beverage. Departed heroes know no griefs when once they enter the palace of dread Fiolner — I'll not approach the courts of Vithris with the faltering voice of fear.
- lines:
  - krak.26.1
  - krak.26.10
  text: We hew'd with our Swords! Soon would the sons of Aslaug come, arm'd with their flaming brands, to wake the battle, did they but know of our mischance — what a swarm of vipers, big with venom, sting my body — I sought a noble mother for my children — one that might impart advent'rous hearts to our posterity.
- lines:
  - krak.27.1
  - krak.27.10
  text: We hew'd with our Swords! Now to my heir devolves the crown. Grim seem the terrors of the adder. Serpents nest within my heart's recesses — yet'tis the cordial of my soul, that Vithris' lance shall soon stick fast in Ella. My sons will swell with vengeance at their parent's doom — those gen'rous youths will, sure, forego the sweets of peace.
- lines:
  - krak.28.1
  - krak.28.10
  text: We hew'd with our Swords! Full fifty times my lance, dire devastation's harbinger, announc'd the distant enterprize. Methinks no King has truer cause to glory — it was the pastime of my boyish days, to tinge my spear with blood. The immortals will permit my presence in their company. No sigh shall e'er disgrace my exit.
- lines:
  - krak.29.1
  - krak.29.8
  text: Now let us cease our Song! See! the celestial virgins, sent from that Hall where Odin's martial train resides, invite me home. There, happy on my high-rais'd throne, I'll quaff the barley's mellow'd juices. The moments of my life are fled. The smiles of death compose my placid visage.
