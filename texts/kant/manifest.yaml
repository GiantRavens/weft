predicted_gaps:
  - "the first passage is verified against the Wikisource transcription of the 1784 print, not against the page images; Wikisource prints ß and umlauts where the Fraktur print has them, and long s as s"
  - "the second passage is verified against the Deutsches Textarchiv transcription of the 1788 print, normalized for long s and the superscript e of the umlauts; the DTA file is fetched from an Internet Archive capture because the DTA site no longer serves plain downloads"
  - "the 1788 print reads 'mit immer neuer und zunehmenden Bewunderung'; the edition keeps the reading (see the notes)"
  - "the print's 'u. s. w.' is one token, u.s.w., because the Wikisource text joins its parts with non-breaking spaces"
  - "the pronunciation of educated Königsberg German in the 1780s is reconstructed from later descriptions of northern educated speech before the stage norm of 1898; no description of Kant's own speech specific enough to model has been used; the value of postvocalic r and of long ä is uncertain"
  - "the sound is computed from the modern spelling of each word form; the spellings Muth, Theil and seyn carry no sound difference"
  - "the Latin of the text (Sapere aude, naturaliter majorennes) is given in the German school pronunciation of Latin"
  - "no treebank; lemma, morphology and gloss by hand, draft"
  - "one English translation per passage: Richardson's of 1798 for the essay (the modern translations are in copyright) and Abbott's for the Critique"
