# T. K. Abbott's translation of the Critique of Practical Reason, Conclusion, first paragraph,
# verbatim from Project Gutenberg #5683. No corrections.
translation: abbott1889
aligned_by: hand, phase 0; one span per sentence of the German
spans:
- lines: [kant.kpv.1, kant.kpv.2]
  text: "Two things fill the mind with ever new and increasing admiration and awe, the oftener and the more steadily we reflect on them: the starry heavens above and the moral law within."
- lines: [kant.kpv.3, kant.kpv.4]
  text: "I have not to search for them and conjecture them as though they were veiled in darkness or were in the transcendent region beyond my horizon; I see them before me and connect them directly with the consciousness of my existence."
- lines: [kant.kpv.5, kant.kpv.7]
  text: "The former begins from the place I occupy in the external world of sense, and enlarges my connection therein to an unbounded extent with worlds upon worlds and systems of systems, and moreover into limitless times of their periodic motion, its beginning and continuance."
- lines: [kant.kpv.8, kant.kpv.9]
  text: "The second begins from my invisible self, my personality, and exhibits me in a world which has true infinity, but which is traceable only by the understanding, and with which I discern that I am not in a merely contingent but in a universal and necessary connection, as I am also thereby with all those visible worlds."
- lines: [kant.kpv.10, kant.kpv.11]
  text: "The former view of a countless multitude of worlds annihilates as it were my importance as an animal creature, which after it has been for a short time provided with vital power, one knows not how, must again give back the matter of which it was formed to the planet it inhabits (a mere speck in the universe)."
- lines: [kant.kpv.12, kant.kpv.14]
  text: "The second, on the contrary, infinitely elevates my worth as an intelligence by my personality, in which the moral law reveals to me a life independent of animality and even of the whole sensible world, at least so far as may be inferred from the destination assigned to my existence by this law, a destination not restricted to conditions and limits of this life, but reaching into the infinite."
