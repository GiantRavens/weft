# Weft edition: the Tale of Bygone Years (Повѣсть временьныхъ лѣтъ), the entries for 6367-6370
# (859-862 AD), in the Laurentian copy (Russian National Library, St Petersburg, F.п.IV.2, written by
# the monk Lavrentii in 1377). The text is that of Полное собрание русских летописей, vol. 1, part 1
# (Leningrad, 1926), edited by E. F. Karsky, pp. 19-20, read from the scan in the Internet Archive.
#
# Transcription. Letters as printed: ѣ ъ ь ѧ ꙗ ѡ ѿ і, and оу as two letters. A letter the print sets
# above the line is lowered into it in parentheses: пр(а)вды, им(а)ху, н(а)ми, Сл(о)вѣне, лѣ(т),
# находн(и)ци. An abbreviation mark (pokrytie) is replaced by the letter it stands for, also in
# parentheses: ни(х) for нихъ, Полѧнѣ(х) and Сѣверѣ(х) for the locative plural in -хъ, лѣ(т) in 6369.
# The titlo over the letter numerals is not shown (҂ѕ·т·ѯ·з for 6367). Both choices are forced by
# the page's web font, which is split into Unicode subsets: a Cyrillic letter and a combining mark
# over it come from different font files and show as an empty box. Square brackets enclose what
# Karsky supplied from the other copies (T = Trinity, R = Radziwiłł, A = Academy), as he prints
# them: the heading of 6370, four instances of и, [въ], [Варѧгъ], and [сѣде Новѣгородѣ], which the
# Laurentian copy lacks. Karsky's variant numbers and footnote letters are left out. The middle dots
# are the manuscript's punctuation as printed; the line-ending ornament after 6369 is left out.
# Weft divides the entries into lines at sense breaks.
#
# Readings of the scan that are uncertain: the superscript letter in находн(и)ци is read as и (the
# Radziwiłł copy has находници, and Karsky gives no footnote here); the expansions of the pokrytie
# are editorial; the last numeral of 6369 is read
# as ѳ (9), the value Karsky's dating requires; Вятичѣхъ is printed with a letter of the shape я,
# kept as printed.
#
#   t   the word as printed, without the punctuation that follows
#   n   the reading form, typed by hand: abbreviations and raised letters written out (ни(х) -> нихъ,
#       лѣ(т) -> лѣто, Полѧнѣ(х) -> Полянѣхъ), ѡ as о, ѿ as отъ, оу as у, ѧ and ꙗ as я, і as и, an acute
#       on the stressed vowel (editorial, approximate), and a letter numeral as its value. The page
#       shows it as the reading form; both sound schemes read it.
#   p   the punctuation that follows
#   num a letter numeral (its reading is a number; the spelling sensor skips it)
#
# Check. The printed source exists openly only as a scan with an uncorrected OCR text, so each line
# is checked by the ocr_verify sensor in pipeline/weft/oldeastslavic.py: the OCR between the two
# markers is corrected by the list below (each correction a reading of the scan), reduced to letters
# (letters in parentheses, punctuation, digits and Karsky's footnote marks dropped; ѧ ꙗ я а, о ѡ, и і
# folded together, because the OCR does not tell them apart), and every line's letters must then
# appear in it in order and unbroken. `weft draft` reports edition-not-in-source otherwise, and
# ocr-correction-unused for a correction that no longer matches the OCR.
