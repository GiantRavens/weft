# Notes for the Tale of Bygone Years, entries 6367-6370 (859-862), Laurentian copy.
- id: n.pvl.text
  attach: pvl.6367.1
  kind: editorial
  status: draft
  leans_on: "PSRL 1 (1926), introduction and apparatus to pp. 19-20; A. A. Shakhmatov, Разыскания о древнейших русских летописных сводах (1908); S. Franklin and J. Shepard, The Emergence of Rus 750-1200 (1996), introduction"
  text: "The Tale of Bygone Years is a chronicle of Rus' compiled in Kiev in the early 12th century from older annals and narratives. Its compiler is traditionally named as Nestor, a monk of the Kiev Caves Monastery; the Laurentian copy ends with a note by Sylvester, abbot of the Vydubichi monastery, dated 1116, which shows that the text was reworked more than once. No 12th-century manuscript survives. The Laurentian copy used here was written in 1377 by the monk Lavrentii; the Hypatian copy (about 1425) and the Radziwiłł copy (late 15th century) carry other versions of the same text. Entries are dated by years from the creation of the world in the Byzantine reckoning: 6367 less 5508 gives 859 AD. The years are written in letter numerals with a titlo, and 6368 and 6369 are entries with a date and no text, a common feature of the early annals. Square brackets mark words the 1926 editor supplied from the other copies."
- id: n.pvl.tribute
  attach: pvl.6367.5
  kind: editorial
  status: draft
  leans_on: "PSRL 1 (1926), p. 19, variants 10 and footnote у; I. I. Sreznevsky, Материалы для словаря древне-русского языка (1893-1912), s.v. вѣверица, дымъ; Cross (1930), p. 144"
  text: "The entry for 6367 divides the northern and southern peoples between two collectors of tribute: the Varangians from beyond the sea and the Khazars. The tribute is reckoned per дымъ, literally a smoke, that is, a hearth or household. In the Laurentian text it is a white вѣверица, the word for a squirrel, its pelt being the unit of payment; the other copies differ here (the Radziwiłł copy reads бѣлеи дѣвеци, a white maiden, and the Trinity copy reads differently again). Cross renders the passage as a squirrel-skin and a beaver-skin, two animals where the Laurentian text has one, and he also adds the Ves to the peoples paying the Varangians. The 1926 editor notes, after Bychkov and Shakhmatov, that the sense calls for the Ves at this point, but the Laurentian copy does not have it, and the edition here does not add it."
- id: n.pvl.rus-speak
  attach: pvl.6370.12
  kind: editorial
  status: draft
  leans_on: "PSRL 1 (1926), p. 19, variants 29-31; Hypatian text in Библиотека литературы Древней Руси, vol. 1 (1997), as on Russian Wikisource; Franklin and Shepard (1996), ch. 1"
  text: "The copies disagree on who speaks the invitation. The Laurentian copy reads рѣша Русь, Чюдь, Словѣни и Кривичи: the Rus', the Chud, the Slovenes and the Krivichians said. The Radziwiłł and Academy copies read руси, and the Hypatian text reads ркоша руси, which makes the Rus' the addressees: the Chud, the Slovenes and the Krivichians said to the Rus'. The two readings differ by one letter and place the Rus' on opposite sides of the invitation. The reading with руси agrees with the sentence before it, in which the envoys go over the sea to the Rus', and Cross follows it (to the people of Rus). The gloss here keeps the Laurentian wording."
- id: n.pvl.invitation
  attach: pvl.6370.13
  kind: editorial
  status: draft
  leans_on: "Словарь русского языка XI-XVII вв., вып. 10 (1983), s.v. нарядъ; Sreznevsky, s.v. нарядъ; Cross (1930), p. 145"
  text: "Земля наша велика и обилна, а нарѧда в неи нѣтъ: our land is great and abundant, but there is no нарѧдъ in it. The noun is related to рѧдъ, an arrangement or agreement, and to рѧдити, to arrange or to govern; the dictionaries of Old Russian give for нарѧдъ order, arrangement and management. The sentence before it uses the same root: the people seek a prince who would rule them and рѧдити по праву, judge by right, where the Laurentian copy has судилъ (judge) and the Radziwiłł and Academy copies рѧдилъ. Cross translates there is no order in it. The sentence became a proverb in later Russian, usually quoted as порядка в ней нет. In the request that follows, кнѧжитъ is a supine, the verb form used to express purpose after a verb of motion (come in order to reign), while володѣти beside it is an infinitive."
- id: n.pvl.normanist
  attach: pvl.6370.8
  kind: editorial
  status: draft
  leans_on: "Vilhelm Thomsen, The Relations between Ancient Russia and Scandinavia and the Origin of the Russian State (1877); Annales Bertiniani, s.a. 839; Franklin and Shepard (1996), ch. 1-2; A. A. Shakhmatov (1908)"
  text: "This passage is the starting point of a long debate about the origin of Rus', usually called the Varangian or Normanist question. Normanism, in its 18th-century form (G. S. Bayer, G. F. Müller), held that the Rus' were Scandinavians and that they founded the state; its opponents, from M. V. Lomonosov onward, argued for a Slavic or southern origin of the Rus' and of their state. The question of the name is now largely settled on linguistic grounds: most scholars derive Rus' from the Finnic name for Sweden and the Swedes (Finnish Ruotsi, Estonian Rootsi), which is itself traced to a Norse word connected with rowing. Independent evidence points the same way: the Annals of St Bertin record that envoys called Rhos who came to the Frankish court in 839 were found to be Swedes, and most of the envoys named in the treaties of Rus' with Byzantium of 911 and 944 bear Scandinavian names. What remains disputed is the weight of the Scandinavian element in the formation of the state, and how much of the calling story is history. Shakhmatov argued that the story belongs to a chronicle compilation of the late 11th century, from which it passed into the Tale of Bygone Years, which places its composition some two centuries after the events it dates."
- id: n.pvl.peoples
  attach: pvl.6370.9
  kind: editorial
  status: draft
  leans_on: "Thomsen (1877), lecture 1; Franklin and Shepard (1996), ch. 1; Sreznevsky, s.v. варягъ"
  text: "The chronicler explains the name Rus' by comparison: these Varangians were called Rus' as others are called Свое (the Svear, Swedes; other copies have свие), Оурмане (Northmen, usually taken as the Norwegians), Анъглѧне (the English, or the Angles) and Гъте (most often identified with the people of Gotland). The list treats Rus' as one Varangian people among several, which is how the compiler of the early 12th century understood the term. Варѧгъ itself is generally derived from Old Norse væringi, a man bound by a pledge, the word later used in Byzantium for Scandinavian guardsmen. The Laurentian sentence is grammatically difficult at сице бо сѧ звахуть и варѧзи суть; the other copies have тїи or ти (those) for и, and the gloss follows that sense."
- id: n.pvl.names
  attach: pvl.6370.18
  kind: editorial
  status: draft
  leans_on: "Е. А. Мельникова, 'Рюрик, Синеус и Трувор в древнерусской историографической традиции', Древнейшие государства Восточной Европы 1998 (2000), pp. 148-149; Thomsen (1877), lecture 3"
  text: "Рюрикъ is generally taken to render the Old Norse name Hrœrekr, which is well attested in Scandinavia; Синеоусъ and Труворъ have been explained as Signjótr and Þórvarðr, also attested Norse names. An older proposal, made by A. A. Kunik, held that Sineus and Truvor are a misunderstood Swedish phrase meaning with his house and his retinue; specialists in Scandinavian languages consider this unlikely, pointing out that both names occur as personal names in Scandinavian sources. Little else is known. No source outside the Rus' chronicle tradition names the three brothers; Sineus and Truvor appear only here and die within two years; and the identification of Rurik with Rorik of Dorestad, a Danish leader of the 9th century in Frisia, has been proposed since the 19th century without a source that connects them. The Laurentian copy also omits where Rurik first ruled: the editor supplies сѣде Новѣгородѣ from the Trinity copy, while the Radziwiłł, Academy and Hypatian texts have him build Ladoga and sit there first."
- id: n.pvl.norse
  attach: pvl.6370.17
  kind: editorial
  status: draft
  leans_on: "Thomsen (1877); Weft's Old Norse works (edda-voluspa, edda-havamal, saga-grettir, runes) and their sound scheme in pipeline/weft/norse.py"
  text: "The Norse side of this story can be read elsewhere in Weft. The Eddic poems and the saga of Grettir are in Old Norse, the language from which Hrœrekr, Signjótr and Þórvarðr come, and the runes work gives Scandinavian inscriptions in their own script. The Norse sources know Rus' as Garðar, and 11th-century Swedish runestones name Garðar and Holmgarðr, usually identified with Novgorod, as places where men travelled and some died. These texts are later than the events dated here and do not mention Rurik; they show the connection between Scandinavia and the eastern routes, not the calling itself. The sound rows also differ in kind: the Norse works reconstruct Old Icelandic of about 1200, while this page reconstructs the Slavic speech of Kiev about 1100, in which the Norse names had already been adapted."
