  lead: 'The calling of the Varangians, calling of the (Varangian) princes or invitation to the Varangians
    (Russian: призвание варягов, romanized: prizvaniye varyagov; Ukrainian: покликання варягів, romanized:
    poklykannya varyahiv) is a legend about the origins of the Rus'' people, the Rurik dynasty and the
    Kievan Rus'' state, recorded in many divergent versions in various manuscripts and compilations of
    Rus'' chronicles. These include the six main witnesses of the Primary Chronicle (PVL; mainly the Laurentian
    (Lav.), Hypatian (Ipat.), and Radziwiłł (Rad.)) and the Novgorod First Chronicle (NPL), as well as
    later textual witnesses such as the Sofia First Chronicle and the Pskov Third Chronicle.'
