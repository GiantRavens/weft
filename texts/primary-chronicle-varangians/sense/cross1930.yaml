# Samuel Hazzard Cross, The Russian Primary Chronicle, Harvard Studies and Notes in Philology and
# Literature 12 (1930), pp. 144-145, from the Internet Archive OCR text (doncarlosthemeha0000fred).
# Verbatim apart from these corrections: line-end hyphens joined ("Varan- gian", "Nov- gorod"); the
# running head "The Russian Primary Chronicle 145" removed; the closing quotation marks after "reign
# over us" set as ” (the OCR has ’”’). Cross's bracketed numbers [20] and [19], which mark page
# divisions of the Russian edition he translated from, are left out.
# Cross merges 6368-6370 under one heading, and his first sentence for 6370 covers Weft lines
# 6370.1-6370.3; the empty years 6368 and 6369 are included in that span.
translation: cross1930
aligned_by: hand, phase 0
spans:
- lines: [pvl.6367.1, pvl.6367.5]
  text: "6367 (859). The Varangians from beyond the sea imposed tribute upon the Chuds, the Slavs, the Merians, the Ves, and the Krivichians. But the Khazars imposed it upon the Polyanians, the Severians, and the Vyatichians, and collected a squirrel-skin and a beaver-skin from each hearth."
- lines: [pvl.6368.1, pvl.6370.3]
  text: "6368-6370 (860-862). The tributaries of the Varangians drove them back beyond the sea and, refusing them further tribute, set out to govern themselves."
- lines: [pvl.6370.4, pvl.6370.5]
  text: "There was no law among them, but tribe rose against tribe. Discord thus ensued among them, and they began to war one against another."
- lines: [pvl.6370.6, pvl.6370.7]
  text: "They said to themselves, “Let us seek a prince who may rule over us, and judge us according to the law.”"
- lines: [pvl.6370.8, pvl.6370.11]
  text: "They accordingly went overseas to the Varangian Russes: these particular Varangians were known as Russes, just as some are called Swedes, and others Normans, Angles, and Goths, for they were thus named."
- lines: [pvl.6370.12, pvl.6370.14]
  text: "The Chuds, the Slavs, and the Krivichians then said to the people of Rus, “Our whole land is great and rich, but there is no order in it. Come to rule and reign over us.”"
- lines: [pvl.6370.15, pvl.6370.18]
  text: "They thus selected three brothers, with their kinsfolk, who took with them all the Russes and migrated. The oldest, Rurik, located himself in Novgorod; the second, Sineus, in Byeloozero; and the third, Truvor, in Izborsk."
- lines: [pvl.6370.19, pvl.6370.21]
  text: "On account of these Varangians, the district of Novgorod became known as the land of Rus. The present inhabitants of Novgorod are descended from the Varangian race, but aforetime they were Slavs."
- lines: [pvl.6370.22, pvl.6370.24]
  text: "After two years, Sineus and his brother Truvor died, and Rurik assumed the sole authority. He assigned cities to his followers, Polotzk to one, Rostov to another, and to another Byeloozero."
- lines: [pvl.6370.25, pvl.6370.28]
  text: "In these cities there are thus Varangian colonists, but the first settlers were, in Novgorod, Slavs; in Polotzk, Krivichians; at Byeloozero, Ves; in Rostov, Merians; and in Murom, Muromians. Rurik had dominion over all these districts."
