# Robert Francis Harper, The Code of Hammurabi, King of Babylon (Chicago, 1904), the prologue as
# printed opposite his transliteration, verbatim from English Wikisource revision 14692280. No
# corrections. Harper's dash after "earth" is his; the span ends at his comma after "am I".
translation: harper1904
aligned_by: hand, phase 0; one span per clause group
spans:
- lines: [ch.1.1, ch.1.26]
  text: "When the lofty Anu, king of the Anunnaki, and Bel, lord of heaven and earth, he who determines the destiny of the land, committed the rule of all mankind to Marduk, the chief son of Ea; when they made him great among the Igigi; when they pronounced the lofty name of Babylon; when they made it famous among the quarters of the world and in its midst established an everlasting kingdom whose foundations were firm as heaven and earth—"
- lines: [ch.1.27, ch.1.49]
  text: "at that time, Anu and Bel called me, Hammurabi, the exalted prince, the worshiper of the gods, to cause justice to prevail in the land, to destroy the wicked and the evil, to prevent the strong from oppressing the weak, to go forth like the Sun over the Black Head Race, to enlighten the land and to further the welfare of the people."
- lines: [ch.1.50, ch.1.53]
  text: "Hammurabi, the governor named by Bel, am I,"
