# Leonard William King, Codex Hammurabi (1910), the prologue, verbatim from English Wikisource
# revision 16270720, with the wiki links removed. No corrections.
translation: king1910
aligned_by: hand, phase 0; one span per clause group
spans:
- lines: [ch.1.1, ch.1.26]
  text: "When Anu the Sublime, King of the Anunaki, and Bel, the lord of Heaven and earth, who decreed the fate of the land, assigned to Marduk, the over-ruling son of Ea, God of righteousness, dominion over earthly man, and made him great among the Igigi, they called Babylon by his illustrious name, made it great on earth, and founded an everlasting kingdom in it, whose foundations are laid so solidly as those of heaven and earth;"
- lines: [ch.1.27, ch.1.49]
  text: "then Anu and Bel called by name me, Hammurabi, the exalted prince, who feared God, to bring about the rule of righteousness in the land, to destroy the wicked and the evil-doers; so that the strong should not harm the weak; so that I should rule over the black-headed people like Shamash, and enlighten the land, to further the well-being of mankind."
- lines: [ch.1.50, ch.1.53]
  text: "Hammurabi, the prince, called of Bel am I,"
