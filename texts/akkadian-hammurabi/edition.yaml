# Weft edition of the prologue of the Laws of Hammurabi, column I, lines 1-53: the first sentence
# ("When exalted Anum ...") and the king's self-naming that follows it. The transliteration is
# R. F. Harper's (1904), from the validated transcription of his page 2 on multilingual Wikisource,
# checked verbatim against sources/harper1904-p22.txt by `weft draft`.
#
# One Weft line is one line of the stele's column as Harper numbers it. Harper separates lines
# with a bar and prints a small raised b inside some lines; his page does not say what the b marks,
# and Weft sets it aside (verify_strip), with the <sup> markup of the wiki text.
#
#   t    Harper's transliteration, verbatim. His conventions: no homophone indices; (N)i is the
#        sign NI read i; ši(g) is the sign SIG read ši; capitals are signs read as Sumerian words;
#        whole words in lower case with a circumflex (mâtim, dârî) are his readings of logograms
#   det  the determinative Harper prints raised before the word (ilu, the divine determinative)
#   sg   the signs as read today, in Oracc conventions, entered by hand and checked against the
#        stele transliteration of CDLI P249253 (Louvre Sb 8). The cuneiform row is generated from it
#   n    the Old Babylonian normalization, entered by hand. It drives the sound
