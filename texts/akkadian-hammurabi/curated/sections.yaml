# Human overlay for the prologue of the Laws of Hammurabi, column I, lines 1-53. Lemmas follow the
# headwords of Black, George and Postgate, A Concise Dictionary of Akkadian (2nd ed., 2000), with the
# mimation in brackets as the dictionary prints it; verbs under the infinitive of the G stem.
# Morphology uses Universal Dependencies features, with two Akkadian additions: Stem (G, D, Š) and
# Tense=Stative. The subordinative mood is not marked: every verb in this passage ends in a vowel
# (3rd plural -ū, dual -ā), where Akkadian adds no subordinative ending. Pronoun suffixes are shown
# in the gloss (they-decreed-for-him).
- by: Claude (Weft phase 0), for review by Skip and an Assyriologist
  date: 2026-09-30
  why: hand lemma, morphology and gloss; no treebank covers the Laws of Hammurabi
  status: draft
  set:
