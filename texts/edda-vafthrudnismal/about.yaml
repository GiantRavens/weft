  lead: 'Vafþrúðnismál (Old Norse: ''The Lay of Vafþrúðnir'') is the third poem in the Poetic Edda. It
    is a conversation in verse form conducted initially between the Æsir Odin and Frigg, and subsequently
    between Odin and the jötunn Vafþrúðnir, as they engage in a battle of wits. The poem goes into detail
    about the Norse cosmogony and was evidently used extensively as a source document by Snorri Sturluson
    in the construction of the Prose Edda who quotes it. The poem is preserved in Codex Regius and partially
    in AM 748 I 4to. There are preservation problems relating to stanzas 40-41. Vafþrúðnismál is believed
    to be a 10th century poem.'
