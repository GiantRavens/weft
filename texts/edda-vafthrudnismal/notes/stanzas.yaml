# Notes on Vafþrúðnismál.
- id: n.vaf.1.1.open
  attach: vaf.1.1
  kind: editorial
  status: draft
  text: "Vafþrúðnismál, 'the sayings of Vafþrúðnir', is a contest of knowledge in verse. Odin tells Frigg he means to visit the giant Vafþrúðnir, famed as the wisest of his kind; she warns him off (stanzas 1 to 4), one narrative stanza takes him to the hall (5), and the rest is dialogue. The speaker named above each stanza in the edition (Óðinn, Frigg, Vafþrúðnir) is shown in the stanza heading."
- id: n.vaf.1.1.metre
  attach: vaf.1.1.5
  kind: editorial
  status: draft
  text: "The metre is ljóðaháttr, the 'song measure' of Hávamál: two short lines bound by alliteration, then a full line that alliterates within itself. The coloured first letters mark the staves. Any vowel alliterates with any other vowel, and so does j, which Old Norse poets treated as a vowel sound: Frigg and fara here, alsvinna and jötun in the last line."
- id: n.vaf.8.1.gagnradr
  attach: vaf.8.1.1
  kind: editorial
  status: draft
  text: "Gagnráðr, the name Odin gives, is read as 'he who gives useful counsel' or 'he who prevails in counsel' (gagn, advantage; ráð, counsel). Odin travels under many names; the poem calls him Yggr, 'the terrible one', in stanza 5 and Aldaföðr, 'father of men', in stanzas 4 and 53."
- id: n.vaf.19.4.wager
  attach: vaf.19.4.1
  kind: editorial
  status: draft
  text: "Höfði veðja, 'wager with the head': the giant proposes that the loser forfeit his head. Bellows notes that the wager is what makes the last exchange fatal; when Vafþrúðnir cannot answer the final question he knows who his guest is, and that he has lost."
- id: n.vaf.21.1.ymir
  attach: vaf.21.1.2
  kind: editorial
  status: draft
  text: "The first answer gives the cosmogony that Snorri retells in Gylfaginning: the earth from Ymir's flesh, the mountains from his bones, the sky from his skull, the sea from his blood. Snorri quotes this stanza, and some twenty others of the poem, in the Prose Edda."
- id: n.vaf.36.6.ae
  attach: vaf.36.6.1
  kind: editorial
  status: draft
  text: "Æ is glossed 'never' here. Zoëga gives æ as 'ever'; the adverb ey, æ had both senses in Eddic verse, 'ever' and, with a following negative or in a negative context, 'never'. The sense of the line is that men do not see the wind itself, only its work, and the translators agree (Bellows: 'but never a man can see'; Thorpe: 'but him men never see')."
- id: n.vaf.43.6.nine
  attach: vaf.43.6.1
  kind: editorial
  status: draft
  text: "Níu heima, 'nine worlds': the giant claims to have visited all nine, down to Niflhel, the misty Hel below the others. Völuspá 2 uses the same count, níu heima. The poem does not list them; later writers tried to, and no two lists agree."
- id: n.vaf.49.4.hamingjur
  attach: vaf.49.4.1
  kind: editorial
  status: draft
  text: "Hamingjur: the three rivers of the previous stanza are read as the maidens of Mögþrasir, and these are called hamingjur einar, 'guardian spirits only' or 'nothing but guardian spirits'. Hamingja in the sagas is a person's luck or fortune, sometimes personified as a protecting spirit that can pass from one person to another. Bellows renders the word 'guardians', Thorpe 'hamingiur'; the stanza is one of the few places the word appears in Eddic verse."
- id: n.vaf.54.6.question
  attach: vaf.54.6.4
  kind: editorial
  status: draft
  text: "The last question, what Odin whispered in the ear of his son Baldr on the pyre, cannot be answered by anyone but Odin. By asking it he reveals himself, and the giant's answer in stanza 55 is a confession of defeat: he has contended with Odin, and Odin is the wisest of beings. The same riddle ends the Heiðreks saga contest, where the disguised Odin asks it of King Heiðrekr."
