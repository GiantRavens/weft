# Verbatim from sources/thorpe1866.txt (The Lay of Vafthrudnir); see manifest for the edition.
translation: thorpe1866
aligned_by: hand, phase 0; one span per stanza (prose); Thorpe's numbering runs with the standard text except that his print numbers both the seventh question and its answer 33, so his stanzas are taken
  in order of appearance (2026-10-08)
spans:
- lines:
  - vaf.1.1
  - vaf.1.6
  text: Counsel thou me now, Frigg! as I long to go Vafthrûdnir to visit; great desire, I say, I have, in ancient lore with that all-wise Jötun to contend.
- lines:
  - vaf.2.1
  - vaf.2.6
  text: At home to bide Hærfather I would counsel, in the gods' dwellings; because no Jötun is, I believe, so mighty as is Vafthrûdnir.
- lines:
  - vaf.3.1
  - vaf.3.6
  text: Much have I journeyed, much experienced, mighty ones many proved; but this I fain would know, how in Vafthrûdnir's halls it is.
- lines:
  - vaf.4.1
  - vaf.4.6
  text: In safety mayest thou go, in safety return; in safety on thy journeyings be; may thy wit avail thee, when thou, father of men! shalt hold converse with the Jötun.
- lines:
  - vaf.5.1
  - vaf.5.6
  text: Then went Odin the lore to prove of that all-wise Jötun. To the hall he came which Im's father owned. Ygg went forthwith in.
- lines:
  - vaf.6.1
  - vaf.6.6
  text: Hail to thee, Vafthrûdnir! to thy hall I am now come, thyself to see; for I fain would know, whether thou art a cunning and all-wise Jötun.
- lines:
  - vaf.7.1
  - vaf.7.6
  text: What man is this, that in my habitation by word addresses me? Out thou goest not from our halls, if thou art not the wiser.
- lines:
  - vaf.8.1
  - vaf.8.6
  text: Gagnrâd is my name, from my journey I am come thirsty to thy halls, needing hospitality,--for I long have journeyed--and kind reception from thee, Jötun!
- lines:
  - vaf.9.1
  - vaf.9.6
  text: Why then, Gagnrâd! speakest thou from the floor? Take in the hall a seat; then shall be proved which knows most, the guest or the ancient talker.
- lines:
  - vaf.10.1
  - vaf.10.6
  text: 'A poor man should, who to a rich man comes, speak usefully or hold his tongue: over-much talk brings him, I ween, no good, who visits an austere man.'
- lines:
  - vaf.11.1
  - vaf.11.6
  text: Tell me, Gagnrâd! since on the floor thou wilt prove thy proficiency, how the horse is called that draws each day forth over human kind?
- lines:
  - vaf.12.1
  - vaf.12.6
  text: Skinfaxi he is named, that the bright day draws forth over human kind. Of coursers he is best accounted among the Reid-goths. Ever sheds light that horse's mane.
- lines:
  - vaf.13.1
  - vaf.13.6
  text: Tell me now, Gagnrâd! since on the floor thou wilt prove thy proficiency, how that steed is called, which from the east draws night o'er the beneficent powers?
- lines:
  - vaf.14.1
  - vaf.14.6
  text: Hrimfaxi he is called, that each night draws forth over the beneficent powers. He from his bit lets fall drops every morn, whence in the dales comes dew.
- lines:
  - vaf.15.1
  - vaf.15.6
  text: Tell me, Gagnrâd! since on the floor thou wilt prove thy proficiency, how the stream is called, which earth divides between the Jötuns and the Gods?
- lines:
  - vaf.16.1
  - vaf.16.6
  text: 'Ifing the stream is called which earth divides between the Jötuns and the Gods: open shall it run throughout all time. On that stream no ice shall be.'
- lines:
  - vaf.17.1
  - vaf.17.6
  text: Tell me, Gagnrâd! since on the floor thou wilt prove thy proficiency, how that plain is called, where in fight shall meet Surt and the gentle Gods?
- lines:
  - vaf.18.1
  - vaf.18.6
  text: Vigrid the plain is called where in fight shall meet Surt and the gentle Gods; a hundred rasts it is on every side. That plain is to them decreed.
- lines:
  - vaf.19.1
  - vaf.19.6
  text: Wise art thou, O guest! Approach the Jötuns bench, and sitting let us together talk; we will our heads in the hall pledge, guest! for wise utterance.
- lines:
  - vaf.20.1
  - vaf.20.6
  text: Tell me first, if thy wit suffices, and thou, Vafthrûdnir! knowest, whence first came the earth, and the high heaven, thou, sagacious Jötun?
- lines:
  - vaf.21.1
  - vaf.21.6
  text: From Ymir's flesh the earth was formed, and from his bones the hills, the heaven from the skull of that ice-cold giant, and from his blood the sea.
- lines:
  - vaf.22.1
  - vaf.22.6
  text: Tell me secondly, if thy wit suffices, and thou, Vafthrûdnir! knowest, whence came the moon, which over mankind passes, and the sun likewise?
- lines:
  - vaf.23.1
  - vaf.23.6
  text: 'Mundilfoeri hight he, who the moon''s father is, and eke the sun''s: round heaven journey each day they must, to count years for men.'
- lines:
  - vaf.24.1
  - vaf.24.6
  text: Tell me thirdly, since thou art called wise, and if thou, Vafthrûdnir! knowest, whence came the day, which over people passes, and night with waning moons?
- lines:
  - vaf.25.1
  - vaf.25.6
  text: Delling hight he who the day's father is, but night was of Nörvi born; the new and waning moons the beneficent powers created, to count years for men.
- lines:
  - vaf.26.1
  - vaf.26.6
  text: Tell me fourthly, since they pronounce thee sage, and if thou, Vafthrûdnir! knowest, whence winter came, and warm summer first among the wise gods?
- lines:
  - vaf.27.1
  - vaf.27.3
  text: Vindsval hight he, who winter's father is, and Svâsud summer's; yearly they both shall ever journey, until the powers perish.
- lines:
  - vaf.28.1
  - vaf.28.6
  text: Tell me fifthly, since they pronounce thee sage, and if thou, Vafthrûdnir! knowest, which of the Æsir earliest, or of Ymir's sons, in days of old existed?
- lines:
  - vaf.29.1
  - vaf.29.6
  text: Countless winters, ere earth was formed, was Bergelmir born; Thrûdgelmir was his sire, his grandsire Aurgelmir.
- lines:
  - vaf.30.1
  - vaf.30.6
  text: Tell me sixthly, since thou art called wise, and if thou, Vafthrûdnir! knowest, whence first came Aurgelmir, among the Jötun's sons, thou sagacious Jötun?
- lines:
  - vaf.31.1
  - vaf.31.6
  text: 'From Elivâgar sprang venom drops, which grew till they became a Jötun; but sparks flew from the south-world: to the ice the fire gave life.'
- lines:
  - vaf.32.1
  - vaf.32.6
  text: Tell me seventhly, since thou are called wise, and if thou knowest, Vafthrûdnir! how he children begat, the bold Jötun, as he had no giantess's company?
- lines:
  - vaf.33.1
  - vaf.33.6
  text: Under the armpit grew, 'tis said, of the Hrîmthurs, a girl and boy together; foot with foot begat, of that wise Jötun, a six-headed son.
- lines:
  - vaf.34.1
  - vaf.34.6
  text: Tell me eighthly, since thou art called wise, and if thou knowest, Vafthrûdnir! what thou doest first remember, or earliest knowest? Thou art an all-wise Jötun.
- lines:
  - vaf.35.1
  - vaf.35.6
  text: Countless winters, ere earth was formed, Bergelmir was born. That I first remember, when that wise Jötun in an ark was laid.
- lines:
  - vaf.36.1
  - vaf.36.6
  text: Tell me ninthly, since thou art called wise, and if thou knowest, Vafthrûdnir! whence the wind comes, that over ocean passes, itself invisible to man?
- lines:
  - vaf.37.1
  - vaf.37.6
  text: 'Hraesvelg he is called, who at the end of heaven sits, a Jötun in an eagle''s plumage: from his wings comes, it is said, the wind, that over all men passes.'
- lines:
  - vaf.38.1
  - vaf.38.8
  text: Tell me tenthly, since thou all the origin of the gods knowest, Vafthrûdnir! whence Niörd came among the Æsir's sons? O'er fanes and offer-steads he rules by hundreds, yet was not among the Æsir
    born.
- lines:
  - vaf.39.1
  - vaf.39.6
  text: In Vanaheim wise powers him created, and to the gods a hostage gave. At the world's dissolution, he will return to the wise Vanir.
- lines:
  - vaf.40.1
  - vaf.40.6
  text: Tell me eleventhly, since all the condition of the gods thou knowest, Vafthrûdnir! what the Einheriar do in Haerfather's halls, until the powers perish?
- lines:
  - vaf.41.1
  - vaf.41.6
  text: All the Einheriar in Odin's halls each day together fight; the fallen they choose, and from the conflict ride; beer with the Æsir drink, of Saehrimnir eat their fill, then sit in harmony together.
- lines:
  - vaf.42.1
  - vaf.42.7
  text: Tell me twelfthly, as thou all the condition of the gods knowest, Vafthrûdnir! of the Jötuns' secrets, and of all the gods', say what truest is, thou all-knowing Jötun!
- lines:
  - vaf.43.1
  - vaf.43.8
  text: 'Of the secrets of the Jötuns and of all the gods, I can truly tell; for I have over each world travelled; to nine worlds I came, to Niflhel beneath: here die men from Hel.'
- lines:
  - vaf.44.1
  - vaf.44.6
  text: Much have I journeyed, much experienced, mighty ones many proved. What mortals will live, when the great "Fimbul"-winter shall from men have passed?
- lines:
  - vaf.45.1
  - vaf.45.6
  text: Lif and Lifthrasir; but they will be concealed in Hoddmimir's holt. The morning dews they will have for food. From, them shall men be born.
- lines:
  - vaf.46.1
  - vaf.46.6
  text: Much have I journeyed, much experienced, mighty ones many proved. Whence will come the sun in that fair heaven, when Fenrir has this devoured?
- lines:
  - vaf.47.1
  - vaf.47.6
  text: A daughter shall Alfrödull bear, ere Fenrir shall have swallowed her. The maid shall ride, when the powers die, on her mother's course.
- lines:
  - vaf.48.1
  - vaf.48.6
  text: Much have I journeyed, etc. Who are the maidens that o'er the ocean travel, wise of spirit, journey?
- lines:
  - vaf.49.1
  - vaf.49.6
  text: O'er people's dwellings three descend of Mögthrasir's maidens, the sole Hamingiur who are in the world, although with Jötuns nurtured.
- lines:
  - vaf.50.1
  - vaf.50.6
  text: Much have I journeyed, etc. Which of the Æsir will rule o'er the gods' possession, when Surt's fire shall be quenched?
- lines:
  - vaf.51.1
  - vaf.51.6
  text: Vidar and Vali will the gods' holy fanes inhabit, when Surt's fire shall be quenched. Môdi and Magni will Miöllnir possess, and warfare strive to end.
- lines:
  - vaf.52.1
  - vaf.52.6
  text: Much have I journeyed, etc. What of Odin will the life's end be, when the powers perish?
- lines:
  - vaf.53.1
  - vaf.53.6
  text: 'The wolf will the father of men devour; him Vidar will avenge: he his cold jaws will cleave, in conflict with the wolf.'
- lines:
  - vaf.54.1
  - vaf.54.6
  text: Much have I journeyed, etc. What said Odin in his son's ear, ere he on the pile was laid?
- lines:
  - vaf.55.1
  - vaf.55.9
  text: 'That no one knoweth, what thou in days of old saidst in thy son''s ear. With dying mouth my ancient saws I have said, and the gods'' destruction. With Odin I have contended in wise utterances:
    of men thou ever art the wisest!'
