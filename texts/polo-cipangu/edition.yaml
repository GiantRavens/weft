# Weft edition of the Cipangu chapter of Marco Polo's book in the Franco-Italian F text (Paris, BnF
# fr. 1116, early 14th century), as printed by the Société de Géographie, Voyages de Marco Polo
# (Recueil de voyages et de mémoires, tome 1, Paris, 1824), chapter CLIX, pages 182-184.
#
# No clean open transcription of this chapter exists: French Wikisource has neither the 1824 text
# nor this part of Pauthier's 1865 edition transcribed. The text here was transcribed by hand from
# the page images of the Internet Archive scan (item recueildevoyages01soci, PDF pages 244-246) and is
# checked line by line against that item's OCR text by the ocr_verify sensor in
# pipeline/weft/oldfrench.py: the OCR is joined across line-end hyphens, stripped of page numbers,
# and corrected by the list below, each correction a reading of the scan; every edition line must
# then appear in it verbatim (`weft draft` reports edition-not-in-source otherwise, and
# ocr-correction-unused for a correction that no longer matches the OCR).
#
# The print sets a space before some commas and semicolons; the check ignores spacing before
# punctuation. Weft divides the chapter into lines at the sentence, and splits the longest sentences
# at a comma or semicolon. The chapter heading, Ci devise de l'isle de Cipingu, is the section title.
#
#   t        the word as printed, punctuation attached (ysle,); the elided d’ l’ qu’ q’ ch’ s’ are
#            tokens of their own, glued to the next word
#   n        the word in the spelling of central French about 1300 (que for qe, vos for voz, genz
#            for jens), typed by hand; letters only, never the grammar. The page shows it as
#            "Central French spelling", and the first sound scheme is looked up from it
#            (pipeline/weft/data/fro_lexicon.yaml); the second reads the printed form t.
#   glue     no space follows
