# Notes for the Cipangu chapter of Marco Polo's book, F text (Société de Géographie, 1824), chapter CLIX.
- id: n.polo.159.name
  attach: polo.159.1.1
  kind: editorial
  status: draft
  leans_on: "Yule and Cordier, The Book of Ser Marco Polo (1903), vol. 2, book III, chapter II, note 1; the spellings of the 1824 print (chapters CLVIII-CLIX) and of Pauthier's edition (1865, chapter CLVIII)"
  text: "Cipangu is the name the book gives Japan. Since the 19th century it has been read as a Chinese name, Riben guo, the country of the origin of the sun, of which the Japanese Nippon is a form; Yule gives it as Jih-pên-kwé. The final -gu is taken to render guo, country. The book itself does not say where the name came from, and which Chinese pronunciation lies behind the Italian spelling is not settled. The spelling varies within a few lines of this print: the chapter before ends with Zipungu, the heading reads Cipingu, and the chapter opens with Cypungu. Pauthier's French text has Sypangu, and Ramusio's Italian, which Marsden translates, has Zipangu. The form Cipangu used in modern writing is a later normalization."
- id: n.polo.159.gold
  attach: polo.159.5
  kind: editorial
  status: draft
  leans_on: "the chapter itself; Yule and Cordier (1903), notes 2 and 3 to book III, chapter II; Charlotte von Verschuer, Across the Perilous Sea: Japanese Trade with China and Korea from the Seventh to the Sixteenth Centuries (2006), on gold among Japanese exports"
  text: "The chapter does not say that Polo went to Cipangu, and nothing in the book claims that he did. Its account of the gold is reported, and it gives its own reason: the gold is found there beyond measure, and no merchant goes there from the mainland, so the gold stays. The palace roofed with gold, with floors of gold two fingers thick, is told as a marvel (une grant mervoie) of the lord of the island. Yule called the palace story an old tale repeated over generations and cited a Chinese account of a Japanese royal palace shining with gold. The general report of Japanese gold had a basis in trade, since Japan exported gold to China before and during Polo's time; the gold roof is not confirmed by any source pinned here, and the chapter is better read as evidence of what was said about Japan in China than as a description of a building."
- id: n.polo.159.invasions
  attach: polo.159.17
  kind: editorial
  status: draft
  leans_on: "Yule and Cordier (1903), note 1 to book III, chapter III, drawing on Titsingh's translation of the Japanese annals, Gaubil and De Mailla; Thomas D. Conlan, In Little Need of Divine Intervention (2001), for the two campaigns"
  text: "Kublai sent two fleets against Japan, in 1274 and in 1281. The chapter describes one expedition, and its details fit the second better: a fleet sailing from southern Chinese ports (the chapter names Zaiton, modern Quanzhou, and Quinsai, modern Hangzhou), commanders at odds, a storm that wrecked the fleet off the coast, and a large body of men left behind. The 1281 campaign combined a fleet from Korea with a larger one from southern China, and a storm in the seventh month destroyed much of it; Japanese sources were later to treat such storms as divine winds. Yule identified Abatan with the commander called Asikan in the Japanese annals, who fell ill on the passage, and suggested that Vonsanicin is Fan Wenhu with a Chinese title meaning general. The figure of thirty thousand men stranded appears also in the annals Yule quotes, as the number of Mongol soldiers captured and killed. The chapter's north wind (tramontaine) and its storm before any city had been taken are its own; the next chapter's account of the stranded men capturing the island's capital is not supported by the histories, as Yule already noted."
- id: n.polo.159.wind
  attach: polo.159.26.7
  kind: editorial
  status: draft
  leans_on: "the 1824 print, page 183; the translations of Yule (1903) and Marsden (1818)"
  text: "The 1824 print reads le lune à tramontaine vent si fort, which taken word by word says that the moon blows hard from the north. The sense requires a wind, and both translations here have a north wind. Whether the slip lies in the manuscript or in the 1824 transcription cannot be decided from the sources pinned for this edition, so the edition keeps lune and glosses it as printed. The same caution applies to à no Abatan, where à non, by name, is the expected phrase, and to les que, where lequel is expected."
- id: n.polo.159.rustichello
  attach: polo.159.21
  kind: editorial
  status: draft
  leans_on: "the prologue of the F text (1824 edition, chapter I); Yule and Cordier (1903), introduction, on Rustichello's Arthurian compilation"
  text: "The book's prologue says that it was written down in 1298 in the prison of Genoa by Rustichello of Pisa from what Marco Polo told him. Rustichello was already the author of a compilation of Arthurian romance in French prose. Several phrases in this chapter are the stock formulas of that kind of narration: Et qe voz en diroie? (and what more should I tell you?), Or sachiés que (now know that), and the closing Or laison de cesti ... et noz retorneron à celz (now let us leave these and return to those), with which a romance narrator moves between two groups of characters. The formulas are evidence of how the book was written down. They do not show which details of the account came from Polo and which from his scribe, and that division cannot be recovered from the text."
- id: n.polo.159.versions
  attach: polo.159.13
  kind: editorial
  status: draft
  leans_on: "the 1824 edition's preface; Pauthier's edition (1865); L. F. Benedetto, Il Milione (1928), for the classification of the versions; the translations of Yule (1903) and Marsden (1818)"
  text: "The book survives in many versions and no autograph. The F text printed here, Paris BnF fr. 1116, is a Franco-Italian manuscript of the early 14th century and is generally held to be the closest surviving copy to the lost original. Other versions are a French redaction associated with the name Grégoire, which Pauthier edited in 1865 and Yule used as his base; Tuscan and Venetian translations; the Latin of Francesco Pipino; and the Italian printed by Ramusio in 1559, which contains passages that no other known version shared until a Latin manuscript in Toledo (called Z) was identified in the 20th century. The two translations here show the differences. Yule's square brackets mark what he added from Ramusio, such as the export ban on gold and the burial of the dead with a pearl in the mouth, and Marsden, who translates Ramusio throughout, places the men protected by stones in this chapter, where F tells of them in the next."
- id: n.polo.159.columbus
  attach: polo.159.1
  kind: editorial
  status: draft
  leans_on: "Columbus's copy of Pipino's Latin version (printed by Gerard Leeu, about 1483-1485), Biblioteca Colombina, Seville, edited with its notes by Juan Gil (1987); the journal of the first voyage in Las Casas's abstract, entries of 21-24 October 1492; the letter of John Day to Columbus (about 1497-98)"
  text: "This chapter is the earliest surviving European account of Japan, and its picture of a rich island in the ocean east of China reached Christopher Columbus. On the first voyage, in October 1492, his journal (known only in Las Casas's abstract) records that he believed Cuba to be Cipango. His own copy of Polo, a printed Latin version of about 1483-1485, survives in Seville with notes in his hand. When he read and annotated it is disputed: a letter from the English merchant John Day, written about 1497-98, speaks of sending him a copy of Marco Polo, and some scholars date the notes after the first voyage. The direct line from this chapter to Columbus is therefore secure for the name and the expectation of gold, and uncertain for his reading of this particular text before he sailed. Martin Behaim's globe of 1492 shows Cipangu as a large island in the open ocean east of Asia, the position the chapter's distance from the mainland suggests."
- id: n.polo.159.sound
  attach: polo.159.3
  kind: editorial
  status: draft
  leans_on: "Kristoffer Nyrop, Grammaire historique de la langue française, vol. 1 (1899); Mildred K. Pope, From Latin to Modern French (1934); the spellings of the F text"
  text: "The first sound scheme gives the French of about 1300 in the Paris norm and is approximate. In it the oi of voiramant is weh, s before a consonant is silent with a long vowel before it (isle, nostre), ch and j are the affricates of church and judge, and nasal vowels keep their n. A final consonant is sounded at a pause and before a vowel and dropped before a consonant, a pattern whose extent by 1300 is the least certain point. This scheme models the language the book is written in, not its writers: Polo was Venetian and Rustichello Pisan. The second scheme is a hypothesis about an Italian reader, who would give the letters their Italian values. The spelling shows Italian letter habits applied to French: qe and ch'à write the k sound as Italian does, where French ch was the sound of church, and blances writes French ch as c before e, an Italian way of spelling that sound. Other spellings record French sounds, such as voiramant, whose -mant for -ment reflects the French merger of en with an. Such spellings show how the writers spelled, not how far their speech was Italian, and no grammarian of the period describes an Italian reading, so the second scheme rests on spelling alone."
