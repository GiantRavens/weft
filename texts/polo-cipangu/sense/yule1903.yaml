# Henry Yule, The Book of Ser Marco Polo (1871), third edition revised by Henri Cordier (1903),
# volume 2, book III, chapter II, verbatim from Project Gutenberg #12410. Yule's chapter II covers
# the same events as F chapter CLIX and ends at the same point. Square brackets are Yule's own: they
# mark passages he took from other versions (here Ramusio's Italian).
# Removed: Yule's note markers ({1} to {4}) and the illustration caption printed inside the chapter.
# No other corrections.
translation: yule1903
aligned_by: hand, phase 0; one span per paragraph of Yule, matched to the F lines it renders
spans:
- lines: [polo.159.1, polo.159.2]
  text: "Chipangu is an Island towards the east in the high seas, 1500 miles distant from the Continent; and a very great Island it is."
- lines: [polo.159.3, polo.159.6]
  text: "The people are white, civilized, and well-favoured. They are Idolaters, and are dependent on nobody. And I can tell you the quantity of gold they have is endless; for they find it in their own Islands, [and the King does not allow it to be exported. Moreover] few merchants visit the country because it is so far from the main land, and thus it comes to pass that their gold is abundant beyond all measure."
- lines: [polo.159.7, polo.159.12]
  text: "I will tell you a wonderful thing about the Palace of the Lord of that Island. You must know that he hath a great Palace which is entirely roofed with fine gold, just as our churches are roofed with lead, insomuch that it would scarcely be possible to estimate its value. Moreover, all the pavement of the Palace, and the floors of its chambers, are entirely of gold, in plates like slabs of stone, a good two fingers thick; and the windows also are of gold, so that altogether the richness of this Palace is past all bounds and all belief."
- lines: [polo.159.13, polo.159.16]
  text: "They have also pearls in abundance, which are of a rose colour, but fine, big, and round, and quite as valuable as the white ones. [In this Island some of the dead are buried, and others are burnt. When a body is burnt, they put one of these pearls in the mouth, for such is their custom.] They have also quantities of other precious stones."
- lines: [polo.159.17, polo.159.24]
  text: "Cublay, the Grand Kaan who now reigneth, having heard much of the immense wealth that was in this Island, formed a plan to get possession of it. For this purpose he sent two of his Barons with a great navy, and a great force of horse and foot. These Barons were able and valiant men, one of them called ABACAN and the other VONSAINCHIN, and they weighed with all their company from the ports of Zayton and Kinsay, and put out to sea. They sailed until they reached the Island aforesaid, and there they landed, and occupied the open country and the villages, but did not succeed in getting possession of any city or castle. And so a disaster befel them, as I shall now relate."
- lines: [polo.159.25, polo.159.30]
  text: "You must know that there was much ill-will between those two Barons, so that one would do nothing to help the other. And it came to pass that there arose a north wind which blew with great fury, and caused great damage along the coasts of that Island, for its harbours were few. It blew so hard that the Great Kaan’s fleet could not stand against it. And when the chiefs saw that, they came to the conclusion that if the ships remained where they were the whole navy would perish. So they all got on board and made sail to leave the country. But when they had gone about four miles they came to a small Island, on which they were driven ashore in spite of all they could do; and a large part of the fleet was wrecked, and a great multitude of the force perished, so that there escaped only some 30,000 men, who took refuge on this Island."
- lines: [polo.159.31, polo.159.34]
  text: "These held themselves for dead men, for they were without food, and knew not what to do, and they were in great despair when they saw that such of the ships as had escaped the storm were making full sail for their own country without the slightest sign of turning back to help them. And this was because of the bitter hatred between the two Barons in command of the force; for the Baron who escaped never showed the slightest desire to return to his colleague who was left upon the Island in the way you have heard; though he might easily have done so after the storm ceased; and it endured not long. He did nothing of the kind, however, but made straight for home. And you must know that the Island to which the soldiers had escaped was uninhabited; there was not a creature upon it but themselves. Now we will tell you what befel those who escaped on the fleet, and also those who were left upon the Island."
