# William Marsden, The Travels of Marco Polo, a Venetian, in the Thirteenth Century (London, 1818),
# book III, chapter II, "Of the island of Zipangu", pages 569-571, translated from Ramusio's Italian
# (1559). Transcribed from the page images of Internet Archive item india.history.resource.100588
# (PDF pages 656-658), because the item's OCR text garbles this chapter and drops part of a sentence.
# Removed: Marsden's note numbers (1132 to 1142) and the italics of names; the small capitals of the
# opening word are set as Zipangu; spaces before semicolons are closed up. No words changed.
# Ramusio's chapter orders the events differently from F and continues past the end of the F chapter;
# the spans follow the F lines by subject, and the last span stops where the F chapter's events end.
translation: marsden1818
aligned_by: hand, phase 0; spans matched by subject, since Ramusio reorders and adds
spans:
- lines: [polo.159.1, polo.159.4]
  text: "Zipangu is an island in the eastern ocean, situated at the distance of about fifteen hundred miles from the main land or coast of Manji. It is of considerable size; its inhabitants have fair complexions, are well made, and are civilised in their manners. Their religion is the worship of idols. They are independent of every foreign power, and governed only by their own kings."
- lines: [polo.159.5, polo.159.6]
  text: "They have gold in the greatest abundance, its sources being inexhaustible, but as the king does not allow of its being exported, few merchants visit the country, nor is it frequented by much shipping from other parts."
- lines: [polo.159.7, polo.159.12]
  text: "To this circumstance we are to attribute the extraordinary richness of the sovereign’s palace, according to what we are told by those who have access to the place. The entire roof is covered with a plating of gold, in the same manner as we cover houses, or more properly churches, with lead. The ceilings of the halls are of the same precious metal; many of the apartments have small tables of pure gold considerably thick; and the windows also have golden ornaments. So vast, indeed, are the riches of the palace, that it is impossible to convey an idea of them."
- lines: [polo.159.13, polo.159.16]
  text: "In this island there are pearls also, in large quantities, of a red (pink) colour, round in shape, and of great size; equal in value to, or even exceeding that of the white pearls. It is customary with one part of the inhabitants to bury their dead, and with another part, to burn them. The former have a practice of putting one of these pearls into the mouth of the corpse. There are also found there a number of precious stones."
- lines: [polo.159.17, polo.159.25]
  text: "Of so great celebrity was the wealth of this island, that a desire was excited in the breast of the Grand khan, Kublaï, now reigning, to make the conquest of it, and to annex it to his dominions. In order to effect this, he fitted out a numerous fleet, and embarked a large body of troops, under the command of two of his principal officers, one of whom was named Abbacatan, and the other, Vonsancin. The expedition sailed from the ports of Zaitun and Kinsai, and crossing the intermediate sea, reached the island in safety; but in consequence of a jealousy that arose between the two commanders, one of whom treated the plans of the other with contempt and resisted the execution of his orders, they were unable to gain possession of any city or fortified place, with the exception of one only, which was carried by assault, the garrison having refused to surrender. Directions were given for putting the whole to the sword, and in obedience thereto the heads of all were cut off, excepting of eight persons, who by the efficacy of a diabolical charm, consisting of a jewel or amulet introduced into the right arm, between the skin and the flesh, were rendered secure from the effects of iron, either to kill or wound. Upon this discovery being made, they were beaten with a heavy wooden club, and presently died."
- lines: [polo.159.26, polo.159.34]
  text: "It happened after some time that a north wind began to blow with great force, and the ships of the Tartars, which lay near the shore of the island, were driven foul of each other. It was determined thereupon, in a council of the officers on board, that they ought to disengage themselves from the land; and accordingly, as soon as the troops were reembarked, they stood out to sea. The gale however increased to so violent a degree, that a number of the vessels foundered. The people belonging to them, by floating upon pieces of the wreck, saved themselves upon an island lying about four miles from the coast of Zipangu. The other ships, which not being so near to the land, did not suffer from the storm, and on which the two chiefs were embarked, together with the principal officers, or those whose rank entitled them to command an hundred thousand or ten thousand men, directed their course homewards, and returned to the Grand khan. Those of the Tartars who remained upon the island where they were wrecked, and who amounted to about thirty thousand men, finding themselves left without shipping, abandoned by their leaders, and having neither arms nor provisions, expected nothing less than to become captives or to perish; especially as the island afforded no habitations where they could take shelter and refresh themselves."
