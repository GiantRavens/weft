# Dictionnaire de l'ancienne langue française (1880-1902), and Tobler-Lommatzsch, Altfranzösisches
# Wörterbuch; Italian words (da, cum, con) keep their own form. Morphology uses Universal
# Dependencies features as in UD French-GSD. Glosses keep the word order and the text's own
# irregularities (plural grandismes ysles after a singular subject; sunt with no subject).
