# A. L. Sadler, 'The Heike Monogatari', TASJ 46 pt 2 (1918), pp. 1-2, from the Internet Archive OCR
# (TheHeikeMonogatari), checked against a second scan (in.ernet.dli.2015.70945). Corrections: 'King and
# Emperors' to 'Kings and Emperors' (the second scan); a stray 'M' at the page break removed; note markers
# [1]-[7] removed; spaces before ';' removed. Not corrected: 'Ono of Kan' (王莽, Ōmō), which the second scan reads 'Omo'. Sadler's sentences cross the Japanese lines, so spans join lines.
translation: sadler1918
aligned_by: hand
spans:
- lines:
  - hk.1.1
  - hk.1.2
  text: The sound of the bell of Gionshoja echoes the impermanence of all things. The hue of the flowers of the teak tree declares that they who flourish must be brought low.
- lines:
  - hk.1.3
  - hk.1.3
  text: Yea, the proud ones are but for a moment, like an evening dream in springtime.
- lines:
  - hk.1.4
  - hk.1.4
  text: The mighty are destroyed at the last, they are but as the dust before the wind.
- lines:
  - hk.1.5
  - hk.1.7
  text: If thou ask concerning the rulers of other countries far off; Choko of Shin, Ono of Kan, Shui of Ryo, Rokuzan of To, all these, not following in the paths of the government of all the Kings and
    Emperors who went before them, sought pleasure only; not entering into council nor heeding the disorders of their Country, having no knowledge of the affliction of their people, they did not endure,
    but perished utterly.
- lines:
  - hk.1.8
  - hk.1.11
  text: So also if thou enquire concerning our own country, Masakado in the period Shohei, Sumitomo in Tenkyo, Gishin in Kowa, Shinrai in Heiji, all were arrogant and bold of heart in divers manners, yet
    if we consider what is told of the former Prime Minister Prince Taira no Ason Kiyomori, the Lay priest of Rokuhara, of a more recent time, neither in their words nor their intentions were they his equal.
