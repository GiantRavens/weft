# Weft editorial translation (draft), line by line, close to the Japanese.
translation: weft-editorial
aligned_by: hand
spans:
- lines:
  - hk.1.1
  - hk.1.1
  text: The voice of the bell of Gion Shōja has the echo of the impermanence of all things;
- lines:
  - hk.1.2
  - hk.1.2
  text: the colour of the flowers of the twin sāla trees shows the principle that the flourishing must decline.
- lines:
  - hk.1.3
  - hk.1.3
  text: The proud do not last long; they are only like a dream on a spring night.
- lines:
  - hk.1.4
  - hk.1.4
  text: The fierce, too, perish in the end; they are simply the same as dust before the wind.
- lines:
  - hk.1.5
  - hk.1.5
  text: 'If we inquire far off, into foreign courts: Zhao Gao of Qin, Wang Mang of Han, Zhou Yi of Liang, Lushan of Tang,'
- lines:
  - hk.1.6
  - hk.1.6
  text: all these followed neither the rule of the lords and emperors before them, went to the limit of pleasure, and did not take admonition to heart;
- lines:
  - hk.1.7
  - hk.1.7
  text: they did not perceive that the realm would fall into disorder and did not know what the people grieved over, and so before long they were men who perished.
- lines:
  - hk.1.8
  - hk.1.8
  text: 'If we look near at hand, into our own court: Masakado of Jōhei, Sumitomo of Tengyō, Yoshichika of Kōwa, Nobuyori of Heiji,'
- lines:
  - hk.1.9
  - hk.1.9
  text: all these, in pride and in fierceness of heart, were each different,
- lines:
  - hk.1.10
  - hk.1.10
  text: but closest to us is the man called the lay monk of Rokuhara, the former chancellor, Lord Taira no Ason Kiyomori;
- lines:
  - hk.1.11
  - hk.1.11
  text: what is handed down and heard of him is beyond the reach of mind and words.
