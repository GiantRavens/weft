# Weft edition of the Brindisi of La traviata (Act I; libretto by Francesco Maria Piave, Venice 1853), from Alfredo's
# 'Libiam ne' lieti calici' to the exchange with Violetta. Text of Italian Wikisource, from the Ricordi libretto scan
# (Pagina:La traviata.djvu/7, validated); each line is checked verbatim against the pinned revision. verify_strip sets
# aside the speaker templates, the italic stage directions, the line-leading colons and the page templates.
# The librettist's spelling is kept (Poichè, Nè, perchè, sè with the grave; innebrii; lagrima); the work's own
# lexicon.yaml gives each word its stress and vowel quality.
#   t     the word as printed, punctuation attached (the ellipses of Godiam... are the libretto's)
#   Lines are the verses; sections are the speeches, named for the singer.
work: verdi-traviata
joiner: ' '
verify_strip: (?sm)<noinclude>.*?</noinclude>|\{\{T\|(?:[^{}]|\{\{[^{}]*\}\})*\}\}|''\([^)]*\)''|''[^']*''|\{\{[^{}]*\}\}|<[^>]+>|^[:;]+
verify_corrections:
- ocr: guisto
  print: giusto
  in: sources/otello-2-2.txt
sections:
