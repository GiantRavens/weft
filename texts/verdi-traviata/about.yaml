  lead: 'La traviata (Italian: [la traviˈaːta, -aˈvjaː-]; The Wayward Woman) is an opera in three acts
    by Giuseppe Verdi set to an Italian libretto by Francesco Maria Piave. It is based on La Dame aux
    camélias (1852), a play by Alexandre Dumas fils, which he adapted from his own 1848 novel. The opera
    was originally titled Violetta, after the main character. It was first performed on 6 March 1853 at
    La Fenice opera house in Venice.'
