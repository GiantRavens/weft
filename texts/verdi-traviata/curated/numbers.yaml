# Human overlay for the Verdi number. No treebank covers the libretti; lemma, morphology and gloss are by hand (UD
# Italian conventions, as for the Dante and Petrarch works): the poetic apocopes keep the full lemma (amor: amore,
# fior: fiore, cuor: cuore, avel: avello), the elided forms are glossed as one word (l'uom man, dell'avel of-the-grave),
# and the first-person plural imperatives of the Brindisi as let-us- (Libiam let-us-drink, Godiam let-us-enjoy).
