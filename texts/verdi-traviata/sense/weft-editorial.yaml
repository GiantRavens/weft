# Weft's editorial translation, close to the Italian, one span per speech; draft. The Victorian singing versions (Natalia Macfarren's Traviata for Novello; Francis Hueffer's Otello for Ricordi, 1887) are cited in the manifest, not printed.
translation: weft-editorial
aligned_by: 'hand: one span per speech'
spans:
- lines:
  - vl.alfredo1.1
  - vl.alfredo1.8
  text: Let us drink from the joyful cups that beauty adorns with flowers, and let the fleeting hour grow drunk with pleasure. Let us drink in the sweet tremblings that love arouses, since that eye goes
    all-powerful to the heart.
- lines:
  - vl.tutti1.1
  - vl.tutti1.2
  text: Let us drink; among the cups love will have warmer kisses.
- lines:
  - vl.violetta1.1
  - vl.violetta1.8
  text: 'Among you I shall know how to share my merry time; all in the world is folly that is not pleasure. Let us enjoy: fleeting and swift is the joy of love; it is a flower that is born and dies, nor
    can one enjoy it any more.'
- lines:
  - vl.tutti2.1
  - vl.tutti2.6
  text: 'Let us enjoy: a fervent, flattering voice invites us. Let us enjoy: the cup and the song make the nights fair, and laughter; in this paradise may the new day find us.'
- lines:
  - vl.violetta2.1
  - vl.violetta2.1
  text: Life is in revelry...
- lines:
  - vl.alfredo2.1
  - vl.alfredo2.1
  text: When one is not yet in love.
- lines:
  - vl.violetta3.1
  - vl.violetta3.1
  text: Do not say it to one who knows nothing of it...
- lines:
  - vl.alfredo3.1
  - vl.alfredo3.1
  text: That is my destiny...
