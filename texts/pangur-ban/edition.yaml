# Weft edition of Pangur Bán, the Old Irish poem of the Reichenau Primer (Stift St. Paul im Lavanttal,
# Cod. 86b/1, fol. 1v), in the text of Stokes and Strachan, Thesaurus Palaeohibernicus, vol. 2 (1903),
# pp. 293-294, from multilingual Wikisource (pinned in the manifest). Each line is checked verbatim
# against the pinned pages; verify_strip sets aside the page's templates, footnotes and the
# italics of the editors' expansions (ocus for the manuscript's sign, the supplied m of fristarddam
# and fuachimm).
#
# The print keeps the manuscript's long lines, two to a quatrain, divided by a point. Weft's lines are
# the poem's metrical lines, four to a quatrain: the metre is deibide, seven syllables to the line.
#
#   t        the word as printed, punctuation attached. The manuscript writes a proclitic with the
#            word it leans on (innar, arnáthius, hinglen), and t keeps that division.
#   n        Weft's normalized spelling, from which the sound is read (pipeline/weft/oldirish.py):
#            long vowels marked; a dot over a letter for lenition the manuscript does not write
#            (ṁenma after a "his" and mu "my"); n- for nasalization (n-doraid); a middle dot after a
#            pretonic preverb (du·fuit, stress on fuit); a hyphen before an enclitic (menma-sam); a
#            diaeresis for two vowels in hiatus (ru·biäm); a word the manuscript joins is split
#            (innar: inar; arnáthius: ar n-áthius). The normalization is Weft's own, draft.
work: pangur-ban
joiner: ' '
verify_strip: <ref>.*?</ref>|\{\{[^{}]*\}\}|<[^>]+>|''|&emsp;
