# Whitley Stokes and John Strachan, Thesaurus Palaeohibernicus, vol. 2 (1903), pp. 293-294: the literal
# translation printed facing the text, verbatim from the pinned Wikisource pages (sources/tp2-p339.txt,
# tp2-p340.txt); their footnote references are left out. One span per long line of the print, which is
# two of Weft's lines.
translation: stokes-strachan1903
aligned_by: hand, phase 0; one span per long line of the print
spans:
- lines: [pan.1.1, pan.1.2]
  text: 'I and Pangur Bán, each of us two at his special art:'
- lines: [pan.1.3, pan.1.4]
  text: 'his mind is at hunting (mice), my own mind is in my special craft.'
- lines: [pan.2.1, pan.2.2]
  text: 'I love to rest—better than any fame—at my booklet with diligent science:'
- lines: [pan.2.3, pan.2.4]
  text: 'not envious of me is Pangur Bán: he himself loves his childish art.'
- lines: [pan.3.1, pan.3.2]
  text: 'When we are—tale without tedium—in our house, we two alone,'
- lines: [pan.3.3, pan.3.4]
  text: 'we have—unlimited (is) feat-sport—something to which to apply our acuteness.'
- lines: [pan.4.1, pan.4.2]
  text: 'It is customary at times by feats of valour, that a mouse sticks in his net,'
- lines: [pan.4.3, pan.4.4]
  text: 'and for me there falls into my net a difficult dictum with hard meaning.'
- lines: [pan.5.1, pan.5.2]
  text: 'His eye, this glancing full one, he points against the wall-fence:'
- lines: [pan.5.3, pan.5.4]
  text: 'I myself against the keenness of science point my clear eye, though it is very feeble.'
- lines: [pan.6.1, pan.6.2]
  text: 'He is joyous with speedy going where a mouse sticks in his sharp claw:'
- lines: [pan.6.3, pan.6.4]
  text: 'I too am joyous, where I understand a difficult dear question.'
- lines: [pan.7.1, pan.7.2]
  text: 'Though we are thus always, neither hinders the other:'
- lines: [pan.7.3, pan.7.4]
  text: 'each of us two likes his art, amuses himself alone.'
- lines: [pan.8.1, pan.8.2]
  text: 'He himself is master of the work which he does every day:'
- lines: [pan.8.3, pan.8.4]
  text: 'while I am at my own work, (which is) to bring difficulty to clearness.'
