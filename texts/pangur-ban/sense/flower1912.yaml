# Robin Flower, 'The Student and his Cat', in Eleanor Hull, The Poem-Book of the Gael (London, 1912),
# verbatim from Project Gutenberg 46917 (sources/flower1912.txt). One span per quatrain: Flower's eight
# rhymed quatrains follow the poem's eight in order, freely within each. Hull's headnote, which places
# the poem on a copy of St. Paul's Epistles at the close of the eighth century, is not reproduced; the
# notes give the manuscript as it is now described.
translation: flower1912
aligned_by: hand, phase 0; one span per quatrain
spans:
- lines:
  - pan.1.1
  - pan.1.4
  text: 'I and Pangur Bán, my cat,

    ''Tis a like task we are at;

    Hunting mice is his delight,

    Hunting words I sit all night.'
- lines:
  - pan.2.1
  - pan.2.4
  text: 'Better far than praise of men

    ''Tis to sit with book and pen;

    Pangur bears me no ill-will,

    He, too, plies his simple skill.'
- lines:
  - pan.3.1
  - pan.3.4
  text: '''Tis a merry thing to see

    At our tasks how glad are we,

    When at home we sit and find

    Entertainment to our mind.'
- lines:
  - pan.4.1
  - pan.4.4
  text: 'Oftentimes a mouse will stray

    In the hero Pangur''s way;

    Oftentimes my keen thought set

    Takes a meaning in its net.'
- lines:
  - pan.5.1
  - pan.5.4
  text: '''Gainst the wall he sets his eye

    Full and fierce and sharp and sly;

    ''Gainst the wall of knowledge I

    All my little wisdom try.'
- lines:
  - pan.6.1
  - pan.6.4
  text: 'When a mouse darts from its den,

    O! how glad is Pangur then;

    O! what gladness do I prove

    When I solve the doubts I love.'
- lines:
  - pan.7.1
  - pan.7.4
  text: 'So in peace our task we ply,

    Pangur Bán, my cat, and I;

    In our arts we find our bliss,

    I have mine, and he has his.'
- lines:
  - pan.8.1
  - pan.8.4
  text: 'Practice every day has made

    Pangur perfect in his trade;

    I get wisdom day and night,

    Turning darkness into light.'
