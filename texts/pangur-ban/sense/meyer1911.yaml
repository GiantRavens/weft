# Kuno Meyer, Selections from Ancient Irish Poetry (London, 1911), pp. 81-82, 'The Monk and his Pet
# Cat', verbatim from the pinned English Wikisource pages (sources/meyer1911-p81.txt, -p82.txt). One
# span per quatrain; Meyer keeps the poem's quatrains and their order.
translation: meyer1911
aligned_by: hand, phase 0; one span per quatrain
spans:
- lines:
  - pan.1.1
  - pan.1.4
  text: 'I and my white Pangur

    Have each his special art:

    His mind is set on hunting mice,

    Mine is upon my special craft.'
- lines:
  - pan.2.1
  - pan.2.4
  text: 'I love to rest—better than any fame!—

    With close study at my little book:

    White Pangur does not envy me:

    He loves his childish play.'
- lines:
  - pan.3.1
  - pan.3.4
  text: 'When in our house we two are all alone—

    A tale without tedium!

    We have—sport never-ending!

    Something to exercise our wit.'
- lines:
  - pan.4.1
  - pan.4.4
  text: 'At times by feats of derring-do

    A mouse sticks in his net,

    While into my net there drops

    A difficult problem of hard meaning.'
- lines:
  - pan.5.1
  - pan.5.4
  text: 'He points his full shining eye

    Against the fence of the wall:

    I point my clear though feeble eye

    Against the keenness of science.'
- lines:
  - pan.6.1
  - pan.6.4
  text: 'He rejoices with quick leaps

    When in his sharp claw sticks a mouse:

    I too rejoice when I have grasped

    A problem difficult and dearly loved.'
- lines:
  - pan.7.1
  - pan.7.4
  text: 'Though we are thus at all times,

    Neither hinders the other,

    Each of us pleased with his own art

    Amuses himself alone.'
- lines:
  - pan.8.1
  - pan.8.4
  text: 'He is a master of the work

    Which every day he does:

    While I am at my own work

    To bring difficulty to clearness.'
