  lead: '"Pangur Bán" is an Old Irish poem written in about the 9th century at or near Reichenau Abbey,
    in what is now Germany, by an Irish monk about his cat. Pangur Bán, meaning "White Pangur", is the
    cat''s name. Although the poem is anonymous, it bears similarities to the poetry of Sedulius Scottus,
    prompting speculation that he is the author. In eight verses of four lines each, the author compares
    the cat''s happy hunting with his own scholarly pursuits.'
