# Notes for Pangur Bán.
- id: n.pan.manuscript
  attach: pan.1.1
  kind: editorial
  status: draft
  text: "The poem survives in one manuscript, the Reichenau Primer, now at the abbey of St. Paul im Lavanttal in Carinthia (Cod. 86b/1, fol. 1v). The book is the notebook of an Irish scholar working on the Continent in the 9th century, probably at or near Reichenau Abbey on Lake Constance. Besides this poem it holds notes on a commentary on the Aeneid, hymns, a short Greek glossary and Greek declensions, notes on biblical places, a tract on the nature of angels, and astronomy (Gregory Toner, Cambrian Medieval Celtic Studies 57, 2009). Eleanor Hull's headnote to Flower's translation (1912) places the poem on a copy of St. Paul's Epistles at the close of the 8th century; the manuscript is described differently now."
- id: n.pan.name
  attach: pan.1.1.3
  kind: editorial
  status: draft
  text: "Bán is 'white'. Pangur is not an Old Irish word. W. J. Gruffydd (1933) proposed that it is an old spelling of Welsh pannwr, 'fuller', and that the name suits a white cat because fullers were whitened by the fuller's earth they worked with (cited by Gerard Murphy, Early Irish Lyrics, 1956, p. 172). The proposal is not proven."
- id: n.pan.metre
  attach: pan.1.2
  kind: editorial
  status: draft
  text: "Gerard Murphy describes the metre as deibide: seven syllables in each line, the stressed final syllable of the first line of each pair rhyming with the unstressed final syllable of the second (Early Irish Lyrics, 1956). Here Bán rhymes with saindan, whose stress falls on sain-. The sound row gives seven syllables in every one of the 32 lines; it reads them from Weft's normalized spelling, so the count tests the normalization as well as the metre."
- id: n.pan.spelling
  attach: pan.3.2
  kind: editorial
  status: draft
  text: "The manuscript writes a small unstressed word together with the word it leans on: innar is i n-ar 'in our', arnáthius is ar n-áthius 'our acuteness', hinglen is i n-glen 'in which sticks'. The text printed here is Stokes and Strachan's, which keeps that division; the row of normalized spelling separates the words and marks what the scribe left unwritten. The editors' italics mark their own additions: ocus written out for the manuscript's abbreviation, and the m they supply in fristarddam (line 12) and fuachimm (line 19)."
- id: n.pan.author
  attach: pan.8.4.6
  kind: editorial
  status: draft
  text: "The poem is anonymous. David Greene and Frank O'Connor (A Golden Treasury of Irish Poetry, 1967) noted resemblances to the poetry of Sedulius Scottus, an Irish scholar active at Liège in the mid-9th century, and the attribution to him has been suggested since. Nothing in the manuscript names the writer. The poem begins and ends with messe, 'I myself'."
- id: n.pan.net
  attach: pan.4.2
  kind: editorial
  status: draft
  text: "The quatrains set the cat and the scholar side by side, and from quatrain 4 the same word serves both: the mouse sticks in the cat's lín, 'net', and into the scholar's lín falls a dliged doraid, 'a difficult rule'. Dliged is the word for a rule of law or of grammar. The eye of quatrain 5, the joy of quatrain 6 and the work of quatrain 8 are paired in the same way."
- id: n.pan.clear
  attach: pan.8.3
  kind: editorial
  status: draft
  text: "Du thabairt doraid du glé is literally 'to bring difficult to clear', which Stokes and Strachan and Meyer both render 'to bring difficulty to clearness'. Robin Flower's rhymed version makes it 'Turning darkness into light', the line by which the poem is best known in English. Doraid and glé are both adjectives; Flower supplies the image of darkness and light."
