# the opening of chapter 18, from the edition printed with the imprint "Italia", 1814 (New York
# Public Library copy, Google scan at the Internet Archive, ilprincipedinic00machgoog), as
# proofread on Italian Wikisource (Indice:Il Principe.djvu). This is a pre-critical text; the
# notes say where it differs from the modern critical editions.
#
# Each section is one printed page, checked verbatim against that page's pinned revision
# (verify_in): djvu page 74 (printed p. 64), revision 2416822; page 76 (p. 66), revision 2416824;
# page 77 (p. 67), revision 2416825. Chapter 18's sentence "Pertanto ad un Principe è necessario
# saper ben usare la bestia e l'uomo" runs across the page break, so it is divided there into two
# lines. verify_strip sets aside the page's markup: italics (''), section tags, the templates that
# join a word divided across pages ({{Pt|sa-}} / {{Pt|per|saper}}) and the link templates
# ({{W|Chirone|Chirone Centauro}}), keeping the printed words.
#
# Prose: one line per sentence, or per clause where a sentence is long. Each token's t is the word
# as printed with any punctuation after it; `weft draft` moves the punctuation to its own field
# (weft.italian token_fields), so the line still reproduces the source.
#   n   (where present) Weft's marked reading of the word, overriding the lexicon
joiner: " "
verify_strip: "''|<[^>]+>|\\{\\{Pt\\|[^|{}]*\\|?\\}\\}|\\{\\{(?:W|AutoreCitato|ac|Pt)\\|[^|{}]*\\||\\}\\}"
