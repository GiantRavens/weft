# Notes for Machiavelli, Il Principe 17-18. Editorial notes are drafts until a reviewer lifts them.
- id: n.prin.edition
  attach: prin.17.1
  kind: editorial
  status: draft
  leans_on: "Il principe (Italia, 1814), Internet Archive ilprincipedinic00machgoog; N. Machiavelli, De principatibus, ed. G. Inglese (Rome: Istituto storico italiano per il Medio Evo, 1994), chapter headings; Tutte le opere, ed. G. Mazzoni and M. Casella (Florence: Barbèra, 1929)"
  text: "The Italian here is an edition printed in 1814 under the imprint 'Italia', as proofread on Italian Wikisource. It predates the critical editions of the twentieth century (Casella, 1929; Inglese, 1994), which rest on a comparison of the manuscripts, so its wording, spelling and punctuation are an editor's text, not Machiavelli's autograph, which does not survive. One difference shows in the chapter titles. In the manuscripts they are in Latin: chapter 17 is De crudelitate et pietate; et an sit melius amari quam timeri, vel e contra, and chapter 18 is Quomodo fides a principibus sit servanda. This edition prints Italian titles, and for chapter 17 it has clemenzia where pietate would give pietà. Marriott's and Ricci's 'clemency' follow a title of this kind."
- id: n.prin.safer
  attach: prin.17.4
  kind: editorial
  status: draft
  text: "The sentence is often reduced to 'better to be feared than loved'. The Italian is narrower in two ways. First, line 2 answers that one would wish to be both; the preference for fear applies only 'quando s'abbi a mancare dell'un de' duoi', when one of the two must be given up. Second, the comparison is 'più sicuro', safer: a judgment about the prince's security, not about which is better in itself. The reasons follow in lines 5 to 14: love is held by a bond of obligation that men break when it serves them; fear is held by a dread of punishment 'che non abbandona mai', that never fails."
- id: n.prin.hatred
  attach: prin.17.15
  kind: editorial
  status: draft
  text: "The advice has a limit. The prince should be feared in such a way that, if he does not gain love, he avoids hatred (l'odio), and line 17 names what produces hatred: taking the property of citizens and subjects, and their women. Later in the chapter, beyond this selection, Machiavelli adds that men forget the death of a father sooner than the loss of an inheritance. Fear without hatred is the position the chapter recommends; cruelty that produces hatred is outside it."
- id: n.prin.cicero
  attach: prin.18a.5
  kind: editorial
  status: draft
  leans_on: "Cicero, De officiis 1.34 and 1.41; L. A. Burd, ed., Il Principe (Oxford, 1891), as cited in Marriott's note to this chapter"
  text: "The two kinds of fighting, by laws and by force, one proper to men and the other to beasts, follow Cicero, De officiis 1.34, as Burd's commentary noted: 'cum sint duo genera decertandi, unum per disceptationem, alterum per vim'. The fox and the lion also come from De officiis (1.41), where force is the lion's and fraud the fox's, and both are called 'utrumque homine alienissimum', wholly foreign to a human being. Machiavelli keeps Cicero's terms and reverses the conclusion: a prince must be able to use both. Whether he intended the reversal as a pointed answer to Cicero is an interpretation; the borrowing itself is clear from the wording."
- id: n.prin.chiron
  attach: prin.18b.3
  kind: editorial
  status: draft
  leans_on: "Homer, Iliad 11.830-832; Pindar, Nemean 3.43-58"
  text: "In Greek tradition the centaur Chiron, half man and half horse, raised Achilles and other heroes; the Iliad and Pindar both mention his teaching. Machiavelli says the ancient writers taught this 'copertamente', covertly, and reads the myth as an allegory: a teacher who is half beast means the prince must know how to use both natures. The allegorical reading is his; the ancient sources present Chiron as a wise and just teacher, without this point."
- id: n.prin.forms
  attach: prin.18a.2.5
  kind: editorial
  status: draft
  leans_on: "TLIO, Tesoro della lingua italiana delle origini (OVI-CNR); P. Manni, 'Ricerche sui tratti fonetici e morfologici del fiorentino quattrocentesco', Studi di grammatica italiana 8 (1979)"
  text: "The edition keeps forms current in Florentine writing of the late fifteenth and early sixteenth centuries that later left the standard language: duoi for due, sieno for siano, facci for faccia, feciono for fecero, fussero for fossero, saria for sarebbe, debbe for deve. The lemma row gives the modern headword. It also has Latinizing spellings, here esperienzia (esperienza), osservanzia (osservanza) and cognoscere (conoscere). Weft's sound row reads all of these as written. For the old Florentine forms that is likely right; for the Latinizing spellings it is uncertain, since a spelling can follow Latin without a speaker sounding it."
- id: n.prin.sound
  attach: prin.17.4.4
  kind: editorial
  status: draft
  leans_on: "B. Migliorini, C. Tagliavini, P. Fiorelli, Dizionario d'ortografia e di pronunzia; H. J. Izzo, Tuscan and Etruscan (Toronto, 1972)"
  text: "The first sound scheme is Florentine of about 1513, reconstructed and approximate. Its stressed open and closed e and o come from a lexicon based on the Tuscan standard and checked against the Latin source vowels. It leaves out the gorgia toscana, the softening of k, t, p between vowels that makes sicuro sound like [siˈhuːro] in Florence today. When the gorgia began is disputed. Izzo argues against an Etruscan origin and for a late development, and written evidence for it before the sixteenth century is lacking or contested. It may already have been heard in Machiavelli's Florence; the evidence does not settle the question, so the scheme leaves it out. The modern scheme differs from the Florentine one in only one word of this passage, cose, where most Italians now voice the s."
- id: n.prin.pagebreak
  attach: prin.18a.8
  kind: editorial
  status: draft
  text: "This line and the next are one sentence: 'Pertanto ad un Principe è necessario saper ben usare la bestia e l'uomo', it is therefore necessary for a prince to know how to use the beast and the man well. The sentence runs across the page break between pages 66 and 67 of the 1814 edition. Weft checks each page against its own source, so the sentence is divided at the break, between necessario and saper."
