# Luigi Ricci, The Prince (1903), Project Gutenberg eBook 57037 (Oxford University Press printing,
# 1909), verbatim, chapters XVII and XVIII. No corrections. Ricci translates a different Italian
# text from the 1814 edition shown here; spans follow his sentences, grouped over the lines they render.
translation: ricci1903
aligned_by: hand, phase 0; one span per sentence or group of clauses
spans:
- lines:
  - prin.17.1
  - prin.17.4
  text: From this arises the question whether it is better to be loved more than feared, or feared more
    than loved. The reply is, that one ought to be both feared and loved, but as it is difficult for the
    two to go together, it is much safer to be feared than loved, if one of the two has to be wanting.
- lines:
  - prin.17.5
  - prin.17.8
  text: For it may be said of men in general that they are ungrateful, voluble, dissemblers, anxious to
    avoid danger, and covetous of gain; as long as you benefit them, they are entirely yours; they offer
    you their blood, their goods, their life, and their children, as I have before said, when the necessity
    is remote; but when it approaches, they revolt.
- lines:
  - prin.17.9
  - prin.17.11
  text: And the prince who has relied solely on their words, without making other preparations, is ruined,
    for the friendship which is gained by purchase and not through grandeur and nobility of spirit is
    merited but is not secured, and at times is not to be had.
- lines:
  - prin.17.12
  - prin.17.14
  text: And men have less scruple in offending one who makes himself loved than one who makes himself
    feared; for love is held by a chain of obligation which, men being selfish, is broken whenever it
    serves their purpose; but fear is maintained by a dread of punishment which never fails.
- lines:
  - prin.17.15
  - prin.17.17
  text: Still, a prince should make himself feared in such a way that if he does not gain love, he at
    any rate avoids hatred; for fear, and the absence of hatred may well go together, and will be always
    attained by one who abstains from interfering with the property of his citizens and subjects or with
    their women.
- lines:
  - prin.18a.1
  - prin.18a.1
  text: How laudable it is for a prince to keep good faith and live with integrity, and not with astuteness,
    every one knows.
- lines:
  - prin.18a.2
  - prin.18a.4
  text: Still the experience of our times shows those princes to have done great things who have had little
    regard for good faith, and have been able by astuteness to confuse men's brains, and who have ultimately
    overcome those who have made loyalty their foundation.
- lines:
  - prin.18a.5
  - prin.18a.7
  text: 'You must know, then, that there are two methods of fighting, the one by law, the other by force:
    the first method is that of men, the second of beasts; but as the first method is often insufficient,
    one must have recourse to the second.'
- lines:
  - prin.18a.8
  - prin.18b.1
  text: It is therefore necessary to know well how to use both the beast and the man.
- lines:
  - prin.18b.2
  - prin.18b.4
  text: This was covertly taught to princes by ancient writers, who relate how Achilles and many others
    of those princes were given to Chiron the centaur to be brought up, who kept them under his discipline;
- lines:
  - prin.18b.5
  - prin.18b.7
  text: this system of having for teacher one who was half beast and half man is meant to indicate that
    a prince must know how to use both natures, and that the one without the other is not durable.
- lines:
  - prin.18b.8
  - prin.18b.9
  text: A prince being thus obliged to know well how to act as a beast must imitate the fox and the lion,
    for the lion cannot protect himself from snares, and the fox cannot defend himself from wolves.
- lines:
  - prin.18b.10
  - prin.18b.10
  text: One must therefore be a fox to recognise snares, and a lion to frighten wolves.
- lines:
  - prin.18b.11
  - prin.18b.11
  text: Those that wish to be only lions do not understand this.
- lines:
  - prin.18b.12
  - prin.18b.13
  text: Therefore, a prudent ruler ought not to keep faith when by so doing it would be against his interest,
    and when the reasons which made him bind himself no longer exist.
- lines:
  - prin.18b.14
  - prin.18b.15
  text: If men were all good, this precept would not be a good one; but as they are bad, and would not
    observe their faith with you, so you are not bound to keep faith with them.
