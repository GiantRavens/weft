# W. K. Marriott, The Prince (1908), Project Gutenberg eBook 1232, verbatim, chapters XVII and XVIII.
# One change: the footnote marker [2] after 'contesting,' (chapter XVIII) is left out; the note it
# points to is Marriott's, not part of the translation. Marriott translates a different Italian text
# from the 1814 edition shown here; spans follow his sentences, grouped over the lines they render.
translation: marriott1908
aligned_by: hand, phase 0; one span per sentence or group of clauses
spans:
- lines:
  - prin.17.1
  - prin.17.4
  text: 'Upon this a question arises: whether it be better to be loved than feared or feared than loved?
    It may be answered that one should wish to be both, but, because it is difficult to unite them in
    one person, it is much safer to be feared than loved, when, of the two, either must be dispensed with.'
- lines:
  - prin.17.5
  - prin.17.8
  text: Because this is to be asserted in general of men, that they are ungrateful, fickle, false, cowardly,
    covetous, and as long as you succeed they are yours entirely; they will offer you their blood, property,
    life, and children, as is said above, when the need is far distant; but when it approaches they turn
    against you.
- lines:
  - prin.17.9
  - prin.17.11
  text: And that prince who, relying entirely on their promises, has neglected other precautions, is ruined;
    because friendships that are obtained by payments, and not by greatness or nobility of mind, may indeed
    be earned, but they are not secured, and in time of need cannot be relied upon;
- lines:
  - prin.17.12
  - prin.17.14
  text: and men have less scruple in offending one who is beloved than one who is feared, for love is
    preserved by the link of obligation which, owing to the baseness of men, is broken at every opportunity
    for their advantage; but fear preserves you by a dread of punishment which never fails.
- lines:
  - prin.17.15
  - prin.17.17
  text: Nevertheless a prince ought to inspire fear in such a way that, if he does not win love, he avoids
    hatred; because he can endure very well being feared whilst he is not hated, which will always be
    as long as he abstains from the property of his citizens and subjects and from their women.
- lines:
  - prin.18a.1
  - prin.18a.1
  text: Every one admits how praiseworthy it is in a prince to keep faith, and to live with integrity
    and not with craft.
- lines:
  - prin.18a.2
  - prin.18a.4
  text: Nevertheless our experience has been that those princes who have done great things have held good
    faith of little account, and have known how to circumvent the intellect of men by craft, and in the
    end have overcome those who have relied on their word.
- lines:
  - prin.18a.5
  - prin.18a.7
  text: You must know there are two ways of contesting, the one by the law, the other by force; the first
    method is proper to men, the second to beasts; but because the first is frequently not sufficient,
    it is necessary to have recourse to the second.
- lines:
  - prin.18a.8
  - prin.18b.1
  text: Therefore it is necessary for a prince to understand how to avail himself of the beast and the
    man.
- lines:
  - prin.18b.2
  - prin.18b.4
  text: This has been figuratively taught to princes by ancient writers, who describe how Achilles and
    many other princes of old were given to the Centaur Chiron to nurse, who brought them up in his discipline;
- lines:
  - prin.18b.5
  - prin.18b.7
  text: which means solely that, as they had for a teacher one who was half beast and half man, so it
    is necessary for a prince to know how to make use of both natures, and that one without the other
    is not durable.
- lines:
  - prin.18b.8
  - prin.18b.9
  text: A prince, therefore, being compelled knowingly to adopt the beast, ought to choose the fox and
    the lion; because the lion cannot defend himself against snares and the fox cannot defend himself
    against wolves.
- lines:
  - prin.18b.10
  - prin.18b.10
  text: Therefore, it is necessary to be a fox to discover the snares and a lion to terrify the wolves.
- lines:
  - prin.18b.11
  - prin.18b.11
  text: Those who rely simply on the lion do not understand what they are about.
- lines:
  - prin.18b.12
  - prin.18b.13
  text: Therefore a wise lord cannot, nor ought he to, keep faith when such observance may be turned against
    him, and when the reasons that caused him to pledge it exist no longer.
- lines:
  - prin.18b.14
  - prin.18b.15
  text: If men were entirely good this precept would not hold, but because they are bad, and will not
    keep faith with you, you too are not bound to observe it with them.
