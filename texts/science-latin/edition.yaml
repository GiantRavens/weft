# Weft edition: two founding statements of early-modern science, in the Latin their authors
# published. Each section is checked verbatim against its own source by `weft draft`, and each
# carries the reading dialect of its author's country (see pipeline/weft/latin.py, as-first-read).
sections:
  - id: descartes
    title: "Descartes, Principles of Philosophy (1644), part 1, section 7"
    dialect: french
    verify_in: sources/descartes1644-la.txt
    lines:
      - "repugnat enim, ut putemus id quod cogitat, eo ipso tempore quo cogitat, non existere."
      - "Ac proinde haec cognitio:"
      - "Ego cogito, ergo sum"
      - "est omnium prima et certissima, quae cuilibet ordine philosophanti occurrat."
  - id: newton-1
    title: "Newton, Principia (1687), Law I"
    dialect: english
    verify_in: sources/newton1687.txt
    lines:
      - "Corpus omne perseverare in statu suo quiescendi vel movendi uniformiter in directum,"
      - "nisi quatenus a viribus impressis cogitur statum illum mutare."
  - id: newton-2
    title: "Newton, Principia (1687), Law II"
    dialect: english
    verify_in: sources/newton1687.txt
    lines:
      - "Mutationem motus proportionalem esse vi motrici impressæ,"
      - "& fieri secundum lineam rectam qua vis illa imprimitur."
  - id: newton-3
    title: "Newton, Principia (1687), Law III"
    dialect: english
    verify_in: sources/newton1687.txt
    lines:
      - "Actioni contrariam semper & æqualem esse reactionem:"
      - "sive corporum duorum actiones in se mutuo semper esse æquales & in partes contrarias dirigi."
