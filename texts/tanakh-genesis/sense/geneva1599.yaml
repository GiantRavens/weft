  - gen.1.1
  text: In the beginning God created the heauen and the earth.
- lines:
  - gen.1.2
  - gen.1.2
  text: And the earth was without forme and void, and darkenesse was vpon the deepe, and the Spirit of God mooued vpon the waters.
- lines:
  - gen.1.3
  - gen.1.3
  text: 'Then God said, Let there be light: And there was light.'
- lines:
  - gen.1.4
  - gen.1.4
  text: And God saw the light that it was good, and God separated the light from the darkenes.
- lines:
  - gen.1.5
  - gen.1.5
  text: And God called the Light, Day, and the darkenes, he called Night. So the euening and the morning were the first day.
- lines:
  - gen.1.6
  - gen.1.6
  text: 'Againe God said, Let there be a firmament in the mids of the waters: and let it separate the waters from the waters.'
- lines:
  - gen.1.7
  - gen.1.7
  text: 'Then God made the firmament, and separated the waters, which were vnder the firmament, from the waters which were aboue the firmament: and it was so.'
- lines:
  - gen.1.8
  - gen.1.8
  text: And God called the firmament Heauen. So the Euening and the morning were the second day.
- lines:
  - gen.1.9
  - gen.1.9
  text: God said againe, Let the waters vnder the heauen be gathered into one place, and let the dry land appeare. and it was so.
- lines:
  - gen.1.10
  - gen.1.10
  text: 'And God called the dry land, Earth, and he called the gathering together of the waters, Seas: and God saw that it was good.'
- lines:
  - gen.1.11
  - gen.1.11
  text: 'Then God said, Let the earth bud forth the bud of the herbe, that seedeth seed, the fruitfull tree, which beareth fruite according to his kinde, which hath his seede in it selfe vpon the earth:
    and it was so.'
- lines:
  - gen.1.12
  - gen.1.12
  text: 'And the earth brought foorth the bud of the herbe, that seedeth seede according to his kind, also the tree that beareth fruit, which hath his seed in it selfe according to his kinde: and God saw
    that it was good.'
- lines:
  - gen.1.13
  - gen.1.13
  text: So the euening and the morning were the third day.
- lines:
  - gen.1.14
  - gen.1.14
  text: And God said, Let there be lights in the firmament of the heauen, to separate the day from the night, and let them be for signes, and for seasons, and for dayes and yeeres.
- lines:
  - gen.1.15
  - gen.1.15
  text: 'And let them be for lights in the firmament of the heauen to giue light vpon the earth: and it was so.'
- lines:
  - gen.1.16
  - gen.1.16
  text: 'God then made two great lights: the greater light to rule the day, and the lesse light to rule the night: he made also the starres.'
- lines:
  - gen.1.17
  - gen.1.17
  text: And God set them in the firmament of the heauen, to shine vpon the earth,
- lines:
  - gen.1.18
  - gen.1.18
  text: 'And to rule in the day, and in the night, and to separate the light from the darkenesse: and God saw that it was good.'
- lines:
  - gen.1.19
  - gen.1.19
  text: So the euening and the morning were the fourth day.
- lines:
  - gen.1.20
  - gen.1.20
  text: 'Afterward God said, Let the waters bring foorth in abundance euery creeping thing that hath life: and let the foule flie vpon the earth in the open firmament of the heauen.'
- lines:
  - gen.1.21
  - gen.1.21
  text: 'Then God created the great whales, and euery thing liuing and mouing, which the waters brought foorth in abundance according to their kinde, and euery fethered foule according to his kinde: and
    God sawe that it was good.'
- lines:
  - gen.1.22
  - gen.1.22
  text: Then God blessed them, saying, Bring foorth fruite and multiplie, and fill the waters in the seas, and let the foule multiplie in the earth.
- lines:
  - gen.1.23
  - gen.1.23
  text: So the euening and the morning were the fifte day.
- lines:
  - gen.1.24
  - gen.1.24
  text: Moreouer God said, Let the earth bring foorth the liuing thing according to his kinde, cattel, and that which creepeth, and the beast of the earth, according to his kinde. and it was so.
- lines:
  - gen.1.25
  - gen.1.25
  text: 'And God made the beast of the earth according to his kinde, and the cattell according to his kinde, and euery creeping thing of the earth according to his kind: and God saw that it was good.'
- lines:
  - gen.1.26
  - gen.1.26
  text: Furthermore God said, Let vs make man in our image according to our likenes, and let them rule ouer the fish of the sea, and ouer the foule of the heauen, and ouer the beastes, and ouer all the
    earth, and ouer euery thing that creepeth and moueth on the earth.
- lines:
  - gen.1.27
  - gen.1.27
  text: 'Thus God created the man in his image: in the image of God created he him: he created them male and female.'
- lines:
  - gen.1.28
  - gen.1.28
  text: And God blessed them, and God said to them, Bring forth fruite and multiplie, and fill the earth, and subdue it, and rule ouer the fish of the sea, and ouer the foule of the heauen, and ouer euery
    beast that moueth vpon the earth.
- lines:
  - gen.1.29
  - gen.1.29
  text: 'And God said, Beholde, I haue giuen vnto you euery herbe bearing seede, which is vpon al the earth, and euery tree, wherein is the fruite of a tree bearing seede: that shall be to you for meate.'
- lines:
  - gen.1.30
  - gen.1.30
  text: Likewise to euery beast of the earth, and to euery foule of the heauen, and to euery thing that moueth vpon the earth, which hath life in it selfe, euery greene herbe shall be for meate. and it
    was so.
- lines:
  - gen.1.31
  - gen.1.31
  text: And God sawe all that he had made, and loe, it was very good. So the euening and the morning were the sixt day.
- lines:
  - gen.2.1
  - gen.2.1
  text: Thus the heauens and the earth were finished, and all the host of them.
- lines:
  - gen.2.2
  - gen.2.2
  text: For in the seuenth day GOD ended his worke which he had made, and the seuenth day he rested from al his worke, which he had made.
- lines:
  - gen.2.3
  - gen.2.3
  text: So God blessed the seuenth day, and sanctified it, because that in it he had rested from all his worke, which God had created and made.
