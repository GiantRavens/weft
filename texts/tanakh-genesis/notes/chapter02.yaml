# Notes for Genesis 2:1-3.
- id: n.gen.2.2.shavat
  attach: gen.2.2.8
  kind: editorial
  status: draft
  text: "Wayyišbōṯ, from šāḇaṯ, means 'and he ceased' or 'stopped'; the English versions have 'rested'. The verb shares its consonants, š-b-ṯ, with šabbāṯ, the Sabbath, but the noun does not occur in these verses: the day is named only as 'the seventh day'. The link to the Sabbath commandment is drawn explicitly later, in Exodus 20:11 and 31:17. In the first clause of this verse the Masoretic text has God finish 'on the seventh day'; the Samaritan Pentateuch, the Septuagint and the Syriac read 'on the sixth day', a reading that removes any suggestion of work done on the seventh."
- id: n.gen.2.3.sevenday
  attach: gen.2.3
  kind: editorial
  status: draft
  text: "The account is built on seven days. Many readers note a correspondence between the first three days, which separate realms (light from darkness; the waters above from the waters below; sea from dry land), and the next three, which fill them (luminaries; fish and birds; land animals and humans). This is an interpretive reading, not a statement of the text, and it is not exact: the plants of the third day fill the land as much as they form it. The seventh day has no command, no new work and no closing 'evening and morning'. The verses describe God finishing, ceasing, blessing the day and making it holy. Many scholars take the next half verse, 2:4a, as the close of this account; Weft's range stops at 2:3."
