# Notes for Genesis 1:1-5.
- id: n.gen.1.1.sound
  attach: gen.1.1
  kind: editorial
  status: draft
  text: "The words are far older than their vowels. The consonants were copied for well over a thousand years before the Masoretes of Tiberias added vowel points and accents around AD 900, recording how the text was chanted in their day. That Tiberian reading, the earliest pronunciation preserved in full, is the default sound here. The Leningrad Codex that carries it was copied in 1008."
- id: n.gen.1.1.bereshit
  attach: gen.1.1.1
  kind: editorial
  status: draft
  text: "Bərēšîṯ, 'in beginning': the first word, and the Hebrew name of the whole book. It has no article, so some modern translations read the verse as a clause, 'When God began to create...'. The Greek translation of this word, ἐν ἀρχῇ, is how John's gospel opens."
- id: n.gen.1.1.elohim
  attach: gen.1.1.3
  kind: editorial
  status: draft
  text: "ʾĔlōhîm has a plural ending, -îm, and Strong's lexicon gives 'gods' as its first sense. Here it takes a singular verb, bārāʾ, 'he created', which tells the reader to take it as the one God."
- id: n.gen.1.1.et
  attach: gen.1.1.4
  kind: editorial
  status: draft
  text: "ʾĒṯ has no English equivalent. It points to a definite direct object: what follows is the thing created. The gloss row marks it [obj]."
- id: n.gen.1.2.tohu
  attach: gen.1.2.3
  kind: editorial
  status: draft
  text: "Tōhû wāḇōhû, 'formless and void', is a rhyming pair, heard more than parsed. French borrowed it whole: tohu-bohu means chaos, a hubbub."
- id: n.gen.1.2.ruach
  attach: gen.1.2.9
  kind: editorial
  status: draft
  text: "Rûaḥ means wind, breath and spirit at once. All three versions here write 'spirit of God'; others read 'a wind from God'. The final ḥ is preceded by a gliding a (the furtive patah), so it is said ROO-aḥ."
- id: n.gen.1.3.wayyiqtol
  attach: gen.1.3.1
  kind: editorial
  status: draft
  text: "Wayyōʾmer, 'and he said', is the wayyiqtol: the verb form Hebrew uses to move a story forward. From here on nearly every clause starts with it, wa-, wa-, wa-, which is why the English is a chain of 'and... and... and'."
- id: n.gen.1.5.oneday
  attach: gen.1.5.13
  kind: editorial
  status: draft
  text: "Yôm ʾeḥāḏ is 'day one', a cardinal number, where the later days use ordinals: second, third. JPS 1917 keeps it: 'one day'. Geneva and the King James smooth it to 'the first day'. The verse also counts the day from evening to morning, which is why the Jewish day still begins at sundown."
