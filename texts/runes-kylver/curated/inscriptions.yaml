# Human overlay for the Kylver stone. No treebank exists for runic texts, so this
# file carries lemma and morphology too (rule 3 exception). Kylver's lemmas are the
# reconstructed Proto-Germanic rune names, with the name's meaning as the gloss.
- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a runologist
  date: 2026-09-29
  why: pilot inscriptions; hand annotation, no treebank
  status: draft
  set:
    run.kylver.1: {metre: "the futhark: 24 runes in three groups of eight (ættir)"}
    run.kylver.1.1: {lemma: "*fehu", morph: "SYM", gloss: "cattle"}   # f ᚠ
    run.kylver.1.2: {lemma: "*ūruz", morph: "SYM", gloss: "aurochs"}   # u ᚢ
    run.kylver.1.3: {lemma: "*þurisaz", morph: "SYM", gloss: "giant"}   # þ ᚦ
    run.kylver.1.4: {lemma: "*ansuz", morph: "SYM", gloss: "god"}   # a ᚨ
    run.kylver.1.5: {lemma: "*raidō", morph: "SYM", gloss: "ride"}   # r ᚱ
    run.kylver.1.6: {lemma: "*kaunan", morph: "SYM", gloss: "ulcer"}   # k ᚲ
    run.kylver.1.7: {lemma: "*gebō", morph: "SYM", gloss: "gift"}   # g ᚷ
    run.kylver.1.8: {lemma: "*wunjō", morph: "SYM", gloss: "joy"}   # w ᚹ
    run.kylver.1.9: {lemma: "*hagalaz", morph: "SYM", gloss: "hail"}   # h ᚺ
    run.kylver.1.10: {lemma: "*naudiz", morph: "SYM", gloss: "need"}   # n ᚾ
    run.kylver.1.11: {lemma: "*īsaz", morph: "SYM", gloss: "ice"}   # i ᛁ
    run.kylver.1.12: {lemma: "*jēran", morph: "SYM", gloss: "year"}   # j ᛃ
    run.kylver.1.13: {lemma: "*perþō", morph: "SYM", gloss: "meaning-unknown"}   # p ᛈ
    run.kylver.1.14: {lemma: "*īhwaz", morph: "SYM", gloss: "yew"}   # ï ᛇ
    run.kylver.1.15: {lemma: "*algiz", morph: "SYM", gloss: "elk"}   # z ᛉ
    run.kylver.1.16: {lemma: "*sōwilō", morph: "SYM", gloss: "sun"}   # s ᛊ
    run.kylver.1.17: {lemma: "*tīwaz", morph: "SYM", gloss: "the-god-Tyr"}   # t ᛏ
    run.kylver.1.18: {lemma: "*berkanan", morph: "SYM", gloss: "birch"}   # b ᛒ
    run.kylver.1.19: {lemma: "*ehwaz", morph: "SYM", gloss: "horse"}   # e ᛖ
    run.kylver.1.20: {lemma: "*mannaz", morph: "SYM", gloss: "man"}   # m ᛗ
    run.kylver.1.21: {lemma: "*laguz", morph: "SYM", gloss: "water"}   # l ᛚ
    run.kylver.1.22: {lemma: "*ingwaz", morph: "SYM", gloss: "the-god-Ing"}   # ŋ ᛜ
    run.kylver.1.23: {lemma: "*dagaz", morph: "SYM", gloss: "day"}   # d ᛞ
    run.kylver.1.24: {lemma: "*ōþalan", morph: "SYM", gloss: "inherited-land"}   # o ᛟ
