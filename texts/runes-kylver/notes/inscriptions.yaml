# Notes for the Kylver stone.
- id: n.run.kylver
  attach: run.kylver.1
  kind: editorial
  status: draft
  text: "The Kylver stone, found in 1903 on Gotland, formed part of a grave. It carries the earliest complete futhark, the runic alphabet, named for its first six runes: f, u, þ, a, r, k. Each rune also had a name that was a word; the gloss row gives the meaning of each reconstructed name."
- id: n.run.kylver.fehu
  attach: run.kylver.1.1
  kind: editorial
  status: draft
  text: "The first rune's name, *fehu, 'cattle, wealth', is the ancestor of Old Norse fé, the first word of Hávamál 76 in this library."
