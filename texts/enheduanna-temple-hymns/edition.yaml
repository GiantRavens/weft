# Weft edition of hymn 5 of the Temple Hymns (the E-šumeša, house of Ninurta at Nippur), as written
# on one Old Babylonian tablet from Ur: UET 6/1 111 (U 16829; CDLI and Oracc P346196), obverse lines
# 1-19. The tablet goes on to the next two hymns of the collection; Weft takes this hymn whole.
#
# The transliteration is Oracc's (epsd2/literary, CC0), contributed to CDLI by D. A. Foxvog. Each
# token reproduces the Oracc form verbatim, with ⸢ ⸣ around damaged signs. `weft draft` checks
# every line against the Oracc JSON (verify_in), keeping only the "frag" values of that file
# (verify_strip), and weft.sumerian checks each token against the Oracc word at its ref.
#
# One Weft line is one line of the tablet. Line IDs are th.5.<line>.
#
#   t    the Oracc transliteration, verbatim
#   ref  the Oracc word reference; lemma and morphology are read from the Oracc JSON through it
#   n    a hand reading for the sound, only where the spelling misleads (a-a is the word aya, 'father')
#
# Oracc's page prints two flags its JSON leaves out: an!? in line 1 (a sign that may be an
# error for AN) and nun! in line 2 (a sign corrected to NUN). The notes name them.
joiner: " "
verify_in: sources/P346196.json
verify_strip: '(?m)^(?!\s*"frag": ").*$|^\s*"frag": "|",$'
