# Notes for hymn 5 of the Temple Hymns (UET 6/1 111, obverse 1-19). Editorial notes are drafts
# until a reviewer lifts them.
- id: n.th.enheduanna
  attach: th.5.1
  kind: editorial
  status: draft
  leans_on: "ETCSL 4.80.1, translation, lines 543-544; J. A. Black, 'En-ḫedu-ana not the composer of The Temple Hymns', NABU 2002, 2-4; S. Helle, Enheduana: The Complete Poems of the World's First Author (2023), introduction and essays; W. W. Hallo and J. J. A. van Dijk, The Exaltation of Inanna (1968)"
  text: "Enheduanna (Sumerian en-ḫedu-ana) was a daughter of Sargon of Akkad and served as en-priestess of the moon god Nanna at Ur, about 2300 BC. Objects of her own time confirm this much: a stone disk from Ur carries an inscription naming her and her office, and seals of members of her household name her. That she composed poetry is a later tradition. The Temple Hymns end with a line naming her as the one who put the tablet together, and nin-me-šara, a hymn to Inanna, names her as its speaker. Whether these lines record authorship, compilation, or a school tradition attached to a famous figure is debated. Black (2002) argued that she did not compose the Temple Hymns; Helle (2023) and others read the attributions as evidence of her role. This edition does not decide the question. Weft first planned to edit nin-me-šara itself; no openly licensed transcription of it was found, so this hymn, from the other collection attributed to her, takes its place."
- id: n.th.manuscript
  attach: th.5.1
  kind: editorial
  status: draft
  leans_on: "Oracc epsd2/literary catalogue, Q000750 and P346196; D. A. Foxvog, transliteration of P346196 for CDLI (2021); ETCSL 4.80.1, line 76"
  text: "Every surviving copy of the Temple Hymns comes from the Old Babylonian period, about 1800 BC, some five centuries after Enheduanna, and most are school tablets. Oracc's catalogue lists 52 sources for the collection: 39 from Nippur, 8 from Ur and 5 of unknown origin. This edition follows one of the Ur tablets, UET 6/1 111 (excavation number U 16829), published in hand copy by Gadd and Shaffer. It is an excerpt tablet: its obverse carries this hymn and the start of the next, and its reverse finishes that one and gives the hymn to the temple of Keš. The tablet writes this hymn in 19 lines and closes it with a double ruling. The composite text, which follows the line counts written after each hymn in other manuscripts, gives it 15. Weft keeps the tablet's own lines and wording."
- id: n.th.me
  attach: th.5.1.2
  kind: editorial
  status: draft
  leans_on: "ePSD2 (Oracc) s.v. me[Being]; ETCSL 4.80.1 and 4.07.2, translations"
  text: "The word me has no single English equivalent. It names the powers, offices and rites that keep the ordered world working, which gods hold and assign. Oracc's guide word is 'Being' and its sense 'divine properties enabling cosmic activity'; the ETCSL translations render it 'divine powers', and the gloss follows them. In this hymn the temple gathers the me of heaven (line 1), its hero holds true me (line 2), its founding is a decision of the me that belong to the prince (line 5), and Ninurta brings the me of greatness to completion (line 13). The same word stands in the title of nin-me-šara, 'lady of all the me', the hymn to Inanna attributed to Enheduanna, where the goddess is said to take up the me and hang them from her hand."
- id: n.th.script
  attach: th.5.1.1
  kind: editorial
  status: draft
  leans_on: "Oracc epsd2/literary, P346196, web edition; Oracc Sign List (osl.asl, commit 193cadf)"
  text: "The cuneiform row is generated by Weft from the transliteration, sign by sign, using the Oracc Sign List. It shows standard sign forms in a modern font, not the hand of this tablet. Sumerian cuneiform mixes word signs (e₂, 'house'), signs used for their sound (the -na of an-na) and unspoken classifiers: {d} before a god's name (line 8) and {ŋeš}, 'wood', before the weapon mitum (line 3). The transliteration marks damaged signs with half brackets. Oracc's web page prints two marks its data file leaves out: an!? in line 1, a sign the editor takes, with a query, as an error for AN, and nun! in line 2, a sign corrected to NUN. Oracc and CDLI read two signs differently, in line 4 (u₁₉ or ulu₃) and line 13 (kišib or kišib₃); the row follows Oracc."
- id: n.th.sound
  attach: th.5.1
  kind: editorial
  status: draft
  leans_on: "B. Jagersma, A Descriptive Grammar of Sumerian (2010), phonology; D. O. Edzard, Sumerian Grammar (2003), phonology; D. A. Foxvog, Introduction to Sumerian Grammar (online), pronunciation"
  text: "Sumerian has no known relatives, so its sounds cannot be recovered by comparing related languages, as Akkadian's partly can. The evidence is indirect: how Akkadian-speaking scribes used the signs, words borrowed between the two languages, and Old Babylonian lists that spell Sumerian words out syllable by syllable. On that evidence Jagersma (2010) reconstructs, among other points, two series of stops, written b, d, g and p, t, k, which he takes as unaspirated and aspirated; a velar nasal, written ŋ here and g̃ in older books; and z as an affricate, ts. Many scholars posit one further consonant, written dr or ř, from signs whose readings alternate between d and r; its sound is unknown and the sound row does not use it. Verbal prefixes show vowel harmony (bi₂- before some stems, be₂- before others); the row reads vowels as written. Stress and vowel length are unknown and are not shown. The first sound row is therefore among the most reconstructed in the library. The second gives the classroom reading of the transliteration, a modern convention."
- id: n.th.5.4
  attach: th.5.4
  kind: editorial
  status: draft
  leans_on: "Oracc epsd2/literary, P346196, obverse 4; D. A. Foxvog, CDLI P346196 (2021), transliteration and translation of obverse 4; ETCSL 4.80.1, translation of lines 61-68"
  text: "This is the least certain line of the hymn. Oracc leaves three of its six words without a lemma. Foxvog joins the first two as one word, šeg₁₂-gurun, which he renders 'mighty brickwork', and reads the third sign of the last word as ulu₃, 'south wind', where Oracc reads u₁₉; for the end of the line he offers 'storm', 'day of the south wind' and 'humanity', each with a query. The composite translation in ETCSL reads at this point 'your foundation is eternal'; this tablet's wording appears to differ. Weft leaves the end of the line untranslated."
- id: n.th.parses
  attach: th.5.1.5
  kind: editorial
  status: draft
  leans_on: "Oracc epsd2/literary, P346196, lemmatization; D. A. Foxvog, CDLI P346196 (2021), translation of obverse 1-2; ETCSL 4.80.1, translation of lines 61-76"
  text: "Oracc's lemmatization, which supplies the lemma and form rows, makes three choices that other readings do not share. Here it takes ki-gal-la as a genitive, 'of the platform', parallel to an-na, 'of heaven', so that the house gathers the me of heaven and of the platform; Foxvog reads 'standing on the platform', taking the ending as locative. In line 2 it reads ur-saŋ-ŋa₂ as 'of my hero', with a possessive 'my'; the same spelling could also write the plain genitive, 'of the hero'. In line 17 it takes Ninurta-ke₄ as a genitive, 'house of Ninurta', where the ETCSL translation of the composite makes Ninurta the subject of the refrain that follows. The gloss and translation follow Oracc in all three places; the alternatives are open for review."
- id: n.th.refrain
  attach: th.5.18
  kind: editorial
  status: draft
  leans_on: "Oracc epsd2/literary, P346196, editorial notes to obverse 10 and 18, citing G. Rubio, JCS 62 (2010), 30 n. 2, and the bilingual MS 2367/2; ETCSL 4.80.1"
  text: "Lines 18 and 19 are the refrain that closes each hymn of the collection: the god of the temple has set up a house in your precinct and taken a seat on your dais, 'you' being the temple. The word muš, here 'precinct', is debated. Rubio (2010), as the note in Oracc's edition reports, takes it as an architectural term for a space enclosed by reed screens; a bilingual source, however, translates the related muš₃-zu into Akkadian as 'your face, appearance'. Oracc parses muš-za and barag-za as genitives. The gloss keeps the locative reading of the standard translations, 'in your precinct' and 'on your dais'."
