# Human overlay for hymn 5 of the Temple Hymns (UET 6/1 111, obverse 1-19): the gloss row only.
# Lemma and morphology come from the Oracc lemmatization (gen/), not from this file. Glosses lean
# on Oracc's guide words and senses (ePSD2) and keep the case and person markers in the English:
# of- (genitive), by- (agent, Oracc's ergative-or-directive e where it marks the doer), on-/at-
# (the same e where it marks place), with- (comitative), like- (equative), your- (possessive -zu).
# Where Weft's reading of an ending differs from Oracc's parse, the gloss follows Oracc and a note
# says so, with one exception: in the closing refrain (lines 18-19) Oracc parses muš-za and
# barag-za as genitives, and the gloss keeps the locative reading of the standard editions
# ('in your precinct', 'on your dais'); the note on line 18 gives both. Words Oracc did not lemmatize carry a bracketed gloss and a query.
