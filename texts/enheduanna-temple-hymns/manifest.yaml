predicted_gaps:
  - "substitution: the requested text was nin-me-šara (The Exaltation of Inanna, ETCSL 4.07.2). Its only online transcriptions are ETCSL's (CC BY-NC-SA 3.0) and the Oracc epsd2/literary composite derived from it (Q000623); no individual manuscript of it is edited in an openly licensed corpus. This edition takes instead a complete hymn from the Temple Hymns, the other major work attributed to Enheduanna, from an Ur manuscript that is not ETCSL data"
  - "the edition is one manuscript, not a composite: its wording and line division differ from the composite text (this hymn is 15 lines in the ancient count, 19 on this tablet)"
  - "one sign is broken (line 6: sign-illegible, and with three words of line 4 it makes four oracc-unlemmatized tokens: x, gurun, ud, lu-u₁₉-lu-za); their lemma and form are marked as unknown and their gloss is bracketed"
  - "the Oracc JSON drops the scribal-error and query flags that the Oracc page prints (an!? in line 1, nun! in line 2); the edition reproduces the JSON forms, and the notes name the flags"
  - "Oracc and CDLI read two signs differently: u₁₉ (URU) against ulu₃ (URU×MIN) in line 4, and kišib (MES) against kišib₃ (DUB) in line 13. The cuneiform row follows Oracc"
  - "Oracc's parse is followed for lemma and morphology, including three readings other editions do not share (ki-gal-la as genitive, ur-saŋ-ŋa₂ with 'my', Ninurta-ke₄ as genitive); the notes discuss them"
  - "the sound is conjectural; stress is unknown and not marked; vowel length is unknown; the phoneme written dr (ř) is not applied"
  - "morphology: possessor person and the copula are recorded as UD features (Person[psor], Cop) that the page does not yet display; the gloss carries them"
