# Weft editorial translation of hymn 5 of the Temple Hymns as written on UET 6/1 111, line by line,
# close to the gloss row. Draft. Words in parentheses are supplied for English sense; a query marks
# a reading Weft is unsure of; [...] marks a broken or unread word.
translation: weft-editorial
aligned_by: hand, phase 0; one span per tablet line
spans:
- lines: [th.5.1, th.5.1]
  text: "House that gathers the divine powers of heaven and of the platform, standing firm,"
- lines: [th.5.2, th.5.2]
  text: "true divine powers of my hero, made to grow on the dais by the prince,"
- lines: [th.5.3, th.5.3]
  text: "arm of battle, mitum mace and bow, with the quiver, carrying awe;"
- lines: [th.5.4, th.5.4]
  text: "brickwork (laden?) that never ceases, foundation [...] (the end of the line is unclear);"
- lines: [th.5.5, th.5.5]
  text: "founded by Enul, the primeval lord: a decision of the divine powers that belongs to the prince;"
- lines: [th.5.6, th.5.6]
  text: "[...] great one of the mountain land, it surpasses, raising its head among the princes;"
- lines: [th.5.7, th.5.7]
  text: "lofty house, the wonder of your coming forth spreads over the open space like daylight."
- lines: [th.5.8, th.5.8]
  text: "E-šumeša, upon your name Enlil"
- lines: [th.5.9, th.5.9]
  text: "has laid a fierce aura."
- lines: [th.5.10, th.5.10]
  text: "Your prince, the storm wind, the mountain, the hero who casts an aura and takes the foremost side (?),"
- lines: [th.5.11, th.5.11]
  text: "great ruler of Enlil,"
- lines: [th.5.12, th.5.12]
  text: "noble lord who rivals heaven and earth,"
- lines: [th.5.13, th.5.13]
  text: "seal-bearer of the bolt of father Enlil, who brings the divine powers of greatness to completion,"
- lines: [th.5.14, th.5.14]
  text: "forceful one, whose fierce head casts (an aura), foremost one of father Enlil,"
- lines: [th.5.15, th.5.15]
  text: "who destroys the hostile land for him,"
- lines: [th.5.16, th.5.16]
  text: "foremost one, lion born of the Great Mountain:"
- lines: [th.5.17, th.5.17]
  text: "E-šumeša, house of Ninurta,"
- lines: [th.5.18, th.5.18]
  text: "he has set up a house in your precinct,"
- lines: [th.5.19, th.5.19]
  text: "he has taken his seat on your dais."
