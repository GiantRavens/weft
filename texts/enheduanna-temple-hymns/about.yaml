  lead: 'Enheduanna (Sumerian: 𒂗𒃶𒌌𒀭𒈾 Enḫéduanna, also transliterated as Enheduana, En-he2-du7-an-na, or
    variants; fl. c. 2300 BC) was the entu (high) priestess of the moon god Nanna (Sīn) in the Sumerian
    city-state of Ur in the reign of her father, Sargon of Akkad (r. c. 2334 – c. 2279 BCE). She was likely
    appointed by her father as the leader of the religious group at Ur to cement ties between the Akkadian
    religion of her father and the native Sumerian religion. Enheduanna has been celebrated as the earliest
    known named author in world history.'
