# Weft edition of the Nicene-Constantinopolitan Creed, the ῎Εκθεσις τῶν ρν' πατέρων, the exposition of the hundred and
# fifty fathers of the Council of Constantinople (381), in the Greek text transmitted in the acts of the Council of
# Chalcedon (451), as transcribed on Greek Wikisource; each line is checked verbatim against the pinned revision.
# verify_strip sets aside the page's bold title and category; the transcription's four slips (συμπροσκυνούμνον,
# προφηῶν, ἐκκησίαν, ἕσται) and its detached breathing in ᾽Ιησοῦν are declared as corrections to the standard text.
# This is the conciliar text in the first person plural (Πιστεύομεν, ὁμολογοῦμεν, προσδοκῶμεν); the liturgical form
# that the Greek church recites has the singular (Πιστεύω) and ἐκ δεξιῶν for ἐν δεξιᾷ, and the Latin West added
# καὶ τοῦ Υἱοῦ (filioque) to the procession of the Spirit: see the notes.
#   t     the word as transcribed, polytonic, punctuation attached; the elision δι᾽ keeps its mark
#   Lines are Weft's division at the clauses; sections are the creed's articles.
work: nicene-creed
joiner: ' '
verify_in: sources/ekthesis-150.txt
verify_strip: '''''''[^'']*''''''|\[\[[^\]]*\]\]'
verify_corrections:
- ocr: συμπροσκυνούμνον
  print: συμπροσκυνούμενον
- ocr: προφηῶν·
  print: προφητῶν·
- ocr: ἐκκησίαν·
  print: ἐκκλησίαν·
- ocr: ἕσται
  print: ἔσται
- ocr: ᾽Ιησοῦν
  print: Ἰησοῦν
