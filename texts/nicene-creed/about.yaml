  lead: 'The Nicene Creed is the defining statement of belief of Nicene Christianity and in those Christian
    denominations that adhere to it.


    The original Nicene Creed was first adopted at the First Council of Nicaea in 325. According to the
    traditional view, forwarded by the Council of Chalcedon of 451, the Creed was amended in 381 by the
    First Council of Constantinople as "consonant to the holy and great Synod of Nice". Further, a creed
    "almost identical in form" was used as early as 374 by St. Epiphanius of Salamis. The amended form
    is presently referred to as the Niceno-Constantinopolitan Creed.'
