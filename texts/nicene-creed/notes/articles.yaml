# Notes on the Nicene-Constantinopolitan Creed (381).
- id: n.nc.pater.1.council
  attach: nc.pater.1.1
  kind: editorial
  status: draft
  leans_on: J. N. D. Kelly, Early Christian Creeds (3rd ed. 1972), chs. 10-11; Schaff, Creeds of Christendom vol. 1 § 8; the acts of Chalcedon (Mansi VII)
  text: 'Πιστεύομεν, ''we believe'': the creed of a council, not yet of a congregation. The text is the one read at the Council of Chalcedon in 451 as the faith of the hundred and fifty fathers who met
    at Constantinople in 381 under Theodosius I; no acts of 381 survive, and Kelly''s study is of how far the Constantinopolitan fathers themselves composed it. It enlarges the Nicene Creed of 325 (the
    exposition of the three hundred and eighteen) above all on the Holy Spirit, and drops its anathemas. The liturgical form the Greek church recites has the singular, Πιστεύω.'
- id: n.nc.hyios.5.homoousion
  attach: nc.hyios.5.4
  kind: editorial
  status: draft
  leans_on: Kelly 1972; Athanasius, De decretis; Lampe, Patristic Greek Lexicon s.v.
  text: 'ὁμοούσιον τῷ πατρί, ''of one substance with the Father'': the word of 325, kept in 381, that the Arian controversy turned on; the Latin consubstantialem and the English ''of one Being'' render
    it. It is not a scriptural word, and the council of 325 knew it; Athanasius defended it as the only word the Arians could not accept. Of 325''s ''that is, of the substance of the Father'' and ''God
    of God'' the 381 text keeps nothing.'
- id: n.nc.oikonomia.7.dexia
  attach: nc.oikonomia.7.9
  kind: editorial
  status: draft
  leans_on: the Wikisource text against the liturgical text (ἐκ δεξιῶν); Kelly 1972 on the textual variants
  text: 'ἐν δεξιᾷ τοῦ πατρός, ''at the right hand of the Father'': the conciliar text as Chalcedon transmits it; the received liturgical text has ἐκ δεξιῶν, ''from the right'', the wording of Mark 16:19
    and the Psalm. The two mean the same; the edition keeps its source.'
- id: n.nc.pneuma.3.filioque
  attach: nc.pneuma.3.5
  kind: editorial
  status: draft
  leans_on: Kelly 1972 ch. 11; Schaff vol. 1 § 8 on the Western addition; the Third Council of Toledo (589)
  text: 'τὸ ἐκ τοῦ πατρὸς ἐκπορευόμενον, ''who proceeds from the Father'', and nothing more: the Latin West came to recite ''ex Patre Filioque'', ''from the Father and the Son'', first in Spain in the sixth
    century and in Rome from 1014, and the Greek East never did. The addition is the oldest open quarrel between the churches; the Greek here is the text both sides accept as the council''s.'
- id: n.nc.ekklesia.1.katholiken
  attach: nc.ekklesia.1.4
  kind: editorial
  status: draft
  leans_on: Lampe, Patristic Greek Lexicon s.v. καθολικός; Ignatius, Smyrn. 8
  text: 'καθολικὴν, ''catholic'': in the Greek of the councils the word means universal, the church as a whole against any local or partial body, as Ignatius first used it about 110; it became a proper
    name only later. The four marks, one, holy, catholic, apostolic, are the 381 text''s; 325 had only ''the catholic and apostolic church'' in its anathema.'
- id: n.nc.ekklesia.5.amen
  attach: nc.ekklesia.5.1
  kind: editorial
  status: draft
  leans_on: the Hebrew אָמֵן; the Septuagint's ἀμήν
  text: 'ἀμήν: the Hebrew word of assent, ''firm, so be it'', taken into Greek untranslated by the Septuagint and the New Testament, and from Greek into every language the creed has been said in. The Koine
    scheme here follows Buth''s first-century values, with η a close e, so a-MAYN; by 381 many speakers had moved η to i, the a-MEEN of the modern Greek church, which the manifest''s ''approximate'' covers.'
