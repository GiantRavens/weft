# Philip Schaff's translation of the Constantinopolitan Creed of 381, from The Creeds of Christendom, vol. 2 (1877; the text of the 1919 printing on archive.org, bibliothecasymbo020scha, pinned); one span per article. Schaff translates the plural of the council, and has no filioque.
translation: schaff1877
aligned_by: 'hand: one span per article'
spans:
- lines:
  - nc.pater.1
  - nc.pater.2
  text: We believe in one God the Father Almighty, Maker of heaven and earth, and of all things visible and invisible;
- lines:
  - nc.hyios.1
  - nc.hyios.6
  text: And in one Lord Jesus Christ, the only-begotten Son of God, begotten of the Father before all worlds, Light of Light, very God of very God, begotten, not made, being of one substance with the Father;
    by whom all things were made;
- lines:
  - nc.oikonomia.1
  - nc.oikonomia.9
  text: who for us men, and for our salvation, came down from heaven, and was incarnate by the Holy Ghost and the Virgin Mary, and was made man; he was crucified for us under Pontius Pilate, and suffered,
    and was buried; and the third day he rose again, according to the Scriptures; and ascended into heaven, and sitteth on the right hand of the Father; and he shall come again, with glory, to judge the
    quick and the dead; of whose kingdom shall be no end.
- lines:
  - nc.pneuma.1
  - nc.pneuma.5
  text: And in the Holy Ghost, the Lord, and Giver of life, who proceedeth from the Father, who with the Father and the Son together is worshiped and glorified, who spake by the Prophets;
- lines:
  - nc.ekklesia.1
  - nc.ekklesia.5
  text: in one holy Catholic and Apostolic Church; we acknowledge one baptism for the remission of sins; and we look for the resurrection of the dead; and the life of the world to come. Amen.
