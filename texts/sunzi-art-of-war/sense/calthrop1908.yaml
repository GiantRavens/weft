# Verbatim from sources/calthrop1908.txt (Project Gutenberg #44024), "The Articles of Suntzu",
# chapter I, "Preliminary Reckoning". Calthrop's version is free and leaves some clauses out, so
# its spans are wide. The underscores the Gutenberg file uses for italics (on the headings and
# on a few words, such as 'of the State') and Calthrop's footnote markers [1] and [2] are removed
# (formatting, not text). No corrections.
translation: calthrop1908
aligned_by: hand, phase 0
spans:
  - lines: [sz.1.1, sz.1.2]
    text: "The words of Sun the Master:--\nTo all nations War is a great matter. Upon the army death or life depend: it is the means of the existence or destruction of the State."
  - lines: [sz.1.3, sz.1.3]
    text: "Therefore it must be diligently studied."
  - lines: [sz.1.4, sz.1.7]
    text: "Now, in war, besides stratagem and the situation, there are five indispensable matters. The first is called The Way; the second, Heaven; the third, Earth; the fourth, the Leader; the fifth, Law."
  - lines: [sz.1.8, sz.1.10]
    text: "The Way or the proper conduct of man. If the ruling authority be upright, the people are united: fearless of danger, their lives are at the service of their Lord."
  - lines: [sz.1.11, sz.1.11]
    text: "Heaven. Yin and Yang; heat and cold; time and season."
  - lines: [sz.1.12, sz.1.12]
    text: "Earth. Distance; nature; extent; strategic position."
  - lines: [sz.1.13, sz.1.13]
    text: "The Leader. Intelligence; truth; benevolence; courage and strictness."
  - lines: [sz.1.14, sz.1.14]
    text: "Law. Partition and ordering of troops."
  - lines: [sz.1.15, sz.1.16]
    text: "These things must be known by the leader: to know them is to conquer; to know them not is to be defeated."
  - lines: [sz.1.17, sz.1.17]
    text: "Further, with regard to these and the following seven matters, the condition of the enemy must be compared with our own. The seven matters are:--"
  - lines: [sz.1.18, sz.1.21]
    text: "The virtue of the prince; the ability of the general; natural advantages; the discipline of the armies; the strength of the soldiers; training of the soldiers; justice both in reward and punishment."
  - lines: [sz.1.22, sz.1.22]
    text: "Knowing these things, I can foretell the victor."
  - lines: [sz.1.23, sz.1.24]
    text: "If a general under me fight according to my plans, he always conquers, and I continue to employ him; if he differ from my plans, he will be defeated and dismissed from my service."
  - lines: [sz.1.25, sz.1.27]
    text: "Wherefore, with regard to the foregoing, considering that with us lies the advantage, and the generals agreeing, we create a situation which promises victory; but as the moment and method cannot be fixed beforehand, the plan must be modified according to circumstances."
  - lines: [sz.1.28, sz.1.30]
    text: "War is a thing of pretence: therefore, when capable of action, we pretend disability; when near to the enemy, we pretend to be far; when far away, we pretend to be near."
  - lines: [sz.1.31, sz.1.35]
    text: "Allure the enemy by giving him a small advantage. Confuse and capture him. If there be defects, give an appearance of perfection, and awe the enemy. Pretend to be strong, and so cause the enemy to avoid you. Make him angry, and confuse his plans. Pretend to be inferior, and cause him to despise you. If he have superabundance of strength, tire him out; if united, make divisions in his camp. Attack weak points, and appear in unexpected places."
  - lines: [sz.1.36, sz.1.36]
    text: "These are the secrets of the successful strategist, therefore they must not be made known beforehand."
  - lines: [sz.1.37, sz.1.40]
    text: "At the reckoning in the Sanctuary before fighting, victory is to the side that excels in the foregoing matters. They that have many of these will conquer; they that have few will not conquer; hopeless, indeed, are they that have none."
  - lines: [sz.1.41, sz.1.41]
    text: "If the condition of both sides with regard to these matters be known, I can foretell the victor."
