# Verbatim from sources/giles1910.txt (Project Gutenberg #132), chapter I, "Laying Plans".
# Giles's paragraph numbers and his bracketed notes are left out; the translation text is
# unchanged. The underscores the Gutenberg file uses for italics are removed (formatting, not
# text). No corrections.
translation: giles1910
aligned_by: hand, phase 0
spans:
  - lines: [sz.1.1, sz.1.1]
    text: "Sun Tzŭ said: The art of war is of vital importance to the State."
  - lines: [sz.1.2, sz.1.3]
    text: "It is a matter of life and death, a road either to safety or to ruin. Hence it is a subject of inquiry which can on no account be neglected."
  - lines: [sz.1.4, sz.1.5]
    text: "The art of war, then, is governed by five constant factors, to be taken into account in one’s deliberations, when seeking to determine the conditions obtaining in the field."
  - lines: [sz.1.6, sz.1.7]
    text: "These are: (1) The Moral Law; (2) Heaven; (3) Earth; (4) The Commander; (5) Method and discipline."
  - lines: [sz.1.8, sz.1.10]
    text: "The Moral Law causes the people to be in complete accord with their ruler, so that they will follow him regardless of their lives, undismayed by any danger."
  - lines: [sz.1.11, sz.1.11]
    text: "Heaven signifies night and day, cold and heat, times and seasons."
  - lines: [sz.1.12, sz.1.12]
    text: "Earth comprises distances, great and small; danger and security; open ground and narrow passes; the chances of life and death."
  - lines: [sz.1.13, sz.1.13]
    text: "The Commander stands for the virtues of wisdom, sincerity, benevolence, courage and strictness."
  - lines: [sz.1.14, sz.1.14]
    text: "By Method and discipline are to be understood the marshalling of the army in its proper subdivisions, the gradations of rank among the officers, the maintenance of roads by which supplies may reach the army, and the control of military expenditure."
  - lines: [sz.1.15, sz.1.16]
    text: "These five heads should be familiar to every general: he who knows them will be victorious; he who knows them not will fail."
  - lines: [sz.1.17, sz.1.17]
    text: "Therefore, in your deliberations, when seeking to determine the military conditions, let them be made the basis of a comparison, in this wise:—"
  - lines: [sz.1.18, sz.1.18]
    text: "(1) Which of the two sovereigns is imbued with the Moral law?\n(2) Which of the two generals has most ability?"
  - lines: [sz.1.19, sz.1.19]
    text: "(3) With whom lie the advantages derived from Heaven and Earth?\n(4) On which side is discipline most rigorously enforced?"
  - lines: [sz.1.20, sz.1.20]
    text: "(5) Which army is the stronger?\n(6) On which side are officers and men more highly trained?"
  - lines: [sz.1.21, sz.1.21]
    text: "(7) In which army is there the greater constancy both in reward and punishment?"
  - lines: [sz.1.22, sz.1.22]
    text: "By means of these seven considerations I can forecast victory or defeat."
  - lines: [sz.1.23, sz.1.24]
    text: "The general that hearkens to my counsel and acts upon it, will conquer:—let such a one be retained in command! The general that hearkens not to my counsel nor acts upon it, will suffer defeat:—let such a one be dismissed!"
  - lines: [sz.1.25, sz.1.26]
    text: "While heeding the profit of my counsel, avail yourself also of any helpful circumstances over and beyond the ordinary rules."
  - lines: [sz.1.27, sz.1.27]
    text: "According as circumstances are favourable, one should modify one’s plans."
  - lines: [sz.1.28, sz.1.28]
    text: "All warfare is based on deception."
  - lines: [sz.1.29, sz.1.30]
    text: "Hence, when able to attack, we must seem unable; when using our forces, we must seem inactive; when we are near, we must make the enemy believe we are far away; when far away, we must make him believe we are near."
  - lines: [sz.1.31, sz.1.31]
    text: "Hold out baits to entice the enemy. Feign disorder, and crush him."
  - lines: [sz.1.32, sz.1.32]
    text: "If he is secure at all points, be prepared for him. If he is in superior strength, evade him."
  - lines: [sz.1.33, sz.1.33]
    text: "If your opponent is of choleric temper, seek to irritate him. Pretend to be weak, that he may grow arrogant."
  - lines: [sz.1.34, sz.1.34]
    text: "If he is taking his ease, give him no rest. If his forces are united, separate them."
  - lines: [sz.1.35, sz.1.35]
    text: "Attack him where he is unprepared, appear where you are not expected."
  - lines: [sz.1.36, sz.1.36]
    text: "These military devices, leading to victory, must not be divulged beforehand."
  - lines: [sz.1.37, sz.1.38]
    text: "Now the general who wins a battle makes many calculations in his temple ere the battle is fought. The general who loses a battle makes but few calculations beforehand."
  - lines: [sz.1.39, sz.1.40]
    text: "Thus do many calculations lead to victory, and few calculations to defeat: how much more no calculation at all!"
  - lines: [sz.1.41, sz.1.41]
    text: "It is by attention to this point that I can foresee who is likely to win or lose."
