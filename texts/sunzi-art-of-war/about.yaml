  lead: The Art of War is an ancient Chinese military treatise dating from the late Spring and Autumn
    period (roughly 5th century BC). The work, which is attributed to the ancient Chinese military strategist
    Sun Tzu ("Master Sun"), is composed of 13 chapters. Each chapter is devoted to a different set of
    skills or arts related to warfare, finance and how they apply to military strategy and tactics. For
    almost 1,500 years, it was the lead text in an anthology that was formalized as the Seven Military
    Classics by Emperor Shenzong of Song in 1080. The Art of War remains one of the most influential works
    on strategy of all time and has shaped both East Asian and Western military theory and thinking.
