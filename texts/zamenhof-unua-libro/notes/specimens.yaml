# Notes on the Unua Libro specimens (1887).
- id: n.ul.patro.1.book
  attach: ul.patro.1.1
  kind: editorial
  status: draft
  leans_on: Zamenhof, Lingvo internacia (Warsaw, 1887), the Russian, Polish, French and German editions; Geoghegan's English edition (1889); Privat, Vivo de Zamenhof (1920)
  text: 'The Unua Libro, ''first book'', is the forty-page pamphlet in which L. L. Zamenhof, a Warsaw eye doctor of twenty-seven, published his language under the name Doktoro Esperanto, ''one who hopes''.
    The Russian edition passed the censor on 2 June 1887 and appeared on 26 July; Polish, French and German followed that year, and this English edition, by R. H. Geoghegan, in 1889, replacing a poor one
    of 1888. After the sixteen rules of grammar the book gives six specimens: this prayer, Genesis 1:1-10, a letter, two poems of Zamenhof''s own, and a poem from Heine. Four are here.'
- id: n.ul.patro.1.division
  attach: ul.patro.1.2
  kind: editorial
  status: draft
  leans_on: Geoghegan 1889, page 19 and its footnote; the vocabulary at the end of the book
  text: 'Patr''o ni''a: the print divides every word into its parts so that a reader with the little vocabulary can look each part up (patr- father, -o noun, ni we, -a adjective) and read the text without
    having learnt the language; the footnote says the commas are dropped between people who know it. The 1887 print uses commas; the Wikisource transcription writes apostrophes, and the edition follows
    it. The Fundamento spelling row joins the parts.'
- id: n.ul.patro.6.malvera
  attach: ul.patro.6.6
  kind: editorial
  status: draft
  leans_on: the later Esperanto Bible (Zamenhof's Old Testament, 1926; the New Testament of 1912), Matthew 6:13
  text: 'la mal''ver''a, ''the un-true'': the 1887 word for the evil we ask to be delivered from, built from vera ''true'' with the prefix mal- that makes an opposite. The later Esperanto New Testament
    has ''la malbono''. The prayer also ends with ''la reg''ad''o'', the ruling, where the Greek and the King James have the kingdom; Zamenhof''s wording was his own.'
- id: n.ul.penso.1.poem
  attach: ul.penso.1.1
  kind: editorial
  status: draft
  leans_on: Zamenhof's letters to Borovko (1895) on the years before publication; Fundamenta Krestomatio (1903), where the poem is reprinted
  text: 'Mi''a pens''o, ''My thought'', is the first original poem in Esperanto and a personal one: Zamenhof had worked at the language in secret for years, and the poem sets a summer evening''s song against
    the wound of a youth given up to a duty that commands. It and Ho, mi''a kor'' were written for the book in 1887.'
- id: n.ul.penso.6.si
  attach: ul.penso.6.1
  kind: editorial
  status: draft
  leans_on: the Fundamenta Krestomatio text (Ŝi rakontas); the 1889 print
  text: 'Si rakont''as: the 1889 print has Si where the sense and every later printing have Ŝi, ''she''; the transcription keeps the print. The Fundamento spelling row gives Ŝi, and the morphology reads
    it so. The same page writes tranquil''iĝ''u for trankvil''iĝ''u in the last poem; both are treated as the printer''s, not the author''s.'
- id: n.ul.kor.1.poem
  attach: ul.kor.1.3
  kind: editorial
  status: draft
  leans_on: Zamenhof's letter to Borovko (1895); Privat 1920
  text: 'Ho, mi''a kor’: Zamenhof later said he wrote these eight lines in the days of waiting for the censor''s permission to print, when the work of years was about to go out. The elided kor’ for kor''o
    is the poet''s licence the sixteenth rule allows: the final o of a noun may be dropped and marked with an apostrophe, the stress staying where it was.'
