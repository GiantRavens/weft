# Weft's editorial translation, close to the Esperanto, one span per text; draft. Heine's original (Mir träumte von einem Königskind, Buch der Lieder 1827) is the source of the third.
translation: weft-editorial
aligned_by: 'hand: one span per text'
spans:
- lines:
  - ul.patro.1
  - ul.patro.6
  text: Our Father who art in heaven, hallowed be thy name, thy kingdom come, thy will be done, as in heaven, so also on earth. Give us this day our daily bread, and forgive us our debts, as we also forgive
    our debtors; lead us not into temptation; but deliver us from evil, for thine is the rule, the power and the glory eternally. Amen!
- lines:
  - ul.penso.1
  - ul.penso.32
  text: On the field, far from the world, before a summer night, a girl-friend in the circle sings a song about hope. And of a life destroyed she tells, pitying; my wound, struck again, pains me, bleeding
    anew. 'Are you asleep? Oh, sir, why such stillness? Ah, probably a memory from dear childhood?' What to say? Not weeping could the talk be, with a young lady resting after a summer walk! My thought
    and torment, and pains and hopes! How much of me, in silence, has already gone to you in offerings! What I held most dear, my youth, I weeping laid myself on the altar of commanding duty! I feel a fire
    within; I too desire to live; something drives me on for ever, if I go among the merry ones... If my effort and labour do not please fate, let death come to me at once, in hope, without pain!
- lines:
  - ul.heine.1
  - ul.heine.12
  text: 'In a dream I saw a princess with cheeks wet from weeping; under a tree, under a green one, we sat, holding each other heart to heart. ''Your father''s crown is not worth having to me! Away, away
    with his sceptre and throne; it is you yourself I desire, lovable one!'' ''It cannot be!'' she replies to me: ''in the tomb I am held; only in the night do I come out to you, my only beloved!'''
- lines:
  - ul.kor.1
  - ul.kor.8
  text: Oh, my heart, do not beat uneasily, do not leap out of my breast now! I can hardly hold myself any longer. Oh, my heart! Oh, my heart! After long labour shall I not win in the decisive hour? Enough!
    be calm from your beating, oh, my heart!
