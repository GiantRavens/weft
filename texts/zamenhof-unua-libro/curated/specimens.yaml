# Human overlay for the Unua Libro specimens (1887). Esperanto's grammar is a rule, and the 1887 print divides each word
# into its parts, so lemma and morphology come from pipeline/weft/esperanto.py (analyze), which reads the division by the
# Fundamento's rules: -o noun, -a adjective, -e adverb, -j plural, -n accusative, the six verb endings, the participles,
# and the table words. Every token was checked by hand and the few misreadings corrected (marked); the glosses are
# hand-written, one English word per Esperanto word, compounds by their parts joined with hyphens (sen'mov'ec'o
# motionlessness, re'sang'ant'e bleeding-again), the particle ĉu as [question].
- by: esperanto.analyze (rule-based, from the printed division), checked and glossed by Claude (Weft phase 0); for review by Skip and an Esperantist
  date: 2026-10-04
  why: the language's grammar is regular and the print shows the parts, so the analysis is a declared rule, checked by hand
  status: draft
