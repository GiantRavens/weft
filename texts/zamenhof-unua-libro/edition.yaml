# Weft edition of four specimens from Zamenhof's Unua Libro (1887): the Lord's Prayer (Patr'o ni'a), the poems Mi'a
# pens'o and Ho, mi'a kor’, and the translation from Heine. Text of the English edition, Dr. Esperanto's International
# Language, Introduction and Complete Grammar, Por Angloj (Warsaw, 1889), pages 19 and 21-23, as transcribed on English
# Wikisource; each line is checked verbatim against the pinned page revisions, a section naming its pages in order.
# The 1887 print divides every word into its parts with commas (Patr,o ni,a), so that a reader can find each part in
# the vocabulary; the transcription writes the division with an apostrophe, and the edition follows the transcription.
# verify_strip sets aside the page templates, the italics and the stanza stars; the transcriber's slips (a Cyrillic о
# in seven words, est,as for est'as) are declared as corrections. Si rakont'as and tranquil'iĝ'u stand as printed, with
# the regular forms (Ŝi, trankviliĝu) in n; see the manifest's predicted_gaps.
#   t     the word as printed, divided, punctuation attached; the elision apostrophe ’ (kor’, l’mond'o) is the word's own
#   n     the word in the Fundamento's spelling, parts joined; the sound and the morphology are read from the division
#   glue  the dash the print runs into the next word (jun'ec'o'n–mi) stays with the first word, and no space follows
#   Lines are the verses of the poems and, in the prayer, Weft's division at the clauses; sections are the four texts.
work: zamenhof-unua-libro
joiner: ' '
verify_strip: (?s)<noinclude>.*?</noinclude>|\{\{em\|\d\}\}\* \* \*|\{\{center\|[^{}]*\}\}|\{\{[^{}]*\}\}|<[^>]+>|''
