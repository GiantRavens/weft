# Notes on the Zauberflöte numbers.
- id: n.zf.vogelfaenger.1.premiere
  attach: zf.vogelfaenger.1.2
  kind: editorial
  status: draft
  leans_on: 'Peter Branscombe, W. A. Mozart: Die Zauberflöte (1991); the 1791 libretto''s frontispiece (the image above)'
  text: Die Zauberflöte opened at the Theater auf der Wieden, Schikaneder's suburban theatre in Vienna, on 30 September 1791, Mozart conducting, Schikaneder himself as Papageno in the feathered costume
    of the libretto's frontispiece. The bird-catcher's song is the first solo of the opera; the libretto prints three stanzas, and the first is lost to the scan's OCR, so the edition begins with the second,
    the net for girls.
- id: n.zf.vogelfaenger.4.spelling
  attach: zf.vogelfaenger.4.1
  kind: editorial
  status: draft
  leans_on: Adelung, Vollständige Anweisung zur Deutschen Orthographie (1788); the Berlin conference of 1901
  text: 'Bey, seyn, Bildniß, Noth, Verräther, reitzenden: the Viennese print of 1791 keeps the y of bey and seyn, the ß after a short vowel, the th of Noth and Verräther, the tz of reitzen. All went out
    with the reform of 1901; the modern spelling is in n, and the sound is the same. The scan''s OCR adds its own slips, f for the long s above all (fie, fanftes, fperrte), each declared in src.'
- id: n.zf.bildnis.1.aria
  attach: zf.bildnis.1.2
  kind: editorial
  status: draft
  leans_on: Branscombe 1991; the libretto's stage direction for the Three Ladies
  text: 'Dies Bildniß: Tamino''s portrait aria, sung to the miniature of Pamina the Three Ladies have given him; love at first sight of a picture is a stock situation of the fairy-tale opera, and Schikaneder''s
    text, with its stammer ''Ich würde — würde —'', is the one Mozart set most tenderly. The verse is iambic, four stresses to the line, the common measure of the German Singspiel.'
- id: n.zf.hoelle.1.queen
  attach: zf.hoelle.1.3
  kind: editorial
  status: draft
  leans_on: Branscombe 1991; Josepha Hofer's part (Mozart's sister-in-law, the first Queen)
  text: 'Der Hölle Rache: the Queen of the Night hands Pamina a dagger and demands Sarastro''s death. The aria''s two high F''s are the summit of the soprano repertory; the text''s threats, Verstossen,
    verlassen, Zertrümmert, are the rhetoric of the rage aria of Italian opera seria in German dress. The opera''s politics turn here: the Queen, wronged in Act I, is revealed as the enemy of Sarastro''s
    enlightened order.'
- id: n.zf.hallen.1.masonic
  attach: zf.hallen.1.3
  kind: editorial
  status: draft
  leans_on: Jacques Chailley, La Flûte enchantée, opéra maçonnique (1968); Branscombe 1991; Kant's Was ist Aufklärung? (1784, in this library)
  text: 'In diesen heil''gen Hallen: Sarastro''s creed of forgiveness, sung to Pamina. Mozart and Schikaneder were Freemasons, and the temple, the trials, the brotherhood that loves its fellow man and forgives
    its enemy are the lodge''s; the aria is the Enlightenment''s answer to the Queen''s vengeance, and its last couplet, that whoever is not gladdened by such teachings does not deserve to be a man, is
    the age''s own voice.'
- id: n.zf.maedchen.4.seeligkeit
  attach: zf.maedchen.12.2
  kind: editorial
  status: draft
  leans_on: the 1791 libretto, pages 88-89; Branscombe 1991 on the Glockenspiel
  text: 'Seeligkeit: the print spells the word with ee in the second stanza and Seligkeit in the first and third; the edition keeps both, as the compositor set them. Papageno sings the song to his magic
    bells, each stanza a verse of the Glockenspiel, and the old woman who answers it is Papagena in disguise; the number is the comic double of Tamino''s Bildnis aria, longing for a portrait against longing
    for any girl at all.'
