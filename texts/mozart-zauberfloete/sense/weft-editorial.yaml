# Weft's editorial translation, close to the German, one span per number; draft. The singing versions (Natalia Macfarren for Novello; Edward Dent 1911, in copyright) are cited in the manifest, not printed.
translation: weft-editorial
aligned_by: 'hand: one span per number'
spans:
- lines:
  - zf.vogelfaenger.1
  - zf.vogelfaenger.8
  text: The bird-catcher, that's me, always merry, heigh-ho, hopsasa! The bird-catcher is known to old and young in all the land. A net for girls is what I'd like! I'd catch them by the dozen for myself.
    Then I'd lock them up with me, and all the girls would be mine.
- lines:
  - zf.bildnis.1
  - zf.bildnis.14
  text: This portrait is enchantingly beautiful, as no eye has ever yet seen! I feel how this godlike image fills my heart with new emotion. This something I cannot name; yet I feel it burn here like fire.
    Can the feeling be love? Yes, yes! it is love alone. Oh, if only I could find her! Oh, if only she already stood before me! I would, I would, warm and pure, what would I do! I would press her, full
    of rapture, to this burning breast, and she would be mine forever.
- lines:
  - zf.hoelle.1
  - zf.hoelle.8
  text: Hell's vengeance boils in my heart; death and despair flame about me! If Sarastro does not feel the pangs of death through you, then you are my daughter nevermore. Be cast out forever, be forsaken,
    shattered forever all the bonds of nature, if Sarastro does not grow pale through you! Hear, gods of vengeance, hear a mother's oath.
- lines:
  - zf.hallen.1
  - zf.hallen.12
  text: Within these holy halls vengeance is unknown; and if a man has fallen, love leads him to his duty. Then he walks at a friend's hand, content and glad, into the better land. Within these holy walls,
    where man loves his fellow man, no traitor can lurk, because the enemy is forgiven. Whoever is not gladdened by such teachings does not deserve to be a man.
- lines:
  - zf.maedchen.1
  - zf.maedchen.24
  text: A girl or a little wife is what Papageno wishes for! Oh, such a gentle little dove would be bliss for me! Then eating and drinking would taste good to me, then I could measure myself with princes,
    enjoy life like a wise man, and be as if in Elysium. A girl or a little wife is what Papageno wishes for! Oh, such a gentle little dove would be bliss for me! Ah, can I not please even one of all the
    charming girls? Let just one help me out of my need, or else truly I'll grieve myself to death. A girl or a little wife is what Papageno wishes for! Oh, such a gentle little dove would be bliss for
    me. If none will grant me love, the flame must consume me! But if a womanly mouth kisses me, I am well again at once.
