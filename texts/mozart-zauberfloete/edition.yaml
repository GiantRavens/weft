# Weft edition of five numbers from Die Zauberflöte (Vienna, 1791), libretto by Emanuel Schikaneder: Papageno's Der
# Vogelfänger bin ich ja (the second stanza; the first is unreadable in the scan's OCR), Tamino's Dies Bildniß ist
# bezaubernd schön, the Queen of the Night's Der Hölle Rache, Sarastro's In diesen heil'gen Hallen, and Papageno's Ein
# Mädchen oder Weibchen. Text of the first edition of the libretto (Vienna: Alberti, 1791), from the Bayerische
# Staatsbibliothek's scan on the Internet Archive (00074489bsb), read as its OCR text: each line is checked against it
# by pipeline/weft/german.py (section field check, format fraktur-ocr), which reads long s as s, the superscript e of
# the umlauts as the umlaut and rejoins words divided at line ends; the OCR's misreadings (fie for sie, Retz for Netz,
# Negung for Regung, Murter for Mutter) are declared token by token in src, so the check still reproduces the scan.
# The 1791 spelling is kept: Bey, seyn, Bildniß, Dieß, Verstossen, Verräther, vergiebt, Noth, reitzenden, muß, küßt,
# Seeligkeit beside Seligkeit, and the elisions geseh'n, heil'gen, bess're, erfreu'n.
#   t     the word as printed, punctuation attached ("allein. —")
#   n     the modern spelling of the same form; an elided form is given joined (heil'gen: heilgen), for the sound
#   src   the OCR's reading where it differs from the print
#   Lines are the verses; sections are the five numbers.
work: mozart-zauberfloete
joiner: ' '
