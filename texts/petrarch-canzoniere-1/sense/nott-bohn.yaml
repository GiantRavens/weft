# The version signed NOTT under Sonnet I in The Sonnets, Triumphs, and Other Poems of Petrarch
# (Bohn's Illustrated Library, 1859; Project Gutenberg eBook 17650, George Bell reprint of 1879),
# verbatim. Bohn prints three versions of this sonnet (Charlemont, Nott, Dacre); Weft shows Nott's.
# No corrections. Spans follow the quatrains and tercets.
translation: nott-bohn
aligned_by: hand, phase 0; one span per quatrain or tercet
spans:
- lines:
  - rvf.1.1
  - rvf.1.4
  text: 'O ye, who list in scatter''d verse the sound

    Of all those sighs with which my heart I fed,

    When I, by youthful error first misled,

    Unlike my present self in heart was found;'
- lines:
  - rvf.1.5
  - rvf.1.8
  text: 'Who list the plaints, the reasonings that abound

    Throughout my song, by hopes, and vain griefs bred;

    If e''er true love its influence o''er ye shed,

    Oh! let your pity be with pardon crown''d.'
- lines:
  - rvf.1.9
  - rvf.1.11
  text: 'But now full well I see how to the crowd

    For length of time I proved a public jest:

    E''en by myself my folly is allow''d:'
- lines:
  - rvf.1.12
  - rvf.1.14
  text: 'And of my vanity the fruit is shame,

    Repentance, and a knowledge strong imprest,

    That worldly pleasure is a passing dream.'
