# Human overlay for Petrarch, Rerum vulgarium fragmenta 1. No treebank covers this text: lemma,
# morphology and gloss are by hand, draft.
# Lemmas are modern Italian headwords as in the Vocabolario Treccani; old forms (duoi, sieno,
# offeriscono, defende, lione, debbe, feciono, fussero, saria, nudriva, veggio, medesmo, pentersi)
# are lemmatized under the modern headword, with the TLIO (Tesoro della lingua italiana delle origini,
# OVI-CNR) and the Grande dizionario della lingua italiana (Battaglia) as the guide to their sense.
# Morphology uses Universal Dependencies features, after the conventions of the UD Italian
# treebanks (ISDT): essere as copula and auxiliary, and potere, dovere, volere before an
# infinitive, are AUX; a joined article or clitic is a second lemma after ' + '. The gloss keeps the
# Italian word order; grammar rides in the English (I-said, of-the, it-they-would-keep).
- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
