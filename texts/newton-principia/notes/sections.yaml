# Notes for Newton's three laws of motion (Principia, 1687).
- id: n.sci.cogo
  attach: sci.newton-1.2.6
  kind: editorial
  status: draft
  text: "Cogitur, 'is compelled', is from cogo, 'drive together', and Descartes's cogito, 'think', is from cogito, 'turn over in the mind'. Both are built on the prefix co- and the root of ago, 'drive': coago, coagito. A thinker was, in Latin, one who drives thoughts together."
- id: n.sci.english
  attach: sci.newton-1.1
  kind: editorial
  status: draft
  text: "English scholars read Latin with English vowel values until reforms in the late nineteenth century. A stressed vowel in an open syllable took its English long sound, so statu was STAY-tyoo and mutare myoo-TAY-ree, and ti before a vowel became sh. This is why English says mutation and proportion as it does: the words entered English through this pronunciation."
- id: n.sci.accinf
  attach: sci.newton-1.1.3
  kind: editorial
  status: draft
  text: "Each law is an accusative with an infinitive, corpus omne perseverare, 'every body to persevere', grammatically dependent on the heading Axiomata sive Leges Motus, 'Axioms, or Laws of Motion'. The laws are stated as propositions laid down, not as events."
- id: n.sci.motus
  attach: sci.newton-2.1.2
  kind: editorial
  status: draft
  text: "Newton's motus, 'motion', means what physics now calls momentum: in his Definition II, the quantity of motion arises from the velocity and the quantity of matter together. The familiar form F = ma was written later, notably by Euler in 1750."
- id: n.sci.examples
  attach: sci.newton-3.1
  kind: editorial
  status: draft
  text: "Newton follows Law III with everyday cases: a finger pressing a stone is pressed by the stone, and a horse pulling a stone on a rope is drawn back toward the stone."
- id: n.sci.longs
  attach: sci.newton-1.1.1
  kind: editorial
  status: draft
  text: "Motte's translation keeps the long s of 1729 printing: perſeveres, ſtate, reſt. The long s (ſ) was used at the start and in the middle of words, the round s at the end, until English printers dropped it around 1800."
