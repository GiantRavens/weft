- id: dan.5.23
  cite: urn:weft:arc:tanakh.daniel.wlc-oshb:5.23
  text: וְעַ֣ל מָרֵֽא־ שְׁמַיָּ֣א׀ הִתְרוֹמַ֡מְתָּ וּלְמָֽאנַיָּ֨א דִֽי־ בַיְתֵ֜הּ הַיְתִ֣יו קדמיך ואנתה ורברבניך שֵֽׁגְלָתָ֣ךְ וּלְחֵנָתָךְ֮ חַמְרָא֮ שָׁתַ֣יִן בְּהוֹן֒ וְלֵֽאלָהֵ֣י כַסְפָּֽא־ וְ֠דַהֲבָא
    נְחָשָׁ֨א פַרְזְלָ֜א אָעָ֣א וְאַבְנָ֗א דִּ֠י לָֽא־ חָזַ֧יִן וְלָא־ שָׁמְעִ֛ין וְלָ֥א יָדְעִ֖ין שַׁבַּ֑חְתָּ וְלֵֽאלָהָ֞א דִּֽי־ נִשְׁמְתָ֥ךְ בִּידֵ֛הּ וְכָל־ אֹרְחָתָ֥ךְ לֵ֖הּ לָ֥א הַדַּֽרְתָּ׃
