  lead: 'The story of Belshazzar''s feast (the writing on the wall) is contained in chapter 5 of the Book
    of Daniel. In the story, Neo-Babylonian royal Belshazzar holds a feast and drinks from vessels looted
    from the First Temple. A hand appears and writes on the wall and Belshazzar calls for his wise men,
    but they cannot read the writing. The queen advises him to send for Daniel, who reminds Belshazzar
    about Nebuchadnezzar''s arrogance and subsequent humiliation (Daniel 4). Daniel reads and interprets
    the message: God has numbered Belshazzar''s days, he has been weighed and found wanting, and his kingdom
    will be given to the Medes and the Persians.'
