  - jn.1.1
  text: In the beginning was that Word, and that Word was with God, and that Word was God.
- lines:
  - jn.1.2
  - jn.1.2
  text: This same was in the beginning with God.
- lines:
  - jn.1.3
  - jn.1.3
  text: All things were made by it, and without it was made nothing that was made.
- lines:
  - jn.1.4
  - jn.1.4
  text: In it was life, and that life was the light of men.
- lines:
  - jn.1.5
  - jn.1.5
  text: And that light shineth in the darkenesse, and the darkenesse comprehended it not.
- lines:
  - jn.1.6
  - jn.1.6
  text: There was a man sent from God, whose name was Iohn.
- lines:
  - jn.1.7
  - jn.1.7
  text: This same came for a witnesse, to beare witnesse of that light, that all men through him might beleeue.
- lines:
  - jn.1.8
  - jn.1.8
  text: He was not that light, but was sent to beare witnesse of that light.
- lines:
  - jn.1.9
  - jn.1.9
  text: This was that true light, which lighteth euery man that commeth into the world.
- lines:
  - jn.1.10
  - jn.1.10
  text: 'He was in the world, and the worlde was made by him: and the worlde knewe him not.'
- lines:
  - jn.1.11
  - jn.1.11
  text: He came vnto his owne, and his owne receiued him not.
- lines:
  - jn.1.12
  - jn.1.12
  text: But as many as receiued him, to them he gaue prerogatiue to be the sonnes of God, euen to them that beleeue in his Name.
- lines:
  - jn.1.13
  - jn.1.13
  text: Which are borne not of blood, nor of the will of the flesh, nor of ye wil of man, but of God.
- lines:
  - jn.1.14
  - jn.1.14
  text: And that Word was made flesh, and dwelt among vs, (and we sawe the glorie thereof, as the glorie of the onely begotten Sonne of the Father) full of grace and trueth.
- lines:
  - jn.1.15
  - jn.1.15
  text: 'Iohn bare witnesse of him, and cryed, saying, This was he of whom I said, He that commeth after me, was before me: for he was better then I.'
- lines:
  - jn.1.16
  - jn.1.16
  text: And of his fulnesse haue all we receiued, and grace for grace.
- lines:
  - jn.1.17
  - jn.1.17
  text: For the Lawe was giuen by Moses, but grace, and trueth came by Iesus Christ.
- lines:
  - jn.1.18
  - jn.1.18
  text: 'No man hath seene God at any time: that onely begotten Sonne, which is in the bosome of the Father, he hath declared him.'
