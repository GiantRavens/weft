# Notes for John 1:1-18.
- id: n.jn.1.1.enarche
  attach: jn.1.1.1
  kind: editorial
  status: draft
  text: "Ἐν ἀρχῇ, 'in the beginning', are also the first two words of Genesis in the Septuagint, the Greek translation of the Hebrew Bible widely read by Greek-speaking Jews and early Christians: Ἐν ἀρχῇ ἐποίησεν ὁ θεός. Most commentators read John's opening as a deliberate echo. Genesis in Hebrew, בְּרֵאשִׁית, is in this library."
- id: n.jn.1.1.logos
  attach: jn.1.1.5
  kind: editorial
  status: draft
  text: "Λόγος means word, speech, account and reason. Heraclitus, and later the Stoics, used it for the rational order of the world. The three English versions here all say 'Word', but Tyndale refers to it as 'it' from verse 3: 'In it was lyfe'."
- id: n.jn.1.1.pros
  attach: jn.1.1.10
  kind: editorial
  status: draft
  text: "Πρός with the accusative usually means 'toward'. English versions say 'with God'; some commentators read the Greek as 'facing God'."
- id: n.jn.1.1.theos
  attach: jn.1.1.14
  kind: editorial
  status: draft
  text: "Θεὸς ἦν ὁ λόγος: 'God' comes first, without the article, while ὁ λόγος keeps its article, which marks it as the subject. How to carry that difference into English is a long-standing question in New Testament grammar."
- id: n.jn.1.3.punctuation
  attach: jn.1.3.11
  kind: editorial
  status: draft
  text: "The earliest manuscripts have no punctuation, so ὃ γέγονεν, 'what has come to be', can end verse 3, as here, or begin verse 4: 'what came to be in him was life'. Early Christian writers often read it the second way."
- id: n.jn.1.5.katelaben
  attach: jn.1.5.13
  kind: editorial
  status: draft
  text: "Κατέλαβεν can mean 'grasped, understood' or 'seized, overcame'. All three English versions here choose understanding: 'comprehended it not'. Many modern translations choose conflict: 'the darkness has not overcome it'."
- id: n.jn.1.6.en-egeneto
  attach: jn.1.6.1
  kind: editorial
  status: draft
  leans_on: "MorphGNT parsing of ἦν (imperfect of εἰμί) and ἐγένετο (aorist of γίνομαι), John 1:1-18"
  text: "The prologue uses two verbs for being. Ἦν, the imperfect of εἰμί, 'was', describes a state without a starting point, and it is used of the Word in verses 1 and 2. Ἐγένετο, the aorist of γίνομαι, 'came to be', describes an event, and it is used of everything made (verse 3), of John the Baptist here ('there came to be a man'), and of the Word in verse 14: ὁ λόγος σὰρξ ἐγένετο, 'the Word became flesh'. Many commentators read the contrast as deliberate. The King James Version renders ἐγένετο as 'were made' or 'was made' in verses 3, 10 and 14 and as 'There was' in verse 6, so in verse 6 the contrast with verse 1 does not show in English."
- id: n.jn.1.14.eskenosen
  attach: jn.1.14.7
  kind: editorial
  status: draft
  leans_on: "LSJ s.v. σκηνόω, σκηνή"
  text: "Ἐσκήνωσεν is the aorist of σκηνόω, from σκηνή, 'tent'. Its plain sense is 'pitched a tent' or 'lived in a tent', and so 'took up residence'. In the Septuagint σκηνή is the word for the tabernacle, the tent of meeting in the wilderness, and the next clause speaks of seeing 'glory', which in Exodus fills that tent. Some commentators also hear the Hebrew root שׁכן, 'to dwell', behind the Greek, because its consonants, š-k-n, are close to the Greek s-k-n. All three English versions here say 'dwelt', which keeps the residence and drops the tent."
- id: n.jn.1.18.monogenes
  attach: jn.1.18.5
  kind: editorial
  status: draft
  leans_on: "SBLGNT apparatus at John 1:18; B. M. Metzger, A Textual Commentary on the Greek New Testament (2nd ed. 1994), on John 1:18"
  text: "The manuscripts differ here; the SBLGNT text marks the two words with half-brackets, ⸂ ⸃. The text printed, μονογενὴς θεός, 'only-one God', is the reading of the earliest papyri (P66, P75) and of Codex Sinaiticus and Codex Vaticanus. Codex Alexandrinus and most later manuscripts read ὁ μονογενὴς υἱός, 'the only Son', and that is the text all three English versions here translate: 'the only begotten Son'. Μονογενής means 'only' or 'one of a kind'; 'only begotten' follows the Latin unigenitus. Scholars who prefer θεός point to the age of its witnesses and argue that a scribe was more likely to change the unusual phrase to the familiar one than the reverse. Those who prefer υἱός point to John's usage elsewhere (3:16, 3:18), where μονογενής goes with 'Son'."
