# Notes for John 1:1-5.
- id: n.jn.1.1.enarche
  attach: jn.1.1.1
  kind: editorial
  status: draft
  text: "Ἐν ἀρχῇ, 'in the beginning', are the first two words of Genesis in the Greek Septuagint, the Bible John's readers knew: Ἐν ἀρχῇ ἐποίησεν ὁ θεός. John opens his gospel exactly where Genesis opens the world. Genesis in its own Hebrew, בְּרֵאשִׁית, is the next work in this library."
- id: n.jn.1.1.logos
  attach: jn.1.1.5
  kind: editorial
  status: draft
  text: "Λόγος means word, speech, account and reason. Greek philosophers from Heraclitus on used it for the rational order running through the world. Every English Bible here says 'Word', but Tyndale switches to 'it' from verse 3: 'In it was lyfe'."
- id: n.jn.1.1.pros
  attach: jn.1.1.10
  kind: editorial
  status: draft
  text: "Πρός with the accusative usually means 'toward'. English Bibles say 'with God'; the Greek pictures the Word turned toward God, face to face."
- id: n.jn.1.1.theos
  attach: jn.1.1.14
  kind: editorial
  status: draft
  text: "Θεὸς ἦν ὁ λόγος: 'God' comes first for emphasis, and has no article, while ὁ λόγος keeps its article to mark it as the subject. How to carry that difference into English is one of the most discussed questions of New Testament grammar."
- id: n.jn.1.3.punctuation
  attach: jn.1.3.11
  kind: editorial
  status: draft
  text: "The earliest manuscripts have no punctuation, so ὃ γέγονεν, 'what has come to be', can end verse 3, as here, or begin verse 4: 'what came to be in him was life'. Early Christian writers often read it the second way."
- id: n.jn.1.5.katelaben
  attach: jn.1.5.13
  kind: editorial
  status: draft
  text: "Κατέλαβεν can mean 'grasped, understood' or 'seized, overcame'. All three English versions here choose understanding: 'comprehended it not'. Many modern translations choose conflict: 'the darkness has not overcome it'."
