# Notes for the Charter of Liberties of Henry I.
- id: n.hen.issue
  attach: hen.pre.1
  kind: editorial
  status: draft
  text: "Henry I was crowned at Westminster on 5 August 1100, three days after his brother William II died in the New Forest, and issued this charter at his coronation. A copy went to each shire. This one is addressed to Worcestershire: to Samson, bishop of Worcester, and Urse d'Abetot, its sheriff. Roger of Wendover gives the copy sent to Hertfordshire. Stubbs and Davis print the Worcestershire address from the Red Book of the Exchequer (fo. 163v) with the text common to the copies."
- id: n.hen.oath
  attach: hen.1.1
  kind: editorial
  status: draft
  text: "Stubbs (Select Charters) calls the charter an amplification of the coronation oath, whose ancient form, used at Ethelred's coronation, promised peace to the Church, an end to rapacity and iniquity, and justice with mercy. The charter turns those promises into named grievances against the late reign: the sale and farming of vacant churches (chapter 1), reliefs (2), the sale of marriages and wardships (3, 4), and the rest, each 'evil custom' set down to be taken away."
- id: n.hen.relief
  attach: hen.2.2
  kind: editorial
  status: draft
  text: "Relevatio, 'relief', is the payment an heir made to the lord to take up his father's land. The charter says that under William II the heir had to buy the land back (redimet, 'shall not redeem ... as he did in the time of my brother'); Henry promises a 'just and legitimate' relief instead. The chapter binds the barons too: they must treat their own men's heirs the same way. Magna Carta (1215) fixes reliefs in figures (chapter 2) and makes the same demand of the barons toward their men (chapter 60)."
- id: n.hen.edward
  attach: hen.13.1
  kind: editorial
  status: draft
  text: "Lagam Eadwardi regis, 'the law of King Edward': Edward the Confessor (died 1066), whom the Normans treated as the last lawful king before the Conquest. Laga is the English word lagu, 'law', in Latin dress. The promise to restore his law with William I's amendments was a claim to continuity with the English kingdom; in November 1100 Henry married Edith (Matilda), a princess of the old English royal line."
- id: n.hen.magna
  attach: hen.14.3
  kind: editorial
  status: draft
  text: "Later kings did not reissue the charter, and its promises were not kept. In 1213, by the account of Roger of Wendover, Stephen Langton, archbishop of Canterbury, produced a copy before the barons, and its articles became a model for their demands on John. Stubbs writes that 'in every point, either by likeness or by contrast, this charter has important bearings' on the programme of 1215. Magna Carta's chapters 39 and 40 are in this library."
- id: n.hen.text
  attach: hen.5.2
  kind: editorial
  status: draft
  text: "The text is Stubbs and Davis's (1913), checked word for word against the scan. They follow Liebermann's Gesetze der Angelsachsen and Bémont's Chartes des libertés anglaises (1892) for the readings; the copies differ in small points, and the variants are not shown here. A footnote in their edition records that in chapter 5 the Red Book of the Exchequer reads fiat for sit in 'hoc ne amodo sit omnino defendo'."
