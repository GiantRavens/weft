# Edward P. Cheyney's translation, in G. B. Adams and H. M. Stephens, Select Documents of English
# Constitutional History (New York, 1901), no. 7, pp. 4-6. Transcribed from the page images (archive.org
# cu31924030503555, leaf n27 to n29), of which the pinned OCR is the witness; the OCR's marginal noise and
# misreadings are left out, a word the print hyphenates across a line is joined, and the space the print
# sets before ; is closed. Cheyney translates another copy of the charter: his preamble (dated 1101,
# addressed 'to all faithful') and his list of witnesses (Gundulf, Henry de Port) are not this copy's, so
# his spans cover chapters 1 to 14 only.
translation: cheyney1901
aligned_by: hand, phase 0; one span per chapter
spans:
- lines:
  - hen.1.1
  - hen.1.11
  text: Know that by the mercy of God, and by the common counsel of the barons of the whole kingdom of England, I have been crowned king of the same kingdom; and because the kingdom has been oppressed by
    unjust exactions, I, from regard to God, and from the love which I have toward you, in the first place make the holy church of God free, so that I will neither sell nor place at rent, nor, when archbishop,
    or bishop, or abbot is dead, will I take anything from the domain of the church, or from its men, until a successor is installed into it. And all the evil customs by which the realm of England was unjustly
    oppressed will I take away, which evil customs I partly set down here.
- lines:
  - hen.2.1
  - hen.2.5
  text: If any one of my barons, or earls, or others who hold from me shall have died, his heir shall not redeem his land as he did in the time of my brother, but shall relieve it by a just and legitimate
    relief. Similarly also the men of my barons shall relieve their lands from their lords by a just and legitimate relief.
- lines:
  - hen.3.1
  - hen.3.9
  text: And if any one of the barons or other men of mine wishes to give his daughter in marriage, or his sister or niece or relation, he must speak with me about it, but I will neither take anything from
    him for this permission, nor forbid him to give her in marriage, unless he should wish to join her to my enemy. And if when a baron or other man of mine is dead, a daughter remains as his heir, I will
    give her in marriage according to the judgment of my barons, along with her land. And if when a man is dead his wife remains, and is without children, she shall have her dowry and right of marriage,
    and I will not give her to a husband except according to her will.
- lines:
  - hen.4.1
  - hen.4.4
  text: And if a wife has survived with children, she shall have her dowry and right of marriage, so long as she shall have kept her body legitimately, and I will not give her in marriage, except according
    to her will. And the guardian of the land and children shall be either the wife or another one of the relatives as shall seem to be most just. And I require that my barons should deal similarly with
    the sons and daughters or wives of their men.
- lines:
  - hen.5.1
  - hen.5.3
  text: The common tax on money which used to be taken through the cities and counties, which was not taken in the time of King Edward, I now forbid altogether henceforth to be taken. If any one shall have
    been seised, whether a moneyer or any other, with false money, strict justice shall be done for it.
- lines:
  - hen.6.1
  - hen.6.5
  text: All fines and all debts which were owed to my brother, I remit, except my rightful rents, and except those payments which had been agreed upon for the inheritances of others or for those things
    which more justly affected others. And if any one for his own inheritance has stipulated anything, this I remit, and all reliefs which had been agreed upon for rightful inheritances.
- lines:
  - hen.7.1
  - hen.7.5
  text: And if any of my barons or men shall become feeble, however he himself shall give or arrange to give his money, I grant that it shall be so given. Moreover, if he himself, prevented by arms, or
    by weakness, shall not have bestowed his money, or arranged to bestow it, his wife or his children or parents, and his legitimate men shall divide it for his soul, as to them shall seem best.
- lines:
  - hen.8.1
  - hen.8.5
  text: If any of my barons or men shall have committed an offence he shall not give security to the extent of forfeiture of his money, as he did in the time of my father, or of my brother, but according
    to the measure of the offence so shall he pay, as he would have paid from the time of my father backward, in the time of my other predecessors; so that if he shall have been convicted of treachery or
    of crime, he shall pay as is just.
- lines:
  - hen.9.1
  - hen.9.2
  text: All murders moreover before that day in which I was crowned King, I pardon; and those which shall be done henceforth shall be punished justly according to the law of King Edward.
- lines:
  - hen.10.1
  - hen.10.1
  text: The forests, by the common agreement of my barons, I have retained in my own hand, as my father held them.
- lines:
  - hen.11.1
  - hen.11.6
  text: To those Knights who hold their land by the cuirass, I yield of my own gift the lands of their demesne ploughs free from all payments and from all labor, so that as they have thus been favored by
    such a great alleviation, so they may readily provide themselves with horses and arms for my service and for the defence of my kingdom.
- lines:
  - hen.12.1
  - hen.12.1
  text: A firm peace in my whole kingdom I establish and require to be kept from henceforth.
- lines:
  - hen.13.1
  - hen.13.2
  text: The law of King Edward I give to you again with those changes with which my father changed it by the counsel of his barons.
- lines:
  - hen.14.1
  - hen.14.3
  text: If any one has taken anything from my possessions since the death of King William, my brother, or from the possessions of any one, let the whole be immediately returned without alteration, and if
    any one shall have retained anything thence, he upon whom it is found will pay it heavily to me.
