# Weft's own translation of the Worcestershire preamble and the witness clause, which Cheyney's copy
# does not share; close to the Latin, draft.
translation: weft-editorial
aligned_by: hand, phase 0; the parts Cheyney does not translate
spans:
- lines:
  - hen.pre.1
  - hen.pre.2
  text: Henry, king of the English, to Bishop Samson and Urse d'Abetot and all his barons and faithful men, French and English, of Worcestershire, greeting.
- lines:
  - hen.t.1
  - hen.t.5
  text: 'Witnesses: Maurice, bishop of London, and William, bishop-elect of Winchester, and Gerard, bishop of Hereford, and Earl Henry and Earl Simon, and Walter Giffard and Robert de Montfort and Roger
    Bigod, and Eudo the steward, and Robert son of Hamo, and Robert Malet. At London, when I was crowned. Farewell.'
