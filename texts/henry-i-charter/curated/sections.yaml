# Human overlay for the Charter of Liberties of Henry I (1100), Stubbs 1913 text, the Worcestershire copy.
# No treebank covers medieval charters, so this file carries lemma and morphology too (rule 3 exception),
# hand-annotated and in draft. Lemmas follow Lewis and Short under their classical headwords, as the
# Magna Carta and Saer de Quincy overlays do (heres for haeres, hereditas for haereditas, j kept as in
# justitia); medieval words take the headword of Latham and Du Cange, each noted where it first occurs.
# Names keep the edition's spelling as lemma where no Latin form is attested. Written in the compact spec
# and expanded by weft overlay.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-31"
  why: "whole charter, preamble to witness list; hand annotation, no treebank. Method: the reuse map of the Magna Carta and Saer de Quincy overlays (weft overlay --reuse) supplied the frequent forms and their conventions (meus, suus, omnis, totus as DET; is and ego as personal pronouns; non as PART with Polarity=Neg; sum as AUX), then every line was read in context. Glosses follow Cheyney 1901 where his English fits the Latin and the Latin where he paraphrases (firma as rent, maritatio as right-of-marriage, misericordia as mercy, deserviunt as serve-for). Classical headwords from Lewis and Short; medieval headwords (relevatio, maritatio, monetagium, forisfacio, forisfactum, vadium, murdrum, laga, foresta, carruca, geldum, dapifer, firma, Francigena, Angligena) from Latham's Revised Medieval Latin Word-List and Du Cange. These dictionary references, the s.v. citations in the line notes and the identifications of the witnesses are from memory, not checked against the printed page in this session; a reviewer should verify them. Deponent verbs (loquor, ingredior, morior, paciscor) carry Voice=Pass, the morphology of the form. Future perfects carry Aspect=Perf with Tense=Fut; vendam, ponam, accipiam in 1.6 and 1.8 are read as subjunctives after ita quod."
  status: "draft"
  set:
    # hen.pre.1: Samson, bishop of Worcester, and Urse d'Abetot, sheriff of Worcestershire: the address of this copy. Names keep the edition's spelling as lemma; the gloss gives the usual English form
