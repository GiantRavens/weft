  lead: 'The Charter of Liberties (Latin: Carta Libertatum), also called the Coronation Charter, or Statutes
    of the Realm, was a written proclamation by Henry I of England, issued upon his accession to the throne
    in 1100. It sought to bind the King to certain laws regarding the treatment of nobles, church officials,
    and individuals. The nineteenth-century historians Frederick Maitland and Frederick Pollock considered
    it a landmark document in English legal history and a forerunner of Magna Carta. It was issued in
    Latin, Anglo-Norman and Old English versions, a sign of the increasing status of the English language
    at the time.'
