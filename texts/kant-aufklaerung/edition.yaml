# Weft edition of a passage by Immanuel Kant, in the spelling of its first printing.
#
# auf  Beantwortung der Frage: Was ist Aufklärung?, Berlinische Monatsschrift 4 (1784), Zwölftes
#      Stück (December), pages 481-482: the first two paragraphs, through "von allen ferneren
#      Versuchen ab". Text of German Wikisource, revision 3778353, which transcribes the 1784 print
#      (scan of the Universitätsbibliothek Bielefeld) in its spelling (Muth, Theil, nöthig, schrekt,
#      einigemahl) with long s printed as s. Checked verbatim against that revision by `weft draft`
#      (verify_in); verify_strip sets aside the wiki markup (bold, spaced type, the page marks
#      {{Seite|482}}, the editors' footnotes in <ref>, the <tt> around the Latin, and the
#      non-breaking spaces in "u. s. w.", which therefore stands as one token, u.s.w.).
#
# Weft divides the text into lines at the sentence and, in long sentences, at a clause.
#
#   t     the word as printed, punctuation attached ("Unmündigkeit.", "(naturaliter")
#   n     the modern spelling of the same word form (Muth: Mut, Theil: Teil); the form is kept (drohet, einsperreten, zunehmenden). The page shows it as
#         "Modern spelling"; the sound of both schemes is computed from it
#         (pipeline/weft/german.py with pipeline/weft/data/de_lexicon.yaml)
