# John Richardson's translation, "Answer to the question, What is Enlightening?", in Essays and
# Treatises on Moral, Political, and Various Philosophical Subjects, by Emanuel Kant (London, 1798),
# volume 1, pages 3-4: the first English translation of the essay. The text is the Internet Archive
# OCR of a Google scan (essaysandtreati01kantgoog), which is poor on these pages; it was corrected by
# reading it against the OCR of a second copy of the same printing
# (bim_eighteenth-century_essays-and-treatises-on-_kant-immanuel_1798_1). Corrections, all of OCR
# errors where the two copies or the sense agree:
