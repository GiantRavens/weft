# Notes for Kant: Was ist Aufklärung? (1784, opening).
- id: n.kant.auf.question
  attach: kant.auf.1
  kind: editorial
  status: draft
  leans_on: "the 1784 print as transcribed on German Wikisource (revision 3778353), its heading and Kant's closing footnote, with the Wikisource editors' notes"
  text: "The essay answers a question, and the print says whose. Under the title the Berlinische Monatsschrift refers the reader to its own issue of December 1783, page 516, where Johann Friedrich Zöllner had asked in a footnote what enlightenment is, and said he had found no answer anywhere. Kant dates his answer Königsberg, 30 September 1784. In a footnote at the end he reports that he has just seen a notice of Moses Mendelssohn's answer to the same question, printed in the same journal in September, and that he has not yet read it. The two answers were therefore written independently."
- id: n.kant.auf.unmuendigkeit
  attach: kant.auf.1.11
  kind: editorial
  status: draft
  leans_on: "Grimm, Deutsches Wörterbuch, s.v. mündig, Mund (in the sense protection), Vormund; Adelung, Grammatisch-kritisches Wörterbuch (1793-1801), s.v. mündig"
  text: "Mündig is a legal word. A person who is mündig is of age, able to act in law without a guardian; a person who is unmündig is a minor, or someone treated as one, whose affairs a guardian (Vormund) conducts. The Mund in these words is not the mouth: it is an old word for protection and the authority of the head of a household. Kant builds the essay on this legal picture. The guardians reappear in the second paragraph (Vormündern, Vormünder), and the Latin naturaliter majorennes, of age by nature, sets the age nature grants against the minority people keep. His definition moves the word from law to the use of the understanding, and adds that this minority is self-incurred, which a legal minority is not. The gloss un-of-age-ness keeps the parts; Richardson's English of 1798 has nonage."
- id: n.kant.auf.sapere
  attach: kant.auf.4.1
  kind: editorial
  status: draft
  leans_on: "Horace, Epistles 1.2.40-41; the Wikisource editors' note to the passage"
  text: "Sapere aude is from Horace's letter to Lollius (Epistles 1.2.40): dimidium facti qui coepit habet: sapere aude, incipe, he who has begun has half the deed done: dare to be wise, begin. In Horace sapere means to be wise, to have sense, and the advice is practical: stop putting off a sensible life. Kant does not cite Horace; he takes the two words as a motto and supplies his own German for them, Habe Muth dich deines eigenen Verstandes zu bedienen, have the courage to use your own understanding. The German is a reading of the Latin rather than a translation of it: it turns to be wise into to use one's understanding, and puts the weight on courage, which the preceding sentence names as what is lacking."
- id: n.kant.sound
  attach: kant.auf.1
  kind: editorial
  status: draft
  leans_on: "W. Viëtor, Die Aussprache des Schriftdeutschen (1885); T. Siebs, Deutsche Bühnenaussprache (1898); P. von Polenz, Deutsche Sprachgeschichte, volume 2 (1994)"
  text: "The first sound scheme is a reconstruction of educated northern German as read in Königsberg in the 1780s, and it is approximate. There was no codified pronunciation norm before Siebs's stage norm of 1898, and no description of Kant's own speech has been used. The features modelled are those reported for educated northern speech of the period: g at the end of a syllable said as a fricative (Tag with kh, Weg with the h of huge), a trilled r in every position, st and sp at the start of a word part said with sh, final devoicing, and long ä kept apart from long e. The spellings of 1784 (Muth, Theil) are spellings only: th was said t. The Latin is given in the German school pronunciation, with s said z before a vowel."
