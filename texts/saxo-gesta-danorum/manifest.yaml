predicted_gaps:
- "only chapters 3 to 5 of book 9 (Siward Ring, Ragnar, and his sons' vengeance) are given; the rest of book 9 and the other fifteen books are not"
- "no treebank covers Saxo: lemma, morphology and gloss are hand-annotated after Lewis and Short in classical spelling, by five hands under one convention table (draft)"
- "the Latin is Holder's (1886), read from one copy's OCR; the 318 words on which four OCRs of three copies disagreed, or on which Holder differs from the Olrik-Raeder edition, were read on the page images, and the rest rests on the agreement of the OCRs. Paragraph and sentence numbers follow Olrik and Raeder (1931); their text is not used"
- "the danish-medieval sound scheme reconstructs Latin as read in Denmark around 1200 from spelling evidence and the later history of Danish (approximate); vowel lengths come from a table with one value per printed form, so a form that stands in two cases (filia and filiā) shows one length in the classical scheme"
- "Elton's translation is given in the Norroena Society's reprint of 1905, as transcribed by Project Gutenberg, which departs from the 1894 print in a few words; two transcription errors are corrected from the 1894 print"
