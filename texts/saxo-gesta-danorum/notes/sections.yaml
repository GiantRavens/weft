- id: n.gd.saxo
  attach: gd.3.1.1
  kind: editorial
  status: draft
  leans_on: "the Wikipedia article Gesta Danorum (revision 1371535188), lead; Elton's introduction (1894); Holder's edition (1886) and its preface"
  text: "Saxo wrote the Gesta Danorum, a history of the Danes in sixteen books, in Latin around 1200; he says that Absalon, Archbishop of Lund from 1179 to 1201, pressed him to write it. Ragnar's reign and its aftermath fill most of book 9. The work was little read for three centuries and survives in an epitome, a few manuscript fragments and the first printed edition (Paris, 1514). The Latin here is Alfred Holder's edition of 1886. Holder follows the spelling of the 1514 print except where the fragment of Angers, which he held to have passed through Saxo's own hands, spells otherwise; the result is a medieval spelling: u for v (uir), e for ae (Suetie), ci for ti before a vowel (gracia)."
- id: n.gd.lathgertha
  attach: gd.4.2.1
  kind: editorial
  status: draft
  leans_on: "the Latin text, 9.4.2-9.4.4, 9.4.9 and 9.4.11; Elton's translation; Ragnars saga loðbrókar and Þáttr af Ragnars sonum (on this site)"
  text: "Saxo calls Lathgertha a woman skilled in war who fought among the foremost with her hair loose over her shoulders. Ragnar woos her, she sets a bear and a dog at her door, and he kills both; they marry and have a son, Fridleif, and two daughters, until Ragnar turns to Thora and divorces her. When he fights Harald she comes from Norway with her new husband, her son and 120 ships (9.4.9), turns the battle by attacking from the rear (9.4.11), and on her return home kills that husband with a spear-head hidden in her gown. Neither the saga nor the þáttr names her."
- id: n.gd.lothbrog
  attach: gd.4.8.1
  kind: editorial
  status: draft
  leans_on: "the Latin text, 9.4.5-9.4.8; Ragnars saga loðbrókar, ch. 2-3 (on this site)"
  text: "Saxo and the saga tell the winning of Thora in different ways. In Saxo, Thora's father is Herodd, king of the Swedes, who brings home snakes found on a hunt for his daughter to rear (9.4.5); Ragnar asks for a woolen mantle and shaggy thigh-pieces, plunges into water in a frost and lets the wet clothes freeze hard (9.4.6), and kills two snakes. In the saga her father is Herraud, an earl in Gautland, and the clothes are boiled in pitch and rolled in sand. Saxo gives the name in this line: the king, laughing at the shaggy breeches, calls him Lothbrog in jest."
- id: n.gd.harald
  attach: gd.4.36.1
  kind: editorial
  status: draft
  leans_on: "the Latin text, 9.4.36-9.4.37; the Royal Frankish Annals, year 826"
  text: "Saxo's Harald, driven out by Ragnar, asks help of Ludwig at Mainz and receives it on condition that he is baptized; he then builds a church in Sleswik. The Royal Frankish Annals record that a Danish king Harald was baptized with his followers at St. Alban's in Mainz in 826, in the reign of Louis the Pious. Saxo's chronology places Ragnar beside these events; whether a historical Ragnar can be fixed in time is not settled by this text."
- id: n.gd.snakepit
  attach: gd.4.38.4
  kind: editorial
  status: draft
  leans_on: "the Latin text, 9.4.38; Ragnars saga loðbrókar, ch. 15 (on this site)"
  text: "In Saxo, Ella (Hella) goes over to the Irish and kills Ragnar's adherents; Ragnar attacks him with his fleet, is taken, and is thrown to snakes in prison. Ragnar recounts his deeds and ends with the saying in this line: if the young pigs knew the boar's punishment, they would break into the sty to free him. Ella takes it to mean that some of Ragnar's sons are alive and orders the snakes removed, but Ragnar is dead before the order is carried out. The saga gives the saying in prose, 'The piglets would grunt now if they knew what the old (boar) suffers' (ch. 15), and again in a stanza."
- id: n.gd.revenge
  attach: gd.5.4.1
  kind: editorial
  status: draft
  leans_on: "the Latin text, 9.5.4-9.5.5; Ragnars saga loðbrókar, ch. 16-17; Þáttr af Ragnars sonum, ch. 3 (both on this site)"
  text: "Both tell of Ivar's trick with a hide cut into thin thongs to enclose ground for a town. In Saxo the hide is a horse's (equino tergore), asked as a pledge of peace; in the saga it is an ox-hide, asked as compensation, soaked and stretched before it is cut, and the town is London. Saxo then gives the eagle cut on Ella's back to Siward and Bjorn, who also salt the wound (9.5.5); in the saga Ivar orders the eagle, and the þáttr's verse says that Ivar, who sat at York, had it cut."
