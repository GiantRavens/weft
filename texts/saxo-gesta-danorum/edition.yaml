# Weft edition: Saxo Grammaticus, Gesta Danorum, book 9, chapters 3 to 5: Siward Ring and the birth of Regnerus
# (Ragnar), Ragnar's reign and death in King Hella's snake pit, and the vengeance of his sons.
#
# The text is Alfred Holder's (Saxonis Grammatici Gesta Danorum, Strassburg 1886), pp. 299-316, read from the
# Internet Archive's OCR of the University of Toronto copy (sources/holder1886-ocr.txt) and corrected against the page
# images of that scan. Holder follows the spelling of the first printed edition (Paris, 1514) except where the
# fragment of Angers spells otherwise (his preface): u for consonantal v (uir, Iuarus), e for ae and oe (Suetie,
# pene), ci for ti before a vowel (gracia, expedicione), y in hyeme and Syuardus. Paragraphs and sentences are numbered as in the Olrik-Raeder edition (Copenhagen, 1931),
# the standard citation (9.4.12 is book 9, chapter 4, paragraph 12); the section id is chapter.paragraph and the line
# is the sentence. Only the numbering is taken from that edition, not its text, which differs from Holder's in
# places (occupandae at 9.3.2, which Holder does not print; fictae at 9.4.29 where Holder prints facte).
#
# Holder's editorial signs: letters he supplies stand in angle brackets (auxil⟨i⟩a, edi⟨c⟩ta, proper⟨ar⟩ent),
# letters or words he rejects in square brackets (Dunwa[r]t[hn]umque, [in]), and ab(s)cisum is printed so; these
# are kept as printed. His marks of position are not kept: the bars | and || that mark the pages of the 1514 edition
# (removed by verify_strip, together with Holder's running heads, the line numbers, the marginal page references and
# the sheet signature 'Saxo Grammaticus. 20'), the asterisks, the italic type of letters he changed, and the acute
# of ipsó (9.4.11.3).
#
# Every line is checked against the OCR by weft draft after verify_strip and verify_corrections. Each correction
# was read on the page image (four independent OCRs of three copies were compared first, and every word on which
# they disagreed or on which Holder differs from the 1931 text was looked at on the page: 318 words, of which 84
# were misreadings, 47 marginal matter and 4 words joined by the OCR). Each correction carries a word of context
# so that it applies only where it was read.
