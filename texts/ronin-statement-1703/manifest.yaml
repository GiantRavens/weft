predicted_gaps:
  - "no open digital text of the statement was found (not on Japanese Wikisource or Aozora Bunko); the edition is Weft's transcription of a 1910 print, checked against the National Diet Library's OCR of the same pages (ocr-disagrees lists where the OCR differs)"
  - "ocr-disagrees, 3 runs, explained: the OCR reads 末期 as 未期, 得共 as 得其, and the iteration mark of はゞ as katakana ヾ (dropped by the sensor); in each case the scan was checked and the edition follows the scan"
  - "the copies of the statement differ in wording (於殿中 or 於御殿中; 難遁 or 難忍; 含意趣 with or without へ; 亡主之意趣 or 亡主之存念); the 1910 print is followed, and a note names the main variants"
  - "the return marks are the 1910 editor's, not the 1703 document's; they are checked by eye against the scan only. The first mark at 被召上 is faint and is read as 二"
  - "the print's ketsuji blanks before 仰付 and 上使 are not reproduced"
  - "the list of signatories is cut after the first three names"
  - "the reading (yomikudashi) and the 1703 pronunciation are Weft's reconstructions, approximate"
  - "Mitford translated another copy, freely: he renders 含意趣 as avenging 'an insult', which the document does not say"
  - "no treebank; lemma, part of speech and gloss by hand, draft"
