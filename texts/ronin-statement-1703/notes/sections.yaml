- id: n.ak.1.document
  attach: ak.statement.1
  kind: editorial
  status: draft
  leans_on: "Sugihara Izan, Ōishi Yoshio (1910), p. 125; A. B. Mitford, Tales of Old Japan (1871); Terasaka Kichiemon's account as cited in Meiji and Taishō compilations (NDL 781117, 958904)"
  text: "What the document is. A kōjō (口上) is a formal oral statement set down in writing. The 1910 print introduces it with the account that it was written the day before the attack, put in a box, fixed to a bamboo pole and set up before the entrance of Kira's mansion. Mitford, who was shown a copy at Sengakuji, says a copy was found on each of the men. Later compilations cite the foot soldier Terasaka Kichiemon for the bamboo pole and name Hara Sōemon as the man who drafted and wrote it out. These are accounts written after the event; the edition reproduces a 1910 printed text, not the paper itself."
- id: n.ak.2.event
  attach: ak.statement.2
  kind: editorial
  status: draft
  leans_on: "general histories of the Akō incident (Genroku 14–16)"
  text: "The event and the legend. In the third month of 1701, during the reception of envoys from the imperial court, Asano Naganori drew his short sword on Kira Yoshinaka, the shogunate's master of ceremonies, inside Edo Castle. Kira was wounded; Asano was ordered to commit seppuku the same day and his domain was confiscated. The statement gives the cause only as 意趣, a grudge, and does not say what it was. The motives that later became familiar, such as an insult over gifts or Kira's desire for Asano's wife, come from later accounts and from the stage, above all the puppet play Kanadehon Chūshingura (1748), which moves the story to the fourteenth century and renames everyone. The gap between this paper's few facts and the legend is wide, and the paper should be read on its own terms."
- id: n.ak.3.variants
  attach: ak.statement.3
  kind: editorial
  status: draft
  leans_on: "NDL OCR of Satō Naotarō, Akō rōshi no fukushū (1902); Watanabe Shūjirō, Ōishi Yoshio genkōroku (1908); Arima and Torino, Gishiden (1919)"
  text: "Copies differ. The printed versions Weft compared, through the library's OCR, agree in substance but not in wording. Where this 1910 print has 當座難遁儀御座候故 ('since there was a matter he could not let pass'), others have 難忍 ('could not bear') and end in 歟 rather than 故, which makes the clause a supposition: 'there was, it seems, a matter he could not let pass'. Some have 於殿中 for 於御殿中, and one has 亡主之存念 for 亡主之意趣 near the end. The retainers were not present at the quarrel, and the hedged form 歟 fits that. Which wording stood on the paper left at the mansion cannot be settled from these prints."
- id: n.ak.4.reading
  attach: ak.statement.4
  kind: editorial
  status: draft
  leans_on: "Sugihara Izan, Ōishi Yoshio (1910), pp. 125–126"
  text: "How the text is read. The statement is in sōrōbun, the written style of letters and official papers, which mixes Japanese in Chinese characters with inverted Chinese constructions (不辨時節塲所, 'not discerning time and place', is read 時節塲所を辨へず) and ends its clauses with 候, read sōrō. The return marks are the 1910 editor's; the original paper is unlikely to have carried them. The numbers above the words give the order of reading those marks imply, and the line under them gives the whole reading. Both the reading and its pronunciation in Edo speech of 1703 are Weft's reconstructions."
- id: n.ak.9.liji
  attach: ak.statement.9
  kind: editorial
  status: draft
  leans_on: "Liji, Quli I (父之讎弗與共戴天)"
  text: "A classical maxim. 不可共戴天, 'one may not live together under the same heaven', echoes the Liji, the Chinese Book of Rites, which says this of the enemy of one's father. The statement applies it to the enemy of 君父, 'lord and father', and so extends to a lord an obligation that the classical text states for a father. The phrase is the document's justification for the attack, set immediately after the retainers acknowledge that Kira belongs to a high house."
- id: n.ak.12.date
  attach: ak.statement.12
  kind: editorial
  status: draft
  leans_on: "general histories of the Akō incident"
  text: "The date. Genroku 15, twelfth month, falls in January 1703 of the Western calendar, which is why this edition is dated 1703. The day is left blank in the print. The attack began late on the fourteenth day of that month; Kira was killed, and the retainers carried his head to Asano's grave at Sengakuji. Forty-six of them were held in the custody of four daimyō and were ordered to commit seppuku in the second month of 1703. The printed list of names continues beyond the three given here."
- id: n.ak.11.mitford
  attach: ak.statement.11
  kind: editorial
  status: draft
  leans_on: "A. B. Mitford, Tales of Old Japan (1871)"
  text: "Mitford's version. Mitford translated a copy he was shown at Sengakuji in the 1860s. His English follows the document's order loosely and adds an interpretation in one place: he writes that Asano attacked Kira 'in order to avenge an insult offered to him', where the Japanese says only that he bore a grudge. His closing request, that a finder 'open and read this document', corresponds to 御披見を願ひ奉り. The Weft translation is closer to the wording, and the two are best read side by side."
