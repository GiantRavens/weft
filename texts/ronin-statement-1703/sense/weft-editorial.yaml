# Weft editorial translation (draft), line by line, close to the Japanese reading.
translation: weft-editorial
aligned_by: hand
spans:
- lines:
  - ak.statement.1
  - ak.statement.1
  text: Statement of the retainers of Asano Takumi-no-kami.
- lines:
  - ak.statement.2
  - ak.statement.2
  text: In the third month of last year, Takumi, in the matter of receiving the imperial envoys, came to bear a grudge against Lord Kira Kōzuke-no-suke;
- lines:
  - ak.statement.3
  - ak.statement.3
  text: and in the palace, there being a matter he could not let pass on the spot, he drew his sword and wounded him.
- lines:
  - ak.statement.4
  - ak.statement.4
  text: Since he did not regard time and place and committed the gravest impropriety, he was ordered to commit seppuku, and his domain and the castle of Akō were taken from him;
- lines:
  - ak.statement.5
  - ak.statement.5
  text: we his retainers accepted this in awe, received the orders of the shogunate's envoys, handed over the castle and its lands, and the household dispersed at once.
- lines:
  - ak.statement.6
  - ak.statement.6
  text: At the time of the quarrel, a person present restrained him, and Lord Kōzuke-no-suke was not struck down;
- lines:
  - ak.statement.7
  - ak.statement.7
  text: Takumi's regret at his death is something his retainers cannot bear.
- lines:
  - ak.statement.8
  - ak.statement.8
  text: Although we are reluctant that retainers should harbour resentment against an eminent person of a high house,
- lines:
  - ak.statement.9
  - ak.statement.9
  text: the principle that one may not live under the same heaven as the enemy of lord and father cannot be let pass, and today we force our way into Lord Kōzuke-no-suke's residence.
- lines:
  - ak.statement.10
  - ak.statement.10
  text: Our intent is solely to carry on the grudge of our late lord.
- lines:
  - ak.statement.11
  - ak.statement.11
  text: If after our deaths someone comes to examine us, we humbly ask that this be read. That is all.
- lines:
  - ak.statement.12
  - ak.statement.12
  text: Genroku 15, twelfth month; the day is left blank.
- lines:
  - ak.statement.13
  - ak.statement.13
  text: 'Retainers of Asano Takumi-no-kami Naganori:'
- lines:
  - ak.statement.14
  - ak.statement.14
  text: Ōishi Kura-no-suke Yoshio
- lines:
  - ak.statement.15
  - ak.statement.15
  text: Yoshida Chūzaemon Kanesuke
- lines:
  - ak.statement.16
  - ak.statement.16
  text: Hara Sōemon Mototoki
