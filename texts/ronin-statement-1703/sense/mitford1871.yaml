# A. B. Mitford, Tales of Old Japan (1871), 'The Forty-seven Rônins': 'a document explanatory of their
# conduct, a copy of which was found on the person of each of the forty-seven men'. Project Gutenberg
# 13015, verbatim; quotation marks and line breaks of the Gutenberg text removed. Mitford's sentences
# cross the Japanese lines, so spans join lines. He does not translate the title.
translation: mitford1871
aligned_by: hand
spans:
- lines:
  - ak.statement.2
  - ak.statement.3
  text: Last year, in the third month, Asano Takumi no Kami, upon the occasion of the entertainment of the Imperial ambassador, was driven, by the force of circumstances, to attack and wound my Lord Kôtsuké
    no Suké in the castle, in order to avenge an insult offered to him.
- lines:
  - ak.statement.4
  - ak.statement.5
  text: Having done this without considering the dignity of the place, and having thus disregarded all rules of propriety, he was condemned to _hara-kiri,_ and his property and castle of Akô were forfeited
    to the State, and were delivered up by his retainers to the officers deputed by the Shogun to receive them. After this his followers were all dispersed.
- lines:
  - ak.statement.6
  - ak.statement.7
  text: At the time of the quarrel the high officials present prevented Asano Takumi no Kami from carrying out his intention of killing his enemy, my Lord Kôtsuké no Suké. So Asano Takumi no Kami died without
    having avenged himself, and this was more than his retainers could endure.
- lines:
  - ak.statement.8
  - ak.statement.10
  text: It is impossible to remain under the same heaven with the enemy of lord or father; for this reason we have dared to declare enmity against a personage of so exalted rank. This day we shall attack
    Kira Kôtsuké no Suké, in order to finish the deed of vengeance which was begun by our dead lord.
- lines:
  - ak.statement.11
  - ak.statement.11
  text: If any honourable person should find our bodies after death, he is respectfully requested to open and read this document.
- lines:
  - ak.statement.12
  - ak.statement.12
  text: 15th year of Genroku. 12th month.
- lines:
  - ak.statement.13
  - ak.statement.16
  text: Signed, OISHI KURANOSUKÉ, Retainer of Asano Takumi no Kami, and forty-six others.
