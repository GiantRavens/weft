  lead: The revenge of the forty-seven rōnin (四十七士, Shijūshichishi), also known as the Akō incident (赤穂事件,
    Akō jiken) or Akō vendetta, was a historical event in Japan in which a band of rōnin (lordless samurai)
    avenged the death of their former master on 31 January 1703. The incident has since become legendary.
    It is among the three major vengeance (adauchi 仇討ち) incidents in Japan, along with the Revenge of
    the Soga Brothers and the Igagoe vendetta.
