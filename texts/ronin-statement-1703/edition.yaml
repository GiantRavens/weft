# Weft edition of the statement carried by the Akō retainers (淺野內匠頭家來口上), dated Genroku 15,
# twelfth month (January 1703), as printed in Sugihara Izan, Ōishi Yoshio (Ijin genkōroku series,
# Tokyo, 1910), pp. 125-126 (National Diet Library 781116, scan frames 75-76, Public Domain Mark).
# Transcribed by Weft from the scan, with the print's return marks (kaeri). No open digital text
# of the statement was found, so verify_in does not apply: japanese.line_checks compares every line
# with the library's own OCR of the two pages (ocr_in) and reports each run of characters the OCR
# lacks (ocr-disagrees); each such run was checked against the scan and is listed in the manifest's
# predicted gaps. The print sets a blank before 仰付 and 上使 (ketsuji, a space of respect for the
# shogunate); the blanks are not reproduced. The print continues the list of signatories; the
# edition stops after the first three names.
#
# Token fields as in the Buke shohatto edition: t = word as printed; n = its reading in historical
# kana with the okurigana a reader adds; kaeri = the return mark printed beside it; p = punctuation
# as printed; yomi = the line as read aloud. Readings and line division are Weft's (draft).
