predicted_gaps:
- "no treebank covers this text: lemma, morphology and gloss are hand-annotated after Zoëga, A Concise Dictionary of Old Icelandic (1910), by several hands under one convention table, and the verses also carry staves and meter (draft)"
- "the normalized text is Guðni Jónsson and Bjarni Vilhjálmsson's (Fornaldarsögur Norðurlanda, 1943-44), not a critical edition; the page reproduces it from heimskringla.no with the markup stripped"
- "no English translation of the prose is public domain worldwide: the English beside each line is Weft's own draft translation. Schlauch (1930) is printed beside it but is public domain in the United States only (Schlauch died 1986); her verses are rhymed quatrains, freer than her prose, aligned stanza by stanza. Vigfusson and Powell (1883) translate the verses only, and theirs is aligned where they do. The modern translations are cited, not printed"
- "the old-norse sound scheme models the 13th century approximately, from the normalized spelling"
- "several skaldic stanzas are insecure in the text or the reading; the worst is the flyting stanza rag.19.49-56, where lasi and mollu have no dictionary headword and Finnur Jónsson (Skjaldedigtning B II, 1915, p. 260) leaves the two phrases that hold them untranslated: their glosses read (obscure) and the English marks them unintelligible"
