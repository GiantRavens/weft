# Notes for Ragnars saga loðbrókar, all 20 chapters. Editorial notes are drafts until a reviewer lifts them.
- id: n.rag.saga
  attach: rag.1.1
  kind: editorial
  status: draft
  leans_on: "the Wikipedia article Tale of Ragnar Lodbrok (revision 1376262787), lead; the Old Norse text"
  text: "Ragnars saga loðbrókar is an Icelandic legendary saga of the 13th century. It is first found in the same manuscript as the Völsunga saga, which it follows directly, and it begins where that saga ends: with the news that Sigurd and Brynhild are dead. Their daughter Aslaug, three winters old, is the thread that joins the two. The saga then tells how Ragnar won Thora, then Aslaug, the deeds of their sons, Ragnar's death in King Ella's snake pit and the sons' revenge. It belongs to the fornaldarsögur, the sagas of ancient times, set before the settlement of Iceland."
- id: n.rag.harp
  attach: rag.1.5
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 1"
  text: "Heimir, Brynhild's foster-father, fears that the child will be sought out and killed with her family, so he has a harp made large enough to hide her, with treasure, and travels north with it as a wandering harper. He feeds her on a leek that, the saga says, lets a person live long without other food, and when she cries he plays. In Norway he is murdered for the gold by the farmer Aki and his wife Grima at Spangarheid, who find the girl in the harp and raise her as their own, ugly and dirty, under the name Kraka, 'crow'."
- id: n.rag.lodbrok
  attach: rag.3.7
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 2-5; Zoëga, A Concise Dictionary of Old Icelandic, s.v. loðbrók"
  text: "Earl Herraud sends his daughter Thora a gift every day for her amusement, and one day it is a small snake; it grows until it lies coiled round her bower and lets no one near. Ragnar has shaggy breeches and a shaggy cloak made and boiled in pitch, rolls in sand before he goes up to the bower, and kills the serpent with two thrusts of his spear. A jet of the serpent's blood strikes him between the shoulders and does him no harm, because the clothes shield him (ch. 3). The saga does not say in so many words that the clothes gave him his name; it first calls him Ragnarr loðbrók in ch. 5, and Loðbrók means 'shaggy breeches'. The first stanza of the saga, Ragnar's, and the first stanza of Krákumál, both in this library, tell the same deed."
- id: n.rag.riddle
  attach: rag.5.38
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 5"
  text: "Ragnar's men tell him of a farm girl; he doubts she is as fair as Thora, and they say she is no less fair. He sends for her with a set of conditions: she is to come neither clad nor unclad, neither fed nor unfed, neither alone nor with any man to follow her. Kraka comes wrapped in a fishing net with her long hair over it, having tasted a leek, with the farm dog beside her. The saga uses the test and its answer to show that the girl is more than she seems."
- id: n.rag.ivar
  attach: rag.7.3
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 6-7"
  text: "Aslaug asks Ragnar to wait three nights after their wedding before they lie together, or harm will come to their son. He does not wait, and the first son, Ivar, is born boneless, with gristle where the bones should be. He is carried on a litter of poles, the saga says, yet he becomes the cleverest of the brothers and the one who plans their campaigns."
- id: n.rag.snake-eye
  attach: rag.9.62
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 9; Finnur Jónsson, Den norsk-islandske skjaldedigtning B II (1915), p. 253"
  text: "When Ragnar plans to marry a Swedish king's daughter, Aslaug tells him who she is: the daughter of Sigurd the slayer of Fafnir and of Brynhild. As a sign she foretells that the son she carries will be born with the image of a snake in his eye. He is, and is named Sigurd Snake-in-the-Eye; this stanza, Ragnar's, foretells the name Sigurd and the snake in the eye; the byname Sigurd Snake-in-the-Eye first appears in the prose at 10.136. Finnur Jónsson construes the stanza as the English here does: the boy will be like his mother and be called his father's son, and he is 'of Odin's kin', the one who will be called the surpasser of others. His text has lætr, 'lets', in the present, where this text has lét, 'made'."
- id: n.rag.snakepit
  attach: rag.15.79
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 15; Krákumál, in this library"
  text: "Ragnar sails to England with only two ships, is taken by King Ella, who then ruled England, and is thrown into a pit of snakes. While he wears the shirt Aslaug made for him the snakes do not bite; when it is pulled off they cling to him. His words before he dies, 'the young pigs would grunt now if they knew what the old boar suffers', foresee his sons' revenge. Of the two stanzas that follow, the first counts his fifty-one battles and his death among snakes; the second repeats the saying about the young pigs in verse. The longer poem Krákumál, also in this library, is put in his mouth at the same moment."
- id: n.rag.news
  attach: rag.16.14
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 16; art/works/credits.yaml, the Malmström entry"
  text: "Ella's messengers bring the news of Ragnar's death to his sons. Each takes it in his own way: Hvitserk, at a board game, grips a piece so hard that blood starts from his nails; Bjorn grips his spear-shaft until it leaves a mark; Sigurd Snake-in-the-Eye, paring a nail, does not notice the knife going into the bone; Ivar asks every detail and changes color. August Malmström painted the scene in 1857, and the painting stands at the head of the tale of Ragnar's sons in this library."
- id: n.rag.flyting
  attach: rag.19.22
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 19; Finnur Jónsson, Den norsk-islandske skjaldedigtning B II (1915), pp. 259-260, text and Danish translation; Sveinbjörn Egilsson, Lexicon Poeticum (1860), s.v. harðmeldr and Hveðna"
  text: "Two large strangers, seated side by side on the upper bench at a funeral feast in a foreign land, trade stanzas over which of them has done more, until they recognize each other; in the last stanza one says that both followed Bjorn, and at times Ragnar. The stanzas are insecure in places. Finnur Jónsson's edition of the skaldic verse differs from this text in some readings, among them dræpir, 'would slay', for drægir, 'would drag' (19.28), at öðru for at öðrum (19.26), and fæddir, 'fed', for feitaðir, 'fattened' (19.35), and it gives a place name where this text has Heita vang (19.51). He leaves two phrases of 19.53-56, við lasi lúðrar and hallar ríka mollu hrafns, untranslated, as words he could not understand; the English here marks them the same way. The English follows him where he explains a kenning: sólar sæki-tík, 'the bitch that hunts the sun', he renders as the wolf (19.36). For harðmeldr ... Hveðnu (19.46-47) he gives only 'we won gold'; Sveinbjörn Egilsson's Lexicon Poeticum (1860) calls the lines of doubtful sense and gives Hveðna as the name of a giantess or of the Danish island Hven, so the English marks the reading [?]."
- id: n.rag.idol
  attach: rag.20.6
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 20"
  text: "The saga ends with an episode set long after Ragnar's sons: Ögmund the Dane lands on Samsey and finds an old wooden man covered in moss, forty in height (the text gives no unit; Weft's English supplies feet). The figure speaks three stanzas: the sons of Lothbrok set it up there long ago and made sacrifices to it, and now it stands neglected. The episode closes the saga on the passing of the old heroes and their gods. Vigfusson and Powell do not translate these verses with the others; only Weft's English is given."
- id: n.rag.history
  attach: rag.13.2
  kind: editorial
  status: draft
  leans_on: "the Anglo-Saxon Chronicle, annals for 866-867 (the army comes to East Anglia, takes York, and kills Osberht and Ælla); Adam of Bremen, Gesta Hammaburgensis ecclesiae pontificum (about 1075), which names Inguar a son of Lodparchus; the Wikipedia articles Tale of Ragnar Lodbrok and Tale of Ragnar's Sons, as fetched for this library"
  text: "The saga is a legendary saga, not a history. Men named in it as Ragnar's sons, Ivar the Boneless and his brothers, are linked by later medieval writers with the leaders of the Viking army that came to England in the 860s, and the killing of King Ella of Northumbria by that army is a historical event. Whether Ragnar himself lived, and whether the sons were his, is uncertain, and the saga's own account of their deeds is not evidence for either. The notes here describe what the saga says."
