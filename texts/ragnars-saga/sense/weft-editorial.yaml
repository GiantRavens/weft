# Weft editorial translation of Ragnars saga loðbrókar, all 20 chapters, line by line, from the normalized
# Old Norse text (Fornaldarsogur Nordurlanda). Draft, by three hands (chapters 1-6, 7-12, 13-20) under one set of conventions. Made because no English translation is public domain worldwide
# (Schlauch 1930 is in the US only); Schlauch, Waggoner 2009 and Crawford 2017 were not consulted. One span per
# Old Norse line, so the English sits beside its line; each stanza is one span, set line by line.
# The saga's historic present is rendered as past throughout. Words in parentheses are supplied for English
# sense; square brackets give the referent of a kenning, which is kept literal; [?] marks an uncertain reading.
# Names drop accents and render d for edh, th for thorn, nominative stem without -r (Hlymdalir, Spangarheid).
translation: weft-editorial
aligned_by: hand, phase 0; one span per Old Norse line, one span per stanza
spans:
- lines:
  - rag.1.1
  - rag.1.1
  text: Heimir in Hlymdalir now heard these tidings, that Sigurd and Brynhild were dead.
- lines:
  - rag.1.2
  - rag.1.2
  text: And Aslaug, their daughter and Heimir's foster-daughter, was then three winters old.
- lines:
  - rag.1.3
  - rag.1.3
  text: He knew now that there would be a search to destroy the girl and her kin.
- lines:
  - rag.1.4
  - rag.1.4
  text: His grief for Brynhild, his foster-daughter, was so great that he cared nothing for his realm or his wealth;
    he saw now that he could not keep the girl hidden there;
- lines:
  - rag.1.5
  - rag.1.5
  text: he now had a harp made, so large that he had the girl Aslaug put inside it, with many treasures of gold
    and silver, and then he went away, far through many lands, and at last here to the Northern lands.
- lines:
  - rag.1.6
  - rag.1.6
  text: His harp was so skillfully made that it could be taken apart and put together again at the joints, and it
    was his habit by day,
- lines:
  - rag.1.7
  - rag.1.7
  text: when he went along by rivers and nowhere near farms, to take the harp apart and wash the girl,
- lines:
  - rag.1.8
  - rag.1.8
  text: and he had a leek and gave it to her to eat.
- lines:
  - rag.1.9
  - rag.1.9
  text: And it is the nature of that leek that a man can live long though he has no other food.
- lines:
  - rag.1.10
  - rag.1.10
  text: And when the girl wept, he played the harp, and then she fell silent, because Heimir was well skilled in
    the accomplishments that were customary then.
- lines:
  - rag.1.11
  - rag.1.11
  text: He also had many costly clothes with her in the harp, and much gold.
- lines:
  - rag.1.12
  - rag.1.12
  text: And now he traveled on until he came to Norway and came to a small farm called Spangarheid, and there lived
    a peasant named Aki.
- lines:
  - rag.1.13
  - rag.1.13
  text: He had a wife, and she was called Grima.
- lines:
  - rag.1.14
  - rag.1.14
  text: There were no more people there than those two.
- lines:
  - rag.1.15
  - rag.1.15
  text: That day the old man had gone to the woods, but the old woman was at home, and she greeted Heimir and asked
    what sort of man he was.
- lines:
  - rag.1.16
  - rag.1.16
  text: He said he was a beggar and asked the old woman for lodging.
- lines:
  - rag.1.17
  - rag.1.17
  text: She said that so few people came there that she would receive him well, if he thought he needed to stay
    there.
- lines:
  - rag.1.18
  - rag.1.18
  text: And as the evening wore on, he said that the greatest kindness to him would be for a fire to be lit for
    him and then for him to be shown to the sleeping-house where he was to sleep.
- lines:
  - rag.1.19
  - rag.1.19
  text: And when the old woman had lit the fire, he set the harp up on the seat beside him, and the old woman talked
    a great deal.
- lines:
  - rag.1.20
  - rag.1.20
  text: Often her eye fell on the harp, because the fringe of a costly cloth was showing out of the harp.
- lines:
  - rag.1.21
  - rag.1.21
  text: And as he warmed himself at the fire, she saw a costly gold ring come out from under his rags, for he was
    poorly dressed.
- lines:
  - rag.1.22
  - rag.1.22
  text: And when he had warmed himself as much as he felt he needed, he had his supper.
- lines:
  - rag.1.23
  - rag.1.23
  text: And after that he asked the old woman to show him to the place where he was to sleep that night.
- lines:
  - rag.1.24
  - rag.1.24
  text: Then the old woman said that he would be better off outside than inside, "because my husband and I often
    have words when he comes home."
- lines:
  - rag.1.25
  - rag.1.25
  text: He told her to decide; he went out now, and so did she.
- lines:
  - rag.1.26
  - rag.1.26
  text: He took the harp and kept it with him.
- lines:
  - rag.1.27
  - rag.1.27
  text: The old woman went out and on to where there was a barn, and led him there, and told him to settle himself
    there, and said she expected he would get his sleep there.
- lines:
  - rag.1.28
  - rag.1.28
  text: And now the old woman went away and saw to what she needed to do, and he went to sleep.
- lines:
  - rag.1.29
  - rag.1.29
  text: The old man came home as the evening passed, and the old woman had done little of what she needed to do,
    and he was tired when he came home and bad-tempered, since everything she should have seen to was undone.
- lines:
  - rag.1.30
  - rag.1.30
  text: The old man said that their lots were very unequal, when he worked every day more than he could manage,
    and she would turn her hand to nothing that was of any use.
- lines:
  - rag.1.31
  - rag.1.31
  text: '"Do not be angry, husband," she said, "because it may be that you could now work a short while so that
    we would be well off all our lives."'
- lines:
  - rag.1.32
  - rag.1.32
  text: '"What is that?" said the old man.'
- lines:
  - rag.1.33
  - rag.1.33
  text: 'The old woman answered: "A man has come to our lodging here, and I think he has a great deal of wealth
    with him,'
- lines:
  - rag.1.34
  - rag.1.34
  text: and he is getting on in years and must have been the greatest of champions, and yet he is very tired now,
    and I do not think I have seen his equal,
- lines:
  - rag.1.35
  - rag.1.35
  text: and yet I think he is worn out and sleepy."
- lines:
  - rag.1.36
  - rag.1.36
  text: 'Then the old man said: "It seems ill-advised to me to betray the few who come here."'
- lines:
  - rag.1.37
  - rag.1.37
  text: 'She answered: "That is why you will be of little account for a long time, that everything grows large in
    your eyes; and now do one or the other: either kill him, or I will take him as my husband, and we will drive
    you away.'
- lines:
  - rag.1.38
  - rag.1.38
  text: And I can tell you the talk he had with me last evening, though you will think little of it.
- lines:
  - rag.1.39
  - rag.1.39
  text: He spoke to me like a man wooing a woman, and my plan will be to take him as my husband and to drive you
    away or kill you, if you will not do as I wish."
- lines:
  - rag.1.40
  - rag.1.40
  text: And it is said that the old man was ruled by his wife, and she kept talking at him until he gave in to her
    urging; he took his axe and sharpened it very keenly.
- lines:
  - rag.1.41
  - rag.1.41
  text: And when he was ready, the old woman led him to where Heimir was sleeping, and there was loud snoring there.
- lines:
  - rag.1.42
  - rag.1.42
  text: Then the old woman told the old man to make his blow as good as he could, "and hurry away at a run, because
    you will not be able to stand his noise and his cries if he gets his hands on you."
- lines:
  - rag.1.43
  - rag.1.43
  text: She took the harp and ran off with it.
- lines:
  - rag.1.44
  - rag.1.44
  text: Now the old man went to where Heimir was sleeping.
- lines:
  - rag.1.45
  - rag.1.45
  text: He struck at him, and it made a great wound, and the axe flew from his grip.
- lines:
  - rag.1.46
  - rag.1.46
  text: He ran off at once as fast as he could.
- lines:
  - rag.1.47
  - rag.1.47
  text: Now Heimir woke at the blow, and it was enough to finish him.
- lines:
  - rag.1.48
  - rag.1.48
  text: And it is said that so great a din arose in his death throes that the pillars of the house gave way and
    the whole house fell down, and there was a great earthquake, and there his life ended.
- lines:
  - rag.1.49
  - rag.1.49
  text: Now the old man came to where the old woman was and said that he had killed him, "and yet there was a while
- lines:
  - rag.1.50
  - rag.1.50
  text: when I did not know how it would go, and this man was wonderfully strong, but still I expect that he is
    now in Hel."
- lines:
  - rag.1.51
  - rag.1.51
  text: The old woman said he should have thanks for the deed, "and I expect that now we have wealth enough, and
    we shall find out whether I have told the truth."
- lines:
  - rag.1.52
  - rag.1.52
  text: Now they lit a fire, and the old woman took the harp and wanted to open it, and could not do it any other
    way than by breaking it, because she did not have the skill.
- lines:
  - rag.1.53
  - rag.1.53
  text: And now she got the harp open, and there she saw a girl-child such as she thought she had never seen, and
    there was also much wealth in the harp.
- lines:
  - rag.1.54
  - rag.1.54
  text: 'Now the old man said: "It will turn out now as it often does, that it goes badly to betray one who trusts
    you.'
- lines:
  - rag.1.55
  - rag.1.55
  text: It looks to me as if a helpless dependent has come into our hands."
- lines:
  - rag.1.56
  - rag.1.56
  text: 'The old woman answered: "This is not as I expected, but there is no use complaining about it now."'
- lines:
  - rag.1.57
  - rag.1.57
  text: And now she asked what family the girl was of.
- lines:
  - rag.1.58
  - rag.1.58
  text: But this young girl answered nothing, as if she had not learned to speak.
- lines:
  - rag.1.59
  - rag.1.59
  text: '"Now it goes as I feared, that our plan would turn out badly," said the old man.'
- lines:
  - rag.1.60
  - rag.1.60
  text: '"We have committed a great crime.'
- lines:
  - rag.1.61
  - rag.1.61
  text: How shall we provide for this child?"
- lines:
  - rag.1.62
  - rag.1.62
  text: '"That is easily seen," said Grima.'
- lines:
  - rag.1.63
  - rag.1.63
  text: '"She shall be called Kraka, after my mother."'
- lines:
  - rag.1.64
  - rag.1.64
  text: 'Now the old man said: "How shall we provide for this child?"'
- lines:
  - rag.1.65
  - rag.1.65
  text: 'The old woman answered: "I see a good plan for it: we shall say she is our daughter and bring her up."'
- lines:
  - rag.1.66
  - rag.1.66
  text: '"No one will believe that," said the old man.'
- lines:
  - rag.1.67
  - rag.1.67
  text: '"This child is much more comely than we are.'
- lines:
  - rag.1.68
  - rag.1.68
  text: We are both very ugly, and no one will think it likely that we could have a child like this, as hideous
    as we both are."
- lines:
  - rag.1.69
  - rag.1.69
  text: 'Now the old woman said: "You do not know whether I may not have some tricks, so that this need not seem
    unlikely.'
- lines:
  - rag.1.70
  - rag.1.70
  text: I will have her head shaved and smeared with tar and with whatever else is likeliest to keep the hair from
    growing.
- lines:
  - rag.1.71
  - rag.1.71
  text: She shall wear a hood after that.
- lines:
  - rag.1.72
  - rag.1.72
  text: Nor shall she be well dressed.
- lines:
  - rag.1.73
  - rag.1.73
  text: Then our looks will come closer together.
- lines:
  - rag.1.74
  - rag.1.74
  text: It may be that people will believe I was very beautiful when I was young.
- lines:
  - rag.1.75
  - rag.1.75
  text: She shall also do the worst work."
- lines:
  - rag.1.76
  - rag.1.76
  text: And the old man and the old woman thought that she could not speak, since she never answered them.
- lines:
  - rag.1.77
  - rag.1.77
  text: Now what the old woman had planned was done.
- lines:
  - rag.1.78
  - rag.1.78
  text: Now she grew up there in great poverty.
- lines:
  - rag.2.1
  - rag.2.1
  text: There was a powerful and renowned earl in Gautland called Herraud.
- lines:
  - rag.2.2
  - rag.2.2
  text: He was married.
- lines:
  - rag.2.3
  - rag.2.3
  text: His daughter was called Thora; she was the most beautiful of all women to look at and the most accomplished
    in all the things a person can turn a hand to, and that are better to have than to be without.
- lines:
  - rag.2.4
  - rag.2.4
  text: Her byname was that she was called Town-Hart, because she surpassed all women in beauty as the hart surpasses
    other animals.
- lines:
  - rag.2.5
  - rag.2.5
  text: The earl loved his daughter greatly.
- lines:
  - rag.2.6
  - rag.2.6
  text: He had a bower built for her a short way from the king's hall, and around the bower was a palisade.
- lines:
  - rag.2.7
  - rag.2.7
  text: The earl made it his custom to send his daughter something every day for her amusement, and he said that
    he would keep this up.
- lines:
  - rag.2.8
  - rag.2.8
  text: It is told that one day he had a little heather-snake brought to her, exceedingly beautiful, and she liked
    this snake and put it in her box and laid gold under it.
- lines:
  - rag.2.9
  - rag.2.9
  text: It had been there only a short while before it grew large, and so did the gold beneath it.
- lines:
  - rag.2.10
  - rag.2.10
  text: It came to the point that it had no room in the box, and now it lay in a ring around the outside of the
    box.
- lines:
  - rag.2.11
  - rag.2.11
  text: And at last it came to the point that it had no room in the bower, and the gold grew beneath it just as
    the snake itself did.
- lines:
  - rag.2.12
  - rag.2.12
  text: Now it lay around the outside of the bower, so that its head and tail met, and it became hard to deal with,
    and no man dared come to the bower for this snake except the one who brought it its food, and it needed an ox
    for a meal.
- lines:
  - rag.2.13
  - rag.2.13
  text: The earl thought this a great harm and swore an oath that he would give his daughter to the man who brought
    about the snake's death, whatever man he might be, and the gold that lay beneath it would be her dowry.
- lines:
  - rag.2.14
  - rag.2.14
  text: These tidings were heard far across the land, but still no one trusted himself to deal with this great snake.
- lines:
  - rag.3.1
  - rag.3.1
  text: At that time Sigurd Hring ruled over Denmark.
- lines:
  - rag.3.2
  - rag.3.2
  text: He was a powerful king and had become famous from the battle he fought against Harald War-Tooth at Bravellir,
    where Harald fell before him, as has become known throughout the whole northern part of the world.
- lines:
  - rag.3.3
  - rag.3.3
  text: Sigurd had a son called Ragnar.
- lines:
  - rag.3.4
  - rag.3.4
  text: He was big in stature, handsome in looks and well endowed with wits, great-hearted toward his own men but
    grim to his enemies.
- lines:
  - rag.3.5
  - rag.3.5
  text: As soon as he was old enough, he got himself men and warships, and he became the greatest of warriors, so
    that his equal could hardly be found.
- lines:
  - rag.3.6
  - rag.3.6
  text: He heard what Earl Herraud had declared; he paid no attention to it and acted as if he did not know.
- lines:
  - rag.3.7
  - rag.3.7
  text: He had clothes made for himself in a strange fashion, shaggy breeches and a shaggy cloak, and when they
    were made, he had them boiled in pitch.
- lines:
  - rag.3.8
  - rag.3.8
  text: Then he put them away.
- lines:
  - rag.3.9
  - rag.3.9
  text: It was one summer that he took his army to Gautland and laid his ship in a hidden cove, and it was a short
    way from there to the place the earl ruled.
- lines:
  - rag.3.10
  - rag.3.10
  text: And when Ragnar had been there one night, he woke early in the morning, got up and took the same war-clothes
- lines:
  - rag.3.11
  - rag.3.11
  text: that were told of before, and put them on, and took a great spear in his hand, and went from the ships all
    alone, and there
- lines:
  - rag.3.12
  - rag.3.12
  text: where there was sand, he now rolled himself in the sand.
- lines:
  - rag.3.13
  - rag.3.13
  text: And before he went off, he took the rivet out of his spear, and now went alone from the ships to the earl's
    town gate, and came there early in the day, so that everyone was asleep.
- lines:
  - rag.3.14
  - rag.3.14
  text: Now he made for the bower.
- lines:
  - rag.3.15
  - rag.3.15
  text: And when he came inside the palisade, where the snake was, he thrust at it with his spear, and then he pulled
    the spear back toward himself.
- lines:
  - rag.3.16
  - rag.3.16
  text: And he thrust a second time.
- lines:
  - rag.3.17
  - rag.3.17
  text: That thrust struck the snake in the back, and now it twisted round sharply, so that the spearhead came off
    the shaft, and so great a din arose in its death throes that the whole bower shook.
- lines:
  - rag.3.18
  - rag.3.18
  text: And now Ragnar turned away.
- lines:
  - rag.3.19
  - rag.3.19
  text: Then a jet of blood struck him between the shoulders, and it did him no harm, so well did the clothes he
    had had made protect him.
- lines:
  - rag.3.20
  - rag.3.20
  text: And those who were in the bower woke at the din and went out of the bower.
- lines:
  - rag.3.21
  - rag.3.21
  text: Now Thora saw a big man walking away from the bower, and she asked him his name, or whom he now wanted to
    see.
- lines:
  - rag.3.22
  - rag.3.22
  text: 'He stopped and spoke this verse:'
- lines:
  - rag.3.23
  - rag.3.30
  text: '"I have risked my praised life,

    fair-faced woman; at fifteen winters

    old I fought the fish of the earth [the serpent];

    I shall have swift death,

    unless harm bites [?];

    I pierced well to the heart

    the ring-coiled salmon

    of the heath [the serpent]."'
- lines:
  - rag.3.31
  - rag.3.31
  text: And now he went away and said no more to her.
- lines:
  - rag.3.32
  - rag.3.32
  text: And the spearhead stayed behind in the wound, but he had the shaft with him.
- lines:
  - rag.3.33
  - rag.3.33
  text: Now that she had heard this verse, she understood what he said about his errand, and also how old he was.
- lines:
  - rag.3.34
  - rag.3.34
  text: And now she considered who he might be, and she felt she did not know whether he was a human man or not,
- lines:
  - rag.3.35
  - rag.3.35
  text: because his size seemed to her as great as is told of monstrous beings, at the age he was,
- lines:
  - rag.3.36
  - rag.3.36
  text: and she turned back into the bower and fell asleep.
- lines:
  - rag.3.37
  - rag.3.37
  text: And when people came out in the morning, they found that the snake was dead and had been pierced with a
    great spearhead, and it stood fast in the wound.
- lines:
  - rag.3.38
  - rag.3.38
  text: Now the earl had it taken out of there, and it was so large that few could wield it as a weapon.
- lines:
  - rag.3.39
  - rag.3.39
  text: Now the earl considered what he had declared about the man who brought about the snake's death, and felt
    he did not know
- lines:
  - rag.3.40
  - rag.3.40
  text: whether a human man had done this or not, and now took counsel with his friends and his daughter how he
    should search (for him),
- lines:
  - rag.3.41
  - rag.3.41
  text: and it seemed likely that the one who had earned it would come forward to claim the reward.
- lines:
  - rag.3.42
  - rag.3.42
  text: She advised that a crowded assembly be summoned, "and order it so that all those men come there who do not
    want to incur the earl's anger and can in any way attend the assembly,
- lines:
  - rag.3.43
  - rag.3.43
  text: and if there is anyone who claims the snake's death-wound, he shall bring there the spear-shaft that belonged
    with the spearhead."
- lines:
  - rag.3.44
  - rag.3.44
  text: The earl thought this promising, and now had the assembly summoned.
- lines:
  - rag.3.45
  - rag.3.45
  text: And when the day came on which the assembly was to be held, the earl came, and many other chieftains.
- lines:
  - rag.3.46
  - rag.3.46
  text: A great crowd gathered there.
- lines:
  - rag.4.1
  - rag.4.1
  text: News reached Ragnar's ships that an assembly had been summoned a short way from there.
- lines:
  - rag.4.2
  - rag.4.2
  text: And now Ragnar went from the ships with nearly all his army to the assembly.
- lines:
  - rag.4.3
  - rag.4.3
  text: And when they came there, they stopped somewhat apart from other people, because Ragnar saw now that a much
    greater crowd had come than was usual.
- lines:
  - rag.4.4
  - rag.4.4
  text: Then the earl stood up and called for silence and spoke, and thanked people for having responded well to
    his summons,
- lines:
  - rag.4.5
  - rag.4.5
  text: and then told of the event that had happened, first how he had declared what he would do for the man who
    brought about the snake's death,
- lines:
  - rag.4.6
  - rag.4.6
  text: then that "the snake is now dead, and the one who did this famous deed has left the spearhead standing in
    the wound.
- lines:
  - rag.4.7
  - rag.4.7
  text: And if anyone has come here to the assembly who has the shaft that fits this spearhead, let him bring it
    forward and so prove his account,
- lines:
  - rag.4.8
  - rag.4.8
  text: then I shall fulfill all that I have declared, whether he is of higher or lower rank."
- lines:
  - rag.4.9
  - rag.4.9
  text: And he ended his speech by having the spearhead carried before every man at the assembly, and asked to be
    told who it was that claimed this or had the shaft that fitted it.
- lines:
  - rag.4.10
  - rag.4.10
  text: Now this was done.
- lines:
  - rag.4.11
  - rag.4.11
  text: Not a single one was found who had that shaft.
- lines:
  - rag.4.12
  - rag.4.12
  text: Now they came to where Ragnar was and showed him the spearhead, and he acknowledged that it was his, and
    they fitted each other, the shaft and the spearhead.
- lines:
  - rag.4.13
  - rag.4.13
  text: Now people thought they knew that he must have killed the snake, and from this deed he became very famous
    throughout all the Northern lands,
- lines:
  - rag.4.14
  - rag.4.14
  text: and now he asked for Thora, the earl's daughter, and the earl received this well, and now she was married
    to him, and a great feast was prepared with the best provisions in that realm.
- lines:
  - rag.4.15
  - rag.4.15
  text: At this feast Ragnar was married.
- lines:
  - rag.4.16
  - rag.4.16
  text: And when the feast was over, Ragnar went to his kingdom and ruled it, and he loved Thora greatly.
- lines:
  - rag.4.17
  - rag.4.17
  text: They had two sons; the elder was called Eirik and the younger Agnar.
- lines:
  - rag.4.18
  - rag.4.18
  text: They were big in stature and handsome to look at.
- lines:
  - rag.4.19
  - rag.4.19
  text: They were much stronger than most other men who were alive then.
- lines:
  - rag.4.20
  - rag.4.20
  text: They learned all kinds of accomplishments.
- lines:
  - rag.4.21
  - rag.4.21
  text: It happened one time that Thora fell ill, and she died of that illness.
- lines:
  - rag.4.22
  - rag.4.22
  text: And Ragnar took this so hard that he would not rule the kingdom, and he appointed other men to rule the
    kingdom with his sons.
- lines:
  - rag.4.23
  - rag.4.23
  text: And now he took up the same occupation he had had before and went raiding, and wherever he went, he won
    the victory.
- lines:
  - rag.5.1
  - rag.5.1
  text: Now it was one summer that he took his ships to Norway, because he had many kinsmen and friends there and
    wanted to see them.
- lines:
  - rag.5.2
  - rag.5.2
  text: He brought his ships in the evening into a small harbor, and there was a farm a short way from there called
    Spangarheid, and they lay in the harbor there that night.
- lines:
  - rag.5.3
  - rag.5.3
  text: And when morning came, the cooks were to go ashore to bake bread.
- lines:
  - rag.5.4
  - rag.5.4
  text: They saw that there was a farm a short way off, and they thought it would suit them better to go to a house
    and do it there.
- lines:
  - rag.5.5
  - rag.5.5
  text: And when they came to the little farm, they found one person to speak with, and that was an old woman, and
    they asked whether she was the mistress of the house, and what she was called.
- lines:
  - rag.5.6
  - rag.5.6
  text: 'She said that she was the mistress of the house, "and my name is no hard matter [?]: I am called Grima;
    but who are you?"'
- lines:
  - rag.5.7
  - rag.5.7
  text: They said they were servants of Ragnar Lothbrok, and that they wanted to get on with their work, "and we
    want you to work with us."
- lines:
  - rag.5.8
  - rag.5.8
  text: The old woman answered that her hands were very stiff.
- lines:
  - rag.5.9
  - rag.5.9
  text: '"But there was a time when I could do my work very well; and I have a daughter who will work with you,
    and she will come home soon, and she is called Kraka.'
- lines:
  - rag.5.10
  - rag.5.10
  text: It has now come to the point that I can hardly manage her."
- lines:
  - rag.5.11
  - rag.5.11
  text: And now Kraka had gone out to the livestock in the morning, and she saw that ships had come to land, many
    and large, and now she set to and washed herself.
- lines:
  - rag.5.12
  - rag.5.12
  text: But the old woman had forbidden her that, because she did not want people to see her beauty, for she was
    the most beautiful of all women, and her hair was so long that it reached the ground all around her, and as
    fair as the fairest silk.
- lines:
  - rag.5.13
  - rag.5.13
  text: And now Kraka came home.
- lines:
  - rag.5.14
  - rag.5.14
  text: And the cooks had made a fire, and now Kraka saw that men had come there whom she had not seen before.
- lines:
  - rag.5.15
  - rag.5.15
  text: She looked at them, and they at her.
- lines:
  - rag.5.16
  - rag.5.16
  text: 'And now they asked Grima: "Is this your daughter, the beautiful girl?"'
- lines:
  - rag.5.17
  - rag.5.17
  text: '"It is no lie," said Grima, "that this is my daughter."'
- lines:
  - rag.5.18
  - rag.5.18
  text: '"You two must be wonderfully unlike," they said, "ugly as you are.'
- lines:
  - rag.5.19
  - rag.5.19
  text: We have never seen so beautiful a girl, and we see nothing of your looks in her, because you are the greatest
    monster."
- lines:
  - rag.5.20
  - rag.5.20
  text: 'Grima answered: "You cannot tell (it) by looking at me now.'
- lines:
  - rag.5.21
  - rag.5.21
  text: My looks have changed from what they were."
- lines:
  - rag.5.22
  - rag.5.22
  text: Now they talked about her working with them.
- lines:
  - rag.5.23
  - rag.5.23
  text: 'She asked: "What shall I do?"'
- lines:
  - rag.5.24
  - rag.5.24
  text: They said they wanted her to knead the bread, and they would bake it after.
- lines:
  - rag.5.25
  - rag.5.25
  text: And then she set to her work, and it went well for her.
- lines:
  - rag.5.26
  - rag.5.26
  text: But they watched her the whole time, so that they did not attend to their work, and they burned the bread.
- lines:
  - rag.5.27
  - rag.5.27
  text: And when they had finished their work, they went to the ships.
- lines:
  - rag.5.28
  - rag.5.28
  text: And when they were to break out their provisions, everyone said that they had never done such bad work and
    that it deserved punishment.
- lines:
  - rag.5.29
  - rag.5.29
  text: And now Ragnar asked why they had prepared the food that way.
- lines:
  - rag.5.30
  - rag.5.30
  text: They said they had seen a woman so beautiful that they did not attend to their work, and they believed there
    could be no one more beautiful in the world.
- lines:
  - rag.5.31
  - rag.5.31
  text: And when they made so much of her beauty, Ragnar spoke and said he knew that she could not be as beautiful
    as Thora had been.
- lines:
  - rag.5.32
  - rag.5.32
  text: They said she was no less beautiful.
- lines:
  - rag.5.33
  - rag.5.33
  text: 'Then Ragnar said: "Now I will send men who know well how to judge.'
- lines:
  - rag.5.34
  - rag.5.34
  text: If it is as you say, then this carelessness is forgiven you, but if the woman is in any way less beautiful
    than you say, you will receive a heavy punishment."
- lines:
  - rag.5.35
  - rag.5.35
  text: And now he sent his men to meet this beautiful girl, but the head wind was so strong that they could not
    go that day,
- lines:
  - rag.5.36
  - rag.5.36
  text: 'and Ragnar said to his messengers: "If this young girl seems to you as beautiful as we have been told,
    ask her to come to meet me,'
- lines:
  - rag.5.37
  - rag.5.37
  text: and I want to see her; I want her to be mine.
- lines:
  - rag.5.38
  - rag.5.38
  text: I want her to be neither clothed nor unclothed, neither fed nor unfed, and yet she is not to come alone,
    and yet no man is to go with her."
- lines:
  - rag.5.39
  - rag.5.39
  text: Now they went until they came to the house, and they looked closely at Kraka, and this woman seemed to them
    so beautiful that they thought no other was as beautiful.
- lines:
  - rag.5.40
  - rag.5.40
  text: And now they gave the message of their lord, Ragnar, and also how she was to be dressed.
- lines:
  - rag.5.41
  - rag.5.41
  text: Kraka considered how the king had spoken and how she was to make herself ready, but Grima thought it could
    in no way be done, and said she knew this king could not be wise.
- lines:
  - rag.5.42
  - rag.5.42
  text: 'Kraka said: "He will have spoken so because it can be done, if we understand it as he intends.'
- lines:
  - rag.5.43
  - rag.5.43
  text: But I certainly cannot go with you today, but I will come early tomorrow to your ships."
- lines:
  - rag.5.44
  - rag.5.44
  text: Now they went away and told Ragnar how matters stood, that she would come to meet them.
- lines:
  - rag.5.45
  - rag.5.45
  text: And now she was at home that night.
- lines:
  - rag.5.46
  - rag.5.46
  text: And early in the morning Kraka told the old man that she would now go to meet Ragnar.
- lines:
  - rag.5.47
  - rag.5.47
  text: '"But I will have to change my dress somewhat; you have a trout-net, and I will wrap it around me, and over
    it I will let my hair fall, and then I will be bare nowhere.'
- lines:
  - rag.5.48
  - rag.5.48
  text: And I will taste a leek, and that is little food, but still it can be known that I have tasted (something).
- lines:
  - rag.5.49
  - rag.5.49
  text: And I will have your dog go with me, and then I am not going alone, and yet no man goes with me."
- lines:
  - rag.5.50
  - rag.5.50
  text: And when the old woman heard her plan, she thought she had great good sense.
- lines:
  - rag.5.51
  - rag.5.51
  text: And when Kraka was ready, she went on her way until she came to the ships, and she was fair to see from
    a distance, for her hair was bright and it was as if one looked on gold.
- lines:
  - rag.5.52
  - rag.5.52
  text: And now Ragnar called to her and asked who she was or whom she wanted to see.
- lines:
  - rag.5.53
  - rag.5.53
  text: 'She answered and spoke a verse:'
- lines:
  - rag.5.54
  - rag.5.61
  text: '"I dare not break the command

    by which you bade me come,

    nor violate the ruler''s summons,

    Ragnar, to a meeting with you;

    no man is in my company,

    my skin is not bare;

    I have a full good companion;

    I go alone."'
- lines:
  - rag.5.62
  - rag.5.62
  text: Now he sent men to meet her and had her escorted onto his ships.
- lines:
  - rag.5.63
  - rag.5.63
  text: But she said she would not go unless a pledge of safety was given to her and her companion.
- lines:
  - rag.5.64
  - rag.5.64
  text: Now she was escorted onto the king's ship, and when she came to the space before the raised deck, he reached
    out toward her, and the dog bit his hand.
- lines:
  - rag.5.65
  - rag.5.65
  text: His men ran up and killed the dog, and drew a bowstring around its neck, and it got its death from that,
    and the pledge of safety to her was kept no better than that.
- lines:
  - rag.5.66
  - rag.5.66
  text: Now Ragnar placed her on the raised deck beside him and talked with her, and he was well disposed toward
    her and gentle with her.
- lines:
  - rag.5.67
  - rag.5.67
  text: 'He spoke a verse:'
- lines:
  - rag.5.68
  - rag.5.71
  text: '"Surely, if the guardian of (his) father''s land [the king, Ragnar]

    were (dear) to the worthy, gentle woman,

    she would

    lay her hands on me [?]."'
- lines:
  - rag.5.72
  - rag.5.72
  text: 'She spoke:'
- lines:
  - rag.5.73
  - rag.5.76
  text: '"Unblemished, prince,

    if you will respect the pledge of safety,

    (I have come to visit the ruler),

    you shall let me go from here."'
- lines:
  - rag.6.1
  - rag.6.1
  text: Now he said that she pleased him well, and he fully intended that she should go with him.
- lines:
  - rag.6.2
  - rag.6.2
  text: Then she said that could not be.
- lines:
  - rag.6.3
  - rag.6.3
  text: Then he said he wanted her to stay the night there on the ship.
- lines:
  - rag.6.4
  - rag.6.4
  text: She said that it should not be so before he came home from the journey he had planned, "and it may be that
    then things will seem otherwise to you."
- lines:
  - rag.6.5
  - rag.6.5
  text: Then Ragnar called his treasurer and told him to take the shirt that Thora had owned, which was embroidered
    all over with gold, and bring it to him.
- lines:
  - rag.6.6
  - rag.6.6
  text: 'Then Ragnar made Kraka an offer in this way:'
- lines:
  - rag.6.7
  - rag.6.14
  text: '"Will you accept this,

    which Thora Hart owned,

    the shirt marked with silver?

    The clothes would suit you very well;

    her white hands

    moved over these garments;

    she was dear to the gentle

    king of men until death."'
- lines:
  - rag.6.15
  - rag.6.15
  text: 'Kraka spoke in reply:'
- lines:
  - rag.6.16
  - rag.6.23
  text: '"I dare not accept the one

    which Thora Hart owned,

    the shirt marked with silver;

    poor [?] clothes suit me;

    I am called Kraka (crow)

    in coal-black garments,

    because I have walked over stones

    and driven goats along the sea."'
- lines:
  - rag.6.24
  - rag.6.24
  text: '"And I will certainly not accept the shirt," she said.'
- lines:
  - rag.6.25
  - rag.6.25
  text: '"I will not dress in finery while I am with the old man.'
- lines:
  - rag.6.26
  - rag.6.26
  text: It may be that you will like me better if I dress better, and now I want to go home.
- lines:
  - rag.6.27
  - rag.6.27
  text: But then you can send men for me, if your mind is still the same then and you want me to go with you."
- lines:
  - rag.6.28
  - rag.6.28
  text: Ragnar said that his mind would not change, and she went home.
- lines:
  - rag.6.29
  - rag.6.29
  text: And they went as they had planned, as soon as they got a fair wind, and he finished his business as he had
    intended.
- lines:
  - rag.6.30
  - rag.6.30
  text: And when he went back, he came into the same harbor he had used before, when Kraka came to him.
- lines:
  - rag.6.31
  - rag.6.31
  text: And that same evening he sent men to her to give Ragnar's message, that she should now leave for good.
- lines:
  - rag.6.32
  - rag.6.32
  text: But she said she would not go before the morning.
- lines:
  - rag.6.33
  - rag.6.33
  text: Kraka rose early and went to the bed of the old man and the old woman, and asked whether they were awake.
- lines:
  - rag.6.34
  - rag.6.34
  text: They said they were awake and asked what she wanted.
- lines:
  - rag.6.35
  - rag.6.35
  text: And she said that she meant to go away and stay there no longer.
- lines:
  - rag.6.36
  - rag.6.36
  text: '"But I know that you two killed Heimir, my foster-father, and there is no one I have a worse debt to repay
    than you.'
- lines:
  - rag.6.37
  - rag.6.37
  text: 'And for this reason I will not have harm done to you, that I have been with you a long time; but now I
    will declare this: that each day that comes over you be worse than the one before, and the last the worst; and
    now we shall part."'
- lines:
  - rag.6.38
  - rag.6.38
  text: Then she went on her way to the ships, and she was well received there.
- lines:
  - rag.6.39
  - rag.6.39
  text: They had good weather.
- lines:
  - rag.6.40
  - rag.6.40
  text: That same evening, when people were to go to bed, Ragnar said that he wanted him and Kraka to sleep together.
- lines:
  - rag.6.41
  - rag.6.41
  text: She said that it could not be so, "and I want you to drink a wedding feast for me when you come to your
    kingdom, and I think that is my honor as well as yours and our heirs', if we have any."
- lines:
  - rag.6.42
  - rag.6.42
  text: He granted her request, and their journey went well.
- lines:
  - rag.6.43
  - rag.6.43
  text: Ragnar now came home to his land, and a splendid feast was prepared to meet him, and now both his welcome-ale
    and his wedding were drunk.
- lines:
  - rag.6.44
  - rag.6.44
  text: And the first evening, when they came into one bed, Ragnar wanted to have marital relations with his wife,
    but she asked to be spared, because she said that something would come of it afterwards if she did not have
    her way.
- lines:
  - rag.6.45
  - rag.6.45
  text: Ragnar said he would not believe that, and said the old man and the old woman had no foresight.
- lines:
  - rag.6.46
  - rag.6.46
  text: He asked how long it should be so.
- lines:
  - rag.6.47
  - rag.6.47
  text: 'Then she spoke:'
- lines:
  - rag.6.48
  - rag.6.55
  text: '"For these three nights we two shall,

    and yet together,

    live each apart in the hall,

    before we sacrifice to the holy gods;

    then no lasting harm

    will come to my son;

    you are rather hasty to beget

    the one who has no bones."'
- lines:
  - rag.6.56
  - rag.6.56
  text: And though she spoke this, Ragnar paid no attention to it and had his way.
- lines:
  - rag.7.1
  - rag.7.1
  text: Now time passed, and their life together was good, and there was great love (between them).
- lines:
  - rag.7.2
  - rag.7.2
  text: And Kraka felt herself in labor and was delivered and bore a boy, and the boy was sprinkled with water
    and given a name and called Ivar.
- lines:
  - rag.7.3
  - rag.7.3
  text: But that boy was boneless, and it was as if there were gristle where bones should be.
- lines:
  - rag.7.4
  - rag.7.4
  text: And when he was young, he was so large in growth that none were his equals.
- lines:
  - rag.7.5
  - rag.7.5
  text: He was the handsomest of all men to look at, and so wise that it is not certain who has been a greater sage
    than he.
- lines:
  - rag.7.6
  - rag.7.6
  text: They had yet more children.
- lines:
  - rag.7.7
  - rag.7.7
  text: Their second son was called Bjorn, the third Hvitserk, the fourth Rognvald.
- lines:
  - rag.7.8
  - rag.7.8
  text: They were all big men and the boldest, and as soon as they could do anything, they learned all kinds of
    skills.
- lines:
  - rag.7.9
  - rag.7.9
  text: And wherever they went, Ivar had himself carried on poles, because he could not walk, and he was to have
    the counsel for them in whatever they did.
- lines:
  - rag.7.10
  - rag.7.10
  text: Now Eirik and Agnar, sons of Ragnar, were great men in their own right, so that their equals were hardly
    found, and they lived on warships every summer and were renowned for their raiding.
- lines:
  - rag.7.11
  - rag.7.11
  text: And now it happened one day that Ivar spoke with his brothers, Hvitserk and Bjorn, (asking) how long it
    should go on that they sat at home and sought no fame for themselves.
- lines:
  - rag.7.12
  - rag.7.12
  text: And they said that they would follow his counsel in that as in other things.
- lines:
  - rag.7.13
  - rag.7.13
  text: '"Now I want," said Ivar, "us to ask that ships and men be got for us, so that they are well manned, and
    then I want us to win wealth and renown for ourselves, if it will turn out so."'
- lines:
  - rag.7.14
  - rag.7.14
  text: And when they had decided this among themselves, they told Ragnar that they wanted him to get them ships,
    and to man them with men who were tried in plundering and well equipped in every respect.
- lines:
  - rag.7.15
  - rag.7.15
  text: And he did it as they asked.
- lines:
  - rag.7.16
  - rag.7.16
  text: And now when this force was ready, they went out of the land.
- lines:
  - rag.7.17
  - rag.7.17
  text: And wherever they fought with men, they got the better share and won for themselves both a large force and
    wealth.
- lines:
  - rag.7.18
  - rag.7.18
  text: And now Ivar said that he wanted them to make for a place where there was greater odds against them, and
    so test their valor.
- lines:
  - rag.7.19
  - rag.7.19
  text: And now they asked where he knew of such a prospect.
- lines:
  - rag.7.20
  - rag.7.20
  text: And now he named one place, which is called Hvitabaer, and there had been sacrifices there, "and many have
    tried to take it, and none have won," and Ragnar had come there and had to turn away and achieved nothing.
- lines:
  - rag.7.21
  - rag.7.21
  text: '"Is the force there so large," they said, "and so hardy, or are there other difficulties?"'
- lines:
  - rag.7.22
  - rag.7.22
  text: Ivar said that there was both a great multitude and a great place of sacrifice, and that it had overcome
    everyone and none had withstood it.
- lines:
  - rag.7.23
  - rag.7.23
  text: And now they said that he should decide whether they should go there or not.
- lines:
  - rag.7.24
  - rag.7.24
  text: And he said that he would rather risk (finding out) which would prove the stronger, their hardihood or the
    sorcery of the people of the land.
- lines:
  - rag.8.1
  - rag.8.1
  text: Now they made for that place, and when they came to land there, they made ready to go ashore.
- lines:
  - rag.8.2
  - rag.8.2
  text: And now they thought it needful that part of the force should guard the ships.
- lines:
  - rag.8.3
  - rag.8.3
  text: And Rognvald, their brother, was young then, so that they thought him not fit to be in so great a trial
    as they thought likely that it would be, and they had him guard the ships with part of the force.
- lines:
  - rag.8.4
  - rag.8.4
  text: But before they went from the ships, Ivar said that the townsmen owned two cattle, and they were heifers,
    and men had turned away from there because they could not withstand their bellowing and their troll-power.
- lines:
  - rag.8.5
  - rag.8.5
  text: 'Then Ivar said: "Bear up as well as you can, though some fear comes upon you, for it will do no harm."'
- lines:
  - rag.8.6
  - rag.8.6
  text: Now they drew up their force.
- lines:
  - rag.8.7
  - rag.8.7
  text: And when they drew near the town, those who lived in the place became aware of them, and now began to let
    loose these cattle that they believed in.
- lines:
  - rag.8.8
  - rag.8.8
  text: And when the heifers were let loose, they ran hard and bellowed fiercely.
- lines:
  - rag.8.9
  - rag.8.9
  text: Now Ivar saw this, where he was carried on a shield, and asked to be given a bow, and so it was done.
- lines:
  - rag.8.10
  - rag.8.10
  text: Now he shot these evil heifers so that both got their death, and now this danger was removed, which men
    had feared most.
- lines:
  - rag.8.11
  - rag.8.11
  text: Now Rognvald spoke up at the ships and said to his men that those men were fortunate who had such sport
    as his brothers had.
- lines:
  - rag.8.12
  - rag.8.12
  text: '"And nothing else lies behind it, that I had to stay behind, than that they alone want to have the honor
    of it.'
- lines:
  - rag.8.13
  - rag.8.13
  text: Now we shall all go up."
- lines:
  - rag.8.14
  - rag.8.14
  text: And now they did so.
- lines:
  - rag.8.15
  - rag.8.15
  text: And when they came up behind the force, Rognvald went hard forward into the battle, and it ended so that
    he fell.
- lines:
  - rag.8.16
  - rag.8.16
  text: But the brothers got into the town, and now the battle began anew, and it ended so that the townsmen took
    to flight, and they pursued the fleeing men.
- lines:
  - rag.8.17
  - rag.8.17
  text: 'And when they turned back to the town, Bjorn spoke a verse:'
- lines:
  - rag.8.18
  - rag.8.25
  text: '"We raised up a war cry,

    our swords bit more than theirs,

    I shall speak the truth of it,

    in Gnipafjord;

    each who wished could,

    outside Hvitabaer,

    and the lads did not spare

    their swords, become a slayer of men."'
- lines:
  - rag.8.26
  - rag.8.26
  text: And when they came back into the town, they took all the movable goods, and burned every house that was
    in the town, and broke down all the town walls.
- lines:
  - rag.8.27
  - rag.8.27
  text: And now they sailed their ships away from there.
- lines:
  - rag.9.1
  - rag.9.1
  text: There was a king called Eystein, who ruled over Sweden.
- lines:
  - rag.9.2
  - rag.9.2
  text: He was married and had one daughter.
- lines:
  - rag.9.3
  - rag.9.3
  text: She was called Ingibjorg.
- lines:
  - rag.9.4
  - rag.9.4
  text: She was the fairest of all women and the most beautiful to look at.
- lines:
  - rag.9.5
  - rag.9.5
  text: King Eystein was powerful and had many men, malicious and yet wise.
- lines:
  - rag.9.6
  - rag.9.6
  text: He had his seat at Uppsala.
- lines:
  - rag.9.7
  - rag.9.7
  text: He was a great sacrificer, and at Uppsala at that time there were sacrifices so great that nowhere in the
    northern lands have there been greater.
- lines:
  - rag.9.8
  - rag.9.8
  text: They had great faith in a cow, and they called her Sibilja.
- lines:
  - rag.9.9
  - rag.9.9
  text: So much had been sacrificed to her that men could not withstand her bellowing.
- lines:
  - rag.9.10
  - rag.9.10
  text: And the king was accustomed, when war was expected, (to have) this same cow go before the battle lines,
    and such great devil's power went with her
- lines:
  - rag.9.11
  - rag.9.11
  text: that his enemies became so mad, as soon as they heard her, that they fought among themselves and took no
    heed of themselves, and for that reason Sweden was not raided,
- lines:
  - rag.9.12
  - rag.9.12
  text: because men did not dare to contend against such overwhelming odds.
- lines:
  - rag.9.13
  - rag.9.13
  text: King Eystein was on friendly terms with many men and chieftains, and it is said that at that time there
    was great friendship between Ragnar and King Eystein, and they were accustomed each to visit the other at a
    feast in alternate summers.
- lines:
  - rag.9.14
  - rag.9.14
  text: Now it came about that Ragnar was to go to a feast with King Eystein.
- lines:
  - rag.9.15
  - rag.9.15
  text: And when he came to Uppsala, he and his men were well received.
- lines:
  - rag.9.16
  - rag.9.16
  text: And when they drank on the first evening, the king had his daughter pour for himself and Ragnar.
- lines:
  - rag.9.17
  - rag.9.17
  text: And Ragnar's men said among themselves that there was nothing else for it but that he should ask for King
    Eystein's daughter, and no longer have a peasant's daughter (as wife).
- lines:
  - rag.9.18
  - rag.9.18
  text: And now one of his men took it upon himself to put this to him, and it ended so that the woman was promised
    to him, and she was nevertheless to remain betrothed for a very long time.
- lines:
  - rag.9.19
  - rag.9.19
  text: And when that feast was over, Ragnar made ready to go home, and his journey went well, and nothing is told
    of his journey until he had a short way to go to the town, and his road lay through a forest.
- lines:
  - rag.9.20
  - rag.9.20
  text: They came into a clearing that was in the forest.
- lines:
  - rag.9.21
  - rag.9.21
  text: Then Ragnar had his men halt, and called for silence, and asked all the men who had been with him on his
    journey to Sweden that none should tell of his intention that had been set up about a marriage with King Eystein's
    daughter.
- lines:
  - rag.9.22
  - rag.9.22
  text: Now he laid such weight on this that if there was anyone who spoke of it, he would lose nothing less than
    his life for it.
- lines:
  - rag.9.23
  - rag.9.23
  text: And now when he had said what he wanted, he went home to the town.
- lines:
  - rag.9.24
  - rag.9.24
  text: And now people were glad when he came back, and then a welcome ale was drunk for him.
- lines:
  - rag.9.25
  - rag.9.25
  text: 'And when he came into the high seat and had sat there not long, Kraka came into the hall before Ragnar
    and sat on his knee and put her arms around his neck and asked: "What news?"'
- lines:
  - rag.9.26
  - rag.9.26
  text: But he said he could tell none.
- lines:
  - rag.9.27
  - rag.9.27
  text: And as the evening wore on, men took to drinking, and after that men went to sleep.
- lines:
  - rag.9.28
  - rag.9.28
  text: And when Ragnar and Kraka came into one bed, she asked him again for news, but he said he knew none.
- lines:
  - rag.9.29
  - rag.9.29
  text: Now she wanted to chatter about many things, but he said he was very sleepy and tired from travel.
- lines:
  - rag.9.30
  - rag.9.30
  text: '"Now I shall tell you news," she said, "if you will tell me none."'
- lines:
  - rag.9.31
  - rag.9.31
  text: He asked what it was.
- lines:
  - rag.9.32
  - rag.9.32
  text: '"I call it news," she said, "if a king is promised a woman, and yet it is some people''s talk that he has
    another already."'
- lines:
  - rag.9.33
  - rag.9.33
  text: '"Who told you this?" said Ragnar.'
- lines:
  - rag.9.34
  - rag.9.34
  text: '"Your men shall keep life and limb, for none of your men told me," she said.'
- lines:
  - rag.9.35
  - rag.9.35
  text: '"You will have seen that three birds sat in the tree near you.'
- lines:
  - rag.9.36
  - rag.9.36
  text: They told me this news.
- lines:
  - rag.9.37
  - rag.9.37
  text: This I ask, that you do not carry out this marriage as is intended.
- lines:
  - rag.9.38
  - rag.9.38
  text: Now I shall tell you that I am a king's daughter and not a peasant's, and my father was so renowned a man
    that his equal was not to be found, and my mother was the fairest and wisest of all women, and her name will
    be remembered while the world stands."
- lines:
  - rag.9.39
  - rag.9.39
  text: Now he asked who her father was, if she were not the daughter of the poor peasant who was at Spangarheid.
- lines:
  - rag.9.40
  - rag.9.40
  text: She said that she was the daughter of Sigurd the slayer of Fafnir and of Brynhild, Budli's daughter.
- lines:
  - rag.9.41
  - rag.9.41
  text: '"That seems to me most unlikely, that their daughter should be called Kraka, or that their child should
    grow up in such poverty as there was at Spangarheid."'
- lines:
  - rag.9.42
  - rag.9.42
  text: 'Then she answered: "There is a story to that," and now she told it, and began the story where Sigurd and
    Brynhild met on the mountain and she became pregnant.'
- lines:
  - rag.9.43
  - rag.9.43
  text: '"And when Brynhild was delivered, I was given a name, and I was called Aslaug."'
- lines:
  - rag.9.44
  - rag.9.44
  text: And now she told everything that had happened from the time when she and the peasant met.
- lines:
  - rag.9.45
  - rag.9.45
  text: 'Then Ragnar answered: "I am taken aback [?] by these Aslaug-ravings that you speak."'
- lines:
  - rag.9.46
  - rag.9.46
  text: 'She answered: "You know that I am not a whole person (but with child), and it will be a boy that I carry,
    and on that boy there will be the mark that it will seem as if a snake lies around the boy''s eye.'
- lines:
  - rag.9.47
  - rag.9.47
  text: And if this comes to pass, I ask that you do not go to Sweden at the time when you are to marry King Eystein's
    daughter.
- lines:
  - rag.9.48
  - rag.9.48
  text: But if this fails, go about it as you wish.
- lines:
  - rag.9.49
  - rag.9.49
  text: And I want that boy to be named after my father, if this mark of fame is in his eye, as I expect there will
    be."
- lines:
  - rag.9.50
  - rag.9.50
  text: Now the time came when she felt herself in labor and was delivered and bore a boy.
- lines:
  - rag.9.51
  - rag.9.51
  text: Now serving women took the boy and showed him to her.
- lines:
  - rag.9.52
  - rag.9.52
  text: Then she said that he should be carried to Ragnar and shown to him.
- lines:
  - rag.9.53
  - rag.9.53
  text: And now it was done so, that the young person was carried into the hall and laid in the fold of Ragnar's
    cloak.
- lines:
  - rag.9.54
  - rag.9.54
  text: And when he saw the boy, he was asked what he should be called.
- lines:
  - rag.9.55
  - rag.9.55
  text: 'He spoke a verse:'
- lines:
  - rag.9.56
  - rag.9.63
  text: '"Sigurd shall the boy be called,

    he shall wage battles,

    be very like his mother

    and be called his father''s son;

    he, of Odin''s kin, shall be called

    the surpasser (of others),

    he who has a snake in the eye,

    who made another die."'
- lines:
  - rag.9.64
  - rag.9.64
  text: Now he drew a gold ring from his arm and gave it to the boy as a name-gift.
- lines:
  - rag.9.65
  - rag.9.65
  text: And when he stretched out his hand with the gold, it touched the boy's back, and Ragnar took that to mean
    that he wished to hate the gold (that is, to give it away freely).
- lines:
  - rag.9.66
  - rag.9.66
  text: 'And now he spoke a verse:'
- lines:
  - rag.9.67
  - rag.9.74
  text: '"To men the precious son

    of Brynhild''s daughter

    seems to have a gleaming brow-stone [eye]

    and the most loyal heart;

    this offerer of the wound-flame [sword; so, a warrior]

    surpasses all men in strength,

    the kinsman of Budli, who, early grown,

    hates the red ring [gives gold away]."'
- lines:
  - rag.9.75
  - rag.9.75
  text: 'And again he spoke:'
- lines:
  - rag.9.76
  - rag.9.83
  text: '"I have seen in no boy

    except Sigurd alone

    the reins of the rim-land [?] [the serpent]

    laid in the brown brow-stones [eyes];

    this day-diminisher of dýja [?] [man?]

    (it is easy to know him by it)

    has got, sharp, in the field of the eyelids [eye],

    the ring of the dark wood [the serpent]."'
- lines:
  - rag.9.84
  - rag.9.84
  text: Now he said that the boy should be carried out to the women's house.
- lines:
  - rag.9.85
  - rag.9.85
  text: And then it was settled that he would not go to Sweden.
- lines:
  - rag.9.86
  - rag.9.86
  text: And now Aslaug's lineage became known, so that every man knew that she was the daughter of Sigurd the slayer
    of Fafnir and of Brynhild, Budli's daughter.
- lines:
  - rag.10.1
  - rag.10.1
  text: Now when the time had passed that had been fixed for Ragnar to go to the feast at Uppsala and he did not
    come, King Eystein thought that dishonor had been done to him and to his daughter, and now the friendship between
    the kings was at an end.
- lines:
  - rag.10.2
  - rag.10.2
  text: And when Eirik and Agnar, sons of Ragnar, heard this, they talked among themselves that they would gather
    a great force, as large as they could, and would raid in Sweden.
- lines:
  - rag.10.3
  - rag.10.3
  text: And now they drew together a large force and made ready their ships, and they thought much depended on it
    going well when the ships were to be launched.
- lines:
  - rag.10.4
  - rag.10.4
  text: Now it happened that Agnar's ship shot off the roller, and a man was in its way, and he got his death, and
    they called that a roller-reddening.
- lines:
  - rag.10.5
  - rag.10.5
  text: Now they thought that it had not gone well at the start, and they would not let that stand in the way of
    their journey.
- lines:
  - rag.10.6
  - rag.10.6
  text: And when their force was ready, they went with their force to Sweden, and where they first came into King
    Eystein's realm, they harried it with war.
- lines:
  - rag.10.7
  - rag.10.7
  text: But the people of the land became aware of it and went to Uppsala and told King Eystein that an army had
    come into the land.
- lines:
  - rag.10.8
  - rag.10.8
  text: And the king had a war-arrow sent round his realm and drew together so large an army that it was a wonder.
- lines:
  - rag.10.9
  - rag.10.9
  text: And he led that army until he came into a forest, and set up his camp there, and now he had the cow Sibilja
    with him, and much was sacrificed to her before she would go.
- lines:
  - rag.10.10
  - rag.10.10
  text: 'And when they were in the forest, King Eystein said: "I have heard," he said, "that the sons of Ragnar
    are on the plains in front of the forest, and I am truly told that they do not have even a third of the force
    that we have.'
- lines:
  - rag.10.11
  - rag.10.11
  text: Now we shall draw up our battle lines to fight, and a third of our force shall go against them, and they
    are so hardy
- lines:
  - rag.10.12
  - rag.10.12
  text: that they will think they have us in their hands, and right after that we shall come at them with our whole
    strength, and the cow shall go before the force,
- lines:
  - rag.10.13
  - rag.10.13
  text: and I expect that they will not hold their ground before her bellowing."
- lines:
  - rag.10.14
  - rag.10.14
  text: And now it was done so.
- lines:
  - rag.10.15
  - rag.10.15
  text: And as soon as the brothers saw King Eystein's force, they thought it no overwhelming odds to deal with,
    and did not expect the force to be any larger.
- lines:
  - rag.10.16
  - rag.10.16
  text: And right after this the whole army came out of the forest, and the cow was let loose, and she ran before
    the army and bellowed fiercely, and so great a din came upon the warriors who heard it that they fought among
    themselves, except that the two brothers were able to stand firm.
- lines:
  - rag.10.17
  - rag.10.17
  text: And that evil creature gored many a man with her horns that day.
- lines:
  - rag.10.18
  - rag.10.18
  text: And though the sons of Ragnar were great men, they could not withstand both the overwhelming numbers and
    the sorcery, and yet they put up a hard resistance and defended themselves well and bravely and with great renown.
- lines:
  - rag.10.19
  - rag.10.19
  text: Eirik and Agnar were at the front of the battle line that day, and often they went right through King Eystein's
    battle lines.
- lines:
  - rag.10.20
  - rag.10.20
  text: And now Agnar fell.
- lines:
  - rag.10.21
  - rag.10.21
  text: Now Eirik saw that, and now fought most boldly of all, and now did not care whether he got away or not.
- lines:
  - rag.10.22
  - rag.10.22
  text: And now he was overcome by numbers and taken captive.
- lines:
  - rag.10.23
  - rag.10.23
  text: And now Eystein said that the battle should be stopped, and offered Eirik quarter.
- lines:
  - rag.10.24
  - rag.10.24
  text: '"And I will add this for you," he said, "that I will give you my daughter in marriage."'
- lines:
  - rag.10.25
  - rag.10.25
  text: 'Eirik answered and spoke a verse:'
- lines:
  - rag.10.26
  - rag.10.33
  text: '"I will not take payment for my brother,

    nor buy a maiden with rings,

    (when I) hear (men) say that Eystein

    has become Agnar''s slayer;

    my mother will not weep for me,

    I shall die on top of the slain,

    and let me stand,

    pierced through by spear-trees [spears]."'
- lines:
  - rag.10.34
  - rag.10.34
  text: Now he said that he wanted those men who had followed him to have quarter and go wherever they wished.
- lines:
  - rag.10.35
  - rag.10.35
  text: '"But I want as many spears as possible to be taken and the spears thrust down into the ground, and there
    I want to have myself raised up on them, and there I want to lose my life."'
- lines:
  - rag.10.36
  - rag.10.36
  text: Now King Eystein said that it should be done as he asked, though he chose what was worse for both of them.
- lines:
  - rag.10.37
  - rag.10.37
  text: 'Now the spears were set down, and Eirik spoke a verse:'
- lines:
  - rag.10.38
  - rag.10.45
  text: '"No king''s son,

    so far as I know of an instance,

    shall die on a costlier bed,

    as a morning meal for the raven;

    then the dark ones [ravens] will tear the flesh

    of both brothers in blood,

    and soon scream over (them),

    though it repays badly [?]."'
- lines:
  - rag.10.46
  - rag.10.46
  text: 'And now he went to where the spears were set down, and took a ring from his arm and threw it to those who
    had followed him and had been given quarter, and sent them to Aslaug, and spoke a verse:'
- lines:
  - rag.10.47
  - rag.10.54
  text: '"Carry these last words,

    the eastern voyages are over,

    that the maiden should have my rings,

    (tell it) to slender Aslaug;

    then my stepmother will speak

    most out of grief [?]

    to her gentle sons,

    when they hear that I am dead."'
- lines:
  - rag.10.55
  - rag.10.55
  text: And now he was raised up onto the spears.
- lines:
  - rag.10.56
  - rag.10.56
  text: 'Then he saw where a raven flew, and again he spoke:'
- lines:
  - rag.10.57
  - rag.10.64
  text: '"The gull of wounds [the raven] screams

    here over my head now,

    the falcon of wounds [the raven] claims

    my eyes, soon unseeing here;

    you know, if the raven hacks

    my brow-stones [eyes] out of my head,

    the falcon of the wounds of Ekkil [?] [the raven]

    repays badly many a fill (of carrion)."'
- lines:
  - rag.10.65
  - rag.10.65
  text: Now he lost his life with great valor.
- lines:
  - rag.10.66
  - rag.10.66
  text: And his messengers went home and did not stop until they came to where Ragnar had his seat.
- lines:
  - rag.10.67
  - rag.10.67
  text: And then he had gone to a meeting of kings.
- lines:
  - rag.10.68
  - rag.10.68
  text: The sons of Ragnar had also not come home from raiding.
- lines:
  - rag.10.69
  - rag.10.69
  text: Now they were there three nights before they went to meet Aslaug.
- lines:
  - rag.10.70
  - rag.10.70
  text: And when they came before Aslaug's high seat, they greeted her with respect, and she returned their greeting,
    and she had a linen cloth over her knees and meant to comb her hair, and she had let down her hair.
- lines:
  - rag.10.71
  - rag.10.71
  text: Now she asked who they were, because she had not seen them before.
- lines:
  - rag.10.72
  - rag.10.72
  text: The one who was spokesman for them said that they had been followers of Eirik and Agnar, sons of Ragnar.
- lines:
  - rag.10.73
  - rag.10.73
  text: 'Then she spoke a verse:'
- lines:
  - rag.10.74
  - rag.10.81
  text: '"What do you tell of your (journey),

    are the Swedes in the land

    or else abroad,

    confidant of a very new king [?]?

    I have heard that they set out,

    but further we know nothing,

    and the war-leaders, the Danes from the south,

    had a roller-reddening."'
- lines:
  - rag.10.82
  - rag.10.82
  text: 'He spoke a verse in reply:'
- lines:
  - rag.10.83
  - rag.10.90
  text: '"We tell you, woman,

    of the death of your (stepsons), that is hard,

    the sons of Thora;

    the fates of a man are especially ill [?];

    we know no other heavy tidings

    newer than these;

    now I have brought forward the news:

    an eagle flew over a dead corpse."'
- lines:
  - rag.10.91
  - rag.10.91
  text: Now she asked how it had gone.
- lines:
  - rag.10.92
  - rag.10.92
  text: And now he spoke the verse that Eirik had spoken when he sent her the ring.
- lines:
  - rag.10.93
  - rag.10.93
  text: Now they saw that she shed a tear, and it was like blood to look at, but hard as a hailstone.
- lines:
  - rag.10.94
  - rag.10.94
  text: No man had ever seen her shed a tear, either before or after.
- lines:
  - rag.10.95
  - rag.10.95
  text: Now she said that she could do nothing toward vengeance until one or the other came home, Ragnar or his
    sons.
- lines:
  - rag.10.96
  - rag.10.96
  text: '"But you shall stay here until then, and nothing shall be spared in urging vengeance, just as if they were
    my own sons."'
- lines:
  - rag.10.97
  - rag.10.97
  text: Now they stayed there.
- lines:
  - rag.10.98
  - rag.10.98
  text: And it so happened that Ivar and his brothers came home before Ragnar, and they had not been home long before
    Aslaug went to see her sons, and Sigurd was then three years old.
- lines:
  - rag.10.99
  - rag.10.99
  text: He went with his mother.
- lines:
  - rag.10.100
  - rag.10.100
  text: And when she came into the hall that the brothers ruled over, they welcomed her well, and each asked the
    other for news, and they told first of the fall of Rognvald, her son, and of the events that had happened there.
- lines:
  - rag.10.101
  - rag.10.101
  text: 'But that did not affect her much, and she spoke:'
- lines:
  - rag.10.102
  - rag.10.109
  text: '"My sons made me look out

    long over the gull''s plain [the sea];

    you are, at home and away,

    hardly fit for going house to house [?];

    Rognvald began to redden

    the shield-rim in men''s blood;

    he came youngest of my sons to Odin,

    bold in battle.'
- lines:
  - rag.10.110
  - rag.10.110
  text: I cannot see," she said, "that he would have lived to (win) greater fame."
- lines:
  - rag.10.111
  - rag.10.111
  text: Now they asked what news she had to tell.
- lines:
  - rag.10.112
  - rag.10.112
  text: 'She answered: "The fall of Eirik and Agnar, your brothers and my stepsons, men who I think were the best
    of warriors.'
- lines:
  - rag.10.113
  - rag.10.113
  text: And it is unnatural that you should not bear such a thing and take great vengeance.
- lines:
  - rag.10.114
  - rag.10.114
  text: And this I will ask of you, and (I will) be with you in every support, that this be avenged more rather
    than less."
- lines:
  - rag.10.115
  - rag.10.115
  text: Now Ivar said, "It is certain that I will never come to Sweden at such a time that I fight against King
    Eystein and the sorcery that is there."
- lines:
  - rag.10.116
  - rag.10.116
  text: She pressed this hard, but Ivar was spokesman for them and refused the journey every time.
- lines:
  - rag.10.117
  - rag.10.117
  text: 'And now she spoke a verse:'
- lines:
  - rag.10.118
  - rag.10.125
  text: '"You brothers would not

    remain unavenged

    one season after,

    if you had died first;

    little do I care to hide it,

    (I wish) that Eirik and Agnar

    could have their life,

    kinsmen not born of me."'
- lines:
  - rag.10.126
  - rag.10.126
  text: '"It is not certain," said Ivar, "whether it helps at all, though you speak one verse after another, or
    how exactly do you know what stronghold stands there in the way?"'
- lines:
  - rag.10.127
  - rag.10.127
  text: '"I do not know that for certain," she said, "but what can you tell of what difficulty lies there?"'
- lines:
  - rag.10.128
  - rag.10.128
  text: Ivar said that there was so great a sorcery that he said he had nowhere heard report that its like could
    be.
- lines:
  - rag.10.129
  - rag.10.129
  text: '"And that king is both powerful and malicious."'
- lines:
  - rag.10.130
  - rag.10.130
  text: '"What is it that he trusts most in his sacrifices?"'
- lines:
  - rag.10.131
  - rag.10.131
  text: 'He said: "It is a great cow, and she is called Sibilja.'
- lines:
  - rag.10.132
  - rag.10.132
  text: She is so filled with power that as soon as men hear her bellowing, none of his enemies has stood firm,
    and it is hardly as if one were only to fight with men,
- lines:
  - rag.10.133
  - rag.10.133
  text: rather one must expect that one will meet the troll-power before the king, and I will risk neither myself
    nor my men there."
- lines:
  - rag.10.134
  - rag.10.134
  text: 'She said: "You may look to this, that you cannot both be called the greatest man and do nothing to earn
    it."'
- lines:
  - rag.10.135
  - rag.10.135
  text: And now when she thought there was no hope, she meant to go away; she thought that they did not value her
    words much.
- lines:
  - rag.10.136
  - rag.10.136
  text: 'Then Sigurd Snake-in-the-Eye spoke: "I can tell you, mother," he said, "what is in my mind, but I cannot
    decide their answers."'
- lines:
  - rag.10.137
  - rag.10.137
  text: '"I want to hear that," she said.'
- lines:
  - rag.10.138
  - rag.10.138
  text: 'Now he spoke a verse:'
- lines:
  - rag.10.139
  - rag.10.146
  text: '"Within three nights,

    if it grieves you, mother,

    (we have a long way to go)

    a levy shall be ready;

    King Eystein shall not

    rule at Uppsala,

    though he offers boundless wealth,

    if our blades serve us."'
- lines:
  - rag.10.147
  - rag.10.147
  text: And when he had spoken this verse, the brothers' minds changed somewhat.
- lines:
  - rag.10.148
  - rag.10.148
  text: 'And now Aslaug said: "You make it plain now, my son, that you want to do my will.'
- lines:
  - rag.10.149
  - rag.10.149
  text: And yet I cannot see that we two can bring this about if we do not have the help of your brothers, but it
    might turn out so as would please me best, that this were avenged, and I think you do well, my son."
- lines:
  - rag.10.150
  - rag.10.150
  text: 'And now Bjorn spoke a verse:'
- lines:
  - rag.10.151
  - rag.10.158
  text: '"Mind and heart will serve

    in the hawk-quick breast

    of a man within the ribs,

    though he speaks less about it;

    there is in our eyes

    no snake nor gleaming serpents;

    my brothers gladdened me,

    I remember your stepsons."'
- lines:
  - rag.10.159
  - rag.10.159
  text: 'And now Hvitserk spoke a verse:'
- lines:
  - rag.10.160
  - rag.10.167
  text: '"Let us consider, before we vow,

    how vengeance may be done;

    let us make Agnar''s slayer

    welcome various evils;

    let us shove the hull onto the waves,

    hew the ice before the prow,

    let us look to it how

    soonest we may get the warships ready."'
- lines:
  - rag.10.168
  - rag.10.168
  text: And Hvitserk spoke of hewing the ice because there was a hard frost, and their ships were frozen in.
- lines:
  - rag.10.169
  - rag.10.169
  text: 'And now Ivar spoke up and said that it had now come to the point where he would take some part in it, and
    now he spoke a verse:'
- lines:
  - rag.10.170
  - rag.10.177
  text: '"You have courage enough

    and daring both,

    then there would be need

    that great persistence went with it;

    I, boneless, shall have to be

    carried forward before men,

    yet I have a hand for vengeance,

    though I can use neither (leg) [?].'
- lines:
  - rag.10.178
  - rag.10.178
  text: And now it comes to this," said Ivar, "that we put such thought as we can into fitting out the ships and
    gathering the army, because we shall need to spare nothing if we are to win."
- lines:
  - rag.10.179
  - rag.10.179
  text: Now Aslaug went away.
- lines:
  - rag.11.1
  - rag.11.1
  text: Sigurd had a foster-father, and he saw to it on his behalf both to make the ships ready and to get men for
    them, so that they were all manned.
- lines:
  - rag.11.2
  - rag.11.2
  text: And now it went so quickly for them that the force that Sigurd was to have ready was ready when three nights
    had passed, and he had five ships, all well manned.
- lines:
  - rag.11.3
  - rag.11.3
  text: And when five nights had passed, Hvitserk and Bjorn had fourteen ships ready, and Ivar had ten ships and
    Aslaug another ten, when seven nights had passed from when they had talked together and they had promised the
    journey.
- lines:
  - rag.11.4
  - rag.11.4
  text: Now they all met together, and each told the other how large a force each had got.
- lines:
  - rag.11.5
  - rag.11.5
  text: And now Ivar said that he had sent a troop of horsemen by the land route.
- lines:
  - rag.11.6
  - rag.11.6
  text: 'Aslaug said: "If I had known that a force going by land could be of use, I could have sent a large force."'
- lines:
  - rag.11.7
  - rag.11.7
  text: '"There shall be no delay over that now," said Ivar, "we shall go now with this force that we have drawn
    together."'
- lines:
  - rag.11.8
  - rag.11.8
  text: Now Aslaug said that she wanted to go with them, "and then I shall know best what effort is put into avenging
    the brothers."
- lines:
  - rag.11.9
  - rag.11.9
  text: '"It is certain," said Ivar, "that you will not come on our ships.'
- lines:
  - rag.11.10
  - rag.11.10
  text: It shall be this, if you will, that you command the force that goes by land."
- lines:
  - rag.11.11
  - rag.11.11
  text: She said it should be so.
- lines:
  - rag.11.12
  - rag.11.12
  text: Now her name was changed, and she was now called Randalin.
- lines:
  - rag.11.13
  - rag.11.13
  text: Now both forces set out, and Ivar had fixed beforehand where they should meet.
- lines:
  - rag.11.14
  - rag.11.14
  text: Now both went well and met where it had been fixed.
- lines:
  - rag.11.15
  - rag.11.15
  text: And wherever they came in Sweden in King Eystein's realm, they harried with war, so that they burned everything
    that was in their way, killed every human child, and they added to that that they killed everything that was
    alive.
- lines:
  - rag.12.1
  - rag.12.1
  text: Now it happened at some point that men escaped and went to King Eystein and told him that a great army had
    come into his realm, and so evil to deal with
- lines:
  - rag.12.2
  - rag.12.2
  text: that they left nothing undone, and they had laid waste everything where they had passed over, and no house
    stood.
- lines:
  - rag.12.3
  - rag.12.3
  text: Now when King Eystein heard this news, he thought he knew who those vikings must be.
- lines:
  - rag.12.4
  - rag.12.4
  text: And now he had a war-arrow sent round all his realm and summoned all who were his men and wished to give
    him help and could wield a shield.
- lines:
  - rag.12.5
  - rag.12.5
  text: '"We shall have with us the cow Sibilja, our god, and let her run before the army, and I expect that it
    will go again as before, that they cannot withstand her bellowing.'
- lines:
  - rag.12.6
  - rag.12.6
  text: I will urge all my men to fight as well as they can, and let us drive off this great and evil army."
- lines:
  - rag.12.7
  - rag.12.7
  text: And now it was done so, that Sibilja was let loose.
- lines:
  - rag.12.8
  - rag.12.8
  text: And now Ivar saw her coming and heard the fierce bellowing that came from her.
- lines:
  - rag.12.9
  - rag.12.9
  text: He told the whole army to make a great din, both with weapons and war cries, so that they would hear as
    little as possible the voice of her, that evil creature that was coming against them.
- lines:
  - rag.12.10
  - rag.12.10
  text: Ivar told his bearers that they should carry him against her, as far forward as they could.
- lines:
  - rag.12.11
  - rag.12.11
  text: '"And when this cow comes at us, throw me at her, and then it will be one or the other, that I shall lose
    my life or she shall get her death.'
- lines:
  - rag.12.12
  - rag.12.12
  text: Now you shall take a large tree and carve it into the shape of a bow, and arrows with it."
- lines:
  - rag.12.13
  - rag.12.13
  text: And now this strong bow was brought to him and the great arrows that he had had made, and to no one else did
    they seem fit to use as weapons.
- lines:
  - rag.12.14
  - rag.12.14
  text: Now Ivar urged every man to fight as well as he could.
- lines:
  - rag.12.15
  - rag.12.15
  text: Now their force went forward with great onrush and din, and Ivar was carried before their battle lines.
- lines:
  - rag.12.16
  - rag.12.16
  text: Now so great a din arose when Sibilja bellowed that they heard it as clearly as if they were silent and
    standing still.
- lines:
  - rag.12.17
  - rag.12.17
  text: Now it affected them so that their whole force wanted to fight (among themselves), except the brothers.
- lines:
  - rag.12.18
  - rag.12.18
  text: And when this wonder happened, those who carried Ivar saw that he drew his bow as if he had a weak elm-wand,
    and it seemed to them that he drew it beyond the point of his arrow.
- lines:
  - rag.12.19
  - rag.12.19
  text: Now they heard his string twang so loud that they had never heard it so before.
- lines:
  - rag.12.20
  - rag.12.20
  text: And now they saw that his arrows flew as swiftly as if he had shot from the strongest crossbow, and so true
    that each arrow went into one of Sibilja's eyes.
- lines:
  - rag.12.21
  - rag.12.21
  text: And now she fell, and after that she went headlong, and now her bellowing was much worse than before.
- lines:
  - rag.12.22
  - rag.12.22
  text: And when she came at them, he told them to throw him at her, and he was as light to them as if they threw
    a little child, because they were not very near the cow when they threw him.
- lines:
  - rag.12.23
  - rag.12.23
  text: And then he came down on the back of the cow Sibilja, and he became as heavy as if a rock fell on her, and
    every bone in her broke, and she got her death from it.
- lines:
  - rag.12.24
  - rag.12.24
  text: Now he asked men to take him up as quickly as possible.
- lines:
  - rag.12.25
  - rag.12.25
  text: And now he was taken up, and now his voice was so loud that it seemed to the whole army, when he spoke,
    as if he were right beside them, though they stood far off, and the best hearing was given to his message.
- lines:
  - rag.12.26
  - rag.12.26
  text: And he ended his speech in such a way that this madness that had come over them stopped at once entirely,
    and it did them no harm, because their force had fought (among themselves) for a short time.
- lines:
  - rag.12.27
  - rag.12.27
  text: Now Ivar urged that they should do the worst deeds they could against them.
- lines:
  - rag.12.28
  - rag.12.28
  text: '"And now I think the fiercest (of them) is gone, since the cow is killed."'
- lines:
  - rag.12.29
  - rag.12.29
  text: And now both sides had drawn up their forces, and the battle closed, and the fighting was so hard that all
    the Swedes said they had never been in such a trial.
- lines:
  - rag.12.30
  - rag.12.30
  text: Now the brothers Hvitserk and Bjorn went forward so hard that no battle line stood against them.
- lines:
  - rag.12.31
  - rag.12.31
  text: And now King Eystein's army fell in such numbers that fewer were left standing, and some took to flight.
- lines:
  - rag.12.32
  - rag.12.32
  text: And now their battle ended so that King Eystein fell, and the brothers had the victory.
- lines:
  - rag.12.33
  - rag.12.33
  text: And now they gave quarter to those who were left.
- lines:
  - rag.12.34
  - rag.12.34
  text: And now Ivar said that he did not want to raid any longer in that land, because that land was now without
    a ruler.
- lines:
  - rag.12.35
  - rag.12.35
  text: '"And I would rather that we two make for a place where there are greater odds against us."'
- lines:
  - rag.12.36
  - rag.12.36
  text: But Randalin went home with part of the force.
- lines:
  - rag.13.1
  - rag.13.1
  text: Now they decided between them that they would raid in the southern realms.
- lines:
  - rag.13.2
  - rag.13.2
  text: And Sigurd Snake-in-the-Eye, her son, went with his brothers on every raid after that.
- lines:
  - rag.13.3
  - rag.13.3
  text: On this expedition they attacked every town that was large, and won (them) so that nothing withstood (them).
- lines:
  - rag.13.4
  - rag.13.4
  text: And now they heard of one town that was both large and populous and strong.
- lines:
  - rag.13.5
  - rag.13.5
  text: And now Ivar said that he wanted to make for it.
- lines:
  - rag.13.6
  - rag.13.6
  text: And it was also told what that town was called and who ruled it.
- lines:
  - rag.13.7
  - rag.13.7
  text: That chieftain was called Vifil.
- lines:
  - rag.13.8
  - rag.13.8
  text: From his name the town was called Vifilsborg.
- lines:
  - rag.13.9
  - rag.13.9
  text: Now they went harrying across the land, so that they laid waste every town that lay in their path, until
    they came to Vifilsborg.
- lines:
  - rag.13.10
  - rag.13.10
  text: The chieftain was not at home in his town, and a great force with him.
- lines:
  - rag.13.11
  - rag.13.11
  text: Now they set up their booths on the fields that were near the town, and kept quiet the day they came to
    the town, and held talks with the townsmen.
- lines:
  - rag.13.12
  - rag.13.12
  text: They offered them (a choice), whether they would rather give up the town, and then peace would be granted
    to all men, or (that) they would win it by their overwhelming strength and hardihood, and then no man would
    be given quarter.
- lines:
  - rag.13.13
  - rag.13.13
  text: But they answered quickly and said that they would never be able to win that town in such a way that they
    (the townsmen) would give it up.
- lines:
  - rag.13.14
  - rag.13.14
  text: '"And you will first have to test yourselves and show us your valor and zeal."'
- lines:
  - rag.13.15
  - rag.13.15
  text: Now that night passed.
- lines:
  - rag.13.16
  - rag.13.16
  text: And the next day after they tried to take the town and achieved nothing.
- lines:
  - rag.13.17
  - rag.13.17
  text: They besieged that town for half a month and tried every day to take it, and with various stratagems.
- lines:
  - rag.13.18
  - rag.13.18
  text: But it went the worse the longer they tried, and now they meant to turn away.
- lines:
  - rag.13.19
  - rag.13.19
  text: And when the townsmen became aware that they meant to turn away, they went out onto the town walls and spread
    costly silk cloth over all the town walls, and all the clothes
- lines:
  - rag.13.20
  - rag.13.20
  text: that were finest in the town, and flaunted before them the gold and treasures that were greatest in the
    town.
- lines:
  - rag.13.21
  - rag.13.21
  text: 'And now one of their company spoke up and said: "We thought that these men, the sons of Ragnar, and their
    troop were hardy men, but we can say this, that they have come no nearer (to it) than others."'
- lines:
  - rag.13.22
  - rag.13.22
  text: After this they shouted at them and beat on their shields and egged them on as much as they could.
- lines:
  - rag.13.23
  - rag.13.23
  text: And when Ivar heard this, he was so much affected that he fell into a great sickness from it, so that he
    could not move at all, and they had to wait until he either got better or died.
- lines:
  - rag.13.24
  - rag.13.24
  text: He lay all that day until evening, so that he spoke not a word.
- lines:
  - rag.13.25
  - rag.13.25
  text: And then he told the men who were with him that they should tell Bjorn, Hvitserk and Sigurd that he wanted
    to meet them and all the wisest men.
- lines:
  - rag.13.26
  - rag.13.26
  text: And now when they had all come to one place, those who were the greatest chieftains in their army, Ivar
    asked them whether they had seen any plans that were more likely to win victory than those they had had before.
- lines:
  - rag.13.27
  - rag.13.27
  text: But they all answered that they had not the wit to see the stratagems that would bring them victory.
- lines:
  - rag.13.28
  - rag.13.28
  text: '"It is now as often before, that (we) will have to make use of your counsel."'
- lines:
  - rag.13.29
  - rag.13.29
  text: 'Then Ivar answered: "One plan has come into my mind that we have not tried.'
- lines:
  - rag.13.30
  - rag.13.30
  text: There is a great forest not far away, and now, when night falls, we shall go secretly from our tents to
    the forest, but our camp shall stay standing, and when we come into the wood each man shall bind himself a load
    (of firewood).
- lines:
  - rag.13.31
  - rag.13.31
  text: And when that is done, we shall go at the town on all sides and set fire to the wood, and then a great blaze
    will arise,
- lines:
  - rag.13.32
  - rag.13.32
  text: and their town walls will then lose their mortar before that fire, and then we shall bring up siege-engines
    and test how strong it is."
- lines:
  - rag.13.33
  - rag.13.33
  text: 'And now it was done so: they went to the forest and stayed there as long a while as seemed good to Ivar.'
- lines:
  - rag.13.34
  - rag.13.34
  text: Now they went to the town according to his orders, and when they set fire to the great (heap of) wood, the
    blaze became so great
- lines:
  - rag.13.35
  - rag.13.35
  text: that the walls could not stand and lost their mortar, and then they brought siege-engines against the town
    and broke many breaches in it, and now battle began.
- lines:
  - rag.13.36
  - rag.13.36
  text: And as soon as they stood on equal terms, the townsmen's force fell, and some fled, and their dealings ended
    so that they killed every living soul that was in the town, and took away all the wealth, and burned the town
    before they went away.
- lines:
  - rag.14.1
  - rag.14.1
  text: Now they went on from there until they came to the town that was called Luna.
- lines:
  - rag.14.2
  - rag.14.2
  text: By then they had broken nearly every town and every castle in all the southern realms, and now they were
    so famous over all the world that there was no child so small that it did not know their name.
- lines:
  - rag.14.3
  - rag.14.3
  text: Now they meant not to stop until they came to Rome, because that city was said to them to be both large
    and populous and splendid and rich.
- lines:
  - rag.14.4
  - rag.14.4
  text: But they did not know clearly how long the way there was, and they had so large a force that provisions
    could not be got.
- lines:
  - rag.14.5
  - rag.14.5
  text: And now they were in that town Luna and discussed their journey among themselves.
- lines:
  - rag.14.6
  - rag.14.6
  text: Now a man came there, old and of good appearance.
- lines:
  - rag.14.7
  - rag.14.7
  text: They asked what kind of man he was, and he said that he was a beggar and had spent all his life traveling
    over the land.
- lines:
  - rag.14.8
  - rag.14.8
  text: '"You will be able to tell us much news that we want to know."'
- lines:
  - rag.14.9
  - rag.14.9
  text: 'The old man answered: "I do not know for certain about which lands you want to ask, (and) of which I cannot
    tell you."'
- lines:
  - rag.14.10
  - rag.14.10
  text: '"This is what we want, that you tell us how long the way is from here to Rome."'
- lines:
  - rag.14.11
  - rag.14.11
  text: 'He answered: "I can tell you something by way of tokens.'
- lines:
  - rag.14.12
  - rag.14.12
  text: You can see here these iron shoes that I have on my feet; they are old now, and the other (pair) that I
    have on my back, they too are worn out now.
- lines:
  - rag.14.13
  - rag.14.13
  text: But when I set out from there, I bound on my feet these worn ones that I now have on my back, and both (pairs)
    were new then, and I have been on that road ever since."
- lines:
  - rag.14.14
  - rag.14.14
  text: And when the old man had said this, they thought they could see that they could not carry through what they
    had intended, to go to Rome.
- lines:
  - rag.14.15
  - rag.14.15
  text: And now they turned back with their army and won many towns that had never been won before, and the tokens
    of this are seen still today.
- lines:
  - rag.15.1
  - rag.15.1
  text: Now the story turns to where Ragnar sat at home in his kingdom, and he did not know where his sons were,
    nor Randalin, his wife.
- lines:
  - rag.15.2
  - rag.15.2
  text: And he heard every one of his men say that none could match his sons, and it seemed to him that none were
    as famous as they.
- lines:
  - rag.15.3
  - rag.15.3
  text: Now he considered what fame he might seek that would be remembered no less long.
- lines:
  - rag.15.4
  - rag.15.4
  text: Now he made his plan and got himself craftsmen and had a forest felled for two great ships, and men understood
- lines:
  - rag.15.5
  - rag.15.5
  text: that they were two knorrs (merchant ships) so large that none such had been built in the Northern lands,
    and along with that he had great stores of weapons made throughout all his kingdom.
- lines:
  - rag.15.6
  - rag.15.6
  text: And from these doings men understood that he must be planning some expedition out of the land.
- lines:
  - rag.15.7
  - rag.15.7
  text: This was heard widely in the lands that were nearest.
- lines:
  - rag.15.8
  - rag.15.8
  text: And now men feared, and all the kings who ruled lands, that they would not be able to remain in their lands
    or kingdoms.
- lines:
  - rag.15.9
  - rag.15.9
  text: And now each of them had watches kept over his lands, in case anyone should attack him.
- lines:
  - rag.15.10
  - rag.15.10
  text: It was once that Randalin asked Ragnar what expedition he was planning.
- lines:
  - rag.15.11
  - rag.15.11
  text: He told her that he meant to go to England and have no more ships than two knorrs and the men who could
    go on them.
- lines:
  - rag.15.12
  - rag.15.12
  text: 'Then Randalin said: "The voyage you now intend seems unwise to me.'
- lines:
  - rag.15.13
  - rag.15.13
  text: I would think it more advisable for you to have more ships and smaller ones."
- lines:
  - rag.15.14
  - rag.15.14
  text: '"It is no great deed," he said, "though men win a land with many ships.'
- lines:
  - rag.15.15
  - rag.15.15
  text: But there are no examples of this, that such a land as England is has been won with two ships.
- lines:
  - rag.15.16
  - rag.15.16
  text: And if I meet defeat, the better it is the fewer ships I have taken from the land."
- lines:
  - rag.15.17
  - rag.15.17
  text: 'Then Randalin answered: "It seems to me there is no less outlay before these ships are ready than if you
    had many longships for this voyage.'
- lines:
  - rag.15.18
  - rag.15.18
  text: And you know this, that it is hard to bring ships to England, and if it happens that your ships are lost,
    even if the men get ashore, then they are done for at once if a land army comes against them, and it is better
    to bring longships into harbor than knorrs."
- lines:
  - rag.15.19
  - rag.15.19
  text: 'Now Ragnar spoke a verse:'
- lines:
  - rag.15.20
  - rag.15.27
  text: '"Let no man spare the amber of the Rhine [gold]

    if he wants to have bold fighting men [?];

    a host of rings suits a wise prince

    worse than (a host) of warriors;

    it is bad to stand forth in the town gate

    with a fire-red ring;

    I know of very many princes

    dead while their wealth lives on."'
- lines:
  - rag.15.28
  - rag.15.28
  text: Now he had his ships made ready and got himself men, so that the knorrs were fully manned.
- lines:
  - rag.15.29
  - rag.15.29
  text: Now there was much talk about his plan.
- lines:
  - rag.15.30
  - rag.15.30
  text: 'And again he spoke a verse:'
- lines:
  - rag.15.31
  - rag.15.38
  text: '"What is it that the breaker of rings [the generous man, Ragnar]

    now hears roaring out of the rocks [?],

    that the wise tree of the hand-fire [the man; hand-fire is gold]

    will forgo the snake of the sea [the warship] [?]?

    Yet, thorn-Bil [lady], if the gods will,

    the brandisher of the fire of the forearm [the gold-giver, Ragnar]

    shall await their decision

    without fear [?]."'
- lines:
  - rag.15.39
  - rag.15.39
  text: And when his ships were ready, and the men who were to follow him, and when the wind came that he thought
    would suit him well, Ragnar said that now he would go to the ships.
- lines:
  - rag.15.40
  - rag.15.40
  text: And when he was ready, she led him to the ships.
- lines:
  - rag.15.41
  - rag.15.41
  text: And before they parted, she said she would repay him for the shirt he had given her.
- lines:
  - rag.15.42
  - rag.15.42
  text: He asked in what way that would be.
- lines:
  - rag.15.43
  - rag.15.43
  text: 'And she spoke a verse:'
- lines:
  - rag.15.44
  - rag.15.51
  text: '"I give you the long shirt,

    not sewn anywhere,

    woven with a whole heart

    from gray hair-thread;

    wound will not bleed

    nor edges bite you

    in the holy garment;

    it was hallowed to the gods."'
- lines:
  - rag.15.52
  - rag.15.52
  text: He said that he would accept this counsel.
- lines:
  - rag.15.53
  - rag.15.53
  text: And when they parted, it was plain to see that she took their parting hard.
- lines:
  - rag.15.54
  - rag.15.54
  text: Now Ragnar steered his ships to England, as he had intended.
- lines:
  - rag.15.55
  - rag.15.55
  text: He was given sharp winds, so that he wrecked both his knorrs off England, but all his men got ashore and
    kept their clothes and weapons.
- lines:
  - rag.15.56
  - rag.15.56
  text: And wherever he came to villages and towns and castles, he won them.
- lines:
  - rag.15.57
  - rag.15.57
  text: The king who ruled England then was called Ella.
- lines:
  - rag.15.58
  - rag.15.58
  text: He had had news of Ragnar when he left his land.
- lines:
  - rag.15.59
  - rag.15.59
  text: He had posted men so that he would know at once when the army came to land.
- lines:
  - rag.15.60
  - rag.15.60
  text: Now those men went to meet King Ella and told him the news of war.
- lines:
  - rag.15.61
  - rag.15.61
  text: Now he had word sent through all his kingdom and bade every man come to him who could wield a shield and
    ride a horse and dared to fight, and he gathered together so great an army that it was a wonder.
- lines:
  - rag.15.62
  - rag.15.62
  text: Now King Ella and his men made ready for battle.
- lines:
  - rag.15.63
  - rag.15.63
  text: 'Then King Ella said to his men: "If we win this battle and you become aware that Ragnar has come,'
- lines:
  - rag.15.64
  - rag.15.64
  text: then you shall not bear weapons against him, because he has sons living after him who will never leave us
    alone if he falls."
- lines:
  - rag.15.65
  - rag.15.65
  text: Ragnar now made ready for battle, and he had the garment that Randalin had given him at parting in place
    of a mail-coat, and in his hand the spear with which he killed the serpent that lay around Thora's hall, and
    which no one else dared (to do), and he had no protection except a helmet.
- lines:
  - rag.15.66
  - rag.15.66
  text: And when they met, battle began.
- lines:
  - rag.15.67
  - rag.15.67
  text: Ragnar had a much smaller force.
- lines:
  - rag.15.68
  - rag.15.68
  text: The battle had not gone on long before Ragnar's men fell in great numbers.
- lines:
  - rag.15.69
  - rag.15.69
  text: But wherever he went the ranks thinned before him, and that day he went through the battle lines, and wherever
    he hewed or thrust at shields,
- lines:
  - rag.15.70
  - rag.15.70
  text: mail-coats or helmets, his blows were so great that nothing at all withstood them, but never was a blow
    struck or a shot made at him
- lines:
  - rag.15.71
  - rag.15.71
  text: so that any weapon did him harm, and he never got a wound, and he killed a great number of King Ella's men.
- lines:
  - rag.15.72
  - rag.15.72
  text: But the battle ended so that all Ragnar's men fell, and shields were borne in on him, and so he was taken
    captive.
- lines:
  - rag.15.73
  - rag.15.73
  text: Now he was asked what man he was, but he kept silent and answered nothing.
- lines:
  - rag.15.74
  - rag.15.74
  text: 'Then King Ella said: "This man will have to come into a harder trial if he will not tell us who he is.'
- lines:
  - rag.15.75
  - rag.15.75
  text: Now he shall be thrown into a snake pit and left to sit there a very long time, and if he says anything
    from which we can understand that he is Ragnar, then he shall be taken out as quickly as possible."
- lines:
  - rag.15.76
  - rag.15.76
  text: Now he was taken there, and he sat there a very long time, so that the snakes did not fasten on him anywhere.
- lines:
  - rag.15.77
  - rag.15.77
  text: 'Then men said: "This man is mighty; weapons did not bite him today, and now snakes do not harm him."'
- lines:
  - rag.15.78
  - rag.15.78
  text: Then King Ella said that he should be stripped of the garment that he wore outermost, and so it was done,
    and snakes hung on him on all sides.
- lines:
  - rag.15.79
  - rag.15.79
  text: 'Then Ragnar said: "The piglets would grunt now if they knew what the old (boar) suffers."'
- lines:
  - rag.15.80
  - rag.15.80
  text: And though he said this, they still did not know for certain that it was Ragnar rather than some other king.
- lines:
  - rag.15.81
  - rag.15.81
  text: 'Now he spoke a verse:'
- lines:
  - rag.15.82
  - rag.15.89
  text: '"I have fought battles

    that were thought glorious,

    I did harm to many men,

    fifty and one (battles);

    I did not think that snakes

    would be the end of my life;

    it happens very often

    what one least expects oneself."'
- lines:
  - rag.15.90
  - rag.15.90
  text: 'And again he spoke:'
- lines:
  - rag.15.91
  - rag.15.98
  text: '"The piglets would grunt

    if they knew the boar''s plight;

    I have harm in plenty,

    the snakes dig in with their snouts

    and stab hard,

    they have sucked me;

    now I will soon be a corpse

    and die among beasts."'
- lines:
  - rag.15.99
  - rag.15.99
  text: Now he lost his life, and now he was carried away from there.
- lines:
  - rag.15.100
  - rag.15.100
  text: And King Ella thought he knew that Ragnar had lost his life.
- lines:
  - rag.15.101
  - rag.15.101
  text: Now he considered how he should find this out or deal with it, so that he might keep his kingdom, or learn
    how Ragnar's sons would take it when they heard.
- lines:
  - rag.15.102
  - rag.15.102
  text: He took this counsel, that he had a ship made ready and put in command of it a man who was both wise and
    hardy,
- lines:
  - rag.15.103
  - rag.15.103
  text: and he got men for it so that the ship was well manned, and said that he wanted to send them to meet Ivar
    and his brothers and tell them of their father's death.
- lines:
  - rag.15.104
  - rag.15.104
  text: But this journey seemed unpromising to most, so that few wanted to go.
- lines:
  - rag.15.105
  - rag.15.105
  text: 'Then the king said: "You shall watch carefully how each of the brothers takes this news.'
- lines:
  - rag.15.106
  - rag.15.106
  text: Then go on your way when you get a wind."
- lines:
  - rag.15.107
  - rag.15.107
  text: He had their journey so well fitted out that they needed nothing from anyone else.
- lines:
  - rag.15.108
  - rag.15.108
  text: And now they set off, and their voyage went well.
- lines:
  - rag.15.109
  - rag.15.109
  text: But Ragnar's sons had been raiding in the southern realms.
- lines:
  - rag.15.110
  - rag.15.110
  text: Then they turned toward the Northern lands and meant to visit their kingdom, the one that Ragnar ruled.
- lines:
  - rag.15.111
  - rag.15.111
  text: But they did not know how his expedition had turned out, and yet they were very curious about how it had
    turned out.
- lines:
  - rag.15.112
  - rag.15.112
  text: Now they traveled overland from the south.
- lines:
  - rag.15.113
  - rag.15.113
  text: But wherever men heard of the brothers' movements, men emptied their towns and carried their goods away
    and fled, so that they could hardly get food for their army.
- lines:
  - rag.15.114
  - rag.15.114
  text: 'One morning Bjorn Ironside woke and spoke a verse:'
- lines:
  - rag.15.115
  - rag.15.122
  text: '"Here every morning flies,

    eager, over these towns,

    the hawk of the slain [?] (the raven);

    he says he will well nigh die of hunger;

    let him go south over the sands,

    where we left wounds;

    there he gets dead men''s blood,

    dew from shield-blows [?]."'
- lines:
  - rag.15.123
  - rag.15.123
  text: 'And again he spoke:'
- lines:
  - rag.15.124
  - rag.15.131
  text: '"That was first, when we set out,

    I took to waging Frey''s game [battle],

    where we had hostile folk

    (against us) in the realm of Rome;

    there I let my sword, gray over the lip [?],

    the eagle screamed over the slain,

    be drawn

    at man-destroying slaughter."'
- lines:
  - rag.16.1
  - rag.16.1
  text: Now it so happened that they came into the realm of the Danes before King Ella's messengers, and they now
    stayed quietly with their army.
- lines:
  - rag.16.2
  - rag.16.2
  text: And the messengers came with their company to the town where Ragnar's sons were at a feast, and went into
    the hall where they were drinking, and before the high seat where Ivar lay.
- lines:
  - rag.16.3
  - rag.16.3
  text: Sigurd Snake-in-the-Eye and Hvitserk the Bold sat at hneftafl (a board game), and Bjorn Ironside was shaving
    a spear-shaft on the hall floor.
- lines:
  - rag.16.4
  - rag.16.4
  text: And when King Ella's messengers came before Ivar, they greeted him with respect.
- lines:
  - rag.16.5
  - rag.16.5
  text: And he accepted their greeting and asked where they were from and what news they brought.
- lines:
  - rag.16.6
  - rag.16.6
  text: And the one who led them said that they were Englishmen and that King Ella had sent them there with these
    tidings, to tell of the death of Ragnar, their father.
- lines:
  - rag.16.7
  - rag.16.7
  text: Hvitserk and Sigurd at once let the game drop and listened closely to the telling of this news.
- lines:
  - rag.16.8
  - rag.16.8
  text: Bjorn stood on the hall floor and leaned on his spear-shaft.
- lines:
  - rag.16.9
  - rag.16.9
  text: But Ivar asked them closely in what way his death had come about.
- lines:
  - rag.16.10
  - rag.16.10
  text: And they told everything as it had gone from when he came to England until he lost his life.
- lines:
  - rag.16.11
  - rag.16.11
  text: And now when the story had got to where he had said this, "The piglets would grunt," Bjorn's hands tightened
    on the spear-shaft, and he had gripped so hard that the marks of his hands could be seen on it afterwards.
- lines:
  - rag.16.12
  - rag.16.12
  text: When the messengers finished this account, Bjorn shook the spear apart so that it broke in two pieces.
- lines:
  - rag.16.13
  - rag.16.13
  text: And Hvitserk was holding a game piece that he had taken, and he squeezed it so hard that blood spurted out
    from under every nail.
- lines:
  - rag.16.14
  - rag.16.14
  text: And Sigurd Snake-in-the-Eye had been holding a knife and paring his nail when this news was told, and he
    listened so closely to the news that he did not notice until the knife stood in the bone, and he did not flinch.
- lines:
  - rag.16.15
  - rag.16.15
  text: But Ivar asked about everything most closely, and his color was at times red and at times blue, and at
    times he was pale, and he was so swollen that his skin was all puffed up from the fury that was in his breast.
- lines:
  - rag.16.16
  - rag.16.16
  text: Now Hvitserk spoke up and said that the revenge could be begun most quickly by killing King Ella's messengers.
- lines:
  - rag.16.17
  - rag.16.17
  text: 'Ivar said: "That shall not be.'
- lines:
  - rag.16.18
  - rag.16.18
  text: They shall go in peace wherever they want, and if there is anything they lack, they shall tell me, and I
    will get it for them."
- lines:
  - rag.16.19
  - rag.16.19
  text: And now when they had finished their errand, they turned out along the hall and (went) to their ship.
- lines:
  - rag.16.20
  - rag.16.20
  text: And when they got a fair wind, they put out to sea, and their voyage went well until they came to King Ella,
    and they told him how each of them had taken the telling of this news.
- lines:
  - rag.16.21
  - rag.16.21
  text: 'And when King Ella heard this, he said: "It is to be expected that either we will have to fear Ivar or
    no one else, from what you tell of him, and (the others) would be of good (heart) inside the ribs [?], and we
    will be able to hold our kingdom against them."'
- lines:
  - rag.16.22
  - rag.16.22
  text: Now he had watches kept over all his kingdom, so that no army could come on him unawares.
- lines:
  - rag.16.23
  - rag.16.23
  text: And when King Ella's messengers had gone away, the brothers went to a meeting (to decide) how they should
    go about revenge for Ragnar, their father.
- lines:
  - rag.16.24
  - rag.16.24
  text: 'Then Ivar said: "I will take no part in it and will not provide men, because Ragnar fared as I expected.'
- lines:
  - rag.16.25
  - rag.16.25
  text: He prepared his case badly from the start.
- lines:
  - rag.16.26
  - rag.16.26
  text: He had no quarrel with King Ella, and it has often happened that if a man sets out on an overweening venture
    in a wrongful cause, he has come down the more dishonorably for it.
- lines:
  - rag.16.27
  - rag.16.27
  text: And I will accept compensation from King Ella if he will pay it to me."
- lines:
  - rag.16.28
  - rag.16.28
  text: And when his brothers heard this, they became very angry and said that they would never become so base,
    though he wanted it so.
- lines:
  - rag.16.29
  - rag.16.29
  text: '"Many will say that our hands are laid wrongly in our laps if we do not avenge our father, when we have
    gone widely through the world harrying and have killed many an innocent man.'
- lines:
  - rag.16.30
  - rag.16.30
  text: And this shall not happen; rather, every ship in the realm of the Danes that is seaworthy shall be made
    ready.
- lines:
  - rag.16.31
  - rag.16.31
  text: Men shall be gathered so completely that every man who can bear a shield against King Ella shall go."
- lines:
  - rag.16.32
  - rag.16.32
  text: But Ivar said that he would stay behind, and the ships that he had command of, "except only the one that
    I own myself."
- lines:
  - rag.16.33
  - rag.16.33
  text: And when it was heard that Ivar took no part in it, they got a much smaller force, and went nonetheless.
- lines:
  - rag.16.34
  - rag.16.34
  text: And as soon as they came to England, King Ella became aware of it and at once had his trumpet sounded and
    summoned to him all the men who would follow him.
- lines:
  - rag.16.35
  - rag.16.35
  text: And now he got so large a force that no man could count it, and he went against the brothers.
- lines:
  - rag.16.36
  - rag.16.36
  text: And when they met, Ivar was not in that battle.
- lines:
  - rag.16.37
  - rag.16.37
  text: And their battle ended so that Ragnar's sons were put to flight, and King Ella had the victory.
- lines:
  - rag.16.38
  - rag.16.38
  text: And while he was pursuing the fleeing men, Ivar said that he did not mean to go back to his own land,
- lines:
  - rag.16.39
  - rag.16.39
  text: '"and I want to test whether King Ella will grant me some honor or none, and I think it better to accept
    amends from him than to suffer more defeats such as the one we have suffered now."'
- lines:
  - rag.16.40
  - rag.16.40
  text: Hvitserk said that he could not take part in it with him, and that he would have to do with his own affairs
    as he wished, "but we shall never take money for our father."
- lines:
  - rag.16.41
  - rag.16.41
  text: Ivar said that here their ways would part, and bade them rule the kingdom that they all owned together,
    "but you shall send me movable wealth, as I name it."
- lines:
  - rag.16.42
  - rag.16.42
  text: And when he had said this, he bade them farewell.
- lines:
  - rag.16.43
  - rag.16.43
  text: And he turned back on his way to meet King Ella.
- lines:
  - rag.16.44
  - rag.16.44
  text: 'And when he came before him, he greeted the king with respect and began his speech so: "I have come to
    meet you, and I want to speak for a settlement with you, and such honor as you are willing to grant me.'
- lines:
  - rag.16.45
  - rag.16.45
  text: And now I see this, that I am no match for you, and I think it better to accept from you such honor as
    you will give me than to lose more of my men to you, or myself."
- lines:
  - rag.16.46
  - rag.16.46
  text: 'Then King Ella answered: "Some men say that it is not easy to trust you, and that you often speak fair
    when you think false, and it will be hard for us to be on guard against you or your brothers."'
- lines:
  - rag.16.47
  - rag.16.47
  text: '"I will ask little of you, if you grant it.'
- lines:
  - rag.16.48
  - rag.16.48
  text: I will swear to you in return that I will never be against you."
- lines:
  - rag.16.49
  - rag.16.49
  text: Now the king asked what he was asking for as amends.
- lines:
  - rag.16.50
  - rag.16.50
  text: '"I want," said Ivar, "you to give me as much of your land as an ox-hide covers, and around it a foundation
    shall be laid,'
- lines:
  - rag.16.51
  - rag.16.51
  text: and I will not ask more of you, and I see that you will grant me no honor at all if you will not (grant)
    this."
- lines:
  - rag.16.52
  - rag.16.52
  text: '"I do not know," said the king, "that this could do us any harm, though you have this from my land, and
    I will certainly give it to you,'
- lines:
  - rag.16.53
  - rag.16.53
  text: if you will swear to me not to fight against me, and I do not fear your brothers if you are true to me."
- lines:
  - rag.17.1
  - rag.17.1
  text: Now they agreed between them that Ivar swore him oaths that he would not shoot against him and not plot
    to harm him, and he was to own as much of England as an ox-hide covered, the largest he could get.
- lines:
  - rag.17.2
  - rag.17.2
  text: Now Ivar got himself the hide of an old bull, and now he had it soaked, and three times he had it stretched.
- lines:
  - rag.17.3
  - rag.17.3
  text: Now he had it cut all through into strips as narrow as possible, and then he had it split, each (layer)
    by itself, the hair side and the flesh side [?].
- lines:
  - rag.17.4
  - rag.17.4
  text: And when this was done, the thong was so long that it was a wonder, and it came into no one's mind that
    it could be so.
- lines:
  - rag.17.5
  - rag.17.5
  text: And then he had it spread out on a field, and the land was so wide that it was the size of a great town,
    and outside it he had a foundation marked out as for great town walls.
- lines:
  - rag.17.6
  - rag.17.6
  text: And then he got himself many craftsmen and had many houses raised on that field, and there he had a great
    town built, and it is called Lundunaborg (London).
- lines:
  - rag.17.7
  - rag.17.7
  text: It is the greatest and most famous of all towns in all the Northern lands.
- lines:
  - rag.17.8
  - rag.17.8
  text: And now, when he had had this town built, he had spent his movable wealth.
- lines:
  - rag.17.9
  - rag.17.9
  text: But he was so generous that he gave with both hands, and his wisdom was thought so great that all sought
    him out with their plans and difficult cases.
- lines:
  - rag.17.10
  - rag.17.10
  text: And he settled all cases so that each man thought it suited him best, and he became so well liked that he
    had a friend in every man,
- lines:
  - rag.17.11
  - rag.17.11
  text: and he was a great help to King Ella in governing the land, so that the king had him settle many plans and
    cases and did not need to attend to them himself.
- lines:
  - rag.17.12
  - rag.17.12
  text: And when Ivar had brought his affairs so far that he was looked to for all wisdom, he sent men to his brothers
    with this errand, that they should send him gold and silver as much as he named.
- lines:
  - rag.17.13
  - rag.17.13
  text: And when these men came to the brothers, they told their errand and also how his affairs then stood, because
    men did not think they knew what stratagems he was devising.
- lines:
  - rag.17.14
  - rag.17.14
  text: And the brothers understood from this that his temper was not as it usually was.
- lines:
  - rag.17.15
  - rag.17.15
  text: Now they sent such wealth as he had named.
- lines:
  - rag.17.16
  - rag.17.16
  text: And when they came to Ivar, he gave all that wealth to the greatest men in the land, and so drew support
    away from King Ella, and they all promised that they would sit still even if he made war there.
- lines:
  - rag.17.17
  - rag.17.17
  text: And when Ivar had drawn support to himself in this way, he sent men to his brothers to tell them that he
    wanted them to call out a levy over all the lands their rule covered, and to summon every man they could get.
- lines:
  - rag.17.18
  - rag.17.18
  text: And when this message came to the brothers, they quickly grasped it and understood that he must now think
    it very promising that they would now win the victory.
- lines:
  - rag.17.19
  - rag.17.19
  text: Now they gathered men throughout all Denmark and Gautland and all the kingdoms they had power over, and
    drew together an overwhelming army and had a general levy out.
- lines:
  - rag.17.20
  - rag.17.20
  text: Then they steered their ships to England both night and day and wanted as little as possible for news to
    go ahead of them.
- lines:
  - rag.17.21
  - rag.17.21
  text: Now this news of war was told to King Ella.
- lines:
  - rag.17.22
  - rag.17.22
  text: Now he gathered men and got few, because Ivar had drawn many men away from him.
- lines:
  - rag.17.23
  - rag.17.23
  text: Now Ivar went to King Ella and said that he would keep what he had sworn.
- lines:
  - rag.17.24
  - rag.17.24
  text: '"But I cannot govern my brothers'' undertaking, though I can do this much, go to meet them and find out
    whether they will halt their army and do no more harm than they have already done."'
- lines:
  - rag.17.25
  - rag.17.25
  text: Now Ivar went to his brothers and urged them hard to advance as boldly as they could and to bring on battle
    as quickly as possible, "because the king has a much smaller army."
- lines:
  - rag.17.26
  - rag.17.26
  text: But they answered that he would not need to urge them, and that their minds were the same as before.
- lines:
  - rag.17.27
  - rag.17.27
  text: Now Ivar went and met King Ella and told him that they were much fiercer and more furious than (that) they
    would listen to his words.
- lines:
  - rag.17.28
  - rag.17.28
  text: '"And when I wanted to seek a truce between you, they shouted against it.'
- lines:
  - rag.17.29
  - rag.17.29
  text: Now I will keep my oaths, that I will not fight against you, and I and my men will stay quietly nearby,
    and the battle will go between you as it may."
- lines:
  - rag.17.30
  - rag.17.30
  text: Now King Ella and his men saw the brothers' army, and it came on so furiously that it was a wonder.
- lines:
  - rag.17.31
  - rag.17.31
  text: 'Then Ivar said: "Now, King Ella, the thing to do is to draw up your army, and I expect that they will make
    a hard attack on you for some while."'
- lines:
  - rag.17.32
  - rag.17.32
  text: And as soon as their armies met, there was a great battle, and Ragnar's sons pressed hard forward through
    King Ella's battle lines, and they were so fierce that they thought of one thing only, to do as much as they
    could, and that fight was both long and hard.
- lines:
  - rag.17.33
  - rag.17.33
  text: And it ended here so that King Ella and his army were put to flight, and he was taken captive.
- lines:
  - rag.17.34
  - rag.17.34
  text: 'And then Ivar was near at hand and said that his death should be dealt with in this way: "Now the counsel
    is," he said, "to remember what death he chose for our father.'
- lines:
  - rag.17.35
  - rag.17.35
  text: Now the man who is most skilled with a blade's point shall cut an eagle on his back as deep as he can, and
    that eagle shall be reddened with his blood."
- lines:
  - rag.17.36
  - rag.17.36
  text: And the man who was called to this task did as Ivar bade him, and King Ella was badly wounded before this
    task was finished.
- lines:
  - rag.17.37
  - rag.17.37
  text: Now he lost his life, and they thought they had now avenged their father, Ragnar.
- lines:
  - rag.17.38
  - rag.17.38
  text: Ivar said that he wanted to give them the kingdom that they all owned together, but he said he wanted to
    rule England.
- lines:
  - rag.18.1
  - rag.18.1
  text: After this Hvitserk and Bjorn went home to their kingdom, and Sigurd, but Ivar stayed behind and ruled England.
- lines:
  - rag.18.2
  - rag.18.2
  text: From then on they kept their forces together less, and raided in various lands.
- lines:
  - rag.18.3
  - rag.18.3
  text: And Randalin, their mother, became an old woman.
- lines:
  - rag.18.4
  - rag.18.4
  text: And Hvitserk, her son, had once been raiding in the East Way, and so overwhelming a force came against him
    that he could not raise a shield-rim against it, and he was taken captive.
- lines:
  - rag.18.5
  - rag.18.5
  text: And he chose for himself this manner of death, that a pyre should be made of men's heads; there he should
    burn, and so he lost his life.
- lines:
  - rag.18.6
  - rag.18.6
  text: 'And when Randalin heard this, she spoke a verse:'
- lines:
  - rag.18.7
  - rag.18.14
  text: '"One son that I had

    met his death in the East Way;

    Hvitserk he was called,

    never eager to flee;

    he was heated by heads

    of slain cut down in battle;

    the prince, strong in courage,

    chose that death before he fell."'
- lines:
  - rag.18.15
  - rag.18.15
  text: 'And again she spoke:'
- lines:
  - rag.18.16
  - rag.18.23
  text: '"They thrust heads,

    very many, under the prince;

    over the doomed tree of hosts [the warrior]

    they let the eager [?] fire sing;

    what better bed could

    the battle-tree [the warrior] lay under himself;

    the king chose (his own) fall [?],

    the sovereign dies with renown."'
- lines:
  - rag.18.24
  - rag.18.24
  text: And from Sigurd Snake-in-the-Eye a great line has come.
- lines:
  - rag.18.25
  - rag.18.25
  text: His daughter was called Ragnhild, the mother of Harald Fairhair, who was the first to rule all Norway alone.
- lines:
  - rag.18.26
  - rag.18.26
  text: And Ivar ruled England until his dying day and died of sickness.
- lines:
  - rag.18.27
  - rag.18.27
  text: And when he lay in his last sickness, he said that he should be carried to where (the land) was open to
    raiding, and he said he expected that those who came to land there would not win victory.
- lines:
  - rag.18.28
  - rag.18.28
  text: And when he died, it was done as he had directed, and he was laid in a mound.
- lines:
  - rag.18.29
  - rag.18.29
  text: And many men say that when King Harald Sigurdarson came to England, he came ashore where Ivar was (buried),
    and he fell on that expedition.
- lines:
  - rag.18.30
  - rag.18.30
  text: And when William the Bastard came to the land, he went and broke open Ivar's mound and saw Ivar undecayed.
- lines:
  - rag.18.31
  - rag.18.31
  text: Then he had a great pyre made and had Ivar burned on the pyre, and after that he fought for the land and
    won the victory.
- lines:
  - rag.18.32
  - rag.18.32
  text: And from Bjorn Ironside many people have come.
- lines:
  - rag.18.33
  - rag.18.33
  text: 'From him a great family has come: Thord, who lived at Hofdi on Hofdastrond, a great chieftain.'
- lines:
  - rag.18.34
  - rag.18.34
  text: And when Ragnar's sons were all dead, the men who had followed them scattered in various directions, and
    all who had been with Ragnar's sons thought nothing of other chieftains.
- lines:
  - rag.18.35
  - rag.18.35
  text: There were two men who traveled widely through the lands to find out whether they could find any chieftain
    whom they would think it no disgrace to serve, and they did not travel together.
- lines:
  - rag.19.1
  - rag.19.1
  text: It happened in foreign lands that a king had two sons, and he took sick and died, and his sons wanted to
    hold the funeral ale after him.
- lines:
  - rag.19.2
  - rag.19.2
  text: They invited men to this feast in such a way that all men should come there who heard of it within the next
    three winters.
- lines:
  - rag.19.3
  - rag.19.3
  text: Now this was heard widely through the lands.
- lines:
  - rag.19.4
  - rag.19.4
  text: And during these three winters they prepared for this feast.
- lines:
  - rag.19.5
  - rag.19.5
  text: And when the summer came in which the funeral ale was to be drunk, and the time that had been fixed, so
    great a crowd came that no one knew the like of how great it was, and many large halls were filled and many
    tents (pitched) outside.
- lines:
  - rag.19.6
  - rag.19.6
  text: And when the first evening was well on, a man came to this hall.
- lines:
  - rag.19.7
  - rag.19.7
  text: This man was big, so that no one there was as big, and it could be seen from his gear that he had been among
    men of rank.
- lines:
  - rag.19.8
  - rag.19.8
  text: And when he came into the hall, he went before the brothers and greeted them and asked where they would
    show him to a seat.
- lines:
  - rag.19.9
  - rag.19.9
  text: They liked the look of him and bade him sit on the upper bench.
- lines:
  - rag.19.10
  - rag.19.10
  text: He needed the room of two men.
- lines:
  - rag.19.11
  - rag.19.11
  text: And as soon as he had sat down, drink was brought to him as to other men, and no horn was so big that he
    did not drain it in one swallow, and everyone thought they could see that he thought nothing of all the others.
- lines:
  - rag.19.12
  - rag.19.12
  text: It happened further that another man came to this feast.
- lines:
  - rag.19.13
  - rag.19.13
  text: He was rather bigger than the first.
- lines:
  - rag.19.14
  - rag.19.14
  text: These men had long hoods.
- lines:
  - rag.19.15
  - rag.19.15
  text: And when this man came before the high seat of the young kings, he greeted them courteously and asked them
    to show him to a seat.
- lines:
  - rag.19.16
  - rag.19.16
  text: They said that this man should sit farther in on the upper bench.
- lines:
  - rag.19.17
  - rag.19.17
  text: Now he went to his seat, and the two of them together took up so much room that five men had to get up for
    them.
- lines:
  - rag.19.18
  - rag.19.18
  text: But the one who came first was yet the lesser drinker.
- lines:
  - rag.19.19
  - rag.19.19
  text: And the later one drank so fast that he all but poured each horn into himself, and yet men did not find
    that he got drunk, and he behaved rather surlily toward his bench-mates and turned his back on them.
- lines:
  - rag.19.20
  - rag.19.20
  text: The one who came first proposed that they should have some sport together, "and I will (begin) first."
- lines:
  - rag.19.21
  - rag.19.21
  text: 'He pushed at him with his hand and spoke a verse:'
- lines:
  - rag.19.22
  - rag.19.29
  text: '"Tell of your manly deeds,

    I have resolved to ask you:

    where did you see a raven

    sway on a branch, full of blood?

    More often you were found

    at another''s (feast), in the high seat,

    than (that) you dragged bloody corpses

    in a valley before the birds of the slain."'
- lines:
  - rag.19.30
  - rag.19.30
  text: 'Now the one who sat farther out felt himself challenged by such a verse, and spoke a verse in return:'
- lines:
  - rag.19.31
  - rag.19.38
  text: '"Be silent, you who are called a stay-at-home;

    what ails you, so wretched in bearing;

    you have never done (a deed)

    at which I must fall short;

    you did not fatten the bitch that hunts the sun [the wolf]

    at the sword''s play [battle],

    you gave no drink to the troll-woman''s horse [the wolf];

    what do you care."'
- lines:
  - rag.19.39
  - rag.19.39
  text: 'Now the one who came first answered:'
- lines:
  - rag.19.40
  - rag.19.47
  text: '"We let the horses of the sea [ships]

    run their stiff bows on the surf,

    while blood drove

    over bright mail-coats down the sides;

    the she-wolf gaped, the eagle''s

    hunger was spent, over men''s necks;

    we won the bright hard-meal of Hvedna [gold] [?];

    (the necks were) reddened with blood."'
- lines:
  - rag.19.48
  - rag.19.48
  text: 'And now the one who came later spoke:'
- lines:
  - rag.19.49
  - rag.19.56
  text: '"I saw none of yours

    where we found the field of Heiti [the sea]

    opened up [?] before the white horse

    of the gulls'' current [the ship];

    and ... [unintelligible] ...

    we stayed content off the land,

    ... [unintelligible] ...

    before the red prow."'
- lines:
  - rag.19.57
  - rag.19.57
  text: 'And again the one who came first spoke:'
- lines:
  - rag.19.58
  - rag.19.65
  text: '"It does not befit us two at the ale

    to quarrel in the high seat

    over which of us two has done

    more than the other;

    you stood where the wave bore

    the hart of the prow-boards [the ship] to the sound,

    and I sat where the sail-yard drove

    the red prow to harbor."'
- lines:
  - rag.19.66
  - rag.19.66
  text: 'Now the one who came later answered:'
- lines:
  - rag.19.67
  - rag.19.74
  text: '"We both followed Bjorn

    in every din of swords,

    the warriors were tested,

    and Ragnar at times;

    I was where men fought

    in Bulgaria;

    from that I bore a wound in my side;

    sit farther in, neighbor."'
- lines:
  - rag.19.75
  - rag.19.75
  text: And then at last they recognized each other, and stayed there at the feast afterwards.
- lines:
  - rag.20.1
  - rag.20.1
  text: There was a man named Ogmund, who was called Ogmund the Dane.
- lines:
  - rag.20.2
  - rag.20.2
  text: He once went with five ships and lay off Samsey in Munarvag.
- lines:
  - rag.20.3
  - rag.20.3
  text: Then it is said that the cooks went ashore to make food, and other men went into the wood to amuse themselves,
- lines:
  - rag.20.4
  - rag.20.4
  text: and there they found an ancient wooden man, and he was forty (feet) high and overgrown with moss, and yet
    all his features could be seen,
- lines:
  - rag.20.5
  - rag.20.5
  text: and now they talked among themselves about who would have made sacrifice to this great god.
- lines:
  - rag.20.6
  - rag.20.6
  text: 'And then the wooden man spoke:'
- lines:
  - rag.20.7
  - rag.20.14
  text: '"It was long ago

    that on their way the sons

    of Haekling [sea-warriors] went

    with roller-ships

    forth over the salt

    path of trout [the sea];

    then I became

    ruler of this place."'
- lines:
  - rag.20.15
  - rag.20.22
  text: '"And so they set me up,

    the sward-[?] men,

    south by the salt,

    the sons of Lothbrok;

    then I was worshipped with sacrifice

    for the death of men

    on Samsey,

    on the south side."'
- lines:
  - rag.20.23
  - rag.20.30
  text: '"There they bade (me) stand

    while the shore endures,

    a man by the thorn,

    and overgrown with moss;

    now the weeping of the clouds [rain]

    pours on me,

    and neither flesh nor clothing

    shelters me."'
- lines:
  - rag.20.31
  - rag.20.31
  text: And men thought this strange, and afterwards they told other men of it.
