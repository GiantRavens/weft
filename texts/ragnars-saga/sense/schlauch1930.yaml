# Margaret Schlauch, The Saga of Ragnar Lodbrok, in The Saga of the Volsungs; The Saga of Ragnar Lodbrok together with the
# Lay of Kraka (New York: The American-Scandinavian Foundation, 1930), pp. 185-256: her English translation, verbatim from the
# archive.org OCR (sagaofvolsungssa0000unse, Trent University copy). Public domain in the United States only (see manifest).
# Schlauch's twenty chapters are this edition's twenty; her chapter 6 begins earlier, at rag.5.51 ("When Kraka was ready"),
# and the spans run across the boundary. Prose is aligned line by line where her sentences can be cut at a sentence or clause
# boundary, otherwise over the smallest group of lines; verse one span per stanza, her line breaks kept. She renders each
# stanza in four rhymed lines (a few in two or five), so a span of eight Old Norse lines carries four English ones.
# Dropped: running heads, page numbers, the chapter headings. Words broken at the line end are rejoined (Lod-brok, me-thinks,
# Rag-nar ...); well-manned and foundation-wall keep their hyphen, as in the print.
# Corrections to the OCR (the ones marked * checked against the page images, PDF pages 189-260):
#   the opening word of each chapter, printed as a capital drop initial, given as an ordinary word (HEIMIR -> Heimir,
#     O GMUND -> Ogmund), 20;
#   the space after an opening quotation mark or parenthesis closed ('“ What' -> '“What', '( There' -> '(There'), 8;
#   the print's space before ; : ? ! closed ('verse :' -> 'verse:', 'child ?' -> 'child?'), 83; the dash closed up, as in
#     the print ('cloth —' -> 'cloth—'), 7; one straight apostrophe made typographic ('men's' -> 'men’s', rag.18.16);
#   misreads: 'about'' -> 'about' (3); 'NoW' -> 'Now' (6); 'Gnipe fjord' -> 'Gnipefjord'* (8); 'thp' -> 'the', 'teilest' -> 'tellest' (9); 'ihany' -> 'many', 'III he' -> 'Ill he',
#     'Thora’ s' -> 'Thora’s', 'Though n man' -> 'Though a man'*, '{If' -> '(If'*, 'of er' -> 'offer'* (10); stray '*..'
#     removed (11); 'arfd' -> 'and' (13); 'W oven' -> 'Woven'*, 'red, gold' -> 'red gold'* and a stray 'v' removed
#     (rag.15.20), 'deadA' -> 'dead.”'* (15); 'Elia' -> 'Ella', 'him *' ->
#     'him:'* (16); 'had-it' -> 'had it', 'fair- fulfill' -> 'fain fulfill'* (17); 'men,'' -> 'men;'*, 'Hof-dastrand' ->
#     'Hofdastrand'* (18); 'the. throne' -> 'the throne', 'wolfs' -> 'wolf’s'*, '<fUnfitting' -> '“Unfitting'* (19); 'Ale upon' -> 'Me upon'* (20);
#   punctuation the OCR lost at the end of an italic stanza or speech, restored from the print*: 'state.' -> 'state.”'
#     (rag.5.21), 'stead”' -> 'stead.”' (rag.10.118), 'them”' -> 'them.”' (rag.15.44), 'rain-blast' -> 'rain-blast.”'
#     (rag.20.23).
# As printed, not corrected: the stanzas at rag.6.16, rag.10.102 and rag.10.170 have no closing quotation mark (the speech
# runs on into the prose), and 'karl man' at rag.6.25.
translation: schlauch1930
aligned_by: hand, phase 0; prose line by line where the English allows, verse one span per stanza (2026-10-22)
spans:
- lines:
  - rag.1.1
  - rag.1.1
  text: Heimir heard the tidings of the death of Sigurd and Brynhild in Hlymdale;
- lines:
  - rag.1.2
  - rag.1.2
  text: and their daughter Aslaug whom Heimir was fostering was then three winters old.
- lines:
  - rag.1.3
  - rag.1.3
  text: He knew that the foes of the maid would strive to destroy her and her race.
- lines:
  - rag.1.4
  - rag.1.4
  text: So great was his grief for Brynhild, his foster-child, that he gave no heed to his riches or his rule. He saw that he could not conceal the maid in that place;
- lines:
  - rag.1.5
  - rag.1.5
  text: therefore he made a harp so great that he could put Aslaug into it, together with gold and silver and many jewels, and with it he departed
    and journeyed far and wide, and finally he came hither to the Northlands.
- lines:
  - rag.1.6
  - rag.1.7
  text: So skilfully was his harp made that he could take it apart and put it together at the joints. It was his custom, on such days as he fared along by waterways and was far from men’s dwellings, to
    take the harp asunder and wash the maid;
- lines:
  - rag.1.8
  - rag.1.8
  text: and he had a leek that he gave her to eat of;
- lines:
  - rag.1.9
  - rag.1.9
  text: for it is the nature of that herb that a man may live long upon it, though he have no other food.
- lines:
  - rag.1.10
  - rag.1.10
  text: And when she wept he struck his harp, and straightway she was silent again, for Heimir was very skilled in the arts that were known in those times.
- lines:
  - rag.1.11
  - rag.1.11
  text: He also had much precious raiment and gold in the harp together with her.
- lines:
  - rag.1.12
  - rag.1.12
  text: So he journeyed on until he reached Norway and came to a little dwelling called Spangarheath. Here dwelt a karl named Aki;
- lines:
  - rag.1.13
  - rag.1.13
  text: he had a wife named Grima.
- lines:
  - rag.1.14
  - rag.1.14
  text: These two lived there alone.
- lines:
  - rag.1.15
  - rag.1.15
  text: On that day the man had gone out into the forest, but the woman was at home, and she hailed Heimir and asked him who he was.
- lines:
  - rag.1.16
  - rag.1.16
  text: He said he was a poor beggar, and asked her for shelter.
- lines:
  - rag.1.17
  - rag.1.17
  text: She said there were not so many coming by that way that she could not take him in, if he was in need of harborage.
- lines:
  - rag.1.18
  - rag.1.18
  text: When it grew late Heimir said it would be a most welcome comfort to him if he might have some fire first, and later be led to the place where he was to sleep.
- lines:
  - rag.1.19
  - rag.1.20
  text: When the woman had kindled the fire he set the harp up beside him on the seat. She was very talkative, and she glanced often at the harp, for she saw fringes of costly raiment hanging out from it;
- lines:
  - rag.1.21
  - rag.1.21
  text: and while he was warming himself by the fire she saw a rich gold circlet beneath his tatters, for the clothes he wore were very poor.
- lines:
  - rag.1.22
  - rag.1.22
  text: When he had warmed himself as much as seemed needful to him, he ate his evening meal,
- lines:
  - rag.1.23
  - rag.1.23
  text: and thereafter she bade him follow her to the place where he was to sleep that night.
- lines:
  - rag.1.24
  - rag.1.24
  text: She said it would be better for him to rest outside than within, “for my husband and I often talk much when he comes home.”
- lines:
  - rag.1.25
  - rag.1.26
  text: Heimir told her to do as she thought best. The two of them now went out together; and Heimir took the harp along with him.
- lines:
  - rag.1.27
  - rag.1.27
  text: The woman led him to a barley-shed, and told him to tarry therein, for she said she expected him to enjoy sound sleep there.
- lines:
  - rag.1.28
  - rag.1.28
  text: After that she went away and busied herself with things that were to be done, and he laid himself down to sleep.
- lines:
  - rag.1.29
  - rag.1.29
  text: When the evening had grown late, Aki came home; Grima had done but little of her work, and he was tired when he came in, and likewise in bad temper because of all she had left undone in the house.
- lines:
  - rag.1.30
  - rag.1.30
  text: He said that good luck was unevenly divided between them, since he had to work each day beyond his might, while she would not do aught that was useful.
- lines:
  - rag.1.31
  - rag.1.31
  text: “Be not angry, husband,” said she, “for it may be that in a short time thou wilt gain the wherewithal to make us happy our life long.”
- lines:
  - rag.1.32
  - rag.1.32
  text: “What is that?” asked he.
- lines:
  - rag.1.33
  - rag.1.33
  text: She answered, “A man has come here to seek shelter, and I think he has great riches with him.
- lines:
  - rag.1.34
  - rag.1.34
  text: He is now advanced in years and very tired, but he must have been in his day a mighty champion; I have never seen his like,
- lines:
  - rag.1.35
  - rag.1.35
  text: though he appears now to be weary and heavy with sleep.”
- lines:
  - rag.1.36
  - rag.1.36
  text: The man said, “It seems unwise to me to betray the few folk who come our way.”
- lines:
  - rag.1.37
  - rag.1.37
  text: 'She answered, “Thou must long remain a man of small account, since everything of the sort seems so weighty in thine eyes; but now thou must choose the one thing or the other: either thou slayest
    him, or I take him as husband, and then we two shall drive thee away.'
- lines:
  - rag.1.38
  - rag.1.38
  text: 'And I can tell thee the speech he made me this evening, though that will seem to thee a matter of little moment:'
- lines:
  - rag.1.39
  - rag.1.39
  text: he spoke lovingly to me, and it is my intent to take him as husband and kill thee or drive thee away if thou wilt not do as I will.”
- lines:
  - rag.1.40
  - rag.1.40
  text: Now it is said that the man was entirely subject to his wife’s dominion, and she pressed him so hard that he yielded to her urging. He took his axe and whetted it well,
- lines:
  - rag.1.41
  - rag.1.41
  text: and when he was ready he followed her to the place where Heimir was sleeping, whence was heard great snoring.
- lines:
  - rag.1.42
  - rag.1.42
  text: The woman said to her husband that he should make a bold assault, “and then flee away quickly, for thou canst not endure what he may do or cry out if he may contrive to put hands on thee.”
- lines:
  - rag.1.43
  - rag.1.43
  text: She took the harp and hurried away with it.
- lines:
  - rag.1.44
  - rag.1.44
  text: The karl went in where Heimir was sleeping.
- lines:
  - rag.1.45
  - rag.1.45
  text: He struck at him and gave him a deep wound, and the axe was loosened from his grasp.
- lines:
  - rag.1.46
  - rag.1.46
  text: Then he ran away as fast as he might.
- lines:
  - rag.1.47
  - rag.1.47
  text: Heimir awoke with the hurt, which was his death-blow,
- lines:
  - rag.1.48
  - rag.1.48
  text: and it is said that his agony caused such a din that the posts of the house were riven asunder, and it crashed down from above, and there was a mighty earthquake; and that was the end of his life.
- lines:
  - rag.1.49
  - rag.1.50
  text: The man now went to his wife and told her that he had slain him, “and yet for a time I did not know how it would end; he was a wondrous strong man, but I think that he is now in Hel.”
- lines:
  - rag.1.51
  - rag.1.51
  text: “Have thanks for the deed,” said she. “I suspect that we have got us an abundance of treasure, and we shall now see if I have not spoken the truth.”
- lines:
  - rag.1.52
  - rag.1.52
  text: They brought up the fire then, and the woman took the harp and tried to open it, but she must needs break it apart, for she had not sufficient skill.
- lines:
  - rag.1.53
  - rag.1.53
  text: Thus she opened it up, and within she saw a girl-child unlike any she had ever seen before, and there was likewise great treasure in the harp.
- lines:
  - rag.1.54
  - rag.1.54
  text: The karl said, “It will go with us as with many folk, for it is an ill thing to deceive the man who trusts you.
- lines:
  - rag.1.55
  - rag.1.55
  text: It appears that a helpless child has fallen into our hands.”
- lines:
  - rag.1.56
  - rag.1.56
  text: She answered, “This has not turned out as I supposed, but we shall not blame each other for that.”
- lines:
  - rag.1.57
  - rag.1.57
  text: They asked the child of what race she was sprung,
- lines:
  - rag.1.58
  - rag.1.58
  text: but she answered never a word, as if she had not learned to speak.
- lines:
  - rag.1.59
  - rag.1.59
  text: “It is as I warned thee,” said the karl, “our deed has turned out ill.
- lines:
  - rag.1.60
  - rag.1.60
  text: We have done a great wrong.
- lines:
  - rag.1.61
  - rag.1.61
  text: How shall we name this child?”
- lines:
  - rag.1.62
  - rag.1.62
  text: “That is easily decided,” said she.
- lines:
  - rag.1.63
  - rag.1.63
  text: “She shall be called Kraka after my mother.”
- lines:
  - rag.1.64
  - rag.1.64
  text: The karl said, “How shall we provide for her?”
- lines:
  - rag.1.65
  - rag.1.65
  text: 'She answered, “I know what is best to do: we shall say she is our daughter, and so rear her here with us.”'
- lines:
  - rag.1.66
  - rag.1.66
  text: “That will not be believed,” said he.
- lines:
  - rag.1.67
  - rag.1.67
  text: “The child is far better-favored than we;
- lines:
  - rag.1.68
  - rag.1.68
  text: we two are lacking in fairness, and it will not seem likely that we could have had such a child, wondrously ugly as we are.”
- lines:
  - rag.1.69
  - rag.1.69
  text: 'She said, “Thou dost not know: perhaps I have a cunning device by which that may appear not unlikely.'
- lines:
  - rag.1.70
  - rag.1.70
  text: I shall shave off her hair and then rub on tar and other things that will keep it from growing again;
- lines:
  - rag.1.71
  - rag.1.71
  text: she shall wear a long hood,
- lines:
  - rag.1.72
  - rag.1.72
  text: but no fair clothes;
- lines:
  - rag.1.73
  - rag.1.73
  text: and thus she will be made to look like us.
- lines:
  - rag.1.74
  - rag.1.74
  text: It may also be that men will suppose I was very fair when I was young.
- lines:
  - rag.1.75
  - rag.1.75
  text: She shall have the hardest work to do.”
- lines:
  - rag.1.76
  - rag.1.76
  text: The man and his wife thought she could not talk because she never answered them.
- lines:
  - rag.1.77
  - rag.1.77
  text: Now everything was done as the woman had planned,
- lines:
  - rag.1.78
  - rag.1.78
  text: and the child grew up there in great poverty.
- lines:
  - rag.2.1
  - rag.2.1
  text: Herraud was the name of a rich and mighty jarl in Gautland;
- lines:
  - rag.2.2
  - rag.2.3
  text: he was married and had a daughter named Thora. She was fairest of women, and most courteous in all accomplishments that it is better to have than to lack.
- lines:
  - rag.2.4
  - rag.2.4
  text: She was called by the surname Borghart, because she surpassed all other women in beauty as the hart does other beasts.
- lines:
  - rag.2.5
  - rag.2.5
  text: The Jarl loved his daughter dearly;
- lines:
  - rag.2.6
  - rag.2.6
  text: he had a bower built for her not far from the royal hall, with a fence of wooden stakes about it.
- lines:
  - rag.2.7
  - rag.2.7
  text: He made it his custom to send something to his daughter for her entertainment every day, and he said that he would maintain this custom of his always.
- lines:
  - rag.2.8
  - rag.2.8
  text: It is told that one day he sent her a little snake, very fair to behold, and the worm seemed very comely to her; she put it in her chest and gave it gold to lie on.
- lines:
  - rag.2.9
  - rag.2.9
  text: Soon after the snake was put there it began to wax great, and the gold under it likewise increased.
- lines:
  - rag.2.10
  - rag.2.10
  text: So it came about that the creature no longer had room within the chest, but lay encircling it without.
- lines:
  - rag.2.11
  - rag.2.11
  text: And after that there was not room enough in the bower,
- lines:
  - rag.2.12
  - rag.2.12
  text: but it lay about the house outside, so that its head and tail touched; at the same time it grew very ugly to deal with and none dared to enter the house for fear of the snake, save only the man
    who brought it food; and by now it took an ox for each meal.
- lines:
  - rag.2.13
  - rag.2.13
  text: The Jarl suffered great injury from this, and he swore an oath that he would give his daughter to any man who would kill the snake, whosoever he were, “and he shall also have the gold that is beneath
    it as her dowry.”
- lines:
  - rag.2.14
  - rag.2.14
  text: These tidings were told far and near, but no one dared to master the great dragon.
- lines:
  - rag.3.1
  - rag.3.1
  text: In that time Sigurd Hring ruled over Denmark;
- lines:
  - rag.3.2
  - rag.3.2
  text: he was a mighty king and far-famed because of the battle he fought with Harald Hilditann at Bravell, for Harald fell before him, as is known in the whole northern part of the world.
- lines:
  - rag.3.3
  - rag.3.3
  text: Sigurd had a son named Ragnar,
- lines:
  - rag.3.4
  - rag.3.4
  text: who was a large man, fair of countenance and keen in wit, great-hearted towards his men but grim to his foes.
- lines:
  - rag.3.5
  - rag.3.5
  text: When he was old enough, he gathered troops and ships of war and became so great a warrior that his like was hard to find.
- lines:
  - rag.3.6
  - rag.3.6
  text: He heard what Jarl Herraud had promised, but he gave it no attention and acted as if he did not know of it.
- lines:
  - rag.3.7
  - rag.3.7
  text: He had clothes made for himself of a wondrous sort; they were shaggy breeches and a shaggy fur cape, and when they were ready he had them boiled in pitch.
- lines:
  - rag.3.8
  - rag.3.8
  text: After that he put them aside and kept them.
- lines:
  - rag.3.9
  - rag.3.9
  text: One summer he led his men to Gautland, and they lay in a hidden creek not far from the abode of the Jarl.
- lines:
  - rag.3.10
  - rag.3.12
  text: When Ragnar had been there one night he awoke early the next morning, arose, and put on the raiment that has been told of before; he took his spear in his hand, left the ship alone, and went out
    where there was sand. Here he rolled about in the sand.
- lines:
  - rag.3.13
  - rag.3.13
  text: Before he went away he took the nail from the shaft of his spear; then he fared away from the ships until he reached the gate of the Jarl’s dwelling early in the day, while all men were still sleeping.
- lines:
  - rag.3.14
  - rag.3.14
  text: He walked to the bower,
- lines:
  - rag.3.15
  - rag.3.15
  text: and when he entered within the wooden fence where the dragon was, he struck at it with his spear, but straightway pulled his weapon back again.
- lines:
  - rag.3.16
  - rag.3.16
  text: Again he struck;
- lines:
  - rag.3.17
  - rag.3.17
  text: at this thrust the spear hit the dragon’s back. The snake twisted about so quickly that the point was loosened from the shaft, and so great was the din of the monster’s death-agony that the whole
    bower shook.
- lines:
  - rag.3.18
  - rag.3.18
  text: Then Ragnar turned to depart.
- lines:
  - rag.3.19
  - rag.3.19
  text: A jet of the dragon’s blood struck him between the shoulders, but it did him no scathe, so well did the clothes protect him that he had made beforehand.
- lines:
  - rag.3.20
  - rag.3.20
  text: The folk who were in the bower were awakened by the great noise, and they came outdoors.
- lines:
  - rag.3.21
  - rag.3.21
  text: Thora saw a mighty man going away; she asked him what name he was called by and whom he was seeking.
- lines:
  - rag.3.22
  - rag.3.22
  text: 'He paused on his way and spoke this verse:'
- lines:
  - rag.3.23
  - rag.3.30
  text: |-
    “In my fifteenth year, O shining maid
    I risked my life and slew this drake;
    What ills may befall, I shall not die
    From the stroke of the coiled and twisted snake.”
- lines:
  - rag.3.31
  - rag.3.31
  text: Then he went away and said no more to her.
- lines:
  - rag.3.32
  - rag.3.32
  text: The spear remained in the wound it had caused, but he carried the shaft with him.
- lines:
  - rag.3.33
  - rag.3.33
  text: Now when she had heard his stave, she understood what he had said about his age and his errand thither,
- lines:
  - rag.3.34
  - rag.3.34
  text: and she began to ponder who he was; she was unsure whether he was a human being or not,
- lines:
  - rag.3.35
  - rag.3.35
  text: for his stature seemed to her so great for his age that it rather befitted what was told of the race of monsters.
- lines:
  - rag.3.36
  - rag.3.36
  text: She went into her bower again and slept,
- lines:
  - rag.3.37
  - rag.3.37
  text: and when folk appeared in the morning they saw that the dragon was dead, laid low by a great spear that still remained fast in the wound.
- lines:
  - rag.3.38
  - rag.3.38
  text: The Jarl had it taken away, but it was so huge that most men found it unmanageable.
- lines:
  - rag.3.39
  - rag.3.40
  text: Now the Jarl recalled what he had said concerning the man who might slay the dragon, but he did not know whether a human being had done it or not. He took counsel of his friends and his daughter
    to know how he might search for him,
- lines:
  - rag.3.41
  - rag.3.41
  text: and it appeared likely to them that the man would himself look after the gaining of the reward that he had earned.
- lines:
  - rag.3.42
  - rag.3.42
  text: His daughter advised him to call together many men to a Thing, “and bid all who would not bring upon themselves the anger of the Jarl to come thither if in any wise they may;
- lines:
  - rag.3.43
  - rag.3.43
  text: and if any of them avows the slaying of the dragon, he is to bring with him the shaft that fits the spear.”
- lines:
  - rag.3.44
  - rag.3.44
  text: That seemed a hopeful rede to the Jarl, and he bade summon a Thing.
- lines:
  - rag.3.45
  - rag.3.45
  text: When the appointed day arrived, he was there with many other chiefs,
- lines:
  - rag.3.46
  - rag.3.46
  text: and there was a great throng of men gathered together.
- lines:
  - rag.4.1
  - rag.4.1
  text: It was told on board Ragnar’s ships that a Thing had been called,
- lines:
  - rag.4.2
  - rag.4.2
  text: and he went ashore to it with nearly all his men.
- lines:
  - rag.4.3
  - rag.4.3
  text: When they had arrived they posted themselves somewhat apart from the others, for Ragnar saw that a greater number of men had come than was customary.
- lines:
  - rag.4.4
  - rag.4.4
  text: 'Then the Jarl arose, asked for silence, and spoke: he thanked those who had so well responded to his message,'
- lines:
  - rag.4.5
  - rag.4.5
  text: and then he told them what had befallen. First he recounted what he had promised to the man who would slay the dragon, and then he said,
- lines:
  - rag.4.6
  - rag.4.6
  text: “The snake is now dead, and the man who wrought that mighty deed has left his spear in the wound.
- lines:
  - rag.4.7
  - rag.4.7
  text: If any of those here come to the Thing has the shaft belonging to that spear, let him show it, and thus make good his claim;
- lines:
  - rag.4.8
  - rag.4.8
  text: I shall then fulfill all I have said, whether he be of lowly or high degree.”
- lines:
  - rag.4.9
  - rag.4.9
  text: And at the end of his speech he had the spear carried about before each man in the Thing, and he asked whatsoever man it was that avowed the deed and had wrought it, to tell him thereof.
- lines:
  - rag.4.10
  - rag.4.10
  text: And so it was done;
- lines:
  - rag.4.11
  - rag.4.11
  text: but none was found who had the spear.
- lines:
  - rag.4.12
  - rag.4.12
  text: Now they came to the place where Ragnar was and showed him the spear; he said that he had the shaft of it, and the two fitted together entire.
- lines:
  - rag.4.13
  - rag.4.13
  text: From this men knew that he must have been the slayer of the dragon, and from that deed he grew widely famed throughout the northern lands.
- lines:
  - rag.4.14
  - rag.4.14
  text: Ragnar now asked for Thora the Jarl’s daughter in marriage; her father was agreed thereto, and a great feast was prepared with the best cheer that was to be had in the realm.
- lines:
  - rag.4.15
  - rag.4.15
  text: At this feast Ragnar wedded Thora,
- lines:
  - rag.4.16
  - rag.4.16
  text: and when it was done he returned to his kingdom with his wife, whom he dearly loved.
- lines:
  - rag.4.17
  - rag.4.17
  text: 'They had two sons: the elder was called Eric and the younger Agnar,'
- lines:
  - rag.4.18
  - rag.4.18
  text: and both of them were large of stature and fair of countenance.
- lines:
  - rag.4.19
  - rag.4.19
  text: They were stronger than most other men who lived in their time,
- lines:
  - rag.4.20
  - rag.4.20
  text: and they were skilled in all sorts of crafts.
- lines:
  - rag.4.21
  - rag.4.21
  text: On a time it came to pass that Thora fell ill, and of that sickness she died.
- lines:
  - rag.4.22
  - rag.4.22
  text: This seemed so great a grief to Ragnar that he would no longer rule his kingdom, and he took others to govern it for him with his sons.
- lines:
  - rag.4.23
  - rag.4.23
  text: He now returned to his former deeds; he departed to the wars, and wherever he went he was victorious.
- lines:
  - rag.5.1
  - rag.5.1
  text: One summer he sailed to Norway, for he had many kinsmen and friends there whom he wished to see.
- lines:
  - rag.5.2
  - rag.5.2
  text: Towards evening he and his ships sailed into a little haven, not far from a farmstead called Spangarheath; and they lay in the haven overnight.
- lines:
  - rag.5.3
  - rag.5.3
  text: When morning came the kitchen knaves went ashore to bake bread;
- lines:
  - rag.5.4
  - rag.5.4
  text: they saw the farmhouse not far away, and they thought it would be better for them to go thither to do it.
- lines:
  - rag.5.5
  - rag.5.5
  text: And when they came to the little house they found someone to speak with; it was a woman, and they asked her if she were the housewife, and what was her name.
- lines:
  - rag.5.6
  - rag.5.6
  text: “I am indeed the housewife here,” said she, “and my name is a rare one; I am called Grima. Whence come ye?”
- lines:
  - rag.5.7
  - rag.5.7
  text: They said that they were vassals of Ragnar Lodbrok, and that they wished to go ahead with their task, “and we want thee to work with us.”
- lines:
  - rag.5.8
  - rag.5.8
  text: The woman said that her hands were grown stiff with age;
- lines:
  - rag.5.9
  - rag.5.9
  text: “but of old I could do my work well enough! Yet I have a daughter who can busy herself with you; her name is Kraka and she will soon be home.
- lines:
  - rag.5.10
  - rag.5.10
  text: It has come to pass of late that I can scarcely control her.”
- lines:
  - rag.5.11
  - rag.5.11
  text: At this time Kraka was gone out with the cattle in the morning and she saw that a great and mighty ship had come ashore. Thereupon she washed herself.
- lines:
  - rag.5.12
  - rag.5.12
  text: Grima had forbidden her to do that, for she did not wish men to see Kraka’s beauty; the maiden was fairest of all women, and her hair was so long that it reached to the earth about her, and was
    lovely as the fairest silk.
- lines:
  - rag.5.13
  - rag.5.13
  text: Now Kraka came home.
- lines:
  - rag.5.14
  - rag.5.14
  text: The kitchen knaves had made a fire, and so she saw that men had arrived there whom she had never seen before.
- lines:
  - rag.5.15
  - rag.5.15
  text: She looked at them and they likewise at her,
- lines:
  - rag.5.16
  - rag.5.16
  text: and then they asked Grima, “Is this fair maid thy daughter?”
- lines:
  - rag.5.17
  - rag.5.17
  text: “It is no untruth,” said Grima, “that she is my daughter.”
- lines:
  - rag.5.18
  - rag.5.18
  text: “Wonderfully unlike are ye two, thou being so ugly,” said they;
- lines:
  - rag.5.19
  - rag.5.19
  text: “but we have never seen so fair a maid, and in no way can we see that she has thy looks, for thou art a very monster!”
- lines:
  - rag.5.20
  - rag.5.20
  text: Grima answered, “The likeness is not to be perceived now,
- lines:
  - rag.5.21
  - rag.5.21
  text: for my looks have changed from their former state.”
- lines:
  - rag.5.22
  - rag.5.22
  text: Then they said they would have her work with them.
- lines:
  - rag.5.23
  - rag.5.23
  text: “What work shall I do?” she asked.
- lines:
  - rag.5.24
  - rag.5.24
  text: They said they wished her to lay out the dough, and they would bake it afterwards.
- lines:
  - rag.5.25
  - rag.5.25
  text: She went about her task and did it very well,
- lines:
  - rag.5.26
  - rag.5.26
  text: but they gazed upon her so much that they neglected their work and burnt the bread.
- lines:
  - rag.5.27
  - rag.5.27
  text: When they had finished the task they went to the ships;
- lines:
  - rag.5.28
  - rag.5.28
  text: and when they were supposed to serve the food, everyone said that they had never done their work so badly, and that they deserved to be punished for it.
- lines:
  - rag.5.29
  - rag.5.29
  text: Now Ragnar asked them why their cooking had gone so ill.
- lines:
  - rag.5.30
  - rag.5.30
  text: They said they had seen a woman so very fair that they could not attend to their task for looking at her, and it was their opinion that no one in the world could be more beautiful than she.
- lines:
  - rag.5.31
  - rag.5.31
  text: While they were making so much of her beauty, Ragnar spoke and said he was assured she could not be as fair as Thora had been,
- lines:
  - rag.5.32
  - rag.5.32
  text: but they said she was no less fair.
- lines:
  - rag.5.33
  - rag.5.33
  text: Then Ragnar said, “I must send some men who are able to see precisely,
- lines:
  - rag.5.34
  - rag.5.34
  text: and if it is as ye say, your lack of attention shall be forgiven; but if the woman is in any wise less beautiful than ye say, ye must needs suffer a harsh punishment.”
- lines:
  - rag.5.35
  - rag.5.35
  text: Thereupon he sent his men to meet this fair maid, but the wind was so strong against them that they might not set out that day.
- lines:
  - rag.5.36
  - rag.5.36
  text: Ragnar said to his messengers, “If the young maid seems as fair to you as was said to us, bid her come to me and I will meet her;
- lines:
  - rag.5.37
  - rag.5.37
  text: it is my wish that she be mine.
- lines:
  - rag.5.38
  - rag.5.38
  text: She shall be neither naked nor clad, and neither fasting nor fed; she shall not come alone, yet no man shall attend her.”
- lines:
  - rag.5.39
  - rag.5.39
  text: Now they went until they came to the house, and there they gazed closely on her; and she seemed so fair to them that they thought none other could be her like.
- lines:
  - rag.5.40
  - rag.5.40
  text: Thereupon they gave her the message of their lord Ragnar, and told her how she was to prepare herself.
- lines:
  - rag.5.41
  - rag.5.41
  text: Kraka gave thought to the words of the King, and the manner of her preparation to meet him; but to Grima it seemed impossible, and she said she was sure the King must be lacking his wits.
- lines:
  - rag.5.42
  - rag.5.42
  text: Kraka said, “He must have spoken so because the thing can be done, if we may but perceive his intent.
- lines:
  - rag.5.43
  - rag.5.43
  text: But certain it is that I may not fare with you this day, but I shall come out to your ships early in the morning.”
- lines:
  - rag.5.44
  - rag.5.44
  text: Then they went away and told Ragnar how matters stood, and that she would come to them in the morning.
- lines:
  - rag.5.45
  - rag.5.45
  text: That night she abode at home;
- lines:
  - rag.5.46
  - rag.5.46
  text: but early in the morning Kraka told the old man that she must needs go to Ragnar,
- lines:
  - rag.5.47
  - rag.5.47
  text: “but I must change my raiment somewhat. Thou hast a trout-net, and in that I must wrap myself, and over that I shall let my hair fall down, so that I shall be no whit naked.
- lines:
  - rag.5.48
  - rag.5.48
  text: And I shall taste of a leek; that is but little food, and yet it will bear witness that I have eaten;
- lines:
  - rag.5.49
  - rag.5.49
  text: I shall have thy hound follow me, so that I shall not go alone, and yet no man will be with me.”
- lines:
  - rag.5.50
  - rag.5.50
  text: When the old man heard of her intent, he thought she had great store of wisdom.
- lines:
  - rag.5.51
  - rag.5.51
  text: When Kraka was ready she went her way until she came to the ship, and very fair she was to look upon, for her hair was bright as gold.
- lines:
  - rag.5.52
  - rag.5.52
  text: Ragnar called out to her and asked who she was and whom she was seeking.
- lines:
  - rag.5.53
  - rag.5.53
  text: 'She answered and spoke a stave:'
- lines:
  - rag.5.54
  - rag.5.61
  text: |-
    “I dared not do else than obey thy behest,
    Prince Ragnar, and come as I’m bid:
    Although I’m companioned, alone I fare;
    Though naked, my body is hid.”
- lines:
  - rag.5.62
  - rag.5.62
  text: Then he sent men out to meet her and conduct her to the ship,
- lines:
  - rag.5.63
  - rag.5.63
  text: but she would not go with them unless he assured her safety and that of her companion.
- lines:
  - rag.5.64
  - rag.5.64
  text: She was then led to the King’s ship; and when she came into the fore-room, he stretched out his hand to her, but the hound bit it.
- lines:
  - rag.5.65
  - rag.5.65
  text: 'His men ran up and slew the hound and stretched a bow-string about its neck so that it had its bane thereof: no better than that did they respect the safety promised her.'
- lines:
  - rag.5.66
  - rag.5.66
  text: Now Ragnar placed her beside him on the afterdeck and talked with her; he found great delight in her, and showed himself merry towards her.
- lines:
  - rag.5.67
  - rag.5.67
  text: 'He spoke a verse:'
- lines:
  - rag.5.68
  - rag.5.71
  text: |-
    “If this gentle maid gave me honor due,
    The clasp of her arms she’d deny me not.”
- lines:
  - rag.5.72
  - rag.5.72
  text: 'She said:'
- lines:
  - rag.5.73
  - rag.5.76
  text: |-
    “If the prince will uphold the word he gave
    He will let me depart and go without spot.”
- lines:
  - rag.6.1
  - rag.6.1
  text: Now he told her that he found great pleasure in her, and it was his sure intent that she should depart with him.
- lines:
  - rag.6.2
  - rag.6.2
  text: She said that it might not be,
- lines:
  - rag.6.3
  - rag.6.3
  text: but he said his will was that she tarry aboard the ship that night.
- lines:
  - rag.6.4
  - rag.6.4
  text: She said that would not come to pass before he returned from the journey he had before him, “and it may be that thy mind may be changed by then.”
- lines:
  - rag.6.5
  - rag.6.5
  text: Then Ragnar called his treasurer to him and bade him fetch the shift, all sewn with gold, that had been Thora’s, and bring it to him.
- lines:
  - rag.6.6
  - rag.6.6
  text: 'This Ragnar offered to Kraka in the following wise:'
- lines:
  - rag.6.7
  - rag.6.14
  text: |-
    “Wilt thou take this shift that Thora owned?
    Fitting for thee is that silver-wrought gear;
    White were her hands that worked the cloth—
    Until her death to me she was dear.”
- lines:
  - rag.6.15
  - rag.6.15
  text: 'Kraka said in reply:'
- lines:
  - rag.6.16
  - rag.6.23
  text: |-
    “I dare not take the silver-wrought shift,
    More fitting for me is wretched gear;
    In coal-black rags I’ve driven my goats
    Down stony ways by the shores of the sea,
    And for that I am known as Kraka here.
- lines:
  - rag.6.24
  - rag.6.24
  text: And I will surely not take the shift,” said she.
- lines:
  - rag.6.25
  - rag.6.25
  text: “I will not deck myself in finery so long as I am with the karl man.
- lines:
  - rag.6.26
  - rag.6.26
  text: It may be that thou wilt think better of me when I adorn myself in more comely wise; but now I will go home.
- lines:
  - rag.6.27
  - rag.6.27
  text: But thou shalt send men after me if thou still hast the same desire that I fare with thee.”
- lines:
  - rag.6.28
  - rag.6.28
  text: Ragnar said that his intent would not change; and therewith she went home.
- lines:
  - rag.6.29
  - rag.6.29
  text: Ragnar and his men went on as they had planned, as soon as they had a favorable wind, and he concluded his errand as he had intended.
- lines:
  - rag.6.30
  - rag.6.30
  text: When he was returning he entered the harbor where he had been before when Kraka came to him.
- lines:
  - rag.6.31
  - rag.6.31
  text: And that same evening he sent men to her with his word that she should depart with him forever.
- lines:
  - rag.6.32
  - rag.6.32
  text: But she told them she would not leave before the morning.
- lines:
  - rag.6.33
  - rag.6.33
  text: Kraka arose early next day and went to the bed of the karl and his wife, and asked them if they were awake.
- lines:
  - rag.6.34
  - rag.6.34
  text: They said they were, and asked her what she willed.
- lines:
  - rag.6.35
  - rag.6.35
  text: She told them that she intended to leave, and abide there no longer,
- lines:
  - rag.6.36
  - rag.6.36
  text: “but I know that ye killed my foster-father Heimir, and there are none who deserve worse of me, than ye do.
- lines:
  - rag.6.37
  - rag.6.37
  text: Yet I will not have evil done you, because I have long been with you; but now I will speak the wish that every day that passes over you shall be worse than the one before, and the last worst of
    all; and now we must part.”
- lines:
  - rag.6.38
  - rag.6.38
  text: Then she went her way until she came to the ships, and there she was well received.
- lines:
  - rag.6.39
  - rag.6.39
  text: They had a fair wind.
- lines:
  - rag.6.40
  - rag.6.40
  text: That same evening, when the men were about the making of their beds, Ragnar said he wished that he and Kraka should sleep together.
- lines:
  - rag.6.41
  - rag.6.41
  text: She said it might not be so, “and it is my wish that thou first hold marriage with me when thou comest to thy kingdom; methinks that befits my honor and thine, and the honor of our heirs, if we
    have any.”
- lines:
  - rag.6.42
  - rag.6.42
  text: He granted her her prayer, and they had a good journey thence.
- lines:
  - rag.6.43
  - rag.6.43
  text: After that Ragnar came home to his country, and a rich feast was made ready for him, at which men drank to his return and to his marriage at the same time.
- lines:
  - rag.6.44
  - rag.6.44
  text: And the first night the two of them went into one bed together, Ragnar wished to have to do with his wife, but she asked to be let off, for she said that ill would befall afterwards if she did not
    have her way.
- lines:
  - rag.6.45
  - rag.6.45
  text: Ragnar said he did not believe that, and said that the karl and his wife were not foresighted.
- lines:
  - rag.6.46
  - rag.6.46
  text: He asked how long it would be so.
- lines:
  - rag.6.47
  - rag.6.47
  text: She said,
- lines:
  - rag.6.48
  - rag.6.55
  text: |-
    “Three nights together, but yet apart
    Shall we bide, nor worship the gods as yet;
    From my son this would save a lasting harm,
    For boneless is he thou wouldst now beget.”
- lines:
  - rag.6.56
  - rag.6.56
  text: But although she said this, Ragnar paid no attention to it; he accomplished his will none the less.
- lines:
  - rag.7.1
  - rag.7.1
  text: Now time passed by, and in their marriage was much love and good-will.
- lines:
  - rag.7.2
  - rag.7.2
  text: Kraka knew herself to be with child; she was delivered and gave birth to a boy who was sprinkled with water and named Ivar.
- lines:
  - rag.7.3
  - rag.7.3
  text: But the boy was boneless; he had only the like of gristle where bones should have been.
- lines:
  - rag.7.4
  - rag.7.4
  text: But while he was young his growth was so great that none was his equal.
- lines:
  - rag.7.5
  - rag.7.5
  text: He was fairest of all men in looks and so wise that none other is known to have been wiser than he.
- lines:
  - rag.7.6
  - rag.7.6
  text: Ragnar and Kraka had other children.
- lines:
  - rag.7.7
  - rag.7.7
  text: Their second son was called Bjorn, the third Hvitserk, and the fourth Rognvald.
- lines:
  - rag.7.8
  - rag.7.8
  text: They were all bold and mighty men, and as soon as they might they learned all kinds of accomplishments.
- lines:
  - rag.7.9
  - rag.7.9
  text: And wherever they went, Ivar had himself carried along by means of staves, since he could not walk; and it was his place to give counsel to them in whatsoever they undertook.
- lines:
  - rag.7.10
  - rag.7.10
  text: At this time the sons of Ragnar, Eric and Agnar, were likewise mighty men, so that their equals could scarce be found; they went abroad in ships of war every summer, and were widely famed for their
    harryings.
- lines:
  - rag.7.11
  - rag.7.11
  text: Now it came to pass one day that Ivar spoke with his brothers, and asked them how long they thought to continue sitting at home instead of gaining glory for themselves.
- lines:
  - rag.7.12
  - rag.7.12
  text: They said they would follow his advice in this as in other things.
- lines:
  - rag.7.13
  - rag.7.13
  text: “It is my wish,” said Ivar, “that we ask to have a ship and men, well ordered, and after that I desire that we earn wealth and fame for ourselves, if it may be done.”
- lines:
  - rag.7.14
  - rag.7.14
  text: And when they had agreed this among themselves, they told Ragnar that they wished to have of him a ship and a band of men who were tried in the taking of booty, and ready for all things.
- lines:
  - rag.7.15
  - rag.7.15
  text: Ragnar did according to their request,
- lines:
  - rag.7.16
  - rag.7.16
  text: and when the host was ready, they departed from the land.
- lines:
  - rag.7.17
  - rag.7.17
  text: Wherever they battled with other men, they were ever the winners, and they gained themselves many followers and much treasure.
- lines:
  - rag.7.18
  - rag.7.18
  text: Then Ivar said he wished that they would betake themselves where there was a more mighty force to be met, and thus make trial of their hardihood.
- lines:
  - rag.7.19
  - rag.7.19
  text: They asked him where he knew of such a thing,
- lines:
  - rag.7.20
  - rag.7.20
  text: and he told them of a stead called Whitby where men had been wont to make sacrifices, “and many have tried to win it, but none has been victorious,” said he. Ragnar had come there and he had had
    to depart without achieving his purpose.
- lines:
  - rag.7.21
  - rag.7.21
  text: “Is the host so great and so valiant,” said they, “or are there other difficulties?”
- lines:
  - rag.7.22
  - rag.7.22
  text: Ivar said that there was a great number of men there and likewise the place was a mighty temple; it had been the destruction of all who attacked it and none had endured against it.
- lines:
  - rag.7.23
  - rag.7.23
  text: Thereupon they said that he should decide whether they should betake themselves thither or not.
- lines:
  - rag.7.24
  - rag.7.24
  text: He said he would like to try by venture which might be the more potent, their valor or the idolatry of the folk of that country.
- lines:
  - rag.8.1
  - rag.8.1
  text: They now took their way thither, and when they came to the land they made ready to go ashore.
- lines:
  - rag.8.2
  - rag.8.2
  text: It seemed necessary for the band to keep watch over some of the ships;
- lines:
  - rag.8.3
  - rag.8.3
  text: and since their brother Rognvald was so young that they thought he was not yet able to enter into so great a test of valor as they expected, they left him to guard the ships with some of the men.
- lines:
  - rag.8.4
  - rag.8.4
  text: But before they departed from the ships, Ivar said that the men in the stronghold had two cows, and all folk had fled away from them because they could not bear the roaring and the trolldom of the
    beasts.
- lines:
  - rag.8.5
  - rag.8.5
  text: Ivar said moreover, “Bear yourselves as best ye can, though ye should feel some terror, for ye will not come to harm.”
- lines:
  - rag.8.6
  - rag.8.6
  text: Then they drew up their men in battle array,
- lines:
  - rag.8.7
  - rag.8.7
  text: and when they approached the burg, those who dwelt within grew ware of them. They straightway let loose their cattle, in which they believed,
- lines:
  - rag.8.8
  - rag.8.8
  text: and when the beasts were free, they rushed out fiercely and roared aloud.
- lines:
  - rag.8.9
  - rag.8.9
  text: Ivar saw this from the shield on which they bore him, and he bade them fetch him a bow, and it was done.
- lines:
  - rag.8.10
  - rag.8.10
  text: He shot at these evil creatures so that both got their bane of it, and thus was ended the fight that men had most feared.
- lines:
  - rag.8.11
  - rag.8.11
  text: At the ships Rognvald spoke to his men and said that those who could entertain themselves like his brothers were happy indeed,
- lines:
  - rag.8.12
  - rag.8.12
  text: “and they had no other reason for bidding me stay behind than that they wished to have the glory of it alone.
- lines:
  - rag.8.13
  - rag.8.13
  text: But now we shall all go ashore.”
- lines:
  - rag.8.14
  - rag.8.14
  text: They did so,
- lines:
  - rag.8.15
  - rag.8.15
  text: and when they came up to the host, Rognvald threw himself hard into the battle, and the end of it was that he fell.
- lines:
  - rag.8.16
  - rag.8.16
  text: But his brothers entered into the burg, and the battle began anew. Finally the men of the stronghold took to flight, but the brothers pursued them.
- lines:
  - rag.8.17
  - rag.8.17
  text: 'And when they returned to the burg, Bjorn spoke a stave:'
- lines:
  - rag.8.18
  - rag.8.25
  text: |-
    “By Gnipefjord was our war-cry heard,
    Our swords smote better than those of the foe,
    Each slew his man by Whitby stead:
    Let every swain wield his weapons so!”
- lines:
  - rag.8.26
  - rag.8.26
  text: When they returned to the burg they took all the chattels and burnt every house within the stronghold, and broke down all its walls.
- lines:
  - rag.8.27
  - rag.8.27
  text: And then they departed thence in their ships.
- lines:
  - rag.9.1
  - rag.9.1
  text: Eystein was the name of a king who ruled over Sweden;
- lines:
  - rag.9.2
  - rag.9.3
  text: he was married and had a daughter called Ingeborg.
- lines:
  - rag.9.4
  - rag.9.4
  text: She was fairest of all women and loveliest to look on.
- lines:
  - rag.9.5
  - rag.9.5
  text: King Eystein was rich and had many followers; he was ill-natured, but wise.
- lines:
  - rag.9.6
  - rag.9.6
  text: He had his royal residence at Uppsala.
- lines:
  - rag.9.7
  - rag.9.7
  text: He was a great worshipper of the gods and in those days there were more sacrifices made in Uppsala than any place else in the Northlands.
- lines:
  - rag.9.8
  - rag.9.8
  text: The folk there had great faith in a certain cow which they called Sibilia;
- lines:
  - rag.9.9
  - rag.9.9
  text: she had been so much worshipped with sacrifices that men could not endure the noise she made.
- lines:
  - rag.9.10
  - rag.9.11
  text: Therefore, when an army of foes was expected, the King was wont to have this cow go before the host, and so great was the devil’s power attending her that his enemies grew mad when they heard her,
    and fought one another, taking no care of themselves. For this reason Sweden was unharried by war,
- lines:
  - rag.9.12
  - rag.9.12
  text: since men had not the heart to be matched against so mighty a power.
- lines:
  - rag.9.13
  - rag.9.13
  text: Many princes and men were King Eystein’s friends, and it is said that at that time there was also great friendship between him and Ragnar. It was their custom that every summer they visited each
    other, turn about;
- lines:
  - rag.9.14
  - rag.9.14
  text: and now it came to pass that Ragnar was to be entertained by King Eystein.
- lines:
  - rag.9.15
  - rag.9.15
  text: When he came to Uppsala, he and his men were well received.
- lines:
  - rag.9.16
  - rag.9.16
  text: At the banquet the first evening the King had his daughter pour out the wine for himself and Ragnar;
- lines:
  - rag.9.17
  - rag.9.17
  text: and Ragnar’s men said among themselves that he would surely ask for the King’s daughter, if only he no longer had the karl’s daughter by him.
- lines:
  - rag.9.18
  - rag.9.18
  text: One of his men undertook to point this out to him, and the end of it was that the maid was promised to him, but she was to remain betrothed to him for a long time.
- lines:
  - rag.9.19
  - rag.9.19
  text: When the feast was done, Ragnar went home, and he had a fair journey. Nought further is said of it until he was but a short distance from the burg, and his path lay through a certain forest.
- lines:
  - rag.9.20
  - rag.9.20
  text: They came to a clearing in the wood,
- lines:
  - rag.9.21
  - rag.9.21
  text: and here Ragnar had his men halt and give ear to him; and he asked all those who had been with him on the journey to Sweden to have a care that none of them said aught about his intent concerning
    the marriage that was arranged with the daughter of King Eystein.
- lines:
  - rag.9.22
  - rag.9.22
  text: So heavy was the penalty he imposed that if any of them spoke of it, he was to lose no less than his life for it.
- lines:
  - rag.9.23
  - rag.9.23
  text: And when he had told them his will he went home to his estate;
- lines:
  - rag.9.24
  - rag.9.24
  text: and his men were rejoiced at his return, and drank a welcome to him.
- lines:
  - rag.9.25
  - rag.9.25
  text: He had not been sitting long on his throne before Kraka came into the hall before him; she sat upon his knee and put her arms about his neck and asked him what tidings there were,
- lines:
  - rag.9.26
  - rag.9.26
  text: but he said he knew of none to tell her.
- lines:
  - rag.9.27
  - rag.9.27
  text: When the evening drew on men took to drinking and after that they went to sleep.
- lines:
  - rag.9.28
  - rag.9.28
  text: When Ragnar and Kraka came to their bed she asked him again for tidings, but again he said he knew of none.
- lines:
  - rag.9.29
  - rag.9.29
  text: She wished to speak with him about many things, but he said he was sleepy and tired from his journey.
- lines:
  - rag.9.30
  - rag.9.30
  text: “Now I shall tell thee tidings,” said she, “if thou wilt give me none.”
- lines:
  - rag.9.31
  - rag.9.31
  text: He asked what they were.
- lines:
  - rag.9.32
  - rag.9.32
  text: “I call it news,” she said, “if a woman is betrothed to a king when it is none the less said by certain folk that he already has another wife.”
- lines:
  - rag.9.33
  - rag.9.33
  text: “Who told thee that?” said Ragnar.
- lines:
  - rag.9.34
  - rag.9.34
  text: “Thy men shall keep safe their lives and limbs, for it was none of them that told me,” she answered.
- lines:
  - rag.9.35
  - rag.9.35
  text: “Thou must have seen that three birds sat in the tree beside thee,
- lines:
  - rag.9.36
  - rag.9.36
  text: and they told me these tidings.
- lines:
  - rag.9.37
  - rag.9.37
  text: I must ask thee now not to carry out this marriage as it has been planned.
- lines:
  - rag.9.38
  - rag.9.38
  text: I have to tell thee now that I am the daughter of a king and not at all of a karl; and my father was so glorious a man that his like could not be found; my mother was fairest and wisest of women,
    and her name will last while the world endures.”
- lines:
  - rag.9.39
  - rag.9.39
  text: Then he asked her who her father was, and if she was not the daughter of the poor man of Spangarheath.
- lines:
  - rag.9.40
  - rag.9.40
  text: She said she was the daughter of Sigurd Fafnir’s Bane and Brynhild, Budli’s daughter.
- lines:
  - rag.9.41
  - rag.9.41
  text: “That seems most unlikely to me,” he replied, “that the daughter of those two should be called Kraka, and grow up in such poverty on Spangarheath.”
- lines:
  - rag.9.42
  - rag.9.42
  text: “Thus is the tale,” she said; and then she told him of the meeting of Sigurd and Brynhild on the rock, and of her begetting;
- lines:
  - rag.9.43
  - rag.9.43
  text: “and when Brynhild was delivered a name was given to me and I was called Aslaug.”
- lines:
  - rag.9.44
  - rag.9.44
  text: And then she told how she had fared from the time when she and Heimir met the karl.
- lines:
  - rag.9.45
  - rag.9.45
  text: Ragnar answered, “I am greatly astounded at these mad fancies about Aslaug that thou tellest me of.”
- lines:
  - rag.9.46
  - rag.9.46
  text: She answered, “Thou knowest that I am going now with child, and it will surely be a boy that I bear. Upon the child will be such a mark that it will seem that a snake lies about his eye.
- lines:
  - rag.9.47
  - rag.9.47
  text: And if it comes to pass as I have said I ask thee not to go to Sweden at the time thou shouldst receive the daughter of King Eystein;
- lines:
  - rag.9.48
  - rag.9.48
  text: but if it proves false, do thou in this matter as thou wilt.
- lines:
  - rag.9.49
  - rag.9.49
  text: But I desire that the boy be named after my father if that sign of great fame be upon him, as I expect.”
- lines:
  - rag.9.50
  - rag.9.50
  text: Now when her hour was come she gave birth to a boy-child
- lines:
  - rag.9.51
  - rag.9.51
  text: and the serving women took it and showed it to her.
- lines:
  - rag.9.52
  - rag.9.52
  text: She bade them carry it and show it to Ragnar;
- lines:
  - rag.9.53
  - rag.9.53
  text: and it was so done; the lad was borne into the hall and laid in the lap of Ragnar’s cloak.
- lines:
  - rag.9.54
  - rag.9.54
  text: When he looked on the boy, they asked him what he should be called,
- lines:
  - rag.9.55
  - rag.9.55
  text: 'and Ragnar spoke a stave:'
- lines:
  - rag.9.56
  - rag.9.63
  text: |-
    “Battle-bold, brave as his mother’s sire,
    Sigurd shall be the name of the swain;
    The snake-eyed hero, the feeder of eagles,
    Mightiest offspring of Odin’s strain.”
- lines:
  - rag.9.64
  - rag.9.64
  text: Then he took a ring from his finger and gave it to the boy as his name-gift,
- lines:
  - rag.9.65
  - rag.9.65
  text: but as he stretched out his hand with the ring the child turned so that it touched its back, and Ragnar read that to mean that he despised the ring.
- lines:
  - rag.9.66
  - rag.9.66
  text: 'Again he spoke a stave:'
- lines:
  - rag.9.67
  - rag.9.74
  text: |-
    “Bright are the eyes and true the heart
    Of Brynhild’s daughter’s child;
    Budli’s offspring will win great battles,
    By glittering gold he is not beguiled.”
- lines:
  - rag.9.75
  - rag.9.75
  text: 'And again:'
- lines:
  - rag.9.76
  - rag.9.83
  text: |-
    “A snake like this I have never seen,
    Save in Sigurd’s eyes alone;
    The bold-hearted boy has the worm in his eye;
    By this token he may be known.”
- lines:
  - rag.9.84
  - rag.9.84
  text: Then he told them to bear the child out into the woman’s bower.
- lines:
  - rag.9.85
  - rag.9.85
  text: But therewith there was an end of his journeying to Sweden.
- lines:
  - rag.9.86
  - rag.9.86
  text: Now the race of Aslaug was made known, and all men were aware that she was the daughter of Sigurd Fafnir’s Bane and Brynhild.
- lines:
  - rag.10.1
  - rag.10.1
  text: Now when the appointed time had passed for Ragnar to go to the feast in Uppsala, and he came not, it seemed to King Eystein that a great shame had been done to him and his daughter, and that was
    the end of the friendship between the two kings.
- lines:
  - rag.10.2
  - rag.10.2
  text: When Eric and Agnar, the sons of Ragnar, heard of this, they took counsel among themselves and decided that they would gather as many men as they could and go harrying in Sweden.
- lines:
  - rag.10.3
  - rag.10.3
  text: So they summoned a great number of followers, and it seemed a matter of great importance to them that everything should go well when the ship was launched.
- lines:
  - rag.10.4
  - rag.10.4
  text: But it happened that when Agnar’s ship was shot off the rollers a man was standing before it, who thus received his bane; and that they called a “reddening of rollers.”
- lines:
  - rag.10.5
  - rag.10.5
  text: Now it appeared to them that things had not begun according to their wish, but they would not let it stand in the way of their journey.
- lines:
  - rag.10.6
  - rag.10.6
  text: When their band was ready they departed for Sweden, and as soon as they reached it, they harried the length and breadth of King Eystein’s realm.
- lines:
  - rag.10.7
  - rag.10.7
  text: But the folk grew ware of them and went to Uppsala to tell King Eystein that a host of foes had come into the land.
- lines:
  - rag.10.8
  - rag.10.8
  text: The King sent a summons throughout his realm and thus he gathered together a wondrous great host.
- lines:
  - rag.10.9
  - rag.10.9
  text: He moved them into a wood, and there he pitched camp; he had with him the cow Sibilia, and they had made many sacrifices to her, before she would journey with them.
- lines:
  - rag.10.10
  - rag.10.10
  text: While they were in the wood, King Eystein said, “I have heard that the sons of Ragnar are in the field before this wood, and it has been truthfully reported to me that they do not have the third
    part of our host.
- lines:
  - rag.10.11
  - rag.10.12
  text: 'Now we shall draw up our men in this wise for battle: one third of our army shall attack them first, and they are so bold that it will seem to them that they have us in their power; but thereafter
    we shall come at them with all our strength, with the cow in the lead,'
- lines:
  - rag.10.13
  - rag.10.13
  text: and I think that they will be unable to hold their ground before the noise of the beast.”
- lines:
  - rag.10.14
  - rag.10.14
  text: They did as he said;
- lines:
  - rag.10.15
  - rag.10.15
  text: and when the brothers saw King Eystein’s band, they thought they had to do with numbers no greater than their own, for they did not suspect that there might be a larger host.
- lines:
  - rag.10.16
  - rag.10.16
  text: After that the whole army came out of the wood and the cow was set free; she ran before the King’s men and roared terribly, and so great was the din she made before the warriors who could hear her
    that they fought among themselves, all save the two brothers.
- lines:
  - rag.10.17
  - rag.10.17
  text: But the evil creature slew many a man that day;
- lines:
  - rag.10.18
  - rag.10.18
  text: and although the sons of Ragnar were mighty warriors, they could not resist both trolldom and an army that outnumbered them; yet they made fierce resistance and defended themselves manfully and
    gloriously.
- lines:
  - rag.10.19
  - rag.10.19
  text: Eric and Agnar were in the front line of combat that day, and many times they charged through the ranks of King Eystein’s men.
- lines:
  - rag.10.20
  - rag.10.20
  text: Then Agnar fell.
- lines:
  - rag.10.21
  - rag.10.21
  text: Eric saw this, and thereafter he fought most bravely, caring not whether he could get away or not.
- lines:
  - rag.10.22
  - rag.10.22
  text: At the last he was overpowered by numbers and captured.
- lines:
  - rag.10.23
  - rag.10.23
  text: Eystein bade him cease fighting, and he offered him peace,
- lines:
  - rag.10.24
  - rag.10.24
  text: “and in addition,” said he, “I will marry my daughter to thee.”
- lines:
  - rag.10.25
  - rag.10.25
  text: 'Then Eric spoke a stave:'
- lines:
  - rag.10.26
  - rag.10.33
  text: |-
    “Eystein has slain my brother; I will
    Neither peace therefor nor a maiden buy;
    My mother will weep not; last of my men,
    Upon these spear-points let me die!”
- lines:
  - rag.10.34
  - rag.10.34
  text: Then he said that the men who had followed him and his brother should be allowed to depart in peace whither they willed,
- lines:
  - rag.10.35
  - rag.10.35
  text: “but I wish that ye take as many spears as may be and thrust them down on the field; I would have myself lifted up on them and there leave my life.”
- lines:
  - rag.10.36
  - rag.10.36
  text: King Eystein said they should do as he bade, though he had chosen the thing that worst suited both of them.
- lines:
  - rag.10.37
  - rag.10.37
  text: 'So the spears were set up, and Eric spoke a verse:'
- lines:
  - rag.10.38
  - rag.10.45
  text: |-
    “No king’s son shall, so far as I know,
    On a dearer bolster choose to die;
    The black-hued ravens shall tear our flesh
    And over our bodies raise their cry.”
- lines:
  - rag.10.46
  - rag.10.46
  text: 'Then he went up to the spears; he took a ring from his hand and cast it to his followers, who had been given truce; he sent them to Aslaug, and spoke this stave:'
- lines:
  - rag.10.47
  - rag.10.54
  text: |-
    “These words to Aslaug: my raid is done;
    To that slender dame my goods I bequeath;
    Let my stepmother tell her valiant sons
    When men report the tale of my death.”
- lines:
  - rag.10.55
  - rag.10.55
  text: After that he was lifted up on the spears.
- lines:
  - rag.10.56
  - rag.10.56
  text: 'Then he saw a raven flying by, and again he spoke:'
- lines:
  - rag.10.57
  - rag.10.64
  text: |-
    “The raven desires to feast on my eyes,
    He screams high over my head;
    Ill he rewards the feasts I’ve made
    On which he formerly fed.”
- lines:
  - rag.10.65
  - rag.10.65
  text: Thereafter he gave up his life most valiantly.
- lines:
  - rag.10.66
  - rag.10.66
  text: His messengers journeyed home, and they delayed not before they came to the place where Ragnar abode.
- lines:
  - rag.10.67
  - rag.10.67
  text: At that time he was gone to a meeting of kings,
- lines:
  - rag.10.68
  - rag.10.68
  text: and his other sons were not returned from their raid.
- lines:
  - rag.10.69
  - rag.10.69
  text: The men were there three nights before they approached Aslaug’s seat;
- lines:
  - rag.10.70
  - rag.10.70
  text: they saluted her fittingly, and she took their greeting well. She had a linen cloth over her knees and her hair was loosened, for she was about to comb it.
- lines:
  - rag.10.71
  - rag.10.71
  text: She asked them who they were, since she had never seen them before.
- lines:
  - rag.10.72
  - rag.10.72
  text: He who was their spokesman said that they had been followers of Eric and Agnar, Ragnar’s sons.
- lines:
  - rag.10.73
  - rag.10.73
  text: 'Then she spoke a stave:'
- lines:
  - rag.10.74
  - rag.10.81
  text: |-
    “What news of your land, O royal thanes?
    And where are the Swedes? I’ve heard
    That the Danes fared north and their rollers were red,
    But I have learnt no further word.”
- lines:
  - rag.10.82
  - rag.10.82
  text: 'He spoke a verse in reply:'
- lines:
  - rag.10.83
  - rag.10.90
  text: |-
    “My news is the death of Thora’s sons
    (To Ragnar the fates are cruel and fell);
    Over their bodies the eagle flew
    (Bitter the tidings I tell).”
- lines:
  - rag.10.91
  - rag.10.91
  text: Then she asked how it came to pass;
- lines:
  - rag.10.92
  - rag.10.92
  text: and he spoke for her the verse that Eric had uttered when he sent her the ring.
- lines:
  - rag.10.93
  - rag.10.93
  text: They saw her shed tears, but they were like blood to look on, and hard as hail-stones.
- lines:
  - rag.10.94
  - rag.10.94
  text: No man ever saw her shed another tear, either before or after.
- lines:
  - rag.10.95
  - rag.10.95
  text: She said she could do nothing about the matter of revenge before either Ragnar or his sons came home,
- lines:
  - rag.10.96
  - rag.10.96
  text: “but ye shall tarry here until then, and I shall spare not to urge revenge, even as if they were my own sons,” said she.
- lines:
  - rag.10.97
  - rag.10.97
  text: So the men remained there.
- lines:
  - rag.10.98
  - rag.10.98
  text: It so happened that Ivar and his brothers returned home before Ragnar, and they had not been there long before Aslaug went to see them. Sigurd was at that time three years old,
- lines:
  - rag.10.99
  - rag.10.99
  text: and he went along with his mother.
- lines:
  - rag.10.100
  - rag.10.100
  text: When she came into the brothers’ hall they greeted her well, and each asked the other for tidings; and they told her of the fall of her son Rognvald, and the things that had come to pass at that
    time;
- lines:
  - rag.10.101
  - rag.10.101
  text: but that meant but little to her, and she said,
- lines:
  - rag.10.102
  - rag.10.109
  text: |-
    “My sons are no beggars; they have left me to stare
    Over the sea with my longing, alone;
    Youngest was Rognvald; with blood-dyed shield
    From the combat Odin has called him home.
- lines:
  - rag.10.110
  - rag.10.110
  text: “I do not see,” she said, “that he could have lived for greater glory.”
- lines:
  - rag.10.111
  - rag.10.111
  text: They asked her what tidings she had to tell,
- lines:
  - rag.10.112
  - rag.10.112
  text: and she answered, “The fall of your brothers Eric and Agnar, my stepsons, who were according to my thinking the best of warriors.
- lines:
  - rag.10.113
  - rag.10.113
  text: It is no wonder if ye suffer it not, but take grim revenge for it.
- lines:
  - rag.10.114
  - rag.10.114
  text: This I ask of you, and I shall in all ways help you, that the revenge may be passing great.”
- lines:
  - rag.10.115
  - rag.10.115
  text: Ivar said, “Certain it is that I shall never go to Sweden to fight against King Eystein and the trolldom that is with him.”
- lines:
  - rag.10.116
  - rag.10.116
  text: She pressed hard upon them, but Ivar spoke for them and quite refused to make that journey.
- lines:
  - rag.10.117
  - rag.10.117
  text: 'And now she spoke a stave:'
- lines:
  - rag.10.118
  - rag.10.125
  text: |-
    “Unavenged yourselves would not lie
    If ye by chance were the first ones dead;
    No sons of mine were Eric and Agnar—
    Yet I wish they lived in your stead.”
- lines:
  - rag.10.126
  - rag.10.126
  text: “It is not sure,” said Ivar, “whether it would be of any avail, though thou shouldst speak one stanza after another; but how much dost thou know of the obstacles in the way?”
- lines:
  - rag.10.127
  - rag.10.127
  text: “I do not certainly know,” she said; “but what canst thou tell me of the difficulty?”
- lines:
  - rag.10.128
  - rag.10.128
  text: Ivar said there was so mighty a cult there that he had never heard tell of its like;
- lines:
  - rag.10.129
  - rag.10.129
  text: “and the King himself is both rich and ill-natured.”
- lines:
  - rag.10.130
  - rag.10.130
  text: “What is the thing he trusts most in making his sacrifices?”
- lines:
  - rag.10.131
  - rag.10.131
  text: “It is a cow,” said he, “that is called Sibilia.
- lines:
  - rag.10.132
  - rag.10.132
  text: So potent are her spells that as soon as men hear her, the King’s foes are unable to hold their ground. And it is scarce as if the battle were to be fought with men alone;
- lines:
  - rag.10.133
  - rag.10.133
  text: rather it appears that his enemies must encounter trolldom before they meet the King. I will not take the risk thereof upon myself or my men.”
- lines:
  - rag.10.134
  - rag.10.134
  text: 'She said, “Thou must remember this: thou canst not be called a surpassing great man and yet do nought to deserve it.”'
- lines:
  - rag.10.135
  - rag.10.135
  text: And now that she thought there was no more hope for her, she started to go, for she thought that they valued her words but lightly.
- lines:
  - rag.10.136
  - rag.10.136
  text: Then said Sigurd Snake-in-the-Eye, “I would tell thee, mother, what is in my mind, though I may not prevail over their oaths.”
- lines:
  - rag.10.137
  - rag.10.137
  text: “Let me hear it,” said she.
- lines:
  - rag.10.138
  - rag.10.138
  text: 'Then he spoke a verse:'
- lines:
  - rag.10.139
  - rag.10.146
  text: |-
    “In three nights’ space shall the levy be made,
    If that wish, mother, is grieving thee;
    In Uppsala Eystein shall rule no more
    (If our swords prevail), though he offer us fee.”
- lines:
  - rag.10.147
  - rag.10.147
  text: When he had spoken the stave, the brothers had somewhat changed their minds.
- lines:
  - rag.10.148
  - rag.10.148
  text: Aslaug said, “Thou dost proclaim right clearly, my son, that thou wouldst do my will;
- lines:
  - rag.10.149
  - rag.10.149
  text: and yet I do not see how we may bring it to pass without the support of thy brothers. But it may come to pass, and it would best please me that this thing may be avenged, and methinks thou hast
    borne thee very well, my son.”
- lines:
  - rag.10.150
  - rag.10.150
  text: 'And now Bjorn spoke a stave:'
- lines:
  - rag.10.151
  - rag.10.158
  text: |-
    “Though a man say little, the heart in his breast
    May still be bold and still beat high;
    I have not forgot thy stepsons’ deaths
    Although I have no snake in my eye!”
- lines:
  - rag.10.159
  - rag.10.159
  text: 'And now Hvitserk spoke:'
- lines:
  - rag.10.160
  - rag.10.167
  text: |-
    “Let us first take thought before we swear
    Revenge on the man who was Agnar’s bane;
    We must cut the prows of our ships from the ice,
    Make them ready, and launch them again.”
- lines:
  - rag.10.168
  - rag.10.168
  text: Hvitserk spoke of cutting the ice because there was a great frost at the time, and their ships were frozen fast.
- lines:
  - rag.10.169
  - rag.10.169
  text: 'Then Ivar said it had come to such a point that he also must have some part in the affair, and he spoke a stave:'
- lines:
  - rag.10.170
  - rag.10.177
  text: |-
    “Ye two have boldness and valor enough,
    Ye will have need of endurance too;
    Ye shall bear me before you; though handless I am,
    I shall share this revenge with you.
- lines:
  - rag.10.178
  - rag.10.178
  text: “And the first thing is,” said Ivar, “that we take as great pains as we can with the fitting out of our ships and gathering of men, for we shall need to be unsparing of these if we are to win.”
- lines:
  - rag.10.179
  - rag.10.179
  text: Then Aslaug departed.
- lines:
  - rag.11.1
  - rag.11.1
  text: Sigurd had a foster-father who undertook to gather men and prepare ships in his behalf, until all things were in readiness.
- lines:
  - rag.11.2
  - rag.11.2
  text: And so quickly was it done that the band of men whom Sigurd was to have gathered was ready after three nights had passed; and he also had five ships, all well appointed.
- lines:
  - rag.11.3
  - rag.11.3
  text: When five nights were passed, Hvitserk and Bjorn had prepared fourteen ships, but Ivar alone had ten, and Aslaug ten more, within seven nights of the time when they took counsel and promised to
    make the trip.
- lines:
  - rag.11.4
  - rag.11.4
  text: Then they met together, and each of them told the other how many he had gathered.
- lines:
  - rag.11.5
  - rag.11.5
  text: Ivar said that he had sent a band of knights by land.
- lines:
  - rag.11.6
  - rag.11.6
  text: Aslaug replied, “If I knew that a band of men might proceed by land, I might have sent out a large one as well.”
- lines:
  - rag.11.7
  - rag.11.7
  text: “We shall not delay over that,” said Ivar. “We shall go on with the men we have already gathered.”
- lines:
  - rag.11.8
  - rag.11.8
  text: Now Aslaug told them that she would go with them, “and I shall know most surely what pains are taken to avenge the brothers,” said she.
- lines:
  - rag.11.9
  - rag.11.9
  text: “It is a sure thing,” said Ivar, “that thou shalt not come aboard our ships;
- lines:
  - rag.11.10
  - rag.11.10
  text: but if thou wilt, thou mayest lead the men who march by land.”
- lines:
  - rag.11.11
  - rag.11.11
  text: She said it should be so;
- lines:
  - rag.11.12
  - rag.11.12
  text: and therewith her name was changed and she was called Randalin.
- lines:
  - rag.11.13
  - rag.11.13
  text: Now both bands departed, and Ivar told them beforehand where they should meet.
- lines:
  - rag.11.14
  - rag.11.14
  text: Both of them fared well, and they came together again as they had agreed.
- lines:
  - rag.11.15
  - rag.11.15
  text: 'Wherever they went in the kingdom of King Eystein they harried and raided: they burnt down all they could find, and slew every mother’s child, and moreover killed all living things in their path.'
- lines:
  - rag.12.1
  - rag.12.1
  text: It chanced that certain men escaped and reached King Eystein, and they told him that a great army had entered his realm,
- lines:
  - rag.12.2
  - rag.12.2
  text: so ill to deal with that it left nought undone, but laid waste all the land it passed over, so that no house remained standing.
- lines:
  - rag.12.3
  - rag.12.3
  text: When King Eystein heard these tidings he thought he knew who these vikings were.
- lines:
  - rag.12.4
  - rag.12.4
  text: He sent a message throughout his entire kingdom and summoned all of his followers who wished to give him aid and could bear shield.
- lines:
  - rag.12.5
  - rag.12.5
  text: “We shall have the cow Sibilia with us, that is our god,” said he, “and let her charge before the host; and methinks it will go once again as it has before, and they will not be able to endure her
    roaring.
- lines:
  - rag.12.6
  - rag.12.6
  text: I will spur on my men to do their best; and let us drive away this evil host.”
- lines:
  - rag.12.7
  - rag.12.7
  text: So it was done, and Sibilia was let loose.
- lines:
  - rag.12.8
  - rag.12.8
  text: Ivar beheld her attack, and heard the terrible noise that came from her;
- lines:
  - rag.12.9
  - rag.12.9
  text: he bade all his men to make such a mighty din with their weapons and war-cries that they could scarce hear the voice of this ill creature that charged against them.
- lines:
  - rag.12.10
  - rag.12.10
  text: He told his carriers to bear him as far forward as they might,
- lines:
  - rag.12.11
  - rag.12.11
  text: “and when that cow comes towards us, cast me at her; either I shall lose my own life or she shall have her bane of me.
- lines:
  - rag.12.12
  - rag.12.12
  text: Ye shall now take a large tree and cut a bow from it, and likewise arrows.”
- lines:
  - rag.12.13
  - rag.12.13
  text: Thereafter they brought him the mighty bow and the great arrows that he had bidden them make. They did not seem usable to any of the others.
- lines:
  - rag.12.14
  - rag.12.14
  text: Then Ivar urged each man to do his best;
- lines:
  - rag.12.15
  - rag.12.15
  text: the band went forward with great violence and din, and Ivar was borne at their head.
- lines:
  - rag.12.16
  - rag.12.16
  text: But now there arose so loud a noise when Sibilia bellowed, that they heard it quite as clearly as if they were standing silent and at rest.
- lines:
  - rag.12.17
  - rag.12.17
  text: This so worked on them that the whole army was bent on fighting one another, save only the brothers.
- lines:
  - rag.12.18
  - rag.12.18
  text: While this marvel befell, the men who carried Ivar saw him draw his bow as if it were only a weak elm-twig, and it seemed to them therewith that he drew even the point of his arrow back of the bow.
- lines:
  - rag.12.19
  - rag.12.19
  text: Then they heard the bowstring shriek louder than aught they had heard before.
- lines:
  - rag.12.20
  - rag.12.20
  text: And they saw his arrows fly as quickly as if he had shot them from the strongest cross-bow, and so straight that each struck Sibilia in the eye.
- lines:
  - rag.12.21
  - rag.12.21
  text: She fell, but after that she went on head foremost; and now her rage was much worse than before.
- lines:
  - rag.12.22
  - rag.12.22
  text: As she charged at them, Ivar bade them cast him towards her, and he was so light that it seemed to them they were throwing a little child, for they were not overnear the cow when they cast him.
- lines:
  - rag.12.23
  - rag.12.23
  text: He landed on the back of Sibilia, and at once he became so heavy that it was as if a boulder had fallen on her, and every bone in her was broken, and thereof she died.
- lines:
  - rag.12.24
  - rag.12.24
  text: Then he bade his men to lift him up as quickly as might be,
- lines:
  - rag.12.25
  - rag.12.25
  text: and this they did. Now his voice was so clear that all of the army thought he was within very short space of them, though they were in truth at a distance; and they gave the best of attention to
    his discourse.
- lines:
  - rag.12.26
  - rag.12.26
  text: At the close of his speech he said that all the fighting they had done was now taken from them, and it was no harm that the host had fought among themselves for a short time.
- lines:
  - rag.12.27
  - rag.12.27
  text: He urged them to wreak as much injury on the foe as they might,
- lines:
  - rag.12.28
  - rag.12.28
  text: “and methinks the most furious of them is disposed of, since the cow is slain.”
- lines:
  - rag.12.29
  - rag.12.29
  text: Now both sides had their men drawn up and they joined in a battle so fierce that the Swedes said they had never been so sorely tested.
- lines:
  - rag.12.30
  - rag.12.30
  text: The two brothers Hvitserk and Bjorn pressed forward so boldly that no army could stand before them.
- lines:
  - rag.12.31
  - rag.12.31
  text: So many of King Eystein’s host fell that but a small part were left standing, but some of them took to flight.
- lines:
  - rag.12.32
  - rag.12.32
  text: The end of the battle was that King Eystein was slain, and the brothers were victorious.
- lines:
  - rag.12.33
  - rag.12.33
  text: They granted peace to those who were left.
- lines:
  - rag.12.34
  - rag.12.34
  text: Then Ivar said that he did not desire to wage war longer in the land, for it was now without a king,
- lines:
  - rag.12.35
  - rag.12.35
  text: “I wish rather that we proceed until we find greater strength opposed to us.”
- lines:
  - rag.12.36
  - rag.12.36
  text: But Randalin went home with some part of the host.
- lines:
  - rag.13.1
  - rag.13.1
  text: Now they agreed among themselves that they should go warring in the south;
- lines:
  - rag.13.2
  - rag.13.2
  text: and Sigurd Snake-in-the-Eye went with his brothers on every raid thereafter.
- lines:
  - rag.13.3
  - rag.13.3
  text: In this one they laid siege to every great burg they came upon, and not one withstood them.
- lines:
  - rag.13.4
  - rag.13.4
  text: They heard of a certain castle that was large, well-manned and stoutly built,
- lines:
  - rag.13.5
  - rag.13.5
  text: and Ivar said he would hold his course thither.
- lines:
  - rag.13.6
  - rag.13.6
  text: 'The name of the burg is told, and likewise he who ruled it:'
- lines:
  - rag.13.7
  - rag.13.7
  text: the prince was called Vifil,
- lines:
  - rag.13.8
  - rag.13.8
  text: and his castle was named Vifilsburg from him.
- lines:
  - rag.13.9
  - rag.13.9
  text: The brothers now harried the country and laid waste all the castles that they encountered before they came to Vifilsburg.
- lines:
  - rag.13.10
  - rag.13.10
  text: The prince was at that time absent from his castle, and many of his men with him.
- lines:
  - rag.13.11
  - rag.13.11
  text: Now they set up their tents on the plain that was before the burg, and on the day of their arrival they remained quiet, and spoke with the men within the stronghold.
- lines:
  - rag.13.12
  - rag.13.12
  text: They asked whether they would sooner give up the fortress and therewith receive peace for all those within; or test their hardihood and strength, and receive quarter for none of their men.
- lines:
  - rag.13.13
  - rag.13.13
  text: They quickly made answer, saying that the burg would never be so far overcome that they would have to give it up,
- lines:
  - rag.13.14
  - rag.13.14
  text: “and it will fall on you first to prove yourselves and show us your valor and bravery.”
- lines:
  - rag.13.15
  - rag.13.15
  text: So the night passed,
- lines:
  - rag.13.16
  - rag.13.16
  text: and on the day following they tried to capture the burg, but they could not accomplish it.
- lines:
  - rag.13.17
  - rag.13.17
  text: They sat before the castle a half month, and every day they sought to take it, by various devices;
- lines:
  - rag.13.18
  - rag.13.18
  text: but they came no nearer to taking it after they had tried a long time, and so they decided to depart.
- lines:
  - rag.13.19
  - rag.13.19
  text: When the folk in the castle saw that they intended to leave, they came out on the walls and spread out costly stuffs on the rampart,
- lines:
  - rag.13.20
  - rag.13.20
  text: and all the most precious cloths that could be found in the burg, and laid before them the greatest treasure in gold and jewels that they had.
- lines:
  - rag.13.21
  - rag.13.21
  text: Then one of them spoke and said, “We thought that these men, the sons of Ragnar and their followers, were bold fighters, but we must say that they came no nearer their goal than any of the others.”
- lines:
  - rag.13.22
  - rag.13.22
  text: After that they raised their war-cry at them and struck upon their shields and egged them on as much as they could.
- lines:
  - rag.13.23
  - rag.13.23
  text: When Ivar heard that he was so startled that he fell into a sore illness, so that he could not move; and they had to wait until he should either mend or have his bane of it.
- lines:
  - rag.13.24
  - rag.13.24
  text: He lay that whole day until evening, and spoke no word.
- lines:
  - rag.13.25
  - rag.13.25
  text: Then he told the men who were with him that they should bid Bjorn, Hvitserk and Sigurd come and speak with him, together with all the wisest men in the host.
- lines:
  - rag.13.26
  - rag.13.26
  text: When all the greatest chieftains were gathered in one place, Ivar asked them if they had bethought themselves of any plan by which they were more likely to gain the victory than those they had tried
    before.
- lines:
  - rag.13.27
  - rag.13.27
  text: But they all replied that they were lacking in the wit to think of a scheme that would bring them victory.
- lines:
  - rag.13.28
  - rag.13.28
  text: “It is now as often before,” said they, “it is thy counsel we need to help us.”
- lines:
  - rag.13.29
  - rag.13.29
  text: Then Ivar replied, “There is one device has occurred to me that we have not tried.
- lines:
  - rag.13.30
  - rag.13.30
  text: There is a great forest not far hence; and when night falls we shall leave our tents secretly; and go to it, leaving our camp still standing. When we reach the forest, let each man tie up a load
    of wood,
- lines:
  - rag.13.31
  - rag.13.31
  text: and after that we shall proceed against the burg from all sides and set fire to the wood; from that a great blaze will be made,
- lines:
  - rag.13.32
  - rag.13.32
  text: which will cause the walls of the burg to lose their lime, and then we can bring up the catapults, and so test how strongly built it is.”
- lines:
  - rag.13.33
  - rag.13.33
  text: So it was done. They departed into the forest, and remained there as long as seemed best to Ivar.
- lines:
  - rag.13.34
  - rag.13.35
  text: Then they went to the burg as he had arranged. And when they had struck fire into the great heap of wood it blazed so fiercely that the walls could not endure it, but lost their lime. Then the brothers
    brought up their catapults to the castle, and broke a wide gap through it, and at once there was a great battle.
- lines:
  - rag.13.36
  - rag.13.36
  text: And when they were thus evenly matched, the men of the castle were slain, though some of them escaped by flight; and the end of it was that they slew every mother’s son that was in the burg and
    took away all the treasure, and they burnt the castle before they departed.
- lines:
  - rag.14.1
  - rag.14.1
  text: After that they went on until they came to a burg called Luna.
- lines:
  - rag.14.2
  - rag.14.2
  text: They had destroyed almost every burg and castle in the Southland, and they had grown so widely famed throughout the world that there was no child, however young, but knew their name.
- lines:
  - rag.14.3
  - rag.14.3
  text: It was their intent to cease not before they came to Rome, since that burg was reported to be large and well-manned, famous and wealthy.
- lines:
  - rag.14.4
  - rag.14.4
  text: But they did not quite know how far distant it was; and they had so great a host that they could not gain provisions for them.
- lines:
  - rag.14.5
  - rag.14.5
  text: They remained for a time within Lunaburg and took counsel together concerning their journey.
- lines:
  - rag.14.6
  - rag.14.6
  text: There came to them here an ancient and friendly man.
- lines:
  - rag.14.7
  - rag.14.7
  text: When they asked him who he was, he said he was a beggar, and had wandered up and down the country all his life.
- lines:
  - rag.14.8
  - rag.14.8
  text: “Then thou must have many tidings to tell us that we wish to hear.”
- lines:
  - rag.14.9
  - rag.14.9
  text: The old man answered, “I know of no land ye might wish to ask me about that I could not tell you tidings of.”
- lines:
  - rag.14.10
  - rag.14.10
  text: “We wish thee to tell us how far is the way from here to Rome.”
- lines:
  - rag.14.11
  - rag.14.11
  text: He answered, “I can tell you something as a token of the distance.
- lines:
  - rag.14.12
  - rag.14.12
  text: Ye may see these iron shoes I have on my feet, which are old; and these others on my back, which are broken.
- lines:
  - rag.14.13
  - rag.14.13
  text: But when I departed thence I bound on my feet the ones that now hang broken on my back, and both pairs were then new; and I have been on that road ever since.”
- lines:
  - rag.14.14
  - rag.14.14
  text: When the old man had said this it seemed to them that they could not go on the way they had planned towards Rome.
- lines:
  - rag.14.15
  - rag.14.15
  text: So they turned away with their army and captured many castles that had never been taken before; and the tokens of this are to be seen to this very day.
- lines:
  - rag.15.1
  - rag.15.1
  text: Now it is to be said that Ragnar was sitting at home in his kingdom, and he knew not where his sons were, or his wife Randalin.
- lines:
  - rag.15.2
  - rag.15.2
  text: He heard all men tell tales of his sons, saying that none might be compared with them, and he thought that surely none were so celebrated.
- lines:
  - rag.15.3
  - rag.15.3
  text: He reflected how he might win fame for himself, which would be no less lasting than theirs.
- lines:
  - rag.15.4
  - rag.15.4
  text: He bethought him of a plan; then he summoned wrights and had them cut down trees for two large merchant ships;
- lines:
  - rag.15.5
  - rag.15.5
  text: men saw that these were so great that their like had never been made in the Northlands. Therewith he gathered a great store of weapons out of his kingdom,
- lines:
  - rag.15.6
  - rag.15.6
  text: and from this change folk perceived that he intended to go on a raid outside his land.
- lines:
  - rag.15.7
  - rag.15.7
  text: This was talked about far and wide in the countries near by,
- lines:
  - rag.15.8
  - rag.15.8
  text: and the people and all the kings who ruled there feared that they could not remain in their realms;
- lines:
  - rag.15.9
  - rag.15.9
  text: and all of them had a watch kept in the land to see if he would attack them.
- lines:
  - rag.15.10
  - rag.15.10
  text: On a certain time Randalin asked Ragnar whither he intended to go.
- lines:
  - rag.15.11
  - rag.15.11
  text: He told her he wished to go to England with no more than the two ships, and such men as could sail on them.
- lines:
  - rag.15.12
  - rag.15.12
  text: 'She said, “This trip of thine seems unwise to me:'
- lines:
  - rag.15.13
  - rag.15.13
  text: methinks it were better if thou hadst more ships, and smaller.”
- lines:
  - rag.15.14
  - rag.15.14
  text: “It is no glory at all,” said he, “to conquer a land with many ships,
- lines:
  - rag.15.15
  - rag.15.15
  text: but there is no example of one who conquered a land like England with two ships.
- lines:
  - rag.15.16
  - rag.15.16
  text: But if I am beaten, it is all the better that I have taken fewer ships with me.”
- lines:
  - rag.15.17
  - rag.15.17
  text: Then Randalin answered, “It seems to me none the less expensive, by the time these ships are built, than if thou hadst many warships for thy trip.
- lines:
  - rag.15.18
  - rag.15.18
  text: But thou knowest it is a hard thing to sail to England in ships, and if it should chance that they are lost, thy men must be surrendered even if they reach the shore, in case the ruler of the land
    should come upon them. It is far better to enter harbors in ships of war than in large merchant-ships.”
- lines:
  - rag.15.19
  - rag.15.19
  text: 'Then Ragnar spoke a verse:'
- lines:
  - rag.15.20
  - rag.15.27
  text: |-
    “The bravest prince needs gold for his men,
    But treasure avails him less than his thanes;
    The red gold rings help little in battle,
    Many kings are dead whose gold remains.”
- lines:
  - rag.15.28
  - rag.15.28
  text: He had his ships prepared and his men gathered, so that his vessels were heavily charged.
- lines:
  - rag.15.29
  - rag.15.29
  text: There was great talk concerning his plan.
- lines:
  - rag.15.30
  - rag.15.30
  text: 'He spoke another verse:'
- lines:
  - rag.15.31
  - rag.15.38
  text: |-
    “What chatter resounds from the cliff-side, wife,
    That I leave my ships, the snakes of the sea?
    Nay, if the gods but will it, the deed shall be done
    As I have planned it, unflinchingly!”
- lines:
  - rag.15.39
  - rag.15.39
  text: When the ships were ready, together with all the men who were to follow him, and the weather seemed favorable to him, Ragnar said that he would embark.
- lines:
  - rag.15.40
  - rag.15.40
  text: When he had prepared himself, his wife accompanied him to the ships.
- lines:
  - rag.15.41
  - rag.15.41
  text: Before he parted from his wife she said she wished to repay him for the shift that he had once given her.
- lines:
  - rag.15.42
  - rag.15.42
  text: He asked her in what manner that might be;
- lines:
  - rag.15.43
  - rag.15.43
  text: 'and she spoke this stave:'
- lines:
  - rag.15.44
  - rag.15.51
  text: |-
    “Gladly I give thee this gray-hued shirt
    Woven of hair, without seam or hem:
    Within it no blade can cut thee or wound
    By the grace of the gods: it was hallowed to them.”
- lines:
  - rag.15.52
  - rag.15.52
  text: He said he would accept this device of her.
- lines:
  - rag.15.53
  - rag.15.53
  text: When they parted it could be easily seen that she took it much to heart.
- lines:
  - rag.15.54
  - rag.15.54
  text: Now Ragnar sailed to England, as he had intended.
- lines:
  - rag.15.55
  - rag.15.55
  text: He met with a sharp wind, which wrecked both his ships on the coast of England, but all his men came ashore with their clothing and weapons,
- lines:
  - rag.15.56
  - rag.15.56
  text: and wherever he came upon a village or burg or castle, he captured it.
- lines:
  - rag.15.57
  - rag.15.57
  text: The king who was then ruling in England was called Ella.
- lines:
  - rag.15.58
  - rag.15.58
  text: He had heard of the departure of Ragnar from his own country,
- lines:
  - rag.15.59
  - rag.15.59
  text: and had posted certain men who were to let him know if the army came into his land.
- lines:
  - rag.15.60
  - rag.15.60
  text: These men now came to Ella and brought him tidings of war.
- lines:
  - rag.15.61
  - rag.15.61
  text: Thereupon he sent out a summons through all his realm and bade every man come to him who could bear a shield and ride a horse, and had the courage to fight; and he gathered so great an army that
    it was wonderful to see.
- lines:
  - rag.15.62
  - rag.15.62
  text: Then Ella and his men made ready for war.
- lines:
  - rag.15.63
  - rag.15.63
  text: He said to them, “If we win the victory in this battle, and ye are aware that Ragnar is present,
- lines:
  - rag.15.64
  - rag.15.64
  text: ye shall not turn your weapons against him, for he has sons who would never leave us in peace if he fell.”
- lines:
  - rag.15.65
  - rag.15.65
  text: Ragnar also prepared himself for battle, and he had the shirt which Randalin had given him at parting in place of a byrnie, and in his hand the spear with which he slew the dragon lying about Thora’s
    hall, as none other dared do; and he had no armor on save his helmet.
- lines:
  - rag.15.66
  - rag.15.66
  text: When the two sides met, they fell to fighting.
- lines:
  - rag.15.67
  - rag.15.67
  text: Ragnar had by far the smaller host,
- lines:
  - rag.15.68
  - rag.15.68
  text: and the battle had not endured long before many of his men were slain.
- lines:
  - rag.15.69
  - rag.15.69
  text: Wherever he went his foes grew weak before him. He charged through the ranks often that day, and wherever he laid about him or hewed upon shields,
- lines:
  - rag.15.70
  - rag.15.70
  text: byrnies or helmets, his blows were so mighty that nothing could resist him.
- lines:
  - rag.15.71
  - rag.15.71
  text: But howsoever they struck or shot at him, no weapon harmed him, and he received no wound, though he slew a great number of King Ella’s men.
- lines:
  - rag.15.72
  - rag.15.72
  text: Yet the end of the battle was that all of Ragnar’s host fell, and he was overborne by shields and captured.
- lines:
  - rag.15.73
  - rag.15.73
  text: Then they asked him who he was, but he remained silent and answered no whit.
- lines:
  - rag.15.74
  - rag.15.74
  text: King Ella said, “This man shall have a greater test of his hardihood put upon him if he will not tell us who he is.
- lines:
  - rag.15.75
  - rag.15.75
  text: Let him be cast into a snake-pit and let him sit there a long time; but if he says aught by which we may know that he is Ragnar, let him be taken out as quickly as may be.”
- lines:
  - rag.15.76
  - rag.15.76
  text: So he was led away, and he sat in the pit a long time, but no snake attached itself to him.
- lines:
  - rag.15.77
  - rag.15.77
  text: Folk said, “This is a very mighty man. No weapons bit him to-day, and now no worms sting him.”
- lines:
  - rag.15.78
  - rag.15.78
  text: Then Ella bade them strip off the garment that he wore uppermost. This was done and straightway all the snakes hung upon him with all their might.
- lines:
  - rag.15.79
  - rag.15.79
  text: Then said Ragnar, “The young pigs would grumble if they knew what the old one is suffering.”
- lines:
  - rag.15.80
  - rag.15.80
  text: But although he said this, they did not certainly know that he was Ragnar rather than another king.
- lines:
  - rag.15.81
  - rag.15.81
  text: 'Then he spoke a verse:'
- lines:
  - rag.15.82
  - rag.15.89
  text: |-
    “To many men I brought bitter bale,
    And one and fifty battles I’ve fought;
    My bane I did not expect from a worm,
    But fate is oft not the thing we thought.”
- lines:
  - rag.15.90
  - rag.15.90
  text: 'And again he spoke:'
- lines:
  - rag.15.91
  - rag.15.98
  text: |-
    “My young ones would snarl if they knew my fate
    (There is torment enow as my life is bled);
    Fiercely the fangs of the snakes strike home—
    Among the beasts I shall soon lie dead.”
- lines:
  - rag.15.99
  - rag.15.99
  text: With that he gave up his life, and so he was carried away.
- lines:
  - rag.15.100
  - rag.15.100
  text: But King Ella suspected that it was Ragnar who had died there.
- lines:
  - rag.15.101
  - rag.15.101
  text: He pondered how he might discover this, and contrive to hold his kingdom, and find out what reply the sons of Ragnar might make when they heard the tale.
- lines:
  - rag.15.102
  - rag.15.102
  text: He decided to have a ship made ready and well manned, and put in charge of it a prudent and hardy man,
- lines:
  - rag.15.103
  - rag.15.103
  text: and told him that he wished to send them to Ivar and his brothers to report their father’s death to them.
- lines:
  - rag.15.104
  - rag.15.104
  text: But this journey seemed very unpromising to most men, so that but few wished to undertake it.
- lines:
  - rag.15.105
  - rag.15.105
  text: Then said the King, “Give careful attention to the manner in which each of the brothers is moved by these tidings.
- lines:
  - rag.15.106
  - rag.15.106
  text: Depart thereafter according as ye have favoring wind.”
- lines:
  - rag.15.107
  - rag.15.107
  text: He prepared their journey in such wise that they wanted for nothing;
- lines:
  - rag.15.108
  - rag.15.108
  text: and thereafter they went away, and their voyage was successful.
- lines:
  - rag.15.109
  - rag.15.109
  text: The sons of Ragnar had been harrying in the southern realms at this time;
- lines:
  - rag.15.110
  - rag.15.110
  text: and now they turned north, intending to visit their kingdom, where Ragnar ruled.
- lines:
  - rag.15.111
  - rag.15.111
  text: They knew nothing of the outcome of his raid, but great was their curiosity to know the end of it.
- lines:
  - rag.15.112
  - rag.15.112
  text: They journeyed across the land from the south,
- lines:
  - rag.15.113
  - rag.15.113
  text: and wherever folk heard of their coming, they destroyed their own burgs and fled away, taking their gods with them, so that the brothers could scarce find meat for their men.
- lines:
  - rag.15.114
  - rag.15.114
  text: 'One morning Bjorn Ironside awoke and said a verse:'
- lines:
  - rag.15.115
  - rag.15.122
  text: |-
    “The raven flies boldly each day by the burg,
    Yet it cries that of hunger it’s like to die;
    Over sandy ways let it fly to the south,
    And feast where the slain of our battles lie.”
- lines:
  - rag.15.123
  - rag.15.123
  text: 'And again he spoke:'
- lines:
  - rag.15.124
  - rag.15.131
  text: |-
    “First we fared to the Roman realm
    And little food had the fighters then;
    With my sword I smote many gray-beards dead,
    And the eagle screamed over slaughtered men.”
- lines:
  - rag.16.1
  - rag.16.1
  text: Now it happened that they reached Denmark before the messengers of King Ella, and they abode there quietly with their men.
- lines:
  - rag.16.2
  - rag.16.2
  text: But the messengers and their band came to the burg where Ragnar’s sons were being feasted; they entered the hall where they were drinking and approached the high-seat in which Ivar lay.
- lines:
  - rag.16.3
  - rag.16.3
  text: Sigurd Snake-in-the-Eye and Hvitserk sat at chess, but Bjorn Ironside was sharpening a spear-shaft on the floor of the hall.
- lines:
  - rag.16.4
  - rag.16.4
  text: When the messengers came before Ivar they gave him worthy greeting;
- lines:
  - rag.16.5
  - rag.16.5
  text: he received their greetings and asked them whence they came and what news they had to tell.
- lines:
  - rag.16.6
  - rag.16.6
  text: He who led them replied that they were Englishmen, and King Ella had sent them thither to report the fall of their father Ragnar.
- lines:
  - rag.16.7
  - rag.16.7
  text: At that word Hvitserk and Sigurd dropped their chess, and hearkened closely to these tidings;
- lines:
  - rag.16.8
  - rag.16.8
  text: Bjorn was standing in the midst of the floor and leaning upon his spear-shaft.
- lines:
  - rag.16.9
  - rag.16.9
  text: But Ivar asked them very carefully by what chance he had lost his life.
- lines:
  - rag.16.10
  - rag.16.10
  text: They told him everything, from the time Ragnar had reached England until his death.
- lines:
  - rag.16.11
  - rag.16.11
  text: And when the tale reached the point where he said “my young ones would snarl,” Bjorn grasped his spear-shaft so hard that the imprint of his hand could be seen upon it afterwards.
- lines:
  - rag.16.12
  - rag.16.12
  text: When the messengers had finished their report he shook it so that it broke in two pieces.
- lines:
  - rag.16.13
  - rag.16.13
  text: Hvitserk was holding a piece of chess that he had moved and he squeezed it so tightly that blood burst out under each finger-nail.
- lines:
  - rag.16.14
  - rag.16.14
  text: Sigurd Snake-in-the-Eye had been holding a knife and cutting his nails as the story was told; and so intently did he listen that he gave no heed before the knife had gone as deep as the bone, and
    he flinched no whit.
- lines:
  - rag.16.15
  - rag.16.15
  text: But Ivar asked about the whole thing very fully; only his face was red and blue by turns, and by starts he grew very pale, and his entire skin was swollen up with the fierceness that was in his
    breast.
- lines:
  - rag.16.16
  - rag.16.16
  text: Then Hvitserk spoke, and said that they could take most speedy revenge by slaying the messengers of King Ella.
- lines:
  - rag.16.17
  - rag.16.17
  text: Ivar said, “That shall not be.
- lines:
  - rag.16.18
  - rag.16.18
  text: They shall depart in peace, wheresoever they will; and if they lack aught let them tell it me, so that I may give it to them.”
- lines:
  - rag.16.19
  - rag.16.19
  text: And now that they had discharged their errand they left the hall and went to their ships.
- lines:
  - rag.16.20
  - rag.16.20
  text: When they had a favoring breeze they put out to sea, and they had a good journey until they reached King Ella and told him how each of the brothers had received the tidings.
- lines:
  - rag.16.21
  - rag.16.21
  text: When King Ella heard that, he said, “Likely it is that we must needs fear Ivar, or else none other, according to what is said of him; they all have stout hearts; but we must contrive to hold our
    realm against them.”
- lines:
  - rag.16.22
  - rag.16.22
  text: And he had a watch set throughout all his kingdom so that no army could come upon him unawares.
- lines:
  - rag.16.23
  - rag.16.23
  text: But when the messengers had departed from the brothers, they parleyed together and discussed how they might best gain revenge for their father Ragnar.
- lines:
  - rag.16.24
  - rag.16.24
  text: Then Ivar said, “I shall have no part in it and give no men, since it went with Ragnar even as I foresaw.
- lines:
  - rag.16.25
  - rag.16.25
  text: 'From the beginning he went about the matter ill:'
- lines:
  - rag.16.26
  - rag.16.26
  text: he had no quarrel with King Ella; and it has often happened that when a man stubbornly determines to do a wrongful thing he has his downfall thereby.
- lines:
  - rag.16.27
  - rag.16.27
  text: I will take a payment of King Ella if he will offer it me.”
- lines:
  - rag.16.28
  - rag.16.28
  text: When his brothers heard that they became very angry, and said they would never suffer such a disgrace, although he might wish it.
- lines:
  - rag.16.29
  - rag.16.29
  text: “Many people would say that our hands are lying all too unused upon our knees, if we do not avenge our father. Yet we have harried far and wide in the world and slain many an innocent man.
- lines:
  - rag.16.30
  - rag.16.30
  text: It shall not be so! Rather let us make ready every ship that is seaworthy in Denmark,
- lines:
  - rag.16.31
  - rag.16.31
  text: and gather so many troops that every man who is able to bear shield against King Ella shall go with us.”
- lines:
  - rag.16.32
  - rag.16.32
  text: But Ivar said he would leave all the ships he commanded, save the one that he owned himself.
- lines:
  - rag.16.33
  - rag.16.33
  text: And when it was heard that he took no interest in the affair, the brothers obtained far fewer men, but they set out none the less.
- lines:
  - rag.16.34
  - rag.16.34
  text: When they reached England King Ella was warned, and at once he had his trumpets blown and all men summoned who would follow him.
- lines:
  - rag.16.35
  - rag.16.35
  text: Thus he gathered so large a host that none could count it, and so he set out against the brothers.
- lines:
  - rag.16.36
  - rag.16.36
  text: Ivar was not there when they met in battle;
- lines:
  - rag.16.37
  - rag.16.37
  text: the end of it was that the sons of Ragnar took to flight, and King Ella had the victory.
- lines:
  - rag.16.38
  - rag.16.38
  text: While he was pursuing the host, Ivar said that it was not his intent to return home;
- lines:
  - rag.16.39
  - rag.16.39
  text: “I will try instead whether King Ella will show me some honor or not; it seems better to me to accept payment than to fare again as we have done just now.”
- lines:
  - rag.16.40
  - rag.16.40
  text: Hvitserk said that he would not share with him, and he would have to proceed with his own affairs as he wished, “but we shall never take money for our father’s death.”
- lines:
  - rag.16.41
  - rag.16.41
  text: Ivar said that he must part with them there, and told them to rule over the kingdom that they had all held together, “but ye shall send me such movable riches as I call for.”
- lines:
  - rag.16.42
  - rag.16.42
  text: After he had said this he bade them farewell,
- lines:
  - rag.16.43
  - rag.16.43
  text: and he turned his steps thence to King Ella.
- lines:
  - rag.16.44
  - rag.16.44
  text: 'When he appeared before the King he gave him worthy greeting and thus addressed him: “I have come to thee to sue for reconciliation with thee and for such honor as thou wilt grant me.'
- lines:
  - rag.16.45
  - rag.16.45
  text: I see now that I am no match for thee, and it seems better to me to take from thee such honor as thou wilt offer me than to lose the lives of more of my men, or mayhap of myself, before thee.”
- lines:
  - rag.16.46
  - rag.16.46
  text: King Ella answered, “Some men say it is not a good thing to trust thee, and thou speakest oft fair when thy thought is treacherous; it will be hard for us to guard ourselves against thee and thy
    brothers.”
- lines:
  - rag.16.47
  - rag.16.47
  text: “I ask thee for but little; if thou wilt grant it,
- lines:
  - rag.16.48
  - rag.16.48
  text: I shall swear thee an oath never to fight against thee.”
- lines:
  - rag.16.49
  - rag.16.49
  text: Then the King asked what payment he wished.
- lines:
  - rag.16.50
  - rag.16.50
  text: '“I will,” said Ivar, “that thou give me as much of thy land as an ox-hide extends over, and a foundation-wall to be built about it:'
- lines:
  - rag.16.51
  - rag.16.51
  text: no more do I ask, and I see that thou wilt do me little honor if thou wilt not grant me that.”
- lines:
  - rag.16.52
  - rag.16.52
  text: “I do not know that that would do us any harm,” said the King, “even though thou didst have so much of our land, and of a surety I will give it thee
- lines:
  - rag.16.53
  - rag.16.53
  text: if thou wilt swear not to fight against me; and I do not fear thy brothers if thou art but true to me.”
- lines:
  - rag.17.1
  - rag.17.1
  text: Now it was so agreed among them that Ivar should swear never to shoot against the King and never to give counsel for his injury, and in return he should have as much of England as was covered by
    the largest ox-hide he could find.
- lines:
  - rag.17.2
  - rag.17.2
  text: Then Ivar took the hide of an old bull and had it softened and thrice stretched.
- lines:
  - rag.17.3
  - rag.17.3
  text: This he had cut up as narrow as possible, and he let it be drawn out, the hairy side and the fleshy side separate;
- lines:
  - rag.17.4
  - rag.17.4
  text: when this was done the strip was marvellously long, far longer than anyone had thought.
- lines:
  - rag.17.5
  - rag.17.5
  text: He had it stretched out on a field, and the land within was wide enough for a very great burg, and outside he had the ground marked for the foundation of mighty castle walls.
- lines:
  - rag.17.6
  - rag.17.6
  text: Then he summoned many wrights and had many houses built on that field, and a great burg was raised that is now called Londonburg.
- lines:
  - rag.17.7
  - rag.17.7
  text: It is the greatest and most famed in all the northland.
- lines:
  - rag.17.8
  - rag.17.8
  text: When he had caused this burg to be built he had surrendered all his movable wealth therefor;
- lines:
  - rag.17.9
  - rag.17.9
  text: for he was so openhanded that he gave with both hands, and he was thought so wise that all folk sought his counsel and advice in difficult matters.
- lines:
  - rag.17.10
  - rag.17.10
  text: All these he settled in such wise that each man was most pleased. And he grew so well liked that all were his friends;
- lines:
  - rag.17.11
  - rag.17.11
  text: he was of great help to King Ella in the government of the land, and the King left to him many affairs and cases, and did not need to manage them himself.
- lines:
  - rag.17.12
  - rag.17.12
  text: When Ivar had attained so much of his purpose that he was sure of peace for himself, he sent men to his brothers to ask them for as much gold and silver as he wished.
- lines:
  - rag.17.13
  - rag.17.13
  text: When these men reached the brothers they told their errand, and also reported how his affairs had progressed, for men did not know upon what schemes he was brooding.
- lines:
  - rag.17.14
  - rag.17.14
  text: So the brothers decided that he no longer had his former nature.
- lines:
  - rag.17.15
  - rag.17.15
  text: They sent him as much treasure as he asked for;
- lines:
  - rag.17.16
  - rag.17.16
  text: and when this reached Ivar, he gave it to all of the strongest men in the land, and thus gained for himself the followers of King Ella. They all promised him to remain inactive although he should
    go to war there in England.
- lines:
  - rag.17.17
  - rag.17.17
  text: When Ivar had thus won over the men, he sent messengers to his brothers to tell them that he wished them to levy ships and men from all the lands they ruled over, and to call upon every man they
    could get.
- lines:
  - rag.17.18
  - rag.17.18
  text: And when they received these tidings they quickly saw that he must think they were likely to gain the victory now.
- lines:
  - rag.17.19
  - rag.17.19
  text: They gathered a host throughout all Denmark and Gautland and all the realms that they had power over. They assembled warriors without number, until their levy was complete.
- lines:
  - rag.17.20
  - rag.17.20
  text: Then they set sail for England and journeyed by day and night, for they wished news of them to get about as late as possible.
- lines:
  - rag.17.21
  - rag.17.21
  text: This was reported to King Ella,
- lines:
  - rag.17.22
  - rag.17.22
  text: and he too gathered men, but obtained very few, since Ivar had won over much of his host.
- lines:
  - rag.17.23
  - rag.17.23
  text: Now Ivar came before Ella and told him that he wished to fulfill the oath he had sworn.
- lines:
  - rag.17.24
  - rag.17.24
  text: “I cannot control the deeds of my brothers, but I may contrive to meet them and find out if they will halt their army and do no more ill than they have already wrought.”
- lines:
  - rag.17.25
  - rag.17.25
  text: Ivar went to his brothers and urged them eagerly to proceed as best they might and let it come to a battle as quickly as possible, “for the King has far fewer forces than ye,” he said.
- lines:
  - rag.17.26
  - rag.17.26
  text: They answered that he did not need to urge them, and that their intent was the same as before.
- lines:
  - rag.17.27
  - rag.17.27
  text: Thereafter Ivar went to meet King Ella, and told him that they were much too violent and mad to listen to his words,
- lines:
  - rag.17.28
  - rag.17.28
  text: “and when I tried to bring about peace between thee and them, they shouted against it.
- lines:
  - rag.17.29
  - rag.17.29
  text: Now I would fain fulfill my oath not to fight against thee, but remain quiet with my men, let the battle fare as it may.”
- lines:
  - rag.17.30
  - rag.17.30
  text: Soon after that, King Ella and his folk saw the army of the brothers, and it approached marvellously fast.
- lines:
  - rag.17.31
  - rag.17.31
  text: Then said Ivar, “It is now time, O King, to draw up thy host, for I suspect that they will make a fierce attack upon thee for a while.”
- lines:
  - rag.17.32
  - rag.17.32
  text: When the two sides encountered there was a great battle, and the sons of Ragnar charged fiercely through the ranks of King Ella, and so violent were they that they thought only to wreak as much
    slaughter as they could; and the combat was both fierce and long.
- lines:
  - rag.17.33
  - rag.17.33
  text: And this time the end of it was that King Ella and his men took to flight, but he was captured.
- lines:
  - rag.17.34
  - rag.17.34
  text: Ivar was near by at that time, and he said that they should thus devise his death. “It is now the time,” said he, “to remember the death he gave our father.
- lines:
  - rag.17.35
  - rag.17.35
  text: Let a skilled wood-carver mark out an eagle on his back as deep as may be, and let that eagle be reddened with his blood.”
- lines:
  - rag.17.36
  - rag.17.36
  text: The man who was called to do this work did as Ivar commanded him. King Ella was very sore before it was completed.
- lines:
  - rag.17.37
  - rag.17.37
  text: He died thereafter, and the brothers thought now that they had avenged their father.
- lines:
  - rag.17.38
  - rag.17.38
  text: Ivar said he would give them the kingdom that they formerly had together, for he wished to rule over England.
- lines:
  - rag.18.1
  - rag.18.1
  text: After that Hvitserk and Bjorn and Sigurd went home to their kingdom, but Ivar remained behind and ruled in England.
- lines:
  - rag.18.2
  - rag.18.2
  text: From that time they kept their armies together less often, and harried in various different lands.
- lines:
  - rag.18.3
  - rag.18.3
  text: Randalin, their mother, was now an old woman.
- lines:
  - rag.18.4
  - rag.18.4
  text: One time her son Hvitserk had been warring in Russian parts, and so mighty was the force against him that he could not resist, but was captured by them.
- lines:
  - rag.18.5
  - rag.18.5
  text: He chose as his manner of death that he should be burnt on a pyre of dead men’s skulls; and so he died.
- lines:
  - rag.18.6
  - rag.18.6
  text: 'When Randalin heard that she spoke a stave:'
- lines:
  - rag.18.7
  - rag.18.14
  text: |-
    “One of my sons is slain in the East,
    Hvitserk, who never fled from his foes;
    He was burned on the heads of slaughtered men;
    Before he fell, this death he chose.”
- lines:
  - rag.18.15
  - rag.18.15
  text: 'And again she spoke:'
- lines:
  - rag.18.16
  - rag.18.23
  text: |-
    “On many men’s skulls he took his place,
    And bade that the fire should sing at his bane;
    On what better couch can a warrior lie?
    A prince overcame him; he died with fame.”
- lines:
  - rag.18.24
  - rag.18.24
  text: 'A great line is descended of Sigurd Snake-Eye:'
- lines:
  - rag.18.25
  - rag.18.25
  text: his daughter was called Ragnhild, mother of Harald Fair-Hair, who was the first to reign alone over Norway.
- lines:
  - rag.18.26
  - rag.18.26
  text: Ivar ruled over England until his death, which came from illness.
- lines:
  - rag.18.27
  - rag.18.27
  text: While he was lying in his last sickness he bade folk lay him where the land was most exposed to war; he said he did not expect any of those who might there come ashore to gain a victory.
- lines:
  - rag.18.28
  - rag.18.28
  text: When he died they did as he had said, and he was laid in a burial-mound.
- lines:
  - rag.18.29
  - rag.18.29
  text: And many men say that when Harald, Sigurd’s son, came to England he reached the place where Ivar lay; and on that raid he fell.
- lines:
  - rag.18.30
  - rag.18.30
  text: And when William the Bastard came to the land he went there and broke open Ivar’s mound and saw him there quite unrotted.
- lines:
  - rag.18.31
  - rag.18.31
  text: He had a great pyre made and caused Ivar to be burnt on it. After that he warred on the country and gained victory over it.
- lines:
  - rag.18.32
  - rag.18.32
  text: 'Many men are descended from Bjorn Ironside:'
- lines:
  - rag.18.33
  - rag.18.33
  text: one of these was Thord, who dwelt at Hofdi on Hofdastrand, a very great chieftain.
- lines:
  - rag.18.34
  - rag.18.34
  text: When all the sons of Ragnar were dead, the host that had followed them was scattered far and wide; and none of those who had been with Ragnar’s sons thought there was any value in other princes.
- lines:
  - rag.18.35
  - rag.18.35
  text: There were two of them who journeyed far and wide throughout the land to look for some prince whom they might think it was no disgrace to serve; but they did not travel together.
- lines:
  - rag.19.1
  - rag.19.1
  text: It happened out in a certain land that a king had two sons; he fell ill and died, and the two sons wished to hold a funeral feast for him.
- lines:
  - rag.19.2
  - rag.19.2
  text: They invited to the banquet all men who should hear of it in the space of the three following winters.
- lines:
  - rag.19.3
  - rag.19.3
  text: This was reported far and near.
- lines:
  - rag.19.4
  - rag.19.4
  text: For the three winters between they made ready for the feast.
- lines:
  - rag.19.5
  - rag.19.5
  text: When the summer for the feast came, and the time that had been appointed, so many men were gathered there that no one had ever seen the like; many large halls were made ready and many tents outside.
- lines:
  - rag.19.6
  - rag.19.6
  text: When the first evening was far spent a man came to the hall;
- lines:
  - rag.19.7
  - rag.19.7
  text: he was tall beyond all others, and it could be seen from his dress that he had been with noble men.
- lines:
  - rag.19.8
  - rag.19.8
  text: When he entered the hall he went before the brothers and addressed them, and asked them where they would have him sit.
- lines:
  - rag.19.9
  - rag.19.9
  text: They were pleased with the stranger, and told him to sit on the upper bench.
- lines:
  - rag.19.10
  - rag.19.10
  text: He required the space of two men.
- lines:
  - rag.19.11
  - rag.19.11
  text: When he had sat down they brought drink to him, as to the others; but no horn was so great that he did not empty it at one draught, and it appeared to all that he valued the rest of them very little.
- lines:
  - rag.19.12
  - rag.19.12
  text: Now it befell that a second man came to this feast.
- lines:
  - rag.19.13
  - rag.19.13
  text: He was rather larger than the first;
- lines:
  - rag.19.14
  - rag.19.14
  text: he had a wide hat like the first one,
- lines:
  - rag.19.15
  - rag.19.15
  text: and when he came before the throne of the young kings, he greeted them courteously, and asked them where he should sit.
- lines:
  - rag.19.16
  - rag.19.16
  text: They told him to sit farther in on the upper bench.
- lines:
  - rag.19.17
  - rag.19.17
  text: He went to his place; and both of the strangers were so large that five men arose to make room for them.
- lines:
  - rag.19.18
  - rag.19.18
  text: He who came first was the lesser man at drinking;
- lines:
  - rag.19.19
  - rag.19.19
  text: but the second one drank so fast that he almost poured the ale into himself at a draught from each of the horns, yet it could not be seen that he grew drunk; rather he appeared discontented with
    his fellows on the bench and turned his back to them.
- lines:
  - rag.19.20
  - rag.19.20
  text: He who came first bade him join him in a game, “and I shall lead,” said he.
- lines:
  - rag.19.21
  - rag.19.21
  text: 'He thrust against the other with his hand, and spoke this verse:'
- lines:
  - rag.19.22
  - rag.19.29
  text: |-
    “I bid thee, tell us the deeds thou hast done:
    Hast thou seen the raven gorged with the slain?
    More often thou hast sat and fed in the hall
    Than feasted the bird of war on the plain!”
- lines:
  - rag.19.30
  - rag.19.30
  text: 'Now it appeared to him who sat on the outside that he was challenged by this verse, and he spoke a stave in reply:'
- lines:
  - rag.19.31
  - rag.19.38
  text: |-
    “Be silent, thou who hast clung to thy home!
    In none of thy deeds hast thou outdone me.
    Thou never gavest wolves to eat and drink—
    What is the thing that troubles thee?”
- lines:
  - rag.19.39
  - rag.19.39
  text: 'He who came first replied:'
- lines:
  - rag.19.40
  - rag.19.47
  text: |-
    “Over the surf our strong ship sailed,
    Under shining byrnies our bodies bled;
    The wolf’s mouth gaped for the men we slew,
    Gold we won, and eagles we fed.”
- lines:
  - rag.19.48
  - rag.19.48
  text: 'Then spoke the one who came second:'
- lines:
  - rag.19.49
  - rag.19.56
  text: |-
    “Where went thou when we launched our ship,
    The steed of the waves, on the flowing sea?
    When we turned its prow again to the land,
    It’s little then that I saw of thee.”
- lines:
  - rag.19.57
  - rag.19.57
  text: 'Again the first one said:'
- lines:
  - rag.19.58
  - rag.19.65
  text: |-
    “Unfitting it is that we quarrel here
    Over which was the better man in his day;
    I stood by the prow as the ship rode ashore—
    Thou by the mast as it sailed away.”
- lines:
  - rag.19.66
  - rag.19.66
  text: 'The second one answered:'
- lines:
  - rag.19.67
  - rag.19.74
  text: |-
    “Both of us fought with Ragnar and Bjorn;
    Heroes we were, unknown to blench!
    From Bulgarland battle I’ve wounds in my side:
    Comrade, move farther in on thy bench.”
- lines:
  - rag.19.75
  - rag.19.75
  text: Thus they recognized each other at last, and remained together at the feast.
- lines:
  - rag.20.1
  - rag.20.1
  text: Ogmund was the name of a man who was called the Dane.
- lines:
  - rag.20.2
  - rag.20.2
  text: One time he set out with five ships and anchored by Samsey in Munarvag harbor.
- lines:
  - rag.20.3
  - rag.20.3
  text: It is said that his cooks went ashore to make ready the meat, and the other men betook them to the woods to amuse themselves.
- lines:
  - rag.20.4
  - rag.20.4
  text: There they found an ancient man of wood, forty ells high and overgrown with moss. They could still see all his features,
- lines:
  - rag.20.5
  - rag.20.5
  text: and they wondered amongst themselves who could have sacrificed to that great idol.
- lines:
  - rag.20.6
  - rag.20.6
  text: 'Then the man of wood spoke:'
- lines:
  - rag.20.7
  - rag.20.14
  text: |-
    “Long time since the sea-king’s sons
    Launched their ships and came this way,
    Over sea-paths hither sailing;
    I have dwelt here since that day.
- lines:
  - rag.20.15
  - rag.20.22
  text: |-
    “Mighty warriors, Lodbrok’s sons,
    Raised me by the sea-side then;
    Me upon this shore they worshipped—
    Prayed me for the bane of men;
- lines:
  - rag.20.23
  - rag.20.30
  text: |-
    “Bade me stand beside this thorn-bush,
    Moss-grown, while this strand may last;
    Neither flesh nor garment clothes me—
    On me beats the cold rain-blast.”
- lines:
  - rag.20.31
  - rag.20.31
  text: This seemed very wonderful to them, and they told about it afterwards to other men.
