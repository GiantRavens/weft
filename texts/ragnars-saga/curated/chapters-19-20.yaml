# Human overlay for Ragnars saga loðbrókar chapters 19-20 (rag.19.*, rag.20.*). Lemmas follow Zoëga, A Concise
# Dictionary of Old Icelandic (1910), in normalized spelling; transparent poetic compounds (sækitík, harðmeldr,
# brandahjörtr, brandagnýr, hlunnalungr, svarðmerðlingr, vesallátr) are lemmatized as compounds, as the Krákumál
# overlays do; morphology in Universal Dependencies features; frequent forms after the shared convention table
# for ragnars-saga and ragnarssona-thattr. Chapter 19: the six flyting stanzas of the two old champions
# (rag.19.22-29, 31-38, 40-47, 49-56, 58-65, 67-74) are in skaldic measure close to dróttkvætt without regular
# hendingar, as in Krákumál: odd line two staves, even line one head-stave. Stanzas 2 to 4 are obscure in
# places (the editorial translation marks them with [?]); the analysis there is the most probable reading of
# the printed text and is flagged in the line notes. Chapter 20: the wooden man's three stanzas (rag.20.7-30)
# are Eddic fornyrðislag; each gen line is a half-line, written with the a/b prefixes. Kennings are glossed
# word by word and named in the line notes.
