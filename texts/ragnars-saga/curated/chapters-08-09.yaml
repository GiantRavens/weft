# Human overlay for Ragnars saga loðbrókar chapters 8 and 9 (rag.8.*, rag.9.*): the taking of Hvítabær and
# Rögnvaldr's death, Björn's stanza; Eysteinn and the cow Síbilja, Áslaug's disclosure of her birth, the birth of
# Sigurðr ormr í auga and Ragnarr's three stanzas on him. Lemmas follow Zoëga, A Concise Dictionary of Old
# Icelandic (1910), in normalized Old Norse spelling; morphology uses Universal Dependencies features; frequent
# forms follow the shared convention table (conventions.tsv), with departures noted on the line.
# All four stanzas are in skaldic measure close to dróttkvætt (six-syllable lines, some longer, paired by
# alliteration: the odd line with two staves, the even line with a head-stave). Vowels alliterate with each other.
# Kennings are glossed word by word; the notes layer resolves them. Names take the fixed English forms of the
# convention table; Gnípafjörðr and Hvítabær take the English layer's Gnipafjord and Hvitabaer.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
