# Human overlay for Ragnars saga loðbrókar chapter 10 (rag.10.*). Lemmas follow Zoëga, A Concise Dictionary of
# Old Icelandic (1910), in normalized spelling; morphology in Universal Dependencies features, written in the
# compact spec and expanded by weft overlay; frequent forms after the shared convention table (rag/conventions.tsv).
# All twelve verses are in skaldic measure close to dróttkvætt without regular hendingar, as in Krákumál: odd line
# two staves, even line one head-stave; vowels alliterate with each other. Seven of them also stand in
# Ragnarssona þáttr chapter 2 and are annotated as there (rsons.2.20-85). Kennings are glossed word by word.
# The cow Síbilja is a feminine thing in the convention table: hún, hennar, sínum glossed it, its, its-own.
