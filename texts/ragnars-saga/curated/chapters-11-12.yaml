# (1910), in the edition's normalized spelling; morphology uses Universal Dependencies features through the overlay
# shorthand. The forms follow the shared convention table (rag/conventions.tsv) and its rules R1-R11. Departures,
# flagged with a note in the spec: (1) forms the table lists as adverbs used here as adjectives (víst predicative,
# illa accusative of illr after the free article); (2) stund in "hver stund á er lögð" glossed "effort" (leggja stund
# á); (3) er after annathvárt glossed "that" (it opens the content clause); (4) a dative of possession (á hrygg kúnni)
