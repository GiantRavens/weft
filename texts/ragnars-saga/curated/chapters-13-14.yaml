# Human overlay for Ragnars saga loðbrókar chapters 13 and 14 (rag.13.*, rag.14.*): the siege of Vífilsborg and the
# turn back from Luna. Both chapters are prose only; neither carries a verse line, so no staves or metre are given.
# Lemmas follow Zoëga, A Concise Dictionary of Old Icelandic (1910), in the edition's normalized spelling; morphology
# uses Universal Dependencies features through the overlay shorthand. Frequent forms follow the shared convention
# table (conventions.tsv) and its rules R1-R11; names take its fixed English forms, and the places not in its list
# take the forms of the English layer (sense/weft-editorial.yaml): Suðrríki "the-Southern-Realms", Vífilsborg
# "Vifilsborg", Lúna "Luna", Rómaborg and Róm "Rome". Departures, flagged in the spec:
# (1) a dative of possession (mér after a body part) glossed "my" rather than "to-me";
# (2) einn after its noun as an indefinite "a, a certain" (maðr einn) coded NUM rather than A "alone";
# (3) því before a comparative (því firr sem) glossed "the" (dative of measure);
# (4) a demonstrative after its noun and before a relative (völlum þeim, er) coded as the determiner Dd;
# (5) stranded or object-less prepositions (sigr í, bera at, brjóta á) coded ADV.
