# Human overlay for Ragnars saga loðbrókar chapters 17 and 18 (rag.17.*, rag.18.*): Ivar's ox-hide town, the fall of
# Ella, the death of Hvitserk with Randalin's two verses (rag.18.7-14, rag.18.16-23), and the descendants of the sons.
# Lemmas follow Zoëga, A Concise Dictionary of Old Icelandic (1910), in the edition's normalized spelling; morphology
# uses Universal Dependencies features through the overlay shorthand. Frequent forms follow the shared convention
# table (conventions.tsv) and its rules R1-R11; names take its fixed English forms; places not in its list take the
# forms of the English layer (sense/weft-editorial.yaml): Austrvegr "the-East-Way", Höfði "Hofdi", Höfðaströnd
# "Hofdastrond". Both verses are in skaldic measure close to dróttkvætt without regular hendingar, as in Krákumál:
# odd line two staves, even line one head-stave. Kennings are glossed word by word; the notes layer resolves them.
# Compounds absent from Zoëga as headwords (uxahúð, öldungshúð, borgarvídd, mannahöfuð, þróttarsnjallr, böðheggr)
# take the compound as lemma. Departures from the table carry a line note in the spec (sp-saga-17-18.yaml); on verse
# lines the note is carried into the metre string.
