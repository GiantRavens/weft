  lead: 'The Tale of Ragnarr Loðbrók (Old Norse: Ragnars saga loðbrókar) is an Icelandic legendary saga
    of the 13th century about the Viking ruler Ragnar loðbrók. It is first found in the same manuscript
    as Vǫlsunga saga, which it immediately follows. The tale covers the origin of Áslaug, Ragnarr''s quest
    for the hand of Þóra borgarhjǫrtr, his later marriage to Áslaug, the deeds of their sons (and Áslaug)
    in battle, and Ragnarr''s death at the hands of king Ælla of Northumbria.'
