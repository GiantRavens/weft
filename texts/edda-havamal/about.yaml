  lead: Hávamál ("Words of Hávi [the High One]" in Old Norse) is presented as a single poem in the Codex
    Regius, a collection of Old Norse poems from the Viking age. A scholarly estimate of Hávamál's age
    dates the poem to between 900 and 1000 A.D. The poem, itself a combination of numerous shorter poems,
    is largely gnomic, presenting advice for living, proper conduct and wisdom. It is considered an important
    source of Old Norse philosophy.
