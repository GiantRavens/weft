# Verbatim from sources/thorpe1866.txt; see manifest for the edition.
translation: thorpe1866
aligned_by: hand, phase 0; one span per stanza (prose); stanzas 2-75 and 78-80 by content, one span per stanza (2026-10-01); stanzas 81-164 by content, one span per stanza, Thorpe's numbering mapped to
  the standard (2026-10-04)
spans:
- lines:
  - hav.1.1
  - hav.1.7
  text: All door-ways, before going forward, should be looked to; for difficult it is to know where foes may sit within a dwelling.
- lines:
  - hav.2.1
  - hav.2.6
  text: 'Givers, hail! A guest is come in: where shall he sit? In much haste is he, who on the ways has to try his luck.'
- lines:
  - hav.3.1
  - hav.3.6
  text: Fire is needful to him who is come in, and whose knees are frozen; food and raiment a man requires, wheo'er the fell has travelled.
- lines:
  - hav.4.1
  - hav.4.6
  text: Water to him is needful who for refection comes, a towel and hospitable invitation, a good reception; if he can get it, discourse and answer.
- lines:
  - hav.5.1
  - hav.5.6
  text: 'Wit is needful to him who travels far: at home all is easy. A laughing-stock is he who nothing knows, and with the instructed sits.'
- lines:
  - hav.6.1
  - hav.6.9
  text: Of his understanding no one should be proud, but rather in conduct cautious. When the prudent and taciturn come to a dwelling, harm seldom befalls the cautious; for a firmer friend no man ever gets
    than great sagacity.
- lines:
  - hav.7.1
  - hav.7.6
  text: 'A wary guest, who to refection comes, keeps a cautious silence, with his ears listens, and with his eyes observes: so explores every prudent man.'
- lines:
  - hav.8.1
  - hav.8.6
  text: 'He is happy, who for himself obtains fame and kind words: less sure is that which a man must have in another''s breast.'
- lines:
  - hav.9.1
  - hav.9.6
  text: He is happy, who in himself possesses fame and wit while living; for bad counsels have oft been received from another's breast.
- lines:
  - hav.10.1
  - hav.10.6
  text: A better burthen no man bears on the way than much good sense; that is thought better than riches in a strange place; such is the recourse of the indigent.
- lines:
  - hav.11.1
  - hav.11.6
  text: A worse provision on the way he cannot carry than too much beer-bibbing; so good is not, as it is said, beer for the sons of men.
- lines:
  - hav.12.1
  - hav.12.6
  text: 'A worse provision no man can take from table than too much beer-bibbing: for the more he drinks the less control he has of his own mind.'
- lines:
  - hav.13.1
  - hav.13.6
  text: Oblivion's heron 'tis called that over potations hovers; he steals the minds of men. With this bird's pinions I was fettered in Gunnlods dwelling.
- lines:
  - hav.14.1
  - hav.14.6
  text: Drunk I was, I was over-drunk, at that cunning Fialar's. It's the best drunkenness, when every one after it regains his reason.
- lines:
  - hav.15.1
  - hav.15.6
  text: Taciturn and prudent, and in war daring, should a king's children be; joyous and liberal every one should be until his hour of death.
- lines:
  - hav.16.1
  - hav.16.6
  text: A cowardly man thinks he will ever live, if warfare he avoids; but old age will give him no peace, though spears may spare him.
- lines:
  - hav.17.1
  - hav.17.6
  text: A fool gapes when to a house he comes, to himself mutters or is silent; but all at once, if he gets drink, then is the man's mind displayed.
- lines:
  - hav.18.1
  - hav.18.6
  text: He alone knows who wanders wide, and has much experienced, by what disposition each man is ruled, who common sense possesses.
- lines:
  - hav.19.1
  - hav.19.6
  text: Let a man hold the cup, yet of the mead drink moderately, speak sensibly or be silent. As of a fault no man will admonish thee, if thou goest betimes to sleep.
- lines:
  - hav.20.1
  - hav.20.6
  text: A greedy man, if he be not moderate, eats to his mortal sorrow. Oftentimes his belly draws laughter on a silly man, who among the prudent comes.
- lines:
  - hav.21.1
  - hav.21.6
  text: Cattle know when to go home, and then from grazing cease; but a foolish man never knows his stomach's measure.
- lines:
  - hav.22.1
  - hav.22.6
  text: 'A miserable man, and ill-conditioned, sneers at every thing: one thing he knows not, which he ought to know, that he is not free from faults.'
- lines:
  - hav.23.1
  - hav.23.6
  text: A foolish man is all night awake, pondering over everything; he then grows tired; and when morning comes, all is lament as before.
- lines:
  - hav.24.1
  - hav.24.6
  text: A foolish man thinks all who on him smile to be his friends; he feels it not, although they speak ill of him, when he sits among the clever.
- lines:
  - hav.25.1
  - hav.25.6
  text: A foolish man thinks all who speak him fair to be his friends; but he will find, if into court he comes, that he has few advocates.
- lines:
  - hav.26.1
  - hav.26.6
  text: A foolish man thinks he knows everything if placed in unexpected difficulty; but he knows not what to answer, if to the test he is put.
- lines:
  - hav.27.1
  - hav.27.9
  text: A foolish man, who among people comes, had best be silent; for no one knows that he knows nothing, unless he talks too much. He who previously knew nothing will still know nothing, talk he ever
    so much.
- lines:
  - hav.28.1
  - hav.28.6
  text: He thinks himself wise, who can ask questions and converse also; conceal his ignorance no one can, because it circulates among men.
- lines:
  - hav.29.1
  - hav.29.6
  text: He utters too many futile words who is never silent; a garrulous tongue, if it be not checked, sings often to its own harm.
- lines:
  - hav.30.1
  - hav.30.6
  text: For a gazing-stock no man shall have another, although he come a stranger to his house. Many a one thinks himself wise, if he is not questioned, and can sit in a dry habit.
- lines:
  - hav.31.1
  - hav.31.6
  text: Clever thinks himself the guest who jeers a guest, if he takes to flight. Knows it not certainly he who prates at meat, whether he babbles among foes.
- lines:
  - hav.32.1
  - hav.32.6
  text: Many men are mutually well-disposed, yet at table will torment each other. That strife will ever be; guest will guest irritate.
- lines:
  - hav.33.1
  - hav.33.6
  text: Early meals a man should often take, unless to a friend's house he goes; else he will sit and mope, will seem half-famished, and can of few things inquire.
- lines:
  - hav.34.1
  - hav.34.6
  text: Long is and indirect the way to a bad friend's, though by the road he dwell; but to a good friend's the paths lie direct, though he be far away.
- lines:
  - hav.35.1
  - hav.35.6
  text: A guest should depart, not always stay in one place. The welcome becomes unwelcome, if he too long continues in another's house.
- lines:
  - hav.36.1
  - hav.36.6
  text: One's own house is best, small though it be; at home is every one his own master. Though he but two goats possess, and a straw-thatched cot, even that is better than begging.
- lines:
  - hav.37.1
  - hav.37.6
  text: One's own house is best, small though it be, at home is every one his own master. Bleeding at heart is he, who has to ask for food at every meal-tide.
- lines:
  - hav.38.1
  - hav.38.6
  text: Leaving in the field his arms, let no man go a foot's length forward; for it is hard to know when on the way a man may need his weapon.
- lines:
  - hav.39.1
  - hav.39.6
  text: I have never found a man so bountiful, or so hospitable that he refused a present; or of his property so liberal that he scorned a recompense.
- lines:
  - hav.40.1
  - hav.40.6
  text: Of the property which he has gained no man should suffer need; for the hated oft is spared what for the dear was destined. Much goes worse than is expected.
- lines:
  - hav.41.1
  - hav.41.6
  text: With arms and vestments friends should each other gladden, those which are in themselves most sightly. Givers and requiters are longest friends, if all [else] goes well.
- lines:
  - hav.42.1
  - hav.42.6
  text: To his friend a man should be a friend, and gifts with gifts requite. Laughter with laughter men should receive, but leasing with lying.
- lines:
  - hav.43.1
  - hav.43.6
  text: To his friend a man should be a friend; to him and to his friend; but of his foe no man shall the friend's friend be.
- lines:
  - hav.44.1
  - hav.44.6
  text: Know, if thou hast a friend whom thou fully trustest, and from whom thou woulds't good derive, thou shouldst blend thy mind with his, and gifts exchange, and often go to see him.
- lines:
  - hav.45.1
  - hav.45.6
  text: If thou hast another, whom thou little trustest, yet wouldst good from him derive, thou shouldst speak him fair, but think craftily, and leasing pay with lying.
- lines:
  - hav.46.1
  - hav.46.6
  text: 'But of him yet further, whom thou little trustest, and thou suspectest his affection; before him thou shouldst laugh, and contrary to thy thoughts speak: requital should the gift resemble.'
- lines:
  - hav.47.1
  - hav.47.6
  text: I was once young, I was journeying alone, and lost my way; rich I thought myself, when I met another. Man is the joy of man.
- lines:
  - hav.48.1
  - hav.48.6
  text: Liberal and brave men live best, they seldom cherish sorrow; but a base-minded man dreads everything; the niggardly is uneasy even at gifts.
- lines:
  - hav.49.1
  - hav.49.6
  text: 'My garments in a field I gave away to two wooden men: heroes they seemed to be, when they got cloaks: exposed to insult is a naked man.'
- lines:
  - hav.50.1
  - hav.50.6
  text: 'A tree withers that on a hill-top stands; protects it neither bark nor leaves: such is the man whom no one favours: why should he live long?'
- lines:
  - hav.51.1
  - hav.51.6
  text: Hotter than fire love for five days burns between false friends; but is quenched when the sixth day comes, and-friendship is all impaired.
- lines:
  - hav.52.1
  - hav.52.6
  text: Something great is not [always] to be given, praise is often for a trifle bought. With half a loaf and a tilted vessel I got myself a comrade.
- lines:
  - hav.53.1
  - hav.53.6
  text: 'Little are the sand-grains, little the wits, little the minds of [some] men; for all men are not wise alike: men are everywhere by halves.'
- lines:
  - hav.54.1
  - hav.54.6
  text: 'Moderately wise should each one be, but never over-wise: of those men the lives are fairest, who know much well.'
- lines:
  - hav.55.1
  - hav.55.6
  text: Moderately wise should each one be, but never over-wise; for a wise man's heart is seldom glad, if he is all-wise who owns it.
- lines:
  - hav.56.1
  - hav.56.6
  text: Moderately wise should each one be, but never over-wise. His destiny let know no man beforehand; his mind will be freest from' care.
- lines:
  - hav.57.1
  - hav.57.6
  text: Brand burns from brand until it is burnt out; fire is from fire quickened. Man to' man becomes known by speech, but a fool by his bashful silence.
- lines:
  - hav.58.1
  - hav.58.6
  text: He should early rise, who another's property or wife desires to have. Seldom a sluggish wolf gets prey, or a sleeping man victory.
- lines:
  - hav.59.1
  - hav.59.6
  text: Early should rise he who has few workers, and go his work to see to; greatly is he retarded who sleeps the morn away. Wealth half depends on energy.
- lines:
  - hav.60.1
  - hav.60.6
  text: Of dry planks and roof-shingles a man knows the measure; of the fire-wood that may suffice, both measure and time.
- lines:
  - hav.61.1
  - hav.61.7
  text: Washed and refected let a man ride to the Thing, although his garments be not too good; of his shoes and breeches let no one be ashamed, nor of his horse, although he have not a good one.
- lines:
  - hav.62.1
  - hav.62.6
  text: Gasps and gapes, when to the sea he comes, the eagle over old ocean; so is a man, who among many comes, and has few advocates.
- lines:
  - hav.63.1
  - hav.63.6
  text: Inquire and impart should every man of sense, who will be accounted sage. Let one only know, a second may not; if three, all the world knows.
- lines:
  - hav.64.1
  - hav.64.6
  text: His power should every sagacious man use with discretion; for he will find, when among the bold he comes, that no one alone is doughtiest.
- lines:
  - hav.65.1
  - hav.65.4
  text: Circumspect and reserved every man should be, and wary in trusting friends. Of the words that a man says to another he often pays the penalty.
- lines:
  - hav.66.1
  - hav.66.6
  text: 'Much too early I came to many places, but too late to others: the beer was drunk, or not ready: the disliked seldom hits the moment.'
- lines:
  - hav.67.1
  - hav.67.6
  text: Here and there I should have been invited, if I a meal had needed; or two hams had hung, at that true friend's, where of one I had eaten.
- lines:
  - hav.68.1
  - hav.68.6
  text: Fire is best among the sons of men, and the sight of the sun, if his health a man can have, with a life free from vice.
- lines:
  - hav.69.1
  - hav.69.6
  text: 'No man lacks everything, although his health be bad: one in his sons is happy, one in his kin, one in abundant wealth, one in his good works.'
- lines:
  - hav.70.1
  - hav.70.6
  text: It is better to live, even to live miserably; a living man can always get a cow. I saw fire consume the rich man's property, and death stood without his door.
- lines:
  - hav.71.1
  - hav.71.6
  text: 'The halt can ride on horseback, the one-handed drive cattle; the deaf fight and be useful: to be blind is better than to be burnt no one gets good from a corpse.'
- lines:
  - hav.72.1
  - hav.72.6
  text: A son is better, even if born late, after his father's departure. Gravestones seldom stand by the way-side unless raised by a kinsman to a kinsman.
- lines:
  - hav.73.1
  - hav.73.4
  text: 'Two are adversaries: the tongue is the bane of the head: under every cloak I expect a hand. * * *'
- lines:
  - hav.74.1
  - hav.74.7
  text: At night is joyful he who is sure of travelling entertainment. [A ship's yards are short.] Variable is an autumn night. Many are the weather's changes in five days, but more in a month.
- lines:
  - hav.75.1
  - hav.75.6
  text: 'He [only] knows not who knows nothing, that many a one apes another. One man is rich, another poor: let him not be thought blameworthy.'
- lines:
  - hav.76.1
  - hav.76.6
  text: Cattle die, kindred die, we ourselves also die; but the fair fame never dies of him who has earned it.
- lines:
  - hav.77.1
  - hav.77.6
  text: Cattle die, kindred die, we ourselves also die; but I know one thing that never dies,--judgment on each one dead.
- lines:
  - hav.78.1
  - hav.78.6
  text: 'Full storehouses I saw at Dives'' sons'': now bear they the beggar''s staff. Such are riches; as is the twinkling of an eye: of friends they are most fickle.'
- lines:
  - hav.79.1
  - hav.79.6
  text: 'A foolish man, if he acquires wealth or woman''s love, pride grows within him, but wisdom never: he goes on more and more arrogant.'
- lines:
  - hav.80.1
  - hav.80.6
  text: Then 'tis made manifest, if of runes thou questionest him, those to the high ones known, which the great powers invented, and the great talker painted, that he had best hold silence.
- lines:
  - hav.81.1
  - hav.81.6
  text: At eve the day is to be praised, a woman after she is burnt, a sword after it is proved, a maid after she is married, ice after it has passed away, beer after it is drunk.
- lines:
  - hav.82.1
  - hav.82.8
  text: 'In the wind one should hew wood, in a breeze row out to sea, in the dark talk with a lass: many are the eyes of day. In a ship voyages are to be made, but a shield is for protection, a sword for
    striking, but a damsel for a kiss.'
- lines:
  - hav.83.1
  - hav.83.6
  text: By the fire one should drink beer, on the ice slide; buy a horse that is lean, a sword that is rusty; feed a horse at home, but a dog at the farm.
- lines:
  - hav.84.1
  - hav.84.6
  text: In a maiden's words no one should place faith, nor in what a woman says; for on a turning wheel have their hearts been formed, and guile in their breasts been laid;
- lines:
  - hav.85.1
  - hav.85.8
  text: In a creaking bow, a burning flame, a yawning wolf, a chattering crow, a grunting swine, a rootless tree, a waxing wave, a boiling kettle,
- lines:
  - hav.86.1
  - hav.86.8
  text: A flying dart, a falling billow, a one night's ice, a coiled serpent, a woman's bed-talk, or a broken sword, a bear's play, or a royal child,
- lines:
  - hav.87.1
  - hav.87.4
  text: A sick calf, a self-willed thrall, a flattering prophetess, a corpse newly slain, [a serene sky, a laughing lord, a barking dog, and a harlot's grief];
- lines:
  - hav.88.1
  - hav.88.6
  text: 'An early sown field let no one trust, nor prematurely in a son: weather rules the field, and wit the son, each of which is doubtful;'
- lines:
  - hav.89.1
  - hav.89.8
  text: A brother's murderer, though on the high road met, a half-burnt house, an over-swift horse, (a horse is useless, if a leg be broken), no man is so confiding as to trust any of these.
- lines:
  - hav.90.1
  - hav.90.10
  text: Such is the love of women, who falsehood meditate, as if one drove not rough-shod, on slippery ice, a spirited two-years old and unbroken horse; or as in a raging storm a helmless ship is beaten;
    or as if the halt were set to catch a reindeer in the thawing fell.[21]
- lines:
  - hav.91.1
  - hav.91.6
  text: 'Openly I now speak, because I both sexes know: unstable are men''s minds towards women; ''tis then we speak most fair when we most falsely think: that deceives even the cautious.'
- lines:
  - hav.92.1
  - hav.92.6
  text: Fair shall speak, and money offer, who would obtain a woman's love. Praise the form of a fair damsel; he gets who courts her.
- lines:
  - hav.93.1
  - hav.93.6
  text: 'At love should no one ever wonder in another: a beauteous countenance oft captivates the wise, which captivates not the foolish.'
- lines:
  - hav.94.1
  - hav.94.6
  text: Let no one wonder at another's folly, it is the lot of many. All-powerful desire makes of the sons of men fools even of the wise.
- lines:
  - hav.95.1
  - hav.95.6
  text: The mind only knows what lies near the heart, that alone is conscious of our affections. No disease is worse to a sensible man than not to be content with himself.
- lines:
  - hav.96.1
  - hav.96.6
  text: 'That I experienced, when in the reeds I sat, awaiting my delight. Body and soul to me was that discreet maiden: nevertheless I possess her not.'
- lines:
  - hav.97.1
  - hav.97.6
  text: Billing's lass[22] on her couch I found, sun-bright, sleeping. A prince's joy to me seemed naught, if not with that form to live.
- lines:
  - hav.98.1
  - hav.98.6
  text: '"Yet nearer eve must thou, Odin, come, if thou wilt talk the maiden over; all will be disastrous, unless we alone are privy to such misdeed."'
- lines:
  - hav.99.1
  - hav.99.6
  text: I returned, thinking to love, at her wise desire. I thought I should obtain her whole heart and love.
- lines:
  - hav.100.1
  - hav.100.6
  text: 'When next I came the bold warriors were all awake, with lights burning, and bearing torches: thus was the way to pleasure closed.'
- lines:
  - hav.101.1
  - hav.101.6
  text: But at the approach of morn, when again I came, the household all was sleeping; the good damsel's dog alone I found tied to the bed.
- lines:
  - hav.102.1
  - hav.102.9
  text: 'Many a fair maiden, when rightly known, towards men is fickle: that I experienced, when that discreet maiden I strove to seduce: contumely of every kind that wily girl heaped upon me; nor of that
    damsel gained I aught.'
- lines:
  - hav.103.1
  - hav.103.9
  text: 'At home let a man be cheerful, and towards a guest liberal; of wise conduct he should be, of good memory and ready speech; if much knowledge he desires, he must often talk on good.


    Fimbulfambi he is called who'' little has to say: such is the nature of the simple.'
- lines:
  - hav.104.1
  - hav.104.6
  text: 'The old Jotun I sought; now I am come back: little got I there by silence; in many words I spoke to my advantage in Suttung''s halls.'
- lines:
  - hav.105.1
  - hav.105.7
  text: Gunnlod gave me, on her golden seat, a draught of the precious mead; a bad recompense I afterwards made her, for her whole soul, her fervent love.
- lines:
  - hav.106.1
  - hav.106.6
  text: 'Rati''s mouth I caused to make a space, and to gnaw the rock; over and under me were the Jotun''s ways: thus I my head did peril.'
- lines:
  - hav.107.1
  - hav.107.6
  text: 'Of a well-assumed form I made good use: few things fail the wise; for Odhrærir is now come up to men''s earthly dwellings.'
- lines:
  - hav.108.1
  - hav.108.6
  text: '''Tis to me doubtful that I could have come from the Jotun''s courts, had not Gunnlod aided me, that good damsel, over whom I laid my arm.'
- lines:
  - hav.109.1
  - hav.109.7
  text: 'On the day following came the Hrimthursar, to learn something of the High One, in the High One''s hall: after Bolverk they inquired, whether he with the gods were come, or Suttung had destroyed
    him?'
- lines:
  - hav.110.1
  - hav.110.6
  text: Odin, I believe, a ring-oath[23] gave. Who in his faith will trust? Suttung defrauded, of his drink bereft, and Gunnlod made to weep!
- lines:
  - hav.111.1
  - hav.111.11
  text: 'Time ''tis to discourse from the preacher''s chair. By the well of Urd I silent sat, I saw and meditated, I listened to men''s words.


    Of runes I heard discourse, and of things divine, nor of graving them were they silent, nor of sage counsels, at the High One''s hall. In the High One''s hall. I thus heard say:'
- lines:
  - hav.112.1
  - hav.112.7
  text: 'I counsel thee, Loddfafnir, to take advice: thou wilt profit if thou takest it. Rise not at night, unless to explore, or art compelled to go out.'
- lines:
  - hav.113.1
  - hav.113.7
  text: I counsel thee, Loddfafnir, to take advice, thou wilt profit if thou takest it. In an enchantress's embrace thou mayest not sleep, so that in her arms she clasp thee.
- lines:
  - hav.114.1
  - hav.114.6
  text: She will be the cause that thou carest not for Thing or prince's words; food thou wilt shun and human joys; sorrowful wilt thou go to sleep.
- lines:
  - hav.115.1
  - hav.115.7
  text: I counsel thee, etc. Another's wife entice thou never to secret converse.
- lines:
  - hav.116.1
  - hav.116.7
  text: I counsel thee, etc. By fell or firth if thou have to travel, provide thee well with food.
- lines:
  - hav.117.1
  - hav.117.10
  text: I counsel thee, etc. A bad man let thou never know thy misfortunes; for from a bad man thou never wilt obtain a return for thy good will.
- lines:
  - hav.118.1
  - hav.118.6
  text: I saw mortally wound a man a wicked woman's words; a false tongue caused his death, and most unrighteously.
- lines:
  - hav.119.1
  - hav.119.10
  text: I counsel thee, etc. If thou knowest thou hast a friend, whom thou well canst trust, go oft to visit him; for with brushwood over-grown, and with high grass, is the way that no one treads.
- lines:
  - hav.120.1
  - hav.120.7
  text: I counsel thee, etc. A good man attract to thee in pleasant converse; and salutary speech learn while thou livest.
- lines:
  - hav.121.1
  - hav.121.10
  text: I counsel thee, etc. With thy friend be thou never first to quarrel. Care gnaws the heart, if thou to no one canst thy whole mind disclose.
- lines:
  - hav.122.1
  - hav.122.7
  text: I counsel thee, etc. Words thou never shouldst exchange with a witless fool;
- lines:
  - hav.123.1
  - hav.123.6
  text: For from an ill-conditioned man thou wilt never get a return for good; but a good man will bring thee favour by his praise.
- lines:
  - hav.124.1
  - hav.124.6
  text: There is a mingling of affection, where one can tell another all his mind. Everything is better than being with the deceitful. He is not another's friend who ever says as he says.
- lines:
  - hav.125.1
  - hav.125.8
  text: 'I counsel thee, etc. Even in three words quarrel not with a worse man: often the better yields, when the worse strikes.'
- lines:
  - hav.126.1
  - hav.126.10
  text: I counsel thee, etc. Be not a shoemaker, nor a shaftmaker, unless for thyself it be; for a shoe if ill made, or a shaft if crooked, will call down evil on thee.
- lines:
  - hav.127.1
  - hav.127.7
  text: I counsel thee, etc. Wherever of injury thou knowest, regard that injury as thy own; and give to thy foes no peace.
- lines:
  - hav.128.1
  - hav.128.7
  text: I counsel thee, etc. Rejoiced at evil be thou never; but let good give thee pleasure.
- lines:
  - hav.129.1
  - hav.129.9
  text: I counsel thee, etc. In a battle look not up, (like swine the sons of men then become) that men may not fascinate thee.
- lines:
  - hav.130.1
  - hav.130.10
  text: 'If thou wilt induce a good woman to pleasant converse, thou must promise fair, and hold to it: no one turns from good if it can be got.'
- lines:
  - hav.131.1
  - hav.131.10
  text: I enjoin thee to be wary, but not over wary; at drinking be thou most wary, and with another's wife; and thirdly, that thieves delude thee not.
- lines:
  - hav.132.1
  - hav.132.7
  text: With insult or derision treat thou never a guest or wayfarer. They often little know, who sit within, of what race they are who come.
- lines:
  - hav.133.1
  - hav.133.6
  text: Vices and virtues the sons of mortals bear in their breasts mingled; no one is so good that no failing attends him, nor so bad as to be good for nothing.
- lines:
  - hav.134.1
  - hav.134.12
  text: At a hoary speaker laugh thou never; often is good that which the aged utter, oft from a shriveled hide discreet words issue; from those whose skin is pendent and decked with scars, and who go tottering
    among the vile.
- lines:
  - hav.135.1
  - hav.135.7
  text: I counsel thee, etc. Rail not at a guest, nor from thy gate thrust him; treat well the indigent; they will speak well of thee.
- lines:
  - hav.136.1
  - hav.136.6
  text: Strong is the bar that must be raised to admit all. Do thou give a penny, or they will call down on thee every ill in thy limbs.
- lines:
  - hav.137.1
  - hav.137.15
  text: 'I counsel thee, etc. Wherever thou beer drinkest, invoke to thee the power of earth; for earth is good against drink, fire for distempers, the oak for constipation, a corn-ear for sorcery, a hall
    for domestic strife. In bitter hates invoke the moon; the biter for bite-injuries is good; but runes against calamity; fluid let earth absorb. FOOTNOTES: [Footnote 14: Odin is the "High One." The poem
    is a collection of rules and maxims, and stories of himself, some of them not very consistent with our ideas of a supreme deity.] [Footnote 15: In the Copenhagen paper Ms. F. this strophe begins with
    the following three lines:-- Wit is needful to him who travels far: harm seldom befalls the wary: They are printed in the Stockholm edition of the original Afzelius and Bask, and in the Swedish translation
    by Afzelius.] [Footnote 16: The sense of this line seems doubtful; I have adopted the version of Finn Magnusen.] [Footnote 17: The public meeting.] [Footnote 18: That is dead on the funeral pyre.] [Footnote
    19: This line is evidently an interpolation.] [Footnote 20: Odin.] [Footnote 21: From this line it appears that the poem is of Norwegian or Swedish origin, as the reindeer was unknown in Iceland before
    the middle of the 18th century, when it was Introduced by royal command.] [Footnote 22: The story of Odin and Billing''s daughter is no longer extant; but compare the story of Odin and Rinda in Saxo,
    p. 126, edit. Muller & Veleschow.] [Footnote 23: In the pagan North oaths were taken on a holy ring or bracelet, as with us on the Gospels, a sacred ring being kept in the temple for the purpose.] ODIN''S
    RUNE-SONG.[24]'
- lines:
  - hav.138.1
  - hav.138.9
  text: I know that I hung, on a wind-rocked tree, nine whole nights, with a spear wounded, and to Odin offered, myself to myself; on that tree, of which no one knows from what root it springs.
- lines:
  - hav.139.1
  - hav.139.6
  text: Bread no one gave me, nor a horn of drink, downward I peered, to runes applied myself, wailing learnt them, then fell down thence.
- lines:
  - hav.140.1
  - hav.140.6
  text: Potent songs nine from the famed son I learned of Bolthorn, Bestla's sire, and a draught obtained of the precious mead, drawn from Odhrærir.
- lines:
  - hav.141.1
  - hav.141.7
  text: 'Then I began to bear fruit, and to know many things, to grow and well thrive: word by word I sought out words, fact by fact I sought out facts.'
- lines:
  - hav.142.1
  - hav.142.7
  text: 'Runes thou wilt find, and explained characters, very large characters, very potent characters, which the great speaker depicted, and the high powers formed, and the powers'' prince graved:'
- lines:
  - hav.143.1
  - hav.143.5
  text: 'Odin among the Æsir, but among the Alfar, Dain, and Dvalin for the dwarfs, Asvid for the Jotuns: some I myself graved.'
- lines:
  - hav.144.1
  - hav.144.8
  text: Knowest thou how to grave them? knowest thou how to expound them? knowest thou how to depict them? knowest thou how to prove them? knowest thou how to pray? knowest thou how to offer? knowest thou
    how to send?[25] knowest thou how to consume?
- lines:
  - hav.145.1
  - hav.145.9
  text: '''Tis better not to pray than too much offer; a gift ever looks to a return. ''Tis better not to send than too much consume. So Thund graved before the origin of men, where he ascended, to whence
    he afterwards came.'
- lines:
  - hav.146.1
  - hav.146.7
  text: Those songs I know which the king's wife knows not nor son of man. Help the first is called, for that will help thee against strifes and cares.
- lines:
  - hav.147.1
  - hav.147.3
  text: For the second I know, what the sons of men require, who will as leeches live. * * * *
- lines:
  - hav.148.1
  - hav.148.6
  text: 'For the third I know,[26] if I have great need to restrain my foes, the weapons'' edge I deaden: of my adversaries nor arms nor wiles harm aught.'
- lines:
  - hav.149.1
  - hav.149.7
  text: For the fourth I know, if men place bonds on my limbs, I so sing that I can walk; the fetter starts from my feet, and the manacle from my hands.
- lines:
  - hav.150.1
  - hav.150.6
  text: For the fifth I know, if I see a shot from a hostile hand, a shaft flying amid the host, so swift it cannot fly that I cannot arrest it, if only I get sight of it.
- lines:
  - hav.151.1
  - hav.151.6
  text: For the sixth I know, if one wounds me with a green tree's roots;[27] also if a man declares hatred to me, harm shall consume them sooner than me.
- lines:
  - hav.152.1
  - hav.152.6
  text: For the seventh I know, if a lofty house I see blaze o'er its inmates, so furiously it shall not burn that I cannot save it. That song I can sing.
- lines:
  - hav.153.1
  - hav.153.6
  text: 'For the eighth I know, what to all is useful to learn: where hatred grows among the sons of men--that I can quickly assuage.'
- lines:
  - hav.154.1
  - hav.154.6
  text: For the ninth I know, if I stand in need my bark on the water to save, I can the wind on the waves allay, and the sea lull.
- lines:
  - hav.155.1
  - hav.155.7
  text: For the tenth I know, if I see troll-wives sporting in air, I can so operate that they will forsake their own forms, and their own minds.
- lines:
  - hav.156.1
  - hav.156.8
  text: For the eleventh I know, if I have to lead my ancient friends to battle, under their shields I sing, and with power they go safe to the fight, safe from the fight; safe on every side they go.
- lines:
  - hav.157.1
  - hav.157.7
  text: For the twelfth I know, if on a tree I see a corpse swinging from a halter, I can so grave and in runes depict, that the man shall walk, and with me converse.
- lines:
  - hav.158.1
  - hav.158.6
  text: 'For the thirteenth I know, if on a young man I sprinkle water, he shall not fall, though he into battle come: that man shall not sink before swords.'
- lines:
  - hav.159.1
  - hav.159.6
  text: For the fourteenth I know, if in the society of men I have to enumerate the gods, Æsir and Alfar, I know the distinctions of all. This few unskilled can do.
- lines:
  - hav.160.1
  - hav.160.6
  text: For the fifteenth I know what the dwarf Thiodreyrir sang before Delling's doors. Strength he sang to the Æsir, and to the Alfar prosperity, wisdom to Hroptatyr.
- lines:
  - hav.161.1
  - hav.161.6
  text: For the sixteenth I know, if a modest maiden's favour and affection I desire to possess, the soul I change of the white-armed damsel, and wholly turn her mind.
- lines:
  - hav.162.1
  - hav.162.9
  text: For the seventeenth I know, that that young maiden will reluctantly avoid me. These songs, Loddfafnir! thou wilt long have lacked; yet it may be good if thou understandest them, profitable if thou
    learnest them.
- lines:
  - hav.163.1
  - hav.163.9
  text: For the eighteenth I know that which I never teach to maid or wife of man, (all is better what one only knows. This is the closing of the songs) save her alone who clasps me in her arms, or is my
    sister.
- lines:
  - hav.164.1
  - hav.164.8
  text: 'Now are sung the High-one''s songs, in the High-one''s hall, to the sons of men all-useful, but useless to the Jotuns'' sons. Hail to him who has sung them! Hail to him who knows them! May he profit
    who has learnt them! Hail to those who have listened to them! FOOTNOTES: [Footnote 24: The first eight strophes of this composition require an explanation which I am incompetent to afford. They have
    had many interpreters and as many interpretations. The idea of Odin hanging on a tree would seem to have been suggested by what we read of the grove at Upsala, or Sigtuna, in which the victims offered
    to that deity were suspended from the trees. In the guise of an unknown wanderer, Odin may be supposed to have been captured and thus offered to himself. It no doubt refers to some lost legend.] [Footnote
    25: Probably, send them (the runes) forth on their several missions.] [Footnote 26: The miraculous powers here ascribed by Odin to himself bear, in many instances, a remarkable similarity to those attributed
    to him by Snorri.] [Footnote 27: The ancient inhabitants of the North believed that the roots of trees were particularly fitted for hurtful trolldom, or witchcraft, and that wounds caused thereby were
    mortal. In India a similar superstition prevails of the hurtfulness of the roots of trees.] THE LAY OF HYMIR.'
