# Notes for Hávamál. See texts/homer-odyssey/notes for the format.
- id: n.hav.1.1.open
  attach: hav.1.1
  kind: editorial
  status: draft
  text: "Hávamál, 'the sayings of the High One', is a collection of advice attributed to Odin. It opens at a doorway: before entering a hall, look into every corner, because you cannot know who is sitting there."
- id: n.hav.1.1.staves
  attach: hav.1.1.1
  kind: editorial
  status: draft
  text: "Old Norse verse alliterates instead of rhyming. The coloured first letters mark the staves, the matching sounds that bind two half-lines into one long line: Gáttir and gangi. Any vowel alliterates with any other vowel."
- id: n.hav.1.7.fyrir
  attach: hav.1.7.4
  kind: editorial
  status: draft
  text: "Sitja fyrir, literally 'sit before', means to lie in wait, to sit ahead of someone who is coming."
- id: n.hav.76.1.fe
  attach: hav.76.1.2
  kind: editorial
  status: draft
  text: "Fé means cattle and also wealth, since livestock was a primary form of wealth. It is related to English fee, German Vieh and Latin pecus, 'livestock', from which pecunia, 'money', derives."
- id: n.hav.76.4.ordstirr
  attach: hav.76.4.2
  kind: editorial
  status: draft
  text: "Orðstírr is 'word-glory': reputation, the fame carried by what people say of someone. The stanza names three things that die and this one thing that does not."
- id: n.hav.76.bellows
  attach: hav.76.1
  kind: editorial
  status: draft
  text: "Bellows numbers this stanza 77 and the next one 78. His edition counts one stanza differently earlier in the poem. Weft aligns translations by content, not by stanza number."
- id: n.hav.77.6.domr
  attach: hav.77.6.1
  kind: editorial
  status: draft
  text: "Dómr is a judgment or verdict: what others conclude about a person once they are dead. Thorpe keeps it literal, 'judgment on each one dead'. Bellows turns it into 'the fame of a dead man's deeds'."
- id: n.hav.77.repeat
  attach: hav.77.1
  kind: editorial
  status: draft
  text: "The stanza repeats the first three lines of 76 word for word, then gives a different answer to what survives: the judgment passed on the dead, where 76 named a good reputation."
- id: n.hav.gestathattr
  attach: hav.1.1
  kind: editorial
  status: draft
  text: "Stanzas 1 to 80 are usually grouped as the Gestaþáttr, the guest's section: practical advice for a traveller arriving at a strange hall, on watchfulness, speech, drink, friendship and reputation. The rest of Hávamál, not yet on this page, turns to Odin's own stories, the counsels to Loddfáfnir, and the rune and charm stanzas. The divisions are modern; the manuscript runs the poem on without headings."
- id: n.hav.6-interpolation
  attach: hav.6.7
  kind: editorial
  status: draft
  text: "Stanza 6 has three ljóðaháttr groups where most stanzas have two. Bellows puts the last three lines in parentheses as a probable later addition; they restate that a man never has a surer friend than good sense."
- id: n.hav.heron
  attach: hav.13.1
  kind: editorial
  status: draft
  text: "Óminnishegri, 'the heron of forgetfulness', hovers over drinking and steals men's wits. In the next lines the speaker, Odin, says he was fettered by its feathers in the garden of Gunnlöð, and in stanza 14 that he was drunk at the house of Fjalar. Both allude to the theft of the mead of poetry, which Hávamál tells later (stanzas 104 to 110) and Snorri tells in full."
- id: n.hav.33-str
  attach: hav.33.4
  kind: editorial
  status: draft
  text: "The source text prints 'str', which is not a word. The sense and the alliteration require sitr, 'sits': the guest who arrives late for a meal sits and gulps. The printed form is kept as the source has it; the annotation reads it as sitr."
- id: n.hav.47
  attach: hav.47.1
  kind: editorial
  status: draft
  text: "'Young was I once, I walked alone, and lost my way; I thought myself rich when I found another: man is the joy of man.' The last line, maðr er manns gaman, is one of the most quoted in the poem."
- id: n.hav.50
  attach: hav.50.1
  kind: editorial
  status: draft
  text: "The withered fir that stands in a clearing, sheltered by neither bark nor needles, is compared to a man whom no one loves. The gloss of þorp as 'clearing' follows the usual reading; the word later means a farmstead or village."
- id: n.hav.65-lacuna
  attach: hav.65.1
  kind: editorial
  status: draft
  text: "The manuscript has lost the opening of this stanza; the edition marks the gap with dashes, and Bellows prints a row of dots. What survives says that a man often gets repaid for the words he says to another."
- id: n.hav.71
  attach: hav.71.1
  kind: editorial
  status: draft
  text: "Stanzas 70 to 72 argue that it is better to be alive than dead: the lame can ride, the handless herd, the deaf can fight; 'a corpse is of use to no one'. The phrase blindr er betri en brenndr séi, 'better blind than burnt', refers to the burning of the dead on the pyre."
