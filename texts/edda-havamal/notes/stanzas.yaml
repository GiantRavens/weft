# Notes for Hávamál. See texts/homer-odyssey/notes for the format.
- id: n.hav.1.1.open
  attach: hav.1.1
  kind: editorial
  status: draft
  text: "Hávamál, 'the sayings of the High One', is Odin's advice to people. It opens at a doorway: before you walk into a hall, look into every corner, because you cannot know who sits there waiting."
- id: n.hav.1.1.staves
  attach: hav.1.1.1
  kind: editorial
  status: draft
  text: "Old Norse verse alliterates instead of rhyming. The coloured first letters mark the staves, the matching sounds that bind two half-lines into one long line: Gáttir and gangi. Any vowel alliterates with any other vowel."
- id: n.hav.1.7.fyrir
  attach: hav.1.7.4
  kind: editorial
  status: draft
  text: "Sitja fyrir, literally 'sit before', means to lie in wait, to sit ahead of someone who is coming."
- id: n.hav.76.1.fe
  attach: hav.76.1.2
  kind: editorial
  status: draft
  text: "Fé means cattle and also wealth, because cattle were wealth. It is the same word as English fee, German Vieh and Latin pecus, 'livestock', which gave pecunia, 'money'."
- id: n.hav.76.4.ordstirr
  attach: hav.76.4.2
  kind: editorial
  status: draft
  text: "Orðstírr is 'word-glory': the fame that lives in what people say about you. In a stanza where everything dies, it is the one thing that does not."
- id: n.hav.76.bellows
  attach: hav.76.1
  kind: editorial
  status: draft
  text: "Bellows numbers this stanza 77 and the next one 78. His edition counts one stanza differently earlier in the poem. Weft aligns translations by content, not by stanza number."
- id: n.hav.77.6.domr
  attach: hav.77.6.1
  kind: editorial
  status: draft
  text: "Dómr is a judgment or verdict: what others conclude about a person once they are dead. Thorpe keeps it literal, 'judgment on each one dead'. Bellows turns it into 'the fame of a dead man's deeds'."
- id: n.hav.77.repeat
  attach: hav.77.1
  kind: editorial
  status: draft
  text: "The stanza repeats the first three lines of 76 word for word, then changes the ending. The repetition is the point: the same losses, a different thing that survives."
