# Weft edition of two passages of Einstein's 'Ist die Trägheit eines Körpers von seinem Energieinhalt abhängig?'
# (Annalen der Physik 18, 1905, pp. 639-641): the opening, which states the principle of relativity, and the conclusion,
# which states that a body's mass is a measure of its energy content. Text of German Wikisource (Seite:Einstein-
# Energieinhalt.djvu/1 and 3), checked verbatim against the pinned page revisions. verify_strip sets aside the page
# templates, the spaced-type markup round the physicists' names, the footnotes and the <math> tags; the formulas
# are kept as the print sets them (L/V², L/9.10²⁰), declared as corrections of the transcription's TeX, and the
# derivation between the two passages (pp. 639-641, with its displayed equations) is left to a later pilot.
#   t     the word as printed, punctuation attached; a formula is one token (L, L/V²)
#   n     the modern spelling (daß: dass); for a formula or a number, the words a reader says for it
#         (L durch V Quadrat), from which the sound is read; ipa gives the reading outright
#   Weft divides the text at sentences and, in the long sentences, at a clause.
