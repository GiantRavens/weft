# Weft edition of Einstein's 'Ist die Trägheit eines Körpers von seinem Energieinhalt abhängig?'
# (Annalen der Physik 18, 1905, pp. 639-641), the whole paper: the opening, which states the principle of relativity,
# the derivation with its eight displayed equations, and the conclusion, that a body's mass is a measure of its energy content. Text of German Wikisource (Seite:Einstein-
# Energieinhalt.djvu/1 and 3), checked verbatim against the pinned page revisions. verify_strip sets aside the page
# templates, the spaced-type markup round the physicists' names, the footnotes and the <math> tags; the formulas
# of the conclusion are kept as the print sets them (L/V², L/9.10²⁰), declared as corrections of the transcription's
# TeX. A displayed equation is a line of its own ({equation: {tex, say, gloss}}): its TeX, checked against the source,
# the words a German physicist says for it (sounded in both schemes) and an English reading; the page builds MathML.
# An inline symbol (E₀, (ξ,η,ζ)) is a token printed as the paper prints it, with the transcription's TeX as src.
#   t     the word as printed, punctuation attached; a formula is one token (L, L/V²)
#   n     the modern spelling (daß: dass); for a formula or a number, the words a reader says for it
#         (L durch V Quadrat), from which the sound is read; ipa gives the reading outright
#   Weft divides the text at sentences and, in the long sentences, at a clause.
work: einstein-1905-energieinhalt
joiner: ' '
verify_strip: (?s)<noinclude>.*?</noinclude>|\{\{CRef\|\|(?:[^{}]|\{\{[^{}]*\}\})*\}\}|\{\{ss\||\|\.2\}\}|\{\{[^{}]*\}\}|<[^>]+>|'''''
