# Weft's editorial translation, close to the German, one span per passage; draft. V is Einstein's symbol for the speed of light, c in later notation.
translation: weft-editorial
aligned_by: 'hand: one span per passage'
spans:
- lines:
  - ein.intro.1
  - ein.intro.4
  text: 'The results of an electrodynamic investigation I published recently in these Annals lead to a very interesting conclusion, which is to be derived here. I there took as a basis the Maxwell-Hertz
    equations for empty space, together with Maxwell''s expression for the electromagnetic energy of space, and in addition the principle: The laws by which the states of physical systems change are independent
    of which of two coordinate systems, in uniform parallel translational motion relative to each other, these changes of state are referred to (the principle of relativity).'
- lines:
  - ein.schluss.1
  - ein.schluss.9
  text: 'From this equation it follows at once: If a body gives off the energy L in the form of radiation, its mass diminishes by L/V². Here it is evidently inessential that the energy withdrawn from the
    body should pass precisely into energy of radiation, so that we are led to the more general conclusion: The mass of a body is a measure of its energy content; if the energy changes by L, the mass changes
    in the same sense by L/9·10²⁰, when the energy is measured in ergs and the mass in grams. It is not impossible that with bodies whose energy content is variable to a high degree (for example with the
    radium salts) a test of the theory will succeed. If the theory corresponds to the facts, radiation carries inertia between the emitting and the absorbing bodies. Bern, September 1905. (Received 27 September
    1905.)'
