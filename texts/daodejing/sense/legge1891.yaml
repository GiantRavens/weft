# Verbatim from sources/legge1891.txt (Project Gutenberg #216), chapters 1 and 2. Legge's section
# numbers are left out; his parentheses mark words he supplied. No corrections.
translation: legge1891
aligned_by: hand, phase 0
spans:
  - lines: [ddj.1.1, ddj.1.2]
    text: "The Tao that can be trodden is not the enduring and unchanging Tao. The name that can be named is not the enduring and unchanging name."
  - lines: [ddj.1.3, ddj.1.4]
    text: "(Conceived of as) having no name, it is the Originator of heaven and earth; (conceived of as) having a name, it is the Mother of all things."
  - lines: [ddj.1.5, ddj.1.6]
    text: "Always without desire we must be found,\nIf its deep mystery we would sound;\nBut if desire always within us be,\nIts outer fringe is all that we shall see."
  - lines: [ddj.1.7, ddj.1.9]
    text: "Under these two aspects, it is really the same; but as development takes place, it receives the different names. Together we call them the Mystery. Where the Mystery is the deepest is the gate of all that is subtle and wonderful."
  - lines: [ddj.2.1, ddj.2.2]
    text: "All in the world know the beauty of the beautiful, and in doing this they have (the idea of) what ugliness is; they all know the skill of the skilful, and in doing this they have (the idea of) what the want of skill is."
  - lines: [ddj.2.3, ddj.2.8]
    text: "So it is that existence and non-existence give birth the one to (the idea of) the other; that difficulty and ease produce the one (the idea of) the other; that length and shortness fashion out the one the figure of the other; that (the ideas of) height and lowness arise from the contrast of the one with the other; that the musical notes and tones become harmonious through the relation of one with another; and that being before and behind give the idea of one following another."
  - lines: [ddj.2.9, ddj.2.10]
    text: "Therefore the sage manages affairs without doing anything, and conveys his instructions without the use of speech."
  - lines: [ddj.2.11, ddj.2.14]
    text: "All things spring up, and there is not one which declines to show itself; they grow, and there is no claim made for their ownership; they go through their processes, and there is no expectation (of a reward for the results). The work is accomplished, and there is no resting in it (as an achievement)."
  - lines: [ddj.2.15, ddj.2.15]
    text: "The work is done, but how no one can see;\n'Tis this that makes the power not cease to be."
