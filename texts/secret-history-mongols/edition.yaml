# Weft edition of the Secret History of the Mongols, sections 1 to 10: from the blue-grey wolf and
# the fallow doe to the marriage of Dobun Mergen and Alan Qo'a and their two sons.
#
# The text is the Ming transcription (Middle Mongolian written in Chinese characters) as printed by
# Shiratori Kurakichi, Onyaku Mōbun Genchō hishi (Tōyō Bunko, 1943), which reprints the edition of
# Ye Dehui (1908) column for column and adds a romanization. It is checked verbatim against the
# Japanese Wikisource transcription of Shiratori, pinned as sources/shiratori1943-module.lua.
#
# One Weft line is one column of the Ye Dehui print (Shiratori's numbering: juan, leaf, column).
# One token is one word as Shiratori groups it (the Ming gloss stands beside each such group).
#
#   t    the characters, verbatim, without the shoulder marks 中 and 舌, with the small characters at
#        full size; Shiratori's hyphens and the wiki text's variation selectors are set aside
#        (verify_strip). His parentheses, which mark his own corrections, are kept: 不峏罕(合)勒敦
#   pr   the same with the marks: 〈中〉 and 〈舌〉 before the character they stand beside, small
#        characters in angle brackets after the syllable they close
#   pz   the Ming word gloss (旁譯), verbatim as Shiratori prints it (his parentheses are his additions)
#   sh   Shiratori's romanization, verbatim
#   n    Weft's romanization where the rule in weft.mongolian does not give it (see the module)
joiner: " "
verify_in: sources/shiratori1943-module.lua
verify_strip: '\{\{ϴ\|入力者注=(?:[^{}]|\{\{[^{}]*\}\})*\}\}|\{\{ϕ\|L=.\}\}|\{\{ϕ\|R=|(?<=R=.)\}\}|\{\{ϕ\||\|[^{}|]*\|[^{}|]*\}\}|-|[\ufe00-\ufe0f]'
