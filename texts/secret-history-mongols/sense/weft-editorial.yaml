# Weft editorial translation of the Secret History, sections 1-10. Draft, for review. It follows the
# Middle Mongolian closely and keeps the Ming word glosses in view; names are given in the
# romanization of the transliteration row. Words the Mongolian implies but does not say are in
# square brackets.
translation: weft-editorial
aligned_by: hand, phase 0; one span per section
spans:
- lines: [shm.1.1, shm.1.5]
  text: "The origin of Činggis Qaγan. There was a grey-blue wolf, born with his destiny from Heaven above. His wife was a fallow doe. They came, crossing the Tenggis. At the source of the Onan River, at Burqan Qaldun, they made their camp, and born [to them] was Batačiγan."
- lines: [shm.2.1, shm.2.4]
  text: "The son of Batačiγan was Tamača. The son of Tamača was Qoričar Mergen. The son of Qoričar Mergen was A'ujam Boro'ul. The son of A'ujam Boroγul was Sali Qača'u. The son of Sali Qača'u was Yeke Nidün. The son of Yeke Nidün was Simsoči. The son of Simsoči was Qarču."
- lines: [shm.3.1, shm.3.5]
  text: "The son of Qarču was Borjigidai Mergen; he had a wife, Mongγoljin Qo'a. The son of Borjigidai Mergen was Toroγoljin Bayan; he had a wife, Boroγčin Qo'a, a young servant, Boroldai Suyalbi, and two fine geldings, Dayir and Boro. The sons of Toroγoljin were two: Duwa Soqor and Dobun Mergen."
- lines: [shm.4.1, shm.4.2]
  text: "Duwa Soqor had a single eye in the middle of his forehead, and could see across land three stages of migration away."
- lines: [shm.5.1, shm.5.4]
  text: "One day Duwa Soqor went up Burqan Qaldun with his younger brother Dobun Mergen. Looking out from the top of Burqan Qaldun, Duwa Soqor saw a group of people coming down along the Tünggelig stream, migrating and moving in."
- lines: [shm.6.1, shm.6.4]
  text: "He said: \"Among those people who are coming this way, at the front of a black-covered cart, there is a fine girl. If she has not been given to anyone, let me ask for her for you, my younger brother Dobun Mergen.\" And he sent his younger brother Dobun Mergen to see her."
- lines: [shm.7.1, shm.7.3]
  text: "When Dobun Mergen reached those people, there was indeed a girl, beautiful and fine, of great fame and name, called Alan Qo'a, not yet given to anyone."
- lines: [shm.8.1, shm.8.5]
  text: "As for that group of people: Barγudai Mergen, the lord of the Köl Barγujin hollow, had a daughter called Barγujin Qo'a, who had been given to Qorilartai Mergen, a noyan of the Qori Tumad. The girl called Alan Qo'a, born to Qorilartai Mergen of Barγujin Qo'a at Ariγ Usun, in the land of the Qori Tumad, was that girl."
- lines: [shm.9.1, shm.9.8]
  text: "Qorilartai Mergen [had left the Qori Tumad]: in their own land the Qori Tumad had come to forbid one another the hunting grounds for sable and squirrel and fell out over it. He took the clan name Qorilar, and saying \"the land of Burqan Qaldun is good, with game good for hunting\", he came migrating to the lords of Burqan Qaldun, Burqan Bosqaγsan and Sinči Bayan of the Uriangqai. This is how Dobun Mergen came to ask there for Alan Qo'a, the daughter of Qorilartai Mergen of the Qori Tumad, born at Ariγ Usun, and to take her."
- lines: [shm.10.1, shm.10.2]
  text: "Alan Qo'a, having come to Dobun Mergen, bore two sons. They were called Bügünütei and Belgünütei."
