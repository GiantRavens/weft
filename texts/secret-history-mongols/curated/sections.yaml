# Human overlay for the Secret History of the Mongols, sections 1 to 10. No treebank exists for
# Middle Mongolian; lemma, morphology and gloss are hand annotation, draft.
# Lemmas are Middle Mongolian citation forms in Weft's romanization: nouns in the nominative, verbs
# as the bare stem with a hyphen (töre- 'be born'), names as written. The Ming word gloss (旁譯),
# shown in its own row, was the guide for every English gloss; where they differ the note says why.
# Morphology uses Universal Dependencies features. Case=Dat stands for the dative-locative (-a, -e,
# -dur, -tur), Case=Com for the comitative (-lü'e); VerbForm=Converb for the Mongolian converbs
# (-ju, -n, -run); Mood=Cnd for the conditional converb (-'esü), Mood=Purposive for -re, and
# Mood=Voluntative for the first-person -ya. Reflex=Yes marks the reflexive possessive (-be'en,
# -yan). Possessive and person sense rides in the English gloss (his, for-my-own-younger-brother).
- by: Claude (Weft phase 0), for review by Skip and a Mongolist
  date: 2026-10-01
  why: hand lemma, morphology and gloss; no treebank covers the Secret History
  status: draft
