# William Ellis, A Treatise on Government (1776), book I, chapter II (1252a24-1253a39), verbatim from Project
# Gutenberg #6762 (the Everyman reprint, J. M. Dent, 1912). The file names the translator as 'William Ellis, A.M.'
# and gives no dates for him; its bibliography lists his Politica as 'by W. Ellis, 1776, 1778, 1888 (Morley's
# Universal Library), 1893'. 'formect' (for 'formed') is the transcription's and is left as printed. Left out:
# the chapter heading, the Bekker page tags the transcription sets inline ('[1252b]' after 'master', '[1253a]'
# after 'we'), and the underscores marking italics (_homosipuoi_, _homokapnoi_). Ellis paraphrases freely
# and runs the chapter as one paragraph; spans are aligned by content and split at his punctuation. Joined:
# 1252b.14-15, where 'in this scattered manner they formerly lived' fuses σποράδες γάρ with καὶ οὕτω τὸ ἀρχαῖον
# ᾤκουν. Ellis renders 1253a.4 (ἄζυξ ὢν ὥσπερ ἐν πεττοῖς) as 'as solitary as the birds', reading a different
# image; it is aligned there all the same. His 'The gift of speech also evidently proves' (1253a.5) anticipates
# λόγον in 1253a.7, which he then renders only as 'enjoys it'.
translation: ellis1776
aligned_by: hand, phase 0
spans:
- lines:
  - pol.1252a.1
  - pol.1252a.1
  text: Now if in this particular science any one would attend to its original seeds, and their first shoot, he
    would then as in others have the subject perfectly before him;
- lines:
  - pol.1252a.2
  - pol.1252a.2
  text: and perceive, in the first place, that it is requisite that those should be joined together whose species
    cannot exist without each other, as the male and the female, for the business of propagation; and this not through
    choice, but by that natural impulse which acts both upon plants and animals also, for the purpose of their leaving
    behind them others like themselves. It is also from natural causes that some beings command and others obey,
    that each may obtain their mutual safety;
- lines:
  - pol.1252a.3
  - pol.1252a.3
  text: for a being who is endowed with a mind capable of reflection and forethought is by nature the superior and
    governor, whereas he whose excellence is merely corporeal is formect to be a slave;
- lines:
  - pol.1252a.4
  - pol.1252a.4
  text: whence it follows that the different state of master and slave is equally advantageous to both.
- lines:
  - pol.1252b.1
  - pol.1252b.1
  text: 'But there is a natural difference between a female and a slave: for nature is not like the artists who
    make the Delphic swords for the use of the poor, but for every particular purpose she has her separate instruments,'
- lines:
  - pol.1252b.2
  - pol.1252b.2
  text: and thus her ends are most complete, for whatsoever is employed on one subject only, brings that one to
    much greater perfection than when employed on many;
- lines:
  - pol.1252b.3
  - pol.1252b.3
  text: and yet among the barbarians, a female and a slave are upon a level in the community,
- lines:
  - pol.1252b.4
  - pol.1252b.4
  text: the reason for which is, that amongst them there are none qualified by nature to govern, therefore their
    society can be nothing but between slaves of different sexes.
- lines:
  - pol.1252b.5
  - pol.1252b.5
  text: For which reason the poets say, it is proper for the Greeks to govern the barbarians, as if a barbarian
    and a slave were by nature one.
- lines:
  - pol.1252b.6
  - pol.1252b.6
  text: Now of these two societies the domestic is the first, and Hesiod is right when he says, "First a house,
    then a wife, then an ox for the plough,"
- lines:
  - pol.1252b.7
  - pol.1252b.7
  text: for the poor man has always an ox before a household slave.
- lines:
  - pol.1252b.8
  - pol.1252b.8
  text: That society then which nature has established for daily support is the domestic, and those who compose
    it are called by Charondas homosipuoi, and by Epimenides the Cretan homokapnoi;
- lines:
  - pol.1252b.9
  - pol.1252b.9
  text: but the society of many families, which was first instituted for their lasting, mutual advantage, is called
    a village,
- lines:
  - pol.1252b.10
  - pol.1252b.10
  text: 'and a village is most naturally composed of the descendants of one family, whom some persons call homogalaktes,
    the children and the children''s children thereof:'
- lines:
  - pol.1252b.11
  - pol.1252b.11
  text: for which reason cities were originally governed by kings, as the barbarian states now are,
- lines:
  - pol.1252b.12
  - pol.1252b.12
  text: which are composed of those who had before submitted to kingly government;
- lines:
  - pol.1252b.13
  - pol.1252b.13
  text: for every family is governed by the elder, as are the branches thereof, on account of their relationship
    thereunto,
- lines:
  - pol.1252b.14
  - pol.1252b.15
  text: which is what Homer says, "Each one ruled his wife and child;" and in this scattered manner they formerly
    lived.
- lines:
  - pol.1252b.16
  - pol.1252b.16
  text: And the opinion which universally prevails, that the gods themselves are subject to kingly government, arises
    from hence, that all men formerly were, and many are so now; and as they imagined themselves to be made in the
    likeness of the gods, so they supposed their manner of life must needs be the same.
- lines:
  - pol.1252b.17
  - pol.1252b.17
  text: 'And when many villages so entirely join themselves together as in every respect to form but one society,
    that society is a city, and contains in itself, if I may so speak, the end and perfection of government: first
    founded that we might live, but continued that we may live happily.'
- lines:
  - pol.1252b.18
  - pol.1252b.18
  text: For which reason every city must be allowed to be the work of nature, if we admit that the original society
    between male and female is;
- lines:
  - pol.1252b.19
  - pol.1252b.19
  text: for to this as their end all subordinate societies tend, and the end of everything is the nature of it.
- lines:
  - pol.1252b.20
  - pol.1252b.20
  text: 'For what every being is in its most perfect state, that certainly is the nature of that being, whether
    it be a man, a horse, or a house:'
- lines:
  - pol.1252b.21
  - pol.1252b.21
  text: besides, whatsoever produces the final cause and the end which we desire, must be best;
- lines:
  - pol.1253a.1
  - pol.1253a.1
  text: but a government complete in itself is that final cause and what is best.
- lines:
  - pol.1253a.2
  - pol.1253a.2
  text: 'Hence it is evident that a city is a natural production, and that man is naturally a political animal,
    and that whosoever is naturally and not accidentally unfit for society, must be either inferior or superior
    to man:'
- lines:
  - pol.1253a.3
  - pol.1253a.3
  text: thus the man in Homer, who is reviled for being "without society, without law, without family."
- lines:
  - pol.1253a.4
  - pol.1253a.4
  text: Such a one must naturally be of a quarrelsome disposition, and as solitary as the birds.
- lines:
  - pol.1253a.5
  - pol.1253a.5
  text: 'The gift of speech also evidently proves that man is a more social animal than the bees, or any of the
    herding cattle:'
- lines:
  - pol.1253a.6
  - pol.1253a.6
  text: for nature, as we say, does nothing in vain,
- lines:
  - pol.1253a.7
  - pol.1253a.7
  text: and man is the only animal who enjoys it.
- lines:
  - pol.1253a.8
  - pol.1253a.8
  text: Voice indeed, as being the token of pleasure and pain, is imparted to others also, and thus much their nature
    is capable of, to perceive pleasure and pain, and to impart these sensations to others;
- lines:
  - pol.1253a.9
  - pol.1253a.9
  text: 'but it is by speech that we are enabled to express what is useful for us, and what is hurtful, and of course
    what is just and what is unjust:'
- lines:
  - pol.1253a.10
  - pol.1253a.10
  text: for in this particular man differs from other animals, that he alone has a perception of good and evil,
    of just and unjust,
- lines:
  - pol.1253a.11
  - pol.1253a.11
  text: and it is a participation of these common sentiments which forms a family and a city.
- lines:
  - pol.1253a.12
  - pol.1253a.12
  text: Besides, the notion of a city naturally precedes that of a family or an individual,
- lines:
  - pol.1253a.13
  - pol.1253a.13
  text: for the whole must necessarily be prior to the parts,
- lines:
  - pol.1253a.14
  - pol.1253a.14
  text: for if you take away the whole man, you cannot say a foot or a hand remains, unless by equivocation, as
    supposing a hand of stone to be made, but that would only be a dead one; but everything is understood to be
    this or that by its energic qualities and powers, so that when these no longer remain, neither can that be said
    to be the same, but something of the same name.
- lines:
  - pol.1253a.15
  - pol.1253a.15
  text: That a city then precedes an individual is plain,
- lines:
  - pol.1253a.16
  - pol.1253a.16
  text: for if an individual is not in himself sufficient to compose a perfect government, he is to a city as other
    parts are to a whole; but he that is incapable of society, or so complete in himself as not to want it, makes
    no part of a city, as a beast or a god.
- lines:
  - pol.1253a.17
  - pol.1253a.17
  text: There is then in all persons a natural impetus to associate with each other in this manner,
- lines:
  - pol.1253a.18
  - pol.1253a.18
  text: and he who first founded civil society was the cause of the greatest good;
- lines:
  - pol.1253a.19
  - pol.1253a.19
  text: for as by the completion of it man is the most excellent of all living beings, so without law and justice
    he would be the worst of all,
- lines:
  - pol.1253a.20
  - pol.1253a.20
  text: 'for nothing is so difficult to subdue as injustice in arms:'
- lines:
  - pol.1253a.21
  - pol.1253a.21
  text: but these arms man is born with, namely, prudence and valour, which he may apply to the most opposite purposes,
- lines:
  - pol.1253a.22
  - pol.1253a.22
  text: for he who abuses them will be the most wicked, the most cruel, the most lustful, and most gluttonous being
    imaginable;
- lines:
  - pol.1253a.23
  - pol.1253a.23
  text: for justice is a political virtue,
- lines:
  - pol.1253a.24
  - pol.1253a.24
  text: by the rules of it the state is regulated, and these rules are the criterion of what is right.
