# Benjamin Jowett, The Politics of Aristotle (1885), book I, chapter 2 (1252a24-1253a39), verbatim from the English
# Wikisource transcription ('Politics (Jowett)/Book 1', the raw wikitext). The square brackets ('[omosipuous]',
# '[omokapous]', '[of the Cyclopes]', '[completed]') and the numerals '(1)' and '(2)' are Jowett's, and so is
# 'a an unprotected piece', a slip left as printed. Left out: the chapter number, the side-headings Jowett sets in
# the margin ('(1) Union of male and female.', 'The family the first stage of society.' and so on, eight in all),
# and the footnote numbers 4 to 12 the transcription attaches to words and quotations. The verse quotations
# (the poets on Hellenes and barbarians, Hesiod, Homer twice) are set off as separate paragraphs in the source and
# run in here; each sits with the Greek line that quotes it. Jowett reorders and expands in places; spans are
# aligned by content. Joined: 1252b.11-12, where 'as the barbarians still are' (καὶ νῦν ἔτι τὰ ἔθνη) is moved to
# the end of the next clause. Split mid-sentence where a new Greek clause begins: 1252a.3/4, 1252b.1/2, 1252b.3/4,
# 1252b.14/15 ('For they lived dispersedly,' renders σποράδες γάρ), 1252b.21/1253a.1, 1253a.15/16 and others,
# always at Jowett's own punctuation except 1253a.15/16, which divides 'The proof ... is' from its 'that' clause.
translation: jowett1885
aligned_by: hand, phase 0
spans:
- lines:
  - pol.1252a.1
  - pol.1252a.1
  text: He who thus considers things in their first growth and origin, whether a state or anything else, will obtain
    the clearest view of them.
- lines:
  - pol.1252a.2
  - pol.1252a.2
  text: In the first place (1) there must be a union of those who cannot exist without each other; for example,
    of male and female, that the race may continue; and this is a union which is formed, not of deliberate purpose,
    but because, in common with other animals and with plants, mankind have a natural desire to leave behind them
    an image of themselves. And (2) there must be a union of natural ruler and subject, that both may be preserved.
- lines:
  - pol.1252a.3
  - pol.1252a.3
  text: For he who can foresee with his mind is by nature intended to be lord and master, and he who can work with
    his body is a subject, and by nature a slave;
- lines:
  - pol.1252a.4
  - pol.1252a.4
  text: hence master and slave have the same interest.
- lines:
  - pol.1252b.1
  - pol.1252b.1
  text: Nature, however, has distinguished between the female and the slave. For she is not niggardly, like the
    smith who fashions the Delphian knife for many uses; she makes each thing for a single use,
- lines:
  - pol.1252b.2
  - pol.1252b.2
  text: and every instrument is best made when intended for one and not for many uses.
- lines:
  - pol.1252b.3
  - pol.1252b.3
  text: But among barbarians no distinction is made between women and slaves,
- lines:
  - pol.1252b.4
  - pol.1252b.4
  text: 'because there is no natural ruler among them: they are a community of slaves, male and female.'
- lines:
  - pol.1252b.5
  - pol.1252b.5
  text: Wherefore the poets say,— ‘It is meet that Hellenes should rule over barbarians’; as if they thought that
    the barbarian and the slave were by nature one.
- lines:
  - pol.1252b.6
  - pol.1252b.6
  text: Out of these two relationships between man and woman, master and slave, the family first arises, and Hesiod
    is right when he says,— ‘First house and wife and an ox for the plough’,
- lines:
  - pol.1252b.7
  - pol.1252b.7
  text: for the ox is the poor man’s slave.
- lines:
  - pol.1252b.8
  - pol.1252b.8
  text: The family is the association established by nature for the supply of men’s every-day wants, and the members
    of it are called by Charondas ‘companions of the cupboard’ [omosipuous], and by Epimenides the Cretan, ‘companions
    of the manger’ [omokapous].
- lines:
  - pol.1252b.9
  - pol.1252b.9
  text: But when several families are united, and the association aims at something more than the supply of daily
    needs, then comes into existence the village.
- lines:
  - pol.1252b.10
  - pol.1252b.10
  text: And the most natural form of the village appears to be that of a colony from the family, composed of the
    children and grandchildren, who are said to be ‘suckled with the same milk.’
- lines:
  - pol.1252b.11
  - pol.1252b.12
  text: And this is the reason why Hellenic states were originally governed by kings; because the Hellenes were
    under royal rule before they came together, as the barbarians still are.
- lines:
  - pol.1252b.13
  - pol.1252b.13
  text: Every family is ruled by the eldest, and therefore in the colonies of the family the kingly form of government
    prevailed because they were of the same blood.
- lines:
  - pol.1252b.14
  - pol.1252b.14
  text: As Homer says [of the Cyclopes]:— ‘Each one gives law to his children and to his wives’. For they lived
    dispersedly,
- lines:
  - pol.1252b.15
  - pol.1252b.15
  text: as was the manner in ancient times.
- lines:
  - pol.1252b.16
  - pol.1252b.16
  text: Wherefore men say that the Gods have a king, because they themselves either are or were in ancient times
    under the rule of a king. For they imagine, not only the forms of the Gods, but their ways of life to be like
    their own.
- lines:
  - pol.1252b.17
  - pol.1252b.17
  text: When several villages are united in a single community, perfect and large enough to be nearly or quite self-sufficing,
    the state comes into existence, originating in the bare needs of life, and continuing in existence for the sake
    of a good life.
- lines:
  - pol.1252b.18
  - pol.1252b.18
  text: And therefore, if the earlier forms of society are natural, so is the state,
- lines:
  - pol.1252b.19
  - pol.1252b.19
  text: for it is the end of them, and the [completed] nature is the end.
- lines:
  - pol.1252b.20
  - pol.1252b.20
  text: For what each thing is when fully developed, we call its nature, whether we are speaking of a man, a horse,
    or a family.
- lines:
  - pol.1252b.21
  - pol.1252b.21
  text: Besides, the final cause and end of a thing is the best,
- lines:
  - pol.1253a.1
  - pol.1253a.1
  text: and to be self-sufficing is the end and the best.
- lines:
  - pol.1253a.2
  - pol.1253a.2
  text: Hence it is evident that the state is a creation of nature, and that man is by nature a political animal.
    And he who by nature and not by mere accident is without a state, is either above humanity, or below it;
- lines:
  - pol.1253a.3
  - pol.1253a.3
  text: he is the ‘Tribeless, lawless, hearthless one’, whom Homer denounces—
- lines:
  - pol.1253a.4
  - pol.1253a.4
  text: the outcast who is a lover of war; he may be compared to a an unprotected piece in the game of draughts.
- lines:
  - pol.1253a.5
  - pol.1253a.5
  text: Now the reason why man is more of a political animal than bees or any other gregarious animals is evident.
- lines:
  - pol.1253a.6
  - pol.1253a.6
  text: Nature, as we often say, makes nothing in vain,
- lines:
  - pol.1253a.7
  - pol.1253a.7
  text: and man is the only animal whom she has endowed with the gift of speech.
- lines:
  - pol.1253a.8
  - pol.1253a.8
  text: And whereas mere sound is but an indication of pleasure or pain, and is therefore found in other animals
    (for their nature attains to the perception of pleasure and pain and the intimation of them to one another,
    and no further),
- lines:
  - pol.1253a.9
  - pol.1253a.9
  text: the power of speech is intended to set forth the expedient and inexpedient, and likewise the just and the
    unjust.
- lines:
  - pol.1253a.10
  - pol.1253a.10
  text: And it is a characteristic of man that he alone has any sense of good and evil, of just and unjust,
- lines:
  - pol.1253a.11
  - pol.1253a.11
  text: and the association of living beings who have this sense makes a family and a state.
- lines:
  - pol.1253a.12
  - pol.1253a.12
  text: Thus the state is by nature clearly prior to the family and to the individual,
- lines:
  - pol.1253a.13
  - pol.1253a.13
  text: since the whole is of necessity prior to the part;
- lines:
  - pol.1253a.14
  - pol.1253a.14
  text: for example, if the whole body be destroyed, there will be no foot or hand, except in an equivocal sense,
    as we might speak of a stone hand; for when destroyed the hand will be no better. But things are defined by
    their working and power; and we ought not to say that they are the same when they are no longer the same, but
    only that they have the same name.
- lines:
  - pol.1253a.15
  - pol.1253a.15
  text: The proof that the state is a creation of nature and prior to the individual is
- lines:
  - pol.1253a.16
  - pol.1253a.16
  text: 'that the individual, when isolated, is not self-sufficing; and therefore he is like a part in relation
    to the whole. But he who is unable to live in society, or who has no need because he is sufficient for himself,
    must be either a beast or a god: he is no part of a state.'
- lines:
  - pol.1253a.17
  - pol.1253a.17
  text: A social instinct is implanted in all men by nature,
- lines:
  - pol.1253a.18
  - pol.1253a.18
  text: and yet he who first founded the state was the greatest of benefactors.
- lines:
  - pol.1253a.19
  - pol.1253a.19
  text: For man, when perfected, is the best of animals, but, when separated from law and justice, he is the worst
    of all;
- lines:
  - pol.1253a.20
  - pol.1253a.20
  text: since armed injustice is the more dangerous,
- lines:
  - pol.1253a.21
  - pol.1253a.21
  text: and he is equipped at birth with the arms of intelligence and with moral qualities which he may use for
    the worst ends.
- lines:
  - pol.1253a.22
  - pol.1253a.22
  text: Wherefore, if he have not virtue, he is the most unholy and the most savage of animals, and the most full
    of lust and gluttony.
- lines:
  - pol.1253a.23
  - pol.1253a.23
  text: But justice is the bond of men in states,
- lines:
  - pol.1253a.24
  - pol.1253a.24
  text: and the administration of justice, which is the determination of what is just, is the principle of order
    in political society.
