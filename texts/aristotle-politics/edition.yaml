- id: '1252a'
  title: Book 1, chapter 2, Bekker 1252a24–34
  lines:
  - εἰ δή τις ἐξ ἀρχῆς τὰ πράγματα φυόμενα βλέψειεν, ὥσπερ ἐν τοῖς ἄλλοις, καὶ ἐν τούτοις κάλλιστʼ ἂν οὕτω θεωρήσειεν.
  - ἀνάγκη δὴ πρῶτον συνδυάζεσθαι τοὺς ἄνευ ἀλλήλων μὴ δυναμένους εἶναι, οἷον θῆλυ μὲν καὶ ἄρρεν τῆς γενέσεως ἕνεκεν (καὶ τοῦτο οὐκ ἐκ προαιρέσεως, ἀλλʼ ὥσπερ καὶ ἐν τοῖς ἄλλοις ζῴοις καὶ φυτοῖς φυσικὸν τὸ ἐφίεσθαι, οἷον αὐτό, τοιοῦτον καταλιπεῖν ἕτερον), ἄρχον δὲ καὶ ἀρχόμενον φύσει, διὰ τὴν σωτηρίαν.
  - τὸ μὲν γὰρ δυνάμενον τῇ διανοίᾳ προορᾶν ἄρχον φύσει καὶ δεσπόζον φύσει, τὸ δὲ δυνάμενον τῷ σώματι ταῦτα πονεῖν ἀρχόμενον καὶ φύσει δοῦλον·
  - διὸ δεσπότῃ καὶ δούλῳ ταὐτὸ συμφέρει.
- id: '1252b'
  title: Book 1, chapter 2, Bekker 1252b
  lines:
  - φύσει μὲν οὖν διώρισται τὸ θῆλυ καὶ τὸ δοῦλον (οὐθὲν γὰρ ἡ φύσις ποιεῖ τοιοῦτον οἷον οἱ χαλκοτύποι τὴν Δελφικὴν μάχαιραν, πενιχρῶς, ἀλλʼ ἓν πρὸς ἕν·
  - οὕτω γὰρ ἂν ἀποτελοῖτο κάλλιστα τῶν ὀργάνων ἕκαστον, μὴ πολλοῖς ἔργοις ἀλλʼ ἑνὶ δουλεῦον)·
  - ἐν δὲ τοῖς βαρβάροις τὸ θῆλυ καὶ τὸ δοῦλον τὴν αὐτὴν ἔχει τάξιν.
  - αἴτιον δʼ ὅτι τὸ φύσει ἄρχον οὐκ ἔχουσιν, ἀλλὰ γίνεται ἡ κοινωνία αὐτῶν δούλης καὶ δούλου.
  - διό φασιν οἱ ποιηταὶ βαρβάρων δʼ Ἕλληνας ἄρχειν εἰκός, ὡς ταὐτὸ φύσει βάρβαρον καὶ δοῦλον ὄν.
  - ἐκ μὲν οὖν τούτων τῶν δύο κοινωνιῶν οἰκία πρώτη, καὶ ὀρθῶς Ἡσίοδος εἶπε ποιήσας οἶκον μὲν πρώτιστα γυναῖκά τε βοῦν τʼ ἀροτῆρα·
  - ὁ γὰρ βοῦς ἀντʼ οἰκέτου τοῖς πένησίν ἐστιν.
  - ἡ μὲν οὖν εἰς πᾶσαν ἡμέραν συνεστηκυῖα κοινωνία κατὰ φύσιν οἶκός ἐστιν, οὓς Χαρώνδας μὲν καλεῖ ὁμοσιπύους, Ἐπιμενίδης δὲ ὁ Κρὴς ὁμοκάπους·
  - ἡ δʼ ἐκ πλειόνων οἰκιῶν κοινωνία πρώτη χρήσεως ἕνεκεν μὴ ἐφημέρου κώμη.
  - μάλιστα δὲ κατὰ φύσιν ἔοικεν ἡ κώμη ἀποικία οἰκίας εἶναι, οὓς καλοῦσί τινες ὁμογάλακτας, παῖδάς τε καὶ παίδων παῖδας.
  - διὸ καὶ τὸ πρῶτον ἐβασιλεύοντο αἱ πόλεις, καὶ νῦν ἔτι τὰ ἔθνη·
  - ἐκ βασιλευομένων γὰρ συνῆλθον·
  - πᾶσα γὰρ οἰκία βασιλεύεται ὑπὸ τοῦ πρεσβυτάτου, ὥστε καὶ αἱ ἀποικίαι, διὰ τὴν συγγένειαν.
  - καὶ τοῦτʼ ἐστὶν ὃ λέγει Ὅμηρος θεμιστεύει δὲ ἕκαστος παίδων ἠδʼ ἀλόχων. σποράδες γάρ·
  - καὶ οὕτω τὸ ἀρχαῖον ᾤκουν.
  - καὶ τοὺς θεοὺς δὲ διὰ τοῦτο πάντες φασὶ βασιλεύεσθαι, ὅτι καὶ αὐτοὶ οἱ μὲν ἔτι καὶ νῦν οἱ δὲ τὸ ἀρχαῖον ἐβασιλεύοντο, ὥσπερ δὲ καὶ τὰ εἴδη ἑαυτοῖς ἀφομοιοῦσιν οἱ ἄνθρωποι, οὕτω καὶ τοὺς βίους τῶν θεῶν.
  - ἡ δʼ ἐκ πλειόνων κωμῶν κοινωνία τέλειος πόλις, ἤδη πάσης ἔχουσα πέρας τῆς αὐταρκείας ὡς ἔπος εἰπεῖν, γινομένη μὲν τοῦ ζῆν ἕνεκεν, οὖσα δὲ τοῦ εὖ ζῆν.
  - διὸ πᾶσα πόλις φύσει ἔστιν, εἴπερ καὶ αἱ πρῶται κοινωνίαι.
  - τέλος γὰρ αὕτη ἐκείνων, ἡ δὲ φύσις τέλος ἐστίν·
  - οἷον γὰρ ἕκαστόν ἐστι τῆς γενέσεως τελεσθείσης, ταύτην φαμὲν τὴν φύσιν εἶναι ἑκάστου, ὥσπερ ἀνθρώπου ἵππου οἰκίας.
  - ἔτι τὸ οὗ ἕνεκα καὶ τὸ τέλος βέλτιστον·
- id: '1253a'
  title: Book 1, chapter 2, Bekker 1253a
  lines:
  - ἡ δʼ αὐτάρκεια καὶ τέλος καὶ βέλτιστον.
  - ἐκ τούτων οὖν φανερὸν ὅτι τῶν φύσει ἡ πόλις ἐστί, καὶ ὅτι ὁ ἄνθρωπος φύσει πολιτικὸν ζῷον, καὶ ὁ ἄπολις διὰ φύσιν καὶ οὐ διὰ τύχην ἤτοι φαῦλός ἐστιν, ἢ κρείττων ἢ ἄνθρωπος·
  - ὥσπερ καὶ ὁ ὑφʼ Ὁμήρου λοιδορηθεὶς ἀφρήτωρ ἀθέμιστος ἀνέστιος·
  - ἅμα γὰρ φύσει τοιοῦτος καὶ πολέμου ἐπιθυμητής, ἅτε περ ἄζυξ ὢν ὥσπερ ἐν πεττοῖς.
  - διότι δὲ πολιτικὸν ὁ ἄνθρωπος ζῷον πάσης μελίττης καὶ παντὸς ἀγελαίου ζῴου μᾶλλον, δῆλον.
  - οὐθὲν γάρ, ὡς φαμέν, μάτην ἡ φύσις ποιεῖ·
  - λόγον δὲ μόνον ἄνθρωπος ἔχει τῶν ζῴων·
  - ἡ μὲν οὖν φωνὴ τοῦ λυπηροῦ καὶ ἡδέος ἐστὶ σημεῖον, διὸ καὶ τοῖς ἄλλοις ὑπάρχει ζῴοις (μέχρι γὰρ τούτου ἡ φύσις αὐτῶν ἐλήλυθε, τοῦ ἔχειν αἴσθησιν λυπηροῦ καὶ ἡδέος καὶ ταῦτα σημαίνειν ἀλλήλοις),
  - ὁ δὲ λόγος ἐπὶ τῷ δηλοῦν ἐστι τὸ συμφέρον καὶ τὸ βλαβερόν, ὥστε καὶ τὸ δίκαιον καὶ τὸ ἄδικον·
  - τοῦτο γὰρ πρὸς τὰ ἄλλα ζῷα τοῖς ἀνθρώποις ἴδιον, τὸ μόνον ἀγαθοῦ καὶ κακοῦ καὶ δικαίου καὶ ἀδίκου καὶ τῶν ἄλλων αἴσθησιν ἔχειν·
  - ἡ δὲ τούτων κοινωνία ποιεῖ οἰκίαν καὶ πόλιν.
  - καὶ πρότερον δὲ τῇ φύσει πόλις ἢ οἰκία καὶ ἕκαστος ἡμῶν ἐστιν.
  - τὸ γὰρ ὅλον πρότερον ἀναγκαῖον εἶναι τοῦ μέρους·
  - ἀναιρουμένου γὰρ τοῦ ὅλου οὐκ ἔσται ποὺς οὐδὲ χείρ, εἰ μὴ ὁμωνύμως, ὥσπερ εἴ τις λέγοι τὴν λιθίνην (διαφθαρεῖσα γὰρ ἔσται τοιαύτη), πάντα δὲ τῷ ἔργῳ ὥρισται καὶ τῇ δυνάμει, ὥστε μηκέτι τοιαῦτα ὄντα οὐ λεκτέον τὰ αὐτὰ εἶναι ἀλλʼ ὁμώνυμα.
  - ὅτι μὲν οὖν ἡ πόλις καὶ φύσει πρότερον ἢ ἕκαστος, δῆλον·
  - εἰ γὰρ μὴ αὐτάρκης ἕκαστος χωρισθείς, ὁμοίως τοῖς ἄλλοις μέρεσιν ἕξει πρὸς τὸ ὅλον, ὁ δὲ μὴ δυνάμενος κοινωνεῖν ἢ μηδὲν δεόμενος διʼ αὐτάρκειαν οὐθὲν μέρος πόλεως, ὥστε ἢ θηρίον ἢ θεός.
  - φύσει μὲν οὖν ἡ ὁρμὴ ἐν πᾶσιν ἐπὶ τὴν τοιαύτην κοινωνίαν·
  - ὁ δὲ πρῶτος συστήσας μεγίστων ἀγαθῶν αἴτιος.
  - ὥσπερ γὰρ καὶ τελεωθὲν βέλτιστον τῶν ζῴων ὁ ἄνθρωπός ἐστιν, οὕτω καὶ χωρισθεὶς νόμου καὶ δίκης χείριστον πάντων.
  - χαλεπωτάτη γὰρ ἀδικία ἔχουσα ὅπλα·
  - ὁ δὲ ἄνθρωπος ὅπλα ἔχων φύεται φρονήσει καὶ ἀρετῇ, οἷς ἐπὶ τἀναντία ἔστι χρῆσθαι μάλιστα.
  - διὸ ἀνοσιώτατον καὶ ἀγριώτατον ἄνευ ἀρετῆς, καὶ πρὸς ἀφροδίσια καὶ ἐδωδὴν χείριστον.
  - ἡ δὲ δικαιοσύνη πολιτικόν·
  - ἡ γὰρ δίκη πολιτικῆς κοινωνίας τάξις ἐστίν, ἡ δὲ δικαιοσύνη τοῦ δικαίου κρίσις.
