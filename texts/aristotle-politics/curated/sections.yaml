- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
  date: 2026-10-18
  why: "corrections to the GLAUx automatic parse of 1252a24-1252b: 44 of 422 tokens corrected (6 lemmas, 42 morph tags). Subjects parsed as accusatives and objects as nominatives (τὸ θῆλυ καὶ τὸ δοῦλον, τὸ οὗ ἕνεκα καὶ τὸ τέλος, οὐθὲν, πέρας); neuter things parsed as masculine (ἕτερον, ἑκάστου) and masculine or feminine referents parsed as neuter or masculine (τοῦ πρεσβυτάτου, ἐκείνων); predicate and parallel participles in the wrong case (ἄρχον, ἀρχόμενον); the accusative absolute ὡς ταὐτὸ ... ὄν parsed as nominative; two crasis tokens ταὐτό moved to αὐτός; οἷον and adverbial superlatives retagged as adverbs; lemmas that are not LSJ headwords (ὁμόκαποι, ὁμογάλακτες) or the wrong word (πρότερος for πρῶται, the adverb οὗ for the relative); Χαρώνδας parsed as plural accusative; οἰκίας as accusative plural; σποράδες as a noun; and δύο, which arrives with an empty tag"
  status: draft
  set:
    pol.1252a.2.11: {morph: d--------}   # οἷον: 'for example', adverbial
    pol.1252a.2.20: {morph: a-s---nn-}   # τοῦτο: subject, 'and this is not from choice'
    pol.1252a.2.37: {morph: a-s---nn-}   # αὐτό: subject of the comparative clause οἷον αὐτό (sc. ἐστι)
    pol.1252a.2.40: {morph: a-s---na-}   # ἕτερον: agrees with τοιοῦτον, neuter
    pol.1252a.2.41: {morph: v-sppana-}   # ἄρχον: accusative, parallel to θῆλυ and ἄρρεν under συνδυάζεσθαι
    pol.1252a.2.44: {morph: v-sppena-}   # ἀρχόμενον: accusative, as ἄρχον
    pol.1252a.3.20: {morph: v-sppenn-}   # ἀρχόμενον: predicate nominative of τὸ δυνάμενον
    pol.1252a.3.23: {morph: a-s---nn-}   # δοῦλον: neuter predicate adjective of τὸ δυνάμενον, parsed as a masculine accusative noun
    pol.1252a.4.5: {lemma: αὐτός, morph: a-s---nn-}   # ταὐτὸ: crasis of τὸ αὐτό, subject of συμφέρει
    pol.1252b.1.10: {morph: a-s---na-}   # οὐθὲν: object of ποιεῖ
    pol.1252b.1.15: {morph: a-s---na-}   # τοιοῦτον: object of ποιεῖ
    pol.1252b.2.5: {morph: d-------s}   # κάλλιστα: superlative adverb, as κάλλιστʼ at 1252a.1
    pol.1252b.2.8: {morph: a-s---nn-}   # ἕκαστον: subject of ἀποτελοῖτο
    pol.1252b.3.5: {morph: l-s---nn-}   # τὸ: subject of ἔχει
    pol.1252b.3.6: {morph: a-s---nn-}   # θῆλυ: subject
    pol.1252b.3.8: {morph: l-s---nn-}   # τὸ: subject
    pol.1252b.3.9: {morph: a-s---nn-}   # δοῦλον: subject
    pol.1252b.4.4: {morph: l-s---na-}   # τὸ: object of ἔχουσιν
    pol.1252b.4.6: {morph: v-sppana-}   # ἄρχον: object of ἔχουσιν
    pol.1252b.5.11: {lemma: αὐτός, morph: a-s---na-}   # ταὐτὸ: crasis of τὸ αὐτό, predicate in the accusative absolute ὡς ... ὄν
    pol.1252b.5.13: {morph: a-s---na-}   # βάρβαρον: accusative absolute with ὡς
    pol.1252b.5.15: {morph: a-s---na-}   # δοῦλον: accusative absolute
    pol.1252b.5.16: {morph: v-sppana-}   # ὄν: accusative absolute with ὡς
    pol.1252b.6.6: {morph: a-p---fg-}   # δύο: empty tag; agrees with κοινωνιῶν, as δύο in med.2.14.7.4
    pol.1252b.6.17: {morph: d-------s}   # πρώτιστα: adverbial, 'first of all'
