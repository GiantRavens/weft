    pol.1252b.21.2: {morph: l-s---nn-}   # τὸ: subject
    pol.1252b.21.3: {lemma: ὅς, morph: p-s---ng-}   # οὗ: relative pronoun governed by ἕνεκα, parsed as the adverb 'where'
    pol.1252b.21.6: {morph: l-s---nn-}   # τὸ: subject
    pol.1252b.21.7: {morph: n-s---nn-}   # τέλος: subject
    pol.1252b.21.8: {morph: a-s---nns}   # βέλτιστον: predicate nominative
