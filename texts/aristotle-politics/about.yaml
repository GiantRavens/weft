  lead: 'Politics (Ancient Greek: Πολιτικα, Politiká) is a work of political philosophy by Aristotle,
    a 4th-century BC Greek philosopher.


    At the end of the Nicomachean Ethics, Aristotle declared that the inquiry into ethics leads into a
    discussion of politics. The two works are frequently considered to be parts of a larger treatise –
    or perhaps connected lectures – dealing with the "philosophy of human affairs". In Aristotle''s hierarchical
    system of philosophy he considers politics, the study of communities, to be of higher priority than
    ethics, which concerns individuals.'
