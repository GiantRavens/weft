- id: pol.1252a.2
  cite: urn:cts:greekLit:tlg0086.tlg035.perseus-grc2:1252a.2
  stanza: 1252a
  stanza_title: Book 1, chapter 2, Bekker 1252a24–34
  text: ἀνάγκη δὴ πρῶτον συνδυάζεσθαι τοὺς ἄνευ ἀλλήλων μὴ δυναμένους εἶναι, οἷον θῆλυ μὲν καὶ ἄρρεν τῆς γενέσεως ἕνεκεν (καὶ τοῦτο οὐκ ἐκ προαιρέσεως, ἀλλʼ ὥσπερ καὶ ἐν τοῖς ἄλλοις ζῴοις καὶ φυτοῖς φυσικὸν
    τὸ ἐφίεσθαι, οἷον αὐτό, τοιοῦτον καταλιπεῖν ἕτερον), ἄρχον δὲ καὶ ἀρχόμενον φύσει, διὰ τὴν σωτηρίαν.
