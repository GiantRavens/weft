# Notes for Aristotle, Politics 1.2. Editorial notes are drafts until a reviewer lifts them.
- id: n.pol.method
  attach: pol.1252a.1
  kind: editorial
  status: draft
  leans_on: "Politics 1.1 (1252a17-23) and 1.2"
  text: "The chapter states its method in its first sentence: things are seen best if one looks at them growing from their beginning, ἐξ ἀρχῆς ... φυόμενα. Chapter 1 has just said that a composite is understood by dividing it into its smallest parts. Chapter 2 traces how the city is put together: it builds the city up from its smallest partnerships, the pair of male and female and the pair of ruler and ruled, through the household and the village to the city. The verb φύομαι, 'grow', and the noun φύσις, 'nature', come from the same root, and the argument of the chapter turns on them."
- id: n.pol.slavery
  attach: pol.1252a.3
  kind: editorial
  status: draft
  leans_on: "Politics 1.2 and 1.4-7"
  text: "The second of the two first partnerships is that of ruler and ruled 'by nature', and Aristotle identifies it here with master and slave: what can foresee with the mind rules by nature, and what can carry out the work with the body is ruled and is by nature a slave. He then separates this from the relation of male and female, which he also treats as one of ruling, and says that among barbarians the two are not distinguished, since barbarians have nothing that rules by nature. The line of verse he cites, that it is fitting for Greeks to rule barbarians, is from Euripides' Iphigenia at Aulis (1400). The account of the natural slave is developed in chapters 4 to 7 of this book. The glosses render the words as the text uses them and do not soften them."
- id: n.pol.hesiod
  attach: pol.1252b.6.17
  kind: editorial
  status: draft
  leans_on: "Hesiod, Works and Days 405; Politics 1.2"
  text: "The verse is Hesiod, Works and Days 405: 'first of all a house, a wife and an ox for plowing'. Aristotle cites it for the claim that the household is the first partnership, and adds that for the poor the ox stands in place of a servant. In Hesiod the line comes in his advice on farming, at the head of a list of what a farmer needs."
- id: n.pol.bracket
  attach: pol.1252b.10.15
  kind: editorial
  status: draft
  leans_on: "the Perseus TEI of Ross's text, which marks the words as deleted; GLAUx"
  text: "The words παῖδάς τε καὶ παίδων παῖδας, 'children and children's children', are bracketed by the editor, W. D. Ross, as not Aristotle's; they stand beside ὁμογάλακτας, 'people suckled on the same milk'. The automatic parse treats them as part of the text, and the page prints them with it; they are not Aristotle's words on Ross's judgment."
- id: n.pol.cyclops
  attach: pol.1252b.14.7
  kind: editorial
  status: draft
  leans_on: "Homer, Odyssey 9.114-115; Politics 1.2"
  text: "The quotation is from Homer's description of the Cyclopes, Odyssey 9.114-115, who have no assemblies or laws and each of whom 'gives law to his children and wives'. Aristotle uses it as evidence that the first villages were ruled by the eldest like a household, as a king rules, and that the earliest people lived scattered, σποράδες."
- id: n.pol.animal
  attach: pol.1253a.2.17
  kind: editorial
  status: draft
  leans_on: "LSJ s.vv. πολιτικός, πόλις; Politics 1.2"
  text: "ὁ ἄνθρωπος φύσει πολιτικὸν ζῷον is the sentence usually quoted as 'man is by nature a political animal'. The gloss gives πολιτικόν as 'political', but the adjective is formed from πόλις, the city, and here means a living being whose nature is fulfilled in a city. The claim follows from the argument of the chapter: the city is the end toward which the household and the village grow, and what a thing is when its growth is complete is its nature. The person without a city 'by nature and not by chance', Aristotle adds, is either a poor creature or more than human."
- id: n.pol.homer
  attach: pol.1253a.3.7
  kind: editorial
  status: draft
  leans_on: "Homer, Iliad 9.63; Politics 1.2"
  text: "ἀφρήτωρ ἀθέμιστος ἀνέστιος, 'without brotherhood, without law, without hearth', is Iliad 9.63, where Nestor says that the man who loves civil war is such a man. Aristotle compares the person without a city to an isolated piece in a board game, which the next line describes."
- id: n.pol.logos
  attach: pol.1253a.7.1
  kind: editorial
  status: draft
  leans_on: "LSJ s.vv. λόγος, φωνή; Politics 1.2"
  text: "The argument rests on a distinction between φωνή, 'voice', and λόγος, 'speech' or 'reason'. Voice signals pleasure and pain and belongs to other animals as well. Speech shows what is advantageous and harmful, and so what is just and unjust, and only humans have it. A partnership in these things, Aristotle says, makes a household and a city. The gloss gives λόγος as 'speech'; the word also means reason and account. Both translators render it as speech: Jowett has 'the gift of speech' here and 'the power of speech' two lines below, and Ellis's 'the gift of speech' comes a little earlier, at 1253a5."
