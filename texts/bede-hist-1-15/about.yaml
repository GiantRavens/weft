  lead: 'The Ecclesiastical History of the English People (Latin: Historia ecclesiastica gentis Anglorum),
    written by Bede in about AD 731, is a history of the Christian churches in England, and of England
    generally; its main focus is on the growth of Christianity. It was composed in Latin, and is believed
    to have been completed in 731 when Bede was approximately 59 years old. It is considered one of the
    most important original references on Anglo-Saxon history, and according to some scholars has played
    a key role in the development of an English national identity.'
