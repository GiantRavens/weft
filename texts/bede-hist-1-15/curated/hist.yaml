    # bede.1.3: praefatus is entered in Lewis and Short as the participle of praefor, used passively, 'aforesaid'; the king is Vortigern, named in I.14
    bede.1.3.1: {lemma: "tunc", morph: "ADV", gloss: "then"}   # Tunc
