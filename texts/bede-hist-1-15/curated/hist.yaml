# Human overlay for Bede, Historia ecclesiastica I.15, Plummer's text of 1896 (Venerabilis Baedae Opera Historica, vol. 1).
# No treebank covers Bede, so this file carries lemma and morphology too (rule 3 exception), hand-annotated and in draft.
# Lemmas follow Lewis and Short under their classical headwords, written with v for consonantal u and i for consonantal i,
# as the Res Gestae overlay does (venio, sive, iubeo, adiungo); Plummer's spellings (uera, sumsere, consumsit, puplica,
# interemtos, inpar, conprehensi) stay in the surface and the lemma takes the headword. Peoples are lemmatized under the
# nominative plural, as Lewis and Short enter them (Saxones, Picti, Chaldaei; Bede's Brittani and Brettones, Angli, Iutae,
# Merci, Nordanhymbri); the Henry I overlay writes Anglus. Other names keep Bede's spelling in the nominative (Ualentinianus,
# Uictgilsus, Uitta, Uecta, Uoden, Brittania, Cantia, Humber, Hierosolyma). Written in the compact spec and expanded by weft overlay.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-31"
  why: "whole chapter, 60 lines, 497 tokens; hand annotation, no treebank. Method: the reuse map of the Henry I, Magna Carta and Res Gestae overlays (weft overlay --reuse) supplied the frequent forms and their conventions (sum as AUX, non as PART with Polarity=Neg, a and e under ab and ex, ac under atque), then every line was read in context and the analysis written by hand; glosses were compared with A. M. Sellar's English of 1907 and follow the Latin where Sellar paraphrases (longis nauibus, manum fortiorem, fortioribus, populi Dei, inter altaria; the line notes say where). Lemmas and headwords are Lewis and Short's from memory, not checked against the printed dictionary in this session; the readings of praefato (praefor), suspecta (suspicio, active sense), aliquanto (aliquantus), Iutae for Bede's Iutarum, and the Latin forms of the numerals are judgments a reviewer should check. Deponent verbs (adipiscor, orior, protestor, prosequor) carry Voice=Pass, the morphology of the form; the numerals are lemmatized under the Latin ordinal or cardinal they stand for."
  status: "draft"
  set:
    # bede.1.1: the numeral is read as the ablative ordinal agreeing with anno (quadringentesimo quadragesimo nono); the lemma names the ordinal, as the Res Gestae overlay does for its numerals
    bede.1.1.1: {lemma: "annus", morph: "NOUN|Case=Abl|Gender=Masc|Number=Sing", gloss: "in-the-year"}   # Anno
    bede.1.1.2: {lemma: "ab", morph: "ADP", gloss: "from"}   # ab
    bede.1.1.3: {lemma: "incarnatio", morph: "NOUN|Case=Abl|Gender=Fem|Number=Sing", gloss: "the-incarnation"}   # incarnatione
    bede.1.1.4: {lemma: "dominus", morph: "NOUN|Case=Gen|Gender=Masc|Number=Sing", gloss: "of-the-Lord"}   # Domini
    bede.1.1.5: {lemma: "quadringentesimus quadragesimus nonus", morph: "NUM", gloss: "four-hundred-forty-ninth"}   # CCCCXLVIIII
    # bede.1.2: XLVI agrees with Marcianus (the forty-sixth from Augustus); adeptus is the participle of a deponent and carries Voice=Pass, the morphology of the form
    bede.1.2.1: {lemma: "Marcianus", morph: "PROPN|Case=Nom|Gender=Masc|Number=Sing", gloss: "Marcian"}   # Marcianus
    bede.1.2.2: {lemma: "cum", morph: "ADP", gloss: "with"}   # cum
    bede.1.2.3: {lemma: "Ualentinianus", morph: "PROPN|Case=Abl|Gender=Masc|Number=Sing", gloss: "Valentinian"}   # Ualentiniano
    bede.1.2.4: {lemma: "quadragesimus sextus", morph: "NUM", gloss: "forty-sixth"}   # XLVI
    bede.1.2.5: {lemma: "ab", morph: "ADP", gloss: "from"}   # ab
    bede.1.2.6: {lemma: "Augustus", morph: "PROPN|Case=Abl|Gender=Masc|Number=Sing", gloss: "Augustus"}   # Augusto
    bede.1.2.7: {lemma: "regnum", morph: "NOUN|Case=Acc|Gender=Neut|Number=Sing", gloss: "the-rule"}   # regnum
    bede.1.2.8: {lemma: "adipiscor", morph: "VERB|Aspect=Perf|Case=Nom|Gender=Masc|Number=Sing|Tense=Past|VerbForm=Part|Voice=Pass", gloss: "having-gained"}   # adeptus
    bede.1.2.9: {lemma: "septem", morph: "NUM", gloss: "seven"}   # VII
