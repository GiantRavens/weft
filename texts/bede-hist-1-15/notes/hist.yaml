# Notes for Bede, Historia ecclesiastica I.15.
- id: n.bede.date
  attach: bede.1.1
  kind: editorial
  status: draft
  text: "Anno ab incarnatione Domini: Bede dates by the year 'from the incarnation of the Lord', the reckoning Dionysius Exiguus had devised in the 6th century for Easter tables, and the Historia, finished in 731, did much to bring it into use for history. The year is Bede's reckoning. Marcian's reign as emperor in the East began in 450 and lasted seven years, as Bede says; Valentinian III ruled in the West. From Bede the year 449 became the conventional date of the coming of the Saxons, the adventus Saxonum."
- id: n.bede.vortigern
  attach: bede.1.3
  kind: editorial
  status: draft
  text: "A rege praefato, 'by the king mentioned before': Vortigern, whom the previous chapter names (cum suo rege Uurtigerno, 'with their king Vortigern'). The Britons, harried by the Picts and Scots from the north, resolve with him to call in the Saxons from across the sea; Bede adds that this was arranged by the will of God, so that evil should come on the wicked."
- id: n.bede.gildas
  attach: bede.1.4
  kind: editorial
  status: draft
  text: "Much of the chapter is taken from Gildas, De excidio Britanniae, written in the 6th century by a British monk. Plummer prints the borrowed words in italics and cites Gildas, sections 23 to 25, in his margin: the three long ships, the place in the east of the island, the fire of the pagans compared to the Chaldeans' burning of Jerusalem, and the fate of the survivors. Gildas names no leader of the Saxons, and in most of his manuscripts calls the king only superbus tyrannus, the proud tyrant. The names Hengist and Horsa, the date, and the division into three peoples are Bede's additions."
- id: n.bede.peoples
  attach: bede.2.1
  kind: editorial
  status: draft
  text: "Saxonibus, Anglis, Iutis: Bede is the earliest writer to divide the newcomers into these three peoples and to assign each kingdom of his own day to one of them: Kent and the Isle of Wight to the Jutes, Essex, Sussex and Wessex to the Saxons, East Anglia, Mercia and Northumbria to the Angles. His Angulus is the district of Angeln, in what is now Schleswig. Earlier and other sources describe the newcomers differently; Procopius, writing in Constantinople in the 6th century, has Britain inhabited by Angles, Frisians and Britons. Bede's scheme describes the kingdoms as they stood in 731 as much as the migrations of the 5th century."
- id: n.bede.hengist
  attach: bede.2.13
  kind: editorial
  status: draft
  text: "Hengist and Horsa, 'stallion' and 'horse' in Old English. Bede reports the brothers with perhibentur, 'they are said', and Horsa's monument in east Kent cannot be identified. The pedigree back to Woden, from whose stock the royal houses of many kingdoms claimed descent, is the form the English royal genealogies take. The Anglo-Saxon Chronicle continues the story: under 455 it records that Hengest and Horsa fought Vortigern at Ægelesþrep and that Horsa was killed there."
- id: n.bede.english
  attach: bede.2.2
  kind: editorial
  status: draft
  text: "The chapter passed into Old English twice. The translation of the whole Historia made in the late 9th century renders it; and the Peterborough copy of the Anglo-Saxon Chronicle (manuscript E), under the year 449, gives Bede's account of the three peoples nearly line by line: Of Iotum comon Cantwara and Wihtwara, 'from the Jutes came the people of Kent and of Wight'. Neither is yet in this library; their texts wait on a clean public-domain source."
