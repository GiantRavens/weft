# Weft edition of Preiddeu Annwn ('The spoils of Annwn'), poem XXX of the Book of Taliesin (National Library
# of Wales, Peniarth MS 2, fol. 25b-26a, first half of the 14th century), in the text of W. F. Skene, The
# Four Ancient Books of Wales (1868), vol. 2, pp. 181-182. Each line is checked against the Internet Archive
# OCR of the Toronto copy (pinned).
#
# Skene prints the manuscript's w-letter with the sign ỽ (Unicode U+1EFD, Middle-Welsh v), which this
# edition keeps; plain w also occurs (wledic, prytwen). The OCR reads ỽ as O, C, c, 0, 6 or d, so the
# check treats ỽ as that declared class (verify_wildcard; also Ci, Cr) and every other letter exactly. The remaining
# OCR misreadings are declared in verify_corrections, each settled on the page image (leaf n206, n207).
# Skene's dotted y in peridẏd (line 44) is folded to y for the check.
#
# Sections are the poem's eight stanzas, each closed by the refrain 'nam(yn) seith ny dyrreith'.
#   t        the word as Skene prints it, punctuation attached
#   n        Weft's normalized spelling in modern Welsh letters, from which the sound is read; draft
work: preiddeu-annwn
joiner: ' '
verify_in: sources/skene1868-v2.txt
verify_fold: {ẏ: y}
verify_wildcard: {ỽ: '(?:[OoCc06dỽ]|Ci|Cr)'}
verify_corrections:
- {ocr: '^►^OLYCHAF', print: Golychaf}
- {ocr: traetb mmidi, print: traeth mundi}
- {ocr: Tri Uoneit pr3i;wen, print: Tri lloneit prytwen}
- {ocr: Tri Uoneit prytwen yd aetham ni ar vor, print: Tri lloneit prytwen yd aetham ni ar vor}
- {ocr: Ygk3nmeir, print: Ygkynneir}
- {ocr: rytygbit, print: rytyghit}
- {ocr: UaO leminadc, print: llaỽ leminaỽc}
- {ocr: Uoscit, print: lloscit}
- {ocr: A pban aetham, print: A phan aetham}
- {ocr: Neut Cyf glot geinmyn kerd gly^anaOr, print: Neut ỽyf glot geinmyn kerd glywanaỽr}
- {ocr: pybjrrdor, print: pybyrdor}
- {ocr: Nainyn seith, print: Namyn seith}
- {ocr: M obrynafi lawyr lien Uywyadur, print: Ni obrynafi lawyr llen llywyadur}
- {ocr: dyn^eith o gaer vandOy, print: dyrreith o gaer vandỽy}
