# Human overlay, written in the compact spec and expanded by weft overlay.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-31"
  why: "all eight stanzas. Hand lemma, morphology and gloss; no treebank exists for Middle Welsh. Lemmas are Geiriadur Prifysgol Cymru (GPC) headwords in modern spelling, verbs under the verbal noun, mutated forms under the radical, names in their conventional modern form; morphology in Universal Dependencies features, with Person=0 for the Welsh impersonal. The glosses follow Robert Williams's 1868 translation where it reads the Welsh plausibly, and the readings of Marged Haycock (Legendary Poems from the Book of Taliesin, 2007) where it does not. The poem is among the most obscure in early Welsh; the lines with a note carry a disputed word a reviewer should check first. The readings attributed in the notes to Haycock, Sims-Williams or Koch were given from the annotator's knowledge of those books, not checked against them; each attribution is to be verified"
  status: "draft"
  set:
