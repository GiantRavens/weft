# Robert Williams's translation, in W. F. Skene, The Four Ancient Books of Wales (1868), vol. 1, pp. 264-266
# (Book of Taliessin XXX). Transcribed from the page images (archive.org fourancientbooks01skenuoft, leaf
# n285 to n287), of which the pinned OCR is the witness; the OCR's misreadings ('Wlio', 'boU', 'Uffem',
# "h'stened", 'Eigor' for Rigor) are corrected, the spaces before ; : ? ! closed, and a line the print wraps
# is one line. Williams translates line for line; his stanza VII covers the poem's last two stanzas, which
# Weft divides at 'Myneych dychnut val bleidawr'.
translation: williams1868
aligned_by: hand, phase 0; one span per line, as Williams divides it
spans:
- lines:
  - pa.1.1
  - pa.1.1
  text: I will praise the sovereign, supreme king of the land,
- lines:
  - pa.1.2
  - pa.1.2
  text: Who hath extended his dominion over the shore of the world.
- lines:
  - pa.1.3
  - pa.1.3
  text: Complete was the prison of Gweir in Caer Sidi,
- lines:
  - pa.1.4
  - pa.1.4
  text: Through the spite of Pwyll and Pryderi.
- lines:
  - pa.1.5
  - pa.1.5
  text: No one before him went into it.
- lines:
  - pa.1.6
  - pa.1.6
  text: The heavy blue chain held the faithful youth,
- lines:
  - pa.1.7
  - pa.1.7
  text: And before the spoils of Annwvn woefully he sings,
- lines:
  - pa.1.8
  - pa.1.8
  text: And till doom shall continue a bard of prayer.
- lines:
  - pa.1.9
  - pa.1.9
  text: Thrice enough to fill Prydwen, we went into it;
- lines:
  - pa.1.10
  - pa.1.10
  text: Except seven, none returned from Caer Sidi.
- lines:
  - pa.2.1
  - pa.2.1
  text: Am I not a candidate for fame, if a song is heard?
- lines:
  - pa.2.2
  - pa.2.2
  text: In Caer Pedryvan, four its revolutions;
- lines:
  - pa.2.3
  - pa.2.3
  text: In the first word from the cauldron when spoken,
- lines:
  - pa.2.4
  - pa.2.4
  text: From the breath of nine maidens it was gently warmed.
- lines:
  - pa.2.5
  - pa.2.5
  text: Is it not the cauldron of the chief of Annwvn? What is its intention?
- lines:
  - pa.2.6
  - pa.2.6
  text: A ridge about its edge and pearls.
- lines:
  - pa.2.7
  - pa.2.7
  text: It will not boil the food of a coward, that has not been sworn,
- lines:
  - pa.2.8
  - pa.2.8
  text: A sword bright gleaming to him was raised,
- lines:
  - pa.2.9
  - pa.2.9
  text: And in the hand of Lleminawg it was left.
- lines:
  - pa.2.10
  - pa.2.10
  text: And before the door of the gate of Uffern the lamp was burning.
- lines:
  - pa.2.11
  - pa.2.11
  text: And when we went with Arthur, a splendid labour,
- lines:
  - pa.2.12
  - pa.2.12
  text: Except seven, none returned from Caer Vedwyd.
- lines:
  - pa.3.1
  - pa.3.1
  text: Am I not a candidate for fame with the listened song
- lines:
  - pa.3.2
  - pa.3.2
  text: In Caer Pedryvan, in the isle of the strong door?
- lines:
  - pa.3.3
  - pa.3.3
  text: The twilight and pitchy darkness were mixed together.
- lines:
  - pa.3.4
  - pa.3.4
  text: Bright wine their liquor before their retinue.
- lines:
  - pa.3.5
  - pa.3.5
  text: Thrice enough to fill Prydwen we went on the sea,
- lines:
  - pa.3.6
  - pa.3.6
  text: Except seven, none returned from Caer Rigor.
- lines:
  - pa.4.1
  - pa.4.1
  text: I shall not deserve much from the ruler of literature,
- lines:
  - pa.4.2
  - pa.4.2
  text: Beyond Caer Wydyr they saw not the prowess of Arthur.
- lines:
  - pa.4.3
  - pa.4.3
  text: Three score Canhwr stood on the wall,
- lines:
  - pa.4.4
  - pa.4.4
  text: Difficult was a conversation with its sentinel.
- lines:
  - pa.4.5
  - pa.4.5
  text: Thrice enough to fill Prydwen there went with Arthur,
- lines:
  - pa.4.6
  - pa.4.6
  text: Except seven, none returned from Caer Golud.
- lines:
  - pa.5.1
  - pa.5.1
  text: I shall not deserve much from those with long shields.
- lines:
  - pa.5.2
  - pa.5.2
  text: They know not what day, who the causer,
- lines:
  - pa.5.3
  - pa.5.3
  text: What hour in the serene day Cwy was born.
- lines:
  - pa.5.4
  - pa.5.4
  text: Who caused that he should not go to the dales of Devwy.
- lines:
  - pa.5.5
  - pa.5.5
  text: They know not the brindled ox, thick his head-band.
- lines:
  - pa.5.6
  - pa.5.6
  text: Seven score knobs in his collar.
- lines:
  - pa.5.7
  - pa.5.7
  text: And when we went with Arthur of anxious memory,
- lines:
  - pa.5.8
  - pa.5.8
  text: Except seven, none returned from Caer Vandwy.
- lines:
  - pa.6.1
  - pa.6.1
  text: I shall not deserve much from those of loose bias,
- lines:
  - pa.6.2
  - pa.6.2
  text: They know not what day the chief was caused.
- lines:
  - pa.6.3
  - pa.6.3
  text: What hour in the serene day the owner was born.
- lines:
  - pa.6.4
  - pa.6.4
  text: What animal they keep, silver its head.
- lines:
  - pa.6.5
  - pa.6.5
  text: When we went with Arthur of anxious contention,
- lines:
  - pa.6.6
  - pa.6.6
  text: Except seven, none returned from Caer Ochren.
- lines:
  - pa.7.1
  - pa.7.1
  text: Monks congregate like dogs in a kennel,
- lines:
  - pa.7.2
  - pa.7.2
  text: From contact with their superiors they acquire knowledge,
- lines:
  - pa.7.3
  - pa.7.3
  text: Is one the course of the wind, is one the water of the sea?
- lines:
  - pa.7.4
  - pa.7.4
  text: Is one the spark of the fire, of unrestrainable tumult?
- lines:
  - pa.8.1
  - pa.8.1
  text: Monks congregate like wolves,
- lines:
  - pa.8.2
  - pa.8.2
  text: From contact with their superiors they acquire knowledge.
- lines:
  - pa.8.3
  - pa.8.3
  text: They know not when the deep night and dawn divide.
- lines:
  - pa.8.4
  - pa.8.4
  text: Nor what is the course of the wind, or who agitates it,
- lines:
  - pa.8.5
  - pa.8.5
  text: In what place it dies away, on what land it roars.
- lines:
  - pa.8.6
  - pa.8.6
  text: The grave of the saint is vanishing from the altar-tomb.
- lines:
  - pa.8.7
  - pa.8.7
  text: I will pray to the Lord, the great supreme,
- lines:
  - pa.8.8
  - pa.8.8
  text: That I be not wretched. Christ be my portion.
