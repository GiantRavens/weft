# Notes for Preiddeu Annwn.
- id: n.pa.poem
  attach: pa.1.1
  kind: editorial
  status: draft
  text: "Preiddeu Annwn, 'the spoils of Annwn', is a poem of 60 lines in the Book of Taliesin (National Library of Wales, Peniarth MS 2, first quarter of the 14th century). The speaker tells of an expedition with Arthur, in three shiploads of his ship Prydwen, to Annwn or Annwfn, the otherworld of Welsh tradition; of all who went, only seven returned. It survives in this one copy, and its date is uncertain: Norris J. Lacy suggests that it took its present form about 900; Marged Haycock finds no firm linguistic evidence that it is older than the poets of the 12th century."
- id: n.pa.refrain
  attach: pa.1.10
  kind: editorial
  status: draft
  text: "Nam seith ny dyrreith o gaer sidi: 'except seven, none came back from Caer Siddi'. Each of the first six stanzas ends with this line, naming a different fortress: Caer Siddi, Caer Fedwyd, Caer Rigor, Caer Golud, Caer Fandwy, Caer Ochren. Caer Pedryfan ('four-cornered fortress') and Caer Wydyr ('glass fortress') are named within the stanzas. The names may be several places in Annwn or several names for one; the poem does not say."
- id: n.pa.gweir
  attach: pa.1.3
  kind: editorial
  status: draft
  text: "Gweir, imprisoned in Caer Siddi with a heavy chain, is probably the Gwair whom the Welsh Triads count among the 'Three Exalted Prisoners of the Island of Britain' (Rachel Bromwich). Pwyll and Pryderi are the father and son of the First Branch of the Mabinogi, where Pwyll exchanges places with Arawn, a king of Annwn, and comes to be called Pen Annwfn, 'Head of Annwn'."
- id: n.pa.cauldron
  attach: pa.2.5
  kind: editorial
  status: draft
  text: "The cauldron of the Head of Annwn, warmed by the breath of nine maidens and ringed with pearls, will not boil a coward's food. In Culhwch and Olwen, Arthur sails in Prydwen to Ireland to take the cauldron of Diwrnach, which likewise would not boil meat for a coward; in the Second Branch of the Mabinogi, only seven men return from Bran's expedition to Ireland, which also turns on a cauldron. These are the two analogues most often cited. Some have seen in the cauldron a forerunner of the Grail of the later romances; the evidence for that is indirect."
- id: n.pa.sword
  attach: pa.2.9
  kind: editorial
  status: draft
  text: "Cledyf lluch lleawc idaw rydyrchit, ac yn llaw leminawc yd edewit: 'a flashing sword of Lleawc was raised to it, and in the hand of Lleminawc it was left' is one reading; lluch may be 'flashing' or part of a name. In Culhwch and Olwen, Llenlleawc the Irishman seizes Arthur's sword Caledfwlch and kills Diwrnach's household; some scholars connect the two names, and the evidence is not conclusive."
- id: n.pa.monks
  attach: pa.7.1
  kind: editorial
  status: draft
  text: "The last two stanzas turn from the voyage to the speaker's scorn for monks, who 'congregate like wolves' and do not know when night and dawn divide or the course of the wind. Stanzas 4 to 6 begin in the same spirit, Ny obrynaf lawyr, read by modern translators as 'I set no value on little men' (Williams: 'I shall not deserve much from'); the sense is disputed. The speaker claims a knowledge the bookish lack; Haycock reads the poem as being 'about Taliesin and his vaunting of knowledge'. The first stanza opens and the last closes with praise of God."
- id: n.pa.w
  attach: pa.1.1.4
  kind: editorial
  status: draft
  text: "The letter ỽ in gỽlat and throughout is the Book of Taliesin's sign for w, which Skene reproduced in type; the same manuscript also writes plain w (wledic, prytwen). The row of normalized spelling writes both as w."
