# Notes for Nietzsche: Die fröhliche Wissenschaft §125 (1882).
- id: n.nz.fw125.lantern
  attach: nz.fw125.2
  kind: editorial
  status: draft
  leans_on: "Diogenes Laertius, Lives of the Eminent Philosophers 6.41"
  text: "The scene has three parts: a man with a lantern lit in the bright forenoon, a market, and a crowd. Diogenes Laertius tells of Diogenes the Cynic that he lit a lamp in broad daylight and said he was looking for a human being. The aphorism does not name Diogenes, and the parallel is a reader's association, though a close one: in both cases a lamp by day marks a search that the bystanders take for madness. The differences matter as much. Diogenes looks for a human being among people; the madman looks for God among people who already do not believe in God, and who laugh. Line 18 returns to the lantern: if night is coming on continually, lanterns will have to be lit in the forenoon, so the madman's lamp, absurd at the start, is given a reason by his own speech."
- id: n.nz.fw125.unbelievers
  attach: nz.fw125.4
  kind: editorial
  status: draft
  leans_on: "the passage itself; Die fröhliche Wissenschaft (1882) §108, in the same e-rara text"
  text: "The madman's hearers are not believers. They are Viele von Denen, many of those, welche nicht an Gott glaubten, who did not believe in God, and their questions (has he got lost, has he emigrated) are jokes. The speech that follows is addressed to them. Its claim is not that they are wrong to disbelieve, but that they have not understood what their disbelief means. This is the frame in which the words Gott ist todt are spoken. The phrase is not new in the book: §108 already says Gott ist todt, and adds that people may go on showing his shadow in caves for thousands of years."
- id: n.nz.fw125.dead
  attach: nz.fw125.20
  kind: editorial
  status: draft
  leans_on: "the passage itself; Common's translation (1910)"
  text: "Gott ist todt is often quoted alone, as a statement about whether God exists. The passage says something narrower and stranger. The death is a deed (That), done by a we that includes the speaker and the hearers: wir haben ihn getödtet, ihr und ich. It is described through images of loss of orientation: the sea drunk up, the horizon wiped away, the earth unchained from its sun, no longer an above or a below. And the deed is said to be too great for those who did it, and not yet arrived: the event is still on its way, and has not reached the ears of the people who committed it. On this reading the passage concerns the consequences of a loss of belief that its holders have not yet grasped. It does not argue that God does not exist, and it does not celebrate. The spelling todt and getödtet is that of the first edition; the modern spelling is tot, getötet."
- id: n.nz.fw125.requiem
  attach: nz.fw125.32.19
  kind: editorial
  status: draft
  leans_on: "the Roman Missal, Mass for the Dead, introit"
  text: "The Mass for the dead opens with the words Requiem aeternam dona eis, Domine, give them eternal rest, O Lord. The madman's Requiem aeternam deo turns the prayer around: eternal rest to God, sung in God's own churches. The last sentence calls the churches tombs and monuments (Grüfte und Grabmäler) of God. The aphorism ends in reported speech, with habe and sei: the narrator does not vouch for this part of the story (Man erzählt noch, it is further told)."
- id: n.nz.sound
  attach: nz.fw125.1
  kind: editorial
  status: draft
  leans_on: "W. Viëtor, Die Aussprache des Schriftdeutschen (1885); T. Siebs, Deutsche Bühnenaussprache (1898)"
  text: "The first sound scheme is a reconstruction of educated German of the 1880s, before the stage norm that Siebs published in 1898, and it is approximate. It models a general northern educated pronunciation: g at the end of a syllable as a fricative (Tag with kh, Weg with the h of huge), a trilled r in every position, st and sp at the start of a word part with sh, final devoicing, long ä apart from long e. Nietzsche grew up in Röcken and Naumburg, in the Prussian province of Saxony, and was schooled at Schulpforta. The scheme does not model the regional features of that area, such as the merging of p and b or t and d, because there is no recording of his voice and no description of his speech precise enough to say which of them he had. The first edition's spellings todt and That do not change the sound; diess may stand for a short vowel where modern dies has a long one."
