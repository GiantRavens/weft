# Weft edition of a passage by Friedrich Nietzsche, in the spelling of its first edition.
#
# fw125  Die fröhliche Wissenschaft (Chemnitz: Ernst Schmeitzner, 1882), §125, Der tolle Mensch,
#        pages 153-155, whole. Transcribed by Weft from the scan of the Zentralbibliothek Zürich copy
#        on e-rara (doi:10.3931/e-rara-72849) and checked against e-rara's OCR of the same copy by
#        the sensor in pipeline/weft/german.py (section field check: the OCR text with its running
#        page numbers set aside, compared without spaces). The OCR agrees with the scan except at one
#        token: on line 24 the page has a speck before um that the OCR reads as a full stop; the token
#        carries the OCR's reading in src. The print is in roman type and writes ss for ß (grosses,
#        besass) and the spellings todt, getödtet, That, diess, Giebt; it sets emphasis by spacing
#        the letters (Der tolle Mensch; Wir haben ihn getödtet; und doch haben sie dieselbe gethan),
#        which this edition does not mark.
#
# Weft divides the text into lines at the sentence; several short questions share a line.
#
#   t     the word as printed, punctuation and dashes attached ("Mensch. —", "„Ich", "— Also")
#   n     the modern spelling of the same word form (todt: tot, That: Tat);
#         Nietzsche's capitals on pronouns (Viele, Denen, Nichts) are lowercased. The page shows it
#         as "Modern spelling"; the sound of both schemes is computed from it
#         (pipeline/weft/german.py with pipeline/weft/data/de_lexicon.yaml)
#   src   the source's reading where it differs from the page (line 24, um)
