# Notes for Magna Carta, chapters 39-40.
- id: n.mc.39.sound
  attach: mc.39.1
  kind: editorial
  status: draft
  text: "The default reading is Latin as a clerk in England might have read it around 1215: soft c and g in the French manner, h silent, s between vowels sounded z, and no audible difference between long and short vowels. It is reconstructed from medieval spelling and from French and English sound history, so treat it as approximate. The classical reading is the second choice in the Loom."
- id: n.mc.39.liber
  attach: mc.39.1.2
  kind: editorial
  status: draft
  text: "Liber homo, 'free man', was a legal status. Villeins, the unfree tenants who made up a large part of the population, were not covered, as McKechnie's commentary stresses. Later readings widened the phrase to everyone."
- id: n.mc.39.norman
  attach: mc.39.1.8
  kind: editorial
  status: draft
  text: "Disseisiatur, imprisonetur and utlagetur are medieval Latin verbs formed from Anglo-Norman legal terms: disseisir, 'to dispossess of a freehold', imprisoner, and utlage, 'outlaw'. Outlaw itself came into English from Old Norse útlagi, 'one outside the law'."
- id: n.mc.39.vel
  attach: mc.39.3.7
  kind: editorial
  status: draft
  text: "Vel normally means 'or', and Bell translates it that way. McKechnie translates 'and by the law of the land'. The choice matters: with 'or', the law of the land alone could justify punishment; with 'and', judgment by peers would also be required. Historians have argued the point since the seventeenth century."
- id: n.mc.39.terre
  attach: mc.39.3.10
  kind: editorial
  status: draft
  text: "Terre is the medieval spelling of classical terrae, and justiciam in chapter 40 of iustitiam. Scribes wrote what they heard: by 1215 ae and e had long sounded alike, and ti before a vowel was said like ci. The classical reading in the Loom reads these medieval spellings letter by letter, which a Roman would not have written."
- id: n.mc.40.later
  attach: mc.40.1
  kind: editorial
  status: draft
  text: "The 1215 charter was annulled by Pope Innocent III within ten weeks, but it was reissued in 1216, 1217 and 1225. In the reissues, chapters 39 and 40 were joined as one chapter, 29. In its 1297 form that chapter remains on the statute book of England and Wales."
- id: n.mc.40.mckechnie
  attach: mc.40.1
  kind: quoted
  source: W. S. McKechnie, Magna Carta (1905), commentary on chapter 40
  text: "This chapter, like the preceding one with which it is so closely connected, has had much read into it by commentators which would have astonished its original framers."
