# Notes for 1 Corinthians 13.
- id: n.1cor.13.1.agape
  attach: 1cor.13.1.10
  kind: editorial
  status: draft
  leans_on: "LSJ and BDAG s.v. ἀγάπη"
  text: "Ἀγάπη is a noun that is rare in Greek before the Septuagint and the New Testament; the verb ἀγαπάω, 'to love, to value, to be content with', is older and common. Greek has other words for kinds of love, among them φιλία, friendship, and ἔρως, desire. Paul does not define ἀγάπη in this chapter. He describes it by what it does and does not do (verses 4-7) and by setting it beside speech, knowledge, faith and sacrifice, which without it count for nothing."
- id: n.1cor.13.1.charity
  attach: 1cor.13.1
  kind: editorial
  status: draft
  text: "The King James Version translates ἀγάπη as 'charity' in all nine places in this chapter, following the Latin caritas of the Vulgate, while Tyndale (1534) and the Geneva Bible (1599) say 'love'. In 1611 'charity' still meant love for God and neighbor, and the narrower sense of giving to the poor was only one part of it. That narrower sense now dominates, which is why most modern translations return to 'love'. The King James translators used 'love' for ἀγάπη in most other places, so the choice here was not a fixed rule."
- id: n.1cor.13.3.burned
  attach: 1cor.13.3.15
  kind: editorial
  status: draft
  leans_on: "SBLGNT apparatus at 1 Corinthians 13:3; B. M. Metzger, A Textual Commentary on the Greek New Testament (2nd ed. 1994), on 1 Corinthians 13:3"
  text: "The SBLGNT text marks καυθήσομαι with ⸀, its sign for a place where manuscripts differ, and this is one of the better known disagreements. The SBLGNT prints καυθήσομαι, 'I will be burned', the reading of most later manuscripts, and the one followed by all three English versions here. Several of the oldest manuscripts, including P46, Sinaiticus, Vaticanus and Alexandrinus, read καυχήσωμαι, 'that I may boast', and the Nestle-Aland edition prints that. The two words differ by two letters, θ for χ and ο for ω. The half-brackets the SBLGNT places around καὶ ἐὰν in verses 2 and 3 mark smaller differences in word order and wording."
- id: n.1cor.13.4.verbs
  attach: 1cor.13.4.3
  kind: editorial
  status: draft
  text: "Verses 4-7 describe love with fifteen verbs, all present tense and all with love as the subject. Eight are negated with οὐ (from 'is not jealous' to 'does not rejoice over injustice'). English often turns these verbs into adjectives ('love is patient, love is kind'); the Greek makes love the one who acts: μακροθυμεῖ, 'it is long-suffering', χρηστεύεται, 'it shows kindness'. Verse 7 closes the list with four short clauses that each begin with πάντα, 'all things'."
- id: n.1cor.13.12.esoptron
  attach: 1cor.13.12.5
  kind: editorial
  status: draft
  leans_on: "LSJ s.v. ἔσοπτρον, αἴνιγμα; Numbers 12:8 in the Septuagint"
  text: "Ἔσοπτρον is a mirror. Mirrors in the period were polished metal, often bronze, and gave a dim and imperfect image. Αἴνιγμα is a riddle or obscure saying, so ἐν αἰνίγματι is literally 'in a riddle'. The King James 'through a glass, darkly' uses 'glass' in its older sense of looking-glass; Tyndale has 'in a darke speakynge', which keeps the sense of speech. Many commentators hear Numbers 12:8, where God says that he speaks with Moses 'mouth to mouth', and in the Septuagint 'not through riddles', οὐ δι’ αἰνιγμάτων. Read that way, 'face to face' names the direct knowledge given to Moses, set against the present, indirect kind."
- id: n.1cor.13.12.known
  attach: 1cor.13.12.21
  kind: editorial
  status: draft
  text: "Ἐπιγνώσομαι, 'I will know fully', and ἐπεγνώσθην, 'I was fully known', use the compound ἐπιγινώσκω, set against the simple γινώσκω, 'I know', earlier in the verse. Ἐπεγνώσθην is an aorist passive with no agent named; the usual reading is 'as I have been known by God'. The English versions here say 'I am known', which reads the aorist as a present state."
- id: n.1cor.13.13.meizon
  attach: 1cor.13.13.10
  kind: editorial
  status: draft
  text: "Μείζων is a comparative, 'greater'. Koine Greek often uses the comparative where Classical Greek would use the superlative, especially with more than two items, and English versions translate it accordingly: 'the greatest of these' (King James), 'the chefe' (Tyndale), 'the chiefest' (Geneva)."
