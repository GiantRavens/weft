spans:
- lines:
  - 1cor.13.1
  - 1cor.13.1
  text: Though I speake with the tongues of men and Angels, and haue not loue, I am as sounding brasse, or a tinkling cymbal.
- lines:
  - 1cor.13.2
  - 1cor.13.2
  text: And though I had the gift of prophecie, and knewe all secrets and all knowledge, yea, if I had all faith, so that I could remooue mountaines and had not loue, I were nothing.
- lines:
  - 1cor.13.3
  - 1cor.13.3
  text: And though I feede the poore with all my goods, and though I giue my body, that I be burned, and haue not loue, it profiteth me nothing.
- lines:
  - 1cor.13.4
  - 1cor.13.4
  text: 'Loue suffreth long: it is bountifull: loue enuieth not: loue doeth not boast it selfe: it is not puffed vp:'
- lines:
  - 1cor.13.5
  - 1cor.13.5
  text: 'It doeth no vncomely thing: it seeketh not her owne things: it is not prouoked to anger: it thinketh not euill:'
- lines:
  - 1cor.13.6
  - 1cor.13.6
  text: 'It reioyceth not in iniquitie, but reioyceth in the trueth:'
- lines:
  - 1cor.13.7
  - 1cor.13.7
  text: 'It suffreth all things: it beleeueth all things: it hopeth all things: it endureth all things.'
- lines:
  - 1cor.13.8
  - 1cor.13.8
  text: Loue doeth neuer fall away, though that prophecyings be abolished, or the tongues cease, or knowledge vanish away.
- lines:
  - 1cor.13.9
  - 1cor.13.9
  text: For we knowe in part, and we prophecie in part.
- lines:
  - 1cor.13.10
  - 1cor.13.10
  text: But when that which is perfect, is come, then that which is in part, shalbe abolished.
- lines:
  - 1cor.13.11
  - 1cor.13.11
  text: 'When I was a childe, I spake as a childe, I vnderstoode as a childe, I thought as a childe: but when I became a man, I put away childish thinges.'
- lines:
  - 1cor.13.12
  - 1cor.13.12
  text: 'For nowe we see through a glasse darkely: but then shall wee see face to face. Nowe I know in part: but then shall I know euen as I am knowen.'
- lines:
  - 1cor.13.13
  - 1cor.13.13
  text: 'And nowe abideth faith, hope and loue, euen these three: but the chiefest of these is loue.'
