  lead: '1 Corinthians 13 is the thirteenth chapter of the First Epistle to the Corinthians in the New
    Testament of the Christian Bible. Authored by Paul the Apostle at Ephesus in the mid-50s AD, it is
    a sustained praise of love (ἀγάπη, agapē), the word rendered "charity" in the King James Version and
    "love" in most other English translations. The chapter stands at the centre of Paul''s discussion
    of spiritual gifts in chapters 12 to 14: Paul argues that no gift, however impressive, has any value
    without love, and that love, unlike the gifts, will never end.'
