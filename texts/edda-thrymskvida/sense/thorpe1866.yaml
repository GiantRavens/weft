# Benjamin Thorpe, Edda Sæmundar hinns Froða (1866), The Lay of Thrym, or the Hammer Recovered, verbatim
# from Project Gutenberg #14726. One span per edition stanza, matched by content: Thorpe's 7 and 8 are
# edition 7 (his speaker label "Loki." is kept between them, without Gutenberg's underscores for italics),
# and his 9-33 are edition 8-32. Line breaks from the Gutenberg wrapping are removed; no other change.
translation: thorpe1866
aligned_by: hand, phase 0; by content, one span per edition stanza
spans:
- lines:
  - thr.1.1
  - thr.1.8
  text: 'Wroth was Vingthor, when he awoke, and his hammer missed; his beard he shook, his forehead struck, the son of earth felt all around him;'
- lines:
  - thr.2.1
  - thr.2.8
  text: 'And first of all these words he uttered: "Hear now, Loki! what I now say, which no one knows anywhere on earth, nor in heaven above; the As''s hammer is stolen!"'
- lines:
  - thr.3.1
  - thr.3.8
  text: 'They went to the fair Freyia''s dwelling, and he these words first of all said: "Wilt thou me, Freyia, thy feather-garment lend, that perchance my hammer I may find?"'
- lines:
  - thr.4.1
  - thr.4.4
  text: '"That I would give thee, although of gold it were, and trust it to thee, though it were of silver."'
- lines:
  - thr.5.1
  - thr.5.6
  text: 'Flew then Loki--the plumage rattled--until he came beyond the Æsir''s dwellings, and came within the Jotun''s land.'
- lines:
  - thr.6.1
  - thr.6.6
  text: 'On a mound sat Thrym, the Thursar''s lord, for his greyhounds plaiting gold bands and his horses'' manes smoothing.'
- lines:
  - thr.7.1
  - thr.7.8
  text: '"How goes it with the Æsir? How goes it with the Alfar? Why art thou come alone to Jotunheim?" Loki. "Ill it goes with the Æsir, Ill it goes with the Alfar. Hast thou Hlorridi''s hammer hidden?"'
- lines:
  - thr.8.1
  - thr.8.8
  text: '"I have Hlorridi''s hammer hidden eight rasts beneath the earth; it shall no man get again, unless he bring me Freyia to wife."'
- lines:
  - thr.9.1
  - thr.9.10
  text: 'Flew then Loki--the plumage rattled--until he came beyond the Jotun''s dwellings, and came within the Æsir''s courts; there he met Thor, in the middle court, who these words first of all uttered.'
- lines:
  - thr.10.1
  - thr.10.8
  text: '"Hast thou had success as well as labour? Tell me from the air the long tidings. Oft of him who sits are the tales defective, and he who lies down utters falsehood."'
- lines:
  - thr.11.1
  - thr.11.8
  text: '"I have had labour and success: Thrym has thy hammer, the Thursar''s lord. It shall no man get again, unless he bring him Freyia to wife."'
- lines:
  - thr.12.1
  - thr.12.8
  text: 'They went the fair Freyia to find; and he those words first of all said: "Bind thee, Freyia, in bridal raiment, we two must drive to Jotunheim."'
- lines:
  - thr.13.1
  - thr.13.10
  text: 'Wroth then was Freyia, and with anger chafed, all the Æsir''s hall beneath her trembled: in shivers flew the famed Brisinga necklace. "Know me to be of women lewdest, if with thee I drive to Jotunheim."'
- lines:
  - thr.14.1
  - thr.14.8
  text: 'Straightway went the Æsir all to council, and the Asyniur all to hold converse; and deliberated the mighty gods, how they Hlorridi''s hammer might get back.'
- lines:
  - thr.15.1
  - thr.15.8
  text: 'Then said Heimdall, of Æsir brightest--he well foresaw, like other Vanir--"Let us clothe Thor with bridal raiment, let him have the famed Brisinga necklace.'
- lines:
  - thr.16.1
  - thr.16.8
  text: '"Let by his side keys jingle, and woman''s weeds fall round his knees, but on his breast place precious stones, and a neat coif set on his head."'
- lines:
  - thr.17.1
  - thr.17.6
  text: 'Then said Thor, the mighty As: "Me the Æsir will call womanish, if I let myself be clad in bridal raiment."'
- lines:
  - thr.18.1
  - thr.18.8
  text: 'Then spake Loki, Laufey''s son: "Do thou, Thor! refrain from suchlike words: forthwith the Jotuns will Asgard inhabit, unless thy hammer thou gettest back."'
- lines:
  - thr.19.1
  - thr.19.12
  text: 'Then they clad Thor in bridal raiment, and with the noble Brisinga necklace, let by his side keys jingle, and woman''s weeds fall round his knees; and on his breast placed precious stones, and a neat coif set on his head.'
- lines:
  - thr.20.1
  - thr.20.6
  text: 'Then said Loki, Laufey''s son: "I will with thee as a servant go: we two will drive to Jotunheim."'
- lines:
  - thr.21.1
  - thr.21.8
  text: 'Straightway were the goats homeward driven, hurried to the traces; they had fast to run. The rocks were shivered, the earth was in a blaze; Odin''s son drove to Jotunheim.'
- lines:
  - thr.22.1
  - thr.22.8
  text: 'Then said Thrym, the Thursar''s lord: "Rise up, Jotuns! and the benches deck, now they bring me Freyia to wife, Niord''s daughter, from Noatun.'
- lines:
  - thr.23.1
  - thr.23.8
  text: '"Hither to our court let bring gold-horned cows, all-black oxen, for the Jotuns'' joy. Treasures I have many, necklaces many, Freyia alone seemed to me wanting."'
- lines:
  - thr.24.1
  - thr.24.10
  text: 'In the evening they early came, and for the Jotuns beer was brought forth. Thor alone an ox devoured, salmons eight, and all the sweetmeats women should have. Sif''s consort drank three salds of mead.'
- lines:
  - thr.25.1
  - thr.25.8
  text: 'Then said Thrym, the Thursar''s prince: "Where hast thou seen brides eat more voraciously? I never saw brides feed more amply, nor a maiden drink more mead."'
- lines:
  - thr.26.1
  - thr.26.8
  text: 'Sat the all-crafty serving-maid close by, who words fitting found against the Jotun''s speech: "Freyia has nothing eaten for eight nights, so eager was she for Jotunheim."'
- lines:
  - thr.27.1
  - thr.27.8
  text: 'Under her veil he stooped desirous to salute her, but sprang back along the hall. "Why are so piercing Freyia''s looks? Methinks that fire burns from her eyes."'
- lines:
  - thr.28.1
  - thr.28.8
  text: 'Sat the all-crafty serving-maid close by, who words fitting found against the Jotun''s speech: "Freyia for eight nights has not slept, so eager was she for Jotunheim."'
- lines:
  - thr.29.1
  - thr.29.10
  text: 'In came the Jotun''s luckless sister, for a bride-gift she dared to ask: "Give me from thy hands the ruddy rings, if thou wouldst gain my love, my love and favour all."'
- lines:
  - thr.30.1
  - thr.30.8
  text: 'Then said Thrym, the Thursar''s lord: "Bring the hammer in, the bride to consecrate; lay Miollnir on the maiden''s knee; unite us each with other by the hand of Vor."'
- lines:
  - thr.31.1
  - thr.31.8
  text: 'Laughed Hlorridi''s soul in his breast, when the fierce-hearted his hammer recognized. He first slew Thrym, the Thursar''s lord, and the Jotun''s race all crushed;'
- lines:
  - thr.32.1
  - thr.32.10
  text: 'He slew the Jotun''s aged sister, her who a bride-gift had demanded; she a blow got instead of skillings, a hammer''s stroke for many rings. So got Odin''s son his hammer back.'
