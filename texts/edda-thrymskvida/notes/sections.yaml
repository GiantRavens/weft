# Notes for Þrymskviða. Editorial notes are drafts until a reviewer lifts them.
- id: n.thr.frame
  attach: thr.1.1
  kind: editorial
  status: draft
  leans_on: "Henry Adams Bellows, The Poetic Edda (1923), introductory note to Thrymskvitha"
  text: "Þrymskviða, 'the lay of Thrym', is a narrative poem of 32 stanzas. Thor wakes to find his hammer gone. Loki borrows Freyja's feather cloak, flies to the giant Thrym, and learns that Thrym has buried the hammer and will return it only if Freyja is given to him as wife. Freyja refuses, the gods meet in council, and Thor goes to the wedding dressed as the bride with Loki as his maid. When the hammer is brought in to hallow the marriage, Thor takes it and kills Thrym and his kin. The poem survives in one manuscript, the Codex Regius of about 1270, where it follows Lokasenna. The story is not told in Snorri Sturluson's Prose Edda."
- id: n.thr.edition
  attach: thr.7.5
  kind: editorial
  status: draft
  text: "This text is Guðni Jónsson's normalized edition. Its file prints stanza 7 as four numbered lines followed by the label 'Loki kvað' and four lines without a number; here those lines are 7.5 to 7.8, as in the usual numbering, and the speaker labels the edition places between stanzas are kept in the stanza headings. Bellows (1923) and Thorpe (1866) followed other editions and divide some stanzas differently, so each translation stanza is matched to this text by content. Two slips in the source are kept as printed and marked in the annotation: 'kvat' for kvað in 25.1, and a full stop after Hlórriða in 8.1, where the sentence continues."
- id: n.thr.mjollnir
  attach: thr.30.5.2
  kind: editorial
  status: draft
  leans_on: "Snorri Sturluson, Prose Edda, Gylfaginning 49 (Baldr's funeral) and 35 (Vár)"
  text: "The hammer is named only here, as Mjöllnir; elsewhere the poem calls it hamarr. The poem states what the hammer protects in Loki's warning at 18.5 to 18.8: unless Thor gets it back, the giants will soon settle in Ásgarðr. Thrym's use of it at the wedding is a second function. He orders it laid in the bride's lap 'to hallow the bride' (brúði at vígja) and asks that the pair be joined by the hand of Vár, whom Snorri describes as the goddess who hears the oaths made between men and women. In Snorri, Thor hallows Baldr's funeral pyre with Mjöllnir, and some runestones in Denmark and Sweden carry the formula 'may Thor hallow' (Þórr vígi). The poem does not explain the custom; it assumes the audience knows it."
- id: n.thr.loki
  attach: thr.3.6.1
  kind: editorial
  status: draft
  leans_on: "Snorri Sturluson, Prose Edda, Skáldskaparmál 1 (the abduction of Iðunn)"
  text: "fjaðrhamr is a 'feather shape' or feather cloak: a hamr is a skin or outer form, and in Old Norse a person can take on another hamr. Freyja owns this one; in Snorri's account of Iðunn, Loki borrows Freyja's falcon shape for a similar errand. In this poem Loki is the go-between throughout. He flies to Thrym and back, warns Thor not to refuse the disguise, and at the feast answers each of Thrym's suspicions on the bride's behalf (26, 28). The grammar marks his change of role: Thor proposes to Freyja that 'we two shall drive' with tvau, the neuter used for a man and a woman together (12.7), while Loki, offering to go as Thor's maid, says tvær, the feminine for two women (20.5)."
- id: n.thr.heimdall
  attach: thr.15.1
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), note to his stanza 14"
  text: "Heimdall is called hvítastr ása, 'whitest of the Æsir', and is said to know the future 'like the other Vanir' (sem vanir aðrir). The phrase is a crux: elsewhere Heimdall is counted among the Æsir, and editors disagree whether the line makes him one of the Vanir or only compares his foresight with theirs. His plan (15.5 to 16.8) lists the bride's dress item by item: the linen veil, the Brísinga necklace, keys hanging at the waist, a woman's skirts to the knee, broad stones on the breast and a headdress. Keys at the belt are usually taken as the sign of a married woman in charge of a household. Stanza 19 repeats the list almost word for word as the gods carry it out."
- id: n.thr.disguise
  attach: thr.24.5
  kind: editorial
  status: draft
  text: "Thor's objection in stanza 17 is that the Æsir will call him argr, a word for a man who is unmanly, which Old Norse law codes treat as a serious insult. The wedding scene then plays the disguise against Thor's nature. The bride eats a whole ox, eight salmon and the delicacies meant for the women, and drinks three measures (sáld) of mead. Thrym lifts the veil to kiss her and leaps back the length of the hall because of her eyes. Each time Loki supplies a reason in the same words, changing only the verb: Freyja has not eaten, then has not slept, for eight nights out of longing for Jötunheimar. The humour depends on the audience knowing who is under the veil while the giant does not; the poem never comments on it."
- id: n.thr.date
  attach: thr.1.2
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), introductory note; Peter Hallberg, 'Om Þrymskviða', Arkiv för nordisk filologi 69 (1954)"
  text: "The date of composition is debated. Bellows, following most critics of his day, placed the poem about 900, which would make it one of the oldest in the collection. Peter Hallberg argued in 1954, on vocabulary and style, for a composition in the 1200s, and suggested that Snorri Sturluson himself might be the author; other scholars have also proposed a late date, and others have defended an early one. The evidence on both sides is linguistic and stylistic and does not settle the question. Two facts are clear: the only witness is the Codex Regius of about 1270, and Snorri's Prose Edda does not tell this story, which has been read both as a sign that he did not know the poem and as compatible with his having written it."
- id: n.thr.form
  attach: thr.2.1
  kind: editorial
  status: draft
  text: "The metre is fornyrðislag, 'old-story metre': each long line has two half-lines bound by alliteration, with one or two staves in the first and one, on the first stressed word, in the second. Any vowel alliterates with any other, and with j. Unusually for the Edda, the poem tells its whole story in verse, with no prose links. It relies on repeated formulas: 'ok hann þat orða / alls fyrst of kvað' introduces speeches (2.1, 3.3, 9.9, 12.3), 'þursa dróttinn' follows Thrym's name, and whole stanzas recur as command and fulfilment (15-16 and 19) or as question and answer (26 and 28). A few stanzas are irregular in this edition: stanza 4 has four lines, and stanza 29 repeats 'ástir mínar' to make ten."
