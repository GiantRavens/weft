predicted_gaps:
  - "no treebank: every lemma and parse is hand-annotated (Zoëga as reference) and stays draft until reviewed"
  - "Bellows and Thorpe number the stanzas differently from this edition (Bellows joins 4 and 5, splits 19, and gives the last two lines a number of their own; Thorpe splits 7); spans are aligned by content"
  - "metre is fornyrðislag: the metre layer records half-line roles and staves, not feet; a few lines (stanza 4, 28.5, 29.9) are irregular and are scanned as best fits"
  - "the edition's ö covers both old ǫ and ø; read as ǫ by default"
  - "the source has two slips kept verbatim: kvat for kvað (25.1) and a full stop inside a sentence (8.1)"
