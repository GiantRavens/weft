# Notes on Grímnismál.
- id: n.grm.1.1.frame
  attach: grm.1.1
  kind: editorial
  status: draft
  text: "Grímnismál, 'the sayings of Grímnir', is spoken by Odin under a borrowed name while he sits bound between two fires in the hall of King Geirröðr. The Codex Regius sets the poem in a prose frame, which the source file keeps and the stanzas do not include. In Bellows's rendering: King Hrauthung had two sons, Agnar and Geirröth; shipwrecked as boys, they were fostered by a peasant couple, the wife caring for Agnar and the husband for Geirröth. On the way home Geirröth pushed the boat out with his brother in it, and became king. Odin and Frigg, watching from Hliðskjálf, wagered on Geirröth's character; Frigg's maid Fulla warned the king that a magician was coming, and Geirröth had the stranger in the blue cloak seized and set between two fires for eight nights. Only his ten-year-old son Agnar brought the prisoner a horn to drink. As the fire reached the cloak, Grímnir spoke."
- id: n.grm.1.1.metre
  attach: grm.1.1.1
  kind: editorial
  status: draft
  text: "Most stanzas are in ljóðaháttr, the measure of Hávamál and Vafþrúðnismál. The lists of names (stanzas 27 to 30, 36, 46 to 50, 54) are þulur, catalogue verse, where many lines pair two names by rhyme rather than by a stave; the metre layer marks those as list lines. The coloured first letters mark the staves; any vowel alliterates with any other, and so does j."
- id: n.grm.2.1.agnarr
  attach: grm.2.5.3
  kind: editorial
  status: draft
  text: "Agnarr here is the king's young son, named after the uncle whom Geirröðr set adrift. The poem's reward for one horn of drink is the whole of what follows, and in the closing prose Agnarr is king after his father falls on his own sword."
- id: n.grm.4.1.halls
  attach: grm.4.1.1
  kind: editorial
  status: draft
  text: "Stanzas 4 to 17 number the dwellings of the gods, Þrúðheimr for Thor, Ýdalir for Ullr, Álfheimr for Freyr, and so on to Nóatún and Víðarr's land. Snorri's Gylfaginning quotes most of them in order; the halls are otherwise known only from this poem."
- id: n.grm.8.3.valhöll
  attach: grm.8.3.1
  kind: editorial
  status: draft
  text: "Valhöll, 'the hall of the slain', is the subject of stanzas 8 to 10 and 18 to 26: Odin's choice of the weapon-dead, the hall roofed with shields and raftered with spear-shafts, the boar Sæhrímnir, the wolves Geri and Freki, the ravens Huginn and Muninn, the goat Heiðrún and the hart Eikþyrnir feeding on the tree Læraðr."
- id: n.grm.20.1.ravens
  attach: grm.20.1.1
  kind: editorial
  status: draft
  text: "Huginn and Muninn, 'thought' and 'memory' (hugr, munr), fly over the world each day. Odin's fear for Muninn more than for Huginn is one of the poem's few personal lines, and Snorri repeats it."
- id: n.grm.31.1.roots
  attach: grm.31.1.2
  kind: editorial
  status: draft
  text: "The three roots of the ash Yggdrasill, under Hel, the frost-giants and mankind, with the squirrel Ratatoskr, the four harts and the serpents below (stanzas 31 to 35), are the fullest Eddic picture of the world tree, and the one Snorri builds on in Gylfaginning."
- id: n.grm.36.5.herfjötur
  attach: grm.36.5.3
  kind: editorial
  status: draft
  text: "Herfjötur, 'war-fetter', one of the valkyries listed here, is also the name of the paralysing fear that falls on a warrior in battle, as in the sagas. The list gives thirteen valkyrie names; Völuspá 30 gives six, three of them the same."
- id: n.grm.46.1.names
  attach: grm.46.1.2
  kind: editorial
  status: draft
  text: "Stanzas 46 to 50 and 54 list some fifty names of Odin. Grímr and Grímnir, 'the masked one', are the names of this poem; Gangleri, 'the wanderer', is the name Gylfi takes in Snorri's Gylfaginning; Hárbarðr is the ferryman of Hárbarðsljóð; Bölverkr is the name under which Odin won the mead of poetry. The glosses give the names as names; where a meaning is agreed the notes or the dictionaries supply it."
- id: n.grm.53.4.disir
  attach: grm.53.4.3
  kind: editorial
  status: draft
  text: "Úfar ro dísir, 'the dísir are hostile': the dísir are female guardian spirits attached to a family or a person; when they turn away, death follows. The line tells Geirröðr his luck has left him, the same idea as the hamingja of Vafþrúðnismál 49."
