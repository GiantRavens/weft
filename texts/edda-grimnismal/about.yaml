  lead: 'Grímnismál (Old Norse: [ˈɡriːmnesˌmɔːl]; ''The Speech of Grímnir'') is one of the mythological
    poems of the Poetic Edda. It is preserved in the Codex Regius manuscript and the AM 748 I 4to fragment.
    It is spoken through the voice of Grímnir, one of the many guises of the god Odin. The very name suggests
    guise, or mask or hood. Through an error, King Geirröth tortured Odin-as-Grímnir, a fatal mistake,
    since Odin caused him to fall upon his own sword. The poem is written mostly in the ljóðaháttr metre,
    typical for wisdom verse.'
