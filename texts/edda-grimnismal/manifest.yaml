predicted_gaps:
- 'no treebank: every lemma and parse is hand-annotated (Zoëga as reference) and stays draft until reviewed'
- normalized edition marks vowel length, so no quantity table is needed
- 'metre is alliterative (ljóðaháttr, with some stanzas in fornyrðislag or irregular): the metre layer records half-line roles and staves,
  not feet'
- the edition's ö covers both old ǫ and ø; read as ǫ by default
- the prose frame (Frá sonum Hrauðungs konungs, and the closing lines on Geirröðr's death) stands in the source file but is not a stanza;
  the notes summarize it, and Bellows's translation of it is cited there
- the poem is a monologue by Grímnir (Odin) spoken between the fires; the edition names the speaker only inside the prose, so the stanzas
  carry no speaker heading
- the last forty-seven stanzas are largely lists of names (halls, rivers, horses, names of Odin); glosses give the name and, where a
  sense is agreed, its meaning
