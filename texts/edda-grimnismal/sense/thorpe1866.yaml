# Verbatim from sources/thorpe1866.txt (The Lay of Grimnir); see manifest for the edition.
translation: thorpe1866
aligned_by: hand, phase 0; one span per stanza (prose); Thorpe numbers the 54 stanzas as the standard text does (2026-10-08)
spans:
- lines:
  - grm.1.1
  - grm.1.6
  text: Fire! thou art hot, and much too great; flame! let us separate. My garment is singed, although I lift it up, my cloak is scorched before it.
- lines:
  - grm.2.1
  - grm.2.8
  text: Eight nights have I sat between fires here, and to me no one food has offered, save only Agnar, the son of Geirröd, who alone shall rule over the land of Goths.
- lines:
  - grm.3.1
  - grm.3.6
  text: Be thou blessed, Agnar! as blessed as the god of men bids thee to be. For one draught thou never shalt get better recompense.
- lines:
  - grm.4.1
  - grm.4.6
  text: Holy is the land, which I see lying to Æsir and Alfar near; but in Thrûdheim Thor shall dwell until the powers perish.
- lines:
  - grm.5.1
  - grm.5.6
  text: Ydalir it is called, where Ullr has himself a dwelling made. Alfheim the gods to Frey gave in days of yore for a tooth-gift.
- lines:
  - grm.6.1
  - grm.6.6
  text: The third dwelling is, where the kind powers have with silver decked the hall; Valaskiâlf 'tis called, which for himself acquired the As in days of old.
- lines:
  - grm.7.1
  - grm.7.6
  text: Sökkvabekk the fourth is named o'er which the gelid waves resound; Odin and Saga there, joyful each day, from golden beakers quaff.
- lines:
  - grm.8.1
  - grm.8.6
  text: Gladsheim the fifth is named, there the golden-bright Valhall stands spacious, there Hropt selects each day those men who die by weapons.
- lines:
  - grm.9.1
  - grm.9.6
  text: Easily to be known is, by those who to Odin come, the mansion by its aspect. Its roof with spears is laid, its hall with shields is decked, with corslets are its benches strewed.
- lines:
  - grm.10.1
  - grm.10.6
  text: Easily to be known is, by those who to Odin come, the mansion by its aspect. A wolf hangs before the western door, over it an eagle hovers.
- lines:
  - grm.11.1
  - grm.11.6
  text: Thrymheim the sixth is named, where Thiassi dwelt that all-powerful Jötun; but Skadi now inhabits, the bright bride of gods, her father's ancient home.
- lines:
  - grm.12.1
  - grm.12.6
  text: Breidablik is the seventh, where Baldr has built for himself a hall, in that land, in which I know exists the fewest crimes.
- lines:
  - grm.13.1
  - grm.13.6
  text: 'Himinbiörg is the eighth, where Heimdall, it is said, rules o''er the holy fanes: there the gods'' watchman, in his tranquil home, drinks joyful the good mead.'
- lines:
  - grm.14.1
  - grm.14.6
  text: Fôlkvang is the ninth, there Freyia directs the sittings in the hall. She half the fallen chooses each day, but Odin th' other half.
- lines:
  - grm.15.1
  - grm.15.6
  text: Glitnir is the tenth; it is on gold sustained, and eke with silver decked. There Forseti dwells throughout all time, and every strife allays.
- lines:
  - grm.16.1
  - grm.16.6
  text: Nôatûn is the eleventh, there Niörd has himself a dwelling made, prince of men; guiltless of sin, he rules o'er the high-built fane.
- lines:
  - grm.17.1
  - grm.17.6
  text: 'O''ergrown with branches and high grass is Vidar''s spacious Landvîdi: There will the son descend, from the steed''s back, bold to avenge his father.'
- lines:
  - grm.18.1
  - grm.18.6
  text: Andhrimnir makes, in Eldhrimnir, Sæhrimnir to boil, of meats the best; but few know how many Einheriar it feeds.
- lines:
  - grm.19.1
  - grm.19.6
  text: Geri and Freki the war-wont sates, the triumphant sire of hosts; but on wine only the famed in arms, Odin, ever lives.
- lines:
  - grm.20.1
  - grm.20.6
  text: Hugin and Munin fly each day over the spacious earth. I fear for Hugin, that he come not back, yet more anxious am I for Munin.
- lines:
  - grm.21.1
  - grm.21.6
  text: Thund roars; joyful in Thiodvitnir's water lives the fish; the rapid river seems too great for the battle-steed to ford.
- lines:
  - grm.22.1
  - grm.22.6
  text: 'Valgrind is the lattice called, in the plain that stands, holy before the holy gates: ancient is that lattice, but few only know how it is closed with lock.'
- lines:
  - grm.23.1
  - grm.23.6
  text: Five hundred doors, and forty eke, I think, are in Valhall. Eight hundred Einheriar will at once from each door go when they issue with the wolf to fight.
- lines:
  - grm.24.1
  - grm.24.6
  text: Five hundred floors, and forty eke, I think, has Bilskirnir with its windings. Of all the roofed houses that I know, is my son's the greatest.
- lines:
  - grm.25.1
  - grm.25.6
  text: Heidrûn the goat is called, that stands o'er Odin's hall, and bites from Lærâd's branches. He a bowl shall fill with the bright mead; that drink shall never fail.
- lines:
  - grm.26.1
  - grm.26.6
  text: Eikthyrnir the hart is called, that stands o'er Odin's hall, and bites from Lærâd's branches; from his horns fall drops into Hvergelmir, whence all waters rise:--
- lines:
  - grm.27.1
  - grm.27.11
  text: 'Sid and Vid, Soekin and Eikin, Svöl and Gunnthrô, Fiörm and Fimbulthul, Rin and Rennandi, Gipul and Göpul, Gömul and Geirvimul: they round the gods'' dwelling wind. Thyn and Vin, Thöll and Höll,
    Grâd and Gunnthorin.'
- lines:
  - grm.28.1
  - grm.28.12
  text: Vina one is called, a second Vegsvin, a third Thiodnuma; Nyt and Nön and Hrön, Slid and Hrid, Sylg and Ylg, Vîd and Vân, Vönd and Strönd, Gioll and Leipt; these (two) fall near to men, but fall
    hence to Hel.
- lines:
  - grm.29.1
  - grm.29.9
  text: 'Körmt and Ormt, and the Kerlaugs twain: these Thor must wade each day, when he to council goes at Yggdrasil''s ash; for the As-bridge is all on fire, the holy waters boil.'
- lines:
  - grm.30.1
  - grm.30.9
  text: Glad and Gyllir, Gler and Skeidbrimir, Sillfrintopp and Sinir, Gisl and Falhôfnir, Gulltopp and Lettfeti; on these steeds the Æsir each day ride, when they to council go, at Yggdrasil's ash.
- lines:
  - grm.31.1
  - grm.31.6
  text: 'Three roots stand on three ways under Yggdrasil''s ash: Hel under one abides, under the second the Hrimthursar, under the third mankind.'
- lines:
  - grm.32.1
  - grm.32.6
  text: Ratatösk is the squirrel named, which, has to run in Yggdrasil's ash; he from above the eagle's words must carry, and beneath to Nidhögg repeat.
- lines:
  - grm.33.1
  - grm.33.5
  text: Harts there are also four, which from its summits, arch-necked, gnaw. Dâin and Dvalin, Duneyr and Durathrôr.
- lines:
  - grm.34.1
  - grm.34.9
  text: 'More serpents lie under Yggdrasil''s ash, than any one would think of witless mortals: Gôin and Môin,--they are Grafvitnir''s sons--Grâbak and Grafvöllud, Ofnir and Svafnir, will, I ween, the branches
    of that tree ever lacerate.'
- lines:
  - grm.35.1
  - grm.35.6
  text: Yggdrasil's ash hardship suffers greater than men know of; a hart bites it above, and in its side it rots, Nidhögg beneath tears it.
- lines:
  - grm.36.1
  - grm.36.9
  text: Hrist and Mist the horn shall bear me Skeggöld and Skögul, Hlökk and Herfiotur, Hildi and Thrûdi, Göll and Geirölul, Randgríd and Râdgrîd, and Reginleif, these bear beer to the Einheriar.
- lines:
  - grm.37.1
  - grm.37.6
  text: 'Arvakr and Alsvid, theirs ''tis up hence fasting the sun to draw: under their shoulder the gentle powers, the Æsir, have concealed an iron-coolness.'
- lines:
  - grm.38.1
  - grm.38.6
  text: Svalin the shield is called, which stands before the sun, the refulgent deity; rocks and ocean must, I ween, be burnt, fell it from its place.
- lines:
  - grm.39.1
  - grm.39.6
  text: Sköll the wolf is named, that the fair-faced goddess to the ocean chases; another Hati hight, he is Hrôdvitnir's son; he the bright maid of heaven shall precede.
- lines:
  - grm.40.1
  - grm.40.6
  text: Of Ymir's flesh was earth created, of his blood the sea, of his bones the hills, of his hair trees and plants, of his skull the heaven;
- lines:
  - grm.41.1
  - grm.41.6
  text: And of his brows the gentle powers formed Midgard for the sons of men; but of his brain the heavy clouds are all created.
- lines:
  - grm.42.1
  - grm.42.6
  text: Ullr's and all the gods' favour shall have, whoever first shall look to the fire; for open will the dwelling be, to the Æsir's sons, when the kettles are lifted off.[12]
- lines:
  - grm.43.1
  - grm.43.6
  text: Ivaldi's sons went in days of old Skidbladnir to form, of ships the best, for the bright Frey, Niörd's benign son.
- lines:
  - grm.44.1
  - grm.44.9
  text: Yggdrasil's ash is of all trees most excellent, and of all ships, Skidbladnir, of the Æsir, Odin, and of horses, Sleipnir, Bifröst of bridges, and of skallds, Bragi, Hâbrôk of hawks, and of dogs,
    Garm, [Brimir of swords.]
- lines:
  - grm.45.1
  - grm.45.7
  text: Now I my face have raised to the gods' triumphant sons, at that will welcome help awake; from all the Æsir, that shall penetrate, to Oegir's bench, to Oegir's compotation.[13]
- lines:
  - grm.46.1
  - grm.46.6
  text: I am called Grim, I am called Gangleri, Herian and Hiâlmberi, Thekk and Thridi, Thund and Ud, Helblindi and Har,
- lines:
  - grm.47.1
  - grm.47.7
  text: Sad and Svipall, and Sanngetall, Herteit and Hnikar Bileyg, Bâleyg, Bölverk, Fiölnir, Grîm and Grimnir, Glapsvid and Fiölsvid,
- lines:
  - grm.48.1
  - grm.48.7
  text: Sîdhött, Sîdskegg Sigfödr, Hnikud, Alfodr, Valfödr, Atrid and Farmatyr; by one name I never have been called, since among men I have gone.
- lines:
  - grm.49.1
  - grm.49.10
  text: Grimnir I am called at Geirröd's, and at Asmund's Jâlk and Kialar, when a sledge I drew; Thrôr at the public meetings, Vidur in battles, Oski and Omi, Jafnhâr and Biflindi, Gôndlir and Harbard with
    the gods.
- lines:
  - grm.50.1
  - grm.50.6
  text: Svidur and Svidrir I was at Sökkmimir's called, and beguiled that ancient Jötun, when of Midvitnir's renowned son I was the sole destroyer.
- lines:
  - grm.51.1
  - grm.51.6
  text: Drunken art thou, Geirröd, thou hast drunk too much, thou art greatly by mead beguiled. Much didst thou lose, when thou wast of my help bereft, of all the Einheriar's and Odin's favour.
- lines:
  - grm.52.1
  - grm.52.6
  text: 'Many things I told thee, but thou hast few remembered: thy friends mislead thee. My friend''s sword lying I see, with blood all dripping.'
- lines:
  - grm.53.1
  - grm.53.6
  text: 'The fallen by the sword Ygg shall now have; thy life is now run out: Wroth with thee are the Dîsir: Odin thou now shalt see: draw near to me if thou canst.'
- lines:
  - grm.54.1
  - grm.54.9
  text: Odin I now am named, Ygg I was called before, before that, Thund, Vakr and Skilfing, Vâfudr and Hrôptatyr, with the gods, Gaut and Jâlk, Ofnir and Svafnir, all which I believe to be names of me
    alone.
