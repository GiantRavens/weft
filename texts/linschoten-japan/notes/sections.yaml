# Notes for Linschoten, Itinerario, chapter 26 (Van't Eylandt van Iapan), the opening.
- id: n.itin.26.author
  attach: itin.26.1
  kind: editorial
  status: draft
  leans_on: "P. A. Tiele, introduction to The Voyage of John Huyghen van Linschoten to the East Indies (Hakluyt Society, 1885), volume 1, pages xxiii-xl"
  text: "Jan Huygen van Linschoten was born about 1563 at Haarlem and grew up at Enkhuizen. In December 1576, at about sixteen, he sailed to Spain to join two brothers at Seville; he later worked in a merchant's house at Lisbon, and in April 1583 he sailed for India in the household of Vicente da Fonseca, the new Archbishop of Goa. He stayed in Goa about five years as the archbishop's clerk. The archbishop left for Portugal in January 1587 and died soon after; when the news reached Goa in 1588, Linschoten resolved to go home. He left India in January 1589, spent more than two years on Terceira in the Azores, and reached Enkhuizen again in September 1592. He sailed on the Dutch voyages to the north of Russia in 1594 and 1595, settled at Enkhuizen as treasurer of the town, and died there in February 1611. The Itinerario is the account of the Indian years, written after his return; the States-General licensed it in October 1594, and the first part, which holds this chapter, was printed by Cornelis Claesz at Amsterdam early in 1596."
- id: n.itin.26.sources
  attach: itin.26.1
  kind: editorial
  status: draft
  leans_on: "A. C. Burnell's note to chapter 26 in the Hakluyt Society edition (1885), volume 1, page 151; Linschoten's letter to his parents and the account of Dirck Gerritsz in Tiele's introduction, pages xxvi-xxvii; chapter 26 itself (1598 English, pages 161-162)"
  text: "Linschoten did not go to Japan, and the chapter does not claim that he did. In a letter from Goa he told his parents that he wished to travel to China and Japan but lacked the money to trade on the voyage; Tiele adds that the occasion did not recur. Burnell traced the chapter to three kinds of source. Part follows the Historia of the Augustinian Juan González de Mendoza on China (1585); much agrees with the Jesuit Giovanni Pietro Maffei, whose Historiarum Indicarum libri (1588) printed the letters of the Jesuits in Japan; and some comes from the Japanese embassy to Rome, whose members Linschoten says he found in Goa in 1583 and saw again on their return in 1587. A further informant was Dirck Gerritsz of Enkhuizen, called China, a gunner on Portuguese ships who had sailed to Japan and gave Linschoten the courses between China and Japan. The chapter is therefore a compilation from written and oral reports gathered in Goa, not an eyewitness description."
- id: n.itin.26.route
  attach: itin.26.4
  kind: editorial
  status: draft
  leans_on: "Tiele, introduction (1885), pages xxix-xxxvii"
  text: "Lines 4 and 5 give the position of Japan as a pilot would want it: the latitudes, the distance from the Chinese coast, the course north-east from Macao, and the harbour. Information of this kind had been held by the Portuguese crown and its pilots. Linschoten published it in two parts. The Reys-gheschrift, a collection of sailing directions translated from Portuguese and Spanish pilots' manuscripts, was printed in 1595, before the Itinerario itself; the Itinerario added the description of the countries and their trade. Tiele argues from the journals of the first Dutch voyage to the East (1595-1597) that the book was used on board, and that the fleet's choice of a route to Java followed Linschoten's advice. The claim that the work opened the route to Dutch and English rivals of Portugal is commonly made; the evidence in the pinned sources is Tiele's, and concerns the Dutch voyage only."
- id: n.itin.26.nangasache
  attach: itin.26.5.13
  kind: editorial
  status: draft
  leans_on: "C. R. Boxer, The Christian Century in Japan, 1549-1650 (1951), chapter 3; the 1598 English (Nangasache)"
  text: "Nangasache is Nagasaki, in a spelling close to the Portuguese form Nangasaque, which writes an n before the g. The Portuguese ships from Macao began to put in there in 1571, and by the time Linschoten wrote it was their regular harbour, as the line says. How a Dutch reader of 1596 said the ch of Nangasache is not known; Weft reads it as the Dutch ch, and the Portuguese spelling suggests that a k was meant."
- id: n.itin.26.silver
  attach: itin.26.18
  kind: editorial
  status: draft
  leans_on: "chapters 25 and 26 of the Itinerario (Kern 1910, volume 1, pages 99-104); Burnell's note to the 1598 English, volume 1, page 153, citing Camões, Os Lusíadas, canto 10, stanza 131"
  text: "Line 18 states the trade that brought the Portuguese to Japan: Japanese silver carried each year to China and exchanged for silk and other Chinese goods, which the Japanese lacked. The chapter before this one describes the voyage that carried it. Each year the king of Portugal granted one captaincy of the Japan voyage, as a reward for service; no other ship might make it. The captain's ship went from Goa by Malacca to Macao, carried silk from Macao to Japan, and brought back only silver. With the waits for the monsoons the round trip took about three years, and Linschoten puts the profit of one voyage at 150,000 to 200,000 ducats. Burnell notes that Camões already called Japan the land of fine silver in Os Lusíadas (1572)."
- id: n.itin.26.rest
  attach: itin.26.22
  kind: editorial
  status: draft
  leans_on: "chapter 26 in the 1598 English, Hakluyt Society edition (1885), volume 1, pages 153-165, with Burnell's notes"
  text: "The edition stops here; the chapter continues for about ten more pages. Linschoten goes on to the punishment of those who draw a sword, the practice of cutting open one's own belly, which Burnell calls an early European account of what is now named hara-kiri, and a story that the Japanese descend from Chinese conspirators banished to the empty islands, which he gives as the reason Japanese customs are the reverse of Chinese ones. Burnell found the story in the French and English versions of Mendoza but not in the Spanish edition of 1596. Then come examples of reversed customs, rice wine, the drinking of chaa (tea), the value placed on old porcelain, pictures and weapons, government and revenue, language and religion, the Japanese embassy to Rome, and the Jesuits. On the Jesuits Linschoten is hostile: he writes that they obtained from the Pope and the King of Spain the right to admit or exclude every European in Japan, and that they gained wealth and reverence from their converts. The chapter ends with Korea and the Ryukyu islands."
- id: n.itin.26.english
  attach: itin.26.1
  kind: editorial
  status: draft
  leans_on: "John Wolfe, epistle dedicatory to the 1598 translation; Burnell's notes on the English version, quoted by Tiele, introduction (1885), pages xl-xlii"
  text: "The English translation was printed in London by John Wolfe in 1598 as John Huighen van Linschoten his Discours of Voyages into ye Easte and West Indies. The translator is not named; the title of the second book carries the initials W. P., usually taken to stand for William Phillip. In his dedication Wolfe says that a learned gentleman brought him the Dutch book a year earlier and urged its translation as useful to the English nation. The gentleman is often identified as Richard Hakluyt, the collector of English voyages, but the dedication does not name him. Burnell judged the translation loose: the translator often adds a synonym where the Dutch has one word, and the 1885 edition marks such additions with square brackets, as in the English shown here. German and Latin translations followed in 1598 and 1599, and a French one in 1610."
- id: n.itin.26.sound
  attach: itin.26.1
  kind: editorial
  status: draft
  leans_on: "Twe-spraack vande Nederduitsche letterkunst (Amsterdam, 1584); M. Schönfeld, Historische grammatica van het Nederlands, ed. A. van Loey (1959)"
  text: "The first sound scheme is an approximate reconstruction of Holland Dutch around 1596, not Linschoten's own speech, which may have kept features of Haarlem and of West Frisian Enkhuizen. It rests on the spelling of the period and on the Twe-spraack of 1584, a grammar by members of the Amsterdam chamber of rhetoric. The main uncertainty is the vowel written ij or y (by, mylen, zijn). It was once a long i; by 1596 it was becoming a diphthong in Holland, and the scheme gives it as [ei], kept apart from the ei of cleyne and Eylandt. The ui of huysen is given as a diphthong for the same reason. g and gh are a voiced fricative, sch is s followed by the ch of loch, and the -en of plurals keeps its n. The stress of French loans such as passeert, curieus and courtosye is given on the last syllable, as in modern Dutch; for 1596 this is an assumption."
