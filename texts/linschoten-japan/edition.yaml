# Weft edition of the opening of chapter 26 of Jan Huygen van Linschoten's Itinerario (Amsterdam,
# Cornelis Claesz, 1596), "Van't Eylandt van Iapan", in the text of H. Kern's edition for the
# Linschoten-Vereeniging (The Hague, 1910), volume 1, pages 103-104. Kern reprints the 1596 text in
# roman type, keeping its spelling (u for v in seluen, I for J in Iapan, y for ij in by and mylen)
# and printing the folio numbers of 1596 in the margin ([34b], [35a]).
#
# The text was transcribed from the page scans of the archive.org copy (itinerariovoyage01lins) and
# is checked against that copy's OCR (the hOCR file, sources/kern1910-hocr.html) by the sensor in
# pipeline/weft/dutch.py (line_checks; failure class edition-not-in-source). The sensor reads only
# the words inside the body column of each page (ocr_check.pages: x0, y0, x1, y1 in scan pixels),
# which sets aside Kern's marginal summaries, the running head and the footnotes; it rejoins words
# hyphenated at a line end and compares without spaces, because the OCR both splits words (s weert)
# and joins them (jaght,waer). Where the OCR misreads the scan, the token says what the OCR has
# (ocr); each such reading was checked against the scan:
#   itin.26.2   ghecommuniceert   OCR prefixes a stray mark from the margin (ö)
#   itin.26.12  eenen             OCR ecnen
#   itin.26.13  ooc (the first), alle   OCR 00c, ajje
#   itin.26.18  de                OCR prefixes marginal debris (&J*')
#   itin.26.19  Silver te         OCR Sil- ^^ ^ (the start of the line is unread)
#   itin.26.21  is,               OCR keeps Kern's footnote mark (x)), set aside here
#   itin.26.22  natien soo goede  OCR natiën so° goeCie; the scan has natien, without the diaeresis
# Weft divides the text into lines at the sentence, the semicolon and, in the longest sentences,
# at a clause.
#
#   t     the word as printed in 1910 (= 1596), punctuation attached (Rivieren;)
#   n     the modern Dutch spelling of the same word form (sekerheyt: zekerheid; ende stays ende);
#         clitic groups are written apart (van't: van 't, datter: dat er). The page shows it as
#         "Modern spelling"; the sound of both schemes is computed from it
#         (pipeline/weft/dutch.py with pipeline/weft/data/nl_lexicon.yaml)
#   ocr   the OCR's reading of this token where it differs from the scan (see above)
#   ipa   {scheme: ipa} override for this occurrence
