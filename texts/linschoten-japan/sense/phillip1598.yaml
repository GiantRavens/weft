# William Phillip's English translation (London, 1598), chapter 26, as edited by A. C. Burnell and
# P. A. Tiele for the Hakluyt Society (1885), volume 1, pages 151-153; verbatim from the archive.org
# OCR, checked against the page scans. Square brackets are the 1885 editors': words the 1598
# translator added to the Dutch. The 1885 edition prints the 1598 ee ligature as ée (Créekes).
# Corrections of clear OCR errors, each checked against the scan:
#   Hand, Hands -> Iland, Ilands; lapan, lapens, lapeans -> Iapan, Iapens, Iapeans;
#   de\'ided -> devided; althoiigh -> although; souglit -> sought; finne -> firme;
#   trafiöque -> traffique; Nangasaehe -> Nangasache; mucli -> much; Come -> Corne (twice);
#   hut -> but (twice); unfruitfuU -> unfruitfull; skilfuU -> skilfull; liath -> hath; qnickly -> quickly; thiiig -> thing;
#   comnion -> common; cnrtesio -> curtesie (the type is damaged in the scan).
#   weé -> wee: a stray mark over the e in the scan, not an accent of the edition's ée.
# Footnote marks (Iapan³, knowne,⁵) are removed, and words broken at a line end are rejoined.
translation: phillip1598
aligned_by: hand, phase 0; one span per English sentence or clause group, matched to the Dutch lines
spans:
- lines: [itin.26.1, itin.26.1]
  text: "The Iland or the land of Iapan is many Ilands one by the other, and are seperated and devided only by certaine small Créekes and rivers,"
- lines: [itin.26.2, itin.26.2]
  text: "it is a great land, although as yet the circuite thereof is not knowne, [because as yet it is] not discovered, nor by the Portingalles sought into,"
- lines: [itin.26.3, itin.26.3]
  text: "it beginneth under 30. degrées, and runneth till you come to 38 degrées,"
- lines: [itin.26.4, itin.26.5]
  text: "it lyeth East from the firme land of China, about 80. miles, and from Maccau by the waye that the Portingalles travaile Northeast warde, is about 300. miles, and the Haven where commonly the Portingals use to traffique, is called Nangasache. They have likewise other places where they traffique and deale."
- lines: [itin.26.6, itin.26.7]
  text: "The countrie is cold, [procéeding] of much rayne, Snow and Ice, [that falleth therein], it hath some Corne lande, but their common Corne is Ryce."
- lines: [itin.26.8, itin.26.9]
  text: "In some places the land is verie hillie and unfruitfull, they eate no flesh but the flesh of wilde beasts, and [such as is] hunted, wherein they are verie expert,"
- lines: [itin.26.10, itin.26.11]
  text: "although there are Oxen, Cowes, Shéepe, and such like Cattell good store, yet they use them to other thinges [about their] labours, [and] because it is tame flesh, which they cannot brooke, they refuse it as wee do horse flesh,"
- lines: [itin.26.12, itin.26.12]
  text: "they doe likewise refuse to eate Milke, as wee doe bloud, saying that Milke although it is white, yet it is verie bloude."
- lines: [itin.26.13, itin.26.13]
  text: "They have much Fish, whereof they are verie desirous, as also all kindes of fruites, as in China."
- lines: [itin.26.14, itin.26.15]
  text: "Their houses are commonly covered with wood, and with strawe, they are fine and workmanlike builte, specially the rich mens houses, they have their Chambers hanged and flowred with Mattes, which is their best hangings."
- lines: [itin.26.16, itin.26.17]
  text: "The Iapens are not so curious nor so cleanly as the men of China, but are contente with a meane, yet for the most part they goe verie well apparelled in Silke, almost like the Chinos."
- lines: [itin.26.18, itin.26.18]
  text: "The countrie hath some mines of silver, which from thence is by the Portingals yearely brought unto China, and there bartered for Silke, and other Chinish wares, which the Iapeans have néede of."
- lines: [itin.26.19, itin.26.19]
  text: "The countriemen are verie skilfull to search for Silver, and to sell [their wares]."
- lines: [itin.26.20, itin.26.20]
  text: "They have among them verie good handicrafts men, and cunning workemen in all kind of handie workes."
- lines: [itin.26.21, itin.26.21]
  text: "They are sharpe witted, and quickly learne any thing they sée, as by experience it is found, [in those parts] which the Portingales have discovered."
- lines: [itin.26.22, itin.26.22]
  text: "The common people of the lande are much different from other nations, for that they have among them as [great] curtesie and good policie, as if they had lived continually in the Court,"
