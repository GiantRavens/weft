# William Fairley, Monumentum Ancyranum: The Deeds of Augustus, Translations and Reprints from the
# Original Sources of European History, vol. 5, no. 1 (Philadelphia: Department of History, University
# of Pennsylvania, 1898), pp. 12-80, transcribed from the Internet Archive OCR (monumentumancyr01fairgoog).
# Fairley translates Mommsen's text of 1883, not the Wikisource text shown above; where the two differ
# (surviving citizens in ch. 3, dignity in ch. 34), the notes say so. Corrections, checked where the reading
# was in doubt against the second Internet Archive scan of the same printing (monumentumancyr00fairgoog):
#   - footnote numbers and marks removed throughout (for example "year, 1 acting", "imperator. 3");
#   - "3 1 raised" printed "I raised", "4 1 declined" printed "I declined" (footnote number run into I);
#   - "imperium* It" printed "imperium. It"; "ovation/ and" printed "ovation, and"; "Augustus/ the"
#     printed "Augustus, the" (footnote marks read as * and /);
#   - "<5ommonwealth."" printed "commonwealth."; "munwipia?" printed "municipia"; "wheD" printed "when";
#     "dignitj" printed "dignity" (the second scan reads dignity); "senate,," printed "senate,";
#   - line-end hyphenation joined (fac-tion, judg-ments, pre-serve, fulfil-ment, enter-prises, tri-umphs,
#     seventy-sixth kept with its hyphen).
translation: fairley1898
aligned_by: hand, phase 0
spans:
- lines: [rga.praef.1, rga.praef.3]
  text: "Below is a copy of the deeds of the divine Augustus, by which he subjected the whole world to the dominion of the Roman people, and of the amounts which he expended upon the commonwealth and the Roman people, as engraved upon two brazen columns which are set up at Rome."
- lines: [rga.1.1, rga.1.2]
  text: "In my twentieth year, acting upon my own judgment and at my own expense, I raised an army by means of which I restored to liberty the commonwealth which had been oppressed by the tyranny of a faction."
- lines: [rga.1.3, rga.1.4]
  text: "On account of this the senate by laudatory decrees admitted me to its order, in the consulship of Gaius Pansa and Aulus Hirtius, and at the same time gave me consular rank in the expression of opinion, and gave me the imperium."
- lines: [rga.1.5, rga.1.5]
  text: "It also voted that I as propraetor, together with the consuls, should see to it that the commonwealth suffered no harm."
- lines: [rga.1.6, rga.1.6]
  text: "In the same year, moreover, when both consuls had perished in war, the people made me consul, and triumvir for organizing the commonwealth."
- lines: [rga.2.1, rga.2.3]
  text: "Those who killed my father I drove into exile by lawful judgments, avenging their crime, and afterwards, when they waged war against the commonwealth, I twice defeated them in battle."
- lines: [rga.3.1, rga.3.2]
  text: "I undertook civil and foreign wars by land and sea throughout the whole world, and as victor I showed mercy to all surviving citizens."
- lines: [rga.3.3, rga.3.3]
  text: "Foreign peoples, who could be pardoned with safety, I preferred to preserve rather than to destroy."
- lines: [rga.3.4, rga.3.4]
  text: "About five hundred thousand Roman citizens took the military oath of allegiance to me."
- lines: [rga.3.5, rga.3.6]
  text: "Of these I have settled in colonies or sent back to their municipia upon the expiration of their terms of service, somewhat over three hundred thousand, and to all these I have given lands purchased by me, or money for farms, out of my own means."
- lines: [rga.3.7, rga.3.7]
  text: "I have captured six hundred ships, besides those which were smaller than triremes."
- lines: [rga.4.1, rga.4.1]
  text: "Twice I have triumphed in the ovation, and three times in the curule triumph, and I have been twenty-one times saluted as imperator."
- lines: [rga.4.2, rga.4.2]
  text: "After that, when the senate decreed me many triumphs, I declined them."
- lines: [rga.4.3, rga.4.3]
  text: "Likewise I often deposited the laurels in the Capitol in fulfilment of vows which I had also made in battle."
- lines: [rga.4.4, rga.4.5]
  text: "On account of enterprises brought to a successful issue on land and sea by me, or by my lieutenants under my auspices, the senate fifty-five times decreed that there should be a thanksgiving to the immortal gods."
- lines: [rga.4.6, rga.4.6]
  text: "The number of days, moreover, on which thanksgiving was rendered in accordance with the decree of the senate was eight hundred and ninety."
- lines: [rga.4.7, rga.4.7]
  text: "In my triumphs there have been led before my chariot nine kings, or children of kings."
- lines: [rga.4.8, rga.4.8]
  text: "When I wrote these words I had been thirteen times consul, and was in the thirty-seventh year of the tribunitial power."
- lines: [rga.34.1, rga.34.3]
  text: "In my sixth and seventh consulships, when I had put an end to the civil wars, after having obtained complete control of affairs by universal consent, I transferred the commonwealth from my own dominion to the authority of the senate and Roman people."
- lines: [rga.34.4, rga.34.9]
  text: "In return for this favor on my part I received by decree of the senate the title Augustus, the door-posts of my house were publicly decked with laurels, a civic crown was fixed above my door, and in the Julian Curia was placed a golden shield, which, by its inscription, bore witness that it was given to me by the senate and Roman people on account of my valor, clemency, justice and piety."
- lines: [rga.34.10, rga.34.11]
  text: "After that time I excelled all others in dignity, but of power I held no more than those also held who were my colleagues in any magistracy."
- lines: [rga.35.1, rga.35.4]
  text: "While I was consul for the thirteenth time the senate and the equestrian order and the entire Roman people gave me the title of father of the fatherland, and decreed that it should be inscribed upon the vestibule of my house and in the Curia, and in the Augustan Forum beneath the quadriga which had been, by decree of the senate, set up in my honor."
- lines: [rga.35.5, rga.35.5]
  text: "When I wrote these words I was in my seventy-sixth year."
