# William Fairley, Monumentum Ancyranum: The Deeds of Augustus, Translations and Reprints from the
# Original Sources of European History, vol. 5, no. 1 (Philadelphia: Department of History, University
# of Pennsylvania, 1898), pp. 12-80, transcribed from the Internet Archive OCR (monumentumancyr01fairgoog).
# Fairley translates Mommsen's text of 1883, not the Wikisource text shown above; where the two differ
# (surviving citizens in ch. 3, dignity in ch. 34), the notes say so. Corrections, checked where the reading
# was in doubt against the second Internet Archive scan of the same printing (monumentumancyr00fairgoog):
#   - footnote numbers and marks removed throughout (for example "year, 1 acting", "imperator. 3");
#   - "3 1 raised" printed "I raised", "4 1 declined" printed "I declined" (footnote number run into I);
#   - "imperium* It" printed "imperium. It"; "ovation/ and" printed "ovation, and"; "Augustus/ the"
#     printed "Augustus, the" (footnote marks read as * and /);
#   - "<5ommonwealth."" printed "commonwealth."; "munwipia?" printed "municipia"; "wheD" printed "when";
#     "dignitj" printed "dignity" (the second scan reads dignity); "senate,," printed "senate,";
#   - line-end hyphenation joined (fac-tion, judg-ments, pre-serve, fulfil-ment, enter-prises, tri-umphs,
#     seventy-sixth kept with its hyphen).
# Chapters 5 to 19: Chapters
# 5 to 19 are transcribed from pp. 22-48 (leaves n28-n54 of monumentumancyr01fairgoog). Fairley's Mommsen
# text differs from the Wikisource text in these chapters as follows, and the English follows Mommsen: 5.3
# "metu et periclo quo erat populum universum meis impensis" (no "et cura mea": the English has no
# "care"); 8.9 "Caesare filio feci" without "meo" ("with Tiberius Cæsar as colleague", no "my son"); 8.11
# "legibus novis latis complura" without "me auctore" (no "on my motion"); 9.3 "cives sacrificaverunt
# semper" for "unanimiter continenter ... supplicaverunt" ("constantly sacrificed"); 10.1 no "in
# perpetuum" ("sacrosanct", not "sacrosanct in perpetuity"); 12.1 "eodem tempore" for "ea occasione" ("at
# the same time"); 15.6 "in colonis" for "et colonis" ("in the colonies of my soldiers"); 16.5 "itemque C.
# Antistio et D. Laelio", where the Wikisource text names only Laelius ("Gaius Antistius and Decimus
# Laelius"); 16.7 "remisi" for "deduxi" ("sent back") and "libenter" for "circiter" ("freely spent", not
# "about"); 18.2 "inlato frumento vel ad nummarios tributus ex agro et patrimonio meo opem tuli" for
# "frumentarios et nummarios tributus ex horreo et patrimonio meo edidi" ("from my own land", not "from my
# granary"). Corrections, chapters 5-19, checked on the page images: - footnote numbers and marks removed
# (for example "power ; 1", "augur,*", "congiarium;*", "victory 1", "all,'", "number.9 10"); the chapter
# heading of ch. 11, misread "ell.", dropped with the others; - "Koman" printed "Roman"; "iny" printed
# "my"; "munieipia" printed "municipia"; "prin-eipe8" printed "principes"; ">of" printed "of" (a stray
# mark); - the ae ligature kept where the print has it: OCR "Csesars", "Cnseus", "Laelius", "praetors",
# "Caesar" are printed Cæsars (14.1), Cnæus (16.1, 16.5, 18.1), Lælius (16.5), prætors (12.1), Cæsar
# (8.9); ch. 6 prints "Cnaeus"; - "thirtyjLthousand" printed "two hundred and thirty thousand" (8.7): the
# print omits "three", although the Latin and Fairley's own note give 4,233,000; the mark in this scan is
# a reader's caret, and the second scan (monumentumancyr00fairgoog, leaf n38) prints "thirty thousand"
# clean; transcribed as printed; - spaced semicolons closed up; line-end hyphenation joined (consul-ship,
# Lucre-tius, organiz-ing, con-sent, distribu-tions, con-giarium, prov-inces, lead-ing, intro-duced,
# thous-and, Jupi-ter); forty-one, sixty-three, thirty-seven kept with their hyphens. Alignment: the
# translation is merged across lines at 8.6-8.7 and 8.8-8.9 (the Latin line breaks inside a pair of
# consuls' names), 10.1-10.2 ("enacted by law", per legem in 10.2, governs the clause on sacrosanctity in
# 10.1), 10.4-10.6 (the verb of 10.6 and the consuls are moved forward, the multitude of 10.5 to the end),
# 12.1-12.2 (the consul's name is split across the lines), and 16.2-16.3 (the provincial sum of 16.2 is
# given with its clause in 16.3). At 17.2 and 19.1 the English verb ("I paid", "I constructed") renders
# detuli of 17.3 and feci of 19.6; the lines are kept separate because only the verb moves.
# Chapters 20 to 33: Chapters 20-33 are transcribed from pp. 50-76 (Internet Archive leaves n56-n82);
# every page was checked against its image. Corrections in these chapters: - footnote numbers and marks
# removed throughout (for example "name. 1 Aqueducts", "statues.*", "sea ; * and", "soldiers 1 in",
# "Phraates ; 1 of"); - OCR misreadings: "vated" printed "voted"; "fought 1 Twice" printed "fought. Twice"
# (the period was lost with the footnote number); "state gf peace" printed "state of peace"; "Spaing"
# printed "Spains"; "suppliante" printed "suppliants"; "Medea" printed "Medes"; "Maroomanian" printed
# "Marcomanian"; "Caesars" printed with the ligature, "Cæsars"; the OCR's '" the Happy/'' printed with
# quotation marks, set as curly ones ("“the Happy,”"); - the space the print sets before a semicolon or
# colon is closed up (finished ;, sons ;, exhibitions ;, sea ;, Tigranes ;, legate ;, Phraates ;, Maelo ;,
# peoples :, Orodes ;), except after "Tim" in ch. 32; - in ch. 32 the print leaves a blank after "Tim" and
# before "rus" for the lost letters of two names (Tincommius and Segimerus in the Wikisource text); each
# blank is kept as a single space; - line-end hyphenation joined (Flamin-ian, spec-tacle, Secu-lar,
# excava-tion, Mace-donia, pop-ulous, more-over); eighty-two and thirty-five (the latter broken across pp.
# 52 and 54) kept with their hyphens. Where Augustus' line breaks fall inside one English clause the lines
# are joined: 20.3-20.4 (the Latin verb perfeci stands in 20.4), 22.6-22.7 (the verb and count dedi
# sexiens et viciens stand in 22.7), 24.3-24.4 (Fairley's "those who had offered" is the relative clause
# of 24.4), 25.2-25.3 (one sentence, the verb tradidi in 25.3), 27.3-27.4 (the Latin line break falls
# inside the name Ti. Nero) and 32.5-32.6 (the break falls inside the abbreviation p. R.). Elsewhere a
# span may end at a comma or semicolon. Fairley's Latin differs from the Wikisource text at 20.6 (ex
# decreto senatus for ex auctoritate senatus), 20.7 (feci et pontes, "constructed ... and all the
# bridges", for refeci pontesque), 22.5 (a lacuna where Wikisource restores ex senatus consulto et lege,
# which Fairley leaves untranslated), 28.2 (meis auspicis, "under my auspices", for me auctore) and 32.2
# (the two names left incomplete). Fairley's renderings kept as printed: "son-in-law" for privignus
# (stepson) at 27.4 and 30.2, "three times" for tertium at 22.2, and "at my own expense" for a privatis at
# 21.2.
translation: fairley1898
aligned_by: hand, phase 0
spans:
- lines:
  - rga.praef.1
  - rga.praef.3
  text: Below is a copy of the deeds of the divine Augustus, by which he subjected the whole world to
    the dominion of the Roman people, and of the amounts which he expended upon the commonwealth and the
    Roman people, as engraved upon two brazen columns which are set up at Rome.
- lines:
  - rga.1.1
  - rga.1.2
  text: In my twentieth year, acting upon my own judgment and at my own expense, I raised an army by means
    of which I restored to liberty the commonwealth which had been oppressed by the tyranny of a faction.
- lines:
  - rga.1.3
  - rga.1.4
  text: On account of this the senate by laudatory decrees admitted me to its order, in the consulship
    of Gaius Pansa and Aulus Hirtius, and at the same time gave me consular rank in the expression of
    opinion, and gave me the imperium.
- lines:
  - rga.1.5
  - rga.1.5
  text: It also voted that I as propraetor, together with the consuls, should see to it that the commonwealth
    suffered no harm.
- lines:
  - rga.1.6
  - rga.1.6
  text: In the same year, moreover, when both consuls had perished in war, the people made me consul,
    and triumvir for organizing the commonwealth.
- lines:
  - rga.2.1
  - rga.2.3
  text: Those who killed my father I drove into exile by lawful judgments, avenging their crime, and afterwards,
    when they waged war against the commonwealth, I twice defeated them in battle.
- lines:
  - rga.3.1
  - rga.3.2
  text: I undertook civil and foreign wars by land and sea throughout the whole world, and as victor I
    showed mercy to all surviving citizens.
- lines:
  - rga.3.3
  - rga.3.3
  text: Foreign peoples, who could be pardoned with safety, I preferred to preserve rather than to destroy.
- lines:
  - rga.3.4
  - rga.3.4
  text: About five hundred thousand Roman citizens took the military oath of allegiance to me.
- lines:
  - rga.3.5
  - rga.3.6
  text: Of these I have settled in colonies or sent back to their municipia upon the expiration of their
    terms of service, somewhat over three hundred thousand, and to all these I have given lands purchased
    by me, or money for farms, out of my own means.
- lines:
  - rga.3.7
  - rga.3.7
  text: I have captured six hundred ships, besides those which were smaller than triremes.
- lines:
  - rga.4.1
  - rga.4.1
  text: Twice I have triumphed in the ovation, and three times in the curule triumph, and I have been
    twenty-one times saluted as imperator.
- lines:
  - rga.4.2
  - rga.4.2
  text: After that, when the senate decreed me many triumphs, I declined them.
- lines:
  - rga.4.3
  - rga.4.3
  text: Likewise I often deposited the laurels in the Capitol in fulfilment of vows which I had also made
    in battle.
- lines:
  - rga.4.4
  - rga.4.5
  text: On account of enterprises brought to a successful issue on land and sea by me, or by my lieutenants
    under my auspices, the senate fifty-five times decreed that there should be a thanksgiving to the
    immortal gods.
- lines:
  - rga.4.6
  - rga.4.6
  text: The number of days, moreover, on which thanksgiving was rendered in accordance with the decree
    of the senate was eight hundred and ninety.
- lines:
  - rga.4.7
  - rga.4.7
  text: In my triumphs there have been led before my chariot nine kings, or children of kings.
- lines:
  - rga.4.8
  - rga.4.8
  text: When I wrote these words I had been thirteen times consul, and was in the thirty-seventh year
    of the tribunitial power.
- lines:
  - rga.5.1
  - rga.5.1
  text: The dictatorship which was offered to me by the people and the senate, both when I was absent
    and when I was present, in the consulship of Marcus Marcellus and Lucius Arruntius, I did not accept.
- lines:
  - rga.5.2
  - rga.5.2
  text: At a time of the greatest dearth of grain I did not refuse the charge of the food supply, which
    I so administered
- lines:
  - rga.5.3
  - rga.5.3
  text: that in a few days, at my own expense, I freed the whole people from the anxiety and danger in
    which they then were.
- lines:
  - rga.5.4
  - rga.5.4
  text: The annual and perpetual consulship offered to me at that time I did not accept.
- lines:
  - rga.6.1
  - rga.6.1
  text: During the consulship of Marcus Vinucius and Quintus Lucretius, and afterwards in that of Publius
    and Cnaeus Lentulus, and a third time in that of Paullus Fabius Maximus and Quintus Tubero, by the
    consent of the senate and the Roman people
- lines:
  - rga.6.2
  - rga.6.2
  text: I was voted the sole charge of the laws and of morals, with the fullest power;
- lines:
  - rga.6.3
  - rga.6.3
  text: but I accepted the proffer of no office which was contrary to the customs of the country.
- lines:
  - rga.6.4
  - rga.6.4
  text: The measures of which the senate at that time wished me to take charge, I accomplished in virtue
    of my possession of the tribunitial power.
- lines:
  - rga.6.5
  - rga.6.5
  text: In this office I five times associated with myself a colleague, with the consent of the senate.
- lines:
  - rga.7.1
  - rga.7.1
  text: For ten years in succession I was one of the triumvirs for organizing the commonwealth.
- lines:
  - rga.7.2
  - rga.7.2
  text: Up to that day on which I write these words I have been princeps of the senate through forty years.
- lines:
  - rga.7.3
  - rga.7.3
  text: I have been pontifex maximus, augur, a member of the quindecemviral college of the sacred rites,
    of the septemviral college of the banquets, an Arval Brother, a member of the Titian sodality, and
    a fetial.
- lines:
  - rga.8.1
  - rga.8.1
  text: In my fifth consulship, by order of the people and the senate, I increased the number of the patricians.
- lines:
  - rga.8.2
  - rga.8.2
  text: Three times I have revised the list of the senate.
- lines:
  - rga.8.3
  - rga.8.3
  text: In my sixth consulship, with Marcus Agrippa as colleague, I made a census of the people.
- lines:
  - rga.8.4
  - rga.8.4
  text: I performed the lustration after forty-one years.
- lines:
  - rga.8.5
  - rga.8.5
  text: In this lustration the number of Roman citizens was four million and sixty-three thousand.
- lines:
  - rga.8.6
  - rga.8.7
  text: Again assuming the consular power in the consulship of Gaius Censorinus and Gaius Asinius, I alone
    performed the lustration. At this census the number of Roman citizens was four million, two hundred
    and thirty thousand.
- lines:
  - rga.8.8
  - rga.8.9
  text: A third time, assuming the consular power in the consulship of Sextus Pompeius and Sextus Appuleius,
    with Tiberius Cæsar as colleague, I performed the lustration.
- lines:
  - rga.8.10
  - rga.8.10
  text: At this lustration the number of Roman citizens was four million, nine hundred and thirty-seven
    thousand.
- lines:
  - rga.8.11
  - rga.8.11
  text: By new legislation I have restored many customs of our ancestors which had now begun to fall into
    disuse, and I have myself also committed to posterity many examples worthy of imitation.
- lines:
  - rga.9.1
  - rga.9.1
  text: The senate decreed that every fifth year vows for my good health should be performed by the consuls
    and the priests.
- lines:
  - rga.9.2
  - rga.9.2
  text: In accordance with these vows games have been often celebrated during my lifetime, sometimes by
    the four chief colleges, sometimes by the consuls.
- lines:
  - rga.9.3
  - rga.9.3
  text: In private, also, and as municipalities, the whole body of citizens have constantly sacrificed
    at every shrine for my good health.
- lines:
  - rga.10.1
  - rga.10.2
  text: By a decree of the senate my name has been included in the Salian hymn, and it has been enacted
    by law that I should be sacrosanct, and that as long as I live I should be invested with the tribunitial
    power.
- lines:
  - rga.10.3
  - rga.10.3
  text: I refused to be made pontifex maximus in the place of a colleague still living, when the people
    tendered me that priesthood which my father held.
- lines:
  - rga.10.4
  - rga.10.6
  text: I accepted that office after several years, when he was dead who had seized it during a time of
    civil disturbance; and at the comitia for my election, during the consulship of Publius Sulpicius
    and Gaius Valgius, so great a multitude assembled as, it is said, had never before been in Rome.
- lines:
  - rga.11.1
  - rga.11.1
  text: Close to the temples of Honor and Virtue, near the Capena gate, the senate consecrated in honor
    of my return an altar to Fortune the Restorer,
- lines:
  - rga.11.2
  - rga.11.2
  text: and upon this altar it ordered that the pontifices and the Vestal virgins should offer sacrifice
    yearly
- lines:
  - rga.11.3
  - rga.11.3
  text: on the anniversary of the day on which I returned into the city from Syria, in the consulship
    of Quintus Lucretius and Marcus Vinucius,
- lines:
  - rga.11.4
  - rga.11.4
  text: and it called the day the Augustalia, from our cognomen.
- lines:
  - rga.12.1
  - rga.12.2
  text: By a decree of the senate at the same time a part of the prætors and tribunes of the people with
    the consul Quintus Lucretius and leading citizens were sent into Campania to meet me, an honor which
    up to this time has been decreed to no one but me.
- lines:
  - rga.12.3
  - rga.12.3
  text: When I returned from Spain and Gaul after successfully arranging the affairs of those provinces,
    in the consulship of Tiberius Nero and Publius Quintilius,
- lines:
  - rga.12.4
  - rga.12.4
  text: the senate voted that in honor of my return an altar of the Augustan Peace should be consecrated
    in the Campus Martius,
- lines:
  - rga.12.5
  - rga.12.5
  text: and upon this altar it ordered the magistrates and priests and vestal virgins to offer sacrifices
    on each anniversary.
- lines:
  - rga.13.1
  - rga.13.1
  text: Janus Quirinus, which it was the purpose of our fathers to close when there was peace won by victory
    throughout the whole empire of the Roman people on land and sea,
- lines:
  - rga.13.2
  - rga.13.2
  text: and which, before I was born, from the foundation of the city, was reported to have been closed
    twice in all,
- lines:
  - rga.13.3
  - rga.13.3
  text: the senate three times ordered to be closed while I was princeps.
- lines:
  - rga.14.1
  - rga.14.1
  text: My sons, the Cæsars Gaius and Lucius, whom fortune snatched from me in their youth,
- lines:
  - rga.14.2
  - rga.14.2
  text: the senate and Roman people, in order to do me honor, designated as consuls in the fifteenth year
    of each,
- lines:
  - rga.14.3
  - rga.14.3
  text: with the intention that they should enter upon that magistracy after five years.
- lines:
  - rga.14.4
  - rga.14.4
  text: And the senate decreed that from the day in which they were introduced into the forum they should
    share in the public counsels.
- lines:
  - rga.14.5
  - rga.14.5
  text: Moreover the whole body of the Roman knights gave them the title, principes of the youth, and
    gave to each a silver buckler and spear.
- lines:
  - rga.15.1
  - rga.15.1
  text: To each man of the Roman plebs I paid three hundred sesterces in accordance with the last will
    of my father; and in my own name, when consul for the fifth time, I gave four hundred sesterces from
    the spoils of the wars;
- lines:
  - rga.15.2
  - rga.15.2
  text: again, moreover, in my tenth consulship I gave from my own estate four hundred sesterces to each
    man by way of congiarium;
- lines:
  - rga.15.3
  - rga.15.3
  text: and in my eleventh consulship I twelve times made distributions of food, buying grain at my own
    expense; and in the twelfth year of my tribunitial power I three times gave four hundred sesterces
    to each man.
- lines:
  - rga.15.4
  - rga.15.4
  text: These my donations have never been made to less than two hundred and fifty thousand men.
- lines:
  - rga.15.5
  - rga.15.5
  text: In my twelfth consulship and the eighteenth year of my tribunitial power I gave to three hundred
    and twenty thousand of the city plebs sixty denarii apiece.
- lines:
  - rga.15.6
  - rga.15.6
  text: In the colonies of my soldiers, when consul for the fifth time, I gave to each man a thousand
    sesterces from the spoils;
- lines:
  - rga.15.7
  - rga.15.7
  text: about a hundred and twenty thousand men in the colonies received that triumphal donation.
- lines:
  - rga.15.8
  - rga.15.8
  text: When consul for the thirteenth time I gave sixty denarii to the plebs who were at that time receiving
    public grain; these men were a little more than two hundred thousand in number.
- lines:
  - rga.16.1
  - rga.16.1
  text: For the lands which in my fourth consulship, and afterwards in the consulship of Marcus Crassus
    and Cnæus Lentulus, the augur, I assigned to soldiers, I paid money to the municipia.
- lines:
  - rga.16.2
  - rga.16.3
  text: The sum which I paid for Italian farms was about six hundred million sesterces, and that for lands
    in the provinces was about two hundred and sixty millions.
- lines:
  - rga.16.4
  - rga.16.4
  text: Of all those who have established colonies of soldiers in Italy or in the provinces I am the first
    and only one within the memory of my age, to do this.
- lines:
  - rga.16.5
  - rga.16.5
  text: And afterward in the consulship of Tiberius Nero and Cnæus Piso, and also in that of Gaius Antistius
    and Decimus Lælius, and in that of Gaius Calvisius and Lucius Pasienus,
- lines:
  - rga.16.6
  - rga.16.6
  text: and in that of Lucius Lentulus and Marcus Messala, and in that of Lucius Caninius and Quintus
    Fabricius,
- lines:
  - rga.16.7
  - rga.16.7
  text: I gave gratuities in money to the soldiers whom I sent back to their municipia at the expiration
    of their terms of service, and for this purpose I freely spent four hundred million sesterces.
- lines:
  - rga.17.1
  - rga.17.1
  text: Four times I have aided the public treasury from my own means, to such extent that I have furnished
    to those in charge of the treasury one hundred and fifty million sesterces.
- lines:
  - rga.17.2
  - rga.17.2
  text: And in the consulship of Marcus Lepidus and Lucius Arruntius I paid into the military treasury
    which was established by my advice
- lines:
  - rga.17.3
  - rga.17.3
  text: that from it gratuities might be given to soldiers who had served a term of twenty or more years,
    one hundred and seventy million sesterces from my own estate.
- lines:
  - rga.18.1
  - rga.18.1
  text: Beginning with that year in which Cnæus and Publius Lentulus were consuls, when the imposts failed,
- lines:
  - rga.18.2
  - rga.18.2
  text: I furnished aid sometimes to a hundred thousand men, and sometimes to more, by supplying grain
    or money for the tribute from my own land and property.
- lines:
  - rga.19.1
  - rga.19.1
  text: I constructed the Curia, and the Chalcidicum adjacent thereto, the temple of Apollo on the Palatine,
    with its porticoes, the temple of the divine Julius,
- lines:
  - rga.19.2
  - rga.19.2
  text: the Lupercal, the portico to the Circus of Flaminius, which I allowed to bear the name, Portico
    Octavia, from his name who constructed the earlier one in the same place;
- lines:
  - rga.19.3
  - rga.19.3
  text: the Pulvinar at the Circus Maximus, the temples of Jupiter the Vanquisher and Jupiter the Thunderer,
    on the Capitol,
- lines:
  - rga.19.4
  - rga.19.4
  text: the temple of Quirinus, the temples of Minerva and Juno Regina and of Jupiter Libertas, on the
    Aventine,
- lines:
  - rga.19.5
  - rga.19.5
  text: the temple of the Lares on the highest point of the Via Sacra, the temple of the divine Penates
    on the Velian hill, the temple of Youth,
- lines:
  - rga.19.6
  - rga.19.6
  text: and the temple of the Great Mother on the Palatine.
- lines:
  - rga.20.1
  - rga.20.1
  text: The Capitol and the Pompeian theatre have been restored by me at enormous expense for each work,
    without any inscription of my name.
- lines:
  - rga.20.2
  - rga.20.2
  text: Aqueducts which were crumbling in many places by reason of age I have restored, and I have doubled
    the water which bears the name Marcian by turning a new spring into its course.
- lines:
  - rga.20.3
  - rga.20.4
  text: The Forum Julium and the basilica which was between the temple of Castor and the temple of Saturn,
    works begun and almost completed by my father, I have finished; and when that same basilica was consumed
    by fire, I began its reconstruction on an enlarged site, inscribing it with the names of my sons;
- lines:
  - rga.20.5
  - rga.20.5
  text: and if I do not live to complete it, I have given orders that it be completed by my heirs.
- lines:
  - rga.20.6
  - rga.20.6
  text: In accordance with a decree of the senate, while consul for the sixth time, I have restored eighty-two
    temples of the gods, passing over none which was at that time in need of repair.
- lines:
  - rga.20.7
  - rga.20.7
  text: In my seventh consulship I constructed the Flaminian way from the city to Ariminum, and all the
    bridges except the Mulvian and Minucian.
- lines:
  - rga.21.1
  - rga.21.1
  text: Upon private ground I have built with the spoils of war the temple of Mars the Avenger, and the
    Augustan Forum.
- lines:
  - rga.21.2
  - rga.21.2
  text: Beside the temple of Apollo, I built upon ground, bought for the most part at my own expense,
    a theatre, to bear the name of Marcellus, my son-in-law.
- lines:
  - rga.21.3
  - rga.21.3
  text: From the spoils of war I have consecrated gifts in the Capitol, and in the temple of the divine
    Julius, and in the temple of Apollo, and in the temple of Vesta, and in the temple of Mars the Avenger;
- lines:
  - rga.21.4
  - rga.21.4
  text: these gifts have cost me about a hundred million sesterces.
- lines:
  - rga.21.5
  - rga.21.5
  text: In my fifth consulship I remitted to the municipia and Italian colonies the thirty-five thousand
    pounds given me as coronary gold on the occasion of my triumphs,
- lines:
  - rga.21.6
  - rga.21.6
  text: and thereafter, as often as I was proclaimed imperator, I did not accept the coronary gold which
    the municipia and colonies voted to me as kindly as before.
- lines:
  - rga.22.1
  - rga.22.1
  text: Three times in my own name, and five times in that of my sons or grandsons, I have given gladiatorial
    exhibitions; in these exhibitions about ten thousand men have fought.
- lines:
  - rga.22.2
  - rga.22.2
  text: Twice in my own name, and three times in that of my grandson, I have offered the people the spectacle
    of athletes gathered from all quarters.
- lines:
  - rga.22.3
  - rga.22.3
  text: I have celebrated games four times in my own name, and twenty-three times in the turns of other
    magistrates.
- lines:
  - rga.22.4
  - rga.22.4
  text: In behalf of the college of quindecemvirs, I, as master of the college, with my colleague Agrippa,
    celebrated the Secular Games in the consulship of Gaius Furnius and Gaius Silanus.
- lines:
  - rga.22.5
  - rga.22.5
  text: When consul for the thirteenth time, I first celebrated the Martial games, which since that time
    the consuls have given in successive years.
- lines:
  - rga.22.6
  - rga.22.7
  text: Twenty-six times in my own name, or in that of my sons and grandsons, I have given hunts of African
    wild beasts in the circus, the forum, the amphitheatres, and about thirty-five hundred beasts have
    been killed.
- lines:
  - rga.23.1
  - rga.23.1
  text: I gave the people the spectacle of a naval battle beyond the Tiber, where now is the grove of
    the Cæsars.
- lines:
  - rga.23.2
  - rga.23.2
  text: For this purpose an excavation was made eighteen hundred feet long and twelve hundred wide.
- lines:
  - rga.23.3
  - rga.23.3
  text: In this contest thirty beaked ships, triremes or biremes, were engaged, besides more of smaller
    size.
- lines:
  - rga.23.4
  - rga.23.4
  text: About three thousand men fought in these vessels in addition to the rowers.
- lines:
  - rga.24.1
  - rga.24.1
  text: In the temples of all the cities of the province of Asia, I, as victor, replaced the ornaments
    of which he with whom I was at war had taken private possession when he despoiled the temples.
- lines:
  - rga.24.2
  - rga.24.2
  text: Silver statues of me, on foot, on horseback and in quadrigas, which stood in the city to the number
    of about eighty,
- lines:
  - rga.24.3
  - rga.24.4
  text: I removed, and out of their money value, I placed golden gifts in the temple of Apollo in my own
    name, and in the names of those who had offered me the honor of the statues.
- lines:
  - rga.25.1
  - rga.25.1
  text: I have freed the sea from pirates.
- lines:
  - rga.25.2
  - rga.25.3
  text: In that war with the slaves I delivered to their masters for punishment about thirty thousand
    slaves who had fled from their masters and taken up arms against the state.
- lines:
  - rga.25.4
  - rga.25.4
  text: The whole of Italy voluntarily took the oath of allegiance to me, and demanded me as leader in
    that war in which I conquered at Actium.
- lines:
  - rga.25.5
  - rga.25.5
  text: The provinces of Gaul, Spain, Africa, Sicily and Sardinia swore the same allegiance to me.
- lines:
  - rga.25.6
  - rga.25.6
  text: There were more than seven hundred senators who at that time fought under my standards,
- lines:
  - rga.25.7
  - rga.25.7
  text: and among these, up to the day on which these words are written, eighty-three have either before
    or since been made consuls, and about one hundred and seventy have been made priests.
- lines:
  - rga.26.1
  - rga.26.1
  text: I have extended the boundaries of all the provinces of the Roman people which were bordered by
    nations not yet subjected to our sway.
- lines:
  - rga.26.2
  - rga.26.2
  text: I have reduced to a state of peace the Gallic and Spanish provinces, and Germany, the lands enclosed
    by the ocean from Gades to the mouth of the Elbe.
- lines:
  - rga.26.3
  - rga.26.3
  text: The Alps from the region nearest the Adriatic as far as the Tuscan Sea I have brought into a state
    of peace, without waging an unjust war upon any people.
- lines:
  - rga.26.4
  - rga.26.4
  text: My fleet has navigated the ocean from the mouth of the Rhine as far as the boundaries of the Cimbri,
- lines:
  - rga.26.5
  - rga.26.5
  text: where before that time no Roman had ever penetrated by land or sea;
- lines:
  - rga.26.6
  - rga.26.6
  text: and the Cimbri and Charydes and Semnones and other German peoples of that section, by means of
    legates, sought my friendship and that of the Roman people.
- lines:
  - rga.26.7
  - rga.26.7
  text: By my command and under my auspices two armies at almost the same time have been led into Ethiopia
    and into Arabia,
- lines:
  - rga.26.8
  - rga.26.8
  text: which is called “the Happy,” and very many of the enemy of both peoples have fallen in battle,
    and many towns have been captured.
- lines:
  - rga.26.9
  - rga.26.9
  text: Into Ethiopia the advance was as far as Nabata, which is next to Meroe.
- lines:
  - rga.26.10
  - rga.26.10
  text: In Arabia the army penetrated as far as the confines of the Sabaei, to the town Mariba.
- lines:
  - rga.27.1
  - rga.27.1
  text: I have added Egypt to the empire of the Roman people.
- lines:
  - rga.27.2
  - rga.27.2
  text: Of greater Armenia, when its king Artaxes was killed I could have made a province, but I preferred,
    after the example of our fathers, to deliver that kingdom to Tigranes,
- lines:
  - rga.27.3
  - rga.27.4
  text: the son of king Artavasdes, and grandson of king Tigranes; and this I did through Tiberius Nero,
    who was then my son-in-law.
- lines:
  - rga.27.5
  - rga.27.5
  text: And afterwards, when the same people became turbulent and rebellious, they were subdued by Gaius,
    my son, and I gave the sovereignty over them to king Ariobarzanes,
- lines:
  - rga.27.6
  - rga.27.6
  text: the son of Artabazes, king of the Medes, and after his death to his son Artavasdes.
- lines:
  - rga.27.7
  - rga.27.7
  text: When he was killed I sent into that kingdom Tigranes, who was sprung from the royal house of the
    Armenians.
- lines:
  - rga.27.8
  - rga.27.8
  text: I recovered all the provinces across the Adriatic Sea, which extend toward the east, and Cyrenaica,
    at that time for the most part in the possession of kings,
- lines:
  - rga.27.9
  - rga.27.9
  text: together with Sicily and Sardinia, which had been engaged in a servile war.
- lines:
  - rga.28.1
  - rga.28.1
  text: I have established colonies of soldiers in Africa, Sicily, Macedonia, the two Spains, Achaia,
    Asia, Syria, Gallia Narbonensis and Pisidia.
- lines:
  - rga.28.2
  - rga.28.2
  text: Italy also has twenty-eight colonies established under my auspices, which within my lifetime have
    become very famous and populous.
- lines:
  - rga.29.1
  - rga.29.1
  text: I have recovered from Spain and Gaul, and from the Dalmatians, after conquering the enemy, many
    military standards which had been lost by other leaders.
- lines:
  - rga.29.2
  - rga.29.2
  text: I have compelled the Parthians to give up to me the spoils and standards of three Roman armies,
    and as suppliants to seek the friendship of the Roman people.
- lines:
  - rga.29.3
  - rga.29.3
  text: Those standards, moreover, I have deposited in the sanctuary which is in the temple of Mars the
    Avenger.
- lines:
  - rga.30.1
  - rga.30.1
  text: The Pannonian peoples, whom before I became princeps, no army of the Roman people had ever attacked,
    were defeated by Tiberius Nero,
- lines:
  - rga.30.2
  - rga.30.2
  text: at that time my son-in-law and legate; and I brought them under subjection to the empire of the
    Roman people, and extended the boundaries of Illyricum to the bank of the river Danube.
- lines:
  - rga.30.3
  - rga.30.3
  text: When an army of the Dacians crossed this river, it was defeated and destroyed,
- lines:
  - rga.30.4
  - rga.30.4
  text: and afterwards my army, led across the Danube, compelled the Dacian people to submit to the sway
    of the Roman people.
- lines:
  - rga.31.1
  - rga.31.1
  text: Embassies have been many times sent to me from the kings of India, a thing never before seen in
    the case of any ruler of the Romans.
- lines:
  - rga.31.2
  - rga.31.2
  text: Our friendship has been sought by means of ambassadors by the Bastarnae and the Scythians, and
    by the kings of the Sarmatae, who are on either side of the Tanais,
- lines:
  - rga.31.3
  - rga.31.3
  text: and by the kings of the Albani, the Hiberi, and the Medes.
- lines:
  - rga.32.1
  - rga.32.1
  text: To me have betaken themselves as suppliants the kings of the Parthians, Tiridates, and later,
    Phraates, the son of king Phraates;
- lines:
  - rga.32.2
  - rga.32.2
  text: of the Medes, Artavasdes; of the Adiabeni, Artaxares; of the Britons, Dumnobellaunus and Tim ;
    of the Sicambri, Maelo; and of the Marcomanian Suevi, rus.
- lines:
  - rga.32.3
  - rga.32.3
  text: Phraates, king of the Parthians, son of Orodes, sent all his children and grandchildren into Italy
    to me,
- lines:
  - rga.32.4
  - rga.32.4
  text: not because he had been conquered in war, but rather seeking our friendship by means of his children
    as pledges.
- lines:
  - rga.32.5
  - rga.32.6
  text: Since I have been princeps very many other races have made proof of the good faith of the Roman
    people, who never before had had any interchange of embassies and friendship with the Roman people.
- lines:
  - rga.33.1
  - rga.33.1
  text: 'From me the peoples of the Parthians and of the Medes have received the kings they asked for
    through ambassadors, the chief men of those peoples:'
- lines:
  - rga.33.2
  - rga.33.2
  text: the Parthians, Vonones, the son of king Phraates, and grandson of king Orodes;
- lines:
  - rga.33.3
  - rga.33.3
  text: the Medes, Ariobarzanes, the son of king Artavasdes, and grandson of king Ariobarzanes.
- lines:
  - rga.34.1
  - rga.34.3
  text: In my sixth and seventh consulships, when I had put an end to the civil wars, after having obtained
    complete control of affairs by universal consent, I transferred the commonwealth from my own dominion
    to the authority of the senate and Roman people.
- lines:
  - rga.34.4
  - rga.34.9
  text: In return for this favor on my part I received by decree of the senate the title Augustus, the
    door-posts of my house were publicly decked with laurels, a civic crown was fixed above my door, and
    in the Julian Curia was placed a golden shield, which, by its inscription, bore witness that it was
    given to me by the senate and Roman people on account of my valor, clemency, justice and piety.
- lines:
  - rga.34.10
  - rga.34.11
  text: After that time I excelled all others in dignity, but of power I held no more than those also
    held who were my colleagues in any magistracy.
- lines:
  - rga.35.1
  - rga.35.4
  text: While I was consul for the thirteenth time the senate and the equestrian order and the entire
    Roman people gave me the title of father of the fatherland, and decreed that it should be inscribed
    upon the vestibule of my house and in the Curia, and in the Augustan Forum beneath the quadriga which
    had been, by decree of the senate, set up in my honor.
- lines:
  - rga.35.5
  - rga.35.5
  text: When I wrote these words I was in my seventy-sixth year.
