translation: shipley1924
aligned_by: hand, phase 0
spans:
- lines: [rga.praef.1, rga.praef.3]
  text: "Below is a copy of the acts of the Deified Augustus by which he placed the whole world under the sovereignty of the Roman people, and of the amounts which he expended upon the state and the Roman people, as engraved upon two bronze columns which have been set up in Rome."
- lines: [rga.1.1, rga.1.2]
  text: "At the age of nineteen, on my own initiative and at my own expense, I raised an army by means of which I restored liberty to the republic, which had been oppressed by the tyranny of a faction."
- lines: [rga.1.3, rga.1.4]
  text: "For which service the senate, with complimentary resolutions, enrolled me in its order, in the consulship of Gaius Pansa and Aulus Hirtius, giving me at the same time consular precedence in voting; it also gave me the imperium."
- lines: [rga.1.5, rga.1.5]
  text: "As propraetor it ordered me, along with the consuls, “to see that the republic suffered no harm.”"
- lines: [rga.1.6, rga.1.6]
  text: "In the same year, moreover, as both consuls had fallen in war, the people elected me consul and a triumvir for settling the constitution."
- lines: [rga.2.1, rga.2.3]
  text: "Those who slew my father I drove into exile, punishing their deed by due process of law, and afterwards when they waged war upon the republic I twice defeated them in battle."
- lines: [rga.3.1, rga.3.2]
  text: "Wars, both civil and foreign, I undertook throughout the world, on sea and land, and when victorious I spared all citizens who sued for pardon."
- lines: [rga.3.3, rga.3.3]
  text: "The foreign nations which could with safety be pardoned I preferred to save rather than to destroy."
- lines: [rga.3.4, rga.3.4]
  text: "The number of Roman citizens who bound themselves to me by military oath was about 500,000."
- lines: [rga.3.5, rga.3.6]
  text: "Of these I settled in colonies or sent back into their own towns, after their term of service, something more than 300,000, and to all I assigned lands, or gave money as a reward for military service."
- lines: [rga.3.7, rga.3.7]
  text: "I captured six hundred ships, over and above those which were smaller than triremes."
- lines: [rga.4.1, rga.4.1]
  text: "Twice I triumphed with an ovation, thrice I celebrated curule triumphs, and was saluted as imperator twenty-one times."
- lines: [rga.4.2, rga.4.2]
  text: "Although the Senate decreed me additional triumphs I set them aside."
- lines: [rga.4.3, rga.4.3]
  text: "When I had performed the vows which I had undertaken in each war I deposited upon the Capitol the laurels which adorned my fasces."
- lines: [rga.4.4, rga.4.5]
  text: "For successful operations on land and sea, conducted either by myself or by my lieutenants under my auspices, the senate on fifty-five occasions decreed that thanks should be rendered to the immortal gods."
- lines: [rga.4.6, rga.4.6]
  text: "The days on which such thanks were rendered by decree of the senate numbered 890."
- lines: [rga.4.7, rga.4.7]
  text: "In my triumphs there were led before my chariot nine kings or children of kings."
- lines: [rga.4.8, rga.4.8]
  text: "At the time of writing these words I had been thirteen times consul, and was in the thirty-seventh year of my tribunician power."
- lines: [rga.34.1, rga.34.3]
  text: "In my sixth and seventh consulships, when I had extinguished the flames of civil war, after receiving by universal consent the absolute control of affairs, I transferred the republic from my own control to the will of the senate and the Roman people."
- lines: [rga.34.4, rga.34.9]
  text: "For this service on my part I was given the title of Augustus by decree of the senate, and the doorposts of my house were covered with laurels by public act, and a civic crown was fixed above my door, and a golden shield was placed in the Curia Julia whose inscription testified that the senate and the Roman people gave me this in recognition of my valour, my clemency, my justice, and my piety."
- lines: [rga.34.10, rga.34.11]
  text: "After that time I took precedence of all in rank, but of power I possessed no more than those who were my colleagues in any magistracy."
- lines: [rga.35.1, rga.35.4]
  text: "While I was administering my thirteenth consulship the senate and the equestrian order and the entire Roman people gave me the title of Father of my Country, and decreed that this title should be inscribed upon the vestibule of my house and in the senate-house and in the Forum Augustum beneath the quadriga erected in my honour by decree of the senate."
- lines: [rga.35.5, rga.35.5]
  text: "At the time of writing this I was in my seventy-sixth year."
