#     ser\ice = service, wliich adomed = which adorned, heutenants xmder = lieutenants under, wWch = which,
#     tribunieian = tribunician, «eceiving = receiving, L had = I had, repubhc and pubhc = republic and
#     public, civil -w-ar = civil war, witl\ = with, consukhip = consulship, moreover,,as = moreover, as;
#   - the chapter number of ch. 3, misread as 8, dropped with the others; straight OCR quotation marks set
#     as curly ones; line-end hyphenation joined (im-perator, de-creed, opera-tions, con-sulship).
# Chapters 5 to 19: Chapters
# 5 to 19 are transcribed from pp. 353-377 (English pages, leaves n376-n400). Shipley's text differs from
# the Wikisource text in these chapters as follows, and the English follows it: 5.1 Wolfflin's "a populo
# et senatu Romano mihi oblatam" ("the people and the Roman Senate"); 5.3 "praesenti populum universum
# meis impensis" (no "et cura mea": the English has no "care"); 6.2-7.1 Shipley prints his English for the
# Latin lacuna, supplied from the Greek, in square brackets, opening at 6.2 ("[that I should be elected")
# and closing at 7.1 ("constitution]."); the brackets are kept; 8.11 Ramsay's "complura" and "revocavi"
# without "me auctore" (no "on my motion"); 9.3 Wirtz's "cives uno animo continenter ... sacrificaverunt"
# ("performed continued sacrifices", where the Wikisource text has supplicaverunt); 10.4 Ramsay's "demum"
# ("when he at last was dead"), and 10.5 Seeck's "coeunte ... narratur" ("as is never recorded"); 12.1
# "eodem tempore" for "ea occasione" ("at the same time"); 15.6 "in colonis" for "et colonis" ("in the
# colonies of my soldiers"); 16.5 "itemque C. Antistio et D. Laelio", where the Wikisource text names only
# Laelius ("Gaius Antistius and Decimus Laelius"); 16.7 "libenter" for "circiter" ("as an act of grace",
# not "about"); 18.2 Schmidt's "multo frumentarias et nummarias tesseras ex aere et patrimonio meo dedi"
# ("tickets for grain and money" "from my own purse and my own patrimony", where the Wikisource text has
# tributus ex horreo). 11.3 the print reads "Lucius Lucretius", against Q. Lucretio in every text and
# "Quintus Lucretius" in 12.1; kept as printed. Corrections, chapters 5-19, checked on the page images: -
# footnote marks removed throughout (*, **, ", ', ^, », / and letters run into words, as in spearSii,
# largesse/); - OCR misreadings: hfe and hfetime = life and lifetime, Pubhus and PubHus = Publius, PauUus
# = Paullus, -without = without, ^\ith, -svith, viith, ■nith, ■with and Avith = with, ^irtue = virtue,
# ofRce = office, coUeague = colleague, trium\-irs = triumvirs, re-estabUshment = re-establishment,
# wTiting = writing, senalus = senatus, roU = roll, hutrum = lustrum, 4.937,000 = 4,937,000, falhng =
# falling, coUeges = colleges, indi^idually = individually, hved = lived, dechned = declined, hving =
# living, firom = from, retum and retumed = return and returned, ^irglns = virgins, SjTia = Syria,
# AugustaHa = Augustalia, Quintihus = Quintilius, pro^lnces and pro\-inces = provinces, tlieir = their,
# pro\iding = providing, c> nsulship = consulship, aftervvards = afterwards, stmi = sum, milKon, milUon,
# miUion and milHon = million, vliich = which, Ukewise = likewise, Laehus = Laelius, aiid = and, towTis =
# towns, ser\ace = service, pubhc = public, estabhshed = established, earher = earlier; - "in" before "the
# consulship" at 11.3, lost by the OCR at a line start, restored from the page; - "grain - supply" printed
# "grain-supply" (a hyphen spaced by justification); spaced semicolons closed up; a pencil mark in the
# margin of p. 359 (read "l" in "many l things") dropped; line-end hyphenation joined (ad-ministered,
# constitu-tion, some-times). Alignment: the translation is merged across lines at 8.6-8.7 and 8.8-8.9
# (the Latin line breaks inside a pair of consuls' names), 10.1-10.2 ("enacted by law", per legem in 10.2,
# governs the clause on sacrosanctity in 10.1), 10.4-10.6 (the verb of 10.6 moves to the front, the
# consuls of 10.6 into the clause of 10.5), 12.1-12.2 (the consul's name is split across the lines),
# 16.2-16.3 (the provincial sum of 16.2 is given with its clause in 16.3), and 17.2-17.3 (the sum and the
# verb of 17.3 stand inside the clause of 17.2). At 19.1 "I built" renders feci of 19.6; the lines are
# kept separate because only the verb moves.
# Chapters 20 to 33: Chapters 20-33 are transcribed from the English pages 377-399 (Internet Archive
# leaves n400-n422); every page was checked against its image. Corrections in these chapters: - footnote
# marks removed throughout (*, **, ^, ", ', <*, «, *=, <= and the like), the chapter numbers dropped with
# the others, and two stray scan marks removed ("inner I shrine", "Ultor." -^^); - OCR misreadings:
# CapitoHum = Capitolium, owti and ovm and o-nTi = own, falUng = falling, tuming = turning, JuHan =
# Julian, basiHca = basilica, Satum = Saturn, Hve = live, ^^ith = with, rebviilt = rebuilt, Minueian =
# Minucian, niy = my, Juhus = Julius, ApoUo and \pollo = Apollo, milhon = million, ■\\as = was, Tmce =
# Twice, fumished = furnished, coUege = college, coUeague = colleague, Fumius = Furnius, ^^ild = wild,
# nimiber = number, ta = in, ■hich = which, ohariots = chariots, monev = money, aame = name, 5tatue =
# statue, iway = away, aigainst = against, Ebr = for, -n-hich = which, pro^inces = provinces, aiiiL-giance
# = allegiance, jand = and, pre\aouslv ?or = previously or, wliich = which, oiu- = our, Rliine = Rhine,
# lx)th = of both, foUowing = following, nile = rule, Armemans = Armenians, earher = earlier, ser\ile =
# servile, S}T-ia = Syria, Galha = Gallia, gro\\Ti = grown, hfetime = lifetime, Dahnatians = Dalmatians,
# mihtary = military, ha\ing = having, army .was = army was, \vith = with, supphants = suppliants,
# Dumnol^ellaunus = Dumnobellaunus, lie = he, Partliians = Parthians; - words lost at the cut left margin
# of pp. 385, 387, 389 and 397, restored from the page images: "k oath" = took oath, "as leader" = as its
# leader, "ium" = Actium, "ica" = Africa, "1 • lught" = brought, "any e" = any tribe, "uth" = mouth,
# "lands of Cimbri" = lands of the Cimbri, "1 ever" = had ever, "abri" = Cimbri, "'ples" = peoples, "ir
# envoys" = their envoys, "nian" = Roman, "-pices" = auspices, ".6" = time, "vns" = towns, "captured*" =
# captured. (period), "f xperienced" = experienced, "' iring" = during, "y interchange" = any interchange;
# - in ch. 32 the OCR drops the printed dots of two lacunae, restored as printed: "Tim . . . . . .;" and
# "Suevi . . . . .rus." (Tincommius and Segimerus in the Wikisource text); "Meroe" printed "Meroë"; the
# quotation marks around "Happy," set as curly ones; - the space the print sets before a semicolon is
# closed up (grandsons ;, name ;, eighty ;, suppliants ;, Artavasdes ;, Artaxares ;, Maelo ;, peoples ;,
# Orodes ;); - line-end hyphenation joined (with-out, thir-teenth, con-ducted, assassina-tion, grand-son,
# extend-ing, friend-ship, Bas-tarnae, Dumno-bellaunus); twenty-eight kept with its hyphen. Where
# Augustus' line breaks fall inside one English clause the lines are joined: 20.3-20.4 (the Latin verb
# perfeci stands in 20.4), 22.6-22.7 (Shipley's "on twenty-six occasions I gave to the people" renders
# 22.7), 24.3-24.4 (one clause, the verb posui in 24.4), 25.2-25.3 (Shipley moves the thirty thousand of
# 25.3 to the head of the sentence), 27.3-27.4 (the Latin line break falls inside the name Ti. Nero) and
# 32.5-32.6 (the break falls inside the abbreviation p. R.). Elsewhere a span may end at a comma or
# semicolon. Shipley's Latin differs from the Wikisource text at 20.6 (ex decreto senatus), 20.7 (feci et
# pontes, "constructed ... and all the bridges"), 22.5 (Wirtz's s. c. mecum, "by decree of the senate ...
# in conjunction with me", where Wikisource restores ex senatus consulto et lege), 28.2 (meis auspicis,
# "under my auspices", for me auctore) and 32.2 (the two names left incomplete). At 22.4 the print reads
# "Marcus Silanus" where the Latin has C. Silano; kept as printed.
translation: shipley1924
aligned_by: hand, phase 0
spans:
- lines:
  - rga.praef.1
  - rga.praef.3
  text: Below is a copy of the acts of the Deified Augustus by which he placed the whole world under the
    sovereignty of the Roman people, and of the amounts which he expended upon the state and the Roman
    people, as engraved upon two bronze columns which have been set up in Rome.
- lines:
  - rga.1.1
  - rga.1.2
  text: At the age of nineteen, on my own initiative and at my own expense, I raised an army by means
    of which I restored liberty to the republic, which had been oppressed by the tyranny of a faction.
- lines:
  - rga.1.3
  - rga.1.4
  text: For which service the senate, with complimentary resolutions, enrolled me in its order, in the
    consulship of Gaius Pansa and Aulus Hirtius, giving me at the same time consular precedence in voting;
    it also gave me the imperium.
- lines:
  - rga.1.5
  - rga.1.5
  text: As propraetor it ordered me, along with the consuls, “to see that the republic suffered no harm.”
- lines:
  - rga.1.6
  - rga.1.6
  text: In the same year, moreover, as both consuls had fallen in war, the people elected me consul and
    a triumvir for settling the constitution.
- lines:
  - rga.2.1
  - rga.2.3
  text: Those who slew my father I drove into exile, punishing their deed by due process of law, and afterwards
    when they waged war upon the republic I twice defeated them in battle.
- lines:
  - rga.3.1
  - rga.3.2
  text: Wars, both civil and foreign, I undertook throughout the world, on sea and land, and when victorious
    I spared all citizens who sued for pardon.
- lines:
  - rga.3.3
  - rga.3.3
  text: The foreign nations which could with safety be pardoned I preferred to save rather than to destroy.
- lines:
  - rga.3.4
  - rga.3.4
  text: The number of Roman citizens who bound themselves to me by military oath was about 500,000.
- lines:
  - rga.3.5
  - rga.3.6
  text: Of these I settled in colonies or sent back into their own towns, after their term of service,
    something more than 300,000, and to all I assigned lands, or gave money as a reward for military service.
- lines:
  - rga.3.7
  - rga.3.7
  text: I captured six hundred ships, over and above those which were smaller than triremes.
- lines:
  - rga.4.1
  - rga.4.1
  text: Twice I triumphed with an ovation, thrice I celebrated curule triumphs, and was saluted as imperator
    twenty-one times.
- lines:
  - rga.4.2
  - rga.4.2
  text: Although the Senate decreed me additional triumphs I set them aside.
- lines:
  - rga.4.3
  - rga.4.3
  text: When I had performed the vows which I had undertaken in each war I deposited upon the Capitol
    the laurels which adorned my fasces.
- lines:
  - rga.4.4
  - rga.4.5
  text: For successful operations on land and sea, conducted either by myself or by my lieutenants under
    my auspices, the senate on fifty-five occasions decreed that thanks should be rendered to the immortal
    gods.
- lines:
  - rga.4.6
  - rga.4.6
  text: The days on which such thanks were rendered by decree of the senate numbered 890.
- lines:
  - rga.4.7
  - rga.4.7
  text: In my triumphs there were led before my chariot nine kings or children of kings.
- lines:
  - rga.4.8
  - rga.4.8
  text: At the time of writing these words I had been thirteen times consul, and was in the thirty-seventh
    year of my tribunician power.
- lines:
  - rga.5.1
  - rga.5.1
  text: The dictatorship offered me by the people and the Roman Senate, in my absence and later when present,
    in the consulship of Marcus Marcellus and Lucius Arruntius I did not accept.
- lines:
  - rga.5.2
  - rga.5.2
  text: I did not decline at a time of the greatest scarcity of grain the charge of the grain-supply,
    which I so administered
- lines:
  - rga.5.3
  - rga.5.3
  text: that, within a few days, I freed the entire people, at my own expense, from the fear and danger
    in which they were.
- lines:
  - rga.5.4
  - rga.5.4
  text: The consulship, either yearly or for life, then offered me I did not accept.
- lines:
  - rga.6.1
  - rga.6.1
  text: In the consulship of Marcus Vinucius and Quintus Lucretius, and afterwards in that of Publius
    and Gnaeus Lentulus, and a third time in that of Paullus Fabius Maximus and Quintus Tubero, when the
    Senate and the Roman people unanimously agreed
- lines:
  - rga.6.2
  - rga.6.2
  text: '[that I should be elected overseer of laws and morals, without a colleague and with the fullest
    power,'
- lines:
  - rga.6.3
  - rga.6.3
  text: I refused to accept any power offered me which was contrary to the traditions of our ancestors.
- lines:
  - rga.6.4
  - rga.6.4
  text: Those things which at that time the senate wished me to administer I carried out by virtue of
    my tribunician power.
- lines:
  - rga.6.5
  - rga.6.5
  text: And even in this office I five times received from the senate a colleague at my own request.
- lines:
  - rga.7.1
  - rga.7.1
  text: For ten years in succession I was one of the triumvirs for the re-establishment of the constitution].
- lines:
  - rga.7.2
  - rga.7.2
  text: To the day of writing this I have been princeps senatus for forty years.
- lines:
  - rga.7.3
  - rga.7.3
  text: I have been pontifex maximus, augur, a member of the fifteen commissioners for performing sacred
    rites, one of the seven for sacred feasts, an arval brother, a sodalis Titius, a fetial priest.
- lines:
  - rga.8.1
  - rga.8.1
  text: As consul for the fifth time, by order of the people and the senate I increased the number of
    the patricians.
- lines:
  - rga.8.2
  - rga.8.2
  text: Three times I revised the roll of the senate.
- lines:
  - rga.8.3
  - rga.8.3
  text: In my sixth consulship, with Marcus Agrippa as my colleague, I made a census of the people.
- lines:
  - rga.8.4
  - rga.8.4
  text: I performed the lustrum after an interval of forty-one years.
- lines:
  - rga.8.5
  - rga.8.5
  text: In this lustration 4,063,000 Roman citizens were entered on the census roll.
- lines:
  - rga.8.6
  - rga.8.7
  text: A second time, in the consulship of Gaius Censorinus and Gaius Asinius, I again performed the
    lustrum alone, with the consular imperium. In this lustrum 4,233,000 Roman citizens were entered on
    the census roll.
- lines:
  - rga.8.8
  - rga.8.9
  text: A third time, with the consular imperium, and with my son Tiberius Caesar as my colleague, I performed
    the lustrum in the consulship of Sextus Pompeius and Sextus Apuleius.
- lines:
  - rga.8.10
  - rga.8.10
  text: In this lustrum 4,937,000 Roman citizens were entered on the census roll.
- lines:
  - rga.8.11
  - rga.8.11
  text: By the passage of new laws I restored many traditions of our ancestors which were then falling
    into disuse, and I myself set precedents in many things for posterity to imitate.
- lines:
  - rga.9.1
  - rga.9.1
  text: The senate decreed that every fifth year vows should be undertaken for my health by the consuls
    and the priests.
- lines:
  - rga.9.2
  - rga.9.2
  text: In fulfilment of these vows games were often held in my lifetime, sometimes by the four chief
    colleges of priests, sometimes by the consuls.
- lines:
  - rga.9.3
  - rga.9.3
  text: In addition the entire body of citizens with one accord, both individually and by municipalities,
    performed continued sacrifices for my health at all the couches of the gods.
- lines:
  - rga.10.1
  - rga.10.2
  text: By decree of the senate my name was included in the Salian hymn, and it was enacted by law that
    my person should be sacred in perpetuity and that so long as I lived I should hold the tribunician
    power.
- lines:
  - rga.10.3
  - rga.10.3
  text: I declined to be made Pontifex Maximus in succession to a colleague still living, when the people
    tendered me that priesthood which my father had held.
- lines:
  - rga.10.4
  - rga.10.6
  text: Several years later I accepted that sacred office when he at last was dead who, taking advantage
    of a time of civil disturbance, had seized it for himself, such a multitude from all Italy assembling
    for my election, in the consulship of Publius Sulpicius and Gaius Valgius, as is never recorded to
    have been in Rome before.
- lines:
  - rga.11.1
  - rga.11.1
  text: The Senate consecrated in honour of my return an altar to Fortuna Redux at the Porta Capena, near
    the temple of Honour and Virtue,
- lines:
  - rga.11.2
  - rga.11.2
  text: on which it ordered the pontiffs and the Vestal virgins to perform a yearly sacrifice
- lines:
  - rga.11.3
  - rga.11.3
  text: on the anniversary of the day on which I returned to the city from Syria, in the consulship of
    Lucius Lucretius and Marcus Vinucius,
- lines:
  - rga.11.4
  - rga.11.4
  text: and named the day, after my cognomen, the Augustalia.
- lines:
  - rga.12.1
  - rga.12.2
  text: At the same time, by decree of the senate, part of the praetors and of the tribunes of the people,
    together with the consul Quintus Lucretius and the leading men of the state, were sent to Campania
    to meet me, an honour which up to the present time has been decreed to no one except myself.
- lines:
  - rga.12.3
  - rga.12.3
  text: When I returned from Spain and Gaul, in the consulship of Tiberius Nero and Publius Quintilius,
    after successful operations in those provinces,
- lines:
  - rga.12.4
  - rga.12.4
  text: the senate voted in honour of my return the consecration of an altar to Pax Augusta in the Campus
    Martius,
- lines:
  - rga.12.5
  - rga.12.5
  text: and on this altar it ordered the magistrates and priests and Vestal virgins to make annual sacrifice.
- lines:
  - rga.13.1
  - rga.13.1
  text: Janus Quirinus, which our ancestors ordered to be closed whenever there was peace, secured by
    victory, throughout the whole domain of the Roman people on land and sea,
- lines:
  - rga.13.2
  - rga.13.2
  text: and which, before my birth is recorded to have been closed but twice in all since the foundation
    of the city,
- lines:
  - rga.13.3
  - rga.13.3
  text: the senate ordered to be closed thrice while I was princeps.
- lines:
  - rga.14.1
  - rga.14.1
  text: My sons Gaius and Lucius Caesar, whom fortune snatched away from me in their youth,
- lines:
  - rga.14.2
  - rga.14.2
  text: the senate and the Roman people to do me honour made consuls designate, each in his fifteenth
    year,
- lines:
  - rga.14.3
  - rga.14.3
  text: providing that each should enter upon that office after a period of five years.
- lines:
  - rga.14.4
  - rga.14.4
  text: The senate decreed that from the day on which they were introduced to the forum they should take
    part in the counsels of state.
- lines:
  - rga.14.5
  - rga.14.5
  text: Moreover, the entire body of Roman knights gave each of them the title of princeps iuventutis
    and presented them with silver shields and spears.
- lines:
  - rga.15.1
  - rga.15.1
  text: To the Roman plebs I paid out three hundred sesterces per man in accordance with the will of my
    father, and in my own name in my fifth consulship I gave four hundred sesterces apiece from the spoils
    of war;
- lines:
  - rga.15.2
  - rga.15.2
  text: a second time, moreover, in my tenth consulship I paid out of my own patrimony four hundred sesterces
    per man by way of bounty,
- lines:
  - rga.15.3
  - rga.15.3
  text: and in my eleventh consulship I made twelve distributions of food from grain bought at my own
    expense, and in the twelfth year of my tribunician power I gave for the third time four hundred sesterces
    to each man.
- lines:
  - rga.15.4
  - rga.15.4
  text: These largesses of mine reached a number of persons never less than two hundred and fifty thousand.
- lines:
  - rga.15.5
  - rga.15.5
  text: In the eighteenth year of my tribunician power, as consul for the twelfth time, I gave to three
    hundred and twenty thousand of the city plebs sixty denarii apiece.
- lines:
  - rga.15.6
  - rga.15.6
  text: In the colonies of my soldiers, as consul for the fifth time, I gave one thousand sesterces to
    each man from the spoils of war;
- lines:
  - rga.15.7
  - rga.15.7
  text: about one hundred and twenty thousand men in the colonies received this triumphal largesse.
- lines:
  - rga.15.8
  - rga.15.8
  text: When consul for the thirteenth time I gave sixty denarii apiece to the plebs who were then receiving
    public grain; these were a little more than two hundred thousand persons.
- lines:
  - rga.16.1
  - rga.16.1
  text: To the municipal towns I paid money for the lands which I assigned to soldiers in my own fourth
    consulship and afterwards in the consulship of Marcus Crassus and Gnaeus Lentulus the augur.
- lines:
  - rga.16.2
  - rga.16.3
  text: The sum which I paid for estates in Italy was about six hundred million sesterces, and the amount
    which I paid for lands in the provinces was about two hundred and sixty million.
- lines:
  - rga.16.4
  - rga.16.4
  text: I was the first and only one to do this of all those who up to my time settled colonies of soldiers
    in Italy or in the provinces.
- lines:
  - rga.16.5
  - rga.16.5
  text: And later, in the consulship of Tiberius Nero and Gnaeus Piso, likewise in the consulship of Gaius
    Antistius and Decimus Laelius, and of Gaius Calvisius and Lucius Pasienus,
- lines:
  - rga.16.6
  - rga.16.6
  text: and of Lucius Lentulus and Marcus Messalla, and of Lucius Caninius and Quintus Fabricius,
- lines:
  - rga.16.7
  - rga.16.7
  text: I paid cash gratuities to the soldiers whom I settled in their own towns at the expiration of
    their service, and for this purpose I expended four hundred million sesterces as an act of grace.
- lines:
  - rga.17.1
  - rga.17.1
  text: Four times I aided the public treasury with my own money, paying out in this manner to those in
    charge of the treasury one hundred and fifty million sesterces.
- lines:
  - rga.17.2
  - rga.17.3
  text: And in the consulship of Marcus Lepidus and Lucius Arruntius I contributed one hundred and seventy
    million sesterces out of my own patrimony to the military treasury, which was established on my advice
    that from it gratuities might be paid to soldiers who had seen twenty or more years of service.
- lines:
  - rga.18.1
  - rga.18.1
  text: Beginning with the year in which Gnaeus and Publius Lentulus were consuls, whenever taxes were
    in arrears,
- lines:
  - rga.18.2
  - rga.18.2
  text: I furnished from my own purse and my own patrimony tickets for grain and money, sometimes to a
    hundred thousand persons, sometimes to many more.
- lines:
  - rga.19.1
  - rga.19.1
  text: I built the curia and the Chalcidicum adjoining it, the temple of Apollo on the Palatine with
    its porticoes, the temple of the deified Julius,
- lines:
  - rga.19.2
  - rga.19.2
  text: the Lupercal, the portico at the Circus Flaminius which I allowed to be called Octavia after the
    name of him who had constructed an earlier one on the same site,
- lines:
  - rga.19.3
  - rga.19.3
  text: the state box at the Circus Maximus, the temples on the capitol of Jupiter Feretrius and Jupiter
    Tonans,
- lines:
  - rga.19.4
  - rga.19.4
  text: the temple of Quirinus, the temples of Minerva, of Juno the Queen, and of Jupiter Libertas, on
    the Aventine,
- lines:
  - rga.19.5
  - rga.19.5
  text: the temple of the Lares at the highest point of the Sacra Via, the temple of the Di Penates on
    the Velia, the temple of Youth,
- lines:
  - rga.19.6
  - rga.19.6
  text: and the temple of the Great Mother on the Palatine.
- lines:
  - rga.20.1
  - rga.20.1
  text: The Capitolium and the theatre of Pompey, both works involving great expense, I rebuilt without
    any inscription of my own name.
- lines:
  - rga.20.2
  - rga.20.2
  text: I restored the channels of the aqueducts which in several places were falling into disrepair through
    age, and doubled the capacity of the aqueduct called the Marcia by turning a new spring into its channel.
- lines:
  - rga.20.3
  - rga.20.4
  text: I completed the Julian Forum and the basilica which was between the temple of Castor and the temple
    of Saturn, works begun and far advanced by my father, and when the same basilica was destroyed by
    fire I began its reconstruction on an enlarged site, to be inscribed with the names of my sons,
- lines:
  - rga.20.5
  - rga.20.5
  text: and ordered that in case I should not live to complete it, it should be completed by my heirs.
- lines:
  - rga.20.6
  - rga.20.6
  text: In my sixth consulship, in accordance with a decree of the senate, I rebuilt in the city eighty-two
    temples of the gods, omitting none which at that time stood in need of repair.
- lines:
  - rga.20.7
  - rga.20.7
  text: As consul for the seventh time I constructed the Via Flaminia from the city to Ariminum, and all
    the bridges except the Mulvian and the Minucian.
- lines:
  - rga.21.1
  - rga.21.1
  text: On my own ground I built the temple of Mars Ultor and the Augustan Forum from the spoils of war.
- lines:
  - rga.21.2
  - rga.21.2
  text: On ground purchased for the most part from private owners I built the theatre near the temple
    of Apollo which was to bear the name of my son-in-law Marcus Marcellus.
- lines:
  - rga.21.3
  - rga.21.3
  text: From the spoils of war I consecrated offerings on the Capitol, and in the temple of the divine
    Julius, and in the temple of Apollo, and in the temple of Vesta, and in the temple of Mars Ultor,
- lines:
  - rga.21.4
  - rga.21.4
  text: which cost me about one hundred million sesterces.
- lines:
  - rga.21.5
  - rga.21.5
  text: In my fifth consulship I remitted thirty-five thousand pounds weight of coronary gold contributed
    by the municipia and the colonies of Italy,
- lines:
  - rga.21.6
  - rga.21.6
  text: and thereafter, whenever I was saluted as imperator, I did not accept the coronary gold, although
    the municipia and colonies voted it in the same kindly spirit as before.
- lines:
  - rga.22.1
  - rga.22.1
  text: Three times in my own name I gave a show of gladiators, and five times in the name of my sons
    or grandsons; in these shows there fought about ten thousand men.
- lines:
  - rga.22.2
  - rga.22.2
  text: Twice in my own name I furnished for the people an exhibition of athletes gathered from all parts
    of the world, and a third time in the name of my grandson.
- lines:
  - rga.22.3
  - rga.22.3
  text: Four times I gave games in my own name; as representing other magistrates twenty-three times.
- lines:
  - rga.22.4
  - rga.22.4
  text: For the college of quindecemvirs, as master of that college and with Marcus Agrippa as my colleague,
    I conducted the Secular Games in the consulship of Gaius Furnius and Marcus Silanus.
- lines:
  - rga.22.5
  - rga.22.5
  text: In my thirteenth consulship I gave, for the first time, the games of Mars, which, since that time,
    the consuls by decree of the senate have given in successive years in conjunction with me.
- lines:
  - rga.22.6
  - rga.22.7
  text: In my own name, or that of my sons or grandsons, on twenty-six occasions I gave to the people,
    in the circus, in the forum, or in the amphitheatre, hunts of African wild beasts, in which about
    three thousand five hundred beasts were slain.
- lines:
  - rga.23.1
  - rga.23.1
  text: I gave the people the spectacle of a naval battle beyond the Tiber, at the place where now stands
    the grove of the Caesars,
- lines:
  - rga.23.2
  - rga.23.2
  text: the ground having been excavated for a length of eighteen hundred and a breadth of twelve hundred
    feet.
- lines:
  - rga.23.3
  - rga.23.3
  text: In this spectacle thirty beaked ships, triremes or biremes, and a large number of smaller vessels
    met in conflict.
- lines:
  - rga.23.4
  - rga.23.4
  text: In these fleets there fought about three thousand men exclusive of the rowers.
- lines:
  - rga.24.1
  - rga.24.1
  text: After my victory I replaced in the temples in all the cities of the province of Asia the ornaments
    which my antagonist in the war, when he despoiled the temples, had appropriated to his private use.
- lines:
  - rga.24.2
  - rga.24.2
  text: Silver statues of me, on foot, on horseback, and in chariots were erected in the city to the number
    of about eighty;
- lines:
  - rga.24.3
  - rga.24.4
  text: these I myself removed, and from the money thus obtained I placed in the temple of Apollo golden
    offerings in my own name and in the name of those who had paid me the honour of a statue.
- lines:
  - rga.25.1
  - rga.25.1
  text: I freed the sea from pirates.
- lines:
  - rga.25.2
  - rga.25.3
  text: About thirty thousand slaves, captured in that war, who had run away from their masters and had
    taken up arms against the republic, I delivered to their masters for punishment.
- lines:
  - rga.25.4
  - rga.25.4
  text: The whole of Italy voluntarily took oath of allegiance to me and demanded me as its leader in
    the war in which I was victorious at Actium.
- lines:
  - rga.25.5
  - rga.25.5
  text: The provinces of the Spains, the Gauls, Africa, Sicily, and Sardinia took the same oath of allegiance.
- lines:
  - rga.25.6
  - rga.25.6
  text: Those who served under my standards at that time included more than 700 senators,
- lines:
  - rga.25.7
  - rga.25.7
  text: and among them eighty-three who had previously or have since been consuls up to the day on which
    these words were written, and about 170 have been priests.
- lines:
  - rga.26.1
  - rga.26.1
  text: I extended the boundaries of all the provinces which were bordered by races not yet subject to
    our empire.
- lines:
  - rga.26.2
  - rga.26.2
  text: The provinces of the Gauls, the Spains, and Germany, bounded by the ocean from Gades to the mouth
    of the Elbe, I reduced to a state of peace.
- lines:
  - rga.26.3
  - rga.26.3
  text: The Alps, from the region which lies nearest to the Adriatic as far as the Tuscan Sea, I brought
    to a state of peace without waging on any tribe an unjust war.
- lines:
  - rga.26.4
  - rga.26.4
  text: My fleet sailed from the mouth of the Rhine eastward as far as the lands of the Cimbri
- lines:
  - rga.26.5
  - rga.26.5
  text: to which, up to that time, no Roman had ever penetrated either by land or by sea,
- lines:
  - rga.26.6
  - rga.26.6
  text: and the Cimbri and Charydes and Semnones and other peoples of the Germans of that same region
    through their envoys sought my friendship and that of the Roman people.
- lines:
  - rga.26.7
  - rga.26.7
  text: On my order and under my auspices two armies were led, at almost the same time, into Ethiopia
    and into Arabia
- lines:
  - rga.26.8
  - rga.26.8
  text: which is called the “Happy,” and very large forces of the enemy of both races were cut to pieces
    in battle and many towns were captured.
- lines:
  - rga.26.9
  - rga.26.9
  text: Ethiopia was penetrated as far as the town of Nabata, which is next to Meroë.
- lines:
  - rga.26.10
  - rga.26.10
  text: In Arabia the army advanced into the territories of the Sabaei to the town of Mariba.
- lines:
  - rga.27.1
  - rga.27.1
  text: Egypt I added to the empire of the Roman people.
- lines:
  - rga.27.2
  - rga.27.2
  text: In the case of Greater Armenia, though I might have made it a province after the assassination
    of its King Artaxes, I preferred, following the precedent of our fathers, to hand that kingdom over
    to Tigranes,
- lines:
  - rga.27.3
  - rga.27.4
  text: the son of King Artavasdes, and grandson of King Tigranes, through Tiberius Nero who was then
    my stepson.
- lines:
  - rga.27.5
  - rga.27.5
  text: And later, when the same people revolted and rebelled, and was subdued by my son Gaius, I gave
    it over to King Ariobarzanes
- lines:
  - rga.27.6
  - rga.27.6
  text: the son of Artabazus, King of the Medes, to rule, and after his death to his son Artavasdes.
- lines:
  - rga.27.7
  - rga.27.7
  text: When he was murdered I sent into that kingdom Tigranes, who was sprung from the royal family of
    the Armenians.
- lines:
  - rga.27.8
  - rga.27.8
  text: I recovered all the provinces extending eastward beyond the Adriatic Sea, and Cyrenae, which were
    then for the most part in possession of kings,
- lines:
  - rga.27.9
  - rga.27.9
  text: and, at an earlier time, Sicily and Sardinia, which had been seized in the servile war.
- lines:
  - rga.28.1
  - rga.28.1
  text: I settled colonies of soldiers in Africa, Sicily, Macedonia, both Spains, Achaia, Asia, Syria,
    Gallia Narbonensis, Pisidia.
- lines:
  - rga.28.2
  - rga.28.2
  text: Moreover, Italy has twenty-eight colonies founded under my auspices which have grown to be famous
    and populous during my lifetime.
- lines:
  - rga.29.1
  - rga.29.1
  text: From Spain, Gaul, and the Dalmatians, I recovered, after conquering the enemy, many military standards
    which had been lost by other generals.
- lines:
  - rga.29.2
  - rga.29.2
  text: The Parthians I compelled to restore to me the spoils and standards of three Roman armies, and
    to seek as suppliants the friendship of the Roman people.
- lines:
  - rga.29.3
  - rga.29.3
  text: These standards I deposited in the inner shrine which is in the Temple of Mars Ultor.
- lines:
  - rga.30.1
  - rga.30.1
  text: The tribes of the Pannonians, to which no army of the Roman people had ever penetrated before
    my principate, having been subdued by Tiberius Nero
- lines:
  - rga.30.2
  - rga.30.2
  text: who was then my stepson and my legate, I brought under the sovereignty of the Roman people, and
    I pushed forward the frontier of Illyricum as far as the bank of the river Danube.
- lines:
  - rga.30.3
  - rga.30.3
  text: An army of Dacians which crossed to the south of that river was, under my auspices, defeated and
    crushed,
- lines:
  - rga.30.4
  - rga.30.4
  text: and afterwards my own army was led across the Danube and compelled the tribes of the Dacians to
    submit to the orders of the Roman people.
- lines:
  - rga.31.1
  - rga.31.1
  text: Embassies were often sent to me from the kings of India, a thing never seen before in the camp
    of any general of the Romans.
- lines:
  - rga.31.2
  - rga.31.2
  text: Our friendship was sought, through ambassadors, by the Bastarnae and Scythians, and by the kings
    of the Sarmatians who live on either side of the river Tanais,
- lines:
  - rga.31.3
  - rga.31.3
  text: and by the king of the Albani and of the Hiberi and of the Medes.
- lines:
  - rga.32.1
  - rga.32.1
  text: Kings of the Parthians, Tiridates, and later Phrates, the son of King Phrates, took refuge with
    me as suppliants;
- lines:
  - rga.32.2
  - rga.32.2
  text: of the Medes, Artavasdes; of the Adiabeni, Artaxares; of the Britons, Dumnobellaunus and Tim .
    . . . . .; of the Sugambri, Maelo; of the Marcomanni and Suevi . . . . .rus.
- lines:
  - rga.32.3
  - rga.32.3
  text: Phrates, son of Orodes, king of the Parthians, sent all his sons and grandsons to me in Italy,
- lines:
  - rga.32.4
  - rga.32.4
  text: not because he had been conquered in war, but rather seeking our friendship by means of his own
    children as pledges.
- lines:
  - rga.32.5
  - rga.32.6
  text: And a large number of other nations experienced the good faith of the Roman people during my principate
    who never before had had any interchange of embassies or of friendship with the Roman people.
- lines:
  - rga.33.1
  - rga.33.1
  text: From me the peoples of the Parthians and of the Medes received the kings for whom they asked through
    ambassadors, the chief men of those peoples;
- lines:
  - rga.33.2
  - rga.33.2
  text: the Parthians Vonones, son of King Phrates, grandson of King Orodes;
- lines:
  - rga.33.3
  - rga.33.3
  text: the Medes Ariobarzanes, the son of King Artavazdes, grandson of King Ariobarzanes.
- lines:
  - rga.34.1
  - rga.34.3
  text: In my sixth and seventh consulships, when I had extinguished the flames of civil war, after receiving
    by universal consent the absolute control of affairs, I transferred the republic from my own control
    to the will of the senate and the Roman people.
- lines:
  - rga.34.4
  - rga.34.9
  text: For this service on my part I was given the title of Augustus by decree of the senate, and the
    doorposts of my house were covered with laurels by public act, and a civic crown was fixed above my
    door, and a golden shield was placed in the Curia Julia whose inscription testified that the senate
    and the Roman people gave me this in recognition of my valour, my clemency, my justice, and my piety.
- lines:
  - rga.34.10
  - rga.34.11
  text: After that time I took precedence of all in rank, but of power I possessed no more than those
    who were my colleagues in any magistracy.
- lines:
  - rga.35.1
  - rga.35.4
  text: While I was administering my thirteenth consulship the senate and the equestrian order and the
    entire Roman people gave me the title of Father of my Country, and decreed that this title should
    be inscribed upon the vestibule of my house and in the senate-house and in the Forum Augustum beneath
    the quadriga erected in my honour by decree of the senate.
- lines:
  - rga.35.5
  - rga.35.5
  text: At the time of writing this I was in my seventy-sixth year.
