# Frederick W. Shipley, The Acts of Augustus as Recorded on the Monumentum Ancyranum, in Velleius
# Paterculus, Compendium of Roman History; Res Gestae Divi Augusti, Loeb Classical Library (London:
# Heinemann; New York: Putnam, 1924), pp. 345-401, transcribed from the Internet Archive OCR
# (compendiumofroma00velluoft). Shipley translates a text based on Mommsen (1883) and Diehl (1918); in
# ch. 34 it reads dignitate, as Mommsen did, where the Wikisource text shown above reads auctoritate.
