# Notes for the Res Gestae Divi Augusti: the heading, chapters 1-4, 34 and 35.
- id: n.rga.document
  attach: rga.praef.1
  kind: editorial
  status: draft
  leans_on: "Suetonius, Augustus 101; Fairley (1898), introduction and note on the title; Shipley (1924), introduction, pp. 336-338"
  text: "The Res Gestae is Augustus's own account of his public career, written in the first person. Suetonius reports that at his death in AD 14 Augustus left with the Vestal Virgins, besides his will, three sealed documents; one was a summary of his deeds, which he wished to be inscribed on bronze tablets and set up before his mausoleum in Rome. The heading of the surviving copy says the same in its own terms: two bronze pillars (pilae, not tablets) standing at Rome. The bronze originals are lost. The last chapter dates the writing to his seventy-sixth year, that is, between September AD 13 and his death in August AD 14. Shipley's introduction holds that the text was begun much earlier and added to over time, with an early draft complete by 2 BC; the extent and dates of the revisions are disputed."
- id: n.rga.ancyra
  attach: rga.praef.3.10
  kind: editorial
  status: draft
  leans_on: "Fairley (1898), introduction and note on the title; Shipley (1924), introduction and note on the superscription"
  text: "The text survives because copies were set up in the Roman province of Galatia. The fullest is on the temple of Rome and Augustus at Ancyra (modern Ankara), reported to Europe by the embassy of Ogier Ghiselin de Busbecq, which passed through the city in 1555. There the Latin is cut on the walls of the temple's porch, and a Greek translation on an outside wall; where the Latin is damaged, editors restore it from the Greek. Smaller pieces survive from Apollonia (Greek) and Pisidian Antioch (Latin). The heading is not Augustus's: it speaks of him in the third person and calls the text a copy (exemplar) of what stood at Rome, so it was written by those who set up the provincial copy. Shipley renders the Greek heading as 'a translation of the acts and donations of the Deified Augustus as left by him inscribed on two bronze columns at Rome.' This page shows the Latin only."
- id: n.rga.first-sentence
  attach: rga.1.1
  kind: editorial
  status: draft
  leans_on: "Fairley (1898) and Shipley (1924), notes to ch. 1; Lewis and Short, s.v. vindico"
  text: "The first sentence describes 44 BC. After Julius Caesar's murder in March, the heir he had adopted in his will, known to modern writers as Octavian, turned nineteen on 23 September. In October, holding no office, he enlisted Caesar's veterans at Casilinum and Calatia in Campania with a bounty paid from his own funds, and in November two of Antony's legions went over to him. The senate ratified this on 20 December, on Cicero's motion (Shipley's note). The sentence stresses the absence of public authority twice, privato consilio, 'by private counsel', and privata impensa, 'at private expense', and names no opponent: the 'faction' is Mark Antony, whom the text never names. In libertatem vindicare is a legal phrase, used of asserting a person's free status in court; here it is applied to the state. The rest of the chapter runs into 43 BC: the senate's grant of rank and command in January, the deaths of both consuls at Mutina in April, his consulship in August and the triumvirate in November."
- id: n.rga.restorations
  attach: rga.4.1
  kind: editorial
  status: draft
  leans_on: "Fairley (1898), textual notes; Shipley (1924), introduction and textual notes"
  text: "Square brackets enclose letters lost from the Ancyra stone and supplied by editors, mostly from the Greek translation. In this text they are not applied evenly. Chapters 2 to 4 and 34 to 35 bracket the losses closely. Chapter 1 has a single bracket, although much of its Latin is lost at Ancyra: Mommsen's text, as Fairley prints it, brackets [do]minatione and large parts of the second, third and fourth sentences. Chapter 1 also reads a dominatione and Eo nomine, where Mommsen and Shipley print dominatione and Ob quae or Quas ob res. Where the Greek is damaged too, editors disagree, and the restorations here come from more than one of them. In ch. 1, simul dans sententiae ferendae is Mommsen's; Shipley prints sententiae dicendae simul dans. In ch. 3, veniam petentibus, 'asking pardon', follows Hirschfeld and Seeck; Mommsen read superstitibus, which is why Fairley translates 'all surviving citizens'. In ch. 4, Laurum de fascibus follows Wehofer; Mommsen read Item saepe laurus, which is why Fairley has 'Likewise I often deposited the laurels'. Some brackets open or close without a partner (coloni]as, potest]atis, pat]rem); the page keeps them as printed and does not guess where the missing one belongs."
- id: n.rga.source-errors
  attach: rga.35.2.4
  kind: editorial
  status: draft
  text: "The Wikisource text has a few errors that are not in the inscription or in Mommsen's edition. The page keeps them, because the edition reproduces its source letter for letter. Order (ch. 35) stands for ordo, 'order'; annus agebam (ch. 35) for annum agebam, 'I was passing my year'; costituendae (ch. 1) for constituendae; and quinquageniens (ch. 4) for quinquagiens, 'fifty times'. The gloss row and the classical sound give the intended word for order, costituendae and quinquageniens; annus is sounded as printed and glossed as annum."
- id: n.rga.augustus
  attach: rga.34.4.7
  kind: editorial
  status: draft
  leans_on: "Suetonius, Augustus 7; Shipley (1924), note to ch. 34; Lewis and Short, s.v. augustus"
  text: "The name Augustus was conferred by decree of the senate in January 27 BC; Shipley gives 16 January. Before it he was known as Imperator Caesar, son of the deified. Augustus was an existing adjective, for which Lewis and Short give 'consecrated, holy' and 'majestic, venerable'. Suetonius reports that some senators proposed the name Romulus, and that the motion of Munatius Plancus for Augustus prevailed, on the ground that places consecrated by augury were called augusta. The Greek version renders the name as Sebastos, 'revered'. This is the only place in the body of the document where his own name appears. The honours listed with it, laurels on the doorposts, the oak-leaf civic crown given for saving citizens' lives, and the golden shield naming four virtues, are attested on coins and inscriptions, as Fairley and Shipley note."
- id: n.rga.auctoritas
  attach: rga.34.10.4
  kind: editorial
  status: draft
  leans_on: "Lewis and Short, s.vv. auctoritas, potestas; Fairley (1898) and Shipley (1924), ch. 34"
  text: "Potestas here is the legal power that belongs to an office: what a consul or a tribune may lawfully do. Auctoritas is standing that gives weight to a person's word without legal compulsion; Lewis and Short give 'influence, weight, authority'. The sentence sets the two against each other: Augustus says he surpassed everyone in auctoritas but held no more potestas than his colleagues in each office. The word printed here also has a textual history. The Ancyra stone is broken at this point and the Greek has axiōmati, 'in rank or dignity', so Mommsen restored dignitate, and both translations on this page translate that word ('dignity', 'rank'). Auctoritate was read later on the Latin fragments from Pisidian Antioch, published in the 1920s, and modern texts, including this one, print it. The sentence describes his formal position. How far it describes his actual power is a question of interpretation; this chapter does not mention, for example, the provincial commands he held for most of his reign."
- id: n.rga.self-presentation
  attach: rga.34.3
  kind: editorial
  status: draft
  leans_on: "Fairley (1898), notes to chs. 2 and 34; Shipley (1924), introduction, p. 336, and note to ch. 34"
  text: "The Res Gestae is evidence first of how Augustus wished his career to be recorded, and it can be checked against other sources only event by event. One way it shapes the record is by selection. It names none of his Roman opponents (Antony, Brutus and Cassius, Lepidus, Sextus Pompey), and none of his family except those who shared public honours with him. Fairley's note on ch. 2 takes 'I twice defeated them in battle' as the clearest case where the wording departs from the record, since Octavian's own wing was beaten in the first battle at Philippi. On ch. 34, Fairley calls the question whether Augustus restored the republic 'one of the riddles of history', and Shipley writes that in form he restored the republic, while 'in substance the real power rested with him'. Both judgments are those of their authors. The text itself makes a narrower claim: that in 28 and 27 BC he transferred the state from his power to the judgment of the senate and people."
