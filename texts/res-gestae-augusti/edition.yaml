      - "tum] centum millibus h[omi]num, tum pluribus multo frume[ntarios et n]umma[rio]s t[ributus ex horr]eo et patr[i]monio m[e]o edidi."
  - id: "19"
    title: "Chapter 19: buildings: the senate house, temples, porticoes"
    lines:
      - "Curiam et continens ei Chalcidicum templumque Apollinis in Palatio cum porticibus, aedem divi Iuli,"
      - "Lupercal, porticum ad circum Flaminium, quam sum appellari passus ex nomine eius qui priorem eodem in solo fecerat Octaviam,"
      - "pulvinar ad circum maximum, aedes in Capitolio Iovis Feretri et Iovis Tonantis,"
      - "aedem Quirini, aedes Minervae et Iunonis reginae et Iovis Libertatis in Aventino,"
      - "aedem Larum in summa sacra via, aedem deum Penatium in Velia, aedem Iuventatis,"
      - "aedem Matris Magnae in Palatio feci."
  - id: "20"
    title: "Chapter 20: restorations: the Capitol, Pompey's theater, aqueducts, eighty-two temples, the Flaminian Way"
    lines:
      - "Capitolium et Pompeium theatrum utrumque opus impensa grandi refeci sine ulla inscriptione nominis mei."
      - "Rovos aquarum compluribus locis vetustate labentes refeci, et aquam quae Marcia appellatur duplicavi fonte novo in rivum eius inmisso."
      - "Forum Iulium et basilicam quae fuit inter aedem Castoris et aedem Saturni,"
      - "coepta profligataque poera a patre meo, perfeci, et eandem basilicam consumptam incendio ampliato eius solo sub titulo nominis filiorum m[eorum i]ncohavi,"
      - "et, si vivus non perfecissem, perfici ab heredibus [meis ius]si."
