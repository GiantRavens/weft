  - id: "16"
    title: "Chapter 16: payments for the veterans' land"
    lines:
      - "Pecuniam [pr]o agris, quos in consulatu meo quarto et postea consulibus M. Cr[a]ssao et Cn. Lentulo augure adsignavi militibus, soliv municipis."
      - "Ea [s]u[mma s]estertium circiter sexsiens milliens fuit, quam [p]ro Italicis praedis numeravi. et ci[r]citer bis mill[ie]ns et sescentiens,"
      - "quod pro agris provincialibus soliv."
      - "Id primus et [s]olus omnium, qui [d]eduxerunt colonias militum in Italia aut in provincis, ad memoriam aetatis meae feci."
      - "Et postea Ti. Nerone et Cn. Pisone consulibus, et D. Laelio cos., et C. Calvisio et L. Pasieno consulibus,"
      - "et L. Le[nt]ulo et M. Messalla consulibus, et L. Caninio et Q. Fabricio co[s.],"
      - "milit[i]bus, quos emeriteis stipendis in sua municpi[a dedux]i, praem[i]a numerato persolvi. quam in rem sestertium q[uater m]illiens cir[cite]r impendi."
  - id: "17"
    title: "Chapter 17: help to the treasury; the military treasury"
    lines:
      - "Quater [pe]cunia mea iuvi aerarium, ita ut sestertium milliens et quing[en]ties ad eos qui praerant aerario detulerim."
      - "Et M. Lepido et L. Ar[r]untio cos. in aerarium militare, quod ex consilio n[eo] co[ns]titutum est,"
      - "ex [q]uo praemia darentur militibus, qui vicena [aut plu]ra sti[pendi]a emeruissent — HS milliens et septing[e]nti[ens ex pa]t[rim]onio [m]eo detuli."
  - id: "18"
    title: "Chapter 18: grain and money from his own granary and funds"
    lines:
