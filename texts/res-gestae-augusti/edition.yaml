      - "ter me princi]pe senat]us claudendum esse censui[t]."
  - id: "14"
    title: "Chapter 14: honors for his sons Gaius and Lucius"
    lines:
      - "Filios meos, quos iuv[enes] mihi eripuit for[tuna], Gaium et Lucium Caesares,"
      - "honoris mei causa senatus populusque Romanus annum quintum et decimum agentis consules designavit,"
      - "ut [e]um magistratum inirent post quinquennium."
      - "Et ex eo die, quo deducti [s]unt in forum ut interessent consiliis publicis decrevit sena[t]us."
      - "Equites [a]utem Romani universi principem iuventutis utrumque eorum parm[is] et hastis argenteis donatum appellaverunt."
