  lead: 'Res Gestae Divi Augusti (contemporaneous and authorised Ancient Greek translation: πράξεις τε
    καὶ δωρεαὶ Σεβαστοῦ θεοῦ; Eng. The Deeds of the Divine Augustus) is a monumental inscription composed
    by the first Roman emperor, Augustus, giving a first-person record of his life and accomplishments.
    The Res Gestae is especially significant because it gives an insight into the image Augustus presented
    to the Roman people. Various portions of the Res Gestae have been found in modern Turkey. The inscription
    itself is a monument to the establishment of the Julio-Claudian dynasty that was to follow Augustus.'
