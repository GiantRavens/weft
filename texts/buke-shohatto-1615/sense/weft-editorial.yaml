# Weft editorial translation of the Buke shohatto of 1615 (draft). It follows the Chinese sentence
# and the Japanese reading line by line; where the two differ in emphasis, it follows the reading.
# The Kui hexagram line in article 8 is uncertain (see the note on bk.8.3).
translation: weft-editorial
aligned_by: hand
spans:
- lines:
  - bk.1.1
  - bk.1.1
  text: 'Item: the way of letters and arms, of bow and horse, is to be pursued single-mindedly.'
- lines:
  - bk.1.2
  - bk.1.2
  text: 'Letters on the left and arms on the right: this was the rule of antiquity.'
- lines:
  - bk.1.3
  - bk.1.3
  text: Both must be held together.
- lines:
  - bk.1.4
  - bk.1.4
  text: Bow and horse are the key and pivot of the military houses.
- lines:
  - bk.1.5
  - bk.1.5
  text: Weapons are called instruments of ill omen; they are used only when there is no other way.
- lines:
  - bk.1.6
  - bk.1.6
  text: 'In time of order one does not forget disorder: how then should training not be urged on?'
- lines:
  - bk.2.1
  - bk.2.1
  text: 'Item: drinking in crowds and idle amusement are to be restrained.'
- lines:
  - bk.2.2
  - bk.2.2
  text: The strict prohibitions set down in the ordinances are especially weighty.
- lines:
  - bk.2.3
  - bk.2.3
  text: To indulge in sensual pleasure and make a trade of gambling is the foundation of a ruined realm.
- lines:
  - bk.3.1
  - bk.3.1
  text: 'Item: those who have broken the laws are not to be hidden and kept in the domains.'
- lines:
  - bk.3.2
  - bk.3.2
  text: Law is the root of propriety and order.
- lines:
  - bk.3.3
  - bk.3.3
  text: Law may override reason, but reason does not override law.
- lines:
  - bk.3.4
  - bk.3.4
  text: Those who break the law commit no light offence.
- lines:
  - bk.4.1
  - bk.4.1
  text: 'Item: where the great and lesser lords and all stipended men of the domains retain men-at-arms and soldiers, if one of them is reported to be a rebel or a murderer, he is to be driven out at once.'
- lines:
  - bk.4.2
  - bk.4.2
  text: Now, one who harbours ambition is a sharp tool for overturning the state and a sword's point for cutting off the people.
- lines:
  - bk.4.3
  - bk.4.3
  text: How could such a one be tolerated?
- lines:
  - bk.5.1
  - bk.5.1
  text: 'Item: from now on, apart from the people of the domain itself, persons of other domains are not to be mixed in and kept.'
- lines:
  - bk.5.2
  - bk.5.2
  text: In general, customs differ from domain to domain.
- lines:
  - bk.5.3
  - bk.5.3
  text: To tell another domain the secret affairs of one's own, or to tell one's own the secret affairs of another, is the first sprout of flattery and fawning.
- lines:
  - bk.6.1
  - bk.6.1
  text: 'Item: repairs to the castles where lords reside in the domains must always be reported; new construction, all the more, is strictly forbidden.'
- lines:
  - bk.6.2
  - bk.6.2
  text: A castle wall longer than a hundred chi is a harm to the state.
- lines:
  - bk.6.3
  - bk.6.3
  text: To raise ramparts high and dredge moats deep is the root of great disorder.
- lines:
  - bk.7.1
  - bk.7.1
  text: 'Item: if there are persons in a neighbouring domain who plot new undertakings and form factions, it is to be reported promptly.'
- lines:
  - bk.7.2
  - bk.7.2
  text: All men have factions, and few are discerning.
- lines:
  - bk.7.3
  - bk.7.3
  text: So some do not obey their lord and father, and fall out suddenly with neighbouring villages.
- lines:
  - bk.7.4
  - bk.7.4
  text: 'They do not keep to old precedent: why do they plot new undertakings?'
- lines:
  - bk.8.1
  - bk.8.1
  text: 'Item: marriages are not to be contracted privately.'
- lines:
  - bk.8.2
  - bk.8.2
  text: Marriage is the way of harmony between yin and yang; it is not to be undertaken lightly.
- lines:
  - bk.8.3
  - bk.8.3
  text: 'The Kui hexagram says: not robbers, but suitors. If a marriage is about to open a way to enemies, its proper time is lost.'
- lines:
  - bk.8.4
  - bk.8.4
  text: 'The poem The Young Peach Tree says: when man and woman are matched rightly and marriages are made in season, the realm has no men without wives.'
- lines:
  - bk.8.5
  - bk.8.5
  text: To form factions through marriage ties is the root of treacherous plots.
- lines:
  - bk.9.1
  - bk.9.1
  text: 'Item: the conduct of the daimyō when they come to attend on the shōgun.'
- lines:
  - bk.9.2
  - bk.9.2
  text: 'A decree in the Shoku Nihongi says: those who have no part in public affairs may not gather their kin at will.'
- lines:
  - bk.9.3
  - bk.9.3
  text: Within the capital, no more than twenty horsemen may go about together; and so on.
- lines:
  - bk.9.4
  - bk.9.4
  text: So a large force is not to be brought.
- lines:
  - bk.9.5
  - bk.9.5
  text: Lords of a million koku or less and two hundred thousand or more are not to exceed twenty horsemen.
- lines:
  - bk.9.6
  - bk.9.6
  text: Lords of a hundred thousand koku or less are to bring a number in proportion.
- lines:
  - bk.9.7
  - bk.9.7
  text: But when on public duty, each is to follow what his station allows.
- lines:
  - bk.10.1
  - bk.10.1
  text: 'Item: the grades of dress are not to be confused.'
- lines:
  - bk.10.2
  - bk.10.2
  text: Lord and vassal, high and low, are each to be distinct.
- lines:
  - bk.10.3
  - bk.10.3
  text: White damask, white kosode, purple linings, glossed silk, kosode without crests and purple lined robes are not to be worn at will by those without licence.
- lines:
  - bk.10.4
  - bk.10.4
  text: In recent times retainers, followers and common soldiers wear ornate clothes of damask, gauze, brocade and embroidery; this is not the old rule, and it is severely restrained.
- lines:
  - bk.11.1
  - bk.11.1
  text: 'Item: common people are not to ride in palanquins at will.'
- lines:
  - bk.11.2
  - bk.11.2
  text: From of old there have been houses that ride in palanquins without licence, according to the person, and houses that ride once licensed.
- lines:
  - bk.11.3
  - bk.11.3
  text: Yet in recent years even retainers and common soldiers ride in palanquins; this is truly the height of disorder.
- lines:
  - bk.11.4
  - bk.11.4
  text: From now on, the lords of provinces and those below them, and the eminent members of their houses, may ride without seeking a licence.
- lines:
  - bk.11.5
  - bk.11.5
  text: Besides these, close attendants, physicians and diviners, persons of sixty and over, and the sick may ride once licensed.
- lines:
  - bk.11.6
  - bk.11.6
  text: A master who lets his retainers and soldiers ride at will shall be held at fault.
- lines:
  - bk.11.7
  - bk.11.7
  text: Court nobles, imperial abbots and the clergy of rank are, however, outside this restriction.
- lines:
  - bk.12.1
  - bk.12.1
  text: 'Item: the samurai of all the domains are to practise thrift.'
- lines:
  - bk.12.2
  - bk.12.2
  text: The rich grow ever more boastful, and the poor are ashamed that they cannot keep up.
- lines:
  - bk.12.3
  - bk.12.3
  text: No decline of custom is worse than this; that is why it is strictly restrained.
- lines:
  - bk.13.1
  - bk.13.1
  text: 'Item: the lords of the domains are to choose men capable in government.'
- lines:
  - bk.13.2
  - bk.13.2
  text: In general, the way of governing a realm lies in getting the right men.
- lines:
  - bk.13.3
  - bk.13.3
  text: Examine merit and fault clearly, and reward and punishment will always fit.
- lines:
  - bk.13.4
  - bk.13.4
  text: If a realm has good men, it flourishes the more.
- lines:
  - bk.13.5
  - bk.13.5
  text: If a realm has no good men, it surely perishes.
- lines:
  - bk.13.6
  - bk.13.6
  text: This is the clear warning of the sages of old.
- lines:
  - bk.close.1
  - bk.close.1
  text: The above is to be observed.
- lines:
  - bk.close.2
  - bk.close.2
  text: Keichō 20, year of the hare, seventh month.
