# James Murdoch, A History of Japan, vol. 2 (1903), pp. 703-704: a one-sentence digest of each of the
# thirteen articles, without the commentary. Text from the Internet Archive OCR (historyofjapan02murd),
# verbatim; the OCR's doubled spaces are collapsed and the article numbers dropped. No other changes.
translation: murdoch1903
aligned_by: hand
spans:
- lines:
  - bk.1.1
  - bk.1.1
  text: That the study of literature and of the art of war, archery, and horsemanship should be strenuously prosecuted or practised.
- lines:
  - bk.2.1
  - bk.2.1
  text: That excessive drinking and licentious amusements should be prohibited.
- lines:
  - bk.3.1
  - bk.3.1
  text: That [national] law-breakers should not be harboured in the various fiefs,
- lines:
  - bk.4.1
  - bk.4.1
  text: That in engaging men and soldiers, the great and little lords and the various salaried men should summarily reject those who might be denounced as traitors and murderers.
- lines:
  - bk.5.1
  - bk.5.1
  text: That thenceforth only the native-born, to the exclusion of all men from other fiefs, should be permitted to reside in a fief.
- lines:
  - bk.6.1
  - bk.6.1
  text: That even the repair of the castles in the various fiefs should be notified; much more are new constructions prohibited.
- lines:
  - bk.7.1
  - bk.7.1
  text: That should there be in neighbouring fiefs men who scheme for a new order of things, raising factions and parties, they should be speedily denounced.
- lines:
  - bk.8.1
  - bk.8.1
  text: That marriages should not be privately contracted.
- lines:
  - bk.9.1
  - bk.9.1
  text: That the retinues of various Daimyo, in going up to and during their residence in Yedo, should be properly limited in number.
- lines:
  - bk.10.1
  - bk.10.1
  text: That the articles of dress should not be arbitrarily and promiscuously selected.
- lines:
  - bk.11.1
  - bk.11.1
  text: That private persons should not use palanquins.
- lines:
  - bk.12.1
  - bk.12.1
  text: That the samurai of the various fiefs should be frugal in their livelihood.
- lines:
  - bk.13.1
  - bk.13.1
  text: That the heads of fiefs should choose capable persons as their ministers and advisers.
