# Weft edition of the Buke shohatto (武家諸法度) of 1615, the Genna text of thirteen articles, as
# printed in Kondō Heijō, ed., Kaitei Shiseki shūran, vol. 17 (1903), pp. 218-220, from the Japanese
# Wikisource transcription of those scan pages (pinned revisions, see the manifest). Each line is
# checked verbatim against its page with the return marks and markup stripped (verify_strip); the
# return marks themselves are checked by japanese.line_checks against the page as printed
# (kunten_in), mark by mark.
#
# The text is kanbun: Chinese-character text that a Japanese reader read aloud in Japanese. Tokens
# are single characters, or a compound verb where the print sets one mark for both characters
# (kaeri_at gives the character it follows). For each token: t = character(s) as printed;
# n = its reading, in historical kana, with the inflection and particles the reader supplied
# (okurigana); kaeri = the return mark printed beside it; oki = a character the reader passes over;
# saidoku = the first reading of a character read twice; mod = today's reading where the rules do
# not give it; kaeri_read = the mark a reader needs where the print has another. yomi on a line is
# the whole line as read aloud (yomikudashi), checked against the order and the readings.
#
# Line division and the readings are Weft's (draft). The Wikisource transcriber emended two
# misprints of the 1903 page (雉 to 雖 in article 6, 馬 to 輿 in article 11, recorded in HTML
# comments on the page); the edition follows the emended text, and a note records both.
