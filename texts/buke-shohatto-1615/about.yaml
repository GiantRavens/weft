  lead: The Buke shohatto (武家諸法度, lit. Various Points of Laws for Warrior Houses), commonly known in English
    as the Laws for the Military Houses, was a collection of edicts issued by Japan's Tokugawa shogunate
    governing the responsibilities and activities of daimyō (feudal lords) and the rest of the samurai
    warrior aristocracy. These formed the basis of the bakuhan taisei (shogunate-domains system) which
    lay at the foundation of the Tokugawa regime. The contents of the edicts were seen as a code of conduct,
    a description of proper honorable daimyō behavior, and not solely laws which had to be obeyed. By
    appealing to notions of morality and honor, therefore, the shogunate was able to see its strictures
    followed despite its inability to enforce them directly.
