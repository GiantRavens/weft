# Weft's editorial translation, close to the Italian, one span per speech; draft. The Victorian singing versions (Natalia Macfarren's Traviata for Novello; Francis Hueffer's Otello for Ricordi, 1887) are cited in the manifest, not printed.
translation: weft-editorial
aligned_by: 'hand: one span per speech'
spans:
- lines:
  - vl.jago1.1
  - vl.jago1.5
  text: Go; I already see your goal. Your demon drives you, and your demon is I. And mine drags me, the one in whom I believe, inexorable God.
- lines:
  - vl.credo.1
  - vl.credo.23
  text: 'I believe in a cruel God who created me like himself, and whom in wrath I name. From the baseness of a germ or an atom I was born base. I am wicked because I am a man, and I feel the primal mud
    in me. Yes! this is my faith! I believe with a firm heart, as the little widow at the temple believes, that the evil I think and that proceeds from me I fulfil for my destiny. I believe that the just
    man is a mocking play-actor, in face and in heart, that all in him is false: tear, kiss, glance, sacrifice and honour. And I believe man the plaything of a wicked fate, from the germ of the cradle to
    the worm of the grave. After so much mockery comes Death. And then? And then? Death is Nothingness. Heaven is an old fable.'
