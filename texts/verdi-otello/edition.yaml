# Weft edition of Iago's Credo from Otello (Act II, scene 2; libretto by Arrigo Boito, Milan 1887), with the five lines
# before it. Text of Italian Wikisource, the transcribed libretto (Otello (Boito)/Atto secondo/Scena seconda); each line
# is checked verbatim against the pinned revision. verify_strip sets aside the speaker templates, the italic stage
# directions and the line-leading colons; the transcription's guisto for giusto is declared as a correction.
# The librettist's spelling is kept (the elisions fe', dimon, istrion, avel, Ciel); the work's own lexicon.yaml gives
# each word its stress and vowel quality.
#   t     the word as printed, punctuation attached (the ellipses of Godiam... are the libretto's)
#   Lines are the verses; sections are the speeches, named for the singer.
work: verdi-otello
joiner: ' '
verify_strip: (?sm)<noinclude>.*?</noinclude>|\{\{T\|(?:[^{}]|\{\{[^{}]*\}\})*\}\}|''\([^)]*\)''|''[^']*''|\{\{[^{}]*\}\}|<[^>]+>|^[:;]+
verify_corrections:
- ocr: guisto
  print: giusto
  in: sources/otello-2-2.txt
