# Notes for Dante, Inferno 1. Editorial notes are drafts until a reviewer lifts them.
- id: n.inf.1.date
  attach: inf.1.1
  kind: editorial
  status: draft
  leans_on: "Psalm 89 (90):10 in the Vulgate; Dante, Convivio IV.xxiii; Inferno 21.112-114"
  text: "The canto opens in the middle of 'nostra vita', our life, without naming a year. Readers have dated the journey from two passages outside this line. The Psalm gives a human life seventy years, and in the Convivio Dante places the high point of that arc at the thirty-fifth year; Dante was born in 1265, so the middle of his life falls in 1300. In Inferno 21 a devil counts 1266 years since the earthquake at Christ's death, which places the descent in Holy Week of 1300. This canto adds a season but not a date: the sun rises with the stars that were with it at the Creation (lines 38-40), which medieval readers took to be spring, and line 43 calls it 'la dolce stagione'. The poem was written later, from about 1306-1308, so events after 1300 enter it as prophecy. The dark wood itself is not explained in this canto; Dante says only that he had lost the straight way and cannot say how he entered (lines 10-12)."
- id: n.inf.1.beasts
  attach: inf.1.32.2
  kind: editorial
  status: draft
  leans_on: "Jeremiah 5:6 in the Vulgate (leo, lupus, pardus); the early commentaries collected in the Dartmouth Dante Project"
  text: "Three animals block the climb: a lonza (line 32), a lion (45) and a she-wolf (49). Jeremiah 5:6 names a lion, a wolf and a leopard (pardus) that will tear those who leave the way, and commentators since the fourteenth century have taken it as Dante's model. The text gives each animal physical traits and an effect on Dante, not a meaning. The traditional moral reading, found in many early commentaries, takes the lonza as lust or incontinence, the lion as pride or violence, and the she-wolf as avarice or cupidity; Virgil's description of the wolf, never filled and hungrier after feeding (lines 97-99), is the strongest support for the last. Political readings (Florence, the French crown, the papal curia) are also old. Both are readings. What a lonza was is itself uncertain: a leopard, a lynx or a panther have all been proposed, so the gloss leaves the word untranslated. Longfellow writes 'panther', Cary 'panther'."
- id: n.inf.1.virgil
  attach: inf.1.67.1
  kind: editorial
  status: draft
  leans_on: "Aelius Donatus, Vita Vergilii; Virgil, Aeneid 7-12 (Camilla, Turnus, Nisus and Euryalus)"
  text: "The figure who answers is identified through his own account before Dante names him (line 79). Each detail matches what ancient lives of Virgil report: parents from Lombardy and Mantua (lines 68-69), birth 'sub Iulio', under Julius Caesar but late in his time (Virgil was born in 70 BC; Caesar became dictator only in 49 BC), life in Rome under Augustus, and a poem on the son of Anchises who came from Troy, the Aeneid. Dante's reply calls him 'maestro' and 'autore' and credits him with the 'bello stilo' that has brought Dante honour (lines 85-87). Lines 106-108 name four figures from the Aeneid's war in Italy who died for it. Virgil also says another soul, worthier than he, will guide Dante further (lines 121-123); this canto does not name her."
- id: n.inf.1.veltro
  attach: inf.1.101.8
  kind: editorial
  status: draft
  leans_on: "the early commentaries collected in the Dartmouth Dante Project"
  text: "Virgil prophesies a veltro, a hunting greyhound, who will drive the she-wolf back to Hell (lines 101-111). The text says what he will not feed on (land and pewter, that is, territory and money), what he will feed on (wisdom, love and virtue), and that his 'nazion' will be 'tra feltro e feltro'. It does not say who he is, and this is where the evidence is weakest. Proposals include Can Grande della Scala of Verona, a future emperor, a reforming pope, and Christ at the end of time. 'Feltro' is printed in lower case in Petrocchi's text. It has been read as two places, Feltre and Montefeltro, which would bound a region of north-eastern Italy, or as felt, a cheap cloth, which would make his birth humble. The gloss gives the literal 'felt'; the choice between the readings changes the meaning of 'nazion' as well."
- id: n.inf.1.terza-rima
  attach: inf.1.2
  kind: editorial
  status: draft
  text: "The canto is in terza rima: tercets of endecasillabi rhyming ABA BCB CDC, each tercet's middle line supplying the outer rhyme of the next. Here: vita, smarrita (A) enclose oscura (B), which is taken up by dura and paura. The chain runs through 45 tercets, and a single closing line, dietro (136), rhymes with the middle line of the last tercet (Pietro, 134), so no rhyme is left open. Dante is generally credited with devising the form for the Commedia. Weft numbers the rhymes from A and reports them on each line, and checks that every rhyme pair agrees by spelling from the stressed vowel. One set does not: desse, venisse, tremesse (lines 44, 46, 48) pair -esse with -isse. One explanation offered for rhymes of closed e with i is the convention called rima siciliana: Sicilian poems of the thirteenth century, copied by Tuscan scribes, paired spellings in e and i that rhymed in Sicilian, and Tuscan poets kept the licence. Whether that is the explanation here is a question for the commentaries. The check records the set as terza-rima-mismatch and leaves the text as printed."
- id: n.inf.1.metre
  attach: inf.1.11
  kind: editorial
  status: draft
  text: "Each line is an endecasillabo, counted to the accent on the 10th syllable. Weft joins a vowel at the end of a word with the vowel beginning the next (synalepha) unless the edition marks the word with dialefe, which keeps them apart. Dante uses dialefe more often than later poets, mostly after a stressed vowel (fu | offerto, line 62; città | e, line 128) or a pause. This line is one readers have questioned: 'tant'era pien di sonno a quel punto' has eleven syllables only if sonno and a are kept apart (the discussion page of the Wikisource transcription records one such exchange). Weft follows Petrocchi's text and marks a with dialefe. Words such as parea, avea and l'aere count one syllable fewer than when read alone, and at the line end lui, fui and ambedui count two; these are marked by hand in the edition. Other readers divide some lines differently, and the accent counts follow the lexicon."
- id: n.inf.1.language
  attach: inf.1.4
  kind: editorial
  status: draft
  leans_on: "Dante, De vulgari eloquentia I (about 1303-1305); Pietro Bembo, Prose della volgar lingua (1525)"
  text: "The Commedia is written in Florentine, not Latin, the language of most learned writing in 1300. Shortly before, in the Latin treatise De vulgari eloquentia, Dante had argued that an Italian vernacular could carry serious poetry, though he did not name Florentine as that language. This canto shows the Florentine of his time beside forms that later Italian changed: ogne for ogni, omo, loco and foco without the diphthong of uomo, luogo, fuoco, but rispuose with it; sanza for senza; vegna for venga; and the old imperfects parea, avea, partia. It also mixes registers, from the Latin of 'Miserere' and 'sub Iulio' to plain words such as 'piaggia' and 'lena'. Written Italian later took Tuscan as its base. Bembo's Prose della volgar lingua (1525), which set the model for literary Italian, named Petrarch for verse and Boccaccio for prose, and kept Dante at a distance for his mixing of high and low words. Dante's poem was nonetheless copied, read aloud and commented on in Tuscan from the 1320s, and later writers drew on its vocabulary."
