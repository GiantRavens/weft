#            the references were aligned by letters and checked by hand
#   ud_part  the treebank keeps ϫⲓⲃⲁⲡⲧⲓⲥⲙⲁ ("receive baptism") as one word; this source writes
#            ⲁⲩϫⲓ ⲃⲁⲡⲧⲓⲥⲙⲁ. Each token names the part of that word it carries
#   n        the full form of an abbreviated sacred name, from which the sound row is made
