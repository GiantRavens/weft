# compressed SWORD file; see verify_sword).
#
#   t        the word as the module prints it, verbatim. Where one printed word holds two bound
#            groups of the treebank, it is split into two tokens and the first carries glue (no
#            space), so the line still reproduces the module
#   ud       the words of UD_Coptic-Scriptorium (CC BY 4.0) this token covers, as
#            "<sentence>:<first>-<last>" in its Mark 1 document (sent_id sahidica_mark-Mark_01_sNNNN).
