# G. W. Horner, The Coptic Version of the New Testament in the Southern Dialect, vol. 1 (Oxford, 1911),
# Mark 1:1-19, pages 355-361: his literal English translation of his own Sahidic text, verbatim
# from the archive.org OCR (bwb_KU-359-474_djvu.txt), checked against the page images. Horner's
# italics (for Greek loanwords in the Coptic) are not kept. Horner's base text breaks off after "his
# brother" in 1:19 and resumes in 1:21; 1:20 is not covered (partial in the manifest).
# OCR corrections, each checked against the page image:
#   Esaias -> Ēsaias (1:2); Idhannés, lohannes, Iohannes (x5 in all) -> Iōhannēs (1:4, 1:6, 1:9, 1:14, 1:19);
#   Iordanés, Iordanes -> Iordanēs (1:5, 1:9); éndeed -> indeed (1:8); wp -> up (1:14);
#   Simon -> Simōn (x2, 1:16); Iakobos -> Iakōbos (1:19); verse numbers misread as ? ‘ ° ™ 1° and
#   the "I." of chapter 1 removed; "7And" -> "And"; line-end hyphens joined (con-fessing, bap-tizing,
#   preach-ing, Gali-laia, there-fore).
translation: horner1911
aligned_by: 'hand, phase 0: one span per verse, by Horner''s verse numbers'
spans:
- lines:
  - mk.1.1
  - mk.1.1
  text: The beginning of the gospel of Jesus the Christ, the Son of God.
- lines:
  - mk.1.2
  - mk.1.2
  text: According as it is written in Ēsaias the prophet, Behold, I shall send my angel in front of thee, this (one) who will prepare thy road before thee.
- lines:
  - mk.1.3
  - mk.1.3
  text: The voice of him who crieth out in the desert, Prepare the road of the Lord, and make straight his paths.
- lines:
  - mk.1.4
  - mk.1.4
  text: But became Iōhannēs, baptizing in the desert, preaching a baptism of repentance for the forgiveness of sin.
- lines:
  - mk.1.5
  - mk.1.5
  text: And was coming out to him all the country about [the] Iudaia and the Hierosolyma, and were being baptized by him in the Iordanēs the river, confessing their sins.
- lines:
  - mk.1.6
  - mk.1.6
  text: But Iōhannēs was being clothed with hair of camel, a girdle of leather being bound to his loins, he is eating locusts and wild honey.
- lines:
  - mk.1.7
  - mk.1.7
  text: And he was preaching, saying, Cometh after me he who is stronger than I, this (one) of whom I am not sufficient for to stoop down to unloose the latchet of his shoe.
- lines:
  - mk.1.8
  - mk.1.8
  text: I indeed, I am baptizing you in [a] water; but he, he is about to baptize you in [a] holy spirit.
- lines:
  - mk.1.9
  - mk.1.9
  text: But it happened in those days, came Jesus out of Nazaret of [the] Galilaia, and was baptized in the Iordanēs by Iōhannēs.
- lines:
  - mk.1.10
  - mk.1.10
  text: But immediately that he came up from the water, he saw the heavens opened, and the spirit coming down upon him as a dove.
- lines:
  - mk.1.11
  - mk.1.11
  text: And behold a voice became (heard) out of the heavens, Thou art my Son, my beloved in whom my wish became (fulfilled).
- lines:
  - mk.1.12
  - mk.1.12
  text: And immediately the spirit took him out into the desert.
- lines:
  - mk.1.13
  - mk.1.13
  text: And he was being in the desert forty days, being tempted by [the] Satanas, and he was being with the wild beasts, the angels ministering to him.
- lines:
  - mk.1.14
  - mk.1.14
  text: But after the being delivered up of Iōhannēs came Jesus into [the] Galilaia, preaching the gospel of God,
- lines:
  - mk.1.15
  - mk.1.15
  text: 'saying, The time was fulfilled, and approached the kingdom of God: repent therefore, and believe the gospel.'
- lines:
  - mk.1.16
  - mk.1.16
  text: But as he passeth by at the sea of [the] Galilaia, he saw Simōn and Andreas the brother of Simōn casting net into the sea; for they were fishers.
- lines:
  - mk.1.17
  - mk.1.17
  text: But said he to them Jesus, Come ye follow me, and I make you fishers, catchers of men.
- lines:
  - mk.1.18
  - mk.1.18
  text: And immediately they left their nets, they followed him.
- lines:
  - mk.1.19
  - mk.1.19
  text: 'But when he had walked forward a little, he saw Iakōbos the son of Zebedaios and Iōhannēs his brother:'
