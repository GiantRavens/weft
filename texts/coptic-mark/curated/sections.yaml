# Human overlay for Mark 1:1-20 (Sahidic). Lemma and morphology come from UD_Coptic-Scriptorium
# (weft.coptic reads them through the token hook); this file adds the English gloss only. Each gloss
# covers the whole bound group, morpheme by morpheme in Coptic order where English allows
# (ⲁϥϫⲓⲧϥ it-took-him). Conventions: the conjugation bases are glossed by their English
# equivalents (perfect ⲁϥ- he-...ed; circumstantial ⲉϥ- he-...ing or while-...; preterit ⲛⲉϥ- he-was-;
# conjunctive ⲛϥ-/ⲛⲧⲉⲧⲛ- and-he-will-/and-you-; future ⲛⲁ- will-); the particle ⲛϭⲓ, which introduces a
# subject placed after its verb, is glossed "namely"; ϫⲉ introducing speech "that:". Glosses checked
# against the treebank lemma and Crum, A Coptic Dictionary (1939).
- by: Claude (Weft phase 0), for review by Skip and a Coptologist
  date: 2026-10-01
  why: English word glosses; the treebank carries none
  status: draft
  set:
