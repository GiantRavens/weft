    year: 1911
    form: "literal English translation of the Sahidic, printed facing his Coptic text in The Coptic Version of the New Testament in the Southern Dialect, vol. 1 (Oxford: Clarendon Press, 1911), pages 355-361; Horner translates his own text, edited from different manuscripts, so it differs from this edition in places (1:2-3, 1:16)"
    license: public-domain
    license_url: https://archive.org/details/bwb_KU-359-474
    file: sources/horner1911-vol1.txt
