  license_url: https://creativecommons.org/licenses/by/4.0/
treebank_note: "The treebank's Coptic text of Mark is Sahidica (J. Warren Wells, 2000-2006), which Coptic Scriptorium's corpus metadata marks 'for academic use only'. Weft therefore does not reproduce that text: the edition is Sahidic Bible 2 (CC BY-SA), and only the treebank's annotation (lemmas, tags, features) is attached to it, by word reference. The two texts are close in Mark 1:1-20; where they differ in spelling or word division the draft run reports it (edition-differs-from-treebank). The CrossWire module CopSahHorner, labelled as Horner's 1911 text and public domain, was considered and rejected: its Mark 1 does not match Horner's printed text (Horner reads ⲕⲁⲧⲁ ⲑⲉ ⲉⲧⲥⲏϩ and ⲧⲉⲥⲙⲏ in 1:2-3; the module reads ⲕⲁⲧⲁⲡⲉⲧⲥⲏϩ and ⲡⲉϩⲣⲟⲟⲩ, as Sahidica does), so its source and license could not be confirmed."
schemes: [sahidic, bohairic]     # default = Sahidic of the 4th-5th century (approximate); then the modern church pronunciation
scheme_labels:
  sahidic: "Sahidic, 4th–5th century (approximate reconstruction)"
  bohairic: "Modern Coptic church pronunciation (Greco-Bohairic), applied to Sahidic spelling"
sound_confidence: medium
quantities: [pipeline/weft/data/cop_stress.yaml]   # stress of Greek loanwords, unstressed particles, names
