# Notes on Os Lusíadas I.1-3.
- id: n.lus.1.1.proposition
  attach: lus.1.1
  kind: editorial
  status: draft
  leans_on: Virgil, Aeneid 1.1 (arma virumque cano); Camões, Os Lusíadas (1572), the Ee and E issues
  text: 'The proposition of the epic, in Virgil''s order: arms first, then the men. Where Virgil has one man, Camões has ''barões assinalados'', the marked-out barons of Portugal, and the subject of the
    first three stanzas is a nation''s voyage rather than a hero''s. The stanza is ottava rima, eight decasyllables rhyming ABABABCC, the form Camões took from Ariosto.'
- id: n.lus.1.4.taprobana
  attach: lus.1.4.5
  kind: editorial
  status: draft
  leans_on: Ptolemy, Geography 7.4; the 16th-century identification with Sumatra in Barros, Décadas da Ásia
  text: Taprobana is the classical name of Ceylon (Sri Lanka); by Camões's time Portuguese writers often meant Sumatra by it. Either way it marks the far edge of the known world, which the voyage passes.
- id: n.lus.1.1.sound
  attach: lus.1.1.3
  kind: editorial
  status: draft
  leans_on: Fernão de Oliveira, Grammatica da lingoagem portuguesa (1536), chapters on the letters; Teyssier, História da língua portuguesa (1980)
  text: The first reading is Lisbon of the 1540s, when Camões was young and the first Portuguese grammars were written. Its audible differences from today's Lisbon are the unreduced unstressed vowels (e
    and o keep their full values), the diphthongs ei and ou, a trilled r, ch as in church, and four sibilants where modern Portuguese has two. The lexicon entry under each word gives the normalized spelling
    the sound is built from.
- id: n.lus.3.1.cessem
  attach: lus.3.1.1
  kind: editorial
  status: draft
  leans_on: 'the convention of the epic proem: Homer, Virgil, Ariosto'
  text: '''Let them cease'': the poet dismisses the Odyssey, the Aeneid and the conquests of Alexander and Trajan. The stanza names its rivals in order to outdo them, a move Camões takes from the ancients
    and turns on them.'
- id: n.lus.2.3.fe
  attach: lus.2.3.2
  kind: editorial
  status: draft
  leans_on: the printing of 1572; the censor's licence (Frei Bartolomeu Ferreira) printed with the poem
  text: 'Faith and Empire are capitalized in the print and joined as one cause: the kings ''went spreading the Faith and the Empire''. The censor''s licence that precedes the poem in the 1572 edition approves
    it on those terms.'
