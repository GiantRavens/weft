# Burton's Lusiads (1880), Canto I stanzas 1-3, verbatim from the Project Gutenberg text (77660), one span per stanza.
translation: burton1880
aligned_by: 'hand: one span per stanza'
spans:
- lines:
  - lus.1.1
  - lus.1.8
  text: 'The feats of Arms, and famed heroick Host, from occidental Lusitanian strand, who o''er the waters ne''er by seaman crost, farèd beyond the Taprobáne-land, forceful in perils and in battle-post,
    with more than promised force of mortal hard; and in the regions of a distant race rear''d a new throne so haught in Pride of Place:'
- lines:
  - lus.2.1
  - lus.2.8
  text: And, eke, the Kings of mem'ory grand and glorious, who hied them Holy Faith and Reign to spread, converting, conquering, and in lands notorious, Africk and Asia, devastation made; nor less the Lieges
    who by deeds memorious brake from the doom that binds the vulgar dead; my song would sound o'er Earth's extremest part were mine the genius, mine the Poet's art.
- lines:
  - lus.3.1
  - lus.3.8
  text: 'Cease the sage Grecian, and the Man of Troy to vaunt long Voyage made in bygone day: Cease Alexander, Trajan cease to ''joy the fame of vict''ories that have pass''d away: The noble Lusian''s stouter
    breast sing I, whom Mars and Neptune dared not disobey: Cease all that antique Muse hath sung, for now a better Brav''ry rears its bolder brow.'
