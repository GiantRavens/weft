# Notes on La Marseillaise (1792).
- id: n.mar.1.1.song
  attach: mar.1.1.1
  kind: editorial
  status: draft
  leans_on: Julien Tiersot, Histoire de la Marseillaise (1915); Louis Fiaux, La Marseillaise (1918); Hervé Luxardo, Histoire de la Marseillaise (1989)
  text: Rouget de Lisle, a captain of engineers, wrote words and tune at Strasbourg on the night of 25-26 April 1792, days after France declared war on Austria, at the table of the mayor, Philippe-Frédéric
    de Dietrich; the title was Chant de guerre pour l'Armée du Rhin, dedicated to Marshal Luckner. The volunteers of Marseille sang it on their march to Paris that summer, and Paris named it after them
    when they arrived on 30 July. The Convention decreed it the national song on 14 July 1795; the Empire and the Restoration set it aside, and the Third Republic made it the anthem in 1879. Dietrich was
    guillotined in December 1793.
- id: n.mar.1.1.enfans
  attach: mar.1.1.2
  kind: editorial
  status: draft
  leans_on: Dictionnaire de l'Académie française, 6th edition (1835), which brought in the -ants, -ents plurals
  text: 'enfans: the plural of words in -ant and -ent was written without the t (enfans, parens, momens) until the Academy''s dictionary of 1835 restored it. Fiaux keeps the old form, a mark of the 1792
    printings; the modern spelling is in the lexicon as n.'
- id: n.mar.r.2.sang-impur
  attach: mar.r.2.4
  kind: editorial
  status: draft
  leans_on: Luxardo 1989; the debate on the line in the French press, 1992 and after
  text: 'qu''un sang impur abreuve nos sillons: in the rhetoric of 1792 the impure blood is the enemy''s, the invading armies and the émigrés who, in the language of the nobility, had claimed pure blood
    for themselves; the line turns the claim back. A later reading takes it as the blood the citizens offer for the land. The first reading is the contemporary one; the line has been argued over since the
    1990s.'
- id: n.mar.5.6.bouille
  attach: mar.5.6.5
  kind: editorial
  status: draft
  leans_on: Fiaux 1918; the standard histories of the flight to Varennes (June 1791)
  text: 'Bouillé: François-Claude-Amour, marquis de Bouillé, the general who had planned to receive Louis XVI at Montmédy after the king''s flight in June 1791, and who emigrated when it failed and wrote
    to the Assembly threatening Paris with the foreign armies. In April 1792 his name stood for the émigré generals; the line dates the song to the months before the fall of the monarchy.'
- id: n.mar.r5.2.variant
  attach: mar.r5.2.3
  kind: editorial
  status: draft
  leans_on: Fiaux 1918, pp. 26-27, which prints this refrain in full; Tiersot 1915 on the early printings
  text: 'que tout leur sang abreuve nos sillons: Fiaux prints the refrain in full after the fifth couplet with this variant, where the tyrants'' blood, not an impure blood, waters the furrows; the later
    text repeats the first refrain throughout. The edition keeps what the source prints.'
- id: n.mar.6.1.seventh
  attach: mar.6.1.1
  kind: editorial
  status: draft
  leans_on: Tiersot 1915 on the couplet des enfants, first printed in October 1792
  text: The anthem as sung today has a seventh couplet, Nous entrerons dans la carrière, the couplet des enfants, added in October 1792 and not by Rouget de Lisle; its authorship is disputed (Dubois, Chénier
    and others have been proposed). It is not in the 1792 song and not in Fiaux's text here, so it is not in this edition.
