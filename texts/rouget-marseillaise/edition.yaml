# Weft edition of La Marseillaise: Rouget de Lisle's Chant de guerre pour l'Armée du Rhin (Strasbourg, April 1792),
# the six couplets and the refrain, in the text printed by Louis Fiaux, La Marseillaise, son histoire dans l'histoire
# des Français depuis 1792 (Paris, 1918), pp. 26-27, as transcribed on French Wikisource (Page:Fiaux - La Marseillaise.djvu/26-27);
# each line is checked verbatim against the pinned page revisions. Fiaux keeps the 1792 plural enfans and the early
# readings (Égorger vos fils, vos compagnes; Tremble, tyrans), and prints the refrain in full after the first and the
# fifth couplet, with 'etc.' after the others; the edition gives the refrain once after each of those two, and leaves
# out the 'etc.' lines and the '(bis)' marks. verify_strip sets aside the page's templates and tags.
#   t     the word as printed, punctuation attached; an elision (L’, qu’, C’) is its own token, glued to the next
#   n     the modern spelling where the print differs (enfans, enchainées)
#   p     punctuation the print sets off by a space, as French does before ! ? ; :
#   z     liaison made in modern singing (est‿arrivé, sang‿impur, Aux‿armes); zf: made in the formal reading of 1792 only
#   Lines are the verses; sections are the couplets and the two printed refrains.
work: rouget-marseillaise
joiner: ' '
verify_in:
- sources/fiaux26.txt
- sources/fiaux27.txt
verify_strip: '\{\{FlotteADroite\|\(\{\{sc\|bis\}\}\)\|marge=25%\}\}|\s*\(\{\{sc\|bis\}\}\)|\s*\{\{sc\|\(bis\)\}\}|<ref>[^<]*</ref>|<[^>]+>|\{\{[^{}]*\}\}|''''|::'
verify_corrections:
- ocr: forme ; vos
  print: formez vos
  in: sources/fiaux27.txt
