# Weft's editorial translation, close to the French, one span per couplet; draft.
translation: weft-editorial
aligned_by: 'hand: one span per couplet'
spans:
- lines:
  - mar.1.1
  - mar.1.8
  text: Arise, children of the fatherland! The day of glory has come. Against us tyranny's bloody standard is raised. Do you hear, in the countryside, the bellowing of those fierce soldiers? They come right
    into our arms to slaughter your sons, your wives.
- lines:
  - mar.r.1
  - mar.r.2
  text: To arms, citizens! Form your battalions. Let us march, let us march, that an impure blood may water our furrows!
- lines:
  - mar.2.1
  - mar.2.8
  text: What does this horde of slaves want, of traitors, of conspiring kings? For whom these ignoble fetters, these irons long prepared? Frenchmen! for us, ah! what an outrage! What fury it must arouse!
    It is us they dare to plan to return to the old slavery.
- lines:
  - mar.3.1
  - mar.3.8
  text: What! foreign cohorts would make the law in our homes! What! these mercenary phalanxes would strike down our proud warriors! Great God! by chained hands our brows would bend beneath the yoke; vile
    despots would become the masters of our destinies!
- lines:
  - mar.4.1
  - mar.4.8
  text: 'Tremble, tyrants! and you, traitors, the disgrace of every party: tremble! your parricidal schemes are at last to receive their reward. Everyone is a soldier to fight you; if our young heroes fall,
    the earth brings forth new ones, all ready to fight against you.'
- lines:
  - mar.5.1
  - mar.5.8
  text: Frenchmen! as magnanimous warriors, deal or hold back your blows. Spare those sorry victims who arm against us with regret. But the bloodthirsty despot! But the accomplices of Bouillé! All those
    tigers who without pity tear their mother's breast!
- lines:
  - mar.r5.1
  - mar.r5.2
  text: To arms, citizens! Form your battalions. Let us march, let us march, that all their blood may water our furrows!
- lines:
  - mar.6.1
  - mar.6.8
  text: Sacred love of the fatherland, lead and sustain our avenging arms. Liberty, cherished liberty, fight beside your defenders. Beneath our flags may Victory hasten to your manly tones; may your dying
    enemies see your triumph and our glory.
