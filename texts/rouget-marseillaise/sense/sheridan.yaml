# The English singing version 'Ye sons of France, awake to glory', as printed in The Canadian Soldiers' Song Book (en.wikisource Page:The Canadian soldiers' song book.djvu/12), where it is credited to Sheridan. A free version, not a translation: it covers the first two couplets and the refrain, and the song book prints no more. The line the book repeats for singing is given once.
translation: sheridan
aligned_by: 'hand: one span per couplet, the free version set against the couplet it answers'
spans:
- lines:
  - mar.1.1
  - mar.1.8
  text: 'Ye sons of France, awake to glory! Hark! hark! what myriads bid you rise! Your children, wives and grandsires hoary: behold their tears and hear their cries! Shall hateful tyrants, mischief breeding,
    with wailing hosts a ruffian band affright and desolate the land while peace and liberty lie bleeding?'
- lines:
  - mar.r.1
  - mar.r.2
  text: To arms, to arms, ye brave! Th' avenging sword unsheathe! March on, march on, all hearts resolved on victory or death.
- lines:
  - mar.2.1
  - mar.2.8
  text: With luxury and pride surrounded, the vile insatiate despots dare, their thirst of gold and power unbounded, to mete and vend the light and air. Like beasts of burden would they load us, like gods
    would bid their slaves adore; but man is man, and who is more? Then shall they longer lash and goad us?
