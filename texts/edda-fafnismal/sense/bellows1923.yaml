# Henry Adams Bellows, The Poetic Edda (1923), Fafnismol, verbatim from Project Gutenberg #73533.
# One span per edition stanza or prose passage, matched by content. Bellows follows the Völsunga saga
# paraphrase and moves edition stanzas 26 and 27 after 31: his 26-29 are edition 28-31, his 30 is edition 26
# and his 31 edition 27; the prose in which Regin cuts out the heart stands, in his text as here, before
# edition 27. His speaker lines ('Fafnir spake:') are left out, as the stanza headings carry the speaker; his
# stanzas 3 and 18 include two lines he reconstructed from the saga, in parentheses, which are not in this
# edition. Leading indentation is removed; no other change.
translation: bellows1923
aligned_by: hand, phase 0; by content, one span per edition stanza or prose passage
spans:
- lines:
  - faf.p0.1
  - faf.p0.7
  text: 'Sigurth and Regin went up to the Gnitaheith, and found there the track that Fafnir made when he crawled to water. Then Sigurth made a great trench across the path, and took his place therein. When Fafnir crawled from his gold, he blew out venom, and it ran down from above on Sigurth’s head. But when Fafnir crawled over the trench, then Sigurth thrust his sword into his body to the heart. Fafnir writhed and struck out with his head and tail. Sigurth leaped from the trench, and each looked at the other. Fafnir said:'
- lines:
  - faf.1.1
  - faf.1.6
  text: '“Youth, oh, youth!   |   of whom then, youth, art thou born?

    Say whose son thou art,

    Who in Fafnir’s blood   |   thy bright blade reddened,

    And struck thy sword to my heart.”'
- lines:
  - faf.p1.1
  - faf.p1.3
  text: 'Sigurth concealed his name because it was believed in olden times that the word of a dying man might have great power if he cursed his foe by his name. He said:'
- lines:
  - faf.2.1
  - faf.2.6
  text: '“The Noble Hart   |   my name, and I go

    A motherless man abroad;

    Father I had not,   |   as others have,

    And lonely ever I live.”'
- lines:
  - faf.3.1
  - faf.3.3
  text: '“If father thou hadst not,   |   as others have,

    By what wonder wast thou born?

    (Though thy name on the day   |   of my death thou hidest,

    Thou knowest now thou dost lie.)”'
- lines:
  - faf.4.1
  - faf.4.6
  text: '“My race, methinks,   |   is unknown to thee,

    And so am I myself;

    Sigurth my name,   |   and Sigmund’s son,

    Who smote thee thus with the sword.”'
- lines:
  - faf.5.1
  - faf.5.6
  text: '“Who drove thee on?   |   why wert thou driven

    My life to make me lose?

    A father brave   |   had the bright-eyed youth,

    For bold in boyhood thou art.”'
- lines:
  - faf.6.1
  - faf.6.6
  text: '“My heart did drive me,   |   my hand fulfilled,

    And my shining sword so sharp;

    Few are keen   |   when old age comes,

    Who timid in boyhood be.”'
- lines:
  - faf.7.1
  - faf.7.6
  text: '“If thou mightest grow   |   thy friends among,

    One might see thee fiercely fight;

    But bound thou art,   |   and in battle taken,

    And to fear are prisoners prone.”'
- lines:
  - faf.8.1
  - faf.8.6
  text: '“Thou blamest me, Fafnir,   |   that I see from afar

    The wealth that my father’s was;

    Not bound am I,   |   though in battle taken,

    Thou hast found that free I live.”'
- lines:
  - faf.9.1
  - faf.9.6
  text: '“In all I say   |   dost thou hatred see,

    Yet truth alone do I tell;

    The sounding gold,   |   the glow-red wealth,

    And the rings thy bane shall be.”'
- lines:
  - faf.10.1
  - faf.10.6
  text: '“Some one the hoard   |   shall ever hold,

    Till the destined day shall come;

    For a time there is   |   when every man

    Shall journey hence to hell.”'
- lines:
  - faf.11.1
  - faf.11.6
  text: '“The fate of the Norns   |   before the headland

    Thou findest, and doom of a fool;

    In the water shalt drown   |   if thou row ’gainst the wind,

    All danger is near to death.”'
- lines:
  - faf.12.1
  - faf.12.6
  text: '“Tell me then, Fafnir,   |   for wise thou art famed,

    And much thou knowest now:

    Who are the Norns   |   who are helpful in need,

    And the babe from the mother bring?”'
- lines:
  - faf.13.1
  - faf.13.6
  text: '“Of many births   |   the Norns must be,

    Nor one in race they were;

    Some to gods, others   |   to elves are kin,

    And Dvalin’s daughters some.”'
- lines:
  - faf.14.1
  - faf.14.6
  text: '“Tell me then, Fafnir,   |   for wise thou art famed,

    And much thou knowest now:

    How call they the isle   |   where all the gods

    And Surt shall sword-sweat mingle?”'
- lines:
  - faf.15.1
  - faf.15.6
  text: '“Oskopnir is it,   |   where all the gods

    Shall seek the play of swords;

    Bilrost breaks   |   when they cross the bridge,

    And the steeds shall swim in the flood.'
- lines:
  - faf.16.1
  - faf.16.6
  text: '“The fear-helm I wore   |   to afright mankind,

    While guarding my gold I lay;

    Mightier seemed I   |   than any man,

    For a fiercer never I found.”'
- lines:
  - faf.17.1
  - faf.17.6
  text: '“The fear-helm surely   |   no man shields

    When he faces a valiant foe;

    Oft one finds,   |   when the foe he meets,

    That he is not the bravest of all.”'
- lines:
  - faf.18.1
  - faf.18.3
  text: '“Venom I breathed   |   when bright I lay

    By the hoard my father had;

    (There was none so mighty   |   as dared to meet me,

    And weapons nor wiles I feared.)”'
- lines:
  - faf.19.1
  - faf.19.6
  text: '“Glittering worm,   |   thy hissing was great,

    And hard didst show thy heart;

    But hatred more   |   have the sons of men

    For him who owns the helm.”'
- lines:
  - faf.20.1
  - faf.20.6
  text: '“I counsel thee, Sigurth,   |   heed my speech,

    And ride thou homeward hence;

    The sounding gold,   |   the glow-red wealth,

    And the rings thy bane shall be.”'
- lines:
  - faf.21.1
  - faf.21.6
  text: '“Thy counsel is given,   |   but go I shall

    To the gold in the heather hidden;

    And, Fafnir, thou   |   with death dost fight,

    Lying where Hel shall have thee.”'
- lines:
  - faf.22.1
  - faf.22.6
  text: '“Regin betrayed me,   |   and thee will betray,

    Us both to death will he bring;

    His life, methinks,   |   must Fafnir lose,

    For the mightier man wast thou.”'
- lines:
  - faf.p22.1
  - faf.p22.3
  text: 'Regin had gone to a distance while Sigurth fought Fafnir, and came back while Sigurth was wiping the blood from his sword. Regin said:'
- lines:
  - faf.23.1
  - faf.23.6
  text: '“Hail to thee, Sigurth!   |   Thou victory hast,

    And Fafnir in fight hast slain;

    Of all the men   |   who tread the earth,

    Most fearless art thou, methinks.”'
- lines:
  - faf.24.1
  - faf.24.7
  text: '“Unknown it is,   |   when all are together,

    (The sons of the glorious gods,)

    Who bravest born shall seem;

    Some are valiant   |   who redden no sword

    In the blood of a foeman’s breast.”'
- lines:
  - faf.25.1
  - faf.25.6
  text: '“Glad art thou, Sigurth,   |   of battle gained,

    As Gram with grass thou cleansest;

    My brother fierce   |   in fight hast slain,

    And somewhat I did myself.”'
- lines:
  - faf.26.1
  - faf.26.6
  text: '“Thy rede it was   |   that I should ride

    Hither o’er mountains high;

    The glittering worm   |   would have wealth and life

    If thou hadst not mocked at my might.”'
- lines:
  - faf.p26.1
  - faf.p26.3
  text: 'Then Regin went up to Fafnir and cut out his heart with his sword, that was named Rithil, and then he drank blood from the wounds. Regin said:'
- lines:
  - faf.27.1
  - faf.27.6
  text: '“Sit now, Sigurth,   |   for sleep will I,

    Hold Fafnir’s heart to the fire;

    For all his heart   |   shall eaten be,

    Since deep of blood I have drunk.”'
- lines:
  - faf.28.1
  - faf.28.6
  text: '“Afar didst thou go   |   while Fafnir reddened

    With his blood my blade so keen;

    With the might of the dragon   |   my strength I matched,

    While thou in the heather didst hide.”'
- lines:
  - faf.29.1
  - faf.29.6
  text: '“Longer wouldst thou   |   in the heather have let

    Yon hoary giant hide,

    Had the weapon availed not   |   that once I forged,

    The keen-edged blade thou didst bear.”'
- lines:
  - faf.30.1
  - faf.30.6
  text: '“Better is heart   |   than a mighty blade

    For him who shall fiercely fight;

    The brave man well   |   shall fight and win,

    Though dull his blade may be.'
- lines:
  - faf.31.1
  - faf.31.6
  text: '“Brave men better   |   than cowards be,

    When the clash of battle comes;

    And better the glad   |   than the gloomy man

    Shall face what before him lies.'
- lines:
  - faf.p31.1
  - faf.p31.7
  text: 'Sigurth took Fafnir’s heart and cooked it on a spit. When he thought that it was fully cooked, and the blood foamed out of the heart, then he tried it with his finger to see whether it was fully cooked. He burned his finger, and put it in his mouth. But when Fafnir’s heart’s-blood came on his tongue, he understood the speech of birds. He heard nut-hatches chattering in the thickets. A nut-hatch said:'
- lines:
  - faf.32.1
  - faf.32.8
  text: '“There sits Sigurth,   |   sprinkled with blood,

    And Fafnir’s heart   |   with fire he cooks;

    Wise were the breaker   |   of rings, I ween,

    To eat the life-muscles   |   all so bright.”'
- lines:
  - faf.33.1
  - faf.33.8
  text: '“There Regin lies,   |   and plans he lays

    The youth to betray   |   who trusts him well;

    Lying words   |   with wiles will he speak,

    Till his brother the maker   |   of mischief avenges.”'
- lines:
  - faf.34.1
  - faf.34.6
  text: '“Less by a head   |   let the chatterer hoary

    Go from here to hell;

    Then all of the wealth   |   he alone can wield,

    The gold that Fafnir guarded.”'
- lines:
  - faf.35.1
  - faf.35.8
  text: '“Wise would he seem   |   if so he would heed

    The counsel good   |   we sisters give;

    Thought he would give,   |   and the ravens gladden,

    There is ever a wolf   |   where his ears I spy.”'
- lines:
  - faf.36.1
  - faf.36.8
  text: '“Less wise must be   |   the tree of battle

    Than to me would seem   |   the leader of men,

    If forth he lets   |   one brother fare,

    When he of the other   |   the slayer is.”'
- lines:
  - faf.37.1
  - faf.37.6
  text: '“Most foolish he seems   |   if he shall spare

    His foe, the bane of the folk;

    There Regin lies,   |   who hath wronged him so,

    Yet falsehood knows he not.”'
- lines:
  - faf.38.1
  - faf.38.6
  text: '“Let the head from the frost-cold   |   giant be hewed,

    And let him of rings be robbed;

    Then all the wealth   |   which Fafnir’s was

    Shall belong to thee alone.”'
- lines:
  - faf.39.1
  - faf.39.6
  text: '“Not so rich a fate   |   shall Regin have

    As the tale of my death to tell;

    For soon the brothers   |   both shall die,

    And hence to hell shall go.”'
- lines:
  - faf.p39.1
  - faf.p39.3
  text: 'Sigurth hewed off Regin’s head, and then he ate Fafnir’s heart, and drank the blood of both Regin and Fafnir. Then Sigurth heard what the nut-hatch said:'
- lines:
  - faf.40.1
  - faf.40.8
  text: '“Bind, Sigurth, the golden   |   rings together,

    Not kingly is it   |   aught to fear;

    I know a maid,   |   there is none so fair,

    Rich in gold,   |   if thou mightest get her.'
- lines:
  - faf.41.1
  - faf.41.8
  text: '“Green the paths   |   that to Gjuki lead,

    And his fate the way   |   to the wanderer shows;

    The doughty king   |   a daughter has,

    That thou as a bride   |   mayst, Sigurth, buy.”'
- lines:
  - faf.42.1
  - faf.42.8
  text: '“A hall stands high   |   on Hindarfjoll,

    All with flame   |   is it ringed without;

    Warriors wise   |   did make it once

    Out of the flaming   |   light of the flood.'
- lines:
  - faf.43.1
  - faf.43.8
  text: '“On the mountain sleeps   |   a battle-maid,

    And about her plays   |   the bane of the wood;

    Ygg with the thorn   |   hath smitten her thus,

    For she felled the fighter   |   he fain would save.'
- lines:
  - faf.44.1
  - faf.44.8
  text: '“There mayst thou behold   |   the maiden helmed,

    Who forth on Vingskornir   |   rode from the fight;

    The victory-bringer   |   her sleep shall break not,

    Thou heroes’ son,   |   so the Norns have set.”'
- lines:
  - faf.p44.1
  - faf.p44.5
  text: Sigurth rode along Fafnir’s trail to his lair, and found it open. The gate-posts were of iron, and the gates; of iron, too, were all the beams in the house, which was dug down into the earth. There Sigurth found a mighty store of gold, and he filled two chests full thereof; he took the fear-helm and a golden mail-coat and the sword Hrotti, and many other precious things, and loaded Grani with them, but the horse would not go forward until Sigurth mounted on his back.
