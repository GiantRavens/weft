# Benjamin Thorpe, Edda Sæmundar hinns Froða (1866), The Lay of Fafnir, verbatim from Project Gutenberg #14726.
# One span per edition stanza or prose passage, matched by content; Thorpe numbers the stanzas as the
# edition does, except that his stanza 32 is misprinted as 38. His speaker labels (_Sigurd_., _Second
# eagle_.) are left out, including the label _Fourth eagle_. that the Gutenberg text prints at the end of
# stanza 42, and footnote marks such as [63] are dropped. Line breaks from the Gutenberg wrapping are
# removed; no other change. Thorpe calls the birds eagles where the edition has igður (nuthatches).
translation: thorpe1866
aligned_by: hand, phase 0; by content, one span per edition stanza or prose passage
spans:
- lines:
  - faf.p0.1
  - faf.p0.7
  text: 'Sigurd and Regin went up to Gnitaheid, and there found Fafnir''s slot, or track, along which he crawled to the water. There on the way Sigurd made a large pit, and went down into it. When Fafnir crawled from the gold he blew forth venom, but it flew over Sigurd''s head. When Fafnir crept over the pit, Sigurd with his sword pierced him to the heart. Fafnir shook himself, and beat with his head and tail. Sigurd leapt from the pit, and each looked at the other. Fafnir said:'
- lines:
  - faf.1.1
  - faf.1.6
  text: Young fellow! young fellow! by what fellow art thou begot? of what people are thou the son? that thou in Fafnir reddenst thy glittering falchion? Thy sword has pierced my heart.
- lines:
  - faf.p1.1
  - faf.p1.3
  text: Sigurd concealed his name, because it was the belief in those times, that the words of dying persons were of great power, if they cursed an enemy by his name.
- lines:
  - faf.2.1
  - faf.2.6
  text: 'Gofugt-dyr I am called, but I have wandered a motherless child; nor have I a father like the sons of men: alone I wander.'
- lines:
  - faf.3.1
  - faf.3.3
  text: If thou hast no father like the sons of men, by what wonder art thou begotten?
- lines:
  - faf.4.1
  - faf.4.6
  text: My race, I tell thee, is to thee unknown, and myself also. Sigmund was my father named, my name is Sigurd, who with weapon have assailed thee.
- lines:
  - faf.5.1
  - faf.5.6
  text: Who has incited thee? why hast thou suffered thyself to be incited to take my life? youth of the sparkling eyes! Thou hadst a cruel father-- * * * *
- lines:
  - faf.6.1
  - faf.6.6
  text: My heart incited me, my hands gave me aid, and my keen sword. Rarely a man is bold, when of mature age, if in childhood he was faint-hearted.
- lines:
  - faf.7.1
  - faf.7.6
  text: I know if thou hadst chanced to grow in the lap of friends, they would have seen thee fierce in fight. Now thou art a captive, taken in war, and, 'tis said, slaves ever tremble.
- lines:
  - faf.8.1
  - faf.8.6
  text: 'Why Fafnir! dost thou upbraid me that I am far from my paternal home? I am not a captive, although in war I was taken: thou hast found that I am free.'
- lines:
  - faf.9.1
  - faf.9.6
  text: Thou wilt account only as angry words all I to thee shall say, but I will say the truth. The jingling gold, and the gleed-red treasure, those rings, shall be thy bane.
- lines:
  - faf.10.1
  - faf.10.6
  text: Treasure at command every one desires, ever till that one day; for at some time each mortal shall hence to Hel depart.
- lines:
  - faf.11.1
  - faf.11.6
  text: 'The Norns'' decree thou wilt hold in contempt as from a witless wight: In water thou shalt be drowned, if in wind thou rowest. All things bring peril to the fated.'
- lines:
  - faf.12.1
  - faf.12.6
  text: 'Tell me, Fafnir! as thou art wise declared, and many things to know: who those Norns are, who help in need, and from babes loose the mothers.'
- lines:
  - faf.13.1
  - faf.13.6
  text: 'Very diversely born I take those Norns to be: they have no common race. Some are of Æsir-race, some of Alfar-race, some are Dvalin''s daughters.'
- lines:
  - faf.14.1
  - faf.14.6
  text: Tell me, Fafnir! as thou art wise declared, and many things to know, how that holm is called, where Surt and the Æsir will sword-liquor together mingle?
- lines:
  - faf.15.1
  - faf.15.6
  text: Oskopnir it is called; there shall the gods with lances play; Bifrost shall be broken, when they go forth, and their steeds in the river swim.
- lines:
  - faf.16.1
  - faf.16.6
  text: An Oegis-helm I bore among the sons of men, while I o'er the treasures lay; stronger than all I thought myself to be; stronger I found not many!
- lines:
  - faf.17.1
  - faf.17.6
  text: 'An Oegis-helm is no protection, where men impelled by anger fight: soon he finds, who among many comes, that no one is alone the boldest.'
- lines:
  - faf.18.1
  - faf.18.3
  text: Venom I blew forth, when on my father's great heritage I lay.
- lines:
  - faf.19.1
  - faf.19.6
  text: Thou, glistening serpent! didst a great belching make, and wast so hard of heart. Fierceness so much the greater have the sons of men, when they possess that helm.
- lines:
  - faf.20.1
  - faf.20.6
  text: Sigurd! I now counsel thee, do thou take my counsel; and hence ride home. The jingling gold, and the gleed-red treasure, those rings, shall be thy bane.
- lines:
  - faf.21.1
  - faf.21.6
  text: Counsel regarding thee is taken, and I to the gold will ride, on the heath that lies. But lie thou, Fafnir! in the pangs of death, until Hel have thee!
- lines:
  - faf.22.1
  - faf.22.6
  text: 'Regin betrayed me, he will thee betray, he of us both will be the bane. Fafnir must, I trow, let forth his life: thine was the greater might!'
- lines:
  - faf.p22.1
  - faf.p22.3
  text: 'Regin had gone away while Sigurd slew Fafnir, but came back as Sigurd was wiping the blood from his sword. He said:'
- lines:
  - faf.23.1
  - faf.23.6
  text: 'Hail to thee now, Sigurd! Now hast thou victory won and Fafnir slain: of all the men who tread the earth, thou art, I say, the bravest born.'
- lines:
  - faf.24.1
  - faf.24.7
  text: Uncertain 'tis to know, when we all come together, sons of victorious heroes, which is the bravest born. Many a one is bold, who sword has never broken in another's breast.
- lines:
  - faf.25.1
  - faf.25.6
  text: Glad are thou now, Sigurd! and in thy gain rejoicing, while Gram, in the grass thou driest. My brother thou to death hast wounded, yet in some degree was I the cause.
- lines:
  - faf.26.1
  - faf.26.6
  text: Thou didst me counsel, that I should ride o'er high fells hither. Treasure and life had still possess'd that glistening serpent, hadst thou my anger not excited.
- lines:
  - faf.p26.1
  - faf.p26.3
  text: 'Regin then approached Fafnir and cut out his heart with a sword named Ridill, and afterwards drank blood from his wound. He said:'
- lines:
  - faf.27.1
  - faf.27.6
  text: Sit now, Sigurd!--but I must go to sleep--and Fafnir's heart hold to the fire. Of this refection I would fain partake, after that drink of blood.
- lines:
  - faf.28.1
  - faf.28.6
  text: Thou wentst far off, while I in Fafnir my keen sword reddened. With my strength I strove against the serpent's might, while in the ling thou layest.
- lines:
  - faf.29.1
  - faf.29.6
  text: Long hadst thou allowed in the ling to lie that Jotun old, hadst thou the sword not used that I forged for thee, thy keen-edged glave.
- lines:
  - faf.30.1
  - faf.30.6
  text: Valour is better than might of sword, when foes embittered fight; for a brave man I have ever seen gain victory with a dull sword.
- lines:
  - faf.31.1
  - faf.31.6
  text: For the brave 'tis better than for the timid to join in the game of war; for the joyous it is better than for the sad, let come whatever may.
- lines:
  - faf.p31.1
  - faf.p31.7
  text: 'Sigurd took Fafnir''s heart and roasted it on a stick. When he thought it roasted enough, and the blood frothed from it, he touched it with his finger, to try whether it were quite done. He burnt his finger and put it in his mouth; and when Fafnir''s heart''s blood touched his tongue he understood the language of birds. He heard the eagles chattering among the branches. One eagle said:'
- lines:
  - faf.32.1
  - faf.32.8
  text: There sits Sigurd sprinkled with blood; Fafnir's heart at the fire he roasts. Wise methinks were the ring-dispenser, if he the glistening life-pulp ate.
- lines:
  - faf.33.1
  - faf.33.8
  text: 'There lies Regin communing with himself; he will beguile the youth, who in him trusts: in rage he brings malicious words together, the framer of evil will avenge his brother.'
- lines:
  - faf.34.1
  - faf.34.6
  text: By the head shorter, let him the hoary babbler send hence to Hel; then can he all the gold possess alone, the mass that under Fafnir lay.
- lines:
  - faf.35.1
  - faf.35.8
  text: He would, methinks, be prudent, if he could have your friendly counsel, my sisters! If he would bethink himself, and Hugin gladden. There I expect the wolf, where his ears I see.
- lines:
  - faf.36.1
  - faf.36.8
  text: Not so prudent is that tree of battle, as I that martial leader had supposed, if he one brother lets depart, now he the other has of life bereft.
- lines:
  - faf.37.1
  - faf.37.6
  text: He is most simple, if he longer spares that people's pest. There lies Regin, who has betrayed him.--He cannot guard against it.
- lines:
  - faf.38.1
  - faf.38.6
  text: By the head shorter let him make the ice-cold Jotun, and of his rings deprive him; then of that treasure thou, which Fafnir owned, sole lord wilt be!
- lines:
  - faf.39.1
  - faf.39.6
  text: Fate shall not so resistless be, that Regin shall my death-word bear; for the brothers both shall speedily go hence to Hel.
- lines:
  - faf.p39.1
  - faf.p39.3
  text: 'Sigurd cut off the head of Regin, and then ate Fafnir''s heart, and drank the blood of both Regin and Fafnir. He then heard the eagles saying:'
- lines:
  - faf.40.1
  - faf.40.8
  text: Bind thou, Sigurd! the red-gold rings. It is not kingly many things to fear. I a maid know by far the fairest, with gold adorned. Couldst thou but her obtain!
- lines:
  - faf.41.1
  - faf.41.8
  text: To Giuki lead all-verdant ways; the fates point out to wayfarers where the good king a born daughter has; her wilt thou, Sigurd! purchase with bridal gifts.
- lines:
  - faf.42.1
  - faf.42.8
  text: There stands a hall on the high Hindarfiall, without 'tis all with fire surrounded; sagacious men have it constructed of the resplendent radiance of the flood.
- lines:
  - faf.43.1
  - faf.43.8
  text: On the fell I know a warrior maid to sleep, over her waves the linden's bane. Ygg whilom stuck a sleep-thorn in the robe of the maid who would heroes choose.
- lines:
  - faf.44.1
  - faf.44.8
  text: Thou, youth! mayest see the helmed maiden, her whom Vingskornir from battle bore. May not Sigrdrifa's slumber break the son of warriors, against the Norns' decrees.
- lines:
  - faf.p44.1
  - faf.p44.5
  text: Sigurd rode along Fafnir's track to his lair, which he found open. The doors and door-posts were of iron; of iron also were all the beams in the house; but the treasure was buried in the earth. Sigurd found there a great quantity of gold, and filled two chests with it. He took thence the Oegis-helm, a golden corslet, the sword named Hrotti, and many precious things, all which he laid on Grani; but the horse would not proceed until Sigurd had mounted on his back.
