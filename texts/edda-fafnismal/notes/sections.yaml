# Notes for Fáfnismál. Editorial notes are drafts until a reviewer lifts them.
- id: n.faf.frame
  attach: faf.p0.1
  kind: editorial
  status: draft
  leans_on: "Henry Adams Bellows, The Poetic Edda (1923), introductory note to Fafnismol and note on the opening prose"
  text: "Fáfnismál, 'the sayings of Fáfnir', tells how the young Sigurðr kills the dragon Fáfnir on Gnitaheiðr, talks with him while he dies, and then kills Reginn, Fáfnir's brother, after birds warn him. The verse is almost all dialogue; prose passages set the scene between speeches and are usually taken to be the work of the compiler. The text survives in one manuscript, the Codex Regius of about 1270, where it follows Reginsmál with no break and its closing prose runs straight into the prose that opens Sigrdrífumál. Bellows reports that a heading, 'Of Fafnir's death', is written very faintly before stanza 1; the title Fáfnismál is the editors'. When the verse was composed is not known. Snorri Sturluson quotes stanza 13 in Gylfaginning and stanzas 32 and 33 in Skáldskaparmál, so some of it was current by about 1220, and Völsunga saga, a prose saga of the 1200s, retells the same events closely in its chapters 18 and 19."
- id: n.faf.gold
  attach: faf.9.4
  kind: editorial
  status: draft
  leans_on: "Reginsmál (Codex Regius), prose and stanza 5; Snorri Sturluson, Skáldskaparmál, the story of the otter's ransom"
  text: "The poem assumes the history of the gold. In the prose of Reginsmál and in Snorri's Skáldskaparmál, Loki kills an otter that is Reginn's brother Otr; the gods pay the father, Hreiðmarr, with gold Loki has taken from the dwarf Andvari, and Andvari curses it. In Reginsmál the gold is to be the death of two brothers; in Snorri, the ring is to be the death of whoever owns it. Fáfnir then kills his father for the gold and lies on it at Gnitaheiðr in the shape of a serpent. In this poem Fáfnir gives the curse as a warning to Sigurðr, 'it gjalla gull / ok it glóðrauða fé, / þér verða þeir baugar at bana' ('the ringing gold and the ember-red wealth, those rings will be your death'), in stanza 9 and again in stanza 20. Sigurðr answers that every man must go to Hel some day (10) and rides for the gold anyway (21). His words in 39, that both brothers will soon go to Hel, match the terms of the curse as Reginsmál gives them, though the poem does not make the link itself."
- id: n.faf.name
  attach: faf.p1.1
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), notes to stanzas 2-7"
  text: "The prose gives the reason Sigurðr hides his name: it was believed that the word of a dying man had great power if he cursed his enemy by name. Sigurðr first calls himself göfugt dýr, literally 'noble beast' (Bellows: 'The Noble Hart'), and says he has neither mother nor father. Fáfnir does not accept the answer, and in stanza 4 Sigurðr names himself and his father Sigmundr. Fáfnir's taunt in stanza 7, that Sigurðr is a captive taken in war, is usually explained from the wider story, in which Sigurðr's mother was taken by Álfr after Sigmundr's death; this poem does not tell that story. The edition prints 'nafn síns' in the prose, an accusative noun with a genitive possessive; this is kept as printed and is probably a slip for nafns síns."
- id: n.faf.norns
  attach: faf.12.4
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), notes to stanzas 11-15"
  text: "In stanzas 12 to 15 Sigurðr asks two questions in the formula of the wisdom contests, 'Segðu mér ... alls þik fróðan kveða' ('tell me, since they say you are wise'), and Fáfnir answers. Bellows, with earlier editors, takes stanzas 11 to 15 as an insertion from a poem like Vafþrúðnismál, where the same pattern is used, and notes that Sigurðr has no evident reason to ask about childbirth. The first answer says the norns are of different descent: some of the Æsir, some of the elves, some daughters of the dwarf Dvalinn. Those asked about are nauðgönglar, 'need-goers', who 'choose mothers from sons', a phrase usually read as help at a birth. The second answer names the island Óskópnir, 'the unmade', where Surtr and the Æsir will mix 'sword-liquid', that is blood, and says Bilröst will break when they cross it and the horses will swim in the river. Óskópnir is not named elsewhere; Bellows takes it as another name for Vígríðr, the field of the last battle in Vafþrúðnismál 18."
- id: n.faf.radha
  attach: faf.22.1
  kind: editorial
  status: draft
  text: "The verb ráða covers both 'advise' and 'plot against', and stanzas 20 to 22 use both senses. Fáfnir begins 'Ræð ek þér' ('I advise you'), Sigurðr answers 'Ráð er þér ráðit' ('the advice is advised to you', which Bellows renders 'Thy counsel is given'), and Fáfnir replies 'Reginn mik réð, hann þik ráða mun' ('Reginn betrayed me, he will betray you'). What follows bears out the warning in stages. Reginn returns after the fight, praises Sigurðr, then claims a share of the deed: Fáfnir was his brother (25), and the sword was his own work (29). He drinks the blood, cuts out the heart and asks Sigurðr to roast it for him (27). The birds then say that Reginn means to deceive the youth and avenge his brother (33, 37), and Sigurðr kills him. Reginn's intent is reported by Fáfnir and the birds; he is given no speech that states it."
- id: n.faf.birds
  attach: faf.p31.5
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), notes to stanzas 32-40"
  text: "Sigurðr tests the heart with his finger, burns it and puts it in his mouth; when Fáfnir's heart-blood touches his tongue he understands the speech of birds. The prose calls them igður, usually translated 'nuthatches' (Bellows), though the identification is not certain; Thorpe has 'eagles'. This edition labels seven speakers for stanzas 32 to 38, and stanzas 40 to 44 follow after Reginn's death. The labels are an editorial arrangement: Bellows reports that the manuscript marks only II, III and IV in the margin and that editions differ on how many birds speak. The stanzas also differ in form. Stanzas 32, 33, 35, 36 and 40 to 44 are in fornyrðislag; 34, 37 and 38 are in ljóðaháttr like the rest of the poem, and 38 nearly repeats 34. Bellows takes this as a sign that the bird stanzas come from more than one source."
- id: n.faf.sigrdrifa
  attach: faf.44.5
  kind: editorial
  status: draft
  leans_on: "Bellows (1923), notes to stanzas 40-44 and the closing prose"
  text: "The last bird stanzas point in two directions. Stanzas 40 and 41 speak of a maiden at the court of Gjúki whom Sigurðr may win with a bride-price. Stanzas 42 to 44 describe a hall on Hindarfjall ringed with fire, where a warrior maiden sleeps because Yggr (Óðinn) pricked her with a thorn after she felled a warrior other than the one he wished. Bellows reads these as two versions of the story, one leading to Guðrún, Gjúki's daughter, and one to Brynhildr. The word Sigrdrífa in 44.5 can be read as a name or as an epithet, 'victory-driver'. Bellows argues that the compiler took it for a name and so gave it to the next poem in the manuscript, Sigrdrífumál. The closing prose, in which Sigurðr loads the gold, the ægishjálmr and the sword Hrotti on his horse Grani, runs without a break into the prose that opens that poem."
- id: n.faf.reception
  attach: faf.1.1
  kind: editorial
  status: draft
  leans_on: "Wikimedia Commons records for Sö 101 (Swedish National Heritage Board photographs) and Oscar Montelius, Sveriges hednatid (1877), fig. 406; Bellows (1923), introductory note to Fafnismol"
  text: "The story was also told in pictures. The Ramsund carving (Sö 101), cut into a rock face in Södermanland, Sweden, and usually dated to about 1030, is shown at the top of this page in a drawing of 1877. It shows Sigurðr stabbing the dragon from below, roasting the heart with his thumb at his mouth, the beheaded Reginn beside his smithing tools, and the horse Grani at a tree with birds. The carving is more than two centuries older than the Codex Regius. It shows that these events were known in eastern Sweden by then; it does not show that this poem existed in its present form. The portal of Hylestad stave church in Norway, usually dated to the late 1100s, carves the same sequence. In German tradition the hero is Siegfried, and the Nibelungenlied of about 1200 mentions only in passing that he killed a dragon and bathed in its blood. Richard Wagner drew on the Norse sources for Siegfried, the third opera of Der Ring des Nibelungen (first performed 1876); Bellows notes that Wagner used Fáfnismál, with part of Sigrdrífumál, 'with remarkably little change of outline'."
