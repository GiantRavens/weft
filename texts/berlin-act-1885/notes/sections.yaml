# Notes for the General Act of the Berlin Conference (1885): preamble, Chapter I articles 1-5,
# Chapter VI articles 34-35.
- id: n.ba.dec.scope
  attach: ba.dec.2
  kind: editorial
  status: draft
  leans_on: "the text of the Act (preamble and articles 1-38) in the 1898 French print and in Hertslet, The Map of Africa by Treaty (1909), vol. 2, No. 128; Hertslet's arrangement of the later bilateral agreements in vols. 2-3"
  text: "The General Act gathers six declarations into one instrument: freedom of trade in the Congo basin, the slave trade, the neutrality of territories in that basin, navigation of the Congo, navigation of the Niger, and rules for future occupations on the coast. The selection here gives the purpose clause, the free-trade articles 1 to 5 and the two articles on occupations. The Act's limits also need stating. No article assigns any territory to any power, and none draws a boundary between colonies. Article 1 defines a zone in which trade is free, whoever governs it. The division of the continent into colonies and protectorates was made mostly in later bilateral agreements, which is why a collection such as Hertslet's prints the Berlin Act as one document among nearly four hundred."
- id: n.ba.pre.parties
  attach: ba.pre.7
  kind: editorial
  status: draft
  leans_on: "the preamble's list of sovereigns and plenipotentiaries (1898 French print, page 93); the protocol of ratifications of 19 April 1886 and its footnotes, in Hertslet (1909), vol. 2, No. 129 and p. 485"
  text: "The preamble names fourteen parties: the rulers of Germany, Austria-Hungary, Belgium, Denmark, Spain, France, Great Britain, Italy, the Netherlands, Portugal, Russia, Sweden and Norway, and the Ottoman Empire, and the President of the United States. No African state or ruler was a party, and the populations whose 'moral and material well-being' the preamble names are the object of the Act, not signatories to it. Two details from the record qualify the list. The United States signed but did not ratify; the protocol of 19 April 1886 records the ratifications of all the others and places the United States among the powers that may adhere later. The Sultan of Zanzibar, whose coast lies in the eastern zone of article 1, acceded with a reservation on 8 November 1886, under the adhesion clause of article 37."
- id: n.ba.a1.basin
  attach: ba.a1.3
  kind: editorial
  status: draft
  leans_on: "articles 1-2 of the Act; the third declaration's phrase 'bassin conventionnel du Congo', Hertslet's 'Conventional basin of the Congo'"
  text: "Article 1 defines the area where trade is free in three parts: the geographical basin of the Congo and its tributaries, bounded by the watersheds of the neighbouring basins; a strip of Atlantic coast running south from 2°30' south latitude to the mouth of the Logé; and a zone running east to the Indian Ocean between 5° north and the mouth of the Zambezi. The Act's own term for the whole is the conventional basin of the Congo, conventional because it is defined by agreement and is wider than the river's drainage. The line division here stops before the boundary details of the second and third parts, which run on in the same sentences."
- id: n.ba.a1.eastzone
  attach: ba.a1.9
  kind: editorial
  status: draft
  leans_on: "article 1, final paragraph (1898 print, pages 96-97); Hertslet (1909), vol. 2, p. 485, footnote on Zanzibar's accession"
  text: "This sentence limits the eastern zone. The signatories bind only themselves there, and in territory belonging to an independent sovereign state the free-trade principle applies only if that state consents. The text names no such state. The next sentence, which falls on the following page of the print and is not in this selection, commits the powers to use their good offices with the governments on the Indian Ocean coast to obtain that consent. The clause therefore treats at least some African coastal governments as sovereign states whose agreement is needed, while giving them no part in drafting the rule. Hertslet records Zanzibar's accession with a reservation in November 1886."
- id: n.ba.a5.monopoly
  attach: ba.a5.1
  kind: editorial
  status: draft
  leans_on: "article 5; Frank R. Cana, 'Congo Free State', Encyclopaedia Britannica, 11th ed. (1910), vol. 6; Roger Casement's report of February 1904, as described there"
  text: "Article 5 forbids any power holding sovereign rights in the basin to grant a monopoly or privilege of any kind in trade. The International Association of the Congo, controlled by Leopold II, King of the Belgians, was not a party at Berlin; according to the Britannica account of 1910, the powers recognised its flag during the conference and it adhered to the Act once signed. From 1885 it governed as the Congo Free State, with Leopold as its sovereign; the Belgian legislature declared the union between Belgium and the new state 'exclusively personal'. A decree of 1885 made 'vacant lands' state property, and a secret decree of 1891 reserved the ivory and rubber of those lands to the state. Critics argued that this and the concession companies nullified articles 1 and 5; the Free State denied it. The British consul Roger Casement reported in 1904 on conditions in the rubber districts he had visited in 1903. Belgium annexed the Congo in 1908. Whether the domain system breached the Act was disputed at the time, and these notes do not settle it; the abuses Casement reported concern the treatment of people, which articles 1 to 5 do not address. Article 6, not in this selection, does: it binds the powers to watch over the preservation of the native populations."
- id: n.ba.a34.effective
  attach: ba.a34.1
  kind: editorial
  status: draft
  leans_on: "Chapter VI and articles 34-35; the House of Commons return of 1888 on notifications under article 34, in Hertslet (1909), vol. 2, p. 487"
  text: "The phrase 'effective occupation' is often used for a rule of the Berlin Conference. In the text the word effectives appears only in this chapter title. The two articles that follow set narrower duties. Article 34 requires a power that takes possession of territory, or assumes a protectorate, to notify the other signatories, so that they may raise claims. Article 35 requires a power to ensure an authority sufficient to protect acquired rights and, where it applies, freedom of trade. Both articles are limited to the coasts of the continent and to occupations after 1885; neither speaks of the interior. Practice under article 34 can be read in a British return of 1888, which lists notifications for the Niger Districts and Oil Rivers, the Somali coast, Zululand and two points on the coast near Dahomey, each recorded without objection. Later writers extended the idea of effective occupation beyond what these two articles say."
- id: n.ba.a34.viendrait
  attach: ba.a34.3.9
  kind: editorial
  status: draft
  leans_on: "French Wikisource, Page 107 of the 1898 print (revision 8619939, not proofread); Hertslet and AJIL translations of article 34"
  text: "The transcription prints a comma after viendrait, which separates the verb from its complement à en acquérir, 'should come to acquire some'. Neither English translation reflects a pause there. The Wikisource page has not been proofread, so the comma may be a transcription error or an error in the 1898 print; it has not yet been checked against the scan. The edition keeps it, as it keeps the source verbatim. The sound layer treats it as a pause, so no liaison is made across it."
- id: n.ba.pre.sound
  attach: ba.pre.1
  kind: editorial
  status: draft
  leans_on: "Paul Passy, Les sons du français (1887); Émile Littré, Dictionnaire de la langue française (1863-1872), pronunciation entries"
  text: "The Act was negotiated and signed in French, the usual language of diplomacy at the time, by delegates most of whom were not French. The first sound scheme gives the formal Paris reading of the 1880s, not the accent of any delegate. French of 1885 is close to modern French. The spelling is the modern one, and most sounds are unchanged. The scheme shows four differences, each on contemporary evidence: long vowels in final syllables closed by r, z, zh or v, and in several circumflex words such as même and être, as Passy describes them; a back a in a few words where Littré marks it (pas, cas, droits); more liaisons in formal reading, marked in the edition; and a few words such as but, which Littré gives without its final t. Vowel length is shown for the word said alone. The differences are small; the 1885 reading is close to what a careful modern reader would say."
