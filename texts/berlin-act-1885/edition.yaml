# Weft edition of the General Act of the Berlin Conference (Acte général de la Conférence
# africaine, Berlin, 26 February 1885): the preamble's statement of purpose, Chapter I articles 1-5
# (freedom of trade in the Congo basin) and Chapter VI articles 34-35 (new occupations on the coasts).
# Text as printed by the French Ministry of Foreign Affairs in Afrique. Arrangements, actes et
# conventions concernant le nord, l'ouest et le centre de l'Afrique (1881-1898), Documents
# diplomatiques (Paris: Imprimerie nationale, 1898; Gallica bpt6k56134609), pp. 93-107, transcribed on French Wikisource
# (pages not yet proofread there) and checked verbatim against the pinned page revisions
# (`weft draft` reports edition-not-in-source otherwise). verify_strip sets aside the wiki markup
# for small capitals, bold and superscripts.
#
# The print is in modern spelling, so tokens carry no n except where the print differs (Etat).
#   t     the word as printed, punctuation attached; elided c’ d’ l’ n’ qu’ s’ jusqu’ glued to the next word
#   p     punctuation set off by a space in the print (French " :" and " ;")
#   z     liaison in both schemes; zf liaison in formal reading of the 1880s only (fr1885)
#   Lines are Weft's division of the text at its commas and semicolons; sections are articles.
joiner: " "
verify_strip: "'''|\\{\\{AN\\||\\{\\{uc\\||\\{\\{sc\\||\\}\\}|<sup>|</sup>"
