# British translation of the General Act, marked "(Translation.)", as printed in E. Hertslet, The Map
# of Africa by Treaty, 3rd ed. (London: HMSO, 1909), vol. 2, No. 128, pp. 467-485. Verbatim from the
# Internet Archive OCR of the Smithsonian Libraries copy, with these changes:
#   - omitted: the list of sovereigns before "wishing" (not in this selection), the printer's side
#     headings ("Freedom of Trade to all Nations" and the like), cross-references "(See p. 484.)",
#     footnote markers, and the article labels "Art. I.—", "Chap. VI.—", which the page shows as
#     section headings
#   - the chapter titles, set in small capitals in the print, are given in sentence case
#   - OCR corrections: "op" for "of" (twice, Chapter I title); "followiug" for "following"; stray
#     marks at two line starts in the preamble (". in a spirit", "' navigation") removed; the
#     footnote and running head that interrupt article 1 at the page turn removed. "Ogowe" and
#     the spacing "2° 30'" are kept as printed
# The translation reorders article 35 and parts of article 2; those spans cover several lines.
translation: hertslet1909
aligned_by: hand, phase 0
spans:
- lines: [ba.pre.1, ba.pre.1]
  text: "In the Name of Almighty God."
- lines: [ba.pre.2, ba.pre.2]
  text: "wishing, in a spirit of good and mutual accord, to regulate the conditions most favourable to the development of trade and civilization in certain regions of Africa,"
- lines: [ba.pre.3, ba.pre.3]
  text: "and to assure to all nations the advantages of free navigation on the two chief rivers of Africa flowing into the Atlantic Ocean;"
- lines: [ba.pre.4, ba.pre.4]
  text: "being desirous, on the other hand, to obviate the misunderstanding and disputes which might in future arise from new acts of occupation (“prises de possession”) on the coast of Africa;"
- lines: [ba.pre.5, ba.pre.5]
  text: "and concerned, at the same time, as to the means of furthering the moral and material well-being of the native populations,"
- lines: [ba.pre.6, ba.pre.6]
  text: "have resolved, on the invitation addressed to them by the Imperial Government of Germany, in agreement with the Government of the French Republic,"
- lines: [ba.pre.7, ba.pre.7]
  text: "to meet for those purposes in Conference at Berlin, and have appointed as their Plenipotentiaries, to wit:—"
- lines: [ba.dec.1, ba.dec.1]
  text: "6. A Declaration introducing into international relations certain uniform rules with reference to future occupations on the coast of the African Continent."
- lines: [ba.dec.2, ba.dec.2]
  text: "And deeming it expedient that all these several documents should be combined in one single instrument, they (the Signatory Powers) have collected them into one General Act, composed of the following Articles:—"
- lines: [ba.a1.1, ba.a1.1]
  text: "Declaration relative to Freedom of Trade in the Basin of the Congo, its Mouths and circumjacent Regions, with other Provisions connected therewith."
- lines: [ba.a1.2, ba.a1.2]
  text: "The trade of all nations shall enjoy complete freedom:—"
- lines: [ba.a1.3, ba.a1.3]
  text: "1. In all the regions forming the basin of the Congo and its outlets."
- lines: [ba.a1.4, ba.a1.4]
  text: "This basin is bounded by the watersheds (or mountain ridges) of the adjacent basins, namely, in particular, those of the Niari, the Ogowe, the Schari, and the Nile on the north;"
- lines: [ba.a1.5, ba.a1.5]
  text: "It therefore comprises all the regions watered by the Congo and its affluents, including Lake Tanganyika, with its eastern tributaries."
- lines: [ba.a1.6, ba.a1.6]
  text: "2. In the maritime zone extending along the Atlantic Ocean from the parallel situated in 2° 30' of South Latitude to the mouth of the Loge."
- lines: [ba.a1.7, ba.a1.7]
  text: "3. In the zone stretching eastwards from the Congo Basin as above defined, to the Indian Ocean from 5 degrees of North Latitude to the mouth of the Zambesi in the south,"
- lines: [ba.a1.8, ba.a1.9]
  text: "It is expressly recognized that in extending the principle of free trade to this eastern zone, the Conference Powers only undertake engagements for themselves, and that in the territories belonging to an independent Sovereign State this principle shall only be applicable in so far as it is approved by such State."
- lines: [ba.a2.1, ba.a2.1]
  text: "All flags, without distinction of nationality, shall have free access to the whole of the coast-line of the territories above enumerated."
- lines: [ba.a2.2, ba.a2.3]
  text: "To the rivers there running into the sea to all the waters of the Congo and its affluents, including the lakes, and to all the ports situate on the banks of these waters, as well as to all canals which may in future be constructed with intent to unite, the watercourses or lakes within the entire area of the territories described in Article I."
- lines: [ba.a2.4, ba.a2.4]
  text: "Those trading under such flags may engage in all sorts of transport, and carry on the coasting trade by sea and river, as well as boat traffic, on the same footing as if they were subjects."
- lines: [ba.a3.1, ba.a3.1]
  text: "Wares, of whatever origin, imported into these regions, under whatsoever flag, by sea or river, or overland,"
- lines: [ba.a3.2, ba.a3.2]
  text: "shall be subject to no other taxes than such as may be levied as fair compensation for expenditure in the interests of trade,"
- lines: [ba.a3.3, ba.a3.3]
  text: "and which for this reason must be equally borne by the subjects themselves and by foreigners of all nationalities."
- lines: [ba.a3.4, ba.a3.4]
  text: "All differential dues on vessels, as well as on merchandize are forbidden."
- lines: [ba.a4.1, ba.a4.1]
  text: "Merchandize imported into these regions shall remain free from import and transit dues."
- lines: [ba.a4.2, ba.a4.2]
  text: "The Powers reserve to themselves to determine after the lapse of 20 years whether this freedom of import shall be retained or not."
- lines: [ba.a5.1, ba.a5.1]
  text: "No Power which exercises or shall exercise sovereign rights in the above-mentioned regions shall be allowed to grant therein a monopoly or favour of any kind in matters of trade."
- lines: [ba.a5.2, ba.a5.2]
  text: "Foreigners, without distinction, shall enjoy therein with regard to the protection of their persons and effects,"
- lines: [ba.a5.3, ba.a5.3]
  text: "the acquisition and transmission of their movable and real property and with regard to the exercise of their professions, the same treatment and the same rights as nationals."
- lines: [ba.a34.1, ba.a34.1]
  text: "Declaration relative to the essential Conditions to be observed in order that new Occupations on the Coasts of the African Continent may be held to be effective."
- lines: [ba.a34.2, ba.a34.2]
  text: "Any Power which henceforth takes possession of a tract of land on the coasts of the African Continent outside of its present possessions,"
- lines: [ba.a34.3, ba.a34.3]
  text: "or which, being hitherto without such possessions, shall acquire them,"
- lines: [ba.a34.4, ba.a34.4]
  text: "as well as the Power which assumes a Protectorate there,"
- lines: [ba.a34.5, ba.a34.5]
  text: "shall accompany the respective act with a notification thereof, addressed to the other Signatory Powers of the present Act,"
- lines: [ba.a34.6, ba.a34.6]
  text: "in order to enable them, if need be, to make good any claims of their own."
- lines: [ba.a35.1, ba.a35.3]
  text: "The Signatory Powers of the present Act recognize the obligation to insure the establishment of authority in regions occupied by them on the coasts of the African Continent sufficient to protect existing rights, and, as the case may be, freedom of trade and of transit under the conditions agreed upon."
