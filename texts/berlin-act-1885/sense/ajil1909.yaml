# Translation of the General Act printed in the Supplement to the American Journal of International
# Law, vol. 3 (1909), Official Documents, pp. 7-25; the translator is not named. Verbatim from the
# Internet Archive OCR, with these changes:
#   - omitted: the list of sovereigns before "Wishing" (not in this selection) and the article
#     labels "ARTICLE 1." and chapter labels "CHAPTER I.", which the page shows as section headings
#   - the chapter titles, set in capitals in the print, are given in sentence case
#   - OCR corrections: "affuents" for "affluents" (article 1), "end" for "and" (article 5)
# The translation keeps the French order closely and some French terms ("allegiants" for
# nationaux, "reclamations" for réclamations, "embouchures").
translation: ajil1909
aligned_by: hand, phase 0
spans:
- lines: [ba.pre.1, ba.pre.1]
  text: "In the name of Almighty God:"
- lines: [ba.pre.2, ba.pre.2]
  text: "Wishing to regulate in a spirit of good mutual understanding the conditions most favorable to the development of commerce and of civilization in certain regions of Africa,"
- lines: [ba.pre.3, ba.pre.3]
  text: "and to assure to all peoples the advantages of free navigation upon the two principal African rivers which empty into the Atlantic ocean;"
- lines: [ba.pre.4, ba.pre.4]
  text: "desirous on the other hand to prevent misunderstandings and contentions to which the taking of new possessions on the coast of Africa may in the future give rise,"
- lines: [ba.pre.5, ba.pre.5]
  text: "and at the same time preoccupied with the means of increasing the moral and material well being of the indigenous populations,"
- lines: [ba.pre.6, ba.pre.6]
  text: "have resolved, upon the invitation which has been addressed to them by the Imperial Government of Germany in accord with the Government of the French Republic,"
- lines: [ba.pre.7, ba.pre.7]
  text: "to assemble for this object a Conference at Berlin and have named for their Plenipotentiaries, as follows:"
- lines: [ba.dec.1, ba.dec.1]
  text: "6th. A Declaration introducing into international relations certain uniform rules relative to the occupations which may take place in the future upon the coasts of the African Continent;"
- lines: [ba.dec.2, ba.dec.2]
  text: "And having judged that these different documents might be usefully coordinated in a single instrument, have collected them into a general Act composed of the following articles."
- lines: [ba.a1.1, ba.a1.1]
  text: "Declaration relative to the liberty of commerce in the basin of the Congo, its embouchures and neighboring country, and dispositions connected therewith."
- lines: [ba.a1.2, ba.a1.2]
  text: "The commerce of all nations shall enjoy complete liberty:"
- lines: [ba.a1.3, ba.a1.3]
  text: "1st. In all the territories constituting the basin of the Congo and its affluents."
- lines: [ba.a1.4, ba.a1.4]
  text: "This basin is defined by the crests of the contiguous basins, to wit: notably the basins of the Niari, of the Ogove, of the Schari and of the Nile, on the North;"
- lines: [ba.a1.5, ba.a1.5]
  text: "It embraces, consequently, all the territories drained by the Congo and its affluents, including the lake Tanganyka and its Eastern tributaries."
- lines: [ba.a1.6, ba.a1.6]
  text: "2nd. In the maritime zone extending along the Atlantic ocean from the parallel of 2° 30’ Southern latitude to the mouth of the Loge."
- lines: [ba.a1.7, ba.a1.7]
  text: "3rd. In the zone prolonged to the East of the Congo basin as it is above described, as far as the Indian ocean, from the fifth degree of North latitude to the mouth of the Zambeze on the South;"
- lines: [ba.a1.8, ba.a1.8]
  text: "It is expressly understood that in extending to this Eastern zone the principle of commercial liberty the Powers represented at the Conference only engage for themselves"
- lines: [ba.a1.9, ba.a1.9]
  text: "and that this principle shall apply to territories actually belonging to any independent and sovereign State only in so far as it shall give its consent thereto."
- lines: [ba.a2.1, ba.a2.1]
  text: "All flags, without distinction of nationality, shall have free access to all the littoral of the territories above enumerated,"
- lines: [ba.a2.2, ba.a2.2]
  text: "to the rivers which there empty into the sea, to all the waters of the Congo and its affluents including the lakes, to all the ports situated upon the borders of these waters,"
- lines: [ba.a2.3, ba.a2.3]
  text: "as well as to all the canals which may in the future be excavated with the object of connecting together the water courses or lakes comprised in the whole extent of the territories described in Article 1."
- lines: [ba.a2.4, ba.a2.4]
  text: "They may undertake every kind of transport and exercise the coastwise navigation by sea and river as also small boat transportation upon the same footing as the allegiants."
- lines: [ba.a3.1, ba.a3.1]
  text: "Merchandise of every origin imported into these territories, under whatever flag it may be, by route of sea or river or land,"
- lines: [ba.a3.2, ba.a3.2]
  text: "shall have to discharge no other taxes than those which may be collected as an equitable compensation for expenses useful to commerce"
- lines: [ba.a3.3, ba.a3.3]
  text: "and which, under this head, must be equally borne by the allegiants and by strangers of every nationality."
- lines: [ba.a3.4, ba.a3.4]
  text: "All differential treatment is prohibited in respect to ships as well as merchandise."
- lines: [ba.a4.1, ba.a4.1]
  text: "Merchandise imported into these territories shall remain free from entrance and transit dues."
- lines: [ba.a4.2, ba.a4.2]
  text: "The Powers reserve to themselves to decide, at the end of a period of twenty years, whether freedom of entry shall or shall not be maintained."
- lines: [ba.a5.1, ba.a5.1]
  text: "Every Power which exercises or shall exercise rights of sovereignty in the territories under consideration shall not concede there either monopoly or privilege of any kind in commercial matters."
- lines: [ba.a5.2, ba.a5.2]
  text: "Strangers shall enjoy there without distinction, for the protection of their persons and their goods,"
- lines: [ba.a5.3, ba.a5.3]
  text: "the acquisition and transmission of their movable and immovable property and for the exercise of the professions, the same treatment and the same rights as the allegiants."
- lines: [ba.a34.1, ba.a34.1]
  text: "Declaration relative to the conditions essential to be fulfilled in order that new occupations upon the coasts of the African continent may be considered as effective."
- lines: [ba.a34.2, ba.a34.2]
  text: "The Power which henceforth shall take possession of a territory upon the coast of the African continent situated outside of its present possessions,"
- lines: [ba.a34.3, ba.a34.3]
  text: "or which, not having had such possessions hitherto, shall come to acquire them,"
- lines: [ba.a34.4, ba.a34.4]
  text: "and likewise, the Power which shall assume a protectorate there,"
- lines: [ba.a34.5, ba.a34.5]
  text: "shall accompany the respective act with a notification addressed to the other signatory Powers of the present Act,"
- lines: [ba.a34.6, ba.a34.6]
  text: "in order to put them in a condition to make available, if there be occasion for it, their reclamations."
- lines: [ba.a35.1, ba.a35.1]
  text: "The signatory Powers of the present Act recognize the obligation to assure, in the territories occupied by them, upon the coasts of the African Continent,"
- lines: [ba.a35.2, ba.a35.2]
  text: "the existence of an authority sufficient to cause acquired rights to be respected"
- lines: [ba.a35.3, ba.a35.3]
  text: "and, the case occurring, the liberty of commerce and of transit in the conditions upon which it may be stipulated."
