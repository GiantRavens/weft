# Weft edition of the Zhouyi (周易), the core text of the Yijing: the 64 hexagrams in the received
# (King Wen) order, each with its name and judgment (卦辭) and its line statements (爻辭), with the
# extra statements 用九 and 用六 under hexagrams 1 and 2. The commentaries of the Ten Wings (彖, 象,
# 文言 and the rest), which the source pages print after the core text, are left out.
#
# Source: Chinese Wikisource, one page per hexagram (周易/乾 ... 周易/未濟), each pinned by revision
# and sha256 in manifest.yaml. On those pages the core text is the part set in blue. Each section is
# checked verbatim against its own page (verify_in) after verify_strip deletes the wiki markup, the
# alternative readings of the 另 template, the modern punctuation and all whitespace. The
# punctuation is the Wikisource editor's, not the text's, and is not reproduced; `caesura` marks
# where it falls, so the clause divisions stay visible. In 48 places the page prints one reading and
# gives another as 一作 ("one copy writes"); Weft follows the printed reading (see the note), with
# one exception: in hexagram 38, line 3, the page prints 𧤊, a character outside the page's
# Chinese font, and gives 掣 as the other copy; Weft prints 掣, the reading of the received text
# that Legge translated. verify_strip deletes 𧤊 there instead of 掣.
#
# Line 1 of each section is the hexagram name and judgment; lines 2 to 7 are the line statements,
# bottom line first, each opening with its label (初九, 六二 ... 上六); line 8 of hexagrams 1 and 2 is
# 用九 / 用六. `hexagram` gives the figure as six digits, bottom line first, 1 = unbroken (yang, 九),
# 0 = broken (yin, 六), derived from the labels and checked against the trigrams the page names
# (lower 下, upper 上). One token per character; oc, tang and mandarin name the reading where a
# character has more than one (see texts/daodejing/edition.yaml); unmarked tokens take the first.
joiner: ""
verify_strip: "\\{\\{另\\||𧤊\\||(?<=掣)\\}\\}|\\|[^{}|]*\\}\\}|<[^>]*>|'''|-\\{|\\}-|[*#:;]|[，。；：、？！「」『』]|\\s"
