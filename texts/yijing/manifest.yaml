  id: zhouyi-wikisource
  name: 周易, Chinese Wikisource, one page per hexagram (周易/乾 ... 周易/未濟), the core text set in blue on each page, pinned revisions listed under sources_extra; the pages do not name the edition they transcribe; Weft line division
  format: weft-edition
  file: edition.yaml
  license: public domain (PD-old); Wikisource pages CC BY-SA 4.0; Weft line division CC BY-SA 4.0
treebank: null                   # UD Classical Chinese Kyoto does not include the Yijing (checked 2026-10-01, v2.18); hand annotation, draft
