# Notes for the Zhouyi. Editorial, draft.
- id: n.yj.1.1.zhouyi
  attach: yj.1.1
  kind: editorial
  status: draft
  leans_on: "James Legge, The Yi King, Sacred Books of the East vol. 16 (1882), Preface and Introduction (sources/legge1882.txt)"
  text: "The Yijing, the Classic of Changes, has two layers. The older is the Zhouyi, the Changes of Zhou: 64 six-line figures (hexagrams), each with a name, a short judgment (卦辭) and one statement for each of its six lines (爻辭). That core is what this edition prints. The second layer is the Ten Wings (十翼), seven commentaries in ten parts: the Tuan (彖) and Xiang (象) in two parts each, the Wenyan (文言), the Xici (繫辭) in two parts, the Shuogua (說卦), the Xugua (序卦) and the Zagua (雜卦). Tradition ascribed the Wings to Confucius; most modern scholars date them to the Warring States period and the early Han, several centuries after the core text. School editions, and the Wikisource pages this text is taken from, print parts of the Wings under each hexagram. Legge, who had first read the book that way, separated them and printed the Wings as appendixes, judging in his preface that the two layers were written about 700 years apart."
- id: n.yj.1.1.1.figures
  attach: yj.1.1.1
  kind: editorial
  status: draft
  leans_on: "Shuogua (說卦) for the trigram images; Legge (1882), Introduction"
  text: "A hexagram is six lines stacked from the bottom up, each either unbroken (yang) or broken (yin). Two kinds of line in six places give 2 to the sixth power, 64 figures. Each figure can also be read as two trigrams of three lines, a lower (inner) and an upper (outer) one. There are eight trigrams: 乾 ☰, 兌 ☱, 離 ☲, 震 ☳, 巽 ☴, 坎 ☵, 艮 ☶, 坤 ☷. The Shuogua, one of the Wings, links them with heaven, lake, fire, thunder, wind, water, mountain and earth; those images belong to the commentary; the core text never refers to the trigrams as such. The received order of the hexagrams, called King Wen's order, runs in pairs: the second of each pair is the first turned upside down, or, for the eight figures that look the same inverted (1 and 2, 27 and 28, 29 and 30, 61 and 62), the first with every line changed. The Mawangdui silk manuscript (before 168 BC) arranges the same 64 figures in a different order. On this page each section heading draws its hexagram, and the hexagram field records it bottom line first."
- id: n.yj.1.1.2.formula
  attach: yj.1.1.2
  kind: editorial
  status: draft
  leans_on: "Wenyan (文言) on hexagram 1; Zhu Xi, Zhouyi benyi (周易本義, 1177); Legge (1882), note on hexagram 1; Edward L. Shaughnessy, I Ching: The Classic of Changes (1996), introduction"
  text: "元亨利貞, the judgment of hexagram 1, recurs whole or in part throughout the text, and its reading is disputed. The Wenyan, one of the Wings, takes the four words as four virtues: origination, penetration, advantage, firm correctness. Legge follows it here. Zhu Xi read two phrases instead, in Legge's rendering 'greatly penetrating' and 'requires to be correct and firm', two responses in divination; Legge acknowledges that both readings are possible. Many modern scholars start from the Shang oracle-bone inscriptions, where 貞 is the verb for putting a question to divination, and from early uses of 亨 for 享 'offering'. On that view the formula reads roughly 'prime offering; beneficial to divine'. The gloss row takes a middle course: it keeps the traditional sense of 亨, 'penetrating', and reads 貞 as 'divining'. The choice is editorial, and the same glosses are used wherever the formula occurs (see the conventions in curated/hexagrams-01-16.yaml)."
- id: n.yj.1.2.lines
  attach: yj.1.2.2
  kind: editorial
  status: draft
  leans_on: "Legge (1882), note on hexagram 1 ('the four Hsiang'); Xici (繫辭) A, chapter 9"
  text: "Each line statement opens with a label of two characters. One gives the position: 初 'first' for the bottom line, 二 to 五 for the middle four, 上 'top' for the sixth. The other gives the kind of line: 九 'nine' for an unbroken (yang) line, 六 'six' for a broken (yin) one. The numbers come from divination. Casting produces, for each line, one of four values, 6, 7, 8 or 9; odd values are unbroken lines and even values broken ones, and 9 and 6 are the 'old' values that change into their opposite. The labels use those changing values for every line, which Legge explains in his note and calls 'merely a jargon', translating instead with 'undivided' and 'divided'. The hexagram field of each section is derived from these labels, and checked against the two trigrams the source page names."
- id: n.yj.1.8.casting
  attach: yj.1.8
  kind: editorial
  status: draft
  leans_on: "Xici (繫辭) A, chapter 9; Zhu Xi, Yixue qimeng (易學啓蒙, 1186); Legge (1882), note on hexagram 1, citing the Zuozhuan under 513 BC"
  text: "This page describes the casting methods; it makes no claim about what their results mean. The older method uses 50 yarrow stalks. The Xici gives a terse account of it, and Zhu Xi set out a procedure in 1186 that most later descriptions follow: one stalk is set aside, the rest are divided and counted off in fours three times, and the remainders give one line's value, 6, 7, 8 or 9; eighteen such operations build a hexagram from the bottom up. The three-coin method is simpler: three coins are thrown for each line, one face counting 3 and the other 2. Its origin is not documented; Song writers already mention coins as a substitute for the stalks. The two methods differ in their odds. With yarrow the values 6, 7, 8 and 9 come up 1, 5, 7 and 3 times in 16; with coins 2, 6, 6 and 2 times in 16. A 6 or 9 is a changing line: it turns into its opposite and gives a second hexagram. Which statements are then read varies between authorities. 用九 and 用六 are traditionally the statements for the case in which all six lines change, a use Legge traces to a Zuozhuan narrative under 513 BC."
- id: n.yj.11.6.dating
  attach: yj.11.6.3
  kind: editorial
  status: draft
  leans_on: "Gu Jiegang, 'Zhouyi guayaoci zhong de gushi' (周易卦爻辭中的故事, 1929); Edward L. Shaughnessy, The Composition of the Zhouyi (PhD dissertation, Stanford, 1983); Zhang Zhenglang, 'Shishi Zhou chu qingtongqi mingwen zhong de Yi gua' (試釋周初青銅器銘文中的易卦), Kaogu xuebao 1980.4; Legge (1882), Preface"
  text: "帝乙 is Di Yi, the next-to-last king of Shang, who in this line gives a younger sister in marriage. Allusions like it are one of the grounds for dating the text. Tradition gives the judgments to King Wen of Zhou and the line statements to his son the Duke of Zhou, in the 11th century BC, and Legge accepted that attribution. Most modern scholars instead place the composition of the judgments and line statements in the Western Zhou (about 1046 to 771 BC) without naming an author. The evidence is of three kinds, and none of it is precise. First, the text alludes to people and events of the late Shang and early Zhou and to nothing later that has been identified: Di Yi here and in 54.6, King Wu Ding's campaign against the Guifang (63.4), the Shang noble Jizi (36.6), and the Lord of Kang (35.1), a brother of King Wu who also appears in bronze inscriptions. Gu Jiegang used these allusions in 1929 to argue for the early Western Zhou. Second, the vocabulary and formulae resemble those of Western Zhou bronze inscriptions; Shaughnessy argued on that ground for compilation near the end of the 9th century BC. Third, groups of six numbers on Western Zhou bronzes and oracle bones, read by Zhang Zhenglang in 1980 as hexagrams written in numerals, show that six-line divination results were being recorded in that period, though not in the words of this text. The date given for this work is a conventional estimate, and the text may have taken shape over several generations."
- id: n.yj.9.4.variants
  attach: yj.9.4
  kind: editorial
  status: draft
  leans_on: "the source pages, sources/wikisource/*.txt (template 另, 'one copy writes'); Legge (1882)"
  text: "The Wikisource pages do not name the edition they transcribe. In 48 places in the core text they print one reading and give another in a tooltip as 一作, 'one copy writes'. This edition follows the printed reading, so that every line can be checked against the page, and some printed readings differ from the Wang Bi text that Legge translated. The one exception is 38.4, where the page prints 𧤊, a character the page's font cannot show, and this edition prints the other copy's 掣. In this line the page prints 車說輹 and gives 輿說輻 as the other copy; Legge's 'a carriage, the strap beneath which has been removed' fits either. In 13.5 the page prints 庸, and Legge's 'city wall' follows the other reading, 墉. In 16.5 the page prints 戠 where the received text has 簪 'hairpin', which Legge's 'friends will gather around him' paraphrases; the gloss follows 簪. The page also writes 恆 for 恒 and, in hexagram 13, 無 beside the 无 used elsewhere. These are differences of graph more often than of sense, but a reader comparing the Chinese with Legge line by line will meet them."
- id: n.yj.1.2.legge
  attach: yj.1.2
  kind: editorial
  status: draft
  leans_on: "Legge (1882), Preface and Introduction (sources/legge1882.txt)"
  text: "The first complete Western translation was in Latin, by the Jesuit Jean-Baptiste Régis and his colleagues in the early 18th century, edited by Julius Mohl in 1834. The first in English was Thomas McClatchie's, published at Shanghai in 1876; Legge read it paragraph by paragraph and found nothing in it he could use. Legge wrote his own first version in 1854 and 1855 and later judged that he had then understood little of the book. The manuscript was soaked in the Red Sea in 1870 and recovered; he returned to the work in 1874 and published the translation printed here in 1882, as volume 16 of the Sacred Books of the East. His words in parentheses are his own additions to the Chinese. Richard Wilhelm's German translation of 1924, rendered into English by Cary F. Baynes in 1950, has been widely read in the West; it is still in copyright and is cited, not reproduced."
