  lead: 'The I Ching or Yijing (Chinese: 易經 Mandarin pronunciation:[î tɕíŋ] ), usually translated as the
    Book of Changes or Classic of Changes, is an ancient Chinese divination text that is among the oldest
    of the Chinese classics. The I Ching was originally a divination manual in the Western Zhou period
    (1000–750 BC). Over the course of the Warring States and early imperial periods (500–200 BC), it transformed
    into a cosmological text with a series of philosophical commentaries known as the Ten Wings. After
    becoming part of the Chinese Five Classics in the 2nd century BC, the I Ching was the basis for divination
    practice for centuries across the Far East and was the subject of scholarly commentary. Between the
    18th and 20th centuries, it took on an influential role in Western understanding of East Asian philosophical
    thought.'
