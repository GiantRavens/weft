# Human overlay for the Zhouyi, hexagrams 49 to 64. No treebank covers the Yijing: lemma, part of
# speech in UD form (Kyoto Classical Chinese conventions, as in texts/daodejing) and the English
# gloss are by hand, draft. Glosses follow docs/schema.md: one character, one cell, hyphenated,
# word order kept. The conventions in the header of curated/hexagrams-01-16.yaml apply here
# unchanged; the additions below cover words that range does not meet.
#
# Additions for this range
# - Lemma is the printed character, except where the page prints a variant graph: 觌 (55.7) takes
#   覿, and 閽 (52.4), for which the page itself gives 薰 as the other copy, takes 薰 "smoking".
# - 之 after a noun in a possessive phrase: the noun keeps its plain gloss and 之 carries "'s"
#   (黃牛之革 "yellow" "ox" "'s" "hide"); 君子之光 keeps the fixed phrase, "lord's" "son" "'s" "light".
# - 未 "not-yet" (ADV|Polarity=Neg); 莫 "none" (ADV|Polarity=Neg, Kyoto 副詞,否定,無界); 弗 "not"
#   (ADV|Polarity=Neg). 爾 "you" PRON|Person=2|PronType=Prs; 是, 斯, 彼 "this" / "that"
#   PRON|PronType=Dem. 宜 "fitting" (VERB|Degree=Pos, like 利).
# - Adverbial nouns of manner keep NOUN and take "-like" in the gloss (虎變 "tiger-like" "changes").
# - Proper names in the lines are PROPN with a capitalised gloss per character, as 帝乙 "Thearch"
#   "Yi": 高宗 "High" "Ancestor", 鬼方 "Ghost" "Land", the place 易 "Yi".
# - 有 before a noun with no sense of possession (王假有廟) is PART "(prefix)".
# - Calendar day 庚 "geng-day" (NOUN), 先庚 / 後庚 "before" / "after" (ADP).
