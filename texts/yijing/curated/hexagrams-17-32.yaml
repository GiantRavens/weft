# Human overlay for the Zhouyi, hexagrams 17 to 32. No treebank covers the Yijing: lemma (the
# character itself, in its traditional form), part of speech in UD form (Kyoto Classical Chinese
# conventions, as in texts/daodejing) and the English gloss are by hand, draft. Glosses follow
# docs/schema.md: one character, one cell, hyphenated, word order kept. The conventions are those
# in the header of curated/hexagrams-01-16.yaml; the mantic formulae read the same here.
#
# Additions in this range
# - Lemma is the character as written, except where the page prints a non-traditional form: 内
#   (29.5) has lemma 內. Where a character stands for another word (亨 for 享, 何 for 荷, 說 for 脫,
#   告 for 牿, 差 for 嗟, 德 for 得 in 23.7, 乾 read gān), the lemma stays the written character and
#   the gloss carries the reading.
# - 爾 "your" is PRON|Person=2|PronType=Prs.
# - 或 is "perhaps" (ADV) as in 1-16, except where it is the subject of a verb with an object of its
#   own and Legge reads "some one": then "someone" (PRON) (25.4 或繫之牛, 32.4 或承之羞).
# - 之 as a verb "to go" (VERB, "going"), in 來之 (29.4).
# - 然 after a descriptive word, like 如 and 若, is "-like" (PART) (30.2 錯然).
# - Reduplicated descriptive words are glossed twice, as in 1-16 (乾乾, 眈眈 "glaring" "glaring").
# - 滅 is "effacing" throughout (21.2, 21.3, 21.7, 28.7), which covers both readings, "cutting off"
#   and "covering over"; see the crux on 21.2.
# - 習坎 (29.1): 習 "doubled" (VERB|Degree=Pos) before the name 坎 "Pit" (PROPN); the section
#   title names the hexagram 坎 alone.
