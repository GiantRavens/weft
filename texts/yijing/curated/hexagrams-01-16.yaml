# Human overlay for the Zhouyi, hexagrams 1 to 16. No treebank covers the Yijing: lemma (the
# character itself), part of speech in UD form (Kyoto Classical Chinese conventions, as in
# texts/daodejing) and the English gloss are by hand, draft. Glosses follow docs/schema.md: one
# character, one cell, hyphenated, word order kept. Hexagrams 17 to 64 are still to be annotated;
# annotators of those ranges should follow the conventions below so the formulae read the same
# throughout.
#
# Conventions for this text
# - Line labels: 初 "first" (NOUN), 上 "top" (NOUN), 九 "nine" and 六 "six" (NUM), 二 to 五 "two" to
#   "five" (NUM), 用 in 用九 / 用六 "use" (VERB).
# - Hexagram names at the head of the judgment: PROPN, glossed with a capitalised English word for
#   the name (乾 "Strength", 小畜 "Small" "Taming"), matching the section title. Where the name is also
#   the first word of the judgment's sentence (履虎尾, 同人于野), it is glossed as that word.
#   Elsewhere in the text the same character is glossed as an ordinary word (鳴謙 "sounding" "modesty").
# - The mantic formulae get one literal gloss each, wherever they occur:
#     元 "prime" (VERB|Degree=Pos)          亨 "penetrating" (VERB); read xiǎng "offering" where it is 享
#     利 "beneficial" (VERB|Degree=Pos)     貞 "divining" (VERB; NOUN after 之, 利牝馬之貞)
#     吉 "auspicious"   凶 "ominous"   厲 "danger" (NOUN)   悔 "regret" (NOUN)   吝 "distress" (NOUN)
#     无咎 "no" "blame"   无不利 "nothing" "not" "beneficial"   悔亡 "regret" "gone"
#     有孚 "have" "trust"   有攸往 "have" "where" "go"   利涉大川 "beneficial" "ford" "great" "river"
#     利見大人 "beneficial" "to-see" "great" "man"   勿用 "do-not" "use"   征 "campaigning"
#     終吉 "in-the-end" "auspicious"   有終 "have" "end"   永貞 "lasting" "divining"   安貞 "settled" "divining"
#   貞 follows the reading of most modern scholarship, "to divine, test by divination", as in the
#   Shang oracle-bone inscriptions; the traditional reading, which Legge translates "correct and
#   firm", is given in the note on hexagram 1. 亨 follows the traditional reading "penetrating,
#   getting through" (Legge's "penetrating"); the reading "offering received" is in the same note.
#   孚 is glossed "trust"; some modern readers take it as "captives" in places.
# - 君子 "lord's" "son", 小人 "small" "men", 大人 "great" "man": the literal phrase, not "gentleman".
# - 无 / 無 (VERB|Polarity=Neg) "no", "without" or "nothing" as the English needs; 匪 "not" (the same
#   tag; it stands for 非); 不 and 勿 are ADV|Polarity=Neg.
# - 如 after a descriptive word "-like" (PART); 之 "'s" when possessive, "him", "it" or "them" as an
#   object pronoun, "(linker)" when it joins a modifier to a noun without possession (不速之客).
# - A two-syllable descriptive word written with two characters that do not mean their parts
#   (磐桓) carries its sense on the first character and "(binome)" on the second.
