# Human overlay for the Zhouyi, hexagrams 33 to 48. No treebank covers the Yijing: lemma (the
# character itself), part of speech in UD form (Kyoto Classical Chinese conventions, as in
# texts/daodejing) and the English gloss are by hand, draft. Glosses follow docs/schema.md: one
# character, one cell, hyphenated, word order kept. The conventions for this text are the ones set
# out at the top of curated/hexagrams-01-16.yaml; this range follows them. Where it needed a rule
# they do not give, it used these:
# - 之 after a noun it possesses: the noun keeps its plain gloss and 之 carries "'s" (大轝之腹 "great"
#   "cart" "'s" "axle-strap"), as in texts/daodejing (天地之始).
# - 有 as a prefix to a noun after 假 or 閑 (王假有家, 王假有廟, 閑有家): "(particle)" (PART).
# - A loan reading is glossed in the sense it carries, lemma unchanged: 說 for 脫 "loosen", 亨 for 享
#   "offering" (亨祀), 莫 for 暮 "dusk", 腹 for 輹 "axle-strap", 荼荼 for 徐徐 "slow".
# - Plant names written with two characters that do not mean their parts (莧陸, 蒺蔾) take the binome
#   rule: the sense on the first character, "(binome)" on the second.
# - 莫 "none" (PRON|PronType=Neg) as in texts/daodejing; 茲 "this" (PRON|PronType=Dem); 而 in 解而拇
#   "your" (PRON|Person=2).
# - 明夷 outside the judgment: 明 "brightness" (NOUN), 夷 "wounded" (VERB); 夬夬 "resolute"
#   "resolute", following 夬履 "resolute" "treading" in hexagram 10.
