predicted_gaps:
- 'the Ten Wings (彖, 大象, 小象, 文言, 繫辭, 說卦, 序卦, 雜卦) are not in this edition: they are commentaries, later than the core text, and the source pages print them after it'
- Old Chinese is a reconstruction (Baxter-Sagart 2014), approximate, and models Zhou speech in general rather than the 9th century; brackets and parentheses in the scholarly form mark uncertain segments
- '91 characters (208 tokens) have no Baxter-Sagart reading and fall back to Zhengzhang Shangfang (oc-from-zhengzhang), among them frequent words of the text: 孚, 涉, 蹇, 艮, 眚'
- in hexagram 38, line 3, the page prints 𧤊 (Unicode Extension B, outside the page's Chinese font) with 掣 as the other copy; Weft prints 掣 there, the one place it departs from the printed reading. 内, 尫,
  觌 and 轝, variant graphs the page uses, take the Old Chinese reading of 內, 尪, 覿 and 輿
- 134 characters (387 tokens) have no Tang reading in Unihan, Stimson's list lacking them, and show ? in the Tang row (reading-missing), among them 亨, 孚, 吝, 弗, 黃; others borrow one from a glyph variant
  (reading-from-variant, 286 tokens; 无 from 無 most often)
- 'Mandarin readings chosen for sense that the Baxter-Sagart list does not give (mandarin-reading-unattested): 說 read tuō ''loosen'' and yuè ''pleased''; choices for characters taken from Zhengzhang carry
  no pinyin to check against'
- the Wikisource pages do not name their base text and in 48 places print one reading with another as 一作; Weft follows the printed reading, which in some places differs from the Wang Bi text Legge translated
  (see the note)
- Wikisource prints modern punctuation; Weft's tokens follow it as caesura marks but do not reproduce it (the source is checked with punctuation, markup and whitespace stripped)
- 'no treebank; lemma, part of speech and gloss by hand, draft, for hexagrams 1 to 16 only in this pass: hexagrams 17 to 64 are not yet annotated (token-no-lemma, token-no-morph, token-no-gloss in weft
  check)'
- 'prose with some rhyme: no metre row'
- one public-domain English translation (Legge 1882). McClatchie's 1876 translation, the first in English, is public domain but no open digitization of it was found; Wilhelm-Baynes (1950) is cited, not
  reproduced
- Legge's text is from the Internet Archive OCR; diacritics in his romanized names (â, ă, î, û) are not reliably kept by the OCR and are not restored; corrections are listed in sense/legge1882.yaml
