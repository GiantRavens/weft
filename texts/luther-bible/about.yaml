  lead: 'The Luther Bible (German: Lutherbibel) is a German language Bible translation by the Protestant
    reformer Martin Luther. A New Testament translation by Luther was first published in September 1522;
    the completed Bible contained 75 books, including the Old Testament, Apocrypha and New Testament,
    which was printed in 1534. Luther continued to make improvements to the text until 1545. It was one
    of the first full translations of the Bible into German that used not only the Latin Vulgate but the
    original Hebrew and Greek.'
