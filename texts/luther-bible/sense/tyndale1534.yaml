# William Tyndale, the New Testament of 1534, John 1:1-14, from sources/tyndale1534-john.usfm
# (eBible.org engtnt), one span per verse, verbatim. The same text Weft's Greek John (nt-john) shows.
translation: tyndale1534
aligned_by: hand, by verse number
spans:
- lines:
  - lb.jn1.1
  - lb.jn1.1
  text: 'In the beginnynge was the worde and the worde was with God: and the worde was God.'
- lines:
  - lb.jn1.2
  - lb.jn1.2
  text: The same was in the beginnynge with God.
- lines:
  - lb.jn1.3
  - lb.jn1.3
  text: All thinges were made by it and with out it was made nothinge that was made.
- lines:
  - lb.jn1.4
  - lb.jn1.4
  text: In it was lyfe and the lyfe was the lyght of men
- lines:
  - lb.jn1.5
  - lb.jn1.5
  text: and the lyght shyneth in the darcknes but the darcknes comprehended it not.
- lines:
  - lb.jn1.6
  - lb.jn1.6
  text: There was a man sent from God whose name was Iohn.
- lines:
  - lb.jn1.7
  - lb.jn1.7
  text: The same cam as a witnes to beare witnes of the lyght that all men through him myght beleve.
- lines:
  - lb.jn1.8
  - lb.jn1.8
  text: 'He was not that lyght: but to beare witnes of the lyght.'
- lines:
  - lb.jn1.9
  - lb.jn1.9
  text: That was a true lyght which lyghteth all men that come into the worlde.
- lines:
  - lb.jn1.10
  - lb.jn1.10
  text: 'He was in the worlde and the worlde was made by him: and yet the worlde knewe him not.'
- lines:
  - lb.jn1.11
  - lb.jn1.11
  text: He cam amonge his (awne) and his awne receaved him not.
- lines:
  - lb.jn1.12
  - lb.jn1.12
  text: 'But as meny as receaved him to them he gave power to be the sonnes of God in that they beleved on his name:'
- lines:
  - lb.jn1.13
  - lb.jn1.13
  text: 'which were borne not of bloude nor of the will of the flesshe nor yet of the will of man: but of God.'
- lines:
  - lb.jn1.14
  - lb.jn1.14
  text: And the worde was made flesshe and dwelt amonge vs and we sawe the glory of it as the glory of the only begotten sonne of the father which worde was full of grace and verite.
