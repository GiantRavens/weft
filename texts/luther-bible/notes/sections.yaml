# Notes for Luther's German Bible in the 1545 text: John 1:1-14 and Psalm 23.
- id: n.lb.editions
  attach: lb.jn1.1
  kind: editorial
  status: draft
  leans_on: "W. Besch, Luther und die deutsche Sprache (2014); H. Volz, introduction to D. Martin Luther, Die gantze Heilige Schrifft Deudsch 1545 (1972); the Zeno.org preface to its transcription"
  text: "Luther translated the New Testament from Erasmus's Greek text while he was at the Wartburg, and it was printed at Wittenberg in September 1522 without his name; it is known as the September Testament. A corrected printing followed in December. The Old Testament appeared in parts from 1523, and the first complete Bible, with the Apocrypha, was printed by Hans Lufft at Wittenberg in 1534. Luther went on revising the text with colleagues at Wittenberg, among them Philipp Melanchthon and Johannes Bugenhagen, and later editions carry their corrections. The edition of 1545 is the last printed in Luther's lifetime; he died in February 1546. It is often called the Ausgabe letzter Hand, the edition of the last hand, and it is the text of this page. Its spelling (Vnd for und, jm for ihm, bey for bei) reflects the practice of the printing house as well as Luther's own."
- id: n.lb.wort
  attach: lb.jn1.1.5
  kind: editorial
  status: draft
  leans_on: "the Greek of John 1:1 as in Weft's edition (SBLGNT, MorphGNT); Goethe, Faust I (1808), Studierzimmer, lines 1224-1237"
  text: "Wort renders the Greek λόγος, which the Latin Vulgate renders verbum. λόγος covers word, speech, account and reason; Wort is the ordinary German word for a word or a saying, as verbum is in Latin. The last clause keeps the Greek order. In θεὸς ἦν ὁ λόγος the article marks ὁ λόγος as the subject and θεὸς as the predicate. In vnd Gott war das Wort both nouns are nominative, and the order is the Greek one; as in the Greek, the article on das Wort is what points to it as the subject. Tyndale and the King James text reorder the clause as the Word was God. The Greek prologue, with its parsing, is in Weft's edition of the Gospel of John (1:1-18). In Goethe's Faust, Faust quotes this sentence ('Geschrieben steht: »Im Anfang war das Wort!«') and tries Sinn, Kraft and That in place of Wort."
- id: n.lb.gloss-licht
  attach: lb.jn1.9.9
  kind: quoted
  source: "Luther's marginal gloss to John 1:9 in the 1545 Bible, as transcribed in the Zeno.org text (TextGrid Repository, textgrid:s71f.0)"
  text: "Das ist / Christus ist das Liecht der welt / derselbige erleuchtet durchs Euangelium alle Menschen. Denn es wird allen Creaturen gepredigt vnd allen furgetragen / die Menschen sind vnd werden."
- id: n.lb.dolmetschen
  attach: lb.ps23.1
  kind: editorial
  status: draft
  leans_on: "Luther, Ein Sendbrief vom Dolmetschen (1530), as in the TextGrid Digitale Bibliothek text (textgrid:s71d.0)"
  text: "In the Sendbrief vom Dolmetschen, an open letter of 1530 defending his rendering of Romans 3:28, Luther describes how he translated. One should not ask the letters of the Latin how to speak German, he writes, but ask the mother at home, the children in the street and the common man in the market, and 'den selbigen auff das maul sehen, wie sie reden, und darnach dolmetzschen': watch their mouths, how they speak, and translate by that. The phrase often quoted today, dem Volk aufs Maul schauen, is a later paraphrase of this passage, not Luther's wording. The same letter sets limits on the principle: where much depends on a passage, he says, he and his helpers kept to the letter. Psalm 23 shows the register he aimed at. Mir wird nichts mangeln, I shall lack nothing, is everyday German."
- id: n.lb.psalm-choices
  attach: lb.ps23.2.12
  kind: editorial
  status: draft
  leans_on: "the Hebrew of Psalm 23:2 and 23:4 (Masoretic text); the King James text and its margin; Coverdale's Bible (1535) and its title page"
  text: "The Hebrew of verse 2 reads, word for word, on waters of rests he leads me; the noun is the plural of a word for rest or a resting place. The King James text has still waters and gives waters of quietness in the margin. Luther's zum frisschen Wasser, to the fresh water, does not translate the word for rest. It names what water at a resting place is for a flock: water fit to drink. Coverdale's to a fresh water (1535) agrees with Luther, and Coverdale's title page says his Bible was translated out of Douche and Latyn, from German and Latin versions. The spelling frisschen, with ss before ch, is the print's. Verse 4 shows a different kind of choice. The Hebrew word ṣalmāwet was long read as a compound, shadow of death, as in the Latin umbra mortis, in Coverdale and in the King James text. Luther gives im finstern Tal, in the dark valley, which matches the view of many modern lexica that the word means deep darkness. Here Coverdale does not follow Luther. Weft has no edition of the Hebrew Psalms yet."
- id: n.lb.influence
  attach: lb.ps23.6
  kind: editorial
  status: draft
  leans_on: "P. von Polenz, Deutsche Sprachgeschichte, volume 1 (2nd edition, 2000); W. Besch, Luther und die deutsche Sprache (2014); Luther, Tischreden, WA TR 1, no. 1040, as usually cited"
  text: "The claim that Luther created the German written language is stronger than the evidence. Printed German Bibles existed before him, from the Mentelin Bible of 1466 on; fourteen High German and four Low German printings before 1522 are usually counted. Written German was already converging on regional norms, of which the chancery language of Electoral Saxony was one, and Luther said in a remark recorded in his Table Talk that he spoke according to the Saxon chancery. What his Bible added was reach. Lufft's workshop alone is often estimated to have printed about 100,000 copies between 1534 and 1574, besides reprints elsewhere, and the text was read aloud in churches and schools. Through it, East Central German forms and words gained ground in the Upper German south and the Low German north, and many of its phrasings stayed in use. The later standard was fixed by grammarians, printers and dictionaries in the 17th and 18th centuries, and it differs from Luther's in spelling and in some forms, as the modern spelling row of this page shows."
- id: n.lb.tyndale
  attach: lb.jn1.3
  kind: editorial
  status: draft
  leans_on: "D. Daniell, William Tyndale: A Biography (1994); B. F. Westcott, A General View of the History of the English Bible (1868); the texts on this page"
  text: "Tyndale translated the New Testament from Erasmus's Greek, as Luther had, with Luther's German and the Latin Vulgate at hand. The dependence on Luther is clearest outside the Bible text: the fragment printed at Cologne in 1525 has a prologue and marginal notes drawn in large part from the September Testament, and Tyndale's New Testament places Hebrews, James, Jude and Revelation at the end, as Luther's does. In the wording, agreement alone shows little, because both follow the Greek closely. One point in this passage can be compared. Luther refers to the Word with neuter forms (dasselbige, jm, es), agreeing with das Wort, until verse 11 turns to the person (ER kam). Tyndale likewise uses it (by it, In it was lyfe, the glory of it), where the King James text has him. Tyndale's it agrees with Luther, but it is also what English grammar gives for a word, so the agreement does not by itself show borrowing."
- id: n.lb.sound
  attach: lb.jn1.2
  kind: editorial
  status: draft
  leans_on: "V. Ickelsamer, Die rechte weis aufs kürtzist lesen zu lernen (1527) and Ein Teütsche Grammatica (about 1534); F. Frangk, Orthographia (1531); P. von Polenz, Deutsche Sprachgeschichte, volume 1 (2000)"
  text: "The first sound scheme reconstructs East Central German as spoken and read in Wittenberg in the 1540s, and it is approximate. It is computed from the 1545 form of each word, so gleuben is said with the diphthong of the print and Liecht with a long ee. The features modelled are those that Luther's spelling and the histories of the language support for the region: the diphthongs ei, au and eu, already present (bey, Hause, auff); the soft, unaspirated stops of Central German, in which p and b, t and d were not kept apart, as the spellings Deudsch and Heubt suggest (Tal is said with a d); a w made with both lips; a trilled r; and the final e that Luther keeps. The reading and spelling books of the period, such as Ickelsamer's and Frangk's, describe the letters by their sounds and support the outline, not the details. The exact values of the diphthongs are uncertain. The dialects of Upper Saxony unround ü and ö; the print keeps them, and the scheme follows the print. There is no description of Luther's own speech specific enough to model."
