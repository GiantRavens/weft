# Hand lemma, morphology and gloss for Luther's 1545 Bible, John 1:1-14 and Psalm 23. No treebank
# exists for Early New High German Bible text in an open license that covers these passages. Lemmas
# are modern headwords (Duden; Grimm, Deutsches Wörterbuch; for Luther's usage the Frühneuhochdeutsches
# Wörterbuch and Dietz, Wörterbuch zu Dr. Martin Luthers deutschen Schriften); morphology uses Universal
# Dependencies features as in UD German-HDT. A contraction (im, zum, vom, habens) carries both parts
# joined with +. Separable particles stand where printed (namen ... auff, schenckest ... ein), glossed
# alone. Glosses follow docs/schema.md: compounds by their parts, word order kept. HERR, which Luther
# prints in capitals where the Hebrew has the divine name, is glossed LORD, as the King James Version prints it.
