# Weft edition of two passages of Luther's German Bible in the text of the Wittenberg edition of
# 1545 (Biblia: das ist: Die gantze Heilige Schrifft: Deudsch. Auffs new zugericht. Wittenberg:
# Hans Lufft, 1545), the last edition printed in Luther's lifetime.
#
# jn1   John 1:1-14, the opening of the Gospel of John (Das Euangelium S. Johannes), chapter I.
# ps23  Psalm 23, with its title (Ein Psalm Dauids), which the source sets as part of verse 1.
#
# Text of the TextGrid Repository, Digitale Bibliothek, "Luther-Bibel 1545" (textgrid:s71f.0), the
# Zeno.org transcription, which Zeno states follows the 1545 edition through Hans Volz's edition
# (Munich, 1972). Checked against that TEI file by the sensor in pipeline/weft/german.py (section
# field check, format textgrid-tei), which drops the verse numbers and note anchors the transcription
# adds and compares without spaces. The transcription prints long s as s and the superscript e of the
# umlauts as ü and ö; the 1545 spelling is otherwise kept (Vnd, jm, bey, Liecht, gleuben, Heubt,
# frisschen), with the capitals of the first word of a paragraph (JM, ES, ER, DER, VNd, DV).
#
# Lines are verses. Luther's virgule (/) is punctuation and stays with the word before it.
#
#   t     the word as printed, punctuation attached ("Wort /", "Gott.")
#   n     the modern spelling of the same word form (bey: bei, Liecht: Licht, gleuben: glauben);
#         the page shows it as "Modern spelling", and the modern scheme is computed from it
#   o     the 1545 form normalized for reading, where the rule in pipeline/weft/german.py
#         (old_form: u/v and i/j by sound, aw as au, ssch as sch) does not give it: jm as ihm (the
#         pronoun, a long vowel) against Jn as in (the preposition). The first scheme, ecg1545, is
#         computed from this form, not from the modern spelling
#   ipa   {scheme: ipa} override for this occurrence
