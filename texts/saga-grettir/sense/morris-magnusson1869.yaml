# Verbatim from sources/morris-magnusson1869.txt, chapter XIV (whitespace normalized).
# Sentences 10-104 added 2026-10-17. The <i> markup the transcription puts around the proverbs (33, 35, 48, 83, 88)
# is dropped; the three verses rendered after lines 31, 53 and 94 are left out, since IcePaHC, the edition, does not
# carry them (see predicted_gaps). A double hyphen is the transcription's dash.
translation: morris-magnusson1869
aligned_by: hand, phase 0; clause spans against IcePaHC sentences
spans:
- lines:
  - gre.14.1
  - gre.14.1
  text: Asmund the Greyhaired kept house at Biarg; great and proud was his household, and many men he had about him,
- lines:
  - gre.14.2
  - gre.14.2
  text: and was a man much beloved.
- lines:
  - gre.14.3
  - gre.14.3
  text: These were the children of him and Asdis.
- lines:
  - gre.14.4
  - gre.14.6
  text: 'Atli was the eldest son; a man yielding and soft-natured, easy, and meek withal, and all men liked him well:'
- lines:
  - gre.14.7
  - gre.14.7
  text: another son they had called Grettir;
- lines:
  - gre.14.8
  - gre.14.8
  text: he was very froward in his childhood; of few words, and rough; worrying both in word and deed.
- lines:
  - gre.14.9
  - gre.14.9
  text: Little fondness he got from his father Asmund, but his mother loved him right well.
- lines:
  - gre.14.10
  - gre.14.10
  text: "Grettir Asmundson was fair to look on, broad-faced, short-faced, red-haired, and much freckled; not of quick growth in his childhood."
- lines:
  - gre.14.11
  - gre.14.11
  text: "Thordis was a daughter of Asmund, whom Glum, the son of Uspak, the son of Kiarlak of Skridinsenni, afterwards had to wife."
- lines:
  - gre.14.12
  - gre.14.15
  text: "Ranveig was another daughter of Asmund; she was the wife of Gamli, the son of Thorhal, the son of the Vendlander; they kept house at Meals in Ramfirth; their son was Grim."
- lines:
  - gre.14.16
  - gre.14.16
  text: "The son of Glum and Thordis, the daughter of Asmund, was Uspak, who quarrelled with Odd, the son of Ufeigh, as is told in the Bandamanna Saga."
- lines:
  - gre.14.17
  - gre.14.20
  text: "Grettir grew up at Biarg till he was ten years old; then he began to get on a little; but Asmund bade him do some work; Grettir answered that work was not right meet for him, but asked what he should do."
- lines:
  - gre.14.21
  - gre.14.21
  text: "Says Asmund, \"Thou shalt watch my home-geese.\""
- lines:
  - gre.14.22
  - gre.14.22
  text: "Grettir answered and said, \"A mean work, a milksop's work.\""
- lines:
  - gre.14.23
  - gre.14.23
  text: "Asmund said, \"Turn it well out of hand, and then matters shall get better between us.\""
- lines:
  - gre.14.24
  - gre.14.27
  text: "Then Grettir betook himself to watching the home-geese; fifty of them there were, with many goslings; but no long time went by before he found them a troublesome drove, and the goslings slow-paced withal. Thereat he got sore worried, for little did he keep his temper in hand."
- lines:
  - gre.14.28
  - gre.14.29
  text: "So some time after this, wayfaring men found the goslings strewn about dead, and the home-geese broken-winged; and this was in autumn."
- lines:
  - gre.14.30
  - gre.14.31
  text: "Asmund was mightily vexed hereat, and asked if Grettir had killed the fowl: he sneered mockingly, and answered--"
- lines:
  - gre.14.32
  - gre.14.32
  text: "\"Thou shalt kill them no more,\" said Asmund."
- lines:
  - gre.14.33
  - gre.14.33
  text: "\"Well, a friend should warn a friend of ill,\" said Grettir."
- lines:
  - gre.14.34
  - gre.14.34
  text: "\"Another work shall be found for thee then,\" said Asmund."
- lines:
  - gre.14.35
  - gre.14.36
  text: "\"More one knows the more one tries,\" said Grettir; \"and what shall I do now?\""
- lines:
  - gre.14.37
  - gre.14.37
  text: "Asmund answered, \"Thou shalt rub my back at the fire, as I have been wont to have it done.\""
- lines:
  - gre.14.38
  - gre.14.39
  text: "\"Hot for the hand, truly,\" said Grettir; \"but still a milksop's work.\""
- lines:
  - gre.14.40
  - gre.14.42
  text: "Now Grettir went on with this work for a while; but autumn came on, and Asmund became very fain of heat, and he spurs Grettir on to rub his back briskly."
- lines:
  - gre.14.43
  - gre.14.46
  text: "Now, in those times there were wont to be large fire-halls at the homesteads, wherein men sat at long fires in the evenings; boards were set before the men there, and afterwards folk slept out sideways from the fires; there also women worked at the wool in the daytime."
- lines:
  - gre.14.47
  - gre.14.47
  text: "Now, one evening, when Grettir had to rub Asmund's back, the old carle said,-- \"Now thou wilt have to put away thy sloth, thou milk-sop.\""
- lines:
  - gre.14.48
  - gre.14.48
  text: "Says Grettir, \"Ill is it to goad the foolhardy.\""
- lines:
  - gre.14.49
  - gre.14.49
  text: "Asmund answers, \"Thou wilt ever be a good-for-nought.\""
- lines:
  - gre.14.50
  - gre.14.51
  text: "Now Grettir sees where, in one of the seats stood wool-combs: one of these he caught up, and let it go all down Asmund's back. He sprang up, and was mad wroth thereat; and was going to smite Grettir with his staff, but he ran off."
- lines:
  - gre.14.52
  - gre.14.53
  text: "Then came the housewife, and asked what was this to-do betwixt them. Then Grettir answered by this ditty--"
- lines:
  - gre.14.54
  - gre.14.54
  text: "Hereupon was his mother sore vexed, that he should have taken to a trick like this; she said he would never fail to be the most reckless of men."
- lines:
  - gre.14.55
  - gre.14.55
  text: "All this nowise bettered matters between Asmund and Grettir."
- lines:
  - gre.14.56
  - gre.14.57
  text: "Now, some time after this, Asmund had a talk with Grettir, that he should watch his horses. Grettir said this was more to his mind than the back-rubbing."
- lines:
  - gre.14.58
  - gre.14.62
  text: "\"Then shalt thou do as I bid thee,\" said Asmund. \"I have a dun mare, which I call Keingala; she is so wise as to shifts of weather, thaws, and the like, that rough weather will never fail to follow, when she will not go out on grazing. At such times thou shalt lock the horses up under cover; but keep them to grazing on the mountain neck yonder, when winter comes on. Now I shall deem it needful that thou turn this work out of hand better than the two I have set thee to already.\""
- lines:
  - gre.14.63
  - gre.14.64
  text: "Grettir answered, \"This is a cold work and a manly, but I deem it ill to trust in the mare, for I know none who has done it yet.\""
- lines:
  - gre.14.65
  - gre.14.66
  text: "Now Grettir took to the horse-watching, and so the time went on till past Yule-time; then came on much cold weather with snow, that made grazing hard to come at."
- lines:
  - gre.14.67
  - gre.14.68
  text: "Now Grettir was ill clad, and as yet little hardened, and he began to be starved by the cold; but Keingala grazed away in the windiest place she could find, let the weather be as rough as it would."
- lines:
  - gre.14.69
  - gre.14.69
  text: "Early as she might go to the pasture, never would she go back to stable before nightfall."
- lines:
  - gre.14.70
  - gre.14.71
  text: "Now Grettir deemed that he must think of some scurvy trick or other, that Keingala might be paid in full for her way of grazing: so, one morning early, he comes to the horse-stable, opens it, and finds Keingala standing all along before the crib; for, whatever food was given to the horses with her, it was her way to get it all to herself."
- lines:
  - gre.14.72
  - gre.14.73
  text: "Grettir got on her back, and had a sharp knife in his hand, and drew it right across Keingala's shoulder, and then all along both sides of the back."
- lines:
  - gre.14.74
  - gre.14.74
  text: "Thereat the mare, being both fat and shy, gave a mad bound, and kicked so fiercely, that her hooves clattered against the wall."
- lines:
  - gre.14.75
  - gre.14.75
  text: "Grettir fell off; but, getting on his legs, strove to mount her again."
- lines:
  - gre.14.76
  - gre.14.78
  text: "Now their struggle is of the sharpest, but the end of it is, that he flays off the whole of the strip along the back to the loins. Thereafter he drove the horses out on grazing; Keingala would bite but at her back, and when noon was barely past, she started off, and ran back to the house."
- lines:
  - gre.14.79
  - gre.14.79
  text: "Grettir now locks the stable and goes home."
- lines:
  - gre.14.80
  - gre.14.80
  text: "Asmund asked Grettir where the horses were."
- lines:
  - gre.14.81
  - gre.14.81
  text: "He said that he had stabled them as he was wont."
- lines:
  - gre.14.82
  - gre.14.82
  text: "Asmund said that rough weather was like to be at hand, as the horses would not keep at their grazing in such good weather as now it was."
- lines:
  - gre.14.83
  - gre.14.83
  text: "Grettir said, \"Oft fail in wisdom folk of better trust.\""
- lines:
  - gre.14.84
  - gre.14.85
  text: "Now the night goes by, but no rough weather came on. Grettir drove off the horses, but Keingala cannot bear the grazing."
- lines:
  - gre.14.86
  - gre.14.86
  text: "This seemed strange to Asmund, as the weather changed in nowise from what it had been theretofore."
- lines:
  - gre.14.87
  - gre.14.87
  text: "The third morning Asmund went to the horses, and, coming to Keingala, said,-- \"I must needs deem these horses to be in sorry case, good as the winter has been, but thy sides will scarce lack flesh, my dun.\""
- lines:
  - gre.14.88
  - gre.14.88
  text: "\"Things boded will happen,\" said Grettir, \"but so will things unboded.\""
- lines:
  - gre.14.89
  - gre.14.91
  text: "Asmund stroked the back of the mare, and, lo, the hide came off beneath his hand; he wondered how this could have happened, and said it was likely to be Grettir's doing. Grettir sneered mockingly, but said nought."
- lines:
  - gre.14.92
  - gre.14.93
  text: "Now goodman Asmund went home talking as one mad; he went straight to the fire-hall, and as he came heard the good wife say, \"It were good indeed if the horse-keeping of my kinsman had gone off well.\""
- lines:
  - gre.14.94
  - gre.14.94
  text: "Then Asmund sang this stave--"
- lines:
  - gre.14.95
  - gre.14.95
  text: "The housewife answered, \"I know not which is least to my mind, that thou shouldst ever be bidding him work, or that he should turn out all his work in one wise.\""
- lines:
  - gre.14.96
  - gre.14.97
  text: "\"That too we will make an end of,\" said Asmund, \"but he shall fare the worse therefor.\""
- lines:
  - gre.14.98
  - gre.14.104
  text: "Then Grettir said, \"Well, let neither make words about it to the other.\" So things went on awhile, and Asmund had Keingala killed; and many other scurvy tricks did Grettir in his childhood whereof the story says nought. But he grew great of body, though his strength was not well known, for he was unskilled in wrestling; he would make ditties and rhymes, but was somewhat scurrilous therein. He had no will to lie anight in the fire-hall and was mostly of few words."
