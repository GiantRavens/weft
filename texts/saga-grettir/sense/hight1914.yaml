# Verbatim from sources/hight1914.txt, chapter XIV (whitespace normalized). The three verses Hight renders
# after lines 31, 53 and 94 are left out, since IcePaHC, the edition, does not carry them (see predicted_gaps).
translation: hight1914
aligned_by: hand, phase 0; clause spans against IcePaHC sentences
spans:
- lines:
  - gre.14.1
  - gre.14.2
  text: Asmund Longhair now set up a large and sumptuous household in Bjarg, where he maintained a numerous retinue and became very popular.
- lines:
  - gre.14.3
  - gre.14.6
  text: 'His children were as follows: The eldest was Atli, an able and accomplished man, tactful and easy to deal with; he was much liked by all.'
- lines:
  - gre.14.7
  - gre.14.7
  text: His second son was called Grettir.
- lines:
  - gre.14.8
  - gre.14.8
  text: He was very hard to manage in his bringing up. He spoke little and was rough in his manners and quarrelsome, both in words and deeds.
- lines:
  - gre.14.9
  - gre.14.9
  text: He got little affection from his father Asmund, but his mother loved him dearly.
- lines:
  - gre.14.10
  - gre.14.10
  text: "Grettir was a handsome man in appearance, with a face rather broad and short, red-haired and somewhat freckled; not very precocious in his youth."
- lines:
  - gre.14.11
  - gre.14.11
  text: "There was a daughter named Thordis, who afterwards married Glum the son of Ospak, Kjallak's son from Skridinsenni."
- lines:
  - gre.14.12
  - gre.14.15
  text: "Another daughter was named Rannveig; she married Gamli the son of Thorhall of Vineland, and they dwelt at Melar in Hrutafjord and had a son named Grim."
- lines:
  - gre.14.16
  - gre.14.16
  text: "Glum and Thordis had a son named Ospak who fell into a dispute with Odd the son of Ofeig, which is told of in the \"Saga of the Banded Men.\""
- lines:
  - gre.14.17
  - gre.14.18
  text: "Grettir grew up at Bjarg until he was ten years old, when he began to develop a little."
- lines:
  - gre.14.19
  - gre.14.20
  text: "Asmund told him that he must do some work. Grettir said that would not suit him very well, but asked what he was to do."
- lines:
  - gre.14.21
  - gre.14.21
  text: "\"You must mind the geese,\" said Asmund."
- lines:
  - gre.14.22
  - gre.14.22
  text: "\"That is wretched work, only fit for an idiot,\" Grettir answered."
- lines:
  - gre.14.23
  - gre.14.23
  text: "\"You do that properly,\" his father said, \"and we shall get on better together.\""
- lines:
  - gre.14.24
  - gre.14.24
  text: "So Grettir went to mind the geese."
- lines:
  - gre.14.25
  - gre.14.25
  text: "There were fifty of them, and a number of goslings."
- lines:
  - gre.14.26
  - gre.14.26
  text: "Before long he began to find them troublesome, and the goslings would not come on quickly enough."
- lines:
  - gre.14.27
  - gre.14.27
  text: "This put him out, for he could never control his temper."
- lines:
  - gre.14.28
  - gre.14.28
  text: "Soon afterwards some wanderers found the goslings lying outside dead, and the geese with their wings broken."
- lines:
  - gre.14.29
  - gre.14.29
  text: "This was in the autumn."
- lines:
  - gre.14.30
  - gre.14.30
  text: "Asmund was very much annoyed and asked Grettir whether he had killed the birds."
- lines:
  - gre.14.31
  - gre.14.31
  text: "Grettir grinned and answered:"
- lines:
  - gre.14.32
  - gre.14.32
  text: "\"You shan't twist any more of their necks,\" said Asmund."
- lines:
  - gre.14.33
  - gre.14.33
  text: "\"The friend aye warns his friend of ill,\" answered Grettir."
- lines:
  - gre.14.34
  - gre.14.34
  text: "\"I will give you other work to do.\""
- lines:
  - gre.14.35
  - gre.14.36
  text: "\"He knoweth most who most hath tried. But what am I to do now?\" Grettir asked."
- lines:
  - gre.14.37
  - gre.14.37
  text: "\"You shall rub my back when I am sitting by the fire, as I am in the habit of having it done.\""
- lines:
  - gre.14.38
  - gre.14.39
  text: "\"Warm work for the hands.\" he answered. \"It is only fit for an idiot.\""
- lines:
  - gre.14.40
  - gre.14.40
  text: "This for a time was Grettir's occupation."
- lines:
  - gre.14.41
  - gre.14.42
  text: "As the autumn advanced Asmund wanted more warmth, and was constantly telling Grettir to rub his back hard."
- lines:
  - gre.14.43
  - gre.14.45
  text: "It was the custom in those days for people to have large rooms with long fires in them in their houses, where men sat by the fire in the evenings on benches, sleeping afterwards at the side away from the fires."
- lines:
  - gre.14.46
  - gre.14.46
  text: "By day the women carded their wool there."
- lines:
  - gre.14.47
  - gre.14.47
  text: "One evening when Grettir had to scratch Asmund's back his father said to him: \"Now you will have to put aside your laziness, you good-for-nothing you.\""
- lines:
  - gre.14.48
  - gre.14.48
  text: "Grettir answered: \"`Tis ill to rouse a hasty temper.\""
- lines:
  - gre.14.49
  - gre.14.49
  text: "\"You are fit for nothing at all,\" said Asmund."
- lines:
  - gre.14.50
  - gre.14.51
  text: "Grettir saw some wood-combs lying on one of the benches; he took up one of them and drew it along Asmund's back. Asmund sprang up and was going to thrash him with his stick, but he escaped."
- lines:
  - gre.14.52
  - gre.14.53
  text: "His mother came up and asked what they were fighting about. Grettir answered in a verse:"
- lines:
  - gre.14.54
  - gre.14.54
  text: "His mother was much vexed with Grettir for what he had done and said he would not grow up very prudent."
- lines:
  - gre.14.55
  - gre.14.55
  text: "The affair did not improve the relations between Asmund and his son."
- lines:
  - gre.14.56
  - gre.14.57
  text: "Soon after this Asmund spoke to Grettir and told him to look after his horses. Grettir said that would be better than back-fire-warming."
- lines:
  - gre.14.58
  - gre.14.62
  text: "\"You are to do what I tell you,\" said Asmund. \"I have a dun mare with a dark stripe down her back whom I call Keingala. She is very knowing about the weather and about rain coming. When she refuses to graze it never fails that a storm will follow. You are then to keep the horses under shelter in the stables, and when cold weather sets in keep them to the north of the ridge. I hope you will perform this duty better than the two which I gave you before.\""
- lines:
  - gre.14.63
  - gre.14.64
  text: "Grettir said: \"That is cold work, and fit for a man to do; but it seems to me rash to trust to the mare, when to my knowledge no one has done so before.\""
- lines:
  - gre.14.65
  - gre.14.66
  text: "So Grettir took to minding the horses, and went on until Yule-tide was past, when very cold weather set in, with snow, so that grazing was difficult."
- lines:
  - gre.14.67
  - gre.14.67
  text: "He was very badly provided with clothes and little hardened to the weather."
- lines:
  - gre.14.68
  - gre.14.68
  text: "He began to feel it very cold, and Keingala always chose the windiest places whatever the weather was."
- lines:
  - gre.14.69
  - gre.14.69
  text: "She never came to the meadow early enough to get home before nightfall."
- lines:
  - gre.14.70
  - gre.14.70
  text: "Grettir then thought he would play a trick upon Keingala to pay her out for her wanderings."
- lines:
  - gre.14.71
  - gre.14.71
  text: "One morning early he came to the stables, opened the door and found Keingala standing in front of the manger. She had taken the whole of the fodder which had been given to all the horses for herself."
- lines:
  - gre.14.72
  - gre.14.73
  text: "Grettir jumped upon her back, with a sharp knife in his hand which he drew across her shoulder and along her back on both sides."
- lines:
  - gre.14.74
  - gre.14.74
  text: "The horse was fat and fresh; she shied back very frightened and kicked out till her hoofs rattled against the walls."
- lines:
  - gre.14.75
  - gre.14.75
  text: "Grettir fell off, but picked himself up and tried to mount her again."
- lines:
  - gre.14.76
  - gre.14.76
  text: "There was a sharp struggle, which ended in his shaving all the skin on her back down to her flank. Then he drove the horses out to the meadow."
- lines:
  - gre.14.77
  - gre.14.78
  text: "Keingala would not take a bite except off her back, and soon after noon she bolted off to the stables."
- lines:
  - gre.14.79
  - gre.14.79
  text: "Grettir locked the door and went home."
- lines:
  - gre.14.80
  - gre.14.81
  text: "Asmund asked him where the horses were; he said he had looked after them as usual."
- lines:
  - gre.14.82
  - gre.14.82
  text: "Asmund said there must be a storm close at hand if the horses would not stay out in such weather as there was then."
- lines:
  - gre.14.83
  - gre.14.83
  text: "Grettir said: \"Many seem wise who are lacking in wit.\""
- lines:
  - gre.14.84
  - gre.14.84
  text: "The night passed and there was no storm."
- lines:
  - gre.14.85
  - gre.14.85
  text: "Grettir drove out the horses, but Keingala could not endure the pasture."
- lines:
  - gre.14.86
  - gre.14.86
  text: "Asmund thought it very strange that no change came in the weather."
- lines:
  - gre.14.87
  - gre.14.87
  text: "On the third morning he went himself to the horses and on seeing Keingala he said: \"Ill indeed have the horses fared in this beautiful weather! Thy back will not deceive me, my Bleikala.\""
- lines:
  - gre.14.88
  - gre.14.88
  text: "\"The likely may happen--also the unlikely,\" said Grettir."
- lines:
  - gre.14.89
  - gre.14.90
  text: "Asmund stroked the back of the horse and all her coat came off on his hand. He could not understand how she had got into that state and thought Grettir must have done it."
- lines:
  - gre.14.91
  - gre.14.91
  text: "Grettir grinned and said nothing."
- lines:
  - gre.14.92
  - gre.14.93
  text: "Asmund went home and became very abusive. He heard his wife say: \"My son's watching of the horses must have prospered well.\""
- lines:
  - gre.14.94
  - gre.14.94
  text: "Then he spoke a verse:"
- lines:
  - gre.14.95
  - gre.14.95
  text: "\"I do not know,\" she said, \"which seems to me the more perverse, for you to make him work, or for him always to get out of it in the same way.\""
- lines:
  - gre.14.96
  - gre.14.97
  text: "\"Now there shall be an end to it,\" said Asmund. \"He must have something worse than merely making good the damage.\""
- lines:
  - gre.14.98
  - gre.14.98
  text: "\"Let neither speak of it to the other,\" said Grettir, and so it remained."
- lines:
  - gre.14.99
  - gre.14.100
  text: "Asmund had Keingala killed. Many more childish pranks did Grettir play which are not told in the saga."
- lines:
  - gre.14.101
  - gre.14.102
  text: "He now began to grow very big, but men did not clearly know what strength he had because he had never been tried in wrestling."
- lines:
  - gre.14.103
  - gre.14.103
  text: "He kept making verses and ditties which were always a little ironical."
- lines:
  - gre.14.104
  - gre.14.104
  text: "He did not sleep in the common room and was generally very silent."
