# Notes for Grettis saga chapter 14.
- id: n.gre.14.1.spelling
  attach: gre.14.1
  kind: editorial
  status: draft
  text: "The treebank prints the saga in modern Icelandic spelling: Ásmundur, not the medieval Ásmundr. Weft's default reading is still Old Norse, the language as it sounded when the saga was written around 1310, reconstructed from the modern spelling, so treat it as approximate. Modern Icelandic, the way Icelanders read their sagas today, is the second choice in the Loom."
- id: n.gre.14.1.haerulangur
  attach: gre.14.1.2
  kind: editorial
  status: draft
  text: "A nickname. Hæra means grey hair and langur means long, so it may be 'long grey-haired'. The two translators split it: Morris and Magnússon write 'the Greyhaired', Hight writes 'Longhair'."
- id: n.gre.14.3.theirra
  attach: gre.14.3.4
  kind: editorial
  status: draft
  text: "Þeirra Ásdísar, literally 'of them, of Ásdís': an Old Icelandic way of naming a pair by one member. It means the children of Ásmundur and Ásdís."
- id: n.gre.14.7.grettir
  attach: gre.14.7.6
  kind: editorial
  status: draft
  text: "Grettir's first appearance. He becomes the most famous outlaw of the sagas, surviving for years on the run in the Icelandic wilderness. The saga introduces him in one sentence, then turns straight to his character."
- id: n.gre.14.8.odaell
  attach: gre.14.8.4
  kind: editorial
  status: draft
  text: "Ódæll, 'hard to deal with', from ó- 'un-' and dæll 'easy'. Sagas rarely describe a character's inside directly; this list of adjectives is as close as they come, and every one of them comes true."
- id: n.gre.14.9.love
  attach: gre.14.9
  kind: editorial
  status: draft
  text: "The sentence is built as a hinge: his father's lack of love, then en, 'but', and his mother's love. The saga returns to this split between father and son in the chapters that follow."
