# Notes for Grettis saga chapter 14.
- id: n.gre.14.1.spelling
  attach: gre.14.1
  kind: editorial
  status: draft
  text: "The treebank prints the saga in modern Icelandic spelling: Ásmundur, not the medieval Ásmundr. Weft's default reading is still Old Norse, the language as it sounded when the saga was written around 1310, reconstructed from the modern spelling, so treat it as approximate. Modern Icelandic, the way Icelanders read their sagas today, is the second choice in the Loom."
- id: n.gre.14.1.haerulangur
  attach: gre.14.1.2
  kind: editorial
  status: draft
  text: "A nickname. Hæra means grey hair and langur means long, so it may be 'long grey-haired'. The two translators split it: Morris and Magnússon write 'the Greyhaired', Hight writes 'Longhair'."
- id: n.gre.14.3.theirra
  attach: gre.14.3.4
  kind: editorial
  status: draft
  text: "Þeirra Ásdísar, literally 'of them, of Ásdís': an Old Icelandic way of naming a pair by one member. It means the children of Ásmundur and Ásdís."
- id: n.gre.14.7.grettir
  attach: gre.14.7.6
  kind: editorial
  status: draft
  text: "Grettir's first appearance. He becomes the best-known outlaw of the Icelandic sagas, surviving for years in the wilderness. The saga introduces him in one sentence, then moves directly to his character."
- id: n.gre.14.8.odaell
  attach: gre.14.8.4
  kind: editorial
  status: draft
  text: "Ódæll, 'hard to deal with', from ó- 'un-' and dæll 'easy'. Sagas rarely describe a character's temperament directly; this passage is an unusually explicit sketch, and the chapters that follow bear it out."
- id: n.gre.14.9.love
  attach: gre.14.9
  kind: editorial
  status: draft
  text: "The sentence sets his father's lack of affection against his mother's, joined by en, 'but'. The conflict between father and son recurs in the chapters that follow."
