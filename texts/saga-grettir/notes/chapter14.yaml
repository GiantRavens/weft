# Notes for Grettis saga chapter 14.
- id: n.gre.14.1.spelling
  attach: gre.14.1
  kind: editorial
  status: draft
  text: "The treebank prints the saga in modern Icelandic spelling: Ásmundur, not the medieval Ásmundr. Weft's default reading is still Old Norse, the language as it sounded when the saga was written around 1310, reconstructed from the modern spelling, so treat it as approximate. Modern Icelandic, the way Icelanders read their sagas today, is the second choice in the Loom."
- id: n.gre.14.1.haerulangur
  attach: gre.14.1.2
  kind: editorial
  status: draft
  text: "A nickname. Hæra means gray hair and langur means long, so it may be 'long gray-haired'. The two translators split it: Morris and Magnússon write 'the Greyhaired', Hight writes 'Longhair'."
- id: n.gre.14.3.theirra
  attach: gre.14.3.4
  kind: editorial
  status: draft
  text: "Þeirra Ásdísar, literally 'of them, of Ásdís': an Old Icelandic way of naming a pair by one member. It means the children of Ásmundur and Ásdís."
- id: n.gre.14.7.grettir
  attach: gre.14.7.6
  kind: editorial
  status: draft
  text: "Grettir's first appearance. He becomes the outlaw at the center of the saga, surviving for years in the wilderness. The saga introduces him in one sentence, then moves directly to his character."
- id: n.gre.14.8.odaell
  attach: gre.14.8.4
  kind: editorial
  status: draft
  text: "Ódæll, 'hard to deal with', from ó- 'un-' and dæll 'easy'. Sagas rarely describe a character's temperament directly; this passage is an unusually explicit sketch, and the chapters that follow bear it out."
- id: n.gre.14.9.love
  attach: gre.14.9
  kind: editorial
  status: draft
  text: "The sentence sets his father's lack of affection against his mother's, joined by en, 'but'. The conflict between father and son recurs in the chapters that follow."
- id: n.gre.14.21.tasks
  attach: gre.14.21
  kind: editorial
  status: draft
  leans_on: "the saga text; the two translations on this page"
  text: "The chapter is built on three tasks Asmund sets his son: minding the geese, rubbing his father's back by the fire, and keeping the horses through the winter. Grettir calls the first two löðurmannlegt, work fit for a lesser man, and the third kalt verk og karlmannlegt, 'cold work and manly'. Each time he does the work in a way that defeats its purpose. The geese die, the wool-comb goes down Asmund's back, and the mare Kengála is flayed."
- id: n.gre.14.33.proverbs
  attach: gre.14.33
  kind: editorial
  status: draft
  leans_on: "the saga text; Morris and Magnússon (1869), who set the proverbs in italics"
  text: "Grettir's replies are proverbs: Vinur er sá annars er ills varnar, 'he is another's friend who keeps him from harm'; Fleira veit sá er fleira reynir, 'he knows more who tries more'; Illt er að eggja óbilgjarnan, 'it is ill to goad the unyielding'; and in sentences 83 and 88, on wisdom failing those from whom more is expected and on things expected and unexpected. Morris and Magnússon mark them as proverbs by setting them in italics. The first and the third answer rebukes from his father; the others answer an offer of other work, a forecast of storm, and Asmund's words to the mare."
- id: n.gre.14.53.verses
  attach: gre.14.53v1
  kind: editorial
  status: draft
  leans_on: "the 1853 edition of G. Magnússon and G. Thordarson as transcribed on heimskringla.no (verses.yaml); Cleasby and Vigfusson, Icelandic-English Dictionary; Finnur Jónsson, Lexicon Poeticum; the commentary in Íslenzk fornrit VII (Guðni Jónsson, 1936), from memory, not checked against the page; the two translations on this page"
  text: "The chapter has three verses: Grettir on the goslings after sentence 31, Grettir to his mother on the back-scratching after sentence 53, and Asmund on the mare after sentence 94. IcePaHC, the treebank that supplies the prose, leaves verse out, so the verses are set in from the edition of 1853 and keep its older spelling (göri, sèr, Keingálu), and their words are annotated by hand against Cleasby and Vigfusson and the Lexicon Poeticum rather than taken from a treebank. The annotation is a draft. All three are in dróttkvætt, the six-syllable court metre, with alliteration binding each pair of lines and internal rhyme within each line: half rhyme (hoddagrund, höndum) in the odd lines and full rhyme (ráð, báðum) in the even lines. The first verse is a half-stanza of four lines; its even lines rhyme fully (ving, kjúklingum), but its odd lines lack the regular half rhyme, so it is a loose example of the form. In the second and third verses the clauses are interlaced, one sentence broken into another, and the 1853 print marks the inserted clauses with parentheses. Read in prose order, the second verse says: menja stökkvir vill brenna mik á báðum höndum, hoddagrund; mjök kenni ek þess; höfugt ráð er þat. Hörgerðr, læt ek tekit verða á hringa hreyti óskornum nöglum; gjör sé ek gildra sára gögl. The third says: Grettir hefir fyrst flegna Keingálu trausta; fær prettað mik; flest hin prúðu fljóð eru fullmálug. Vitr drengr man víst lengi venja af sér flestar kvaðningar mínar; hin fríða hrings hlín nemi hróðr. The kennings name people by a role. Menja stökkvir, 'scatterer of necklaces', and hringa hreytir, 'flinger of rings', are a generous man, a lord who gives treasure; here both mean Asmund, perhaps with some irony, since the generous man's gift in the verse is hands burned at the fire. Hoddagrund, 'ground of hoards', hörgerðr, 'Gerðr of flax', and hrings hlín, 'Hlín of the ring', are a woman, Asdis in both verses: a woman is named as the place where gold lies, or by a goddess's name (Gerðr, Hlín) joined to something a woman wears or works. Gildra sára gögl, 'goslings of great wounds', is the least certain phrase. Birds of wounds are usually ravens or eagles, the birds that feed on the slain; Grettir may be saying he sees the wounds on Asmund's back clearly, with a glance back at the goslings he killed, but the reading of gjör (clearly, or ready) and of the line as a whole is disputed. Hight renders it 'Clearly I see the bird of wounds'; Morris and Magnússon take the bird to be the wool-comb itself. In the first verse, einn is read here as 'one [neck]', taking up háls; 'I alone' is also possible."
- id: n.gre.14.104.end
  attach: gre.14.104
  kind: editorial
  status: draft
  leans_on: "the saga text"
  text: "The chapter closes with a short description of Grettir: he grew large, his strength was not yet known because he did not wrestle, he made verses that were thought rather given to mockery, and he would not sleep in the fire-hall and was mostly silent. The next chapter turns to the young men of Miðfjörður and the ball games at which Grettir's strength is first tested."
