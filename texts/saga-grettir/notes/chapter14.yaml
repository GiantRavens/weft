# Notes for Grettis saga chapter 14.
- id: n.gre.14.1.spelling
  attach: gre.14.1
  kind: editorial
  status: draft
  text: "The treebank prints the saga in modern Icelandic spelling: Ásmundur, not the medieval Ásmundr. Weft's default reading is still Old Norse, the language as it sounded when the saga was written around 1310, reconstructed from the modern spelling, so treat it as approximate. Modern Icelandic, the way Icelanders read their sagas today, is the second choice in the Loom."
- id: n.gre.14.1.haerulangur
  attach: gre.14.1.2
  kind: editorial
  status: draft
  text: "A nickname. Hæra means gray hair and langur means long, so it may be 'long gray-haired'. The two translators split it: Morris and Magnússon write 'the Greyhaired', Hight writes 'Longhair'."
- id: n.gre.14.3.theirra
  attach: gre.14.3.4
  kind: editorial
  status: draft
  text: "Þeirra Ásdísar, literally 'of them, of Ásdís': an Old Icelandic way of naming a pair by one member. It means the children of Ásmundur and Ásdís."
- id: n.gre.14.7.grettir
  attach: gre.14.7.6
  kind: editorial
  status: draft
  text: "Grettir's first appearance. He becomes the outlaw at the center of the saga, surviving for years in the wilderness. The saga introduces him in one sentence, then moves directly to his character."
- id: n.gre.14.8.odaell
  attach: gre.14.8.4
  kind: editorial
  status: draft
  text: "Ódæll, 'hard to deal with', from ó- 'un-' and dæll 'easy'. Sagas rarely describe a character's temperament directly; this passage is an unusually explicit sketch, and the chapters that follow bear it out."
- id: n.gre.14.9.love
  attach: gre.14.9
  kind: editorial
  status: draft
  text: "The sentence sets his father's lack of affection against his mother's, joined by en, 'but'. The conflict between father and son recurs in the chapters that follow."
- id: n.gre.14.21.tasks
  attach: gre.14.21
  kind: editorial
  status: draft
  leans_on: "the saga text; the two translations on this page"
  text: "The chapter is built on three tasks Asmund sets his son: minding the geese, rubbing his father's back by the fire, and keeping the horses through the winter. Grettir calls the first two löðurmannlegt, work fit for a lesser man, and the third kalt verk og karlmannlegt, 'cold work and manly'. Each time he does the work in a way that defeats its purpose. The geese die, the wool-comb goes down Asmund's back, and the mare Kengála is flayed."
- id: n.gre.14.33.proverbs
  attach: gre.14.33
  kind: editorial
  status: draft
  leans_on: "the saga text; Morris and Magnússon (1869), who set the proverbs in italics"
  text: "Grettir's replies are proverbs: Vinur er sá annars er ills varnar, 'he is another's friend who keeps him from harm'; Fleira veit sá er fleira reynir, 'he knows more who tries more'; Illt er að eggja óbilgjarnan, 'it is ill to goad the unyielding'; and in sentences 83 and 88, on wisdom failing those from whom more is expected and on things expected and unexpected. Morris and Magnússon mark them as proverbs by setting them in italics. The first and the third answer rebukes from his father; the others answer an offer of other work, a forecast of storm, and Asmund's words to the mare."
- id: n.gre.14.53.verses
  attach: gre.14.53
  kind: editorial
  status: draft
  leans_on: "IcePaHC, text 1310.GRETTIR; the two translations on this page"
  text: "Here, as after sentences 31 and 94, the saga gives a verse. IcePaHC, the treebank that supplies this edition, leaves verse out, so the line ends at the words that introduce it, and the translations on this page are cut at the same place. Both translators render all three verses, Morris and Magnússon in rhymed stanzas and Hight in unrhymed lines. Until the verses are edited, the chapter's prose is complete here and its verse is not."
- id: n.gre.14.104.end
  attach: gre.14.104
  kind: editorial
  status: draft
  leans_on: "the saga text"
  text: "The chapter closes with a short description of Grettir: he grew large, his strength was not yet known because he did not wrestle, he made verses that were thought rather given to mockery, and he would not sleep in the fire-hall and was mostly silent. The next chapter turns to the young men of Miðfjörður and the ball games at which Grettir's strength is first tested."
