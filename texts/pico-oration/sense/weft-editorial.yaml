# Weft's own literal translation of the Latin. Not a published translation; marked as editorial
# and draft on the page. It follows the Latin closely and keeps Pico's shifts between God's "we"
# and "I".
translation: weft-editorial
aligned_by: hand, phase 0
spans:
- lines: [pico.exordium.1, pico.exordium.3]
  text: "I have read, most reverend Fathers, in the records of the Arabs, that Abdala the Saracen, asked what on this stage of the world, as it were, was to be seen that was most to be wondered at, answered that nothing was to be seen more wonderful than man."
- lines: [pico.exordium.4, pico.exordium.4]
  text: "With this opinion agrees that saying of Mercury: A great wonder, Asclepius, is man."
- lines: [pico.adam.1, pico.adam.1]
  text: "At last the best of craftsmen decided that the one to whom nothing of his own could be given should share in whatever had been proper to each of the others."
- lines: [pico.adam.2, pico.adam.2]
  text: "So he took man, a work of undefined image, and placing him at the centre of the world, spoke to him thus:"
- lines: [pico.adam.3, pico.adam.4]
  text: "We have given you, Adam, no fixed seat, no form of your own, no function peculiar to you, so that whatever seat, whatever form, whatever functions you yourself choose, these you may have and possess according to your wish and your judgment."
- lines: [pico.adam.5, pico.adam.6]
  text: "The nature of the others is defined and held within laws we have prescribed. You, held by no narrow bounds, will define your nature for yourself, according to your own free judgment, in whose hand I have placed you."
- lines: [pico.adam.7, pico.adam.7]
  text: "I have set you at the centre of the world, so that from there you might more easily look around at whatever is in the world."
- lines: [pico.adam.8, pico.adam.9]
  text: "We have made you neither heavenly nor earthly, neither mortal nor immortal, so that, as the free and honoured moulder and shaper of yourself, you may fashion yourself in whatever form you prefer."
- lines: [pico.adam.10, pico.adam.11]
  text: "You will be able to sink into the lower things, which are brutes; you will be able, by the judgment of your soul, to be reborn into the higher things, which are divine."
