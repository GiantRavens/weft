# Notes for the Oration on the Dignity of Man, the opening and the speech to Adam.
- id: n.pico.sound
  attach: pico.exordium.1
  kind: editorial
  status: draft
  text: "The default reading is Latin as it was read in northern Italy in the 1480s, where Pico, from Mirandola near Modena, was raised and studied. Its main features are Italian vowels, soft c as ch and soft g as j, gn as ny, sc before e and i as sh, ti before a vowel as tsi, h silent, and s between vowels as z, a northern trait. It is reconstructed from Italian sound history and the later ecclesiastical tradition, which descends from readings of this kind, so treat it as approximate. The classical reading is the second choice in the Loom."
- id: n.pico.occasion
  attach: pico.exordium.1.2
  kind: editorial
  status: draft
  leans_on: "W. Parr Greswell, Memoirs of ... Joannes Picus of Mirandula (1805), pp. 245-247"
  text: "Pico wrote the oration in 1486 to open a public disputation in Rome on his nine hundred theses. The disputation did not take place, and the speech was not delivered. Patres, 'Fathers', addresses the learned audience he expected. As Greswell reports from the preface of Pico's nephew Gianfrancesco, the oration was published only after Pico's death (1494), at the urging of the learned; it appeared in the Bologna edition of his works in 1496. The title on the dignity of man was given by later editors."
- id: n.pico.abdala
  attach: pico.exordium.2.2
  kind: editorial
  status: draft
  text: "Who Abdala the Saracen was is uncertain. Pico gives no further detail, and the identifications proposed by modern scholars remain conjectural."
- id: n.pico.mercurius
  attach: pico.exordium.4.4
  kind: editorial
  status: draft
  text: "Mercury here is Hermes Trismegistus. The saying magnum miraculum est homo, 'man is a great wonder', comes from the Asclepius, a Latin dialogue attributed to Hermes in which Asclepius is the listener; Renaissance readers took it to be very old. Greswell names the speaker Trismegistus."
- id: n.pico.voice
  attach: pico.adam.3
  kind: editorial
  status: draft
  text: "God speaks to Adam in both the plural and the singular: dedimus, 'we have given', fecimus, 'we have made', and a nobis, 'by us', beside posui, 'I have placed', twice. The speech sets Adam against the rest of creation. The others' nature is definita, 'defined', and held within prescribed laws (line 5); Adam is held by no narrow bounds and will define his own (line 6)."
- id: n.pico.plastes
  attach: pico.adam.9.6
  kind: editorial
  status: draft
  leans_on: "Lewis and Short, s.vv. arbitrarius, honorarius, fictor; LSJ s.v. πλάστης"
  text: "Plastes is a Greek loanword, πλάστης, a modeller in clay or wax; fictor is its Latin counterpart, from fingo, 'to shape'. The two adjectives are harder. Lewis and Short give arbitrarius as 'depending on the will' and honorarius as 'done or given for honour's sake'. Translators render the pair in different ways, and the gloss row gives one literal choice."
- id: n.pico.spelling
  attach: pico.adam.5.2
  kind: editorial
  status: draft
  text: "The text keeps the spelling of the 1496 printing: caeteris for ceteris, cohercetur and cohercitus for coercetur and coercitus, celestem for caelestem, comodius for commodius, prefinies for praefinies. In the Italian reading ae and e sound alike, so the default sound is unaffected. The classical reading reads the printed letters, so caeteris is heard with ai and celestem with e."
