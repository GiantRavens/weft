# Notes for the Rök runestone.
- id: n.run.rok.stone
  attach: run.rok.1
  kind: editorial
  status: draft
  text: "The Rök stone carries more than 700 runes, the longest known runic inscription. Its opening, shown here, names the dead son, Vamod, and the father who raised the stone, Varin. Much of the rest of the inscription remains disputed."
- id: n.run.rok.stonta
  attach: run.rok.1.3
  kind: editorial
  status: draft
  text: "The younger futhark has 16 runes for about 30 sounds. The rune ᚬ spells the nasal a of standa, so the stone reads stonta. The sound row is derived from the normalized form, not from the runes."
- id: n.run.rok.fadi
  attach: run.rok.2.3
  kind: editorial
  status: draft
  text: "Fāði, past tense of fá, 'paint, write'. Runes were often painted after carving. Stephens renders the word 'fawed (made)'."
- id: n.run.rok.faigian
  attach: run.rok.2.6
  kind: editorial
  status: draft
  text: "Faigian, 'doomed, dead', is related to English fey, from Old English fǣge. Stephens keeps the English word: 'his-fey (deceast) son'."
