# Abstract of Appendix IV A in Charters, Bulls and Other Documents relating to the Abbey of
# Inchaffray (Scottish History Society, 1908), p. 245, by the volume's editors (W. A. Lindsay, John
# Dowden, J. Maitland Thomson). It is a summary, not a translation: it leaves out the address, the
# sealing clause in full and the witnesses' names. Text from the Internet Archive OCR
# (chartersbullsoth00inch), checked against the page image (leaf n354); words hyphenated at a line
# end are joined (con-ferred). No other changes: the OCR agrees with the
# page. The editors' heading, [Gift of the church of Gask to the Hospital of Brackley.], is left out.
translation: inchaffray1908
aligned_by: hand, at the abstract's clauses; its order follows the Latin
spans:
- lines: [sq.gask.1, sq.gask.3]
  text: "Seher de Quincy, earl of Winton, makes known that he conferred and confirmed"
- lines: [sq.gask.4, sq.gask.4]
  text: "to God, St. Mary, and the Hospital of St. John of Brackley, and the canons and brethren there serving God,"
- lines: [sq.gask.5, sq.gask.5]
  text: "the church of Gask with all its pertinents, the right of the patronage of which belonged to him,"
- lines: [sq.gask.6, sq.gask.6]
  text: "in pure and perpetual alms,"
- lines: [sq.gask.7, sq.gask.7]
  text: "for the soul of his late father Robert de Quincy, and of his mother Orable,"
- lines: [sq.gask.8, sq.gask.8]
  text: "and of his eldest son Robert,"
- lines: [sq.gask.9, sq.gask.9]
  text: "and for the weal of his own soul and of the soul of his wife Margaret, etc.,"
- lines: [sq.gask.10, sq.gask.10]
  text: "for the maintenance of the said canons and brethren there serving God and ministering to the sick."
- lines: [sq.gask.11, sq.gask.12]
  text: "His seal."
- lines: [sq.gask.13, sq.gask.16]
  text: "Witnesses . . . [1210-18]."
