# Abstract of no. 70 in the 'Abstract of the Register' of Registrum Monasterii S. Marie de
# Cambuskenneth (Grampian Club, 1872), p. 345, by the volume's editor, William Fraser. It is a
# summary, not a translation, and it reorders the charter: the son's consent and the beneficiary come
# before the prayers for souls, so the opening span covers lines 1 to 8. It leaves out the witnesses.
# Text from the Internet Archive OCR (registrummonaste00cambuoft), checked against the page image
# (leaf n572). Corrections: Win ton read Winton (the OCR splits the word); words hyphenated at a line
# end are joined (ancestors, perpetual); the editor's date [circa 1200,] is kept at the end, with its
# comma, as printed (circa in italic). The page reference 91 is left out.
translation: cambuskenneth1872
aligned_by: hand; the abstract's order differs from the Latin, so the spans are wide
spans:
- lines: [sq.duglyn.1, sq.duglyn.8]
  text: "Charter by Seher de Quinci, Earl of Winton, with the consent of his son Robert, granting to the church of St. Mary of Stirling, and the canons thereof, for the welfare of the souls of William King of Scots, and of his ancestors and successors, and the welfare of the souls of the granter and of his ancestors and successors, the whole land of Duglyn, by the same marches by which Nesus, the son of William, his grandfather, possessed it:"
- lines: [sq.duglyn.9, sq.duglyn.9]
  text: "To be held of the said Seher and his heirs in free, pure and perpetual alms,"
- lines: [sq.duglyn.10, sq.duglyn.11]
  text: "as freely as any alms was held by any religious persons in the realm of Scotland,"
- lines: [sq.duglyn.12, sq.duglyn.12]
  text: "—the granter warranting the said land against Duncan, the son of Hamelin, and against all men. [circa 1200,]"
