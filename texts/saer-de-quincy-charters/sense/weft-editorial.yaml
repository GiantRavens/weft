# Weft editorial translation of the two charters of Saer de Quincy (draft). It follows the Latin
# clause by clause and keeps the order of the witness lists. Names are given in their usual English
# form where one exists (Saer, Quincy, Peter des Roches, Robert FitzWalter); the rest are left as the
# editions print them. Albeinr is the 1908 edition's reading; its editors take the witness to be
# William d'Aubigny. The prior "of the bishop's island" in the Duglyn witnesses is translated
# literally; the house is not identified here.
translation: weft-editorial
aligned_by: hand, one span per line
spans:
- lines: [sq.gask.1, sq.gask.1]
  text: "To all the sons of holy mother Church to whom the present writing may come,"
- lines: [sq.gask.2, sq.gask.2]
  text: "Saer de Quincy, earl of Winchester, greeting in the Lord everlasting."
- lines: [sq.gask.3, sq.gask.3]
  text: "Know all of you that, with regard to God, we have conferred and granted, and by this our present charter confirmed,"
- lines: [sq.gask.4, sq.gask.4]
  text: "to God and Saint Mary and the hospital of Saint John of Brackley, and to the canons and brothers serving God there,"
- lines: [sq.gask.5, sq.gask.5]
  text: "the church of Gask with all its appurtenances, the right of patronage of which belongs to us,"
- lines: [sq.gask.6, sq.gask.6]
  text: "in pure and perpetual alms,"
- lines: [sq.gask.7, sq.gask.7]
  text: "for the soul of our father of good memory, Robert de Quincy, and for the soul of our mother Orable,"
- lines: [sq.gask.8, sq.gask.8]
  text: "and for the soul of Robert de Quincy, our first-born,"
- lines: [sq.gask.9, sq.gask.9]
  text: "and for the welfare of our own soul and of Margaret our wife, and of all our predecessors and successors,"
- lines: [sq.gask.10, sq.gask.10]
  text: "for the maintenance of the aforesaid canons and brothers who serve God there and minister to the sick."
- lines: [sq.gask.11, sq.gask.11]
  text: "And so that this our gift and grant may remain valid and unshaken in future,"
- lines: [sq.gask.12, sq.gask.12]
  text: "we have thought fit to strengthen the present writing with the protection of our seal."
- lines: [sq.gask.13, sq.gask.13]
  text: "These being witnesses: lord Peter des Roches, bishop of Winchester;"
- lines: [sq.gask.14, sq.gask.14]
  text: "lord William Malveisin, bishop of St Andrews;"
- lines: [sq.gask.15, sq.gask.15]
  text: "Robert son of Walter;"
- lines: [sq.gask.16, sq.gask.16]
  text: "William de Albeinr; William de Huntingfield; and others."
- lines: [sq.duglyn.1, sq.duglyn.1]
  text: "Saer de Quincy, earl of Winchester, to all who will see or hear the present writing, greeting."
- lines: [sq.duglyn.2, sq.duglyn.2]
  text: "Know all of you that I,"
- lines: [sq.duglyn.3, sq.duglyn.3]
  text: "for the welfare of the soul of my lord William, the illustrious king of Scotland, and of his predecessors and successors,"
- lines: [sq.duglyn.4, sq.duglyn.4]
  text: "and for the welfare of my own soul and of my predecessors and successors,"
- lines: [sq.duglyn.5, sq.duglyn.5]
  text: "with the grant and assent of Robert my son,"
- lines: [sq.duglyn.6, sq.duglyn.6]
  text: "have given and granted, and by this my charter confirmed,"
- lines: [sq.duglyn.7, sq.duglyn.7]
  text: "to God and the church of Saint Mary of Stirling, and to the canons who serve and will serve God there,"
- lines: [sq.duglyn.8, sq.duglyn.8]
  text: "the whole land of Duglyn, by the same bounds by which Ness son of William, my grandfather, held it:"
- lines: [sq.duglyn.9, sq.duglyn.9]
  text: "to be held of me and my heirs in free, pure and perpetual alms, with all its rightful appurtenances,"
- lines: [sq.duglyn.10, sq.duglyn.10]
  text: "as freely and quietly, as fully and honourably"
- lines: [sq.duglyn.11, sq.duglyn.11]
  text: "as any alms is held and possessed by any men of religion in the kingdom of Scotland, however freely and quietly, fully and honourably."
- lines: [sq.duglyn.12, sq.duglyn.12]
  text: "And I, Saer, and my heirs will warrant the whole aforesaid land to them against Duncan son of Hamelin and against all men."
- lines: [sq.duglyn.13, sq.duglyn.13]
  text: "These being witnesses: Robert son of Earl Saer; Roger, prior of the bishop's island; Walter, the king's chaplain;"
- lines: [sq.duglyn.14, sq.duglyn.14]
  text: "William de Bosco; Hugh de Prebenda; Gilbert, the king's clerk; William de Selford; Miles the steward;"
- lines: [sq.duglyn.15, sq.duglyn.15]
  text: "Henry de Brebot; Robert Carnane; Roger son of Henry; William de Burham; William de Finelei;"
- lines: [sq.duglyn.16, sq.duglyn.16]
  text: "William de Salle; Richard the clerk; John Waleran; William the chaplain; and many others."
