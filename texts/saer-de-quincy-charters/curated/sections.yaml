# Human overlay for the two charters of Saer de Quincy. No treebank covers medieval charters, so
# this file carries lemma and morphology too (rule 3 exception), hand-annotated and in draft. Lemmas
# follow Lewis and Short under their classical headwords (eleemosyna for elemosina, charta for carta,
# praesens for presens); medieval words follow Niermeyer and Du Cange (warantizo, 'to warrant';
# divisa, 'boundary'; pertinentia, 'appurtenance'; hospitale; capellanus; senescallus; praebenda).
# Names keep the spelling of the edition as lemma where no Latin form is attested; glosses give the
# usual English form (Saer, Quincy, Brackley, Gask, Stirling, Huntingfield). de in a name is glossed
# 'of'. Morphology uses UD features; future participles (visuris, audituris, seruituris) carry Tense=Fut.
