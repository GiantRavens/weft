# Weft edition: two charters of Saer de Quincy, earl of Winchester (d. 1219).
#
# gask    Grant of the church of Gask (Perthshire) to the Hospital of SS. James and John, Brackley
#         (Northamptonshire), as printed in Charters, Bulls and Other Documents relating to the Abbey
#         of Inchaffray (Scottish History Society, 1908), Appendix IV A, pp. 157-158. The 1908 text
#         was transcribed from a copy of about 1350 at Magdalen College, Oxford (Brackley D 116), on a
#         piece of parchment sewn to the lease of 1266 printed as Appendix IV (note to IV, p. 155).
# duglyn  Grant of the land of Duglyn to the canons of St. Mary of Stirling (Cambuskenneth), as
#         printed in Registrum Monasterii S. Marie de Cambuskenneth (Grampian Club, 1872), no. 70,
#         pp. 91-92, from the abbey's register of 1535.
#
# Each section is checked line by line against the Internet Archive OCR text of its volume
# (`weft draft`, edition-not-in-source). Before the check, verify_strip joins words hyphenated at a
# line end, removes the 1908 running head that falls inside the Gask charter (158 CHARTERS OF THE
# ABBEY OF INCHAFFRAY), the footnote number after Albeinr, the space the 1872 print sets before a
# colon or semicolon, and stray quotation marks the OCR reads from specks.
#
# Readings of the page images that differ from the OCR (archive.org scans chartersbullsoth00inch,
# leaves n266-n267, and registrummonaste00cambuoft, leaves n314-n315), each listed here. All but one
# are declared below as verify_corrections, so the verbatim check passes with them applied:
#   sq.gask.15     filio         OCR Alio
#   sq.duglyn.1    Seherus de Quinci   printed in small capitals, OCR SEHERUS DE QUINCI; set here in
#                                upper and lower case
#   sq.duglyn.3    anime, Regis  OCR aniine, Eegis (the 1872 type's R is regularly read as E)
#   sq.duglyn.7    seruituris    OCR seraituris; the line still passes the check, because the same
#                                clause stands, correctly read, in no. 73 on p. 93 (the check looks
#                                for the line anywhere in the volume)
#   sq.duglyn.8    eam           OCR earn
#   sq.duglyn.12   Seherus, terram   OCR Seheras, terrain; the line also crosses the page break
#                                (marginal CLACMANAN. and DUGLYN., running head 92 REGISTRUM MONASTERII,
#                                removed by verify_strip)
#
# The Gask charter keeps the 1908 edition's punctuation, which follows the copy: a raised point
# (OCR •) and a slanted stroke (OCR /). They are kept as marks set after the word (p), as printed;
# they are not words. contu[li]sse keeps the editors' brackets, which supply letters lost in the
# damaged copy. Albeinr is printed so, with the footnote "Sic, with a mark of contraction. The
# person meant is probably William de Albenie (Aubigni)."
# No abbreviation is expanded here: both editions print the words in full, apart from Albeinr.
#
# Weft divides each charter into lines at its clauses (address, notification, grant, beneficiary,
# tenure, prayers for souls, sealing or warranty, witnesses); the witness lists are split into
# lines of a few names each.
verify_corrections:              # readings of the page images (see the header); applied before the check
  - {ocr: "Alio", print: "filio", in: "sources/inchaffray1908.txt"}
  - {ocr: "SEHERUS DE QUINCI", print: "Seherus de Quinci", in: "sources/cambuskenneth1872.txt"}
  - {ocr: "aniine", print: "anime", in: "sources/cambuskenneth1872.txt"}
  - {ocr: "Eegis", print: "Regis", in: "sources/cambuskenneth1872.txt"}
  - {ocr: "earn", print: "eam", in: "sources/cambuskenneth1872.txt"}
  - {ocr: "Seheras", print: "Seherus", in: "sources/cambuskenneth1872.txt"}
  - {ocr: "terrain", print: "terram", in: "sources/cambuskenneth1872.txt"}
verify_strip: 'CLACMANAN\*?\.\s+DUGLYN\.\s+92\s+[ER]EGISTRUM\s+MONASTERII\s+DUGLYN\.\s+|-\s*\n\s*|\d+\s+CHARTERS\s+OF\s+THE\s+ABBEY\s+OF\s+\S+|(?<=Albeinr)1|\s+(?=[;:])|"'
sections:
