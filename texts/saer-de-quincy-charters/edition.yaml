      caption: "The shield Matthew Paris drew for Saer de Quincy in his chronicle in the 1250s: seven gold mascles (hollow lozenges) on red. These are the arms of his son Roger's seal and of the later family; Saer's own seal, as Laing described it in 1850, bore a fess and a label (see the note on the seal)."
      alt: "A small hand-drawn heraldic shield, red with seven gold lozenge outlines in rows of three, three and one"
      credit: "Matthew Paris; British Library, Royal MS 14 C VII (as identified on Wikimedia Commons); via Wikimedia Commons"
