  - id: duglyn
    title: "The land of Duglyn to the canons of Cambuskenneth (1207–1214)"
    verify_in: sources/cambuskenneth1872.txt
    lines:
      - "Seherus de Quinci, comes Wintonie, omnibus presens scriptum visuris vel audituris, salutem:"
      - "Nouerit vniuersitas vestra me,"
      - "pro salute anime domini mei Willelmi illustris Regis Scocie et antecessorum et successorum eius,"
      - "et pro salute anime mee et antecessorum et successorum meorum,"
      - "concessione et assensu Roberti filii mei,"
      - "dedisse et concessisse et hac carta mea confirmasse"
      - "Deo et ecclesie Sancte Marie de Striueling et canonicis ibidem Deo seruientibus et seruituris,"
      - "totam terram de Duglyn per easdem diuisas per quas Nesus filius Willelmi, auus meus, eam tenuit:"
      - "Tenendam de me et heredibus meis in liberam et puram et perpetuam elemosinam, cum omnibus iustis pertinenciis suis,"
      - "ita libere et quiete, plenarie et honorifice"
      - "sicut aliqua elemosina liberius et quietius, plenius et honorificentius, ab aliquibus religiosis viris in regno Scotie tenetur et possidetur:"
      - "Et ego Seherus et heredes mei warantizabimus eis totam predictam terram contra Duncanum filium Hamelini et contra omnes homines;"
      - "hiis testibus, Roberto filio Seheri comitis, Rogero priore de insula episcopi, Waltero capellano Regis,"
      - "Willelmo de Bosco, Hugone de Prebenda, Gilberto clerico Regis, Willelmo de Selford, Milone Senescallo,"
      - "Henrico de Brebot, Roberto Carnane, Rogero filio Henrici, Willelmo de Burhame, Willelmo de Finelei,"
      - "Willelmo de Salle, Ricardo clerico, Johanne Waleram, Willelmo capellano et multis aliis."
