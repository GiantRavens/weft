# Notes for the two charters of Saer de Quincy. Editorial notes are Weft's own and in draft; each
# names the sources it rests on in leans_on.
- id: n.sq.gask.saer
  attach: sq.gask.2
  kind: editorial
  status: draft
  leans_on: "Inchaffray Charters (1908), introduction pp. xlix, lxxxvi-lxxxviii; J. Nichols, The History and Antiquities of the County of Leicester, vol. III, part ii (1804), p. 828, Garendon evidences no. 34 a; W. S. McKechnie, Magna Carta (1905), commentary on chapter 61"
  text: "Seherus, Saher or Saer de Quincy is the grantor of both charters. What the sources used here say of him: he was made earl of Winchester in 1207 (the 1908 editors, after Roger of Wendover); he married Margaret, sister and co-heir of Robert, earl of Leicester; he took the barons' side against King John, and Matthew Paris lists the earl of Winchester among the twenty-five barons of 1215. For his death there are two accounts. A list of obits kept at Garendon Abbey in Leicestershire, a Cistercian house whose founder the same list names as Robert, earl of Leicester, printed by John Nichols in 1804, records that in 1219 he set out for the Holy Land, fell gravely ill on the way, bound his servants by oath to carry his heart to England and bury it at Garendon, which was done, and died on 3 November (iii non. Nov.), being buried at Acre. The 1908 editors say he died in November at Damietta. The Garendon entry is a monastic memorial record copied later, not a witness's account; it agrees with the editors on the month."
- id: n.sq.gask.parts
  attach: sq.gask.1
  kind: editorial
  status: draft
  text: "A charter of this kind follows a set order, and Weft gives each part its own line. The address names the readers (here 'all the sons of holy mother Church'); the grantor follows with his style and a greeting. The notification (Nouerit vniuersitas vestra, 'let all of you know') introduces the grant, made by three verbs in the perfect infinitive: conferred or given, granted, and confirmed by this charter. Then come the beneficiary, the thing given, and the tenure: pure and perpetual alms (free alms), land or a church held for prayers rather than for rent or military service. The prayers for souls name the family. The Gask charter ends with a sealing clause; the Duglyn charter ends instead with a warranty, the grantor's promise to defend the gift at law. Both close with witnesses. Neither carries a date: private charters of this period seldom did, so their dates are worked out from the names and titles in them."
- id: n.sq.gask.witnesses
  attach: sq.gask.13
  kind: editorial
  status: draft
  leans_on: "Inchaffray Charters (1908), notes to Appendix IV A, p. 307; W. S. McKechnie, Magna Carta (1905), commentary on chapter 61, after Matthew Paris, Chronica Majora II. 604-5"
  text: "Five witnesses are named. Two are bishops: Peter des Roches of Winchester (1205-1238) and William Malveisin of St Andrews (1202-1238). Three are English barons: Robert son of Walter (Robert FitzWalter), William de Albeinr, whom the editors take to be William d'Aubigny (the print reads Albeinr, 'sic, with a mark of contraction'), and William de Huntingfield. The 1908 editors observe that the three laymen, like Saer, supported the French prince Louis in the war of 1216, while the bishop of Winchester led the other side. The link to Magna Carta is one of names only. The charter of 1215 does not name the twenty-five barons appointed to enforce it; their names survive in Matthew Paris's chronicle, and his list includes the earl of Winchester, Robert fitz Walter, William of Huntingfield and William of Albini. Four of the twenty-five therefore appear together here, three or four years later, in a grant that says nothing of 1215."
- id: n.sq.gask.date
  attach: sq.gask.14
  kind: editorial
  status: draft
  leans_on: "Inchaffray Charters (1908), Appendix IV A heading, p. 157, and notes, p. 307"
  text: "The 1908 edition prints the date 1210-18 over the charter, and its introduction places the grant soon after 1207. The editors' own note on this charter argues for a later date. Bishop William Malveisin, a witness, attended the Lateran Council in November 1215 and did not return home until January 1218 (1217 in the old reckoning), and King Alexander's confirmation of the gift (Appendix IV B), which he witnesses at Stirling on 15 October, cannot then fall before 1218. They conclude that the charter belongs to 1218 at the earliest, either in that year or at the start of 1219, before Saer left for the crusade. The text itself supports a date after the eldest son's death: it prays for the soul (pro anima) of Robert, 'our first-born', alongside the dead father and mother, while it prays for the welfare (pro salute) of Saer and his wife, who were living. Weft follows the note: 1218 or early 1219."
- id: n.sq.duglyn.family
  attach: sq.duglyn.8
  kind: editorial
  status: draft
  leans_on: "Inchaffray Charters (1908), introduction pp. xlix, lxxxvi-lxxxix, and no. XXXVIII; Cambuskenneth Register (1872), nos. 70-74"
  text: "The two charters name four generations. Nesus son of William, auus meus, is Saer's grandfather: the 1908 editors identify him as Ness son of William, lord of Leuchars in Fife, whose daughter and heir Orable married Robert de Quincy. Orable is the mother named in the Gask charter, and Robert the father 'of good memory'. Robert, Saer's first-born, consents to the Duglyn grant and witnesses it as 'Robert son of Earl Saer'; in the Gask charter he is dead. Saer's Scottish lands came through Orable: Duglyn, held by the bounds by which Ness held it, and Gask, where the editors read the name Nesgasc as Ness's part of Gask. Orable had already given eight acres in Gask to Inchaffray Abbey, and Saer gave ten more with pasture for ten cows (Inchaffray no. XXXVIII), a charter in which William de Selfurd is 'my steward'. A William de Selford witnesses the Duglyn grant; that he is the same man is likely but not stated in either source."
- id: n.sq.duglyn.date
  attach: sq.duglyn.3
  kind: editorial
  status: draft
  leans_on: "Cambuskenneth Register (1872), no. 70 and abstract p. 345, nos. 71-74, introduction p. xxi, index; Inchaffray Charters (1908), introduction p. xlix"
  text: "The 1872 editor dated the Duglyn charter about 1200. Two details in it point later. Saer is styled comes Wintonie, a title he held from 1207. He prays for the welfare (pro salute) of the soul of his lord King William of Scots, the form used here for the living, and William died in December 1214. A date between 1207 and 1214 follows, with Saer's son Robert alive to consent. The register keeps a second grant of the same land without the title earl (no. 71), which may be earlier, and a quitclaim by Duncan son of Hamelin, against whom this charter warrants the land (no. 73). Where Duglyn lay is not settled here. The 1872 introduction places it in Fife; a settlement of 1247 (no. 74) shows the bishop of Dunkeld claiming its tithes for his church of Forgound, which the volume's index takes to be Forgan."
- id: n.sq.gask.seal
  attach: sq.gask.12
  kind: editorial
  status: draft
  leans_on: "H. Laing, Descriptive Catalogue of Impressions from Ancient Scottish Seals (1850), nos. 679-682, Plate XI; Wikimedia Commons file descriptions"
  text: "The Gask charter says it was sealed, but the copy it survives in carries no seal. A seal of Saer's was described by Henry Laing in 1850 (nos. 679-680), and the picture at the head of this page is the engraving in his catalogue (Plate XI). The seal shows a mounted knight with lance and pennon; his shield and the horse's trappings bear a fess (a horizontal band) and a label of seven points, and a smaller shield above the horse bears a fess between two chevrons. The counter-seal, a shield with the fess and label, reads, as Laing gives it, [SE]CRETUM COMITIS WINTON, 'the privy seal of the earl of Winchester'. Laing dates the document it hangs from, a resignation of the church of Tranent to Holyrood, to about 1170, and the Commons file title repeats that date; the word comitis makes it a seal of 1207 or later. The seven mascles (hollow lozenges) of the shield Matthew Paris drew for Saer, shown with the first charter, are not on this seal. They are the arms of his son Roger, whose seal Laing describes with five mascles (no. 681), and of the family's later heraldry."
- id: n.sq.duglyn.copies
  attach: sq.duglyn.1
  kind: editorial
  status: draft
  leans_on: "Inchaffray Charters (1908), Appendix IV note, p. 155, and introduction p. xlviii; Cambuskenneth Register (1872), introduction pp. xiii-xv"
  text: "Neither charter is known here from an original. The Gask charter is printed from a copy of about 1350 among the muniments of Magdalen College, Oxford (Brackley D 116), to which the hospital of Brackley passed; it is written on a piece of parchment sewn to a lease of 1266, with King Alexander's confirmation in the same hand, and the 1908 edition credits the transcription to Mrs New of Oxford. The Duglyn charter is printed from the register of Cambuskenneth Abbey, compiled in 1535, which in 1872 belonged to the Faculty of Advocates in Edinburgh; the editor states that the abbey's original charters were lost, and drew on a transcript made for Walter Macfarlane in 1738. A register copy may omit what the original had: this one has no sealing clause. The Advocates' manuscripts passed to the National Library of Scotland in 1925; the register's present shelfmark has not been checked for this edition."
