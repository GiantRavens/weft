# Notes for Beowulf 1-11.
- id: n.beo.1.hwaet
  attach: beo.1.1
  kind: editorial
  status: draft
  text: "Hwæt is literally 'what', used as a call for attention before a story. Translators have rendered it 'Lo' (Gummere), 'Listen', and 'So' (Seamus Heaney, 1999). William Morris keeps the literal word: 'What!'"
- id: n.beo.1.caesura
  attach: beo.1
  kind: editorial
  status: draft
  text: "Every line of Old English verse is two half-lines with a pause between them, shown as the gap in the strip. The coloured first letters are the staves: the alliterating sounds that tie the halves together, here Gār-Dena and gēar-dagum."
- id: n.beo.4.scyld
  attach: beo.4.3
  kind: editorial
  status: draft
  text: "Scēfing, 'son of Sheaf' or 'the one with the sheaf'. The poem says Scyld arrived as a destitute foundling (line 7) and was later sent back to sea in a ship burial. The poem traces the Danish royal line to a child of unknown origin."
- id: n.beo.10.hronrad
  attach: beo.10.2
  kind: editorial
  status: draft
  text: "Hron-rād, 'whale-road', is a kenning: a compound that names a thing by describing it. The sea is the road the whales travel. Gummere makes it 'whale-path', Morris keeps 'whale-road'."
- id: n.beo.11.god
  attach: beo.11.5
  kind: editorial
  status: draft
  text: "Þæt wæs gōd cyning! is the poem's first judgment, and it is praise for a king who made his neighbours pay him tribute. The same half-line returns twice in this edition: at line 864 about Hrothgar, and at line 2391 about Beowulf himself, once he is king of the Geats."
- id: n.beo.2.gefrunon
  attach: beo.2.3
  kind: editorial
  status: draft
  text: "Gefrūnon, 'we have heard of'. The poet presents the story as known from hearing rather than invented. Old English verse developed in oral performance; this poem survives in a single manuscript copied around the year 1000."
