translation: morris1895
aligned_by: hand, phase 0; translator's lines grouped where word order crosses lines
spans:
- lines:
  - beo.1
  - beo.3
  text: 'What! we of the Spear-Danes of yore days, so was it

    That we learn''d of the fair fame of kings of the folks

    And the athelings a-faring in framing of valour.'
- lines:
  - beo.4
  - beo.5
  text: 'Oft then Scyld the Sheaf-son from the hosts of the scathers,

    From kindreds a many the mead-settles tore;'
- lines:
  - beo.6
  - beo.7
  text: 'It was then the earl fear''d them, sithence was he first

    Found bare and all-lacking; so solace he bided,'
- lines:
  - beo.8
  - beo.8
  text: Wax'd under the welkin in worship to thrive,
- lines:
  - beo.9
  - beo.10
  text: 'Until it was so that the round-about sitters

    All over the whale-road must hearken his will'
- lines:
  - beo.11
  - beo.11
  text: And yield him the tribute. A good king was that,
