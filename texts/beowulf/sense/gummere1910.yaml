  - beo.3
  text: 'LO, praise of the prowess of people-kings

    of spear-armed Danes, in days long sped,

    we have heard, and what honor the athelings won!'
- lines:
  - beo.4
  - beo.5
  text: 'Oft Scyld the Scefing from squadroned foes,

    from many a tribe, the mead-bench tore,'
- lines:
  - beo.6
  - beo.7
  text: 'awing the earls. Since erst he lay

    friendless, a foundling, fate repaid him:'
- lines:
  - beo.8
  - beo.8
  text: for he waxed under welkin, in wealth he throve,
- lines:
  - beo.9
  - beo.10
  text: 'till before him the folk, both far and near,

    who house by the whale-path, heard his mandate,'
- lines:
  - beo.11
  - beo.11
  text: 'gave him gifts:  a good king he!'
