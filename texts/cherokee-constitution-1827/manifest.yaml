  position:
    source: https://tribalbusinessnews.com/sections/arts-and-culture/15270-cherokee-nation-enacts-ai-policy-to-balance-innovation-with-cultural-protection
    summary: 'The Cherokee Nation''s policy on artificial intelligence, signed by Principal Chief Chuck Hoskin Jr. on 21 August
      2025, governs the Nation''s own government and businesses; as reported, it "requires Cherokee language fluent speakers to
      provide input on any Cherokee language applications". No position on outside publication of historical Cherokee texts was
      found on the Cherokee Nation Language Department''s site (language.cherokee.org), or for the Eastern Band (ebci.gov, the
      Kituwah Preservation and Education Program at ebcikpep.com) or the United Keetoowah Band (keetoowahcherokee.org), searched
      13 October 2026.'
