stewardship:
  community: Cherokee Nation, the Eastern Band of Cherokee Indians, and the United Keetoowah Band of Cherokee Indians
  content: secular
  transcription:
    by: Weft (Claude, for Skip Levens)
    relation: outsider
    method: read from the scan by hand and by Tesseract OCR, each difference settled on the scan, and words in doubt looked for in the
      Cherokee New Testament of 1860 and the dictionaries at cherokeedictionary.net; lemma, morphology and gloss written by Claude,
      an AI model, against those references, and held as a draft until a fluent Cherokee speaker has reviewed them, as the Cherokee
      Nation's policy asks of its own work with the language
  translations:
    en1828:
      relation: community
  position:
    source: https://tribalbusinessnews.com/sections/arts-and-culture/15270-cherokee-nation-enacts-ai-policy-to-balance-innovation-with-cultural-protection
    summary: The Cherokee Nation's policy on artificial intelligence, signed by Principal Chief Chuck Hoskin Jr. on 21 August 2025,
      governs the Nation's own government and businesses; as reported, it "requires Cherokee language fluent speakers to provide input
      on any Cherokee language applications". No position on outside publication of historical Cherokee texts was found on the Cherokee
      Nation Language Department's site (language.cherokee.org), or for the Eastern Band (ebci.gov, the Kituwah Preservation and Education
      Program at ebcikpep.com) or the United Keetoowah Band (keetoowahcherokee.org), searched 13 October 2026.
predicted_gaps:
- the preamble and Article I only; Articles II to VI, and the Cherokee lines of the title page, are not yet transcribed
- the transcription rests on scans of about 180 pixels to the inch. In the preamble two signs are left uncertain (Ꮒ or Ᏺ in ᎢᏂᎦᎵᏍᏓᏁᏗ,
  Ꮣ or Ꮦ in ᎣᏥᏁᎢᏍᏓ) and four readings rest on words found in the 1860 New Testament or Feeling's dictionary as well as on the scan (named
  in edition.yaml). In Article I three signs are left uncertain (ᏥᏕᎬᎫᏗ, ᎬᏩᏏᎯᏰᎸ, ᎩᎳᏉ), and a curled U-shaped sign is read Ꮰ (tlo) in
  seven places, as Tesseract read it where the hand reading had Ꮜ (sa); in two of them the stem, with this sign, is attested in the
  word lists at cherokeedictionary.net and the 1860 New Testament, and the other five are marked on the page. Punctuation is checked
  by eye, since the OCR comparison is by letters
- 'Article I was read by hand before any OCR of its pages and then collated: the hand reading differed from the settled text at 11 of
  1,280 signs, Tesseract''s pinned witness at 242 (docs/languages.md). The hand figure is a lower bound, since a sign both readings
  got wrong is caught only by other evidence, as one was (ᏭᏕᎵᎬ, "west")'
- 'no treebank: lemma, morphology and gloss are written by Claude, an AI model, word by word against the word lists served at
  cherokeedictionary.net (Feeling''s dictionary of 1975, Noquisi, the Consortium Word List, Raven Rock, the Cherokee Nation''s list),
  the 1860 New Testament and Wiktionary, all draft, with each citation naming the list its entry came from. In the preamble four
  words (five tokens) were found in none of them and have lemma ?, five glosses, marked ?, are taken from the English beside the
  text, and one word (ᎬᏂᏉ) has no gloss. In Article I 69 of 299 tokens have lemma ?, 64 glosses are taken from the English, and six tokens have no gloss; the place names
  are given as the English names them'
- the glosses have not been reviewed by a Cherokee speaker; the Cherokee Nation asks for fluent speakers' input on machine work with
  the language (see the stewardship notice)
- 'the sound rests on the c1828 scheme, which the syllabary leaves approximate: tone, vowel length and the final h are not written,
  and the page claims none of them'
