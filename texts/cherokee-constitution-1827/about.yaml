  lead: 'The Cherokee Nation (Cherokee: ᏣᎳᎩᎯ ᎠᏰᎵ) was an autonomous tribal government of the Cherokee
    people that existed from 1794 to 1907. Often referred to as "The Nation" by its inhabitants, the government
    was centered first at New Echota in present-day Georgia and, after removal to Indian Territory, at
    Tahlequah. In 1827 the Nation adopted a written constitution with legislative, executive, and judicial
    branches, and in 1832 the United States Supreme Court affirmed in Worcester v. Georgia that the Cherokee
    Nation was a "distinct political community" in which state laws had no force.'
