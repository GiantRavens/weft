# Weft edition of the Cherokee text of the preamble and Article I of the Constitution of the Cherokee Nation (New Echota,
# July 1827), as printed in the bilingual edition of 1828 (Newberry Library, VAULT Ayer 251 .C211 1828; the scans pinned as
# scan-p1 to scan-p4). The text was read from the scans by hand and by Tesseract (gen/ocr/, made by weft ocr) and settled sign by sign
# on the scan; where a reading turned on a word, the word was looked for in the Cherokee New Testament of 1860 and the
# dictionaries searched at cherokeedictionary.net. The words the print hyphenates across its lines are joined.
#   t          the word as printed, punctuation attached
#   ocr        the OCR's reading, where the print (settled on the scan) differs from it; "" for a word it dropped
#   uncertain  {alt, why}: a sign the scan does not settle; t is the reading kept, alt the other
# Four readings rest on a word found in the 1860 New Testament or Feeling's dictionary as well as on the scan, and are
# marked below with a comment: ᎠᏫᏂᏗᏢ (Ꮧ, not the OCR's Ꮨ), ᏙᎯ (the Λ-shaped sign read as Ꮩ, do), ᎣᏣᎵᎡᎵᏥᏏ and ᎤᎾᏤᎵ (the
# plain F-shaped sign read as Ꮅ, li). Punctuation is checked by eye only: the OCR comparison is by letters.
# Lines are Weft's division of the text at its commas, semicolons and stops. Sections: the preamble (page 1), and Article I,
# Section 1 (the boundary) and Section 2 (pages 2 to 4). Article I was read by hand before any OCR of its
# pages (curated/article1-blind.txt, frozen with a hash), collated with Tesseract and settled on the scans
# (curated/article1-settled.txt). The printed section numbers (1., 2.) are left to the section titles. Two line-end dashes
# (after ᎤᏪᏯᏗᏍᏛ and ᎨᏎᏍᏗ) are printed where no word is divided, and are kept as marks, not joins.
