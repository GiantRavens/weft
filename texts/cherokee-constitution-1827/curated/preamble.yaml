    chcon.pre.8.3: {lemma: "ᎠᏍᏕᎵᎭ", morph: "VERB|Clusivity[obj]=Ex|Number[obj]=Plur|Person[obj]=1|VerbForm=Inf", gloss: "to-help-us"}   # [CED, "he's helping him"; NT ᎣᎩᏍᏕᎸᏗᏱ]
    chcon.pre.8.4: {lemma: "ᎠᎴ", morph: "CCONJ", gloss: "and"}
    chcon.pre.8.5: {lemma: "?", morph: "VERB|VerbForm=Inf", gloss: "to-direct-us?"}   # ᎣᎨᏂᏗᏱ: not found
