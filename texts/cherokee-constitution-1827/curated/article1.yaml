# Human overlay for Article I of the Constitution of the Cherokee Nation (1827), Cherokee text of the 1828 printing.
# No treebank covers Cherokee. Each word was annotated by hand against the references consulted through cherokeedictionary.net
# and named under Sources below (Feeling's dictionary is in copyright: consulted, not reproduced). The English text printed beside the Cherokee is
# the guide to sense, word by word where the two run together.
#   lemma   the headword or form of the same word in the source the comment names; ? where none was found
#   morph   Universal Dependencies features: the part of speech, and the person and number of the pronominal prefix
#           where it is clear (ᎣᎩ-, ᎣᏥ-: first person plural exclusive, "we, not you"; ᏦᎩ-, ᏦᏥ- add to these the
#           distributive prefix, as ᏦᎨᏥ, "our children", does); the -ᏗᏱ ending is the infinitive of purpose ("in order
#           to"), and the Ꮝ before it in ᏍᏗᏱ belongs to the stem. The pronoun prefixes follow Montgomery-Anderson, A Reference Grammar of
#           Oklahoma Cherokee (2008). Tone, length and aspect are not annotated: the syllabary does not write the first two.
#   gloss   one English gloss per word; a gloss ending in ? was taken from the English text beside it, not from an
#           analysis of the Cherokee word
#   Sources for Article I. cherokeedictionary.net serves several word lists besides Feeling, and each citation names the
#   one the entry came from: CED, Feeling's Cherokee-English Dictionary (1975); NOQ, the Noquisi word list; CWL, the
#   Consortium Word List; RRD, the Raven Rock dictionary; CN, the Cherokee Nation word list; NT, the 1860 New Testament;
#   "site sentences", the example sentences the site gives with its entries. Each is consulted, not reproduced.
#   Names of places are given as the English beside them names them; where a gloss is followed by a source in brackets
#   the word or its stem was found there; "not found" means neither the whole word nor a stem of it was found.
- by: Claude (an AI model, Weft phase 0), word by word against the references above; for review by a Cherokee speaker and a linguist
  date: 2026-10-13
  why: no treebank for Cherokee; the words of a polysynthetic language need a speaker's review before the draft status is lifted
  status: draft
