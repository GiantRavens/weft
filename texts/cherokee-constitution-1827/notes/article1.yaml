# Notes on Article I of the Constitution of the Cherokee Nation (1827), Cherokee text.
- id: n.chcon.a1s1.1.reading
  attach: chcon.a1s1.1.1
  kind: editorial
  status: draft
  leans_on: the scans (scan-p2 to scan-p4); curated/article1-blind.txt and article1-settled.txt; Weft's OCR (gen/ocr)
  text: 'This article was read by eye before any OCR of its pages, and the reading was frozen with a hash
    (curated/article1-blind.txt). It was then collated with Tesseract and each difference settled on the scan. Of 1,280 signs
    the hand reading differed from the settled text at 11, Tesseract''s witness at 242. The hand figure is a lower bound: where both
    readings agree on a wrong sign, only other evidence shows it, as it did once (ᏭᏕᎵᎬ, line 26). Three signs are left
    uncertain and marked on the page, and so are five places with the curled U-shaped sign read Ꮰ (tlo), whose stem the word lists
    and the New Testament attest in two other words of this article but not in these. The hand reading took that sign for Ꮜ (sa); Tesseract read
    it Ꮰ, and the collation kept Ꮰ.'
- id: n.chcon.a1s1.3.treaty
  attach: chcon.a1s1.3.2
  kind: editorial
  status: draft
  leans_on: the word lists at cherokeedictionary.net (Cherokee Nation, ᎧᏃᎮᏛᏓᏠᎯᏍᏛ; Noquisi and the Consortium Word List, ᏗᏠᎯᏍᏗ); the 1860 New Testament, Galatians 3:15, Romans 1:31 and Matthew 8:34
  text: 'Where the English has "the Treaties concluded with the United States", the Cherokee has ᎧᏃᎮᏛ ᏚᎾᏠᎯᏍᏓᏅ, glossed here
    "word they agreed on". The Cherokee Nation''s word list gives ᎧᏃᎮᏛᏓᏠᎯᏍᏛ as "treaty", the Noquisi list ᏗᏠᎯᏍᏗ as "meet", and the
    1860 New Testament has ᎧᏃᎮᏛ ᏚᎾᏠᎯᏍᏛ for "covenant" in Galatians 3:15 (and, as "covenantbreakers", in Romans 1:31).
    The word ᏚᎾᏠᎯᏍᏓᏅ itself was not found; its stem was. The same stem, with the sense of meeting, is in
    ᏚᏠᏏᎸ (line 13), where the English has "the junction of the Cowee and Nanteyalee", and in ᏕᎬᏩᏠᏏᎴᎢ, "they came out to meet
    him", in Matthew 8:34. These two words support the collation''s reading of the curled U-shaped sign of this type as Ꮰ (tlo),
    where the hand reading had Ꮜ (sa).'
- id: n.chcon.a1s1.5.legs
  attach: chcon.a1s1.5.1
  kind: editorial
  status: draft
  leans_on: the two columns of the 1828 printing; Feeling's dictionary (ᎠᏍᏓᏩᏕᎦ); the Noquisi word list (ᎦᎾᏄᎪᎦ)
  text: 'Section 1 walks the boundary leg by leg, and the Cherokee repeats one pattern: ᎾᏉᏃ, "and then", a river or ridge,
    ᎠᏍᏓᏩᏕᎦ, "it follows", and the end of the leg, marked by ᎢᏯᏍᏗ, "as far as", or by ᏫᎦᎾᏄᎪᎦ, "it comes out there". Weft
    divides the lines at the print''s punctuation, and the English is aligned by leg, over one to three lines. The places are written in the syllabary: ᏥᎦᏌ
    beside "Chickasaw", ᏔᎾᏏ "Tennessee", ᎠᏳᏩᏏ "Hiwassee", ᏓᎵᏆ "Tellico", ᏓᏔᏏ "Tallassee", ᎧᏫᏱ "Cowee", ᏅᏓᏰᎵ
    "Nanteyalee", ᎠᏂᎫᏌ "Creeks", ᏫᎵ "Wills". The glosses give the English name beside each; the history of the names is not
    taken up here.'
- id: n.chcon.a1s1.15.names
  attach: chcon.a1s1.15.5
  kind: editorial
  status: draft
  leans_on: Feeling's dictionary (ᎤᏁᎦ, ᏩᎶᏏ, ᎠᎺᏉᎢ, ᎧᏫ); the Noquisi word list (ᎤᏁᎬ, ᎠᎺᏉᎯ); the 1860 New Testament, Acts 27:5 (ᎠᎺᏉᎯ)
  text: 'Four names in the Cherokee are worth setting beside the English. Beside "the blue ridge" stands ᎤᏁᎬᏱ ᎣᏓᎵ, and ᎤᏁᎬ is
    "white" in the Noquisi list (Feeling has ᎤᏁᎦ); beside "the Unicoy Turnpike road", ᏩᎶᏏᏱ ᏅᏃᎯ, where ᏩᎶᏏ is "frog" in Feeling and -Ᏹ marks a place; beside "the
    Chattahoochy", ᎠᎺᏉᎯ ᎤᏪᏴ, where ᎠᎺᏉᎯ is "sea" in the Noquisi list and in the New Testament (Feeling has ᎠᎺᏉᎢ, "ocean"); and beside "Camp Coffee", ᎧᏫ ᎤᎡᎸ,
    where ᎧᏫ is Feeling''s word for coffee, so that the English name is written in the syllabary. Each may be a place name used as a
    name rather than a description; the glosses give the dictionary sense or the English name, and a speaker who knows the
    places could say which.'
- id: n.chcon.a1s1.26.west
  attach: chcon.a1s1.26.3
  kind: editorial
  status: draft
  leans_on: the scan (scan-p3); Feeling's dictionary (ᏭᏕᎵᎬᎢ, "west", and the sentence ᏭᏕᎵᎬ ᎢᏗᏜ)
  text: 'ᏅᏙ ᏭᏕᎵᎬ ᎢᏗᏢ, "sun, west, side", stands where the English has "the West branch". Both the hand reading and the OCR
    read the second sign of ᏭᏕᎵᎬ as Ꭶ (ga). The word was found in Feeling only with Ꮥ (de), and the scan, looked at again,
    is consistent with Ꮥ, whose bar this type sets at the upper right, though at this resolution not decisively. The text
    reads Ꮥ, on the dictionary''s evidence and the scan''s.'
- id: n.chcon.a1s2.5.fields
  attach: chcon.a1s2.5.1
  kind: editorial
  status: draft
  leans_on: the Noquisi word list (ᏕᎦᎶᎨᏒ, ᏚᏂᎸᏫᏍᏓᏁᎸ); the Raven Rock dictionary (ᎦᎶᎨᏗᎠ); Feeling's dictionary (ᏧᎬᏩᎶᏗ); the 1860 New Testament, Acts 2:45
  text: 'The English speaks of "improvements", what citizens have made on the land, which the Nation holds in common. The
    Cherokee names them by the work and the fields: ᏕᎦᎶᎨᏒ, "fields" (Noquisi: "farms, fields"), ᏧᏂᎶᎨᏛ, "which they
    cleared", and ᎾᎿ ᎠᎴ ᏚᏂᎸᏫᏍᏓᏁᎸ, "and there their works". The Noquisi word list glosses ᏚᏂᎸᏫᏍᏓᏁᎸ itself as
    "improvements", and the 1860 New Testament uses it for "the deeds" of the fathers (Luke 11:48) and ᏚᏂᎶᎨᏒ for "their
    possessions", which the believers sold (Acts 2:45). The last clause, beside "monopolizing improvements with the view
    of speculation", has ᏧᎬᏩᎶᏗ, "price" or "wealth" in Feeling, and ᎤᏂᏩᏛᏗ, "for them to get".'
- id: n.chcon.a1s2.7.buyers
  attach: chcon.a1s2.7.2
  kind: editorial
  status: draft
  leans_on: the English beside the text; the word lists at cherokeedictionary.net (ᏴᏫ; ᎤᏁᎬ, Noquisi)
  text: 'Where the English forbids a sale "to the United States, individual States, nor to individual citizens thereof", the
    Cherokee has ᎤᏂᎬᏫᏳᎯ ᏴᏫᏁᎬ, ᎠᎴ ᎾᏂᎥᏉ ᏴᏫᏁᎬ. ᏴᏫᏁᎬ was not found as a word; it is read here as ᏴᏫ, "person", and ᎤᏁᎬ,
    "white", so that the clause names the chiefs of the white people and all white people. The reading is a draft and awaits a
    speaker.'
