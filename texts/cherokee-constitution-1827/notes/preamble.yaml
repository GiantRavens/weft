# Notes on the preamble of the Constitution of the Cherokee Nation (1827), Cherokee text.
- id: n.chcon.pre.1.origin
  attach: chcon.pre.1.1
  kind: editorial
  status: draft
  leans_on: the title page of the 1828 printing; the Wikipedia articles John Ross (Cherokee chief) and Cherokee Nation (1794–1907)
  text: 'The title page reads "formed by a convention of delegates from the several districts, at New Echota, July 1827". The
    convention drew on a committee elected in May 1827, John Ross among its members; the constitution set up a legislative, an
    executive and a judicial branch, was ratified in October 1827 and took effect in October 1828, when Ross was elected principal
    chief. This printing sets the English and the Cherokee side by side on each page. It was made at New Echota, the Nation''s
    capital, where the Cherokee Phoenix began in February 1828.'
- id: n.chcon.pre.1.type
  attach: chcon.pre.1.4
  kind: editorial
  status: draft
  leans_on: the scan (scan-p1) and Weft's OCR collation (gen/ocr/p1.txt); ᏙᎯ in Feeling's dictionary
  text: 'In this type the sign Ꮩ (do) is cast in the shape of a Λ, an A without its crossbar, and both Tesseract and a first
    reading by eye take it for Ꭺ (go). Three words carry it: ᏙᎯ in line 2 ("peace", beside the English "ensure tranquility")
    settles the reading, and ᏙᎦᏙᎥ, twice, follows it. Read as Ꭺ, that word would be ᎪᎯ, "now", which has no counterpart in the
    English at that point. Tesseract''s
    Cherokee model, trained on modern fonts, differed from the settled text at 31 of 252 signs on this page (12.3 percent),
    among them this sign read as Ꭺ (three times), the plain F-shaped Ꮅ (li) read as Ꮲ (tlv) (four times), and the ends of lines.'
- id: n.chcon.pre.1.dogadov
  attach: chcon.pre.3.7
  kind: editorial
  status: draft
  leans_on: the English beside the text; exact-match searches of the word lists and the 1860 New Testament at cherokeedictionary.net (rechecked 17 October 2026)
  text: 'ᏙᎦᏙᎥ stands where the English has "the Cherokee Nation": ᏣᎳᎩ ᏙᎦᏙᎥ here, and in line 1 after ᎠᏫᏂᏗᏢ, "inside". The word
    was not found in the dictionaries or the 1860 New Testament, and it is not analyzed here; the gloss "nation?" is taken from
    the English. ᎪᎪᏪᎳ in line 1, beside "Representatives", is in the same state. A Cherokee speaker could settle both.'
- id: n.chcon.pre.4.liberty
  attach: chcon.pre.4.4
  kind: editorial
  status: draft
  leans_on: ᏦᎩᎾᏝᎢ in the 1860 New Testament (Galatians 2:4); ᏗᎨᏥᎾᏝᎢ there for "bond" against ᏂᏗᎨᏥᎾᏝᎥᎾ for "free" (1 Corinthians 7:23, Revelation 6:15) and ᏗᎨᏥᎾᏝᎢ ᏂᎨᏒᎾ for "liberty" (2 Peter 2:19); ᎠᏥᎾᏝᎢ, "slave, servant", in the Noquisi word list; ᎤᎾᏝᎢ, "lord", in the New Testament (Matthew 18:25, John 13:16)
  text: 'Where the English has "the blessings of liberty", the Cherokee reads ᎣᏤᎲ ᏦᎩᎾᏝᎢ ᏂᎨᏒᎾ ᏥᎩ: as glossed here, "that we
    live not being bondservants". The stem names both sides of ownership: ᎤᎾᏝᎢ is the lord or master, and ᎠᏥᎾᏝᎢ the one who is
    owned. In the 1860 New Testament ᏗᎨᏥᎾᏝᎢ stands for "bond" against ᏂᏗᎨᏥᎾᏝᎥᎾ for "free" (Revelation 6:15), and ᏗᎨᏥᎾᏝᎢ ᏂᎨᏒᎾ,
    the same negation as here, for "liberty" in 2 Peter 2:19. ᏦᎩᎾᏝᎢ itself appears once, in Galatians 2:4, where ᏦᎩᎾᏝᎢ
    ᎢᎪᎬᏁᏗᏱ stands for "that they might bring us into bondage". The phrase relates liberty to not being owned. An earlier draft
    glossed ᏦᎩᎾᏝᎢ as "our owner"; the New Testament usage points to the owned party instead. The reading is a draft and awaits a
    speaker''s review.'
- id: n.chcon.pre.5.order
  attach: chcon.pre.5.6
  kind: editorial
  status: draft
  leans_on: the two columns of the 1828 printing
  text: 'The Cherokee does not follow the English clause by clause. It ends its first sentence with the enactment, ᎯᎠ ᏗᎧᎾᏩᏛᏍᏗ
    ᏣᎳᎩ ᎤᎾᏤᎵ ᎣᏦᏢᎾ ("this law, the Cherokees'' own, we have made"), and then gives thanks to the one who dwells above and asks
    his help, where the English keeps "do ordain and establish" to the end. The translation is therefore aligned as one span.'
- id: n.chcon.pre.6.ruler
  attach: chcon.pre.6.4
  kind: editorial
  status: draft
  leans_on: the 1860 New Testament, where ᎦᎸᎳᏗ and ᎤᎬᏫᏳᎯ are common and ᏂᎬᎾᏛ stands for "all", "throughout" a region (Matthew 4:23, 4:24)
  text: 'ᎦᎸᎳᏗᏗᎾ ᎡᎯ, ᏂᎬᎾᏛ ᎤᎬᏫᏳᎯ, "who dwells above, ruler everywhere", renders "the sovereign Ruler of the Universe". ᎤᎬᏫᏳᎯ is
    the word the 1860 New Testament uses for "Lord" and "ruler"; ᏂᎬᎾᏛ is its word for "all" or "throughout" a region, as in
    "went about all Galilee" (Matthew 4:23), so "ruler everywhere" stands near the English "of the Universe". ᎣᏣᎵᎡᎵᏥᏏ, "we give thanks", carries the English "gratitude":
    the same stem as ᎦᎵᎡᎵᎦ, "I am thankful", which the 1860 New
    Testament uses often.'
