# Notes for Matthew 5:3-12.
- id: n.mt.5.3.makarioi
  attach: mt.5.3.1
  kind: editorial
  status: draft
  leans_on: "LSJ and BDAG s.v. μακάριος; Psalm 1:1 in the Septuagint"
  text: "Μακάριοι is an adjective, 'blessed, happy, fortunate', and the Greek has no verb: 'blessed the poor in spirit'. The King James Version supplies 'are' and marks it as an added word. The form, a pronouncement that begins with μακάριος, is old in both Greek and Hebrew writing; the Septuagint opens the Psalms with μακάριος ἀνήρ, 'blessed the man', for the Hebrew אַשְׁרֵי. It is a different word from εὐλογημένος, 'blessed' in the sense of praised or spoken well of. English uses one word for both."
- id: n.mt.5.3.luke
  attach: mt.5.3
  kind: editorial
  status: draft
  leans_on: "Luke 6:20-26 (SBLGNT)"
  text: "Luke 6:20-26 has a shorter parallel set in a sermon on level ground. It has four blessings instead of nine, addressed to the hearers in the second person ('blessed are you poor, for yours is the kingdom of God'), and it follows them with four matching woes ('woe to you who are rich'). Luke's blessings are on 'the poor' and 'those who hunger now', without Matthew's 'in spirit' and 'for righteousness'. Matthew says 'kingdom of the heavens', Luke 'kingdom of God'. Most scholars take both to draw on a common earlier collection of sayings, and they differ on which wording is closer to it."
- id: n.mt.5.3.ptochoi
  attach: mt.5.3.3
  kind: editorial
  status: draft
  leans_on: "LSJ s.v. πτωχός, πένης"
  text: "Πτωχός is the stronger of the two common Greek words for poor: it means destitute, reduced to begging, where πένης means someone who works for a living without reserves. Τῷ πνεύματι is a dative of respect, 'poor in respect of the spirit'. Whether Matthew's phrase narrows Luke's plain 'the poor' to an inner disposition, or names the same people from another side, is a long-running question among commentators."
- id: n.mt.5.5.praeis
  attach: mt.5.5.3
  kind: editorial
  status: draft
  leans_on: "Psalm 36:11 in the Septuagint (Psalm 37:11 in the Hebrew numbering)"
  text: "This blessing follows Psalm 37:11 closely. The Septuagint reads οἱ δὲ πραεῖς κληρονομήσουσιν γῆν, 'but the gentle will inherit land', with the same adjective and verb. In the psalm γῆ most naturally means the land of Israel; Matthew's τὴν γῆν, with the article, is usually translated 'the earth'. Πραΰς means gentle, mild, not given to anger; 'meek', the reading of all three English versions here, has narrowed in modern English toward 'submissive'."
- id: n.mt.5.10.frame
  attach: mt.5.10
  kind: editorial
  status: draft
  text: "The first and the eighth blessings end with the same clause, ὅτι αὐτῶν ἐστιν ἡ βασιλεία τῶν οὐρανῶν, 'because theirs is the kingdom of the heavens', and they are the only two with a present verb, ἐστιν. The six between them promise something in the future: 'will be comforted', 'will inherit', 'will see'. Four of those futures are passive with no agent named; many commentators read them as passives with God as the implied actor, a common way of speaking in Jewish writing of the period."
- id: n.mt.5.11.second-person
  attach: mt.5.11.2
  kind: editorial
  status: draft
  leans_on: "SBLGNT apparatus at Matthew 5:11"
  text: "With ἐστε, 'you are', the address turns from 'they' to 'you', and the ninth blessing is longer and differently built from the eight before it. Some count eight beatitudes and treat verses 11-12 as an expansion of the eighth, since both speak of persecution. The SBLGNT text marks πονηρὸν with ⸀, its sign for a place where manuscripts differ; many later manuscripts add ῥῆμα, 'word', after πονηρόν, and a few omit ψευδόμενοι, 'lying'."
