# Thomas Common's translation, Thus Spake Zarathustra (1909), Zarathustra's Prologue, section 1,
# verbatim from Project Gutenberg #1998. The capitals of GO DOWN are Project Gutenberg's mark for
# the emphasis of the original and are kept. No corrections.
translation: common1909
aligned_by: hand, phase 0; one span per sentence of the German
spans:
- lines: [nz.za1.1, nz.za1.1]
  text: "When Zarathustra was thirty years old, he left his home and the lake of his home, and went into the mountains."
- lines: [nz.za1.2, nz.za1.2]
  text: "There he enjoyed his spirit and solitude, and for ten years did not weary of it."
- lines: [nz.za1.3, nz.za1.3]
  text: "But at last his heart changed,—and rising one morning with the rosy dawn, he went before the sun, and spake thus unto it:"
- lines: [nz.za1.4, nz.za1.4]
  text: "Thou great star! What would be thy happiness if thou hadst not those for whom thou shinest!"
- lines: [nz.za1.5, nz.za1.5]
  text: "For ten years hast thou climbed hither unto my cave: thou wouldst have wearied of thy light and of the journey, had it not been for me, mine eagle, and my serpent."
- lines: [nz.za1.6, nz.za1.6]
  text: "But we awaited thee every morning, took from thee thine overflow and blessed thee for it."
- lines: [nz.za1.7, nz.za1.7]
  text: "Lo! I am weary of my wisdom, like the bee that hath gathered too much honey; I need hands outstretched to take it."
- lines: [nz.za1.8, nz.za1.8]
  text: "I would fain bestow and distribute, until the wise have once more become joyous in their folly, and the poor happy in their riches."
- lines: [nz.za1.9, nz.za1.9]
  text: "Therefore must I descend into the deep: as thou doest in the evening, when thou goest behind the sea, and givest light also to the nether-world, thou exuberant star!"
- lines: [nz.za1.10, nz.za1.10]
  text: "Like thee must I GO DOWN, as men say, to whom I shall descend."
- lines: [nz.za1.11, nz.za1.11]
  text: "Bless me, then, thou tranquil eye, that canst behold even the greatest happiness without envy!"
- lines: [nz.za1.12, nz.za1.12]
  text: "Bless the cup that is about to overflow, that the water may flow golden out of it, and carry everywhere the reflection of thy bliss!"
- lines: [nz.za1.13, nz.za1.13]
  text: "Lo! This cup is again going to empty itself, and Zarathustra is again going to be a man."
- lines: [nz.za1.14, nz.za1.14]
  text: "Thus began Zarathustra’s down-going."
