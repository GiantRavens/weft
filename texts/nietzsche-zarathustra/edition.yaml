# Weft edition of a passage by Friedrich Nietzsche, in the spelling of its first edition.
#
# za1    Also sprach Zarathustra. Ein Buch für Alle und Keinen [first part] (Chemnitz: Ernst
#        Schmeitzner, 1883), Zarathustra's Vorrede, section 1, pages 5-6. Text of the Deutsches
#        Textarchiv (nietzsche_zarathustra01_1883), which transcribes the 1883 print; checked by the
#        same sensor against the DTA TEI file (format dta-tei: line-end hyphens rejoined). The 1883
#        spelling is kept: dreissig, gieng, Morgenröthe, austheilen, Thorheit, Reichthums, thust. The
#        print spaces the letters of untergehen for emphasis; the edition does not mark it.
#
# Weft divides the text into lines at the sentence.
#
#   t     the word as printed, punctuation and dashes attached ("Mensch. —", "„Ich", "— Also")
#   n     the modern spelling of the same word form (dreissig: dreißig, gieng: ging);
#         Nietzsche's capitals on pronouns (Viele, Denen, Nichts) are lowercased. The page shows it
#         as "Modern spelling"; the sound of both schemes is computed from it
#         (pipeline/weft/german.py with pipeline/weft/data/de_lexicon.yaml)
