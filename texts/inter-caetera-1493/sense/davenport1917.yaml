# Frances Gardiner Davenport, European Treaties bearing on the History of the United States and
# its Dependencies to 1648 (Washington: Carnegie Institution of Washington, 1917), Doc. 7, 'The
# Bull Inter Caetera (Alexander VI.). May 4, 1493', translation on pp. 75-78; verbatim from the
# Internet Archive OCR of the University of Toronto copy. Davenport's note to Doc. 5 says that for
# this bull and its neighbours "free use has been made of the translations in Blair and Robertson".
# Her translation reorders the grant: the authority clause comes first and the line last.
# Corrections of clear OCR errors:
#   a footnote line ("tories of this bull.") printed into the text at a page foot is removed;
#   ".towards" -> "towards" (a stray mark); a space the OCR sets before a semicolon is removed
#   (three times); words broken at a line end are rejoined (Christo-pher, main-lands, how-ever).
# The passages of the bull not in the edition are not given here.
translation: davenport1917
aligned_by: hand, phase 0; one span per English sentence group, matched to the Latin passages
spans:
- lines: [ic.salutatio.1, ic.salutatio.4]
  text: "Alexander, bishop, servant of the servants of God, to the illustrious sovereigns, our very dear son in Christ, Ferdinand, king, and our very dear daughter in Christ, Isabella, queen of Castile, Leon, Aragon, Sicily, and Granada, health and apostolic benediction."
- lines: [ic.arenga.1, ic.arenga.5]
  text: "Among other works well pleasing to the Divine Majesty and cherished of our heart, this assuredly ranks highest, that in our times especially the Catholic faith and the Christian religion be exalted and be everywhere increased and spread, that the health of souls be cared for and that barbarous nations be overthrown and brought to the faith itself."
- lines: [ic.narratio.1, ic.narratio.12]
  text: "We have indeed learned that you, who for a long time had intended to seek out and discover certain islands and mainlands remote and unknown and not hitherto discovered by others, to the end that you might bring to the worship of our Redeemer and the profession of the Catholic faith their residents and inhabitants, having been up to the present time greatly engaged in the siege and recovery of the kingdom itself of Granada were unable to accomplish this holy and praiseworthy purpose; but, the said kingdom having at length been regained, as was pleasing to the Lord, you, with the wish to fulfill your desire, chose our beloved son, Christopher Columbus, a man assuredly worthy and of the highest recommendations and fitted for so great an undertaking, whom you furnished with ships and men equipped for like designs, not without the greatest hardships, dangers, and expenses, to make diligent quest for these remote and unknown mainlands and islands through the sea, where hitherto no one had sailed; and they at length, with divine aid and with the utmost diligence sailing in the ocean sea, discovered certain very remote islands and even mainlands that hitherto had not been discovered by others; wherein dwell very many peoples living in peace, and, as reported, going unclothed, and not eating flesh."
- lines: [ic.narratio.13, ic.narratio.18]
  text: "Moreover, as your aforesaid envoys are of opinion, these very peoples living in the said islands and countries believe in one God, the Creator in heaven, and seem sufficiently disposed to embrace the Catholic faith and be trained in good morals. And it is hoped that, were they instructed, the name of the Savior, our Lord Jesus Christ, would easily be introduced into the said countries and islands. Also, on one of the chief of these aforesaid islands the said Christopher has already caused to be put together and built a fortress fairly equipped, wherein he has stationed as garrison certain Christians, companions of his, who are to make search for other remote and unknown islands and mainlands. In the islands and countries already discovered are found gold, spices, and very many other precious things of divers kinds and qualities."
- lines: [ic.donatio.1, ic.donatio.18]
  text: "And, in order that you may enter upon so great an undertaking with greater readiness and heartiness endowed with the benefit of our apostolic favor, we, of our own accord, not at your instance nor the request of anyone else in your regard, but of our own sole largess and certain knowledge and out of the fullness of our apostolic power, by the authority of Almighty God conferred upon us in blessed Peter and of the vicarship of Jesus Christ, which we hold on earth, do by tenor of these presents, should any of said islands have been found by your envoys and captains, give, grant, and assign to you and your heirs and successors, kings of Castile and Leon, forever, together with all their dominions, cities, camps, places, and villages, and all rights, jurisdictions, and appurtenances, all islands and mainlands found and to be found, discovered and to be discovered towards the west and south, by drawing and establishing a line from the Arctic pole, namely the north, to the Antarctic pole, namely the south, no matter whether the said mainlands and islands are found and to be found in the direction of India or towards any other quarter, the said line to be distant one hundred leagues towards the west and south from any of the islands commonly known as the Azores and Cape Verde. With this proviso however that none of the islands and mainlands, found and to be found, discovered and to be discovered, beyond that said line towards the west and south, be in the actual possession of any Christian king or prince up to the birthday of our Lord Jesus Christ just past from which the present year one thousand four hundred and ninety-three begins. And we make, appoint, and depute you and your said heirs and successors lords of them with full and free power, authority, and jurisdiction of every kind; with this proviso however, that by this our gift, grant, and assignment no right acquired by any Christian prince, who may be in actual possession of said islands and mainlands prior to the said birthday of our Lord Jesus Christ, is hereby to be understood to be withdrawn or taken away."
- lines: [ic.datum.1, ic.datum.2]
  text: "Given at Rome, at St. Peter's, in the year of the incarnation of our Lord one thousand four hundred and ninety-three, the fourth of May, and the first year of our pontificate."
