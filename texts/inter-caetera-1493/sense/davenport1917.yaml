# Frances Gardiner Davenport, European Treaties bearing on the History of the United States and
# its Dependencies to 1648 (Washington: Carnegie Institution of Washington, 1917), Doc. 7, 'The
# Bull Inter Caetera (Alexander VI.). May 4, 1493', translation on pp. 75-78; verbatim from the
# Internet Archive OCR of the University of Toronto copy. Davenport's note to Doc. 5 says that for
# this bull and its neighbours "free use has been made of the translations in Blair and Robertson".
# Her translation reorders the grant: the authority clause comes first and the line last.
# Corrections of clear OCR errors:
#   a footnote line ("tories of this bull.") printed into the text at a page foot is removed;
#   ".towards" -> "towards" (a stray mark); a space the OCR sets before a semicolon is removed
#   (four times in the first five passages, as 'purpose ;', 'sailed ;', 'others ;', 'kind ;'); words broken at a line end are rejoined (Christo-pher, main-lands, how-ever).
# The whole bull is now aligned, the chancery notes included: Davenport translates the notes below the
# date ("Gratis by order of our most holy lord, the pope. June. For the referendary, ..."). The notes are
# printed in columns; each is read down its column, as the Latin edition reads them, and her small
# capitals are given as capitals, as the Latin edition gives them. Her translation also reorders the
# clauses in the passages added here: in the sovereigns' purpose the object comes after the verb (lines
# 3-4 are one span); in the mandate the clause "employing all due diligence in the premises" is moved up
# beside "as you also promise" (lines 2-5 are one span), and in the prohibition the penalty comes before
# the persons named and the permit and the purpose of the voyage before the line (lines 6-7 and 8-13 are
# one span each); in the penalty clause the verbs "infringe" and "contravene" come before the list of the
# bull's acts (lines 1-3 are one span); in the Granada sentence "so pleasing to immortal God" closes the
# sentence (lines 8-9 are one span). Further corrections of clear OCR errors, checked against the page
# images (pp. 76-78): "wasnhe" -> "was the" (a stray mark read as n); ".therefore" -> "therefore" (a stray
# mark); "worthy." -> "worthy," and, in the notes, "referendary." -> "referendary,"; "SaNTOSEVERINO" ->
# "SANTOSEVERINO" and "Bufolinus" -> "BUFOLINUS" (small capitals); the spaces the OCR sets around four
# dashes are removed (endeavors—as, Saracens—, promise—nor, spirit—you) and a stray "^" before "you" is
# dropped; one more space before a semicolon is removed; and words broken at a line end are rejoined
# (shed-ding, en-deavors, Al-mighty, suc-cessors, desir-able, there-for, any-where, any-one).
translation: davenport1917
aligned_by: hand, phase 0; one span per English sentence group, matched to the Latin passages
spans:
- lines:
  - ic.salutatio.1
  - ic.salutatio.4
  text: Alexander, bishop, servant of the servants of God, to the illustrious sovereigns, our very dear
    son in Christ, Ferdinand, king, and our very dear daughter in Christ, Isabella, queen of Castile,
    Leon, Aragon, Sicily, and Granada, health and apostolic benediction.
- lines:
  - ic.arenga.1
  - ic.arenga.5
  text: Among other works well pleasing to the Divine Majesty and cherished of our heart, this assuredly
    ranks highest, that in our times especially the Catholic faith and the Christian religion be exalted
    and be everywhere increased and spread, that the health of souls be cared for and that barbarous nations
    be overthrown and brought to the faith itself.
- lines:
  - ic.granata.1
  - ic.granata.1
  text: Wherefore inasmuch as by the favor of divine clemency, we, though of insufficient merits, have
    been called to this Holy See of Peter,
- lines:
  - ic.granata.2
  - ic.granata.2
  text: recognizing that as true Catholic kings and princes, such as we have known you always to be,
- lines:
  - ic.granata.3
  - ic.granata.3
  text: and as your illustrious deeds already known to almost the whole world declare,
- lines:
  - ic.granata.4
  - ic.granata.4
  text: you not only eagerly desire but with every effort, zeal, and diligence, without regard to hardships,
    expenses, dangers,
- lines:
  - ic.granata.5
  - ic.granata.5
  text: with the shedding even of your blood, are laboring to that end; recognizing also that you have
    long since dedicated to this purpose your whole soul and all your endeavors—
- lines:
  - ic.granata.6
  - ic.granata.6
  text: as witnessed in these times with so much glory to the Divine Name in your recovery of the kingdom
    of Granada from the yoke of the Saracens—
- lines:
  - ic.granata.7
  - ic.granata.7
  text: we therefore are rightly led, and hold it as our duty, to grant you even of our own accord and
    in your favor those things
- lines:
  - ic.granata.8
  - ic.granata.9
  text: whereby with effort each day more hearty you may be enabled for the honor of God himself and the
    spread of the Christian rule to carry forward your holy and praiseworthy purpose so pleasing to immortal
    God.
- lines:
  - ic.narratio.1
  - ic.narratio.12
  text: We have indeed learned that you, who for a long time had intended to seek out and discover certain
    islands and mainlands remote and unknown and not hitherto discovered by others, to the end that you
    might bring to the worship of our Redeemer and the profession of the Catholic faith their residents
    and inhabitants, having been up to the present time greatly engaged in the siege and recovery of the
    kingdom itself of Granada were unable to accomplish this holy and praiseworthy purpose; but, the said
    kingdom having at length been regained, as was pleasing to the Lord, you, with the wish to fulfill
    your desire, chose our beloved son, Christopher Columbus, a man assuredly worthy and of the highest
    recommendations and fitted for so great an undertaking, whom you furnished with ships and men equipped
    for like designs, not without the greatest hardships, dangers, and expenses, to make diligent quest
    for these remote and unknown mainlands and islands through the sea, where hitherto no one had sailed;
    and they at length, with divine aid and with the utmost diligence sailing in the ocean sea, discovered
    certain very remote islands and even mainlands that hitherto had not been discovered by others; wherein
    dwell very many peoples living in peace, and, as reported, going unclothed, and not eating flesh.
- lines:
  - ic.narratio.13
  - ic.narratio.18
  text: Moreover, as your aforesaid envoys are of opinion, these very peoples living in the said islands
    and countries believe in one God, the Creator in heaven, and seem sufficiently disposed to embrace
    the Catholic faith and be trained in good morals. And it is hoped that, were they instructed, the
    name of the Savior, our Lord Jesus Christ, would easily be introduced into the said countries and
    islands. Also, on one of the chief of these aforesaid islands the said Christopher has already caused
    to be put together and built a fortress fairly equipped, wherein he has stationed as garrison certain
    Christians, companions of his, who are to make search for other remote and unknown islands and mainlands.
    In the islands and countries already discovered are found gold, spices, and very many other precious
    things of divers kinds and qualities.
- lines:
  - ic.propositum.1
  - ic.propositum.1
  text: Wherefore, as becomes Catholic kings and princes, after earnest consideration of all matters,
    especially of the rise and spread of the Catholic faith,
- lines:
  - ic.propositum.2
  - ic.propositum.2
  text: as was the fashion of your ancestors, kings of renowned memory,
- lines:
  - ic.propositum.3
  - ic.propositum.4
  text: you have purposed with the favor of divine clemency to bring under your sway the said mainlands
    and islands with their residents and inhabitants and to bring them to the Catholic faith.
- lines:
  - ic.hortatio.1
  - ic.hortatio.1
  text: Hence, heartily commending in the Lord this your holy and praiseworthy purpose,
- lines:
  - ic.hortatio.2
  - ic.hortatio.2
  text: and desirous that it be duly accomplished, and that the name of our Savior be carried into those
    regions,
- lines:
  - ic.hortatio.3
  - ic.hortatio.3
  text: we exhort you very earnestly in the Lord and by your reception of holy baptism, whereby you are
    bound to our apostolic commands,
- lines:
  - ic.hortatio.4
  - ic.hortatio.4
  text: and by the bowels of the mercy of our Lord Jesus Christ, enjoin strictly,
- lines:
  - ic.hortatio.5
  - ic.hortatio.5
  text: that inasmuch as with eager zeal for the true faith you design to equip and despatch this expedition,
- lines:
  - ic.hortatio.6
  - ic.hortatio.6
  text: you purpose also, as is your duty, to lead the peoples dwelling in those islands and countries
    to embrace the Christian religion;
- lines:
  - ic.hortatio.7
  - ic.hortatio.7
  text: nor at any time let dangers or hardships deter you therefrom,
- lines:
  - ic.hortatio.8
  - ic.hortatio.8
  text: with the stout hope and trust in your hearts that Almighty God will further your undertakings.
- lines:
  - ic.donatio.1
  - ic.donatio.18
  text: And, in order that you may enter upon so great an undertaking with greater readiness and heartiness
    endowed with the benefit of our apostolic favor, we, of our own accord, not at your instance nor the
    request of anyone else in your regard, but of our own sole largess and certain knowledge and out of
    the fullness of our apostolic power, by the authority of Almighty God conferred upon us in blessed
    Peter and of the vicarship of Jesus Christ, which we hold on earth, do by tenor of these presents,
    should any of said islands have been found by your envoys and captains, give, grant, and assign to
    you and your heirs and successors, kings of Castile and Leon, forever, together with all their dominions,
    cities, camps, places, and villages, and all rights, jurisdictions, and appurtenances, all islands
    and mainlands found and to be found, discovered and to be discovered towards the west and south, by
    drawing and establishing a line from the Arctic pole, namely the north, to the Antarctic pole, namely
    the south, no matter whether the said mainlands and islands are found and to be found in the direction
    of India or towards any other quarter, the said line to be distant one hundred leagues towards the
    west and south from any of the islands commonly known as the Azores and Cape Verde. With this proviso
    however that none of the islands and mainlands, found and to be found, discovered and to be discovered,
    beyond that said line towards the west and south, be in the actual possession of any Christian king
    or prince up to the birthday of our Lord Jesus Christ just past from which the present year one thousand
    four hundred and ninety-three begins. And we make, appoint, and depute you and your said heirs and
    successors lords of them with full and free power, authority, and jurisdiction of every kind; with
    this proviso however, that by this our gift, grant, and assignment no right acquired by any Christian
    prince, who may be in actual possession of said islands and mainlands prior to the said birthday of
    our Lord Jesus Christ, is hereby to be understood to be withdrawn or taken away.
- lines:
  - ic.mandatum.1
  - ic.mandatum.1
  text: Moreover we command you in virtue of holy obedience
- lines:
  - ic.mandatum.2
  - ic.mandatum.5
  text: that, employing all due diligence in the premises, as you also promise—nor do we doubt your compliance
    therein in accordance with your loyalty and royal greatness of spirit—you should appoint to the aforesaid
    mainlands and islands worthy, God-fearing, learned, skilled, and experienced men, in order to instruct
    the aforesaid inhabitants and residents in the Catholic faith and train them in good morals.
- lines:
  - ic.mandatum.6
  - ic.mandatum.7
  text: Furthermore, under penalty of excommunication late sententie to be incurred ipso facto, should
    anyone thus contravene, we strictly forbid all persons of whatsoever rank, even imperial and royal,
    or of whatsoever estate, degree, order, or condition,
- lines:
  - ic.mandatum.8
  - ic.mandatum.13
  text: to dare, without your special permit or that of your aforesaid heirs and successors, to go for
    the purpose of trade or any other reason to the islands or mainlands, found and to be found, discovered
    and to be discovered, towards the west and south, by drawing and establishing a line from the Arctic
    pole to the Antarctic pole, no matter whether the mainlands and islands, found and to be found, lie
    in the direction of India or toward any other quarter whatsoever, the said line to be distant one
    hundred leagues towards the west and south, as is aforesaid, from any of the islands commonly known
    as the Azores and Cape Verde;
- lines:
  - ic.mandatum.14
  - ic.mandatum.14
  text: apostolic constitutions and ordinances and other decrees whatsoever to the contrary notwithstanding.
- lines:
  - ic.mandatum.15
  - ic.mandatum.15
  text: We trust in Him from whom empires and governments and all good things proceed,
- lines:
  - ic.mandatum.16
  - ic.mandatum.16
  text: that, should you, with the Lord's guidance, pursue this holy and praiseworthy undertaking,
- lines:
  - ic.mandatum.17
  - ic.mandatum.17
  text: in a short while your hardships and endeavors will attain the most felicitous result, to the happiness
    and glory of all Christendom.
- lines:
  - ic.transumpta.1
  - ic.transumpta.1
  text: But inasmuch as it would be difficult to have these present letters sent to all places where desirable,
- lines:
  - ic.transumpta.2
  - ic.transumpta.2
  text: we wish, and with similar accord and knowledge do decree,
- lines:
  - ic.transumpta.3
  - ic.transumpta.3
  text: that to copies of them, signed by the hand of a public notary commissioned therefor,
- lines:
  - ic.transumpta.4
  - ic.transumpta.4
  text: and sealed with the seal of any ecclesiastical officer or ecclesiastical court,
- lines:
  - ic.transumpta.5
  - ic.transumpta.5
  text: the same respect is to be shown in court and outside as well as anywhere else as would be given
    to these presents should they thus be exhibited or shown.
- lines:
  - ic.sanctio.1
  - ic.sanctio.3
  text: Let no one, therefore, infringe, or with rash boldness contravene, this our recommendation, exhortation,
    requisition, gift, grant, assignment, constitution, deputation, decree, mandate, prohibition, and
    will.
- lines:
  - ic.sanctio.4
  - ic.sanctio.4
  text: Should anyone presume to attempt this,
- lines:
  - ic.sanctio.5
  - ic.sanctio.5
  text: be it known to him that he will incur the wrath of Almighty God and of the blessed apostles Peter
    and Paul.
- lines:
  - ic.datum.1
  - ic.datum.2
  text: Given at Rome, at St. Peter's, in the year of the incarnation of our Lord one thousand four hundred
    and ninety-three, the fourth of May, and the first year of our pontificate.
- lines:
  - ic.notae.1
  - ic.notae.1
  text: Gratis by order of our most holy lord, the pope.
- lines:
  - ic.notae.2
  - ic.notae.2
  text: June.
- lines:
  - ic.notae.3
  - ic.notae.3
  text: For the referendary, A. DE MUCCIARELLIS.
- lines:
  - ic.notae.4
  - ic.notae.4
  text: For J. BUFOLINUS, A. SANTOSEVERINO.
- lines:
  - ic.notae.5
  - ic.notae.5
  text: L. PODOCATHARUS.
