# Emma Helen Blair and James Alexander Robertson (eds.), The Philippine Islands, 1493-1803,
# vol. 1 (Cleveland, 1903), 'Inter Cætera--May 4', from the Project Gutenberg text (#13255).
# Their note on sources says the translation was made from the Latin in Heywood, Documenta selecta
# e tabulario secreto Vaticano (Rome, 1893), that is, from the Vatican copy, not the Seville
# original printed in the edition here; so it reads "the Christian law" (lex) where the Seville text
# has religio, and "In certain islands" (quibusdam) where it has quibusquidem. Their "etc." stands
# for formulas the Vatican copy abridges. The English also moves "not without the greatest
# hardships, dangers, and expenses" to the recovery of Granada, where the Latin has it with the
# sending of Columbus.
# Changes: the Gutenberg underscores marking italics (_Azores_, _Cabo Verde_) are removed; line
# breaks are joined. Nothing else is changed. The bull's formal closing is not given here.
translation: blair-robertson1903
aligned_by: hand, phase 0; one span per English sentence group, matched to the Latin passages
spans:
- lines: [ic.salutatio.1, ic.salutatio.4]
  text: "Alexander, etc., to the illustrious sovereigns, our very dear son in Christ, Ferdinand, King, and our very dear daughter in Christ, Helisabeth [Isabella], Queen of Castile and Leon, Aragon, Sicily, and Granada, health, etc."
- lines: [ic.arenga.1, ic.arenga.5]
  text: "Among other works well pleasing to his divine Majesty and cherished of our heart, this assuredly ranks highest: that in our times especially the Catholic faith and the Christian law be exalted and everywhere increased and spread as well as that the health of souls be procured, and barbarous nations overthrown and brought to the faith itself."
- lines: [ic.narratio.1, ic.narratio.14]
  text: "In sooth we have learned that according to your purpose long ago you were in quest of some far-away islands and mainlands not hitherto discovered by others, to the end that you might bring to the worship of our Redeemer and the profession of the Catholic faith the inhabitants of them with the dwellers therein; that hitherto having been earnestly engaged in the siege and recovery of the kingdom itself of Granada you were unable to accomplish this saintly and praiseworthy purpose; but at length, as was pleasing to the Lord, the said kingdom having been regained, not without the greatest hardships, dangers, and expenses, that with the wish to fulfil your desire, you chose our beloved son, Christopher Colon, a man assuredly worthy and of the highest recommendations as well as furnished with ships and men equipped for like designs, to make diligent quest for these far-away, unknown mainlands and islands through the sea, where hitherto no one has sailed; who in fine, with divine aid, nor without the utmost diligence, sailing in the Ocean Sea discovered certain very far-away islands and even mainlands that hitherto had not been discovered by others, wherein dwell very many peoples living in peace, and, as reported, going unclothed, nor users of flesh meat; and, as your aforesaid envoys are of opinion, these very peoples living in the said islands and countries believe in one God, Creator in heaven, besides being sufficiently ready in appearance to embrace the Catholic faith and be trained in good morals."
- lines: [ic.narratio.15, ic.narratio.18]
  text: "Nor is hope lacking that, were they instructed, the name of the Savior, our Lord Jesus Christ, would easily be introduced into the said countries and islands. Besides on one of these aforesaid chief islands the said Christopher has already had put together and built a well-equipped fortress, wherein he has stationed as garrison certain Christians, companions of his, who are to make search for other far-away and unknown islands and mainlands. In certain islands and countries already discovered are found gold, spices, and very many other precious things of divers kinds and species."
- lines: [ic.donatio.1, ic.donatio.18]
  text: "Moreover, moved thereunto by our own accord, not at your instance nor the request of any one else in your regard, but wholly of our own largess and certain knowledge as well as fulness of our apostolic power, by the authority of Almighty God conferred upon us in blessed Peter and of the vicarship of Jesus Christ, which we hold on earth, in order that with greater readiness and heartiness you enter upon an undertaking of so lofty a character as has been entrusted to you by the graciousness of our apostolic favor, by tenor of these presents should any of said islands have been found by your envoys and captains, we do give, grant, and assign to you and your heirs and successors, kings of Castile and Leon, forever, together with all their dominions, cities, camps, places, and towns, as well as all rights, jurisdictions, and appurtenances, all islands and mainlands found and to be found, discovered and to be discovered towards the west and south, by drawing and establishing a line from the Arctic pole, namely the north, to the Antarctic pole, namely the south, no matter whether the said mainlands and islands are found and to be found in the direction of India or towards any other quarter, the said line to the west and south to be distant one hundred leagues from any of the islands commonly known as the Azores and Cabo Verde. With this proviso however that none of the islands and mainlands found and to be found, discovered and to be discovered beyond that said line towards the west and south, be in the actual possession of any Christian king or prince up to the birthday of our Lord Jesus Christ just past in the present year one thousand four hundred and ninety-three. Moreover we make, appoint and depute you and your said heirs and successors owners of them with full and free power, authority, and jurisdiction of every kind; with this proviso however that through this gift, grant, and assignment of ours no right conferred on any Christian prince, who may be in actual possession of said islands and mainlands up to the said birthday of our Lord Jesus Christ, is hereby to be considered as withdrawn or to be withdrawn."
- lines: [ic.datum.1, ic.datum.2]
  text: "Given at Rome at St. Peter's in the year, etc., one thousand four hundred and ninety-three, the fourth of May, and the first year of our pontificate."
