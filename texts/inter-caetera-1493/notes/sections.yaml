# Notes for the bull Inter caetera of 4 May 1493, the whole bull from the address to the chancery notes.
- id: n.ic.bulla
  attach: ic.salutatio.1
  kind: editorial
  status: draft
  leans_on: "R. L. Poole, Lectures on the History of the Papal Chancery down to the Time of Innocent III (Cambridge, 1915), chapters 1 and 5; Davenport (1917), Doc. 5, notes on the signatories, and Doc. 7"
  text: "A papal bull is a letter issued by the papal chancery in a fixed form and authenticated by a lead seal, in Latin bulla. The word first meant a bubble or a round boss, then a round seal, and from the later Middle Ages the letters themselves were called bulls after the seal that hung from them. A papal bulla of this period carries the heads of Peter and Paul on one face and the pope's name on the other. Such a letter has no title; it is cited by its first words, its incipit. Inter caetera, 'among other things', opens two of Alexander VI's bulls of 1493, dated 3 May and 4 May; this is the second, and the one that draws the line. The address follows the standard form: the pope names himself, with no number, as bishop and servant of the servants of God, then names the recipients and sends a greeting. The pope does not sign. The names at the foot of the original, given at the end of this page, are those of chancery officials; Davenport identifies L. Podocatharus as Lodovico Podocataro, Alexander's secretary."
- id: n.ic.context
  attach: ic.narratio.1
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), general introduction, pp. 1-2, and the introductions to Docs. 1-8"
  text: "The bull answers a dispute between Castile and Portugal. Earlier popes had granted Portugal rights along the African coast toward the Indies (Romanus pontifex, 1455, and Inter caetera of Calixtus III, 1456). In the treaty of Alcáçovas (1479), confirmed by Sixtus IV in 1481, Castile left Portugal Guinea, the Azores, Madeira and the Cape Verde islands, and kept the Canaries. Columbus, on his return in March 1493, was driven by storm into Lisbon and met John II of Portugal on 9 March before reaching Spain. John II held that the new lands fell within Portugal's rights, and Ferdinand and Isabella sought a papal grant. Alexander VI, born Rodrigo de Borja at Xàtiva in the kingdom of Valencia, issued four bulls on the matter in 1493: Inter caetera (3 May), Eximiae devotionis (3 May), this Inter caetera (4 May), and Dudum siquidem (26 September), which extended the grant to lands Castile might reach in the east by sailing west. The narrative opens with Sane accepimus, 'we have learned'; the sentence before it, in the passage on Granada, praises the conquest of Granada, completed in January 1492."
- id: n.ic.colon
  attach: ic.narratio.7.4
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), Doc. 5, notes to the description of the islands, citing H. Harrisse, The Diplomatic History of America (1897), p. 160; the Latin texts of the bulls of 3 and 4 May in Davenport, compared; the Weft edition of Columbus's letter"
  text: "The bull names Columbus in the Castilian form of his name, Cristophorum Colon, not the Latin Columbus. The praise that follows (a man certainly worthy, much to be commended, and fit for so great an undertaking) is not in the bull of 3 May, which has only 'our beloved son Christopher Colon'. The report of the islands is given on the word of the sovereigns' envoys, and the bull does not name its source. Davenport, following Harrisse, notes that nearly all of it could have been taken from Columbus's letter on the voyage, which was known in Rome before 18 April 1493. Weft's edition of that letter is in this library (Columbus, letter of 1493, columbus-letter-1493); its first description of the people says that they go naked and are very timid, and later passages, not given there, describe the fort left at Navidad on Española, the tower of line 16 here. The bull speaks of mainlands (terras firmas) as well as islands. Columbus had at first taken Juana, which is Cuba, for mainland, and the letter records that he was told it was an island. Where the bull of 3 May has terras, this one adds firmas at several points; Davenport marks the additions without explaining them."
- id: n.ic.lineam
  attach: ic.donatio.7
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), Doc. 7, introduction and notes on 'versus occidentem et meridiem', on the line, and on the league (citing H. Vander Linden, American Historical Review 22, 1916, and S. E. Dawson, 1899; K. Kretschmer, Die Entdeckung Amerikas, 1892, p. 303)"
  text: "The line is a meridian, drawn from the Arctic pole to the Antarctic, one hundred leagues 'west and south' of any of the Azores and Cape Verde islands. Castile receives all lands west of it, found or still to be found, unless a Christian ruler actually held them at Christmas 1492. A later clause, in the mandate, forbids anyone to sail there for trade or any other purpose without a Castilian license, on pain of excommunication. The terms leave three things open. The two island groups do not lie on one meridian, and the bull does not say from which island to count. A meridian cannot lie to the south of anything, so 'west and south' has needed explanation; Davenport judged Vander Linden's discussion the best of many. And the league had no fixed length. Kretschmer, reckoning four Roman miles to the league and counting from the most westerly Cape Verde island, placed the line near 31 degrees west; this is one estimate, not a figure the bull gives. Davenport thought it highly probable that Columbus suggested the line. The bull of 3 May has no line: it grants the lands found by the sovereigns' envoys that no Christian ruler held."
- id: n.ic.tordesillas
  attach: ic.donatio.5.5
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), general introduction, pp. 1-2, and Docs. 8-11; the Cantino planisphere (Biblioteca Estense, Modena)"
  text: "The line of this bull held for about a year. Portugal did not accept it, and the two crowns negotiated directly. By the treaty of Tordesillas, 7 June 1494, the line was moved to 370 leagues west of the Cape Verde islands, Castile taking what lay west and Portugal what lay east. The treaty provided for a joint expedition of ships, pilots and astrologers to fix the line on the sea, and a further agreement of 1495 set out how, but Davenport records that neither was carried out. Julius II confirmed the treaty in 1506 with the bull Ea quae. The moved line put the eastern part of South America, which Pedro Álvares Cabral reached in 1500, on the Portuguese side. The Portuguese chart of 1502 shown with this passage draws the Tordesillas line, not the line of 1493. Later disputes over the Moluccas assumed that the line ran on around the globe, a question the bulls of 1493 do not address."
- id: n.ic.grant
  attach: ic.donatio.14
  kind: editorial
  status: draft
  leans_on: "the Latin of the grant as edited here; Davenport (1917), Doc. 1, note on the dating of bulls (citing A. Giry, Manuel de diplomatique, 1894); the translations of Davenport and of Blair and Robertson"
  text: "The grant is built from the chancery's standing formulas. The pope acts motu proprio, of his own motion, not at anyone's petition, from his own liberality, certain knowledge and the fullness of apostolic power (plenitudo potestatis), and by the authority given to Peter and the vicarship of Christ. The operative verbs come in sets of three: donamus, concedimus et assignamus (we give, grant and assign), then facimus, constituimus et deputamus (we make, appoint and depute) the sovereigns lords, domini, with full, free and complete power, authority and jurisdiction. Pairs of past participle and gerundive reach forward in time: inventas et inveniendas, detectas et detegendas, lands found and to be found, uncovered and to be uncovered. The recipients are named as kings of Castile and León, not of Aragon, so the grant is to the Castilian crown. The cut-off date counts the year 1493 from Christmas 1492, while the dating clause counts it from the Incarnation, which the papal chancery usually reckoned from 25 March; both give 1493 for a date in May. Davenport renders domini as 'lords', Blair and Robertson as 'owners'; the Latin word covers both."
- id: n.ic.later
  attach: ic.donatio.15
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), Docs. 9-12; Francisco de Vitoria, De Indis (lectures of 1539), part 2; Johnson v. M'Intosh, 21 U.S. 543 (1823); United Nations Permanent Forum on Indigenous Issues, eleventh session (2012); Dicastery for Culture and Education and Dicastery for Promoting Integral Human Development, joint note on the 'doctrine of discovery' (30 March 2023)"
  text: "What the bull does, on its own terms, is assign rights among Christian rulers: Castile against Portugal and any other Christian prince, over lands no Christian ruler held. It treats the inhabitants as peoples to be brought to the faith, and the passage on the sovereigns' purpose records their aim to bring them under their rule (subjicere). It says nothing explicit about their own rights in the land. Its later readings go well beyond that scope, and they differ. Castilian officials cited the papal donation in the Requerimiento of 1513, a summons read to Indigenous peoples. Francisco de Vitoria, lecturing at Salamanca in 1539, argued that the pope held no temporal power over non-Christians and that the donation could not by itself give title against them. Other European crowns did not accept the division. In Johnson v. M'Intosh (1823), the United States Supreme Court set out a rule that discovery gave title to the discovering European power, subject to the inhabitants' right of occupancy; Chief Justice Marshall mentions the papal grant only to say that Spain 'did not rest her title solely on the grant of the Pope'. Since the later twentieth century, Indigenous advocates and scholars have named the bulls of 1455 and 1493 among the sources of what is now called the doctrine of discovery. The United Nations Permanent Forum on Indigenous Issues took that doctrine as the theme of its 2012 session, and in March 2023 two Vatican dicasteries stated in a joint note that it is not part of Catholic teaching. How far the bull caused later law, rather than being cited in support of it, is argued among historians; the text here records only what the bull itself grants."
- id: n.ic.text
  attach: ic.datum.1
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), Doc. 7, introduction, bibliography and notes, citing H. Vander Linden, 'Alexander VI. and the Demarcation', American Historical Review 22 (1916), 1-20; Blair and Robertson (1903), vol. 1, bibliographical data; the Wikisource page (revision 129534)"
  text: "The bull survives in more than one copy. Davenport prints the original sent to Castile, now in the Archivo General de Indias at Seville (Patronato 1-1-1, no. 3), and gives variants from the copy entered in the Vatican register, published in facsimile by Heywood in 1893. Blair and Robertson translated the Vatican text, so their version differs in a few words, for instance 'the Christian law' (lex) where the Seville original has religio, and 'in certain islands' (quibusdam) where it has quibusquidem. Blair and Robertson report a further original in the national archive at Lisbon. The Wikisource page used here names no source, but its text agrees with Davenport's word for word in these lines, including her readings of the officials' names, and it keeps the original's spelling: e for ae, Jhesu, nichilominus. The date, 4 May, is not the day the bull was made. Vander Linden showed, and Davenport accepts, that the chancery issued it in June and dated it back several weeks; the reason is not known. Gratis de mandato, at the foot of the original, records that it was issued without the usual fees, by the pope's order."
- id: n.ic.granata
  attach: ic.granata.6.4
  kind: editorial
  status: draft
  leans_on: "Davenport (1917), Doc. 5, note 7, on the recovery of Granada, to which Doc. 7 refers; the Latin as edited here"
  text: "This passage gives the pope's reason for the grant: the sovereigns' record. Having been called to the see of Peter, he says, he knows that Ferdinand and Isabella have long given all their effort to spreading the faith, as their recovery of the kingdom of Granada 'from the tyranny of the Saracens' shows, and so he owes them the means to continue. Davenport notes that the conquest of Granada was completed when the city surrendered on 2 January 1492, sixteen months before the date of the bull. The two dashes are Davenport's; they set off the clause about Granada inside the sentence."
- id: n.ic.subjicere
  attach: ic.propositum.4.1
  kind: editorial
  status: draft
  leans_on: "the Latin as edited here; Davenport (1917), translation of this sentence"
  text: "The sentence states the sovereigns' purpose in two infinitives joined by et: to subject (subjicere) the lands and their inhabitants to themselves, and to bring them to the Catholic faith. The bull presents the two as one undertaking, done 'in the manner of your ancestors'. Davenport translates 'to bring under your sway ... and to bring them to the Catholic faith'."
- id: n.ic.mandatum
  attach: ic.mandatum.1.3
  kind: editorial
  status: draft
  leans_on: "the Latin as edited here; Davenport (1917), translation of this passage"
  text: "The last operative clause does two things. It orders the sovereigns, 'in virtue of holy obedience', to send men who are upright, God-fearing, learned and skilled to instruct the inhabitants in the faith. And it forbids everyone else, 'even of imperial or royal dignity', to go to the lands west of the line for trade or any other reason without the sovereigns' license. The description of the line is repeated from the grant almost word for word, with 'as is said above' (ut prefertur) at its end."
- id: n.ic.latae
  attach: ic.mandatum.7.2
  kind: editorial
  status: draft
  leans_on: "the Latin as edited here (quam eo ipso si contrafecerint incurrant)"
  text: "The penalty is excommunication latae sententiae, 'of a sentence already passed'. The clause itself explains the term: those who act against the prohibition incur it eo ipso, by the act itself, without any further judgment."
- id: n.ic.transumpta
  attach: ic.transumpta.3.3
  kind: editorial
  status: draft
  leans_on: "the Latin as edited here; Davenport (1917), Doc. 1, the bull Romanus pontifex (1455), which has a similar clause"
  text: "Because the original letter cannot be carried to every place where it might be needed, the bull provides that copies (transumpta) written out by a notary public and sealed by a church dignitary or an ecclesiastical court are to be believed as the original would be, in court and out of it. The bull Romanus pontifex of 1455, which Davenport prints as her first document, has a clause to the same effect."
- id: n.ic.sanctio
  attach: ic.sanctio.1.1
  kind: editorial
  status: draft
  leans_on: "R. L. Poole, Lectures on the History of the Papal Chancery (1915), chapter 5; the Latin as edited here"
  text: "The two sentences beginning Nulli ergo and Si quis are the closing formulas of a solemn papal letter. The first lists, as nouns, every act the letter has performed (commendation, exhortation, request, grant, concession, assignment, constitution, deputation, decree, mandate, prohibition and will) and forbids anyone to infringe the page; the second threatens anyone who tries with the indignation of God and of the apostles Peter and Paul. The list is a record of the bull's own structure. The original spells ortationis without h."
- id: n.ic.notae
  attach: ic.notae.1.1
  kind: editorial
  status: draft
  leans_on: "the Wikisource page (revision 129534), which follows Davenport's readings of the names; Davenport (1917), Doc. 7, introduction, citing H. Vander Linden (1916), and Doc. 5, note on Podocatharus, citing M. Buchberger, Kirchliches Handlexikon"
  text: "Below the date stand the chancery's notes. Gratis de mandato sanctissimi Domini nostri pape records that the bull was issued without fees, by the pope's order. Jun[io], 'in June', agrees with Vander Linden's finding, noted at the date, that the bull was issued in June and dated back to May. The rest are the names of chancery officers, in the reading Davenport credits to Vander Linden, where Pro marks a man signing for another (pro referendario, for the referendary). The letters in square brackets are an editor's expansion of abbreviations. Davenport identifies L. Podocatharus as Lodovico Podocataro, physician to Innocent VIII and secretary to Alexander VI, made a cardinal in 1500, and refers to Vander Linden for the other signatories, who are not identified in the sources used here."
