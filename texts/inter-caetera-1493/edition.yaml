# Weft edition: the bull Inter caetera of Alexander VI, dated 4 May 1493, the whole bull: the
# address, the opening clause, the reasons for the grant, the account of Columbus's voyage, the
# sovereigns' purpose, the exhortation, the grant with the line of demarcation, the mandate, the clause
# on copies, the penalty clause, the date and the chancery notes.
#
# The text is the one on Latin Wikisource ('Inter caetera (quarto nonas Maii 1493)', revision
# 129534), which reproduces, word for word in these lines, the Latin printed by Frances Gardiner
# Davenport (1917) from the promulgated original in the Archivo General de Indias, Seville
# (Patronato 1-1-1, no. 3). It keeps the original's spelling: e for ae and oe (cetera, regine,
# presertim, que), j for consonantal i (Majestati, hujusmodi), and the Jhesu, Cristophorum and
# nichilominus of the chancery. Every line is checked verbatim against the Wikisource page by
# `weft draft`; the space the page sets before a semicolon or colon is stripped first. Weft divides the
# long sentences into lines at their clauses.
verify_in: sources/intercaetera-la.txt
verify_strip: " (?=[;:])"
verify_corrections:
# the Wikisource page misreads Davenport's illa and spaces his dashes; the print (p. 73) reads
# 'debemus illa vobis' and sets 'dedicasse—quemadmodum' and 'testatur—digne' closed up
- ocr: ilia vobis
  print: illa vobis
- ocr: "dedicasse -- quemadmodum"
  print: "dedicasse—quemadmodum"
- ocr: "testatur -- digne"
  print: "testatur—digne"
# and in the chancery notes (p. 75) the print reads 'MUCCIARELLIS.' with a full stop and 'Jo.' in lower case
- ocr: "A. DE MUCCIARELLIS\n"
  print: "A. DE MUCCIARELLIS.\n"
- ocr: "Pro JO. BUF"
  print: "Pro Jo. BUF"
sections:
  - id: salutatio
    title: "The address: Alexander to Ferdinand and Isabella"
    lines:
      - "Alexander episcopus, servus servorum Dei:"
      - "carissimo in Christo filio Fernando regi,"
      - "et carissime in Christo filie Elisabeth regine Castelle, Legionis, Aragonum, Sicilie, et Granate, illustribus,"
      - "salutem et apostolicam benedictionem."
  - id: arenga
    title: "Among other works pleasing to God"
    lines:
      - "Inter cetera Divine Majestati beneplacita opera et cordis nostri desiderabilia,"
      - "illud profecto potissimum existit,"
      - "ut fides Catholica et Christiana religio nostris presertim temporibus exaltetur,"
      - "ac ubilibet amplietur et dilatetur, animarumque salus procuretur,"
      - "ac barbare nationes deprimantur et ad fidem ipsam reducantur."
  - id: granata
    title: "Why the pope grants this: the sovereigns and Granada"
    lines:
      - "Unde cum ad hanc Sacram Petri Sedem, divina favente clementia, meritis licet imparibus, evocati fuerimus,"
      - "cognoscentes vos, tanquam veros Catholicos reges et principes, quales semper fuisse novimus,"
      - "et a vobis preclare gesta toti pene jam orbi notissima demonstrant,"
      - "nedum id exoptare, sed omni conatu, studio, et diligentia, nullis laboribus, nullis impensis, nullisque parcendo periculis,"
      - tokens:
        - {t: "etiam"}
        - {t: "proprium"}
        - {t: "sanguinem"}
        - {t: "effundendo,"}
        - {t: "efficere,"}
        - {t: "ac"}
        - {t: "omnem"}
        - {t: "animum"}
        - {t: "vestrum"}
        - {t: "omnesque"}
        - {t: "conatus"}
        - {t: "ad"}
        - {t: "hoc"}
        - {t: "jam"}
        - {t: "dudum"}
        - {t: "dedicasse—", glue: true}
      - tokens:
        - {t: "quemadmodum"}
        - {t: "recuperatio"}
        - {t: "regni"}
        - {t: "Granate"}
        - {t: "a"}
        - {t: "tyrannide"}
        - {t: "Saracenorum"}
        - {t: "hodiernis"}
        - {t: "temporibus"}
        - {t: "per"}
        - {t: "vos,"}
        - {t: "cum"}
        - {t: "tanta"}
        - {t: "Divini"}
        - {t: "Nominis"}
        - {t: "gloria"}
        - {t: "facta,"}
        - {t: "testatur—", glue: true}
      - "digne ducimur non immerito, et debemus illa vobis etiam sponte et favorabiliter concedere,"
      - "per que hujusmodi sanctum et laudabile ac immortali Deo acceptum propositum"
      - "in dies ferventiori animo ad ipsius Dei honorem et imperii Christiani propagationem prosequi valeatis."
  - id: narratio
    title: "The voyage of Christopher Columbus"
    lines:
      - "Sane accepimus quod vos,"
      - "qui dudum animo proposueratis aliquas insulas et terras firmas, remotas et incognitas ac per alios hactenus non repertas, querere et invenire,"
      - "ut illarum incolas et habitatores ad colendum Redemptorem nostrum et fidem Catholicam profitendum reduceretis,"
      - "hactenus in expugnatione et recuperatione ipsius regni Granate plurimum occupati,"
      - "hujusmodi sanctum et laudabile propositum vestrum ad optatum finem perducere nequivistis;"
      - "sed tandem, sicut Domino placuit, regno predicto recuperato, volentes desiderium adimplere vestrum,"
      - "dilectum filium Cristophorum Colon, virum utique dignum et plurimum commendandum, ac tanto negotio aptum,"
      - "cum navigiis et hominibus ad similia instructis, non sine maximis laboribus et periculis ac expensis, destinastis,"
      - "ut terras firmas et insulas remotas et incognitas hujusmodi per mare, ubi hactenus navigatum non fuerat, diligenter inquireret;"
      - "qui tandem, divino auxilio, facta extrema diligentia, in mari oceano navigantes,"
      - "certas insulas remotissimas, et etiam terras firmas, que per alios hactenus reperte non fuerant, invenerunt,"
      - "in quibus quamplurime gentes, pacifice viventes, et, ut asseritur, nudi incedentes, nec carnibus vescentes, inhabitant;"
      - "et, ut prefati nuntii vestri possunt opinari, gentes ipse in insulis et terris predictis habitantes credunt unum Deum Creatorem in celis esse,"
      - "ac ad fidem Catholicam amplexandum et bonis moribus imbuendum satis apti videntur,"
      - "spesque habetur quod, si erudirentur, nomen Salvatoris, Domini nostri Jhesu Christi, in terris et insulis predictis facile induceretur;"
      - "ac prefatus Cristophorus in una ex principalibus insulis predictis jam unam turrim satis munitam,"
      - "in qua certos Christianos qui secum iverant, in custodiam, et ut alias insulas et terras firmas remotas et incognitas inquirerent, posuit, construi et edificari fecit;"
      - "in quibusquidem insulis et terris jam repertis, aurum, aromata, et alie quamplurime res preciose diversi generis et diverse qualitatis reperiuntur."
  - id: propositum
    title: "The sovereigns' purpose"
    lines:
      - "Unde omnibus diligenter, et presertim fidei Catholice exaltatione et dilatatione, prout decet Catholicos reges et principes, consideratis,"
      - "more progenitorum vestrorum, clare memorie regum,"
      - "terras firmas et insulas predictas illarumque incolas et habitatores, vobis, divina favente clementia,"
      - "subjicere et ad fidem Catholicam reducere proposuistis."
  - id: hortatio
    title: "The exhortation to bring the peoples to the faith"
    lines:
      - "Nos igitur hujusmodi vestrum sanctum et laudabile propositum plurimum in Domino commendantes,"
      - "ac cupientes ut illud ad debitum finem perducatur, et ipsum nomen Salvatoris nostri in partibus illis inducatur,"
      - "hortamur vos plurimum in Domino, et per sacri lavacri susceptionem, qua mandatis apostolicis obligati estis,"
      - "et viscera misericordie Domini nostri Jhesu Christi attente requirimus,"
      - "ut cum expeditionem hujusmodi omnino prosequi et assumere prona mente orthodoxe fidei zelo intendatis,"
      - "populos in hujusmodi insulis et terris degentes ad Christianam religionem suscipiendam inducere velitis et debeatis,"
      - "nec pericula, nec labores ullo unquam tempore vos deterreant,"
      - "firma spe fiduciaque conceptis, quod Deus Omnipotens conatus vestros feliciter prosequetur."
  - id: donatio
    title: "The grant and the line one hundred leagues west"
    figure:
      file: art/works/inter-caetera-1493/cantino-1502.jpg
      caption: "The Cantino planisphere, a Portuguese world chart of 1502 (Biblioteca Estense, Modena). The blue meridian at the left is the line agreed at Tordesillas in 1494, 370 leagues west of the Cape Verde islands, not the line of this bull; the islands Columbus reached are west of it, at the upper left."
      alt: "A painted world chart on parchment with Africa at the center, the Caribbean islands and a strip of South American coast at the left, and a vertical line running from top to bottom west of Africa"
      credit: "Anonymous Portuguese cartographer, 1502; Biblioteca Estense Universitaria, Modena"
      license: "Public domain"
      source: "https://commons.wikimedia.org/wiki/File:Cantino_planisphere_(1502).jpg"
    lines:
      - "Et, ut tanti negotii provinciam apostolice gratie largitate donati liberius et audacius assumatis,"
      - "motu proprio, non ad vestram vel alterius pro vobis super hoc nobis oblate petitionis instanciam,"
      - "sed de nostra mera liberalitate et ex certa scientia ac de apostolice potestatis plenitudine,"
      - "omnes insulas et terras firmas inventas et inveniendas, detectas et detegendas versus occidentem et meridiem"
      - "fabricando et constituendo unam lineam a polo Arctico scilicet septentrione ad polum Antarcticum scilicet meridiem,"
      - "sive terre firme et insule invente et inveniende sint versus Indiam aut versus aliam quancunque partem,"
      - "que linea distet a qualibet insularum, que vulgariter nuncupantur de los Azores et Caboverde, centum leucis versus occidentem et meridiem,"
      - "ita quod omnes insule et terre firme reperte et reperiende, detecte et detegende, a prefata linea versus occidentem et meridiem,"
      - "per alium regem aut principem Christianum non fuerint actualiter possesse usque ad diem nativitatis domini nostri Jhesu Christi proxime preteritum"
      - "a quo incipit annus presens millesimus quadringentesimus nonagesimus tertius,"
      - "quando fuerunt per nuntios et capitaneos vestros invente alique predictarum insularum,"
      - "auctoritate Omnipotentis Dei nobis in beato Petro concessa, ac vicariatus Jhesu Christi, qua fungimur in terris,"
      - "cum omnibus illarum dominiis, civitatibus, castris, locis et villis, juribusque et jurisdictionibus ac pertinentiis universis,"
      - "vobis heredibusque et successoribus vestris, Castelle et Legionis regibus, in perpetuum tenore presentium donamus, concedimus, et assignamus,"
      - "vosque et heredes ac successores prefatos illarum dominos cum plena, libera, et omnimoda potestate, auctoritate, et jurisdictione, facimus, constituimus, et deputamus;"
      - "decernentes nichilominus per hujusmodi donationem, concessionem, et assignationem nostram nulli Christiano principi,"
      - "qui actualiter prefatas insulas aut terras firmas possederit usque ad predictum diem Nativitatis Domini nostri Jhesu Christi,"
      - "jus quesitum sublatum intelligi posse aut auferri debere."
  - id: mandatum
    title: "Missionaries, and no one to sail west of the line without leave"
    lines:
      - "Et insuper mandamus vobis in virtute sancte obedientie,"
      - "ut, sicut etiam pollicemini et non dubitamus pro vestra maxima devotione et regia magnanimitate vos esse facturos,"
      - "ad terras firmas et insulas predictas viros probos et Deum timentes, doctos, peritos, et expertos,"
      - "ad instruendum incolas et habitatores prefatos in fide Catholica et bonis moribus imbuendum destinare debeatis,"
      - "omnem debitam diligentiam in premissis adhibentes,"
      - "ac quibuscunque personis cujuscunque dignitatis, etiam imperialis et regalis, status, gradus, ordinis, vel conditionis,"
      - "sub excommunicationis late sententie pena, quam eo ipso si contrafecerint, incurrant, districtius inhibemus,"
      - "ne ad insulas et terras firmas, inventas et inveniendas, detectas et detegendas versus occidentem et meridiem,"
      - "fabricando et constituendo lineam a polo Arctico ad polum Antarcticum,"
      - "sive terre firme et insule invente et inveniende sint versus Indiam aut versus aliam quancunque partem,"
      - "que linea distet a qualibet insularum, que vulgariter nuncupantur de los Azores et Caboverde, centum leucis versus occidentem et meridiem, ut prefertur,"
      - "pro mercibus habendis vel quavis alia de causa, accedere presumant"
      - "absque vestra ac heredum et successorum vestrorum predictorum licentia speciali,"
      - "non obstantibus constitutionibus et ordinationibus apostolicis, ceterisque contrariis quibuscunque,"
      - "in Illo a quo imperia et dominationes ac bona cuncta procedunt confidentes,"
      - "quod, dirigente Domino actus vestros, si hujusmodi sanctum et laudabile propositum prosequamini,"
      - "brevi tempore, cum felicitate et gloria totius populi Christiani, vestri labores et conatus exitum felicissimum consequentur."
  - id: transumpta
    title: "Copies to be believed as the original"
    lines:
      - "Verum, quia difficile foret presentes litteras ad singula queque loca in quibus expediens fuerit deferri,"
      - "volumus, ac motu et scientia similibus decernimus,"
      - "quod illarum transumptis manu publici notarii inde rogati subscriptis,"
      - "et sigillo alicujus persone in ecclesiastica dignitate constitute, seu curie ecclesiastice munitis,"
      - "ea prorsus fides in judicio et extra ac alias ubilibet adhibeatur, que presentibus adhiberetur, si essent exhibite vel ostense."
  - id: sanctio
    title: "The penalty clause"
    lines:
      - "Nulli ergo omnino hominum liceat hanc paginam nostre commendationis, ortationis, requisitionis, donationis,"
      - "concessionis, assignationis, constitutionis, deputationis, decreti, mandati, inhibitionis, et voluntatis,"
      - "infringere, vel ei ausu temerario contraire."
      - "Si quis autem hoc attemptare presumpserit,"
      - "indignationem Omnipotentis Dei ac beatorum Petri et Pauli apostolorum ejus se noverit incursurum."
  - id: datum
    title: "The date: Rome, 4 May 1493"
    lines:
      - "Datum Rome apud Sanctum Petrum, anno Incarnationis Dominice millesimo quadringentesimo nonagesimo tertio,"
      - "quarto nonas Maii, pontificatus nostri anno primo."
  - id: notae
    title: "The chancery notes"
    lines:
      - "Gratis de mandato sanctissimi Domini nostri pape."
      - "Jun[io]."
      - "Pro r[eferenda]rio, A. DE MUCCIARELLIS."
      - "Pro Jo. BUF[OLINUS], A. SANTOSEVERINO."
      - "L. PODOCATHARUS."
