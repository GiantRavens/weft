# Notes for 靜夜思.
- id: n.lb.1.sound
  attach: lb.1
  kind: editorial
  status: draft
  text: "The default sound is the Tang reading, how Li Bai's contemporaries read these characters, reconstructed by Hugh Stimson. It differs sharply from modern Mandarin: 月 'moon' was ngiuæt, ending in -t. Mandarin lost that ending (yuè); Cantonese kept it (jyut6). Try the three readings in the Loom."
- id: n.lb.1.metre
  attach: lb.1.5
  kind: editorial
  status: draft
  text: "A five-character quatrain (五言絕句). Each syllable is level (○) or oblique (●) by its Tang tone, and lines 1, 2 and 4 rhyme: 光 guɑng, 霜 shriɑng, 鄉 xiɑng. The metre row is computed from the Tang readings, not typed in."
- id: n.lb.1.chuang
  attach: lb.1.1
  kind: editorial
  status: draft
  text: "床 is usually read 'bed', which places the speaker indoors, seeing moonlight by the bed. Some scholars argue that in Tang usage it could mean a well's railing or a folding seat, which would place him outdoors. The treebank and most readers take 'bed'."
- id: n.lb.2.yi
  attach: lb.2.1
  kind: editorial
  status: draft
  text: "疑, 'suspect, wonder whether': the speaker first takes the moonlight on the ground for frost. The third line resolves it when he lifts his head to the moon."
- id: n.lb.3.text
  attach: lb.3
  kind: editorial
  status: draft
  text: "This is the familiar text, fixed by later anthologies such as Three Hundred Tang Poems (1763), and this edition titles the poem 夜思, 'Night Thought'. The oldest printed edition of Li Bai's works, from the Song dynasty, reads 看月光 'see the moonlight' in line 1 and 望山月 'gaze at the mountain moon' here."
- id: n.lb.4.xiang
  attach: lb.4.5
  kind: editorial
  status: draft
  text: "鄉, 'home village': Unicode records no Tang reading for this form of the character, so Weft borrows the reading xiɑng from its glyph variant 鄕 and says so in the provenance line. It completes the rhyme."
