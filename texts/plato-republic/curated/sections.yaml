- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
  date: 2026-10-18
  why: "corrections to the GLAUx automatic parse of 514a-515e: 41 of 489 tokens corrected (17 lemmas, 38 morph tags). ἦν in ἦν δʼ ἐγώ lemmatized as εἰμί instead of ἠμί; neuter things (the objects carried past, τὸ ὄν, τῷ ὄντι) parsed as masculine; accusative objects of ἰδέ and ὅρα parsed as nominatives, and subjects parsed as accusatives; ἰδέ parsed as an interjection instead of the imperative of ὁράω; οἷον and adverbs parsed as pronouns or prepositions; wrong headwords (ὁμοιόω for ὅμοιος, ἄνειμι for ἀνίημι, ἀδυνατόω for ἀδυνατέω, παρέρχομαι for πάρειμι); one crasis (ταὐτόν)"
  status: draft
  set:
    rep.514.2.1: {lemma: ὁράω, morph: v2sama---}   # ἰδὲ: aorist imperative of ὁράω with object ἀνθρώπους, parsed as the interjection ἰδέ
    rep.514.2.4: {morph: d--------}   # οἷον: 'as it were', adverbial
    rep.514.2.9: {lemma: ἀναπετάννυμι, morph: v-srpefa-}   # ἀναπεπταμένην: perfect participle of ἀναπετάννυμι, lemmatized as the participle itself and tagged as an adjective
    rep.514.3.26: {lemma: πόρρωθεν}   # πόρρωθεν: the Attic form has its own LSJ entry; GLAUx gives πρόσωθεν
    rep.514.3.27: {morph: v-sppena-}   # καόμενον: agrees with φῶς, neuter
    rep.514.4.8: {morph: d--------}   # ἐπάνω: adverb 'above' with ὁδόν, governs nothing
    rep.514.4.12: {lemma: ὁράω, morph: v2sama---}   # ἰδὲ: aorist imperative 'see', parsed as an interjection
    rep.514.4.13: {morph: n-s---na-}   # τειχίον: object of ἰδέ
    rep.514.4.14: {morph: v-srpena-}   # παρῳκοδομημένον: agrees with τειχίον, accusative
    rep.514.6.26: {morph: v-prpena-}   # εἰργασμένα: agrees with the accusative objects of ὅρα
    rep.514.6.27: {morph: d--------}   # οἷον: 'as', adverbial
    rep.515.1.1: {morph: a-s---fa-}   # ἄτοπον: agrees with εἰκόνα, feminine (two-termination adjective)
    rep.515.2.1: {lemma: ὅμοιος, morph: a-p---ma-}   # ὁμοίους: the adjective 'like', agreeing with δεσμώτας, parsed as an imperfect of ὁμοιόω
    rep.515.2.3: {lemma: ἠμί, morph: v1siia---}   # ἦν: ἦν δʼ ἐγώ 'said I', imperfect of ἠμί, parsed as 3rd sg of εἰμί
    rep.515.2.29: {morph: d--------}   # καταντικρὺ: adverb made substantive by τό, as at 515.8
    rep.515.4.3: {morph: l-p---ng-}   # τῶν: the things carried past, neuter
    rep.515.4.4: {morph: v-pppeng-}   # παραφερομένων: neuter
    rep.515.4.6: {lemma: αὐτός, morph: a-s---nn-}   # ταὐτὸν: crasis of τὸ αὐτόν, predicate nominative 'the same', glossed as the adjective
    rep.515.4.7: {morph: a-s---nn-}   # τοῦτο: subject of the verbless clause
    rep.515.8.6: {morph: l-s---nn-}   # τὸ: subject of ἔχοι; ἠχώ is the object
    rep.515.8.7: {morph: n-s---nn-}   # δεσμωτήριον: subject of ἔχοι
    rep.515.8.9: {lemma: ὁ, morph: l-s---ng-}   # τοῦ: article of τοῦ καταντικρύ, parsed as the relative
    rep.515.8.15: {lemma: πάρειμι}   # παριόντων: participle of πάρειμι (εἶμι 'go'), GLAUx gives the suppletive παρέρχομαι
    rep.515.8.27: {lemma: πάρειμι}   # παριοῦσαν: participle of πάρειμι (εἶμι)
    rep.515.10.3: {lemma: ἠμί, morph: v1siia---}   # ἦν: ἦν δʼ ἐγώ, imperfect of ἠμί
    rep.515.10.17: {morph: l-p---ng-}   # τῶν: the manufactured things, neuter
    rep.515.10.18: {morph: a-p---ng-}   # σκευαστῶν: neuter, 'manufactured things'
    rep.515.12.3: {lemma: ἠμί, morph: v1siia---}   # ἦν: ἦν δʼ ἐγώ, imperfect of ἠμί
    rep.515.12.23: {morph: a-p---nn-}   # τοιάδε: subject of συμβαίνοι
    rep.515.13.30: {lemma: ἀδυνατέω, morph: v3spoa---}   # ἀδυνατοῖ: optative of ἀδυνατέω parallel to ἀλγοῖ, parsed as an indicative of a nonexistent ἀδυνατόω
    rep.515.13.33: {morph: p-p---ng-}   # ὧν: antecedent ἐκεῖνα, neuter
    rep.515.14.19: {morph: d-------c}   # ἐγγυτέρω: comparative adverb
    rep.515.14.25: {morph: v-pppana-}   # ὄντα: 'things that more are', neuter plural, parsed as masculine singular
    rep.515.15.4: {morph: a-s---na-}   # ἕκαστον: each of the passing objects, neuter
    rep.515.15.5: {morph: l-p---ng-}   # τῶν: the passing objects, neuter
    rep.515.15.6: {lemma: πάρειμι, morph: v-pppang-}   # παριόντων: the passing objects, neuter; participle of πάρειμι (εἶμι)
    rep.515.15.12: {lemma: ὅστις, morph: p-s---nn-}   # ὅτι: read as ὅ τι, indirect question 'what it is', subject of ἔστιν, parsed as the conjunction
    rep.515.18.27: {morph: l-s---nd-}   # τῷ: τῷ ὄντι 'in reality', neuter
    rep.515.18.28: {morph: v-sppand-}   # ὄντι: neuter
    rep.515.20.3: {lemma: ἠμί, morph: v1siia---}   # ἦν: ἦν δʼ ἐγώ, imperfect of ἠμί
    rep.515.20.19: {lemma: ἀνίημι, morph: v3saoa---}   # ἀνείη: aorist optative of ἀνίημι 'let go', parsed as a present of ἄνειμι
