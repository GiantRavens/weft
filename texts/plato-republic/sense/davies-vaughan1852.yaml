# John Llewelyn Davies and David James Vaughan, The Republic of Plato (1852), book VII, 514a1-517a7 (the cave),
# from the archive.org OCR (cu31924014570208) of a later A. L. Burt reprint, pages 257-260, checked
# against the page images (leaves 295-298). Running heads ('Book VII.] THE REPUBLIC OF PLATO. 257' and
# the like), page numbers and the signature mark '17' are dropped; line-break hyphens are joined. The
# print sets a space before ? ; : , and the space is closed up throughout. 'fellow-prisoners' (259) falls
# at a line break and is kept hyphenated as a compound. The italics on 'appears' and 'is' (516b) are not
# marked. The Homer lines are quoted as printed, with the OCR's straight quote marks for the print's
# curly ones. Every other OCR correction, as found in the OCR -> as printed (line-break joins listed
# with the misreadings):
#   'nat' ural' -> 'natural'; 'con- cerned' -> 'concerned'; 'im- possible' -> 'impossible';
#   'be- hind' -> 'behind'; 'prison- ers' -> 'prisoners'; 'They resemble ns,' -> 'They resemble us,';
#   'com- T?elled' -> 'compelled'; ''Now consider' -> 'Now consider';
#   'natur* brought' -> 'nature brought'; 'sup- pose' -> 'suppose'; 'vdth-pain' -> 'with pain';
#   'to liim' -> 'to him'; 'compel hira' -> 'compel him'; 'consider tliem' -> 'consider them';
#   'really clearei' -> 'really clearer'; 'mak- ing' -> 'making'; 'find- ing' -> 'finding';
#   'man- ner' -> 'manner'; 'com- panions' -> 'companions'; 'AVhat then' -> 'What then';
#   'habita- tion' -> 'habitation'; 'fellow- prisoners' -> 'fellow-prisoners'; 'ob- ject' -> 'object';
#   'he will "covet' -> 'he will covet'; 'Do you n(-4 rather' -> 'Do you not rather';
#   'describcB' -> 'describes'; '" To drudge' -> '"To drudge'; 'enter- tain' -> 'entertain';
#   'unsteady, — and' -> 'unsteady,—and'; 'time, — would' -> 'time,—would'.
# Long speeches are split at the translators' sentence and clause ends so each span sits by its Greek.
translation: davies-vaughan1852
aligned_by: hand, phase 0
spans:
- lines:
  - rep.514.1
  - rep.514.1
  text: Now then, I proceeded to say, go on to compare our natural condition, so far as education and ignorance
    are concerned, to a state of things like the following.
- lines:
  - rep.514.2
  - rep.514.2
  text: Imagine a number of men living in an underground cavernous chamber, with an entrance open to the light,
    extending along the entire length of the cavern, in which they have been confined, from their childhood, with
    their legs and necks so shackled,
- lines:
  - rep.514.3
  - rep.514.3
  text: 'that they are obliged to sit still and look straight forwards, because their chains render it impossible
    for them to turn their heads round: and imagine a bright fire burning some way off, above and behind them,'
- lines:
  - rep.514.4
  - rep.514.4
  text: and an elevated roadway passing between the fire and the prisoners, with a low wall built along it, like
    the screens which conjurors put up in front of their audience, and above which they exhibit their wonders.
- lines:
  - rep.514.5
  - rep.514.5
  text: I have it, he replied.
- lines:
  - rep.514.6
  - rep.514.6
  text: Also figure to yourself a number of persons walking behind this wall, and carrying with them statues of
    men, and images of other animals, wrought in wood and stone and all kinds of materials, together with various
    other articles, which overtop the wall; and, as you might expect, let some of the passers-by be talking, and
    others silent.
- lines:
  - rep.515.1
  - rep.515.1
  text: You are describing a strange scene, and strange prisoners.
- lines:
  - rep.515.2
  - rep.515.2
  text: They resemble us, I replied. For let me ask you, in the first place, whether persons so confined could have
    seen anything of themselves or of each other, beyond the shadows thrown by the fire upon the part of the cavern
    facing them?
- lines:
  - rep.515.3
  - rep.515.3
  text: Certainly not, if you suppose them to have been compelled all their lifetime to keep their heads unmoved.
- lines:
  - rep.515.4
  - rep.515.4
  text: And is not their knowledge of the things carried past them equally limited?
- lines:
  - rep.515.5
  - rep.515.5
  text: Unquestionably it is.
- lines:
  - rep.515.6
  - rep.515.6
  text: And if they were able to converse with one another, do you not think that they would be in the habit of
    giving names to the objects which they saw before them?
- lines:
  - rep.515.7
  - rep.515.7
  text: Doubtless they would.
- lines:
  - rep.515.8
  - rep.515.8
  text: 'Again: if their prison-house returned an echo from the part facing them, whenever one of the passers-by
    opened his lips, to what, let me ask you, could they refer the voice, if not to the shadow which was passing?'
- lines:
  - rep.515.9
  - rep.515.9
  text: Unquestionably they would refer it to that.
- lines:
  - rep.515.10
  - rep.515.10
  text: Then surely such persons would hold the shadows of those manufactured articles to be the only realities.
- lines:
  - rep.515.11
  - rep.515.11
  text: Without a doubt they would.
- lines:
  - rep.515.12
  - rep.515.12
  text: Now consider what would happen if the course of nature brought them a release from their fetters, and a
    remedy for their foolishness, in the following manner.
- lines:
  - rep.515.13
  - rep.515.13
  text: Let us suppose that one of them has been released, and compelled suddenly to stand up, and turn his neck
    round and walk with open eyes towards the light; and let us suppose that he goes through all these actions with
    pain, and that the dazzling splendour renders him incapable of discerning those objects of which he used formerly
    to see the shadows.
- lines:
  - rep.515.14
  - rep.515.14
  text: What answer should you expect him to make, if some one were to tell him that in those days he was watching
    foolish phantoms, but that now he is somewhat nearer to reality, and is turned towards things more real, and
    sees more correctly;
- lines:
  - rep.515.15
  - rep.515.15
  text: above all, if he were to point out to him the several objects that are passing by, and question him, and
    compel him to answer what they are?
- lines:
  - rep.515.16
  - rep.515.16
  text: Should you not expect him to be puzzled, and to regard his old visions as truer than the objects now forced
    upon his notice?
- lines:
  - rep.515.17
  - rep.515.17
  text: Yes, much truer.
- lines:
  - rep.515.18
  - rep.515.18
  text: And if he were further compelled to gaze at the light itself, would not his eyes, think you, be distressed,
    and would he not shrink and turn away to the things which he could see distinctly, and consider them to be really
    clearer than the things pointed out to him?
- lines:
  - rep.515.19
  - rep.515.19
  text: Just so.
- lines:
  - rep.515.20
  - rep.515.20
  text: And if some one were to drag him violently up the rough and steep ascent from the cavern, and refuse to
    let him go till he had drawn him out into the light of the sun,
- lines:
  - rep.515.21
  - rep.515.21
  text: would he not, think you, be vexed and indignant at such treatment, and on reaching the light, would he not
    find his eyes so dazzled by the glare as to be incapable of making out so much as one of the objects that are
    now called true?
- lines:
  - rep.516.1
  - rep.516.1
  text: Yes, he would find it so at first.
- lines:
  - rep.516.2
  - rep.516.2
  text: Hence, I suppose, habit will be necessary to enable him to perceive objects in that upper world.
- lines:
  - rep.516.3
  - rep.516.3
  text: At first he will be most successful in distinguishing shadows; then he will discern the reflections of men
    and other things in water, and afterwards the realities;
- lines:
  - rep.516.4
  - rep.516.4
  text: and after this he will raise his eyes to encounter the light of the moon and stars, finding it less difficult
    to study the heavenly bodies and the heaven itself by night, than the sun and the sun's light by day.
- lines:
  - rep.516.5
  - rep.516.5
  text: Doubtless.
- lines:
  - rep.516.6
  - rep.516.6
  text: Last of all, I imagine, he will be able to observe and contemplate the nature of the sun, not as it appears
    in water or on alien ground, but as it is in itself in its own territory.
- lines:
  - rep.516.7
  - rep.516.7
  text: Of course.
- lines:
  - rep.516.8
  - rep.516.8
  text: His next step will be to draw the conclusion, that the sun is the author of the seasons and the years, and
    the guardian of all things in the visible world, and in a manner the cause of all those things which he and
    his companions used to see.
- lines:
  - rep.516.9
  - rep.516.9
  text: Obviously, this will be his next step.
- lines:
  - rep.516.10
  - rep.516.10
  text: What then? When he recalls to mind his first habitation, and the wisdom of the place, and his old fellow-prisoners,
    do you not think he will congratulate himself on the change, and pity them?
- lines:
  - rep.516.11
  - rep.516.11
  text: Assuredly he will.
- lines:
  - rep.516.12
  - rep.516.12
  text: And if it was their practice in those days to receive honour and commendations one from another, and to
    give prizes to him who had the keenest eye for a passing object, and who remembered best all that used to precede
    and follow and accompany it,
- lines:
  - rep.516.13
  - rep.516.13
  text: and from these data divined most ably what was going to come next, do you fancy that he will covet these
    prizes, and envy those who receive honour and exercise authority among them? Do you not rather imagine that
    he will feel what Homer describes, and wish extremely "To drudge on the lands of a master, Under a portionless
    wight," and be ready to go through anything, rather than entertain those opinions, and live in that fashion?
- lines:
  - rep.516.14
  - rep.516.14
  text: For my own part, he replied, I am quite of that opinion. I believe he would consent to go through anything
    rather than live in that way.
- lines:
  - rep.516.15
  - rep.516.15
  text: And now consider what would happen if such a man were to descend again and seat himself on his old seat?
    Coming so suddenly out of the sun, would he not find his eyes blinded with the gloom of the place?
- lines:
  - rep.516.16
  - rep.516.16
  text: Certainly, he would.
- lines:
  - rep.516.17
  - rep.516.17
  text: And if he were forced to deliver his opinion again, touching the shadows aforesaid, and to enter the lists
    against those who had always been prisoners, while his sight continued dim, and his eyes unsteady,—and if this
    process of initiation lasted a considerable time,—
- lines:
  - rep.516.18
  - rep.516.18
  text: would he not be made a laughingstock, and would it not be said of him, that he had gone up only to come
    back again with his eyesight destroyed, and that it was not worth while even to attempt the ascent?
- lines:
  - rep.516.19
  - rep.516.19
  text: And if any one endeavoured to set them free and carry them to the light, would they not go so far as to
    put him to death, if they could only manage to get him into their power?
- lines:
  - rep.516.20
  - rep.516.20
  text: Yes, that they would.
