# Benjamin Jowett, The Republic of Plato, third edition (1888), book VII, 514a1-517a7 (the cave), verbatim
# from Project Gutenberg #55201. Left out: Jowett's Stephanus markers (*514A* to *517A*), his marginal
# [Sidenote: ...] summaries, the Gutenberg page numbers {215} to {217}, and the footnote mark [1] after
# 'before them' (515b) with its note ('Reading [Greek: paro/nta].'). The ':--' and ',--' dashes are his.
# Jowett runs several Greek speeches into one paragraph; these are split at his sentence and clause ends,
# so each span sits by the Greek it renders: 514a-b at 'chained' / 'at a distance,', 515c-d at 'the
# shadows;' / ',--what will be his reply?' / 'name them,--', 516d at 'were together;', 517a at
# 'considerable),' / 'ascending;'. The Homer line is quoted as Jowett prints it, in single quotes.
translation: jowett1888
aligned_by: hand, phase 0
spans:
- lines:
  - rep.514.1
  - rep.514.1
  text: And now, I said, let me show in a figure how far our nature is enlightened or unenlightened:--
- lines:
  - rep.514.2
  - rep.514.2
  text: Behold! human beings living in a underground den, which has a mouth open towards the light and reaching
    all along the den; here they have been from their childhood, and have their legs and necks chained
- lines:
  - rep.514.3
  - rep.514.3
  text: so that they cannot move, and can only see before them, being prevented by the chains from turning round
    their heads. Above and behind them a fire is blazing at a distance,
- lines:
  - rep.514.4
  - rep.514.4
  text: and between the fire and the prisoners there is a raised way; and you will see, if you look, a low wall
    built along the way, like the screen which marionette players have in front of them, over which they show the
    puppets.
- lines:
  - rep.514.5
  - rep.514.5
  text: I see.
- lines:
  - rep.514.6
  - rep.514.6
  text: And do you see, I said, men passing along the wall carrying all sorts of vessels, and statues and figures
    of animals made of wood and stone and various materials, which appear over the wall? Some of them are talking,
    others silent.
- lines:
  - rep.515.1
  - rep.515.1
  text: You have shown me a strange image, and they are strange prisoners.
- lines:
  - rep.515.2
  - rep.515.2
  text: Like ourselves, I replied; and they see only their own shadows, or the shadows of one another, which the
    fire throws on the opposite wall of the cave?
- lines:
  - rep.515.3
  - rep.515.3
  text: True, he said; how could they see anything but the shadows if they were never allowed to move their heads?
- lines:
  - rep.515.4
  - rep.515.4
  text: And of the objects which are being carried in like manner they would only see the shadows?
- lines:
  - rep.515.5
  - rep.515.5
  text: Yes, he said.
- lines:
  - rep.515.6
  - rep.515.6
  text: And if they were able to converse with one another, would they not suppose that they were naming what was
    actually before them?
- lines:
  - rep.515.7
  - rep.515.7
  text: Very true.
- lines:
  - rep.515.8
  - rep.515.8
  text: And suppose further that the prison had an echo which came from the other side, would they not be sure to
    fancy when one of the passers-by spoke that the voice which they heard came from the passing shadow?
- lines:
  - rep.515.9
  - rep.515.9
  text: No question, he replied.
- lines:
  - rep.515.10
  - rep.515.10
  text: To them, I said, the truth would be literally nothing but the shadows of the images.
- lines:
  - rep.515.11
  - rep.515.11
  text: That is certain.
- lines:
  - rep.515.12
  - rep.515.12
  text: And now look again, and see what will naturally follow if the prisoners are released and disabused of their
    error.
- lines:
  - rep.515.13
  - rep.515.13
  text: At first, when any of them is liberated and compelled suddenly to stand up and turn his neck round and walk
    and look towards the light, he will suffer sharp pains; the glare will distress him, and he will be unable to
    see the realities of which in his former state he had seen the shadows;
- lines:
  - rep.515.14
  - rep.515.14
  text: and then conceive some one saying to him, that what he saw before was an illusion, but that now, when he
    is approaching nearer to being and his eye is turned towards more real existence, he has a clearer vision,--what
    will be his reply?
- lines:
  - rep.515.15
  - rep.515.15
  text: And you may further imagine that his instructor is pointing to the objects as they pass and requiring him
    to name them,--
- lines:
  - rep.515.16
  - rep.515.16
  text: will he not be perplexed? Will he not fancy that the shadows which he formerly saw are truer than the objects
    which are now shown to him?
- lines:
  - rep.515.17
  - rep.515.17
  text: Far truer.
- lines:
  - rep.515.18
  - rep.515.18
  text: And if he is compelled to look straight at the light, will he not have a pain in his eyes which will make
    him turn away to take refuge in the objects of vision which he can see, and which he will conceive to be in
    reality clearer than the things which are now being shown to him?
- lines:
  - rep.515.19
  - rep.515.19
  text: True, he said.
- lines:
  - rep.515.20
  - rep.515.20
  text: And suppose once more, that he is reluctantly dragged up a steep and rugged ascent, and held fast until
    he is forced into the presence of the sun himself,
- lines:
  - rep.515.21
  - rep.515.21
  text: is he not likely to be pained and irritated? When he approaches the light his eyes will be dazzled, and
    he will not be able to see anything at all of what are now called realities.
- lines:
  - rep.516.1
  - rep.516.1
  text: Not all in a moment, he said.
- lines:
  - rep.516.2
  - rep.516.2
  text: He will require to grow accustomed to the sight of the upper world.
- lines:
  - rep.516.3
  - rep.516.3
  text: And first he will see the shadows best, next the reflections of men and other objects in the water, and
    then the objects themselves;
- lines:
  - rep.516.4
  - rep.516.4
  text: then he will gaze upon the light of the moon and the stars and the spangled heaven; and he will see the
    sky and the stars by night better than the sun or the light of the sun by day?
- lines:
  - rep.516.5
  - rep.516.5
  text: Certainly.
- lines:
  - rep.516.6
  - rep.516.6
  text: Last of all he will be able to see the sun, and not mere reflections of him in the water, but he will see
    him in his own proper place, and not in another; and he will contemplate him as he is.
- lines:
  - rep.516.7
  - rep.516.7
  text: Certainly.
- lines:
  - rep.516.8
  - rep.516.8
  text: He will then proceed to argue that this is he who gives the season and the years, and is the guardian of
    all that is in the visible world, and in a certain way the cause of all things which he and his fellows have
    been accustomed to behold?
- lines:
  - rep.516.9
  - rep.516.9
  text: Clearly, he said, he would first see the sun and then reason about him.
- lines:
  - rep.516.10
  - rep.516.10
  text: And when he remembered his old habitation, and the wisdom of the den and his fellow-prisoners, do you not
    suppose that he would felicitate himself on the change, and pity them?
- lines:
  - rep.516.11
  - rep.516.11
  text: Certainly, he would.
- lines:
  - rep.516.12
  - rep.516.12
  text: And if they were in the habit of conferring honours among themselves on those who were quickest to observe
    the passing shadows and to remark which of them went before, and which followed after, and which were together;
- lines:
  - rep.516.13
  - rep.516.13
  text: and who were therefore best able to draw conclusions as to the future, do you think that he would care for
    such honours and glories, or envy the possessors of them? Would he not say with Homer, 'Better to be the poor
    servant of a poor master,' and to endure anything, rather than think as they do and live after their manner?
- lines:
  - rep.516.14
  - rep.516.14
  text: Yes, he said, I think that he would rather suffer anything than entertain these false notions and live in
    this miserable manner.
- lines:
  - rep.516.15
  - rep.516.15
  text: Imagine once more, I said, such an one coming suddenly out of the sun to be replaced in his old situation;
    would he not be certain to have his eyes full of darkness?
- lines:
  - rep.516.16
  - rep.516.16
  text: To be sure, he said.
- lines:
  - rep.516.17
  - rep.516.17
  text: And if there were a contest, and he had to compete in measuring the shadows with the prisoners who had never
    moved out of the den, while his sight was still weak, and before his eyes had become steady (and the time which
    would be needed to acquire this new habit of sight might be very considerable),
- lines:
  - rep.516.18
  - rep.516.18
  text: would he not be ridiculous? Men would say of him that up he went and down he came without his eyes; and
    that it was better not even to think of ascending;
- lines:
  - rep.516.19
  - rep.516.19
  text: and if any one tried to loose another and lead him up to the light, let them only catch the offender, and
    they would put him to death.
- lines:
  - rep.516.20
  - rep.516.20
  text: No question, he said.
