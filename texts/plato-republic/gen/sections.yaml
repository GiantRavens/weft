  text: καὶ ἐκ τούτων δὴ δυνατώτατα ἀπομαντευομένῳ τὸ μέλλον ἥξειν, δοκεῖς ἂν αὐτὸν ἐπιθυμητικῶς αὐτῶν ἔχειν καὶ ζηλοῦν τοὺς παρʼ ἐκείνοις τιμωμένους τε καὶ ἐνδυναστεύοντας, ἢ τὸ τοῦ Ὁμήρου ἂν πεπονθέναι
    καὶ σφόδρα βούλεσθαι ἐπάρουρον ἐόντα θητευέμεν ἄλλῳ ἀνδρὶ παρʼ ἀκλήρῳ καὶ ὁτιοῦν ἂν πεπονθέναι μᾶλλον ἢ ʼκεῖνά τε δοξάζειν καὶ ἐκείνως ζῆν;
