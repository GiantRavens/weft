  lead: The allegory of the cave is an allegory presented by the Greek philosopher Plato in his work Republic
    (514a–520a, Book VII) to compare "the effect of education (παιδεία) and the lack of it on our nature".
    It is written as a dialogue between Plato's brother Glaucon and his mentor Socrates and is narrated
    by the latter. The allegory is presented after the analogy of the Sun (508b–509c) and the analogy
    of the divided line (509d–511e).
