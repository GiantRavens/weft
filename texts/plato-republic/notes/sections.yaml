# Notes for Plato, Republic 514a-517a, the image of the cave. Editorial notes are drafts until a reviewer lifts them.
- id: n.rep.dialogue
  attach: rep.514.1
  kind: editorial
  status: draft
  leans_on: "Republic 1.327a; 7.517a8"
  text: "The Republic is a narrated dialogue: Socrates tells, in the first person, a conversation he had the day before at the Piraeus (1.327a). So his own speeches carry εἶπον, 'I said', or ἦν δʼ ἐγώ, 'said I', and the replies carry ἔφη, 'he said'. In this passage the one who answers is Glaucon, Plato's brother, whom Socrates addresses by name just after it (517a8). The glosses keep these speech verbs where the Greek has them."
- id: n.rep.eikon
  attach: rep.514.1.5
  kind: editorial
  status: draft
  leans_on: "Republic 7.514a, 517a8-c; LSJ s.v. ἀπεικάζω"
  text: "Socrates introduces what follows as a likeness: ἀπείκασον, 'liken', our nature in respect of education and the lack of it to a condition such as this. The name 'allegory of the cave' is a later one; the dialogue calls it an εἰκών, an image: Glaucon uses the word at 515a and Socrates at 517a8. The interpretation comes immediately after this passage: the prison is the region revealed by sight, the light of the fire in it is likened to the power of the sun, and the ascent and the view of things above are the soul's ascent to the intelligible region, where the last thing seen, with difficulty, is the form of the good. The page stops where that interpretation begins."
- id: n.rep.reading
  attach: rep.515.6.14
  kind: editorial
  status: draft
  leans_on: "Jowett (1888), footnote to this sentence; the Perseus text of Burnet"
  text: "Burnet's text, printed here, reads ταῦτα ... τὰ ὄντα, that the prisoners would take the shadows they see to be 'the things that are'. Jowett translates a different reading, παρόντα, 'the things present', as his footnote says, and gives 'that they were naming what was actually before them'. His version of this line therefore differs from the Greek shown."
- id: n.rep.sun
  attach: rep.516.6.5
  kind: editorial
  status: draft
  leans_on: "Republic 6.507b-509b, 7.516b-c"
  text: "The freed prisoner sees shadows first, then reflections in water, then the things themselves, then the heavens by night, and last the sun itself, in its own place. He then reasons that the sun produces the seasons and the years, governs everything in the visible region, and is in a way the cause of all that he and his companions used to see. The passage draws on the image of the sun in book 6, where the sun is said to stand to sight and visible things as the good stands to intelligence and intelligible things."
- id: n.rep.homer
  attach: rep.516.13.28
  kind: editorial
  status: draft
  leans_on: "Homer, Odyssey 11.489-491; the Perseus text, which marks the words as a paraphrase of verse"
  text: "τὸ τοῦ Ὁμήρου, 'the thing of Homer', introduces words adapted from Homer, in Homeric Greek: ἐπάρουρον ἐόντα θητευέμεν ἄλλῳ ἀνδρὶ παρʼ ἀκλήρῳ, 'being on the land, to work as a hired man for another, a man without an allotment'. In the Odyssey (11.489-491) the shade of Achilles says he would rather be such a man on earth than rule over all the dead; Homer has the participle in the nominative, ἐπάρουρος ἐών, and Plato puts it in the accusative to fit his own sentence. Socrates applies it to the one who has come out: he would rather endure anything than hold the prisoners' opinions and live their life. The forms ἐόντα and θητευέμεν are epic, not Attic; the glosses treat them as the participle and infinitive they are."
- id: n.rep.death
  attach: rep.516.19.16
  kind: editorial
  status: draft
  leans_on: "Republic 7.517a; Plato, Apology and Phaedo"
  text: "The passage ends with the prisoners ready to kill anyone who tried to free them and lead them up, if they could get him into their hands. Glaucon agrees. The words can be read against the trial and death of Socrates in 399 BC, which Plato describes in the Apology and the Phaedo. The text does not name Socrates here, and the connection is an interpretation, not something the passage states."
- id: n.rep.add
  attach: rep.516.15.21
  kind: editorial
  status: draft
  leans_on: "the Perseus TEI of Burnet's text, which marks the word as an editor's addition"
  text: "This ἄν is supplied by the editor: the Perseus text of Burnet marks it as an addition to what the manuscripts give. It makes the optative σχοίη potential, 'would he not have his eyes full of darkness'. The page prints it without a mark."
