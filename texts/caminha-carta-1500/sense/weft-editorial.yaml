# Weft's editorial translation, close to the Portuguese, one span per folio; draft. Greenlee's 1938 Hakluyt translation is in copyright and cited on the page.
translation: weft-editorial
aligned_by: 'hand: one span per folio'
spans:
- lines:
  - cam.1.1
  - cam.1.15
  text: 'Sir: although the captain-major of this your fleet, and likewise the other captains, are writing to Your Highness the news of the finding of this your new land, which was now found on this voyage,
    I shall not fail to give Your Highness my account of it as well, as best I can, though to tell and speak of it well I know how to do worse than any; yet let Your Highness take my ignorance for good
    will, and believe for certain that, to make it fairer or fouler, I shall set down here no more than what I saw and what seemed to me. Of the seamanship and the courses of the voyage I shall give Your
    Highness no account here, for I would not know how, and the pilots must have that care; and so, Sir, of what I have to tell I begin, and say:'
- lines:
  - cam.2.1
  - cam.2.26
  text: we met birds they call fura-buchos, and on that day, at the hour of vespers, we had sight of land, namely, first of a great mountain, very high and round, and of other lower ranges to the south
    of it, and of flat land with great groves of trees; to which high mountain the captain gave the name Monte Pascoal, and to the land, the Land of Vera Cruz. He had the lead cast; they found twenty-five
    fathoms, and at sunset, some six leagues from land, we dropped anchor in nineteen fathoms, a clean anchorage. There we lay all that night, and on Thursday morning we made sail and steered straight for
    the land, the small ships going ahead through seventeen, sixteen, fourteen and nine fathoms, to half a league from land, where we all dropped anchor opposite the mouth of a river; and we would have
    reached this anchorage at about ten o'clock, a little more or less. And from there we had sight of men walking along the beach, some seven or eight according to the small ships, which said so because
    they arrived first. There we put out the boats and skiffs, and at once all the captains of the ships came to this ship of the captain-major, and there they spoke. And the captain sent Nicolau Coelho
    ashore in the boat to look at that river; and as soon as he began to go there, men came down to the beach, by twos and threes, so that when the boat reached the mouth of the river there were eighteen
    or twenty men there, dark-skinned, all naked, with nothing to cover their shame. They carried bows in their hands, and their arrows. They all came stiffly towards the boat, and Nicolau Coelho made them
    a sign to put down their bows, and they put them down. There he could get no speech or understanding of them that was of use, because of the sea breaking on the shore. He only gave them a red cap and
    a linen hood that he wore on his head, and a black sombrero.
- lines:
  - cam.3.1
  - cam.3.24
  text: And one of them gave him a hat of long bird feathers with a small crest of red and grey feathers like a parrot's, and another gave him a large string of tiny white beads that look like seed-pearl,
    which pieces I believe the captain is sending to Your Highness; and with that he turned back to the ships, for it was late and there could be no more speech with them because of the sea. The following
    night the south-east wind blew so hard, with squalls, that it made the ships drag, and especially the flagship. And on Friday morning, at about eight o'clock, a little more or less, on the pilots' advice
    the captain ordered the anchors raised and sail made, and we went along the coast, with the boats and skiff tied astern, towards the north, to see whether we could find a sheltered and good anchorage
    where we might lie to take on water and firewood, not because we were short already, but to provide ourselves here. And when we made sail there were already some sixty or seventy men seated on the beach
    near the river, who had gathered there by little and little. We went along, and the captain ordered the small ships to keep closer to the land and, if they found a safe anchorage for the ships, to strike
    sail. And when we were some ten leagues along the coast from where we had weighed, the said small ships found a reef with a harbour inside it, very good and very safe, with a very wide entrance, and
    they went in and struck sail; and the ships bore down upon them, and a little before sunset they struck sail about a league from the reef and anchored in eleven fathoms. And Afonso Lopes, our pilot,
    being in one of those small ships by the captain's order, as a lively and skilful man for the purpose, went at once into the skiff to sound the harbour inside, and took into a canoe two of those men
    of the land, young and well made, and one of them carried a bow and six or seven arrows,
- lines:
  - cam.4.1
  - cam.4.32
  text: and on the beach many were walking about with their bows and arrows, and it availed them nothing. He brought the two at once, already by night, to the captain, where they were received with much
    pleasure and feasting. Their appearance is that they are dark-skinned, somewhat reddish, with good faces and good noses, well made. They go naked, without any covering; they think nothing of covering
    or showing their private parts, and are as innocent about it as about showing their faces. Both had their lower lips pierced, and set in them a white bone the length of a hand's breadth and the thickness
    of a cotton spindle, sharp at the point like an awl. They put it in from the inside of the lip, and the part that is between the lip and the teeth is shaped like a chess rook, and they wear it fitted
    there in such a way that it causes them no pain and does not hinder their speech, their eating or their drinking. Their hair is straight, and they go shorn, with the hair cut high, more than above the
    comb, of a good size, and shaved to above the ears; and one of them wore below the crown, from temple to temple towards the back, a kind of wig of yellow bird feathers, which would be a span long, very
    thick and very close, covering the back of his head and his ears, and which was stuck to his hair feather by feather with a soft preparation like wax, and yet was not, so that the wig was very round
    and very thick and very even, and needed no more washing to lift it. The captain, when they came, was seated in a chair, with a carpet at his feet for a dais, and well dressed, with a very large gold
    collar at his neck; and Sancho de Tovar and Simão de Miranda and Nicolau Coelho and Aires Correia and the rest of us who are here in the ship with him were seated on the floor,
- lines:
  - cam.5.1
  - cam.5.34
  text: on that carpet. Torches were lit and they came in, and they made no sign of courtesy, nor of speaking to the captain or to anyone; but one of them set eyes on the captain's collar and began to make
    signs with his hand towards the land and then towards the collar, as if telling us that there was gold in the land; and he also saw a silver candlestick, and likewise made signs towards the land and
    then towards the candlestick, as if there were silver too. They were shown a grey parrot that the captain brings here; they took it in their hands at once and pointed to the land, as if there were parrots
    there. They were shown a ram; they took no notice of it. They were shown a hen; they were almost afraid of it and would not put their hands to it, and afterwards took it as if startled. They were given
    to eat there bread and boiled fish, sweetmeats, pastries, honey and dried figs; they would eat almost none of it, and if they tasted anything they spat it out at once. Wine was brought them in a cup;
    they barely put it to their lips, did not like it at all, and wanted no more of it. Water was brought them in a jug; they each took a mouthful and did not drink, but only rinsed their mouths and spat
    it out. One of them saw some white rosary beads, made signs to be given them, and was much pleased with them, and threw them round his neck, and then took them off and wrapped them round his arm, and
    made signs towards the land and then towards the beads and the captain's collar, as if to say they would give gold for them. This we took so because we wished it; but if he meant that he would take
    the beads and the collar too, that we did not choose to understand, because we were not going to give it to him. And afterwards he returned the beads to the man who had given them. And then they stretched
    themselves out on their backs on the carpet to sleep, without troubling in any way to cover their private parts, which were not circumcised, and the hair about them well shaved and trimmed. The captain
    had a cushion put under each one's head, and the one with the wig took good care that it should not be crushed; and a cloak was thrown over them, and they consented, and lay down, and slept.
