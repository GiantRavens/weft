# Weft's editorial translation of the two folios, close to the Portuguese; draft. Greenlee's 1938 Hakluyt translation is in copyright and cited on the page.
translation: weft-editorial
aligned_by: 'hand: one span per folio'
spans:
- lines:
  - cam.1.1
  - cam.1.15
  text: 'Sir: although the captain-major of this your fleet, and likewise the other captains, are writing to Your Highness the news of the finding of this your new land, which was now found on this voyage,
    I shall not fail to give Your Highness my account of it as well, as best I can, though to tell and speak of it well I know how to do worse than any; yet let Your Highness take my ignorance for good
    will, and believe for certain that, to make it fairer or fouler, I shall set down here no more than what I saw and what seemed to me. Of the seamanship and the courses of the voyage I shall give Your
    Highness no account here, for I would not know how, and the pilots must have that care; and so, Sir, of what I have to tell I begin, and say:'
- lines:
  - cam.2.1
  - cam.2.26
  text: we met birds they call fura-buchos, and on that day, at the hour of vespers, we had sight of land, namely, first of a great mountain, very high and round, and of other lower ranges to the south
    of it, and of flat land with great groves of trees; to which high mountain the captain gave the name Monte Pascoal, and to the land, the Land of Vera Cruz. He had the lead cast; they found twenty-five
    fathoms, and at sunset, some six leagues from land, we dropped anchor in nineteen fathoms, a clean anchorage. There we lay all that night, and on Thursday morning we made sail and steered straight for
    the land, the small ships going ahead through seventeen, sixteen, fourteen and nine fathoms, to half a league from land, where we all dropped anchor opposite the mouth of a river; and we would have
    reached this anchorage at about ten o'clock, a little more or less. And from there we had sight of men walking along the beach, some seven or eight according to the small ships, which said so because
    they arrived first. There we put out the boats and skiffs, and at once all the captains of the ships came to this ship of the captain-major, and there they spoke. And the captain sent Nicolau Coelho
    ashore in the boat to look at that river; and as soon as he began to go there, men came down to the beach, by twos and threes, so that when the boat reached the mouth of the river there were eighteen
    or twenty men there, dark-skinned, all naked, with nothing to cover their shame. They carried bows in their hands, and their arrows. They all came stiffly towards the boat, and Nicolau Coelho made them
    a sign to put down their bows, and they put them down. There he could get no speech or understanding of them that was of use, because of the sea breaking on the shore. He only gave them a red cap and
    a linen hood that he wore on his head, and a black sombrero.
