# Notes on Caminha's letter, folios 1r-3r.
- id: n.cam.1.1.letter
  attach: cam.1.1
  kind: editorial
  status: draft
  leans_on: Jaime Cortesão, A Carta de Pero Vaz de Caminha (1943); the Torre do Tombo autograph (gav. 8, m. 2, n. 8); first printing by Aires de Casal, Corografia Brasílica (1817)
  text: 'The letter is the first account of Brazil: seven folios written by the fleet''s scrivener at Porto Seguro and carried back to Lisbon by the supply ship. It lay in the royal archive until 1773 and
    was printed in 1817. The opening is a scrivener''s bow: the captains will report, he reports too, ''as best I can'', and promises to set down no more than he saw. The hand is Caminha''s own; the spelling
    here is the manuscript''s, and the modern form of each word is under ''normalized'' in the word panel.'
- id: n.cam.2.6.pascoal
  attach: cam.2.6.11
  kind: editorial
  status: draft
  leans_on: the letter itself; the Easter of 1500 fell on 19 April, and the sighting was Wednesday 22 April, in the Easter octave
  text: 'Monte Pascoal, the Easter mount, named for the season: the fleet sighted it on the Wednesday after Easter. The land was named Vera Cruz, the True Cross; Cabral''s letter to the king called it the
    Ilha de Vera Cruz, and the name Brazil came later from the dyewood.'
- id: n.cam.2.14.horas
  attach: cam.2.14.6
  kind: editorial
  status: draft
  leans_on: Cortesão 1943 and later editions, which read 'aas dez oras'
  text: The Wikisource transcription prints 'xiij xij oras' here, which the editions read as 'às dez horas', ten o'clock. The transcription is not yet proofread; the edition keeps what it prints, glossed
    as it stands, and the translation follows the editions.
- id: n.cam.2.20.pardos
  attach: cam.2.20.17
  kind: editorial
  status: draft
  leans_on: the letter's own later description of the people (folios 2v-3r); Greenlee 1938, notes
  text: 'pardos, ''dark'' or ''brown'': Caminha''s first word for the people of the coast, whom he describes at length further on, with their bows and arrows, their red and black paint and their bone lip-plugs.
    This is the first European description of the Tupi peoples of the Brazilian coast.'
- id: n.cam.1.9.pero
  attach: cam.1.9.1
  kind: editorial
  status: draft
  leans_on: Houaiss, s.v. pero (adversative conjunction, archaic); Cortesão 1943, glossary
  text: 'pero, ''but, yet'': the old adversative conjunction, from Latin per hoc, common in medieval Portuguese and still in Caminha; it survives in Spanish and has given way in Portuguese to porém and
    mas. Other archaisms of the letter kept here: leixar for deixar, ca ''than'', jouvemos ''we lay'' from jazer.'
- id: n.cam.4.11.tembeta
  attach: cam.4.11.6
  kind: editorial
  status: draft
  leans_on: Hans Staden, Warhaftige Historia (1557), on the Tupinambá lip ornament; Métraux, La civilisation matérielle des tribus Tupi-Guarani (1928)
  text: 'The bone through the lower lip is the tembetá, the lip-plug of the Tupi peoples of the coast, worn by men from initiation; later travellers describe it in stone and in green jade. Caminha measures
    it like a scrivener, a hand''s breadth long and a spindle thick, and notes what it is to the wearer: no pain, no hindrance to speech, eating or drinking.'
- id: n.cam.4.21.cabeleira
  attach: cam.4.22.4
  kind: editorial
  status: draft
  leans_on: Staden 1557 and Thevet, Les singularitez de la France antarctique (1557), on Tupi featherwork fixed with resin
  text: The feather head-dress fixed to the hair 'feather by feather' with a soft preparation like wax is Tupi featherwork glued with resin, which the French and German travellers of the 1550s also describe.
    Caminha's eye for its evenness, 'very round and very thick and very even', is the first European account of it.
- id: n.cam.4.31.names
  attach: cam.4.31.2
  kind: editorial
  status: draft
  leans_on: Greenlee 1938, notes on the captains of Cabral's fleet
  text: Sancho de Tovar was the fleet's second in command (sota-capitão); Simão de Miranda de Azevedo and Nicolau Coelho captained ships, Coelho having sailed with Gama; Aires Correia was the factor who
    was to stay in Calicut, where he was killed that December. Caminha himself, 'we others', sat on the floor with them, and died at Calicut too.
- id: n.cam.5.24.ouro
  attach: cam.5.6.9
  kind: editorial
  status: draft
  leans_on: the letter itself; Greenlee 1938, introduction
  text: 'The gestures towards the gold collar and the silver candlestick are read at once as news of gold and silver in the land, and Caminha admits why: ''this we took so because we wished it''. The letter
    is as candid about the readers'' desire as about the people''s.'
- id: n.cam.5.30.fanadas
  attach: cam.5.30.13
  kind: editorial
  status: draft
  leans_on: Greenlee 1938; the letter's later passages on the women of the coast
  text: 'fanadas, ''circumcised'': Caminha notes that the men were not. The remark, like his measurements of the lip-plug, is a scrivener''s inventory of what a Portuguese reader would ask; the letter returns
    to the people''s bodies several times, and later passages describing the women are franker still.'
