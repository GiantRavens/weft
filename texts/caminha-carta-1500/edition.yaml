# Weft edition of the opening of Pero Vaz de Caminha's letter to King Manuel (Porto Seguro, 1 May 1500): the
# first paragraph of folio 1r and the whole of folio 1v, from the folio-by-folio transcription on Portuguese
# Wikisource (Página:Carta-caminha-folio01r.png, -folio01v.jpg), which keeps the manuscript's spelling
# (capitam, ouuemos, homeës, the tildes and doubled vowels) and its line breaks. The transcription is not yet
# proofread there (pagequality 1); each line is checked verbatim against the pinned page revisions, with the
# words the transcriber broke at a manuscript line end rejoined (verify_corrections) and the superscript of
# the abbreviation seg(und)o written ᵒ.
#   t   the word as transcribed, punctuation attached; .s. is the abbreviation scilicet; xxb, bj, xix... are the
#       scribe's numerals (b = v)
#   n   the modern spelling, typed by hand; the lexicon key and the page's "normalized" form; two words for a
#       contraction (doutras: de outras; todolos: todos os)
#   p   the scribe's / mark, set off by a space
#   Lines are Weft's division at the sentence and the clause; sections are the two folios.
work: caminha-carta-1500
joiner: ' '
verify_strip: <noinclude>.*?</noinclude>|<[^>]+>|\{\{c\||\{\{pt\|[^|]*\||\}\}
verify_corrections:
- ocr: acha mento
  print: achamento
  in: sources/f1r.txt
- ocr: naue gaçom
  print: nauegaçom
  in: sources/f1r.txt
- ocr: ma is ca
  print: mais ca
  in: sources/f1r.txt
- ocr: cõ ta
  print: cõta
  in: sources/f1r.txt
- ocr: nou te
  print: noute
  in: sources/f1v.txt
- ocr: diã te
  print: diãte
  in: sources/f1v.txt
- ocr: p rumo
  print: prumo
  in: sources/f1v.txt
- ocr: co elho
  print: coelho
  in: sources/f1v.txt
- ocr: man dou
  print: mandou
  in: sources/f1v.txt
- ocr: see tas
  print: seetas
  in: sources/f1v.txt
- ocr: antë dimento
  print: antëdimento
  in: sources/f1v.txt
- ocr: sego os
  print: segᵒ os
  in: sources/f1v.txt
- ocr: marinha jem
  print: marinhajem
  in: sources/f1r.txt
