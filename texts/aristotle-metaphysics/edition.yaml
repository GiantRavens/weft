- id: 981b
  title: Book A (I), chapter 1, Bekker 981b
  lines:
  - ὅλως τε σημεῖον τοῦ εἰδότος καὶ μὴ εἰδότος τὸ δύνασθαι διδάσκειν ἐστίν, καὶ διὰ τοῦτο τὴν τέχνην τῆς ἐμπειρίας ἡγούμεθα μᾶλλον ἐπιστήμην εἶναι· δύνανται γάρ, οἱ δὲ οὐ δύνανται διδάσκειν.
  - ἔτι δὲ τῶν αἰσθήσεων οὐδεμίαν ἡγούμεθα εἶναι σοφίαν· καίτοι κυριώταταί γʼ εἰσὶν αὗται τῶν καθʼ ἕκαστα γνώσεις· ἀλλʼ οὐ λέγουσι τὸ διὰ τί περὶ οὐδενός, οἷον διὰ τί θερμὸν τὸ πῦρ, ἀλλὰ μόνον ὅτι θερμόν.
  - τὸ μὲν οὖν πρῶτον εἰκὸς τὸν ὁποιανοῦν εὑρόντα τέχνην παρὰ τὰς κοινὰς αἰσθήσεις θαυμάζεσθαι ὑπὸ τῶν ἀνθρώπων μὴ μόνον διὰ τὸ χρήσιμον εἶναί τι τῶν εὑρεθέντων ἀλλʼ ὡς σοφὸν καὶ διαφέροντα τῶν ἄλλων·
  - πλειόνων δʼ εὑρισκομένων τεχνῶν καὶ τῶν μὲν πρὸς τἀναγκαῖα τῶν δὲ πρὸς διαγωγὴν οὐσῶν, ἀεὶ σοφωτέρους τοὺς τοιούτους ἐκείνων ὑπολαμβάνεσθαι διὰ τὸ μὴ πρὸς χρῆσιν εἶναι τὰς ἐπιστήμας αὐτῶν.
  - ὅθεν ἤδη πάντων τῶν τοιούτων κατεσκευασμένων αἱ μὴ πρὸς ἡδονὴν μηδὲ πρὸς τἀναγκαῖα τῶν ἐπιστημῶν εὑρέθησαν, καὶ πρῶτον ἐν τούτοις τοῖς τόποις οὗ πρῶτον ἐσχόλασαν· διὸ περὶ Αἴγυπτον αἱ μαθηματικαὶ πρῶτον τέχναι συνέστησαν, ἐκεῖ γὰρ ἀφείθη σχολάζειν τὸ τῶν ἱερέων ἔθνος.
  - εἴρηται μὲν οὖν ἐν τοῖς ἠθικοῖς τίς διαφορὰ τέχνης καὶ ἐπιστήμης καὶ τῶν ἄλλων τῶν ὁμογενῶν· οὗ δʼ ἕνεκα νῦν ποιούμεθα τὸν λόγον τοῦτʼ ἐστίν, ὅτι τὴν ὀνομαζομένην σοφίαν περὶ τὰ πρῶτα αἴτια καὶ τὰς ἀρχὰς ὑπολαμβάνουσι πάντες·
  - ὥστε, καθάπερ εἴρηται πρότερον, ὁ μὲν ἔμπειρος τῶν ὁποιανοῦν ἐχόντων αἴσθησιν εἶναι δοκεῖ σοφώτερος, ὁ δὲ τεχνίτης τῶν ἐμπείρων, χειροτέχνου δὲ ἀρχιτέκτων, αἱ δὲ θεωρητικαὶ τῶν ποιητικῶν μᾶλλον.
- id: 982a
  title: Book A (I), chapter 1, Bekker 982a1–3
  lines:
  - ὅτι μὲν οὖν ἡ σοφία περί τινας ἀρχὰς καὶ αἰτίας ἐστὶν ἐπιστήμη, δῆλον.
