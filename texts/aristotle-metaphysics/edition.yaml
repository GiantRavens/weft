- id: 980a
  title: Book A (I), chapter 1, Bekker 980a21–27
  lines:
  - πάντες ἄνθρωποι τοῦ εἰδέναι ὀρέγονται φύσει.
  - σημεῖον δʼ ἡ τῶν αἰσθήσεων ἀγάπησις· καὶ γὰρ χωρὶς τῆς χρείας ἀγαπῶνται διʼ αὑτάς, καὶ μάλιστα τῶν ἄλλων ἡ διὰ τῶν ὀμμάτων.
  - οὐ γὰρ μόνον ἵνα πράττωμεν ἀλλὰ καὶ μηθὲν μέλλοντες πράττειν τὸ ὁρᾶν αἱρούμεθα ἀντὶ πάντων ὡς εἰπεῖν τῶν ἄλλων.
  - αἴτιον δʼ ὅτι μάλιστα ποιεῖ γνωρίζειν ἡμᾶς αὕτη τῶν αἰσθήσεων καὶ πολλὰς δηλοῖ διαφοράς.
  - φύσει μὲν οὖν αἴσθησιν ἔχοντα γίγνεται τὰ ζῷα, ἐκ δὲ ταύτης τοῖς μὲν αὐτῶν οὐκ ἐγγίγνεται μνήμη, τοῖς δʼ ἐγγίγνεται.
- id: 980b
  title: Book A (I), chapter 1, Bekker 980b
  lines:
  - καὶ διὰ τοῦτο ταῦτα φρονιμώτερα καὶ μαθητικώτερα τῶν μὴ δυναμένων μνημονεύειν ἐστί, φρόνιμα μὲν ἄνευ τοῦ μανθάνειν ὅσα μὴ δύναται τῶν ψόφων ἀκούειν (οἷον μέλιττα κἂν εἴ τι τοιοῦτον ἄλλο γένος ζῴων ἔστι), μανθάνει δʼ ὅσα πρὸς τῇ μνήμῃ καὶ ταύτην ἔχει τὴν αἴσθησιν.
  - τὰ μὲν οὖν ἄλλα ταῖς φαντασίαις ζῇ καὶ ταῖς μνήμαις, ἐμπειρίας δὲ μετέχει μικρόν· τὸ δὲ τῶν ἀνθρώπων γένος καὶ τέχνῃ καὶ λογισμοῖς.
  - γίγνεται δʼ ἐκ τῆς μνήμης ἐμπειρία τοῖς ἀνθρώποις· αἱ γὰρ πολλαὶ μνῆμαι τοῦ αὐτοῦ πράγματος μιᾶς ἐμπειρίας δύναμιν ἀποτελοῦσιν.
- id: 981a
  title: Book A (I), chapter 1, Bekker 981a
  lines:
  - καὶ δοκεῖ σχεδὸν ἐπιστήμῃ καὶ τέχνῃ ὅμοιον εἶναι καὶ ἐμπειρία, ἀποβαίνει δʼ ἐπιστήμη καὶ τέχνη διὰ τῆς ἐμπειρίας τοῖς ἀνθρώποις· ἡ μὲν γὰρ ἐμπειρία τέχνην ἐποίησεν, ὡς φησὶ Πῶλος, ἡ δʼ ἀπειρία τύχην.
  - γίγνεται δὲ τέχνη ὅταν ἐκ πολλῶν τῆς ἐμπειρίας ἐννοημάτων μία καθόλου γένηται περὶ τῶν ὁμοίων ὑπόληψις.
  - τὸ μὲν γὰρ ἔχειν ὑπόληψιν ὅτι Καλλίᾳ κάμνοντι τηνδὶ τὴν νόσον τοδὶ συνήνεγκε καὶ Σωκράτει καὶ καθʼ ἕκαστον οὕτω πολλοῖς, ἐμπειρίας ἐστίν·
  - τὸ δʼ ὅτι πᾶσι τοῖς τοιοῖσδε κατʼ εἶδος ἓν ἀφορισθεῖσι, κάμνουσι τηνδὶ τὴν νόσον, συνήνεγκεν, οἷον τοῖς φλεγματώδεσιν ἢ χολώδεσι ἢ πυρέττουσι καύσῳ, τέχνης.—
  - πρὸς μὲν οὖν τὸ πράττειν ἐμπειρία τέχνης οὐδὲν δοκεῖ διαφέρειν, ἀλλὰ καὶ μᾶλλον ἐπιτυγχάνουσιν οἱ ἔμπειροι τῶν ἄνευ τῆς ἐμπειρίας λόγον ἐχόντων (αἴτιον δʼ ὅτι ἡ μὲν ἐμπειρία τῶν καθʼ ἕκαστόν ἐστι γνῶσις ἡ δὲ τέχνη τῶν καθόλου, αἱ δὲ πράξεις καὶ αἱ γενέσεις πᾶσαι περὶ τὸ καθʼ ἕκαστόν εἰσιν·
  - οὐ γὰρ ἄνθρωπον ὑγιάζει ὁ ἰατρεύων ἀλλʼ ἢ κατὰ συμβεβηκός, ἀλλὰ Καλλίαν ἢ Σωκράτην ἢ τῶν ἄλλων τινὰ τῶν οὕτω λεγομένων ᾧ συμβέβηκεν ἀνθρώπῳ εἶναι·
  - ἐὰν οὖν ἄνευ τῆς ἐμπειρίας ἔχῃ τις τὸν λόγον, καὶ τὸ καθόλου μὲν γνωρίζῃ τὸ δʼ ἐν τούτῳ καθʼ ἕκαστον ἀγνοῇ, πολλάκις διαμαρτήσεται τῆς θεραπείας· θεραπευτὸν γὰρ τὸ καθʼ ἕκαστον)·
  - ἀλλʼ ὅμως τό γε εἰδέναι καὶ τὸ ἐπαΐειν τῇ τέχνῃ τῆς ἐμπειρίας ὑπάρχειν οἰόμεθα μᾶλλον, καὶ σοφωτέρους τοὺς τεχνίτας τῶν ἐμπείρων ὑπολαμβάνομεν, ὡς κατὰ τὸ εἰδέναι μᾶλλον ἀκολουθοῦσαν τὴν σοφίαν πᾶσι· τοῦτο δʼ ὅτι οἱ μὲν τὴν αἰτίαν ἴσασιν οἱ δʼ οὔ.
  - οἱ μὲν γὰρ ἔμπειροι τὸ ὅτι μὲν ἴσασι, διότι δʼ οὐκ ἴσασιν· οἱ δὲ τὸ διότι καὶ τὴν αἰτίαν γνωρίζουσιν.
  - διὸ καὶ τοὺς ἀρχιτέκτονας περὶ ἕκαστον τιμιωτέρους καὶ μᾶλλον εἰδέναι νομίζομεν τῶν χειροτεχνῶν καὶ σοφωτέρους,
