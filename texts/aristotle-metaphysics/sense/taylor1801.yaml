  text: All men naturally desire to know; a token of which is the love of the senses; for, separate from utility, they are loved for themselves, and this is especially the case with the sense of seeing.
    For, as I may say, we choose to see, in preference to every thing else, not only that we may act, but likewise when we have no intention of acting. But the cause is, that this sense in a most eminent
    degree makes us to know something, and renders many differences manifest.
