# Thomas Taylor, The Metaphysics of Aristotle (1801), book I, chapter I, read from the archive.org scan
# and its OCR. Long s is printed as s; 'ad' and 'ading' in the OCR are act and acting (the ct ligature); 'arid' is and. The rest of chapter I
# (pages 1-4) was added 2026-10-17 from the OCR, with the doubtful readings checked on the scan (leaves 65-67:
# 'honorable', 'operators', 'unskilfulness', 'laboring'); Taylor's footnote marks are left out.
translation: taylor1801
aligned_by: hand, phase 0
spans:
- lines:
  - met.980a.1
  - met.980a.4
  text: All men naturally desire to know; a token of which is the love of the senses; for, separate from utility, they are loved for themselves, and this is especially the case with the sense of seeing.
    For, as I may say, we choose to see, in preference to every thing else, not only that we may act, but likewise when we have no intention of acting. But the cause is, that this sense in a most eminent
    degree makes us to know something, and renders many differences manifest.
- lines:
  - met.980a.5
  - met.980a.5
  text: "Animals therefore are produced naturally possessing sense. But from sense, in some of them memory is not ingenerated, and in others it is."
- lines:
  - met.980b.1
  - met.980b.1
  text: "And on this account, some animals are prudent, but others are more capable of discipline than those who are not able to exercise the power of memory. Those indeed are prudent without discipline, who are unable to hear sounds, such as bees, and other animals of this kind, if any such are to be found. But those learn, who together with memory possess the sense of hearing."
- lines:
  - met.980b.2
  - met.980b.2
  text: "Other animals therefore live from phantasy, and memory, and participate but a little of experience; but the human race lives from art also, and reasoning."
- lines:
  - met.980b.3
  - met.980b.3
  text: "But men derive experience from memory. For memory being often exercised about the same thing, gives perfection to the power of one experience."
- lines:
  - met.981a.1
  - met.981a.1
  text: "Hence experience appears to be nearly similar to science and art. But science and art proceed to men through experience. For experience, as Polus rightly observes, produces art, but unskilfulness chance."
- lines:
  - met.981a.2
  - met.981a.2
  text: "But art is then effected, when, from many conceptions of experience, one universal opinion about things similar is produced."
- lines:
  - met.981a.3
  - met.981a.4
  text: "For to have an opinion that to Callias, Socrates, and to many others severally considered, laboring under a certain disease, this particular thing is expedient, is the province of experience; but that it is expedient to all of this kind who are defined according to one species, and who are afflicted with this disease, such as the phlegmatic, or the choleric, or those who are in a fever from heat, is the province of art."
- lines:
  - met.981a.5
  - met.981a.5
  text: "With respect therefore to acting, experience seems in no respect to differ from art; but we see that the skilful more readily accomplish what they intend, than those who possess the reason of a thing without experience. But the cause of this is, that experience is a knowledge of particulars, but art of things universal. But all actions and generations are about that which is particular."
- lines:
  - met.981a.6
  - met.981a.6
  text: "For he who cures does not give health to man, unless by accident, but to Callias or Socrates, or some one of others who are thus denominated, and who happens to be a man."
- lines:
  - met.981a.7
  - met.981a.8
  text: "If any one therefore possesses the reason of a thing without experience, and knows indeed that which is universal, but is ignorant of the individual it contains, he will often err in his attempts to cure. For that which is particular possesses a greater capability of being cured; but at the same time we are of opinion that to know, and to understand, belong rather to art than to experience, and we think that artists are wiser than the experienced, because in all men wisdom is rather the consequence of knowledge than of any thing else. But this takes place, because some know, and others do not know the cause of a thing."
- lines:
  - met.981a.9
  - met.981a.9
  text: "For the skilful indeed know that a thing is, but they do not know why it is; but the scientific know the why and the cause of a thing."
- lines:
  - met.981a.10
  - met.981a.12
  text: "On this account we consider those who in any thing are master artists, as more honorable, as those who know more than manual operators, and likewise as more wise, because they know the causes of things which are made. But others, like certain inanimate beings, make indeed, but make destitute of knowledge, just in the same manner as fire burns. Inanimate beings, therefore, make each of these things by a certain nature; but manual artificers through custom; as being wiser, not from their engaging in active pursuits, but from their possessing reason, and knowing the causes of things."
- lines:
  - met.981b.1
  - met.981b.1
  text: "And, in short, it is a sign that a man possesses knowledge, when he is able to teach; and on this account we think that art is more science than experience: for the former are able, but the latter are not able, to teach."
- lines:
  - met.981b.2
  - met.981b.2
  text: "Further still, we do not think that any one of the senses is wisdom, although each is the most principal knowledge of particulars; but the senses do not assert the why respecting any thing, as for instance, why fire is hot, but only that it is hot."
- lines:
  - met.981b.3
  - met.981b.3
  text: "It is probable, therefore, that the first inventor of any art, besides the common senses, was admired by men, not only because something of things invented was useful, but as being wise and differing from other men."
- lines:
  - met.981b.4
  - met.981b.4
  text: "But when many arts were discovered, some of which pertain to things necessary, but others to the conduct of life, from that time we have always considered those who know the causes of things as wiser than manual artificers, because their sciences do not regard utility."
- lines:
  - met.981b.5
  - met.981b.5
  text: "Hence all such things as contribute to the common purposes of life being procured, those sciences were invented, which neither respect pleasure nor things necessary, and they were first discovered in those places in which men abounded in leisure. On which account the mathematical arts first originated about Egypt; for there the tribe of priests was permitted to be at leisure."
- lines:
  - met.981b.6
  - met.981b.6
  text: "In our moral treatises, therefore, we have declared what the difference is between art and science, and other things of a kindred nature. But that for the sake of which we engage in the present discourse, is the belief of all mankind, that what is called wisdom, is conversant with first causes and principles."
- lines:
  - met.981b.7
  - met.981b.7
  text: "So that, as we before observed, the skilful man appears to be wiser than those who merely energize from any one of the senses; the artist than the skilful; the architect than manual artificers; and the theoretic than fabricators."
- lines:
  - met.982a.1
  - met.982a.1
  text: "That wisdom, therefore, is a science about certain causes and principles, is evident."
