  text: All men by nature are actuated with the desire of knowledge, and an indication of this is the love of the senses; for even, irrespective of their utility, are they loved for their own sakes; and
    pre-eminently above the rest, the sense of sight. For not only for practical purposes, but also when not intent on doing anything, we choose the power of vision in preference, so to say, to all the
    rest of the senses. And a cause of this is the following,—that this one of the senses particularly enables us to apprehend whatever knowledge it is the inlet of, and that it makes many distinctive qualities
    manifest.
