- id: met.981b.6
  cite: urn:cts:greekLit:tlg0086.tlg025.perseus-grc2:981b.6
  stanza: 981b
  stanza_title: Book A (I), chapter 1, Bekker 981b
  text: εἴρηται μὲν οὖν ἐν τοῖς ἠθικοῖς τίς διαφορὰ τέχνης καὶ ἐπιστήμης καὶ τῶν ἄλλων τῶν ὁμογενῶν· οὗ δʼ ἕνεκα νῦν ποιούμεθα τὸν λόγον τοῦτʼ ἐστίν, ὅτι τὴν ὀνομαζομένην σοφίαν περὶ τὰ πρῶτα αἴτια καὶ
    τὰς ἀρχὰς ὑπολαμβάνουσι πάντες·
