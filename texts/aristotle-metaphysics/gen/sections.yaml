  text: ὅθεν ἤδη πάντων τῶν τοιούτων κατεσκευασμένων αἱ μὴ πρὸς ἡδονὴν μηδὲ πρὸς τἀναγκαῖα τῶν ἐπιστημῶν εὑρέθησαν, καὶ πρῶτον ἐν τούτοις τοῖς τόποις οὗ πρῶτον ἐσχόλασαν· διὸ περὶ Αἴγυπτον αἱ μαθηματικαὶ
    πρῶτον τέχναι συνέστησαν, ἐκεῖ γὰρ ἀφείθη σχολάζειν τὸ τῶν ἱερέων ἔθνος.
