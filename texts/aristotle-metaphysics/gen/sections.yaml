  text: καὶ διὰ τοῦτο ταῦτα φρονιμώτερα καὶ μαθητικώτερα τῶν μὴ δυναμένων μνημονεύειν ἐστί, φρόνιμα μὲν ἄνευ τοῦ μανθάνειν ὅσα μὴ δύναται τῶν ψόφων ἀκούειν (οἷον μέλιττα κἂν εἴ τι τοιοῦτον ἄλλο γένος ζῴων
    ἔστι), μανθάνει δʼ ὅσα πρὸς τῇ μνήμῃ καὶ ταύτην ἔχει τὴν αἴσθησιν.
