  text: πρὸς μὲν οὖν τὸ πράττειν ἐμπειρία τέχνης οὐδὲν δοκεῖ διαφέρειν, ἀλλὰ καὶ μᾶλλον ἐπιτυγχάνουσιν οἱ ἔμπειροι τῶν ἄνευ τῆς ἐμπειρίας λόγον ἐχόντων (αἴτιον δʼ ὅτι ἡ μὲν ἐμπειρία τῶν καθʼ ἕκαστόν ἐστι
    γνῶσις ἡ δὲ τέχνη τῶν καθόλου, αἱ δὲ πράξεις καὶ αἱ γενέσεις πᾶσαι περὶ τὸ καθʼ ἕκαστόν εἰσιν·
