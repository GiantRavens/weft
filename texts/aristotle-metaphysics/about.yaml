  lead: 'Metaphysics (Greek: τὰ μετὰ τὰ φυσικά, "those after the physics"; Latin: Metaphysica) is one
    of the principal works of Aristotle, in which he develops the doctrine that he calls First Philosophy.
    The work is a compilation of various texts treating abstract subjects, notably substance theory, different
    kinds of causation, form and matter, the existence of mathematical objects and the cosmos, which together
    constitute much of the branch of philosophy later known as metaphysics.'
