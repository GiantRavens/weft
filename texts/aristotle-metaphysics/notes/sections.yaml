# Notes for Aristotle, Metaphysics A.1. Editorial notes are drafts until a reviewer lifts them.
- id: n.met.first
  attach: met.980a.1
  kind: editorial
  status: draft
  text: "The first sentence of the Metaphysics. εἰδέναι, 'to know', is the perfect infinitive of a root meaning 'see': to know is, in origin, to have seen. ὀρέγονται is a verb of reaching or stretching toward something. The two translations render the same six words as 'naturally desire to know' (Taylor, 1801) and 'are actuated with the desire of knowledge' (M'Mahon, 1857)."
- id: n.met.title
  attach: met.980a.1.1
  kind: editorial
  status: draft
  leans_on: "M'Mahon's note on the title (1857)"
  text: "The title Metaphysics, 'after the Physics', is not Aristotle's. It is usually explained by the order in which ancient editors placed these books, after his works on nature; M'Mahon in 1857 attributes it to Andronicus of Rhodes, the first-century BC editor."
- id: n.met.sight
  attach: met.980a.2.22
  kind: editorial
  status: draft
  text: "Aristotle ranks sight above the other senses because it shows the most differences between things. M'Mahon's footnote of 1857 objects that this ranking follows the old philosophers and is 'discarded by the moderns'."
- id: n.met.parse
  attach: met.980a.1.5
  kind: editorial
  status: draft
  text: "Lemma and form for each word come from GLAUx, a corpus of Greek parsed automatically rather than by hand. The first four sentences, 980a21-27, needed no correction. The rest of the chapter needed 57, each recorded in the curated overlay: most concern agreement with a word outside the phrase (things and arts parsed as masculine), and a few are outright misreadings, such as μέλιττα, 'bee', parsed as a verb. The Enchiridion chapter on this site needed nineteen, and book 2 of the Meditations 150."
- id: n.met.ladder
  attach: met.981a.1.10
  kind: editorial
  status: draft
  leans_on: "the Greek text of the chapter; the two translations on this page"
  text: "The chapter sets out a sequence. Animals have sensation (αἴσθησις); some keep memory (μνήμη) of it; many memories of the same thing make one experience (ἐμπειρία); and art (τέχνη) arises when, from many notions gathered by experience, one general judgment is formed about similar cases. The example is medical. To know that a remedy helped Callias and Socrates, each suffering from this disease, belongs to experience; to know that it helps everyone of a given kind, the phlegmatic or the bilious, belongs to art. Experience can act as well as art, or better, since action is always about a particular patient; art is ranked higher because it knows the cause and can be taught. The saying that experience made art and inexperience chance is attributed to Polus, the speaker of that name in Plato's Gorgias, as M'Mahon's footnote notes."
- id: n.met.phantasia
  attach: met.980b.2.6
  kind: editorial
  status: draft
  leans_on: "Taylor (1801) and M'Mahon (1857), with M'Mahon's footnote on the word"
  text: "φαντασίαις, glossed here 'appearances', is the plural of φαντασία, the way a thing appears or presents itself to the mind. Taylor renders it 'phantasy'. M'Mahon renders it 'impressions' and objects in a footnote that Taylor's word conveys little meaning and ignores the plural; he takes Aristotle to mean the ideas conveyed into the minds of animals by their representative power. The same word is the Stoic term in Epictetus, Enchiridion 1.5, on this site, where it is glossed 'impression'."
- id: n.met.egypt
  attach: met.981b.5.28
  kind: editorial
  status: draft
  leans_on: "the Greek text; Herodotus 2.109 (geometry from Egypt); Plato, Phaedrus 274c-d (the Egyptian god Theuth as inventor of number and geometry)"
  text: "The argument ranks theoretical knowledge above the rest because it is not pursued for use: the sciences that serve neither need nor pleasure were found last, once the others were in place, and only where people had leisure (σχολάζειν, from σχολή, leisure, the word behind English 'school'). Aristotle's example is the priests of Egypt, among whom the mathematical arts first arose. Herodotus also places the origin of geometry in Egypt, but gives it a practical cause, the re-measuring of land after the Nile's floods, where Aristotle gives leisure; Plato makes the Egyptian god Theuth the inventor of number and geometry. This note does not assess the claim as history. The chapter ends by naming what it has been leading to: wisdom (σοφία) is knowledge of certain principles and causes, the subject of the books that follow."
