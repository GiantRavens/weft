# The translation attributed to White Kennett (1683), as reprinted in London in 1876 (Reeves and
# Turner, with Holbein's drawings), Project Gutenberg 30201, verbatim except:
#   - "HOW" (a decorated initial followed by capitals) is printed "How";
#   - "gilded oyer" corrected to "gilded over" (OCR error).
# "sate" is the translator's spelling and is kept.
translation: kennett1683
aligned_by: hand, phase 0
spans:
- lines: [mor.exordium.1, mor.exordium.3]
  text: "How slightly soever I am esteemed in the common vogue of the world, (for I well know how disingenuously Folly is decried, even by those who are themselves the greatest fools,) yet it is from my influence alone that the whole universe receives her ferment of mirth and jollity:"
- lines: [mor.exordium.4, mor.exordium.12]
  text: "of which this may be urged as a convincing argument, in that as soon as I appeared to speak before this numerous assembly all their countenances were gilded over with a lively sparkling pleasantness: you soon welcomed me with so encouraging a look, you spurred me on with so cheerful a hum, that truly in all appearance, you seem now flushed with a good dose of reviving nectar, when as just before you sate drowsy and melancholy, as if you were lately come out of some hermit's cell."
