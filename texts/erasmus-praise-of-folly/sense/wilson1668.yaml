# John Wilson's translation (1668), Project Gutenberg 9371, verbatim. Wilson's sentences do not
# follow the Latin clause by clause, so spans are aligned at the nearest shared clause boundary.
translation: wilson1668
aligned_by: hand, phase 0
spans:
- lines: [mor.exordium.1, mor.exordium.3]
  text: "At what rate soever the world talks of me (for I am not ignorant what an ill report Folly has got, even among the most foolish), yet that I am that she, that only she, whose deity recreates both gods and men,"
- lines: [mor.exordium.4, mor.exordium.6]
  text: "even this is a sufficient argument, that I no sooner stepped up to speak to this full assembly than all your faces put on a kind of new and unwonted pleasantness."
- lines: [mor.exordium.7, mor.exordium.12]
  text: "So suddenly have you cleared your brows, and with so frolic and hearty a laughter given me your applause, that in truth as many of you as I behold on every side of me seem to me no less than Homer's gods drunk with nectar and nepenthe; whereas before, you sat as lumpish and pensive as if you had come from consulting an oracle."
