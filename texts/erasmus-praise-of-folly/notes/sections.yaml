# Notes for The Praise of Folly, opening of Folly's speech.
- id: n.mor.sound
  attach: mor.exordium.1
  kind: editorial
  status: draft
  leans_on: "W. S. Allen, Vox Latina (1965), appendix on the pronunciation of Latin in other countries"
  text: "The default reading is Latin as it was read in the Low Countries around 1500, where Erasmus was born and schooled. Its main features are Dutch vowel values (long in open syllables, short in closed ones), u as Dutch uu, g as a throat fricative, soft c as s, and ti before a vowel as tsi. It is reconstructed from Middle Dutch sound history and from the Dutch school pronunciation that continued it, not from any description of Erasmus's own speech, so treat it as approximate. In 1528 Erasmus published De recta Latini Graecique sermonis pronuntiatione, a dialogue arguing for a pronunciation closer to the ancient one. This reading models the ordinary practice he grew up with, not that proposal; how far he used the reformed pronunciation himself is not well documented. The classical reading is the second choice in the Loom."
- id: n.mor.declamatio
  attach: mor.exordium.3
  kind: editorial
  status: draft
  text: "The speaker is Folly herself. The 1892 edition heads the speech Stultitia loquitur, 'Folly speaks', and the verb of line 3, exhilaro, 'I gladden', is in the first person. Erasmus calls the work a declamatio, a set speech on an assigned theme. In his dedicatory letter to More he places it among mock praises written by earlier authors, naming among others Homer's Battle of the Frogs and Mice, Ovid's Nut, Synesius on baldness, and Lucian on the fly."
- id: n.mor.moria
  attach: mor.exordium.2.7
  kind: editorial
  status: draft
  text: "The Greek title, Moriae Encomium, 'praise of moria (folly)', plays on Thomas More's name. In the dedicatory letter Erasmus says the idea came to him while riding from Italy to England, and that More's family name, Morus, is as close to the word moria as More himself is far from the thing."
- id: n.mor.maleaudire
  attach: mor.exordium.2.6
  kind: editorial
  status: draft
  leans_on: "Lewis and Short, s.v. audio II.B"
  text: "Male audire, literally 'to hear badly', is a Latin idiom for 'to be spoken ill of'. The gloss row keeps the literal sense. Wilson renders the clause 'what an ill report Folly has got'."
- id: n.mor.nepenthe
  attach: mor.exordium.10.7
  kind: editorial
  status: draft
  text: "Nepenthe is the drug Helen mixes into the wine in Odyssey 4.220-221 so that those who drink it forget their grief. The 1892 editor's footnote, removed from the line here, describes it as a herb that brings gladness when steeped in wine and cites that passage. Folly's image is of the gods of Homer drinking nectar with nepenthe added."
- id: n.mor.trophonius
  attach: mor.exordium.12.5
  kind: editorial
  status: draft
  text: "Trophonius had an oracle in a cave in Boeotia. The 1892 editor's footnote, removed here, says that those who went in came back silent, gloomy and unkempt. The two English versions handle the allusion differently: Wilson writes 'as if you had come from consulting an oracle', and the version attributed to Kennett replaces it with 'some hermit's cell'."
- id: n.mor.utcunque
  attach: mor.exordium.1.1
  kind: editorial
  status: draft
  text: "The 1892 text prints utcunque, with n before qu, a spelling common in early printed Latin; the classical spelling is utcumque. The difference does not reach the sound layer, since in every scheme here a nasal before c, g or qu is read as ng."
