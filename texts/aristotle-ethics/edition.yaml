sections:
- id: '1.1'
  title: Book 1, chapter 1, Bekker 1094a1–18
  lines:
  - πᾶσα τέχνη καὶ πᾶσα μέθοδος, ὁμοίως δὲ πρᾶξίς τε καὶ προαίρεσις, ἀγαθοῦ τινὸς ἐφίεσθαι δοκεῖ·
  - διὸ καλῶς ἀπεφήναντο τἀγαθόν, οὗ πάντʼ ἐφίεται.
  - διαφορὰ δέ τις φαίνεται τῶν τελῶν·
  - τὰ μὲν γάρ εἰσιν ἐνέργειαι, τὰ δὲ παρʼ αὐτὰς ἔργα τινά.
  - ὧν δʼ εἰσὶ τέλη τινὰ παρὰ τὰς πράξεις, ἐν τούτοις βελτίω πέφυκε τῶν ἐνεργειῶν τὰ ἔργα.
  - πολλῶν δὲ πράξεων οὐσῶν καὶ τεχνῶν καὶ ἐπιστημῶν πολλὰ γίνεται καὶ τὰ τέλη·
  - ἰατρικῆς μὲν γὰρ ὑγίεια, ναυπηγικῆς δὲ πλοῖον, στρατηγικῆς δὲ νίκη, οἰκονομικῆς δὲ πλοῦτος.
  - ὅσαι δʼ εἰσὶ τῶν τοιούτων ὑπὸ μίαν τινὰ δύναμιν, καθάπερ ὑπὸ τὴν ἱππικὴν χαλινοποιικὴ καὶ ὅσαι ἄλλαι τῶν ἱππικῶν ὀργάνων εἰσίν, αὕτη δὲ καὶ πᾶσα πολεμικὴ πρᾶξις ὑπὸ τὴν στρατηγικήν, κατὰ τὸν αὐτὸν δὴ τρόπον ἄλλαι ὑφʼ ἑτέρας·
  - ἐν ἁπάσαις δὲ τὰ τῶν ἀρχιτεκτονικῶν τέλη πάντων ἐστὶν αἱρετώτερα τῶν ὑπʼ αὐτά·
  - τούτων γὰρ χάριν κἀκεῖνα διώκεται.
  - διαφέρει δʼ οὐδὲν τὰς ἐνεργείας αὐτὰς εἶναι τὰ τέλη τῶν πράξεων ἢ παρὰ ταύτας ἄλλο τι, καθάπερ ἐπὶ τῶν λεχθεισῶν ἐπιστημῶν.
- id: '1.2'
  title: Book 1, chapter 2, Bekker 1094a18–b11
  lines:
  - εἰ δή τι τέλος ἐστὶ τῶν πρακτῶν ὃ διʼ αὑτὸ βουλόμεθα, τἆλλα δὲ διὰ τοῦτο, καὶ μὴ πάντα διʼ ἕτερον αἱρούμεθα (πρόεισι γὰρ οὕτω γʼ εἰς ἄπειρον, ὥστʼ εἶναι κενὴν καὶ ματαίαν τὴν ὄρεξιν), δῆλον ὡς τοῦτʼ ἂν εἴη τἀγαθὸν καὶ τὸ ἄριστον.
  - ἆρʼ οὖν καὶ πρὸς τὸν βίον ἡ γνῶσις αὐτοῦ μεγάλην ἔχει ῥοπήν, καὶ καθάπερ τοξόται σκοπὸν ἔχοντες μᾶλλον ἂν τυγχάνοιμεν τοῦ δέοντος;
  - εἰ δʼ οὕτω, πειρατέον τύπῳ γε περιλαβεῖν αὐτὸ τί ποτʼ ἐστὶ καὶ τίνος τῶν ἐπιστημῶν ἢ δυνάμεων.
  - δόξειε δʼ ἂν τῆς κυριωτάτης καὶ μάλιστα ἀρχιτεκτονικῆς.
  - τοιαύτη δʼ ἡ πολιτικὴ φαίνεται·
  - τίνας γὰρ εἶναι χρεὼν τῶν ἐπιστημῶν ἐν ταῖς πόλεσι, καὶ ποίας ἑκάστους μανθάνειν καὶ μέχρι τίνος, αὕτη διατάσσει·
  - ὁρῶμεν δὲ καὶ τὰς ἐντιμοτάτας τῶν δυνάμεων ὑπὸ ταύτην οὔσας, οἷον στρατηγικὴν οἰκονομικὴν ῥητορικήν·
  - χρωμένης δὲ ταύτης ταῖς λοιπαῖς πρακτικαῖς τῶν ἐπιστημῶν, ἔτι δὲ νομοθετούσης τί δεῖ πράττειν καὶ τίνων ἀπέχεσθαι, τὸ ταύτης τέλος περιέχοι ἂν τὰ τῶν ἄλλων, ὥστε τοῦτʼ ἂν εἴη τἀνθρώπινον ἀγαθόν.
  - εἰ γὰρ καὶ ταὐτόν ἐστιν ἑνὶ καὶ πόλει, μεῖζόν γε καὶ τελειότερον τὸ τῆς πόλεως φαίνεται καὶ λαβεῖν καὶ σῴζειν·
  - ἀγαπητὸν μὲν γὰρ καὶ ἑνὶ μόνῳ, κάλλιον δὲ καὶ θειότερον ἔθνει καὶ πόλεσιν.
  - ἡ μὲν οὖν μέθοδος τούτων ἐφίεται, πολιτική τις οὖσα.
