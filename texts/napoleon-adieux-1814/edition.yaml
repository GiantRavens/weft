# Weft edition of Napoleon's farewell to the Old Guard (Fontainebleau, 20 April 1814), in the text of the
# Correspondance de Napoléon Ier, tome XXVII (Paris, 1869), no. 21561, p. 362, which prints it from Baron Fain's
# Manuscrit de 1814 with Fain's account of the embrace between the two parts. Each line is checked against the
# Internet Archive OCR of the University of Toronto copy (pinned). verify_strip rejoins the word the print
# hyphenates across a line (en-semble) and closes the space the OCR sets before , ; : and !, which the print
# does not; verify_fold reads the edition's ’ as the OCR's straight apostrophe; verify_corrections give the
# printed reading where the OCR misreads, each settled on the page image (archive.org
# correspondancede27napouoft, leaf n371).
#   t     the word as printed, punctuation attached; an elision (l’, d’, n’, c’, j’, s’) is its own token,
#         glued to the next
#   n     the modern spelling where the print differs (the capital A without its accent)
#   z     a liaison careful modern reading makes (mes‿adieux, nous‿avons)
#   zf    a liaison of formal reading then, not made in the modern scheme (était‿interminable)
#   Lines are Weft's division at the print's stops and commas; sections are the speech, Fain's account, and
#   the last words.
work: napoleon-adieux-1814
joiner: ' '
verify_in: sources/correspondancede27napouoft-djvu.txt
verify_strip: -[ \t]*\n+[ \t]*|(?<=\w) +(?=[,;:!])
verify_fold:
  ’: ''''
verify_corrections:
- ocr: votre drapeau!
  print: votre drapeau!.....
- ocr: Xapoléon
  print: Napoléon
- ocr: fait im effort
  print: fait un effort
- ocr: encore une lois
  print: encore une fois
