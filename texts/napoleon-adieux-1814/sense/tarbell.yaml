# Napoleon's Addresses, edited by Ida M. Tarbell (Boston, 1897), p. 133 (en.wikisource Page:Napoleon's Addresses.djvu/137).
# The English follows a different printed version of the speech from Fain's: it has no kiss of the flag, and it ends with
# Napoleon embracing the general and the words "I embrace you all in the person of your general. Adieu, soldiers! Be always
# gallant and good." That ending answers nothing in Fain's text, so only the address is aligned.
