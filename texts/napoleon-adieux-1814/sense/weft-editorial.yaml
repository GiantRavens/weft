# Weft's editorial translation of the farewell as Fain gives it, close to the French; draft.
translation: weft-editorial
aligned_by: 'hand: one span per sentence or pair of short sentences'
spans:
- lines: [adg.1.1, adg.1.1]
  text: Soldiers of my Old Guard, I bid you farewell.
- lines: [adg.1.2, adg.1.3]
  text: For twenty years I have found you constantly on the road of honour and of glory.
- lines: [adg.1.4, adg.1.5]
  text: In these last days, as in those of our prosperity,
- lines: [adg.1.6, adg.1.6]
  text: you have never ceased to be models of bravery and loyalty.
- lines: [adg.1.7, adg.1.7]
  text: With men such as you, our cause was not lost.
- lines: [adg.1.8, adg.1.10]
  text: But the war was endless; it would have been civil war, and France would only have been the more unhappy for it.
- lines: [adg.1.11, adg.1.12]
  text: So I have sacrificed all our interests to those of the fatherland; I am leaving.
- lines: [adg.1.13, adg.1.13]
  text: You, my friends, go on serving France.
- lines: [adg.1.14, adg.1.15]
  text: Her happiness was my one thought; it will always be the object of my wishes.
- lines: [adg.1.16, adg.1.18]
  text: Do not pity my fate; if I have agreed to outlive myself, it is to serve your glory still.
- lines: [adg.1.19, adg.1.20]
  text: I mean to write of the great things we have done together.
- lines: [adg.1.21, adg.1.21]
  text: Farewell, my children.
- lines: [adg.1.22, adg.1.23]
  text: I would like to press you all to my heart; let me at least embrace your flag.
- lines: [adg.fain.1, adg.fain.2]
  text: At these words General Petit, taking up the eagle, comes forward. Napoleon takes the general in his arms and kisses the flag.
- lines: [adg.fain.3, adg.fain.4]
  text: The silence this great scene inspires is broken only by the sobs of the soldiers.
- lines: [adg.fain.5, adg.fain.6]
  text: 'Napoleon, whose emotion is plain to see, makes an effort and goes on in a firm voice:'
- lines: [adg.2.1, adg.2.2]
  text: Farewell once more, my old companions. Let this last kiss pass into your hearts.
