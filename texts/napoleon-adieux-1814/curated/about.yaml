leans_on: "the text as the Correspondance de Napoléon Ier prints it from Fain's Manuscrit de 1814, and the notes on the page"
summary: "Napoleon's farewell to the grenadiers and chasseurs of his Old Guard, spoken in the courtyard of the palace of Fontainebleau on 20 April 1814, two weeks after his abdication, as he left for exile on Elba. He tells them that he has given up the war to spare France a civil war, asks them to serve France, says he will write the history of what they did together, and kisses their flag. The text is the one his secretary, Baron Fain, published in 1823, with Fain's account of the embrace; other printings of the speech differ in wording."
subjects: [Napoleon, abdication, Old Guard, Imperial Guard, Fontainebleau, farewell speech, Napoleonic Wars, '1814', Elba, military address]
