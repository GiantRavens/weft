# Notes for Napoleon's farewell to the Old Guard.
- id: n.adg.occasion
  attach: adg.1.1
  kind: editorial
  status: draft
  text: "Napoleon abdicated at Fontainebleau on 6 April 1814, after the allied armies had entered Paris, and the Treaty of Fontainebleau (11 April) gave him the island of Elba. On 20 April he left the palace for the south coast. Before his carriage left he spoke to the Old Guard drawn up in the Cour du Cheval-Blanc, the courtyard since called the Cour des Adieux. The Correspondance de Napoléon Ier, published by order of Napoleon III, prints the speech as no. 21561, dated Fontainebleau, 20 April 1814."
- id: n.adg.guard
  attach: adg.1.1.4
  kind: editorial
  status: draft
  text: "Vieille Garde, the Old Guard: the senior regiments of the Imperial Guard, the grenadiers and chasseurs on foot and the senior cavalry, made up of veterans chosen for long service. The speech's 'for twenty years' counts from the campaigns of the 1790s, when Napoleon was a general of the Republic; the Guard itself was formed later, from the Consular Guard of 1799."
- id: n.adg.versions
  attach: adg.1.2
  kind: editorial
  status: draft
  text: "No one took the speech down as it was given. The text here is the one published in 1823 by Baron Fain, Napoleon's cabinet secretary, in his Manuscrit de 1814; the Correspondance reprints it from him. Other 19th-century printings differ. Chateaubriand (Mémoires d'outre-tombe) begins 'Généraux, officiers, sous-officiers et soldats de ma vieille garde' and has Napoleon say 'depuis vingt ans je suis content de vous'; Vaulabelle's history begins 'Officiers, sous-officiers et soldats'. The English of Tarbell's Napoleon's Addresses (1897) follows a version that has no kiss of the flag and ends 'I embrace you all in the person of your general. Adieu, soldiers! Be always gallant and good.' The substance is the same in all of them; the wording is not settled."
- id: n.adg.survive
  attach: adg.1.17
  kind: editorial
  status: draft
  text: "Si j'ai consenti à me survivre, 'if I have agreed to outlive myself': to live on after the fall of the Empire. The phrase is usually read in the light of the night of 12-13 April, eight days earlier, when Napoleon took poison at Fontainebleau and survived; the speech itself does not refer to it."
- id: n.adg.write
  attach: adg.1.19
  kind: editorial
  status: draft
  text: "Je veux écrire les grandes choses que nous avons faites ensemble: the promise to write the history of the campaigns. On Elba he did not; on Saint Helena, after 1815, he dictated accounts of his campaigns to his companions in exile, and Las Cases's Mémorial de Sainte-Hélène (1823) recorded his conversation."
- id: n.adg.eagle
  attach: adg.fain.1
  kind: editorial
  status: draft
  text: "The general is Jean-Martin Petit (1772-1856), a general of the grenadiers of the Old Guard. The aigle is the gilt eagle on the staff of a regiment's flag, the standard Napoleon gave his regiments in 1804. In this sense the French word is feminine (l'aigle, les aigles impériales), as against the masculine aigle, the bird; the overlay marks it so."
