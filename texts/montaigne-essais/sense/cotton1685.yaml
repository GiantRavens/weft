spans:
- lines: [ess.1.19.1, ess.1.19.1]
  text: "Cicero says “that to study philosophy is nothing but to prepare one’s self to die.”"
- lines: [ess.1.19.2, ess.1.19.3]
  text: "The reason of which is, because study and contemplation do in some sort withdraw from us our soul, and employ it separately from the body, which is a kind of apprenticeship and a resemblance of death;"
- lines: [ess.1.19.4, ess.1.19.4]
  text: "or, else, because all the wisdom and reasoning in the world do in the end conclude in this point, to teach us not to fear to die."
