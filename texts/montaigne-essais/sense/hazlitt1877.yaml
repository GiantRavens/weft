# The Author to the Reader, as supplied in W. C. Hazlitt's 1877 edition of Cotton's translation,
# which marks it "Omitted by Cotton"; the edition does not name the translator of this piece.
# Verbatim from Project Gutenberg #3600. Omitted: the editor's bracketed notes and his first date
# line ("From Montaigne, the 12th June 1580"), which he gives as the 1595 reading; the second date
# line, which matches the French printed here, is kept.
translation: hazlitt1877
aligned_by: hand, phase 0
spans:
- lines: [ess.pref.1, ess.pref.1]
  text: "READER, thou hast here an honest book;"
- lines: [ess.pref.2, ess.pref.4]
  text: "it doth at the outset forewarn thee that, in contriving the same, I have proposed to myself no other than a domestic and private end: I have had no consideration at all either to thy service or to my glory. My powers are not capable of any such design."
- lines: [ess.pref.5, ess.pref.7]
  text: "I have dedicated it to the particular commodity of my kinsfolk and friends, so that, having lost me (which they must do shortly), they may therein recover some traits of my conditions and humours, and by that means preserve more whole, and more life-like, the knowledge they had of me."
- lines: [ess.pref.8, ess.pref.8]
  text: "Had my intention been to seek the world’s favour, I should surely have adorned myself with borrowed beauties:"
- lines: [ess.pref.9, ess.pref.10]
  text: "I desire therein to be viewed as I appear in mine own genuine, simple, and ordinary manner, without study and artifice: for it is myself I paint."
- lines: [ess.pref.11, ess.pref.11]
  text: "My defects are therein to be read to the life, and any imperfections and my natural form, so far as public reverence hath permitted me."
- lines: [ess.pref.12, ess.pref.13]
  text: "If I had lived among those nations, which (they say) yet dwell under the sweet liberty of nature’s primitive laws, I assure thee I would most willingly have painted myself quite fully and quite naked."
- lines: [ess.pref.14, ess.pref.15]
  text: "Thus, reader, myself am the matter of my book: there’s no reason thou shouldst employ thy leisure about so frivolous and vain a subject."
- lines: [ess.pref.16, ess.pref.16]
  text: "Therefore farewell."
- lines: [ess.pref.17, ess.pref.17]
  text: "From Montaigne, the 1st March 1580."
