# John Florio, The Essayes (1603), verbatim from English Wikisource: The Author to the Reader
# (revision 11533618) and book I chapter 19 (revision 11533521, opening only). The Wikisource text
# modernizes some spelling and punctuation; it is not a transcription of the 1603 print.
# Corrections: 'thereun' corrected to 'therein' (OCR error); wiki italics around Montaigne removed.
translation: florio1603
aligned_by: hand, phase 0; one span per sentence or colon group of the French
spans:
- lines: [ess.pref.1, ess.pref.1]
  text: "READER, loe here a well-meaning Booke."
- lines: [ess.pref.2, ess.pref.4]
  text: "It doth at the first entrance forewarne thee, that in contriving the same I have proposed unto my selfe no other than a familiar and private end: I have no respect or consideration at all, either to thy service, or to my glory: my forces are not capable of any such desseigne."
- lines: [ess.pref.5, ess.pref.7]
  text: "I have vowed the same to the particular commodity of my kinsfolk and friends: to the end, that losing me (which they are likely to do ere long), they may therein find some lineaments of my conditions and humours, and by that meanes reserve more whole, and more lively foster the knowledge and acquaintance they have had of me."
- lines: [ess.pref.8, ess.pref.8]
  text: "Had my intention beene to forestal and purchase the world's opinion and favour, I would surely have adorned myselfe more quaintly, or kept a more grave and solemne march."
- lines: [ess.pref.9, ess.pref.10]
  text: "I desire therein to be delineated in mine own genuine, simple and ordinarie fashion, without contention, art or study; for it is myselfe I pourtray."
- lines: [ess.pref.11, ess.pref.11]
  text: "My imperfections shall thus be read to the life, and my naturall forme discerned, so farre-forth as publike reverence hath permitted me."
- lines: [ess.pref.12, ess.pref.13]
  text: "For if my fortune had beene to have lived among those nations which yet are said to live under the sweet liberty of Nature's first and uncorrupted lawes, I assure thee, I would most willingly have pourtrayed myselfe fully and naked."
- lines: [ess.pref.14, ess.pref.15]
  text: "Thus, gentle Reader, myselfe am the groundworke of my booke: it is then no reason thou shouldest employ thy time about so frivolous and vaine a subject."
- lines: [ess.pref.16, ess.pref.16]
  text: "Therefore farewell."
- lines: [ess.pref.17, ess.pref.17]
  text: "From Montaigne, the First of March, 1580."
- lines: [ess.1.19.1, ess.1.19.1]
  text: "Cicero saith, that to Philosophise is no other thing than for a man to prepare himselfe to death:"
- lines: [ess.1.19.2, ess.1.19.3]
  text: "which is the reason that studie and contemplation doth in some sort withdraw our soule from us and severally employ it from the body, which is a kind of apprentisage and resemblance of death;"
- lines: [ess.1.19.4, ess.1.19.4]
  text: "or else it is, that all the wisdome and discourse of the world, doth in the end resolve upon this point, to teach us not to feare to die."
