# Weft edition of two passages of Montaigne's Essais in the spelling of the 1595 edition (Paris,
# Abel L'Angelier), as printed in the Didot edition of 1907, tome 1 (ed. général Michaud), which
# sets the 1595 text "collationné sur l'exemplaire de l'édition de 1595" at the Bibliothèque
# nationale opposite a modern French version. Transcribed on French Wikisource and checked verbatim
# against the two pages (`weft draft` reports edition-not-in-source otherwise); the wiki markup
# ({{iv}} paragraph marks, the drop capital of Cicero) is set aside by verify_strip.
#
# The edition prints u for v and i for j as the 16th-century printers did (vn liure, ie); Weft keeps
# that. Weft divides the text into lines at the sentence and at the colons of the print.
#
#   t        the word as printed, punctuation attached (foy,); the elided c’ l’ qu’ are tokens of
#            their own, glued to the next word
#   n        the modern spelling, typed by hand; the page shows it as "Modern spelling" and the
#            sound is looked up from it (pipeline/weft/data/fr_lexicon.yaml)
#   p        punctuation set off by a space in the print (" :")
#   glue     no space follows
#   z        liaison in the modern scheme
#   ipa      a per-occurrence override of the lexicon
joiner: " "
verify_strip: '\{\{iv\}\}|\{\{Lettrine\||\}\}\{\{sc\||\}\}'
