# Notes for Montaigne, Essais: the preface Au lecteur and the opening of book I chapter 19.
- id: n.ess.pref.matter
  attach: ess.pref.14.5
  kind: editorial
  status: draft
  leans_on: "Huguet, Dictionnaire de la langue française du seizième siècle, s.v. matiere; the translations of Florio (1603) and Hazlitt's edition (1877)"
  text: "Matiere here means the stuff a work is made from, its subject matter, as a sculptor's marble is the matter of a statue. The sentence makes the author both the maker and the material of the book. The preface prepares it: c'est moy que ie peins, it is myself that I paint. Florio renders matiere as 'groundworke', the foundation a thing is built on; the version in Hazlitt's edition keeps 'matter'. The claim is scoped by the preface itself: the book is offered to kinsfolk and friends, and its subject is called frivolous and vain."
- id: n.ess.pref.editions
  attach: ess.pref.17
  kind: editorial
  status: draft
  leans_on: "the Didot edition of 1907, tome 1, note on page 34; W. C. Hazlitt's notes to the preface (1877)"
  text: "The Essais first appeared at Bordeaux in 1580, in two books. Montaigne reissued them in 1582 with small changes, and in 1588 at Paris with a third book and many additions. He went on writing additions into the margins of a copy of the 1588 edition, now called the Bordeaux copy, until his death in 1592. The edition of 1595, prepared by Marie de Gournay from another copy of his additions, is the text printed here, in the 1907 Didot edition's collation of the Bibliothèque nationale copy. The preface is dated 1 March 1580 in this text. Hazlitt reports that the 1588 edition dates it 12 June 1588. The date therefore records the first publication, not the state of the text that follows it."
- id: n.ess.pref.adorned
  attach: ess.pref.8
  kind: editorial
  status: draft
  leans_on: "the Bordeaux copy as transcribed on French Wikisource, Page:Montaigne - Essais, Éd de Bordeaux, 1.djvu/3; the variant apparatus of modern critical editions (Villey and Saulnier, 1965)"
  text: "The two English versions here translate different French sentences. Florio, 'I would surely have adorned myselfe more quaintly, or kept a more grave and solemne march', follows the wording printed here, ie me fusse mieus paré et me presanterois en vne marche estudiee, which is also the wording of the Bordeaux copy. The version in Hazlitt's edition, 'adorned myself with borrowed beauties', corresponds to the reading ie me fusse paré de beautez empruntées, which critical editions record for the printings before Montaigne's later revision. That earlier reading is not in the sources pinned for this edition, so the comparison rests on those editions."
- id: n.ess.pref.visue
  attach: ess.pref.7.12
  kind: editorial
  status: draft
  leans_on: "the Bordeaux copy as transcribed on French Wikisource, page 3 ('plus vifue')"
  text: "The transcription reads visue. The Bordeaux copy reads vifue, the period spelling of vive, living; Florio has 'more lively'. In print of this period the long s (ſ) and f differ by a small cross-stroke, so visue is probably a misreading of vifue, by the 1907 printer or the transcriber. The edition keeps the word as transcribed and gives the modern spelling vive. The same printing convention explains the u in vifue and in liure: u and v were one letter, as were i and j in ie and i'eusse."
- id: n.ess.pref.sound
  attach: ess.pref.1
  kind: editorial
  status: draft
  leans_on: "Charles Thurot, De la prononciation française depuis le commencement du XVIe siècle (1881-1883), drawing on Meigret, Peletier, Ramus, Bèze and Henri Estienne"
  text: "The first sound scheme is a reconstruction of educated French of about 1580 and is approximate. Several of its features come from the grammarians of the period. The oi of foy and moy is given as weh; the period also had we and a plain eh. The s of estre, tost and moy-mesme had stopped being said and left the vowel long. Final consonants were silent before a consonant and sounded before a vowel, so est icy links as eht-ee-see. The e at the end of bonne and liure is still counted. Two uncertainties matter most: whether a final consonant was still sounded before a pause, which Palsgrave reported in 1530, and how strongly the final e was said in prose. The scheme also follows the Paris norm. Montaigne was from Périgord, and the Essais themselves admit a provincial accent in his speech, which this scheme does not model. His name is given with the palatal n of the period spelling, mohⁿ-ta-nyuh; the modern mohⁿ-teny follows the spelling."
- id: n.ess.19.cicero
  attach: ess.1.19.1.1
  kind: editorial
  status: draft
  leans_on: "Cicero, Tusculan Disputations 1.74-75 (Hazlitt's reference: Tusc. i. 31); Plato, Phaedo 64a and 67e"
  text: "Montaigne paraphrases Cicero, Tusculan Disputations 1.74, where Cicero says that the whole life of philosophers is a preparation for death (commentatio mortis), crediting the thought to Socrates. The source behind Cicero is Plato's Phaedo, in which Socrates says that those who practise philosophy rightly are practising dying. The chapter is numbered 19 in the 1595 text printed here and 20 in editions that follow the Bordeaux copy, because the order of chapters in book I changed between editions."
- id: n.ess.florio
  attach: ess.1.19.1
  kind: editorial
  status: draft
  leans_on: "Dictionary of National Biography (1885-1900), articles Florio, John and Shakespeare, William"
  text: "Florio's translation, published in London in 1603, was the first English version of the Essais. Its connection with Shakespeare rests on one well-documented case: a speech of Gonzalo in The Tempest (2.1), on an imagined commonwealth, follows closely Florio's wording in the chapter Of the Caniballes (book I, chapter 30 in his numbering). Wider claims of influence on Shakespeare's thought and vocabulary have been made and are disputed. A copy of Florio's Montaigne in the British Museum (now the British Library) bears a signature that was once claimed as Shakespeare's; its authenticity is doubted."
