  - tokens:
    - {t: Thā, n: þā}
    - {t: middungeard, n: middun-geard}
    - {t: moncynnæs, n: mon-cynnæs, caesura: true}
    - {t: 'Uard,', n: ward}
  - tokens:
    - {t: ēci}
    - {t: 'Dryctin,', n: dryhtin}
    - {t: æfter, caesura: true}
    - {t: tīadæ}
  - tokens:
