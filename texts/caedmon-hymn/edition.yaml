    - {t: maecti, n: mæhti}
    - {t: end, caesura: true}
    - {t: his}
    - {t: 'mōdgidanc,', n: mōd-giþanc}
  - tokens:
    - {t: uerc, n: werc}
    - {t: 'Uuldurfadur,', n: wuldur-fadur}
    - {t: suē, n: swē, caesura: true}
    - {t: hē}
    - {t: uundra, n: wundra}
    - {t: 'gihuaes,', n: gihwæs}
  - tokens:
    - {t: ēci}
    - {t: 'dryctin,', n: dryhtin}
    - {t: ōr, caesura: true}
    - {t: āstelidæ.}
  - tokens:
    - {t: Hē}
    - {t: āērist, n: ǣrist}
    - {t: scōp}
    - {t: aelda, n: ælda, caesura: true}
