# Notes for Cædmon's Hymn, both copies.
- id: n.cae.origin
  attach: cae.moore.1
  kind: editorial
  status: draft
  text: "Bede tells the story in his Ecclesiastical History (book 4, chapter 24, finished in 731). Cædmon, a lay brother who looked after the cattle at Hild's monastery at Whitby, left a feast when the harp came round because he could not sing. In a dream a figure told him to sing of the beginning of created things, and he sang verses he had never heard. Bede gives only a Latin paraphrase and says it renders the sense, not the order of the words. The Old English verses survive as additions to manuscripts of his history. All that dates the poem is Bede's account, which places the dream while Hild was abbess, 658 to 680 by Henry Bradley's reckoning (Encyclopaedia Britannica, 1911)."
- id: n.cae.moore
  attach: cae.moore.9
  kind: editorial
  status: draft
  text: "The Northumbrian copy was written at the end of the Moore manuscript of Bede, now Cambridge University Library Kk.5.16. Henry Sweet, quoted by Stopford Brooke in 1898, judged the hand contemporary with the list of kings that follows it, and dated that list most probably to 737. The copy is therefore within a few years of Bede's death in 735, about two generations after Cædmon. With the copy in the Saint Petersburg Bede, also Northumbrian and of the 8th century, it is one of the two oldest of the 21 copies, and among the oldest surviving written English verse."
- id: n.cae.spelling
  attach: cae.moore.3
  kind: editorial
  status: draft
  text: "The Moore scribe spells the sounds of early Northumbrian with Latin letters: u and uu for w (uerc, Uuldurfadur, uundra), ae for æ, ct for the h sound before t (dryctin, maecti), th for þ, and d in mōdgidanc where the West Saxon copy has þ. Til (line 6) is the Northumbrian preposition where West Saxon has tō; the word is the same as Old Norse til. The sound row reads these words as the scribe wrote them, respelled in the letters the sound rules read (the form shown under the word)."
- id: n.cae.subject
  attach: cae.moore.1.2
  kind: editorial
  status: draft
  text: "Neither copy has a word for 'we'. The earliest copies lack it; most later copies have we (or wue), and most translators supply it, as Brooke does. Bede's Latin, debemus 'we must', supports a first-person subject. The other reading makes scylun third person, with uerc Uuldurfadur in line 3, 'the work of the Father of glory', as its subject: his creation must praise him. Bruce Mitchell examined the question in 'Cædmon's Hymn, line 1: what is the subject of scylun or its variants?' (Leeds Studies in English, new series, 1985), and Daniel O'Donnell's electronic edition of the hymn (caedmon.seenet.org) sets out the manuscript evidence. Neither reading has been ruled out. The Weft translation brackets the 'we' it supplies."
- id: n.cae.aelda
  attach: cae.tanner.5.4
  kind: editorial
  status: draft
  text: "The copies divide into groups by the word in line 5. The Moore copy has aelda barnum, 'for the children of men'. Tanner 10 has eorðan bearnum, 'for the children of earth'. The two readings name the recensions, aelda and eorðan, in Wikisource's list of the copies. Both nouns alliterate on a vowel with ǣrest, so the metre does not decide between them."
- id: n.cae.names
  attach: cae.moore.7.4
  kind: editorial
  status: draft
  text: "The nine lines name God eight times with six nouns: Weard 'guardian' (lines 1 and 7), Metod 'measurer' (2), Wuldorfæder 'Father of glory' (3), Dryhten 'lord' with ēce 'eternal' (4 and 8), Scyppend 'creator' (6) and Frēa 'lord' (9). Restating one subject in a series of different terms is a common device of Old English verse, called variation. The epithets also carry the alliteration: hāleg in line 6, moncynnæs in line 7, Frēa in line 9."
- id: n.cae.middangeard
  attach: cae.tanner.7.2
  kind: editorial
  status: draft
  text: "Middangeard, the 'middle enclosure', is the world of men between heaven above and what lies below. The word has a cognate in Old Norse miðgarðr (Midgard). J. R. R. Tolkien, who taught Old English at Oxford, took his Middle-earth from it. Beowulf also has a song of the creation: at lines 90 to 98 a singer in Hrothgar's hall tells how the Almighty made the earth. That passage lies outside the lines of Beowulf in this library."
