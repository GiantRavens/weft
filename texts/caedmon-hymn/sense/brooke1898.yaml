# Stopford A. Brooke, English Literature from the Beginning to the Norman Conquest (1898), p. 129,
# footnote 1: the Northumbrian text "from Sweet's Old English texts" and his translation, line for
# line; verbatim from the Internet Archive OCR (englishliteratu00broo), where the two stand in
# columns and each line of the translation wraps once. The spaces the OCR sets before ! and : are
# removed. Brooke supplies "we", which the Old English does not have. He translates the Moore copy only.
translation: brooke1898
aligned_by: hand, phase 0; one span per line, as Brooke divides it
spans:
- lines: [cae.moore.1, cae.moore.1]
  text: Now must we greet with praise the guard of Heaven's realm,
- lines: [cae.moore.2, cae.moore.2]
  text: The Maker's might, and of His mind the thought,
- lines: [cae.moore.3, cae.moore.3]
  text: The glorious Father's works, and how to wonders all
- lines: [cae.moore.4, cae.moore.4]
  text: He gave beginning, He, the Eternal Lord!
- lines: [cae.moore.5, cae.moore.5]
  text: He at the very first formed for the bairns of men,
- lines: [cae.moore.6, cae.moore.6]
  text: He, Holy Shaper! Heaven for their roof;
- lines: [cae.moore.7, cae.moore.7]
  text: 'Then Middle-garth He made: He, of mankind the Ward!'
- lines: [cae.moore.8, cae.moore.8]
  text: Lord everlasting He! And then He let arise
- lines: [cae.moore.9, cae.moore.9]
  text: The earth for man; He is Almighty God!
