# Notes for Steere, Swahili Tales (1870), Kisa cha mwewe na kunguru (The Kites and the Crows).
- id: n.kites.collection
  attach: kites.1.1
  kind: editorial
  status: draft
  leans_on: "Edward Steere, Swahili Tales, as told by Natives of Zanzibar (London, 1870), preface, pages v and ix-x"
  text: "Edward Steere printed this tale in Swahili Tales, as told by Natives of Zanzibar (London, 1870), with the Swahili on the left-hand page and his English on the right. In the preface he says the tales were first taken down to help him learn the language of Zanzibar, that he made the translation \"as literal as possible\" for those who would learn it after him, and that \"all the tales are printed exactly as they were related\". He names his narrators. This tale was told by Hamisi wa Kayi, \"as he is commonly called, though his name is written Khamis bin Abubekr\", whose tales Steere takes to represent \"the best and purest language of Zanzibar\". Other tales in the book come from Masazo, for a long time the cook and house steward of Steere's household, whose speech Steere calls less refined and richer in Arabic words; from Mohammed bin Abdallah bin Ali, in what Steere calls the court dialect; from a writer of Mombasa; and from Munyi Khatibu of Mtang'ata on the mainland coast. The preface says nothing more about Hamisi wa Kayi."
- id: n.kites.steere
  attach: kites.1.1.1
  kind: editorial
  status: draft
  leans_on: "C. A. Harris, 'Steere, Edward', Dictionary of National Biography, volume 54 (1898), pages 141-142; the title page and preface of Swahili Tales (1870)"
  text: "Steere (1828-1882) trained as a lawyer in London and was ordained in 1856. At the end of 1862 he obtained leave from his parish to go out with his friend William George Tozer, the new bishop of the Universities' Mission to Central Africa, to the Zambezi and the Shire. The mission made little progress there, and in August 1864 it fixed its headquarters at Zanzibar, which the Dictionary of National Biography calls the centre of the slave traffic; its first pupils there were a few slave boys. Steere compiled his Swahili handbook in these years and sailed for England in 1868. The preface to the tales is signed at his Lincolnshire parish, Little Steeping, at Michaelmas 1869, and the title page calls him chaplain to Bishop Tozer. He returned to Zanzibar in 1872, was consecrated bishop in 1874, built the mission's cathedral on the site of the former slave market (opened on Christmas Day 1879), issued a Swahili New Testament in 1879, and died at Zanzibar in 1882. Steere says the tales were printed chiefly to help those who would follow him in learning the language."
- id: n.kites.church
  attach: kites.7.2.5
  kind: editorial
  status: draft
  leans_on: "Steere, Swahili Tales (1870), preface, page v"
  text: "Kanisa is a church, and kanisani is at or to the church. In his preface Steere gives this tale as an example of the touches a narrator put in \"on the inspiration of the moment\": the narrator substituted church for mosque, \"out of compliment to us\". The Swahili word for a mosque is msikiti. Steere printed the tale as it was told, with the church in every place, and recorded the change in the preface instead of restoring the mosque. The note shows who the first audience was: a narrator telling the story to the missionaries who were writing it down. It also limits what the text can show about how the tale was usually told, since Steere says most of the tales have such touches and marks only this one."
- id: n.kites.orthography
  attach: kites.3.1.1
  kind: editorial
  status: draft
  leans_on: "Steere, Swahili Tales (1870), preface, page xiv; Steere, A Handbook of the Swahili Language, third edition revised by A. C. Madan (1884), pages 8-15; W. H. Whiteley, Swahili: The Rise of a National Language (London, 1969)"
  text: "Steere wrote Swahili in roman letters by a system of his own, set out in his Handbook: \"the vowels are to be pronounced as in Italian, the consonants as in English\", with fixed digraphs (ch, sh, ny, ng') for single sounds. It is close to the spelling later made standard, which was fixed in the 1930s on the dialect of Zanzibar town, and most words in this tale are spelled as they are today. The differences are of two kinds. Some are spelling: hatta (now hata), assubui (asubuhi), bass (basi) and asikari (askari) keep the double consonants of the Arabic originals or break a cluster with a vowel, and assubui has no h. Others are older or regional shapes of a word: Muungu (Mungu), weye (wewe), mgine (mwingine), wangine (wengine), mutie (mtie), mwulize (muulize), nayee (naye). The text keeps Steere's letters and gives the modern standard form beneath; the first sound scheme reads Steere's letters, the second the modern form. Grammar is not modernized. Naliwaambia, I told them, keeps an older first-person past where the standard now has niliwaambia, and Sultani ya keeps a concord the standard does not use (see the note on noun classes)."
- id: n.kites.arabic-script
  attach: kites.1.1.6
  kind: editorial
  status: draft
  leans_on: "Steere, A Handbook of the Swahili Language, third edition revised by A. C. Madan (1884), introduction, pages 5-6"
  text: "Waraka is a letter or written document, a word from Arabic. When Steere wrote, Swahili speakers who wrote their language used the Arabic script. His Handbook says Swahili \"has been hitherto but little written by those who speak it, and they know and use only the purely Arabic alphabet\", and mentions copies of religious and secular verse in the old poetical dialect, and letters in the spoken dialect that open with Arabic compliments. Steere argued against making the Arabic script the standard for Swahili. Arabic writes three vowels where Swahili has five and has no letters for ch, g, p or v, so writers used one letter for several sounds; he cites a letter from Kilwa in which no one could tell whether a man amekufa, had died, or amevuka, had got away. That is the case of a missionary for the roman alphabet he was introducing. The Arabic-script tradition of Swahili writing is older than Steere's work and is not represented in this edition."
- id: n.kites.noun-classes
  attach: kites.1.1.3
  kind: editorial
  status: draft
  leans_on: "Steere, A Handbook of the Swahili Language (1884), pages 16-17; the class numbering of W. H. I. Bleek and C. Meinhof, as used by Universal Dependencies (feature NounClass)"
  text: "Swahili is a Bantu language. Every noun belongs to a noun class, marked by a prefix that changes between singular and plural: mtu, a person, watu, people; mji, a town, miji, towns. Words that refer to a noun take that class's prefix, so the class shows across the sentence: mji wao, their town (class 3); moto ukawaka, the fire blazed (class 3); tumbo linaniuma, the belly hurts me (class 5). The verb carries its subject's class: aliondoka, he arose, with a- for one person (class 1). Steere's Handbook groups the nouns into eight classes by their singular and plural prefixes. The morphology here uses the numbering of comparative Bantu grammar, 1 to 18, which counts singular and plural as separate classes and gives the locatives 16 to 18; the gloss marks the class of an agreeing word where it helps, as in of(cl.9). Two things in this tale depend on it. Kunguru, crow, and mwewe, kite, have the shape of class 9 and 10 nouns but take the concords of people, class 1 and 2 (huyu kunguru, this crow; wakapigana, they fought), as names of animals regularly do. Sultani takes ya, the class 9 form of 'of', in Sultani ya kunguru, where standard Swahili gives a person the class 1 form, sultani wa. Whether ya reflects Zanzibar usage of the 1860s, this narrator's habit or Steere's hearing cannot be settled from one tale."
- id: n.kites.owls
  attach: kites.3.2
  kind: editorial
  status: draft
  leans_on: "I. G. N. Keith-Falconer, Kalilah and Dimnah, or the Fables of Bidpai, translated from the later Syriac version (Cambridge, 1885), the story of the owls and the crows, pages 142-143 and 151"
  text: "The plot follows closely the fable of the owls and the crows, a story of the Indian Panchatantra that passed into Arabic in Kalila and Dimna. In the version Ion Keith-Falconer translated from Syriac in 1885, the owls defeat the crows. A crow counsellor asks to be beaten and to have his wings plucked, and is left behind under a tree; the owls take him in; he tells them his own side cast him out for advising submission to the owls; he learns where they live and returns to lead the crows, who each bring a piece of dry wood to the entrance of the owls' hole and set it alight. In the Zanzibar tale the kites take the place of the owls, the crow's excuse is the same (because I told them to obey the kite), the trick is the same, and the fire is laid at the door of the church. Steere does not name a source for this tale, and a shared plot does not show by what route the story reached Zanzibar."
- id: n.kites.sound
  attach: kites.2.4.4
  kind: editorial
  status: draft
  leans_on: "Steere, Swahili Tales (1870), preface, page xiv; Steere, A Handbook of the Swahili Language, third edition revised by A. C. Madan (1884), pages 10-13"
  text: "The first sound scheme reads Steere's letters by the values he gives them. Two of his observations show in this tale. An m before a consonant other than b or w is a syllable of its own and can carry the accent: in mtu, a person, \"the stress of voice is on the m\", so the word is M-too, and mzee and mmoja begin the same way. When a prefix ending in -a meets a word beginning with e-, \"the two letters coalesce into a long e sound\", usually but not always, so wakaenda, they went, is given as wa-KAY-nda rather than wa-ka-E-nda. The accent falls on the last syllable but one throughout, as the preface to the tales says. Steere also hears an \"explosive or aspirated\" p, t or k where a nasal has been lost, which he says refined speakers smooth down; the scheme does not mark it, nor the implosive b, d and g that later descriptions report. These descriptions are taken from the third edition of the Handbook (1884), revised by A. C. Madan after Steere's death, so a detail may be Madan's rather than Steere's."
