predicted_gaps:
  - "one English translation only: no other public-domain English translation of this tale was found. The Sheldon Press selection of 1927 (The Hare and the Lion, and other tales from Bishop Steere's Swahili Tales) reprints Steere's own English"
  - "the archive.org OCR misreads Steere's type often (n for u, b for h, a for u); each of the 37 tokens where it differs from the scan declares the OCR reading (ocr field in edition.yaml), checked against the scan"
  - "the 1870 sound scheme reads Steere's letters by the values his Handbook gives them; the Handbook used is the third edition (1884), revised by A. C. Madan after Steere's death, and no recording exists. The aspirated p, t, k Steere describes, implosive b, d, g and tone are not modelled"
  - "double consonants in Arabic loans (hatta, assubui) are sounded as written in the 1870 scheme; Steere's Handbook says they were often reduced to one"
  - "the modern standard form (n) modernizes spelling and the shape of a word, not grammar: Sultani ya, naliwaambia, ndio and the verb enenda are kept as the narrator said them"
  - "no treebank; lemma, morphology and gloss by hand, draft. Noun classes use the UD feature NounClass (Bantu1-Bantu18); the build's morphology display does not yet decode NounClass or Aspect, so the class shows in the gloss of agreeing words"
