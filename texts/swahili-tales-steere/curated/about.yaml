summary: "A Swahili animal fable, told at Zanzibar in the later 1860s and printed by Edward Steere in Swahili Tales (1870) with his literal English translation. The crows, beaten in war by the kites, send an old crow among them as a pretended exile. He gains their trust, and when the kites gather in church on their feast day, the crows set fire to it and take the town. The plot follows the fable of the owls and the crows in the Panchatantra, which passed into Arabic in Kalila and Dimna. Steere records that the narrator put a church where the tale had a mosque."
