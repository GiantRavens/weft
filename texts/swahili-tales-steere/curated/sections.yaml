# Human overlay for Steere, Swahili Tales (1870), Kisa cha mwewe na kunguru. No treebank exists
# for 19th-century Swahili. Lemmas are modern standard headwords, in the form standard
# dictionaries cite them (TUKI, Kamusi ya Kiswahili-Kiingereza, 2001), and the older forms were
# checked against Steere's Handbook (1884 edition); Steere's spelling stays in the text. Verbs are cited by stem
# (ondoka, ambia); the monosyllabic stems that keep ku- (kuwa, kuja, kufa, kwenda, kwisha) and
# bound forms with a hyphen (-a, -angu, -ingi, -ote) as dictionaries cite them.
#
# Morphology: Universal Dependencies features. Noun class uses the UD feature NounClass with the
# values Bantu1 to Bantu18 (the Bleek-Meinhof numbering used in Bantu linguistics), applied
# consistently:
#   - a noun carries its own class: the singular class for a singular, the plural class for a
#     plural (kunguru "crows" Bantu10, mji "town" Bantu3, manyoya "feathers" Bantu6). Animal
#     nouns of class 9/10 that take the concords of people (kunguru, mwewe) keep 9/10 here;
#     their agreement shows on the verb. Sultani is given class 9 because the narrator gives it
#     the class 9 concord (Sultani ya); see the note on noun classes.
#   - a word that agrees carries the class it agrees in: the associative -a (ya, wa, mwa), the
#     possessives, adjectives, demonstratives, numerals, and the verb's subject prefix (with
#     Person and Number). Object prefixes are shown in the gloss only.
#   - a noun with the locative suffix -ni (mjini, kanisani) has Case=Loc and its own class.
# Verb tense-aspect markers: -li- Tense=Past; -ka- (the consecutive, "and then") Tense=Past, with
# "and-" in the gloss; -na- and -a- Tense=Pres; -ta- Tense=Fut; -me- Aspect=Perf; -ki- Mood=Cnd
# where it means "if" and Aspect=Prog where it means "while"; the subjunctive in -e Mood=Sub;
# -w- Voice=Pass; negatives Polarity=Neg. A token that is two words (nawe = na + wewe,
# wenzangu = mwenzi + -angu) carries both, joined by +.
# Gloss: one cell per printed word, hyphenated; the class of an agreeing word is shown in
# brackets where it helps (of(cl.9), it(cl.3)-blazed); people are he/they.
- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
