# Weft edition of "Kisa cha mwewe na kunguru" (The Kites and the Crows), the whole tale, from
# Edward Steere, Swahili Tales, as told by Natives of Zanzibar (London, 1870), pages 364 and 366.
# Steere prints the Swahili on the left-hand page and his English on the right. The tale was told
# to him by Hamisi wa Kayi (preface, p. ix).
#
# The text was transcribed from the page scans of the archive.org copy (swahilitalesast00steegoog)
# and is checked two ways by `weft draft`:
#   1. verbatim against the proofread transcription on multilingual Wikisource (verify_in, one
#      page file per section; verify_strip removes the small-capitals template {{sc|...}} around
#      the first word);
#   2. against the archive.org OCR of the same scan (ocr_check; the sensor is line_checks in
#      pipeline/weft/swahili.py, failure class edition-not-in-ocr). The sensor rejoins words broken
#      at a line end and compares without spaces. Where the OCR misreads the scan, the token gives
#      the OCR's reading (ocr); each was checked against the scan.
# Steere's paragraphs are the sections. Weft divides them into lines at the sentence, and the
# longest sentences at a clause.
#
#   t     the word as printed in 1870, punctuation attached (kunguru,)
#   n     the modern standard Swahili form of the same word (hatta: hata, asikari: askari,
#         Muungu: Mungu, mgine: mwingine). Spelling and word shape only; grammar is kept
#         (Sultani ya, naliwaambia). The page shows it as "Modern standard form"; the modern
#         sound scheme is computed from it, the 1870 scheme from t
#   glue  no space follows in the print (akawaambia—tukimbie)
#   ocr   the OCR's reading of this token where it differs from the scan
#   ipa   {scheme: ipa} override for this occurrence
work: swahili-tales-steere
joiner: " "
verify_strip: '\{\{sc\||\}\}'
ocr_check:
  file: sources/steere1870-ocr.txt
sections:
