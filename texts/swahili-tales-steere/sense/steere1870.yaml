# Edward Steere's English translation, printed on the pages facing the Swahili in Swahili Tales
# (London, 1870), pages 365 and 367; verbatim from the proofread English Wikisource transcription
# (Page:Swahili tales.djvu/385 and /387, the files pinned in the manifest), checked against the
# page scans. No corrections were made; the small capitals of the first word are set in ordinary type.
# Steere's preface: "I have tried therefore to make the translation as literal as possible."
translation: steere1870
aligned_by: hand, phase 0; one span per English sentence, matched to Steere's Swahili sentences paragraph
  by paragraph
spans:
- lines:
  - kites.1.1
  - kites.1.1
  text: The king of the crows arose and sent a letter to the king of the kites, and said to him, "I want
    you to be my soldier."
- lines:
  - kites.1.2
  - kites.1.2
  text: And he said, "I do not consent."
- lines:
  - kites.1.3
  - kites.1.3
  text: And he said, "If you do not consent, you and I will fight."
- lines:
  - kites.1.4
  - kites.1.4
  text: And he said, "Let us fight; if you beat me, I will obey you; if I beat you, you will obey me."
- lines:
  - kites.2.1
  - kites.2.1
  text: And they fought, and the crows were beaten.
- lines:
  - kites.2.2
  - kites.2.2
  text: And an old one arose and said, "Let us flee."
- lines:
  - kites.2.3
  - kites.2.3
  text: And they fled from their town, and went to another town.
- lines:
  - kites.2.4
  - kites.2.4
  text: And when the kites came and saw no one, they lived in the town of the crows.
- lines:
  - kites.3.1
  - kites.3.1
  text: Till one day the crows took counsel.
- lines:
  - kites.3.2
  - kites.3.2
  text: And an old one arose, and said, "Pluck off my feathers, and throw me into the town of the kites."
- lines:
  - kites.3.3
  - kites.3.3
  text: And they plucked him, and threw him in.
- lines:
  - kites.4.1
  - kites.4.1
  text: And when the kites passed and saw him, they said to him, "What are you doing here in our town?"
- lines:
  - kites.4.2
  - kites.4.2
  text: And he said, "My companions have beaten me, and turned me out of the town, because I told them
    to obey the kite."
- lines:
  - kites.5.1
  - kites.5.2
  text: And they took him and went with him to their king, and said to him, "We have picked up this crow;
    ask him, he will tell his business."
- lines:
  - kites.6.1
  - kites.6.2
  text: And the king asked him, and he said, "My companions have beaten me, and turned me out of the town,
    because I told them truly, 'Obey the kite, he is our king;' and they beat me."
- lines:
  - kites.6.3
  - kites.6.3
  text: And the king of the kites said, "Stay here."
- lines:
  - kites.7.1
  - kites.7.1
  text: And he stayed many days.
- lines:
  - kites.7.2
  - kites.7.3
  text: Till one day they went to church, and they took him, and they prayed together; and when they went
    out, they asked him, "We and you, which worships God best?"
- lines:
  - kites.7.4
  - kites.7.4
  text: And he said, "You do."
- lines:
  - kites.8.1
  - kites.8.1
  text: And he stayed, and they loved him much.
- lines:
  - kites.8.2
  - kites.8.3
  text: Till when their feast day drew near, he went out in the night, and went and told his companions,
    "To-morrow they will all go to church, come outside the door of the church and put fire to it."
- lines:
  - kites.8.4
  - kites.8.4
  text: And they went out, and went to look for firewood, and others went and fetched fire.
- lines:
  - kites.9.1
  - kites.9.1
  text: So in the morning they went to church, without there remaining a single person in the town, except
    that old crow.
- lines:
  - kites.9.2
  - kites.9.2
  text: And they said to him, "Why are you not going to church to-day?"
- lines:
  - kites.9.3
  - kites.9.3
  text: And he said, "My stomach aches badly."
- lines:
  - kites.9.4
  - kites.9.4
  text: And they said to him, "Very well."
- lines:
  - kites.9.5
  - kites.9.5
  text: And he went and called his companions.
- lines:
  - kites.9.6
  - kites.9.6
  text: And he said to them, "They have all gone into the church."
- lines:
  - kites.10.1
  - kites.10.1
  text: And they went and put firewood at the door of the church, and others set it on fire.
- lines:
  - kites.10.2
  - kites.10.2
  text: And the fire blazed up.
- lines:
  - kites.10.3
  - kites.10.4
  text: And they saw the smoke come into the church, and they fled to the windows, and others died, very
    many, and the king and all died.
- lines:
  - kites.10.5
  - kites.10.5
  text: And the crows took the town.
- lines:
  - kites.11.1
  - kites.11.1
  text: And the kites who remained have fled from the crows to this day.
