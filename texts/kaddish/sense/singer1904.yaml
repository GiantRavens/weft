# Simeon Singer's translation of the Mourner's Kaddish, The Authorised Daily Prayer Book, 7th edition (London, 1904),
# pp. 77-78, from the archive.org scan (authoriseddailyp00sing). One span per paragraph. The scan's OCR spacing before
# ';' and ':' is closed up, and its 'tit who maketh peace' is read as 'He who maketh peace'. Singer's verses said by
# the congregation between the paragraphs (Numbers 14:17, Psalms 25:6, 113:2, 121:2) are not part of the Kaddish and are left out.
translation: singer1904
aligned_by: 'hand: one span per paragraph'
spans:
- lines: [kadd.yitgadal.1, kadd.yitgadal.5]
  text: Magnified and sanctified be his great name in the world which he hath created according to his will. May he establish his kingdom
    during your life and during your days, and during the life of all the house of Israel, even speedily and at a near time, and say ye,
    Amen.
- lines: [kadd.yehe-shmeh.1, kadd.yehe-shmeh.1]
  text: Let his great name be blessed for ever and to all eternity.
- lines: [kadd.yitbarakh.1, kadd.yitbarakh.5]
  text: Blessed, praised and glorified, exalted, extolled and honoured, magnified and lauded be the name of the Holy One, blessed be he;
    though he be high above all the blessings and hymns, praises and consolations, which are uttered in the world; and say ye, Amen.
- lines: [kadd.yehe-shlama.1, kadd.yehe-shlama.2]
  text: May there be abundant peace from heaven and life for us and for all Israel; and say ye, Amen.
- lines: [kadd.oseh-shalom.1, kadd.oseh-shalom.2]
  text: He who maketh peace in his high places, may he make peace for us and for all Israel; and say ye, Amen.
