# Human overlay for the Mourner's Kaddish. No treebank covers the liturgy; lemma, morphology and gloss are by hand,
# in the conventions of the OSHB-derived Aramaic of Daniel 5 (Stem=Peal/Pael/Aphel/Hithpaal, State=Abs/Cons/Det).
# Lemmas are dictionary forms after Jastrow, A Dictionary of the Targumim (1903). The eight verbs of praise are
# Hithpaal jussives, 'may it be magnified...'; the gloss row gives the first in full and the rest as and-praised.
# The last line and a half (וְחַיִּים עָלֵינוּ..., עֹשֶׂה שָׁלוֹם...) are Hebrew, glossed the same way. A noun with a
# pronoun suffix (שְׁמֵהּ, his-name) is State=Cons, as the OSHB marks it.
- by: Claude (Weft phase 0), hand parse and gloss; for review by Skip and a scholar
  date: 2026-10-10
  why: no treebank for the liturgy; a hand parse with hand glosses, as for the Nicene Creed
  status: draft
  set:
    kadd.yitgadal.1.1: {lemma: "גְּדַל", morph: "VERB|Conj=Yiqtol|Gender=Masc|Mood=Jus|Number=Sing|Person=3|Stem=Hithpaal", gloss: "may-be-magnified"}   # יִתְגַּדַּל
    kadd.yitgadal.1.2: {lemma: "קְדַשׁ", morph: "VERB|Conj=Yiqtol|Gender=Masc|Mood=Jus|Number=Sing|Person=3|Stem=Hithpaal", gloss: "and-be-sanctified"}   # וְיִתְקַדַּשׁ
    kadd.yitgadal.1.3: {lemma: "שֻׁם", morph: "NOUN|Gender=Masc|Number=Sing|State=Cons", gloss: "his-name"}   # שְׁמֵהּ
    kadd.yitgadal.1.4: {lemma: "רַב", morph: "ADJ|Gender=Masc|Number=Sing|State=Det", gloss: "great"}   # רַבָּא
    kadd.yitgadal.2.1: {lemma: "עָלַם", morph: "NOUN|Gender=Masc|Number=Sing|State=Det", gloss: "in-the-world"}   # בְּעָלְמָא
