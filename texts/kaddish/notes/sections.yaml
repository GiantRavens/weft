# Notes on the Mourner's Kaddish.
- id: n.kadd.yitgadal.ezekiel
  attach: kadd.yitgadal.1
  kind: editorial
  status: draft
  leans_on: Ezekiel 38:23; the Talmud, Berakhot 3a and Sotah 49a; the Seder of Amram Gaon (about 860)
  text: "The first two words take up Ezekiel 38:23, where God says וְהִתְגַּדִּלְתִּי וְהִתְקַדִּשְׁתִּי, 'I will magnify myself and sanctify myself', and turn them into a wish: may his name be magnified and sanctified. The Talmud quotes the congregation's response (the next paragraph) as already in use, but gives no full text; the first complete text is in the prayer book of Amram Gaon, written in Babylonia about 860. The Kaddish closed a passage of study or a section of the service, and it still does; the mourner's use came later."
- id: n.kadd.yitgadal.aramaic
  attach: kadd.yitgadal.1.1
  kind: editorial
  status: draft
  leans_on: Tosafot to Berakhot 3a; Jastrow, A Dictionary of the Targumim (1903)
  text: "The prayer is in Aramaic, the spoken language of the Jews of Palestine and Babylonia in the period of the Talmud, while most of the service around it is in Hebrew. Medieval commentators already asked why, and gave reasons (Tosafot to Berakhot 3a). The sound row applies the Tiberian values that the Masoretes used for the Aramaic of Daniel, which is the nearest fully recorded reading; it is an approximation, and the stress, which the prayer book does not mark, is supplied by rule."
- id: n.kadd.yitgadal.response
  attach: kadd.yitgadal.5.5
  kind: editorial
  status: draft
  leans_on: the rubrics of the Ashkenazi prayer book (Singer 1904; Hebrew Wikisource)
  text: "Each 'and say ye, Amen' is answered by the congregation, and the congregation answers Amen after 'his great name' in the first line and 'blessed be he' after 'the Holy One'. The Kaddish is said only with a quorum of ten (a minyan): it is a call and its answer, not a private prayer. The edition prints the responses apart from the text, and this page leaves them out of the text line."
- id: n.kadd.yehe-shmeh.daniel
  attach: kadd.yehe-shmeh.1
  kind: editorial
  status: draft
  leans_on: Daniel 2:20 (Aramaic); the Talmud, Shabbat 119b and Sotah 49a
  text: "The congregation's response is the center of the prayer. Its wording is close to Daniel 2:20, Daniel's own blessing in Aramaic, 'Blessed be the name of God from age to age' (לֶהֱוֵא שְׁמֵהּ דִּי־אֱלָהָא מְבָרַךְ מִן־עָלְמָא וְעַד־עָלְמָא); the Aramaic of Daniel 5 is also in this library. The Talmud (Shabbat 119b) praises answering 'Amen, may his great name be blessed' with all one's strength, and (Sotah 49a) names it among the things on which the world stands."
- id: n.kadd.yitbarakh.verbs
  attach: kadd.yitbarakh.1
  kind: editorial
  status: draft
  leans_on: the Aramaic verb forms (Hithpaal jussive); Singer's translation
  text: "Eight verbs follow one another, all the same form: a reflexive-passive stem (Hithpaal, one Hithpolel) in the jussive, 'may it be blessed, praised, glorified...'. Together with the two in the first line they make ten, and some commentators count them so. Singer keeps the series as one sentence and puts the verbs before the name, as the Aramaic does."
- id: n.kadd.yehe-shlama.mourners
  attach: kadd.yehe-shlama.1
  kind: editorial
  status: draft
  leans_on: Isaac ben Moses of Vienna, Or Zarua (13th century); the rubric 'said by a Mourner' in Singer 1904
  text: "The Mourner's Kaddish is the half Kaddish with these two closing petitions for peace. It does not mention death. Its use by mourners for a parent is attested in the Rhineland and Austria by the 13th century, with a story about Rabbi Akiva and a dead man's son told as its origin; the customs of saying it for eleven months and on the anniversary of the death are later. The last line and a half are in Hebrew, not Aramaic, and the final line, 'He who makes peace in his high places', is also the close of the Amidah."
- id: n.kadd.yitgadal.lords-prayer
  attach: kadd.yitgadal.3
  kind: editorial
  status: draft
  leans_on: Matthew 6:9-10; the comparison is common in the scholarship on the Lord's Prayer
  text: "The first lines ask that God's name be sanctified and his kingdom established soon. The Lord's Prayer opens with the same two petitions, 'Hallowed be thy name. Thy kingdom come' (Matthew 6:9-10). The likeness is often noted; the dating of the Kaddish's wording does not allow a claim about which shaped the other."
