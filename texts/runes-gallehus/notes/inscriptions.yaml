# Notes for the golden horn of Gallehus.
- id: n.run.gallehus.horn
  attach: run.gallehus.1
  kind: editorial
  status: draft
  text: "Two gold horns were found at Gallehus, in 1639 and 1734; this inscription is on the second. Both were stolen from the royal collection in Copenhagen and melted down in 1802. The runes survive only in drawings made before the theft."
- id: n.run.gallehus.verse
  attach: run.gallehus.1.3
  kind: editorial
  status: draft
  text: "The line alliterates on h: hlewagastiz, holtijaz, horna. It is among the earliest surviving lines of Germanic alliterative verse, the form later used in Beowulf and the Edda."
- id: n.run.gallehus.stephens
  attach: run.gallehus.1.1
  kind: editorial
  status: draft
  text: "Stephens (1884) divided the runes differently, reading ECHLEW as a personal name, the inscription as an offering to a forest god, and linking the name to Ecglaf in Beowulf. Modern runologists read ek, 'I', as the first word, which makes the inscription a maker's signature. Both translations are shown so the change in reading is visible."
