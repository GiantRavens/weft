predicted_gaps:
- lemma and morphology are an automatic parse (GLAUx), read token by token and corrected in curated/; book 2 needed 142 corrections in 1409 tokens of 2.2-2.17; book 1 has 260 entries in 1847 tokens, of which 129 only set the article and adjective heading an item of the list (τὸ καλόηθες) to accusative, a form identical with the nominative, which GLAUx tags now one way and now the other; the other 131 correct lemmas, gender, case, tense and part of speech
- 'form-mismatch and no-treebank-word, 3 each, in book 1: 1.16.29, where Leopold prints φελώνῃ and the GLAUx text reads τελώνῃ, and the quotation marks on ʽθεῶν and δεῖται.ʼ in 1.17.23; lemma and morph for all three are supplied in curated/'
- '1.14.3 breaks off after the article (ἐν τῇ τιμῇ τῆς ·, with no noun after τῆς; Long translates "in my regard for philosophy"); the page prints the high stop as Leopold sets it'
- Koine pronunciation of the late 2nd century is reconstructed; Marcus was a Latin speaker writing Greek
- 'form-mismatch and no-treebank-word, 2 each, in 2.13: the Perseus text prints the Pindar quotation in ʽ ʼ marks, which the tokenizer keeps on τὰ and ἐρευνῶντος; lemma and morph for both are supplied in curated/'
- 'morph-empty-declinable, 2, in 2.14: GLAUx tags the indeclinable numerals δύο and ἑκατόν as adjectives with no inflection; the tag is filled in curated/'
- 'words Leopold deletes (Perseus <del>: 2.2 ἄφες ... ἀποθνῄσκων, 2.4 οἰχήσῃ, 2.12 ἔχῃ) are not printed; GLAUx keeps an empty-form placeholder for each, which the treebank loader must skip (core change requested: treebank.load_glaux skips words with an empty form; _norm strips a trailing hyphen so the crasis split τ- + αὐτὸν rejoins as ταὐτὸν)'
