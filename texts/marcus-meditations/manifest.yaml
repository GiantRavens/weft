predicted_gaps:
- lemma and morphology are an automatic parse (GLAUx), not hand-checked; expect some errors (Book 2 review corrected 142 of 1409 tokens in 2.2-2.17, see curated/)
- Koine pronunciation of the late 2nd century is reconstructed; Marcus was a Latin speaker writing Greek
- 'form-mismatch and no-treebank-word, 2 each, in 2.13: the Perseus text prints the Pindar quotation in ʽ ʼ marks, which the tokenizer keeps on τὰ and ἐρευνῶντος; lemma and morph for both are supplied in curated/'
- 'morph-empty-declinable, 2, in 2.14: GLAUx tags the indeclinable numerals δύο and ἑκατόν as adjectives with no inflection; the tag is filled in curated/'
- 'words Leopold deletes (Perseus <del>: 2.2 ἄφες ... ἀποθνῄσκων, 2.4 οἰχήσῃ, 2.12 ἔχῃ) are not printed; GLAUx keeps an empty-form placeholder for each, which the treebank loader must skip (core change requested: treebank.load_glaux skips words with an empty form; _norm strips a trailing hyphen so the crasis split τ- + αὐτὸν rejoins as ταὐτὸν)'
