# Notes for Marcus Aurelius, Meditations Books 1 and 2. Editorial notes are drafts until a reviewer lifts them.
- id: n.med.1.from
  attach: med.1.1.1.1
  kind: editorial
  status: draft
  leans_on: "Long (1862), note on 1.1; H. W. Smyth, Greek Grammar (1920), on the article with the neuter adjective"
  text: "Each section of book 1 opens with Παρά, 'from', and the name of a person, and none of the opening phrases has a verb. Long notes that it is not certain what verb should be supplied; he writes 'I learned' or 'I observed' where it fits, and admits that some sections do not fit it. What follows the name is usually the neuter article with an adjective, τὸ καλόηθες, τὸ ἀόργητον. Greek uses this construction to name a quality, so the glosses give the article as 'the' and the adjective as the quality or as a description of it: 'the good-character', 'the not-angry'. The last section changes the formula to Παρὰ τῶν θεῶν, 'from the gods'."
- id: n.med.1.people
  attach: med.1.1.1.4
  kind: editorial
  status: draft
  leans_on: "Long (1862), introduction and notes on book 1, which cite Capitolinus (the Historia Augusta life of Marcus)"
  text: "The people of book 1 are named briefly, and Long's notes identify most of them. Verus (1.1) is Marcus's grandfather, Annius Verus; the father of 1.2, remembered only by reputation, was also Annius Verus and, Long says, died while he was praetor; the mother of 1.3 is Domitia Lucilla; the great-grandfather of 1.4 is perhaps her grandfather, Catilius Severus. Among the teachers, Rusticus (1.7) is the Stoic Q. Junius Rusticus, later Marcus's adviser; Apollonius (1.8) a Stoic who came to Rome under Antoninus Pius; Sextus (1.9) Sextus of Chaeronea, probably a grandson of Plutarch; Alexander (1.10) a grammarian from Phrygia; Fronto (1.11) the rhetorician M. Cornelius Fronto, whose letters with Marcus survive; Catulus (1.13) the Stoic Cinna Catulus; Maximus (1.15) the Stoic Claudius Maximus. The tutor of 1.5 is not named. Long doubts the word 'brother' in 1.14, since Marcus had no brother, and reports the suggestion that this Severus is the Peripatetic Claudius Severus. The father of 1.16 is Marcus's adoptive father, the emperor Antoninus Pius."
- id: n.med.1.5.games
  attach: med.1.5.1.6
  kind: editorial
  status: draft
  leans_on: "Long (1862), translation of 1.5; Lewis and Short, A Latin Dictionary (1879), s.vv. prasinus, venetus, parma, scutum"
  text: "The four names in this line are Latin words written in Greek letters. Πρασιανός and Βενετιανός are partisans of the Greens and the Blues, two of the factions that ran chariot teams in the Circus at Rome (Latin prasinus, leek-green, and venetus, blue). Παλμουλάριος and Σκουτάριος are partisans of two kinds of gladiator, named after the shields they carried: the small round parma and the large oblong scutum. Long translates them as 'the Parmularius or the Scutarius at the gladiators' fights'. The tutor is credited with keeping Marcus from taking sides in either."
- id: n.med.1.7.epictetus
  attach: med.1.7.8.5
  kind: editorial
  status: draft
  leans_on: "Long (1862), note on 1.7; Arrian's preface to the Discourses of Epictetus"
  text: "Rusticus gave Marcus τὰ Ἐπικτήτεια ὑπομνήματα, 'the notes of Epictetus', from his own copy. Long points out that this should not be translated 'the writings of Epictetus', since Epictetus wrote nothing. What survives of his teaching was written down by his pupil Arrian, who calls his record ὑπομνήματα, notes or memoranda, in the preface to the Discourses. The Handbook (Enchiridion) is Arrian's summary of the same teaching; its first chapter is in this library."
- id: n.med.1.14.names
  attach: med.1.14.2.6
  kind: editorial
  status: draft
  leans_on: "Long (1862), note on 1.14; Tacitus, Annals 16.21-35; Suetonius, Vespasian 15; Plutarch, Life of Dion"
  text: "Thrasea, Helvidius, Cato, Dion and Brutus are men remembered for opposing a ruler. Thrasea Paetus and his son-in-law Helvidius Priscus were Stoic senators; Tacitus describes Thrasea's forced suicide under Nero, and Helvidius was put to death under Vespasian. Cato is probably Cato the Younger, the Stoic who killed himself rather than submit to Caesar; Dion is Dion of Syracuse, who expelled the tyrant Dionysius II; Brutus is one of Caesar's assassins. Plutarch wrote lives of Cato, Dion and Brutus. Marcus says that Severus taught him to know them, and in the same breath names the idea of a state with equal laws in which a monarchy respects the freedom of the governed."
- id: n.med.1.16.father
  attach: med.1.16.1.3
  kind: editorial
  status: draft
  leans_on: "Long (1862), notes on 1.16; Meditations 6.30"
  text: "Section 16 is the longest in book 1 and describes Antoninus Pius, Marcus's uncle by marriage and adoptive father, emperor from 138 to 161. Marcus adds to the list of qualities details of habit: the hours of his bath, his indifference to building, food and clothes, and what he wore at his villas at Lorium, Lanuvium and Tusculum. A second portrait of Antoninus, shorter and in the same manner, is at 6.30. Long marks the end of line 26 and lines 27 and 28 as corrupt, their exact sense uncertain. In line 29 Leopold prints φελώνῃ, a cloak (Latin paenula), where the GLAUx parse reads τελώνῃ, a tax collector, as Long's text did: he translates 'the toll-collector at Tusculum who asked his pardon'. The page follows Leopold, and Long's version of this line does not match the Greek shown. With φελώνῃ the participle παραιτουμένῳ, 'apologizing', which agrees with it, does not construe; the glosses translate the words one by one."
- id: n.med.1.17.gods
  attach: med.1.17.1.3
  kind: editorial
  status: draft
  leans_on: "Long (1862), translation and notes on 1.17"
  text: "The last section of book 1 credits the gods with what the earlier sections credit to people: good relatives and teachers, and also things that came by chance, such as that his mother lived with him in her last years, that he never lacked money to help someone, that he found good tutors for his children, and that he was given remedies in dreams, at Caieta among other places. It ends with his thanks that, when he wanted philosophy, he did not fall in with a sophist, or sit down to writing, to the analysis of syllogisms, or to the study of the heavens; Long takes the writing to be the writing of histories. The closing phrase, that all these things need the help of gods and of fortune, is printed in quotation marks in the Perseus text."
- id: n.med.greek
  attach: med.1.1.1
  kind: editorial
  status: draft
  text: "Marcus Aurelius was a Roman emperor whose first language was Latin, but he wrote these notes to himself in Greek, the language of philosophy in his time. The title in the manuscripts, Τὰ εἰς ἑαυτόν, means 'the things to himself'. 'Meditations' is a later title."
- id: n.med.quadi
  attach: med.1.17.24
  kind: editorial
  status: draft
  leans_on: "Long (1862), introduction and note on the end of book 1; Casaubon (1634), heading before Greek 2.1"
  text: "Book 1 ends with a note of place, Τὰ ἐν Κουάδοις πρὸς τῷ Γρανούᾳ, 'the things among the Quadi, on the Granua'. The Quadi lived north of the Danube, where Marcus fought them in the 170s; Long dates a great victory over them to AD 174. Long takes the Granua to be 'probably the river Graan, which flows into the Danube', the river now called the Hron, in Slovakia. Long reads the note as the close of book 1 and takes it, with some caution ('if we may trust the note'), as a sign that the book was written on campaign. Casaubon prints it as a heading over the sections that follow, Greek 2.1 to 2.3, which in his division still belong to his first book. A similar note, about Carnuntum, stands at the end of book 2."
- id: n.med.synergia
  attach: med.2.1.7.4
  kind: editorial
  status: draft
  text: "συνεργία, 'working together', states the Stoic view of human society: people are made for one another as the parts of one body are. The image of feet, hands, eyelids and teeth makes the wrongdoer a fellow part rather than an opponent."
- id: n.med.casaubon
  attach: med.2.1.3
  kind: editorial
  status: draft
  text: "Casaubon's version of 1634, the first in English, expands freely: where the Greek says only that the good is καλόν, 'beautiful', he writes that it only is to be desired. Long's version of 1862 keeps closer to the words."
- id: n.med.2.2.three-parts
  attach: med.2.2.1
  kind: editorial
  status: draft
  leans_on: LSJ s.vv. σαρκίον, πνευμάτιον, ἡγεμονικός; Meditations 12.3
  text: "Marcus divides the self into three parts. σαρκία, 'bits of flesh', is a diminutive of σάρξ, flesh. πνευμάτιον, 'a little breath', is a diminutive of πνεῦμα, the breath or vital spirit that the Stoics held to run through the body. τὸ ἡγεμονικόν, 'the ruling part', is the Stoic term for the commanding faculty of the soul, the part that judges impressions and assents to them or not. The first two are named with diminutives and then dismissed; the third is not, and the rest of the section is addressed to it. The same three return in 12.3 as σωμάτιον, πνευμάτιον and νοῦς."
- id: n.med.2.2.books
  attach: med.2.2.2
  kind: editorial
  status: draft
  text: "Before this line the Perseus file carries the words ἄφες τὰ βιβλία· μηκέτι σπῶ. οὐ δέδοται, ἀλλ’ ὡς ἤδη ἀποθνῄσκων, 'let the books go; be pulled about no longer; it is not granted; but as one already dying'. Leopold's edition marks them as deleted, the GLAUx parse leaves them out, and this page follows that text, so they are not printed here. Long and Casaubon both translate them ('Throw away thy books'), which is why their versions of 2.2 are longer than the Greek shown. Section 2.3 ends with a similar instruction about books; one possible reason to doubt the words here is that they repeat it, but the Perseus file does not record the editor's grounds."
- id: n.med.2.4.time
  attach: med.2.4.2
  kind: editorial
  status: draft
  leans_on: LSJ s.vv. προθεσμία, ἀπαιθριάζω
  text: "Two images of time carry this section. A προθεσμία, glossed 'set term', is an appointed day; in law it is the time limit within which an action must be brought. Marcus says the gods have given him such days and he has let them pass. The ὅρος περιγεγραμμένος is a limit 'drawn around' him, a boundary line. ἀπαιθριάσαι, 'to clear the sky', describes clearing weather; Long expands it as 'clearing away the clouds from thy mind'. The section ends with οἰχήσεται, 'it will be gone', said of the time. The Perseus file also carries οἰχήσῃ, 'you will be gone', marked as deleted by the editor, so the line breaks after the first verb; Long's 'it will go and thou wilt go' translates both."
- id: n.med.2.11.leaving
  attach: med.2.11.1
  kind: editorial
  status: draft
  leans_on: Long 1862, note on 2.11
  text: "The section argues in two branches. If gods exist, leaving human life is nothing to fear, since they would not involve a person in evil. If they do not exist, or do not care, Marcus asks what point there is in living in a world empty of them. He then asserts that they exist and care, and that they put real evils within each person's power to avoid. What remains outside that power, such as death and life, fame and obscurity, pain and pleasure, wealth and poverty, falls equally to good and bad people, and he concludes that it is therefore neither good nor bad. The opening words, ὡς ἤδη δυνατοῦ ὄντος ἐξιέναι τοῦ βίου, can mean 'since it is possible that you leave life now' or 'since it is in your power to leave'. Long translates the first and gives the second in a note; the Greek allows both."
- id: n.med.2.12.disposed
  attach: med.2.12.9
  kind: editorial
  status: draft
  text: "The section ends with a question in three parts: how a human touches god, by what part of himself, and how that part is disposed when it does. Between ὅταν πῶς and διακέηται the Perseus file carries ἔχῃ, marked as deleted; both verbs can mean 'is in a certain state', and the deleted one may be a variant of the other. The line is broken where it stood. Casaubon's 'when it is said to be diffused' does not match διακέηται, 'is disposed'; it would fit a form of διαχέω, 'pour out, diffuse', which suggests his text read differently here. That is an inference from his English, not a reading Weft has checked."
- id: n.med.2.13.daimon
  attach: med.2.13.2.11
  kind: editorial
  status: draft
  leans_on: Long 1862, note on 2.13
  text: "δαίμων here is the divine part within each person, which Marcus elsewhere also calls mind and the ruling part. To serve it, he says, is to keep it clear of passion, of randomness and of discontent with what comes from gods and humans. The gloss keeps 'daimon' rather than 'genius' or 'spirit' because the same word sits inside κακοδαιμονέω in 2.8, 'to have a bad daimon', the ordinary Greek for being unhappy, and returns in 2.17. The quoted phrase τὰ νέρθεν γᾶς, 'the things beneath the earth', is identified by Long as Pindar, quoted in Plato's Theaetetus; the form γᾶς for γῆς is the poet's, not Marcus's."
- id: n.med.2.14.present
  attach: med.2.14.10
  kind: editorial
  status: draft
  leans_on: LSJ s.vv. ἀκαριαῖος, ἀκαρής; Long 1862, note on 2.14
  text: "The argument of 2.14 rests on the premise stated in this line: a person has only the present, so the present is the only thing a person can lose. Two consequences are drawn from it. First, no one loses a life other than the one being lived now, so the longest and the shortest life lose the same amount at death, a moment; ἀκαριαῖον, 'momentary', is related to ἀκαρής, 'too small to be cut'. Second, since things recur in the same forms, seeing them for a hundred years, two hundred or without limit makes no difference. Long's version of one clause, 'though that which perish is not the same', does not match the Greek printed here, which says that what is lost is also equal; Long marks the passage and refers to Gataker, so his text or his reading of it probably differed."
- id: n.med.2.15.monimus
  attach: med.2.15.2.8
  kind: editorial
  status: draft
  leans_on: Diogenes Laertius 6.82-83
  text: "Monimus of Syracuse was a Cynic philosopher of the 4th century BC, described by Diogenes Laertius as a follower of Diogenes and Crates. Diogenes Laertius reports that he called everything τῦφος, 'smoke' or 'vanity'. Marcus does not quote the saying; he only says that what was said to or about Monimus is clear, and that it is useful if its palatable part is taken only as far as it is true. The link to the saying in Diogenes Laertius is the usual explanation, not something the text states."
- id: n.med.2.17.philosophy
  attach: med.2.17.4
  kind: editorial
  status: draft
  leans_on: LSJ s.vv. παραπέμπω, ῥόμβος
  text: "The section moves from a list to a question. The list gives each part of human life one predicate: time a point, substance flowing, perception dim, the body's compound easily rotting, the soul a ῥόμβος (something that spins, such as a top), fortune hard to read, fame without judgment, life a war and a stranger's stay abroad. The question is what can παραπέμψαι, 'escort' a person, a verb used of seeing a traveler on the way. The answer is philosophy, described here as a practice rather than a doctrine: keeping the daimon within unharmed and above pleasure and pain, acting with a purpose and without pretense, accepting what happens, and awaiting death as the loosing of the elements a living thing is made of. The last argument is from nature: the elements change into one another without harm, and nothing that accords with nature is bad."
- id: n.med.carnuntum
  attach: med.2.17.11
  kind: editorial
  status: draft
  text: "Τὰ ἐν Καρνούντῳ, 'the things at Carnuntum', is a note of place like the one before 2.1 that names the Quadi and the Granua. Carnuntum was a Roman legionary base and town on the Danube, east of present-day Vienna, where Marcus had his headquarters during the wars of the 170s. Long prints the note after section 17 ('This in Carnuntum'); Casaubon gives it as 'Whilst I was at Carnuntum'. Whether it closes Book 2 or heads Book 3 is not settled; Weft keeps it where the Perseus file has it, at the end of 2.17."
