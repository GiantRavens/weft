sections:
- id: '1.1'
  title: Book 1, section 1
  lines:
  - Παρὰ τοῦ πάππου Οὐήρου τὸ καλόηθες καὶ ἀόργητον.
- id: '1.2'
  title: Book 1, section 2
  lines:
  - Παρὰ τῆς δόξης καὶ μνήμης τῆς περὶ τοῦ γεννήσαντος τὸ αἰδῆμον καὶ ἀρρενικόν.
- id: '1.3'
  title: Book 1, section 3
  lines:
  - Παρὰ τῆς μητρὸς τὸ θεοσεβὲς καὶ μεταδοτικὸν καὶ ἀφεκτικὸν οὐ μόνον τοῦ κακοποιεῖν, ἀλλὰ καὶ τοῦ ἐπὶ ἐννοίας γίνεσθαι τοιαύτης·
  - ἔτι δὲ τὸ λιτὸν κατὰ τὴν δίαιταν καὶ πόρρω τῆς πλουσιακῆς διαγωγῆς.
- id: '1.4'
  title: Book 1, section 4
  lines:
  - Παρὰ τοῦ προπάππου τὸ μὴ εἰς δημοσίας διατριβὰς φοιτῆσαι καὶ τὸ ἀγαθοῖς διδασκάλοις κατ’ οἶκον χρήσασθαι καὶ τὸ γνῶναι ὅτι εἰς τὰ τοιαῦτα δεῖ ἐκτενῶς ἀναλίσκειν.
- id: '1.5'
  title: Book 1, section 5
  lines:
  - Παρὰ τοῦ τροφέως τὸ μήτε Πρασιανὸς μήτε Βενετιανὸς μήτε Παλμουλάριος ἢ Σκουτάριος γενέσθαι·
  - καὶ τὸ φερέπονον καὶ ὀλιγοδεές·
  - καὶ τὸ αὐτουργικὸν καὶ ἀπολύπραγμον·
  - καὶ τὸ δυσπρόσδεκτον διαβολῆς.
- id: '1.6'
  title: Book 1, section 6
  lines:
  - Παρὰ Διογνήτου τὸ ἀκενόσπουδον·
  - καὶ τὸ ἀπιστητικὸν τοῖς ὑπὸ τῶν τερατευομένων καὶ γοήτων περὶ ἐπῳδῶν καὶ περὶ δαιμόνων ἀποπομπῆς καὶ τῶν τοιούτων λεγομένοις·
  - καὶ τὸ μὴ ὀρτυγοτροφεῖν μηδὲ περὶ τὰ τοιαῦτα ἐπτοῆσθαι·
  - καὶ τὸ ἀνέχεσθαι παρρησίας·
  - καὶ τὸ οἰκειωθῆναι φιλοσοφίᾳ καὶ τὸ ἀκοῦσαι πρῶτον μὲν Βακχείου, εἶτα Τανδάσιδος καὶ Μαρκιανοῦ·
  - καὶ τὸ γράψαι διαλόγους ἐν παιδί·
  - καὶ τὸ σκίμποδος καὶ δορᾶς ἐπιθυμῆσαι καὶ ὅσα τοιαῦτα τῆς Ἑλληνικῆς ἀγωγῆς ἐχόμενα.
- id: '1.7'
  title: Book 1, section 7
  lines:
  - Παρὰ Ῥουστίκου τὸ λαβεῖν φαντασίαν τοῦ χρῄζειν διορθώσεως καὶ θεραπείας τοῦ ἤθους·
  - καὶ τὸ μὴ ἐκτραπῆναι εἰς ζῆλον σοφιστικόν, μηδὲ τὸ συγγράφειν περὶ τῶν θεωρημάτων, ἢ προτρεπτικὰ λογάρια διαλέγεσθαι, ἢ φαντασιοπλήκτως τὸν ἀσκητικὸν ἢ τὸν ἐνεργητικὸν ἄνδρα ἐπιδείκνυσθαι·
  - καὶ τὸ ἀποστῆναι ῥητορικῆς καὶ ποιητικῆς καὶ ἀστειολογίας·
  - καὶ τὸ μὴ ἐν στολῇ κατ’ οἶκον περιπατεῖν μηδὲ τὰ τοιαῦτα ποιεῖν·
  - καὶ τὸ τὰ ἐπιστόλια ἀφελῶς γράφειν, οἷον τὸ ὑπʼ αὐτοῦ τούτου ἀπὸ Σινοέσσης τῇ μητρί μου γραφέν·
  - καὶ τὸ πρὸς τοὺς χαλεπήναντας καὶ πλημμελήσαντας εὐανακλήτως καὶ εὐδιαλλάκτως, ἐπειδὰν τάχιστα αὐτοὶ ἐπανελθεῖν ἐθελήσωσι, διακεῖσθαι·
  - καὶ τὸ ἀκριβῶς ἀναγινώσκειν καὶ μὴ ἀρκεῖσθαι περινοοῦντα ὁλοσχερῶς μηδὲ τοῖς περιλαλοῦσι ταχέως συγκατατίθεσθαι·
  - καὶ τὸ ἐντυχεῖν τοῖς Ἐπικτητείοις ὑπομνήμασιν, ὧν οἴκοθεν μετέδωκεν.
- id: '1.8'
  title: Book 1, section 8
  lines:
  - Παρὰ Ἀπολλωνίου τὸ ἐλεύθερον καὶ ἀναμφιβόλως ἀκύβευτον καὶ πρὸς μηδὲν ἄλλο ἀποβλέπειν μηδὲ ἐπ’ ὀλίγον ἢ πρὸς τὸν λόγον·
  - καὶ τὸ ἀεὶ ὅμοιον, ἐν ἀλγηδόσιν ὀξείαις, ἐν ἀποβολῇ τέκνου, ἐν μακραῖς νόσοις·
  - καὶ τὸ ἐπὶ παραδείγματος ζῶντος ἰδεῖν ἐναργῶς ὅτι δύναται ὁ αὐτὸς σφοδρότατος εἶναι καὶ ἀνειμένος·
  - καὶ τὸ ἐν ταῖς ἐξηγήσεσι μὴ δυσχεραντικόν·
  - καὶ τὸ ἰδεῖν ἄνθρωπον σαφῶς ἐλάχιστον τῶν ἑαυτοῦ καλῶν ἡγούμενον τὴν ἐμπειρίαν καὶ τὴν ἐντρέχειαν τὴν περὶ τὸ παραδιδόναι τὰ θεωρήματα·
  - καὶ τὸ μαθεῖν πῶς δεῖ λαμβάνειν τὰς δοκούσας χάριτας παρὰ φίλων, μήτε ἐξηττώμενον διὰ ταῦτα μήτε ἀναισθήτως παραπέμποντα.
- id: '1.9'
  title: Book 1, section 9
  lines:
  - Παρὰ Σέξτου τὸ εὐμενές·
  - καὶ τὸ παράδειγμα τοῦ οἴκου τοῦ πατρονομουμένου·
  - καὶ τὴν ἔννοιαν τοῦ κατὰ φύσιν ζῆν·
  - καὶ τὸ σεμνὸν ἀπλάστως·
  - καὶ τὸ στοχαστικὸν τῶν φίλων κηδεμονικῶς·
  - καὶ τὸ ἀνεκτικὸν τῶν ἰδιωτῶν καὶ τὸ ἀθεώρητον οἰομένων·
  - καὶ τὸ πρὸς πάντας εὐάρμοστον, ὥστε κολακείας μὲν πάσης προσηνεστέραν εἶναι τὴν ὁμιλίαν αὐτοῦ, αἰδεσιμώτατον δὲ αὐτοῖς ἐκείνοις παρ’ αὐτὸν ἐκεῖνον τὸν καιρὸν εἶναι·
  - καὶ τὸ καταληπτικῶς καὶ ὁδῷ ἐξευρετικόν τε καὶ τακτικὸν τῶν εἰς βίον ἀναγκαίων δογμάτων·
  - καὶ τὸ μηδὲ ἔμφασίν ποτε ὀργῆς ἢ ἄλλου τινὸς πάθους παρασχεῖν, ἀλλὰ ἅμα μὲν ἀπαθέστατον εἶναι, ἅμα δὲ φιλοστοργότατον·
  - καὶ τὸ εὔφημον ἀψοφητὶ καὶ τὸ πολυμαθὲς ἀνεπιφάντως.
- id: '1.10'
  title: Book 1, section 10
  lines:
  - Παρὰ Ἀλεξάνδρου τοῦ γραμματικοῦ τὸ ἀνεπίπληκτον καὶ τὸ μὴ ὀνειδιστικῶς ἐπιλαμβάνεσθαι τῶν βάρβαρον ἢ σόλοικόν τι ἢ ἀπηχὲς προενεγκαμένων, ἀλλ’ ἐπιδεξίως αὐτὸ μόνον ἐκεῖνο ὃ ἔδει εἰρῆσθαι προφέρεσθαι ἐν τρόπῳ ἀποκρίσεως ἢ συνεπιμαρτυρήσεως ἢ συνδιαλήψεως περὶ αὐτοῦ τοῦ πράγματος,
  - οὐχὶ περὶ τοῦ ῥήματος, ἢ δι’ ἑτέρας τινὸς τοιαύτης ἐμμελοῦς παρυπομνήσεως.
- id: '1.11'
  title: Book 1, section 11
  lines:
  - Παρὰ Φρόντωνος τὸ ἐπιστῆσαι οἵα ἡ τυραννικὴ βασκανία καὶ ποικιλία καὶ ὑπόκρισις, καὶ ὅτι ὡς ἐπίπαν οἱ καλούμενοι οὗτοι παρ’ ἡμῖν εὐπατρίδαι ἀστοργότεροί πως εἰσί.
- id: '1.12'
  title: Book 1, section 12
  lines:
  - Παρὰ Ἀλεξάνδρου τοῦ Πλατωνικοῦ τὸ μὴ πολλάκις μηδὲ χωρὶς ἀνάγκης λέγειν πρός τινα ἢ ἐν ἐπιστολῇ γράφειν ὅτι ἄσχολός εἰμι, μηδὲ διὰ τούτου τοῦ τρόπου συνεχῶς παραιτεῖσθαι τὰ κατὰ τὰς πρὸς τοὺς συμβιοῦντας σχέσεις καθήκοντα, προβαλλόμενον τὰ περιεστῶτα πράγματα.
- id: '1.13'
  title: Book 1, section 13
  lines:
  - Παρὰ Κατούλου τὸ μὴ ὀλιγώρως ἔχειν φίλου αἰτιωμένου τι, κἂν τύχῃ ἀλόγως αἰτιώμενος, ἀλλὰ πειρᾶσθαι
  - ἀποκαθιστάναι ἐπὶ τὸ σύνηθες·
  - καὶ τὸ περὶ τῶν διδασκάλων ἐκθύμως εὔφημον, οἷα τὰ περὶ Δομιτίου καὶ Ἀθηνοδότου ἀπομνημονευόμενα·
  - καὶ τὸ περὶ τὰ τέκνα ἀληθινῶς ἀγαπητικόν.
- id: '1.14'
  title: Book 1, section 14
  lines:
  - Παρὰ τοῦ ἀδελφοῦ μου Σεουήρου τὸ φιλοίκειον καὶ φιλάληθες καὶ φιλοδίκαιον·
  - καὶ τὸ δι’ αὐτοῦ γνῶναι Θρασέαν, Ἑλβίδιον, Κάτωνα, Δίωνα, Βροῦτον, καὶ φαντασίαν λαβεῖν πολιτείας ἰσονόμου, κατ’ ἰσότητα καὶ ἰσηγορίαν διοικουμένης, καὶ βασιλείας τιμώσης πάντων μάλιστα τὴν ἐλευθερίαν τῶν ἀρχομένων·
  - tokens:
    - {t: "καὶ"}
    - {t: "ἔτι"}
    - {t: "παρὰ"}
    - {t: "τοῦ"}
    - {t: "αὐτοῦ"}
    - {t: "τὸ"}
    - {t: "ὁμαλὲς"}
    - {t: "καὶ"}
    - {t: "ὁμότονον"}
    - {t: "ἐν"}
    - {t: "τῇ"}
    - {t: "τιμῇ"}
    - {t: "τῆς", p: "·"}
  - καὶ τὸ εὐποιητικὸν καὶ τὸ εὐμετάδοτον ἐκτενῶς καὶ τὸ εὔελπι καὶ τὸ πιστευτικὸν περὶ τοῦ ὑπὸ τῶν φίλων φιλεῖσθαι·
  - καὶ τὸ ἀνεπίκρυπτον πρὸς τοὺς καταγνώσεως ὑπ’ αὐτοῦ τυγχάνοντας·
  - καὶ τὸ μὴ δεῖσθαι στοχασμοῦ τοὺς φίλους αὐτοῦ περὶ τοῦ τί θέλει ἢ τί οὐ θέλει, ἀλλὰ δῆλον εἶναι.
- id: '1.15'
  title: Book 1, section 15
  lines:
  - Παρὰ Μαξίμου τὸ κρατεῖν ἑαυτοῦ καὶ κατὰ μηδὲν περίφορον εἶναι·
  - καὶ τὸ εὔθυμον ἔν τε ταῖς ἄλλαις περιστάσεσι καὶ ἐν ταῖς νόσοις·
  - καὶ τὸ εὔκρατον τοῦ ἤθους καὶ μειλίχιον καὶ γεραρόν·
  - καὶ τὸ οὐ σχετλίως κατεργαστικὸν τῶν προκειμένων·
  - καὶ τὸ πάντας αὐτῷ πιστεύειν περὶ ὧν λέγοι ὅτι οὕτως φρονεῖ, καὶ περὶ ὧν πράττοι ὅτι οὐ κακῶς πράττει.
  - καὶ τὸ ἀθαύμαστον καὶ ἀνέκπληκτον καὶ μηδαμοῦ ἐπειγόμενον ἢ ὀκνοῦν ἢ ἀμηχανοῦν ἢ κατηφὲς ἢ προσσεσηρός, ἢ πάλιν θυμούμενον ἢ ὑφορώμενον·
  - καὶ τὸ εὐεργετικὸν καὶ τὸ συγγνωμονικὸν καὶ τὸ ἀψευδές·
  - καὶ τὸ ἀδιαστρόφου μᾶλλον ἢ διορθουμένου φαντασίαν παρέχειν·
  - καὶ ὅτι οὔτε ᾠήθη ἄν ποτέ τις ὑπερορᾶσθαι ὑπ’ αὐτοῦ οὔτε ὑπέμεινεν ἂν κρείττονα αὐτοῦ αὑτὸν ὑπολαβεῖν·
  - καὶ τὸ εὐχαριεντίζεσθαι.
- id: '1.16'
  title: Book 1, section 16
  lines:
  - Παρὰ τοῦ πατρὸς τὸ ἥμερον καὶ μενετικὸν ἀσαλεύτως ἐπὶ τῶν ἐξητασμένως κριθέντων·
  - καὶ τὸ ἀκενόδοξον περὶ τὰς δοκούσας τιμάς·
  - καὶ τὸ φιλόπονον καὶ ἐνδελεχές·
  - καὶ τὸ ἀκουστικὸν τῶν ἐχόντων τι κοινωφελὲς εἰσφέρειν·
  - καὶ τὸ ἀπαρατρέπτως τοῦ κατ’ ἀξίαν ἀπονεμητικὸν ἑκάστῳ·
  - καὶ τὸ ἔμπειρον ποῦ μὲν χρεία ἐντάσεως, ποῦ δὲ ἀνέσεως·
  - καὶ τὸ παῦσαι τὰ περὶ τοὺς ἔρωτας τῶν· μειρακίων·
  - καὶ ἡ κοινονοημοσύνη καὶ τὸ ἐφεῖσθαι τοῖς φίλοις μήτε συνδειπνεῖν αὐτῷ πάντως μήτε συναποδημεῖν ἐπάναγκες, ἀεὶ δὲ ὅμοιον αὐτὸν καταλαμβάνεσθαι ὑπὸ τῶν διὰ χρείας τινὰς ἀπολειφθέντων·
  - καὶ τὸ ζητητικὸν ἀκριβῶς ἐν τοῖς συμβουλίοις καὶ ἐπίμονον, ἀλλ’ οὐ τὸ προαπέστη τῆς ἐρεύνης, ἀρκεσθεὶς ταῖς προχείροις φαντασίαις·
  - καὶ τὸ διατηρητικὸν τῶν φίλων καὶ μηδαμοῦ ἁψίκορον μηδὲ ἐπιμανές·
  - καὶ τὸ αὔταρκες ἐν παντὶ καὶ τὸ φαιδρόν·
  - καὶ τὸ πόρρωθεν προνοητικὸν καὶ τῶν ἐλαχίστων προδιοικητικὸν ἀτραγῴδως·
  - καὶ τὸ τὰς ἐπιβοήσεις καὶ πᾶσαν κολακείαν ἐπ’ αὐτοῦ συσταλῆναν καὶ τὸ φυλακτικὸν ἀεὶ τῶν ἀναγκαίων τῇ ἀρχῇ καὶ ταμιευτικὸν τῆς χορηγίας καὶ ὑπομενετικὸν τῆς ἐπὶ τῶν τοιούτων τινῶν καταιτιάσεως·
  - καὶ τὸ μήτε περὶ θεοὺς δεισίδαιμον μήτε περὶ ἀνθρώπους δημοκοπικὸν ἢ ἀρεσκευτικὸν ἢ ὀχλοχαρές, ἀλλὰ νῆφον ἐν πᾶσι καὶ βέβαιον καὶ μηδαμοῦ ἀπειρόκαλον μηδὲ καινοτόμον·
  - καὶ τὸ τοῖς εἰς εὐμάρειαν βίου φέρουσί τι, ὧν ἡ τύχη παρεῖχε δαψίλειαν, χρηστικὸν ἀτύφως ἅμα καὶ ἀπροφασίστως, ὥστε παρόντων μὲν ἀνεπιτηδεύτως ἅπτεσθαι, ἀπόντων δὲ μὴ δεῖσθαι·
  - καὶ τὸ μηδὲ ἄν τινα εἰπεῖν μήτε ὅτι σοφιστὴς μήτε ὅτι οὐερνάκλος μήτε ὅτι σχολαστικός, ἀλλ’ ὅτι ἀνὴρ πέπειρος, τέλειος, ἀκολάκευτος, προεστάναι δυνάμενος καὶ τῶν ἑαυτοῦ καὶ ἄλλων.
  - πρὸς τούτοις δὲ καὶ τὸ τιμητικὸν τῶν ἀληθῶς φιλοσοφούντων, τοῖς δὲ ἄλλοις οὐκ ἐξονειδιστικὸν οὐδὲ μὴν εὐπαράγωγον ὑπ’ αὐτῶν·
  - ἔτι δὲ τὸ εὐόμιλον καὶ εὔχαρι οὐ κατακόρως·
  - καὶ τὸ τοῦ ἰδίου σώματος ἐπιμελητικὸν ἐμμέτρως, οὔτε ὡς ἄν τις φιλόζωος οὔτε πρὸς καλλωπισμὸν οὔτε μὴν ὀλιγώρως, ἀλλ’ ὥστε διὰ τὴν ἰδίαν προσοχὴν εἰς ὀλίγιστα ἰατρικῆς χρῄζειν ἢ φαρμάκων καὶ ἐπιθεμάτων ἐκτός·
  - μάλιστα δὲ τὸ παραχωρητικὸν ἀβασκάνως τοῖς δύναμίν τινα κεκτημένοις, οἷον τὴν φραστικὴν ἢ τὴν ἐξ ἱστορίας νόμων ἢ ἐθῶν ἢ ἄλλων τινῶν πραγμάτων, καὶ συσπουδαστικὸν αὐτοῖς, ἵνα ἕκαστοι κατὰ τὰ ἴδια προτερήματα εὐδοκιμῶσι·
  - πάντα δὲ κατὰ τὰ πάτρια πράσσων, οὐδὲ αὐτὸ τοῦτο ἐπιτηδεύων φαίνεσθαι, τὸ τὰ πάτρια φυλάσσειν.
  - ἔτι δὲ τὸ μὴ εὐμετακίνητον καὶ ῥιπταστικόν, ἀλλὰ καὶ τόποις καὶ πράγμασι τοῖς αὐτοῖς ἐνδιατριπτικόν·
  - καὶ τὸ μετὰ τοὺς παροξυσμοὺς τῆς κεφαλαλγίας νεαρὸν εὐθὺς καὶ ἀκμαῖον πρὸς τὰ συνήθη ἔργα·
  - καὶ τὸ μὴ εἶναι αὐτῷ πολλὰ τὰ ἀπόρρητα, ἀλλ’ ὀλίγιστα καὶ σπανιώτατα καὶ ταῦτα ὑπὲρ τῶν κοινῶν μόνων·
  - καὶ τὸ ἔμφρον καὶ μεμετρημένον ἔν τε θεωριῶν ἐπιτελέσει καὶ ἔργων κατασκευαῖς καὶ διανομαῖς καὶ τοῖς τοιούτοις, ὅ ἐστιν ἀνθρώπου πρὸς αὐτὸ τὸ δέον πραχθῆναι δεδορκότος, οὐ πρὸς τὴν ἐπὶ τοῖς πραχθεῖσιν εὐδοξίαν.
  - οὐκ ἀωρὶ λούστης, οὐχὶ φιλοικοδόμος, οὐ περὶ τὰς ἐδωδὰς ἐπινοητής, οὐ περὶ ἐσθήτων ὑφὰς καὶ χρόας, οὐ περὶ σωμάτων ὥρας.
  - ἡ ἀπὸ Λωρίου στολὴ ἀνάγουσα ἀπὸ τῆς κάτω ἐπαύλεως·
  - χιτὼν ἐν Λανουβίῳ τὰ πολλά·
  - τῷ φελώνῃ ἐν Τούσκλοις παραιτουμένῳ ὡς ἐχρήσατο καὶ πᾶς ὁ τοιοῦτος τρόπος.
  - οὐδὲν ἀπηνὲς οὐδὲ μὴν ἀδυσώπητον οὐδὲ λάβρον οὐδὲ ὥστ’ ἄν τινα εἰπεῖν ποτε· ἕως ἱδρῶτος·
  - ἀλλὰ πάντα διειλημμένα λελογίσθαι ὡς ἐπὶ σχολῆς, ἀταράχως, τεταγμένως, ἐρρωμένως, συμφώνως ἑαυτοῖς.
  - ἐφαρμόσειε δ’ ἂν αὐτῷ τὸ περὶ τοῦ Σωκράτους μνημονευόμενον, ὅτι καὶ ἀπέχεσθαι καὶ ἀπολαύειν ἐδύνατο τούτων, ὧν οἱ πολλοὶ πρός τε τὰς ἀποχὰς ἀσθενῶς καὶ πρὸς τὰς ἀπολαύσεις ἐνδοτικῶς ἔχουσι.
  - τὸ δὲ ἰσχύειν καὶ ἐγκαρτερεῖν καὶ ἐννήφειν ἑκατέρῳ ἀνδρός ἐστιν ἄρτιον καὶ ἀήττητον ψυχὴν ἔχοντος, οἷον ἐν τῇ νόσῳ τῇ Μαξίμου.
- id: '1.17'
  title: Book 1, section 17
  lines:
  - Παρὰ τῶν θεῶν τὸ ἀγαθοὺς πάππους, ἀγαθοὺς γονέας, ἀγαθὴν ἀδελφήν, ἀγαθοὺς διδασκάλους, ἀγαθοὺς οἰκείους, συγγενεῖς, φίλους σχεδὸν ἅπαντας ἔχειν·
  - καὶ ὅτι περὶ οὐδένα αὐτῶν προέπεσον πλημμελῆσαί τι, καίτοι διάθεσιν ἔχων τοιαύτην, ἀφ’ ἧς, εἰ ἔτυχε, κἂν ἔπραξά τι τοιοῦτο·
  - τῶν θεῶν δὲ εὐποιία τὸ μηδεμίαν συνδρομὴν πραγμάτων γενέσθαι, ἥτις ἔμελλέ με ἐλέγξειν.
  - καὶ τὸ μὴ ἐπὶ πλέον τραφῆναι παρὰ τῇ παλλακῇ τοῦ πάππου καὶ τὸ τὴν ὥραν διασῶσαι καὶ τὸ μὴ πρὸ ὥρας ἀνδρωθῆναι, ἀλλ’ ἔτι καὶ ἐπιλαβεῖν τοῦ χρόνου.
  - τὸ ἄρχοντι καὶ πατρὶ ὑποταχθῆναι, ὃς ἔμελλε πάντα τὸν τῦφον ἀφαιρήσειν μου καὶ εἰς ἔννοιαν ἄξειν τοῦ ὅτι δυνατόν ἐστιν ἐν αὐλῇ βιοῦντα μήτε δορυφορήσεων χρῄζειν μήτε ἐσθήτων σημειωδῶν μήτε λαμπάδων καὶ ἀνδριάντων τοιῶνδέ τινων καὶ τοῦ ὁμοίου κόμπου,
  - ἀλλʼ ἔξεστιν ἐγγυτάτω ἰδιώτου συστέλλειν ἑαυτὸν καὶ μὴ διὰ τοῦτο ταπεινότερον ἢ ῥᾳθυμότερον ἔχειν πρὸς τὰ ὑπὲρ τῶν κοινῶν ἡγεμονικῶς πραχθῆναι δέοντα.
  - τὸ ἀδελφοῦ τοιούτου τυχεῖν, δυναμένου μὲν διὰ ἤθους ἐπεγεῖραί με πρὸς ἐπιμέλειαν ἐμαυτοῦ, ἅμα δὲ καὶ τιμῇ καὶ στοργῇ εὐφραίνοντός με·
  - τὸ παιδία μοι ἀφυῆ μὴ γενέσθαι μηδὲ κατὰ τὸ σωμάτιον διάστροφα.
  - τὸ μὴ ἐπὶ πλέον με προκόψαι ἐν ῥητορικῇ καὶ ποιητικῇ καὶ τοῖς ἄλλοις ἐπιτηδεύμασιν, ἐν οἷς ἴσως ἂν κατεσχέθην, εἰ ᾐσθόμην ἐμαυτὸν εὐόδως προιόντα.
  - τὸ φθάσαι τοὺς τροφέας ἐν ἀξιώματι καταστῆσαι, οὗ δὴ ἐδόκουν μοι ἐπιθυμεῖν, καὶ μὴ ἀναβαλέσθαι ἐλπίδι τοῦ με, ἐπεὶ νέοι ἔτι ἦσαν, ὕστερον αὐτὸ πράξειν.
  - τὸ γνῶναι Ἀπολλώνιον, Ῥούστικον, Μάξιμον.
  - τὸ φαντασθῆναι περὶ τοῦ κατὰ φύσιν βίου ἐναργῶς καὶ πολλάκις οἷός τίς ἐστιν, ὥστε, ὅσον ἐπὶ τοῖς θεοῖς καὶ ταῖς ἐκεῖθεν διαδόσεσι καὶ συλλήψεσι καὶ ἐπιπνοίαις,
  - μηδὲν κωλύειν ἤδη κατὰ φύσιν ζῆν με, ἀπολείπεσθαι δὲ ἔτι τούτου παρὰ τὴν ἐμὴν αἰτίαν καὶ παρὰ τὸ μὴ διατηρεῖν τὰς ἐκ τῶν θεῶν ὑπομνήσεις καὶ μονονουχὶ διδασκαλίας·
  - τὸ ἀντισχεῖν μοι τὸ σῶμα ἐπὶ τοσοῦτον ἐν τοιούτῳ βίῳ·
  - τὸ μήτε Βενεδίκτης ἅψασθαι μήτε Θεοδότου, ἀλλὰ καὶ ὕστερον ἐν ἐρωτικοῖς πάθεσι γενόμενον ὑγιᾶναι·
  - τὸ χαλεπήναντα πολλάκις Ῥουστίκῳ μηδὲν πλέον πρᾶξαι, ἐφ’ ᾧ ἂν μετέγνων·
  - τὸ μέλλουσαν νέαν τελευτᾶν τὴν τεκοῦσαν ὅμως οἰκῆσαι μετ’ ἐμοῦ τὰ τελευταῖα ἔτη.
  - τὸ ὁσάκις ἐβουλήθην ἐπικουρῆσαί τινι πενομένῳ ἢ εἰς ἄλλο τι χρῄζοντι, μηδέποτε ἀκοῦσαί με, ὅτι οὐκ ἔστι μοι χρήματα, ὅθεν γένηται, καὶ τὸ αὐτῷ ἐμοὶ χρείαν ὁμοίαν, ὡς παρ’ ἑτέρου μεταλαβεῖν, μὴ συμπεσεῖν·
  - τὸ τὴν γυναῖκα τοιαύτην εἶναι, οὑτωσὶ μὲν πειθήνιον, οὕτω δὲ φιλόστοργον, οὕτω δὲ ἀφελῆ·
  - τὸ ἐπιτηδείων τροφέων εἰς τὰ παιδία εὐπορῆσαι.
  - τὸ δι’ ὀνειράτων βοηθήματα δοθῆναι ἄλλα τε καὶ ὡς μὴ πτύειν αἷμα καὶ μὴ ἰλιγγιᾶν, καὶ τούτου ἐν Καιήτῃ ὥσπερ χρήσῃ·
  - τὸ ὅπως ἐπεθύμησα φιλοσοφίας, μὴ ἐμπεσεῖν εἴς τινα σοφιστὴν μηδὲ ἀποκαθίσαι ἐπὶ τὸ συγγράφειν ἢ συλλογισμοὺς ἀναλύειν ἢ περὶ τὰ μετεωρολογικὰ καταγίνεσθαι.
  - πάντα γὰρ ταῦτα ʽθεῶν βοηθῶν καὶ τύχης δεῖται.ʼ
  - Τὰ ἐν Κουάδοις πρὸς τῷ Γρανούᾳ.
- id: '2.1'
  title: Book 2, section 1
  lines:
  - Ἕωθεν προλέγειν ἑαυτῷ· συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ, ἀκοινωνήτῳ·
  - πάντα ταῦτα συμβέβηκεν ἐκείνοις παρὰ τὴν ἄγνοιαν τῶν ἀγαθῶν καὶ κακῶν.
  - ἐγὼ δὲ τεθεωρηκὼς τὴν φύσιν τοῦ ἀγαθοῦ ὅτι καλόν, καὶ τοῦ κακοῦ ὅτι αἰσχρόν,
  - καὶ τὴν αὐτοῦ τοῦ ἁμαρτάνοντος φύσιν ὅτι μοι συγγενής, οὐχὶ αἵματος ἢ σπέρματος τοῦ αὐτοῦ, ἀλλὰ νοῦ καὶ θείας ἀπομοίρας μέτοχος,
  - οὔτε βλαβῆναι ὑπό τινος αὐτῶν δύναμαι· αἰσχρῷ γάρ με οὐδεὶς περιβαλεῖ·
  - οὔτε ὀργίζεσθαι τῷ συγγενεῖ δύναμαι οὔτε ἀπέχθεσθαι αὐτῷ.
  - γεγόναμεν γὰρ πρὸς συνεργίαν ὡς πόδες, ὡς χεῖρες, ὡς βλέφαρα, ὡς οἱ στοῖχοι τῶν ἄνω καὶ κάτω ὀδόντων.
  - τὸ οὖν ἀντιπράσσειν ἀλλήλοις παρὰ φύσιν· ἀντιπρακτικὸν δὲ τὸ ἀγανακτεῖν καὶ ἀποστρέφεσθαι.
- id: '2.2'
  title: Book 2, section 2
  lines:
  - Ὅ τί ποτε τοῦτό εἰμι, σαρκία ἐστὶ καὶ πνευμάτιον καὶ τὸ ἡγεμονικόν.
  - τῶν μὲν σαρκίων καταφρόνησον·
  - λύθρος καὶ ὀστάρια καὶ κροκύφαντος, ἐκ νεύρων, φλεβίων, ἀρτηριῶν πλεγμάτιον.
  - θέασαι δὲ καὶ τὸ πνεῦμα ὁποῖόν τί ἐστιν· ἄνεμος, οὐδὲ ἀεὶ τὸ αὐτό, ἀλλὰ πάσης ὥρας ἐξεμούμενον καὶ πάλιν ῥοφούμενον.
  - τρίτον οὖν ἐστι τὸ ἡγεμονικόν.
  - ὧδε ἐπινοήθητι· γέρων εἶ·
  - μηκέτι τοῦτο ἐάσῃς δουλεῦσαι, μηκέτι καθ’ ὁρμὴν ἀκοινώνητον νευροσπαστηθῆναι, μηκέτι τὸ εἱμαρμένον ἢ παρὸν δυσχερᾶναι ἢ μέλλον ὑπιδέσθαι.
- id: '2.3'
  title: Book 2, section 3
  lines:
  - Τὰ τῶν θεῶν προνοίας μεστά.
  - τὰ τῆς τύχης οὐκ ἄνευ φύσεως ἢ συγκλώσεως καὶ ἐπιπλοκῆς τῶν προνοίᾳ διοικουμένων.
  - πάντα ἐκεῖθεν ῥεῖ· πρόσεστι δὲ τὸ ἀναγκαῖον καὶ τὸ τῷ ὅλῳ κόσμῳ συμφέρον, οὗ μέρος εἶ.
  - παντὶ δὲ φύσεως μέρει ἀγαθόν, ὃ φέρει ἡ τοῦ ὅλου φύσις καὶ ὃ ἐκείνης ἐστὶ σωστικόν.
  - σῴζουσι δὲ κόσμον, ὥσπερ αἱ τῶν στοιχείων, οὕτως καὶ αἱ τῶν συγκριμάτων μεταβολαί.
  - ταῦτά σοι ἀρκείτω καὶ δόγματα ἔστω.
  - τὴν δὲ τῶν βιβλίων δίψαν ῥῖψον, ἵνα μὴ γογγύζων ἀποθάνῃς, ἀλλὰ ἵλεως ἀληθῶς καὶ ἀπὸ καρδίας εὐχάριστος τοῖς θεοῖς.
- id: '2.4'
  title: Book 2, section 4
  lines:
  - Μέμνησο ἐκ πόσου ταῦτα ἀναβάλλῃ καὶ ὁποσάκις προθεσμίας λαβὼν παρὰ τῶν θεῶν οὐ χρᾷ αὐταῖς.
  - δεῖ δὲ ἤδη ποτὲ αἰσθέσθαι τίνος κόσμου μέρος εἶ καὶ τίνος διοικοῦντος τὸν κόσμον ἀπόρροια ὑπέστης καὶ ὅτι ὅρος ἐστί σοι περιγεγραμμένος τοῦ χρόνου,
  - ᾧ ἐὰν εἰς τὸ ἀπαιθριάσαι μὴ χρήσῃ, οἰχήσεται
  - καὶ αὖθις οὐκ ἐξέσται.
- id: '2.5'
  title: Book 2, section 5
  lines:
  - Πάσης ὥρας φρόντιζε στιβαρῶς ὡς Ῥωμαῖος καὶ ἄρρην τὸ ἐν χερσὶ μετὰ τῆς ἀκριβοῦς καὶ ἀπλάστου σεμνότητος καὶ φιλοστοργίας καὶ ἐλευθερίας καὶ δικαιότητος πράσσειν καὶ σχολὴν σαυτῷ ἀπὸ πασῶν τῶν ἄλλων φαντασιῶν πορίζειν.
  - ποριεῖς δέ, ἂν ὡς ἐσχάτην τοῦ βίου ἑκάστην πρᾶξιν ἐνεργῇς,
  - ἀπηλλαγμένος πάσης εἰκαιότητος καὶ ἐμπαθοῦς ἀποστροφῆς ἀπὸ τοῦ αἱροῦντος λόγου καὶ ὑποκρίσεως καὶ φιλαυτίας καὶ δυσαρεστήσεως πρὸς τὰ συμμεμοιραμένα.
  - ὁρᾷς πῶς ὀλίγα ἐστίν, ὧν κρατήσας τις δύναται εὔρουν καὶ θεουδῆ βιῶσαι βίον·
  - καὶ γὰρ οἱ θεοὶ πλέον οὐδὲν ἀπαιτήσουσι παρὰ τοῦ ταῦτα φυλάσσοντος.
- id: '2.6'
  title: Book 2, section 6
  lines:
  - Ὕβριζε, ὕβριζε σεαυτήν, ὦ ψυχή·
  - τοῦ δὲ τιμῆσαι σεαυτὴν οὐκέτι καιρὸν ἕξεις·
  - εἷς γὰρ ὁ βίος ἑκάστῳ, οὗτος δέ σοι σχεδὸν διήνυσται,
  - μὴ αἰδουμένῃ σεαυτήν, ἀλλ’ ἐν ταῖς ἄλλων ψυχαῖς τιθεμένῃ τὴν σὴν εὐμοιρίαν.
- id: '2.7'
  title: Book 2, section 7
  lines:
  - Περισπᾷ τί σε τὰ ἔξωθεν ἐμπίπτοντα;
  - καὶ σχολὴν πάρεχε σεαυτῷ τοῦ προσμανθάνειν ἀγαθόν τι καὶ παῦσαι ῥεμβόμενος.
  - ἤδη δὲ καὶ τὴν ἑτέραν περιφορὰν φυλακτέον·
  - ληροῦσι γὰρ καὶ διὰ πράξεων οἱ κεκμηκότες τῷ βίῳ καὶ μὴ ἔχοντες σκοπόν, ἐφ’ ὃν πᾶσαν ὁρμὴν καὶ καθάπαξ φαντασίαν ἀπευθύνουσιν.
- id: '2.8'
  title: Book 2, section 8
  lines:
  - Παρὰ μὲν τὸ μὴ ἐφιστάνειν, τί ἐν τῇ ἄλλου ψυχῇ γίνεται, οὐ ῥᾳδίως τις ὤφθη κακοδαιμονῶν·
  - τοὺς δὲ τοῖς τῆς ἰδίας ψυχῆς κινήμασι μὴ παρακολουθοῦντας ἀνάγκη κακοδαιμονεῖν.
- id: '2.9'
  title: Book 2, section 9
  lines:
  - Τούτων ἀεὶ δεῖ μεμνῆσθαι,
  - τίς ἡ τῶν ὅλων φύσις καὶ τίς ἡ ἐμὴ καὶ πῶς αὕτη πρὸς ἐκείνην ἔχουσα καὶ ὁποῖόν τι μέρος ὁποίου τοῦ ὅλου οὖσα καὶ ὅτι οὐδεὶς ὁ κωλύων τὰ ἀκόλουθα τῇ φύσει, ἧς μέρος εἶ, πράσσειν τε ἀεὶ καὶ λέγειν.
- id: '2.10'
  title: Book 2, section 10
  lines:
  - Φιλοσόφως ὁ Θεόφραστος ἐν τῇ συγκρίσει τῶν ἁμαρτημάτων, ὡς ἄν τις κοινότερον τὰ τοιαῦτα συγκρίνειε,
  - φησὶ βαρύτερα εἶναι τὰ κατ’ ἐπιθυμίαν πλημμελούμενα τῶν κατὰ θυμόν.
  - ὁ γὰρ θυμούμενος μετά τινος λύπης καὶ λεληθυίας συστολῆς φαίνεται τὸν λόγον ἀποστρεφόμενος·
  - ὁ δὲ κατ’ ἐπιθυμίαν ἁμαρτάνων, ὑφ’ ἡδονῆς ἡττώμενος ἀκολαστότερός πως φαίνεται καὶ θηλύτερος ἐν ταῖς ἁμαρτίαις.
  - ὀρθῶς οὖν καὶ φιλοσοφίας ἀξίως ἔφη μείζονος ἐγκλήματος ἔχεσθαι τὸ μεθ’ ἡδονῆς ἁμαρτανόμενον ἤπερ τὸ μετὰ λύπης·
  - ὅλως τε ὁ μὲν προηδικημένῳ μᾶλλον ἔοικε καὶ διὰ λύπης ἠναγκασμένῳ θυμωθῆναι·
  - ὁ δὲ αὐτόθεν πρὸς τὸ ἀδικεῖν ὥρμηται, φερόμενος ἐπὶ τὸ πρᾶξαί τι κατ’ ἐπιθυμίαν.
- id: '2.11'
  title: Book 2, section 11
  lines:
  - Ὡς ἤδη δυνατοῦ ὄντος ἐξιέναι τοῦ βίου, οὕτως ἕκαστα ποιεῖν καὶ λέγειν καὶ διανοεῖσθαι.
  - τὸ δὲ ἐξ ἀνθρώπων ἀπελθεῖν, εἰ μὲν θεοὶ εἰσίν, οὐδὲν δεινόν· κακῷ γάρ σε οὐκ ἂν περιβάλοιεν·
  - εἰ δὲ ἤτοι οὐκ εἰσὶν ἢ οὐ μέλει αὐτοῖς τῶν ἀνθρωπείων, τί μοι ζῆν ἐν κόσμῳ κενῷ θεῶν ἢ προνοίας κενῷ;
  - ἀλλὰ καὶ εἰσὶ καὶ μέλει αὐτοῖς τῶν ἀνθρωπείων καὶ τοῖς μὲν κατ’ ἀλήθειαν κακοῖς ἵνα μὴ περιπίπτῃ ὁ ἄνθρωπος, ἐπ’ αὐτῷ τὸ πᾶν ἔθεντο·
  - τῶν δὲ λοιπῶν εἴ τι κακὸν ἦν, καὶ τοῦτο ἂν προείδοντο, ἵνα ἐπὶ παντὶ ᾖ τὸ μὴ περιπίπτειν αὐτῷ.
  - ὃ δὲ χείρω μὴ ποιεῖ ἄνθρωπον, πῶς ἂν τοῦτο βίον ἀνθρώπου χείρω ποιήσειεν;
  - οὔτε δὲ κατ’ ἄγνοιαν οὔτε εἰδυῖα μέν, μὴ δυναμένη δὲ προφυλάξασθαι ἢ διορθώσασθαι ταῦτα ἡ τῶν ὅλων φύσις παρεῖδεν ἄν,
  - οὔτ’ ἂν τηλικοῦτον ἥμαρτεν ἤτοι παρ’ ἀδυναμίαν ἢ παρ’ ἀτεχνίαν,
  - ἵνα τὰ ἀγαθὰ καὶ τὰ κακὰ ἐπίσης τοῖς τε ἀγαθοῖς ἀνθρώποις καὶ τοῖς κακοῖς πεφυρμένως συμβαίνῃ.
  - θάνατος δέ γε καὶ ζωή, δόξα καὶ ἀδοξία, πόνος καὶ ἡδονή, πλοῦτος καὶ πενία,
  - πάντα ταῦτα ἐπίσης συμβαίνει ἀνθρώπων τοῖς τε ἀγαθοῖς καὶ τοῖς κακοῖς, οὔτε καλὰ ὄντα οὔτε αἰσχρά.
  - οὔτ’ ἄρ’ ἀγαθὰ οὔτε κακά ἐστι.
- id: '2.12'
  title: Book 2, section 12
  lines:
  - Πῶς πάντα ταχέως ἐναφανίζεται, τῷ μὲν κόσμῳ αὐτὰ τὰ σώματα, τῷ δὲ αἰῶνι αἱ μνῆμαι αὐτῶν.
  - οἶά ἐστι τὰ αἰσθητὰ πάντα καὶ μάλιστα τὰ ἡδονῇ δελεάζοντα ἢ τῷ πόνῳ φοβοῦντα ἢ τῷ τύφῳ διαβεβοημένα·
  - πῶς εὐτελῆ καὶ εὐκαταφρόνητα καὶ ῥυπαρὰ καὶ εὔφθαρτα καὶ νεκρά, νοερᾶς δυνάμεως ἐφιστάναι.
  - τί εἰσιν οὗτοι, ὧν αἱ ὑπολήψεις καὶ αἱ φωναὶ τὴν εὐδοξίαν παρέχουσι.
  - τί ἐστι τὸ ἀποθανεῖν, καὶ ὅτι, ἐάν τις αὐτὸ μόνον ἴδῃ καὶ τῷ μερισμῷ τῆς ἐννοίας διαλύσῃ τὰ ἐμφανταζόμενα αὐτῷ,
  - οὐκέτι ἄλλο τι ὑπολήψεται αὐτὸ εἶναι ἢ φύσεως ἔργον·
  - φύσεως δὲ ἔργον εἴ τις φοβεῖται, παιδίον ἐστί·
  - τοῦτο μέντοι οὐ μόνον φύσεως ἔργον ἐστίν, ἀλλὰ καὶ συμφέρον αὐτῇ.
  - πῶς ἅπτεται θεοῦ ἄνθρωπος καὶ κατὰ τί ἑαυτοῦ μέρος καὶ ὅταν πῶς
  - διακέηται τὸ τοῦ ἀνθρώπου τοῦτο μόριον.
- id: '2.13'
  title: Book 2, section 13
  lines:
  - Οὐδὲν ἀθλιώτερον τοῦ πάντα κύκλῳ ἐκπεριερχομένου καὶ ʽτὰ νέρθεν γᾶς (φησὶν) ἐρευνῶντοςʼ καὶ τὰ ἐν ταῖς ψυχαῖς τῶν πλησίον διὰ τεκμάρσεως ζητοῦντος,
  - μὴ αἰσθομένου δέ, ὅτι ἀρκεῖ πρὸς μόνῳ τῷ ἔνδον ἑαυτοῦ δαίμονι εἶναι καὶ τοῦτον γνησίως θεραπεύειν.
  - θεραπεία δὲ αὐτοῦ, καθαρὸν πάθους διατηρεῖν καὶ εἰκαιότητος καὶ δυσαρεστήσεως τῆς πρὸς τὰ ἐκ θεῶν καὶ ἀνθρώπων γινόμενα.
  - τὰ μὲν γὰρ ἐκ θεῶν αἰδέσιμα δι’ ἀρετήν·
  - τὰ δὲ ἐξ ἀνθρώπων φίλα διὰ συγγένειαν, ἔστι δὲ ὅτε καὶ τρόπον τινὰ ἐλεεινὰ δι’ ἄγνοιαν ἀγαθῶν καὶ κακῶν·
  - οὐκ ἐλάττων ἡ πήρωσις αὕτη τῆς στερισκούσης τοῦ διακρίνειν τὰ λευκὰ καὶ μέλανα.
- id: '2.14'
  title: Book 2, section 14
  lines:
  - Κἂν τρὶς χίλια ἔτη βιώσεσθαι μέλλῃς, κἂν τοσαυτάκις μύρια,
  - ὅμως μέμνησο ὅτι οὐδεὶς ἄλλον ἀποβάλλει βίον ἢ τοῦτον ὃν ζῇ, οὐδὲ ἄλλον ζῇ ἢ ὃν ἀποβάλλει.
  - εἰς ταὐτὸν οὖν καθίσταται τὸ μήκιστον τῷ βραχυτάτῳ.
  - τὸ γὰρ παρὸν πᾶσιν ἴσον καὶ τὸ ἀπολλύμενον οὖν ἴσον καὶ τὸ ἀποβαλλόμενον οὕτως ἀκαριαῖον ἀναφαίνεται.
  - οὔτε γὰρ τὸ παρῳχηκὸς οὔτε τὸ μέλλον ἀποβάλοι ἄν τις·
  - ὃ γὰρ οὐκ ἔχει, πῶς ἄν τις τοῦτο αὐτοῦ ἀφέλοιτο;
  - τούτων οὖν τῶν δύο δεῖ μεμνῆσθαι·
  - ἑνὸς μέν, ὅτι πάντα ἐξ ἀιδίου ὁμοειδῆ καὶ ἀνακυκλούμενα καὶ οὐδὲν διαφέρει, πότερον ἐν ἑκατὸν ἔτεσιν ἢ ἐν διακοσίοις ἢ ἐν τῷ ἀπείρῳ τὰ αὐτά τις ὄψεται·
  - ἑτέρου δέ, ὅτι καὶ ὁ πολυχρονιώτατος καὶ ὁ τάχιστα τεθνηξόμενος τὸ ἴσον ἀποβάλλει.
  - τὸ γὰρ παρόν ἐστι μόνον, οὗ στερίσκεσθαι μέλλει, εἴπερ γε ἔχει καὶ τοῦτο μόνον καὶ ὃ μὴ ἔχει τις οὐκ ἀποβάλλει.
- id: '2.15'
  title: Book 2, section 15
  lines:
  - Ὅτι πᾶν ὑπόληψις.
  - δῆλα μὲν γὰρ τὰ πρὸς τὸν Κυνικὸν Μόνιμον λεγόμενα·
  - δῆλον δὲ καὶ τὸ χρήσιμον τοῦ λεγομένου, ἐάν τις αὐτοῦ τὸ νόστιμον μέχρι τοῦ ἀληθοῦς δέχηται.
- id: '2.16'
  title: Book 2, section 16
  lines:
  - Ὑβρίζει ἑαυτὴν ἡ τοῦ ἀνθρώπου ψυχὴ μάλιστα μέν, ὅταν ἀπόστημα καὶ οἷον φῦμα τοῦ κόσμου, ὅσον ἐφ̓ ἑαυτῇ, γένηται·
  - τὸ γὰρ δυσχεραίνειν τινὶ τῶν γινομένων ἀπόστασίς ἐστι τῆς φύσεως, ἧς ἐν μέρει αἱ ἑκάστου τῶν λοιπῶν φύσεις περιέχονται.
  - ἔπειτα δέ, ὅταν ἄνθρωπόν τινα ἀποστραφῇ ἢ καὶ ἐναντία φέρηται ὡς βλάψουσα, οἷαί εἰσιν αἱ τῶν ὀργιζομένων.
  - τρίτον ὑβρίζει ἑαυτήν, ὅταν ἡσσᾶται ἡδονῆς ἢ πόνου.
  - τέταρτον, ὅταν ὑποκρίνηται καὶ ἐπιπλάστως καὶ ἀναλήθως τι ποιῇ ἢ λέγῃ.
  - πέμπτον, ὅταν πρᾶξίν τινα ἑαυτῆς καὶ ὁρμὴν ἐπ’ οὐδένα σκοπὸν ἀφιῇ, ἀλλ’ εἰκῇ καὶ ἀπαρακολουθήτως ὁτιοῦν ἐνεργῇ,
  - δέον καὶ τὰ μικρότατα κατὰ τὴν ἐπὶ τὸ τέλος ἀναφορὰν γίνεσθαι·
  - τέλος δὲ λογικῶν ζῴων τὸ ἕπεσθαι τῷ τῆς πόλεως καὶ πολιτείας τῆς πρεσβυτάτης λόγῳ καὶ θεσμῷ.
- id: '2.17'
  title: Book 2, section 17
  lines:
  - Τοῦ ἀνθρωπίνου βίου ὁ μὲν χρόνος στιγμή, ἡ δὲ οὐσία ῥέουσα, ἡ δὲ αἴσθησις ἀμυδρά, ἡ δὲ ὅλου τοῦ σώματος σύγκρισις εὔσηπτος,
  - ἡ δὲ ψυχὴ ῥόμβος, ἡ δὲ τύχη δυστέκμαρτον, ἡ δὲ φήμη ἄκριτον·
  - συνελόντι δὲ εἰπεῖν, πάντα τὰ μὲν τοῦ σώματος ποταμός, τὰ δὲ τῆς ψυχῆς ὄνειρος καὶ τῦφος, ὁ δὲ βίος πόλεμος καὶ ξένου ἐπιδημία, ἡ δὲ ὑστεροφημία λήθη.
  - τί οὖν τὸ παραπέμψαι δυνάμενον; ἓν καὶ μόνον φιλοσοφία·
  - τοῦτο δὲ ἐν τῷ τηρεῖν τὸν ἔνδον δαίμονα ἀνύβριστον καὶ ἀσινῆ, ἡδονῶν καὶ πόνων κρείσσονα,
  - μηδὲν εἰκῇ ποιοῦντα μηδὲ διεψευσμένως καὶ μεθ̓ ὑποκρίσεως, ἀνενδεῆ τοῦ ἄλλον ποιῆσαί τι ἢ μὴ ποιῆσαι·
  - ἔτι δὲ τὰ συμβαίνοντα καὶ ἀπονεμόμενα δεχόμενον ὡς ἐκεῖθέν ποθεν ἐρχόμενα, ὅθεν αὐτὸς ἦλθεν·
  - ἐπὶ πᾶσι δὲ τὸν θάνατον ἵλεῳ τῇ γνώμῃ περιμένοντα ὡς οὐδὲν ἄλλο ἢ λύσιν τῶν στοιχείων, ἐξ ὧν ἕκαστον ζῷον συγκρίνεται.
  - εἰ δὲ αὐτοῖς τοῖς στοιχείοις μηδὲν δεινὸν ἐν τῷ ἕκαστον διηνεκῶς εἰς ἕτερον μεταβάλλειν, διὰ τί ὑπίδηταί τις τὴν πάντων μεταβολὴν καὶ διάλυσιν;
  - κατὰ φύσιν γάρ· οὐδὲν δὲ κακὸν κατὰ φύσιν.
  - Τὰ ἐν Καρνούντῳ.
