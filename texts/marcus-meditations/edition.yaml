sections:
- id: '2.1'
  title: Book 2, section 1
  lines:
  - Ἕωθεν προλέγειν ἑαυτῷ· συντεύξομαι περιέργῳ, ἀχαρίστῳ, ὑβριστῇ, δολερῷ, βασκάνῳ, ἀκοινωνήτῳ·
  - πάντα ταῦτα συμβέβηκεν ἐκείνοις παρὰ τὴν ἄγνοιαν τῶν ἀγαθῶν καὶ κακῶν.
  - ἐγὼ δὲ τεθεωρηκὼς τὴν φύσιν τοῦ ἀγαθοῦ ὅτι καλόν, καὶ τοῦ κακοῦ ὅτι αἰσχρόν,
  - καὶ τὴν αὐτοῦ τοῦ ἁμαρτάνοντος φύσιν ὅτι μοι συγγενής, οὐχὶ αἵματος ἢ σπέρματος τοῦ αὐτοῦ, ἀλλὰ νοῦ καὶ θείας ἀπομοίρας μέτοχος,
  - οὔτε βλαβῆναι ὑπό τινος αὐτῶν δύναμαι· αἰσχρῷ γάρ με οὐδεὶς περιβαλεῖ·
  - οὔτε ὀργίζεσθαι τῷ συγγενεῖ δύναμαι οὔτε ἀπέχθεσθαι αὐτῷ.
  - γεγόναμεν γὰρ πρὸς συνεργίαν ὡς πόδες, ὡς χεῖρες, ὡς βλέφαρα, ὡς οἱ στοῖχοι τῶν ἄνω καὶ κάτω ὀδόντων.
  - τὸ οὖν ἀντιπράσσειν ἀλλήλοις παρὰ φύσιν· ἀντιπρακτικὸν δὲ τὸ ἀγανακτεῖν καὶ ἀποστρέφεσθαι.
