# Samuel Moore's translation (1888, revised with Engels), verbatim from the Charles H. Kerr edition (Chicago, 1910) on English Wikisource, pages 15-16, 45-46 and 62; one span per passage. Engels's footnotes are not included.
translation: moore1888
aligned_by: 'hand: one span per passage'
spans:
- lines:
  - mkp.pre.1
  - mkp.pre.11
  text: A spectre is haunting Europe—the spectre of Communism. All the powers of old Europe have entered into a holy alliance to exorcise this spectre; Pope and Czar, Metternich and Guizot, French Radicals
    and German police-spies. Where is the party in opposition that has not been decried as communistic by its opponents in power? Where the Opposition that has not hurled back the branding reproach of Communism,
    against the more advanced opposition parties, as well as against its reactionary adversaries? Two things result from this fact. I. Communism is already acknowledged by all European Powers to be itself
    a Power. II. It is high time that Communists should openly, in the face of the whole world, publish their views, their aims, their tendencies, and meet this nursery tale of the Spectre of Communism
    with a Manifesto of the party itself. To this end, Communists of various nationalities have assembled in London, and sketched the following manifesto, to be published in the English, French, German,
    Italian, Flemish and Danish languages.
- lines:
  - mkp.i.1
  - mkp.i.4
  text: The history of all hitherto existing society is the history of class struggles. Freeman and slave, patrician and plebeian, lord and serf, guild-master and journeyman, in a word, oppressor and oppressed,
    stood in constant opposition to one another, carried on an uninterrupted, now hidden, now open fight, a fight that each time ended, either in a revolutionary re-constitution of society at large, or
    in the common ruin of the contending classes.
- lines:
  - mkp.ii.1
  - mkp.ii.12
  text: 'These measures will of course be different in different countries. Nevertheless in the most advanced countries the following will be pretty generally applicable: 1. Abolition of property in land
    and application of all rents of land to public purposes. 2. A heavy progressive or graduated income tax. 3. Abolition of all right of inheritance. 4. Confiscation of the property of all emigrants and
    rebels. 5. Centralization of credit in the hands of the state, by means of a national bank with State capital and an exclusive monopoly. 6. Centralization of the means of communication and transport
    in the hands of the State. 7. Extension of factories and instruments of production owned by the State; the bringing into cultivation of waste lands, and the improvement of the soil generally in accordance
    with a common plan. 8. Equal liability of all to labor. Establishment of industrial armies, especially for agriculture. 9. Combination of agriculture with manufacturing industries; gradual abolition
    of the distinction between town and country, by a more equable distribution of population over the country. 10. Free education for all children in public schools. Abolition of children''s factory labor
    in its present form. Combination of education with industrial production, etc., etc.'
- lines:
  - mkp.iv.1
  - mkp.iv.5
  text: The Communists disdain to conceal their views and aims. They openly declare that their ends can be attained only by the forcible overthrow of all existing social conditions. Let the ruling classes
    tremble at a Communistic revolution. The proletarians have nothing to lose but their chains. They have a world to win. Working men of all countries, unite!
