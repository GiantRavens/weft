# Notes on the Manifest der Kommunistischen Partei (1848).
- id: n.mkp.pre.1.printing
  attach: mkp.pre.1.2
  kind: editorial
  status: draft
  leans_on: 'Bert Andréas, Le Manifeste communiste de Marx et Engels: histoire et bibliographie 1848-1918 (1963); Engels''s prefaces of 1872 and 1888'
  text: A pamphlet of 23 pages, printed in London in the last days of February 1848 by J. E. Burghard for the Office der Bildungs-Gesellschaft für Arbeiter at 46 Liverpool Street, without the authors' names.
    The Communist League had commissioned it at its congress of November 1847; Marx wrote it in Brussels in January, drawing on Engels's catechism drafts. Revolution broke out in Paris on 24 February, as
    the sheets were being printed.
- id: n.mkp.pre.1.gespenst
  attach: mkp.pre.1.8
  kind: editorial
  status: draft
  leans_on: Helen Macfarlane's translation in The Red Republican (1850); Moore 1888
  text: 'Gespenst, ''spectre, ghost'': Moore''s ''spectre'' has fixed the English line; the first translation, Helen Macfarlane''s of 1850, opened ''A frightful hobgoblin stalks throughout Europe'', which
    is nearer the comic edge of the German (compare the Mährchen, the fairy-tales, of the fifth paragraph).'
- id: n.mkp.pre.3.alliance
  attach: mkp.pre.3.5
  kind: editorial
  status: draft
  leans_on: the political chronology of 1848
  text: 'The holy hunt names the two emperors'' ministers of the day: Metternich, the Austrian chancellor since 1821, and Guizot, Louis-Philippe''s chief minister. Both fell within weeks of the printing:
    Guizot on 23 February, Metternich on 13 March 1848. The Czar is Nicholas I; the Pope, Pius IX, then thought a liberal.'
- id: n.mkp.pre.6.spelling
  attach: mkp.pre.6.5
  kind: editorial
  status: draft
  leans_on: Duden, Vollständiges Orthographisches Wörterbuch (1880); the Berlin conference of 1901
  text: 'Thatsache, Mährchen, daß, Czar, Centralisation, Oeffentliche: the spelling of 1848 before the Duden of 1880 and the reform of 1901 removed the th and the h of length (Tat, Märchen), replaced c
    by z or k in loans, and set ß. The modern forms are in n; the sound is unchanged.'
- id: n.mkp.ii.1.measures
  attach: mkp.ii.1.2
  kind: editorial
  status: draft
  leans_on: Engels's preface to the German edition of 1872, repeated in 1888
  text: The ten measures close section II. Engels wrote in 1872 that 'no special stress is laid on the revolutionary measures proposed at the end of Section II', that the passage 'would, in many respects,
    be very differently worded today', and that the Manifesto was a historical document the authors no longer had the right to alter. The edition gives the ten as printed in 1848.
- id: n.mkp.iv.5.slogan
  attach: mkp.iv.5.1
  kind: editorial
  status: draft
  leans_on: Moore 1888; Macfarlane 1850; the League's statutes of 1847
  text: 'Proletarier aller Länder vereinigt Euch: literally ''Proletarians of all countries, unite''. Moore''s ''Working men of all countries, unite!'' is the familiar English; the League had adopted the
    line as its motto in 1847 in place of ''All men are brothers''. The 1848 print sets it in spaced capitals, without the comma that later editions add.'
