# Weft edition of four passages of the Manifest der Kommunistischen Partei (London, February 1848), in the spelling of
# the first printing: the opening (Ein Gespenst geht um in Europa), the first lines of section I (Die Geschichte aller
# bisherigen Gesellschaft ist die Geschichte von Klassenkämpfen), the ten measures of section II, and the closing of
# section IV with the call Proletarier aller Länder vereinigt Euch. Text of German Wikisource (Seite:Manifest der kom
# Partei 1848-1.djvu/003, 016, 023, all proofread twice), checked verbatim against the pinned page revisions;
# verify_strip sets aside the page templates, the bold and spaced type, and the numbers of the ten measures, which
# the edition does not tokenize (Moore's English carries them).
#
# The 1848 spelling is kept: Thatsache, Mährchen, daß, Czar, Maaßregeln, Eigenthum, Centralisation, Oeffentliche,
# allmählige, verschrieen, Leibeigner, Gesell. n gives the modern spelling; the sound of both schemes is computed from
# it (pipeline/weft/german.py with pipeline/weft/data/de_lexicon.yaml).
#   t     the word as printed, punctuation attached
#   n     the modern spelling of the same word form, German capitalization kept
#   p     the dash the print sets off by spaces (Europa – das Gespenst)
#   Weft divides the text into lines at the sentence and, in long sentences, at a clause; u. s. w. is three tokens.
work: marx-manifest
joiner: ' '
verify_strip: (?s)<noinclude>.*?</noinclude>|\{\{Center\||\{\{SperrSchrift\||'''|</?big>|<br />|\{\{[^{}]*\}\}|\}\}|<[^>]+>|\d+\)\s
