  lead: 'Utopia (Latin: Libellus vere aureus, nec minus salutaris quam festivus, de optimo rei publicae
    statu deque nova insula Utopia, "A truly golden little book, not less beneficial than enjoyable, about
    how things should be in a state and about the new island Utopia") is a work of fiction and socio-political
    satire by Thomas More (1478–1535), written in Latin and published in 1516 and revised in 1518. The
    book is a frame narrative primarily depicting a fictional island society and its religious, social
    and political customs. Many aspects of More''s description of Utopia are reminiscent of life in monasteries.'
