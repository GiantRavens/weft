# verbatim. Burnet joins and divides sentences differently from the Latin; spans end at his
# semicolons where the Latin sentence ends.
translation: burnet1684
aligned_by: hand, phase 0
spans:
- lines: [utop.oves.1, utop.oves.2]
  text: "But I do not think that this necessity of stealing arises only from hence; there is another cause of it, more peculiar to England."
- lines: [utop.oves.3, utop.oves.3]
  text: "‘What is that?’ said the Cardinal:"
- lines: [utop.oves.4, utop.oves.6]
  text: "‘The increase of pasture,’ said I, ‘by which your sheep, which are naturally mild, and easily kept in order, may be said now to devour men and unpeople, not only villages, but towns;"
- lines: [utop.oves.7, utop.oves.14]
  text: "for wherever it is found that the sheep of any soil yield a softer and richer wool than ordinary, there the nobility and gentry, and even those holy men, the abbots! not contented with the old rents which their farms yielded, nor thinking it enough that they, living at their ease, do no good to the public, resolve to do it hurt instead of good. They stop the course of agriculture, destroying houses and towns, reserving only the churches, and enclose grounds that they may lodge their sheep in them. As if forests and parks had swallowed up too little of the land, those worthy countrymen turn the best inhabited places into solitudes;"
