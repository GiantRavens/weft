# Notes for the runic inscriptions.
- id: n.run.kylver
  attach: run.kylver.1
  kind: editorial
  status: draft
  text: "The Kylver stone, found in 1903 on Gotland, formed part of a grave. It carries the earliest complete futhark, the runic alphabet, named for its first six runes: f, u, þ, a, r, k. Each rune also had a name that was a word; the gloss row gives the meaning of each reconstructed name."
- id: n.run.kylver.fehu
  attach: run.kylver.1.1
  kind: editorial
  status: draft
  text: "The first rune's name, *fehu, 'cattle, wealth', is the ancestor of Old Norse fé, the first word of Hávamál 76 in this library."
- id: n.run.gallehus.horn
  attach: run.gallehus.1
  kind: editorial
  status: draft
  text: "Two gold horns were found at Gallehus, in 1639 and 1734; this inscription is on the second. Both were stolen from the royal collection in Copenhagen and melted down in 1802. The runes survive only in drawings made before the theft."
- id: n.run.gallehus.verse
  attach: run.gallehus.1.3
  kind: editorial
  status: draft
  text: "The line alliterates on h: hlewagastiz, holtijaz, horna. It is among the earliest surviving lines of Germanic alliterative verse, the form later used in Beowulf and the Edda."
- id: n.run.gallehus.stephens
  attach: run.gallehus.1.1
  kind: editorial
  status: draft
  text: "Stephens (1884) divided the runes differently, reading ECHLEW as a personal name, the inscription as an offering to a forest god, and linking the name to Ecglaf in Beowulf. Modern runologists read ek, 'I', as the first word, which makes the inscription a maker's signature. Both translations are shown so the change in reading is visible."
- id: n.run.rok.stone
  attach: run.rok.1
  kind: editorial
  status: draft
  text: "The Rök stone carries more than 700 runes, the longest known runic inscription. Its opening, shown here, names the dead son, Vamod, and the father who raised the stone, Varin. Much of the rest of the inscription remains disputed."
- id: n.run.rok.stonta
  attach: run.rok.1.3
  kind: editorial
  status: draft
  text: "The younger futhark has 16 runes for about 30 sounds. The rune ᚬ spells the nasal a of standa, so the stone reads stonta. The sound row is derived from the normalized form, not from the runes."
- id: n.run.rok.fadi
  attach: run.rok.2.3
  kind: editorial
  status: draft
  text: "Fāði, past tense of fá, 'paint, write'. Runes were often painted after carving. Stephens renders the word 'fawed (made)'."
- id: n.run.rok.faigian
  attach: run.rok.2.6
  kind: editorial
  status: draft
  text: "Faigian, 'doomed, dead', is related to English fey, from Old English fǣge. Stephens keeps the English word: 'his-fey (deceast) son'."
