# Weft edition of three runic inscriptions: the standard scholarly transliterations, each
# cited to its catalogue number in the Scandinavian Runic-text Database (Rundata). Runic
# transliteration is conventionally lowercase; R is the Old Norse R rune (ᛦ/ᛧ).
# Each token: t = transliteration (what the runes spell), n = normalized form (what it says).
# The runes are generated from t; the sound is generated from n.
inscriptions:
  - id: kylver
    title: "The Kylver stone (G 88), Gotland, about 400: the earliest complete futhark"
    alphabet: elder
    dialect: pn
    lines:
      - tokens: [{t: f}, {t: u}, {t: þ}, {t: a}, {t: r}, {t: k}, {t: g}, {t: w},
                 {t: h}, {t: n}, {t: i}, {t: j}, {t: p}, {t: ï}, {t: z}, {t: s},
                 {t: t}, {t: b}, {t: e}, {t: m}, {t: l}, {t: ŋ}, {t: d}, {t: o}]
  - id: gallehus
    title: "The golden horn of Gallehus (DR 12), Denmark, about 400"
    alphabet: elder
    dialect: pn
    lines:
      - tokens: [{t: ek, n: ek}, {t: hlewagastiz, n: Hlewagastiz}, {t: holtijaz, n: Holtijaz},
                 {t: horna, n: horna}, {t: tawido, n: tawidō}]
  - id: rok
    title: "The Rök runestone (Ög 136), Östergötland, about 800: the opening"
    alphabet: younger-short-twig
    dialect: oen
    lines:
      - tokens: [{t: aft, n: aft}, {t: uamuþ, n: Væmōð}, {t: stonta, n: standa},
                 {t: runaR, n: rūnaR}, {t: þaR, n: þaR}]
      - tokens: [{t: n, n: æn}, {t: uarin, n: Varinn}, {t: faþi, n: fāði}, {t: faþiR, n: faðiR},
                 {t: aft, n: aft}, {t: faikion, n: faigian}, {t: sunu, n: sunu}]
