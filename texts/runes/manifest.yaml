predicted_gaps:
  - "runes do not mark vowel length or many consonant contrasts: sound comes from each word's normalization"
  - "no public-domain modern translation exists; Stephens (1884) is public domain but his readings are superseded, so a labelled Weft translation of the modern reading sits beside it"
  - "Stephens is quoted from the scanned page (the OCR text garbles words); spans were checked against pages 36 and 86 of the scan"
  - "the Gallehus horn was stolen and melted in 1802; its runes survive only in 18th-century drawings"
  - "Rök uses short-twig runes; Unicode short-twig forms stand in for the carved shapes"
