# Weft editorial translation of Thattr af Ragnars sonum (The Tale of Ragnar's Sons), chapters 1 to 5,
# line by line from the normalized Old Norse text (Fornaldarsogur Nordurlanda). Draft. Made because no
# English translation is public domain worldwide; the modern translations were not consulted.
# One span per Old Norse line; each verse stanza is one span. Words in parentheses are supplied for English
# sense; square brackets give the referent of a kenning or a short gloss; [?] marks a reading Weft is unsure of.
# The saga's historic present is rendered as past throughout. Names: Ragnar, Aslaug, Thora Town-Hart, Ivar the
# Boneless, Bjorn Ironside, Hvitserk, Sigurd Snake-in-the-Eye, Eirik, Agnar, Ella, Eystein, Hring, Northumbria,
# York; other personal names drop accents (d for edh, th for thorn, no nominative -r); places with a settled
# English form use it (Zealand, Uppsala, Lejre, Jutland, Scania, Ringerike, Hadeland, Hedmark), others are
# transliterated the same way.
translation: weft-editorial
aligned_by: hand, phase 0; one span per Old Norse line, one span per stanza
spans:
- lines:
  - rsons.1.1
  - rsons.1.1
  text: After the death of King Hring, Ragnar, his son, took the kingship over the realm of the Swedes and the Danes.
- lines:
  - rsons.1.2
  - rsons.1.2
  text: Then many kings attacked the realms and brought (them) under themselves.
- lines:
  - rsons.1.3
  - rsons.1.3
  text: And because he was a young man, and he seemed to them little fitted for counsel or for governing the land,
    (it happened that) there was a jarl in West Gautland who was called Herraud.
- lines:
  - rsons.1.4
  - rsons.1.4
  text: He was King Ragnar's jarl.
- lines:
  - rsons.1.5
  - rsons.1.5
  text: He was the wisest of men and a great warrior.
- lines:
  - rsons.1.6
  - rsons.1.6
  text: He had one daughter, who was called Thora Town-Hart.
- lines:
  - rsons.1.7
  - rsons.1.7
  text: She was the fairest of all women that the king had heard of.
- lines:
  - rsons.1.8
  - rsons.1.8
  text: The jarl, her father, had given her a little snake as a morning-gift.
- lines:
  - rsons.1.9
  - rsons.1.9
  text: At first she fed it in her box.
- lines:
  - rsons.1.10
  - rsons.1.10
  text: But this serpent grew so large in the end that it lay in a ring around the bower and bit its own tail.
- lines:
  - rsons.1.11
  - rsons.1.11
  text: It then became so fierce that men did not dare come near the bower, except those who gave it food or served
    the jarl's daughter, and it ate an ox a day.
- lines:
  - rsons.1.12
  - rsons.1.12
  text: The people were much afraid, and knew that it would do great harm, as large and fierce as it had then become.
- lines:
  - rsons.1.13
  - rsons.1.13
  text: Then the jarl made a vow over the bragarfull [the chieftain's toast] that he would give his daughter Thora
    in marriage only to the man who killed the serpent or dared to go and speak with her in spite of the serpent.
- lines:
  - rsons.1.14
  - rsons.1.14
  text: And when King Ragnar heard this news, he went to West Gautland.
- lines:
  - rsons.1.15
  - rsons.1.15
  text: And when he had a short way left to the jarl's farm, he put on shaggy clothes, breeches and a cloak, with
    sleeves on it, and a hood.
- lines:
  - rsons.1.16
  - rsons.1.16
  text: Those clothes were fulled with sand and tar, and he took a great spear in his hand, and was girt with a
    sword, and so went alone from his men to the jarl's farm and to Thora's bower.
- lines:
  - rsons.1.17
  - rsons.1.17
  text: And as soon as the serpent saw that a strange man had come there, it reared up and blew poison against him.
- lines:
  - rsons.1.18
  - rsons.1.18
  text: But he put up his shield against it and went at it boldly and thrust the spear into its heart.
- lines:
  - rsons.1.19
  - rsons.1.19
  text: And then he drew his sword and cut the head off the serpent, and it went as is told in the saga of King
    Ragnar, that he afterwards married Thora Town-Hart.
- lines:
  - rsons.1.20
  - rsons.1.20
  text: And after that he went raiding and freed all his realm.
- lines:
  - rsons.1.21
  - rsons.1.21
  text: He had two sons with Thora.
- lines:
  - rsons.1.22
  - rsons.1.22
  text: One was called Eirik and the other Agnar.
- lines:
  - rsons.1.23
  - rsons.1.23
  text: And when they were a few winters old, Thora fell sick and died.
- lines:
  - rsons.1.24
  - rsons.1.24
  text: Afterwards Ragnar married Aslaug, whom some call Randalin, the daughter of Sigurd Fafnisbani [the slayer
    of Fafnir] and Brynhild Budladottir.
- lines:
  - rsons.1.25
  - rsons.1.25
  text: They had four sons.
- lines:
  - rsons.1.26
  - rsons.1.26
  text: Ivar the Boneless was the eldest, then Bjorn Ironside, then Hvitserk, then Sigurd.
- lines:
  - rsons.1.27
  - rsons.1.27
  text: There was a mark in his eye, such that it was as if a serpent lay around the pupil, and for that reason
    he was called Sigurd Snake-in-the-Eye.
- lines:
  - rsons.2.1
  - rsons.2.1
  text: Now when the sons of Ragnar were grown, they raided widely through the lands.
- lines:
  - rsons.2.2
  - rsons.2.2
  text: The brothers Eirik and Agnar went in a second quarter, and in a third quarter went Ivar and his younger
    brothers with him, and he made the plans for them, because he was very wise.
- lines:
  - rsons.2.3
  - rsons.2.3
  text: They brought under themselves Zealand and Reidgotaland, Eygotaland and Eyland and all the small lands in
    the sea.
- lines:
  - rsons.2.4
  - rsons.2.4
  text: Then Ivar settled with his younger brothers at Lejre on Zealand, and that was nevertheless against the will
    of King Ragnar.
- lines:
  - rsons.2.5
  - rsons.2.5
  text: His sons all went raiding, because they did not want to be less famous than King Ragnar, their father.
- lines:
  - rsons.2.6
  - rsons.2.6
  text: King Ragnar was displeased that his sons held out against him and took his tributary lands against his will.
- lines:
  - rsons.2.7
  - rsons.2.7
  text: He set over the realm of the Upper Swedes a king who was called Eystein Beli, and told him to hold that
    realm on his behalf, and to defend it against his sons if they laid claim to it.
- lines:
  - rsons.2.8
  - rsons.2.8
  text: One summer, when King Ragnar had gone with an army on the Eastern Way, Eirik and Agnar, his sons, came to
    Sweden and steered their ships up into the Logr [Lake Malaren].
- lines:
  - rsons.2.9
  - rsons.2.9
  text: Then they sent word to King Eystein at Uppsala that he should come to them.
- lines:
  - rsons.2.10
  - rsons.2.10
  text: And when they met, Eirik said that he wanted King Eystein to hold the Swedish realm under the brothers,
    and said that he would then marry Borghild, his daughter, and said that then they could well hold that realm
    against King Ragnar.
- lines:
  - rsons.2.11
  - rsons.2.11
  text: Eystein said he would put this to the chieftains of the land, and so they parted.
- lines:
  - rsons.2.12
  - rsons.2.12
  text: And when King Eystein raised this matter, all the people of the land agreed to defend the land against the
    sons of Ragnar, and an overwhelming army was gathered, and King Eystein went against Ragnar's sons.
- lines:
  - rsons.2.13
  - rsons.2.13
  text: And when they met, there was a great battle there, and the sons of Lothbrok were overborne by numbers, and
    the brothers' troop fell so that only a few were left standing.
- lines:
  - rsons.2.14
  - rsons.2.14
  text: Then Agnar also fell, and Eirik was taken captive.
- lines:
  - rsons.2.15
  - rsons.2.15
  text: King Eystein offered Eirik quarter, and as much wealth from the realm of Uppsala for Agnar, his brother,
    as he himself wanted, and with it his daughter, whom he had earlier asked for.
- lines:
  - rsons.2.16
  - rsons.2.16
  text: 'Eirik wanted no payment and not the king''s daughter, and he said he did not want to live after the defeat
    he had suffered, but he said he would accept this: that he might choose his manner of death for himself.'
- lines:
  - rsons.2.17
  - rsons.2.17
  text: And because King Eystein could get no settlement from Eirik, he granted him that.
- lines:
  - rsons.2.18
  - rsons.2.18
  text: Eirik asked that they take him up on spear points and so raise him high over all the slain.
- lines:
  - rsons.2.19
  - rsons.2.19
  text: 'Then Eirik spoke (this verse):'
- lines:
  - rsons.2.20
  - rsons.2.27
  text: '"I do not want payment for (my) brother,

    nor to buy a maiden with rings,

    (now that) I hear it said that Eystein has become

    Agnar''s slayer [?];

    my mother will not weep for me,

    I shall die highest over the slain;

    and let me stand

    pierced through with spear-trees [spears]."'
- lines:
  - rsons.2.28
  - rsons.2.28
  text: And before he was raised up on the spears, he saw a man riding hard.
- lines:
  - rsons.2.29
  - rsons.2.29
  text: 'Then he spoke:'
- lines:
  - rsons.2.30
  - rsons.2.37
  text: '"Carry these words at the last [?],

    the eastern journeys are over,

    that the maiden should have my rings,

    (tell it) to slender Aslaug;

    then my stepmother will say

    the most, in her anger,

    to her generous sons,

    if they learn that I am dead."'
- lines:
  - rsons.2.38
  - rsons.2.38
  text: Now it was done so that Eirik was lifted up on the spear points, and he died like that, up above the slain.
- lines:
  - rsons.2.39
  - rsons.2.39
  text: And when this news reached Aslaug out on Zealand, she went at once to meet her sons and told them this news.
- lines:
  - rsons.2.40
  - rsons.2.40
  text: Bjorn and Hvitserk were playing at the board game, and Sigurd stood in front (of them).
- lines:
  - rsons.2.41
  - rsons.2.41
  text: 'Then Aslaug spoke:'
- lines:
  - rsons.2.42
  - rsons.2.49
  text: '"(The death) of you brothers,

    if you had died first,

    would not have stayed unavenged

    one season after;

    I do not mean to hide it,

    if Eirik and Agnar,

    kinsmen not born of me,

    could have kept their lives."'
- lines:
  - rsons.2.50
  - rsons.2.50
  text: 'Then Sigurd Snake-in-the-Eye answered:'
- lines:
  - rsons.2.51
  - rsons.2.58
  text: '"Within three weeks,

    if it grieves you, mother,

    (we have a long way to go),

    the levy shall be made ready;

    Eystein Beli shall not

    rule at Uppsala,

    though he offers great wealth,

    if edges [swords] serve us."'
- lines:
  - rsons.2.59
  - rsons.2.59
  text: 'Then Bjorn Ironside spoke:'
- lines:
  - rsons.2.60
  - rsons.2.67
  text: '"Courage and heart will serve

    in a hawk-keen breast,

    though one speaks less of it,

    inside a man''s ribs;

    there is no snake in our eyes

    nor glittering serpents;

    my brothers gladdened me;

    I remember your stepsons."'
- lines:
  - rsons.2.68
  - rsons.2.68
  text: 'Then Hvitserk answered:'
- lines:
  - rsons.2.69
  - rsons.2.76
  text: '"Let us consider, before we make vows,

    how vengeance may be taken;

    let us make Agnar''s slayer

    meet with evils of every kind [?];

    let us push the hull out on the waves,

    let us hew the ice before the prow,

    let us see to it how soonest

    we may get the ships made ready."'
- lines:
  - rsons.2.77
  - rsons.2.77
  text: 'Then Ivar the Boneless spoke:'
- lines:
  - rsons.2.78
  - rsons.2.85
  text: '"You have courage enough

    and daring both;

    there would be need then

    that great stubbornness went with it;

    I, boneless, shall have to be

    carried forward before the warriors,

    yet I have a hand for vengeance,

    though I can use neither (of my legs) [?]."'
- lines:
  - rsons.2.86
  - rsons.2.86
  text: After that the sons of Ragnar gathered an overwhelming army.
- lines:
  - rsons.2.87
  - rsons.2.87
  text: And when they were ready, they went with a fleet to Sweden, and Queen Aslaug went by land with fifteen hundred
    riders, and those people were very well equipped.
- lines:
  - rsons.2.88
  - rsons.2.88
  text: She herself wore armor and was the leader of that army and called herself Randalin, and they met in Sweden
    and plundered and burned wherever they went.
- lines:
  - rsons.2.89
  - rsons.2.89
  text: King Eystein heard this and gathered an army against them, every man in his realm who was able to fight.
- lines:
  - rsons.2.90
  - rsons.2.90
  text: And when they met, there was a great battle there, and the sons of Lothbrok won the victory, and King Eystein
    fell, and this was heard of and became very famous.
- lines:
  - rsons.2.91
  - rsons.2.91
  text: King Ragnar, where he was raiding, heard this and was very displeased with his sons, that they had not let
    the vengeance wait for him.
- lines:
  - rsons.2.92
  - rsons.2.92
  text: And when he came home to his realm, he told Aslaug that he would do a deed no less famous than his sons
    had then done.
- lines:
  - rsons.2.93
  - rsons.2.93
  text: '"I have now won back under myself nearly all the realm that my forefathers held, except England only, and
    so I have now had two knarrs [cargo ships] built at Lidir in Vestfold," for his realm reached all the way to
    Dofrafjall and Lidandisnes.'
- lines:
  - rsons.2.94
  - rsons.2.94
  text: 'Aslaug answered: "You could have had many longships built for the price of these knarrs.'
- lines:
  - rsons.2.95
  - rsons.2.95
  text: You also know that large ships are not good to bring to England, because of the currents and the shoals,
    and this is not wisely planned."
- lines:
  - rsons.2.96
  - rsons.2.96
  text: But all the same King Ragnar went with these knarrs west to England with five hundred men and wrecked both
    ships off England, but he himself and all his army came safe to land.
- lines:
  - rsons.2.97
  - rsons.2.97
  text: He then began to raid wherever he went.
- lines:
  - rsons.3.1
  - rsons.3.1
  text: At that time a king who was called Ella ruled over Northumbria.
- lines:
  - rsons.3.2
  - rsons.3.2
  text: And when he heard that an army had come into his realm, he gathered a large force and went against him with
    an overwhelming army, and there was a great and hard battle there.
- lines:
  - rsons.3.3
  - rsons.3.3
  text: King Ragnar wore outermost the silk shirt that Aslaug had given him at parting.
- lines:
  - rsons.3.4
  - rsons.3.4
  text: But because the land army was large, so that nothing could hold against it, nearly all his people fell,
    but he himself went four full times right through King Ella's battle line, and no iron bit on his silk shirt.
- lines:
  - rsons.3.5
  - rsons.3.5
  text: In the end he was taken captive and put in a snake pit, and the snakes would not come near him.
- lines:
  - rsons.3.6
  - rsons.3.6
  text: King Ella saw that iron had not bitten him during the day when they fought, and now the snakes would not
    harm him.
- lines:
  - rsons.3.7
  - rsons.3.7
  text: Then he had the garment stripped off him that he had worn outermost during the day, and at once the snakes
    hung on him on all sides, and he lost his life there with great courage.
- lines:
  - rsons.3.8
  - rsons.3.8
  text: And when the sons of King Ragnar heard this news, they went west to England and fought with King Ella.
- lines:
  - rsons.3.9
  - rsons.3.9
  text: And because Ivar would not fight, nor his people, and the land army was strong, they suffered defeat and
    fled to the ships and went home to Denmark with matters as they stood.
- lines:
  - rsons.3.10
  - rsons.3.10
  text: But Ivar stayed behind in England and went to meet King Ella and asked him for compensation for his father.
- lines:
  - rsons.3.11
  - rsons.3.11
  text: And because King Ella saw that Ivar had not wanted to fight against him with his brothers, it seemed to
    him trustworthy to make a settlement with him.
- lines:
  - rsons.3.12
  - rsons.3.12
  text: Ivar asked the king to give him, as payment for his father, as much land as he could spread the largest
    ox hide over, because he said it would hardly be safe for him to go home to face his brothers.
- lines:
  - rsons.3.13
  - rsons.3.13
  text: This did not seem untrustworthy to Ella, and with this they bound their settlement.
- lines:
  - rsons.3.14
  - rsons.3.14
  text: Ivar then took the hide while it was raw and wet and had it stretched as far as it would go.
- lines:
  - rsons.3.15
  - rsons.3.15
  text: And then he had the hide cut into the thinnest strip and then split it into two, the hair side and the flesh
    side.
- lines:
  - rsons.3.16
  - rsons.3.16
  text: Then he had it drawn around a level field, and a foundation marked out around the outside of it.
- lines:
  - rsons.3.17
  - rsons.3.17
  text: On it he raised strong town walls, and that town is now called York.
- lines:
  - rsons.3.18
  - rsons.3.18
  text: He made friends with all the people of the land and most of all with the chieftains, and it came about that
    all the chieftains promised loyalty to him and to his brothers.
- lines:
  - rsons.3.19
  - rsons.3.19
  text: Then he sent word to his brothers and said that there was now a better hope that they might avenge their
    father if they came with an army to England.
- lines:
  - rsons.3.20
  - rsons.3.20
  text: And when they heard that, they called out an army and made for England.
- lines:
  - rsons.3.21
  - rsons.3.21
  text: And when Ivar became aware of this, he went at once to meet King Ella and said that he would not hide such
    news from him, but said that he could not fight against his brothers, yet he would go to meet them and try for
    a settlement.
- lines:
  - rsons.3.22
  - rsons.3.22
  text: The king accepted this.
- lines:
  - rsons.3.23
  - rsons.3.23
  text: Ivar came to his brothers and urged them to avenge their father, and then went back to King Ella and said
    that they were so fierce and furious that they wanted above everything to fight.
- lines:
  - rsons.3.24
  - rsons.3.24
  text: To the king this seemed the greatest loyalty, what Ivar had done.
- lines:
  - rsons.3.25
  - rsons.3.25
  text: He then went against the brothers with his army.
- lines:
  - rsons.3.26
  - rsons.3.26
  text: And when they came together, many chieftains turned from the king and over to Ivar.
- lines:
  - rsons.3.27
  - rsons.3.27
  text: Then the king was overborne by numbers, so that a great part of his force fell, and he himself was taken
    captive.
- lines:
  - rsons.3.28
  - rsons.3.28
  text: Ivar and his brothers now remembered how their father had been tortured.
- lines:
  - rsons.3.29
  - rsons.3.29
  text: They then had an eagle carved on Ella's back, and then all the ribs cut from the backbone with a sword,
    so that the lungs were drawn out there.
- lines:
  - rsons.3.30
  - rsons.3.30
  text: 'So says Sighvat the poet in Knutsdrapa:'
- lines:
  - rsons.3.31
  - rsons.3.34
  text: '"And Ivar, who sat

    at York, had

    Ella''s back

    cut with an eagle."'
- lines:
  - rsons.3.35
  - rsons.3.35
  text: After this battle Ivar made himself king over that part of England which his kinsmen had held before.
- lines:
  - rsons.3.36
  - rsons.3.36
  text: He then had two brothers born of a concubine, and one was called Yngvar and the other Husto.
- lines:
  - rsons.3.37
  - rsons.3.37
  text: They tortured King Edmund the Holy at Ivar's command, and he then brought his realm under himself.
- lines:
  - rsons.3.38
  - rsons.3.38
  text: 'The sons of Lothbrok went raiding through many lands: England and Valland and France and on into Lombardy.'
- lines:
  - rsons.3.39
  - rsons.3.39
  text: And it is said that the farthest they came was when they won the town that is called Luna.
- lines:
  - rsons.3.40
  - rsons.3.40
  text: And at one time they meant to go to Rome and win it, and their raiding has been the most famous throughout
    all the northern lands of the Danish tongue.
- lines:
  - rsons.3.41
  - rsons.3.41
  text: And when they came back to Denmark, to their realm, they divided the lands among themselves.
- lines:
  - rsons.3.42
  - rsons.3.42
  text: Bjorn Ironside took the realm of Uppsala and all Sweden and what belongs to it, and Sigurd Snake-in-the-Eye
    had Zealand and Scania and Halland and all the Vik and Agder as far as Lidandisnes, and a great part of the
    Uplands, and Hvitserk had Reidgotaland and Wendland.
- lines:
  - rsons.3.43
  - rsons.3.43
  text: Sigurd Snake-in-the-Eye married Blaeja, the daughter of King Ella.
- lines:
  - rsons.3.44
  - rsons.3.44
  text: Their son was Knut, who was called Horda-Knut, who took the realm after his father in Zealand, Scania and
    Halland, but the Vik slipped from his hands then.
- lines:
  - rsons.3.45
  - rsons.3.45
  text: He had a son who was called Gorm.
- lines:
  - rsons.3.46
  - rsons.3.46
  text: He was named after his foster-father, the son of Knut the Foundling [?].
- lines:
  - rsons.3.47
  - rsons.3.47
  text: He held all the land on behalf of the sons of Ragnar while they were raiding.
- lines:
  - rsons.3.48
  - rsons.3.48
  text: Gorm Knutsson was the largest and strongest of all men and most accomplished in all things, but he was not
    as wise as his kinsmen before him had been.
- lines:
  - rsons.4.1
  - rsons.4.1
  text: Gorm took the kingship after his father.
- lines:
  - rsons.4.2
  - rsons.4.2
  text: He married Thyri, who was called Danmarkarbot [Denmark's Improvement], the daughter of Klakk-Harald, who
    was king in Jutland.
- lines:
  - rsons.4.3
  - rsons.4.3
  text: And when Harald was dead, Gorm took all that realm under himself.
- lines:
  - rsons.4.4
  - rsons.4.4
  text: King Gorm went with an army over all Jutland and did away with all the headland-kings [petty kings] all
    the way south to the Schlei, and he also won much of Wendland, and he fought many battles with the Saxons, and
    he became the most powerful king.
- lines:
  - rsons.4.5
  - rsons.4.5
  text: He had two sons.
- lines:
  - rsons.4.6
  - rsons.4.6
  text: The elder was called Knut and the younger Harald.
- lines:
  - rsons.4.7
  - rsons.4.7
  text: Knut was the handsomest of all the men that people had seen.
- lines:
  - rsons.4.8
  - rsons.4.8
  text: The king loved him beyond every other man, and so did all the common people.
- lines:
  - rsons.4.9
  - rsons.4.9
  text: He was called Danaast [Love of the Danes].
- lines:
  - rsons.4.10
  - rsons.4.10
  text: Harald took after his mother's family, and his mother loved him no less than Knut.
- lines:
  - rsons.4.11
  - rsons.4.11
  text: Ivar the Boneless was king in England for a long time.
- lines:
  - rsons.4.12
  - rsons.4.12
  text: He had no child, because he was so made that he had no desire or love, but he did not lack wisdom or cruelty,
    and he died of old age in England and was laid in a mound there.
- lines:
  - rsons.4.13
  - rsons.4.13
  text: By then all the sons of Lothbrok were dead.
- lines:
  - rsons.4.14
  - rsons.4.14
  text: After Ivar, Adalmund took the kingship in England.
- lines:
  - rsons.4.15
  - rsons.4.15
  text: He was the son of the brother of Edmund the Holy, and he brought Christianity to much of England.
- lines:
  - rsons.4.16
  - rsons.4.16
  text: He took tribute from Northumbria, because it was heathen.
- lines:
  - rsons.4.17
  - rsons.4.17
  text: After him his son, who was called Adalbrigt, took the kingship.
- lines:
  - rsons.4.18
  - rsons.4.18
  text: He was a good king and lived to be old.
- lines:
  - rsons.4.19
  - rsons.4.19
  text: Late in his days a Danish army came to England, and the leaders of the army were Knut and Harald, the sons
    of King Gorm.
- lines:
  - rsons.4.20
  - rsons.4.20
  text: They brought under themselves a large realm in Northumbria, which Ivar had held.
- lines:
  - rsons.4.21
  - rsons.4.21
  text: King Adalbrigt went against them, and they fought north of Cleveland, and many of the Danes fell there.
- lines:
  - rsons.4.22
  - rsons.4.22
  text: And somewhat later the Danes went ashore at Scarborough and fought there and won the victory.
- lines:
  - rsons.4.23
  - rsons.4.23
  text: Then they went south to York, and all the people there submitted to them, and they then feared nothing for
    themselves.
- lines:
  - rsons.4.24
  - rsons.4.24
  text: And one day, when the weather was hot, men went swimming.
- lines:
  - rsons.4.25
  - rsons.4.25
  text: And while the king's sons were swimming between the ships, men ran down from the land and shot at them.
- lines:
  - rsons.4.26
  - rsons.4.26
  text: Then Knut was struck by an arrow and killed, and they took the body and carried it out to a ship.
- lines:
  - rsons.4.27
  - rsons.4.27
  text: And when the people of the land heard of this, they gathered together, so that afterwards the Danes could
    make no landing because of the gathering of the people of the land, and then they went home again to Denmark.
- lines:
  - rsons.4.28
  - rsons.4.28
  text: King Gorm was then in Jutland.
- lines:
  - rsons.4.29
  - rsons.4.29
  text: And when he heard this news, he sank back and died of grief the next day at the same hour.
- lines:
  - rsons.4.30
  - rsons.4.30
  text: Then Harald, his son, took the kingship over the realm of the Danes after him.
- lines:
  - rsons.4.31
  - rsons.4.31
  text: He was the first of his kinsmen to take the faith and baptism.
- lines:
  - rsons.5.1
  - rsons.5.1
  text: Sigurd Snake-in-the-Eye and Bjorn Ironside and Hvitserk had raided widely through France.
- lines:
  - rsons.5.2
  - rsons.5.2
  text: Then Bjorn turned home to his realm.
- lines:
  - rsons.5.3
  - rsons.5.3
  text: After that the Emperor Ornulf fought with the brothers, and a hundred thousand of the Danes and Norwegians
    fell there.
- lines:
  - rsons.5.4
  - rsons.5.4
  text: Sigurd Snake-in-the-Eye fell there, and another king who fell there was called Gudrod.
- lines:
  - rsons.5.5
  - rsons.5.5
  text: He was the son of Olaf, son of Hring, son of Ingjald, son of Ingi, son of Hring, after whom Ringerike is
    named.
- lines:
  - rsons.5.6
  - rsons.5.6
  text: He was the son of Dag and of Thora Drengjamodir [Mother of Warriors].
- lines:
  - rsons.5.7
  - rsons.5.7
  text: They had nine sons, and from them is descended the family of the Doglings.
- lines:
  - rsons.5.8
  - rsons.5.8
  text: Gudrod's brother was called Helgi the Sharp.
- lines:
  - rsons.5.9
  - rsons.5.9
  text: He carried away from the battle the banner of Sigurd Snake-in-the-Eye, and his sword and shield.
- lines:
  - rsons.5.10
  - rsons.5.10
  text: He went home to Denmark with his troop and found Aslaug, Sigurd's mother, there and told her the news.
- lines:
  - rsons.5.11
  - rsons.5.11
  text: 'Then Aslaug spoke a verse:'
- lines:
  - rsons.5.12
  - rsons.5.19
  text: '"The seekers of the hunt of the slain [ravens?]

    sit on the ridges of the stronghold [?];

    it is a grief that the raven

    has forsaken [?] Sigurd''s namesake;

    the users of the corpse [carrion birds]

    blow into the shavings at him [?];

    too early Odin let

    the elf of the slain-maiden [the valkyrie''s elf: the warrior] die."'
- lines:
  - rsons.5.20
  - rsons.5.20
  text: And because Horda-Knut was young, Helgi stayed there with Aslaug a long time to defend the land.
- lines:
  - rsons.5.21
  - rsons.5.21
  text: Sigurd and Blaeja had a daughter.
- lines:
  - rsons.5.22
  - rsons.5.22
  text: She was a twin with Horda-Knut.
- lines:
  - rsons.5.23
  - rsons.5.23
  text: Aslaug gave her her own name and afterwards brought her up and fostered her.
- lines:
  - rsons.5.24
  - rsons.5.24
  text: Later Helgi the Sharp married her.
- lines:
  - rsons.5.25
  - rsons.5.25
  text: Their son was Sigurd Hart.
- lines:
  - rsons.5.26
  - rsons.5.26
  text: He was the handsomest and the largest and the strongest of all the men that people had seen.
- lines:
  - rsons.5.27
  - rsons.5.27
  text: Gorm Knutsson and Sigurd Hart were of the same age.
- lines:
  - rsons.5.28
  - rsons.5.28
  text: And when Sigurd was twelve winters old, he killed in single combat the berserk who was called Hildibrand,
    and twelve (others) with him.
- lines:
  - rsons.5.29
  - rsons.5.29
  text: After that Klakk-Harald gave him his daughter, who was called Ingibjorg, in marriage.
- lines:
  - rsons.5.30
  - rsons.5.30
  text: They had two children, Gudthorm and Ragnhild.
- lines:
  - rsons.5.31
  - rsons.5.31
  text: Then Sigurd heard that King Frodi, his father's brother, was dead.
- lines:
  - rsons.5.32
  - rsons.5.32
  text: He then went north to Norway and became king over Ringerike, his inheritance.
- lines:
  - rsons.5.33
  - rsons.5.33
  text: There is a long saga about him, because he did many kinds of great deeds.
- lines:
  - rsons.5.34
  - rsons.5.34
  text: 'But this is to be told of his death: that he rode out into the wilderness to hunt animals, as was his custom,
    and Haki Hadaberserk [the berserk of Hadeland] came against him there with thirty fully armed men and fought
    with him.'
- lines:
  - rsons.5.35
  - rsons.5.35
  text: Sigurd fell there, and had first killed twelve men, but King Haki had lost his right hand and had besides
    three other wounds.
- lines:
  - rsons.5.36
  - rsons.5.36
  text: After that King Haki rode with his men into Ringerike to Stein, where Sigurd's farm was, and took away Ragnhild,
    his daughter, and his son, Gudthorm, and much other property, and carried them home with him to Hadeland.
- lines:
  - rsons.5.37
  - rsons.5.37
  text: And a little later he had a great feast prepared and meant to hold his wedding, but it was delayed, because
    his wounds healed badly.
- lines:
  - rsons.5.38
  - rsons.5.38
  text: Ragnhild was then fifteen winters old, and Gudthorm fourteen winters.
- lines:
  - rsons.5.39
  - rsons.5.39
  text: So the autumn passed, and the winter on to Yule, while Haki lay with his wounds.
- lines:
  - rsons.5.40
  - rsons.5.40
  text: At that time King Halfdan the Black was in Hedmark at his farms.
- lines:
  - rsons.5.41
  - rsons.5.41
  text: He sent Harek Gand and a hundred men with him, and they went across the ice on the Mjosa to Hadeland in
    one night and came at dawn to King Haki's farm and took all the doors of the hall in which the retainers slept.
- lines:
  - rsons.5.42
  - rsons.5.42
  text: And then they went to King Haki's sleeping-bower and took Ragnhild there, and Gudthorm, her brother, and
    all the wealth that was there, and took (them) away with them.
- lines:
  - rsons.5.43
  - rsons.5.43
  text: They burned the hall, and all the retainers inside it, and then went away.
- lines:
  - rsons.5.44
  - rsons.5.44
  text: But King Haki got up and dressed and went after them for a while.
- lines:
  - rsons.5.45
  - rsons.5.45
  text: And when he came to the ice of the lake, he turned the hilt of his sword down and fell on the blade, and
    got his death there, and he is buried in a mound there on the lake shore.
- lines:
  - rsons.5.46
  - rsons.5.46
  text: King Halfdan saw that they were driving across the ice with a covered wagon, and thought he knew that their
    errand had turned out as he wished.
- lines:
  - rsons.5.47
  - rsons.5.47
  text: He then had word sent through all the district and invited all the great men in Hedmark, and held a great
    feast that day.
- lines:
  - rsons.5.48
  - rsons.5.48
  text: He then held his wedding with Ragnhild, and they were together for many days after.
- lines:
  - rsons.5.49
  - rsons.5.49
  text: Their son was King Harald Fairhair, who was the first to become sole king over all Norway.
