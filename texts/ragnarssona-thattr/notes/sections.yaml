# Notes for Þáttr af Ragnars sonum, all 5 chapters. Editorial notes are drafts until a reviewer lifts them.
- id: n.rsons.thattr
  attach: rsons.1.1
  kind: editorial
  status: draft
  leans_on: "the Wikipedia article Tale of Ragnar's Sons (revision 1345218587), lead; the diplomatic text of Hauksbók on heimskringla.no; Ragnars saga loðbrókar, ch. 17, in the same edition"
  text: "A þáttr is a short tale. This one, written around 1300 and preserved in Hauksbók, retells the story of Ragnar Lothbrok in brief and then follows his sons and their descendants. It agrees with the saga in this library on the main events, tells some events differently (in the saga Ivar's ox-hide trick founds London; here it founds York), and ends with the line of kings that leads to Harald Fairhair, the first king of all Norway. Its first sentence makes Ragnar the son of King Hring, who in other sources is Sigurd Hring."
- id: n.rsons.york
  attach: rsons.3.17
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 3; Ragnars saga loðbrókar, ch. 17, in the same edition"
  text: "Ivar asks King Ella for as much land as an ox-hide will cover, in compensation for his father. He cuts the hide into the thinnest of strings, lays it round a level piece of ground, and raises walls along the line it marks, the place 'now called York', Jórvík. The saga tells the same trick of Ivar but names the city Lundúnaborg, London."
- id: n.rsons.eagle
  attach: rsons.3.29
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 3; Sighvatr Þórðarson, Knútsdrápa, as quoted in the text; Vigfusson and Powell (1883), Sighvat's Tog-drapa v. 1; Ragnars saga loðbrókar, ch. 17, in the same edition"
  text: "When Ella is taken, Ragnar's sons have an eagle cut on his back and his ribs cut from the spine, the 'blood eagle'. The þáttr quotes four lines of the skald Sighvatr Þórðarson, from a poem for King Knut of the 11th century, as its authority: 'and Ivar, who sat at York, had Ella's back cut with an eagle'. The saga in this library tells the same act more briefly. The þáttr presents it as fact; the verse it quotes, which Vigfusson and Powell date about 1027, is between two and three centuries older than the prose."
- id: n.rsons.harald
  attach: rsons.5.49
  kind: editorial
  status: draft
  leans_on: "the Old Norse text, ch. 5; Ragnars saga loðbrókar, ch. 9, in the same edition"
  text: "The last chapter traces descent from Sigurd Snake-in-the-Eye: his daughter's line leads to Harald Fairhair, 'who was the first sole king over all Norway'. Sigurd Snake-in-the-Eye is Aslaug's son, and the saga in this library makes Aslaug the daughter of Sigurd the slayer of Fafnir, so the line runs back to him as well. The þáttr's last sentence names Harald."
