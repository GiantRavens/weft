# normalized spelling; morphology uses Universal Dependencies features through the overlay shorthand. The forms
# follow the shared convention table (rag/conventions.tsv) and its rules R1-R11. Departures, flagged in the spec:
# (1) a dative of possession (sér, honum after a body part or hand) glossed "his"/"of-itself" rather than "to-him";
# (2) English place names already fixed by the English layer (Cleveland, Scarborough, Schlei, Wendland) used
#     instead of the accent-stripped form; (3) compound prepositions split token by token (um fram, fyrir norðan,
#     skaut móti); (4) sakir without fyrir glossed "because-of"; (5) höttr printed nominative in an accusative list.
