  lead: A letter written by Christopher Columbus on 15 February 1493, is the first known document announcing
    the completion of his first voyage across the Atlantic, which set out in 1492 and reached the Americas.
    The letter was ostensibly written by Columbus himself, aboard the caravel Niña, on the return leg
    of his voyage. A postscript was added upon his arrival in Lisbon on 4 March 1493, and it was probably
    from there that Columbus dispatched two copies of his letter to the Spanish court.
