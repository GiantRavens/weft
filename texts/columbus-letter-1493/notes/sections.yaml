# Notes for Columbus's letter of 1493: the opening, the naming of the islands, and the first
# description of Española and its people.
- id: n.col.printing
  attach: col.1.1
  kind: editorial
  status: draft
  leans_on: "E. G. Bourne, introduction to the letter in Olson and Bourne, The Northmen, Columbus and Cabot (1906), pp. 259-262; R. H. Major, Select Letters of Christopher Columbus (1870), bibliographical notice; the Wikisource pages for the printed text and the Simancas copy"
  text: "The letter survives in several early forms, and they do not all say the same thing. The text here is the Spanish letter printed at Barcelona by April 1493: a folio with no title, date or printer's name, of which one copy is known, now in the New York Public Library. Its Catalan-coloured spellings (Magestat for majestad, Spañola for Española) are usually put down to the compositor rather than to Columbus. A second Spanish printing, in quarto, survives in the Biblioteca Ambrosiana in Milan; R. H. Major's translation follows it. A manuscript copy in the archive at Simancas was published by Navarrete in 1825. A Latin translation by Leandro de Cosco, finished on 29 April 1493 and addressed to the treasurer of Aragon, Gabriel Sánchez, was printed at Rome in 1493 and reprinted at Basel, Paris and Antwerp. Bourne counts two printings of the Spanish and nine of the Latin between 1493 and 1497, so most readers outside Spain met the news in Latin, and the early English versions, including Major's first edition of 1847, translate the Latin. The Spanish print opens with Señor alone; a closing note in it says the letter was sent to the Escribano de Ración, an office held by Luis de Santángel. The Wikisource transcription used here adds modern accents and punctuation, and letters it supplies stand in square brackets."
- id: n.col.twenty-days
  attach: col.1.2.7
  kind: editorial
  status: draft
  leans_on: "the Barcelona print and the Simancas copy (Wikisource); the Ambrosian text in Major (1870), p. 2 of the Spanish and note 27; Bourne (1906), journal entries for 6 September and 11-12 October"
  text: "The Barcelona print says the crossing to the Indies took twenty days (ueinte dias), and the Simancas copy also reads veynte. The Ambrosian printing reads xxxiij, thirty-three, and so does the postscript of the Barcelona print itself, which gives the outward voyage as XXXIII days and the return as XXVIII. The journal, in Las Casas's abstract, has the fleet leave Gomera in the Canaries on 6 September and sight land on 12 October, which fits the larger figure. Both English versions here say thirty-three days: Major because his Spanish text has it, and the Quaritch translation, in Bourne's reprint, without a note, although it was made from the Barcelona print. The edition keeps the print's word and the gloss translates it as printed."
- id: n.col.names
  attach: col.1.8
  kind: editorial
  status: draft
  leans_on: "Major (1870), notes 28-33; Bourne (1906), notes to the journal for 12-24 October; the Basel woodcut of the islands"
  text: "Columbus gives five islands new names in the order he reached them: Sant Saluador, Santa María de Concepción, Ferrandina, the fourth (see the next note) and Juana. The names run from Christ the Saviour and the Virgin to the king, Ferdinand, and the queen. Juana is usually taken to honour the heir, Prince Juan; the letter does not say. The sixth, Española, is named a little later in the letter, in a passage not given here. The letter gives no positions, so which islands these were rests on the daily journal, known only in Las Casas's abstract. Juana is Cuba and Española is Hispaniola. The Bahamian islands are less certain: Major in 1870 identified them as Watling's Island, Long Island, Great Exuma and Crooked Island, later reconstructions of the track differ in the middle names, and the first landfall in particular is still disputed. The print's Ferrandina is a variant of Fernandina, the form in the Ambrosian printing and the Simancas copy."
- id: n.col.isla-bella
  attach: col.1.9.6
  kind: editorial
  status: draft
  leans_on: "Bourne (1906), note 263-2; the Ambrosian text in Major (1870); the Simancas copy (Wikisource)"
  text: "The Barcelona print names the fourth island la isla Bella, the fair island, and the Quaritch translation renders it Fair Island. The Ambrosian printing has la Ysabella, the Simancas copy la Ysabela, and the Latin Hysabellam, so the name meant here is Isabela, for the queen. Bourne's note calls Isla bella 'a misprint for Isabella'. The edition keeps the print's two words and glosses them as printed."
- id: n.col.guanaham
  attach: col.1.7.5
  kind: editorial
  status: draft
  leans_on: "Bourne (1906), note 263-1 and the journal for 11-12 October; the Wikisource page's own note on the transcription; Major (1870), quoting Varnhagen on the Latin readings"
  text: "Guanaham is the one island name the letter reports from the inhabitants, in the form the Barcelona and Ambrosian printings share; the Simancas copy reads Guanabam. The journal has Guanahani, which is the form modern writers use, and the Latin printings have Guanahanin. Whether the final m of the prints stands for a misread ni is not known. The printed form is the evidence here, and the Wikisource transcription restored it after an earlier editor had changed it to Guanahani without saying so. The stress and the value of the h in the c1492 row are a guess: Spanish writers used h for an aspiration they heard in Taíno words, and nothing in the letter marks the stress."
- id: n.col.cathay
  attach: col.2.2.15
  kind: editorial
  status: draft
  leans_on: "Bourne (1906), note 264-2 and the journal for 1 November; Major (1870), note 32"
  text: "Columbus writes that Juana seemed so large that he thought it was mainland, tierra firme, the province of Catayo, Cathay, the name European readers knew from Marco Polo for northern China. The letter goes on, in lines not given here, to say that Indians he had taken told him it was an island, and later in the letter he still estimates it larger than England and Scotland together and places two unvisited provinces beyond its western end. The journal shows him reading the evidence toward the mainland. Juana is Cuba, an island, and the Asian coast lies far to the west. The letter reports what Columbus thought and was told; it is not evidence about the geography."
- id: n.col.people
  attach: col.3.8
  kind: editorial
  status: draft
  leans_on: "the letter's own later passages, in Major (1870) and Bourne (1906); Bourne's introduction on the letter's circulation"
  text: "This is the letter's first description of the people of the islands, whom it calls Indians and who are today called Taíno. It reports that men and women go naked, that some women cover themselves with a leaf or a piece of cotton, that they have no iron, steel or weapons, and that they are well made but very timid. Two things limit how these sentences can be read. First, they are written for the court and its financiers, to show that the lands are rich and the people easy to win; the letter goes on to say that Columbus gave them gifts so that they might become Christians and serve the crown, and that he took some of them by force at the first island. Second, other passages of the same letter qualify the claim of no weapons: it describes cane spears tipped with sharpened wood a few lines later. What the letter states is what Columbus chose to report in February 1493, after about three months among the islands, much of it through captives with whom, by his own account, he communicated by words and signs."
- id: n.col.sound
  attach: col.1.4.3
  kind: editorial
  status: draft
  leans_on: "Antonio de Nebrija, Gramática de la lengua castellana (1492), book 1, and Reglas de orthographía (1517); Ramón Menéndez Pidal, La lengua de Cristóbal Colón (1940)"
  text: "The first pronunciation row reads the letter as a Castilian at court might have read it aloud in 1493, and it is approximate. It follows Nebrija's description of the letters, written in the same year as the voyage. Three features separate it most from modern Spanish. Six sibilants are kept apart: ç as ts, z as dz, ss as an s made with the tongue tip, single s between vowels as its voiced partner, x as sh, and j as the s of measure. The print's f in fallé, fermosas, fazen and fierro is read as an aspirated h, the sound Nebrija writes as h in these words; the f was an older spelling by then, but a reader from Portugal or Italy would have said f, and northern Castilians had already dropped the sound. And b and v are kept apart, a distinction that was already weakening. Columbus's own speech is not modelled. He was Genoese and had lived in Portugal, and his written Spanish shows Portuguese habits; how he said these words cannot be recovered from a printed copy set by a Catalan compositor."
