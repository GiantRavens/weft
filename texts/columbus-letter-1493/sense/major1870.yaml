# R. H. Major, Select Letters of Christopher Columbus, second edition (London: Hakluyt Society,
# 1870), 'A Letter sent by Columbus to [Luis de Santangel]', verbatim from Project Gutenberg #77820.
# Major translates the Ambrosian printing of the Spanish letter, not the Barcelona print given here;
# where the two differ in these lines (thirty-three days; Isabella) the notes say so.
# The span for section 2 ends mid-sentence, where the Spanish lines end ("...Cathay;").
# Corrections: none. Footnote markers ([27] to [33]) and the underscores marking italics removed.
translation: major1870
aligned_by: hand, phase 0; one span per sentence or clause group of the Spanish
spans:
- lines: [col.1.1, col.1.5]
  text: "SIR,—Believing that you will take pleasure in hearing of the great success which our Lord has granted me in my voyage, I write you this letter, whereby you will learn how in thirty-three days’ time I reached the Indies with the fleet which the most illustrious King and Queen, our Sovereigns, gave to me, where I found very many islands thickly peopled, of all which I took possession without resistance, for their Highnesses by proclamation made and with the royal standard unfurled."
- lines: [col.1.6, col.1.7]
  text: "To the first island that I found I gave the name of San Salvador, in remembrance of His High Majesty, who hath marvellously brought all these things to pass; the Indians call it Guanaham."
- lines: [col.1.8, col.1.9]
  text: "To the second island I gave the name of Santa-Maria de Concepcion; the third I called Fernandina; the fourth, Isabella; the fifth, Juana; and so to each one I gave a new name."
- lines: [col.2.1, col.2.2]
  text: "When I reached Juana, I followed its coast to the westward, and found it so large that I thought it must be the mainland,—the province of Cathay;"
- lines: [col.3.1, col.3.3]
  text: "Española is a wonder. Its mountains and plains, and meadows, and fields, are so beautiful and rich for planting and sowing, and rearing cattle of all kinds, and for building towns and villages."
- lines: [col.3.4, col.3.5]
  text: "The harbours on the coast, and the number and size and wholesomeness of the rivers, most of them bearing gold, surpass anything that would be believed by one who had not seen them."
- lines: [col.3.6, col.3.7]
  text: "There is a great difference between the trees, fruits, and plants of this island and those of Juana. In this island there are many spices and extensive mines of gold and other metals."
- lines: [col.3.8, col.3.10]
  text: "The inhabitants of this and of all the other islands I have found or gained intelligence of, both men and women, go as naked as they were born, with the exception that some of the women cover one part only with a single leaf of grass or with a piece of cotton, made for that purpose."
- lines: [col.3.11, col.3.12]
  text: "They have neither iron, nor steel, nor arms, nor are they competent to use them, not that they are not well-formed and of handsome stature, but because they are timid to a surprising degree."
