# The translation published by Bernard Quaritch in The Spanish Letter of Columbus to Luis de
# Sant' Angel (London, 1893), from the Barcelona print, as reprinted 'with a few minor changes in
# the wording' by E. G. Bourne in J. E. Olson and E. G. Bourne, The Northmen, Columbus and Cabot,
# 985-1503 (New York, 1906); verbatim from Project Gutenberg #18571.
# Corrections: none. Footnote markers ([263-1], [263-2]) removed.
translation: quaritch1893
aligned_by: hand, phase 0; one span per sentence or clause group of the Spanish
spans:
- lines: [col.1.1, col.1.4]
  text: "SIR: As I know that you will have pleasure from the great victory which our Lord hath given me in my voyage, I write you this, by which you shall know that in thirty-three days I passed over to the Indies with the fleet which the most illustrious King and Queen, our Lords, gave me; where I found very many islands peopled with inhabitants beyond number."
- lines: [col.1.5, col.1.5]
  text: "And, of them all, I have taken possession for their Highnesses, with proclamation and the royal standard displayed; and I was not gainsaid."
- lines: [col.1.6, col.1.7]
  text: "To the first which I found, I gave the name Sant Salvador, in commemoration of His High Majesty, who marvellously hath given all this: the Indians call it Guanaham."
- lines: [col.1.8, col.1.9]
  text: "The second I named the Island of Santa Maria de Concepcion, the third Ferrandina, the fourth, Fair Island, the fifth La Isla Juana; and so for each one a new name."
- lines: [col.2.1, col.2.2]
  text: "When I reached Juana, I followed its coast westwardly, and found it so large that I thought it might be mainland, the province of Cathay."
- lines: [col.3.1, col.3.3]
  text: "Española is a marvel; the mountains and hills, and plains, and fields, and the soil, so beautiful and rich for planting and sowing, for breeding cattle of all sorts, for building of towns and villages."
- lines: [col.3.4, col.3.5]
  text: "There could be no believing, without seeing, such harbors as are here, as well as the many and great rivers, and excellent waters, most of which contain gold."
- lines: [col.3.6, col.3.7]
  text: "In the trees and fruits and plants, there are great diversities from those of Juana. In this, there are many spiceries, and great mines of gold and other metals."
- lines: [col.3.8, col.3.10]
  text: "The people of this island, and of all the others that I have found and seen, or not seen, all go naked, men and women, just as their mothers bring them forth; although some women cover a single place with the leaf of a plant, or a cotton something which they make for that purpose."
- lines: [col.3.11, col.3.12]
  text: "They have no iron or steel, nor any weapons; nor are they fit thereunto; not because they be not a well-formed people and of fair stature, but that they are most wondrously timorous."
