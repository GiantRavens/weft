# Weft edition of the opening of Columbus's letter announcing the first voyage, in the Spanish text
# printed at Barcelona in 1493 (folio, no date or printer named; the unique copy is in the New York
# Public Library). Transcribed on Spanish Wikisource, 'Carta de Colón al escribano de ración
# (impreso)', revision 888747, and checked verbatim against it (`weft draft` reports
# edition-not-in-source otherwise).
#
# The transcription keeps the printed letters (u for v, fallé, nonbre, the Catalan-influenced
# spellings of the Barcelona compositor) but adds modern accents and punctuation, and expands the
# print's abbreviations; letters in square brackets are supplied by the transcription. Weft keeps
# the transcription as it stands and divides it into lines at the sentence and the clause.
#
#   t        the word as transcribed, punctuation attached (ésta,)
#   n        the modern spelling, typed by hand; the page shows it as "Modern spelling"; the modern
#            sound is computed from it and the 1492 sound looked up from it
#            (pipeline/weft/data/es_lexicon.yaml)
#   o        the 1490s spelling for this occurrence, overriding the lexicon (the conjunction e)
