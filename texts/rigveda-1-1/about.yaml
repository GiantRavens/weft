  lead: 'The Rigveda or Rig Veda (Sanskrit: ऋग्वेद, IAST: ṛgvedá, from ऋच्, "praise" and वेद, "knowledge")
    is an ancient Indian collection of Vedic Sanskrit hymns (sūktas). It is one of the four sacred canonical
    Hindu texts (śruti) known as the Vedas. Only one Shakha of the many survive today, namely the Śakalya
    Shakha. Much of the contents contained in the remaining Shakhas are now lost or are not available
