# Weft edition of Rigveda 1.1, the hymn to Agni, from the accented Saṃhitā text on Sanskrit
# Wikisource, checked verbatim against it (the verse labels 1.001.01a are set aside).
#
# Each printed half-verse is one line: the first carries pādas a and b, the second pāda c. The
# Devanagari is divided into words where a word ends, even inside a printed group: in अ॒ग्निमी॑ळे
# the m of agním is written with the ī of īḷe, so the division falls after अ॒ग्नि.
#
#   t        the Devanagari, as printed
#   n        the recited form in accented IAST: acute = raised pitch (udātta), grave = independent
#            falling pitch (svarita). Checked against the accent strokes in t by `weft draft`.
#   w        treebank words this printed word carries (default 1): रत्न॒धात॑मम् is the compound
#            ratna + dhātamam; एह is ā + iha fused by sandhi
#   glue     no space follows in the printed text
#   caesura  this word begins pāda b
#   p        the danda that follows the word
#   m        the metrical reading, where the metre sounds a syllable the written form lost
#            (ī́ḍyo is sung ī́ḍiyo). Used for the metre row only; editorial, after the standard
#            metrical restorations of the Rigveda
joiner: " "
verify_in: sources/rv-sasvara-1-5.txt
verify_strip: '\d+\.\d{3}\.\d{2}[a-z] '
metre: {name: gāyatrī, pada: 8}
