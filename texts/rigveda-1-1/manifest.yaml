predicted_gaps:
  - "the Wikisource page does not name the printed edition it was typed from"
  - "some pādas count seven syllables as written; the Rigveda often sounds a syllable the written form lost (ī́ḍyo as ī́ḍiyo, adhvarā́ṇām as adhvarā́ṇaam). The metre row shows the written count"
  - "Vedic pronunciation around 1200 BC is reconstructed from the ancient phonetic treatises, which are several centuries later"
