# Ralph T. H. Griffith, The Hymns of the Rigveda (2nd ed., 1896), vol. 1, hymn I. 1, verbatim.
# OCR corrected, confirmed against a second scan (archive.org in.ernet.dli.2015.47261): 'obtainetli' to
# obtaineth, '0 Agni' to O Agni, Griffith's footnote mark after 'heroes' dropped, spaces before colons removed.
translation: griffith1896
aligned_by: hand, phase 0; one span per verse
spans:
- lines:
  - rv.1.1.1.1
  - rv.1.1.1.2
  text: 'I laud Agni, the chosen Priest, God, minister of sacrifice,

    The Hotar, lavishest of wealth.'
- lines:
  - rv.1.1.2.1
  - rv.1.1.2.2
  text: 'Worthy is Agni to be praised by living as by ancient seers:

    He shall bring hitherward the Gods.'
- lines:
  - rv.1.1.3.1
  - rv.1.1.3.2
  text: 'Through Agni man obtaineth wealth, yea, plenty waxing day by day,

    Most rich in heroes, glorious.'
- lines:
  - rv.1.1.4.1
  - rv.1.1.4.2
  text: 'Agni, the perfect sacrifice which thou encompassest about

    Verily goeth to the Gods.'
- lines:
  - rv.1.1.5.1
  - rv.1.1.5.2
  text: 'May Agni, sapient-minded Priest, truthful, most gloriously great,

    The God, come hither with the Gods.'
- lines:
  - rv.1.1.6.1
  - rv.1.1.6.2
  text: 'Whatever blessing, Agni, thou wilt grant unto thy worshipper,

    That, Angiras, is indeed thy truth.'
- lines:
  - rv.1.1.7.1
  - rv.1.1.7.2
  text: 'To thee, dispeller of the night, O Agni, day by day with prayer

    Bringing thee reverence, we come;'
- lines:
  - rv.1.1.8.1
  - rv.1.1.8.2
  text: 'Ruler of sacrifices, guard of Law eternal, radiant One,

    Increasing in thine own abode.'
- lines:
  - rv.1.1.9.1
  - rv.1.1.9.2
  text: 'Be to us easy of approach, even as a father to his son:

    Agni, be with us for our weal.'
