# H. H. Wilson, Rig-Veda-Sanhitá, vol. 1 (1850), I. 1. 1, verbatim; the parentheses are Wilson's.
# OCR corrected: 'ar.d' to and; 'hom- age' rejoined across the line break.
translation: wilson1850
aligned_by: hand, phase 0; one span per verse
spans:
- lines:
  - rv.1.1.1.1
  - rv.1.1.1.2
  text: I glorify Agni, the high priest of the sacrifice, the divine, the ministrant, who presents the oblation (to the gods), and is the possessor of great wealth.
- lines:
  - rv.1.1.2.1
  - rv.1.1.2.2
  text: May that Agni who is to be celebrated by both ancient and modern sages conduct the gods hither.
- lines:
  - rv.1.1.3.1
  - rv.1.1.3.2
  text: Through Agni the worshipper obtains that affluence which increases day by day, which is the source of fame and the multiplier of mankind.
- lines:
  - rv.1.1.4.1
  - rv.1.1.4.2
  text: Agni, the unobstructed sacrifice of which thou art on every side the protector, assuredly reaches the gods.
- lines:
  - rv.1.1.5.1
  - rv.1.1.5.2
  text: May Agni, the presenter of oblations, the attainer of knowledge, he who is true, renowned, and divine, come hither with the gods.
- lines:
  - rv.1.1.6.1
  - rv.1.1.6.2
  text: Whatever good thou mayest, Agni, bestow upon the giver (of the oblation), that verily, Angiras, shall revert to thee.
- lines:
  - rv.1.1.7.1
  - rv.1.1.7.2
  text: We approach thee, Agni, with reverential homage in our thoughts, daily, both morning and evening.
- lines:
  - rv.1.1.8.1
  - rv.1.1.8.2
  text: Thee, the radiant, the protector of sacrifices, the constant illuminator of truth, increasing in thine own dwelling.
- lines:
  - rv.1.1.9.1
  - rv.1.1.9.2
  text: Agni, be unto us easy of access, as is a father to his son; be ever present with us for our good.
