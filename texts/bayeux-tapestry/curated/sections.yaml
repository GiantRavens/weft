# Human overlay for the Bayeux Tapestry captions. No treebank covers the tituli, so this file carries
# lemma and morphology too (rule 3 exception). Lemmas follow Lewis and Short in classical spelling
# (proelium, aedifico, iubeo); names take their Latin form where the cloth declines them (Haroldus in
# HAROLDUM, Willelmus, Edwardus, Wido) and the cloth's form where it does not (Harold, Stigant, Lewine,
# Gyrð). Medieval usage: alloquitur takes an accusative; the cloth writes MIRANT, which the
# transcription expands to mirantur; caballus is the ordinary word for horse; ceastra is Old English
# ceaster, fort, not a Latin word.

- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
