  lead: The Bayeux Tapestry tituli are Medieval Latin captions embroidered on the Bayeux Tapestry, which
    describe the 58 scenes portrayed on the tapestry. These help describe the main events depicted, which
    lead up to the Norman conquest of England concerning William, Duke of Normandy, and Harold, Earl of
    Wessex, later King of England, culminating in the Battle of Hastings. The tituli, composed of 2,226
    characters and symbols, is the longest known text of its kind.
