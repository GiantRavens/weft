predicted_gaps:
  - "no treebank: lemma and morphology hand-annotated against Lewis and Short, with Medieval Latin senses from Niermeyer and Du Cange; draft"
  - "the Norman reading of about 1070 is reconstructed from Old French and Anglo-Norman sound history and spelling and from later accounts of French reading of Latin; no description from the period survives; approximate, and u as French u and silent h (Harold) are its least certain points"
  - "the transcription normalizes letter forms (U for V, W for VV, J for I) and expands abbreviations in square brackets; the sound reads the expanded word, as a reader of the cloth would have"
  - "the cloth's spellings are kept and read as written: names in English or Norman form (Harold, Willelm, Wilgelm, Edward, Eadward, Wido, Lewine, Gyrð, Stigant, Turold, Ælfgyva, Conan and Cunan, Wadard, Rotbert, Vital, Eustatius), places (Bosham, Belrem, Dol, Rednes, Dinan, Bagias, Pevenesæ, Hestenga ceastra), at for ad, and e for ae and oe (PR[O]ELIUM, [A]EDIFICARE are printed with the transcription's brackets); names take no long vowels in the classical reading, since none is attested"
  - "HIE in scene 22 is a slip of the needle for HIC and is read as hic"
  - "the crosses that open scenes 12 and 38 are kept as tokens; they have no sound. The Tironian sign ⁊ in scene 9 is printed as the cloth has it and read as et"
  - "scene 21 follows the cloth, HIC WILLELM DEDIT HAROLDO ARMA, where the transcription gives DEDIT ARMA HAROLDO, and scenes 44, 50 and 55 follow the cloth's spellings of the duke's name, WILLELM, WILELMI and WILEL, where the transcription regularizes them (the photographs, Fowke and Bruce agree); each difference is declared in edition.yaml"
  - "scene 15 stops at ÆLFGYVA: the caption has no verb, and what it refers to is not known"
  - "the caption of scene 58, ET FUGA VERTERUNT ANGLI, is missing from 18th-century copies of the cloth and is held by Musset to be a restoration, as is EDWARD in scene 1; both are kept as the cloth now reads, with a note"
  - "Fowke's English comes from OCR of the 1898 printing; clear OCR errors are corrected and listed in the sense file; Bruce's renderings are Project Gutenberg's proofread text"
  - "Bruce gives no rendering for some captions (scenes 1, 4, 6, 14, 23, 33, 37, 41, 53, Turold in 10, Rednes in 18, Stigand in 30, Eustace in 56); his translation is marked partial"
