  - id: "5"
    title: "Scene 5: The crossing to Ponthieu"
    figure:
      file: "art/works/bayeux-tapestry/scene-05.jpg"
      caption: "Scene 5. Ships under full sail cross the Channel. On the cloth the name is written VVIDONIS."
