    title: "Scenes 30-31: Harold enthroned"
    figure:
      file: "art/works/bayeux-tapestry/scene-30.jpg"
      caption: "Scenes 30-31. Harold sits enthroned with orb and sceptre; Archbishop Stigand stands to his left, and people at the right look on."
      alt: "Embroidered scene of a crowned king on a throne beside an archbishop, with onlookers"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scenes_30_and_31_(cropped).jpg"
    lines:
      - "HIC RESIDET HAROLD REX ANGLORUM"
      - "STIGANT ARCHIEP[ISCOPU]S"
  - id: "32"
    title: "Scene 32: The star"
    figure:
      file: "art/works/bayeux-tapestry/scene-32.jpg"
      caption: "Scene 32. Men point up at a star with a tail at the top right, now identified with Halley's comet of 1066."
      alt: "Embroidered group of men pointing at a star with long rays in the upper border"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_32_(cropped).png"
    lines:
      - "ISTI MIRANT[UR] STELLA[M]"
  - id: "33"
    title: "Scene 33: Harold enthroned"
    figure:
      file: "art/works/bayeux-tapestry/scene-33.jpg"
      caption: "Scene 33. Harold, seated in a hall, turns to a man who leans toward him. In the lower border, ships are drawn in outline only."
      alt: "Embroidered king on a throne under an arch, a man leaning toward him, faint outlined ships below"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_33_(cropped).png"
    lines:
      - "HAROLD"
  - id: "34"
    title: "Scene 34: An English ship comes to Normandy"
    figure:
      file: "art/works/bayeux-tapestry/scene-34.jpg"
      caption: "Scene 34. An English ship with a full sail comes to shore, and a man on the beach holds its mooring line."
      alt: "Embroidered ship with a striped hull and full sail near a shore where a man stands watching"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_34_(cropped).png"
    lines:
      - "HIC NAVIS ANGLICA VENIT IN TERRAM WILLELMI DUCIS"
  - id: "35"
    title: "Scene 35: William orders ships to be built"
    figure:
      file: "art/works/bayeux-tapestry/scene-35.jpg"
      caption: "Scene 35. William, seated, gives the order; men fell trees, shape planks and build hulls."
      alt: "Embroidered strip of a seated duke, men felling trees and carpenters building boats"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_35_(cropped).png"
    lines:
      - "HIC WILLELM[US] DUX JUSSIT NAVES [A]EDIFICARE"
  - id: "36"
    title: "Scene 36: The ships are hauled to the sea"
    figure:
      file: "art/works/bayeux-tapestry/scene-36.jpg"
      caption: "Scene 36. Men haul the newly built ships down to the water on ropes."
      alt: "Embroidered men pulling ropes attached to a stack of ships"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_36_(cropped).png"
    lines:
      - "HIC TRAHUNT NAVES AD MARE"
  - id: "37"
    title: "Scene 37: Arms and wine for the ships"
    figure:
      file: "art/works/bayeux-tapestry/scene-37.jpg"
      caption: "Scene 37. Men carry mail coats, helmets, swords and spears, and two men drag a cart loaded with a cask and spears; the caption says they take them to the ships."
      alt: "Embroidered men carrying mail coats and weapons on poles, two men pulling a cart with a barrel"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_37_(cropped).png"
    lines:
      - "ISTI PORTANT ARMAS AD NAVES ET HIC TRAHUNT CARRUM CUM VINO ET ARMIS"
  - id: "38"
    title: "Scene 38: The crossing to Pevensey"
    figure:
      file: "art/works/bayeux-tapestry/scene-38.jpg"
      caption: "Scene 38. The fleet crosses, its ships loaded with men, horses and shields."
      alt: "Embroidered long strip of many ships under sail carrying horses and men"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_38_(cropped).jpg"
    lines:
      - "† HIC WILLELM[US] DUX IN MAGNO NAVIGIO MARE TRANSIVIT ET VENIT AD PEVENESÆ"
  - id: "39"
    title: "Scene 39: The horses are landed"
    figure:
      file: "art/works/bayeux-tapestry/scene-39.jpg"
      caption: "Scene 39. A ship's mast is lowered and a horse is led ashore."
      alt: "Embroidered ship beached, a mast being lowered and a horse stepping out"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_39_(cropped).png"
    lines:
      - "HIC EXEUNT CABALLI DE NAVIBUS"
  - id: "40"
    title: "Scene 40: Foraging at Hastings"
    figure:
      file: "art/works/bayeux-tapestry/scene-40.jpg"
      caption: "Scene 40. Mounted knights ride out from the beached ships toward Hastings, and men on foot kill an ox and lead off a sheep."
      alt: "Embroidered horsemen riding away from beached ships toward men slaughtering an ox"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_40_(cropped).png"
    lines:
      - "ET HIC MILITES FESTINAVERUNT HESTINGA UT CIBUM RAPERENTUR"
  - id: "41"
    title: "Scene 41: Wadard"
    figure:
      file: "art/works/bayeux-tapestry/scene-41.jpg"
      caption: "Scene 41. Wadard, named above him, sits on horseback among men on foot carrying provisions."
      alt: "Embroidered horseman between two houses with men carrying goods and leading a horse"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_41_(cropped).png"
    lines:
      - "HIC EST WADARD"
  - id: "42"
    title: "Scene 42: Cooking and serving"
    figure:
      file: "art/works/bayeux-tapestry/scene-42.jpg"
      caption: "Scene 42. Cooks boil meat in a hanging pot and bake on a stove, and servants pass the cooked food on spits."
      alt: "Embroidered cooks at a cauldron and a stove, servants handing food on spits"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_42_(cropped).jpg"
    lines:
      - "HIC COQUITUR CARO ET HIC MINISTRAVERUNT MINISTRI"
  - id: "43"
    title: "Scene 43: The meal and the blessing"
    figure:
      file: "art/works/bayeux-tapestry/scene-43.jpg"
      caption: "Scene 43. At a curved table Bishop Odo, in the center, blesses the food and drink; a servant kneels below with a dish."
      alt: "Embroidered banquet at a curved table with a bishop in the center blessing a dish"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_43_(cropped)2.png"
    lines:
      - "HIC FECERUN[T] PRANDIUM"
      - "ET HIC EPISCOPUS CIBU[M] ET POTU[M] BENEDICIT"
  - id: "44"
    title: "Scene 44: Odo, William and Robert"
    figure:
      file: "art/works/bayeux-tapestry/scene-44.jpg"
      caption: "Scene 44. Bishop Odo, Duke William and Robert, the duke's half-brothers on either side of him, sit together under a roof."
      alt: "Three embroidered men seated side by side under a tiled roof"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_44_(cropped).png"
    lines:
      - "ODO EP[ISCOPU]S WILLELM[US] ROTBERT"
  - id: "45"
    title: "Scene 45: A fort at Hastings"
    figure:
      file: "art/works/bayeux-tapestry/scene-45.jpg"
      caption: "Scene 45. Men with spades build a mound while a man in charge gives the order."
      alt: "Embroidered scene of men digging with spades and building an earth mound"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_45_(cropped).png"
    lines:
      - "ISTE JUSSIT UT FODERETUR CASTELLUM AT HESTENGA"
      - "CEASTRA"
  - id: "46"
    title: "Scene 46: News of Harold"
    figure:
      file: "art/works/bayeux-tapestry/scene-46.jpg"
      caption: "Scene 46. William, seated with a banner, hears news of Harold from a man before him."
      alt: "Embroidered seated man holding a banner, listening to a standing man in a cloak"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_46_(cropped).png"
    lines:
      - "HIC NUNTIATUM EST WILLELM[O] DE HAROLD[O]"
  - id: "47"
    title: "Scene 47: A house is burned"
    figure:
      file: "art/works/bayeux-tapestry/scene-47.jpg"
      caption: "Scene 47. Two men set a house on fire with torches while a woman leads a child out of it."
      alt: "Embroidered house in flames, two men holding torches to it, a woman and child at the door"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_47_(cropped).png"
    lines:
      - "HIC DOMUS INCENDITUR"
  - id: "48"
    title: "Scene 48: The army leaves Hastings"
    figure:
      file: "art/works/bayeux-tapestry/scene-48.jpg"
      caption: "Scene 48. The knights ride out from Hastings in close order toward the battle."
      alt: "Embroidered strip of armored horsemen riding out past a building and trees"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_48_(cropped)_(cropped).jpg"
    lines:
      - "HIC MILITES EXIERUNT DE HESTENGA ET VENERUNT AD PR[O]ELIUM CONTRA HAROLDUM REGE[M]"
  - id: "49"
    title: "Scene 49: William questions Vital"
    figure:
      file: "art/works/bayeux-tapestry/scene-49.jpg"
      caption: "Scene 49. William, mounted, questions Vital, a knight who points ahead toward the hill."
      alt: "Embroidered horsemen in mail riding toward a hill, one pointing ahead"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_49_(cropped)2.png"
    lines:
      - "HIC WILLELM[US] DUX INTERROGAT VITAL[EM] SI VIDISSET HAROLDI EXERCITU[M]"
  - id: "50"
    title: "Scene 50: Harold hears of William's army"
    figure:
      file: "art/works/bayeux-tapestry/scene-50.jpg"
      caption: "Scene 50. An English scout on foot looks out from the hill, and a messenger brings word to Harold on horseback."
      alt: "Embroidered man on foot with a shield on a hillside, a horseman beyond him"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_50_(cropped).jpg"
    lines:
      - "ISTE NUNTIAT HAROLDUM REGE[M] DE EXERCITU WILELMI DUCIS"
  - id: "51"
    title: "Scene 51: William speaks to his knights"
    figure:
      file: "art/works/bayeux-tapestry/scene-51.jpg"
      caption: "Scene 51. William, at the left, turns to address his mounted knights, who ride on ahead of him."
      alt: "Embroidered line of horsemen in mail riding with lances"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_51_(cropped)_2.jpg"
    lines:
      - "HIC WILLELM[US] DUX ALLOQUITUR SUIS MILITIBUS UT PREPARAREN[T] SE VIRILITER ET SAPIENTER AD PR[O]ELIUM CONTRA ANGLORUM EXERCITU[M]"
  - id: "52"
    title: "Scene 52: Leofwine and Gyrth fall"
    figure:
      file: "art/works/bayeux-tapestry/scene-52.jpg"
      caption: "Scene 52. Norman horsemen charge English foot soldiers; Harold's brothers fall. The names are embroidered LEVVINE and GYRD."
      alt: "Embroidered battle scene of mounted knights charging men on foot, with bodies in the lower border"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_52_(cropped)2.jpg"
    lines:
      - "HIC CECIDERUNT LEWINE ET GYRÐ FRATRES HAROLDI REGIS"
  - id: "53"
    title: "Scene 53: English and French fall together"
    figure:
      file: "art/works/bayeux-tapestry/scene-53.jpg"
      caption: "Scene 53. Horses tumble and men fall on both sides around a low hillock, and the dead fill the lower border."
      alt: "Embroidered battle with horses falling headlong and men lying dead in the border"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_53_(cropped)2.png"
    lines:
      - "HIC CECIDERUNT SIMUL ANGLI ET FRANCI IN PR[O]ELIO"
  - id: "54"
    title: "Scene 54: Bishop Odo rallies the young men"
    figure:
      file: "art/works/bayeux-tapestry/scene-54.jpg"
      caption: "Scene 54. Odo, on a dark horse, raises a club among the charging knights."
      alt: "Embroidered horsemen charging, one raising a club, with dead men below"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_54_(cropped).png"
    lines:
      - "HIC ODO EP[ISCOPU]S BACULU[M] TENENS CONFORTAT PUEROS"
  - id: "55"
    title: "Scene 55: Here is Duke William"
    figure:
      file: "art/works/bayeux-tapestry/scene-55.jpg"
      caption: "Scene 55. William, on horseback, raises a hand to his helmet; the scene is usually read as the duke showing his face to his men to prove he was alive."
      alt: "Embroidered horseman in mail turning and lifting his hand to his helmet"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_55_(cropped).png"
    lines:
      - "HIC EST WILEL[MUS] DUX"
  - id: "56"
    title: "Scene 56: Eustace, and the French attack"
    figure:
      file: "art/works/bayeux-tapestry/scene-56.jpg"
      caption: "Scene 56. The French horsemen charge, and the English on foot fall before them. Eustace, named E[USTA]TIUS, rides with a banner at the end of scene 55, just before this photograph begins."
      alt: "Embroidered cavalry charging into men on foot with shields, archers in the lower border"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_56_(cropped).png"
    lines:
      - "E[USTA]TIUS"
      - "HIC FRANCI PUGNANT ET CECIDERUNT QUI ERANT CUM HAROLDO"
  - id: "57"
    title: "Scene 57: The death of Harold"
    figure:
      file: "art/works/bayeux-tapestry/scene-57.jpg"
      caption: "Scene 57. Under the name HAROLD a standing figure holds a shaft near his face; to the right a horseman strikes down a falling man. Which figure is Harold is debated (see the note)."
      alt: "Embroidered scene of a soldier holding a shaft near his eye and a horseman cutting down a falling man"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_57_(cropped).png"
    lines:
      - "HIC HAROLD REX INTERFECTUS EST"
  - id: "58"
    title: "Scene 58: The English flee"
    figure:
      file: "art/works/bayeux-tapestry/scene-58.jpg"
      caption: "Scene 58. The English flee on foot and on horseback, pursued by mounted knights. The cloth ends here; its original end is lost."
      alt: "Embroidered horsemen pursuing men running away past a tree, the cloth frayed at the right edge"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_58_(cropped).png"
    lines:
      - "ET FUGA VERTERUNT ANGLI"
