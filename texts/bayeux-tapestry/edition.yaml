      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_05_(cropped).png"
    lines:
      - "ET VELIS VENTO PLENIS VENIT IN TERRA WIDONIS COMITIS"
  - id: "6"
    title: "Scene 6: Harold comes ashore"
    figure:
      file: "art/works/bayeux-tapestry/scene-06.jpg"
      caption: "Scene 6. Harold's ship comes in to the shore. Harold, named above him, stands in the bow, and a man in the water hauls the anchor line."
