    lines:
      - "UBI NUNTII WILLELMI DUCIS VENERUNT AD WIDONE[M]"
      - "TUROLD"
  - id: "11"
    title: "Scene 11: The messengers ride"
    figure:
      file: "art/works/bayeux-tapestry/scene-11.jpg"
      caption: "Scene 11. Two of William's messengers gallop with shields and spears."
