    figure:
      file: "art/works/bayeux-tapestry/scene-07.jpg"
      caption: "Scene 7. Count Guy of Ponthieu, on horseback, points as his men take hold of Harold on the shore."
      alt: "Embroidered scene of a mounted man pointing while men on foot seize another man"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_07_(cropped).png"
    lines:
      - "HIC APPREHENDIT WIDO HAROLDU[M]"
  - id: "8"
    title: "Scene 8: Guy leads Harold to Beaurain"
    figure:
      file: "art/works/bayeux-tapestry/scene-08.jpg"
      caption: "Scene 8. Guy's party rides with Harold toward Beaurain, hounds running ahead; the rider at the right carries a hawk. The cloth spells the place BELREM."
      alt: "Embroidered procession of horsemen with hounds and a hawk passing a tree"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_08_(cropped).png"
    lines:
      - "ET DUXIT EUM AD BELREM ET IBI EUM TENUIT"
  - id: "9"
    title: "Scene 9: Harold and Guy confer"
    figure:
      file: "art/works/bayeux-tapestry/scene-09.jpg"
      caption: "Scene 9. Guy, seated, talks with Harold, who stands before him, while armed men look on. The cloth writes the Tironian sign ⁊ for et."
      alt: "Embroidered scene of a seated man gesturing to a standing man, with a group of men to the left"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_09_(cropped).png"
    lines:
      - tokens:
        - {t: "UBI"}
        - {t: "HAROLD"}
        - {t: "⁊", n: "et"}
        - {t: "WIDO"}
        - {t: "PARABOLANT"}
  - id: "10"
    title: "Scene 10: William's messengers come to Guy"
    figure:
      file: "art/works/bayeux-tapestry/scene-10.jpg"
      caption: "Scene 10. William's messengers come to Guy. The small bearded figure holding the horses is named TUROLD on the cloth."
      alt: "Embroidered scene of men with spears and an axe meeting, a small figure holding a horse, an arcaded building at right"
