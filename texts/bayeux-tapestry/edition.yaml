# Weft edition: the Latin captions (tituli) of the Bayeux Tapestry, about 1070s: every caption on the
# surviving cloth, scenes 1 to 58 (the first twenty-four scenes built 2026-10-01, the rest 2026-10-17). The text is the
# transcription in the English Wikipedia article "Bayeux Tapestry tituli" (revision 1375979759),
# which numbers scenes by the numbers on the tapestry's backing cloth (added around 1800) and puts
# letters supplied for abbreviations in square brackets. That transcription normalizes the letter
# forms: U for the cloth's V where it is a vowel, W for VV, J for consonantal I. Every line is checked
# verbatim against it by `weft draft`; the page's footnote templates are stripped before the check.
# Where a caption spans two backing-cloth numbers it stands in one section (2-3, 27-28, 30-31).
# Scene 21 follows the cloth's word order, HIC WILLELM DEDIT HAROLDO ARMA, where the transcription
# gives DEDIT ARMA HAROLDO; the difference is declared under verify_corrections. Scene 15 stops at
# ÆLFGYVA, where the transcription's [...] marks the missing verb. The Tironian sign in scene 9 is a
# token printed as ⁊ and read as et. In scenes 44, 50 and 55 the duke's name follows the cloth's spelling
# (WILLELM, WILELMI, WILEL), where the transcription regularizes it; these are declared below too.
# Each section carries one photograph of its scene (art/works/bayeux-tapestry/).
verify_in: sources/tituli-en-wikipedia.txt
verify_strip: '\{\{sic\}\}|\{\{#tag:ref\|.*?\|group="nb"\}\}'
verify_corrections:
# scene 21: the transcription gives DEDIT ARMA HAROLDO; the cloth reads DEDIT HAROLDO ARMA (the 2017
# photograph; Fowke 1898 plate XXV, HIC WILLELM DEDIT HAROLDO ARMA; Bruce 1856). The edition follows the cloth.
- ocr: DEDIT ARMA HAROLDO
  print: DEDIT HAROLDO ARMA
  in: sources/tituli-en-wikipedia.txt
# scenes 44, 50 and 55: the transcription regularizes the duke's name; the cloth reads WILLELM (44),
# WILELMI (50) and WILEL (55), as the 2017 photographs show and Fowke and Bruce print them
- ocr: WILLEM[US] ROTBERT
  print: WILLELM[US] ROTBERT
  in: sources/tituli-en-wikipedia.txt
- ocr: EXERCITU WILLELMI
  print: EXERCITU WILELMI
  in: sources/tituli-en-wikipedia.txt
- ocr: WILLEL[MUS] DUX
  print: WILEL[MUS] DUX
  in: sources/tituli-en-wikipedia.txt
sections:
  - id: "1"
    title: "Scene 1: King Edward"
    figure:
      file: "art/works/bayeux-tapestry/scene-01.jpg"
      caption: "Scene 1. Edward, seated under a canopy, speaks with two men, one of whom is usually taken to be Harold. The name above him is EDVVARD on the cloth."
      alt: "Embroidered scene of a crowned, bearded king on a throne talking with two standing men, beside a turreted building"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_01_(cropped)2.png"
    lines:
      - "EDWARD[US] REX"
  - id: "2"
    title: "Scenes 2-3: Harold rides to Bosham"
    figure:
      file: "art/works/bayeux-tapestry/scene-02.jpg"
      caption: "Scenes 2-3. Harold, with a hawk on his wrist, rides with his men and hounds toward the church at Bosham, which two men are entering."
      alt: "Embroidered strip of horsemen with hounds and a hawk riding toward a small church"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-expired)"
      source: "https://commons.wikimedia.org/wiki/File:Scene_2_and_3_of_the_Bayeux_Tapestry_(cropped).jpg"
    lines:
      - "UBI HAROLD DUX ANGLORUM ET SUI MILITES EQUITANT AD BOSHAM ECCLESIA[M]"
  - id: "4"
    title: "Scene 4: Harold sails"
    figure:
      file: "art/works/bayeux-tapestry/scene-04.jpg"
      caption: "Scene 4. After a meal in an upper hall, Harold's men wade out carrying hounds and a hawk to a boat."
      alt: "Embroidered scene of men feasting in an arcaded hall, then wading with dogs to a boat"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
      source: "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_Scene_04_(cropped).png"
    lines:
