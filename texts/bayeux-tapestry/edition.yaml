    lines:
      - "HIC WIDO ADDUXIT HAROLDUM AD WILGELMUM NORMANNORUM DUCEM"
  - id: "14"
    title: "Scene 14: William brings Harold to his palace"
    figure:
      file: "art/works/bayeux-tapestry/scene-14.jpg"
      caption: "Scene 14. William and Harold ride to the duke's palace, where William sits in the hall and a man speaks before him."
      alt: "Embroidered strip of horsemen riding toward a long arcaded hall where a seated man listens to a standing man"
      credit: "Bayeux Tapestry, about 1070s; photograph 2017, Université de Caen Normandie, CNRS, ENSICAEN, after the photographic campaign of the Fabrique de patrimoines en Normandie; via Wikimedia Commons"
      license: "Public domain (Commons templates: PD-Art|PD-old-100-1923; PD-France)"
