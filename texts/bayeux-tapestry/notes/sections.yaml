# Notes for the Bayeux Tapestry captions: twenty-four scenes.
- id: n.bt.sound
  attach: bt.1.1
  kind: editorial
  status: draft
  leans_on: "Old French and Anglo-Norman historical phonology (M. K. Pope, From Latin to Modern French, 1934, on ts, dʒ, the loss of h and the fronting of u); Roger Wright, Late Latin and Early Romance (1982); W. S. Allen, Vox Latina (1965), appendix on national pronunciations"
  text: "The default reading is Latin as a cleric trained in Normandy, or working in England after 1066, would most likely have pronounced it around 1070. No description of how Latin was read aloud in Normandy at this date survives, so the reading is built from indirect evidence. Old French of the period said the letter c before e and i as ts and g before e and i as the j of judge, values it kept until the 1200s; it had lost the sound h in words inherited from Latin, merged ae and oe with e, and moved Latin u to the front of the mouth, as in modern French tu. The reading assumes a clerk gave Latin letters the values the same letters had in his French. The stress follows the Latin rule, because rhythmic Latin verse and prose of the 11th century still depend on it. The least certain points are u as French u and the silent h: Norman French kept h in words of Germanic origin, so Harold's name may have kept it. The restored classical pronunciation is offered second."
- id: n.bt.embroidery
  attach: bt.2.1
  kind: editorial
  status: draft
  leans_on: "David M. Wilson, The Bayeux Tapestry (1985), on materials and technique; Musée de la Tapisserie de Bayeux, technical description"
  text: "The object is called a tapestry, but it is an embroidery. In a tapestry the picture is woven into the cloth on the loom. Here the cloth is a plain linen, and the picture was added afterwards with a needle in coloured wool: outlines and the letters of the captions in stem or outline stitch, and areas of colour in laid and couched work, where threads are laid side by side and tied down. The linen is made of several lengths sewn together, nearly 70 metres in all and about 50 centimetres high. The end is lost, so the original length is not known. The numbers used for the scenes here were written on a backing cloth added around 1800; they are a modern convenience, not part of the work."
- id: n.bt.origin
  attach: bt.43.2
  kind: editorial
  status: draft
  leans_on: "inventory of the treasury of Bayeux Cathedral, 1476; Frank Stenton (ed.), The Bayeux Tapestry: A Comprehensive Survey (2nd ed., 1965); Lucien Musset, The Bayeux Tapestry, tr. Richard Rex (2005, 2011), pp. 35-37"
  text: "No document records who made the hanging or who paid for it. The earliest written record is an inventory of Bayeux Cathedral of 1476, which describes a very long cloth embroidered with images and writing of the conquest of England, hung around the nave on certain feasts. The view most widely held today is that it was made in England within about a decade of 1066 for Odo, bishop of Bayeux and William's half-brother, who was also earl of Kent. The case for Odo rests on the cloth itself: he blesses the meal in scene 43 and rallies the young men in scene 54, the oath is placed at Bayeux, and three minor figures named in the captions (Turold, Wadard and Vital, outside this selection) have been identified with men recorded in Domesday Book as tenants of Odo. The case for English workmanship rests on English spellings in the captions (note on the Latin) and on parallels between its drawing and manuscripts made at Canterbury. Both are inferences from strong but indirect evidence."
- id: n.bt.latin
  attach: bt.45.1
  kind: editorial
  status: draft
  leans_on: "Lucien Musset, The Bayeux Tapestry, tr. Richard Rex (2011), pp. 35-37; Gale R. Owen-Crocker, 'The Embroidered Word: Text in the Bayeux Tapestry', Medieval Clothing and Textiles 2 (2006); Bruce (1856), note 92"
  text: "The captions use a small set of formulas: HIC (here), UBI (where), ET HIC (and here), ISTI and ISTE (these men, this man), followed by a verb in the past or present. The Latin is mostly regular, with features of its time. The verb MIRANT is written as an active form of a verb that classical Latin uses only in the passive form (mirantur); IN TERRA lacks the m that classical Latin needs after a verb of motion (in terram), which may be the later use of the ablative or an omitted abbreviation mark; ae and oe are written e (EDIFICARE, PRELIUM). Other spellings point to English writers or designers: AT HESTENGA CEASTRA for ad Hastingae castra, with English at and the Old English word ceaster; the Old English letter ð in GYRÐ; and EADWARDUS beside EDWARDUS. Personal names appear in their own form (Harold, Stigant, Lewine) or with Latin endings (HAROLDUM, WILLELMO), sometimes in the same scene. HIE in scene 22 is a slip for HIC. The transcription used here writes U, W and J where the cloth has V, VV and I, and supplies abbreviated letters in brackets; the sound layer reads the names and spellings as written."
- id: n.bt.comet
  attach: bt.32.1
  kind: editorial
  status: draft
  leans_on: "Anglo-Saxon Chronicle, MSS C and D, s.a. 1066; D. K. Yeomans and T. Kiang, 'The long-term motion of comet Halley', Monthly Notices of the Royal Astronomical Society 197 (1981)"
  text: "The caption calls the object a star (STELLA); the drawing gives it a head and long rays. The Anglo-Saxon Chronicle records for 1066 that a sign was seen in the sky over all England, such as no one had seen before, which some called a comet, first seen around the Greater Litany (late April) and shining for a week. Calculations of the orbit of Halley's comet place its closest approach to the sun in March 1066, so the object is now identified with that comet. On the cloth it follows Harold's coronation of January 1066 and precedes the news brought to him, an order that agrees with the written date. The caption says only that the men marvel at it. Fowke's 'dismayed' and the reading of the comet as an omen of the conquest are interpretations, though the ships drawn in outline in the lower border beneath this scene are often read that way."
- id: n.bt.death
  attach: bt.57.1
  kind: editorial
  status: draft
  leans_on: "Carmen de Hastingae Proelio; Baudri of Bourgueil, Adelae comitissae (about 1100); William of Malmesbury, Gesta regum Anglorum 3.243; David J. Bernstein, The Mystery of the Bayeux Tapestry (1986); Martin K. Foys, 'Pulling the Arrow Out', in The Bayeux Tapestry: New Interpretations (2009)"
  text: "The caption HIC HAROLD REX INTERFECTUS EST runs above two figures: a standing soldier who holds a shaft near his face, under the name HAROLD, and, to the right under INTERFECTUS, a man cut down by a horseman's sword. Whether the standing figure, the falling figure, or both in sequence represent Harold is debated, and so is whether the shaft was an arrow in the eye when the cloth was made. Drawings of the cloth from the 18th and early 19th centuries differ in this area, and it was restored in the 19th century, so some scholars hold that the arrow as now seen is partly a restoration. The written sources do not settle the question. The Carmen de Hastingae Proelio, which may date from shortly after the battle, has Harold killed by knights; an arrow appears in later accounts, among them Baudri of Bourgueil about 1100 and William of Malmesbury in the 1120s. What the cloth states without ambiguity is the caption: here King Harold was killed."
- id: n.bt.borders
  attach: bt.52.1
  kind: editorial
  status: draft
  leans_on: "David M. Wilson, The Bayeux Tapestry (1985); the photographs in this edition"
  text: "Above and below the main scenes run two narrow borders. For most of the length they hold paired animals, birds, mythical beasts and diagonal bars, with some scenes from fables, among them stories known from Aesop. In places the borders take part in the story. In scene 32 the lower border shows ships drawn in outline only, beneath the men looking at the star. In the battle scenes from 52 onward the lower border fills with the dead, with shields and weapons, and in scene 57 with men stripping mail from the bodies. Archers also stand in the lower border during the battle. How far the fables comment on the main story is a matter of interpretation; the battle borders are a direct continuation of it."
