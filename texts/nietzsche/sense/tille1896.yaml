# Alexander Tille's translation, Thus Spake Zarathustra (Macmillan, 1896), Zarathustra's
# Introductory Speech, section 1, pages 1-2, from the Internet Archive OCR of the University of
# California copy (thusspakezarathu00nietiala). Tille's text follows the later German editions
# (C. G. Naumann, ed. Fritz Koegel), as his title page says. Corrections, all of OCR layout: the
# double spaces between words are single; words divided at line ends are rejoined (jour- ney,
# receiv- ing, every- where); the space the OCR sets before ! and : (Lo !, depth :) is removed; the
# running head and page number between pages 1 and 2 are not part of the text.
translation: tille1896
aligned_by: hand, phase 0; one span per sentence of the German
spans:
- lines: [nz.za1.1, nz.za1.1]
  text: "Having attained the age of thirty Zarathustra left his home and the lake of his home and went into the mountains."
- lines: [nz.za1.2, nz.za1.2]
  text: "There he rejoiced in his spirit and his loneliness and, for ten years, did not grow weary of it."
- lines: [nz.za1.3, nz.za1.3]
  text: "But at last his heart turned, — one morning he got up with the dawn, stepped into the presence of the Sun and thus spake unto him:"
- lines: [nz.za1.4, nz.za1.4]
  text: "\"Thou great star! What would be thy happiness, were it not for those for whom thou shinest."
- lines: [nz.za1.5, nz.za1.5]
  text: "For ten years thou hast come up here to my cave. Thou wouldst have got sick of thy light and thy journey but for me, mine eagle, and my serpent."
- lines: [nz.za1.6, nz.za1.6]
  text: "But we waited for thee every morning and, receiving from thee thine abundance, blessed thee for it."
- lines: [nz.za1.7, nz.za1.7]
  text: "Lo! I am weary of my wisdom, like the bee that hath collected too much honey; I need hands reaching out for it."
- lines: [nz.za1.8, nz.za1.8]
  text: "I would fain grant and distribute until the wise among men could once more enjoy their folly, and the poor once more their riches."
- lines: [nz.za1.9, nz.za1.9]
  text: "For that end I must descend to the depth: as thou dost at even, when, sinking behind the sea, thou givest light to the lower regions, thou resplendent star!"
- lines: [nz.za1.10, nz.za1.10]
  text: "I must, like thee, go down, as men say — men to whom I would descend."
- lines: [nz.za1.11, nz.za1.11]
  text: "Then bless me, thou impassive eye that canst look without envy even upon over-much happiness!"
- lines: [nz.za1.12, nz.za1.12]
  text: "Bless the cup which is about to overflow so that the water golden-flowing out of it may carry everywhere the reflection of thy rapture."
- lines: [nz.za1.13, nz.za1.13]
  text: "Lo! this cup is about to empty itself again, and Zarathustra will once more become a man.\""
- lines: [nz.za1.14, nz.za1.14]
  text: "— Thus Zarathustra's going down began."
