# Thomas Common's translation of The Joyful Wisdom (1910), §125, verbatim from Project Gutenberg
# #52881. Project Gutenberg marks italics with underscores (_The Madman._, _We have killed him_,
# _and yet they have done it!_, _Requiem aeternam deo_); the underscores are removed. No other
# corrections.
translation: common1910
aligned_by: hand, phase 0; one span per sentence or question group of the German
spans:
- lines: [nz.fw125.1, nz.fw125.3]
  text: "The Madman.—Have you ever heard of the madman who on a bright morning lighted a lantern and ran to the market-place calling out unceasingly: \"I seek God! I seek God!\"—"
- lines: [nz.fw125.4, nz.fw125.4]
  text: "As there were many people standing about who did not believe in God, he caused a great deal of amusement."
- lines: [nz.fw125.5, nz.fw125.5]
  text: "Why! is he lost? said one."
- lines: [nz.fw125.6, nz.fw125.6]
  text: "Has he strayed away like a child? said another."
- lines: [nz.fw125.7, nz.fw125.7]
  text: "Or does he keep himself hidden? Is he afraid of us? Has he taken a sea-voyage? Has he emigrated?—the people cried out laughingly, all in a hubbub."
- lines: [nz.fw125.8, nz.fw125.8]
  text: "The insane man jumped into their midst and transfixed them with his glances."
- lines: [nz.fw125.9, nz.fw125.9]
  text: "\"Where is God gone?\" he called out. \"I mean to tell you!"
- lines: [nz.fw125.10, nz.fw125.10]
  text: "We have killed him,—you and I! We are all his murderers!"
- lines: [nz.fw125.11, nz.fw125.11]
  text: "But how have we done it? How were we able to drink up the sea?"
- lines: [nz.fw125.12, nz.fw125.12]
  text: "Who gave us the sponge to wipe away the whole horizon?"
- lines: [nz.fw125.13, nz.fw125.13]
  text: "What did we do when we loosened this earth from its sun?"
- lines: [nz.fw125.14, nz.fw125.14]
  text: "Whither does it now move? Whither do we move? Away from all suns?"
- lines: [nz.fw125.15, nz.fw125.15]
  text: "Do we not dash on unceasingly? Backwards, sideways, forwards, in all directions?"
- lines: [nz.fw125.16, nz.fw125.16]
  text: "Is there still an above and below? Do we not stray, as through infinite nothingness?"
- lines: [nz.fw125.17, nz.fw125.17]
  text: "Does not empty space breathe upon us? Has it not become colder? Does not night come on continually, darker and darker?"
- lines: [nz.fw125.18, nz.fw125.18]
  text: "Shall we not have to light lanterns in the morning?"
- lines: [nz.fw125.19, nz.fw125.19]
  text: "Do we not hear the noise of the grave-diggers who are burying God? Do we not smell the divine putrefaction?—for even Gods putrefy!"
- lines: [nz.fw125.20, nz.fw125.20]
  text: "God is dead! God remains dead! And we have killed him!"
- lines: [nz.fw125.21, nz.fw125.21]
  text: "How shall we console ourselves, the most murderous of all murderers?"
- lines: [nz.fw125.22, nz.fw125.22]
  text: "The holiest and the mightiest that the world has hitherto possessed, has bled to death under our knife,—who will wipe the blood from us?"
- lines: [nz.fw125.23, nz.fw125.23]
  text: "With what water could we cleanse ourselves? What lustrums, what sacred games shall we have to devise?"
- lines: [nz.fw125.24, nz.fw125.24]
  text: "Is not the magnitude of this deed too great for us? Shall we not ourselves have to become Gods, merely to seem worthy of it?"
- lines: [nz.fw125.25, nz.fw125.25]
  text: "There never was a greater event,—and on account of it, all who are born after us belong to a higher history than any history hitherto!\"—"
- lines: [nz.fw125.26, nz.fw125.26]
  text: "Here the madman was silent and looked again at his hearers; they also were silent and looked at him in surprise."
- lines: [nz.fw125.27, nz.fw125.27]
  text: "At last he threw his lantern on the ground, so that it broke in pieces and was extinguished."
- lines: [nz.fw125.28, nz.fw125.28]
  text: "\"I come too early,\" he then said, \"I am not yet at the right time."
- lines: [nz.fw125.29, nz.fw125.29]
  text: "This prodigious event is still on its way, and is travelling,—it has not yet reached men's ears."
- lines: [nz.fw125.30, nz.fw125.30]
  text: "Lightning and thunder need time, the light of the stars needs time, deeds need time, even after they are done, to be seen and heard."
- lines: [nz.fw125.31, nz.fw125.31]
  text: "This deed is as yet further from them than the furthest star,—and yet they have done it!\"—"
- lines: [nz.fw125.32, nz.fw125.32]
  text: "It is further stated that the madman made his way into different churches on the same day, and there intoned his Requiem aeternam deo."
- lines: [nz.fw125.33, nz.fw125.34]
  text: "When led out and called to account, he always gave the reply: \"What are these churches now, if they are not the tombs and monuments of God?\"—"
