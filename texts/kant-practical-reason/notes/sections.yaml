# Notes for Kant: the Beschluß of the Critik der practischen Vernunft (1788, first
# paragraph).
- id: n.kant.kpv.zunehmenden
  attach: kant.kpv.1.10
  kind: editorial
  status: draft
  leans_on: "the 1788 print as transcribed by the Deutsches Textarchiv (kant_pvernunft_1788, page 288); the Akademie edition, volume 5 (1908), page 161, as in Project Gutenberg #49543"
  text: "The first edition prints mit immer neuer und zunehmenden Bewunderung. After the feminine noun the expected form is zunehmender, matching neuer; the -en is probably a slip of the printer or of the manuscript. The Akademie edition of 1908 prints zunehmender, and that is the form usually quoted. This edition keeps the reading of 1788 and glosses the word as if it agreed."
- id: n.kant.kpv.plaque
  attach: kant.kpv.2
  kind: editorial
  status: draft
  leans_on: "German Wikipedia, articles Immanuel Kant and Kantiana (consulted 2026-10-01), for the plaques and their dates"
  text: "This sentence is the one most often associated with Kant's memory in his city, and it is often said to stand on his grave. The record is more specific. On 12 February 1904, the hundredth anniversary of his death, a bronze plaque designed by Friedrich Lahrs and bearing this sentence was unveiled on the wall of the castle at Königsberg; it has been lost since 1945. A replica was put up in Duisburg in 1955. In 1994 a plaque with the sentence in German and Russian was mounted in Kaliningrad, as the city has been named since 1946. Kant's tomb, rebuilt by Lahrs in 1924, stands at the cathedral. The plaques quote the sentence in modern spelling, with zwei, Gemüt and zunehmender; the first edition reads as printed here."
- id: n.kant.kpv.two
  attach: kant.kpv.5
  kind: editorial
  status: draft
  leans_on: "the passage itself; Abbott's translation (Project Gutenberg #5683)"
  text: "The paragraph is built as a pair. Das erste, the starry heaven, begins from the place a person occupies in the world of the senses and widens outward to worlds beyond worlds and their periods. Das zweyte, the moral law, begins from the invisible self and places the person in a world that, Kant says, only the understanding can trace. The two views then have opposite effects: the first annihilates, as it were (gleichsam), a person's importance as an animal creature that must give its matter back to the planet; the second raises a person's worth as an intelligence. Kant scopes the second claim himself: at least so far as it can be inferred from the purpose the moral law assigns to existence. Abbott renders Gemüth as mind; the German word also covers feeling and disposition."
- id: n.kant.kpv.sound
  attach: kant.kpv.1
  kind: editorial
  status: draft
  leans_on: "W. Viëtor, Die Aussprache des Schriftdeutschen (1885); T. Siebs, Deutsche Bühnenaussprache (1898); P. von Polenz, Deutsche Sprachgeschichte, volume 2 (1994)"
  text: "The first sound scheme is a reconstruction of educated northern German as read in Königsberg in the 1780s, and it is approximate. There was no codified pronunciation norm before Siebs's stage norm of 1898, and no description of Kant's own speech has been used. The features modelled are those reported for educated northern speech of the period: g at the end of a syllable said as a fricative (Tag with kh, Weg with the h of huge), a trilled r in every position, st and sp at the start of a word part said with sh, final devoicing, and long ä kept apart from long e. The spellings of 1788 (Zwey, Gemüth, Bewußtseyn) are spellings only: th was said t, and ey was the diphthong of sein."
