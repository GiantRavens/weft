# Weft edition of Pa gur yv y porthaur ('What man is the gatekeeper?'), the Arthurian dialogue of the Black
# Book of Carmarthen (National Library of Wales, Peniarth MS 1, fol. 47b-48b, about 1250), in the text of
# W. F. Skene, The Four Ancient Books of Wales (1868), vol. 2, pp. 50-53 (his no. XXXI; vol. 2 misprints
# the heading XXXII, the number of the next poem). Each line is
# checked against the Internet Archive OCR of the Toronto copy (pinned); the OCR's misreadings are declared
# in verify_corrections, each settled on the page image (archive.org leaf n69 to n72). Skene prints the
# manuscript's dotted y as ẏ, which the OCR reads as y (verify_fold). The poem breaks off where the
# manuscript is defective; Skene's last word, a., is where the text stops.
#
#   t        the word as Skene prints it, punctuation attached (his points inside lines are kept)
#   n        Weft's normalized spelling in modern Welsh letters, from which the sound is read; draft
