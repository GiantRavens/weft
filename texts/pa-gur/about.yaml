  lead: 'Poem 31 of the Black Book of Carmarthen, a mid-13th-century manuscript, is known from its first
    line as Pa Ŵr yw''r Porthor? (Middle Welsh: Pa gur yv y porthaur? ''What man is the gatekeeper?'')
    and alternatively as Pa Ŵr, Pa gur, or Ymddiddan Arthur a Glewlwyd Gafaelfawr ("The dialogue of Arthur
    and Glewlwyd Gafaelfawr"). It is a fragmentary, anonymous poem in Old Welsh, taking the form of a
    dialogue between King Arthur and the gatekeeper Glewlwyd Gafaelfawr, in which Arthur boasts of his
    own exploits and those of his companions, especially Cai the Fair. Pa Ŵr is notable for being one
    of the earliest vernacular Arthurian works, and for alluding to several early adventures of Arthur
    which are now lost. Its precise age is not known and has been the subject of wide-ranging disagreement,
    but scholarly opinion now tends to favour a date of c. 1100.'
