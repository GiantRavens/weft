# D. Silvan Evans's translation, in W. F. Skene, The Four Ancient Books of Wales (1868), vol. 1, pp. 261-264
# (Black Book of Caermarthen XXXI). Transcribed from the page images (archive.org fourancientbooks01skenuoft,
# leaf n282 to n285), of which the pinned OCR is the witness; the OCR's misreadings (the drop initial of
# 'What', 'Uwch' for Llwch, 'Ilachau' for Llachau) are corrected, Evans's line numbers left out, and the
# spaces the print sets before ; : ? ! closed. Evans translates line for line, 88 lines to the Welsh 88.
translation: evans1868
aligned_by: hand, phase 0; one span per line, as Evans divides it
spans:
- lines:
  - pagur.1.1
  - pagur.1.1
  text: What man is the porter?
- lines:
  - pagur.1.2
  - pagur.1.2
  text: Glewlwyd Gavaelvawr.
- lines:
  - pagur.1.3
  - pagur.1.3
  text: Who is the man that asks it?
- lines:
  - pagur.1.4
  - pagur.1.4
  text: Arthur and the fair Cai.
- lines:
  - pagur.1.5
  - pagur.1.5
  text: How goes it with thee?
- lines:
  - pagur.1.6
  - pagur.1.6
  text: Truly in the best way in the world.
- lines:
  - pagur.1.7
  - pagur.1.7
  text: Into my house thou shalt not come,
- lines:
  - pagur.1.8
  - pagur.1.8
  text: Unless thou prevailest.
- lines:
  - pagur.1.9
  - pagur.1.9
  text: I forbid it.
- lines:
  - pagur.1.10
  - pagur.1.10
  text: Thou shalt see it.
- lines:
  - pagur.1.11
  - pagur.1.11
  text: If Wythnaint were to go,
- lines:
  - pagur.1.12
  - pagur.1.12
  text: The three would be unlucky:—
- lines:
  - pagur.1.13
  - pagur.1.13
  text: Mabon, the son of Mydron,
- lines:
  - pagur.1.14
  - pagur.1.14
  text: The servant of Uthir Pendragon;
- lines:
  - pagur.1.15
  - pagur.1.15
  text: Cysgaint, the son of Banon;
- lines:
  - pagur.1.16
  - pagur.1.16
  text: And Gwyn Godybrion.
- lines:
  - pagur.1.17
  - pagur.1.17
  text: Terrible were my servants
- lines:
  - pagur.1.18
  - pagur.1.18
  text: Defending their rights.
- lines:
  - pagur.1.19
  - pagur.1.19
  text: Manawydan, the son of Llyr,
- lines:
  - pagur.1.20
  - pagur.1.20
  text: Deep was his counsel.
- lines:
  - pagur.1.21
  - pagur.1.21
  text: Did not Manawyd bring
- lines:
  - pagur.1.22
  - pagur.1.22
  text: Perforated shields from Trywruid?
- lines:
  - pagur.1.23
  - pagur.1.23
  text: And Mabon, the son of Mellt,
- lines:
  - pagur.1.24
  - pagur.1.24
  text: Spotted the grass with blood?
- lines:
  - pagur.1.25
  - pagur.1.25
  text: And Anwas Adeiniog,
- lines:
  - pagur.1.26
  - pagur.1.26
  text: And Llwch Llawynnog—
- lines:
  - pagur.1.27
  - pagur.1.27
  text: Guardians were they
- lines:
  - pagur.1.28
  - pagur.1.28
  text: On Eiddyn Cymminog,
- lines:
  - pagur.1.29
  - pagur.1.29
  text: A chieftain that patronised them.
- lines:
  - pagur.1.30
  - pagur.1.30
  text: He would have his will and make redress.
- lines:
  - pagur.1.31
  - pagur.1.31
  text: Cai entreated him,
- lines:
  - pagur.1.32
  - pagur.1.32
  text: While he killed every third person.
- lines:
  - pagur.1.33
  - pagur.1.33
  text: When Celli was lost,
- lines:
  - pagur.1.34
  - pagur.1.34
  text: Cuelli was found; and rejoiced
- lines:
  - pagur.1.35
  - pagur.1.35
  text: Cai, as long as he hewed down.
- lines:
  - pagur.1.36
  - pagur.1.36
  text: Arthur distributed gifts,
- lines:
  - pagur.1.37
  - pagur.1.37
  text: The blood trickled down.
- lines:
  - pagur.1.38
  - pagur.1.38
  text: In the hall of Awarnach,
- lines:
  - pagur.1.39
  - pagur.1.39
  text: Fighting with a hag,
- lines:
  - pagur.1.40
  - pagur.1.40
  text: He cleft the head of Palach.
- lines:
  - pagur.1.41
  - pagur.1.41
  text: In the fastnesses of Dissethach,
- lines:
  - pagur.1.42
  - pagur.1.42
  text: In Mynyd Eiddyn,
- lines:
  - pagur.1.43
  - pagur.1.43
  text: He contended with Cynvyn;
- lines:
  - pagur.1.44
  - pagur.1.44
  text: By the hundred there they fell,
- lines:
  - pagur.1.45
  - pagur.1.45
  text: There they fell by the hundred,
- lines:
  - pagur.1.46
  - pagur.1.46
  text: Before the accomplished Bedwyr.
- lines:
  - pagur.1.47
  - pagur.1.47
  text: On the strands of Trywruid,
- lines:
  - pagur.1.48
  - pagur.1.48
  text: Contending with Garwlwyd,
- lines:
  - pagur.1.49
  - pagur.1.49
  text: Brave was his disposition,
- lines:
  - pagur.1.50
  - pagur.1.50
  text: With sword and shield;
- lines:
  - pagur.1.51
  - pagur.1.51
  text: Vanity were the foremost men
- lines:
  - pagur.1.52
  - pagur.1.52
  text: Compared with Cai in the battle.
- lines:
  - pagur.1.53
  - pagur.1.53
  text: The sword in the battle
- lines:
  - pagur.1.54
  - pagur.1.54
  text: Was unerring in his hand.
- lines:
  - pagur.1.55
  - pagur.1.55
  text: They were stanch commanders
- lines:
  - pagur.1.56
  - pagur.1.56
  text: Of a legion for the benefit of the country—
- lines:
  - pagur.1.57
  - pagur.1.57
  text: Bedwyr and Bridlaw;
- lines:
  - pagur.1.58
  - pagur.1.58
  text: Nine hundred would to them listen;
- lines:
  - pagur.1.59
  - pagur.1.59
  text: Six hundred gasping for breath
- lines:
  - pagur.1.60
  - pagur.1.60
  text: Would be the cost of attacking them.
- lines:
  - pagur.1.61
  - pagur.1.61
  text: Servants I have had,
- lines:
  - pagur.1.62
  - pagur.1.62
  text: Better it was when they were.
- lines:
  - pagur.1.63
  - pagur.1.63
  text: Before the chiefs of Emrais
- lines:
  - pagur.1.64
  - pagur.1.64
  text: I saw Cai in haste.
- lines:
  - pagur.1.65
  - pagur.1.65
  text: Booty for chieftains
- lines:
  - pagur.1.66
  - pagur.1.66
  text: Was Gwrhir among foes;
- lines:
  - pagur.1.67
  - pagur.1.67
  text: Heavy was his vengeance,
- lines:
  - pagur.1.68
  - pagur.1.68
  text: Severe his advance.
- lines:
  - pagur.1.69
  - pagur.1.69
  text: When he drank from the horn,
- lines:
  - pagur.1.70
  - pagur.1.70
  text: He would drink with four.
- lines:
  - pagur.1.71
  - pagur.1.71
  text: To battle when he would come
- lines:
  - pagur.1.72
  - pagur.1.72
  text: By the hundred would he slaughter;
- lines:
  - pagur.1.73
  - pagur.1.73
  text: There was no day that would satisfy him.
- lines:
  - pagur.1.74
  - pagur.1.74
  text: Unmerited was the death of Cai.
- lines:
  - pagur.1.75
  - pagur.1.75
  text: Cai the fair, and Llachau,
- lines:
  - pagur.1.76
  - pagur.1.76
  text: Battles did they sustain,
- lines:
  - pagur.1.77
  - pagur.1.77
  text: Before the pang of blue shafts.
- lines:
  - pagur.1.78
  - pagur.1.78
  text: In the heights of Ystavingon
- lines:
  - pagur.1.79
  - pagur.1.79
  text: Cai pierced nine witches.
- lines:
  - pagur.1.80
  - pagur.1.80
  text: Cai the fair went to Mona,
- lines:
  - pagur.1.81
  - pagur.1.81
  text: To devastate Llewon.
- lines:
  - pagur.1.82
  - pagur.1.82
  text: His shield was ready
- lines:
  - pagur.1.83
  - pagur.1.83
  text: Against Cath Palug
- lines:
  - pagur.1.84
  - pagur.1.84
  text: When the people welcomed him.
- lines:
  - pagur.1.85
  - pagur.1.85
  text: Who pierced the Cath Palug?
- lines:
  - pagur.1.86
  - pagur.1.86
  text: Nine score before dawn
- lines:
  - pagur.1.87
  - pagur.1.87
  text: Would fall for its food.
- lines:
  - pagur.1.88
  - pagur.1.88
  text: Nine score chieftains.
