# Human overlay, written in the compact spec and expanded by weft overlay.
- by: "Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar"
  date: "2026-10-31"
  why: "all 88 lines. Hand lemma, morphology and gloss; no treebank exists for Middle Welsh verse. Lemmas are the headwords of Geiriadur Prifysgol Cymru (GPC) in modern spelling, verbs under the verbal noun, mutated forms under the radical, names in their conventional modern form; Welsh has no case, so nouns carry gender and number only. The glosses follow D. Silvan Evans's translation in Skene (1868) where it reads the Welsh plausibly and the modern readings (Sims-Williams 1991, Bromwich) where it does not; those modern readings were not checked here against the printed editions. The lines with a note carry a reading a reviewer should check first"
  status: "draft"
