# Notes for Pa gur yv y porthaur.
- id: n.pagur.poem
  attach: pagur.1.1
  kind: editorial
  status: draft
  text: "The poem is a dialogue at a gate. Arthur asks who the gatekeeper is; Glewlwyd Gafaelfawr ('Mighty-grip') names himself and asks in turn who comes; Arthur names himself and Cai, and to win entry praises his men and their deeds. It is poem 31 of the Black Book of Carmarthen, a manuscript of the mid-13th century, and one of the earliest Arthurian works in any vernacular. Its date is disputed: Jackson (1959) thought it older than the Norman period, Bromwich, Bollard and Jarman placed it in the 10th or 11th century, Koch allowed the 9th or 8th, and recent opinion (Sims-Williams 1991, Padel 2013) tends to about 1100."
- id: n.pagur.arthur
  attach: pagur.1.36
  kind: editorial
  status: draft
  text: "The Arthur of this poem is not the king of the later romances. He leads a war-band against hags, monsters and a werewolf, and his companions each bring their own powers; Cai and Bedwyr, later Sir Kay and Sir Bedivere, are the two named most. O. J. Padel (2013) compares the band to the fíana of early Irish literature. Several names belong to the world of the Four Branches of the Mabinogi: Mabon son of Modron (line 13; Skene prints mydron) and Manawydan son of Llŷr (line 19)."
- id: n.pagur.tryfrwyd
  attach: pagur.1.47
  kind: editorial
  status: draft
  text: "Trywruid, Tryfrwyd in modern spelling (lines 22 and 47), is the bellum Tribruit that the Historia Brittonum (9th century) lists among Arthur's twelve battles. There it is a battle in history; here it is fought against Garwlwyd ('rough-grey', a werewolf) and, by the modern reading of line 43, against cynbyn, 'dog-heads'. Evans in 1868 took chinbin as a name, 'Cynvyn'."
- id: n.pagur.servants
  attach: pagur.1.61
  kind: editorial
  status: draft
  text: "Gueisson am buyint. Oet guell banuitint: 'I had servants; it was better when they were alive' (Evans: 'Servants I have had, better it was when they were'). Arthur tells his companions' deeds in the past tense, and Padel (2013) and Sims-Williams (1991) read an elegiac note in it: the speaker may be a leader past his best years, his band diminished."
- id: n.pagur.cath
  attach: pagur.1.83
  kind: editorial
  status: draft
  text: "Cath Palug, 'Palug's cat', is a monster cat that the Welsh Triads also name. Later tradition has wildcats fought by Arthur or Kay: a 15th-century English story tells how Arthur defeated them by making them attack their own reflections in his shield, which Sims-Williams (1991) takes to explain why Cai's shield is said to be polished here (Evans: 'ready')."
- id: n.pagur.gatekeeper
  attach: pagur.1.2
  kind: editorial
  status: draft
  text: "Glewlwyd Gafaelfawr is Arthur's own gatekeeper in Culhwch and Olwen, where he questions Culhwch before letting him in; later in that tale a giant's gatekeeper questions Cai. Rachel Bromwich (1978) suggested the author of Culhwch was burlesquing this poem; others think both drew on the same tradition. A dialogue with a reluctant porter is common enough in medieval literature that the likeness may prove little."
- id: n.pagur.end
  attach: pagur.1.88
  kind: editorial
  status: draft
  text: "The poem breaks off here, at the foot of the leaf: 'Nine score champions...'. Skene notes that the manuscript is again defective; the next leaf is lost. The end of the fight with Cath Palug, and of the dialogue, does not survive."
