  lead: The Pyramid Texts are the oldest ancient Egyptian funerary texts, dating to the late Old Kingdom.
    They are the earliest known corpus of ancient Egyptian religious texts. Written in Old Egyptian, the
    Pyramid Texts were carved onto the subterranean walls and sarcophagi of pyramids at Saqqara from the
    end of the Fifth Dynasty, and throughout the Sixth Dynasty of the Old Kingdom, and into the Eighth
    Dynasty of the First Intermediate Period. The oldest of the texts have been dated to c. 2400–2300
    BCE.
