    # the evidence behind each vocalized form; the page shows it in the word's provenance.
    # Forms are Weft's inference from the named evidence, conjectural throughout
    vocalization:
      "pí.t": "Coptic (Sahidic) ⲡⲉ pe, 'sky': the stressed vowel i is inferred from the Coptic e; whether the feminine ending still carried a vowel is not shown"
      "nā́ṯir": "Coptic ⲛⲟⲩⲧⲉ noute, 'god': a long stressed ā, the usual source of Coptic ou in this position; the second vowel, reduced to e in Coptic, is written i and is uncertain"
      "naṯī́r.w": "Coptic ⲛⲧⲏⲣ ntēr, 'gods': stress on a long second vowel (Coptic ē); the first vowel is uncertain, and the plural ending, lost in Coptic, is read as u by rule"
      "jā́tj": "Coptic ⲉⲓⲱⲧ eiōt, 'father': initial y and a long stressed ā (Coptic ō); the final reed leaf is read as the vowel i"
      "múw.at": "Coptic ⲙⲁⲁⲩ maau, 'mother': stress on the first syllable; the vowels u and a are inferred and uncertain"
      "rín": "Coptic ⲣⲁⲛ ran, 'name' (ⲣⲁⲛ= before a suffix): Coptic a in a closed syllable from an earlier i"
      "Wánjs": "Greek Ὄννος (Onnos), the king's name in the Greek king lists derived from Manetho: stress on the first syllable, with the Greek o taken as the reflex of wa; the reed leaf is read as the vowel i"
      "níb": "Coptic ⲛⲓⲙ nim, 'every': the vowel i; the change of b to m is later"
      "ḥíkꜣ.w": "Coptic ϩⲓⲕ hik, 'magic' (singular): a stressed i; the ꜣ, lost in Coptic, is kept as a consonant of the period, and the plural ending is read as u by rule"
      "ẖī́.t": "Coptic ϩⲏ hē, 'belly': a long stressed vowel; ī for Coptic ē is an inference"
      "harā́w": "Coptic ϩⲟⲟⲩ hoou, 'day': stress on a long ā in the second syllable (Coptic oo); the first vowel is a guess"
      "rā́maṯ": "Coptic ⲣⲱⲙⲉ rōme, 'person': a long stressed ā (Coptic ō); the final e points to a reduced second vowel, written a"
      "ẖar": "Coptic ϩⲁ ha, 'under' (ϩⲁⲣⲟ= before a suffix): the vowel a; unstressed, as a preposition"
      "ḥir": "Coptic ϩⲓ hi, 'on': the vowel i; unstressed, as a preposition"
