# Weft edition of the opening of Pyramid Text 273 (the "Cannibal Hymn", Sethe's utterances 273-274)
# as carved on the east gable of the antechamber in the pyramid of Unas at Saqqara, columns 496-509
# in Sethe's numbering of the Unas texts. One Weft line is one column of the wall: line 1 is column
# 496, line 14 is column 509.
#
# The transliteration is the Thesaurus Linguae Aegyptiae's (text BRJCKLT7KNED5EKQX5DWGX3T4A, edited
# by Doris Topmann), from the TLA database excerpt of January 2018 (CC BY-SA 4.0) as distributed in
# the AES corpus (Simon D. Schweitzer). `weft draft` checks it verbatim against that file; the strip
# pattern below reduces the JSON to its sequence of written forms.
#
#   t    the TLA written form, verbatim (j for the reed leaf; a comma before the feminine t; .pl and
#        .du for endings the script leaves unwritten; brackets for sounds the editor restores)
#   tla  the TLA token id: lemma, part of speech, features and Gardiner sign codes are read from it
#   n    Weft's vocalization, hand-entered. Vowels and an acute accent on the stressed vowel appear
#        only where the evidence named under `vocalization` was used; otherwise n is the bare
#        transliteration in Egyptological letters, with unwritten plural endings supplied (.w, .wt)
joiner: " "
verify_in: sources/aes_bbawpyramidentexte.json
verify_strip: '(?m)^(?![ \t]*"written_form": ").*\n?|^[ \t]*"written_form": "|",?$'
