# Weft editorial translation of Unas columns 503-508, which Breasted (1912) leaves out. Literal and close
# to the gloss row; it leans on the TLA's German translation and word glosses. Draft. Words in
# parentheses are supplied for English sense; (?) marks a meaning the TLA also marks as uncertain.
# The first sentence begins at the end of column 502 ("the kas of"), inside Breasted's span; it is
# given here whole.
translation: weft-editorial
aligned_by: hand, phase 0; sentences joined at column boundaries
spans:
- lines: [pt.273.8, pt.273.9]
  text: "The kas of Unas are behind him, his hemsut are under his feet, his gods are over him, his uraei are on his brow. The guiding serpent of Unas is on his forehead, she who sees the ba, effective (?), as she burns (?)."
- lines: [pt.273.10, pt.273.12]
  text: "The powers of Unas are protecting him. Unas is the bull of the sky, raging in his heart, who lives on the form of every god, who eats their innards (?), (the gods) who came with their bellies filled with magic, on the Island of Flame. Unas is one who is equipped, who gathers his spirit-powers. Unas has appeared as this great one, lord of helpers; he sits with his back toward Geb."
- lines: [pt.273.13, pt.273.13]
  text: "Unas is one who judges his matter together with Hidden-of-Name, on this day of slaughtering the eldest. Unas is lord of offerings, who knots the rope, who makes his meal himself."
