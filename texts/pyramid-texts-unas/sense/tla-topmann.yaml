# Doris Topmann's German translation in the Thesaurus Linguae Aegyptiae (text BRJCKLT7KNED5EKQX5DWGX3T4A),
# verbatim from the TLA database excerpt of January 2018 (CC BY-SA 4.0) as distributed in the AES
# corpus. The TLA translates sentence by sentence; a sentence can run across two columns, so each span
# joins the sentences that end where a column ends. No corrections.
translation: tla-topmann
aligned_by: hand, phase 0; sentences joined at column boundaries
spans:
- lines: [pt.273.1, pt.273.9]
  text: "Der Himmel bewölkt sich, die Sterne verdunkeln sich (?), die Ausgespannte (scil. Weite des Himmels) schwankt, die Knochen der Erdgötter zittern und die Bewegungen(?) werden still, (denn) sie haben Unas gesehen, erschienen und ba-mächtig als Gott, der von seinen Vätern lebt und sich von seinen Müttern nährt. Unas ist der Herr der Weisheit(?), dessen Namen (sogar) seine Mutter nicht kennt. Unas' Herrlichkeit ist am Himmel, seine Macht ist im Horizont, wie (bei) Atum, seinem Vater, der ihn geschaffen hat. Er hat ihn geschaffen; (aber) er ist mächtiger als er. Unas' Kas sind hinter ihm. Seine Hemsut sind unter seinen Füßen. Seine Götter sind über ihm. Seine Uräen sind an seinem Scheitel. Unas' Geleiterin (Schlange) ist an seiner Stirn, sie, die die Ba(s) erspäht, die wirkungsvoll ist (?), indem sie versengt(?)."
- lines: [pt.273.10, pt.273.12]
  text: "Unas' Mächte sind dabei ihn zu schützen. Unas ist der Stier des Himmels, grimmig in seinem Charakter, der von der Gestalt eines jeden Gottes lebt, der ihre Eingeweide(?) ißt, (derer) die gekommen sind, nachdem ihr Bauch mit Zauberkräften gefüllt wurde auf der Flammeninsel. Unas ist einer, der ausgestattet ist, der seine Ach-Kräfte vereint. Unas ist als dieser Große erschienen, Herr von Gehilfen. Mit seinem Rücken zu Geb sitzt er da."
- lines: [pt.273.13, pt.273.13]
  text: "Unas ist einer, der seine Angelegenheit zusammen mit \"Dessen-Name-verborgen-ist\" entscheidet, an diesem Tag, da der Älteste geschlachtet wird. Unas ist Herr der Opfergaben, der das Tau knotet, der sein Opfermahl selbst bereitet."
- lines: [pt.273.14, pt.273.14]
  text: "Unas ist einer, der Menschen ißt und von Göttern lebt, ein Herr von Boten, der Aufträge erteilt. Der Scheitelpacker, der im Kessel(?) ist, ist es, der sie für Unas mit dem Lasso fängt."
