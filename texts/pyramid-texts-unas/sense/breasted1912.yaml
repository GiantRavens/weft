# James Henry Breasted, Development of Religion and Thought in Ancient Egypt (New York, 1912), lecture
# IV, pages 127-128, verbatim from the Internet Archive text of the University of Toronto copy
# (developmentofrel00breauoft). Breasted's line breaks are kept. Breasted spells the king's name Unis.
# Breasted marks uncertain renderings with half brackets; the OCR reads them as ^, ' and 1. Corrections,
# checked against the OCR of a second scan (developmentofrel00brea): "^porters1" -> "⌜porters⌝",
# "'despatches1" -> "⌜despatches⌝". The page footnote marks are dropped.
# Breasted omits the passage from the end of column 502 to column 508 and says so in a footnote
# ("an obscure description of the equipment of the dead king"); the first span therefore also covers
# the first words of column 502's last sentence ("the kas of"), which he does not translate.
translation: breasted1912
aligned_by: hand, phase 0; by content, one span per passage Breasted translates
spans:
- lines: [pt.273.1, pt.273.7]
  text: |-
    Clouds darken the sky,
    The stars rain down,
    The Bows (a constellation) stagger,
    The bones of the hell-hounds tremble,
    The ⌜porters⌝ are silent,
    When they see king Unis dawning as a soul,
    As a god living on his fathers,
    Feeding on his mothers.
    King Unis is lord of wisdom,
    Whose mother knows not his name.
    The honor of king Unis is in the sky,
    His might is in the horizon,
    Like Atum his father who begat him.
    When he begat him, he was stronger than he.
- lines: [pt.273.14, pt.273.14]
  text: |-
    King Unis is one who eats men and lives on gods,
    Lord of messengers, who ⌜despatches⌝ his messages;
    It is 'Grasper-of-Forelocks' living in Kehew
    Who binds them for king Unis.
