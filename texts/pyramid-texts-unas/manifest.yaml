work: pyramid-texts-unas
title: The Pyramid Texts of Unas, Pyramid Text 273 (the "Cannibal Hymn"), opening
author: Unknown priestly authors; carved for King Unas, last king of the Fifth Dynasty (reigned about 2375-2345 BC)
language: egy
