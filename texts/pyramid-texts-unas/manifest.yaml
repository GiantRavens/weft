treebank_note: "The TLA website (thesaurus-linguae-aegyptiae.de, corpus edition 20) is newer but is not openly licensed for bulk reuse; its license page allows quoting single records only. The Hugging Face release of TLA v18 (CC BY-SA 4.0) contains only intact single sentences without text identifiers, so it cannot reproduce a passage. The 2018 excerpt is the openly licensed release that keeps whole texts, with Sethe's column numbers."
