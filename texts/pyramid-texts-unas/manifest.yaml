predicted_gaps:
  - "PT 213 ('you have not gone away dead') was considered first; it is not among the Unas texts of the openly licensed 2018 TLA excerpt (and its sentences are absent from the filtered v18 release), so the Cannibal Hymn was chosen"
  - "no reconstruction for most words: Old Egyptian vowels are inferred, and Weft vocalizes only words whose Coptic descendant or Greek rendering was used (14 forms); the rest fall back to the Egyptological convention in the first scheme, flagged per token"
  - "four signs have no Unicode code point in the basic Egyptian Hieroglyphs block: TLA codes D140 and D207 (extended JSesh signs) are left out of the hieroglyph row (sign-not-in-unicode), and the variants D3B and O30U are shown as their base signs D3 and O30 (sign-variant-shown-as-base)"
  - "the hieroglyph row is a linear sequence of the TLA's sign codes; the grouping of signs in squares and their orientation on the wall are not reproduced"
  - "Breasted's 1912 translation omits columns 502-508; Weft supplies an editorial English draft for 503-508, and the TLA German covers all lines"
  - "the TLA 2018 excerpt predates later TLA revisions of this text; readings may differ from the current TLA website"
