  lead: 'The Declaration of the Rights of Woman and of the Female Citizen (French: Déclaration des droits
    de la femme et de la citoyenne), also known as the Declaration of the Rights of Woman, was written
    on 14 September 1791 by French activist, feminist, and playwright Olympe de Gouges in response to
    the 1789 Declaration of the Rights of Man and of the Citizen. By publishing this document on 15 September,
    de Gouges hoped to expose the failures of the French Revolution in the recognition of gender equality.
    As a constitutional monarchist opposed to the execution of the King, de Gouges was accused, tried
    and convicted of treason, resulting in her immediate execution, along with other Girondists.'
