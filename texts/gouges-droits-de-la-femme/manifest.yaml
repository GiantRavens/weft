predicted_gaps:
- no public-domain English translation was found (the text was little translated before the 1970s), so the page carries Weft's own,
  marked editorial and draft, with the 1979 Levy, Applewhite and Johnson translation cited
- 'no treebank covers the text: lemma and morphology are an automatic parse (spaCy fr_core_news_md 3.8, UD French-GSD conventions) corrected
  by hand, declared as such in the overlay; glosses are hand-written; all draft'
- the 1791 reading rests on Féraud (1787-88) and differs from modern French in little that this text shows (l mouillé in filles, famille, vieille,
  réveille-toi); it is approximate and says so
- the print's spelling is kept (loix, enfans, représentans, solemnelle, sur-tout, impreſcriptibles, the ampersand) with the modern spelling
  as n; the Wikisource transcription corrects soeurs and moeurs to the ligature, which the edition follows
- three lines cross a page of the pamphlet (the preamble, articles III and XI); the verbatim check reads the section's pages together
- the Postambule (pamphlet pages 11-22) keeps spellings the articles do not (étoit, foiblesse, François, tems, bisarre); its -oit
  and -oient forms are read as [ɛ], as by 1791 they were, and the print's l'à for là (twice) is kept and read as là
- the dedication to the queen (pages 3-4) and the postscript after the Postambule (a morning's journey from Auteuil to the printer,
  pages 22-24) are not included
