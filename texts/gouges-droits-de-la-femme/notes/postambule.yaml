# Notes on the Postambule and the Forme du contrat social (de Gouges, 1791). The three footnotes are the author's own,
# printed at the foot of pages 14, 19 and 22 of the pamphlet; they are quoted from the pinned Wikisource pages.
- id: n.ddf.pb1.cana
  attach: ddf.pb1.22
  kind: editorial
  status: draft
  leans_on: John 2.4
  text: 'The Lawgiver at the wedding at Cana is Christ, and his saying is the answer to his mother in John 2.4, "Woman,
    what have I to do with thee?" in the King James wording. The question de Gouges gives the legislators six lines on,
    "femmes, qu''y a-t-il de commun entre vous et nous?", takes the same form, with women for woman and us for me.'
- id: n.ddf.pb2.bernis.fn
  attach: ddf.pb2.15
  kind: quoted
  source: Olympe de Gouges, Les Droits de la femme (Paris, 1791), p. 14, footnote to "pontificat"
  text: "M. de Berais, de la façon de madame de Pompadour."
- id: n.ddf.pb2.bernis
  attach: ddf.pb2.15
  kind: editorial
  status: draft
  leans_on: the footnote as printed; the career of François-Joachim de Pierre de Bernis (1715-1794)
  text: 'The footnote reads Berais. The man meant is most likely the cardinal de Bernis, who owed his rise to minister
    of foreign affairs and to the cardinalate to Madame de Pompadour. "De la façon de" is "of the making of".'
- id: n.ddf.pb4.partages
  attach: ddf.pb3.55
  kind: editorial
  status: draft
  leans_on: the decree of 15 March 1790 and the law of 8 April 1791 on equal division of estates among heirs
  text: 'The égalité des partages is the equal division of an inheritance among the heirs, which the Constituent
    Assembly enacted in 1790 and 1791 in place of the rights of the eldest son. De Gouges grants that it helps a
    daughter of a rich family and asks what it gives a daughter of a poor one.'
- id: n.ddf.contrat.form
  attach: ddf.contrat.1
  kind: editorial
  status: draft
  leans_on: the text of the contract; the divorce law of 20 September 1792 for what the law later did
  text: 'The Forme du contrat social is a model act: N and N stand for the two names. It puts the couple''s property in
    common, gives children born outside the marriage the name and the property of the parents who acknowledge them,
    and sets out a division of the property if the couple separate. Marriage in 1791 could not be dissolved in France;
    the law permitting divorce came a year later, in September 1792.'
- id: n.ddf.pb5.agar.fn
  attach: ddf.pb5.17
  kind: quoted
  source: Olympe de Gouges, Les Droits de la femme (Paris, 1791), p. 19, footnote to "citations"
  text: "Abraham eut des enfans très-légitimes d’Agar, servante de sa femme."
- id: n.ddf.pb6.bonheur
  attach: ddf.pb6.8
  kind: editorial
  status: draft
  leans_on: the bibliography of de Gouges's printed works (the 1789 edition, Amsterdam and Paris, Royer)
  text: 'Le Bonheur primitif de l''homme is de Gouges''s own earlier pamphlet, Le Bonheur primitif de l''homme, ou les
    Rêveries patriotiques, printed in 1789; the text here dates it to 1788. Filles publiques and femmes publiques are prostitutes.'
- id: n.ddf.pb8.decret
  attach: ddf.pb8.2
  kind: editorial
  status: draft
  leans_on: the decree of the Constituent Assembly of 15 May 1791 and its repeal of 24 September 1791
  text: 'The decree in favour of the men of colour is the Assembly''s decree of 15 May 1791, which gave political
    rights in the colonies to free men of colour born of free parents. The colonists resisted it, and the Assembly
    repealed it on 24 September 1791, ten days after the Declaration was written. The text speaks of free men of colour
    and of the colonists who are their fathers; it does not discuss slavery itself here.'
- id: n.ddf.pb8.la
  attach: ddf.pb8.4
  kind: editorial
  status: draft
  leans_on: the pamphlet as transcribed on French Wikisource
  text: 'The print sets l''à twice for là (here and in the next line), and là correctly in the third clause. The page
    keeps the print; the modern spelling and the sound read là.'
- id: n.ddf.pb8.merville.fn
  attach: ddf.pb8.45
  kind: quoted
  source: Olympe de Gouges, Les Droits de la femme (Paris, 1791), p. 22, footnote to "femme"
  text: "Dans le souper magique de M. de Merville, Ninon demande quelle est la maitresse de Louis XVI ? On lui répond, c’est la Nation, cette maitresse corrompra le gouvernement si elle prend trop d’empire."
