# Notes on the Declaration of the Rights of Woman (1791).
- id: n.ddf.pre.mirror
  attach: ddf.pre.1
  kind: editorial
  status: draft
  leans_on: the Déclaration des droits de l'homme et du citoyen (26 August 1789), article by article; Olivier Blanc, Olympe de Gouges (1981, 2003)
  text: 'The text answers the Declaration of the Rights of Man and of the Citizen of 1789 article by article, keeping its numbering and much of its wording and inserting woman where man stood alone. Where
    the 1789 text says ''men are born and remain free and equal in rights'', article 1 here says ''Woman is born free and remains equal to man in rights''. The additions are the argument: the sex ''superior
    in beauty as in courage, in the sufferings of motherhood''; the scaffold and the Tribune of article 10; the unmarried mother of article 11; the equal share in taxation and administration of articles
    13 and 14.'
- id: n.ddf.pre.spelling
  attach: ddf.pre.2
  kind: editorial
  status: draft
  leans_on: the 1791 pamphlet as transcribed on French Wikisource; Féraud, Dictionnaire critique (1787-88)
  text: 'The page keeps the pamphlet''s spelling: loix, enfans, représentans, suivans, solemnelle, personellement, sur-tout, the long s of impreſcriptibles, and the printer''s ampersand. The word panel
    shows the modern spelling under ''normalized'', and the sound is built from it. The spelling reform that removed most of these forms is the Academy''s of 1835.'
- id: n.ddf.a10.echafaud
  attach: ddf.a10.2
  kind: editorial
  status: draft
  leans_on: the sentence of the Revolutionary Tribunal, 2 November 1793; Blanc 2003
  text: '''Woman has the right to mount the scaffold; she must equally have the right to mount the Tribune.'' De Gouges was tried for her printed writings against the Convention and guillotined on 3 November
    1793, two years after this sentence was printed.'
- id: n.ddf.a11.mere
  attach: ddf.a11.3
  kind: editorial
  status: draft
  leans_on: the Code civil of 1804, article 340 ('la recherche de la paternité est interdite'), for what the law later did
  text: Article 11 turns the freedom of speech of 1789 into a mother's right to name the father of her child. The civil code of 1804 went the other way and forbade the search for paternity, a rule that
    stood in France until 1912.
- id: n.ddf.a1.femme
  attach: ddf.a1.1.2
  kind: editorial
  status: draft
  leans_on: 'the 1789 text, article 1: ''Les hommes naissent et demeurent libres et égaux en droits'''
  text: Femme, capitalized by the printer here and in articles 2 and 6, where it stands beside Homme. The gloss gives 'woman'; 'female citizen' renders citoyenne, for which English has no single word.
- id: n.ddf.a17.fin
  attach: ddf.a17.1
  kind: editorial
  status: draft
  leans_on: 'the pamphlet''s table: Postambule and Forme du contrat social de l''homme et de la femme'
  text: The Declaration proper ends here. In the pamphlet it is followed by the Postambule, which opens 'Femme, réveille-toi', and by a model marriage contract; neither is in this passage yet.
