# Weft's editorial translation of the Declaration, close to the French, article by article; draft. The 1979
# translation by Levy, Applewhite and Johnson (University of Illinois Press) is in copyright and is cited on the page.
translation: weft-editorial
aligned_by: 'hand: one span per article; the preamble in two'
spans:
- lines:
  - ddf.pre.1
  - ddf.pre.20
  text: Mothers, daughters, sisters, representatives of the nation, ask to be constituted as a national assembly. Considering that ignorance, neglect or contempt of the rights of woman are the sole causes
    of public misfortune and of the corruption of governments, they have resolved to set out in a solemn declaration the natural, inalienable and sacred rights of woman, so that this declaration, held constantly
    before every member of the body social, may remind them without cease of their rights and their duties; so that the acts of the power of women and those of the power of men, being open at every moment
    to comparison with the end of every political institution, may be the more respected; so that the claims of female citizens, founded henceforth on simple and incontestable principles, may always turn
    to the upholding of the constitution, of good morals, and of the happiness of all.
- lines:
  - ddf.pre.21
  - ddf.pre.25
  text: In consequence, the sex superior in beauty as in courage, in the sufferings of motherhood, recognizes and declares, in the presence and under the auspices of the Supreme Being, the following Rights
    of Woman and of the Female Citizen.
- lines:
  - ddf.a1.1
  - ddf.a1.2
  text: Woman is born free and remains equal to man in rights. Social distinctions can be founded only on common utility.
- lines:
  - ddf.a2.1
  - ddf.a2.3
  text: 'The end of every political association is the preservation of the natural and imprescriptible rights of Woman and of Man: these rights are liberty, property, security, and above all resistance
    to oppression.'
- lines:
  - ddf.a3.1
  - ddf.a3.3
  text: 'The principle of all sovereignty resides essentially in the Nation, which is nothing but the union of Woman and Man: no body, no individual, may exercise any authority that does not expressly proceed
    from it.'
- lines:
  - ddf.a4.1
  - ddf.a4.3
  text: Liberty and justice consist in rendering to others all that belongs to them; thus the exercise of woman's natural rights has no bounds but the perpetual tyranny that man sets against it; these bounds
    are to be reformed by the laws of nature and of reason.
- lines:
  - ddf.a5.1
  - ddf.a5.5
  text: 'The laws of nature and of reason forbid all actions harmful to society: whatever is not forbidden by these laws, wise and divine, cannot be prevented, and no one can be compelled to do what they
    do not command.'
- lines:
  - ddf.a6.1
  - ddf.a6.11
  text: 'The Law must be the expression of the general will; all female and male citizens must take part in its formation, in person or through their representatives; it must be the same for all: all female
    citizens and all male citizens, being equal in its eyes, must be equally admissible to all dignities, places and public employments, according to their capacities, and with no other distinctions than
    those of their virtues and their talents.'
- lines:
  - ddf.a7.1
  - ddf.a7.4
  text: No woman is excepted; she is accused, arrested and detained in the cases determined by the Law. Women obey this rigorous Law as men do.
- lines:
  - ddf.a8.1
  - ddf.a8.2
  text: The law must establish only penalties that are strictly and evidently necessary, and no one may be punished except under a Law established and promulgated before the offence and lawfully applied
    to women.
- lines:
  - ddf.a9.1
  - ddf.a9.2
  text: Any woman being declared guilty, all rigour is exercised by the Law.
- lines:
  - ddf.a10.1
  - ddf.a10.4
  text: 'No one is to be troubled for her opinions, even fundamental ones: woman has the right to mount the scaffold; she must equally have the right to mount the Tribune, provided her manifestations do
    not disturb the public order established by the Law.'
- lines:
  - ddf.a11.1
  - ddf.a11.6
  text: The free communication of thoughts and opinions is one of the most precious rights of woman, since this liberty secures the legitimacy of fathers towards their children. Every female citizen may
    therefore say freely, I am the mother of a child who belongs to you, without a barbarous prejudice forcing her to hide the truth; save to answer for the abuse of this liberty in the cases determined
    by the Law.
- lines:
  - ddf.a12.1
  - ddf.a12.3
  text: The guarantee of the rights of woman and of the female citizen requires a greater utility; this guarantee must be instituted for the advantage of all, and not for the particular utility of those
    to whom it is entrusted.
- lines:
  - ddf.a13.1
  - ddf.a13.7
  text: For the upkeep of the public force and for the expenses of administration, the contributions of woman and of man are equal; she has her share in all the drudgeries, in all the painful tasks; she
    must therefore have the same share in the distribution of places, employments, offices, dignities and industry.
- lines:
  - ddf.a14.1
  - ddf.a14.8
  text: Female and male citizens have the right to ascertain for themselves, or through their representatives, the necessity of the public contribution. Female citizens can consent to it only through the
    admission of an equal share, not only in wealth but also in public administration, and in determining the amount, the basis, the collection and the duration of the tax.
- lines:
  - ddf.a15.1
  - ddf.a15.5
  text: The mass of women, joined for purposes of contribution with that of men, has the right to demand an account of his administration from every public agent.
- lines:
  - ddf.a16.1
  - ddf.a16.6
  text: Any society in which the guarantee of rights is not secured, nor the separation of powers determined, has no constitution; the constitution is void if the majority of the individuals who make up
    the Nation have not cooperated in drafting it.
- lines:
  - ddf.a17.1
  - ddf.a17.5
  text: Property belongs to both sexes, united or separate; it is for each an inviolable and sacred right; no one may be deprived of it, as the true patrimony of nature, except when public necessity, lawfully
    ascertained, evidently requires it, and on condition of a just and prior indemnity.
