# Weft's editorial translation of the Declaration and its Postambule, close to the French; draft. The 1979
# translation by Levy, Applewhite and Johnson (University of Illinois Press) is in copyright and is cited on the page.
translation: weft-editorial
aligned_by: 'hand: one span per article; the preamble in two; the Postambule and the contract in spans of whole sentences'
spans:
- lines:
  - ddf.pre.1
  - ddf.pre.20
  text: Mothers, daughters, sisters, representatives of the nation, ask to be constituted as a national assembly. Considering that ignorance, neglect or contempt of the rights of woman are the sole causes
    of public misfortune and of the corruption of governments, they have resolved to set out in a solemn declaration the natural, inalienable and sacred rights of woman, so that this declaration, held constantly
    before every member of the body social, may remind them without cease of their rights and their duties; so that the acts of the power of women and those of the power of men, being open at every moment
    to comparison with the end of every political institution, may be the more respected; so that the claims of female citizens, founded henceforth on simple and incontestable principles, may always turn
    to the upholding of the constitution, of good morals, and of the happiness of all.
- lines:
  - ddf.pre.21
  - ddf.pre.25
  text: In consequence, the sex superior in beauty as in courage, in the sufferings of motherhood, recognizes and declares, in the presence and under the auspices of the Supreme Being, the following Rights
    of Woman and of the Female Citizen.
- lines:
  - ddf.a1.1
  - ddf.a1.2
  text: Woman is born free and remains equal to man in rights. Social distinctions can be founded only on common utility.
- lines:
  - ddf.a2.1
  - ddf.a2.3
  text: 'The end of every political association is the preservation of the natural and imprescriptible rights of Woman and of Man: these rights are liberty, property, security, and above all resistance
    to oppression.'
- lines:
  - ddf.a3.1
  - ddf.a3.3
  text: 'The principle of all sovereignty resides essentially in the Nation, which is nothing but the union of Woman and Man: no body, no individual, may exercise any authority that does not expressly proceed
    from it.'
- lines:
  - ddf.a4.1
  - ddf.a4.3
  text: Liberty and justice consist in rendering to others all that belongs to them; thus the exercise of woman's natural rights has no bounds but the perpetual tyranny that man sets against it; these bounds
    are to be reformed by the laws of nature and of reason.
- lines:
  - ddf.a5.1
  - ddf.a5.5
  text: 'The laws of nature and of reason forbid all actions harmful to society: whatever is not forbidden by these laws, wise and divine, cannot be prevented, and no one can be compelled to do what they
    do not command.'
- lines:
  - ddf.a6.1
  - ddf.a6.11
  text: 'The Law must be the expression of the general will; all female and male citizens must take part in its formation, in person or through their representatives; it must be the same for all: all female
    citizens and all male citizens, being equal in its eyes, must be equally admissible to all dignities, places and public employments, according to their capacities, and with no other distinctions than
    those of their virtues and their talents.'
- lines:
  - ddf.a7.1
  - ddf.a7.4
  text: No woman is excepted; she is accused, arrested and detained in the cases determined by the Law. Women obey this rigorous Law as men do.
- lines:
  - ddf.a8.1
  - ddf.a8.2
  text: The law must establish only penalties that are strictly and evidently necessary, and no one may be punished except under a Law established and promulgated before the offense and lawfully applied
    to women.
- lines:
  - ddf.a9.1
  - ddf.a9.2
  text: Any woman being declared guilty, all rigor is exercised by the Law.
- lines:
  - ddf.a10.1
  - ddf.a10.4
  text: 'No one is to be troubled for her opinions, even fundamental ones: woman has the right to mount the scaffold; she must equally have the right to mount the Tribune, provided her manifestations do
    not disturb the public order established by the Law.'
- lines:
  - ddf.a11.1
  - ddf.a11.6
  text: The free communication of thoughts and opinions is one of the most precious rights of woman, since this liberty secures the legitimacy of fathers towards their children. Every female citizen may
    therefore say freely, I am the mother of a child who belongs to you, without a barbarous prejudice forcing her to hide the truth; save to answer for the abuse of this liberty in the cases determined
    by the Law.
- lines:
  - ddf.a12.1
  - ddf.a12.3
  text: The guarantee of the rights of woman and of the female citizen requires a greater utility; this guarantee must be instituted for the advantage of all, and not for the particular utility of those
    to whom it is entrusted.
- lines:
  - ddf.a13.1
  - ddf.a13.7
  text: For the upkeep of the public force and for the expenses of administration, the contributions of woman and of man are equal; she has her share in all the drudgeries, in all the painful tasks; she
    must therefore have the same share in the distribution of places, employments, offices, dignities and industry.
- lines:
  - ddf.a14.1
  - ddf.a14.8
  text: Female and male citizens have the right to ascertain for themselves, or through their representatives, the necessity of the public contribution. Female citizens can consent to it only through the
    admission of an equal share, not only in wealth but also in public administration, and in determining the amount, the basis, the collection and the duration of the tax.
- lines:
  - ddf.a15.1
  - ddf.a15.5
  text: The mass of women, joined for purposes of contribution with that of men, has the right to demand an account of his administration from every public agent.
- lines:
  - ddf.a16.1
  - ddf.a16.6
  text: Any society in which the guarantee of rights is not secured, nor the separation of powers determined, has no constitution; the constitution is void if the majority of the individuals who make up
    the Nation have not cooperated in drafting it.
- lines:
  - ddf.a17.1
  - ddf.a17.5
  text: Property belongs to both sexes, united or separate; it is for each an inviolable and sacred right; no one may be deprived of it, as the true patrimony of nature, except when public necessity, lawfully
    ascertained, evidently requires it, and on condition of a just and prior indemnity.
- lines:
  - ddf.pb1.1
  - ddf.pb1.3
  text: "Woman, wake up; the tocsin of reason is sounding throughout the universe; recognize your rights."
- lines:
  - ddf.pb1.4
  - ddf.pb1.6
  text: "The mighty empire of nature is no longer surrounded by prejudice, fanaticism, superstition and lies. The torch of truth has dispelled all the clouds of folly and usurpation."
- lines:
  - ddf.pb1.7
  - ddf.pb1.9
  text: "Man the slave has multiplied his strength and has needed to resort to yours to break his chains. Once free, he has become unjust towards his companion."
- lines:
  - ddf.pb1.10
  - ddf.pb1.14
  text: "O women! women, when will you cease to be blind? What are the advantages you have gathered in the revolution? A more marked contempt, a more pronounced disdain."
- lines:
  - ddf.pb1.15
  - ddf.pb1.18
  text: "In the centuries of corruption you reigned only over the weakness of men. Your empire is destroyed; what then is left to you? The conviction of man's injustices."
- lines:
  - ddf.pb1.19
  - ddf.pb1.22
  text: "The claim to your patrimony, founded on the wise decrees of nature: what would you have to fear in so fine an undertaking? The saying of the Lawgiver at the wedding at Cana?"
- lines:
  - ddf.pb1.23
  - ddf.pb1.29
  text: "Do you fear that our French legislators, correctors of that morality, long hung on the branches of politics but no longer in season, will say to you again: women, what is there in common between you and us? Everything, you would have to answer."
- lines:
  - ddf.pb1.30
  - ddf.pb1.37
  text: "If in their weakness they persisted in setting this inconsistency against their principles, courageously oppose the force of reason to their vain pretensions of superiority; unite under the standards of philosophy; deploy all the energy of your character, and you will soon see these proud men, no longer servile adorers crawling at your feet, but proud to share with you the treasures of the Supreme Being."
- lines:
  - ddf.pb1.38
  - ddf.pb1.40
  text: "Whatever the barriers set against you, it is in your power to overcome them; you have only to will it."
- lines:
  - ddf.pb1.41
  - ddf.pb1.44
  text: "Let us pass now to the frightful picture of what you have been in society; and since there is talk at this moment of a national education, let us see whether our wise legislators will think soundly about the education of women."
- lines:
  - ddf.pb2.1
  - ddf.pb2.2
  text: "Women have done more harm than good. Constraint and dissimulation have been their lot."
- lines:
  - ddf.pb2.3
  - ddf.pb2.6
  text: "What force had taken from them, cunning gave back; they had recourse to all the resources of their charms, and the most irreproachable man did not resist them."
- lines:
  - ddf.pb2.7
  - ddf.pb2.9
  text: "Poison, the blade, everything was subject to them; they commanded crime as they commanded virtue."
- lines:
  - ddf.pb2.10
  - ddf.pb2.15
  text: "The French government above all depended for centuries on the nocturnal administration of women; the cabinet had no secret from their indiscretion: embassy, command, ministry, presidency, pontificate, cardinalate;"
- lines:
  - ddf.pb2.16
  - ddf.pb2.19
  text: "in short, everything that marks the folly of men, profane and sacred, has been subject to the greed and ambition of this sex, once contemptible and respected, and since the revolution respectable and despised."
- lines:
  - ddf.pb3.1
  - ddf.pb3.4
  text: "In this sort of antithesis, how many remarks I could offer! I have only a moment to make them, but this moment will fix the attention of the most distant posterity."
- lines:
  - ddf.pb3.5
  - ddf.pb3.7
  text: "Under the old regime all was vicious, all was guilty; but could one not see the improvement of things in the very substance of the vices?"
- lines:
  - ddf.pb3.8
  - ddf.pb3.10
  text: "A woman needed only to be beautiful or amiable; when she had these two advantages, she saw a hundred fortunes at her feet."
- lines:
  - ddf.pb3.11
  - ddf.pb3.16
  text: "If she did not profit by them, she had an odd character, or an uncommon philosophy that led her to scorn riches; then she was regarded only as wrong-headed. The most indecent made herself respected with gold;"
- lines:
  - ddf.pb3.17
  - ddf.pb3.22
  text: "the trade in women was a kind of industry accepted in the highest class, which from now on will have no more credit. If it still had any, the revolution would be lost, and in new relations we would still be corrupt;"
- lines:
  - ddf.pb3.23
  - ddf.pb3.24
  text: "yet can reason hide from itself that every other road to fortune is closed to the woman whom man buys, like the slave on the coasts of Africa?"
- lines:
  - ddf.pb3.25
  - ddf.pb3.30
  text: "The difference is great; that is known. The slave commands the master; but if the master gives her her liberty without reward, and at an age when the slave has lost all her charms, what becomes of this unfortunate woman?"
- lines:
  - ddf.pb3.31
  - ddf.pb3.35
  text: "The plaything of contempt; even the doors of charity are closed to her; she is poor and old, they say; why did she not know how to make her fortune?"
- lines:
  - ddf.pb3.36
  - ddf.pb3.44
  text: "Other examples, more touching still, present themselves to reason. A young person without experience, seduced by a man she loves, will leave her parents to follow him; the ingrate will leave her after a few years, and the longer she has grown old with him, the more inhuman his inconstancy; if she has children, he will abandon her just the same."
- lines:
  - ddf.pb3.45
  - ddf.pb3.50
  text: "If he is rich, he will think himself exempt from sharing his fortune with his noble victims. If some engagement binds him to his duties, he will violate its force, hoping everything from the laws. If he is married, every other engagement loses its rights."
- lines:
  - ddf.pb3.51
  - ddf.pb3.53
  text: "What laws, then, remain to be made to root out vice to the very root? That of the division of fortunes between men and women, and of public administration."
- lines:
  - ddf.pb3.54
  - ddf.pb3.59
  text: "It is easily seen that a woman born of a rich family gains much from equal shares of inheritance. But a woman born of a poor family, with merit and virtues: what is her lot? Poverty and disgrace."
- lines:
  - ddf.pb3.60
  - ddf.pb3.62
  text: "If she does not happen to excel in music or painting, she cannot be admitted to any public office, even if she had every capacity for it."
- lines:
  - ddf.pb3.63
  - ddf.pb3.65
  text: "I wish to give only a glimpse of things; I will go into them in the new edition of my political works, which I propose to give to the public in a few days, with notes."
- lines:
  - ddf.pb4.1
  - ddf.pb4.4
  text: "I return to my text on morals. Marriage is the tomb of trust and love. The married woman can with impunity give bastards to her husband, and a fortune that does not belong to them."
- lines:
  - ddf.pb4.5
  - ddf.pb4.8
  text: "The woman who is not married has only a weak right: the old and inhuman laws refused her, for her children, that right to the name and to the property of their father, and no new laws have been made on this matter."
- lines:
  - ddf.pb4.9
  - ddf.pb4.12
  text: "If to try to give my sex an honourable and just standing is considered at this moment a paradox on my part, and an attempt at the impossible, I leave to the men to come the glory of treating this matter;"
- lines:
  - ddf.pb4.13
  - ddf.pb4.14
  text: "but meanwhile it can be prepared for by national education, by the restoration of morals and by conjugal agreements."
- lines:
  - ddf.contrat.1
  - ddf.contrat.5
  text: "We, N and N, moved by our own will, unite ourselves for the term of our life and for the duration of our mutual inclinations, on the following conditions:"
- lines:
  - ddf.contrat.6
  - ddf.contrat.8
  text: "We intend and wish to place our fortunes in common, reserving however the right to separate them in favour of our children and of those we might have by a particular attachment,"
- lines:
  - ddf.contrat.9
  - ddf.contrat.12
  text: "recognizing mutually that our property belongs directly to our children, from whatever bed they come, and that all without distinction have the right to bear the name of the fathers and mothers who have acknowledged them; and we bind ourselves to subscribe to the law that punishes the renunciation of one's own blood."
- lines:
  - ddf.contrat.13
  - ddf.contrat.16
  text: "We equally oblige ourselves, in case of separation, to divide our fortune and to set aside the portion of our children fixed by the law;"
- lines:
  - ddf.contrat.17
  - ddf.contrat.22
  text: "and, in case of a perfect union, the one who came to die would give up half of his property in favour of his children; and if one died without children, the survivor would inherit by right, unless the dying one had disposed of half the common property in favour of whomever he thought fit."
- lines:
  - ddf.pb5.1
  - ddf.pb5.4
  text: "This, more or less, is the form of the conjugal act whose execution I propose. On reading this odd writing I see rising against me the hypocrites, the prudes, the clergy and the whole infernal crew."
- lines:
  - ddf.pb5.5
  - ddf.pb5.6
  text: "But how many moral means it will offer the wise for reaching the perfectibility of a happy government! I will give the physical proof of it in a few words."
- lines:
  - ddf.pb5.7
  - ddf.pb5.11
  text: "The rich Epicurean without children finds it very well to go to his poor neighbour's and enlarge his family. When there is a law that authorizes the poor man's wife to have the rich man adopt her children, the bonds of society will be drawn tighter and morals made purer."
- lines:
  - ddf.pb5.12
  - ddf.pb5.15
  text: "This law will perhaps preserve the good of the community, and hold back the disorder that leads so many victims into the hospices of disgrace, of baseness and of the degeneration of human principles, where nature has long groaned."
- lines:
  - ddf.pb5.16
  - ddf.pb5.17
  text: "Let the detractors of sound philosophy then cease to cry out against primitive morals, or let them go and lose themselves in the source of their citations."
- lines:
  - ddf.pb6.1
  - ddf.pb6.3
  text: "I would also like a law that favoured widows and young women deceived by the false promises of a man to whom they had attached themselves; I would like, I say, this law to compel an inconstant man to keep his engagements, or to pay an indemnity proportional to his fortune."
- lines:
  - ddf.pb6.4
  - ddf.pb6.6
  text: "I would like this law to be rigorous against women as well, at least against those who had the effrontery to resort to a law they had themselves broken by their misconduct, if the proof of it were made."
- lines:
  - ddf.pb6.7
  - ddf.pb6.9
  text: "I would like at the same time, as I set out in Le Bonheur primitif de l'homme in 1788, that prostitutes be placed in designated quarters."
- lines:
  - ddf.pb6.10
  - ddf.pb6.13
  text: "It is not the public women who contribute most to the depravation of morals, it is the women of society. By restoring the latter, one changes the former."
- lines:
  - ddf.pb6.14
  - ddf.pb6.16
  text: "This chain of fraternal union will at first bring disorder, but in its consequences it will in the end produce a perfect whole."
- lines:
  - ddf.pb7.1
  - ddf.pb7.6
  text: "I offer an invincible means of raising the soul of women: it is to join them to all the exercises of man. If man persists in finding this means impracticable, let him share with woman, not at his whim but by the wisdom of the laws."
- lines:
  - ddf.pb7.7
  - ddf.pb7.11
  text: "Prejudice falls, morals are purified, and nature takes back all her rights. Add to this the marriage of priests, the King steadied on his throne, and the French government could no longer perish."
- lines:
  - ddf.pb8.1
  - ddf.pb8.3
  text: "It was very necessary for me to say a few words on the troubles that the decree in favour of the men of colour causes, they say, in our islands."
- lines:
  - ddf.pb8.4
  - ddf.pb8.7
  text: "It is there that nature shudders with horror; it is there that reason and humanity have not yet touched hardened souls; it is there above all that division and discord stir their inhabitants."
- lines:
  - ddf.pb8.8
  - ddf.pb8.10
  text: "It is not hard to guess the instigators of these incendiary fermentations: there are some in the very bosom of the National Assembly; they light in Europe the fire that must set America ablaze."
- lines:
  - ddf.pb8.11
  - ddf.pb8.13
  text: "The colonists claim to reign as despots over men whose fathers and brothers they are; and, disregarding the rights of nature, they pursue its source into the smallest tint of their blood."
- lines:
  - ddf.pb8.14
  - ddf.pb8.19
  text: "These inhuman colonists say: our blood flows in their veins, but we will shed it all, if need be, to glut our greed or our blind ambition."
- lines:
  - ddf.pb8.20
  - ddf.pb8.24
  text: "It is in these places nearest to nature that the father disowns the son; deaf to the cries of blood, he stifles all its charms; what can one hope from the resistance set against it?"
- lines:
  - ddf.pb8.25
  - ddf.pb8.28
  text: "To constrain it with violence is to make it terrible; to leave it still in irons is to send every calamity on to America."
- lines:
  - ddf.pb8.29
  - ddf.pb8.35
  text: "A divine hand seems to spread everywhere man's birthright, liberty; the law alone has the right to repress this liberty if it degenerates into licence; but the law must be equal for all, and it is the law above all that must hold the National Assembly to its decree, dictated by prudence and by justice."
- lines:
  - ddf.pb8.36
  - ddf.pb8.38
  text: "May it act the same for the state of France, and become as attentive to the new abuses as it has been to the old, which grow more frightful every day!"
- lines:
  - ddf.pb8.39
  - ddf.pb8.43
  text: "My opinion would further be to reconcile the executive power with the legislative power, for it seems to me that the one is everything and the other nothing; from which will come, unhappily perhaps, the loss of the French Empire."
- lines:
  - ddf.pb8.44
  - ddf.pb8.47
  text: "I consider these two powers as man and woman, who must be united, but equal in strength and in virtue, to make a good household."
