# Weft edition of the Déclaration des droits de la femme et de la citoyenne (Olympe de Gouges, Paris, September
# 1791): the preamble and the seventeen articles. Text as printed in the 1791 pamphlet (Les Droits de la femme.
# À la reine), transcribed on French Wikisource page by page (Page:De Gouges - Les Droits de la femme, 1791.djvu/8-13,
# validated); each line is checked verbatim against the pinned page revisions, a section naming its pages in order
# so a line that crosses a page is found. verify_strip sets aside the wiki templates ({{corr|soeurs|sœurs}} leaves
# the corrected word), tags and italics.
#
# The print keeps its 1791 spelling: loix, enfans, représentans, suivans, solemnelle, personellement, sur-tout,
# the long s of impreſcriptibles, and the ampersand. Those tokens carry n, the modern spelling the lexicon is
# keyed by; the page shows the print and sounds the word.
#   t     the word as printed, punctuation attached; an elision (l’, d’, qu’) is its own token, glued to the next
#   n     the modern spelling where the print differs
#   p     punctuation the print sets off by a space (French " :" and " ;")
#   Lines are Weft's division of the text at its stops and commas; sections are the preamble and the articles.
work: gouges-droits-de-la-femme
joiner: ' '
verify_strip: \{\{corr\|[^|}]*\||\{\{[^{}]*\}\}|\}\}|<[^>]+>|''|__NOTOC__
