# Notes for Descartes's statement of the cogito (Principia philosophiae, 1644, part 1, section 7).
- id: n.sci.sound
  attach: sci.descartes.1
  kind: editorial
  status: draft
  text: "Early-modern scholars read Latin in their own country's manner, so the default reading follows each author. Descartes, schooled by the Jesuits at La Flèche, would have read it the French way: French vowels, nasal an and on, soft c and g, and stress on the last syllable. Newton, at Cambridge, would have read it the English way; his laws of motion have their own page in the library. Both are reconstructions from grammars of the time; treat them as approximate. The classical reading is the second choice in the Loom."
- id: n.sci.cogito
  attach: sci.descartes.3
  kind: editorial
  status: draft
  text: "Descartes first published the thought in French, in the Discourse on Method (1637): je pense, donc je suis. The Meditations (1641) put it as ego sum, ego existo. This Latin form, ego cogito, ergo sum, is the one from the Principles of Philosophy (1644), and the one that became proverbial."
