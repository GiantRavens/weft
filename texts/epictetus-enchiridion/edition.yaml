# Weft edition of Epictetus, Enchiridion 1.1-3, from the Perseus text (Schenkl), checked verbatim
# against it. One line per sentence; the long sentence of 1.3 is divided at its turn, ἐὰν δὲ.
joiner: ' '
verify_in: sources/perseus-grc2.xml
verify_strip: <[^>]+>
sections:
- id: '1.1'
  title: Chapter 1, section 1
  lines:
  - τῶν ὄντων τὰ μέν ἐστιν ἐφʼ ἡμῖν, τὰ δὲ οὐκ ἐφʼ ἡμῖν.
  - ἐφʼ ἡμῖν μὲν ὑπόληψις, ὁρμή, ὄρεξις, ἔκκλισις καὶ ἑνὶ λόγῳ ὅσα ἡμέτερα ἔργα·
  - οὐκ ἐφʼ ἡμῖν δὲ τὸ σῶμα, ἡ κτῆσις, δόξαι, ἀρχαὶ καὶ ἑνὶ λόγῳ ὅσα οὐχ ἡμέτερα ἔργα.
- id: '1.2'
  title: Chapter 1, section 2
  lines:
  - καὶ τὰ μὲν ἐφʼ ἡμῖν ἐστι φύσει ἐλεύθερα, ἀκώλυτα, ἀπαραπόδιστα, τὰ δὲ οὐκ ἐφʼ ἡμῖν ἀσθενῆ, δοῦλα, κωλυτά, ἀλλότρια.
- id: '1.3'
  title: Chapter 1, section 3
  lines:
  - μέμνησο οὖν, ὅτι, ἐὰν τὰ φύσει δοῦλα ἐλεύθερα οἰηθῇς καὶ τὰ ἀλλότρια ἴδια, ἐμποδισθήσῃ, πενθήσεις, ταραχθήσῃ, μέμψῃ καὶ θεοὺς καὶ ἀνθρώπους,
  - ἐὰν δὲ τὸ σὸν μόνον οἰηθῇς σὸν εἶναι, τὸ δὲ ἀλλότριον, ὥσπερ ἐστίν, ἀλλότριον, οὐδείς σε ἀναγκάσει οὐδέποτε, οὐδείς σε κωλύσει, οὐ μέμψῃ οὐδένα, οὐκ ἐγκαλέσεις τινί, ἄκων πράξεις οὐδὲ ἕν, οὐδείς σε βλάψει, ἐχθρὸν οὐχ ἕξεις, οὐδὲ γὰρ βλαβερόν τι πείσῃ.
