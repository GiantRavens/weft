- by: Claude Opus 5.5 (Weft phase 0), for review by Skip and a scholar
  date: 2026-10-17
  why: "corrections to the GLAUx automatic parse in 1.4-1.5: τεύξῃ filed under τεύχω and ἀποτεύξη under a nonexistent ἀποτεξαίνω (both are futures of the τυγχάνω family, the second misread as an aorist passive third person), ταῦτʼ given as a subject where it is the object, and agreement with a referent outside the phrase (neuter things, masculine κανών, the masculine subject of an infinitive)"
  status: draft
  set:
    ench.1.4.1.9: {morph: v-srpema-}   # κεκινημένον: masculine accusative, the subject of ἅπτεσθαι
    ench.1.4.1.11: {morph: a-p---ng-}   # αὐτῶν: the things, neuter
    ench.1.4.2.13: {morph: a-p---ng-}   # αὐτῶν τούτων: neuter
    ench.1.4.2.15: {lemma: τυγχάνω}   # τεύξῃ
    ench.1.4.2.19: {morph: l-p---ng-}   # τῶν προτέρων: the former things, neuter
    ench.1.4.2.20: {morph: a-p---ng-}
    ench.1.4.2.26: {lemma: ἀποτυγχάνω, morph: v2sfim---}   # ἀποτεύξη, Schenkl without iota subscript: future middle, second person
    ench.1.5.2.13: {morph: a-s---md-}   # τούτῳ agrees with κανόνι
    ench.1.4.2.4: {morph: a-p---na-}   # ταῦτʼ: object of ἐθέλῃς (GLAUx itself marks it OBJ)
