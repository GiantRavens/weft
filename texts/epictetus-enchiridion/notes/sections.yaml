# Notes for Epictetus, Enchiridion 1. Editorial notes are drafts until a reviewer lifts them.
- id: n.ench.arrian
  attach: ench.1.1.1
  kind: editorial
  status: draft
  text: "Epictetus, born a slave in Phrygia and later freed, taught Stoic philosophy at Nicopolis in northwest Greece. He wrote nothing himself. His student Arrian recorded his teaching in the Discourses and drew this short Handbook (Enchiridion) from them, as a summary that could be carried in the hand."
- id: n.ench.eph-hemin
  attach: ench.1.1.1.6
  kind: editorial
  status: draft
  text: "ἐφʼ ἡμῖν, literally 'upon us', means 'up to us', within our power. The Handbook turns on this division. On one side Epictetus puts judgment (ὑπόληψις), the impulse to act (ὁρμή), desire (ὄρεξις) and aversion (ἔκκλισις): movements of one's own mind. Everything else, the body included, is on the other side."
- id: n.ench.sound
  attach: ench.1.1.1.1
  kind: editorial
  status: draft
  leans_on: "Geoffrey Horrocks, Greek: A History of the Language and its Speakers (2nd ed., 2010), chapter 5"
  text: "Epictetus taught in the Greek of the early second century AD, Koine, which sounded unlike the Attic of four centuries before. The default sound row follows that reconstruction: vowel length is no longer distinguished, ει and ι are both i, αι is e, β is v, and the accent is a stress rather than a rise in pitch. The restored classical scheme is offered second, for comparison."
- id: n.ench.parse
  attach: ench.1.3.2.42
  kind: editorial
  status: draft
  text: "πείσῃ is the future of πάσχω, 'suffer', not of πείθω, 'persuade', whose forms it resembles. The automatic parse chose πείθω. Weft corrects it here. Sections 1 to 3 needed ten corrections to lemma or tense, and sections 4 and 5 nine more, to lemma, tense, gender or case, among them τεύξῃ and ἀποτεύξη, futures of τυγχάνω, 'obtain', and ἀποτυγχάνω, 'fail to obtain', which the parse filed under other verbs; each is recorded in the curated overlay and marked draft."
- id: n.ench.phantasia
  attach: ench.1.5.1.4
  kind: editorial
  status: draft
  leans_on: "A. A. Long and D. N. Sedley, The Hellenistic Philosophers (1987), vol. 1, section 39; the two translations on this page"
  text: "φαντασία, glossed here 'impression', is the Stoic term for the way a thing presents itself to the mind: what seems to be so, before any judgment about it. Long renders it 'appearance' and Higginson 'semblance'. The instruction in this section rests on the division the chapter opened with. The impression itself arrives without being chosen; the assent to it, the judgment that it is true and that it matters, is one of the things 'upon us'. Saying to a harsh impression 'you are an impression, and not altogether the thing that appears' separates the two. The closing words, οὐδὲν πρὸς ἐμέ, 'nothing to me', are what one is to have ready when the thing belongs to the other side of the division."
