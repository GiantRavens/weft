# George Long, The Encheiridion, or Manual, chapter I (1877), from Project Gutenberg #10661. Long printed
# three Greek words in parentheses; Gutenberg transliterates them ([Greek: hupolaepsis]), and they are
# restored here in Greek letters from the edition.
translation: long1877
aligned_by: hand, phase 0
spans:
- lines:
  - ench.1.1.1
  - ench.1.1.3
  text: Of things some are in our power, and others are not. In our power are opinion (ὑπόληψις), movement towards a thing (ὁρμή), desire, aversion (ἔκκλισις), turning from a thing; and in a word, whatever
    are our acts. Not in our power are the body, property, reputation, offices (magisterial power), and in a word, whatever are not our own acts.
- lines:
  - ench.1.2.1
  - ench.1.2.1
  text: And the things in our power are by nature free, not subject to restraint or hindrance; but the things not in our power are weak, slavish, subject to restraint, in the power of others.
- lines:
  - ench.1.3.1
  - ench.1.3.2
  text: Remember then, that if you think the things which are by nature slavish to be free, and the things which are in the power of others to be your own, you will be hindered, you will lament, you will
    be disturbed, you will blame both gods and men; but if you think that only which is your own to be your own, and if you think that what is another’s, as it really is, belongs to another, no man will
    ever compel you, no man will hinder you, you will never blame any man, you will accuse no man, you will do nothing involuntarily (against your will), no man will harm you, you will have no enemy, for
    you will not suffer any harm.
- lines:
  - ench.1.4.1
  - ench.1.4.1
  text: "If then you desire (aim at) such great things remember that you must not (attempt to) lay hold of them with a small effort; but you must leave alone some things entirely, and postpone others for the present."
- lines:
  - ench.1.4.2
  - ench.1.4.2
  text: "But if you wish for these things also (such great things), and power (office) and wealth, perhaps you will not gain even these very things (power and wealth) because you aim also at those former things (such great things); certainly you will fail in those things through which alone happiness and freedom are secured."
- lines:
  - ench.1.5.1
  - ench.1.5.1
  text: "Straightway then practise saying to every harsh appearance: You are an appearance, and in no manner what you appear to be."
- lines:
  - ench.1.5.2
  - ench.1.5.3
  text: "Then examine it by the rules which you possess, and by this first and chiefly, whether it relates to the things which are in our power or to things which are not in our power; and if it relates to anything which is not in our power, be ready to say that it does not concern you."
