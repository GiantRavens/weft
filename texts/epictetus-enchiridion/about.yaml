  lead: 'The Enchiridion or Handbook of Epictetus (Ancient Greek: Ἐγχειρίδιον Ἐπικτήτου, Enkheirídion
    Epiktḗtou) is a short manual of Stoic ethical advice compiled by Arrian, a 2nd-century disciple of
    the Greek philosopher Epictetus. Although the content is mostly derived from the Discourses of Epictetus,
    it is not a summary of the Discourses but rather a compilation of practical precepts. Eschewing metaphysics,
    Arrian focuses his attention on Epictetus''s work applying philosophy to daily life. Thus, the book
    is a manual to show the way to achieve mental freedom and happiness in all circumstances.'
