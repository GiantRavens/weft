# Weft edition of six quatrains attributed to Omar Khayyam, each the Persian source Heron-Allen (1899)
# identified behind a stanza of FitzGerald's fifth edition. The Persian is E. H. Whinfield's text
# (London, 1883), from the proofread page transcriptions on Persian Wikisource; each section is
# checked verbatim against its own page (verify_in). The template markup of the page is set aside
# (verify_strip). Sections carry Whinfield's quatrain numbers.
#
#   t   the Persian as printed, with Whinfield's occasional short-vowel signs
#   n   Weft's transliteration in Early New Persian vowels (majhul ē and ō kept apart from ī and ū).
#       Separators: '-' prefix or suffix, '+' compound, '=' enclitic (unstressed: ezafe, personal
#       endings, -ē, -rā), "'" a contracted conjunction (k'az = ki az). The script leaves most
#       short vowels unwritten; they come from Whinfield's notes, the metre, and the dictionaries.
#   m   the reading the metre needs, where it differs: the silent final -a of būda is dropped before
#       ast (Whinfield's note to quatrain 35: "Scan búd ast, dropping silent he, and Alif i wasl").
joiner: " "
verify_strip: '\{\{[^|{}]*\||\}\}'
metre: {name: "rubāʿī"}
