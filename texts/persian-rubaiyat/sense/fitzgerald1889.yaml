# Edward FitzGerald, Rubáiyát of Omar Khayyám, fifth edition (1889), Project Gutenberg eBook 246,
# verbatim, with FitzGerald's stanza numbers. One correction: 'where in' (XXVII) to 'wherein', as
# printed in the fifth edition and in Heron-Allen (1899). Gutenberg's '--' for a dash is kept.
# FitzGerald's stanzas are free renderings; each span covers the whole Persian quatrain Heron-Allen
# names as its source. Quatrain 353 stands behind two stanzas, XXVII and XXVIII.
translation: fitzgerald1889
aligned_by: hand, phase 0; one span per quatrain, after Heron-Allen (1899)
spans:
- lines:
  - rub.72.1
  - rub.72.4
  text: 'XVIII.

    They say the Lion and the Lizard keep

    The courts where Jamshyd gloried and drank deep:

    And Bahram, that great Hunter--the Wild Ass

    Stamps o''er his Head, but cannot break his Sleep.'
- lines:
  - rub.104.1
  - rub.104.4
  text: 'XIX.

    I sometimes think that never blows so red

    The Rose as where some buried Caesar bled;

    That every Hyacinth the Garden wears

    Dropt in her Lap from some once lovely Head.'
- lines:
  - rub.353.1
  - rub.353.4
  text: 'XXVII.

    Myself when young did eagerly frequent

    Doctor and Saint, and heard great argument

    About it and about: but evermore

    Came out by the same door wherein I went.


    XXVIII.

    With them the seed of Wisdom did I sow,

    And with mine own hand wrought to make it grow;

    And this was all the Harvest that I reap''d--

    "I came like Water, and like Wind I go."'
- lines:
  - rub.252.1
  - rub.252.4
  text: 'XXXVII.

    For I remember stopping by the way

    To watch a Potter thumping his wet Clay:

    And with its all-obliterated Tongue

    It murmur''d--"Gently, Brother, gently, pray!"'
- lines:
  - rub.35.1
  - rub.35.4
  text: 'LXXI.

    The Moving Finger writes; and, having writ,

    Moves on: nor all your Piety nor Wit

    Shall lure it back to cancel half a Line,

    Nor all your Tears wash out a Word of it.'
- lines:
  - rub.379.1
  - rub.379.4
  text: 'XCIX.

    Ah Love! could you and I with Him conspire

    To grasp this sorry Scheme of Things entire,

    Would not we shatter it to bits--and then

    Re-mold it nearer to the Heart''s Desire!'
