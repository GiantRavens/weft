# Edward Heron-Allen, Edward FitzGerald's Rubâ'iyât of Omar Khayyâm with their Original Persian
# Sources (1899), his literal prose translations, verbatim from the page scans (archive.org
# india.history.resource.110981, pp. 33, 35, 45, 61, 107, 145). Heron-Allen translates the Ouseley
# manuscript (O., Bodleian, 1460) or the Calcutta manuscript (C.), not Whinfield's text; where the
# wording differs the notes say so. Weft names the manuscript at the head of each span, in brackets.
# Corrections to the OCR text, each confirmed on the scan: 'Bahram' to 'Bahrām' and '(gir)' to
# '(gūr)' (macrons dropped by the OCR); a stray quotation mark before 'caught' removed; 'Isa' to
# 'Is a'; a spaced semicolon closed up after 'rest' and 'proficiency'; 'wind:' to 'wind.' (a broken
# full stop); 'T was' to 'I was'; a spaced question mark closed up after 'desire'. Footnote marks after 'mole' and 'beginning' are dropped; the footnotes are not quoted.
translation: heronallen1899
aligned_by: hand, phase 0; one span per quatrain
spans:
- lines: [rub.72.1, rub.72.4]
  text: "[C. 99] In that palace where Bahrām grasped the wine-cup;\nThe foxes whelp, and the lions take their rest;\nBahrām who was always catching (gūr) wild asses,—\nTo-day behold that the (gūr) grave has caught Bahrām."
- lines: [rub.104.1, rub.104.4]
  text: "[O. 43] Everywhere that there has been a rose or tulip bed,\nIt has come from the redness of the blood of a king;\nEvery violet shoot that grows from the earth\nIs a mole that was (once) upon the cheek of a beauty."
- lines: [rub.353.1, rub.353.4]
  text: "[O. 121] For a while, when young, we frequented a teacher,\nFor a while we were contented with our proficiency;\nBehold the end of the discourse:—what happened to us?\nWe came like water and we went like wind."
- lines: [rub.252.1, rub.252.4]
  text: "[O. 89] I saw a potter in the bazaar yesterday,\nHe was violently pounding some fresh clay,\nAnd that clay said to him in mystic language,\n“I was once like thee—so treat me well.”"
- lines: [rub.35.1, rub.35.4]
  text: "[O. 31] From the beginning was written what shall be;\nUnhaltingly the Pen (writes) and is heedless of good and bad;\nOn the First Day He appointed everything that must be—\nOur grief and our efforts are vain."
- lines: [rub.379.1, rub.379.4]
  text: "[C. 395] Had I, like God, control of the heavens,\nWould I not do away with the heavens altogether,\nWould I not so construct another heaven from the beginning\nThat, being free, one might attain to the heart’s desire?"
