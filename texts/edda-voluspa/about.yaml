  lead: 'Völuspá (also Vǫluspá, Vǫlospá, or Vǫluspǫ́; Old Norse: ''Prophecy of the völva, a seeress'')
    is the best known poem of the Poetic Edda. It dates back to the tenth century and tells the story
    from Norse Mythology of the creation of the world, its coming end, and its subsequent rebirth that
    is related to the audience by a völva addressing Odin. Her name is given twice as Heiðr. The poem
    is one of the most important primary sources for the study of Norse mythology. Parts of the poem appear
    in the Prose Edda, but the earliest known wholly preserved version of the poem is in the Codex Regius
    and Hauksbók manuscripts.'
