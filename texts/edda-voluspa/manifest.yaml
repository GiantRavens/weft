predicted_gaps:
  - "no treebank: every lemma and parse is hand-annotated (Zoëga as reference) and stays draft until reviewed"
  - "Bellows and Thorpe order and number some stanzas differently from this edition; spans are aligned by content"
  - "metre is fornyrðislag: the metre layer records half-line roles and staves, not feet"
  - "the edition's ö covers both old ǫ and ø; read as ǫ by default"
  - "the dwarf catalogue (stanzas 10-16) is mostly names; their glosses give meanings only where the name is transparent"
