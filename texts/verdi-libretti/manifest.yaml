- 'no treebank covers the libretti: lemma, morphology and gloss are by hand (UD Italian conventions), draft'
- the sound is the Florentine-based standard the opera house taught, read from the work's own lexicon; the singers' regional accents
  and the sung vowels (open on high notes) are not modelled
- the Otello text is a transcription without a named print; the Traviata is a validated scan page; the Otello guisto is corrected as
  declared
- 'the Victorian singing versions are cited and not printed: in copyright by life + 70 (Macfarren) or not yet transcribed (Hueffer)'
