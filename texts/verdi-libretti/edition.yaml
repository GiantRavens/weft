# Weft edition of two numbers from Verdi's operas: the Brindisi of La traviata (Act I; libretto by Francesco Maria Piave,
# Venice 1853), from Alfredo's 'Libiam ne' lieti calici' to the exchange with Violetta, and Iago's Credo from Otello (Act II,
# scene 2; libretto by Arrigo Boito, Milan 1887), with the five lines before it. Texts of Italian Wikisource: the Traviata
# from the Ricordi libretto scan (Pagina:La traviata.djvu/7, validated), the Otello from the transcribed libretto (Otello
# (Boito)/Atto secondo/Scena seconda); each line is checked verbatim against the pinned revisions. verify_strip sets aside
# the speaker templates, the italic stage directions, the line-leading colons and the page templates; the Otello
# transcription's guisto for giusto is declared as a correction.
# The librettists' spelling is kept (Poichè, Nè, perchè, sè with the grave; innebrii; lagrima; the elisions fe', dimon,
# istrion, avel, Ciel); the work's own lexicon.yaml gives each word its stress and vowel quality.
#   t     the word as printed, punctuation attached (the ellipses of Godiam... are the libretto's)
#   Lines are the verses; sections are the speeches, named for the singer.
work: verdi-libretti
joiner: ' '
verify_strip: (?sm)<noinclude>.*?</noinclude>|\{\{T\|(?:[^{}]|\{\{[^{}]*\}\})*\}\}|''\([^)]*\)''|''[^']*''|\{\{[^{}]*\}\}|<[^>]+>|^[:;]+
verify_corrections:
- ocr: guisto
  print: giusto
  in: sources/otello-2-2.txt
