# Notes on the Verdi numbers.
- id: n.vl.alfredo1.1.brindisi
  attach: vl.alfredo1.1.1
  kind: editorial
  status: draft
  leans_on: Julian Budden, The Operas of Verdi, vol. 2 (1978), on La traviata; the Ricordi libretto of 1853
  text: 'Libiam, ''let us drink'': the Brindisi, the drinking song of Act I, sung at Violetta''s party in Paris. La traviata, after Alexandre Dumas''s play La Dame aux camélias (1852), opened at the Teatro
    La Fenice in Venice on 6 March 1853 and failed; Piave''s verses are the fast ottonari of a toast, and Verdi''s waltz has made them the most sung lines in Italian. Libiam is the poetic form of libiamo,
    with the final vowel cut (apocope), as amor, fior, piacer, goder below.'
- id: n.vl.alfredo1.7.poiche
  attach: vl.alfredo1.7.1
  kind: editorial
  status: draft
  leans_on: the Ricordi libretto; the DOP on the spelling of the oxytones
  text: 'Poichè, Nè, perchè, sè: nineteenth-century Italian wrote the final stressed e of these words with a grave accent whatever its sound; the modern rule distinguishes é closed (poiché, perché, né,
    sé) from è open. The libretti keep the old grave; the sound row reads the closed vowel the standard gives these words.'
- id: n.vl.violetta1.7.fior
  attach: vl.violetta1.7.2
  kind: editorial
  status: draft
  leans_on: Dumas, La Dame aux camélias (1848, 1852); Budden 1978
  text: 'È fior che nasce e muore, ''it is a flower that is born and dies'': Violetta''s answer to Alfredo''s love-song is the courtesan''s creed of pleasure, and the flower is also the camellia of Dumas''s
    title and of her name, Violetta. The whole Brindisi is a duet in disguise: he sings of love, she of the moment, the chorus of the cup.'
- id: n.vl.jago1.1.boito
  attach: vl.jago1.1.1
  kind: editorial
  status: draft
  leans_on: Budden, The Operas of Verdi, vol. 3 (1981); the Verdi-Boito correspondence (ed. Conati and Medici, 1978)
  text: 'Otello opened at La Scala, Milan, on 5 February 1887, Verdi''s first opera in sixteen years. Arrigo Boito, himself a composer (Mefistofele) and poet of the Scapigliatura, condensed Shakespeare''s
    five acts to four and wrote in a deliberately archaic, Dantesque Italian: dimon for demonio, inesorato Iddio. This exchange with himself, after sending Cassio off, leads straight into the Credo.'
- id: n.vl.credo.1.credo
  attach: vl.credo.1.1
  kind: editorial
  status: draft
  leans_on: Budden 1981; Shakespeare, Othello 1.3 and 2.3 (Iago's soliloquies)
  text: 'Credo in un Dio crudel: Iago''s creed has no counterpart in Shakespeare; Boito invented it, and Verdi called it ''Shakespearean through and through''. It is a black parody of the Nicene Creed (in
    this library), Credo in unum Deum, article by article: a cruel God, a base birth, a faith, the just man a play-actor, and at the end not the life of the world to come but ''La Morte è il Nulla''.'
- id: n.vl.credo.13.giusto
  attach: vl.credo.13.4
  kind: editorial
  status: draft
  leans_on: the Ricordi libretto (1887); the Wikisource transcription
  text: 'giusto, ''the just man'': the transcription reads guisto, a typing slip, corrected as declared in edition.yaml. istrion, ''play-actor'', is the Latin histrio in Boito''s archaic dress, with its
    final vowel cut; the lexicon reads the i and o apart (i-stri-ÓN), as the verse requires.'
