# Notes for the Ninety-five Theses: the preamble and all ninety-five theses.
- id: n.l95.sound
  attach: l95.prooem.1
  kind: editorial
  status: draft
  leans_on: "W. S. Allen, Vox Latina (1965), appendix on national pronunciations; Erasmus, De recta Latini Graecique sermonis pronuntiatione (1528); Early New High German grammars on open-syllable lengthening and final devoicing"
  text: "The default reading is Latin as a reader in Saxony would most likely have pronounced it around 1517. No description of Luther's own Latin survives, so the reading is built from two kinds of indirect evidence. The first is the German school pronunciation of Latin, which later grammars describe and which kept c before e and i as ts, qu as kv, g hard before every vowel, and ti before a vowel as tsi. The second is the sound system of German in Luther's time: a stressed vowel in an open syllable was long, final b, d and g were said as p, t and k, z was ts, and the letter v stood for f. Applying that last value to Latin v is the least certain step; v or w is also possible. Stress follows the classical penultimate rule, which readers of the period kept. The ecclesiastical reading, the Italianate church Latin used later in Rome, is the second choice, and the restored classical reading is the third."
- id: n.l95.genre
  attach: l95.prooem.3
  kind: editorial
  status: draft
  leans_on: "the preamble; theses 81-89"
  text: "A disputation was a set academic exercise in a medieval university: a presiding master put forward propositions, and opponents argued against them in a formal sequence. The heading calls this text a disputation, says the items below will be disputed at Wittenberg under Luther as presiding master, and asks those who cannot attend to dispute by letter. The ninety-five sentences are therefore theses in the technical sense, propositions offered for debate, rather than a manifesto addressed to the public. Several are phrased as questions or as objections the laity might raise (82-89). No record shows that the disputation was held."
- id: n.l95.date
  attach: l95.prooem.1
  kind: editorial
  status: draft
  leans_on: "Luther to Albrecht of Mainz, 31 October 1517 (WA Briefwechsel 1, no. 48)"
  text: "The date of 31 October 1517 rests on a document: Luther's letter of that day to Albrecht of Brandenburg, archbishop of Mainz and of Magdeburg, under whose authority the indulgence for the rebuilding of St Peter's in Rome was being preached in his provinces. The letter survives. It asks the archbishop to restrain the preachers and refers to disputation theses sent with it. This is the earliest dated evidence connecting the theses to that day. The source text closes with the year alone (M.D.Xvii.), a line not included here."
- id: n.l95.door
  attach: l95.prooem.1.9
  kind: editorial
  status: draft
  leans_on: "Philip Melanchthon, preface to vol. 2 of Luther's Latin works (Wittenberg, 1546); Erwin Iserloh, Luthers Thesenanschlag: Tatsache oder Legende? (1962)"
  text: "That Luther nailed the theses to the door of the Castle Church in Wittenberg on 31 October is first reported by Philip Melanchthon, in a preface printed in 1546, after Luther's death. Melanchthon was not in Wittenberg in 1517, and Luther's own surviving references to the events of that autumn mention the letters to the bishops, not a posting. From 1961 the Catholic historian Erwin Iserloh argued that no posting took place. Others reply that posting disputation theses on church doors was the normal way of announcing a disputation at Wittenberg, and point to a handwritten note by Luther's secretary Georg Rörer, identified in the 2000s, which also records a posting on the church doors; that note, too, was written decades later. The posting is therefore debated, not settled, while the date of the letter to Albrecht is not in doubt."
- id: n.l95.poenitentia
  attach: l95.th.1.9
  kind: editorial
  status: draft
  leans_on: "Matthew 4:17 (Greek and Vulgate); Luther to Johann von Staupitz, 30 May 1518, prefaced to the Resolutiones"
  text: "Poenitentiam agite is the Vulgate's rendering of Christ's command in Matthew 4:17, where the Greek has metanoeite, 'change your mind' or 'repent'. The Latin phrase can be read in two ways: 'repent' or 'do penance', and in the second reading it points toward the sacrament of penance, with its confession and works of satisfaction. Thesis 1 takes the command to mean that the whole life of believers is repentance; thesis 2 denies that the word can be understood of sacramental penance. Luther later wrote, in his letter to Staupitz of 1518, that he had learned the Greek word means a change of mind. The gloss row uses 'penitence' to leave both readings open; the 1915 translation chooses 'repentance' in thesis 1 and 'penance' in thesis 2."
- id: n.l95.coin
  attach: l95.th.27.6
  kind: editorial
  status: draft
  leans_on: "theses 27 and 28; Martin Brecht, Martin Luther: Sein Weg zur Reformation 1483-1521 (1981), on the indulgence campaign of 1517"
  text: "Thesis 27 reports a claim made in preaching: that the soul flies out of purgatory as soon as the coin thrown into the chest rings. The thesis names no preacher. The claim is usually connected with Johann Tetzel, the Dominican who preached the St Peter's indulgence near Wittenberg in 1517, outside electoral Saxony, where the elector did not permit it. A rhymed German form of the saying is widely quoted, but it is attested in later sources, and whether Tetzel used these words is not shown by his own writings. Thesis 28 answers the claim: the ringing coin can increase gain and avarice, while the effect of the church's intercession rests with God alone."
- id: n.l95.print
  attach: l95.th.95
  kind: editorial
  status: draft
  leans_on: "Luther to Christoph Scheurl, 5 March 1518 (WA Briefwechsel 1); the surviving 1517 printings"
  text: "Three printings from before the end of 1517 survive: single-sheet placards from Nuremberg and Leipzig, and a small pamphlet from Basel, whose first page is shown with this work. Whether a printing was made in Wittenberg for the disputation is not known; none survives. A German translation was made in Nuremberg by early 1518. In March 1518 Luther wrote to Christoph Scheurl that the theses had spread far more widely than he had intended, and that he would have written them differently for a general readership. The speed of this spread, through reprinting in other cities rather than through any action of Luther's, is the documented part of the story."
- id: n.l95.text
  attach: l95.th.7.2
  kind: editorial
  status: draft
  leans_on: "Project Wittenberg transcription of WA 1, 233-238 (in Project Gutenberg eBook #274); the Basel pamphlet of 1517 (image on Commons)"
  text: "The Latin follows Latin Wikisource, whose page does not name its source. Comparison shows a composite. Its wording and its misprints follow the Weimar edition (WA 1, 1883) as transcribed by Project Wittenberg: prorus for prorsus here, purgaturium (16), versus for verus (37), idulgentias (45), Multomagnis for Multo magis (74) and laicorm (81). In the preamble and theses 1-29, however, the spelling and punctuation agree with the Basel pamphlet (ae, oe, Iesu, .i. for id est), while theses 30-95 keep WA's medieval e for ae (Pape, penas). WA itself numbers the theses in four series of 25, 25, 25 and 20; Wikisource numbers them 1-95. The edition here reproduces the page verbatim and reads each misprint as the intended word in the sound layer."
