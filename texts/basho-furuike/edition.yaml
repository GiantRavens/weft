# Weft edition of nine haiku by Bashō, in order of composition, as printed in Ōtsuka Kōzan's
# Bashō Haiku Zenshū (1903), each checked verbatim against its Wikisource scan page (verify_in).
# The 1903 edition arranges poems by season word, not by date; the order and dates here are
# Weft's. Weft divides each single printed line into its three phrases. Each token gives its
# reading in historical kana (n), from which the sound and the mora count are derived.
joiner: ""
verify_in: sources/otsuka1903-p23.txt
sections:
