# Notes for Bashō's frog poem.
- id: n.ba.sound
  attach: ba.1686.1
  kind: editorial
  status: draft
  text: "Japanese has changed less since the 1680s than English has, so the Edo reading and the modern one differ only in details. The old spelling かはづ, kawadzu, and みづ, midzu, may still have kept a dz sound distinct from z; by Bashō's time the two were merging in Edo. Hearn in 1898 still romanized the word Midzu, following that old spelling. Pitch accent is not marked."
- id: n.ba.metre
  attach: ba.1686.1.1
  kind: editorial
  status: draft
  text: "The poem counts 5, 7 and 5 morae. A mora is a unit of timing, not a syllable: furuike has four, fu-ru-i-ke. The metre row is computed from the kana readings."
- id: n.ba.ya
  attach: ba.1686.1.2
  kind: editorial
  status: draft
  text: "Ya is a kireji, a cutting word: it marks a pause and sets the old pond apart as a scene before the action. English has no equivalent. Chamberlain renders it 'aye!'; Hearn uses a dash."
- id: n.ba.kawazu
  attach: ba.1686.2.1
  kind: editorial
  status: draft
  text: "Kawazu is the poetic word for frog, and a season word for spring. Japanese nouns do not mark number, so the line allows one frog or many. Chamberlain chose one, 'a frog leaping'; Hearn chose many, 'frogs jumping in'. Most later translators have followed Chamberlain."
- id: n.ba.hokku
  attach: ba.1686.3
  kind: editorial
  status: draft
  text: "Hearn called this 'the first poem written in the measure called hokku'. That is not correct: the hokku, the opening verse of a linked-verse sequence, is older than Bashō. Bashō and his school made it an independent form of serious poetry; the name haiku came into use later, in the 1890s."
- id: n.ba.text
  attach: ba.1686.3.3
  kind: editorial
  status: draft
  text: "The poem was first printed in 1686 as 古池や蛙飛こむ水のおと, with 'jump' in kanji and 'sound' in kana. The 1903 edition used here writes the same words as 古池や蛙とびこむ水の音. Spelling choices shift between editions; the words do not."
- id: n.ba.chamberlain
  attach: ba.1686.1
  kind: quoted
  source: "B. H. Chamberlain, Bashō and the Japanese Poetical Epigram (1902), p. 279 (a stray OCR period removed)"
  text: "The following epigram, which every Japanese has by heart, also probably dates from this period"
