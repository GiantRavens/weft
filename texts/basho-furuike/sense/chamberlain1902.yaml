- lines:
  - ba.1680.1
  - ba.1680.3
  text: 'The end of autumn, and some rooks

    Are perched upon a withered branch'
- lines:
  - ba.1686.1
  - ba.1686.3
  text: The old pond, aye! and the sound of a frog leaping into the water.
- lines:
  - ba.1689a.1
  - ba.1689a.3
  text: 'Haply the summer grasses are

    A relic of the warriors'' dream.'
- lines:
  - ba.1689d.1
  - ba.1689d.3
  text: 'A rough sea, and the Milky Way

    Stretching across to Sado''s isle.'
- lines:
  - ba.1690.1
  - ba.1690.3
  text: 'Nothing in the cicada’s voice

    Gives token of a speedy death.'
- lines:
  - ba.1694.1
  - ba.1694.3
  text: 'Ta''en ill while journeying, I dreamt

    I wandered o’er a withered moor.'
