  - il.1.42
  text: “Hear me,” he cried, “O god of the silver bow, that protectest Chryse and holy Cilla and rulest
    Tenedos with thy might, hear me oh thou of Sminthe. If I have ever decked your temple with garlands,
    or burned your thigh-bones in fat of bulls or goats, grant my prayer, and let your arrows avenge these
    my tears upon the Danaans.”
- lines:
