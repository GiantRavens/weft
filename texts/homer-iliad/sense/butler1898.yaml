    gods, by mortal men, and by the fierceness of Agamemnon’s anger, that if ever again there be need
    of me to save the people from ruin, they shall seek and they shall not find. Agamemnon is mad with
    rage and knows not how to look before and after that the Achaeans may fight by their ships in safety.”
- lines:
  - il.1.345
  - il.1.345
  text: Patroclus did as his dear comrade had bidden him.
- lines:
  - il.1.346
  - il.1.350
  text: He brought Briseis from the tent and gave her over to the heralds, who took her with them to the
    ships of the Achaeans—and the woman was loth to go. Then Achilles went all alone by the side of the
    hoar sea, weeping and looking out upon the boundless waste of waters.
- lines:
  - il.1.351
  - il.1.354
  text: He raised his hands in prayer to his immortal mother, “Mother,” he cried, “you bore me doomed
    to live but for a little season; surely Jove, who thunders from Olympus, might have made that little
    glorious. It is not so.
- lines:
  - il.1.355
  - il.1.356
  text: Agamemnon, son of Atreus, has done me dishonour, and has robbed me of my prize by force.”
- lines:
  - il.1.357
  - il.1.358
  text: As he spoke he wept aloud, and his mother heard him where she was sitting in the depths of the
    sea hard by the old man her father.
- lines:
  - il.1.359
  - il.1.363
  text: Forthwith she rose as it were a grey mist out of the waves, sat down before him as he stood weeping,
    caressed him with her hand, and said, “My son, why are you weeping? What is it that grieves you? Keep
    it not from me, but tell me, that we may know it together.”
- lines:
  - il.1.364
  - il.1.365
  text: Achilles drew a deep sigh and said, “You know it; why tell you what you know well already?
- lines:
  - il.1.366
  - il.1.367
  text: We went to Thebe the strong city of Eetion, sacked it, and brought hither the spoil.
- lines:
  - il.1.368
  - il.1.369
  text: The sons of the Achaeans shared it duly among themselves, and chose lovely Chryseis as the meed
    of Agamemnon;
- lines:
  - il.1.370
  - il.1.375
  text: 'but Chryses, priest of Apollo, came to the ships of the Achaeans to free his daughter, and brought
    with him a great ransom: moreover he bore in his hand the sceptre of Apollo, wreathed with a suppliant’s
    wreath, and he besought the Achaeans, but most of all the two sons of Atreus who were their chiefs.'
- lines:
  - il.1.376
  - il.1.379
  text: “On this the rest of the Achaeans with one voice were for respecting the priest and taking the
    ransom that he offered; but not so Agamemnon, who spoke fiercely to him and sent him roughly away.
- lines:
  - il.1.380
  - il.1.381
  text: So he went back in anger, and Apollo, who loved him dearly, heard his prayer.
- lines:
  - il.1.382
  - il.1.386
  text: Then the god sent a deadly dart upon the Argives, and the people died thick on one another, for
    the arrows went everywhither among the wide host of the Achaeans. At last a seer in the fulness of
    his knowledge declared to us the oracles of Apollo, and I was myself first to say that we should appease
    him.
- lines:
  - il.1.387
  - il.1.388
  text: Whereon the son of Atreus rose in anger, and threatened that which he has since done.
- lines:
  - il.1.389
  - il.1.390
  text: The Achaeans are now taking the girl in a ship to Chryse, and sending gifts of sacrifice to the
    god;
- lines:
  - il.1.391
  - il.1.392
  text: but the heralds have just taken from my tent the daughter of Briseus, whom the Achaeans had awarded
    to myself.
- lines:
  - il.1.393
  - il.1.393
  text: “Help your brave son, therefore, if you are able.
- lines:
  - il.1.394
  - il.1.395
  text: Go to Olympus, and if you have ever done him service in word or deed, implore the aid of Jove.
- lines:
  - il.1.396
  - il.1.400
  text: Ofttimes in my father’s house have I heard you glory in that you alone of the immortals saved
    the son of Saturn from ruin, when the others, with Juno, Neptune, and Pallas Minerva would have put
    him in bonds.
- lines:
  - il.1.401
  - il.1.404
  text: It was you, goddess, who delivered him by calling to Olympus the hundred-handed monster whom gods
    call Briareus, but men Aegaeon, for he is stronger even than his father;
- lines:
  - il.1.405
  - il.1.406
  text: when therefore he took his seat all-glorious beside the son of Saturn, the other gods were afraid,
    and did not bind him.
- lines:
  - il.1.407
  - il.1.408
  text: Go, then, to him, remind him of all this, clasp his knees, and bid him give succour to the Trojans.
- lines:
  - il.1.409
  - il.1.412
  text: Let the Achaeans be hemmed in at the sterns of their ships, and perish on the sea-shore, that
    they may reap what joy they may of their king, and that Agamemnon may rue his blindness in offering
    insult to the foremost of the Achaeans.”
- lines:
  - il.1.413
  - il.1.414
  text: Thetis wept and answered, “My son, woe is me that I should have borne or suckled you.
- lines:
  - il.1.415
  - il.1.416
  text: Would indeed that you had lived your span free from all sorrow at your ships, for it is all too
    brief;
- lines:
  - il.1.417
  - il.1.418
  text: 'alas, that you should be at once short of life and long of sorrow above your peers: woe, therefore,
    was the hour in which I bore you;'
- lines:
  - il.1.419
  - il.1.420
  text: 'nevertheless I will go to the snowy heights of Olympus, and tell this tale to Jove, if he will
    hear our prayer:'
- lines:
  - il.1.421
  - il.1.422
  text: meanwhile stay where you are with your ships, nurse your anger against the Achaeans, and hold
    aloof from fight.
- lines:
  - il.1.423
  - il.1.424
  text: For Jove went yesterday to Oceanus, to a feast among the Ethiopians, and the other gods went with
    him.
- lines:
  - il.1.425
  - il.1.427
  text: He will return to Olympus twelve days hence; I will then go to his mansion paved with bronze and
    will beseech him; nor do I doubt that I shall be able to persuade him.”
- lines:
  - il.1.428
  - il.1.431
  text: On this she left him, still furious at the loss of her that had been taken from him. Meanwhile
    Ulysses reached Chryse with the hecatomb.
- lines:
  - il.1.432
  - il.1.433
  text: When they had come inside the harbour they furled the sails and laid them in the ship’s hold;
- lines:
  - il.1.434
  - il.1.436
  text: they slackened the forestays, lowered the mast into its place, and rowed the ship to the place
    where they would have her lie; there they cast out their mooring-stones and made fast the hawsers.
- lines:
  - il.1.437
  - il.1.438
  text: They then got out upon the sea-shore and landed the hecatomb for Apollo;
- lines:
  - il.1.439
  - il.1.441
  text: Chryseis also left the ship, and Ulysses led her to the altar to deliver her into the hands of
    her father.
- lines:
  - il.1.442
  - il.1.445
  text: “Chryses,” said he, “King Agamemnon has sent me to bring you back your child, and to offer sacrifice
    to Apollo on behalf of the Danaans, that we may propitiate the god, who has now brought sorrow upon
    the Argives.”
- lines:
  - il.1.446
  - il.1.448
  text: So saying he gave the girl over to her father, who received her gladly, and they ranged the holy
    hecatomb all orderly round the altar of the god.
- lines:
  - il.1.449
  - il.1.450
  text: They washed their hands and took up the barley-meal to sprinkle over the victims, while Chryses
    lifted up his hands and prayed aloud on their behalf.
- lines:
  - il.1.451
  - il.1.452
  text: “Hear me,” he cried, “O god of the silver bow, that protectest Chryse and holy Cilla, and rulest
    Tenedos with thy might.
- lines:
  - il.1.453
  - il.1.456
  text: Even as thou didst hear me aforetime when I prayed, and didst press hardly upon the Achaeans,
    so hear me yet again, and stay this fearful pestilence from the Danaans.”
- lines:
  - il.1.457
  - il.1.457
  text: Thus did he pray, and Apollo heard his prayer.
- lines:
  - il.1.458
  - il.1.459
  text: When they had done praying and sprinkling the barley-meal, they drew back the heads of the victims
    and killed and flayed them.
- lines:
  - il.1.460
  - il.1.463
  text: They cut out the thigh-bones, wrapped them round in two layers of fat, set some pieces of raw
    meat on the top of them, and then Chryses laid them on the wood fire and poured wine over them, while
    the young men stood near him with five-pronged spits in their hands.
- lines:
  - il.1.464
  - il.1.466
  text: 'When the thigh-bones were burned and they had tasted the inward meats, they cut the rest up small,
    put the pieces upon the spits, roasted them till they were done, and drew them off:'
- lines:
  - il.1.467
  - il.1.468
  text: then, when they had finished their work and the feast was ready, they ate it, and every man had
    his full share, so that all were satisfied.
- lines:
  - il.1.469
  - il.1.471
  text: As soon as they had had enough to eat and drink, pages filled the mixing-bowl with wine and water
    and handed it round, after giving every man his drink-offering.
- lines:
  - il.1.472
  - il.1.474
  text: Thus all day long the young men worshipped the god with song, hymning him and chaunting the joyous
    paean, and the god took pleasure in their voices;
- lines:
  - il.1.475
  - il.1.476
  text: but when the sun went down, and it came on dark, they laid themselves down to sleep by the stern
    cables of the ship,
- lines:
  - il.1.477
  - il.1.478
  text: and when the child of morning, rosy-fingered Dawn, appeared they again set sail for the host of
    the Achaeans.
- lines:
  - il.1.479
  - il.1.480
  text: Apollo sent them a fair wind, so they raised their mast and hoisted their white sails aloft.
- lines:
  - il.1.481
  - il.1.483
  text: As the sail bellied with the wind the ship flew through the deep blue water, and the foam hissed
    against her bows as she sped onward.
- lines:
  - il.1.484
  - il.1.487
  text: When they reached the wide-stretching host of the Achaeans, they drew the vessel ashore, high
    and dry upon the sands, set her strong props beneath her, and went their ways to their own tents and
    ships.
- lines:
  - il.1.488
  - il.1.489
  text: But Achilles abode at his ships and nursed his anger.
- lines:
  - il.1.490
  - il.1.492
  text: He went not to the honourable assembly, and sallied not forth to fight, but gnawed at his own
    heart, pining for battle and the war-cry.
- lines:
  - il.1.493
  - il.1.497
  text: Now after twelve days the immortal gods came back in a body to Olympus, and Jove led the way.
    Thetis was not unmindful of the charge her son had laid upon her, so she rose from under the sea and
    went through great heaven with early morning to Olympus,
- lines:
  - il.1.498
  - il.1.499
  text: where she found the mighty son of Saturn sitting all alone upon its topmost ridges.
- lines:
  - il.1.500
  - il.1.502
  text: She sat herself down before him, and with her left hand seized his knees, while with her right
    she caught him under the chin, and besought him, saying:—
- lines:
  - il.1.503
  - il.1.507
  text: “Father Jove, if I ever did you service in word or deed among the immortals, hear my prayer, and
    do honour to my son, whose life is to be cut short so early. King Agamemnon has dishonoured him by
    taking his prize and keeping her.
- lines:
  - il.1.508
  - il.1.510
  text: Honour him then yourself, Olympian lord of counsel, and grant victory to the Trojans, till the
    Achaeans give my son his due and load him with riches in requital.”
- lines:
  - il.1.511
  - il.1.513
  text: Jove sat for a while silent, and without a word, but Thetis still kept firm hold of his knees,
    and besought him a second time.
- lines:
  - il.1.514
  - il.1.516
  text: “Incline your head,” said she, “and promise me surely, or else deny me—for you have nothing to
    fear—that I may learn how greatly you disdain me.”
- lines:
  - il.1.517
  - il.1.519
  text: At this Jove was much troubled and answered, “I shall have trouble if you set me quarrelling with
    Juno, for she will provoke me with her taunting speeches;
- lines:
  - il.1.520
  - il.1.521
  text: even now she is always railing at me before the other gods and accusing me of giving aid to the
    Trojans.
- lines:
  - il.1.522
  - il.1.523
  text: Go back now, lest she should find out. I will consider the matter, and will bring it about as
    you wish.
- lines:
  - il.1.524
  - il.1.524
  text: See, I incline my head that you may believe me.
- lines:
  - il.1.525
  - il.1.527
  text: This is the most solemn promise that I can give to any god. I never recall my word, or deceive,
    or fail to do what I say, when I have nodded my head.”
- lines:
  - il.1.528
  - il.1.530
  text: As he spoke the son of Saturn bowed his dark brows, and the ambrosial locks swayed on his immortal
    head, till vast Olympus reeled.
- lines:
  - il.1.531
  - il.1.535
  text: When the pair had thus laid their plans, they parted—Jove to his house, while the goddess quitted
    the splendour of Olympus, and plunged into the depths of the sea. The gods rose from their seats,
    before the coming of their sire. Not one of them dared to remain sitting, but all stood up as he came
    among them.
- lines:
  - il.1.536
  - il.1.539
  text: There, then, he took his seat. But Juno, when she saw him, knew that he and the old merman’s daughter,
    silver-footed Thetis, had been hatching mischief, so she at once began to upbraid him.
- lines:
  - il.1.540
  - il.1.543
  text: “Trickster,” she cried, “which of the gods have you been taking into your counsels now? You are
    always settling matters in secret behind my back, and have never yet told me, if you could help it,
    one word of your intentions.”
- lines:
  - il.1.544
  - il.1.546
  text: “Juno,” replied the sire of gods and men, “you must not expect to be informed of all my counsels.
    You are my wife, but you would find it hard to understand them.
- lines:
  - il.1.547
  - il.1.548
  text: When it is proper for you to hear, there is no one, god or man, who will be told sooner,
- lines:
  - il.1.549
  - il.1.550
  text: but when I mean to keep a matter to myself, you must not pry nor ask questions.”
- lines:
  - il.1.551
  - il.1.552
  text: “Dread son of Saturn,” answered Juno, “what are you talking about?
- lines:
  - il.1.553
  - il.1.554
  text: I? Pry and ask questions? Never. I let you have your own way in everything.
- lines:
  - il.1.555
  - il.1.557
  text: Still, I have a strong misgiving that the old merman’s daughter Thetis has been talking you over,
    for she was with you and had hold of your knees this self-same morning.
- lines:
  - il.1.558
  - il.1.559
  text: I believe, therefore, that you have been promising her to give glory to Achilles, and to kill
    much people at the ships of the Achaeans.”
- lines:
  - il.1.560
  - il.1.561
  text: “Wife,” said Jove, “I can do nothing but you suspect me and find it out.
- lines:
  - il.1.562
  - il.1.563
  text: You will take nothing by it, for I shall only dislike you the more, and it will go harder with
    you.
- lines:
  - il.1.564
  - il.1.564
  text: Granted that it is as you say; I mean to have it so;
- lines:
  - il.1.565
  - il.1.567
  text: sit down and hold your tongue as I bid you for if I once begin to lay my hands about you, though
    all heaven were on your side it would profit you nothing.”
- lines:
  - il.1.568
  - il.1.569
  text: On this Juno was frightened, so she curbed her stubborn will and sat down in silence.
- lines:
  - il.1.570
  - il.1.572
  text: But the heavenly beings were disquieted throughout the house of Jove, till the cunning workman
    Vulcan began to try and pacify his mother Juno.
- lines:
  - il.1.573
  - il.1.576
  text: “It will be intolerable,” said he, “if you two fall to wrangling and setting heaven in an uproar
    about a pack of mortals. If such ill counsels are to prevail, we shall have no pleasure at our banquet.
- lines:
  - il.1.577
  - il.1.579
  text: Let me then advise my mother—and she must herself know that it will be better—to make friends
    with my dear father Jove, lest he again scold her and disturb our feast.
- lines:
  - il.1.580
  - il.1.581
  text: If the Olympian Thunderer wants to hurl us all from our seats, he can do so, for he is far the
    strongest,
- lines:
  - il.1.582
  - il.1.583
  text: so give him fair words, and he will then soon be in a good humour with us.”
- lines:
  - il.1.584
  - il.1.585
  text: As he spoke, he took a double cup of nectar, and placed it in his mother’s hand.
- lines:
  - il.1.586
  - il.1.586
  text: “Cheer up, my dear mother,” said he, “and make the best of it.
- lines:
  - il.1.587
  - il.1.589
  text: I love you dearly, and should be very sorry to see you get a thrashing; however grieved I might
    be, I could not help, for there is no standing against Jove.
- lines:
  - il.1.590
  - il.1.591
  text: Once before when I was trying to help you, he caught me by the foot and flung me from the heavenly
    threshold.
- lines:
  - il.1.592
  - il.1.594
  text: All day long from morn till eve, was I falling, till at sunset I came to ground in the island
    of Lemnos, and there I lay, with very little life left in me, till the Sintians came and tended me.”
- lines:
  - il.1.595
  - il.1.596
  text: Juno smiled at this, and as she smiled she took the cup from her son’s hands.
- lines:
  - il.1.597
  - il.1.598
  text: Then Vulcan drew sweet nectar from the mixing-bowl, and served it round among the gods, going
    from left to right;
- lines:
  - il.1.599
  - il.1.600
  text: and the blessed gods laughed out a loud applause as they saw him bustling about the heavenly mansion.
- lines:
  - il.1.601
  - il.1.602
  text: Thus through the livelong day to the going down of the sun they feasted, and every one had his
    full share, so that all were satisfied.
- lines:
  - il.1.603
  - il.1.604
  text: Apollo struck his lyre, and the Muses lifted up their sweet voices, calling and answering one
    another.
- lines:
  - il.1.605
  - il.1.608
  text: But when the sun’s glorious light had faded, they went home to bed, each in his own abode, which
    lame Vulcan with his consummate skill had fashioned for them.
- lines:
  - il.1.609
  - il.1.611
  text: So Jove, the Olympian Lord of Thunder, hied him to the bed in which he always slept; and when
    he had got on to it he went to sleep, with Juno of the golden throne by his side.
