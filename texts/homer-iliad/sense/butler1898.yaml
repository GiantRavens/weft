# Samuel Butler, The Iliad of Homer (1898), book I, verbatim from Project Gutenberg #2199.
# Butler's prose paragraphs are split at sentence ends where a sentence maps onto whole Greek
# lines; where it does not (1.43-49, Butler's 'face as dark as night' sits mid-sentence), the span
# runs to the next sentence end. No corrections.
# Lines 1.53-611 added 2026-10-18. Most spans are whole sentences ("thus:—" before a speech, 1.73 and 1.253, ends a span). Where a
# sentence runs across a Greek line boundary that a clause boundary also falls on, the span is split
# at the clause: at a semicolon or comma (1.77/78, 1.85/86, 1.117/118, 1.140/141, 1.181/182 at "thus
# will I do:", 1.210/211, 1.276/277, 1.286/287), at the comma before a speech (1.105/106), at the dash
# after "great oath" (1.233/234), and once with no punctuation, where "because" opens 1.111
# (1.110/111). Elsewhere the span runs to the next sentence end. Judgment calls: 1.83 opens with the
# tail of the previous sentence (ἐν στήθεσσιν ἑοῖσι), which Butler leaves untranslated, so 1.80-82 and
# 1.83 are separate spans; likewise 1.241 opens with σύμπαντας, unrendered by Butler, so "they shall
# look fondly for Achilles" ends at 1.240. 1.141-147 (seven lines) is one span because "let us send
# Chryseis also" straddles 1.143-144. Extended to 1.611, the end of book I, on the same rule. Where a
# long sentence runs over many Greek lines, it is split at a clause boundary that falls at a Greek
# line boundary (for example 1.306-307/308, 1.415-422); where no such boundary exists the span covers
# the whole sentence (1.337-344, eight lines).
