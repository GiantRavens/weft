# Notes for Iliad book 1 drawn from G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985): 1.1-52, and 1.53-611 except 1.349-403, which the copy used for the later notes lacks.
# Kirk is in copyright: these notes restate his points in Weft's words, with at most a short
# attributed phrase. The verbatim commentary lives only in private/homer-iliad/notes/ (never committed).
# Points already made in book01.yaml (proem variants, runover in 1.2, Zeus's plan, ἐξ οὗ, αὐτούς,
# fillets, verse patterns of 10-11 and 17-21, θεοί, Agamemnon's reply, Smintheus, the plague,
# βέλος, nine days, formulas) are not repeated here.

- id: n.il.1.1.aeide-kirk
  attach: il.1.1.2
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.1, pp. 51-52"
  text: "ἄειδε is an imperative, 'sing', and θεά, 'goddess', is the Muse it is addressed to. The Odyssey names her in its first line (Μοῦσα), and Homer can also call on the Muses in the plural with no clear change of meaning, as at 2.484, where the poet asks them for the list of the ships. Kirk treats the appeal as a convention of epic openings: the goddess is asked to sing, and the song comes out through the poet. The singers of the Odyssey, Demodokos and Phemios, are likewise said to have their songs from a god. Ancient readers, whose questions survive in the scholia, asked why the poet orders the goddess to sing instead of asking her. Kirk gives such questions little weight."

- id: n.il.1.7.two-men-kirk
  attach: il.1.7
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.1 and 1.1-7, pp. 51-52"
  text: "Line 7 names the two parties to the quarrel, Agamemnon by his father and title, Achilles by his name and epithet. Kirk does not lay the blame on one side. Agamemnon gives the first offense, and gives it needlessly; Achilles deals with his commander without tact and then defends his own honor so far that it costs his fellow Achaeans, who have done him no wrong. The line also closes the proem's rhythm. Kirk reads it as a rising threefolder, a verse in three word-groups that lengthen toward the end, after lines that mostly divide in two (see the note on 1.17 for these terms)."

- id: n.il.1.3.psychas-kirk
  attach: il.1.3.4
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.3, p. 53"
  text: "The ancient commentaries report that Apollonius of Rhodes read κεφαλάς, 'heads', in his copy where our text has ψυχάς, 'souls'. The variant has some support: 11.55 is almost the same line and does have κεφαλάς. Kirk keeps ψυχάς. In line 4, αὐτούς, the men themselves, means their bodies, and that contrast is clearer if line 3 has just spoken of their souls. On his view the two words differ slightly in what they imply, and the poet chose the one that suits each context; formulaic language, he argues, can be exact as well as loose."

- id: n.il.1.5.pasi-kirk
  attach: il.1.5.3
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.4-5, p. 53"
  text: "Two Alexandrian editors disagreed over lines 4-5. According to Aristarchus, Zenodotus athetized both lines, that is, marked them as not genuine while leaving them in the text. Zenodotus also read δαῖτα, 'feast', where the received text has πᾶσι, 'all', so that the bodies become a meal for the birds. Aristarchus objected that Homer never uses δαίς of food for animals. Kirk regards Zenodotus' change as needless, and also finds Aristarchus' reason wrong, since Homer does use the word that way at 24.43."

- id: n.il.1.9.leto-kirk
  attach: il.1.9.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.8 and 1.9, p. 54"
  text: "Line 8 asks which god set the two men against each other, and line 9 answers: Apollo, named here only by his parents. Kirk reads the question as a device that draws attention to its answer and leads into the story. Naming him through both parents, 'son of Leto and Zeus', is unique in Homer, Kirk notes, and he offers a metrical reason: nowhere else does the poet need a name for Apollo that runs from the start of the line to the main caesura, the pause that falls inside the third foot. The contracted genitive Λητοῦς is, he says, required by the meter. That a god starts the quarrel marks it, in Kirk's reading, as an event of large consequence."

- id: n.il.1.11.ton-kirk
  attach: il.1.11.2
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.10-11 and 1.33, pp. 54, 56"
  text: "In later Greek ὁ, ἡ, τό is the definite article, 'the'. In Homer it is most often a demonstrative pronoun, 'that one' or 'he', and the gloss row gives τόν here as 'that'. Kirk counts τὸν Χρύσην as an unusually advanced use, well on the way to the Attic-Ionic article, while noting Chantraine's view that many Homeric uses keep a sense of emphasis or contrast. He places ὁ γέρων at 1.33 and ὁ γεραιός at 1.35, both 'the old man', close to the article too; there the gloss row gives 'the'."

- id: n.il.1.11.etimasen-kirk
  attach: il.1.11.4
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.10-11, p. 54"
  text: "The manuscripts divide here. Most have ἠτίμησ', from ἀτιμάω; three older witnesses (codex A, codex B, and an Ambrosian codex of the fifth century) have ἠτίμασεν, from ἀτιμάζω, which modern editions print and Weft's edition follows. Kirk records a point against it: ἀτιμάζω is otherwise found only in the Odyssey, 15 times. He still favors it, because the other reading would make the line heavy with spondees for no evident purpose. With ἠτίμασεν the fourth foot is a dactyl, as the meter row shows."

- id: n.il.1.12.enjambment-kirk
  attach: il.1.12.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.12-16 and 1.12, p. 54, citing M. W. Edwards, TAPA 97 (1966)"
  text: "Ἀτρεΐδης supplies the subject that the sentence in line 11 still lacks, and a full stop follows it at once. Kirk, with M. W. Edwards, calls the effect emphatic but harsh, and unusual: the enjambment is integral, meaning the previous line cannot stand as a complete sentence without this word. οὐλομένην at 1.2 is also a word carried over into the next line, but there the rest of the line grows out of it. From here to 1.16 Kirk sees the compressed style of the proem give way to smooth narrative built from formulas, rising to a threefold line at 16."

- id: n.il.1.16.atreida-kirk
  attach: il.1.16.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.16, p. 55"
  text: "Ἀτρεΐδα is a dual, 'the two sons of Atreus', and the gloss marks it 'the-two-'. The dual of this name is rare: Kirk finds it at 19.310 and in the repeat of this whole line at 1.375, and nowhere else. Zenodotus changed it to the plural Ἀτρεΐδας; Aristarchus kept the dual, and the medieval manuscripts have it. Kirk explains the form by its partner in the line, κοσμήτορε λαῶν, 'the two marshals of the peoples', an extension of the common formula ποιμένα λαῶν, 'shepherd of the peoples'. To refer to more than one person in this position, the meter allows the phrase only as a dual."

- id: n.il.1.34.silence-kirk
  attach: il.1.34.3
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.34, pp. 56-57"
  text: "Chryses walks ἀκέων, 'in silence', beside the πολυφλοίσβοιο θαλάσσης, 'the much-roaring sea'. Kirk asks whether a contrast between the quiet man and the loud sea is intended, and answers that on the surface it is not. The priest is silent because he has chosen to obey and say nothing, and the sea's epithet is its usual one in the genitive at this point in the line. He allows the scene a second level, however. Elsewhere in the poem a walk by the sea often goes with strain or grief: Achilles mourning at 23.59, the embassy of book 9 (9.182), the reluctant heralds at 1.327. By that association, Kirk suggests, the silence here may be ominous."

- id: n.il.1.35.apaneuthe-kirk
  attach: il.1.35.4
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.35-6, p. 57"
  text: "ἀπάνευθε κιών, 'going apart'. Kirk places the phrase in a small set that begin alike and end in a short word of similar sound: ἀπάνευθε θεῶν, 'apart from the gods' (three times in the Iliad), ἀπάνευθε νεῶν, 'apart from the ships' (four times; one is at 1.48 below), and ἀπάνευθε κιών (once in the Iliad, twice in the Odyssey). He describes the set as generated by ear. As to why the priest withdraws, the scholia suggest he did not want the enemy to overhear; Kirk thinks it more likely that praying alone adds force to the prayer and to his personal claim on the god. He hears 35 as a solemn rising threefolder, made more formal by the naming of Apollo's mother in 36."

- id: n.il.1.39.erepsa-kirk
  attach: il.1.39.8
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.39, p. 57"
  text: "ἔρεψα, 'I roofed', from ἐρέφω or ἐρέπτω. Among his claims on Apollo, Chryses says he once roofed a temple for him. Kirk suggests the verb may stand for finishing a temple, and not for putting up a simple shelter that was little more than a roof on posts. He points to models of temples and houses from the ninth century BC, which already show complete walls, some with a rounded end. The gloss keeps the literal sense."

- id: n.il.1.42.danaoi-kirk
  attach: il.1.42.2
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.42, p. 58"
  text: "Δαναοί, 'Danaans', is another of Homer's names for the Achaeans, who are also called Ἀργεῖοι, 'Argives'. Kirk takes the name to imply descent from Danaos, a king of myth who took refuge in Argos together with the Danaids, his daughters. The line is the whole of the request in Chryses' prayer: that the Danaans pay for his tears with Apollo's arrows. Kirk notes how short it is, close to an epigram, and that it still covers everything the priest wants."

- id: n.il.1.47.suspect-kirk
  attach: il.1.47
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.44-7, p. 58"
  text: "Zenodotus athetized lines 46-47 without a recorded reason, and Aristarchus disagreed. Kirk finds some ground for suspecting 47 of being an addition by rhapsodes, the professional reciters who carried the poems after their composition. In this line αὐτοῦ, 'himself', is set against nothing, and a further mention of the god in motion adds little after 44-46. Kirk asks whether χωομένοιο, 'raging', at the end of 46 has taken the place of an original κινυμένοιο, 'moving', a phrase found at 14.173, with the idea of motion then spun out into 47 as κινηθέντος. He keeps 'like night' as effective, whatever the history of the line."
- id: n.il.1.10.orse-kirk
  attach: il.1.10.4
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.10-11, p. 54"
  text: "Editions differ on the augment here. This page follows its source edition in printing ὄρσε; the text Kirk comments on reads ὦρσε, with the augment, and his count of the verb's uses assumes that form. The meaning, 'roused', is the same."

- id: n.il.1.69.calchas-kirk
  attach: il.1.69.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.69-70 and 1.71, pp. 60-61; page numbers estimated from Kirk's index, the copy used having none"
  text: "Κάλχας Θεστορίδης, 'Calchas son of Thestor'. Kirk thinks Calchas is unlikely to be the poet's invention, because his part in the gathering of the fleet at Aulis belongs to the wider story of the war. The father is another matter. Two other minor figures in the Iliad bear the name (12.394, 16.401), and Kirk takes Thestor to be a name of general use with no story attached, though its first syllables may have called θεός, 'god', to mind. οἰωνοπόλος is one who reads birds, a diviner from their flight; lines 70 and 72 make him a seer in the wider sense as well, one who knows what is, what will be, and what was, with a gift of prophecy from Apollo. Line 71 says he guided the ships to Troy. Kirk asks whether this refers to his reading of the omen at Aulis, which Odysseus recalls in book 2, or to a story found outside Homer in which the fleet first landed in Mysia by mistake. He leaves the question open."

- id: n.il.1.91.eukhetai-kirk
  attach: il.1.91.6
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.85-91, 1.90-1 and 1.91, pp. 61-63; page numbers estimated from Kirk's index, the copy used having none"
  text: "In 85-90 Achilles swears that no Achaean will lay hands on Calchas while he lives. Kirk observes that the oath stood complete without Agamemnon's name. Naming him in 90 adds nothing the oath needs and carries a slight insult, and Kirk sees the quarrel as beginning at this point. εὔχεται, glossed 'claims', usually states a standing that is justified, as when Nestor speaks of Agamemnon at 2.82. It can also mean 'boasts', a claim open to doubt, as at 20.102, and Kirk hears that second sense underneath. The irony is sharper because at 1.244 Achilles calls himself ἄριστον Ἀχαιῶν, 'best of the Achaeans'. On the text: the medieval manuscripts all read ἐνὶ στρατῷ, 'in the army', where the ancient critics agreed on Ἀχαιῶν. Weft's edition prints Ἀχαιῶν. Kirk thinks the critics were probably right, and finds it odd that so unusual an agreement among the critics had so little effect on the manuscripts."

- id: n.il.1.98.helikopida-kirk
  attach: il.1.98.7
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.98, p. 63; page numbers estimated from Kirk's index, the copy used having none"
  text: "ἑλικώπιδα, of Chryseis, glossed 'quick-glancing'. Homer uses it of a girl only here, though the masculine form is a formula for the Achaeans, ἑλικῶπες Ἀχαιοί (six times in the Iliad). Kirk suggests that, coming from that formula, it may imply dignity more than charm. The meaning of its first part is disputed. Ancient critics and lexicographers proposed 'black', citing a dialect word, or a sense of turning or 'swivelling', applied in several ways. Leaf preferred 'with rolling eyes', a lively look; Page argued again for 'black-eyed'; Chantraine does not decide. The gloss follows the turning sense, and it is a choice, not a settled meaning. Kirk also draws attention to the order of words: ἀπὸ ... δόμεναι, 'to give back', stands on either side of πατρὶ φίλῳ, 'to her dear father', which puts weight on the father as the one to receive her."

- id: n.il.1.120.geras-kirk
  attach: il.1.120.8
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.106-20, 1.113, 1.116-17 and 1.119, pp. 64-66; page numbers estimated from Kirk's index, the copy used having none"
  text: "γέρας, 'prize', is the share of honor each Argive receives when booty is taken; as commander Agamemnon has first claim. Kirk notes that the present prizes came from raids on other towns of the Troad. He reads Agamemnon's speech (106-20) in three stages: a slur on Calchas as a prophet; a central sentence (109-15) that compares Chryseis openly with his wife; and a closing demand for an equal prize at once. In 116-17 the king agrees to give the girl back, which suggests, on Kirk's reading and unless anger has made the king inconsistent, that his complaint against the seer was that his prophecies were unwelcome, not that they were false. The demand in 118-20 is a way of saving face: he will give up his prize only if another of equal worth takes its place. The wife's name appears in 113 as Κλυταιμνήστρης. Kirk follows the view that the original spelling had no nu, Klutaimestre, 'famous in counsel', and that the medieval spelling is a later change."

- id: n.il.1.170.oio-kirk
  attach: il.1.170.8
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.169-71, p. 69; page numbers estimated from Kirk's index, the copy used having none"
  text: "Achilles' speech ends (169-71) not with the expected statement that he will stop fighting but with a plainer and larger threat: he will go home to Phthia. Kirk observes how the paratactic style, which sets clauses side by side, handles the logic here. The clause with ἐπεί, 'since it is much better to go home', looks like the reason but works as an aside; the real reason, that he is dishonored, comes afterwards in a clause joined by οὐδέ, 'nor do I mean to...'. In 170 σ' stands for σοι, 'for you', elided. ὀΐω, glossed 'I-think', is used of a personal expectation, and Kirk notes that here it comes close to 'I intend'. He sets it apart from νομίζω, to hold a belief on accepted grounds, and ἡγέομαι, to judge after reflection."

- id: n.il.1.185.autos-kirk
  attach: il.1.185.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.185, pp. 71-72; page numbers estimated from Kirk's index, the copy used having none"
  text: "αὐτὸς ἰὼν κλισίην δὲ, 'going myself to your hut' (Kirk's text prints κλισίηνδε as one word). Agamemnon says he will take Briseis in person; in the event he sends two heralds (320-48). Kirk first explains the difference by character. The threat grows as the quarrel goes on: at 137-9 the king would take the prize of Achilles, Ajax or Odysseus if no substitute were found; at 161 Achilles repeats the threat with αὐτός, which need not yet mean 'in person'; here Agamemnon drops the alternatives and makes the personal threat explicit; at 324-5 he keeps it only as a fallback, with many men behind him. Later passages are harder. At 356 Achilles tells Thetis that Agamemnon took the girl himself, and at 391-2 that the heralds took her; Thersites repeats the first version before the whole army at 2.240. Kirk does not conclude that two separate versions have been joined. He suggests that a threat may have come to stand, for some characters and at moments for the poet, as the thing that happened, and he allows for some inconsistency of the kind oral composition produces."

- id: n.il.1.197.athena-kirk
  attach: il.1.197.6
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.193-4, 1.197 and 1.198, pp. 73-74; page numbers estimated from Kirk's index, the copy used having none"
  text: "Athena takes Achilles by his fair hair (ξανθῆς ... κόμης). Kirk understands a sharp pull to get his attention, and counts it perhaps the most striking physical act of a god in the poem. Gods touch the world elsewhere too (Aphrodite carrying a chair at 3.424, Ares stripping a warrior at 5.841-4, Apollo knocking the armor from Patroclus in book 16), but there they come veiled or disguised; here Athena stands beside Achilles as herself, visible to him alone (198). As to what she stands for, Kirk allows that she may in part embody his own decision to go no further, as Aphrodite in book 3 in part embodies Helen's feelings, and that she represents the order the gods uphold among men. She also acts as a person within the story, and Achilles gives way to her divinity more than to her arguments (216-18). In 193-4 his debate with himself and the drawing of his sword happen together; Kirk suggests the sword shows more truly than 193 what was about to happen."

- id: n.il.1.234.sceptre-kirk
  attach: il.1.234.4
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.233-44, 1.234-9, 1.240-4 and 1.245-6, pp. 77-78; page numbers estimated from Kirk's index, the copy used having none"
  text: "σκῆπτρον, 'sceptre' or staff. The speaker in an assembly is given it by a herald while he speaks; Kirk reads it as a token of authority that reaches back, through the kings, to Zeus. Lines 237-9 say it is carried by the men who give judgment and guard the ordinances that come from Zeus; Agamemnon's own sceptre, at 2.100-8, came down to him from Zeus. Achilles swears by it and binds the oath to something that cannot happen: the staff, cut in the mountains and stripped by bronze (235-6), will never grow leaves again, and the oath will be kept as surely. Kirk compares this unfolding of detail to the way a simile is developed, for emphasis and to make the oath more solemn. The oath itself (240-4) is indirect, close to a riddle at first: the Achaeans will miss Achilles, and Agamemnon will be unable to help them as they fall to Hector. Throwing the staff down (245-6) shows his frustration, as when Telemachus does the same at Odyssey 2.80-1, and in Kirk's reading also confirms the oath."

- id: n.il.1.250.meropes-kirk
  attach: il.1.250.7
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.250, pp. 79-80; page numbers estimated from Kirk's index, the copy used having none"
  text: "μερόπων ἀνθρώπων is a formula (seven times in the Iliad, twice in the Odyssey) whose meaning later Greeks no longer knew; the gloss gives 'of-mortal', a conventional rendering. The common ancient explanation split μέροψ into μερ-, 'divide', and ὄψ, 'voice': men who divide their speech into words, 'articulate'. Kirk, following Leaf, doubts this. ὄψ once began with a digamma (w), and if the compound were old, the syllable before it would scan long, which it does not. Other leads come from names: the early people of Kos were called Meropes, and μέροψ is also a bird, the bee-eater, so the word might be a tribal name of a kind formed from birds. That still leaves open why that name should be given to all mankind. Kirk judges the formula old, since no one later understood it and it had time to produce an unmetrical nominative, μέροπες ἄνθρωποι, at 18.288. He finds none of the explanations compelling."

- id: n.il.1.252.nestor-kirk
  attach: il.1.252.6
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.247, 1.247-52 and 1.250-2, pp. 78-79; page numbers estimated from Kirk's index, the copy used having none"
  text: "Nestor is described at some length at his first appearance (247-52), while Achilles and Agamemnon were assumed to be known. Kirk gives two possible reasons: some of the audience may not have known him, or the poet wants to give weight to his advice. He is brought in within line 247 itself, in the verse where Agamemnon rages on the other side, and Kirk takes this as a sign that his attempt at mediation was part of the scene from the start, not a later addition. μετὰ δὲ τριτάτοισιν ἄνασσεν, 'and he was ruling among the third'. The ancient commentators reasoned that two generations of his subjects had died and he now ruled the third; at about thirty years a generation, he would be over sixty, perhaps near seventy. At Odyssey 3.245 Telemachus says Nestor is said to have ruled over three generations. Kirk suggests that 'among the third' and 'over three' may have been confused, and notes that the wording in the Odyssey is ambiguous."

- id: n.il.1.348.briseis-kirk
  attach: il.1.348.3
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.348 and 1.429-30, pp. 87-88, 97; page numbers estimated from Kirk's index, the copy used having none"
  text: "ἀέκουσ', 'unwilling'. The single word suggests, on Kirk's reading, that Briseis is attached to Achilles. Kirk adds that she was fond of Patroclus as well, as her lament over him at 19.287-300 shows; there she recalls his promise that Achilles would make her his wife in Phthia, and Kirk doubts that it would have happened. Achilles weeps in the next line, and Kirk attributes the tears more to the insult to his honor than to losing her. At 429-30 the poem stresses his unwillingness, βίῃ ἀέκοντος, 'by force, against his will', where here it stressed hers. Later, at 19.59-60, when he sees her as an indirect cause of Patroclus' death, he wishes she had died when Lyrnessus was taken."

- id: n.il.1.416.aisa-kirk
  attach: il.1.416.5
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.414, 1.416 and 1.417-18, pp. 95-96; page numbers estimated from Kirk's index, the copy used having none"
  text: "αἶσα μίνυνθά περ, οὔ τι μάλα δήν, roughly 'your portion is brief, not long at all'. Kirk calls the construction strained, because there is no verb. Supplying ἐστί, 'is', does not help: μίνυνθα, 'for a short time', should go with a verb of action or duration, as at 13.573. The sense wanted is 'it is your lot to live a short time', but Greek would not leave 'to live' unexpressed. The alternative is that αἶσα itself means 'allotted span of life', and Kirk notes that 418 tells against it, where κακῇ αἴσῃ means only 'to an evil fate'. The lines form a ring: 418, τώ σε κακῇ αἴσῃ τέκον, 'so I bore you to an evil fate', answers Thetis' question at 414, and in between stands αἶσα in 416. On Kirk's reading Achilles is ill-fated twice over, short-lived and unhappy. αἰνὰ τεκοῦσα in 414, 'having borne you to sorrow', is found only here in Homer; Kirk compares αἰνὰ παθοῦσα in a lament at 22.431 and suggests the phrase belongs to the language of laments."

- id: n.il.1.423.ethiopians-kirk
  attach: il.1.423.7
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.222, 1.423-5 and 1.493-4, pp. 76, 96-97, 105; page numbers estimated from Kirk's index, the copy used having none"
  text: "Thetis says that Zeus went yesterday to Ocean, to feast among the Ethiopians, with all the gods, and will come back on the twelfth day (423-5). Kirk notes that this surprises the audience, though Achilles makes no comment: at 420 Thetis seemed about to go to Olympus at once, and at 221-2 Athena had returned to Olympus that same day to join the other gods. Aristarchus considered athetizing 222 for this reason. Kirk thinks the inconsistency arises here instead, as the poet develops the Thetis scene, and calls it mild. One purpose of the interval, Kirk suggests, might be to give time for Chryseis to be returned (430-87). Some scholars connect it with the eleven days of book 24 (24.31); Kirk doubts a planned link, since book 24 has two eleven-day intervals of its own, related to each other. He also points to formulas built on δυωδεκάτη, 'twelfth', which make intervals of this length easy to express, as at 493. In 424 Weft's text reads κατὰ δαῖτα, 'to a feast'. Kirk reports that Aristarchus cited strong ancient support for this reading, while the medieval manuscripts kept μετὰ δαῖτα."

- id: n.il.1.458.sacrifice-kirk
  attach: il.1.458.6
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.447-68 and 1.462-3, pp. 100-102; page numbers estimated from Kirk's index, the copy used having none"
  text: "οὐλοχύτας, 'barley-grains', scattered over the victims. Lines 447-68 are what Kirk calls a typical scene, a recurring action told largely in stock lines: an animal sacrifice followed by a meal. It is the fullest account of a sacrifice in the Iliad, and only Nestor's in Odyssey 3 is fuller. Kirk sets out the steps. The cattle are placed round the altar; the men wash their hands and take up the barley; the priest prays (451-6); they throw the barley onto the victims (458), pull the heads back so the throats face the sky, slaughter and skin them; they cut out the thigh-bones, wrap them in a double layer of fat and lay raw meat on top, which Odyssey 14.427 shows was taken from every limb, so that the whole animal is represented; the priest burns these and pours wine over them; the men eat the innards, then cut up and roast the rest on spits and make ready the meal. Other acts known from Homer, such as gilding the horns or stunning the victim with an axe, are not mentioned here. Kirk notes that in 462-3, where the priest himself burns the offering, the passage follows the version used for Nestor and not that of Agamemnon's sacrifice in book 2, and he takes this as adjustment to a sacrifice led by a priest."

- id: n.il.1.512.supplication-kirk
  attach: il.1.512.9
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.500-1, 1.511-12, 1.512-13, 1.514-16 and 1.514, pp. 106-107; page numbers estimated from Kirk's index, the copy used having none"
  text: "Zeus answers Thetis first with a long silence (511-12), and she keeps her hold on his knees (γούνων). Kirk explains the knee and the chin (500-1) as the standard points of contact for one who begs, sometimes with a kiss added. Among the cases he cites: Thetis' plea is recalled at 8.370-2 as kissing Zeus's knees and taking his chin; Dolon tries to touch Diomedes' chin at 10.454-5; Lycaon holds Achilles' knees at 21.67-75; Priam takes hold of Achilles at 24.477-9. On Kirk's account the knees and chin stand for concentrations of a person's life and strength, which is why the suppliant must touch them. In 514-16 Thetis presses for a definite promise. She does not cite her earlier service to Zeus, which Achilles had urged on her (396-406), but says a refusal would show how little he honors her. Kirk sees in 514 a hint of the solemn nod that follows."

- id: n.il.1.526.tekmor-kirk
  attach: il.1.526.1
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.525-7, 1.528-30 and 1.529-30, pp. 108-109; page numbers estimated from Kirk's index, the copy used having none"
  text: "τέκμωρ, glossed 'sign'. It is an old word: Aristotle is reported to have taken it as an old word for 'goal' or 'end', and LSJ gives 'fixed mark or boundary'. Here Kirk takes it as the fixing of a resolve. In Kirk's reading Zeus turns a gesture people use every day into a binding act, and 526-7 spell out its force as a legal text might: what he nods to cannot be taken back, does not deceive, and will be fulfilled. τέκμωρ is carried over from 525 as a single runover word, separated from its adjective μέγιστον at the end of the line before; Kirk calls the enjambment violent and takes it to put weight on the word. He is tempted to read ἐμοί for ἐμόν in 526. The nod itself (528-30) is told in resonant words, and it was said in antiquity that these lines inspired Pheidias' statue of Zeus at Olympia. Kirk treats the shaking of Olympus as mainly figurative; if a physical cause is wanted, he suggests Zeus moving on his throne rather than the nod."

- id: n.il.1.593.lemnos-kirk
  attach: il.1.593.3
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.586-94, 1.592-4 and 1.599-600, pp. 113-114; page numbers estimated from Kirk's index, the copy used having none"
  text: "Hephaestus reminds Hera (586-94) what happened when he once tried to help her against Zeus: he was thrown from Olympus, fell for a whole day, and came down on Lemnos with little breath left. Kirk takes him to be referring, presumably, to the episode of 15.18-24, when Zeus hung Hera with anvils at her feet and threw down anyone who tried to free her. At 18.394-9 a different story is told: Hera herself threw her son out because he was lame, and Thetis rescued him. Kirk infers two contradictory accounts of the lameness, one used here to make Hephaestus the peacemaker and the other used later to give him cause for gratitude to Thetis. Kirk connects Hephaestus' standing on Lemnos with the gas that escapes from the ground there and with the island's position off the coast of Asia, where he places the origin of the smith god. Its pre-Greek inhabitants are the Sinties (594). The gods' laughter at 599-600 is explained in the ancient commentaries (the bT scholia), in an account Kirk thinks probably right, by the sight of the lame god bustling about as wine-pourer, a task that belongs to Hebe or Ganymede. Milton reworked the fall in Paradise Lost 1.740-6."

- id: n.il.1.607.amphigueeis-kirk
  attach: il.1.607.5
  kind: editorial
  status: draft
  by: "Claude (Weft phase 0), for review by Skip and a scholar"
  leans_on: "G. S. Kirk, The Iliad: A Commentary I (Cambridge 1985), on 1.607, p. 114; page numbers estimated from Kirk's index, the copy used having none"
  text: "ἀμφιγυήεις, an epithet of Hephaestus, glossed 'lame-in-both-feet', the traditional reading; its meaning has been much debated. Chantraine treats it as an extended form of ἀμφίγυος, an obscure word that the Iliad applies to spears, probably 'flexible'. At 8.402 and 416 the verb γυιόω means 'make lame', but Kirk asks whether that sense may itself come from the assumption that Hephaestus' epithet meant crippled. At 18.397 he is called χωλός, 'lame', but unlike Thersites at 2.217 he is not said to be lame in one leg. Kirk raises the possibility that the word meant 'curved on both sides', from a root γυ-, 'curve', that is, badly bow-legged. He puts this as a question, not a conclusion."
