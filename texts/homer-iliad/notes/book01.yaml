# Notes for Iliad book 1. Editorial notes are drafts until a reviewer lifts them.
- id: n.il.1.1.menin
  attach: il.1.1.1
  kind: editorial
  status: draft
  leans_on: "Leonard Muellner, The Anger of Achilles: Mênis in Greek Epic (1996)"
  text: "The poem's first word is μῆνιν, 'wrath', and it names the subject. In early Greek epic μῆνις is used chiefly of the anger of gods; Achilles is the one mortal whose anger it names repeatedly. The Odyssey opens the same way, with its subject in the accusative: ἄνδρα, 'the man'."
- id: n.il.1.1.synizesis
  attach: il.1.1.4
  kind: editorial
  status: draft
  text: "Πηληϊάδεω has five written vowels but four syllables in the verse: the final -εω is sounded as one syllable (synizesis). The sound row keeps it as two, because Weft phonemizes each word alone; the metre row follows the verse."
- id: n.il.1.3.hades
  attach: il.1.3.5
  kind: editorial
  status: draft
  text: "Ἄϊδι is the dative of Ἀΐδης, the older form of the name Hades. The treebank gives this word no lemma or tag; they are filled in by hand here and marked draft."
- id: n.il.1.3.spondees
  attach: il.1.3
  kind: editorial
  status: draft
  text: "The first three feet of this line are all spondees, two long syllables each, so the line moves slowly where it sends the souls down to Hades. The observation is a common one; whether Homer intended the effect cannot be shown."
- id: n.il.1.4.autous
  attach: il.1.4.2
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.3-5"
  text: "αὐτούς, 'themselves', refers to the heroes' bodies, set against their ψυχάς, 'souls', in the line before. The man himself is what is left on the field for dogs and birds. Lang, Leaf and Myers make this explicit with 'their bodies'."
- id: n.il.1.5.boule
  attach: il.1.5.6
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.5"
  text: "ἐτελείετο is imperfect, 'was being accomplished': the plan of Zeus works itself out over the whole poem, not in one act. What the plan is, the proem does not say. Kirk, following the ancient scholar Aristarchus, takes it to be the promise Zeus makes to Thetis later in this book (1.524-30), to honour her son Achilles by letting the Trojans prevail for a time. A post-Homeric epic, the Cypria, gave the same phrase another meaning: Zeus's plan to relieve the overburdened earth by thinning its people through war."
- id: n.il.1.6.dual
  attach: il.1.6.6
  kind: editorial
  status: draft
  text: "διαστήτην and ἐρίσαντε are dual forms. Greek had a separate grammatical number for pairs, and Homer uses it here for the two men, Agamemnon and Achilles. The gloss marks it as 'the-two'."
- id: n.il.1.1.proem
  attach: il.1.1
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.1-7"
  text: "The opening follows the convention of epic: an appeal to the Muse, then a statement of the theme. The ancient text was not fixed. Kirk records that the bibliophile Apellicon owned a copy that began with a single different verse, and that Aristoxenus knew a three-verse opening in place of the first nine. Kirk accepts the first of Aristoxenus's verses as genuinely Iliadic, since it occurs four times in the poem, but judges the other two an inept condensation and Apellicon's single verse unsatisfactory. He calls the proem as we have it 'typically Homeric in its forceful conciseness'."
- id: n.il.1.1.first-word
  attach: il.1.1.1
  kind: editorial
  status: draft
  leans_on: "Emily Wilson, The Iliad (2023), translator's note; Robert Fagles, The Iliad (1990)"
  text: "English translators have taken the first word in different ways. Lang, Leaf and Myers (1883) write 'the wrath', Butler (1898) 'the anger'. Robert Fagles (1990) keeps the word first, as Homer does: 'Rage—Goddess, sing the rage of Peleus' son Achilles'. Emily Wilson (2023) begins 'Goddess, sing of the cataclysmic wrath'. In her translator's note she explains that she chose the four-syllable 'cataclysmic' to answer the four-syllable οὐλομένην, which Homer places at the start of line 2."
- id: n.il.1.2.runover
  attach: il.1.2.1
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.2, citing Walter Leaf (1900)"
  text: "οὐλομένην completes the sense of line 1 but stands at the start of line 2, and the rest of line 2 grows out of it: 'ruinous, which set countless pains on the Achaeans'. Kirk calls it an emphatic runover word, a habit of Homer's cumulative style that recurs in lines 3 and 4. Leaf's commentary rendered it 'accursed'."
- id: n.il.1.6.ex-hou
  attach: il.1.6.2
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.6-7; Emily Wilson, The Iliad (2023)"
  text: "ἐξ οὗ can be read two ways. As 'from the time when', it dates the start of Zeus's plan. As 'from the point at which', it goes back to 'sing' in line 1 and tells the Muse where to begin: with the quarrel. Kirk prefers the second, against Aristarchus, comparing the Odyssey's singer Demodokos, who takes up his song 'from where' the story starts (Od. 8.500). Emily Wilson's 'starting with the conflict' (2023) takes it the second way. The gloss follows the first reading; the second is at least as likely."
# Notes for 1.8-52 (added 2026-10-01).
- id: n.il.1.14.stemmata
  attach: il.1.14.1
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.14-15"
  text: "στέμματα are wreaths or fillets. Line 14 has Chryses holding them in his hands; line 15 then places them on a golden staff (σκῆπτρον). Kirk takes them to be woollen fillets tied to the priest's staff as a sign of holiness, so that what Chryses holds is the staff. He reads the small mismatch between the two lines as the kind of imprecision the cumulative style can produce, where a half-line adds a detail to a picture already given, and not as a later addition. Staff and fillet return in Agamemnon's reply at 1.28, where he says they will not help the priest. Butler renders the pair as 'the sceptre of Apollo wreathed with a suppliant's wreath'; Lang, Leaf and Myers as 'the fillet of Apollo the Far-darter upon a golden staff'."
- id: n.il.1.17.verse-pattern
  attach: il.1.17
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), introduction ch. 2 and on 1.10-11, 1.17-21"
  text: "The metre row gives the feet; Kirk adds a second description of each verse, by where its word-breaks fall. The breaks divide a line into rhythmical cola, so that a verse reads in two parts, three or four. In a 'rising threefolder' the three cola grow longer toward the end, and Kirk hears it as more urgent than the balanced kinds. Chryses' speech (1.17-21) is his example of ordered variation: 17 and 18 in two parts, 19 and 20 as parallel rising threefolders that both end in an infinitive in -σθαι, and 21 back in two parts, holding Apollo's name for the close. He contrasts 1.10-11, which he finds unusually stiff: line 10 breaks after the second foot, which is rare in its pattern, and line 11 repeats a dactyl followed by two spondees, as its metre row shows. He leaves open whether the stiffness comes from compressing the story or from corruption in a much-sung passage."
- id: n.il.1.18.theoi
  attach: il.1.18.3
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.18"
  text: "Here θεοί must be sounded as one syllable (synizesis) for the line to scan. Kirk counts 88 nominatives of θεοί in the Iliad and 94 in the Odyssey and finds this the only one scanned this way. He doubts that the poet needed so rare a pronunciation for so simple a wish, and suspects the text. Of the proposed corrections he prefers one by Richard Bentley, which keeps θεοί at two syllables by rearranging the opening words, at the cost of placing μέν unusually late. Weft's hexameter scanner reaches the same reading and flags the line: this is the only synizesis in 1.1-52 that its rules do not predict (those at 1.1 and 1.15 are the regular endings -εω and -έῳ)."
- id: n.il.1.25.tmesis
  attach: il.1.25.6
  kind: editorial
  status: draft
  text: "ἐπὶ ... ἔτελλε is a compound verb, ἐπιτέλλω, 'lay a command on', with its prefix standing apart as a separate word. Later grammarians called this tmesis, 'cutting'. In Homer's language the prefixes were still independent adverbs that could stand away from the verb, so the term describes the later spelling more than a cut. The gloss gives each piece where it stands: 'upon' and 'he-laid'. The same pattern may occur at 1.40, κατὰ ... ἔκηα, 'burned down', and at 1.48, μετὰ ... ἕηκε, where μετά may instead be an adverb, 'among them'. The two readings give nearly the same sense."
- id: n.il.1.26.agamemnon
  attach: il.1.26
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.25, 1.26-32, 1.29-31"
  text: "Agamemnon's reply is built in four parts, as Kirk describes it. Three cumulative lines (26-28) make an indirect prohibition, 'let me not find you', widened to 'either now or later' and ending in the threat that the god's staff and fillet will not protect the priest. Then a short flat refusal at the start of 29, 'I will not free her'. Then a sentence of about the same length (29-31) about the daughter's future, far from home, at the loom and in his bed. Last, a single line of command (32). The two words of 25 that introduce the speech, κακῶς and κρατερόν, 'harshly' and 'strong', set its tone after the mild line before. The ancient editor Aristarchus marked 29-31 as spurious on the ground that they were unfitting for Agamemnon to say; Kirk reports the judgment and does not accept it."
- id: n.il.1.39.smintheus
  attach: il.1.39.1
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.37-42, 1.37-8, 1.39"
  text: "Chryses' prayer (1.37-42) follows the usual order of a Greek prayer as Kirk describes it: the god's titles and the places he protects, then the worshipper's claims on him (a temple roofed, thigh-pieces burned), then the request, which is brief. Chryse is the priest's home town, and his name is taken from it. The title Smintheus was already disputed in antiquity. Aristarchus derived it from a town in the Troad called Sminthe; others connected it with σμίνθος, said to be a Mysian word for 'mouse', which would make Apollo a mouse-god or a protector against mice, and they pointed to a festival on Rhodes, the Smintheia. Kirk records both views. He notes slight remains of a temple of Apollo Smintheus near the later city of Hamaxitos, on the west coast of the Troad, where Chryse probably lay."
- id: n.il.1.50.plague
  attach: il.1.50.1
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.44-7 and 1.50"
  text: "Apollo comes down from Olympus in person; Kirk suggests that as an archer he needs to be near the spot. His arrows clang on his shoulders as he moves, and he goes 'like night', a comparison Kirk notes is found nowhere else in the Iliad. The first victims are mules and dogs. Ancient commentators offered reasons: a warning to the men, or that these animals sniff and so catch disease first. Kirk finds the detail striking and suggests it may preserve the memory of a real epidemic, comparing Thucydides' account of the Athenian plague (2.50), where animals are also affected. In Homer, Apollo's arrows usually stand for sudden death among men, often by disease, as Artemis's do for women. The text itself says only that he shot; it does not name the disease."
- id: n.il.1.51.belos
  attach: il.1.51.4
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.51"
  text: "βέλος ends in a short vowel and a single consonant, and the next word begins with a vowel, so by the ordinary rules its last syllable is short. The verse needs it long, at the start of the fourth foot. Kirk calls this 'an unusually violent case of metrical lengthening'; the same phrase, βέλος ἐχεπευκές, recurs at 4.129. The epithet means 'pointed' (Kirk); the gloss gives its parts, 'point-holding'. Weft's hexameter scanner reaches the same scansion and flags the line. The passage has milder cases of the same licence: the first syllable of Ἀπόλλων at 1.14, 1.21 and 1.36, the last syllable of πόλιν at 1.19, and the final α of ἀμφηρεφέα at 1.45."
- id: n.il.1.52.nine-days
  attach: il.1.52
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.53-4"
  text: "The passage ends with the pyres burning without pause. The next line, 1.53, outside this extract, gives the length of the plague: ἐννῆμαρ, 'for nine days'. An ancient note explains the number by saying the poet is inclined to nines. Kirk agrees that nine recurs, and calls it a conventional interval in the oral tradition. He sets aside other ancient explanations, among them that nine days is the time a fever takes to reach its crisis."
- id: n.il.1.12.formulae
  attach: il.1.12
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), introduction ch. 2 (ii) and on 1.13; J. B. Hainsworth, The Flexibility of the Homeric Formula (1968), as summarized by Kirk"
  text: "Many phrases in this passage recur across the poems in the same place in the line. The commonest kind joins a noun to a fixed epithet: θοὰς ἐπὶ νῆας Ἀχαιῶν, 'to the swift ships of the Achaeans' (1.12), ἐϋκνήμιδες Ἀχαιοί, 'well-greaved Achaeans' (1.17), ἑκηβόλου Ἀπόλλωνος, 'far-shooting Apollo' (1.14, 1.21), πολυφλοίσβοιο θαλάσσης, 'the much-roaring sea' (1.34). Kirk, following Hainsworth's counts, shows that such noun-epithet groups gather in the last two feet of the line. A name takes different epithets to fill different lengths: Achilles is δῖος Ἀχιλλεύς at 1.7, filling the last two feet, and πόδας ὠκὺς Ἀχιλλεύς, 'swift-footed Achilles', a longer phrase, at 1.58, just beyond this extract. Formulas are not limited to names. On 1.13 Kirk points to a set of phrases for ransom, ἀπερείσι' ἄποινα (13), ἄποινα δέχεσθαι (20), δέχθαι ἄποινα (23). The epithet usually names a standing quality rather than the state of the moment: the ships are called swift though here they are not moving."
