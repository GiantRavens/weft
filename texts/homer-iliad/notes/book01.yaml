# Notes for Iliad book 1. Editorial notes are drafts until a reviewer lifts them.
- id: n.il.1.1.menin
  attach: il.1.1.1
  kind: editorial
  status: draft
  leans_on: "Leonard Muellner, The Anger of Achilles: Mênis in Greek Epic (1996)"
  text: "The poem's first word is μῆνιν, 'wrath', and it names the subject. In early Greek epic μῆνις is used chiefly of the anger of gods; Achilles is the one mortal whose anger it names repeatedly. The Odyssey opens the same way, with its subject in the accusative: ἄνδρα, 'the man'."
- id: n.il.1.1.synizesis
  attach: il.1.1.4
  kind: editorial
  status: draft
  text: "Πηληϊάδεω has five written vowels but four syllables in the verse: the final -εω is sounded as one syllable (synizesis). The sound row keeps it as two, because Weft phonemizes each word alone; the metre row follows the verse."
- id: n.il.1.3.hades
  attach: il.1.3.5
  kind: editorial
  status: draft
  text: "Ἄϊδι is the dative of Ἀΐδης, the older form of the name Hades. The treebank gives this word no lemma or tag; they are filled in by hand here and marked draft."
- id: n.il.1.3.spondees
  attach: il.1.3
  kind: editorial
  status: draft
  text: "The first three feet of this line are all spondees, two long syllables each, so the line moves slowly where it sends the souls down to Hades. The observation is a common one; whether Homer intended the effect cannot be shown."
- id: n.il.1.4.autous
  attach: il.1.4.2
  kind: editorial
  status: draft
  leans_on: "G. S. Kirk, The Iliad: A Commentary, vol. 1 (1985), on 1.3-5"
  text: "αὐτούς, 'themselves', refers to the heroes' bodies, set against their ψυχάς, 'souls', in the line before. The man himself is what is left on the field for dogs and birds. Lang, Leaf and Myers make this explicit with 'their bodies'."
- id: n.il.1.5.boule
  attach: il.1.5.6
  kind: editorial
  status: draft
  text: "ἐτελείετο is imperfect, 'was being accomplished': the plan of Zeus works itself out over the whole poem, not in one act."
- id: n.il.1.6.dual
  attach: il.1.6.6
  kind: editorial
  status: draft
  text: "διαστήτην and ἐρίσαντε are dual forms. Greek had a separate grammatical number for pairs, and Homer uses it here for the two men, Agamemnon and Achilles. The gloss marks it as 'the-two'."
