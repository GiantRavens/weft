- by: Claude Opus 5.5 (Weft phase 0), hand scansion of the two lines the hexameter scanner left open
  date: 2026-10-18
  why: "meter for 1.277 (metre-no-fit) and 1.583 (metre-ambiguous); each scanned by hand against the Greek, license named in the comment"
  status: draft
  set:
    il.1.277: {metre: "—◡◡|——|—◡◡|—◡◡|—◡◡|—×", scanner: no-fit}   # synecphonesis: -δη ἔ- of Πηλείδη ἔθελʼ merge into one long syllable (the third princeps); with -η kept separate, by correption or not, the line will not scan. ρι before ζ is long by position (ζ is a double consonant); βασιλῆϊ is four syllables, ῆϊ not a diphthong, final ϊ in the anceps. Some editors print Πηλείδη θέλʼ to avoid the license
    il.1.583: {metre: "—◡◡|——|—◡◡|—◡◡|—◡◡|—×"}   # quantity choice: Homeric ἵλαος has long ι and long α (Attic ἵλεως, by quantitative metathesis from *ἵληος); so θʼ ἵ is long and πει θῑ makes a spondee, and λᾱ opens the third foot. The other reading (—◡◡ in foot 2) needs ι and α short and leaves ος Ὀ- to fill a spondee, which they cannot; the scanner's first option stands
