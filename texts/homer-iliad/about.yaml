  lead: 'The Iliad ( ILL-ee-əd; Ancient Greek: Ἰλιάς, romanized: Iliás [iːliás]; lit. ''[a poem] about
    Ilion (Troy)'') is one of two major surviving ancient Greek epic poems attributed to Homer. It is
    one of the oldest extant works of literature still widely read by modern readers. Like the Odyssey,
    the poem is divided into 24 books and was written in dactylic hexameter. It contains 15,693 lines
    in its standard edition. The Iliad is often regarded as the first substantial piece of European literature
    and is central to the study of classical philology.'
