# Weft edition of four numbers from Le nozze di Figaro (Vienna, 1786), libretto by Lorenzo Da Ponte after Beaumarchais:
# Figaro's cavatina Se vuol ballare (I.2) and aria Non più andrai (I.8), Cherubino's canzone Voi che sapete (II.3) and the
# Countess's aria Dove sono (III.8). Text of Italian Wikisource's libretto (Le nozze di Figaro, by scene); each line is
# checked verbatim against the pinned revisions. verify_strip sets aside the speaker labels, the italic stage and tempo
# directions, the line-leading colons, the <nowiki> around a colon and the page templates. The repeats the libretto
# prints (the return of Se vuol ballare, of Voi che sapete) are kept as printed.
# Da Ponte's forms stand: the apocopes amor, color, onor, cor, desir, martir, saper, piacer, menzogner, almen, ognor;
# the elisions s'io, ch'io, ch'ora, cos'è, 'l; sciabla, adoprando, andaro (for andarono), pugnendo.
#   t     the word as printed, punctuation attached (the ellipsis of Saprò... is the libretto's)
#   Lines are the verses; sections are the four numbers.
work: mozart-figaro
joiner: ' '
verify_strip: (?sm)<noinclude>.*?</noinclude>|''[^'\n]*''|<nowiki>|</nowiki>|\{\{[^{}]*\}\}|<[^>]+>|^[:;]+
