# Human overlay for the Figaro numbers. No treebank covers the libretto; lemma, morphology and gloss are by hand (UD
# Italian conventions, as for the Dante, Petrarch and Verdi works). The apocopated poetic forms keep the full lemma
# (amor: amore, cor: cuore, desir: desire); the formal Le of Figaro's address to the Count is glossed for-you/to-you;
# the gerunds of Se vuol ballare (dissimulando, schermendo, adoprando) are glossed with the English -ing.
