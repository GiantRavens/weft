# Notes on the Figaro numbers.
- id: n.fig.sevuol.1.opera
  attach: fig.sevuol.1.1
  kind: editorial
  status: draft
  leans_on: Da Ponte, Memorie (1823-27); Beaumarchais, La Folle Journée ou le Mariage de Figaro (1784); Daniel Heartz, Mozart's Operas (1990)
  text: Le nozze di Figaro opened at the Burgtheater in Vienna on 1 May 1786. Beaumarchais's play had been banned in Vienna; Da Ponte, the court poet, told the emperor he had cut the politics and kept the
    comedy, and in his memoirs claims six weeks for the libretto. Se vuol ballare is Figaro's first solo, as he realizes why the Count has given the couple the room next to his own; the 'little Count' and
    the 'little guitar' are the diminutives of a servant's mock respect.
- id: n.fig.sevuol.4.le
  attach: fig.sevuol.4.1
  kind: editorial
  status: draft
  leans_on: the grammars of eighteenth-century Italian on Lei and the forms of address
  text: 'Le suonerò, ''I''ll play it for you'': Le is the dative of Lei, the formal ''you'' of the third person, which Figaro keeps to the Count even as he threatens him; the song''s politeness is its menace.
    The verse is a quinario, five syllables, and Mozart set it as a minuet, the Count''s own dance.'
- id: n.fig.nonpiu.1.aria
  attach: fig.nonpiu.1.4
  kind: editorial
  status: draft
  leans_on: Heartz 1990; the libretto's stage direction 'partono tutti alla militare'
  text: 'farfallone amoroso, ''amorous big butterfly'': the page Cherubino, caught once too often, is packed off to the Count''s regiment, and Figaro sings him out of his finery and into the mud. Da Ponte''s
    -one and -etto, -ino suffixes (farfallone, Narcisetto, Adoncino, pennacchini) do the mocking; the aria is in ottonari and ends as a march, ''alla militare''.'
- id: n.fig.nonpiu.11.sciabla
  attach: fig.nonpiu.11.4
  kind: editorial
  status: draft
  leans_on: the 1786 libretto; the Grande dizionario della lingua italiana s.v. sciabola, sciabla
  text: 'sciabla, ''sabre'': the older form of sciabola, from Hungarian szablya through German, the cavalry weapon the Austrian army had made familiar; poffar Bacco, ''by Bacchus'', is a comic oath. The
    list that follows is the soldier''s kit as an eighteenth-century Viennese audience knew it: the stretto sacco is the tight uniform coat, the contante the pay that never comes.'
- id: n.fig.voiche.1.canzone
  attach: fig.voiche.1.1
  kind: editorial
  status: draft
  leans_on: Beaumarchais, Act II (Chérubin's romance 'Mon coursier hors d'haleine'); Heartz 1990
  text: 'Voi che sapete: the one song in the opera that is a song within the play, Cherubino''s canzone sung to the Countess with Susanna''s guitar; in Beaumarchais the page sings a romance to the old tune
    of Marlbrough. Da Ponte''s text is a catalogue of love''s symptoms from Petrarch (in this library, Canzoniere 1): freezing and burning, seeking a good outside oneself, sighing without wanting to. The
    verse is a quinario with the lines in pairs.'
- id: n.fig.dovesono.3.andaro
  attach: fig.dovesono.3.2
  kind: editorial
  status: draft
  leans_on: Metastasio and the language of the eighteenth-century aria; Heartz 1990 on the Countess
  text: 'andaro, ''they went'': the poetic third-person plural of the remote past, for andarono, in the language of the Metastasian aria; menzogner, almen, ognor are its apocopes. Dove sono is the Countess''s
    lament for her marriage, the one number in the opera without comedy, and its second part, the Allegro of hope, is the libretto''s turn from loss to the plot that will shame the Count.'
