  lead: 'The Marriage of Figaro (Italian: Le nozze di Figaro, pronounced [le ˈnɔttse di ˈfiːɡaro] ), K.
    492, is a commedia per musica (opera buffa) in four acts composed in 1786 by Wolfgang Amadeus Mozart,
    with an Italian libretto written by Lorenzo Da Ponte. It premiered at the Burgtheater in Vienna on
    1 May 1786. The opera''s libretto is based on the 1784 stage comedy by Beaumarchais, La folle journée,
    ou le Mariage de Figaro ("The Mad Day, or The Marriage of Figaro"). It tells how the servants Figaro
    and Susanna succeed in getting married, foiling the efforts of their philandering employer Count Almaviva
    to seduce Susanna and teaching him a lesson in fidelity.'
