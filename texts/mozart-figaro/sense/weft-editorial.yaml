# Weft's editorial translation, close to the Italian, one span per number; draft. Natalia Macfarren's singing version (Novello) and Edward Dent's (1937, in copyright) are cited in the manifest, not printed.
translation: weft-editorial
aligned_by: 'hand: one span per number'
spans:
- lines:
  - fig.sevuol.1
  - fig.sevuol.22
  text: 'If you want to dance, my little Count, I''ll play the little guitar for you. If you want to come to my school, I''ll teach you the caper. I''ll know how... But softly: better, by dissembling, I
    can uncover every secret. Fencing with art, employing art, pricking here, jesting there, I''ll overturn all his schemes. If you want to dance, my little Count, I''ll play the little guitar for you.'
- lines:
  - fig.nonpiu.1
  - fig.nonpiu.24
  text: No more, amorous big butterfly, will you go roaming around night and day, disturbing the rest of the beauties, little Narcissus, little Adonis of love. No more will you have these fine little plumes,
    that light and gallant hat, that hair, that brilliant air, that womanish vermilion colour. Among warriors, by Bacchus! Great moustaches, a tight coat, musket on shoulder, sabre at side, neck straight,
    face bold, a great helmet or a great turban, much honour, little cash, and instead of the fandango, a march through the mud. Over mountains, through valleys, with the snows and the dog-days, to the
    concert of trombones, of bombards, of cannons, whose balls in every thunder make your ear whistle. Cherubino, to victory! To military glory!
- lines:
  - fig.voiche.1
  - fig.voiche.32
  text: 'You who know what love is, ladies, see whether I have it in my heart. What I feel I shall tell you; it is new to me, I cannot understand it. I feel a feeling full of desire, which now is delight,
    now is torment. I freeze, and then I feel my soul blaze, and in a moment I turn to freezing again. I seek a good outside myself, I know not who holds it, I know not what it is. I sigh and moan without
    wanting to, I throb and tremble without knowing why, I find no peace night or day: and yet it pleases me to languish so. You who know what love is, ladies, see whether I have it in my heart.'
- lines:
  - fig.dovesono.1
  - fig.dovesono.12
  text: Where are the fair moments of sweetness and pleasure, where did the oaths of that lying lip go? Why ever, if everything changed to tears and pains for me, did the memory of that good not pass out
    of my breast? Ah! if at least my constancy, in languishing and loving still, might bring me a hope of changing that ungrateful heart.
