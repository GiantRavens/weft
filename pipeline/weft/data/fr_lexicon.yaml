# Pronunciation lexicon for Weft's French texts, keyed by the modern spelling of each word
# (the token's n field, lowercased). Hand-written, one entry per word form.
#
#   m1580   IPA, French of about 1580 (approximate; see pipeline/weft/french.py for the evidence
#           and its limits). The form is the word said alone or before a consonant. A final e caduc
#           (ə) is written where the grammarians of the period still count it; french.py drops it
#           before a vowel.
#   modern  IPA, standard modern French, the word said alone.
#   fr1885  IPA, formal Paris reading of the 1880s (the Berlin Act), only where it differs from what
#           french.py derives from the modern form (the length rule). Each such form follows Littré,
#           Dictionnaire de la langue française (1863-1872): pas (pâ), cas (kâ), but (bu), droits
#           (droî), même (mê-m'), être (ê-tr'), côte (kô-t'), crête (krê-t'), accroître (a-kroî-tr').
#           Words used only by the Berlin Act have no m1580 form.
#   lz      the latent final consonant sounded in liaison before a vowel (z t n r k l), if any.
#           In m1580 french.py sounds it before any vowel-initial word with no pause between;
#           in modern only where the edition token sets z: true.
#
# Syllables are divided with dots. Length is shown with ː.
