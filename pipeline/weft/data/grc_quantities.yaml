# Long alpha / iota / upsilon that the orthography does not mark.
# Key: lowercase surface form as printed. Value: same form with U+0304 macron on each long dichronon.
# Circumflex and iota subscript already imply length and need no entry.
# src for each entry: LSJ headword quantity, confirmed against the hexameter where the line scans it.
"ψυχὴν": "ψῡχὴν"          # ψῡχή, LSJ
"ἐρρύσατο": "ἐρρῡ́σατο"  # ῥῡ́ομαι; Od. 1.6 foot 4 long
"ἱέμενός": "ἱ̄έμενός"      # Homeric ῑ́εμαι; Od. 1.6 foot 5 long
"θυμόν": "θῡμόν"          # θῡμός, LSJ; Od. 1.4 foot 6
"ὑπερίονος": "ὑπερῑ́ονος"  # Ὑπερῑ́ων; Od. 1.8 foot 4 long
"θεά": "θεᾱ́"        # θεᾱ́, LSJ; Od. 1.10 foot 3 long
