# Vowel quantities for the Ninety-five Theses, merged after lat_quantities.yaml (manifest list).
# Key: lowercase form as printed. Value: classical form with macrons (Lewis and Short headword
# quantities plus inflectional endings), j and v for consonantal i and u, and + before an enclitic.
# Where the print has e for ae or oe (pena, Pape, celum), the value restores the diphthong, so the
# classical reading is classical; the German and church readings say both as e. Abbreviations are
# keyed as printed, with the dot or capital the plain key would lose (".i" = id est, "S" = sacrae);
# misprints are read as the intended word (prorus = prorsus). Medieval words (purgatorium,
# indulgentia, concionator) take the quantities of their classical stems.

