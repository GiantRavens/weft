# Pronunciation lexicon for Weft's early modern Dutch texts, keyed by the modern spelling of each
# word form (the token's n field, lowercased). Hand-written.
#
# The value is the modern spelling divided into syllables with dots, with ˈ before the stressed
# syllable (ˈei.land). pipeline/weft/dutch.py turns the letters of each syllable into sounds for
# each scheme. Where the letters do not give the sound (names, French and Latin loans), the entry
# is a map with syl and an IPA form per scheme (h1596, modern).
#
# Stress follows the standard pronouncing dictionaries of Dutch for the modern scheme (Van Dale;
# the Woordenlijst Nederlandse Taal for the spelling); the same stress is used for 1596. Loans in
# -eren, -eus, -ent and -tie are stressed on the final full syllable, as in French; for 1596 this is
# an assumption.
#
# Monosyllables need no entry. A polysyllable missing here is divided and stressed by rule and
# reported as syllables-by-rule.
