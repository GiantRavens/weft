# Pronunciation lexicon for Weft's Portuguese texts, keyed by the modern spelling of each word (the token's
# n, else the printed word, lowercased). Hand-written, one entry per word form.
#
#   o   the word in a normalized spelling of the 1540s, one letter per sound in the manner of Fernão de
#       Oliveira (1536) and João de Barros (1540): ç and c before e/i are the dental sibilant, z its voiced
#       pair, s/ss and single s between vowels the apical pair, x = sh, ch the affricate, j and g before e/i
#       = zh, lh, nh. The stressed e and o carry their quality (é ó open, ê ô closed); other accents mark
#       stress where the written rule would not place it; an unmarked stressed e or o is reported by the
#       module as mid-vowel-unknown. All three schemes read this spelling (pipeline/weft/portuguese.py).
#
# Words of Camões, Os Lusíadas I.1-3 (1572). Quality marks follow the standard dictionaries of European
# Portuguese (Porto Editora; Houaiss for the Brazilian norm, which agrees for these words).
