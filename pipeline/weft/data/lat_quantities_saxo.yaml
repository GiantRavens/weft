# Vowel quantities for Saxo, Gesta Danorum 9.3-9.5 (Holder's text), merged after lat_quantities.yaml (manifest list).
# Key: the lowercase form as Holder prints it, without his brackets (auxil⟨i⟩a is keyed auxilia). Value: the classical
# form with macrons on long vowels (Lewis and Short quantities plus the ending), j and v for consonantal i and u, and the
# classical spelling restored where Holder's differs (gracia -> grātia, Suetie -> Suētiae, michi -> mihi, hec -> haec),
# so the classical reading is classical; the danish-medieval reading says the spelling's sounds either way. An enclitic is
# marked with +. Norse names keep unmarked stems and take the long Latin endings (Regnerī, Haraldō); peoples and places
# with classical forms take them (Hellēspontus). One value per form: where a form stands in two cases with different
# lengths (fīlia and fīliā, Hella and Hellā, spīritus and spīritūs, rēgia and rēgiā), the table holds the commoner; the
# stressed syllable is the same in each pair. Written by five annotators on 2026-10-22, merged with one rule for each
# disagreement (j and v; marked endings on names; the majority value).
