# Greek lemmas checked as words though the Perseus LSJ has no headword with their letters: the declared
# exceptions of the lemma-not-in-lexicon sensor (weft.lexica, pin 47). Each says why the lemma stands.
τηλικοῦτος: "demonstrative, 'so great, of such an age', common in Attic prose; not a key in the Perseus LSJ"
καίτοι: "particle, 'and yet'; not a key in the Perseus LSJ"
δούλη: "feminine of δοῦλος, 'female slave'; LSJ s.v. δοῦλος"
εἴωθα: "perfect with present sense, 'be accustomed'; LSJ s.v. ἔθω"
ὁστισοῦν: "ὅστις with -οῦν, 'anyone whatever'; LSJ s.v. ὅστις"
πλησίον: "adverb and preposition, 'near'; LSJ s.v. πλησίος"
αἰδέσιμος: "'venerable', in Marcus and later prose; not a key in the Perseus LSJ"
λύθρος: "masculine 'gore', as Marcus 2.2 prints it in the nominative; LSJ s.v. λύθρον"
εὐχαριεντίζομαι: "Marcus 1.15; LSJ has the simple χαριεντίζομαι, not this compound"
ἀτραγῴδως: "adverb, 'without theatrical airs', Marcus 1.16; LSJ has ἀτραγῴδητος"
οὐερνάκλος: "Latin vernaculus in Greek letters, Marcus 1.16"
