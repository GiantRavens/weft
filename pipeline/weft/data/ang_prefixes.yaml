# Old English unstressed prefixes the rules cannot see without the part of speech.
# Key: normalized form. Value: the unstressed prefix, or "" to block a false ge- (geong, "young").
oftēah: of         # verb oftēon, "take away": of-TĒAH
geong: ""
onstealde: "on"    # verb onstellan, "establish": on-STEAL-de (Cædmon's Hymn, Tanner 10)
āstelidæ: "ā"      # verb āstellan, Northumbrian past: ā-STEL-i-dæ (Cædmon's Hymn, Moore Bede)
