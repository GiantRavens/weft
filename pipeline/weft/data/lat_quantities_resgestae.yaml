# Vowel quantities for the Res Gestae Divi Augusti, merged after lat_quantities.yaml (manifest list).
# Key: lowercase form as printed, brackets removed. Value: classical form with macrons (Lewis and Short
# headword quantities plus inflectional endings), j and v for consonantal i and u, + before an enclitic.
# Printed keys: "C" = Gaio and "A" = Aulo (the capital keeps them apart from the preposition a), "Aug" =
# Augusto, "s.c" = senatus consulto, "senatu[s" = senatus in the genitive at 34.4.
#
# Read for the intended word, not the printed letters: costituendae = constituendae (ch. 1), order = ordo
# (ch. 35), quinquageniens = quinquagiens (ch. 4; no adverb quinquageniens is attested, and Mommsen and
# Shipley print quinquagiens). annus (ch. 35) is read as printed.
#
# Hidden quantities (a vowel before two consonants): long before ns and nf (cōnsul, īnferentis,
# īnscrīptiōnem, dāns, ovāns, impēnsa, cōnsēnsum; Cicero, Orator 159, for in- and con-) and before nx
# (exstīnxeram), as set out in W. S. Allen, Vox Latina (2nd ed., 1978). Uncertain, and left short here:
# the i of adsignavi (some ancient grammarians give a long vowel before gn; the evidence is disputed);
# the e of sescentas (from sex + centum; Lewis and Short mark no length); the u of Augustus and of
# nuncupaveram. None of these changes the stress.
#
# Limits of the Latin module, recorded here rather than worked around: iis is keyed as eīs, a spelling of
# the same form, because the module reads word-initial i before a vowel as consonantal (iīs would come out
# as one syllable, jīs); the true reading is i-īs. The doubled consonantal i of eius (ej-jus) is not
# modeled. senatus is nominative in three places and genitive (senātūs) in two (4.6, 34.3); one table entry
# serves all five, so the classical reading shows a short final u in the two genitives; stress is unaffected.
# The numeral DCCCLXXXX and s.c. are each read as one word, with one stress.

