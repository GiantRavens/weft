# The rest of the inscription, chapters 5-33 (2026-10-18). Same conventions. Forms read for the intended word:
# acciebat = accipiebat, alli = alii, avato = cavato, campam = campum, com = cum, crassao = crasso, hisania =
# hispania, ivierem = viverem, latudinem = latitudinem, mean = meam, neo = meo, perpetum = perpetuum, poera = opera,
# rovos = rivos, sual = sua, viritum = viritim, soliv = solvi, trader = tradere, municpia = municipia;
# dalmateis, emeriteis, quadrigeis = the old ablative -eis for -is; adit = adiit. Uncertain: proper names with no
# secure quantity (Mariba, Nabata, Segimerus, Tincommius, Tiridates, Charydes, Dumnobellaunus and others), ornamenta,
# Martis, signa (left short). Keys for a form that stands in two cases (Africa, Italia, summa, Sicilia, tribunicia,
# P, Ti, M, Cn) take one length; the stress is the same either way.
