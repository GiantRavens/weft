# Latin vowel quantities. Every word needs an entry, even with no long vowels, because
# stress depends on length and a missing word must be reported, not guessed.
# Key: lowercase form as printed. Value: the form with macrons on long vowels, and "+" before
# an enclitic. Source: Lewis and Short headword quantities plus inflectional endings,
# confirmed against the hexameter where the verse scans the syllable (Met. 1.1-9).
in: in
nova: nova
fert: fert
animus: animus
mutatas: mūtātās
dicere: dīcere
formas: fōrmās
corpora: corpora
di: dī
coeptis: coeptīs
nam: nam
vos: vōs
mutastis: mūtāstis
et: et
illas: illās
