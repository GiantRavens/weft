# Vowel quantities for the Bayeux Tapestry captions, merged after lat_quantities.yaml (manifest list).
# Key: lowercase form as printed, with the transcription's square brackets removed (HAROLDU[M] is
# keyed haroldum). Value: classical form with macrons (Lewis and Short headword quantities plus
# inflectional endings), j and v for consonantal i and u.
# Names and spellings that are not classical are read as written: English and Norman names (Harold,
# Willelm, Wilgelm, Edward, Eadward, Wido, Lewine, Gyrð, Stigant) and places (Bosham, Bagias,
# Pevenesæ, Hestenga, ceastra) take no long vowels unless a Latin form is attested (Wido, Widonis
# after Guido, Guidonis), so their stress follows the closed or open penult as spelled. The cloth's
# HIE is a slip for HIC and is read as hic. Pevenesæ is read with ae. The cross that opens scene 38
# is not a word and has no sound; it is keyed to itself so it is not reported as unknown.
