# Vowel quantities for the bull Inter caetera (4 May 1493), merged after lat_quantities.yaml
# (manifest list), for words the shared table lacks.
# Key: lowercase form as printed. Value: classical form with macrons on long vowels (Lewis and
# Short headword quantities plus inflectional endings), j and v for consonantal i and u, and + before
# the enclitic -que. Where the chancery writes e for ae (cetera, regine, presertim, que), the value
# restores the diphthong, so the classical reading is classical; the Italian reading says both as e.
# Where it writes ci for ti before a vowel (instanciam, preciose), the value has ti; Italian readers
# said both as tsi. The chancery's ch and h are kept (nichilominus, Jhesu is read as Jesu): the
# Italian reading says ch as k and leaves h silent, which is what the spelling records.
# Medieval and chancery words (actualiter, vicariatus, jurisdictio, capitaneus) take the quantities
# of their classical stems. Names: Granata after Spanish Granada (stress gra-NA-ta); Azores and
# Caboverde, Spanish names, are given the stress of the Spanish (a-ZO-res, ca-bo-VER-de);
# Elisabeth, Colon and Fernando are left to the Latin rule, and the notes say so.

