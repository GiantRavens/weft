# The rest of the bull (2026-10-18): the passages on Granada and the sovereigns' purpose, the exhortation,
# the mandate, the clause on copies, the penalty clause and the chancery notes.
# Vowel quantities for Inter caetera (1493): 299 forms the shared and intercaetera tables lack.
# Same conventions as lat_quantities_intercaetera.yaml (L&S headword quantities plus endings, j/v,
# + before enclitic -que, chancery e restored to ae/oe in the value, ch and h kept as printed).
# Ambiguous forms are given the case their context requires (causa, gloria, firma, tanta, vestra,
# maxima, regia, licentia, prona, ecclesiastica -> ablative; conatus, actus -> acc pl; gradus,
# status -> gen sg; pena -> poenā; pene -> paene adverb; queque -> quaeque, pronoun, no +).
# Uncertain: bufolinus, mucciarellis, santoseverino, podocatharus (official names, quantities
# guessed from the -inus/-ellus/-inus suffixes or left bare); ortationis (printed without h, value
# ortātiōnis, classical hortātiōnis); obedientie (obēdientiae after L&S obedio, not oboedientiae);
# magnanimitate and cognoscentes (hidden quantity before gn left unmarked, unlike dīgnus in the
# intercaetera table); ecclesiastica(e) (ē from Greek eta, other tables disagree); prout (prōut);
# districtius (short i in strictus); fidei (fideī, not fidēī); lavacri (lavācrum).
