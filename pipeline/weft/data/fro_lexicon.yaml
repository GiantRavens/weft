# Old French lexicon for pipeline/weft/oldfrench.py: the sound of each word as a French reader of
# about 1300 would have said it, keyed by the normalized central-French spelling that the edition
# gives each token in n. Hand-written, approximate.
#
#   fr1300   IPA, the word alone at a pause: syllables divided by dots, ˈ before the stressed
#            syllable of a word of two or more syllables, every written final consonant sounded.
#            The module drops a final s, t or p before a word that begins with a consonant, sounds
#            final s as z before a vowel, and elides a final ə before a vowel.
#
# Values: ch [tʃ], j and g before e/i [dʒ], c before e/i and z [s] (the dental affricate had
# simplified); oi [wɛ]; ai, ei [ɛ]; au, al before a consonant [aw]; ou [u]; eu, ue [ø]; ie [jɛ];
# ui [ɥi]; u [y]; s before a consonant silent, the vowel long (isle ˈiː.lə); an, en [ãn], on [õn],
# ain, ein [ɛ̃n]: the vowel nasal and the n still sounded; ill, ll after i [ʎ]; gn [ɲ]; final e [ə].
# Proper names and Italianisms (da, cum, Zaiton) are given as a French reader would sound the letters.
