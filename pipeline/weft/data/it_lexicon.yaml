# Italian pronunciation lexicon for weft.italian: word form -> marked spelling.
#
# Marks: à è é ì ò ó ù on the stressed vowel (è ò open, é ó closed); ï ü a vowel that would
# otherwise be a glide; ŝ a voiced s [z]; ś an s that stays voiceless between vowels in both
# schemes (an enclitic boundary); ẑ a voiced z [dz]. No mark: unstressed (article, clitic,
# preposition, conjunction).
#
# Stressed e and o follow the Florentine-based standard recorded in B. Migliorini, C. Tagliavini,
# P. Fiorelli, Dizionario d'ortografia e di pronunzia (DOP, 1969; revised online edition),
# checked against the Latin source vowel: Latin short e, o give open è, ò; long e, o and short
# i, u give closed é, ó. Entries marked "# learned" are learned or semi-learned words, where the
# rule does not apply and the DOP is the only guide; they are less certain for 1350 and 1513.
# Voiced s (ŝ) follows the DOP's traditional (Tuscan) pronunciation.
#
# Keys are lower case, with the apostrophe as '. Used by machiavelli-prince,
# petrarch-canzoniere-1 and dante-inferno-1.

