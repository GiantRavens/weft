# Pronunciation lexicon for Weft's German texts (Kant, Nietzsche), keyed by the modern spelling of
# each word form (the token's n field, lowercased). Hand-written.
#
# The value is the modern spelling divided into syllables with dots, by morphemes (ver.stan.des,
# ˈgeis.tes), with ˈ before the stressed syllable. pipeline/weft/german.py turns the letters of each
# syllable into sounds for each scheme. Conventions of the division:
#   - a colon after a vowel marks it long in a closed syllable (ge.ˈmü:t, ˈtrö:s.ten); h after a
#     vowel, a doubled vowel and ie are long without a mark; a stressed open syllable is long
#   - st and sp at the start of a syllable are morpheme-initial ([ʃt], [ʃp]); a medial st inside a
#     morpheme is divided s.t (ˈgeis.tes, ˈwe.nigs.tens)
#   - ng, ck and ch stay in the coda when the vowel before them is short (ˈding.e, ˈblick.en,
#     ˈbech.er); ng there is [ŋ]
# Where the letters do not give the sound (Latin, loans), the entry is a map with syl and an IPA
# form per scheme (northern, modern).
#
# Stress and length follow the Duden Aussprachewörterbuch for the modern scheme; the same stress
# and length are used for the northern scheme. Monosyllables need an entry only when their vowel is
# long in a closed syllable (der, Mut, groß) or when a content word would otherwise be read as an
# unstressed function word. A polysyllable missing here is divided by rule and reported as
# syllables-by-rule.
