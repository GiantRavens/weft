# Pronunciation lexicon for Weft's Spanish texts, keyed by the modern spelling of each word (the
# token's n field, lowercased). Hand-written, one entry per word form.
#
# The value is the word in a normalized spelling of about 1492, one letter per sound, in the manner
# Nebrija recommends; pipeline/weft/spanish.py reads it as IPA for the c1492 scheme:
#   ç, and c before e/i = ts      z = dz        ss = s       single s between vowels = z
#   x = ʃ                         j, and g before e/i = ʒ    h = h (aspirated; written only where
#   the 1490s said it, from Latin f: hallar, hermoso, hazer, hierro, hoja)
#   b = b                         v = β (the period spelling of each word: avía, escrivo, but saber)
#   ll = ʎ                        qu before a/o = kw (quando, qual, quarta)
# Stress follows the modern written rules; an accent marks it where the rules would not
# (á, é for the auxiliaries ha, he; dellas is one word in 1492, two today).
# The modern scheme is computed from n and needs no entry.

