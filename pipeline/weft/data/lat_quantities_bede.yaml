# Latin vowel quantities for Bede, Historia ecclesiastica I.15 (Plummer 1896). Same format as lat_quantities.yaml:
# lowercase form as printed -> the form with macrons on long vowels. Source: Lewis and Short headword quantities plus
# the inflectional ending; proposals from weft quantities, each checked by hand.
# Values write j and v for consonantal i and u, as the Saxo and Res Gestae tables do, and + before an enclitic.
# Plummer's spellings are kept, not classicized (sumsere, consumsit, puplica, interemtos, inpar, conprehensi): they are
# the spellings of the early Northumbrian manuscripts and may be how Bede's house said the words; only macrons are added.
# Hidden quantities: long before ns and nf (īnsula, cōnfestim, cōnferrent, accēnsus, trānsmarīnās), as in the Res Gestae
# table; jūnctus (adjūncta) and the Lachmann's-law lengths (tēxī, ēmptus) as W. S. Allen gives them, from memory. The
# vowel before gn (segnitia, segnius) is left short, the evidence being disputed. Names with no classical quantity keep
# their stems unmarked and take the Latin ending's length. Entries marked "judgment" are not settled by a dictionary.
"incarnatione": "incarnātiōne"
"ccccxlviiii": "quadringentēsimōquadrāgēsimōnōnō"   # judgment: read as the ablative ordinal with anno, one word with one stress, as the Res Gestae table reads its numerals
