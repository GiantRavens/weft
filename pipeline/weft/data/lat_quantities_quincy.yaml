# Vowel quantities for the two charters of Saer de Quincy, merged after lat_quantities.yaml
# (manifest list), for words the shared table lacks.
# Key: lowercase form as printed (contu[li]sse is keyed without the editors' brackets). Value: the
# classical form with macrons on long vowels (Lewis and Short headword quantities plus inflectional
# endings), j and v for consonantal i and u. Where the charters write e for ae (sancte, ecclesie,
# presens, hec, Scotie), ci for ti before a vowel (pertinenciis, donacio, Scocie) or v for vocalic u
# (Vniuersis, vxoris, vt), the value restores the classical spelling, so the classical reading is
# classical; the Anglo-Latin reading says ae as e and ti or ci as tsi either way, which is what the
# spellings record. hiis (classical his) is kept as written, two syllables.
# Medieval words take the quantities of their stems: elemosina (from eleemosyna, with short o and
# i, stress e-le-MO-si-na), warantizare, inposterum (written as one word). nostra stands for both
# the ablative (gask.3) and the nominative (gask.11); the table has one value, unmarked, which
# leaves the stress unchanged. Names (Seherus, Quency, Quinci, Orable, Brackele, Gasc, Duglyn,
# Nesus, Malueisin, Albeinr, Huntingfelde, Roches, Selford, Brebot, Carnane, Burhame, Finelei,
# Salle, Waleram) take no long vowels, so their stress follows the spelling; Latinized names with an
# attested Latin form take its quantities (Henrīcus, Hugō Hugōnis, Milō Milōnis, Jōhannes,
# Andrēas, Marīa, Margarīta, spelled here with the charter's e).
