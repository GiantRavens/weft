# Build the Weft library and publish it to GitHub Pages on every push to main.
#
# The build reads only committed data (generated layers, curated overlays, alignments, notes,
# art). The licensed source files are never in the repository and are not needed here.
# Tests run first; the draft-reproduction checks skip because the sources are absent.
name: Library to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Install Weft
        run: |
          uv venv --python 3.12
          uv pip install -e .
      - name: Test
        run: uv run --with pytest pytest -q tests
      - name: Build the library
        run: .venv/bin/weft build all
      - name: Link-preview images
        # a missing card image is a visible warning on the run, not a reason to hold the library back
        continue-on-error: true
        run: |
          uv pip install -e '.[previews]'
          .venv/bin/python -m playwright install --with-deps chromium-headless-shell
          .venv/bin/weft previews all
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
